<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 630" width="940" height="630" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La misma lentitud de 300 ms, repartida de forma difusa o concentrada: peticiones correctas según la fracción de peticiones lentas</title><desc id="d">Líneas con el porcentaje de peticiones correctas según la fracción de peticiones con 300 milisegundos más de lentitud: sin protección baja de forma gradual hasta 26 por ciento; con reintentos sin pausa se mantiene en 100 hasta 10 por ciento de peticiones lentas y cae a 0 desde 20; con cortacircuitos calibrado la respuesta completa cae a 44 por ciento con 5 y a 12 con 10, y las respuestas completas o con alternativa se mantienen en 100.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="630" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">La misma lentitud de 300 ms, repartida de forma difusa o concentrada: peticiones correctas según la fracción</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">de peticiones lentas</tspan></text><circle cx="22" cy="70" r="6" fill="#946512" stroke="#946512" stroke-width="2"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Sin protección (A)</tspan></text><rect x="199.72" y="64" width="12" height="12" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="219.72" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="219.72" dy="0">Reintentos sin pausa (B)</tspan></text><polygon points="434.68,63.1 441.28,75.4 428.08,75.4" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="448.68" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="448.68" dy="0">Cortacircuitos calibrado (E): respuesta completa</tspan></text><polygon points="22,86.5 29.5,94 22,101.5 14.5,94" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><text x="36" y="99" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Cortacircuitos calibrado (E): completa o alternativa</tspan></text><line x1="78.62" y1="430" x2="910" y2="430" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="430" x2="78.62" y2="430" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="434.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="355" x2="910" y2="355" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="355" x2="78.62" y2="355" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="359.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">25</tspan></text><line x1="78.62" y1="280" x2="910" y2="280" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="280" x2="78.62" y2="280" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="284.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">50</tspan></text><line x1="78.62" y1="205" x2="910" y2="205" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="205" x2="78.62" y2="205" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="209.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">75</tspan></text><line x1="78.62" y1="130" x2="910" y2="130" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="130" x2="78.62" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="134.5" font-size="