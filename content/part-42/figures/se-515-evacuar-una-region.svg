<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 432" width="940" height="432" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Evacuar una región: peticiones correctas en las regiones que sobreviven según el número de regiones y la utilización previa</title><desc id="d">Mapa de calor con el porcentaje de peticiones correctas tras evacuar una región: con dos regiones solo aguanta 40 por ciento de utilización previa; con tres, hasta 55; con cuatro, hasta 55 y falla en parte con 70; con seis aguanta hasta 70; con 85 por ciento de utilización previa ninguna configuración aguanta.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="432" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Evacuar una región: peticiones correctas en las regiones que sobreviven según el número de regiones y la</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">utilización previa</tspan></text><text x="284.75" y="79" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="284.75" dy="0">40 % de utilización</tspan></text><text x="466.25" y="79" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="466.25" dy="0">55 % de utilización</tspan></text><text x="647.75" y="79" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="647.75" dy="0">70 % de utilización</tspan></text><text x="829.25" y="79" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="829.25" dy="0">85 % de utilización</tspan></text><text x="184" y="117.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="184" dy="0">2 regiones</tspan></text><text x="184" y="161.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="184" dy="0">3 regiones</tspan></text><text x="184" y="205.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="184" dy="0">4 regiones</tspan></text><text x="184" y="249.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="184" dy="0">6 regiones</tspan></text><rect x="195.5" y="92.5" width="178.5" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="284.75" y="117.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="284.75" dy="0">100 %</tspan></text><rect x="377" y="92.5" width="178.5" height="41" rx="4" fill="#b2d9d9" stroke="#ffffff" stroke-width="1"/><text x="466.25" y="117.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="466.25" dy="0">21 %</tspan></text><rect x="558.5" y="92.5" width="178.5" height="41" rx="4" fill="#cde8e6" stroke="#ffffff" stroke-width="1"/><text x="647.75" y="117.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="647.75" dy="0">8 %</tspan></text><rect x="740" y="92.5" width="178.5" height="41" rx="4" fill="#d4ebe9" stroke="#ffffff" stroke-width="1"/><text x="829.25" y="117.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="829.25" dy="0">5 %</tspan></text><rect x="195.5" y="136.5" width="178.5" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="284.75" y="161.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="284.75" dy="0">100 %</tspan></text><rect x="377" y="136.5" width="178.5" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="466.25" y="161.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="466.25" dy="0">100 %</tspan></text><rect x="558.5" y="136.5" width="178.5" height="41" rx="4" fill="#99ccce" stroke="#ffffff" stroke-width="1"/><text x="647.75" y="161.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="647.75" dy="0">32 %</tspan></text><rect x="740" y="136.5" width="178.5" height="41" rx="4" fill="#c3e2e1" stroke="#ffffff" stroke-width="1"/><text x="829.25" y="161.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="829.25" dy="0">13 %</tspan></text><rect x="195.5" y="180.5" width="178.5" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="284.75" y="205.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="284.75" dy="0">100 %</tspan></text><rect x="377" y="180.5" width="178.5" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="466.25" y="205.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="466.25" dy="0">100 %</tspan></text><rect x="558.5" y="180.5" width="178.5" height="41" rx="4" fill="#449fa7" stroke="#ffffff" stroke-width="1"/><text x="647.75" y="205.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="647.75" dy="0">72 %</tspan></text><rect x="740" y="180.5" width="178.5" height="41" rx="4" fill="#b8dcdc" stroke="#ffffff" stroke-width="1"/><text x="829.25" y="205.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="829.25" dy="0">18 %</tspan></text><rect x="195.5" y="224.5" width="178.5" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="284.75" y="249.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="284.75" dy="0">100 %</tspan></text><rect x="377" y="224.5" width="178.5" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="466.25" y="249.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="466.25" dy="0">100 %</tspan></text><rect x="558.5" y="224.5" width="178.5" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="647.75" y="249.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="647.75" dy="0">100 %</tspan></text><rect x="740" y="224.5" width="178.5" height="41" rx="4" fill="#8fc7ca" stroke="#ffffff" stroke-width="1"/><text x="829.25" y="249.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="829.25" dy="0">37 %</tspan></text><text x="194" y="293" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="194" dy="0">0 %</tspan></text><rect x="224.62" y="281" width="30.5" height="14" fill="#dff1ee"/><rect x="254.62" y="281" width="30.5" height="14" fill="#c0e1e0"/><rect x="284.62" y="281" width="30.5" height="14" fill="#a2d0d2"/><rect x="314.62" y="281" width="30.5" height="14" fill="#83c0c4"/><rect x="344.62" y="281" width="30.5" height="14" fill="#64b0b6"/><rect x="374.62" y="281" width="30.5" height="14" fill="#45a0a8"/><rect x="404.62" y="281" width="30.5" height="14" fill="#278f9a"/><rect x="434.62" y="281" width="30.5" height="14" fill="#087f8c"/><text x="472.62" y="293" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="472.62" dy="0">100 %</tspan></text><text x="518.32" y="293" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="518.32" dy="0">más oscuro = mayor (Peticiones correctas (%))</tspan></text><rect x="10" y="309" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="333.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">La carga que absorben las demás es u·R/(R−1): con dos regiones se duplica y con seis sube 20 %. Sobre 100 % de utilización</tspan></text><text x="470" y="350.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">la cola crece sin límite y las esperas agotadas lo agravan. Evacuar una región sin saber esto es una caída causada por uno</tspan></text><text x="470" y="367.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">mismo. La capacidad de 200 peticiones por segundo por región y las repeticiones de 60 s son supuestos del autor.</tspan></text><text x="470" y="414.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
