<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ciclo de un programa de experimentos: cada vuelta deja evidencia y cada hallazgo vuelve como prueba de regresión</title><desc id="d">Diagrama circular de seis pasos: elegir una hipótesis a partir de un riesgo, especificar el experimento y validarlo, ejecutar con aborto y comparación, registrar la evidencia con huella, corregir lo hallado, y repetir el experimento como regresión automatizada que alimenta la siguiente hipótesis.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="400" fill="#ffffff"/><rect x="30" y="30" width="280" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="170" y="73.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="170" dy="0">Riesgo → hipótesis falsable</tspan></text><rect x="330" y="30" width="280" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="64.96" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="470" dy="0">Especificación validada y</tspan></text><text x="470" y="82.88" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="470" dy="0">aprobada</tspan></text><rect x="630" y="30" width="280" height="80" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="770" y="73.92" font-size="14" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="770" dy="0">Ejecución con aborto y control</tspan></text><rect x="630" y="230" width="280" height="80" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="770" y="273.92" font-size="14" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="770" dy="0">Evidencia con huella reproducible</tspan></text><rect x="330" y="230" width="280" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="273.92" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="470" dy="0">Corrección del hallazgo</tspan></text><rect x="30" y="230" width="280" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="170" y="273.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="170" dy="0">Regresión automatizada</tspan></text><polyline points="310,70 330,70" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="610,70 630,70" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="770,110 770,230" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="630,270 610,270" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="330,270 310,270" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="170,230 170,110" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="184" y="176" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="184" dy="0">nuevo riesgo</tspan></text><rect x="10" y="340" width="920" height="50" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="470" y="360.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="470" dy="0">Un programa es el conjunto de estos ciclos con dueños, calendario y presupuesto; un experimento aislado solo es una</tspan></text><text x="470" y="376.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="470" dy="0">demostración.</tspan></text></svg>
