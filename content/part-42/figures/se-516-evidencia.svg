<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 471" width="990" height="471" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Evidencia que el proyecto reutiliza de cada clase de la parte</title><desc id="d">Tabla con seis criterios del proyecto y la evidencia medida que cada uno reutiliza: elegir el patrón usa la comparación de workflow y agente de la clase 505; limitar el contexto usa la memoria versionada de la 509; recuperar con respaldo usa BM25 y abstención de la 510; no repetir efectos usa el diario con clave de la 512; decidir con evidencia usa la puerta con 400 casos de la 513; y contener el daño usa el resultado sin canal de salida de la 514.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="990" height="471" fill="#ffffff"/><rect x="10" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="132" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="132" dy="0">Criterio del proyecto</tspan></text><rect x="260" y="12" width="594" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="557" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="557" dy="0">Evidencia que se reutiliza</tspan></text><rect x="860" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="917" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="917" dy="0">Clase</tspan></text><rect x="10" y="56" width="244" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Elegir el patrón</tspan></text><rect x="260" y="56" width="594" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="84.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">Workflow fijo frente a agente por tipo de solicitud</tspan></text><rect x="860" y="56" width="114" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="917" y="84.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="917" dy="0">SE-505</tspan></text><rect x="10" y="112" width="244" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="140.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Limitar el contexto</tspan></text><rect x="260" y="112" width="594" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="140.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">Memoria versionada: 95,2 % frente a 40,8 %</tspan></text><rect x="860" y="112" width="114" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="917" y="140.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="917" dy="0">SE-509</tspan></text><rect x="10" y="168" width="244" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="196.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Recuperar con respaldo</tspan></text><rect x="260" y="168" width="594" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="196.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">BM25 y abstención con umbral</tspan></text><rect x="860" y="168" width="114" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="917" y="196.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="917" dy="0">SE-510</tspan></text><rect x="10" y="224" width="244" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="252.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">No repetir efectos</tspan></text><rect x="260" y="224" width="594" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="252.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">Envíos tras caída: 1 con diario y clave</tspan></text><rect x="860" y="224" width="114" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="917" y="252.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="917" dy="0">SE-512</tspan></text><rect x="10" y="280" width="244" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="308.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Decidir con evidencia</tspan></text><rect x="260" y="280" width="594" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="308.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">Puerta con 400 casos o más para mejoras de 4 puntos</tspan></text><rect x="860" y="280" width="114" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="917" y="308.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="917" dy="0">SE-513</tspan></text><rect x="10" y="336" width="244" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="364.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Contener el daño</tspan></text><rect x="260" y="336" width="594" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="364.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">0,00 % de ataques sin canal de salida</tspan></text><rect x="860" y="336" width="114" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="917" y="364.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="917" dy="0">SE-514</tspan></text><rect x="10" y="396" width="970" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="495" y="420.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="495" dy="0">Cómo leer la figura: el proyecto no inventa medidas, recompone las de la parte con su caso. Dónde deja de valer: cada medida vale</tspan></text><text x="495" y="437.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="495" dy="0">para el experimento que la produjo; recomponerlas no prueba que el sistema completo las conserve.</tspan></text></svg>
