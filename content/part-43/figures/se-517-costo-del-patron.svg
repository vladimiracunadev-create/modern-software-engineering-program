<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 355" width="980" height="355" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Strategy frente a if/elif: tamaño y complejidad crecen distinto con el número de variantes</title><desc id="d">Tabla con el tamaño en nodos de sintaxis y la complejidad ciclomática máxima de una función de tarifas escrita como cadena if y elif y como Strategy con registro: con 2 variantes son 41 y 85 nodos, con 4 son 71 y 125, con 8 son 131 y 205 y con 12 son 191 y 285; la complejidad máxima por función crece de 3 a 13 con if y elif y se mantiene en 2 con Strategy.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="355" fill="#ffffff"/><rect x="10" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="82" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="82" dy="0">Variantes</tspan></text><rect x="160" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="252" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="252" dy="0">Nodos if/elif</tspan></text><rect x="350" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="452" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="452" dy="0">Nodos Strategy</tspan></text><rect x="560" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="657" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="657" dy="0">CC máx. if/elif</tspan></text><rect x="760" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="862" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="862" dy="0">CC máx. Strategy</tspan></text><rect x="10" y="56" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">2</tspan></text><rect x="160" y="56" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="252" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="252" dy="0">41</tspan></text><rect x="350" y="56" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">85</tspan></text><rect x="560" y="56" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="657" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="657" dy="0">3</tspan></text><rect x="760" y="56" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">2</tspan></text><rect x="10" y="106" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">4</tspan></text><rect x="160" y="106" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="252" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="252" dy="0">71</tspan></text><rect x="350" y="106" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">125</tspan></text><rect x="560" y="106" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="657" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="657" dy="0">5</tspan></text><rect x="760" y="106" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">2</tspan></text><rect x="10" y="156" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">8</tspan></text><rect x="160" y="156" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="252" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="252" dy="0">131</tspan></text><rect x="350" y="156" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">205</tspan></text><rect x="560" y="156" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="657" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="657" dy="0">9</tspan></text><rect x="760" y="156" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">2</tspan></text><rect x="10" y="206" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">12</tspan></text><rect x="160" y="206" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="252" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="252" dy="0">191</tspan></text><rect x="350" y="206" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">285</tspan></text><rect x="560" y="206" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="657" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="657" dy="0">13</tspan></text><rect x="760" y="206" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">2</tspan></text><rect x="10" y="260" width="960" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="490" y="284.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">El patrón cuesta más código en todos los tamaños probados (de 1,6 a 2,1 veces los nodos) y mantiene plana la complejidad de cada</tspan></text><text x="490" y="301.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">función. Añadir la quinta variante cambia una función existente con if/elif y ninguna con Strategy.</tspan></text><text x="490" y="341.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Código ejecutado de verdad (CPython 3.12, Windows 11); los recuentos son deterministas y los tiempos varían de equipo en equipo.</tspan></text></svg>
