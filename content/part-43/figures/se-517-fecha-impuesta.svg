<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 335" width="940" height="335" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Probabilidad de terminar a tiempo una adaptación obligatoria de mediana cuatro meses, según el margen</title><desc id="d">Barras con la probabilidad de terminar a tiempo una adaptación obligatoria cuya duración mediana es de cuatro meses según el margen disponible: 24,6 por ciento con tres meses, 44,0 con cuatro, 71,6 con seis, 85,3 con ocho y 95,6 con doce.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="335" fill="#ffffff"/><text x="190" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="190" dy="0">3 meses</tspan></text><rect x="200" y="16" width="147.6" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="355.6" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="355.6" dy="0">24,6 %</tspan></text><text x="190" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="190" dy="0">4 meses (mediana)</tspan></text><rect x="200" y="60" width="264" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="472" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="472" dy="0">44,0 %</tspan></text><text x="190" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="190" dy="0">6 meses</tspan></text><rect x="200" y="104" width="429.6" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="637.6" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="637.6" dy="0">71,6 %</tspan></text><text x="190" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="190" dy="0">8 meses</tspan></text><rect x="200" y="148" width="511.8" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="719.8" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="719.8" dy="0">85,3 %</tspan></text><text x="190" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="190" dy="0">12 meses</tspan></text><rect x="200" y="192" width="573.6" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="781.6" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="781.6" dy="0">95,6 %</tspan></text><rect x="10" y="240" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Empezar con un margen igual a la mediana llega a tiempo menos de la mitad de las veces. La duración (mediana 4 meses,</tspan></text><text x="470" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">dispersión 0,5, 15 % de dependencias ocultas que la duplican) es un supuesto del autor.</tspan></text><text x="470" y="321.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
