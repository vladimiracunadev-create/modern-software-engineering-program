<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 414" width="980" height="414" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué aporta un catálogo de patrones y cómo se estropea</title><desc id="d">Tabla con cuatro aportes de un catálogo de patrones, vocabulario común, solución probada, evaluación del diseño y enseñanza, y para cada uno el modo en que se estropea cuando se usa sin la fuerza que lo justifica.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="414" fill="#ffffff"/><rect x="10" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="112" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="112" dy="0">Aporte</tspan></text><rect x="220" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="407" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="407" dy="0">Cuando funciona</tspan></text><rect x="600" y="12" width="364" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="782" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="782" dy="0">Cómo se estropea</tspan></text><rect x="10" y="56" width="204" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="89.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">Vocabulario común</tspan></text><rect x="220" y="56" width="374" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="407" y="81.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="407" dy="0">Decir «es un Decorator» condensa una estructura</tspan></text><text x="407" y="97.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="407" dy="0">conocida</tspan></text><rect x="600" y="56" width="364" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="89.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">Se usa el nombre sin que la estructura exista</tspan></text><rect x="10" y="122" width="204" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="155.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">Solución probada</tspan></text><rect x="220" y="122" width="374" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="407" y="155.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="407" dy="0">Resuelve un problema recurrente en un contexto</tspan></text><rect x="600" y="122" width="364" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="155.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">El contexto cambió y la solución se copió igual</tspan></text><rect x="10" y="188" width="204" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="221.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">Evaluación del diseño</tspan></text><rect x="220" y="188" width="374" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="407" y="221.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="407" dy="0">Da criterios para discutir alternativas</tspan></text><rect x="600" y="188" width="364" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="213.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">Se convierte en lista de verificación sin</tspan></text><text x="782" y="229.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">fuerza</tspan></text><rect x="10" y="254" width="204" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="287.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">Enseñanza</tspan></text><rect x="220" y="254" width="374" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="407" y="287.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="407" dy="0">Permite entrar a un código ajeno más rápido</tspan></text><rect x="600" y="254" width="364" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="287.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">Se ve patrón donde hay un nombre de clase</tspan></text><rect x="10" y="324" width="960" height="54" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="490" y="354.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">La tabla resume el argumento de la clase; la evidencia medida está en la figura anterior y en las siguientes clases de la parte.</tspan></text><text x="490" y="400" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Código ejecutado de verdad (CPython 3.12, Windows 11); los recuentos son deterministas y los tiempos varían de equipo en equipo.</tspan></text></svg>
