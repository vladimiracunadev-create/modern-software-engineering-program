<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 378" width="940" height="378" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dos técnicas para encontrar código muerto en un módulo de 60 funciones con 20 realmente muertas</title><desc id="d">Barras apiladas horizontales con los candidatos de cada técnica: el análisis por nombre propone 45, 20 muertas y 25 falsas alarmas; la traza de una ejecución propone 25, 20 muertas y 5 falsas alarmas; la coincidencia de ambas propone exactamente las 20 muertas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="378" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dos técnicas para encontrar código muerto en un módulo de 60 funciones con 20 realmente muertas</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Muertas halladas</tspan></text><rect x="184.64" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="204.64" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="204.64" dy="0">Falsas alarmas</tspan></text><line x1="224" y1="77" x2="224" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="224" y1="197" x2="224" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="224" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="224" dy="0">0</tspan></text><line x1="354.34" y1="77" x2="354.34" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="354.34" y1="197" x2="354.34" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="354.34" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354.34" dy="0">10</tspan></text><line x1="484.68" y1="77" x2="484.68" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="484.68" y1="197" x2="484.68" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="484.68" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="484.68" dy="0">20</tspan></text><line x1="615.02" y1="77" x2="615.02" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="615.02" y1="197" x2="615.02" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="615.02" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="615.02" dy="0">30</tspan></text><line x1="745.36" y1="77" x2="745.36" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="745.36" y1="197" x2="745.36" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="745.36" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="745.36" dy="0">40</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="197" x2="875.7" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">50</tspan></text><line x1="224" y1="197" x2="875.7" y2="197" stroke="#5b7280" stroke-width="1.6"/><text x="214" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="214" dy="0">Análisis por nombre (ast)</tspan></text><text x="214" y="141.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="214" dy="0">Traza de una ejecución</tspan></text><text x="214" y="181.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="214" dy="0">Coinciden las dos</tspan></text><rect x="224" y="84" width="260.68" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="354.34" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="354.34" dy="0">20</tspan></text><rect x="484.68" y="84" width="325.85" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="647.605" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="647.605" dy="0">25</tspan></text><text x="817.53" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="817.53" dy="0">45</tspan></text><rect x="224" y="124" width="260.68" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="354.34" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="354.34" dy="0">20</tspan></text><rect x="484.68" y="124" width="65.17" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="517.265" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="517.265" dy="0">5</tspan></text><text x="556.85" y="141.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="556.85" dy="0">25</tspan></text><rect x="224" y="164" width="260.68" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="354.34" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="354.34" dy="0">20</tspan></text><rect x="484.68" y="164" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="491.68" y="181.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="491.68" dy="0">20</tspan></text><text x="549.85" y="241" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="549.85" dy="0">Candidatos propuestos</tspan></text><rect x="10" y="255" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="279.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cada técnica se equivoca por una razón distinta: el análisis por nombre falla con 15 llamadas por cadena y 10 funciones</tspan></text><text x="470" y="296.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">registradas, y la traza con una rama poco frecuente. La coincidencia deja cero falsas alarmas solo porque en este módulo</tspan></text><text x="470" y="313.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ningún uso dinámico estaba en una rama poco frecuente; una llamada por cadena en esa rama habría engañado a las dos.</tspan></text><text x="470" y="360.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
