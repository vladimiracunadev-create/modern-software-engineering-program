<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 465" width="980" height="465" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cinco patrones estructurales y el hecho medido de cada uno</title><desc id="d">Tabla con cinco patrones estructurales y un hecho medido de cada uno: el Adapter unifica dos proveedores en la misma forma, la Facade reduce siete llamadas del cliente a una, el Proxy perezoso construye 37 objetos para 1000 proxies cuando solo se usan 37, el Composite con un ciclo produce la lista correcta con una guarda de visitados y un error de recursión sin ella, y el orden de apilado de los Decorator cambia la política.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="465" fill="#ffffff"/><rect x="10" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="92" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="92" dy="0">Patrón</tspan></text><rect x="180" y="12" width="334" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="347" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="347" dy="0">Fuerza</tspan></text><rect x="520" y="12" width="444" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="742" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="742" dy="0">Hecho medido</tspan></text><rect x="10" y="56" width="164" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="92" y="87.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="92" dy="0">Adapter</tspan></text><rect x="180" y="56" width="334" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="347" y="87.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="347" dy="0">Dos proveedores con formas distintas</tspan></text><rect x="520" y="56" width="444" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="87.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">Ambos devuelven (id, aceptado) tras la adaptación</tspan></text><rect x="10" y="118" width="164" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="92" y="149.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="92" dy="0">Facade</tspan></text><rect x="180" y="118" width="334" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="347" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="347" dy="0">Cliente que coordina subsistemas</tspan></text><rect x="520" y="118" width="444" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">7 llamadas del cliente pasan a 1</tspan></text><rect x="10" y="180" width="164" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="92" y="211.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="92" dy="0">Proxy</tspan></text><rect x="180" y="180" width="334" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="347" y="211.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="347" dy="0">Objeto costoso que no siempre se usa</tspan></text><rect x="520" y="180" width="444" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="211.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">1000 proxies, 37 usos, 37 objetos construidos</tspan></text><rect x="10" y="242" width="164" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="92" y="273.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="92" dy="0">Composite</tspan></text><rect x="180" y="242" width="334" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="347" y="273.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="347" dy="0">Grupos que contienen grupos</tspan></text><rect x="520" y="242" width="444" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="265.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">Con ciclo: lista correcta con guarda; RecursionError sin</tspan></text><text x="742" y="281.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">ella</tspan></text><rect x="10" y="304" width="164" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="92" y="335.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="92" dy="0">Decorator</tspan></text><rect x="180" y="304" width="334" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="347" y="335.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="347" dy="0">Añadir comportamiento sin tocar el objeto</tspan></text><rect x="520" y="304" width="444" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="335.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">El orden de apilado cambia la política</tspan></text><rect x="10" y="370" width="960" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="490" y="394.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">Los cinco comparten una forma (un objeto que envuelve o contiene a otro con la misma interfaz) y se distinguen por la intención:</tspan></text><text x="490" y="411.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">adaptar, simplificar, controlar el acceso, componer o añadir.</tspan></text><text x="490" y="451.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Código ejecutado de verdad (CPython 3.12, Windows 11); los recuentos son deterministas y los tiempos varían de equipo en equipo.</tspan></text></svg>
