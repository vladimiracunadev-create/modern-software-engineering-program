<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 642" width="940" height="642" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Entradas para caracterizar nota_final: líneas cubiertas (de 18) y mutantes detectados (de 12)</title><desc id="d">Barras horizontales con el porcentaje de líneas cubiertas, de 18, y de mutantes detectados, de 12, por seis conjuntos de entradas: cinco ejemplos de la documentación 89 y 33 por ciento, 100 entradas aleatorias 89 y 75, 1 000 entradas aleatorias 100 y 100 y 14 casos de borde 94 y 75.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="642" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Entradas para caracterizar nota_final: líneas cubiertas (de 18) y mutantes detectados (de 12)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Líneas cubiertas</tspan></text><rect x="184.64" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="204.64" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="204.64" dy="0">Mutantes detectados</tspan></text><line x1="274" y1="77" x2="274" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="461" x2="274" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0</tspan></text><line x1="424.425" y1="77" x2="424.425" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="424.425" y1="461" x2="424.425" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="424.425" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="424.425" dy="0">25</tspan></text><line x1="574.85" y1="77" x2="574.85" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="574.85" y1="461" x2="574.85" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="574.85" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="574.85" dy="0">50</tspan></text><line x1="725.275" y1="77" x2="725.275" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="725.275" y1="461" x2="725.275" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="725.275" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="725.275" dy="0">75</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="461" x2="875.7" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">100</tspan></text><line x1="274" y1="461" x2="875.7" y2="461" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="113.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">5 ejemplos de la documentación</tspan></text><text x="264" y="177.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">5 entradas aleatorias</tspan></text><text x="264" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">20 entradas aleatorias</tspan></text><text x="264" y="305.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">100 entradas aleatorias</tspan></text><text x="264" y="369.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">1 000 entradas aleatorias</tspan></text><text x="264" y="433.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">14 casos de borde elegidos a mano</tspan></text><rect x="274" y="83" width="535.513" height="24.5" rx="3" fill="#946512"/><text x="816.513" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="816.513" dy="0">89 %</tspan></text><rect x="274" y="110.5" width="198.561" height="24.5" rx="3" fill="#087f8c"/><text x="479.561" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="479.561" dy="0">33 %</tspan></text><rect x="274" y="147" width="499.411" height="24.5" rx="3" fill="#946512"/><text x="780.411" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="780.411" dy="0">83 %</tspan></text><rect x="274" y="174.5" width="300.85" height="24.5" rx="3" fill="#087f8c"/><text x="581.85" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="581.85" dy="0">50 %</tspan></text><rect x="274" y="211" width="535.513" height="24.5" rx="3" fill="#946512"/><text x="816.513" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="816.513" dy="0">89 %</tspan></text><rect x="274" y="238.5" width="451.275" height="24.5" rx="3" fill="#087f8c"/><text x="732.275" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="732.275" dy="0">75 %</tspan></text><rect x="274" y="275" width="535.513" height="24.5" rx="3" fill="#946512"/><text x="816.513" y="291.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="816.513" dy="0">89 %</tspan></text><rect x="274" y="302.5" width="451.275" height="24.5" rx="3" fill="#087f8c"/><text x="732.275" y="319.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="732.275" dy="0">75 %</tspan></text><rect x="274" y="339" width="601.7" height="24.5" rx="3" fill="#946512"/><text x="882.7" y="355.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100 %</tspan></text><rect x="274" y="366.5" width="601.7" height="24.5" rx="3" fill="#087f8c"/><text x="882.7" y="383.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100 %</tspan></text><rect x="274" y="403" width="565.598" height="24.5" rx="3" fill="#946512"/><text x="846.598" y="419.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="846.598" dy="0">94 %</tspan></text><rect x="274" y="430.5" width="451.275" height="24.5" rx="3" fill="#087f8c"/><text x="732.275" y="447.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="732.275" dy="0">75 %</tspan></text><text x="574.85" y="505" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="574.85" dy="0">% del total (16 de 18 líneas = 89 %, 4 de 12 mutantes = 33 %)</tspan></text><rect x="10" y="519" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="543.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La cobertura de líneas no sube entre 20 y 100 entradas y los mutantes tampoco; los casos de borde cubren el 94 % y dejan</tspan></text><text x="470" y="560.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">vivos tres mutantes que mil entradas aleatorias matan. La función y los doce mutantes son del autor y se escribieron</tspan></text><text x="470" y="577.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">sabiendo qué buscaban.</tspan></text><text x="470" y="624.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
