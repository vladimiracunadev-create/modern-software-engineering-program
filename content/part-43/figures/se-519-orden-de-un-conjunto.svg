<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 490" width="940" height="490" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El mismo programa con seis alumnos en un conjunto, en ocho procesos con semilla de hash distinta</title><desc id="d">Diagrama de flujo de ocho procesos del mismo programa con seis alumnos en un conjunto: cada semilla de hash da un orden distinto y por tanto una salida distinta, ocho en total; ordenar antes de escribir da una sola salida para los ocho procesos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="490" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">El mismo programa con seis alumnos en un conjunto, en ocho procesos con semilla de hash distinta</tspan></text><text x="134" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="134" dy="0">Proceso</tspan></text><text x="488" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="488" dy="0">Orden en que el conjunto entrega los nombres</tspan></text><text x="817" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="817" dy="0">Salida</tspan></text><rect x="14" y="71" width="240" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="134" y="97.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="134" dy="0">Semilla de hash 1</tspan></text><polyline points="258,94 284,94" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="288" y="71" width="400" height="46" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="488" y="97.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="488" dy="0">pedro, marta, sofia, tomas, luis, ana</tspan></text><polyline points="692,94 718,94" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="722" y="71" width="190" height="46" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="817" y="97.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="817" dy="0">Una salida</tspan></text><rect x="14" y="129" width="240" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="134" y="155.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="134" dy="0">Semilla de hash 2</tspan></text><polyline points="258,152 284,152" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="288" y="129" width="400" height="46" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="488" y="155.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="488" dy="0">pedro, marta, tomas, ana, sofia, luis</tspan></text><polyline points="692,152 718,152" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="722" y="129" width="190" height="46" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="817" y="155.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="817" dy="0">Otra salida</tspan></text><rect x="14" y="187" width="240" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="134" y="213.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="134" dy="0">Semilla de hash 3</tspan></text><polyline points="258,210 284,210" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="288" y="187" width="400" height="46" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="488" y="213.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="488" dy="0">luis, pedro, tomas, sofia, ana, marta</tspan></text><polyline points="692,210 718,210" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="722" y="187" width="190" height="46" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="817" y="213.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="817" dy="0">Otra salida más</tspan></text><rect x="14" y="245" width="240" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="134" y="271.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="134" dy="0">Las ocho semillas</tspan></text><polyline points="258,268 284,268" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="288" y="245" width="400" height="46" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="488" y="271.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="488" dy="0">Ocho órdenes del mismo conjunto</tspan></text><polyline points="692,268 718,268" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="722" y="245" width="190" height="46" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="817" y="271.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="817" dy="0">8 salidas distintas</tspan></text><rect x="14" y="303" width="240" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="134" y="329.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="134" dy="0">Ordenando antes de escribir</tspan></text><polyline points="258,326 284,326" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="288" y="303" width="400" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="488" y="329.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="488" dy="0">El mismo orden en los ocho procesos</tspan></text><polyline points="692,326 718,326" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="722" y="303" width="190" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="817" y="329.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="817" dy="0">1 salida</tspan></text><rect x="10" y="367" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="391.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Un maestro dorado que compare el texto completo falla entre procesos aunque el código sea idéntico. Ordenar elimina la</tspan></text><text x="470" y="408.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">variación solo si el contrato no exige otro orden. El orden de los conjuntos de cadenas depende del intérprete y de su</tspan></text><text x="470" y="425.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">versión.</tspan></text><text x="470" y="472.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
