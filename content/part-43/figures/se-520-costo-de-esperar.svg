<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 573" width="940" height="573" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Esfuerzo total de actualizar una dependencia con 12 % de versiones incompatibles en 48 versiones (2 000 historias)</title><desc id="d">Intervalos con la mediana y el percentil 90 del esfuerzo total según la cadencia de actualización: cada versión 12,6 y 18,9 horas, cada 4 versiones 14,4 y 23,0, cada 12 versiones 21,1 y 35,5 y una sola vez a las 48 versiones 71,4 y 134,6.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="573" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Esfuerzo total de actualizar una dependencia con 12 % de versiones incompatibles en 48 versiones (2 000</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">historias)</tspan></text><rect x="16" y="64" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">mediana</tspan></text><polygon points="122.78,63.1 129.38,75.4 116.18,75.4" fill="#946512" stroke="#946512" stroke-width="2"/><text x="136.78" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="136.78" dy="0">p90</tspan></text><line x1="214" y1="96" x2="214" y2="392" stroke="#d5dde1" stroke-width="1"/><line x1="214" y1="392" x2="214" y2="397" stroke="#5b7280" stroke-width="1.4"/><text x="214" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="214" dy="0">0</tspan></text><line x1="439.333" y1="96" x2="439.333" y2="392" stroke="#d5dde1" stroke-width="1"/><line x1="439.333" y1="392" x2="439.333" y2="397" stroke="#5b7280" stroke-width="1.4"/><text x="439.333" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="439.333" dy="0">50</tspan></text><line x1="664.667" y1="96" x2="664.667" y2="392" stroke="#d5dde1" stroke-width="1"/><line x1="664.667" y1="392" x2="664.667" y2="397" stroke="#5b7280" stroke-width="1.4"/><text x="664.667" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="664.667" dy="0">100</tspan></text><line x1="890" y1="96" x2="890" y2="392" stroke="#d5dde1" stroke-width="1"/><line x1="890" y1="392" x2="890" y2="397" stroke="#5b7280" stroke-width="1.4"/><text x="890" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="890" dy="0">150</tspan></text><line x1="214" y1="392" x2="890" y2="392" stroke="#5b7280" stroke-width="1.6"/><text x="184" y="137.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="184" dy="0">Cada versión</tspan></text><text x="184" y="211.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="184" dy="0">Cada 4 versiones</tspan></text><text x="184" y="285.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="184" dy="0">Cada 12 versiones</tspan></text><text x="184" y="359.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="184" dy="0">Una vez a las 48</tspan></text><line x1="270.784" y1="133" x2="299.176" y2="133" stroke="#8a9aa3" stroke-width="5"/><rect x="263.784" y="126" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="270.784" y="117" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="270.784" dy="0">12,6</tspan></text><polygon points="299.176,124.95 306.876,139.3 291.476,139.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="299.176" y="162" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="299.176" dy="0">18,9</tspan></text><line x1="278.896" y1="207" x2="317.653" y2="207" stroke="#8a9aa3" stroke-width="5"/><rect x="271.896" y="200" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="278.896" y="191" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="278.896" dy="0">14,4</tspan></text><polygon points="317.653,198.95 325.353,213.3 309.953,213.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="317.653" y="236" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="317.653" dy="0">23</tspan></text><line x1="309.091" y1="281" x2="373.987" y2="281" stroke="#8a9aa3" stroke-width="5"/><rect x="302.091" y="274" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="309.091" y="265" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="309.091" dy="0">21,1</tspan></text><polygon points="373.987,272.95 381.687,287.3 366.287,287.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="373.987" y="310" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="373.987" dy="0">35,5</tspan></text><line x1="535.776" y1="355" x2="820.597" y2="355" stroke="#8a9aa3" stroke-width="5"/><rect x="528.776" y="348" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="535.776" y="339" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="535.776" dy="0">71,4</tspan></text><polygon points="820.597,346.95 828.297,361.3 812.897,361.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="820.597" y="384" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="820.597" dy="0">134,6</tspan></text><text x="552" y="436" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="552" dy="0">Esfuerzo total (horas)</tspan></text><rect x="10" y="450" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="474.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El número de cambios incompatibles es el mismo en las cuatro cadencias; lo que cambia es cuántos se juntan en un salto: la</tspan></text><text x="470" y="491.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">mayor actualización cuesta 2,1, 5,5, 12,5 y 71,4 horas de mediana. Actualizar una sola vez cuesta 5,7 veces más que en cada</tspan></text><text x="470" y="508.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">versión. El 12 %, el 15 % de interacción y el 5 % de mezcla de causas son supuestos del autor.</tspan></text><text x="470" y="555.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
