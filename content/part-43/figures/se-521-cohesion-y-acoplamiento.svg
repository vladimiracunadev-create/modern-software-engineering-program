<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 371" width="980" height="371" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cohesión medida con ast: pares de métodos que no comparten ningún atributo</title><desc id="d">Tabla con la cohesión medida con análisis de sintaxis: una clase de servicio con diez métodos y ocho dependencias en el constructor tiene 37 de 45 pares de métodos que no comparten ningún atributo, y al separarla en tres clases, Registro, Notificador y Migración, ningún par queda sin compartir estado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="371" fill="#ffffff"/><rect x="10" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Clase</tspan></text><rect x="390" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="462" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="462" dy="0">Métodos</tspan></text><rect x="540" y="12" width="174" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="627" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="627" dy="0">Dependencias</tspan></text><rect x="720" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="842" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="842" dy="0">Pares sin estado compartido</tspan></text><rect x="10" y="56" width="374" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="83.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Servicio con 10 métodos y 8 dependencias</tspan></text><rect x="390" y="56" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">10</tspan></text><rect x="540" y="56" width="174" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="627" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="627" dy="0">8</tspan></text><rect x="720" y="56" width="244" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">37 de 45</tspan></text><rect x="10" y="110" width="374" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="137.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Registro (después de separar)</tspan></text><rect x="390" y="110" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">2</tspan></text><rect x="540" y="110" width="174" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="627" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="627" dy="0">1</tspan></text><rect x="720" y="110" width="244" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">0 de 1</tspan></text><rect x="10" y="164" width="374" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="191.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Notificador (después de separar)</tspan></text><rect x="390" y="164" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">2</tspan></text><rect x="540" y="164" width="174" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="627" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="627" dy="0">3</tspan></text><rect x="720" y="164" width="244" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">0 de 1</tspan></text><rect x="10" y="218" width="374" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="245.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Migración (después de separar)</tspan></text><rect x="390" y="218" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">3</tspan></text><rect x="540" y="218" width="174" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="627" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="627" dy="0">1</tspan></text><rect x="720" y="218" width="244" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">0 de 3</tspan></text><rect x="10" y="276" width="960" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="490" y="300.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">Pares de métodos que no comparten atributos es una aproximación a la falta de cohesión (LCOM). Es una señal, no una sentencia:</tspan></text><text x="490" y="317.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">dos métodos pueden estar cohesionados por el dominio sin tocar el mismo atributo.</tspan></text><text x="490" y="357.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Código ejecutado de verdad (CPython 3.12, Windows 11); los recuentos son deterministas y los tiempos varían de equipo en equipo.</tspan></text></svg>
