<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 542" width="940" height="542" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Comparación en sombra: peticiones necesarias para detectar una diferencia según su tasa</title><desc id="d">Línea en escala logarítmica con las peticiones que hacen falta para detectar una diferencia en comparación en sombra: 299 para el uno por ciento, 2 995 para el 0,1 y 29 956 para el 0,01, de modo que el tamaño de muestra crece como 3 dividido por la tasa.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="542" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Comparación en sombra: peticiones necesarias para detectar una diferencia según su tasa</tspan></text><line x1="108.78" y1="359" x2="910" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="359" x2="108.78" y2="359" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="363.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">100</tspan></text><line x1="108.78" y1="259" x2="910" y2="259" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="259" x2="108.78" y2="259" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="263.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">1 000</tspan></text><line x1="108.78" y1="159" x2="910" y2="159" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="159" x2="108.78" y2="159" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="163.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">10 000</tspan></text><line x1="108.78" y1="59" x2="910" y2="59" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="59" x2="108.78" y2="59" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="63.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">100 000</tspan></text><line x1="108.78" y1="59" x2="108.78" y2="359" stroke="#5b7280" stroke-width="1.6"/><line x1="126.78" y1="59" x2="126.78" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="126.78" y1="359" x2="126.78" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="126.78" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="126.78" dy="0">0,01</tspan></text><line x1="509.39" y1="59" x2="509.39" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="509.39" y1="359" x2="509.39" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="509.39" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="509.39" dy="0">0,1</tspan></text><line x1="892" y1="59" x2="892" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="359" x2="892" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">1</tspan></text><line x1="108.78" y1="359" x2="910" y2="359" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="209" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 209)">Peticiones necesarias (escala logarítmica)</text><text x="509.39" y="405" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="509.39" dy="0">Tasa de diferencia que se quiere detectar (%) (escala logarítmica)</tspan></text><polyline points="892,311.433 509.39,211.36 126.78,111.352" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="892" cy="311.433" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="300.433" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">299 (96 % de 400 corridas la ven)</tspan></text><circle cx="509.39" cy="211.36" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="509.39" y="200.36" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="509.39" dy="0">2 995 (94 %)</tspan></text><circle cx="126.78" cy="111.352" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="126.78" y="100.352" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="126.78" dy="0">29 956 (94 %)</tspan></text><rect x="10" y="419" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="443.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El tamaño de muestra crece como 3 dividido por la tasa; pero una clase de tráfico que solo aparece en 4 de 52 semanas exige</tspan></text><text x="470" y="460.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">elegir la ventana por calendario: una ventana de 1, 4, 8 o 12 semanas incluye un cierre en el 7, 21, 31 y 43 % de los</tspan></text><text x="470" y="477.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">inicios posibles. El calendario de cierres es un supuesto del autor.</tspan></text><text x="470" y="524.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
