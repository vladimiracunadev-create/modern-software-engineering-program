<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 494" width="940" height="494" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">5 000 registros sintéticos del modelo antiguo: traducción ingenua frente a una capa anticorrupción</title><desc id="d">Barras horizontales con los registros, de 5 000, por resultado de la traducción: la traducción ingenua lanza excepción con 4 402; la capa anticorrupción no lanza ninguna y deja 2 175 sin errores, 642 con error de nota y 2 491 con error de fecha, y 2 429 quedan con estado desconocido; 1 606 con estado espacio o nulo se vuelven indistinguibles.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="494" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">5 000 registros sintéticos del modelo antiguo: traducción ingenua frente a una capa anticorrupción</tspan></text><line x1="324" y1="49" x2="324" y2="313" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="313" x2="324" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="334" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="434.34" y1="49" x2="434.34" y2="313" stroke="#d5dde1" stroke-width="1"/><line x1="434.34" y1="313" x2="434.34" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="434.34" y="334" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="434.34" dy="0">1 000</tspan></text><line x1="544.68" y1="49" x2="544.68" y2="313" stroke="#d5dde1" stroke-width="1"/><line x1="544.68" y1="313" x2="544.68" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="544.68" y="334" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="544.68" dy="0">2 000</tspan></text><line x1="655.02" y1="49" x2="655.02" y2="313" stroke="#d5dde1" stroke-width="1"/><line x1="655.02" y1="313" x2="655.02" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="655.02" y="334" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="655.02" dy="0">3 000</tspan></text><line x1="765.36" y1="49" x2="765.36" y2="313" stroke="#d5dde1" stroke-width="1"/><line x1="765.36" y1="313" x2="765.36" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="765.36" y="334" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="765.36" dy="0">4 000</tspan></text><line x1="875.7" y1="49" x2="875.7" y2="313" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="313" x2="875.7" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="334" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">5 000</tspan></text><line x1="324" y1="313" x2="875.7" y2="313" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="67" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Traducción ingenua: lanza excepción (88,0</tspan></text><text x="314" y="84" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">%)</tspan></text><text x="314" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Capa anticorrupción: sin errores</tspan></text><text x="314" y="163.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Capa: con error de nota</tspan></text><text x="314" y="207.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Capa: con error de fecha</tspan></text><text x="314" y="251.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Estado «desconocido» (vacío, nulo o X)</tspan></text><text x="314" y="287" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Estado espacio y nulo, antes distintos,</tspan></text><text x="314" y="304" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">ahora iguales</tspan></text><rect x="324" y="55" width="485.717" height="32" rx="3" fill="#946512"/><text x="816.717" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="816.717" dy="0">4 402</tspan></text><rect x="324" y="99" width="239.99" height="32" rx="3" fill="#946512"/><text x="570.99" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="570.99" dy="0">2 175</tspan></text><rect x="324" y="143" width="70.8383" height="32" rx="3" fill="#946512"/><text x="401.838" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="401.838" dy="0">642</tspan></text><rect x="324" y="187" width="274.857" height="32" rx="3" fill="#946512"/><text x="605.857" y="207.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="605.857" dy="0">2 491</tspan></text><rect x="324" y="231" width="268.016" height="32" rx="3" fill="#946512"/><text x="599.016" y="251.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="599.016" dy="0">2 429</tspan></text><rect x="324" y="275" width="177.206" height="32" rx="3" fill="#946512"/><text x="508.206" y="295.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="508.206" dy="0">1 606</tspan></text><text x="599.85" y="357" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="599.85" dy="0">Registros de 5 000</tspan></text><rect x="10" y="371" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="395.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La capa no lanza excepciones: clasifica y envía a cuarentena lo que no puede traducir, pero colapsa dos estados que el</tspan></text><text x="470" y="412.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">modelo antiguo distinguía. Un registro puede sumar más de un resultado. Las anomalías y sus frecuencias son una</tspan></text><text x="470" y="429.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">construcción del autor.</tspan></text><text x="470" y="476.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
