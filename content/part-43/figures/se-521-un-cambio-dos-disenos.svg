<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 311" width="980" height="311" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El mismo cambio de regla, un descuento del 10 % hecho en un solo lugar, en dos diseños</title><desc id="d">Tabla con dos diseños del cálculo de totales de un pedido y el efecto de aplicar un descuento del 10 por ciento a partir de tres unidades en un solo lugar: en el diseño A, donde tres clases leen el precio del producto de cada línea, el total de Checkout da 33,5 y el de Factura 35 y son inconsistentes; en el diseño B, donde la línea calcula su subtotal, ambos dan 33,5 y son consistentes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="311" fill="#ffffff"/><rect x="10" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="132" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="132" dy="0">Diseño</tspan></text><rect x="260" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="372" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="372" dy="0">Clases que leen el precio</tspan></text><text x="372" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="372" dy="0">ajeno</tspan></text><rect x="490" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="557" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="557" dy="0">Copias de la</tspan></text><text x="557" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="557" dy="0">fórmula</tspan></text><rect x="630" y="12" width="174" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="717" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="717" dy="0">Totales</tspan></text><rect x="810" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="887" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="887" dy="0">Resultado</tspan></text><rect x="10" y="56" width="244" height="72" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="87.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">A: la lógica vive en quien la</tspan></text><text x="132" y="103.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">usa</tspan></text><rect x="260" y="56" width="224" height="72" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="372" y="95.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372" dy="0">3</tspan></text><rect x="490" y="56" width="134" height="72" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="95.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">3</tspan></text><rect x="630" y="56" width="174" height="72" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="95.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">(33,5 ; 35)</tspan></text><rect x="810" y="56" width="154" height="72" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="887" y="95.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="887" dy="0">Inconsistente</tspan></text><rect x="10" y="134" width="244" height="72" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="165.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">B: Experto en información</tspan></text><text x="132" y="181.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">(Linea.subtotal)</tspan></text><rect x="260" y="134" width="224" height="72" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="372" y="173.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372" dy="0">0</tspan></text><rect x="490" y="134" width="134" height="72" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="173.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">2</tspan></text><rect x="630" y="134" width="174" height="72" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="173.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">(33,5 ; 33,5)</tspan></text><rect x="810" y="134" width="154" height="72" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="887" y="173.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="887" dy="0">Consistente</tspan></text><rect x="10" y="216" width="960" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="490" y="240.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">Asignar el cálculo a quien tiene los datos (Experto en información) hace que un cambio de regla se haga en un lugar. No es un</tspan></text><text x="490" y="257.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">teorema: es una consecuencia verificable de dónde viven los datos.</tspan></text><text x="490" y="297.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Código ejecutado de verdad (CPython 3.12, Windows 11); los recuentos son deterministas y los tiempos varían de equipo en equipo.</tspan></text></svg>
