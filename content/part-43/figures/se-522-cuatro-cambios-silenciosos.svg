<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 390" width="940" height="390" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro operaciones que siguen ejecutándose con otro resultado, medidas en CPython</title><desc id="d">Barras horizontales con el porcentaje de resultados distintos de cuatro operaciones: ordenar 2 000 nombres por punto de código frente a plegado de acentos difiere en 1 828 posiciones, el 91,4 por ciento; dividir 7n entre 2 con una barra frente a dos en 500 de 1 000 casos; truncar a 6 bytes parte 114 de 1 000 nombres; redondear a un decimal cambia 50 de 1 000 centésimas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="390" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuatro operaciones que siguen ejecutándose con otro resultado, medidas en CPython</tspan></text><line x1="354" y1="49" x2="354" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="225" x2="354" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="482.41" y1="49" x2="482.41" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="482.41" y1="225" x2="482.41" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="482.41" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482.41" dy="0">25</tspan></text><line x1="610.82" y1="49" x2="610.82" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="610.82" y1="225" x2="610.82" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="610.82" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="610.82" dy="0">50</tspan></text><line x1="739.23" y1="49" x2="739.23" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="739.23" y1="225" x2="739.23" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="739.23" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="739.23" dy="0">75</tspan></text><line x1="867.64" y1="49" x2="867.64" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="867.64" y1="225" x2="867.64" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="867.64" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867.64" dy="0">100</tspan></text><line x1="354" y1="225" x2="867.64" y2="225" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="67" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Ordenar: punto de código frente a plegado de</tspan></text><text x="344" y="84" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">acentos (2 000 nombres)</tspan></text><text x="344" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">7n/2 frente a 7n//2 (n de 1 a 1 000)</tspan></text><text x="344" y="155" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Truncar a 6 bytes en UTF-8: carácter partido</tspan></text><text x="344" y="172" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">(1 000 nombres)</tspan></text><text x="344" y="199" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Redondear a un decimal: regla antigua frente</tspan></text><text x="344" y="216" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">a round (1 000 centésimas)</tspan></text><rect x="354" 