<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 362" width="940" height="362" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reescribir la llamada leer_nota en 400 fragmentos (148 llamadas reales): reescrituras indebidas por método</title><desc id="d">Barras horizontales con las reescrituras indebidas de tres formas de reescribir la llamada leer_nota en 400 fragmentos de código de los cuales 148 son llamadas reales: la sustitución de texto hace 252, la expresión regular con límites de palabra 166 y el árbol sintáctico 0; ninguno omite una llamada real.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="362" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Reescribir la llamada leer_nota en 400 fragmentos (148 llamadas reales): reescrituras indebidas por método</tspan></text><line x1="274" y1="49" x2="274" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="181" x2="274" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0</tspan></text><line x1="479.94" y1="49" x2="479.94" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="479.94" y1="181" x2="479.94" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="479.94" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="479.94" dy="0">100</tspan></text><line x1="685.88" y1="49" x2="685.88" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="685.88" y1="181" x2="685.88" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="685.88" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="685.88" dy="0">200</tspan></text><line x1="891.82" y1="49" x2="891.82" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="891.82" y1="181" x2="891.82" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="891.82" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="891.82" dy="0">300</tspan></text><line x1="274" y1="181" x2="891.82" y2="181" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="75.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Sustitución de texto</tspan></text><text x="264" y="111" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Expresión regular con límites de</tspan></text><text x="264" y="128" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">palabra</tspan></text><text x="264" y="163.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Árbol sintáctico (ast)</tspan></text><rect x="274" y="55" width="518.969" height="32" rx="3" fill="#c0432f"/><text x="799.969" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="799.969" dy="0">252</tspan></text><rect x="274" y="99" width="341.86" height="32" rx="3" fill="#c0432f"/><text x="622.86" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="622.86" dy="0">166</tspan></text><rect x="274" y="143" width="2" height="32" rx="3" fill="#c0432f"/><text x="283" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="283" dy="0">0</tspan></text><text x="582.91" y="225" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="582.91" dy="0">Reescrituras indebidas</tspan></text><rect x="10" y="239" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="263.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los tres encuentran todas las llamadas y ninguno deja llamadas sin reescribir o mal reescritas; la diferencia está en lo</tspan></text><text x="470" y="280.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">que cambian de más: comentarios, textos, métodos de otros objetos y definiciones. Los nueve tipos de fragmento son del</tspan></text><text x="470" y="297.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">autor y el árbol no se probó con código mal formado ni con reflexión.</tspan></text><text x="470" y="344.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
