<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 435" width="980" height="435" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro patrones de mensajería y lo que se midió con un canal simulado</title><desc id="d">Tabla con cuatro patrones de mensajería y lo medido en una simulación con semilla fija: el enrutador por contenido reparte mil mensajes en 601 pagos, 206 avisos y 193 bajas; el canal de cartas muertas con tope de 3 intentos procesa 198 de 200 mensajes y aparta 2 con 204 intentos; el reordenador pasa de 977 pares fuera de orden a 0; y el identificador de correlación asocia 20 de 20 respuestas frente a 1 de 20 por posición.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="435" fill="#ffffff"/><rect x="10" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="127" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="127" dy="0">Patrón</tspan></text><rect x="250" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="412" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="412" dy="0">Escenario</tspan></text><rect x="580" y="12" width="384" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="772" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="772" dy="0">Resultado</tspan></text><rect x="10" y="56" width="234" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="127" y="91.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="127" dy="0">Content-Based Router</tspan></text><rect x="250" y="56" width="324" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="412" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412" dy="0">Mil mensajes por tipo</tspan></text><rect x="580" y="56" width="384" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">601 pagos, 206 avisos, 193 bajas</tspan></text><rect x="10" y="126" width="234" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="127" y="161.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="127" dy="0">Dead Letter Channel</tspan></text><rect x="250" y="126" width="324" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="412" y="153.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412" dy="0">200 mensajes, 25 de la muestra son</tspan></text><text x="412" y="169.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412" dy="0">veneno, tope de 3 intentos</tspan></text><rect x="580" y="126" width="384" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="153.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">198 procesados, 2 a la cola de cartas muertas,</tspan></text><text x="772" y="169.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">204 intentos</tspan></text><rect x="10" y="196" width="234" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="127" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="127" dy="0">Resequencer</tspan></text><rect x="250" y="196" width="324" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="412" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412" dy="0">Entrega desordenada en ventanas de 6</tspan></text><rect x="580" y="196" width="384" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="223.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">977 pares fuera de orden a la entrada, 0 a la</tspan></text><text x="772" y="239.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">salida</tspan></text><rect x="10" y="266" width="234" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="127" y="301.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="127" dy="0">Correlation Identifier</tspan></text><rect x="250" y="266" width="324" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="412" y="301.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412" dy="0">20 respuestas desordenadas</tspan></text><rect x="580" y="266" width="384" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="293.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">20 de 20 asociadas por identificador; 1 de 20 por</tspan></text><text x="772" y="309.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">posición</tspan></text><rect x="10" y="340" width="960" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="490" y="364.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">El catálogo de Hohpe y Woolf da nombre a los mismos problemas que aparecen con colas, buses y sistemas de eventos de hoy; el</tspan></text><text x="490" y="381.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">nombre sirve para discutir, la medida para decidir.</tspan></text><text x="490" y="421.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Simulación con semilla fija sobre código ejecutado de verdad (CPython 3.12); las magnitudes son de este modelo, no de un sistema real.</tspan></text></svg>
