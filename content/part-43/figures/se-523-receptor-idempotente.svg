<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 341" width="980" height="341" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mil mensajes con entrega al menos una vez: 208 duplicados y la suma de pagos</title><desc id="d">Tabla con la suma de los pagos de mil mensajes en un canal con entrega al menos una vez y 208 duplicados: la suma real es 15682, sin receptor idempotente da 18759 con un error de 3077, y con receptor idempotente da 15682 porque descarta los duplicados por identificador.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="341" fill="#ffffff"/><rect x="10" y="12" width="304" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="162" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="162" dy="0">Variante</tspan></text><rect x="320" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="392" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="392" dy="0">Suma</tspan></text><rect x="470" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="542" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="542" dy="0">Error</tspan></text><rect x="620" y="12" width="344" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="792" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="792" dy="0">Causa</tspan></text><rect x="10" y="56" width="304" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="87.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">Suma real de pagos</tspan></text><rect x="320" y="56" width="144" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="392" y="87.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="392" dy="0">15 682</tspan></text><rect x="470" y="56" width="144" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="87.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">0</tspan></text><rect x="620" y="56" width="344" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="87.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">Referencia</tspan></text><rect x="10" y="118" width="304" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="149.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">Sin receptor idempotente</tspan></text><rect x="320" y="118" width="144" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="392" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="392" dy="0">18 759</tspan></text><rect x="470" y="118" width="144" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">+3 077</tspan></text><rect x="620" y="118" width="344" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">208 duplicados contados dos veces</tspan></text><rect x="10" y="180" width="304" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="211.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">Con receptor idempotente</tspan></text><rect x="320" y="180" width="144" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="392" y="211.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="392" dy="0">15 682</tspan></text><rect x="470" y="180" width="144" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="211.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">0</tspan></text><rect x="620" y="180" width="344" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="203.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">Los duplicados se descartan por</tspan></text><text x="792" y="219.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">identificador</tspan></text><rect x="10" y="246" width="960" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="490" y="270.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">La entrega al menos una vez es la garantía habitual y barata; la exactamente una vez se construye en el receptor. Sin</tspan></text><text x="490" y="287.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">identificadores estables, el receptor idempotente no se puede escribir.</tspan></text><text x="490" y="327.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Simulación con semilla fija sobre código ejecutado de verdad (CPython 3.12); las magnitudes son de este modelo, no de un sistema real.</tspan></text></svg>
