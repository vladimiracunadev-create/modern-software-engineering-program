<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 287" width="980" height="287" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una dependencia caída 7 segundos con 100 peticiones por segundo, con y sin circuit breaker</title><desc id="d">Tabla con una dependencia caída siete segundos dentro de una ventana de veinte con cien peticiones por segundo: sin circuit breaker se hacen 2000 llamadas al servicio, ninguna se rechaza al instante y hay 1300 éxitos; con circuit breaker se hacen 1307 llamadas, 693 se rechazan al instante y hay 1296 éxitos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="287" fill="#ffffff"/><rect x="10" y="12" width="314" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="167" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="167" dy="0">Variante</tspan></text><rect x="330" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="437" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="437" dy="0">Llamadas al servicio</tspan></text><rect x="550" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="672" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="672" dy="0">Rechazadas al instante</tspan></text><rect x="800" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="882" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="882" dy="0">Éxitos</tspan></text><rect x="10" y="56" width="314" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="89.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">Sin circuit breaker</tspan></text><rect x="330" y="56" width="214" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="89.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">2000</tspan></text><rect x="550" y="56" width="244" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="89.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">0</tspan></text><rect x="800" y="56" width="164" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="882" y="89.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">1300</tspan></text><rect x="10" y="122" width="314" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="155.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">Con circuit breaker</tspan></text><rect x="330" y="122" width="214" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="155.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">1307</tspan></text><rect x="550" y="122" width="244" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="155.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">693</tspan></text><rect x="800" y="122" width="164" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="882" y="155.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">1296</tspan></text><rect x="10" y="192" width="960" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="490" y="216.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">El interruptor ahorra 693 llamadas a una dependencia que no puede contestar, a cambio de 4 éxitos menos por los instantes de la</tspan></text><text x="490" y="233.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">recuperación. Protege al llamante y a la dependencia caída; no repara nada.</tspan></text><text x="490" y="273.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Simulación con semilla fija sobre código ejecutado de verdad (CPython 3.12); las magnitudes son de este modelo, no de un sistema real.</tspan></text></svg>
