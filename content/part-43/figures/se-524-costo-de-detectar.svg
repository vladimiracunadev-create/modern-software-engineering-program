<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 554" width="940" height="554" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Filas leídas hasta detectar divergencias entre 100 000 filas (media de 300 corridas)</title><desc id="d">Líneas en escala logarítmica con las filas leídas hasta detectar divergencias según cuántas hay: con una divergencia el muestreo del 1 por ciento lee 108 490, el del 10 por ciento 105 400 y las sumas por rangos 1 100; con diez, 10 947, 14 867 y 9 667; con cien, 1 583, 10 000 y 63 483.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="554" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Filas leídas hasta detectar divergencias entre 100 000 filas (media de 300 corridas)</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Muestra del 1 %</tspan></text><rect x="177.1" y="45" width="12" height="12" fill="#946512" stroke="#946512" stroke-width="2"/><text x="197.1" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="197.1" dy="0">Muestra del 10 %</tspan></text><polygon points="351.74,44.1 358.34,56.4 345.14,56.4" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="365.74" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="365.74" dy="0">Sumas por rangos</tspan></text><line x1="123.86" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="118.86" y1="387" x2="123.86" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="114.86" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="114.86" dy="0">1 000</tspan></text><line x1="123.86" y1="287" x2="910" y2="287" stroke="#d5dde1" stroke-width="1"/><line x1="118.86" y1="287" x2="123.86" y2="287" stroke="#5b7280" stroke-width="1.4"/><text x="114.86" y="291.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="114.86" dy="0">10 000</tspan></text><line x1="123.86" y1="187" x2="910" y2="187" stroke="#d5dde1" stroke-width="1"/><line x1="118.86" y1="187" x2="123.86" y2="187" stroke="#5b7280" stroke-width="1.4"/><text x="114.86" y="191.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="114.86" dy="0">100 000</tspan></text><line x1="123.86" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="118.86" y1="87" x2="123.86" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="114.86" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="114.86" dy="0">1 000 000</tspan></text><line x1="123.86" y1="87" x2="123.86" y2="387" stroke="#5b7280" stroke-width="1.6"/><line x1="141.86" y1="87" x2="141.86" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="141.86" y1="387" x2="141.86" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="141.86" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="141.86" dy="0">1</tspan></text><line x1="516.93" y1="87" x2="516.93" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="516.93" y1="387" x2="516.93" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="516.93" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="516.93" dy="0">10</tspan></text><line x1="892" y1="87" x2="892" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="387" x2="892" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">100</tspan></text><line x1="123.86" y1="387" x2="910" y2="387" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 237)">Filas leídas (escala logarítmica)</text><text x="516.93" y="433" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="516.93" dy="0">Filas divergentes (escala logarítmica)</tspan></text><polyline points="141.86,183.461 516.93,283.07 892,367.052" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="141.86" cy="183.461" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="141.86" y="172.461" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="141.86" dy="0">108 490</tspan></text><circle cx="516.93" cy="283.07" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="516.93" y="272.07" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="516.93" dy="0">10 947</tspan></text><circle cx="892" cy="367.052" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="356.052" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">1 583</tspan></text><polyline points="141.86,184.716 516.93,269.778 892,287" fill="none" stroke="#946512" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="136.36" y="179.216" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="141.86" y="173.716" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="141.86" dy="0">105 400</tspan></text><rect x="511.43" y="264.278" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="516.93" y="258.778" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="516.93" dy="0">14 867</tspan></text><rect x="886.5" y="281.5" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="892" y="276" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">10 000</tspan></text><polyline points="141.86,382.861 516.93,288.471 892,206.734" fill="none" stroke="#087f8c" stroke-width="2.4"/><polygon points="141.86,376.536 147.91,387.811 135.81,387.811" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="141.86" y="371.861" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="141.86" dy="0">1 100</tspan></text><polygon points="516.93,282.146 522.98,293.421 510.88,293.421" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="516.93" y="277.471" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="516.93" dy="0">9 667</tspan></text><polygon points="892,200.409 898.05,211.684 885.95,211.684" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="195.734" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">63 483</tspan></text><rect x="10" y="447" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Con una divergencia las sumas por rangos ganan (1 ciclo frente a 108,5 y 10,5); con cien, el muestreo del 1 % lee menos.</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las divergencias se reparten al azar y de forma uniforme, cosa que rara vez ocurre: suelen agruparse.</tspan></text><text x="470" y="536.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
