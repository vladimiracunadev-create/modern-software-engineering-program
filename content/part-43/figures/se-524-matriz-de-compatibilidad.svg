163" height="37" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="837" y="295.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="837" dy="0">falla</tspan></text><rect x="257.5" y="312.5" width="163" height="37" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="339" y="335.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="339" dy="0">falla</tspan></text><rect x="423.5" y="312.5" width="163" height="37" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="505" y="335.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="505" dy="0">pasa</tspan></text><rect x="589.5" y="312.5" width="163" height="37" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="671" y="335.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="671" dy="0">pasa</tspan></text><rect x="755.5" y="312.5" width="163" height="37" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="837" y="335.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="837" dy="0">pasa</tspan></text><text x="20" y="231" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 231)">Cambio</text><text x="256" y="377" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="256" dy="0">pasa</tspan></text><rect x="294.16" y="365" width="30.5" height="14" fill="#fbe4de"/><rect x="324.16" y="365" width="30.5" height="14" fill="#f3cdc5"/><rect x="354.16" y="365" width="30.5" height="14" fill="#eab6ac"/><rect x="384.16" y="365" width="30.5" height="14" fill="#e29f93"/><rect x="414.16" y="365" width="30.5" height="14" fill="#d9887a"/><rect x="444.16" y="365" width="30.5" height="14" fill="#d17161"/><rect x="474.16" y="365" width="30.5" height="14" fill="#c85a48"/><rect x="504.16" y="365" width="30.5" height="14" fill="#c0432f"/><text x="542.16" y="377" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="542.16" dy="0">falla</tspan></text><text x="587.86" y="377" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="587.86" dy="0">más oscuro = mayor (falla = excepción)</tspan></text><rect x="10" y="393" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="417.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El lector estricto falla en 11 de 12 celdas; el tolerante, en 4. «Pasa» solo dice que no hubo excepción: un lector</tspan></text><text x="470" y="434.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">tolerante que lee un dato viejo tras renombrar la nota la deja ausente sin avisar. El registro de tres campos es del autor.</tspan></text><text x="470" y="482.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
