<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="940" height="500" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Seis cambios de esquema y cuatro lecturas: lector viejo o nuevo, estricto o tolerante</title><desc id="d">Mapa de calor de seis cambios de esquema frente a cuatro lecturas: un lector estricto falla en 11 de 12 casos y uno tolerante en 4 de 12; cambiar el tipo falla en las cuatro lecturas y renombrar un campo pasa con un lector tolerante nuevo que lee un dato viejo pero deja la nota ausente.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="500" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Seis cambios de esquema y cuatro lecturas: lector viejo o nuevo, estricto o tolerante</tspan></text><text x="588" y="59" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="588" dy="0">Quién lee y cómo</tspan></text><text x="339" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="339" dy="0">Viejo lee dato nuevo,</tspan></text><text x="339" y="99" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="339" dy="0">estricto</tspan></text><text x="505" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="505" dy="0">Viejo lee dato nuevo,</tspan></text><text x="505" y="99" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="505" dy="0">tolerante</tspan></text><text x="671" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="671" dy="0">Nuevo lee dato viejo,</tspan></text><text x="671" y="99" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="671" dy="0">estricto</tspan></text><text x="837" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="837" dy="0">Nuevo lee dato viejo,</tspan></text><text x="837" y="99" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="837" dy="0">tolerante</tspan></text><text x="246" y="135.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="246" dy="0">Añadir campo opcional</tspan></text><text x="246" y="175.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="246" dy="0">Añadir campo obligatorio</tspan></text><text x="246" y="215.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="246" dy="0">Quitar campo</tspan></text><text x="246" y="255.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="246" dy="0">Renombrar campo</tspan></text><text x="246" y="295.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="246" dy="0">Cambiar el tipo</tspan></text><text x="246" y="335.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="246" dy="0">Ampliar valores permitidos</tspan></text><rect x="257.5" y="112.5" width="163" height="37" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="339" y="135.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="339" dy="0">falla</tspan></text><rect x="423.5" y="112.5" width="163" height="37" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="505" y="135.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="505" dy="0">pasa</tspan></text><rect x="589.5" y="112.5" width="163" height="37" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="671" y="135.5" font-size="