<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 494" width="940" height="494" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">50 000 registros sintéticos de cuatro tipos: un corte único a cinco años frente a reglas por tipo</title><desc id="d">Barras agrupadas con los errores de retención sobre 50 000 registros de cuatro tipos: un corte único a cinco años borra 5 479 registros antes de tiempo o en litigio y conserva 7 368 más de lo permitido, mientras que las reglas por tipo con retención legal dan 0 y 0 por construcción del experimento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="494" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">50 000 registros sintéticos de cuatro tipos: un corte único a cinco años frente a reglas por tipo</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Borrados antes de tiempo o en litigio</tspan></text><rect x="342.98" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="362.98" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="362.98" dy="0">Conservados más de lo permitido</tspan></text><line x1="93.7" y1="335" x2="920" y2="335" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="335" x2="93.7" y2="335" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="339.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">0</tspan></text><line x1="93.7" y1="275" x2="920" y2="275" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="275" x2="93.7" y2="275" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="279.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">2 000</tspan></text><line x1="93.7" y1="215" x2="920" y2="215" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="215" x2="93.7" y2="215" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="219.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">4 000</tspan></text><line x1="93.7" y1="155" x2="920" y2="155" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="155" x2="93.7" y2="155" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="159.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">6 000</tspan></text><line x1="93.7" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="95" x2="93.7" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">8 000</tspan></text><line x1="93.7" y1="95" x2="93.7" y2="335" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="215" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 215)">Registros de 50 000</text><rect x="135.015" y="170.63" width="163.26" height="164.37" rx="3" fill="#c0432f"/><text x="216.645" y="164.63" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="216.645" dy="0">5 479</tspan></text><rect x="302.275" y="113.96" width="163.26" height="221.04" rx="3" fill="#946512"/><text x="383.905" y="107.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="383.905" dy="0">7 368</tspan></text><text x="300.275" y="356" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="300.275" dy="0">Corte único a 5 años</tspan></text><rect x="548.165" y="333" width="163.26" height="2" rx="3" fill="#c0432f"/><text x="629.795" y="327" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="629.795" dy="0">0</tspan></text><rect x="715.425" y="333" width="163.26" height="2" rx="3" fill="#946512"/><text x="797.055" y="327" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="797.055" dy="0">0</tspan></text><text x="713.425" y="356" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="713.425" dy="0">Reglas por tipo con retención legal</tspan></text><rect x="10" y="387" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="411.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las reglas dan cero porque definen la verdad del experimento: no prueban que los plazos sean correctos. Los plazos son</tspan></text><text x="470" y="428.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ilustrativos del autor y no son asesoría legal.</tspan></text><text x="470" y="476.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
