<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 445" width="980" height="445" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tarifa de avisos: función con cadena de condiciones frente a Strategy con registro</title><desc id="d">Tabla con la comparación de una función de tarifas con una cadena de condiciones y su refactor a Strategy con registro: la complejidad máxima baja de 15 a 3, los nodos suben de 149 a 215, el tiempo por llamada sube de unos 260 a unos 380 nanosegundos, el refactor difiere en 0 de 5000 entradas del maestro dorado y añadir un canal sube la complejidad de la función antigua a 16 y en la nueva solo añade una clase.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="445" fill="#ffffff"/><rect x="10" y="12" width="464" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="242" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="242" dy="0">Medida</tspan></text><rect x="480" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="592" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="592" dy="0">Antes</tspan></text><rect x="710" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="837" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="837" dy="0">Después</tspan></text><rect x="10" y="56" width="464" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Complejidad ciclomática máxima</tspan></text><rect x="480" y="56" width="224" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">15</tspan></text><rect x="710" y="56" width="254" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">3</tspan></text><rect x="10" y="114" width="464" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="143.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Nodos de sintaxis</tspan></text><rect x="480" y="114" width="224" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">149</tspan></text><rect x="710" y="114" width="254" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">215</tspan></text><rect x="10" y="172" width="464" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="201.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Tiempo por llamada</tspan></text><rect x="480" y="172" width="224" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">≈260 ns</tspan></text><rect x="710" y="172" width="254" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">≈380 ns</tspan></text><rect x="10" y="230" width="464" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="259.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Entradas del maestro dorado en que difiere</tspan></text><rect x="480" y="230" width="224" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">—</tspan></text><rect x="710" y="230" width="254" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">0 de 5000</tspan></text><rect x="10" y="288" width="464" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="317.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Complejidad al añadir un canal</tspan></text><rect x="480" y="288" width="224" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="317.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">16 (+1)</tspan></text><rect x="710" y="288" width="254" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="309.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">una clase nueva, 0 funciones</tspan></text><text x="837" y="325.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">tocadas</tspan></text><rect x="10" y="350" width="960" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="490" y="374.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">El refactor compró complejidad por función a cambio de un 44 % más de nodos y una indirección. Si el número de canales no va a</tspan></text><text x="490" y="391.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">crecer, ese costo no se justifica: la condición de salida es volver a una función simple.</tspan></text><text x="490" y="431.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Código ejecutado de verdad (CPython 3.12, Windows 11); los recuentos son deterministas y los tiempos varían de equipo en equipo.</tspan></text></svg>
