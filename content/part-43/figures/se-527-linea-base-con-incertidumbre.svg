<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 542" width="940" height="542" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Semiancho del intervalo del 95 % de una tasa de cambios fallidos del 15 % según los cambios observados</title><desc id="d">Línea en escala logarítmica con el semiancho mediano del intervalo de confianza del 95 por ciento de una tasa de cambios fallidos del 15 por ciento según los cambios observados: 19,3 puntos con 10 cambios, 15,4 con 20, 9,6 con 50, 4,9 con 200 y 2,2 con 1 000; el intervalo contiene la tasa real en cerca del 95 por ciento de 3 000 periodos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="542" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Semiancho del intervalo del 95 % de una tasa de cambios fallidos del 15 % según los cambios observados</tspan></text><line x1="71.08" y1="359" x2="910" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="359" x2="71.08" y2="359" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="363.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="299" x2="910" y2="299" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="299" x2="71.08" y2="299" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="303.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">5</tspan></text><line x1="71.08" y1="239" x2="910" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="239" x2="71.08" y2="239" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="243.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="179" x2="910" y2="179" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="179" x2="71.08" y2="179" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="183.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">15</tspan></text><line x1="71.08" y1="119" x2="910" y2="119" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="119" x2="71.08" y2="119" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="123.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="59" x2="910" y2="59" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="59" x2="71.08" y2="59" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="63.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">25</tspan></text><line x1="71.08" y1="59" x2="71.08" y2="359" stroke="#5b7280" stroke-width="1.6"/><line x1="89.08" y1="59" x2="89.08" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="89.08" y1="359" x2="89.08" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="89.08" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="89.08" dy="0">10</tspan></text><line x1="209.932" y1="59" x2="209.932" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="209.932" y1="359" x2="209.932" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="209.932" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="209.932" dy="0">20</tspan></text><line x1="369.688" y1="59" x2="369.688" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="369.688" y1="359" x2="369.688" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="369.688" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="369.688" dy="0">50</tspan></text><line x1="611.392" y1="59" x2="611.392" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="611.392" y1="359" x2="611.392" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="611.392" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="611.392" dy="0">200</tspan></text><line x1="892" y1="59" x2="892" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="359" x2="892" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">1000</tspan></text><line x1="71.08" y1="359" x2="910" y2="359" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="209" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 209)">Semiancho del intervalo (puntos porcentuales)</text><text x="490.54" y="405" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="490.54" dy="0">Cambios observados (escala logarítmica)</tspan></text><polyline points="89.08,127.4 209.932,174.2 369.688,243.8 611.392,300.2 892,332.6" fill="none" stroke="#087f8c" stroke-width="2.4"/><circle cx="89.08" cy="127.4" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="89.08" y="116.4" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="89.08" dy="0">±19,3</tspan></text><circle cx="209.932" cy="174.2" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="209.932" y="163.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="209.932" dy="0">±15,4</tspan></text><circle cx="369.688" cy="243.8" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="369.688" y="232.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="369.688" dy="0">±9,6</tspan></text><circle cx="611.392" cy="300.2" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="611.392" y="289.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="611.392" dy="0">±4,9</tspan></text><circle cx="892" cy="332.6" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="321.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">±2,2</tspan></text><rect x="10" y="419" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="443.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Con 20 cambios la tasa del 15 % queda entre el 0 % y el 30 %. Para distinguir 15 % de 10 % con potencia del 80 % hacen</tspan></text><text x="470" y="460.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">falta unos 686 cambios. Se supone independencia entre cambios, algo falso cuando hay rachas. El intervalo del 95 % contuvo</tspan></text><text x="470" y="477.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">la tasa real entre el 95 y el 98 % de las veces.</tspan></text><text x="470" y="524.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
