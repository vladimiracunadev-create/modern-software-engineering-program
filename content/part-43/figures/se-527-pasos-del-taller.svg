<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 336" width="960" height="336" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Los pasos del taller: de la función vieja al patrón, con red de seguridad</title><desc id="d">Diagrama de cinco cajas en dos filas: registrar el comportamiento actual con un maestro dorado, añadir las entradas de frontera, medir complejidad y tamaño antes, refactorizar a Strategy con registro y volver a medir y comparar; una flecha lleva de la última caja a la decisión de conservar o retirar el patrón.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="336" fill="#ffffff"/><rect x="10" y="14" width="284" height="90" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="152" y="54.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="152" dy="0">1. REGISTRAR</tspan></text><text x="152" y="70.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="152" dy="0">Maestro dorado con semilla fija</tspan></text><rect x="338" y="14" width="284" height="90" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="54.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">2. FRONTERAS</tspan></text><text x="480" y="70.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Añade las entradas de los límites</tspan></text><polyline points="294,59 338,59" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="666" y="14" width="284" height="90" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="808" y="54.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="808" dy="0">3. MEDIR ANTES</tspan></text><text x="808" y="70.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="808" dy="0">Complejidad, nodos, tiempo</tspan></text><polyline points="622,59 666,59" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="144" width="284" height="90" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="152" y="176" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="152" dy="0">4. REFACTORIZAR</tspan></text><text x="152" y="192.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="152" dy="0">Strategy con registro, un paso por</tspan></text><text x="152" y="209.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="152" dy="0">vez</tspan></text><rect x="338" y="144" width="284" height="90" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="480" y="176" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="480" dy="0">5. MEDIR Y DECIDIR</tspan></text><text x="480" y="192.64" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="480" dy="0">Conserva o retira con la condición</tspan></text><text x="480" y="209.28" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="480" dy="0">de salida</tspan></text><polyline points="294,189 338,189" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="808,104 808,124 152,124 152,144" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="248" width="940" height="54" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="278.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Sin el paso 2 el maestro deja pasar tres de seis cambios; sin los pasos de medir, el patrón se queda por costumbre.</tspan></text><text x="480" y="326" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Código ejecutado de verdad (CPython 3.12, Windows 11); los recuentos son deterministas y los tiempos varían de equipo en equipo.</tspan></text></svg>
