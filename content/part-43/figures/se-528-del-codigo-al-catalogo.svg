<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 435" width="980" height="435" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Del código al catálogo: cuatro pasos y el hecho medido que justifica cada uno</title><desc id="d">Tabla con cuatro pasos para pasar del código a un catálogo de patrones: inventario con una regla que por nombre da cinco falsos positivos en catorce fragmentos, verificación por una persona que deja un falso positivo y dos falsos negativos con el detector estructural, fuerza y costo con el ejemplo de Strategy que sube un 44 por ciento los nodos y baja la complejidad de 15 a 3, y decisión de conservar, simplificar o retirar con condición de salida.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="435" fill="#ffffff"/><rect x="10" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="102" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="102" dy="0">Paso</tspan></text><rect x="200" y="12" width="394" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="397" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="397" dy="0">Qué se hace</tspan></text><rect x="600" y="12" width="364" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="782" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="782" dy="0">Hecho medido que lo justifica</tspan></text><rect x="10" y="56" width="184" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="91.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">1. Inventario</tspan></text><rect x="200" y="56" width="394" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="83.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">Buscar estructuras con una regla y registrar</tspan></text><text x="397" y="99.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">candidatos</tspan></text><rect x="600" y="56" width="364" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">La regla por nombre da 5 falsos positivos en 14</tspan></text><rect x="10" y="126" width="184" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="161.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">2. Verificación</tspan></text><rect x="200" y="126" width="394" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="153.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">Una persona lee cada candidato contra la definición</tspan></text><text x="397" y="169.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">del patrón</tspan></text><rect x="600" y="126" width="364" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="153.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">El detector estructural deja 1 falso positivo y</tspan></text><text x="782" y="169.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">2 falsos negativos</tspan></text><rect x="10" y="196" width="184" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">3. Fuerza y costo</tspan></text><rect x="200" y="196" width="394" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="223.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">Para cada patrón confirmado, nombrar la fuerza y</tspan></text><text x="397" y="239.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">medir el costo</tspan></text><rect x="600" y="196" width="364" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">Strategy: +44 % de nodos, complejidad 15 → 3</tspan></text><rect x="10" y="266" width="184" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="301.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">4. Decisión</tspan></text><rect x="200" y="266" width="394" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="293.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">Conservar, simplificar o retirar, con condición de</tspan></text><text x="397" y="309.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">salida</tspan></text><rect x="600" y="266" width="364" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="301.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">Una entrada sin evidencia no entra</tspan></text><rect x="10" y="340" width="960" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="490" y="364.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">El catálogo es un documento vivo que responde por cada patrón del sistema. Su valor no está en la lista sino en las razones y en</tspan></text><text x="490" y="381.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">las salidas que registra.</tspan></text><text x="490" y="421.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Código ejecutado de verdad (CPython 3.12, Windows 11); los recuentos son deterministas y los tiempos varían de equipo en equipo.</tspan></text></svg>
