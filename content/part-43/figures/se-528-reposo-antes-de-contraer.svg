<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 379" width="940" height="379" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Defectos latentes que aparecen después de contraer, según el reposo (descubrimiento lognormal de mediana 9 días)</title><desc id="d">Barras con la fracción de defectos latentes que aparecen después de contraer según el reposo, con descubrimiento lognormal de mediana nueve días: 86,7 por ciento con 3 días, 60,1 con 7, 33,2 con 14, 11,4 con 30, 2,9 con 60 y 1,1 con 90.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="379" fill="#ffffff"/><text x="130" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="130" dy="0">3 días</tspan></text><rect x="140" y="16" width="520.2" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="668.2" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="668.2" dy="0">86,7 %</tspan></text><text x="130" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="130" dy="0">7 días</tspan></text><rect x="140" y="60" width="360.6" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="508.6" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="508.6" dy="0">60,1 %</tspan></text><text x="130" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="130" dy="0">14 días</tspan></text><rect x="140" y="104" width="199.2" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="347.2" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="347.2" dy="0">33,2 %</tspan></text><text x="130" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="130" dy="0">30 días</tspan></text><rect x="140" y="148" width="68.4" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="216.4" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="216.4" dy="0">11,4 %</tspan></text><text x="130" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="130" dy="0">60 días</tspan></text><rect x="140" y="192" width="17.4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="165.4" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="165.4" dy="0">2,9 %</tspan></text><text x="130" y="255.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="130" dy="0">90 días</tspan></text><rect x="140" y="236" width="6.6" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="154.6" y="255.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="154.6" dy="0">1,1 %</tspan></text><rect x="10" y="284" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="308.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Un reposo de tres días deja casi nueve de cada diez defectos latentes para después del punto de no retorno. La mediana de 9</tspan></text><text x="470" y="325.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">días y la dispersión de 1,0 son supuestos del autor y se estiman con el historial de defectos propio.</tspan></text><text x="470" y="365.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
