<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 551" width="940" height="551" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuánto espera una decisión</title><desc id="d">Barras agrupadas con la espera de una decisión según cuántas aprueba una sola persona: con 5 por día y utilización de 87,5 por ciento la espera media es 9,4 horas y el percentil 90 22,8; con 2 por día y 35 por ciento 0,8 y 2,7; con 1 por día y 17,5 por ciento 0,3 y 0,9.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="551" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuánto espera una decisión</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Espera media</tspan></text><rect x="154.48" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="174.48" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="174.48" dy="0">Espera p90</tspan></text><line x1="71.08" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="375" x2="71.08" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="319" x2="920" y2="319" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="319" x2="71.08" y2="319" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="323.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">5</tspan></text><line x1="71.08" y1="263" x2="920" y2="263" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="263" x2="71.08" y2="263" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="267.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="207" x2="920" y2="207" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="207" x2="71.08" y2="207" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="211.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">15</tspan></text><line x1="71.08" y1="151" x2="920" y2="151" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="151" x2="71.08" y2="151" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="155.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="95" x2="71.08" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">25</tspan></text><line x1="71.08" y1="95" x2="71.08" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">horas de espera</text><rect x="99.3773" y="269.72" width="111.189" height="105.28" rx="3" fill="#087f8c"/><text x="154.972" y="263.72" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="154.972" dy="0">9,4</tspan></text><rect x="214.567" y="119.64" width="111.189" height="255.36" rx="3" fill="#c0432f"/><text x="270.161" y="113.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="270.161" dy="0">22,8</tspan></text><text x="212.567" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="212.567" dy="0">Una persona aprueba todo (5 por día ·</tspan></text><text x="212.567" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="212.567" dy="0">utilización 87,5 %)</tspan></text><rect x="382.351" y="366.04" width="111.189" height="8.96" rx="3" fill="#087f8c"/><text x="437.945" y="360.04" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="437.945" dy="0">0,8</tspan></text><rect x="497.54" y="344.76" width="111.189" height="30.24" rx="3" fill="#c0432f"/><text x="553.135" y="338.76" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="553.135" dy="0">2,7</tspan></text><text x="495.54" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="495.54" dy="0">Aprueba el 40 % (2 por día · 35,0 %)</tspan></text><rect x="665.324" y="371.64" width="111.189" height="3.36" rx="3" fill="#087f8c"/><text x="720.919" y="365.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="720.919" dy="0">0,3</tspan></text><rect x="780.513" y="364.92" width="111.189" height="10.08" rx="3" fill="#c0432f"/><text x="836.108" y="358.92" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="836.108" dy="0">0,9</tspan></text><text x="778.513" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="778.513" dy="0">Criterios delegados (1 por día · 17,5</tspan></text><text x="778.513" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="778.513" dy="0">%)</tspan></text><rect x="10" y="444" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="468.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">La utilización pasa de 17,5 % a 87,5 % y la espera media se multiplica por más de treinta, no por cinco: la espera no es</tspan></text><text x="470" y="485.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">proporcional a la carga. El percentil 90 muestra que una decisión de cada diez espera casi tres jornadas.</tspan></text><text x="470" y="533.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
