<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 359" width="980" height="359" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un núcleo que sube su contrato a la versión 2: seis complementos, cinco escritos para la versión 1</title><desc id="d">Tabla con tres políticas de un núcleo que cambia su contrato: sin comprobar la versión, los seis complementos fallan en plena ejecución con 0 correctos; si exige la API 2 carga uno y rechaza cinco al arrancar con su motivo; con un adaptador para la API 1 carga los seis sin cambios para sus autores.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="359" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Política del núcleo</tspan></text><rect x="340" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="502" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="502" dy="0">Resultado</tspan></text><rect x="670" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="817" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="817" dy="0">Cuándo se descubre</tspan></text><rect x="10" y="56" width="324" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="90.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Sin comprobar la versión</tspan></text><rect x="340" y="56" width="324" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="90.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">0 correctos y 6 rotos</tspan></text><rect x="670" y="56" width="294" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="90.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">En plena ejecución</tspan></text><rect x="10" y="124" width="324" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="158.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Exigir la API 2</tspan></text><rect x="340" y="124" width="324" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="158.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">1 cargado y 5 rechazados</tspan></text><rect x="670" y="124" width="294" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="158.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">Al arrancar, con motivo</tspan></text><rect x="10" y="192" width="324" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="226.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Adaptador para la API 1</tspan></text><rect x="340" y="192" width="324" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="226.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">6 cargados, 0 rechazados</tspan></text><rect x="670" y="192" width="294" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="226.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">Sin cambios para los autores</tspan></text><rect x="10" y="264" width="960" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="490" y="288.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">El contrato entre núcleo y complemento es la parte más cara de un microkernel: cambiarlo rompe a quien no controlas. La versión</tspan></text><text x="490" y="305.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">declarada convierte un fallo en ejecución en un rechazo al arrancar; el adaptador lo convierte en una deuda del núcleo.</tspan></text><text x="490" y="345.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; los recuentos se repiten y los tiempos varían de un equipo a otro.</tspan></text></svg>
