<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 383" width="980" height="383" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Productor rápido y consumidor lento con 5 000 mensajes: profundidad máxima de la cola y qué ocurre con un registro malformado</title><desc id="d">Tabla con tres situaciones de un flujo: con una cola ilimitada la profundidad máxima llega a unos 5 000 mensajes y el productor nunca espera, con una cola acotada a 100 la profundidad máxima es 100 y el productor espera cuando se llena, y un filtro que falla sin manejo detiene el flujo en el registro 5, mientras que con una cola de rechazos se procesan 19 registros y se rechaza 1.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="383" fill="#ffffff"/><rect x="10" y="12" width="304" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="162" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="162" dy="0">Situación</tspan></text><rect x="320" y="12" width="284" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="462" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="462" dy="0">Profundidad máxima o efecto</tspan></text><rect x="610" y="12" width="354" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="787" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="787" dy="0">Consecuencia</tspan></text><rect x="10" y="56" width="304" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="94.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">Cola ilimitada</tspan></text><rect x="320" y="56" width="284" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="94.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">Hasta 5 000 (todo)</tspan></text><rect x="610" y="56" width="354" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="94.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">El productor nunca espera</tspan></text><rect x="10" y="132" width="304" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="170.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">Cola acotada a 100</tspan></text><rect x="320" y="132" width="284" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="170.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">100</tspan></text><rect x="610" y="132" width="354" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="170.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">El productor espera cuando se llena</tspan></text><rect x="10" y="208" width="304" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="246.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">Filtro que falla sin manejo</tspan></text><rect x="320" y="208" width="284" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="246.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">Se detiene en el registro 5</tspan></text><rect x="610" y="208" width="354" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="238.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">19 procesados y 1 rechazado si hay cola de</tspan></text><text x="787" y="254.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">rechazos</tspan></text><rect x="10" y="288" width="960" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="490" y="312.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">La cola acotada convierte la sobrecarga en espera del productor en lugar de memoria sin límite; es contrapresión. La profundidad</tspan></text><text x="490" y="329.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">de la cola ilimitada depende del reparto de hilos del sistema (entre 4 999 y 5 000 en las ejecuciones hechas).</tspan></text><text x="490" y="369.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; los recuentos se repiten y los tiempos varían de un equipo a otro.</tspan></text></svg>
