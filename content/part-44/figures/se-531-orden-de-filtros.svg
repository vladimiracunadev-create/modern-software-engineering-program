<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 306" width="940" height="306" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Orden de dos filtros en una cadena de 100 000 registros: llamadas al filtro caro de enriquecer</title><desc id="d">Barras horizontales con las llamadas al filtro caro de enriquecer: si va antes del selectivo se llama 90079 veces y si va después 16259, un 82,0 por ciento menos, con la misma salida.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="306" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Orden de dos filtros en una cadena de 100 000 registros: llamadas al filtro caro de enriquecer</tspan></text><line x1="274" y1="49" x2="274" y2="125" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="125" x2="274" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0</tspan></text><line x1="392.728" y1="49" x2="392.728" y2="125" stroke="#d5dde1" stroke-width="1"/><line x1="392.728" y1="125" x2="392.728" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="392.728" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="392.728" dy="0">20 000</tspan></text><line x1="511.456" y1="49" x2="511.456" y2="125" stroke="#d5dde1" stroke-width="1"/><line x1="511.456" y1="125" x2="511.456" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="511.456" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="511.456" dy="0">40 000</tspan></text><line x1="630.184" y1="49" x2="630.184" y2="125" stroke="#d5dde1" stroke-width="1"/><line x1="630.184" y1="125" x2="630.184" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="630.184" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="630.184" dy="0">60 000</tspan></text><line x1="748.912" y1="49" x2="748.912" y2="125" stroke="#d5dde1" stroke-width="1"/><line x1="748.912" y1="125" x2="748.912" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="748.912" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="748.912" dy="0">80 000</tspan></text><line x1="867.64" y1="49" x2="867.64" y2="125" stroke="#d5dde1" stroke-width="1"/><line x1="867.64" y1="125" x2="867.64" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="867.64" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867.64" dy="0">100 000</tspan></text><line x1="274" y1="125" x2="867.64" y2="125" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Filtro caro antes del selectivo</tspan></text><text x="264" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Filtro selectivo antes del caro</tspan></text><rect x="274" y="55" width="534.745" height="26" rx="3" fill="#102a43"/><text x="815.745" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="815.745" dy="0">90 079</tspan></text><rect x="274" y="93" width="96.5199" height="26" rx="3" fill="#102a43"/><text x="377.52" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="377.52" dy="0">16 259</tspan></text><text x="570.82" y="169" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="570.82" dy="0">Llamadas al filtro caro</tspan></text><rect x="10" y="183" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="207.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">En la primera cadena se enriquece todo lo válido; en la segunda, un 82,0 % menos de llamadas. En una cadena de filtros el</tspan></text><text x="470" y="224.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">orden cambia el costo sin cambiar el resultado, siempre que los filtros conmuten. Poner primero el que descarta más y</tspan></text><text x="470" y="241.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">cuesta menos es una decisión de diseño que se comprueba contando llamadas.</tspan></text><text x="470" y="288.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; los recuentos se repiten y los tiempos varían de un equipo a otro.</tspan></text></svg>
