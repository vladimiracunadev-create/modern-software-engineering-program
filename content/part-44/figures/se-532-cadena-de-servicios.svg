<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 419" width="960" height="419" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una petición que atraviesa k servicios en serie, cada uno al 99,9 % y con latencia mediana de 20 ms: disponibilidad y latencia</title><desc id="d">Tabla con una cadena de k servicios síncronos: con 1 servicio la disponibilidad analítica es 99,900 por ciento y la simulada 99,915, con 2 es 99,800 y 99,750, con 4 es 99,601 y 99,655, y con 8 es 99,203 y 99,150; la latencia mediana sube de 20,1 a 186,1 milisegundos y el percentil 99 de 79,2 a 316,7 milisegundos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="419" fill="#ffffff"/><rect x="10" y="12" width="174" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="97" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="97" dy="0">Servicios en la</tspan></text><text x="97" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="97" dy="0">cadena</tspan></text><rect x="190" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="307" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="307" dy="0">Disponibilidad analítica</tspan></text><rect x="430" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="547" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="547" dy="0">Disponibilidad simulada</tspan></text><rect x="670" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="737" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="737" dy="0">p50 (ms)</tspan></text><rect x="810" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="877" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="877" dy="0">p99 (ms)</tspan></text><rect x="10" y="56" width="174" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="97" y="87.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="97" dy="0">1</tspan></text><rect x="190" y="56" width="234" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="87.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="307" dy="0">99,900 %</tspan></text><rect x="430" y="56" width="234" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="547" y="87.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547" dy="0">99,915 %</tspan></text><rect x="670" y="56" width="134" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="87.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">20,1</tspan></text><rect x="810" y="56" width="134" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="877" y="87.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="877" dy="0">79,2</tspan></text><rect x="10" y="118" width="174" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="97" y="149.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="97" dy="0">2</tspan></text><rect x="190" y="118" width="234" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="307" dy="0">99,800 %</tspan></text><rect x="430" y="118" width="234" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="547" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547" dy="0">99,750 %</tspan></text><rect x="670" y="118" width="134" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">43,3</tspan></text><rect x="810" y="118" width="134" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="877" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="877" dy="0">120,6</tspan></text><rect x="10" y="180" width="174" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="97" y="211.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="97" dy="0">4</tspan></text><rect x="190" y="180" width="234" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="211.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="307" dy="0">99,601 %</tspan></text><rect x="430" y="180" width="234" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="547" y="211.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547" dy="0">99,655 %</tspan></text><rect x="670" y="180" width="134" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="211.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">90,7</tspan></text><rect x="810" y="180" width="134" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="877" y="211.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="877" dy="0">193,9</tspan></text><rect x="10" y="242" width="174" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="97" y="273.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="97" dy="0">8</tspan></text><rect x="190" y="242" width="234" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="273.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="307" dy="0">99,203 %</tspan></text><rect x="430" y="242" width="234" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="547" y="273.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547" dy="0">99,150 %</tspan></text><rect x="670" y="242" width="134" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="273.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">186,1</tspan></text><rect x="810" y="242" width="134" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="877" y="273.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="877" dy="0">316,7</tspan></text><rect x="10" y="308" width="940" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="332.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">La disponibilidad de una cadena es el producto de las de sus eslabones: ocho servicios al 99,9 % dan 99,2 %, unas cinco horas</tspan></text><text x="480" y="349.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">más de caída al mes que un solo servicio. Los 20 000 casos simulados con semilla 44 coinciden con la fórmula dentro de su</tspan></text><text x="480" y="366.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">ruido. La latencia de cada salto es una distribución lognormal del autor.</tspan></text><text x="480" y="405.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Modelo con parámetros del autor y semilla fija 44; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
