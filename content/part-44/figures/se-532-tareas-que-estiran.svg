<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 590" width="940" height="590" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué tareas hacen crecer</title><desc id="d">Puntos con el nivel final mediano y las semanas de fracaso al año de 1 000 personas simuladas durante 52 semanas con nivel inicial 3: tareas fáciles 3,07 y 0,3, calibradas 8,87 y 6,2, muy difíciles 3,04 y 37,9 y de dificultad al azar 4,8 y 14; solo las calibradas hacen crecer.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="590" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué tareas hacen crecer</tspan></text><circle cx="22" cy="51" r="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Fáciles (nivel − 2)</tspan></text><rect x="207.26" y="45" width="12" height="12" fill="#946512" stroke="#946512" stroke-width="2"/><text x="227.26" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="227.26" dy="0">Calibradas (nivel + 1)</tspan></text><polygon points="427.14,44.1 433.74,56.4 420.54,56.4" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="441.14" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="441.14" dy="0">Muy difíciles (nivel + 4)</tspan></text><polygon points="663.64,43.5 671.14,51 663.64,58.5 656.14,51" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="677.64" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="677.64" dy="0">Dificultad al azar</tspan></text><line x1="63.54" y1="407" x2="910" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="407" x2="63.54" y2="407" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="411.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">0</tspan></text><line x1="63.54" y1="300.333" x2="910" y2="300.333" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="300.333" x2="63.54" y2="300.333" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="304.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">3</tspan></text><line x1="63.54" y1="193.667" x2="910" y2="193.667" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="193.667" x2="63.54" y2="193.667" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="198.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">6</tspan></text><line x1="63.54" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="87" x2="63.54" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">9</tspan></text><line x1="63.54" y1="87" x2="63.54" y2="407" stroke="#5b7280" stroke-width="1.6"/><line x1="81.54" y1="87" x2="81.54" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="81.54" y1="407" x2="81.54" y2="412" stroke="#5b7280" stroke-width="1.4"/><text x="81.54" y="428" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="81.54" dy="0">0</tspan></text><line x1="284.155" y1="87" x2="284.155" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="284.155" y1="407" x2="284.155" y2="412" stroke="#5b7280" stroke-width="1.4"/><text x="284.155" y="428" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="284.155" dy="0">10</tspan></text><line x1="486.77" y1="87" x2="486.77" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="486.77" y1="407" x2="486.77" y2="412" stroke="#5b7280" stroke-width="1.4"/><text x="486.77" y="428" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="486.77" dy="0">20</tspan></text><line x1="689.385" y1="87" x2="689.385" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="689.385" y1="407" x2="689.385" y2="412" stroke="#5b7280" stroke-width="1.4"/><text x="689.385" y="428" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="689.385" dy="0">30</tspan></text><line x1="892" y1="87" x2="892" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="407" x2="892" y2="412" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="428" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">40</tspan></text><line x1="63.54" y1="407" x2="910" y2="407" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="247" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 247)">Nivel final (mediana)</text><text x="486.77" y="453" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="486.77" dy="0">Semanas con fracaso al año</tspan></text><circle cx="87.6184" cy="297.844" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="97.6184" y="302.344" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="97.6184" dy="0">3,07</tspan></text><rect x="201.661" y="86.1222" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="217.161" y="96.1222" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="217.161" dy="0">8,87</tspan></text><polygon points="849.451,292.586 855.501,303.861 843.401,303.861" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="839.451" y="303.411" font-size="13" text-anchor="end" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="839.451" dy="0">3,04</tspan></text><polygon points="365.201,229.458 372.076,236.333 365.201,243.208 358.326,236.333" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="375.201" y="240.833" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="375.201" dy="0">4,80</tspan></text><rect x="10" y="467" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="491.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las tareas fáciles y las muy difíciles dejan casi igual el nivel final (de 3 a 3,07 y 3,04), por razones opuestas: una no</tspan></text><text x="470" y="508.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">enseña y la otra fracasa casi todas las semanas. Las calibradas aceptan semanas de fracaso (6 de 52) como costo del</tspan></text><text x="470" y="525.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">aprendizaje.</tspan></text><text x="470" y="572.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
