<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 295" width="980" height="295" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una petición interna falsificada que no pasa por el gateway: cuántos de cuatro servicios la aceptan</title><desc id="d">Tabla con dos políticas de autenticación frente a una petición interna falsificada que salta el gateway: si los cuatro servicios confían en el gateway la aceptan 4 de 4, y si cada servicio valida la firma HMAC del token la aceptan 0 de 4 y aceptan la petición válida 4 de 4.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="295" fill="#ffffff"/><rect x="10" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Política</tspan></text><rect x="390" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="522" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="522" dy="0">Servicios que aceptan la falsa</tspan></text><rect x="660" y="12" width="304" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="812" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="812" dy="0">Observación</tspan></text><rect x="10" y="56" width="374" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="91.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Cada servicio confía en el gateway</tspan></text><rect x="390" y="56" width="264" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="522" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="522" dy="0">4 de 4</tspan></text><rect x="660" y="56" width="304" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">No hay otra barrera</tspan></text><rect x="10" y="126" width="374" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="161.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Cada servicio valida la firma del token</tspan></text><rect x="390" y="126" width="264" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="522" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="522" dy="0">0 de 4</tspan></text><rect x="660" y="126" width="304" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">La petición válida pasa en 4 de 4</tspan></text><rect x="10" y="200" width="960" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="490" y="224.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">El gateway centraliza la autenticación en el borde, pero no sustituye la validación en cada servicio: cualquier camino interno</tspan></text><text x="490" y="241.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">que lo evite hereda la confianza. Defensa en profundidad cuesta una verificación de firma por llamada.</tspan></text><text x="490" y="281.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; los recuentos se repiten y los tiempos varían de un equipo a otro.</tspan></text></svg>
