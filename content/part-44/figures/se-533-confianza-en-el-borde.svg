<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 482" width="940" height="482" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una petición interna falsificada que no pasa por el gateway: cuántos de cuatro servicios la aceptan</title><desc id="d">Barras con los servicios de cuatro que aceptan una petición interna falsificada que salta el gateway: si cada servicio confía en el gateway la aceptan 4 de 4; si cada uno valida la firma HMAC del token la aceptan 0 de 4, y aceptan la petición válida 4 de 4.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="482" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Una petición interna falsificada que no pasa por el gateway: cuántos de cuatro servicios la aceptan</tspan></text><line x1="63.54" y1="307" x2="920" y2="307" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="307" x2="63.54" y2="307" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="311.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">0</tspan></text><line x1="63.54" y1="247" x2="920" y2="247" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="247" x2="63.54" y2="247" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="251.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">1</tspan></text><line x1="63.54" y1="187" x2="920" y2="187" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="187" x2="63.54" y2="187" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="191.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">2</tspan></text><line x1="63.54" y1="127" x2="920" y2="127" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="127" x2="63.54" y2="127" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="131.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">3</tspan></text><line x1="63.54" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="67" x2="63.54" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">4</tspan></text><line x1="63.54" y1="67" x2="63.54" y2="307" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="187" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 187)">Servicios de 4 que la aceptan</text><rect x="106.363" y="67" width="342.584" height="240" rx="3" fill="#c0432f"/><text x="277.655" y="61" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="277.655" dy="0">4</tspan></text><text x="277.655" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="277.655" dy="0">Cada servicio confía en el gateway</tspan></text><rect x="534.593" y="305" width="342.584" height="2" rx="3" fill="#c0432f"/><text x="705.885" y="299" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="705.885" dy="0">0</tspan></text><text x="705.885" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705.885" dy="0">Cada servicio valida la firma del token</tspan></text><rect x="10" y="359" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="383.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Con la validación de firma, la petición válida pasa en 4 de 4; con la confianza en el gateway no hay otra barrera. El</tspan></text><text x="470" y="400.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">gateway centraliza la autenticación en el borde, pero no sustituye la validación en cada servicio: cualquier camino interno</tspan></text><text x="470" y="417.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">que lo evite hereda la confianza. Defensa en profundidad cuesta una verificación de firma por llamada.</tspan></text><text x="470" y="464.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; los recuentos se repiten y los tiempos varían de un equipo a otro.</tspan></text></svg>
