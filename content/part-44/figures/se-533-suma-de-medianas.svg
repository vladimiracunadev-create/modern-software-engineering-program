<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 550" width="940" height="550" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Por qué la suma de medianas no se cumple</title><desc id="d">Barras agrupadas con 20 000 proyectos simulados de doce tareas con mediana de cinco días y suma de medianas de 60 días: con tareas independientes los percentiles 50, 85 y 95 son 70,5, 85,7 y 96,4 días y la probabilidad de terminar en 60 es 19,3 por ciento; con un factor común de dificultad 68,9, 93,4 y 111,7 días y 31,9 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="550" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Por qué la suma de medianas no se cumple</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">p50</tspan></text><rect x="86.62" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="106.62" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="106.62" dy="0">p85</tspan></text><rect x="157.24" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="177.24" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="177.24" dy="0">p95</tspan></text><line x1="78.62" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="375" x2="78.62" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="319" x2="920" y2="319" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="319" x2="78.62" y2="319" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="323.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">25</tspan></text><line x1="78.62" y1="263" x2="920" y2="263" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="263" x2="78.62" y2="263" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="267.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">50</tspan></text><line x1="78.62" y1="207" x2="920" y2="207" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="207" x2="78.62" y2="207" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="211.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">75</tspan></text><line x1="78.62" y1="151" x2="920" y2="151" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="151" x2="78.62" y2="151" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="155.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="95" x2="78.62" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">125</tspan></text><line x1="78.62" y1="95" x2="78.62" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">días del proyecto</text><rect x="120.689" y="217.08" width="109.517" height="157.92" rx="3" fill="#087f8c"/><text x="175.448" y="211.08" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="175.448" dy="0">70,5</tspan></text><rect x="234.206" y="183.032" width="109.517" height="191.968" rx="3" fill="#946512"/><text x="288.965" y="177.032" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="288.965" dy="0">85,7</tspan></text><rect x="347.724" y="159.064" width="109.517" height="215.936" rx="3" fill="#c0432f"/><text x="402.482" y="153.064" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="402.482" dy="0">96,4</tspan></text><text x="288.965" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="288.965" dy="0">Tareas independientes (19,3 % termina en 60 días)</tspan></text><rect x="541.379" y="220.664" width="109.517" height="154.336" rx="3" fill="#087f8c"/><text x="596.138" y="214.664" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="596.138" dy="0">68,9</tspan></text><rect x="654.896" y="165.784" width="109.517" height="209.216" rx="3" fill="#946512"/><text x="709.655" y="159.784" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="709.655" dy="0">93,4</tspan></text><rect x="768.414" y="124.792" width="109.517" height="250.208" rx="3" fill="#c0432f"/><text x="823.172" y="118.792" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="823.172" dy="0">111,7</tspan></text><text x="709.655" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="709.655" dy="0">Con un factor común de dificultad (31,9 %)</tspan></text><line x1="78.62" y1="240.6" x2="920" y2="240.6" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="916" y="234.6" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="916" dy="0">60 d</tspan></text><rect x="10" y="427" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La línea discontinua es la suma de medianas, 60 días. La suma de medianas se cumple una de cada cinco veces con tareas</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">independientes y una de cada tres con un factor común. El factor común no desplaza la mediana, ensancha la cola: el</tspan></text><text x="470" y="485.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">percentil 95 pasa de 96 a 112 días.</tspan></text><text x="470" y="532.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
