<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 534" width="940" height="534" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuánto cuesta decidir a qué nivel</title><desc id="d">Barras agrupadas con el costo trimestral de 200 decisiones durante 3 000 trimestres con 30 por ciento irreversibles: escalar todo cuesta 407 de mediana y 487 en el percentil 90, escalar solo lo irreversible 301,5 y 382, y no escalar nada 369,5 y 463,5.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="534" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuánto cuesta decidir a qué nivel</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Costo trimestral (mediana)</tspan></text><rect x="260.04" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="280.04" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="280.04" dy="0">Costo p90</tspan></text><line x1="78.62" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="375" x2="78.62" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="319" x2="920" y2="319" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="319" x2="78.62" y2="319" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="323.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="263" x2="920" y2="263" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="263" x2="78.62" y2="263" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="267.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">200</tspan></text><line x1="78.62" y1="207" x2="920" y2="207" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="207" x2="78.62" y2="207" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="211.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">300</tspan></text><line x1="78.62" y1="151" x2="920" y2="151" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="151" x2="78.62" y2="151" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="155.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">400</tspan></text><line x1="78.62" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="95" x2="78.62" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">500</tspan></text><line x1="78.62" y1="95" x2="78.62" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">costo trimestral</text><rect x="106.666" y="147.08" width="110.184" height="227.92" rx="3" fill="#087f8c"/><text x="161.758" y="141.08" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="161.758" dy="0">407,0</tspan></text><rect x="220.85" y="102.28" width="110.184" height="272.72" rx="3" fill="#c0432f"/><text x="275.942" y="96.28" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="275.942" dy="0">487,0</tspan></text><text x="218.85" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="218.85" dy="0">Todo se escala</tspan></text><rect x="387.126" y="206.16" width="110.184" height="168.84" rx="3" fill="#087f8c"/><text x="442.218" y="200.16" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="442.218" dy="0">301,5</tspan></text><rect x="501.31" y="161.08" width="110.184" height="213.92" rx="3" fill="#c0432f"/><text x="556.402" y="155.08" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="556.402" dy="0">382,0</tspan></text><text x="499.31" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="499.31" dy="0">Solo se escala lo irreversible</tspan></text><rect x="667.586" y="168.08" width="110.184" height="206.92" rx="3" fill="#087f8c"/><text x="722.678" y="162.08" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="722.678" dy="0">369,5</tspan></text><rect x="781.77" y="115.44" width="110.184" height="259.56" rx="3" fill="#c0432f"/><text x="836.862" y="109.44" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="836.862" dy="0">463,5</tspan></text><text x="779.77" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="779.77" dy="0">Nada se escala</tspan></text><rect x="10" y="427" width="920" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Escalar todo es la política más cara porque paga la espera de las decisiones reversibles; no escalar nada paga los errores</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">de las irreversibles. La política intermedia ahorra una cuarta parte del costo de la peor.</tspan></text><text x="470" y="516.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
