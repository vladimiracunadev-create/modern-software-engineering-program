<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 381" width="980" height="381" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Doce consultas sobre una tabla compartida por cinco inquilinos: cuántas filtran datos ajenos según la protección</title><desc id="d">Tabla con tres estrategias sobre doce consultas: sin protección cuatro consultas devuelven datos ajenos, un linter que busca el filtro por tenant_id en el texto señala tres y no ve la consulta Q12 cuyo filtro se anula con OR, y una vista temporal del inquilino creada en cada solicitud deja cero fugas en las doce consultas sin cambiarlas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="381" fill="#ffffff"/><rect x="10" y="12" width="394" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="207" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="207" dy="0">Estrategia</tspan></text><rect x="410" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="502" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="502" dy="0">Fugas</tspan></text><rect x="600" y="12" width="364" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="782" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="782" dy="0">Detalle</tspan></text><rect x="10" y="56" width="394" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="91.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Consultas sobre la tabla compartida sin protección</tspan></text><rect x="410" y="56" width="184" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">4 de 12</tspan></text><rect x="600" y="56" width="364" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">Q09, Q10, Q11 y Q12</tspan></text><rect x="10" y="126" width="394" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="161.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Linter: busca «tenant_id = ?» en el texto</tspan></text><rect x="410" y="126" width="184" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">Señala 3 de 4</tspan></text><rect x="600" y="126" width="364" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">No ve Q12 (filtro anulado por OR)</tspan></text><rect x="10" y="196" width="394" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Vista temporal del inquilino en cada solicitud</tspan></text><rect x="410" y="196" width="184" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">0 de 12</tspan></text><rect x="600" y="196" width="364" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">Las mismas consultas, sin cambios</tspan></text><rect x="10" y="270" width="960" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="490" y="294.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">La regla «filtrar por inquilino» escrita en cada consulta falla donde un humano la olvida o la anula; una barrera que no depende</tspan></text><text x="490" y="311.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">de la consulta (la vista que tapa el nombre de la tabla) falla solo si alguien usa otra conexión. Doce consultas escritas por el</tspan></text><text x="490" y="328.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">autor, no una muestra de código real.</tspan></text><text x="490" y="367.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; los recuentos se repiten y los tiempos varían de un equipo a otro.</tspan></text></svg>
