<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 307" width="980" height="307" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un inquilino ruidoso a 40 solicitudes por segundo durante 20 s con cuatro trabajadores: espera p95 por política</title><desc id="d">Tabla con dos políticas de planificación: sin ninguna política la espera p95 de los nueve inquilinos normales es 7,96 segundos y la del ruidoso 7,84; con un tope de un trabajador de cuatro para el inquilino ruidoso la espera p95 de los normales baja a 0,16 segundos y la del ruidoso sube a 54,24 segundos; las solicitudes son 1 056 normales y 818 ruidosas en ambos casos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="307" fill="#ffffff"/><rect x="10" y="12" width="414" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="217" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="217" dy="0">Política</tspan></text><rect x="430" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="562" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="562" dy="0">Espera p95 normales (s)</tspan></text><rect x="700" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="832" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="832" dy="0">Espera p95 ruidoso (s)</tspan></text><rect x="10" y="56" width="414" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="90.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Ninguna (cola común)</tspan></text><rect x="430" y="56" width="264" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="90.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">7,96</tspan></text><rect x="700" y="56" width="264" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="90.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">7,84</tspan></text><rect x="10" y="124" width="414" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="158.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Tope de 1 trabajador de 4 para el ruidoso</tspan></text><rect x="430" y="124" width="264" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="158.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">0,16</tspan></text><rect x="700" y="124" width="264" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="158.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">54,24</tspan></text><rect x="10" y="196" width="960" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="490" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">El tope no hace desaparecer la sobrecarga: la traslada a quien la causa. Los inquilinos normales vuelven a 0,16 s y el ruidoso</tspan></text><text x="490" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">espera 54 s. Simulación de eventos con semilla 44; los tiempos de servicio son exponenciales de media 0,1 s, un supuesto del</tspan></text><text x="490" y="254.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">autor.</tspan></text><text x="490" y="293.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Modelo con parámetros del autor y semilla fija 44; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
