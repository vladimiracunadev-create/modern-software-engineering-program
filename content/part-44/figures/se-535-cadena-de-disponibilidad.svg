<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 551" width="940" height="551" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuánto cae una cadena de proveedores</title><desc id="d">Barras agrupadas con los minutos de caída al año de una cadena de proveedores cada uno al 99,9 por ciento: uno da 526 calculados y 536 simulados, tres 1575 y 1572, cinco 2623 y 2615, y cinco con el más débil duplicado 2100 y 2083.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="551" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuánto cae una cadena de proveedores</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Minutos de caída al año (cálculo)</tspan></text><rect x="312.82" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="332.82" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="332.82" dy="0">Minutos de caída (simulado)</tspan></text><line x1="93.7" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="375" x2="93.7" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">0</tspan></text><line x1="93.7" y1="281.667" x2="920" y2="281.667" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="281.667" x2="93.7" y2="281.667" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="286.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1 000</tspan></text><line x1="93.7" y1="188.333" x2="920" y2="188.333" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="188.333" x2="93.7" y2="188.333" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="192.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">2 000</tspan></text><line x1="93.7" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="95" x2="93.7" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">3 000</tspan></text><line x1="93.7" y1="95" x2="93.7" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">minutos de caída al año</text><rect x="114.357" y="325.907" width="80.63" height="49.0933" rx="3" fill="#087f8c"/><text x="154.672" y="319.907" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="154.672" dy="0">526</tspan></text><rect x="198.987" y="324.973" width="80.63" height="50.0267" rx="3" fill="#6b7c86"/><text x="239.302" y="318.973" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="239.302" dy="0">536</tspan></text><text x="196.987" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="196.987" dy="0">1 proveedor (99,900 %)</tspan></text><rect x="320.933" y="228" width="80.63" height="147" rx="3" fill="#087f8c"/><text x="361.248" y="222" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="361.248" dy="0">1 575</tspan></text><rect x="405.562" y="228.28" width="80.63" height="146.72" rx="3" fill="#6b7c86"/><text x="445.877" y="222.28" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="445.877" dy="0">1 572</tspan></text><text x="403.562" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="403.562" dy="0">3 proveedores (99,700 %)</tspan></text><rect x="527.507" y="130.187" width="80.63" height="244.813" rx="3" fill="#087f8c"/><text x="567.822" y="124.187" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="567.822" dy="0">2 623</tspan></text><rect x="612.137" y="130.933" width="80.63" height="244.067" rx="3" fill="#6b7c86"/><text x="652.452" y="124.933" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="652.452" dy="0">2 615</tspan></text><text x="610.137" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="610.137" dy="0">5 proveedores (99,501 %)</tspan></text><rect x="734.082" y="179" width="80.63" height="196" rx="3" fill="#087f8c"/><text x="774.398" y="173" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="774.398" dy="0">2 100</tspan></text><rect x="818.712" y="180.587" width="80.63" height="194.413" rx="3" fill="#6b7c86"/><text x="859.027" y="174.587" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="859.027" dy="0">2 083</tspan></text><text x="816.712" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="816.712" dy="0">5, con el más débil</tspan></text><text x="816.712" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="816.712" dy="0">duplicado (99,600 %)</tspan></text><rect x="10" y="444" width="920" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="468.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Cada proveedor adicional agrega unos 525 minutos de caída esperada, y la cadena de cinco pasa de 8,8 a 43,7 horas al año.</tspan></text><text x="470" y="485.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Duplicar solo el eslabón más débil recupera la quinta parte del daño.</tspan></text><text x="470" y="533.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
