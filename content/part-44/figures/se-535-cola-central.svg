<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 481" width="1000" height="481" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un equipo de datos central de cuatro personas atendiendo a D dominios: espera por solicitud de un conjunto de datos nuevo</title><desc id="d">Tabla con un equipo central de cuatro personas que atiende solicitudes de D dominios, cada uno con 0,15 solicitudes por semana: con 5 dominios la utilización es 19 por ciento y la espera media 0,00 semanas, con 10 es 38 por ciento y 0,03, con 15 es 56 por ciento y 0,14, con 20 es 75 por ciento y 0,53 y con 24 es 90 por ciento y 2,17 semanas; la espera analítica de Erlang C coincide dentro del ruido y el percentil 90 llega a 5,65 semanas con 24 dominios.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="481" fill="#ffffff"/><rect x="10" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="82" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="82" dy="0">Dominios</tspan></text><rect x="160" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="242" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="242" dy="0">Utilización</tspan></text><rect x="330" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="467" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="467" dy="0">Espera media simulada (semanas)</tspan></text><rect x="610" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="707" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="707" dy="0">Espera media analítica</tspan></text><rect x="810" y="12" width="174" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="897" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="897" dy="0">Espera p90 simulada</tspan></text><rect x="10" y="56" width="144" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="87.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">5</tspan></text><rect x="160" y="56" width="164" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="87.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="242" dy="0">19 %</tspan></text><rect x="330" y="56" width="274" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="467" y="87.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">0,00</tspan></text><rect x="610" y="56" width="194" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="707" y="87.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">0,00</tspan></text><rect x="810" y="56" width="174" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="897" y="87.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="897" dy="0">0,00</tspan></text><rect x="10" y="118" width="144" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="149.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">10</tspan></text><rect x="160" y="118" width="164" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="242" dy="0">38 %</tspan></text><rect x="330" y="118" width="274" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="467" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">0,03</tspan></text><rect x="610" y="118" width="194" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="707" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">0,03</tspan></text><rect x="810" y="118" width="174" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="897" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="897" dy="0">0,00</tspan></text><rect x="10" y="180" width="144" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="211.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">15</tspan></text><rect x="160" y="180" width="164" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="211.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="242" dy="0">56 %</tspan></text><rect x="330" y="180" width="274" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="467" y="211.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">0,14</tspan></text><rect x="610" y="180" width="194" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="707" y="211.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">0,14</tspan></text><rect x="810" y="180" width="174" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="897" y="211.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="897" dy="0">0,50</tspan></text><rect x="10" y="242" width="144" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="273.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">20</tspan></text><rect x="160" y="242" width="164" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="273.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="242" dy="0">75 %</tspan></text><rect x="330" y="242" width="274" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="467" y="273.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">0,53</tspan></text><rect x="610" y="242" width="194" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="707" y="273.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">0,51</tspan></text><rect x="810" y="242" width="174" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="897" y="273.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="897" dy="0">1,66</tspan></text><rect x="10" y="304" width="144" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="335.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">24</tspan></text><rect x="160" y="304" width="164" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="335.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="242" dy="0">90 %</tspan></text><rect x="330" y="304" width="274" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="467" y="335.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">2,17</tspan></text><rect x="610" y="304" width="194" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="707" y="335.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">1,97</tspan></text><rect x="810" y="304" width="174" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="897" y="335.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="897" dy="0">5,65</tspan></text><rect x="10" y="370" width="980" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="500" y="394.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">La espera no crece en línea recta: pasar de 20 a 24 dominios (un 20 % más de demanda) multiplica la espera media por cuatro. La</tspan></text><text x="500" y="411.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">simulación coincide con la fórmula de Erlang C hasta el 90 % de utilización, lo que valida la simulación, no el modelo de</tspan></text><text x="500" y="428.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">organización.</tspan></text><text x="500" y="467.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Modelo con parámetros del autor y semilla fija 44; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
