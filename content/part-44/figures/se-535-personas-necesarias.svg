<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 491" width="980" height="491" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Con 20 dominios, personas necesarias para que la espera media no pase de 0,5 semanas según quién es dueño del dato</title><desc id="d">Tabla con las personas necesarias con 20 dominios para que la espera media no pase de 0,5 semanas: un equipo central necesita 5 personas sin penalización de contexto, 6 con penalización 0,5 y 8 con penalización 1,0, y unos equipos por dominio necesitan 10 personas en total con 0,5 persona por dominio, con una espera de 0,87 que no cumple, y 13 con 0,65 persona por dominio.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="491" fill="#ffffff"/><rect x="10" y="12" width="454" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="237" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="237" dy="0">Modelo de propiedad</tspan></text><rect x="470" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="587" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="587" dy="0">Personas en total</tspan></text><rect x="710" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="837" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="837" dy="0">Espera media (semanas)</tspan></text><rect x="10" y="56" width="454" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="237" y="88.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="237" dy="0">Equipo central, sin penalización de contexto</tspan></text><rect x="470" y="56" width="234" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587" y="88.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587" dy="0">5 personas</tspan></text><rect x="710" y="56" width="254" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="88.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">0,12</tspan></text><rect x="10" y="120" width="454" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="237" y="152.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="237" dy="0">Equipo central, penalización 0,5</tspan></text><rect x="470" y="120" width="234" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587" y="152.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587" dy="0">6 personas</tspan></text><rect x="710" y="120" width="254" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="152.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">0,44</tspan></text><rect x="10" y="184" width="454" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="237" y="216.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="237" dy="0">Equipo central, penalización 1,0</tspan></text><rect x="470" y="184" width="234" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587" y="216.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587" dy="0">8 personas</tspan></text><rect x="710" y="184" width="254" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="216.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">0,38</tspan></text><rect x="10" y="248" width="454" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="237" y="280.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="237" dy="0">Un equipo por dominio, 0,5 persona cada uno</tspan></text><rect x="470" y="248" width="234" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587" y="280.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587" dy="0">10 personas</tspan></text><rect x="710" y="248" width="254" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="280.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">0,87</tspan></text><rect x="10" y="312" width="454" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="237" y="344.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="237" dy="0">Un equipo por dominio, 0,65 persona cada uno</tspan></text><rect x="470" y="312" width="234" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587" y="344.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587" dy="0">13 personas</tspan></text><rect x="710" y="312" width="254" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="344.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">0,47</tspan></text><rect x="10" y="380" width="960" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="490" y="404.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">En este modelo la propiedad por dominio no ahorra personas: mueve el trabajo y necesita más. Lo que compra es que el conocimiento</tspan></text><text x="490" y="421.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">del dominio deje de ser una penalización del equipo central y que el producto de datos tenga un dueño. La penalización de</tspan></text><text x="490" y="438.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">contexto es un supuesto del autor.</tspan></text><text x="490" y="477.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Modelo con parámetros del autor y semilla fija 44; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
