<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 359" width="980" height="359" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Costo de repartir 1 000 inquilinos en 8 celdas frente a una flota compartida: capacidad, disponibilidad y punto de fallo</title><desc id="d">Tabla con tres comparaciones entre una flota compartida y ocho celdas: la capacidad para cubrir el percentil 99 de la carga es 1 824 unidades frente a 2 184, un 19,8 por ciento más, la disponibilidad de un inquilino es la de la flota frente a 99,890 por ciento con el enrutador al 99,99 y la celda al 99,9, y el punto de fallo compartido es la flota entera frente al enrutador.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="359" fill="#ffffff"/><rect x="10" y="12" width="364" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="192" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="192" dy="0">Comparación</tspan></text><rect x="380" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="517" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="517" dy="0">Flota compartida</tspan></text><rect x="660" y="12" width="304" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="812" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="812" dy="0">Ocho celdas</tspan></text><rect x="10" y="56" width="364" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="90.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Capacidad para cubrir el p99 de la carga</tspan></text><rect x="380" y="56" width="274" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="517" y="90.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517" dy="0">1 824 unidades</tspan></text><rect x="660" y="56" width="304" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="90.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">2 184 unidades (19,8 % más)</tspan></text><rect x="10" y="124" width="364" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="158.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Disponibilidad de un inquilino</tspan></text><rect x="380" y="124" width="274" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="517" y="158.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517" dy="0">99,9 % de la flota</tspan></text><rect x="660" y="124" width="304" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="158.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">99,890 % (enrutador por celda)</tspan></text><rect x="10" y="192" width="364" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="226.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Punto de fallo compartido</tspan></text><rect x="380" y="192" width="274" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="517" y="226.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517" dy="0">La flota entera</tspan></text><rect x="660" y="192" width="304" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="226.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">El enrutador</tspan></text><rect x="10" y="264" width="960" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="490" y="288.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Repartir cuesta capacidad (cada celda se dimensiona a su propio p99, y los picos no se compensan entre celdas) y mueve el punto</tspan></text><text x="490" y="305.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">de fallo al enrutador. La carga de cada inquilino es lognormal con semilla 44; una carga real tiene otra forma.</tspan></text><text x="490" y="345.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Modelo con parámetros del autor y semilla fija 44; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
