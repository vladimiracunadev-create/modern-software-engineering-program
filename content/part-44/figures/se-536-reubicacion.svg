<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 363" width="980" height="363" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Pasar de 8 a 9 celdas con 100 000 inquilinos: cuántos cambian de celda según la función de asignación</title><desc id="d">Tabla con tres funciones de asignación al pasar de 8 a 9 celdas con 100 000 inquilinos: el módulo del hash reubica 88 985 inquilinos, un 89,0 por ciento, el hash por encuentro reubica 11 176, un 11,2 por ciento, y el mínimo teórico es un noveno, 11,1 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="363" fill="#ffffff"/><rect x="10" y="12" width="424" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="222" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="222" dy="0">Función de asignación</tspan></text><rect x="440" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="577" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="577" dy="0">Inquilinos reubicados</tspan></text><rect x="720" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="842" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="842" dy="0">Proporción</tspan></text><rect x="10" y="56" width="424" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="88.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Módulo del hash (h mod n)</tspan></text><rect x="440" y="56" width="274" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="88.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">88 985</tspan></text><rect x="720" y="56" width="244" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="88.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">89,0 %</tspan></text><rect x="10" y="120" width="424" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="152.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Hash por encuentro (rendezvous)</tspan></text><rect x="440" y="120" width="274" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="152.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">11 176</tspan></text><rect x="720" y="120" width="244" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="152.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">11,2 %</tspan></text><rect x="10" y="184" width="424" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="216.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Mínimo teórico (1/9)</tspan></text><rect x="440" y="184" width="274" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="216.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">11 111</tspan></text><rect x="720" y="184" width="244" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="216.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">11,1 %</tspan></text><rect x="10" y="252" width="960" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="490" y="276.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">Con el módulo, añadir una celda mueve casi todo; con el hash por encuentro solo se mueve lo que la celda nueva se queda. Mover un</tspan></text><text x="490" y="293.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">inquilino es una migración de datos, de modo que la función de asignación decide el costo de crecer. El reparto entre las 8</tspan></text><text x="490" y="310.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">celdas fue de 12 339 a 12 713 inquilinos por celda.</tspan></text><text x="490" y="349.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; los recuentos se repiten y los tiempos varían de un equipo a otro.</tspan></text></svg>
