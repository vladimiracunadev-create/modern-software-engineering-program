<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 587" width="940" height="587" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuándo un proyecto deja de ser el mejor</title><desc id="d">Líneas con el valor actual neto de tres proyectos con inversión de 100 según la tasa de descuento: la plataforma interna es la mejor con 5 y 10 por ciento (88,0 y 49,0) y la peor con 20 y 30 (−3,5 y −35,4); automatizar el cierre pasa de 43,2 a −8,6 y rediseñar el módulo de 74,3 a −19,7, con lo que el orden se invierte.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="587" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuándo un proyecto deja de ser el mejor</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Plataforma interna</tspan></text><rect x="199.72" y="45" width="12" height="12" fill="#946512" stroke="#946512" stroke-width="2"/><text x="219.72" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="219.72" dy="0">Rediseñar el módulo</tspan></text><polygon points="396.98,44.1 403.58,56.4 390.38,56.4" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="410.98" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="410.98" dy="0">Automatizar el cierre</tspan></text><line x1="78.62" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="387" x2="78.62" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">−40</tspan></text><line x1="78.62" y1="312" x2="910" y2="312" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="312" x2="78.62" y2="312" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="316.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="237" x2="910" y2="237" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="237" x2="78.62" y2="237" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">40</tspan></text><line x1="78.62" y1="162" x2="910" y2="162" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="162" x2="78.62" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="166.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">80</tspan></text><line x1="78.62" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="87" x2="78.62" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">120</tspan></text><line x1="78.62" y1="87" x2="78.62" y2="387" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="87" x2="96.62" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="387" x2="96.62" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">5 %</tspan></text><line x1="255.696" y1="87" x2="255.696" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="255.696" y1="387" x2="255.696" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="255.696" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="255.696" dy="0">10 %</tspan></text><line x1="573.848" y1="87" x2="573.848" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="573.848" y1="387" x2="573.848" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="573.848" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="573.848" dy="0">20 %</tspan></text><line x1="892" y1="87" x2="892" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="387" x2="892" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">30 %</tspan></text><line x1="78.62" y1="387" x2="910" y2="387" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 237)">Valor actual neto</text><text x="494.31" y="433" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Tasa de descuento (%)</tspan></text><polyline points="96.62,147 255.696,220.125 573.848,318.562 892,378.375" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="96.62" cy="147" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="106.62" y="151.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="106.62" dy="0">88,0</tspan></text><circle cx="255.696" cy="220.125" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><circle cx="573.848" cy="318.562" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><circle cx="892" cy="378.375" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="882" y="382.875" font-size="13" text-anchor="end" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="882" dy="0">−35,4</tspan></text><polyline points="96.62,172.688 255.696,225.188 573.848,299.812 892,348.938" fill="none" stroke="#946512" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="91.12" y="167.188" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="106.62" y="177.188" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="106.62" dy="0">74,3</tspan></text><rect x="250.196" y="219.688" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><rect x="568.348" y="294.312" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><rect x="886.5" y="343.438" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="882" y="353.438" font-size="13" text-anchor="end" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="882" dy="0">−19,7</tspan></text><polyline points="96.62,231 255.696,257.25 573.848,298.125 892,328.125" fill="none" stroke="#087f8c" stroke-width="2.4"/><polygon points="96.62,224.675 102.67,235.95 90.57,235.95" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="96.62" y="255" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">43,2</tspan></text><polygon points="255.696,250.925 261.746,262.2 249.646,262.2" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="255.696" y="281.25" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="255.696" dy="0">29,2</tspan></text><polygon points="573.848,291.8 579.898,303.075 567.798,303.075" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polygon points="892,321.8 898.05,333.075 885.95,333.075" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="317.125" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">−8,6</tspan></text><rect x="10" y="447" width="920" height="92.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Valores con 10 % y 20 %: plataforma interna 49,0 y −3,5; rediseñar el módulo 46,3 y 6,5; automatizar el cierre 29,2 y 7,4.</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Suma sin descontar: 60, 110 y 140. TIR: 24,3 %, 22,1 % y 19,1 %; recuperación: año 2, año 4 y año 5. A tasas del 5 % y del</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">10 %, la plataforma interna es la mejor por VAN; a partir del 20 % pasa a ser la peor y el primero es «Automatizar el</tspan></text><text x="470" y="521.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">cierre». La suma sin descontar y el VAN a tasa baja favorecen lo tardío; la TIR y la recuperación favorecen lo temprano.</tspan></text><text x="470" y="569.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
