<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 362" width="940" height="362" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Módulo heredado y módulo nuevo ejecutados sobre las mismas 20 000 peticiones: divergencias por causa</title><desc id="d">Barras horizontales con las divergencias entre un módulo de avisos heredado y su reemplazo sobre 20000 peticiones sintéticas: 145 por redondeo en el borde, 57 por el plazo de extensión que el módulo nuevo olvidó y 1 por cambio de hora, 203 en total, un 1,01 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="362" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Módulo heredado y módulo nuevo ejecutados sobre las mismas 20 000 peticiones: divergencias por causa</tspan></text><line x1="364" y1="49" x2="364" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="364" y1="181" x2="364" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="364" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="364" dy="0">0</tspan></text><line x1="539.94" y1="49" x2="539.94" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="539.94" y1="181" x2="539.94" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="539.94" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="539.94" dy="0">50</tspan></text><line x1="715.88" y1="49" x2="715.88" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="715.88" y1="181" x2="715.88" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="715.88" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="715.88" dy="0">100</tspan></text><line x1="891.82" y1="49" x2="891.82" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="891.82" y1="181" x2="891.82" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="891.82" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="891.82" dy="0">150</tspan></text><line x1="364" y1="181" x2="891.82" y2="181" stroke="#5b7280" stroke-width="1.6"/><text x="354" y="67" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="354" dy="0">Redondeo en el borde, el módulo nuevo trunca</tspan></text><text x="354" y="84" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="354" dy="0">minutos (71,4 %)</tspan></text><text x="354" y="111" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="354" dy="0">Plazo de extensión, el módulo nuevo lo olvidó</tspan></text><text x="354" y="128" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="354" dy="0">(28,1 %)</tspan></text><text x="354" y="163.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="354" dy="0">Cambio de hora, solo 2 días al año (0,5 %)</tspan></text><rect x="364" y="55" width="510.226" height="32" rx="3" fill="#102a43"/><text x="881.226" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="881.226" dy="0">145</tspan></text><rect x="364" y="99" width="200.572" height="32" rx="3" fill="#102a43"/><text x="571.572" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="571.572" dy="0">57</tspan></text><rect x="364" y="143" width="3.5188" height="32" rx="3" fill="#102a43"/><text x="374.519" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="374.519" dy="0">1</tspan></text><text x="627.91" y="225" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="627.91" dy="0">Divergencias (203 en total)</tspan></text><rect x="10" y="239" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="263.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Entre paréntesis, la proporción de las divergencias. Tres defectos sembrados por el autor, con frecuencias tan distintas</tspan></text><text x="470" y="280.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">como 145, 57 y 1. Ejecutar los dos módulos en paralelo y comparar las salidas es la forma más barata de encontrar lo que</tspan></text><text x="470" y="297.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ninguna prueba imaginó, pero solo encuentra lo que el tráfico real contiene.</tspan></text><text x="470" y="344.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 44; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
