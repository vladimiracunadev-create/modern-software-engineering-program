<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 404" width="940" height="404" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué eligen las entrevistas</title><desc id="d">Barras horizontales con la fracción de lo alcanzable que logra cada procedimiento de selección entre 10 candidaturas: una conversación libre 61,6 por ciento, tres libres 71,2, una entrevista estructurada 80,9, tres estructuradas 91,1 y elegir al azar 0, con habilidad media de la persona elegida de 0,95, 1,10, 1,25, 1,41 y 0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="404" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué eligen las entrevistas</tspan></text><line x1="354" y1="49" x2="354" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="239" x2="354" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="486.44" y1="49" x2="486.44" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="486.44" y1="239" x2="486.44" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="486.44" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="486.44" dy="0">25</tspan></text><line x1="618.88" y1="49" x2="618.88" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="618.88" y1="239" x2="618.88" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="618.88" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="618.88" dy="0">50</tspan></text><line x1="751.32" y1="49" x2="751.32" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="751.32" y1="239" x2="751.32" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="751.32" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="751.32" dy="0">75</tspan></text><line x1="883.76" y1="49" x2="883.76" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="883.76" y1="239" x2="883.76" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="883.76" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="883.76" dy="0">100</tspan></text><line x1="354" y1="239" x2="883.76" y2="239" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Una conversación libre (habilidad 0,95)</tspan></text><text x="344" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Tres conversaciones libres (1,10)</tspan></text><text x="344" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Una entrevista estructurada (1,25)</tspan></text><text x="344" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Tres entrevistas estructuradas (1,41)</tspan></text><text x="344" y="224.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Al azar (0,00)</tspan></text><rect x="354" y="55" width="326.332" height="26" rx="3" fill="#087f8c"/><text x="687.332" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="687.332" dy="0">61,6</tspan></text><rect x="354" y="93" width="377.189" height="26" rx="3" fill="#087f8c"/><text x="738.189" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="738.189" dy="0">71,2</tspan></text><rect x="354" y="131" width="428.576" height="26" rx="3" fill="#087f8c"/><text x="789.576" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="789.576" dy="0">80,9</tspan></text><rect x="354" y="169" width="482.611" height="26" rx="3" fill="#087f8c"/><text x="843.611" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="843.611" dy="0">91,1</tspan></text><rect x="354" y="207" width="2" height="26" rx="3" fill="#087f8c"/><text x="363" y="224.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0,0</tspan></text><text x="618.88" y="283" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="618.88" dy="0">% de la habilidad de la mejor candidatura</tspan></text><rect x="10" y="297" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="321.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Entre paréntesis, la habilidad media de la persona elegida. Añadir entrevistadoras ayuda, pero menos que estructurar: una</tspan></text><text x="470" y="338.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">estructurada (80,9 %) supera a tres libres (71,2 %), porque el halo compartido no se promedia.</tspan></text><text x="470" y="386.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
