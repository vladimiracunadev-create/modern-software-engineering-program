<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 481" width="980" height="481" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un defecto visible en 0,4 % de las peticiones con 20 000 peticiones por escalón: usuarios afectados y probabilidad de detectarlo</title><desc id="d">Tabla con cinco escalones de tráfico para un defecto que afecta al 0,4 por ciento de las peticiones: con 1 por ciento hay 0,8 afectados esperados y 4,7 por ciento de probabilidad de ver al menos 3 errores, con 5 por ciento hay 4,0 y 76,2 por ciento, con 25 por ciento hay 20,0 y 100 por ciento, con 50 por ciento 40,0 y con 100 por ciento 80,0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="481" fill="#ffffff"/><rect x="10" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="142" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="142" dy="0">Escalón de tráfico</tspan></text><rect x="280" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="442" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="442" dy="0">Usuarios afectados esperados</tspan></text><rect x="610" y="12" width="354" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="787" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="787" dy="0">Probabilidad de ver al menos 3 errores</tspan></text><rect x="10" y="56" width="264" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="87.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">1 %</tspan></text><rect x="280" y="56" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="87.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">0,8</tspan></text><rect x="610" y="56" width="354" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="87.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">4,7 %</tspan></text><rect x="10" y="118" width="264" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="149.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">5 %</tspan></text><rect x="280" y="118" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">4,0</tspan></text><rect x="610" y="118" width="354" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">76,2 %</tspan></text><rect x="10" y="180" width="264" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="211.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">25 %</tspan></text><rect x="280" y="180" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="211.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">20,0</tspan></text><rect x="610" y="180" width="354" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="211.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">100,0 %</tspan></text><rect x="10" y="242" width="264" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="273.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">50 %</tspan></text><rect x="280" y="242" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="273.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">40,0</tspan></text><rect x="610" y="242" width="354" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="273.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">100,0 %</tspan></text><rect x="10" y="304" width="264" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="335.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">100 %</tspan></text><rect x="280" y="304" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="335.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">80,0</tspan></text><rect x="610" y="304" width="354" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="335.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">100,0 %</tspan></text><rect x="10" y="370" width="960" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="490" y="394.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">Un escalón demasiado pequeño no detecta y uno demasiado grande daña: con 1 % no se alcanza a ver el defecto (4,7 %) y con 5 % se</tspan></text><text x="490" y="411.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">ve tres de cada cuatro veces afectando a unos 4 usuarios. Si el 5 % lo detiene, el daño acumulado es de 4,8 usuarios frente a 80</tspan></text><text x="490" y="428.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">si se cambia de golpe.</tspan></text><text x="490" y="467.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Modelo con parámetros del autor y semilla fija 44; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
