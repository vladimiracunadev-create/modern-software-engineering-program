<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué dice la confianza declarada</title><desc id="d">Líneas con el acierto observado según la confianza declarada de 500 pronósticos de cada una de tres personas: la calibrada (Brier 0,175) acierta 94,4 por ciento cuando declara 95, la sobreconfiada (Brier 0,249) 74,4, y la que declara siempre 95 por ciento (Brier 0,317) acierta 65 por ciento, lejos de la diagonal de calibración perfecta.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué dice la confianza declarada</tspan></text><circle cx="22" cy="51" r="6" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Calibración perfecta</tspan></text><rect x="214.8" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="234.8" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="234.8" dy="0">Calibrada (Brier 0,175)</tspan></text><polygon points="442.22,44.1 448.82,56.4 435.62,56.4" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="456.22" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="456.22" dy="0">Sobreconfiada (Brier 0,249)</tspan></text><polygon points="693.8,43.5 701.3,51 693.8,58.5 686.3,51" fill="#946512" stroke="#946512" stroke-width="2"/><text x="707.8" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="707.8" dy="0">Siempre 95 % (Brier 0,317)</tspan></text><line x1="78.62" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="387" x2="78.62" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">40</tspan></text><line x1="78.62" y1="337" x2="910" y2="337" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="337" x2="78.62" y2="337" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="341.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">50</tspan></text><line x1="78.62" y1="287" x2="910" y2="287" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="287" x2="78.62" y2="287" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="291.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">60</tspan></text><line x1="78.62" y1="237" x2="910" y2="237" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="237" x2="78.62" y2="237" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">70</tspan></text><line x1="78.62" y1="187" x2="910" y2="187" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="187" x2="78.62" y2="187" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="191.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">80</tspan></text><line x1="78.62" y1="137" x2="910" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="137" x2="78.62" y2="137" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="141.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">90</tspan></text><line x1="78.62" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="87" x2="78.62" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="87" x2="78.62" y2="387" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="87" x2="96.62" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="387" x2="96.62" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">55</tspan></text><line x1="295.465" y1="87" x2="295.465" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="295.465" y1="387" x2="295.465" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="295.465" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="295.465" dy="0">65</tspan></text><line x1="494.31" y1="87" x2="494.31" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="494.31" y1="387" x2="494.31" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="494.31" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="494.31" dy="0">75</tspan></text><line x1="693.155" y1="87" x2="693.155" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="693.155" y1="387" x2="693.155" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="693.155" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="693.155" dy="0">85</tspan></text><line x1="892" y1="87" x2="892" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="387" x2="892" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">95</tspan></text><line x1="78.62" y1="387" x2="910" y2="387" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 237)">Acierto observado (%)</text><text x="494.31" y="433" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Confianza declarada (%)</tspan></text><polyline points="96.62,312 295.465,262 494.31,212 693.155,162 892,112" fill="none" stroke="#6b7c86" stroke-width="2.4"/><circle cx="96.62" cy="312" r="5.5" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><circle cx="295.465" cy="262" r="5.5" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><circle cx="494.31" cy="212" r="5.5" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><circle cx="693.155" cy="162" r="5.5" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><circle cx="892" cy="112" r="5.5" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><polyline points="96.62,319.5 295.465,218.5 494.31,242 693.155,173.5 892,115" fill="none" stroke="#087f8c" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="91.12" y="314" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="96.62" y="308.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">53,5</tspan></text><rect x="289.965" y="213" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="295.465" y="207.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="295.465" dy="0">73,7</tspan></text><rect x="488.81" y="236.5" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="494.31" y="231" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="494.31" dy="0">69,0</tspan></text><rect x="687.655" y="168" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="693.155" y="162.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="693.155" dy="0">82,7</tspan></text><rect x="886.5" y="109.5" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="104" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">94,4</tspan></text><polyline points="96.62,334.5 295.465,238.5 494.31,302 693.155,259.5 892,215" fill="none" stroke="#c0432f" stroke-width="2.4"/><polygon points="96.62,328.175 102.67,339.45 90.57,339.45" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="96.62" y="358.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">50,5</tspan></text><polygon points="295.465,232.175 301.515,243.45 289.415,243.45" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="295.465" y="262.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="295.465" dy="0">69,7</tspan></text><polygon points="494.31,295.675 500.36,306.95 488.26,306.95" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="494.31" y="326" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="494.31" dy="0">57,0</tspan></text><polygon points="693.155,253.175 699.205,264.45 687.105,264.45" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="693.155" y="283.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="693.155" dy="0">65,5</tspan></text><polygon points="892,208.675 898.05,219.95 885.95,219.95" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="239" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">74,4</tspan></text><polyline points="892,262" fill="none" stroke="#946512" stroke-width="2.4" stroke-dasharray="7 4"/><polygon points="892,255.125 898.875,262 892,268.875 885.125,262" fill="#946512" stroke="#946512" stroke-width="2"/><text x="892" y="286" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">65,0</tspan></text><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">La línea gris es la calibración perfecta: acierta lo que declara. La calibrada declara 95 % y acierta alrededor de 94 %; la</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">sobreconfiada, con la misma declaración, acierta 74 %. La diferencia es invisible mientras nadie contrasta las</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">probabilidades con los resultados.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
