<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 533" width="940" height="533" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una función de aptitud de capas sobre un paquete de juguete: violaciones y ciclos que detecta en cuatro variantes</title><desc id="d">Barras agrupadas con las violaciones de capa y los ciclos que detecta una prueba de arquitectura sobre cuatro variantes de un paquete: la limpia no tiene ninguno y pasa; cuando el dominio importa la infraestructura hay 1 violación y 1 ciclo y falla; cuando dos módulos de aplicación se importan entre sí hay 0 violaciones y 1 ciclo y falla; una importación dinámica no se detecta y pasa.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="533" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Una función de aptitud de capas sobre un paquete de juguete: violaciones y ciclos que detecta en cuatro</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">variantes</tspan></text><rect x="16" y="64" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Violaciones de capa</tspan></text><rect x="207.26" y="64" width="12" height="12" rx="2" fill="#946512"/><text x="227.26" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="227.26" dy="0">Ciclos</tspan></text><line x1="354" y1="96" x2="354" y2="352" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="352" x2="354" y2="357" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="373" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="464.788" y1="96" x2="464.788" y2="352" stroke="#d5dde1" stroke-width="1"/><line x1="464.788" y1="352" x2="464.788" y2="357" stroke="#5b7280" stroke-width="1.4"/><text x="464.788" y="373" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="464.788" dy="0">0,2</tspan></text><line x1="575.576" y1="96" x2="575.576" y2="352" stroke="#d5dde1" stroke-width="1"/><line x1="575.576" y1="352" x2="575.576" y2="357" stroke="#5b7280" stroke-width="1.4"/><text x="575.576" y="373" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="575.576" dy="0">0,4</tspan></text><line x1="686.364" y1="96" x2="686.364" y2="352" stroke="#d5dde1" stroke-width="1"/><line x1="686.364" y1="352" x2="686.364" y2="357" stroke="#5b7280" stroke-width="1.4"/><text x="686.364" y="373" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="686.364" dy="0">0,6</tspan></text><line x1="797.152" y1="96" x2="797.152" y2="352" stroke="#d5dde1" stroke-width="1"/><line x1="797.152" y1="352" x2="797.152" y2="357" stroke="#5b7280" stroke-width="1.4"/><text x="797.152" y="373" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797.152" dy="0">0,8</tspan></text><line x1="907.94" y1="96" x2="907.94" y2="352" stroke="#d5dde1" stroke-width="1"/><line x1="907.94" y1="352" x2="907.94" y2="357" stroke="#5b7280" stroke-width="1.4"/><text x="907.94" y="373" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907.94" dy="0">1</tspan></text><line x1="354" y1="352" x2="907.94" y2="352" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="132.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Limpia (pasa)</tspan></text><text x="344" y="196.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">El dominio importa la infraestructura (falla)</tspan></text><text x="344" y="252" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Dos módulos de aplicación se importan entre</tspan></text><text x="344" y="269" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">sí (falla)</tspan></text><text x="344" y="316" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Importación dinámica de la infraestructura</tspan></text><text x="344" y="333" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">(pasa, no la ve)</tspan></text><rect x="354" y="102" width="2" height="24.5" rx="3" fill="#c0432f"/><text x="363" y="118.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="129.5" width="2" height="24.5" rx="3" fill="#946512"/><text x="363" y="146.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="166" width="553.94" height="24.5" rx="3" fill="#c0432f"/><text x="914.94" y="182.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="914.94" dy="0">1</tspan></text><rect x="354" y="193.5" width="553.94" height="24.5" rx="3" fill="#946512"/><text x="914.94" y="210.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="914.94" dy="0">1</tspan></text><rect x="354" y="230" width="2" height="24.5" rx="3" fill="#c0432f"/><text x="363" y="246.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="257.5" width="553.94" height="24.5" rx="3" fill="#946512"/><text x="914.94" y="274.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="914.94" dy="0">1</tspan></text><rect x="354" y="294" width="2" height="24.5" rx="3" fill="#c0432f"/><text x="363" y="310.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="321.5" width="2" height="24.5" rx="3" fill="#946512"/><text x="363" y="338.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><text x="630.97" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="630.97" dy="0">Violaciones o ciclos detectados</tspan></text><rect x="10" y="410" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="434.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">La última variante tiene una violación real que la prueba no ve. La prueba corre en unos 10 a 40 ms y detecta lo que está</tspan></text><text x="470" y="451.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">escrito como importación; una importación por nombre en una cadena la elude. Una función de aptitud protege una decisión</tspan></text><text x="470" y="468.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">contra la deriva solo en la medida en que su mecanismo ve la forma en que se rompe.</tspan></text><text x="470" y="515.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; los recuentos se repiten y los tiempos varían de un equipo a otro.</tspan></text></svg>
