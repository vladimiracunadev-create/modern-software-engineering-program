<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 443" width="980" height="443" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una función de aptitud de capas sobre un paquete de juguete: violaciones y ciclos que detecta en cuatro variantes</title><desc id="d">Tabla con una prueba de arquitectura basada en el árbol sintáctico sobre cuatro variantes de un paquete: la limpia no tiene violaciones ni ciclos y pasa, cuando el dominio importa la infraestructura hay 1 violación de capa y 1 ciclo y falla, cuando dos módulos de aplicación se importan entre sí hay 0 violaciones y 1 ciclo y falla, y una importación dinámica de la infraestructura no se detecta y pasa.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="443" fill="#ffffff"/><rect x="10" y="12" width="424" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="222" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="222" dy="0">Variante del paquete</tspan></text><rect x="440" y="12" width="174" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="527" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="527" dy="0">Violaciones de capa</tspan></text><rect x="620" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="682" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="682" dy="0">Ciclos</tspan></text><rect x="750" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="857" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="857" dy="0">Resultado</tspan></text><rect x="10" y="56" width="424" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="90.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Limpia</tspan></text><rect x="440" y="56" width="174" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="90.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">0</tspan></text><rect x="620" y="56" width="124" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="90.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">0</tspan></text><rect x="750" y="56" width="214" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="857" y="90.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">Pasa</tspan></text><rect x="10" y="124" width="424" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="158.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">El dominio importa la infraestructura</tspan></text><rect x="440" y="124" width="174" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="158.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">1</tspan></text><rect x="620" y="124" width="124" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="158.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">1</tspan></text><rect x="750" y="124" width="214" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="857" y="158.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">Falla</tspan></text><rect x="10" y="192" width="424" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="226.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Dos módulos de aplicación se importan entre sí</tspan></text><rect x="440" y="192" width="174" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="226.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">0</tspan></text><rect x="620" y="192" width="124" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="226.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">1</tspan></text><rect x="750" y="192" width="214" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="857" y="226.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">Falla</tspan></text><rect x="10" y="260" width="424" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="294.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Importación dinámica de la infraestructura</tspan></text><rect x="440" y="260" width="174" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="294.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">0</tspan></text><rect x="620" y="260" width="124" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="294.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">0</tspan></text><rect x="750" y="260" width="214" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="857" y="294.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">Pasa (no la ve)</tspan></text><rect x="10" y="332" width="960" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="490" y="356.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">La prueba corre en unos 10 a 40 ms y detecta lo que está escrito como importación; una importación por nombre en una cadena la</tspan></text><text x="490" y="373.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">elude. Una función de aptitud protege una decisión contra la deriva solo en la medida en que su mecanismo ve la forma en que se</tspan></text><text x="490" y="390.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">rompe.</tspan></text><text x="490" y="429.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; los recuentos se repiten y los tiempos varían de un equipo a otro.</tspan></text></svg>
