<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 630" width="940" height="630" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un linter de once criterios sobre tres ADR: el completo, el que justifica con una moda y el que olvida su reversibilidad</title><desc id="d">Mapa de calor con once criterios aplicados a tres registros de decisión: el ADR-A, monolito modular con disparador de revisión, cumple 11 de 11; el ADR-B, que dice usar microservicios porque son la mejor práctica, cumple 3 de 11 y le faltan alternativas, reversibilidad, disparador, evidencia, consecuencias negativas y criterio medible; el ADR-C, celdas para el cliente grande, cumple 8 de 11 y le faltan la reversibilidad, el disparador y su criterio numérico.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="630" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un linter de once criterios sobre tres ADR: el completo, el que justifica con una moda y el que olvida su</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">reversibilidad</tspan></text><text x="423.333" y="79" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="423.333" dy="0">ADR-A</tspan></text><text x="622" y="79" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="622" dy="0">ADR-B</tspan></text><text x="820.667" y="79" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="820.667" dy="0">ADR-C</tspan></text><text x="314" y="112.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Sección Contexto</tspan></text><text x="314" y="146.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Sección Decisión</tspan></text><text x="314" y="180.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Sección Alternativas</tspan></text><text x="314" y="214.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Sección Consecuencias</tspan></text><text x="314" y="248.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Sección Reversibilidad</tspan></text><text x="314" y="282.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Sección Disparador de revisión</tspan></text><text x="314" y="316.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Sección Evidencia</tspan></text><text x="314" y="350.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Al menos 2 alternativas con motivo</tspan></text><text x="314" y="384.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Consecuencia negativa declarada</tspan></text><text x="314" y="418.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Criterio medible</tspan></text><text x="314" y="452.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Disparador numérico</tspan></text><rect x="325.5" y="92.5" width="195.667" height="31" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="423.333" y="112.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="423.333" dy="0">cumple</tspan></text><rect x="524.167" y="92.5" width="195.667" height="31" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="622" y="112.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="622" dy="0">cumple</tspan></text><rect x="722.833" y="92.5" width="195.667" height="31" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="820.667" y="112.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="820.667" dy="0">cumple</tspan></text><rect x="325.5" y="126.5" width="195.667" height="31" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="423.333" y="146.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="423.333" dy="0">cumple</tspan></text><rect x="524.167" y="126.5" width="195.667" height="31" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="622" y="146.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="622" dy="0">cumple</tspan></text><rect x="722.833" y="126.5" width="195.667" height="31" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="820.667" y="146.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="820.667" dy="0">cumple</tspan></text><rect x="325.5" y="160.5" width="195.667" height="31" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="423.333" y="180.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="423.333" dy="0">cumple</tspan></text><rect x="524.167" y="160.5" width="195.667" height="31" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="622" y="180.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="622" dy="0">falta</tspan></text><rect x="722.833" y="160.5" width="195.667" height="31" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="820.667" y="180.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="820.667" dy="0">cumple</tspan></text><rect x="325.5" y="194.5" width="195.667" height="31" rx="4" fill="#087f8c" str