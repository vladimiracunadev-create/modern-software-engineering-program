rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="820.667" y="282.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="820.667" dy="0">falta</tspan></text><rect x="325.5" y="296.5" width="195.667" height="31" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="423.333" y="316.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="423.333" dy="0">cumple</tspan></text><rect x="524.167" y="296.5" width="195.667" height="31" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="622" y="316.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="622" dy="0">falta</tspan></text><rect x="722.833" y="296.5" width="195.667" height="31" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="820.667" y="316.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="820.667" dy="0">cumple</tspan></text><rect x="325.5" y="330.5" width="195.667" height="31" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="423.333" y="350.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="423.333" dy="0">cumple</tspan></text><rect x="524.167" y="330.5" width="195.667" height="31" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="622" y="350.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="622" dy="0">falta</tspan></text><rect x="722.833" y="330.5" width="195.667" height="31" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="820.667" y="350.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="820.667" dy="0">cumple</tspan></text><rect x="325.5" y="364.5" width="195.667" height="31" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="423.333" y="384.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="423.333" dy="0">cumple</tspan></text><rect x="524.167" y="364.5" width="195.667" height="31" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="622" y="384.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="622" dy="0">falta</tspan></text><rect x="722.833" y="364.5" width="195.667" height="31" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="820.667" y="384.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="820.667" dy="0">cumple</tspan></text><rect x="325.5" y="398.5" width="195.667" height="31" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="423.333" y="418.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="423.333" dy="0">cumple</tspan></text><rect x="524.167" y="398.5" width="195.667" height="31" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="622" y="418.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="622" dy="0">falta</tspan></text><rect x="722.833" y="398.5" width="195.667" height="31" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="820.667" y="418.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="820.667" dy="0">cumple</tspan></text><rect x="325.5" y="432.5" width="195.667" height="31" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="423.333" y="452.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="423.333" dy="0">cumple</tspan></text><rect x="524.167" y="432.5" width="195.667" height="31" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="622" y="452.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="622" dy="0">falta</tspan></text><rect x="722.833" y="432.5" width="195.667" height="31" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="820.667" y="452.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="820.667" dy="0">falta</tspan></text><text x="324" y="491" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="324" dy="0">falta</tspan></text><rect x="369.7" y="479" width="30.5" height="14" fill="#dff1ee"/><rect x="399.7" y="479" width="30.5" height="14" fill="#c0e1e0"/><rect x="429.7" y="479" width="30.5" height="14" fill="#a2d0d2"/><rect x="459.7" y="479" width="30.5" height="14" fill="#83c0c4"/><rect x="489.7" y="479" width="30.5" height="14" fill="#64b0b6"/><rect x="519.7" y="479" width="30.5" height="14" fill="#45a0a8"/><rect x="549.7" y="479" width="30.5" height="14" fill="#278f9a"/><rect x="579.7" y="479" width="30.5" height="14" fill="#087f8c"/><text x="617.7" y="491" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="617.7" dy="0">cumple</tspan></text><text x="670.94" y="491" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="670.94" dy="0">más oscuro = mayor (cumple)</tspan></text><rect x="10" y="507" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="531.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Criterios cumplidos: 11 de 11 el ADR-A, 3 de 11 el ADR-B y 8 de 11 el ADR-C. El linter comprueba presencia y forma, no</tspan></text><text x="470" y="548.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">verdad: un ADR con once criterios cumplidos puede decidir mal. Sirve para rechazar lo evidentemente incompleto (el ADR-B)</tspan></text><text x="470" y="565.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">antes de gastar tiempo de revisión humana.</tspan></text><text x="470" y="612.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; los recuentos se repiten y los tiempos varían de un equipo a otro.</tspan></text></svg>
