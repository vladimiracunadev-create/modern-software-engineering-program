 dy="0">NO</tspan></text><rect x="10" y="356" width="434" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="381.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">Sección Evidencia</tspan></text><rect x="450" y="356" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="381.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">sí</tspan></text><rect x="620" y="356" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="702" y="381.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">NO</tspan></text><rect x="790" y="356" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="381.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">sí</tspan></text><rect x="10" y="406" width="434" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="431.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">Al menos 2 alternativas con motivo</tspan></text><rect x="450" y="406" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="431.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">sí</tspan></text><rect x="620" y="406" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="702" y="431.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">NO</tspan></text><rect x="790" y="406" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="431.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">sí</tspan></text><rect x="10" y="45