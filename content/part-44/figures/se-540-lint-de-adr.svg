<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 755" width="970" height="755" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un linter de once criterios sobre tres ADR: el completo, el que justifica con una moda y el que olvida su reversibilidad</title><desc id="d">Tabla con once criterios aplicados a tres registros de decisión: el ADR-A, monolito modular con disparador de revisión, cumple 11 de 11; el ADR-B, que dice usar microservicios porque son la mejor práctica, cumple 3 de 11 y le faltan alternativas, reversibilidad, disparador, evidencia, consecuencias negativas y criterio medible; el ADR-C, celdas para el cliente grande, cumple 8 de 11 y le faltan la reversibilidad, el disparador de revisión y su criterio numérico.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="755" fill="#ffffff"/><rect x="10" y="12" width="434" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="227" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="227" dy="0">Criterio</tspan></text><rect x="450" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="532" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="532" dy="0">ADR-A</tspan></text><rect x="620" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="702" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="702" dy="0">ADR-B</tspan></text><rect x="790" y="12" width="164" height="38" rx="1