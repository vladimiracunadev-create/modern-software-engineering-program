<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" width="940" height="420" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cinco oráculos sobre 18 mutantes no equivalentes del núcleo de Avisos: cuántos mata cada uno</title><desc id="d">Barras horizontales con los mutantes que mata cada oráculo de 18 no equivalentes: un caso feliz único mata 7, ocho pruebas de ejemplo (TDD) matan 15, los escenarios de aceptación con reloj matan 17, el contrato con 400 estados al azar mata 13 y un modelo de referencia ejecutable mata los 18.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="420" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cinco oráculos sobre 18 mutantes no equivalentes del núcleo de Avisos: cuántos mata cada uno</tspan></text><line x1="314" y1="49" x2="314" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="314" y1="239" x2="314" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="314" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="314" dy="0">0</tspan></text><line x1="460.47" y1="49" x2="460.47" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="460.47" y1="239" x2="460.47" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="460.47" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="460.47" dy="0">5</tspan></text><line x1="606.94" y1="49" x2="606.94" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="606.94" y1="239" x2="606.94" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="606.94" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="606.94" dy="0">10</tspan></text><line x1="753.41" y1="49" x2="753.41" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="753.41" y1="239" x2="753.41" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="753.41" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="753.41" dy="0">15</tspan></text><line x1="899.88" y1="49" x2="899.88" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="899.88" y1="239" x2="899.88" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="899.88" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="899.88" dy="0">20</tspan></text><line x1="314" y1="239" x2="899.88" y2="239" stroke="#5b7280" stroke-width="1.6"/><text x="304" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Caso feliz único</tspan></text><text x="304" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Ocho pruebas de ejemplo (TDD)</tspan></text><text x="304" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Escenarios de aceptación con reloj</tspan></text><text x="304" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Contrato con 400 estados al azar</tspan></text><text x="304" y="224.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Modelo de referencia ejecutable</tspan></text><rect x="314" y="55" width="205.058" height="26" rx="3" fill="#087f8c"/><text x="526.058" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="526.058" dy="0">7</tspan></text><rect x="314" y="93" width="439.41" height="26" rx="3" fill="#087f8c"/><text x="760.41" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="760.41" dy="0">15</tspan></text><rect x="314" y="131" width="497.998" height="26" rx="3" fill="#087f8c"/><text x="818.998" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="818.998" dy="0">17</tspan></text><rect x="314" y="169" width="380.822" height="26" rx="3" fill="#087f8c"/><text x="701.822" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="701.822" dy="0">13</tspan></text><rect x="314" y="207" width="527.292" height="26" rx="3" fill="#087f8c"/><text x="848.292" y="224.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="848.292" dy="0">18</tspan></text><line x1="841.292" y1="49" x2="841.292" y2="239" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="846.292" y="62" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="846.292" dy="0">18</tspan></text><text x="606.94" y="283" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="606.94" dy="0">Mutantes que mata (de 18)</tspan></text><rect x="10" y="297" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="321.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Ningún oráculo cubre lo mismo: el contrato deja vivos cinco mutantes que las ocho pruebas matan, y las ocho pruebas dejan</tspan></text><text x="470" y="338.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">vivos tres que el contrato mata. Los dos mutantes equivalentes sobreviven a todos, como debe ser. Las 20 variantes las</tspan></text><text x="470" y="355.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">escribió el autor; no son una muestra de defectos reales.</tspan></text><text x="470" y="402.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Núcleo de Avisos con 20 mutantes escritos a mano (18 no equivalentes y 2 equivalentes); ejecutado en Windows 11 y Ubuntu (WSL2) con los mismos recuentos.</tspan></text></svg>
