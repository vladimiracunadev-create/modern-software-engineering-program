<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 353" width="960" height="353" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cinco preguntas de desarrollo y la metodología que responde a cada una</title><desc id="d">Diagrama con cinco preguntas encadenadas en dos filas: qué debe hacer el sistema, con qué vocabulario se dice, con qué interfaces se conecta, cómo se construye paso a paso y cómo se sabe que sigue sirviendo; a cada pregunta le corresponden BDD, ATDD y SDD, DDD, el diseño y las pruebas de contrato, TDD, y EDD y ODD.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="353" fill="#ffffff"/><rect x="10" y="14" width="284" height="96" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="152" y="49" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="152" dy="0">¿Qué debe hacer?</tspan></text><text x="152" y="65.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="152" dy="0">BDD · ATDD · Specification by</tspan></text><text x="152" y="82.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="152" dy="0">Example · SDD</tspan></text><rect x="338" y="14" width="284" height="96" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="57.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">¿Con qué palabras se dice?</tspan></text><text x="480" y="73.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">DDD: lenguaje ubicuo y contextos</tspan></text><polyline points="294,62 338,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="666" y="14" width="284" height="96" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="808" y="49" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="808" dy="0">¿Con qué interfaces se conecta?</tspan></text><text x="808" y="65.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="808" dy="0">Diseño por contrato y pruebas de</tspan></text><text x="808" y="82.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="808" dy="0">contrato</tspan></text><polyline points="622,62 666,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="150" width="284" height="96" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="152" y="193.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="152" dy="0">¿Cómo se construye paso a paso?</tspan></text><text x="152" y="209.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="152" dy="0">TDD: rojo, verde, refactor</tspan></text><rect x="338" y="150" width="284" height="96" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="185" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">¿Cómo sé que sigue sirviendo?</tspan></text><text x="480" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">EDD (evaluaciones) y ODD (flujo y</tspan></text><text x="480" y="218.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">evidencia)</tspan></text><polyline points="294,198 338,198" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="808,110 808,130 152,130 152,150" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="260" width="940" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="480" y="284.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">Cada metodología ordena una pregunta distinta; ninguna sustituye a las demás. La clase las trata como instrumentos con un</tspan></text><text x="480" y="301.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">oráculo, un costo y un punto ciego, no como identidades de equipo.</tspan></text><text x="480" y="343.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2); los recuentos son idénticos en ambos y los tiempos varían de equipo en equipo.</tspan></text></svg>
