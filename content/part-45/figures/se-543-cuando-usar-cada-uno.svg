<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 459" width="960" height="459" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué estilo conviene según la situación del colaborador y del cambio</title><desc id="d">Diagrama de decisión con cuatro situaciones y el estilo que conviene en cada una: un colaborador lento, externo o no determinista pide un doble con estado si es posible y simulados si no; querer refactorizar el interior sin tocar pruebas favorece el estilo clásico; diseñar de fuera hacia dentro favorece el estilo de Londres; y un cambio de interfaz de un colaborador hace fallar a ambos porque es un cambio de contrato.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="459" fill="#ffffff"/><rect x="10" y="14" width="300" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="160" y="47.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">El colaborador es lento, externo o no</tspan></text><text x="160" y="63.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">determinista</tspan></text><rect x="346" y="14" width="250" height="76" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="471" y="47.32" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="471" dy="0">Doble con estado si se puede;</tspan></text><text x="471" y="63.96" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="471" dy="0">si no, simulado</tspan></text><rect x="632" y="14" width="318" height="76" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="791" y="47.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="791" dy="0">El estilo de Londres sirve para fijar el</tspan></text><text x="791" y="63.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="791" dy="0">contrato en la frontera</tspan></text><polyline points="310,52 346,52" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="596,52 632,52" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="108" width="300" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="160" y="141.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">Se quiere refactorizar el interior sin</tspan></text><text x="160" y="157.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">tocar pruebas</tspan></text><rect x="346" y="108" width="250" height="76" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="471" y="149.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="471" dy="0">Clásico</tspan></text><rect x="632" y="108" width="318" height="76" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="791" y="141.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="791" dy="0">Aserciones sobre resultados toleran</tspan></text><text x="791" y="157.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="791" dy="0">cambios de colaboración</tspan></text><polyline points="310,146 346,146" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="596,146 632,146" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="202" width="300" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="160" y="235.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">Se diseña de fuera hacia dentro sin</tspan></text><text x="160" y="251.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">saber aún qué colabora</tspan></text><rect x="346" y="202" width="250" height="76" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="471" y="243.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="471" dy="0">Londres</tspan></text><rect x="632" y="202" width="318" height="76" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="791" y="235.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="791" dy="0">Simular descubre las interfaces que</tspan></text><text x="791" y="251.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="791" dy="0">hacen falta</tspan></text><polyline points="310,240 346,240" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="596,240 632,240" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="296" width="300" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="160" y="337.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">Un colaborador cambia de interfaz</tspan></text><rect x="346" y="296" width="250" height="76" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="471" y="337.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="471" dy="0">Ambos fallan</tspan></text><rect x="632" y="296" width="318" height="76" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="791" y="337.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="791" dy="0">Es un cambio de contrato, no un refactor</tspan></text><polyline points="310,334 346,334" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="596,334 632,334" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="386" width="940" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="480" y="410.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">La tabla es una guía de criterio, no un resultado medido: lo medido está en la primera figura. Muchos equipos usan los dos</tspan></text><text x="480" y="427.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">estilos según el colaborador.</tspan></text></svg>
