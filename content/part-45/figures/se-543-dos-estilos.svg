<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dónde corta cada estilo la misma colaboración entre el servicio, el repositorio, el canal y el reloj</title><desc id="d">Diagrama del servicio de recordatorios con tres colaboradores, el repositorio, el canal y el reloj: el estilo clásico los sustituye por dobles con estado y comprueba el resultado observable, mensajes entregados y envíos registrados; el estilo de Londres los sustituye por dobles simulados y comprueba las llamadas que el servicio les hace.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="330" fill="#ffffff"/><rect x="380" y="20" width="200" height="64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="480" y="46.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="480" dy="0">Servicio de</tspan></text><text x="480" y="64.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="480" dy="0">recordatorios</tspan></text><rect x="40" y="150" width="200" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="140" y="180.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="140" dy="0">Repositorio</tspan></text><polyline points="480,84 140,150" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="380" y="150" width="200" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="480" y="180.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="480" dy="0">Canal</tspan></text><polyline points="480,84 480,150" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="720" y="150" width="200" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="820" y="180.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="820" dy="0">Reloj</tspan></text><polyline points="480,84 820,150" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="238" width="440" height="78" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="240" y="264" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="240" dy="0">ESTILO CLÁSICO</tspan></text><text x="240" y="280.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="240" dy="0">Dobles con estado: se mira qué mensajes se entregaron y</tspan></text><text x="240" y="297.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="240" dy="0">qué envíos quedaron registrados</tspan></text><rect x="500" y="238" width="440" height="78" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="720" y="264" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="720" dy="0">ESTILO DE LONDRES</tspan></text><text x="720" y="280.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="720" dy="0">Dobles simulados: se mira qué llamadas hizo el servicio y</tspan></text><text x="720" y="297.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="720" dy="0">con qué argumentos</tspan></text></svg>
