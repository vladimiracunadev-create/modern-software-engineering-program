<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 457" width="940" height="457" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dos estilos de prueba ante cuatro refactores y un cambio de contrato del mismo servicio</title><desc id="d">Mapa de calor con las pruebas que fallan en dos estilos tras cada cambio: el estilo clásico, con dobles con estado, pasa los cuatro refactores y falla solo con el cambio de contrato del puerto; el estilo de Londres, con dobles simulados, falla además el refactor que pide todas las entregas y filtra en el servicio; los dos detectan los seis defectos de comportamiento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="457" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dos estilos de prueba ante cuatro refactores y un cambio de contrato del mismo servicio</tspan></text><text x="570.5" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="570.5" dy="0">Estilo clásico</tspan></text><text x="803.5" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="803.5" dy="0">Estilo de Londres</tspan></text><text x="444" y="98.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="444" dy="0">R1 leer el reloj una vez (refactor)</tspan></text><text x="444" y="134" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="444" dy="0">R2 pedir todas las entregas y filtrar en el servicio</tspan></text><text x="444" y="151" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="444" dy="0">(refactor)</tspan></text><text x="444" y="186.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="444" dy="0">R3 extraer el cálculo del umbral (refactor)</tspan></text><text x="444" y="230.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="444" dy="0">R4 leer lo registrado antes del reloj (refactor)</tspan></text><text x="444" y="274.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="444" dy="0">R5 renombrar el puerto de registro (cambio de contrato)</tspan></text><rect x="455.5" y="73.5" width="230" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="570.5" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="570.5" dy="0">pasa</tspan></text><rect x="688.5" y="73.5" width="230" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="803.5" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="803.5" dy="0">pasa</tspan></text><rect x="455.5" y="117.5" width="230" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="570.5" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="570.5" dy="0">pasa</tspan></text><rect x="688.5" y="117.5" width="230" height="41" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="803.5" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="803.5" dy="0">FALLA</tspan></text><rect x="455.5" y="161.5" width="230" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="570.5" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="570.5" dy="0">pasa</tspan></text><rect x="688.5" y="161.5" width="230" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="803.5" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="803.5" dy="0">pasa</tspan></text><rect x="455.5" y="205.5" width="230" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="570.5" y="230.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="570.5" dy="0">pasa</tspan></text><rect x="688.5" y="205.5" width="230" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="803.5" y="230.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="803.5" dy="0">pasa</tspan></text><rect x="455.5" y="249.5" width="230" height="41" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="570.5" y="274.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="570.5" dy="0">FALLA</tspan></text><rect x="688.5" y="249.5" width="230" height="41" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="803.5" y="274.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="803.5" dy="0">FALLA</tspan></text><text x="454" y="318" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="454" dy="0">pasa</tspan></text><rect x="492.16" y="306" width="29.625" height="14" fill="#fbe4de"/><rect x="521.285" y="306" width="29.625" height="14" fill="#f3cdc5"/><rect x="550.41" y="306" width="29.625" height="14" fill="#eab6ac"/><rect x="579.535" y="306" width="29.625" height="14" fill="#e29f93"/><rect x="608.66" y="306" width="29.625" height="14" fill="#d9887a"/><rect x="637.785" y="306" width="29.625" height="14" fill="#d17161"/><rect x="666.91" y="306" width="29.625" height="14" fill="#c85a48"/><rect x="696.035" y="306" width="29.625" height="14" fill="#c0432f"/><text x="733.16" y="318" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="733.16" dy="0">FALLA</tspan></text><text x="778.86" y="318" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="778.86" dy="0">más oscuro = mayor (Falla)</tspan></text><rect x="10" y="334" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="358.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La diferencia aparece donde el refactor cambia cómo el servicio consulta a un colaborador: la prueba de Londres fijó esa</tspan></text><text x="470" y="375.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">consulta, la clásica solo fijó el resultado. Ambas detectan los mismos seis defectos. Son dos suites escritas por el autor</tspan></text><text x="470" y="392.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">sobre un servicio pequeño.</tspan></text><text x="470" y="439.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2); los recuentos son idénticos en ambos y los tiempos varían de equipo en equipo.</tspan></text></svg>
