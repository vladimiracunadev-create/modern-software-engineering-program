<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 566" width="940" height="566" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reemplazar el «Entonces» de un escenario por un paso que no afirma nada: mutantes que dejan de morir</title><desc id="d">Barras horizontales con los mutantes que dejan de morir de los 15 que matan los escenarios completos al vaciar el paso Entonces de cada escenario: el de no repetir pierde 2, los de quien ya entregó, última hora, 24 horas y otro curso pierden 1 cada uno, y los de 72 horas, caída y entrega vencida no pierden ninguno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="566" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Reemplazar el «Entonces» de un escenario por un paso que no afirma nada: mutantes que dejan de morir</tspan></text><line x1="354" y1="49" x2="354" y2="401" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="401" x2="354" y2="406" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="422" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="630.97" y1="49" x2="630.97" y2="401" stroke="#d5dde1" stroke-width="1"/><line x1="630.97" y1="401" x2="630.97" y2="406" stroke="#5b7280" stroke-width="1.4"/><text x="630.97" y="422" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="630.97" dy="0">1</tspan></text><line x1="907.94" y1="49" x2="907.94" y2="401" stroke="#d5dde1" stroke-width="1"/><line x1="907.94" y1="401" x2="907.94" y2="406" stroke="#5b7280" stroke-width="1.4"/><text x="907.94" y="422" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907.94" dy="0">2</tspan></text><line x1="354" y1="401" x2="907.94" y2="401" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="75.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Avisa a las 72 horas</tspan></text><text x="344" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">No repite un aviso enviado</tspan></text><text x="344" y="163.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Quien ya entregó no recibe avisos</tspan></text><text x="344" y="199" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Tras una caída solo llega el aviso más</tspan></text><text x="344" y="216" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">urgente</tspan></text><text x="344" y="251.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Conserva el aviso de la última hora</tspan></text><text x="344" y="295.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">No recibe el de 24 horas</tspan></text><text x="344" y="339.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">No afecta a otro curso</tspan></text><text x="344" y="383.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Una entrega vencida no avisa</tspan></text><rect x="354" y="55" width="2" height="32" rx="3" fill="#c0432f"/><text x="363" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="99" width="553.94" height="32" rx="3" fill="#c0432f"/><text x="914.94" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="914.94" dy="0">2</tspan></text><rect x="354" y="143" width="276.97" height="32" rx="3" fill="#c0432f"/><text x="637.97" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="637.97" dy="0">1</tspan></text><rect x="354" y="187" width="2" height="32" rx="3" fill="#c0432f"/><text x="363" y="207.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="231" width="276.97" height="32" rx="3" fill="#c0432f"/><text x="637.97" y="251.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="637.97" dy="0">1</tspan></text><rect x="354" y="275" width="276.97" height="32" rx="3" fill="#c0432f"/><text x="637.97" y="295.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="637.97" dy="0">1</tspan></text><rect x="354" y="319" width="276.97" height="32" rx="3" fill="#c0432f"/><text x="637.97" y="339.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="637.97" dy="0">1</tspan></text><rect x="354" y="363" width="2" height="32" rx="3" fill="#c0432f"/><text x="363" y="383.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><text x="630.97" y="445" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="630.97" dy="0">Mutantes que dejan de morir (de 15)</tspan></text><rect x="10" y="459" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="483.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Tres escenarios pueden perder su «Entonces» sin que ninguna comprobación se resienta: quedan cubiertos por otros o no</tspan></text><text x="470" y="500.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">afirman lo que dicen. Es una señal para revisar el texto, no una prueba de que sobren.</tspan></text><text x="470" y="548.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2); los recuentos son idénticos en ambos y los tiempos varían de equipo en equipo.</tspan></text></svg>
