<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 853" width="940" height="853" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Nueve escenarios en lenguaje de negocio ejecutados contra 18 mutantes: cuántos mata cada uno y cuántos solo él</title><desc id="d">Barras horizontales con los mutantes que mata cada uno de nueve escenarios Gherkin y los que mata solo él: avisar a las 72 horas mata 5 y ninguno solo él, no repetir un aviso mata 3 y los 3 solo él, quien ya entregó mata 2 y 1 solo él, la caída mata 6, el silencio con la última hora mata 9 y 1 solo él, el silencio sin el de 24 horas mata 2 y 1, el silencio por curso mata 8 y 1, la entrega vencida mata 1 y el escenario de la interfaz agradable no mata ninguno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="853" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Nueve escenarios en lenguaje de negocio ejecutados contra 18 mutantes: cuántos mata cada uno y cuántos solo</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">él</tspan></text><rect x="16" y="64" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Mutantes que mata</tspan></text><rect x="192.18" y="64" width="12" height="12" rx="2" fill="#946512"/><text x="212.18" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="212.18" dy="0">Mutantes que mata solo él</tspan></text><line x1="354" y1="96" x2="354" y2="672" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="672" x2="354" y2="677" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="693" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="464.788" y1="96" x2="464.788" y2="672" stroke="#d5dde1" stroke-width="1"/><line x1="464.788" y1="672" x2="464.788" y2="677" stroke="#5b7280" stroke-width="1.4"/><text x="464.788" y="693" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="464.788" dy="0">2</tspan></text><line x1="575.576" y1="96" x2="575.576" y2="672" stroke="#d5dde1" stroke-width="1"/><line x1="575.576" y1="672" x2="575.576" y2="677" stroke="#5b7280" stroke-width="1.4"/><text x="575.576" y="693" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="575.576" dy="0">4</tspan></text><line x1="686.364" y1="96" x2="686.364" y2="672" stroke="#d5dde1" stroke-width="1"/><line x1="686.364" y1="672" x2="686.364" y2="677" stroke="#5b7280" stroke-width="1.4"/><text x="686.364" y="693" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="686.364" dy="0">6</tspan></text><line x1="797.152" y1="96" x2="797.152" y2="672" stroke="#d5dde1" stroke-width="1"/><line x1="797.152" y1="672" x2="797.152" y2="677" stroke="#5b7280" stroke-width="1.4"/><text x="797.152" y="693" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797.152" dy="0">8</tspan></text><line x1="907.94" y1="96" x2="907.94" y2="672" stroke="#d5dde1" stroke-width="1"/><line x1="907.94" y1="672" x2="907.94" y2="677" stroke="#5b7280" stroke-width="1.4"/><text x="907.94" y="693" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907.94" dy="0">10</tspan></text><line x1="354" y1="672" x2="907.94" y2="672" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="132.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Avisa a las 72 horas</tspan></text><text x="344" y="196.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">No repite un aviso enviado</tspan></text><text x="344" y="260.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Quien ya entregó no recibe avisos</tspan></text><text x="344" y="316" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Tras una caída solo llega el aviso más</tspan></text><text x="344" y="333" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">urgente</tspan></text><text x="344" y="380" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Un curso silenciado conserva el aviso de la</tspan></text><text x="344" y="397" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">última hora</tspan></text><text x="344" y="452.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Un curso silenciado no recibe el de 24 horas</tspan></text><text x="344" y="516.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">El silencio de un curso no afecta a otro</tspan></text><text x="344" y="580.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Una entrega vencida no avisa</tspan></text><text x="344" y="644.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">La interfaz es agradable</tspan></text><rect x="354" y="102" width="276.97" height="24.5" rx="3" fill="#087f8c"/><text x="637.97" y="118.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="637.97" dy="0">5</tspan></text><rect x="354" y="129.5" width="2" height="24.5" rx="3" fill="#946512"/><text x="363" y="146.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="166" width="166.182" height="24.5" rx="3" fill="#087f8c"/><text x="527.182" y="182.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="527.182" dy="0">3</tspan></text><rect x="354" y="193.5" width="166.182" height="24.5" rx="3" fill="#946512"/><text x="527.182" y="210.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="527.182" dy="0">3</tspan></text><rect x="354" y="230" width="110.788" height="24.5" rx="3" fill="#087f8c"/><text x="471.788" y="246.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="471.788" dy="0">2</tspan></text><rect x="354" y="257.5" width="55.394" height="24.5" rx="3" fill="#946512"/><text x="416.394" y="274.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="416.394" dy="0">1</tspan></text><rect x="354" y="294" width="332.364" height="24.5" rx="3" fill="#087f8c"/><text x="693.364" y="310.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="693.364" dy="0">6</tspan></text><rect x="354" y="321.5" width="2" height="24.5" rx="3" fill="#946512"/><text x="363" y="338.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="358" width="498.546" height="24.5" rx="3" fill="#087f8c"/><text x="859.546" y="374.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="859.546" dy="0">9</tspan></text><rect x="354" y="385.5" width="55.394" height="24.5" rx="3" fill="#946512"/><text x="416.394" y="402.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="416.394" dy="0">1</tspan></text><rect x="354" y="422" width="110.788" height="24.5" rx="3" fill="#087f8c"/><text x="471.788" y="438.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="471.788" dy="0">2</tspan></text><rect x="354" y="449.5" width="55.394" height="24.5" rx="3" fill="#946512"/><text x="416.394" y="466.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="416.394" dy="0">1</tspan></text><rect x="354" y="486" width="443.152" height="24.5" rx="3" fill="#087f8c"/><text x="804.152" y="502.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="804.152" dy="0">8</tspan></text><rect x="354" y="513.5" width="55.394" height="24.5" rx="3" fill="#946512"/><text x="416.394" y="530.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="416.394" dy="0">1</tspan></text><rect x="354" y="550" width="55.394" height="24.5" rx="3" fill="#087f8c"/><text x="416.394" y="566.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="416.394" dy="0">1</tspan></text><rect x="354" y="577.5" width="2" height="24.5" rx="3" fill="#946512"/><text x="363" y="594.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="614" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="363" y="630.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="641.5" width="2" height="24.5" rx="3" fill="#946512"/><text x="363" y="658.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><text x="630.97" y="716" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="630.97" dy="0">Mutantes (de 18)</tspan></text><rect x="10" y="730" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="754.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Los nueve escenarios usan 32 pasos y 10 definiciones de paso (3,2 pasos por definición) y matan 15 de 18; sobreviven M01,</tspan></text><text x="470" y="771.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">M12 y M16. El último escenario pasa siempre: su «Entonces» no afirma nada comprobable. Escenarios y mutantes los escribió</tspan></text><text x="470" y="788.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">el autor.</tspan></text><text x="470" y="835.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2); los recuentos son idénticos en ambos y los tiempos varían de equipo en equipo.</tspan></text></svg>
