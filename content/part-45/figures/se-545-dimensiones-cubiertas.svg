.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="478.75" dy="0">sí</tspan></text><rect x="568.5" y="240.5" width="173.5" height="47" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="655.25" y="268.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="655.25" dy="0">sí</tspan></text><rect x="745" y="240.5" width="173.5" height="47" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="831.75" y="268.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="831.75" dy="0">no</tspan></text><text x="214" y="315" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="214" dy="0">no</tspan></text><rect x="237.08" y="303" width="30.5" height="14" fill="#dff1ee"/><rect x="267.08" y="303" width="30.5" height="14" fill="#c0e1e0"/><rect x="297.08" y="303" width="30.5" height="14" fill="#a2d0d2"/><rect x="327.08" y="303" width="30.5" height="14" fill="#83c0c4"/><rect x="357.08" y="303" width="30.5" height="14" fill="#64b0b6"/><rect x="387.08" y="303" width="30.5" height="14" fill="#45a0a8"/><rect x="417.08" y="303" width="30.5" height="14" fill="#278f9a"/><rect x="447.08" y="303" width="30.5" height="14" fill="#087f8c"/><text x="485.08" y="315" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="485.08" dy="0">sí</tspan></text><text x="508.16" y="315" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="508.16" dy="0">más oscuro = mayor (Dimensión variada)</tspan></text><rect x="10" y="331" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="355.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La columna de la derecha explica el único mutante que sobrevive al conjunto más grande: ningún ejemplo distingue silenciar</tspan></text><text x="470" y="372.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">a una persona de silenciar un curso. Elegir ejemplos es decidir qué dimensiones se comprueban.</tspan></text></svg>
