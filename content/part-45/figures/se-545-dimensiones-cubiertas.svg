<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 408" width="940" height="408" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué dimensiones del problema varía cada conjunto de ejemplos</title><desc id="d">Mapa de calor con las dimensiones que varía cada conjunto de ejemplos: los cinco típicos eligen tres puntos sueltos del tiempo e incluyen una vez una entrega entregada y un curso silenciado; los doce de frontera cubren los límites del tiempo pero no varían entregada ni silenciado; los veinte al azar varían tiempo, entregada y silenciado a veces; los 144 combinatorios cubren tiempo, entregada y silenciado; ninguno varía el curso ni la persona, por lo que los 144 dejan vivo M08.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="408" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué dimensiones del problema varía cada conjunto de ejemplos</tspan></text><text x="302.25" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="302.25" dy="0">Límites del tiempo</tspan></text><text x="478.75" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="478.75" dy="0">Entregada</tspan></text><text x="655.25" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="655.25" dy="0">Silenciado</tspan></text><text x="831.75" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="831.75" dy="0">Varios cursos o</tspan></text><text x="831.75" y="77" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="831.75" dy="0">personas</tspan></text><text x="204" y="118.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="204" dy="0">5 típicos</tspan></text><text x="204" y="168.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="204" dy="0">12 de frontera</tspan></text><text x="204" y="218.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="204" dy="0">20 al azar</tspan></text><text x="204" y="268.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="204" dy="0">144 combinatorios</tspan></text><rect x="215.5" y="90.5" width="173.5" height="47" rx="4" fill="#74b8bd" stroke="#ffffff" stroke-width="1"/><text x="302.25" y="118.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="302.25" dy="0">parcial</tspan></text><rect x="392" y="90.5" width="173.5" height="47" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="478.75" y="118.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="478.75" dy="0">sí</tspan></text><rect x="568.5" y="90.5" width="173.5" height="47" rx="4" fill="#74b8bd" stroke="#ffffff" stroke-width="1"/><text x="655.25" y="118.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="655.25" dy="0">parcial</tspan></text><rect x="745" y="90.5" width="173.5" height="47" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="831.75" y="118.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="831.75" dy="0">no</tspan></text><rect x="215.5" y="140.5" width="173.5" height="47" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="302.25" y="168.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="302.25" dy="0">sí</tspan></text><rect x="392" y="140.5" width="173.5" height="47" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text 