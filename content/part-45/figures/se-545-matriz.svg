<tspan x="487.54" dy="0">falla</tspan></text><text x="533.24" y="367" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="533.24" dy="0">más oscuro = mayor (falla)</tspan></text><rect x="10" y="383" width="920" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="407.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Cada comprobación ve una familia de defectos y es ciega a las demás: los importes en centavos pasan volumen, unicidad,</tspan></text><text x="470" y="424.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">nulos, integridad y frescura. Una batería sin la comprobación de distribución habría dado verde.</tspan></text><text x="470" y="472.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9 y SQLite 3.45.3; los recuentos se repiten y los tiempos varían de un equipo a otro.</tspan></text></svg>
