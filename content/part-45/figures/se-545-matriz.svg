<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 490" width="940" height="490" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Seis variantes defectuosas de una tabla de pedidos y qué comprobación falla en cada una</title><desc id="d">Mapa de calor con siete variantes y seis comprobaciones: la variante limpia no falla ninguna; la carga parcial falla el volumen; los duplicados fallan volumen y unicidad; los nulos en el cliente fallan nulos; los clientes huérfanos fallan integridad referencial; los datos atrasados fallan frescura; los importes en centavos solo fallan la distribución.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="490" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Seis variantes defectuosas de una tabla de pedidos y qué comprobación falla en cada una</tspan></text><text x="282" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="282" dy="0">Volumen</tspan></text><text x="398" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="398" dy="0">Unicidad</tspan></text><text x="514" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="514" dy="0">Nulos</tspan></text><text x="630" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="630" dy="0">Integridad</tspan></text><text x="630" y="77" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="630" dy="0">referencial</tspan></text><text x="746" y="60" font-size=