"middle" font-weight="700" fill="#ffffff"><tspan x="662" dy="0">alerta</tspan></text><rect x="749.5" y="362.5" width="169" height="31" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="834" y="382.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="834" dy="0">alerta</tspan></text><rect x="405.5" y="396.5" width="169" height="31" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="490" y="416.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="490" dy="0">alerta</tspan></text><rect x="577.5" y="396.5" width="169" height="31" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="662" y="416.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="662" dy="0">alerta</tspan></text><rect x="749.5" y="396.5" width="169" height="31" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="834" y="416.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="834" dy="0">—</tspan></text><rect x="405.5" y="430.5" width="169" height="31" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="490" y="450.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="490" dy="0">alerta</tspan></text><rect x="577.5" y="430.5" width="169" height="31" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="662" y="450.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="662" dy="0">alerta</tspan></text><rect x="749.5" y="430.5" width="169" height="31" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="834" y="450.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="834" dy="0">alerta</tspan></text><rect x="405.5" y="464.5" width="169" height="31" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="490" y="484.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="490" dy="0">alerta</tspan></text><rect x="577.5" y="464.5" width="169" height="31" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="662" y="484.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="662" dy="0">alerta</tspan></text><rect x="749.5" y="464.5" width="169" height="31" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="834" y="484.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="834" dy="0">alerta</tspan></text><text x="404" y="523" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="404" dy="0">—</tspan></text><rect x="419.54" y="511" width="30.5" height="14" fill="#fbe4de"/><rect x="449.54" y="511" width="30.5" height="14" fill="#f3cdc5"/><rect x="479.54" y="511" width="30.5" height="14" fill="#eab6ac"/><rect x="509.54" y="511" width="30.5" height="14" fill="#e29f93"/><rect x="539.54" y="511" width="30.5" height="14" fill="#d9887a"/><rect x="569.54" y="511" width="30.5" height="14" fill="#d17161"/><rect x="599.54" y="511" width="30.5" height="14" fill="#c85a48"/><rect x="629.54" y="511" width="30.5" height="14" fill="#c0432f"/><text x="667.54" y="523" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="667.54" dy="0">alerta</tspan></text><text x="720.78" y="523" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="720.78" dy="0">más oscuro = mayor (Alerta)</tspan></text><rect x="10" y="539" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="563.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Las tres detectan los 7 cambios que rompen; la diferencia está en las falsas alarmas: 3, 4 y 0 de 5. El contrato del</tspan></text><text x="470" y="580.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">consumidor declara solo los campos y tipos que el cliente lee. Doce cambios escritos por el autor sobre un cliente de</tspan></text><text x="470" y="597.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">cuatro campos.</tspan></text><text x="470" y="644.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2); los recuentos son idénticos en ambos y los tiempos varían de equipo en equipo.</tspan></text></svg>
