<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 662" width="940" height="662" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Doce cambios de un proveedor de entregas y tres formas de detectar los que rompen a un consumidor</title><desc id="d">Mapa de calor de doce cambios del proveedor, siete de los cuales rompen al cliente de avisos: la instantánea de la respuesta alerta en 10 cambios y se equivoca en 3 de los 5 inocuos, la diferencia de esquema alerta en 11 y se equivoca en 4 de los 5, y el contrato del consumidor alerta solo en los 7 que rompen y no se equivoca en ninguno de los 5.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="662" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Doce cambios de un proveedor de entregas y tres formas de detectar los que rompen a un consumidor</tspan></text><text x="490" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="490" dy="0">Instantánea</tspan></text><text x="662" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="662" dy="0">Diferencia de esquema</tspan></text><text x="834" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="834" dy="0">Contrato del</tspan></text><text x="834" y="77" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="834" dy="0">consumidor</tspan></text><text x="394" y="110.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="394" dy="0">C01 añadir priority (inocuo)</tspan></text><text x="394" y="144.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="394" dy="0">C02 renombrar due por due_at (rompe)</tspan></text><text x="394" y="178.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="394" dy="0">C03 due pasa a texto ISO (rompe)</tspan></text><text x="394" y="212.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="394" dy="0">C04 eliminar student (rompe)</tspan></text><text x="394" y="246.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="394" dy="0">C05 submitted pasa a «yes» o «no» (rompe)</tspan></text><text x="394" y="280.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="394" dy="0">C06 añadir course (inocuo)</tspan></text><text x="394" y="314.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="394" dy="0">C07 reordenar los campos (inocuo)</tspan></text><text x="394" y="348.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="394" dy="0">C08 due pasa de entero a decimal (inocuo)</tspan></text><text x="394" y="382.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="394" dy="0">C09 id pasa de texto a entero (rompe)</tspan></text><text x="394" y="416.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="394" dy="0">C10 añadir status con valor nuevo (inocuo)</tspan></text><text x="394" y="450.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="394" dy="0">C11 eliminar submitted (rompe)</tspan></text><text x="394" y="484.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="394" dy="0">C12 envolver la lista en data (rompe)</tspan></text><rect x="405.5" y="90.5" width="169" height="31" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="490" y="110.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="490" dy="0">alerta</tspan></text><rect x="577.5" y="90.5" width="169" height="31" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="662" y="110.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="662" dy="0">alerta</tspan></text><rect x="749.5" y="90.5" width="169" height="31" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="834" y="110.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="834" dy="0">—</tspan></text><rect x="405.5" y="124.5" width="169" height="31" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="490" y="144.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="490" dy="0">alerta</tspan></text><rect x="577.5" y="124.5" width="169" height="31" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="662" y="144.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="662" dy="0">alerta</tspan></text><rect x="749.5" y="124.5" width="169" height="31" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="834" y="144.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="834" dy="0">alerta</tspan></text><rect x="405.5" y="158.5" width="169" height="31" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="490" y="178.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="490" dy="0">alerta</tspan></text><rect x="577.5" y="158.5" width="169" height="31" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="662" y="178.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="662" dy="0">alerta</tspan></text><rect x="749.5" y="158.5" width="169" height="31" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="834" y="178.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="834" dy="0">alerta</tspan></text><rect x="405.5" 