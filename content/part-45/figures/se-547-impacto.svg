<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 1302" width="940" height="1302" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Columnas de salida que cambian al perturbar cada columna de origen, medidas y predichas por tres linajes</title><desc id="d">Barras horizontales agrupadas, por columna de origen, con las salidas que cambian de 17: medidas al perturbar, predichas por el linaje de datos solo, por el linaje con condiciones y por el linaje de tablas; por ejemplo orders.status cambia 12 salidas, el linaje de datos solo predice 0 y con condiciones 15; orders.note y customers.segment no cambian ninguna.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="1302" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Columnas de salida que cambian al perturbar cada columna de origen, medidas y predichas por tres linajes</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Medido al perturbar</tspan></text><rect x="207.26" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="227.26" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="227.26" dy="0">Linaje de datos solo</tspan></text><rect x="406.06" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="426.06" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="426.06" dy="0">Datos y condiciones</tspan></text><rect x="597