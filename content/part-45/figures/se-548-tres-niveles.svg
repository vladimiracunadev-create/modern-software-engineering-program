<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 411" width="960" height="411" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres niveles de SDD según el papel que conserva la especificación</title><desc id="d">Diagrama con tres filas de dos cajas: en spec-first la especificación guía la primera construcción y después puede quedar atrás; en spec-anchored la especificación se mantiene viva y comprobaciones mecánicas la ligan al código y a las pruebas; en spec-as-source la especificación es la fuente y el código se genera de ella sin edición manual.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="411" fill="#ffffff"/><rect x="10" y="14" width="448" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="234" y="44.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="234" dy="0">SPEC-FIRST</tspan></text><text x="234" y="60.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="234" dy="0">La especificación guía la primera construcción</tspan></text><rect x="502" y="14" width="448" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="726" y="52.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="726" dy="0">Después puede quedar atrás: deriva sin aviso</tspan></text><polyline points="458,49 502,49" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="124" width="448" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="234" y="154.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="234" dy="0">SPEC-ANCHORED</tspan></text><text x="234" y="170.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="234" dy="0">La especificación se mantiene viva</tspan></text><rect x="502" y="124" width="448" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="726" y="162.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="726" dy="0">Comprobaciones ligan reglas, código y pruebas</tspan></text><polyline points="458,159 502,159" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="726,84 726,104 234,104 234,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="234" width="448" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="234" y="264.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="234" dy="0">SPEC-AS-SOURCE</tspan></text><text x="234" y="280.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="234" dy="0">La especificación es la fuente</tspan></text><rect x="502" y="234" width="448" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="726" y="272.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="726" dy="0">El código se genera; editarlo a mano se detecta</tspan></text><polyline points="458,269 502,269" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="726,194 726,214 234,214 234,234" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="318" width="940" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="480" y="342.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">Los tres niveles son una gradación del compromiso con mantener la especificación, no tres productos. Cuanto más alto el nivel,</tspan></text><text x="480" y="359.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">menos deriva y más rigidez: lo que la especificación no puede expresar no puede construirse.</tspan></text><text x="480" y="401.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2); los recuentos son idénticos en ambos y los tiempos varían de equipo en equipo.</tspan></text></svg>
