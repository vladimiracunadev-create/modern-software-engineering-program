<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 506" width="940" height="506" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dos historiales de Git reales evaluados contra tres reglas del flujo ODD: el commit más grande</title><desc id="d">Barras con las líneas del commit más grande de dos historiales de Git reales: el ordenado, con documento de tarea primero y un tramo rojo seguido de uno verde, tiene 13 líneas y el comprobador no halla nada; el desordenado, con todo el código en un commit y el documento después, tiene 463 líneas y incumple las tres reglas, con el límite de 400.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="506" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dos historiales de Git reales evaluados contra tres reglas del flujo ODD: el commit más grande</tspan></text><line x1="78.62" y1="347" x2="920" y2="347" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="347" x2="78.62" y2="347" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="351.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="291" x2="920" y2="291" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="291" x2="78.62" y2="291" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="295.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="235" x2="920" y2="235" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="235" x2="78.62" y2="235" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="239.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">200</tspan></text><line x1="78.62" y1="179" x2="920" y2="179" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="179" x2="78.62" y2="179" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="183.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">300</tspan></text><line x1="78.62" y1="123" x2="920" y2="123" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="123" x2="78.62" y2="123" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="127.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">400</tspan></text><line x1="78.62" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="67" x2="78.62" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">500</tspan></text><line x1="78.62" y1="67" x2="78.62" y2="347" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="207" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 207)">Líneas del commit más grande</text><rect x="120.689" y="339.72" width="336.552" height="7.28" rx="3" fill="#087f8c"/><text x="288.965" y="333.72" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="288.965" dy="0">13</tspan></text><text x="288.965" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="288.965" dy="0">Historial A (ordenado)</tspan></text><rect x="541.379" y="87.72" width="336.552" height="259.28" rx="3" fill="#087f8c"/><text x="709.655" y="81.72" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="709.655" dy="0">463</tspan></text><text x="709.655" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="709.655" dy="0">Historial B (desordenado)</tspan></text><line x1="78.62" y1="123" x2="920" y2="123" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="916" y="117" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="916" dy="0">límite de 400 líneas</tspan></text><rect x="10" y="399" width="920" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="423.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">El comprobador ejecuta las pruebas de cada commit para saber si estaba en rojo o en verde. Mira orden, tamaño y estado de</tspan></text><text x="470" y="440.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">las pruebas; no puede saber si el documento de tarea describe la realidad ni si 400 líneas es el límite adecuado.</tspan></text><text x="470" y="488.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Historiales de Git creados de verdad en un directorio temporal y ejecutados en Windows 11 y Ubuntu (WSL2) con los mismos resultados.</tspan></text></svg>
