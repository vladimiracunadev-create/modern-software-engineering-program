<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 459" width="960" height="459" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué comprueba la máquina del flujo ODD y qué solo puede juzgar una persona</title><desc id="d">Diagrama de cuatro aspectos del flujo ODD: el orden entre el documento y el primer código se comprueba con el historial, el tamaño de cada commit con la estadística numérica de Git, el estado de las pruebas ejecutándolas en cada commit, y que el documento sea cierto y sirva para retomar el trabajo no lo puede comprobar una máquina.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="459" fill="#ffffff"/><rect x="10" y="14" width="300" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="160" y="47.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">Orden: el documento existe antes del</tspan></text><text x="160" y="63.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">primer código</tspan></text><rect x="346" y="14" width="250" height="76" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="471" y="55.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="471" dy="0">Sí, con el historial</tspan></text><rect x="632" y="14" width="318" height="76" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="791" y="55.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="791" dy="0">Un documento vacío cumple la regla</tspan></text><polyline points="310,52 346,52" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="596,52 632,52" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="108" width="300" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="160" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">Tamaño: líneas por commit</tspan></text><rect x="346" y="108" width="250" height="76" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="471" y="149.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="471" dy="0">Sí, con numstat</tspan></text><rect x="632" y="108" width="318" height="76" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="791" y="141.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="791" dy="0">Las líneas generadas o movidas cuentan</tspan></text><text x="791" y="157.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="791" dy="0">igual que las escritas</tspan></text><polyline points="310,146 346,146" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="596,146 632,146" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="202" width="300" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="160" y="243.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">Estado de las pruebas en cada commit</tspan></text><rect x="346" y="202" width="250" height="76" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="471" y="243.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="471" dy="0">Sí, ejecutándolas</tspan></text><rect x="632" y="202" width="318" height="76" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="791" y="235.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="791" dy="0">Una prueba que no afirma nada pone el</tspan></text><text x="791" y="251.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="791" dy="0">commit en verde</tspan></text><polyline points="310,240 346,240" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="596,240 632,240" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="296" width="300" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="160" y="329.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">Que el documento sea cierto y útil</tspan></text><text x="160" y="345.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">para retomar</tspan></text><rect x="346" y="296" width="250" height="76" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="471" y="337.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="471" dy="0">No</tspan></text><rect x="632" y="296" width="318" height="76" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="791" y="337.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="791" dy="0">Solo una persona al retomar lo sabe</tspan></text><polyline points="310,334 346,334" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="596,334 632,334" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="386" width="940" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="410.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Comprobar la forma del flujo es barato y ayuda; comprobar su fondo exige que alguien retome el trabajo con solo el documento y</tspan></text><text x="480" y="427.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">diga si pudo.</tspan></text></svg>
