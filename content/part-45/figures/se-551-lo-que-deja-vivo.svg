<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 421" width="940" height="421" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué silencios mal hechos deja vivos cada metodología</title><desc id="d">Mapa de calor con los mutantes del silencio que deja vivos cada metodología: TDD y BDD dejan vivo S4, que silencia el curso para todas las personas; ATDD deja vivos S3 y S4; el contrato deja vivos S2, S3, S4 y S7; el modelo ejecutable no deja ninguno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="421" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué silencios mal hechos deja vivos cada metodología</tspan></text><text x="284.75" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="284.75" dy="0">S2</tspan></text><text x="466.25" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="466.25" dy="0">S3</tspan></text><text x="647.75" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="647.75" dy="0">S4</tspan></text><text x="829.25" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="829.25" dy="0">S7</tspan></text><text x="184" y="101.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="184" dy="0">TDD y BDD</tspan></text><text x="184" y="151.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="184" dy="0">ATDD</tspan></text><text x="184" y="201.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="184" dy="0">Contrato</tspan></text><text x="184" y="251.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="184" dy="0">SDD (modelo)</tspan></text><rect x="195.5" y="73.5" width="178.5" height="47" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="284.75" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="284.75" dy="0">muerto</tspan></text><rect x="377" y="73.5" width="178.5" height="47" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="466.25" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="466.25" dy="0">muerto</tspan></text><rect x="558.5" y="73.5" width="178.5" height="47" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="647.75" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="647.75" dy="0">vive</tspan></text><rect x="740" y="73.5" width="178.5" height="47" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="829.25" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="829.25" dy="0">muerto</tspan></text><rect x="195.5" y="123.5" width="178.5" height="47" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="284.75" y="151.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="284.75" dy="0">muerto</tspan></text><rect x="377" y="123.5" width="178.5" height="47" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="466.25" y="151.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="466.25" dy="0">vive</tspan></text><rect x="558.5" y="123.5" width="178.5" height="47" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="647.75" y="151.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="647.75" dy="0">vive</tspan></text><rect x="740" y="123.5" width="178.5" height="47" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="829.25" y="151.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="829.25" dy="0">muerto</tspan></text><rect x="195.5" y="173.5" width="178.5" height="47" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="284.75" y="201.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="284.75" dy="0">vive</tspan></text><rect x="377" y="173.5" width="178.5" height="47" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="466.25" y="201.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="466.25" dy="0">vive</tspan></text><rect x="558.5" y="173.5" width="178.5" height="47" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="647.75" y="201.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="647.75" dy="0">vive</tspan></text><rect x="740" y="173.5" width="178.5" height="47" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="829.25" y="201.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="829.25" dy="0">vive</tspan></text><rect x="195.5" y="223.5" width="178.5" height="47" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="284.75" y="251.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="284.75" dy="0">muerto</tspan></text><rect x="377" y="223.5" width="178.5" height="47" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="466.25" y="251.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="466.25" dy="0">muerto</tspan></text><rect x="558.5" y="223.5" width="178.5" height="47" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="647.75" y="251.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="647.75" dy="0">muerto</tspan></text><rect x="740" y="223.5" width="178.5" height="47" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="829.25" y="251.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="829.25" dy="0">muerto</tspan></text><text x="194" y="298" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="194" dy="0">muerto</tspan></text><rect x="247.24" y="286" width="30.5" height="14" fill="#fbe4de"/><rect x="277.24" y="286" width="30.5" height="14" fill="#f3cdc5"/><rect x="307.24" y="286" width="30.5" height="14" fill="#eab6ac"/><rect x="337.24" y="286" width="30.5" height="14" fill="#e29f93"/><rect x="367.24" y="286" width="30.5" height="14" fill="#d9887a"/><rect x="397.24" y="286" width="30.5" height="14" fill="#d17161"/><rect x="427.24" y="286" width="30.5" height="14" fill="#c85a48"/><rect x="457.24" y="286" width="30.5" height="14" fill="#c0432f"/><text x="495.24" y="298" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="495.24" dy="0">vive</tspan></text><text x="533.4" y="298" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="533.4" dy="0">más oscuro = mayor (Mutante vivo)</tspan></text><rect x="10" y="314" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="338.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">En todos los casos la causa es una dimensión que el artefacto no varía o una regla que no repite. Añadir un ejemplo con dos</tspan></text><text x="470" y="355.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">personas y un curso común mata S4 en TDD, BDD y ATDD.</tspan></text><text x="470" y="403.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Núcleo de Avisos con 20 mutantes escritos a mano (18 no equivalentes y 2 equivalentes); ejecutado en Windows 11 y Ubuntu (WSL2) con los mismos recuentos.</tspan></text></svg>
