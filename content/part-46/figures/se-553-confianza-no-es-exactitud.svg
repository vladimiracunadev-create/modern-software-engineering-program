<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 550" width="940" height="550" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">1 000 preguntas sintéticas: la confianza declarada frente al acierto observado</title><desc id="d">Barras agrupadas con la confianza media declarada y la exactitud observada por tramo de confianza y por dificultad: globalmente 88,6 % de confianza frente a 77,9 % de exactitud; en las preguntas difíciles la confianza es 87,3 % y el acierto 56,8 %.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="550" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">1 000 preguntas sintéticas: la confianza declarada frente al acierto observado</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Confianza media declarada</tspan></text><rect x="252.5" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="272.5" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="272.5" dy="0">Exactitud observada</tspan></text><line x1="78.62" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="375" x2="78.62" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="319" x2="920" y2="319" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="319" x2="78.62" y2="319" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="323.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">20</tspan></text><line x1="78.62" y1="263" x2="920" y2="263" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="263" x2="78.62" y2="263" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="267.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">40</tspan></text><line x1="78.62" y1="207" x2="920" y2="207" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="207" x2="78.62" y2="207" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="211.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">60</tspan></text><line x1="78.62" y1="151" x2="920" y2="151" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="151" x2="78.62" y2="151" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="155.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">80</tspan></text><line x1="78.62" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="95" x2="78.62" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="95" x2="78.62" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">Porcentaje (%)</text><rect x="95.4476" y="161.08" width="65.3104" height="213.92" rx="3" fill="#946512"/><text x="128.103" y="155.08" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="128.103" dy="0">76,4</tspan></text><rect x="164.758" y="143.44" width="65.3104" height="231.56" rx="3" fill="#087f8c"/><text x="197.413" y="137.44" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197.413" dy="0">82,7</tspan></text><text x="162.758" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="162.758" dy="0">50–80 %</tspan></text><rect x="263.724" y="135.6" width="65.3104" height="239.4" rx="3" fill="#946512"/><text x="296.379" y="129.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="296.379" dy="0">85,5</tspan></text><rect x="333.034" y="167.24" width="65.3104" height="207.76" rx="3" fill="#087f8c"/><text x="365.689" y="161.24" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="365.689" dy="0">74,2</tspan></text><text x="331.034" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="331.034" dy="0">80–90 %</tspan></text><rect x="432" y="109.84" width="65.3104" height="265.16" rx="3" fill="#946512"/><text x="464.655" y="103.84" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="464.655" dy="0">94,7</tspan></text><rect x="501.31" y="148.48" width="65.3104" height="226.52" rx="3" fill="#087f8c"/><text x="533.965" y="142.48" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="533.965" dy="0">80,9</tspan></text><text x="499.31" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="499.31" dy="0">90–100 %</tspan></text><rect x="600.276" y="124.4" width="65.3104" height="250.6" rx="3" fill="#946512"/><text x="632.931" y="118.4" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="632.931" dy="0">89,5</tspan></text><rect x="669.586" y="113.48" width="65.3104" height="261.52" rx="3" fill="#087f8c"/><text x="702.241" y="107.48" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="702.241" dy="0">93,4</tspan></text><text x="667.586" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667.586" dy="0">Fáciles</tspan></text><rect x="768.552" y="130.56" width="65.3104" height="244.44" rx="3" fill="#946512"/><text x="801.207" y="124.56" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="801.207" dy="0">87,3</tspan></text><rect x="837.862" y="215.96" width="65.3104" height="159.04" rx="3" fill="#087f8c"/><text x="870.517" y="209.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="870.517" dy="0">56,8</tspan></text><text x="835.862" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="835.862" dy="0">Difíciles</tspan></text><rect x="10" y="427" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El error de calibración esperado es 11,9 puntos y la confianza casi no distingue las preguntas fáciles de las difíciles: el</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">tono seguro no informa de la dificultad. Que exista este patrón en un modelo real es una pregunta empírica; aquí es un</tspan></text><text x="470" y="485.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">supuesto del autor.</tspan></text><text x="470" y="532.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Proceso sintético con semilla fija; no se llamó a ningún modelo real. Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
