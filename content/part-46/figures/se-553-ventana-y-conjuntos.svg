t-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="781.723" dy="0">94,5</tspan></text><circle cx="892" cy="87" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="76" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">100,0</tspan></text><polyline points="96.62,384.9 439.172,378.6 781.723,353.7 892,334.8" fill="none" stroke="#c0432f" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="91.12" y="379.4" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><rect x="433.672" y="373.1" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><rect x="776.223" y="348.2" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="781.723" y="377.7" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="781.723" dy="0">11,1</tspan></text><rect x="886.5" y="329.3" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="358.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">17,4</tspan></text><rect x="10" y="447" width="920" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">El repositorio suma 1,15 millones de tokens (tamaños lognormales con mediana 6563): ninguna ventana lo contiene, así que</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">alguien decide qué entra. La distribución de tamaños y el recuento de 1 token ≈ 4 caracteres son supuestos del autor.</tspan></text><text x="470" y="536.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Proceso sintético con semilla fija; no se llamó a ningún modelo real. Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
