<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 423" width="940" height="423" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Probabilidad de cumplir los seis requisitos de una tarea según cuántos se escribieron en el prompt</title><desc id="d">Barras con la probabilidad de que se cumplan los seis requisitos de una tarea según cuántos estén escritos: 1,6 % con ninguno, 10,8 % con tres, 38,9 % con cinco y 73,4 % con los seis.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="423" fill="#ffffff"/><text x="250" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">0 de 6 especificados</tspan></text><rect x="260" y="16" width="9.6" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="277.6" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="277.6" dy="0">1,6 %</tspan></text><text x="250" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">1 de 6 especificados</tspan></text><rect x="260" y="60" width="16.2" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="284.2" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="284.2" dy="0">2,7 %</tspan></text><text x="250" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">2 de 6 especificados</tspan></text><rect x="260" y="104" width="36" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="304" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="304" dy="0">6,0 %</tspan></text><text x="250" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">3 de 6 especificados</tspan></text><rect x="260" y="148" width="64.8" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="332.8" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="332.8" dy="0">10,8 %</tspan></text><text x="250" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">4 de 6 especificados</tspan></text><rect x="260" y="192" width="121.2" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="389.2" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="389.2" dy="0">20,2 %</tspan></text><text x="250" y="255.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">5 de 6 especificados</tspan></text><rect x="260" y="236" width="233.4" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="501.4" y="255.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="501.4" dy="0">38,9 %</tspan></text><text x="250" y="299.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">6 de 6 especificados</tspan></text><rect x="260" y="280" width="440.4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="708.4" y="299.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="708.4" dy="0">73,4 %</tspan></text><rect x="10" y="328" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="352.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cada requisito no escrito se cumple por azar la mitad de las veces y cada escrito el 95 %; el producto cae rápido porque</tspan></text><text x="470" y="369.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">los fallos se multiplican. Los dos porcentajes son supuestos del autor: muestran la forma, no la tasa de ningún modelo.</tspan></text><text x="470" y="409.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Proceso sintético con semilla fija; no se llamó a ningún modelo real. Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
