<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 526" width="940" height="526" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Hechos que cambian el 1 % de los días: respuestas obsoletas según la caducidad de la memoria (180 días)</title><desc id="d">Línea con el costo y el riesgo de la caducidad de la memoria: sin caducidad el 54,4 % de las respuestas está obsoleto con 0 refrescos por hecho; con 30 días baja a 13,7 % con 6 refrescos y con 7 días a 3,1 % con 25.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="526" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Hechos que cambian el 1 % de los días: respuestas obsoletas según la caducidad de la memoria (180 días)</tspan></text><line x1="71.08" y1="359" x2="910" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="359" x2="71.08" y2="359" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="363.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="259" x2="910" y2="259" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="259" x2="71.08" y2="259" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="263.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="159" x2="910" y2="159" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="159" x2="71.08" y2="159" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="163.5" font-size="13" text-anchor="end" fon