<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 263" width="940" height="263" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Relevancia total empaquetada en 3 000 tokens con 30 fragmentos candidatos (300 repeticiones)</title><desc id="d">Barras con la relevancia media empaquetada en un presupuesto de 3.000 tokens: 1,86 al azar, 4,13 ordenando por relevancia y 5,00 ordenando por relevancia por token, 21,0 % más que la segunda.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="263" fill="#ffffff"/><text x="250" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">Al azar</tspan></text><rect x="260" y="16" width="167.22" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="435.22" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="435.22" dy="0">1,86</tspan></text><text x="250" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">Por relevancia</tspan></text><rect x="260" y="60" width="371.61" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="639.61" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="639.61" dy="0">4,13</tspan></text><text x="250" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">Por relevancia por token</tspan></text><rect x="260" y="104" width="449.82" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="717.82" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="717.82" dy="0">5,00</tspan></text><rect x="10" y="152" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Elegir lo más relevante a secas gasta el presupuesto en fragmentos grandes; dividir por el tamaño mete 21,0 % más</tspan></text><text x="470" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">relevancia. Las relevancias y tamaños son del autor y la relevancia se supone conocida, algo que en la práctica se estima</tspan></text><text x="470" y="210.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">con error.</tspan></text><text x="470" y="249.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Proceso sintético con semilla fija; no se llamó a ningún modelo real. Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
