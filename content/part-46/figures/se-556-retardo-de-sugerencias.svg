<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 550" width="940" height="550" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">467 pulsaciones sintéticas: peticiones de sugerencia según el retardo antes de pedir</title><desc id="d">Barras agrupadas con las peticiones al modelo y las útiles según el retardo antes de pedir: sin retardo hay 467 peticiones para 60 útiles y con 600 milisegundos hay 60 peticiones para 60 útiles, a costa de esperar antes de ver la sugerencia.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="550" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">467 pulsaciones sintéticas: peticiones de sugerencia según el retardo antes de pedir</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Peticiones al modelo</tspan></text><rect x="214.8" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="234.8" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="234.8" dy="0">Peticiones útiles</tspan></text><line x1="78.62" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="375" x2="78.62" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="319" x2="920" y2="319" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="319" x2="78.62" y2="319" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="323.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="263" x2="920" y2="263" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="263" x2="78.62" y2="263" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="267.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">200</tspan></text><line x1="78.62" y1="207" x2="920" y2="207" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="207" x2="78.62" y2="207" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="211.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">300</tspan></text><line x1="78.62" y1="151" x2="920" y2="151" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="151" x2="78.62" y2="151" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="155.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">400</tspan></text><line x1="78.62" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="95" x2="78.62" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">500</tspan></text><line x1="78.62" y1="95" x2="78.62" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">Peticiones (467 pulsaciones)</text><rect x="99.6545" y="113.48" width="82.138" height="261.52" rx="3" fill="#c0432f"/><text x="140.724" y="107.48" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="140.724" dy="0">467</tspan></text><rect x="185.793" y="341.4" width="82.138" height="33.6" rx="3" fill="#087f8c"/><text x="226.862" y="335.4" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="226.862" dy="0">60</tspan></text><text x="183.793" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="183.793" dy="0">0 ms</tspan></text><rect x="310" y="187.4" width="82.138" height="187.6" rx="3" fill="#c0432f"/><text x="351.069" y="181.4" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="351.069" dy="0">335</tspan></text><rect x="396.138" y="341.4" width="82.138" height="33.6" rx="3" fill="#087f8c"/><text x="437.207" y="335.4" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="437.207" dy="0">60</tspan></text><text x="394.138" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="394.138" dy="0">150 ms</tspan></text><rect x="520.345" y="300.52" width="82.138" height="74.48" rx="3" fill="#c0432f"/><text x="561.413" y="294.52" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="561.413" dy="0">133</tspan></text><rect x="606.483" y="341.4" width="82.138" height="33.6" rx="3" fill="#087f8c"/><text x="647.552" y="335.4" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="647.552" dy="0">60</tspan></text><text x="604.482" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="604.482" dy="0">300 ms</tspan></text><rect x="730.689" y="341.4" width="82.138" height="33.6" rx="3" fill="#c0432f"/><text x="771.758" y="335.4" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="771.758" dy="0">60</tspan></text><rect x="816.827" y="341.4" width="82.138" height="33.6" rx="3" fill="#087f8c"/><text x="857.896" y="335.4" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="857.896" dy="0">60</tspan></text><text x="814.827" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="814.827" dy="0">600 ms</tspan></text><rect x="10" y="427" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Esperar a que la escritura se detenga elimina casi todo el gasto sin perder las pausas donde la sugerencia se habría</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">mostrado. El ritmo de escritura y la regla «útil si hay una pausa de 0,5 s» son supuestos del autor; con otra persona</tspan></text><text x="470" y="485.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">cambiarían.</tspan></text><text x="470" y="532.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código estándar ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos.</tspan></text></svg>
