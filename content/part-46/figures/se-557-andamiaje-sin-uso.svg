<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 247" width="940" height="247" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Andamiaje de 8 entidades (200 líneas): lo que tu código llega a usar</title><desc id="d">Barras con las funciones del andamiaje de 8 entidades: 40 generadas, 36 sin uso (90 %) y 4 usadas por el código propio.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="247" fill="#ffffff"/><text x="250" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">Funciones generadas</tspan></text><rect x="260" y="16" width="480" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="748" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="748" dy="0">40</tspan></text><text x="250" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">Funciones sin uso</tspan></text><rect x="260" y="60" width="432" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="700" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="700" dy="0">36 (90 %)</tspan></text><text x="250" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">Funciones que usa tu código</tspan></text><rect x="260" y="104" width="48" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="316" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="316" dy="0">4</tspan></text><rect x="10" y="152" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Generar es instantáneo; el costo aparece después, porque todo lo generado hay que entender, probar y mantener aunque no se</tspan></text><text x="470" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">use. Las 200 líneas contienen cero líneas de dominio. Las cuatro funciones usadas son un supuesto del autor.</tspan></text><text x="470" y="233.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código estándar ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos.</tspan></text></svg>
