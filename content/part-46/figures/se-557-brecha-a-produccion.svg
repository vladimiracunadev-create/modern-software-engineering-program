<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 247" width="940" height="247" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un prototipo sintético frente a 8 atributos que producción exige (5 000 prototipos)</title><desc id="d">Barras con el trabajo necesario para llevar un prototipo a producción: 65 puntos en total, 57 pendientes en la mediana (87,7 %) y 65 en el percentil 90.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="247" fill="#ffffff"/><text x="270" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="270" dy="0">Trabajo para producción</tspan></text><rect x="280" y="16" width="440" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="728" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="728" dy="0">65 puntos</tspan></text><text x="270" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="270" dy="0">Pendiente en la mediana</tspan></text><rect x="280" y="60" width="385.846" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="673.846" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="673.846" dy="0">57 puntos</tspan></text><text x="270" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="270" dy="0">Pendiente en el percentil 90</tspan></text><rect x="280" y="104" width="440" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="728" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="728" dy="0">65 puntos</tspan></text><rect x="10" y="152" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">En la mediana queda pendiente el 87,7 % del trabajo: el prototipo demostró la idea, no la ingeniería. Las probabilidades de</tspan></text><text x="470" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">que cada atributo ya exista y los puntos de esfuerzo son supuestos del autor.</tspan></text><text x="470" y="233.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Proceso sintético con semilla fija; no se llamó a ningún modelo real. Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
