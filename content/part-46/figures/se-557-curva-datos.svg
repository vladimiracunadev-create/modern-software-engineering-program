<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">AUC en la población nueva según las filas etiquetadas: ajustar el modelo base frente a entrenar desde cero</title><desc id="d">Líneas con el AUC en la población nueva según las filas etiquetadas: el modelo ajustado vale 0,837, 0,838, 0,841, 0,842 y 0,842 con 50, 200, 1000, 5000 y 20000 filas; el entrenado desde cero vale 0,792, 0,823, 0,808, 0,828 y 0,841; el modelo base sin adaptar vale 0,840.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">AUC en la población nueva según las filas etiquetadas: ajustar el modelo base frente a entrenar desde cero</tspan></text><circle cx="22" cy="51" r="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Ajuste del modelo base</tspan></text><rect x="229.88" y="45" width="12" height="12" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="249.88" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="249.88" dy="0">Entrenado desde cero</tspan></text><line x1="86.16" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="387" x2="86.16" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0"