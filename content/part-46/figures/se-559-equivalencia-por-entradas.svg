<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 454" width="940" height="454" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro versiones refactorizadas frente a la original: probabilidad de que n entradas aleatorias las distingan</title><desc id="d">Mapa de calor con la probabilidad de que n entradas aleatorias distingan cada refactorización de la original: la equivalente nunca difiere; las que pierden el orden o descartan la nota cero se distinguen con 5 entradas; la que descarta cursos con 5 notas o más necesita 1 000 entradas para el 100,0 %.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="454" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuatro versiones refactorizadas frente a la original: probabilidad de que n entradas aleatorias las</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">distingan</tspan></text><text x="633" y="78" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="633" dy="0">Entradas aleatorias</tspan></text><text x="417.75" y="101" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="417.75" dy="0">5 entradas</tspan></text><text x="561.25" y="101" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="561.25" dy="0">20</tspan></text><text x="704.75" y="101" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="704.75" dy="0">100</tspan></text><text x="848.25" y="101" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="848.25" dy="0">1 000</tspan></text><text x="336" y="139.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="336" dy="0">Equivalente</tspan></text><text x="336" y="183.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="336" dy="0">Pierde el orden</tspan></text><text x="336" y="227.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="336" dy="0">Descarta la nota 0,0</tspan></text><text x="336" y="271.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="336" dy="0">Descarta cursos con 5 notas o más</tspan></text><rect x="347.5" y="114.5" width="140.5" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="417.75" y="139.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="417.75" dy="0">0,0 %</tspan></text><rect x="491" y="114.5" width="140.5" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="561.25" y="139.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="561.25" dy="0">0,0 %</tspan></text><rect x="634.5" y="114.5" width="140.5" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="704.75" y="139.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="704.75" dy="0">0,0 %</tspan></text><rect x="778" y="114.5" width="140.5" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="848.25" y="139.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="848.25" dy="0">0,0 %</tspan></text><rect x="347.5" y="158.5" width="140.5" height="41" rx="4" fill="#097f8c" stroke="#ffffff" stroke-width="1"/><text x="417.75" y="183.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="417.75" dy="0">99,6 %</tspan></text><rect x="491" y="158.5" width="140.5" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="561.25" y="183.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="561.25" dy="0">100,0 %</tspan></text><rect x="634.5" y="158.5" width="140.5" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="704.75" y="183.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="704.75" dy="0">100,0 %</tspan></text><rect x="778" y="158.5" width="140.5" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="848.25" y="183.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="848.25" dy="0">100,0 %</tspan></text><rect x="347.5" y="202.5" width="140.5" height="41" rx="4" fill="#0b818d" stroke="#ffffff" stroke-width="1"/><text x="417.75" y="227.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="417.75" dy="0">98,5 %</tspan></text><rect x="491" y="202.5" width="140.5" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="561.25" y="227.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="561.25" dy="0">100,0 %</tspan></text><rect x="634.5" y="202.5" width="140.5" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="704.75" y="227.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="704.75" dy="0">100,0 %</tspan></text><rect x="778" y="202.5" width="140.5" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="848.25" y="227.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="848.25" dy="0">100,0 %</tspan></text><rect x="347.5" y="246.5" width="140.5" height="41" rx="4" fill="#d4ebe9" stroke="#ffffff" stroke-width="1"/><text x="417.75" y="271.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="417.75" dy="0">5,1 %</tspan></text><rect x="491" y="246.5" width="140.5" height="41" rx="4" fill="#b6dbdb" stroke="#ffffff" stroke-width="1"/><text x="561.25" y="271.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="561.25" dy="0">18,9 %</tspan></text><rect x="634.5" y="246.5" width="140.5" height="41" rx="4" fill="#53a7ae" stroke="#ffffff" stroke-width="1"/><text x="704.75" y="271.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="704.75" dy="0">65,0 %</tspan></text><rect x="778" y="246.5" width="140.5" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="848.25" y="271.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="848.25" dy="0">100,0 %</tspan></text><text x="20" y="201" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 201)">Refactorización</text><text x="346" y="315" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="346" dy="0">0,0 %</tspan></text><rect x="391.7" y="303" width="30.5" height="14" fill="#dff1ee"/><rect x="421.7" y="303" width="30.5" height="14" fill="#c0e1e0"/><rect x="451.7" y="303" width="30.5" height="14" fill="#a2d0d2"/><rect x="481.7" y="303" width="30.5" height="14" fill="#83c0c4"/><rect x="511.7" y="303" width="30.5" height="14" fill="#64b0b6"/><rect x="541.7" y="303" width="30.5" height="14" fill="#45a0a8"/><rect x="571.7" y="303" width="30.5" height="14" fill="#278f9a"/><rect x="601.7" y="303" width="30.5" height="14" fill="#087f8c"/><text x="639.7" y="315" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="639.7" dy="0">100,0 %</tspan></text><text x="700.48" y="315" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="700.48" dy="0">más oscuro = mayor (% que la detecta)</tspan></text><rect x="10" y="331" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="355.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Las diferencias frecuentes se ven con unas pocas entradas; la que ocurre en una de cien exige cientos, y una prueba con</tspan></text><text x="470" y="372.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">tres ejemplos escritos a mano casi nunca la encuentra. Que no aparezca una diferencia no demuestra equivalencia. Las</tspan></text><text x="470" y="389.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">funciones y la distribución de entradas son del autor.</tspan></text><text x="470" y="436.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código estándar ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos.</tspan></text></svg>
