<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 247" width="940" height="247" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Treinta funciones con un comentario: qué entrega un explicador que lo repite</title><desc id="d">Barras con treinta funciones de las que 21 tienen un comentario que coincide con el código y 9 un comentario desfasado; un explicador que repite el comentario entrega 9 explicaciones erróneas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="247" fill="#ffffff"/><text x="250" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">Funciones</tspan></text><rect x="260" y="16" width="600" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="868" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="868" dy="0">30</tspan></text><text x="250" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">Comentario correcto</tspan></text><rect x="260" y="60" width="420" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="688" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="688" dy="0">21</tspan></text><text x="250" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">Comentario desfasado</tspan></text><rect x="260" y="104" width="180" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="448" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="448" dy="0">9</tspan></text><rect x="10" y="152" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Una explicación fluida que repite el comentario hereda su error y lo presenta con aplomo; leer la sentencia del código lo</tspan></text><text x="470" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">habría evitado. El número de funciones desfasadas y el parecido con un explicador real son supuestos del autor.</tspan></text><text x="470" y="233.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código estándar ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos.</tspan></text></svg>
