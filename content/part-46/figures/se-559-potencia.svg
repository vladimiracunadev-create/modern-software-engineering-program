<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 393" width="940" height="393" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Probabilidad de que un canary detecte una regresión de 5,7 puntos en un segmento del 17 % del tráfico</title><desc id="d">Mapa de calor con la probabilidad de detectar una regresión de 5,7 puntos de error en un segmento del 17 por ciento del tráfico: con canary del 1 por ciento 10 por ciento tras un día, 23 tras tres y 40 tras siete; con 5 por ciento 26, 63 y 91; con 25 por ciento 81, 100 y 100.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="393" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Probabilidad de que un canary detecte una regresión de 5,7 puntos en un segmento del 17 % del tráfico</tspan></text><text x="315" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="315" dy="0">1 día</tspan></text><text x="557" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="557" dy="0">3 días</tspan></text><text x="799" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="799" dy="0">7 días</tspan></text><text x="184" y="102.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="184" dy="0">Canary del 1 %</tspan></text><text x="184" y="154.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="184" dy="0">Canary del 5 %</tspan></text><text x="184" y="206.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="184" dy="0">Canary del 25 %</tspan></text><rect x="195.5" y="73.5" width="239" height="49" rx="4" fill="#c5d0db" stroke="#ffffff" stroke-width="1"/><text x="315" y="102.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="315" dy="0">10 %</tspan></text><rect x="437.5" y="73.5" width="239" height="49" rx="4" fill="#abb8c5" stroke="#ffffff" stroke-width="1"/><text x="557" y="102.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="557" dy="0">23 %</tspan></text><rect x="679.5" y="73.5" width="239" height="49" rx="4" fill="#8998a8" stroke="#ffffff" stroke-width="1"/><text x="799" y="102.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="799" dy="0">40 %</tspan></text><rect x="195.5" y="125.5" width="239" height="49" rx="4" fill="#a5b2c0" stroke="#ffffff" stroke-width="1"/><text x="315" y="154.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="315" dy="0">26 %</tspan></text><rect x="437.5" y="125.5" width="239" height="49" rx="4" fill="#5a6e82" stroke="#ffffff" stroke-width="1"/><text x="557" y="154.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="557" dy="0">63 %</tspan></text><rect x="679.5" y="125.5" width="239" height="49" rx="4" fill="#223b52" stroke="#ffffff" stroke-width="1"/><text x="799" y="154.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="799" dy="0">91 %</tspan></text><rect x="195.5" y="177.5" width="239" height="49" rx="4" fill="#364d63" stroke="#ffffff" stroke-width="1"/><text x="315" y="206.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="315" dy="0">81 %</tspan></text><rect x="437.5" y="177.5" width="239" height="49" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="557" y="206.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="557" dy="0">100 %</tspan></text><rect x="679.5" y="177.5" width="239" height="49" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="799" y="206.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="799" dy="0">100 %</tspan></text><text x="194" y="254" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="194" dy="0">0 %</tspan></text><rect x="224.62" y="242" width="30.5" height="14" fill="#d9e2ec"/><rect x="254.62" y="242" width="30.5" height="14" fill="#bcc8d4"/><rect x="284.62" y="242" width="30.5" height="14" fill="#a0adbc"/><rect x="314.62" y="242" width="30.5" height="14" fill="#8393a4"/><rect x="344.62" y="242" width="30.5" height="14" fill="#66798b"/><rect x="374.62" y="242" width="30.5" height="14" fill="#495f73"/><rect x="404.62" y="242" width="30.5" height="14" fill="#2d445b"/><rect x="434.62" y="242" width="30.5" height="14" fill="#102a43"/><text x="472.62" y="254" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="472.62" dy="0">100 %</tspan></text><text x="518.32" y="254" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="518.32" dy="0">más oscuro = mayor (% de simulaciones que detectan)</tspan></text><rect x="10" y="270" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="294.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Días de decisiones ya etiquetadas, con 20 000 decisiones diarias y un contraste unilateral al 5 %; 400 repeticiones por</tspan></text><text x="470" y="311.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">celda. El canary del 1 % no llega al 50 % ni con siete días; el del 25 % llega al 81 % con uno. Las etiquetas tardan siete</tspan></text><text x="470" y="328.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">días en llegar, lo que desplaza todas las columnas.</tspan></text><text x="470" y="375.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo sintético con parámetros del autor y semilla fija 46; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
