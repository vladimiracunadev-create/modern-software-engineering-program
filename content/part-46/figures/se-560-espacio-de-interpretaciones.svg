<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 506" width="940" height="506" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">«Calcula la nota final»: interpretaciones coherentes con el texto según las restricciones dadas</title><desc id="d">Línea en escala logarítmica con las interpretaciones coherentes de «calcula la nota final» al añadir restricciones: sin restricciones hay 729 y se acierta al azar con 0,14 %; cada restricción divide por tres y con todas queda 1 interpretación.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="506" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">«Calcula la nota final»: interpretaciones coherentes con el texto según las restricciones dadas</tspan></text><line x1="93.7" y1="339" x2="910" y2="339" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="339" x2="93.7" y2="339" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="343.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1</tspan></text><line x1="93.7" y1="245.667" x2="910" y2="245.667" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="245.667" x2="93.7" y2="245.667" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="250.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">10</tspan></text><line x1="93.7" y1="152.333" x2="910" y2="152.333" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="152.333" x2="93.7" y2="152.333" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="156.833" fo