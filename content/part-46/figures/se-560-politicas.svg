<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 437" width="940" height="437" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro políticas de reentrenamiento durante 44 semanas de deriva: AUC medio y AUC de las últimas doce semanas</title><desc id="d">Mancuernas con el AUC medio de las semanas 9 a 52 y el de las últimas doce semanas según la política de reentrenamiento: nunca 0,818 y 0,795 con 0 reentrenamientos, trimestral 0,827 y 0,820 con 3, mensual 0,828 y 0,821 con 11 y disparada por la métrica 0,828 y 0,822 con 4.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="437" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuatro políticas de reentrenamiento durante 44 semanas de deriva: AUC medio y AUC de las últimas doce</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">semanas</tspan></text><circle cx="22" cy="70" r="6" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Media de las semanas 9 a 52</tspan></text><circle cx="273.58" cy="70" r="6" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="287.58" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="287.58" dy="0">Últimas doce semanas</tspan></text><line x1="332.3" y1="96" x2="332.3" y2="256" stroke="#d5dde1" stroke-width="1"/><line x1="332.3" y1="256" x2="332.3" y2="261" stroke="#5b7280" stroke-wid