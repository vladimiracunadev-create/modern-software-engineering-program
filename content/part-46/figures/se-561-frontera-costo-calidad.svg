t-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="626.873" dy="0">12</tspan></text><line x1="892" y1="87" x2="892" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="407" x2="892" y2="412" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="428" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0"></tspan></text><line x1="78.62" y1="407" x2="910" y2="407" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="247" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 247)">Éxito (%)</text><text x="494.31" y="453" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Latencia (s)</tspan></text><circle cx="149.645" cy="343" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="159.645" y="347.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="159.645" dy="0">pequeño</tspan></text><circle cx="207.089" cy="257.667" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="197.089" y="262.167" font-size="13" text-anchor="end" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="197.089" dy="0">mediano</tspan></text><circle cx="277.79" cy="215" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="287.79" y="219.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="287.79" dy="0">mediano + contexto</tspan></text><circle cx="361.747" cy="193.667" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="371.747" y="198.167" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="371.747" dy="0">grande</tspan></text><circle cx="626.873" cy="161.667" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="636.873" y="166.167" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="636.873" dy="0">grande + contexto + juez</tspan></text><rect x="206.008" y="273.5" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="221.508" y="283.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="221.508" dy="0">pequeño + reintento</tspan></text><rect x="10" y="467" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="491.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La revisión humana (0,40 por intento) pesa mucho más que el costo del modelo: lo barato por intento sale caro por solución</tspan></text><text x="470" y="508.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">aceptada. Todos los valores, incluida la revisión de 0,40, son supuestos del autor en una unidad arbitraria.</tspan></text><text x="470" y="556.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Proceso sintético con semilla fija; no se llamó a ningún modelo real. Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
