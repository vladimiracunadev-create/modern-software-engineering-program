<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 574" width="940" height="574" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Seis configuraciones sintéticas: éxito, costo por intento, latencia y costo por solución aceptada</title><desc id="d">Dispersión de la latencia y la tasa de éxito de seis configuraciones de un asistente: el pequeño con reintento queda dominado, con menos éxito que el mediano y más latencia; el éxito sube de 52 por ciento con 1,2 segundos a 86 con 12 segundos; el costo por solución aceptada incluye una revisión humana de 0,40.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="574" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Seis configuraciones sintéticas: éxito, costo por intento, latencia y costo por solución aceptada</tspan></text><circle cx="22" cy="51" r="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Configuración no dominada</tspan></text><rect x="252.5" y="45" width="12" height="12" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="272.5" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="272.5" dy="0">Configuración dominada</tspan></text><line x1="78.62" y1="407" x2="910" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="407" x2="78.62" y2="407" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="411.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">40</tspan></text><line x1="78.62" y1="353.667" x2="910" y2="353.667" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="353.667" x2="78.62" y2="353.667" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="358.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">50</tspan></text><line x1="78.62" y1="300.333" x2="910" y2="300.333" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="300.333" x2="78.62" y2="300.333" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="304.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">60</tspan></text><line x1="78.62" y1="247" x2="910" y2="247" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="247" x2="78.62" y2="247" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="251.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">70</tspan></text><line x1="78.62" y1="193.667" x2="910" y2="193.667" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="193.667" x2="78.62" y2="193.667" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="198.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">80</tspan></text><line x1="78.62" y1="140.333" x2="910" y2="140.333" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="140.333" x2="78.62" y2="140.333" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="144.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">90</tspan></text><line x1="78.62" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="87" x2="78.62" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="87" x2="78.62" y2="407" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="87" x2="96.62" y