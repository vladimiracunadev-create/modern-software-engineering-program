<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 628" width="940" height="628" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un sistema con 70 % de éxito y otro con 75 %: intervalo de Wilson y probabilidad de ordenarlos bien</title><desc id="d">Intervalos horizontales con el intervalo de Wilson al 95 por ciento para un 70 por ciento de éxito según el tamaño del conjunto: con 20 tareas va de 48,1 % a 85,5 %, con 300 de 64,6 % a 74,9 % y con 1000 de 67,1 % a 72,8 %; la probabilidad de ordenar bien 70 y 75 por ciento sube de 58,3 % a 99,2 %.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="628" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un sistema con 70 % de éxito y otro con 75 %: intervalo de Wilson y probabilidad de ordenarlos bien</tspan></text><rect x="16" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">límite inferior</tspan></text><polygon points="183.1,44.1 189.7,56.4 176.5,56.4" fill="#946512" stroke="#946512" stroke-width="2"/><text x="197.1" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="197.1" dy="0">70 % observado</tspan></text><polygon points="336.66,43.5 344.16,51 336.66,58.5 329.16,51" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="350.66" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="350.66" dy="0">límite superior</tspan></text><line x1="164" y1="77" x2="164" y2="447" stroke="#d5dde1" stroke-width="1"/><line x1="164" y1="447" x2="164" y2="452" stroke="#5b7280" stroke-width="1.4"/><text x="164" y="468" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="164" dy="0">0</tspan></text><line x1="309.2" y1="77" x2="309.2" y2="447" stroke="#d5dde1" stroke-width="1"/><line x1="309.2" y1="447" x2="309.2" y2="452" stroke="#5b7280" stroke-width="1.4"/><text x="309.2" y="468" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="309.2" dy="0">20</tspan></text><line x1="454.4" y1="77" x2="454.4" y2="447" stroke="#d5dde1" stroke-width="1"/><line x1="454.4" y1="447" x2="454.4" y2="452" stroke="#5b7280" stroke-width="1.4"/><text x="454.4" y="468" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="454.4" dy="0">40</tspan></text><line x1="599.6" y1="77" x2="599.6" y2="447" stroke="#d5dde1" stroke-width="1"/><line x1="599.6" y1="447" x2="599.6" y2="452" stroke="#5b7280" stroke-width="1.4"/><text x="599.6" y="468" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="599.6" dy="0">60</tspan></text><line x1="744.8" y1="77" x2="744.8" y2="447" stroke="#d5dde1" stroke-width="1"/><line x1="744.8" y1="447" x2="744.8" y2="452" stroke="#5b7280" stroke-width="1.4"/><text x="744.8" y="468" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="744.8" dy="0">80</tspan></text><line x1="890" y1="77" x2="890" y2="447" stroke="#d5dde1" stroke-width="1"/><line x1="890" y1="447" x2="890" y2="452" stroke="#5b7280" stroke-width="1.4"/><text x="890" y="468" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="890" dy="0">100</tspan></text><line x1="164" y1="447" x2="890" y2="447" stroke="#5b7280" stroke-width="1.6"/><text x="134" y="118.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="134" dy="0">20 tareas</tspan></text><text x="134" y="192.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="134" dy="0">50 tareas</tspan></text><text x="134" y="266.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="134" dy="0">100 tareas</tspan></text><text x="134" y="340.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="134" dy="0">300 tareas</tspan></text><text x="134" y="414.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="134" dy="0">1000 tareas</tspan></text><line x1="513.206" y1="114" x2="784.73" y2="114" stroke="#8a9aa3" stroke-width="5"/><rect x="506.206" y="107" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="513.206" y="98" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="513.206" dy="0">48,1</tspan></text><polygon points="672.2,105.95 679.9,120.3 664.5,120.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="672.2" y="143" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="672.2" dy="0">70,0</tspan></text><polygon points="784.73,105.25 793.48,114 784.73,122.75 775.98,114" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="784.73" y="98" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="784.73" dy="0">85,5</tspan></text><line x1="572.012" y1="188" x2="751.334" y2="188" stroke="#8a9aa3" stroke-width="5"/><rect x="565.012" y="181" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="572.012" y="172" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="572.012" dy="0">56,2</tspan></text><polygon points="672.2,179.95 679.9,194.3 664.5,194.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="672.2" y="217" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="672.2" dy="0">70,0</tspan></text><polygon points="751.334,179.25 760.084,188 751.334,196.75 742.584,188" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="751.334" y="172" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="751.334" dy="0">80,9</tspan></text><line x1="602.504" y1="262" x2="731.006" y2="262" stroke="#8a9aa3" stroke-width="5"/><rect x="595.504" y="255" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="602.504" y="246" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="602.504" dy="0">60,4</tspan></text><polygon points="672.2,253.95 679.9,268.3 664.5,268.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="672.2" y="291" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="672.2" dy="0">70,0</tspan></text><polygon points="731.006,253.25 739.756,262 731.006,270.75 722.256,262" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="731.006" y="246" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="731.006" dy="0">78,1</tspan></text><line x1="632.996" y1="336" x2="707.774" y2="336" stroke="#8a9aa3" stroke-width="5"/><rect x="625.996" y="329" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="632.996" y="320" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="632.996" dy="0">64,6</tspan></text><polygon points="672.2,327.95 679.9,342.3 664.5,342.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="672.2" y="365" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="672.2" dy="0">70,0</tspan></text><polygon points="707.774,327.25 716.524,336 707.774,344.75 699.024,336" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="707.774" y="320" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="707.774" dy="0">74,9</tspan></text><line x1="651.146" y1="410" x2="692.528" y2="410" stroke="#8a9aa3" stroke-width="5"/><rect x="644.146" y="403" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="651.146" y="394" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="651.146" dy="0">67,1</tspan></text><polygon points="672.2,401.95 679.9,416.3 664.5,416.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="672.2" y="439" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="672.2" dy="0">70,0</tspan></text><polygon points="692.528,401.25 701.278,410 692.528,418.75 683.778,410" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="692.528" y="394" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="692.528" dy="0">72,8</tspan></text><text x="527" y="491" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="527" dy="0">Tasa de éxito (%)</tspan></text><rect x="10" y="505" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="529.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Con 100 tareas la diferencia de cinco puntos se ordena bien tres de cada cuatro veces; para distinguir cinco puntos con</tspan></text><text x="470" y="546.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">holgura hacen falta cientos. Las tasas de éxito son hipotéticas y las tareas se suponen independientes e igual de</tspan></text><text x="470" y="563.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">difíciles.</tspan></text><text x="470" y="610.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Proceso sintético con semilla fija; no se llamó a ningún modelo real. Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
