l="#946512"/><text x="393.183" y="299" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="393.183" dy="0">2</tspan></text><text x="277.655" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="277.655" dy="0">Texto</tspan></text><rect x="534.593" y="130" width="111.528" height="245" rx="3" fill="#087f8c"/><text x="590.357" y="124" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="590.357" dy="0">7</tspan></text><rect x="650.121" y="373" width="111.528" height="2" rx="3" fill="#c0432f"/><text x="705.885" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="705.885" dy="0">0</tspan></text><rect x="765.649" y="305" width="111.528" height="70" rx="3" fill="#946512"/><text x="821.413" y="299" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="821.413" dy="0">2</tspan></text><text x="705.885" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705.885" dy="0">Árbol</tspan></text><rect x="10" y="427" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El árbol evita marcar comentarios y mensajes pero no ve alias como «f = eval»; ninguna de las dos técnicas sustituye a un</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">análisis de flujo de datos. Los fragmentos están escritos por el autor, algunos pensados para engañar a cada técnica.</tspan></text><text x="470" y="516.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código estándar ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos.</tspan></text></svg>
