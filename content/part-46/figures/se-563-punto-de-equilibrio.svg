<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 526" width="940" height="526" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Flujo asistido frente a manual: ahorro de tiempo según la tasa de aciertos del asistente</title><desc id="d">Línea con el ahorro de tiempo del flujo asistido frente al manual según la tasa de aciertos del asistente: con 90 % ahorra 32 %, con 50 por ciento no ahorra nada y con 20 % cuesta 24 % más; la línea roja marca el punto de equilibrio.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="526" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Flujo asistido frente a manual: ahorro de tiempo según la tasa de aciertos del asistente</tspan></text><line x1="78.62" y1="359" x2="910" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="359" x2="78.62" y2="359" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="363.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">−30</tspan></text><line x1="78.62" y1="316.143" x2="910" y2="316.143" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="316.143" x2="78.62" y2="316.143" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="320.643" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">−20</tspan></text><line x1="78.62" y1="273.286" x2="910" y2="273.286" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="273.286" x2="78.62" y2="273.286" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="277.786" font-size