3.2857 664.749,161.857 437.497,230.429 267.059,281.857 96.62,333.286" fill="none" stroke="#087f8c" stroke-width="2.4"/><circle cx="892" cy="93.2857" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="82.2857" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">32 %</tspan></text><circle cx="664.749" cy="161.857" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="664.749" y="150.857" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="664.749" dy="0">16 %</tspan></text><circle cx="437.497" cy="230.429" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="437.497" y="219.429" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="437.497" dy="0">0 %</tspan></text><circle cx="267.059" cy="281.857" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="267.059" y="270.857" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="267.059" dy="0">-12 %</tspan></text><circle cx="96.62" cy="333.286" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="96.62" y="322.286" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">-24 %</tspan></text><rect x="10" y="419" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="443.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Con generar 35 %, revisar 25 % y rehacer 80 % del tiempo manual, el asistente solo ahorra por encima del 50 % de aciertos.</tspan></text><text x="470" y="460.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Los tres porcentajes son supuestos del autor y se pueden cambiar; la tasa real de aciertos se mide por tipo de tarea.</tspan></text><text x="470" y="508.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Cálculo exacto con la fórmula del texto; sin simulación ni modelo real.</tspan></text></svg>
