<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 385" width="960" height="385" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué artefacto del paquete lee cada comprobación y cómo convergen en la puerta de liberación</title><desc id="d">Diagrama con los artefactos del paquete y las comprobaciones que los leen: el manifiesto alimenta la huella, la reproducibilidad, el AUC, la brecha entre segmentos y el rollback; el monitor alimenta las dos pruebas de deriva; la configuración del canary la guarda por segmento; la ficha y el runbook los campos y el dueño; todas convergen en la puerta de liberación.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="385" fill="#ffffff"/><rect x="10" y="14" width="212.5" height="112" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="116.25" y="48.68" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="116.25" dy="0">manifest.json</tspan></text><text x="116.25" y="65.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="116.25" dy="0">Huellas, semilla,</tspan></text><text x="116.25" y="81.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="116.25" dy="0">versiones, AUC por</tspan></text><text x="116.25" y="98.6" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="116.25" dy="0">segmento</tspan></text><rect x="252.5" y="14" width="212.5" height="112" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="358.75" y="65.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="358.75" dy="0">model-v1 y model-v0</tspan></text><text x="358.75" y="81.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="358.75" dy="0">Vigente y anterior</tspan></text><polyline points="222.5,70 252.5,70" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="495" y="14" width="212.5" height="112" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="601.25" y="65.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="601.25" dy="0">Monitor de deriva</tspan></text><text x="601.25" y="81.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="601.25" dy="0">Umbral y ventana</tspan></text><polyline points="465,70 495,70" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="737.5" y="14" width="212.5" height="112" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="843.75" y="57" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="843.75" dy="0">canary.json y runbook.md</tspan></text><text x="843.75" y="73.64" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="843.75" dy="0">Guardas, dueño;</tspan></text><text x="843.75" y="90.28" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="843.75" dy="0">model-card.md</tspan></text><polyline points="707.5,70 737.5,70" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="166" width="212.5" height="112" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="116.25" y="217.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="116.25" dy="0">Huella, reproducible, AUC,</tspan></text><text x="116.25" y="233.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="116.25" dy="0">brecha, rollback</tspan></text><rect x="252.5" y="166" width="212.5" height="112" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="358.75" y="209" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="358.75" dy="0">Alerta de deriva, sin</tspan></text><text x="358.75" y="225.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="358.75" dy="0">falsa alarma, unidad</tspan></text><text x="358.75" y="242.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="358.75" dy="0">errónea</tspan></text><polyline points="222.5,222 252.5,222" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="495" y="166" width="212.5" height="112" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="601.25" y="217.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="601.25" dy="0">Guarda por segmento,</tspan></text><text x="601.25" y="233.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="601.25" dy="0">ficha, dueño</tspan></text><polyline points="465,222 495,222" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="737.5" y="166" width="212.5" height="112" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="843.75" y="209" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="843.75" dy="0">Puerta: 11 de 11 libera;</tspan></text><text x="843.75" y="225.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="843.75" dy="0">si no, bloquea con el</tspan></text><text x="843.75" y="242.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="843.75" dy="0">motivo</tspan></text><polyline points="707.5,222 737.5,222" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="843.75,126 843.75,146 116.25,146 116.25,166" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="292" width="940" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="316.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Ninguna comprobación lee un indicador declarado: cada una abre un archivo y calcula. Un sistema real tiene más artefactos y</tspan></text><text x="480" y="333.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">más comprobaciones, y cada comprobación nueva se añade con una variante defectuosa que la pruebe.</tspan></text><text x="480" y="375.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9, numpy 2.4.4 y scikit-learn 1.8.0; los recuentos con semilla se repiten y los tiempos varían de un equipo a otro.</tspan></text></svg>
