<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 578" width="940" height="578" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ocho modos de fallo del Horno de curado: puesto por gravedad y puesto por número de prioridad de riesgo</title><desc id="d">Gráfico de pares con el puesto de ocho modos de fallo según su gravedad y según su RPN: el relé del limitador soldado, de gravedad 10, pasa del puesto 1 al 4 por RPN; la deriva de calibración sube del 3 al 1 y el conector de puerta del 4 al 2.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="578" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Ocho modos de fallo del Horno de curado: puesto por gravedad y puesto por número de prioridad de riesgo</tspan></text><circle cx="22" cy="51" r="6" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Puesto por gravedad</tspan></text><circle cx="213.26" cy="51" r="6" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="227.26" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="227.26" dy="0">Puesto por RPN</tspan></text><line x1="300.06" y1="77" x2="300.06" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="300.06" y1="397" x2="300.06" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="300.06" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="300.06" dy="0">0</tspan></text><line x1="447.53" y1="77" x2="447.53" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="447.53" y1="397" x2="447.53" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="447.53" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447.53" dy="0">2</tspan></text><line x1="595" y1="77" x2="595" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="595" y1="397" x2="595" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="595" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="595" dy="0">4</tspan></text><line x1="742.47" y1="77" x2="742.47" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="742.47" y1="397" x2="742.47" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="742.47" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742.47" dy="0">6</tspan></text><line x1="889.94" y1="77" x2="889.94" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="889.94" y1="397" x2="889.94" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="889.94" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="889.94" dy="0">8</tspan></text><line x1="300.06" y1="397" x2="889.94" y2="397" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="101.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Deriva de calibración</tspan></text><text x="264" y="141.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Conector de puerta</tspan></text><text x="264" y="181.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Sensor en lectura baja</tspan></text><text x="264" y="221.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Relé soldado</tspan></text><text x="264" y="261.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Ruido del convertidor</tspan></text><text x="264" y="301.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Reinicio por perro guardián</tspan></text><text x="264" y="341.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Pantalla rezagada</tspan></text><text x="264" y="381.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Memoria del registro</tspan></text><line x1="521.265" y1="97" x2="373.795" y2="97" stroke="#087f8c" stroke-width="4"/><circle cx="521.265" cy="97" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="373.795" cy="97" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="533.265" y="101.5" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="533.265" dy="0">3</tspan></text><text x="361.795" y="101.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="361.795" dy="0">1</tspan></text><line x1="595" y1="137" x2="447.53" y2="137" stroke="#087f8c" stroke-width="4"/><circle cx="595" cy="137" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="447.53" cy="137" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="607" y="141.5" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="607" dy="0">4</tspan></text><text x="435.53" y="141.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="435.53" dy="0">2</tspan></text><line x1="447.53" y1="177" x2="521.265" y2="177" stroke="#c0432f" stroke-width="4"/><circle cx="447.53" cy="177" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="521.265" cy="177" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="435.53" y="181.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="435.53" dy="0">2</tspan></text><text x="533.265" y="181.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="533.265" dy="0">3</tspan></text><line x1="373.795" y1="217" x2="595" y2="217" stroke="#c0432f" stroke-width="4"/><circle cx="373.795" cy="217" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="595" cy="217" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="361.795" y="221.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="361.795" dy="0">1</tspan></text><text x="607" y="221.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="607" dy="0">4</tspan></text><line x1="742.47" y1="257" x2="668.735" y2="257" stroke="#087f8c" stroke-width="4"/><circle cx="742.47" cy="257" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="668.735" cy="257" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="754.47" y="261.5" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="754.47" dy="0">6</tspan></text><text x="656.735" y="261.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="656.735" dy="0">5</tspan></text><line x1="668.735" y1="297" x2="742.47" y2="297" stroke="#c0432f" stroke-width="4"/><circle cx="668.735" cy="297" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="742.47" cy="297" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="656.735" y="301.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="656.735" dy="0">5</tspan></text><text x="754.47" y="301.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="754.47" dy="0">6</tspan></text><line x1="816.205" y1="337" x2="816.205" y2="337" stroke="#c0432f" stroke-width="4"/><circle cx="816.205" cy="337" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="816.205" cy="337" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="804.205" y="341.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="804.205" dy="0">7</tspan></text><text x="828.205" y="341.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="828.205" dy="0">7</tspan></text><line x1="889.94" y1="377" x2="889.94" y2="377" stroke="#c0432f" stroke-width="4"/><circle cx="889.94" cy="377" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="889.94" cy="377" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="877.94" y="381.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="877.94" dy="0">8</tspan></text><text x="901.94" y="381.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="901.94" dy="0">8</tspan></text><text x="595" y="441" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="595" dy="0">Puesto (1 es el más urgente)</tspan></text><rect x="10" y="455" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="479.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El RPN multiplica tres escalas ordinales de 1 a 10: las 1000 combinaciones dan solo 120 valores distintos, y 24</tspan></text><text x="470" y="496.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">combinaciones comparten el mismo número, con gravedades desde 2 hasta 10. Con cambios de una unidad en el 20 % de las</tspan></text><text x="470" y="513.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">valoraciones, el mismo trío encabeza en el 76,8 % de 2000 repeticiones. Las valoraciones son del autor.</tspan></text><text x="470" y="560.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 47; muestra un mecanismo, no mide un producto real.</tspan></text></svg>
