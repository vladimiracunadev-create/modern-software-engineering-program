" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="418.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La comprobación formal encuentra 8 de 12 y el árbol sintáctico llega a 11. Queda sin ver una prueba con forma correcta que</tspan></text><text x="470" y="435.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">comprueba otra cosa. Los defectos los inyectó el autor y la comprobación se escribió para encontrarlos.</tspan></text><text x="470" y="483.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
