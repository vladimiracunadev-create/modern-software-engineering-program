<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 501" width="940" height="501" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Doce defectos inyectados entre 25 entradas de especificación y 24 pruebas: qué comprobación encuentra cada uno</title><desc id="d">Barras apiladas horizontales con los defectos inyectados que encuentra cada comprobación: identificadores y criterios encuentran 8 (3 requisitos sin prueba, 2 pruebas huérfanas, 1 identificador repetido, 2 requisitos sin criterio), el árbol sintáctico añade las 3 pruebas sin aserción y llega a 11, y queda sin ver una prueba que cita el requisito RF-02 pero afirma que dos más dos son cuatro.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="501" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Doce defectos inyectados entre 25 entradas de especificación y 24 pruebas: qué comprobación encuentra cada</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">uno</tspan></text><rect x="16" y="64" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Encontrados por identificadores y criterios</tspan></text><rect x="388.22" y="64" width="12" height="12" rx="2" fill="#102a43"/><text x="408.22" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="408.22" dy="0">Añadidos por el árbol sintáctico</tspan></text><rect x="677.5" y="64" width="1