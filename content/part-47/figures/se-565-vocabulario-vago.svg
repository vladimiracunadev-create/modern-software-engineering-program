<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 530" width="940" height="530" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro detectores de vaguedad sobre 125 frases de requisitos: 60 vagas y 65 comprobables</title><desc id="d">Barras agrupadas con las vagas halladas, las falsas alarmas y las vagas que pasan de cuatro detectores sobre 125 frases, 60 vagas y 65 comprobables: la lista de palabras halla 40 con 10 falsas alarmas, la falta de medida halla 56 con 5, la combinación con y halla 40 sin falsas alarmas y deja pasar 20, y con o halla 56 con 15 y deja pasar 4.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="530" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuatro detectores de vaguedad sobre 125 frases de requisitos: 60 vagas y 65 comprobables</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Vagas halladas</tspan></text><rect x="169.56" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="189.56" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="189.56" dy="0">Falsas alarmas</tspan></text><rect x="323.12" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="343.12" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="343.12" dy="0">Vagas que pasan</tspan></text><line x1="71.08" y1="355" x2="920" y2="355" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="355" x2="71.08" y2="355" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="359.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="268.333" x2="920" y2="268.333" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="268.333" x2="71.08" y2="268.333" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="272.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="181.667" x2="920" y2="181.667" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="181.667" x2="71.08" y2="181.667" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="186.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">40</tspan></text><line x1="71.08" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="95" x2="71.08" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">60</tspan></text><line x1="71.08" y1="95" x2="71.08" y2="355" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="225" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 225)">Frases</text><rect x="92.303" y="181.667" width="53.928" height="173.333" rx="3" fill="#087f8c"/><text x="119.267" y="175.667" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="119.267" dy="0">40</tspan></text><rect x="150.231" y="311.667" width="53.928" height="43.3333" rx="3" fill="#c0432f"/><text x="177.195" y="305.667" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177.195" dy="0">10</tspan></text><rect x="208.159" y="268.333" width="53.928" height="86.6667" rx="3" fill="#946512"/><text x="235.123" y="262.333" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="235.123" dy="0">20</tspan></text><text x="177.195" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="177.195" dy="0">Lista de palabras vagas</tspan></text><rect x="304.533" y="112.333" width="53.928" height="242.667" rx="3" fill="#087f8c"/><text x="331.497" y="106.333" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="331.497" dy="0">56</tspan></text><rect x="362.461" y="333.333" width="53.928" height="21.6667" rx="3" fill="#c0432f"/><text x="389.425" y="327.333" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="389.425" dy="0">5</tspan></text><rect x="420.389" y="337.667" width="53.928" height="17.3333" rx="3" fill="#946512"/><text x="447.353" y="331.667" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="447.353" dy="0">4</tspan></text><text x="389.425" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="389.425" dy="0">Falta de medida o estado</tspan></text><rect x="516.763" y="181.667" width="53.928" height="173.333" rx="3" fill="#087f8c"/><text x="543.727" y="175.667" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="543.727" dy="0">40</tspan></text><rect x="574.691" y="353" width="53.928" height="2" rx="3" fill="#c0432f"/><text x="601.655" y="347" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="601.655" dy="0">0</tspan></text><rect x="632.619" y="268.333" width="53.928" height="86.6667" rx="3" fill="#946512"/><text x="659.583" y="262.333" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="659.583" dy="0">20</tspan></text><text x="601.655" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="601.655" dy="0">Palabra vaga y sin medida</tspan></text><rect x="728.993" y="112.333" width="53.928" height="242.667" rx="3" fill="#087f8c"/><text x="755.957" y="106.333" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="755.957" dy="0">56</tspan></text><rect x="786.921" y="290" width="53.928" height="65" rx="3" fill="#c0432f"/><text x="813.885" y="284" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="813.885" dy="0">15</tspan></text><rect x="844.849" y="337.667" width="53.928" height="17.3333" rx="3" fill="#946512"/><text x="871.813" y="331.667" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="871.813" dy="0">4</tspan></text><text x="813.885" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="813.885" dy="0">Palabra vaga o sin medida</tspan></text><rect x="10" y="407" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="431.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Frases marcadas por cada detector: 50, 61, 40 y 71. Ninguno gana en todo: exigir las dos señales elimina las falsas alarmas</tspan></text><text x="470" y="448.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">y deja pasar 20 frases vagas; exigir una u otra deja pasar 4 a cambio de 15 falsas alarmas. Las frases y los detectores</tspan></text><text x="470" y="465.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">fueron escritos por el autor sabiendo qué buscan.</tspan></text><text x="470" y="512.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
