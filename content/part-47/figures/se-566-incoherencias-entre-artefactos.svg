<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 698" width="940" height="698" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Hallazgos de un analizador de texto sobre constitución, plan y tareas con incoherencias inyectadas</title><desc id="d">Barras horizontales con los 18 hallazgos de un analizador de texto sobre tres artefactos de un servicio de avisos: tres requisitos sin tarea, dos decisiones del plan que violan la constitución, tres dependencias hacia tareas posteriores y tres tareas de código antes de su prueba, y un hallazgo en cada uno de los demás tipos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="698" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Hallazgos de un analizador de texto sobre constitución, plan y tareas con incoherencias inyectadas</tspan></text><line x1="354" y1="49" x2="354" y2="533" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="533" x2="354" y2="538" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="554" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="538.647" y1="49" x2="538.647" y2="533" stroke="#d5dde1" stroke-width="1"/><line x1="538.647" y1="533" x2="538.647" y2="538" stroke="#5b7280" stroke-width="1.4"/><text x="538.647" y="554" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="538.647" dy="0">1</tspan></text><line x1="723.293" y1="49" x2="723.293" y2="533" stroke="#d5dde1" stroke-width="1"/><line x1="723.293" y1="533" x2="723.293" y2="538" stroke="#5b7280" stroke-width="1.4"/><text x="723.293" y="554" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="723.293" dy="0">2</tspan></text><line x1="907.94" y1="49" x2="907.94" y2="533" stroke="#d5dde1" stroke-width="1"/><line x1="907.94" y1="533" x2="907.94" y2="538" stroke="#5b7280" stroke-width="1.4"/><text x="907.94" y="554" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907.94" dy="0">3</tspan></text><line x1="354" y1="533" x2="907.94" y2="533" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="75.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Requisito sin tarea</tspan></text><text x="344" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Identificador de tarea duplicado</tspan></text><text x="344" y="163.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Tarea con requisito inexistente</tspan></text><text x="344" y="207.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Tarea sin requisito</tspan></text><text x="344" y="251.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Plan que viola la constitución</tspan></text><text x="344" y="295.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Plan que cita un requisito inexistente</tspan></text><text x="344" y="331" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Conflicto numérico entre decisiones (24</tspan></text><text x="344" y="348" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">frente a 48 horas)</tspan></text><text x="344" y="383.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Dependencia de una tarea posterior</tspan></text><text x="344" y="427.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Ciclo de dependencias</tspan></text><text x="344" y="471.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Tareas en paralelo sobre el mismo archivo</tspan></text><text x="344" y="515.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Código planificado antes de su prueba</tspan></text><rect x="354" y="55" width="553.94" height="32" rx="3" fill="#102a43"/><text x="914.94" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="914.94" dy="0">3</tspan></text><rect x="354" y="99" width="184.647" height="32" rx="3" fill="#102a43"/><text x="545.647" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="545.647" dy="0">1</tspan></text><rect x="354" y="143" width="184.647" height="32" rx="3" fill="#102a43"/><text x="545.647" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="545.647" dy="0">1</tspan></text><rect x="354" y="187" width="184.647" height="32" rx="3" fill="#102a43"/><text x="545.647" y="207.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="545.647" dy="0">1</tspan></text><rect x="354" y="231" width="369.293" height="32" rx="3" fill="#102a43"/><text x="730.293" y="251.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="730.293" dy="0">2</tspan></text><rect x="354" y="275" width="184.647" height="32" rx="3" fill="#102a43"/><text x="545.647" y="295.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="545.647" dy="0">1</tspan></text><rect x="354" y="319" width="184.647" height="32" rx="3" fill="#102a43"/><text x="545.647" y="339.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="545.647" dy="0">1</tspan></text><rect x="354" y="363" width="553.94" height="32" rx="3" fill="#102a43"/><text x="914.94" y="383.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="914.94" dy="0">3</tspan></text><rect x="354" y="407" width="184.647" height="32" rx="3" fill="#102a43"/><text x="545.647" y="427.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="545.647" dy="0">1</tspan></text><rect x="354" y="451" width="184.647" height="32" rx="3" fill="#102a43"/><text x="545.647" y="471.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="545.647" dy="0">1</tspan></text><rect x="354" y="495" width="553.94" height="32" rx="3" fill="#102a43"/><text x="914.94" y="515.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="914.94" dy="0">3</tspan></text><text x="630.97" y="577" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="630.97" dy="0">Hallazgos (18 en total)</tspan></text><rect x="10" y="591" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="615.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El analizador emite 18 hallazgos; 17 son incoherencias reales y uno es discutible. No ve dos problemas inyectados que</tspan></text><text x="470" y="632.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">exigen entender el significado: un canal distinto entre requisito y plan y un requisito sin mecanismo.</tspan></text><text x="470" y="680.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
