<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 502" width="940" height="502" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un canal 1oo1 de 15 años de vida con prueba anual: PFD media según la cobertura de la prueba</title><desc id="d">Barras con la PFD media de un canal 1oo1 con prueba anual y vida de 15 años: 8,76 por diez a la menos tres con cobertura de prueba del 100 por ciento, 9,99 por diez a la menos tres con el 99, 1,49 por diez a la menos dos con el 95, 2,10 por diez a la menos dos con el 90 y 4,56 por diez a la menos dos con el 70.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="502" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un canal 1oo1 de 15 años de vida con prueba anual: PFD media según la cobertura de la prueba</tspan></text><line x1="86.16" y1="327" x2="920" y2="327" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="327" x2="86.16" y2="327" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="331.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">0</tspan></text><line x1="86.16" y1="275" x2="920" y2="275" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="275" x2="86.16" y2="275" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="279.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">0,01</tspan></text><line x1="86.16" y1="223" x2="920" y2="223" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="223" x2="86.16" y2="223" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="227.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">0,02</tspan></text><line x1="86.16" y1="171" x2="920" y2="171" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="171" x2="86.16" y2="171" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="175.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">0,03</tspan></text><line x1="86.16" y1="119" x2="920" y2="119" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="119" x2="86.16" y2="119" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="123.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">0,04</tspan></text><line x1="86.16" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="67" x2="86.16" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">0,05</tspan></text><line x1="86.16" y1="67" x2="86.16" y2="327" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="197" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 197)">PFD media</text><rect x="102.837" y="281.448" width="133.414" height="45.552" rx="3" fill="#102a43"/><text x="169.544" y="275.448" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="169.544" dy="0">8,76e-03</tspan></text><text x="169.544" y="348" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="169.544" dy="0">100 %</tspan></text><rect x="269.605" y="275.052" width="133.414" height="51.948" rx="3" fill="#102a43"/><text x="336.312" y="269.052" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="336.312" dy="0">9,99e-03</tspan></text><text x="336.312" y="348" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="336.312" dy="0">99 %</tspan></text><rect x="436.373" y="249.52" width="133.414" height="77.48" rx="3" fill="#102a43"/><text x="503.08" y="243.52" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="503.08" dy="0">1,49e-02</tspan></text><text x="503.08" y="348" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="503.08" dy="0">95 %</tspan></text><rect x="603.141" y="217.8" width="133.414" height="109.2" rx="3" fill="#102a43"/><text x="669.848" y="211.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="669.848" dy="0">2,10e-02</tspan></text><text x="669.848" y="348" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="669.848" dy="0">90 %</tspan></text><rect x="769.909" y="89.88" width="133.414" height="237.12" rx="3" fill="#102a43"/><text x="836.616" y="83.88" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="836.616" dy="0">4,56e-02</tspan></text><text x="836.616" y="348" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="836.616" dy="0">70 %</tspan></text><line x1="86.16" y1="275" x2="920" y2="275" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="916" y="269" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="916" dy="0">frontera 1e-2</tspan></text><rect x="10" y="379" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="403.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Una prueba que no detecta el 5 % de los fallos deja que esos fallos se acumulen hasta el final de la vida útil: la PFD sube</tspan></text><text x="470" y="420.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">un 70 % y el canal baja de banda. La cobertura de la prueba periódica es un supuesto del modelo que hay que justificar y</tspan></text><text x="470" y="437.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">vigilar, no un dato.</tspan></text><text x="470" y="484.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 47; muestra un mecanismo, no mide un producto real.</tspan></text></svg>
