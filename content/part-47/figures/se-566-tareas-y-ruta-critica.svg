<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 450" width="940" height="450" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuarenta tareas con 53 dependencias: duración con distinto número de trabajadores y orden del archivo</title><desc id="d">Barras horizontales con la duración de 40 tareas con 53 dependencias: 52,3 con un trabajador, 27,6 con dos, 14,4 con cuatro y 10,8 con ocho, frente a una ruta crítica de 10,4; si se ejecutan en el orden del archivo desordenado dentro de cada fase, 8 de 53 dependencias se violan.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="450" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuarenta tareas con 53 dependencias: duración con distinto número de trabajadores y orden del archivo</tspan></text><line x1="294" y1="49" x2="294" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="269" x2="294" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">0</tspan></text><line x1="490.587" y1="49" x2="490.587" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="490.587" y1="269" x2="490.587" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="490.587" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="490.587" dy="0">20</tspan></text><line x1="687.173" y1="49" x2="687.173" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="687.173" y1="269" x2="687.173" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="687.173" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="687.173" dy="0">40</tspan></text><line x1="883.76" y1="49" x2="883.76" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="883.76" y1="269" x2="883.76" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="883.76" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="883.76" dy="0">60</tspan></text><line x1="294" y1="269" x2="883.76" y2="269" stroke="#5b7280" stroke-width="1.6"/><text x="284" y="75.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">1 trabajador</tspan></text><text x="284" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">2 trabajadores</tspan></text><text x="284" y="163.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">4 trabajadores</tspan></text><text x="284" y="207.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">8 trabajadores</tspan></text><text x="284" y="243" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Ruta crítica (mínimo con cualquier</tspan></text><text x="284" y="260" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">número)</tspan></text><rect x="294" y="55" width="514.074" height="32" rx="3" fill="#102a43"/><text x="815.074" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="815.074" dy="0">52,3</tspan></text><rect x="294" y="99" width="271.29" height="32" rx="3" fill="#102a43"/><text x="572.29" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="572.29" dy="0">27,6</tspan></text><rect x="294" y="143" width="141.542" height="32" rx="3" fill="#102a43"/><text x="442.542" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="442.542" dy="0">14,4</tspan></text><rect x="294" y="187" width="106.157" height="32" rx="3" fill="#102a43"/><text x="407.157" y="207.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="407.157" dy="0">10,8</tspan></text><rect x="294" y="231" width="102.225" height="32" rx="3" fill="#102a43"/><text x="403.225" y="251.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="403.225" dy="0">10,4</tspan></text><text x="588.88" y="313" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="588.88" dy="0">Duración</tspan></text><rect x="10" y="327" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="351.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Fracción del trabajo total: 100,0 %, 52,7 %, 27,5 %, 20,6 % y 19,9 %. Hay siete olas de hasta 13 tareas. La ruta crítica es</tspan></text><text x="470" y="368.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">un suelo: ocho trabajadores ya están a un 4 % de ella. Si el agente ejecuta las tareas en un orden de archivo desordenado</tspan></text><text x="470" y="385.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">dentro de cada fase, 8 de 53 dependencias se violan. Duraciones y dependencias son sintéticas.</tspan></text><text x="470" y="432.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
