31"><tspan x="813.885" dy="0">10 %</tspan></text><line x1="71.08" y1="114" x2="920" y2="114" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="916" y="108" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="916" dy="0">máximo de 10 pasadas</tspan></text><rect x="10" y="426" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="450.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Corridas que topan el máximo de 10: 0,0 %, 9,4 %, 62,4 % y 96,3 %; criterios abiertos al parar (media): 0,00, 0,17, 1,84 y</tspan></text><text x="470" y="467.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">4,88. Una regresión del 5 % por pasada deja sin converger al 62,4 % de las corridas: de 20 criterios cumplidos, uno se</tspan></text><text x="470" y="484.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">rompe en cada pasada. La tasa de corrección de 0,7 y la independencia entre criterios son supuestos del autor.</tspan></text><text x="470" y="531.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
