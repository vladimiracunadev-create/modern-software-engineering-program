<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 221" width="960" height="221" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres lecturas de una sentencia que ningún requisito ejecuta, y qué hace la persona que revisa</title><desc id="d">Diagrama de tres cajas con las explicaciones posibles de código sin cubrir por pruebas de requisitos: falta una prueba, falta un requisito derivado, o el código es muerto o no previsto y se elimina o se justifica.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="221" fill="#ffffff"/><rect x="10" y="14" width="284" height="100" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="152" y="51" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="152" dy="0">Falta una prueba</tspan></text><text x="152" y="67.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="152" dy="0">El requisito existe: se escribe la</tspan></text><text x="152" y="84.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="152" dy="0">prueba</tspan></text><rect x="338" y="14" width="284" height="100" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="51" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Falta un requisito</tspan></text><text x="480" y="67.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">La conducta es deseable: se deriva y</tspan></text><text x="480" y="84.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">se prueba</tspan></text><polyline points="294,64 338,64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="666" y="14" width="284" height="100" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="808" y="51" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="808" dy="0">Código muerto o no previsto</tspan></text><text x="808" y="67.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="808" dy="0">Se elimina o se justifica por</tspan></text><text x="808" y="84.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="808" dy="0">escrito</tspan></text><polyline points="622,64 666,64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="128" width="940" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="480" y="152.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">La cobertura estructural no busca llegar a un número: busca las sentencias que nadie pidió. Es una comprobación de que las</tspan></text><text x="480" y="169.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">pruebas basadas en requisitos fueron suficientes, y su hallazgo es una de estas tres decisiones.</tspan></text><text x="480" y="211.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; los recuentos se repiten con la misma semilla.</tspan></text></svg>
