<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Valor esperado de tres políticas según la proporción de ideas buenas (construir 10, valor 40, evaluar 1)</title><desc id="d">Líneas con el valor esperado de tres políticas según la proporción de ideas buenas: con 5 por ciento construir todo da menos 8,12, evaluar y construir si procede menos 2,18 y no construir 0; con 25 por ciento evaluar da 3,38 frente a menos 0,19; con 50 por ciento 10,33 frente a 9,68; con 75 por ciento construir todo da 19,74 frente a 17,29.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Valor esperado de tres políticas según la proporción de ideas buenas (construir 10, valor 40, evaluar 1)</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Construir todo</tspan></text><rect x="169.56" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="189.56" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="189.56" dy="0">Evaluar y construir si procede</tspan></text><polygon points="449.76,44.1 456.36,56.4 443.16,56.4" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><text x="463.76" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="4