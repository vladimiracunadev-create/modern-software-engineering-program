<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 618" width="940" height="618" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro políticas de permisos frente a 30 órdenes de shell (16 peligrosas y 14 inocuas), sin ejecutar ninguna</title><desc id="d">Barras horizontales con las órdenes que permite o frena cada política: permitirlo todo deja pasar las 16 peligrosas; la lista por prefijo deja pasar 13 y frena una inocua; el análisis de segmentos deja pasar 4 y frena una inocua; los segmentos con confinamiento de rutas frenan las 16 y ninguna inocua.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="618" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuatro políticas de permisos frente a 30 órdenes de shell (16 peligrosas y 14 inocuas), sin ejecutar ninguna</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Peligrosas permitidas (de 16)</tspan></text><rect x="282.66" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="302.66" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="302.66" dy="0">Peligrosas frenadas (de 16)</tspan></text><rect x="534.24" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="554.24" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="554.24" dy="0">Inocuas frenadas (de 14)</tspan></text><line x1="284" y1="77" x2="284" y2="437" s