<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 398" width="940" height="398" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuarenta habilidades y cien peticiones: selección según el estilo de descripción y costo de contexto de tres formas de cargar</title><desc id="d">Barras horizontales en escala logarítmica con los tokens de contexto de tres formas de cargar 40 habilidades: cargar los 40 cuerpos cuesta unos 30496, las 40 descripciones 778 y las descripciones más un cuerpo 1541; con frases de activación se activa la habilidad correcta en 45 de 60 peticiones y con descripción genérica en 29.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="398" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuarenta habilidades y cien peticiones: selección según el estilo de descripción y costo de contexto de tres</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">formas de cargar</tspan></text><line x1="294" y1="68" x2="294" y2="200" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="200" x2="294" y2="205" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="221" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">100</tspan></text><line x1="485.213" y1="68" x2="485.213" y2="200" stroke="#d5dde1" stroke-width="1"/><line x1="485.213" y1="200" x2="485.213" y2="205" stroke="#5b7280" stroke-width="1.4"/><text x="485.213" y="221" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="485.213" dy="0">1 000</tspan></text><line x1="676.427" y1="68" x2="676.427" y2="200" stroke="#d5dde1" stroke-width="1"/><line x1="676.427" y1="200" x2="676.427" y2="205" stroke="#5b7280" stroke-width="1.4"/><text x="676.427" y="221" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="676.427" dy="0">10 000</tspan></text><line x1="867.64" y1="68" x2="867.64" y2="200" stroke="#d5dde1" stroke-width="1"/><line x1="867.64" y1="200" x2="867.64" y2="205" stroke="#5b7280" stroke-width="1.4"/><text x="867.64" y="221" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867.64" dy="0">100 000</tspan></text><line x1="294" y1="200" x2="867.64" y2="200" stroke="#5b7280" stroke-width="1.6"/><text x="284" y="94.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Cargar los 40 cuerpos al arrancar</tspan></text><text x="284" y="138.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Cargar solo las 40 descripciones</tspan></text><text x="284" y="174" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Descripciones y un cuerpo cargado</tspan></text><text x="284" y="191" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">(media)</tspan></text><rect x="294" y="74" width="475.02" height="32" rx="3" fill="#102a43"/><text x="776.02" y="94.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="776.02" dy="0">30 496</tspan></text><rect x="294" y="118" width="170.367" height="32" rx="3" fill="#102a43"/><text x="471.367" y="138.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="471.367" dy="0">778</tspan></text><rect x="294" y="162" width="227.124" height="32" rx="3" fill="#102a43"/><text x="528.124" y="182.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="528.124" dy="0">1 541</tspan></text><text x="580.82" y="244" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="580.82" dy="0">Tokens de contexto (escala logarítmica)</tspan></text><rect x="10" y="258" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="282.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Selección de 60 peticiones con habilidad: con frases de activación, 45 correctas, 15 incorrectas y 0 sin activar; con</tspan></text><text x="470" y="299.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">descripción genérica, 29 correctas, 15 incorrectas y 16 sin activar. Una buena descripción previene la falta de activación;</tspan></text><text x="470" y="316.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">el solape entre habilidades, que da las 15 activaciones incorrectas, es un defecto del conjunto. El selector es una</tspan></text><text x="470" y="332.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">coincidencia de palabras clave y los textos son sintéticos.</tspan></text><text x="470" y="380.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
