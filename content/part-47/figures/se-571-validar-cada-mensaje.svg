<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="940" height="580" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cien mensajes y tres niveles de comprobación: cuántos de cada clase se ejecutan</title><desc id="d">Mapa de calor con los mensajes malformados que se ejecutan, de 5 por clase, según el nivel de comprobación: con solo la forma JSON-RPC se ejecutan 25 de los 40 malformados, con versión y método de la cabecera 15 y con nombre, argumentos y alcance ninguno; los 5 mensajes con cabecera de una herramienta permitida y cuerpo de borrar historial se ejecutan en los dos primeros niveles y en el tercero no.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="580" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cien mensajes y tres niveles de comprobación: cuántos de cada clase se ejecutan</tspan></text><text x="423.333" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="423.333" dy="0">Solo forma</tspan></text><text x="622" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="622" dy="0">+ versión y método</tspan></text><text x="820.667" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="820.667" dy="0">+ nombre, argumentos y</tspan></text><text x="820.667" y="77" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="820.667" dy="0">alcance</tspan></text><text x="314" y="112.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">JSON roto</tspan></text><text x="314" y="150.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Sin identificador</tspan></text><text x="314" y="188.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Versión antigua</tspan></text><text x="314" y="226.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Método distinto en cabecera y cuerpo</tspan></text><text x="314" y="264.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Nombre distinto en cabecera y cuerpo</tspan></text><text x="314" y="302.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Herramienta inexistente</tspan></text><text x="314" y="340.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Argumento de tipo equivocado</tspan></text><text x="314" y="378.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Recurso fuera de alcance</tspan></text><text x="314" y="408" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Cabecera permitida, cuerpo de borrar</tspan></text><text x="314" y="425" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">historial</tspan></text><rect x="325.5" y="90.5" width="195.667" height="35" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="423.333" y="112.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="423.333" dy="0">5</tspan></text><rect x="524.167" y="90.5" width="195.667" height="35" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="622" y="112.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="622" dy="0">0</tspan></text><rect x="722.833" y="90.5" width="195.667" height="35" rx="4" fill="#fbe4de" stroke="#ffffff" s