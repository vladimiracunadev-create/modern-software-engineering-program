xt x="423.333" y="340.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="423.333" dy="0">5</tspan></text><rect x="524.167" y="318.5" width="195.667" height="35" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="622" y="340.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="622" dy="0">5</tspan></text><rect x="722.833" y="318.5" width="195.667" height="35" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="820.667" y="340.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="820.667" dy="0">5</tspan></text><rect x="325.5" y="356.5" width="195.667" height="35" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="423.333" y="378.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="423.333" dy="0">5</tspan></text><rect x="524.167" y="356.5" width="195.667" height="35" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="622" y="378.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="622" dy="0">5</tspan></text><rect x="722.833" y="356.5" width="195.667" height="35" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="820.667" y="378.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="820.667" dy="0">5</tspan></text><rect x="325.5" y="394.5" width="195.667" height="35" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="423.333" y="416.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="423.333" dy="0">5</tspan></text><rect x="524.167" y="394.5" width="195.667" height="35" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="622" y="416.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="622" dy="0">5</tspan></text><rect x="722.833" y="394.5" width="195.667" height="35" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="820.667" y="416.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="820.667" dy="0">0</tspan></text><text x="324" y="457" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><rect x="339.54" y="445" width="30.5" height="14" fill="#fbe4de"/><rect x="369.54" y="445" width="30.5" height="14" fill="#f3cdc5"/><rect x="399.54" y="445" width="30.5" height="14" fill="#eab6ac"/><rect x="429.54" y="445" width="30.5" height="14" fill="#e29f93"/><rect x="459.54" y="445" width="30.5" height="14" fill="#d9887a"/><rect x="489.54" y="445" width="30.5" height="14" fill="#d17161"/><rect x="519.54" y="445" width="30.5" height="14" fill="#c85a48"/><rect x="549.54" y="445" width="30.5" height="14" fill="#c0432f"/><text x="587.54" y="457" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="587.54" dy="0">5</tspan></text><text x="603.08" y="457" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="603.08" dy="0">más oscuro = mayor (Ejecutados de 5)</tspan></text><rect x="10" y="473" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="497.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los 60 mensajes válidos pasan siempre, en los tres niveles. La última fila es el desajuste entre quien autoriza por</tspan></text><text x="470" y="514.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cabecera y quien ejecuta el cuerpo. El manejador es una imitación escrita por el autor, no una implementación conforme.</tspan></text><text x="470" y="562.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
