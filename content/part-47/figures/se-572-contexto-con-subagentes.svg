<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 494" width="940" height="494" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Contexto de entrada procesado por un agente único y por ocho subagentes según la lectura redundante</title><desc id="d">Barras horizontales con los millones de tokens de entrada procesados: el agente único procesa 4,16 y termina con 165000; con subagentes el consumo es 0,90 con lectura mínima, 1,46 con el doble, 2,02 con el triple, 2,58 con el cuádruple y 3,70 con seis veces, y el contexto final del orquestador es siempre 17000 tokens.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="494" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Contexto de entrada procesado por un agente único y por ocho subagentes según la lectura redundante</tspan></text><line x1="284" y1="49" x2="284" y2="313" stroke="#d5dde1" stroke-width="1"/><line x1="284" y1="313" x2="284" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="284" y="334" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="284" dy="0">0</tspan></text><line x1="403.952" y1="49" x2="403.952" y2="313" stroke="#d5dde1" stroke-width="1"/><line x1="403.952" y1="313" x2="403.952" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="403.952" y="334" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="403.952" dy="0">1</tspan></text><line x1="523.904" y1="49" x2="523.904" y2="313" stroke="#d5dde1" stroke-width="1"/><line x1="523.904" y1="313" x2="523.904" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="523.904" y="334" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="523.904" dy="0">2</tspan></text><line x1="643.856" y1="49" x2="643.856" y2="313" stroke="#d5dde1" stroke-width="1"/><line x1="643.856" y1="313" x2="643.856" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="643.856" y="334" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="643.856" dy="0">3</tspan></text><line x1="763.808" y1="49" x2="763.808" y2="313" stroke="#d5dde1" stroke-width="1"/><line x1="763.808" y1="313" x2="763.808" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="763.808" y="334" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="763.808" dy="0">4</tspan></text><line x1="883.76" y1="49" x2="883.76" y2="313" stroke="#d5dde1" stroke-width="1"/><line x1="883.76" y1="313" x2="883.76" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="883.76" y="334" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="883.76" dy="0">5</tspan></text><line x1="284" y1="313" x2="883.76" y2="313" stroke="#5b7280" stroke-width="1.6"/><text x="274" y="75.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Agente único (100 %)</tspan></text><text x="274" y="111" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Subagentes, lectura mínima 1× (22</tspan></text><text x="274" y="128" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">%)</tspan></text><text x="274" y="163.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Subagentes, 2× (35 %)</tspan></text><text x="274" y="207.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Subagentes, 3× (49 %)</tspan></text><text x="274" y="251.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Subagentes, 4× (62 %)</tspan></text><text x="274" y="295.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Subagentes, 6× (89 %)</tspan></text><rect x="284" y="55" width="499" height="32" rx="3" fill="#102a43"/><text x="790" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="790" dy="0">4,16</tspan></text><rect x="284" y="99" width="107.957" height="32" rx="3" fill="#102a43"/><text x="398.957" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="398.957" dy="0">0,90</tspan></text><rect x="284" y="143" width="175.13" height="32" rx="3" fill="#102a43"/><text x="466.13" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="466.13" dy="0">1,46</tspan></text><rect x="284" y="187" width="242.303" height="32" rx="3" fill="#102a43"/><text x="533.303" y="207.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="533.303" dy="0">2,02</tspan></text><rect x="284" y="231" width="309.476" height="32" rx="3" fill="#102a43"/><text x="600.476" y="251.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="600.476" dy="0">2,58</tspan></text><rect x="284" y="275" width="443.822" height="32" rx="3" fill="#102a43"/><text x="734.822" y="295.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="734.822" dy="0">3,70</tspan></text><text x="583.88" y="357" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="583.88" dy="0">Millones de tokens procesados</tspan></text><rect x="10" y="371" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="395.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Entre paréntesis, el consumo frente al agente único. Contexto final: 165 000 tokens del agente único y 17 000 del</tspan></text><text x="470" y="412.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">orquestador. El modelo cuenta solo tokens de entrada por turno: no incluye salida, caché ni coordinación, y por eso no</tspan></text><text x="470" y="429.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">contradice que en la práctica los sistemas multiagente consuman más. Muestra la forma cuadrática del agente único.</tspan></text><text x="470" y="476.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
