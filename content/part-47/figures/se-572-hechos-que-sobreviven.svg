<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 514" width="940" height="514" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Probabilidad de que cinco hechos necesarios lleguen al orquestador según la retención de cada resumen</title><desc id="d">Barras agrupadas con la probabilidad de que lleguen los cinco hechos según la retención de cada resumen: con 99 por ciento llegan el 95,1 por ciento de las veces, con 95 el 77,4, con 90 el 59,0 y con 80 el 32,8; la simulación de 20000 corridas da 95,1, 77,3, 59,0 y 33,0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="514" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Probabilidad de que cinco hechos necesarios lleguen al orquestador según la retención de cada resumen</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Cálculo</tspan></text><rect x="116.78" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="136.78" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="136.78" dy="0">Simulación (20 000 corridas)</tspan></text><line x1="78.62" y1="355" x2="920" y2="355" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="355" x2="78.62" y2="355" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="359.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="303" x2="920" y2="303" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="303" x2="78.62" y2="303" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="307.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">20</tspan></text><line x1="78.62" y1="251" x2="920" y2="251" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="251" x2="78.62" y2="251" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="255.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">40</tspan></text><line x1="78.62" y1="199" x2="920" y2="199" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="199" x2="78.62" y2="199" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="203.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">60</tspan></text><line x1="78.62" y1="147" x2="920" y2="147" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="147" x2="78.62" y2="147" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="151.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">80</tspan></text><line x1="78.62" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="95" x2="78.62" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="95" x2="78.62" y2="355" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="225" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 225)">Llegan los 5 hechos (%)</text><rect x="99.6545" y="107.74" width="82.138" height="247.26" rx="3" fill="#102a43"/><text x="140.724" y="101.74" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="140.724" dy="0">95,1</tspan></text><rect x="185.793" y="107.74" width="82.138" height="247.26" rx="3" fill="#087f8c"/><text x="226.862" y="101.74" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="226.862" dy="0">95,1</tspan></text><text x="183.793" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="183.793" dy="0">Retención del 99 %</tspan></text><rect x="310" y="153.76" width="82.138" height="201.24" rx="3" fill="#102a43"/><text x="351.069" y="147.76" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="351.069" dy="0">77,4</tspan></text><rect x="396.138" y="154.02" width="82.138" height="200.98" rx="3" fill="#087f8c"/><text x="437.207" y="148.02" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="437.207" dy="0">77,3</tspan></text><text x="394.138" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="394.138" dy="0">Retención del 95 %</tspan></text><rect x="520.345" y="201.6" width="82.138" height="153.4" rx="3" fill="#102a43"/><text x="561.413" y="195.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="561.413" dy="0">59,0</tspan></text><rect x="606.483" y="201.6" width="82.138" height="153.4" rx="3" fill="#087f8c"/><text x="647.552" y="195.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="647.552" dy="0">59,0</tspan></text><text x="604.482" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="604.482" dy="0">Retención del 90 %</tspan></text><rect x="730.689" y="269.72" width="82.138" height="85.28" rx="3" fill="#102a43"/><text x="771.758" y="263.72" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="771.758" dy="0">32,8</tspan></text><rect x="816.827" y="269.2" width="82.138" height="85.8" rx="3" fill="#087f8c"/><text x="857.896" y="263.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="857.896" dy="0">33,0</tspan></text><text x="814.827" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="814.827" dy="0">Retención del 80 %</tspan></text><rect x="10" y="407" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="431.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">La probabilidad cae como la retención elevada al número de hechos. Se supone independencia entre hechos; en la práctica se</tspan></text><text x="470" y="448.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">pierden primero los números y los matices.</tspan></text><text x="470" y="496.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
