<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 298" width="940" height="298" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Sesenta acciones de un generador con semilla sobre 40 archivos y su deshacer con un diario por acción</title><desc id="d">Barra apilada con las 60 acciones de un generador sobre 40 archivos: 55 sobre archivos, que el diario deshace hasta dejar el estado igual al inicial, y 5 correos simulados que el diario no puede deshacer.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="298" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Sesenta acciones de un generador con semilla sobre 40 archivos y su deshacer con un diario por acción</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Acciones que el diario deshace (archivos)</tspan></text><rect x="373.14" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="393.14" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="393.14" dy="0">Acciones que no se pueden deshacer (correos)</tspan></text><line x1="154" y1="77" x2="154" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="154" y1="117" x2="154" y2="122" stroke="#5b7280" stroke-width="1.4"/><text x="154" y="138" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="154" dy="0">0</tspan></text><line x1="394.567" y1="77" x2="394.567" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="394.567" y1="117" x2="394.567" y2="122" stroke="#5b7280" stroke-width="1.4"/><text x="394.567" y="138" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="394.567" dy="0">20</tspan></text><line x1="635.133" y1="77" x2="635.133" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="635.133" y1="117" x2="635.133" y2="122" stroke="#5b7280" stroke-width="1.4"/><text x="635.133" y="138" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="635.133" dy="0">40</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="117" x2="875.7" y2="122" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="138" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">60</tspan></text><line x1="154" y1="117" x2="875.7" y2="117" stroke="#5b7280" stroke-width="1.6"/><text x="144" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="144" dy="0">60 acciones</tspan></text><rect x="154" y="84" width="661.558" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="484.779" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="484.779" dy="0">55</tspan></text><rect x="815.558" y="84" width="60.1417" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="845.629" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="845.629" dy="0">5</tspan></text><text x="882.7" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">60</tspan></text><text x="514.85" y="161" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="514.85" dy="0">Acciones</tspan></text><rect x="10" y="175" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="199.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El directorio cambió tras las 60 acciones y, al deshacer en orden inverso, el estado coincide con el inicial. El diario</tspan></text><text x="470" y="216.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ocupa 2 216 bytes (85 % del espacio). El diario restaura el estado de los archivos y no lo que sale del sistema. Son</tspan></text><text x="470" y="233.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">archivos pequeños, sin enlaces simbólicos, permisos especiales ni caídas a mitad de acción.</tspan></text><text x="470" y="280.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
