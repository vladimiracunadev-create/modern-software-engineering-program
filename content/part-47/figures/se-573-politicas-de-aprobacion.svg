<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 531" width="940" height="531" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro políticas de aprobación en 5 000 sesiones de 200 acciones con un 4 % irreversibles</title><desc id="d">Barras horizontales en escala logarítmica con los avisos por sesión y las irreversibles ejecutadas por sesión: preguntar en cada acción genera 200 avisos y deja ejecutar 3,02, con 93,5 por ciento de sesiones afectadas; preguntar por riesgo 22,5 y 1,30; aprobar un plan 11,1 y 1,18; preguntar solo lo irreversible con pausa 8,0 y 0,54, con 41,5 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="531" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuatro políticas de aprobación en 5 000 sesiones de 200 acciones con un 4 % irreversibles</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Avisos por sesión</tspan></text><rect x="192.18" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="212.18" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="212.18" dy="0">Irreversibles ejecutadas por sesión</tspan></text><line x1="324" y1="77" x2="324" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="333" x2="324" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0,1</tspan></text><line x1="459.91" y1="77" x2="459.91" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="459.91" y1="333" x2="459.91" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="459.91" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="459.91" dy="0">1</tspan></text><line x1="595.82" y1="77" x2="595.82" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="595.82" y1="333" x2="595.82" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="595.82" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="595.82" dy="0">10</tspan></text><line x1="731.73" y1="77" x2="731.73" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="731.73" y1="333" x2="731.73" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="731.73" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="731.73" dy="0">100</tspan></text><line x1="867.64" y1="77" x2="867.64" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="867.64" y1="333" x2="867.64" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="867.64" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867.64" dy="0">1 000</tspan></text><line x1="324" y1="333" x2="867.64" y2="333" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="105" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Preguntar en cada acción (93,5 % de</tspan></text><text x="314" y="122" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">sesiones con alguna)</tspan></text><text x="314" y="177.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Preguntar solo las de riesgo (73,2 %)</tspan></text><text x="314" y="233" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Aprobar el plan y preguntar las</tspan></text><text x="314" y="250" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">desviaciones (69,5 %)</tspan></text><text x="314" y="297" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Solo lo irreversible, con pausa</tspan></text><text x="314" y="314" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">obligatoria (41,5 %)</tspan></text><rect x="324" y="83" width="448.643" height="24.5" rx="3" fill="#6b7c86"/><text x="779.643" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="779.643" dy="0">200,00</tspan></text><rect x="324" y="110.5" width="201.148" height="24.5" rx="3" fill="#c0432f"/><text x="532.148" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="532.148" dy="0">3,02</tspan></text><rect x="324" y="147" width="319.685" height="24.5" rx="3" fill="#6b7c86"/><text x="650.685" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="650.685" dy="0">22,50</tspan></text><rect x="324" y="174.5" width="151.396" height="24.5" rx="3" fill="#c0432f"/><text x="482.396" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="482.396" dy="0">1,30</tspan></text><rect x="324" y="211" width="277.98" height="24.5" rx="3" fill="#6b7c86"/><text x="608.98" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="608.98" dy="0">11,10</tspan></text><rect x="324" y="238.5" width="145.679" height="24.5" rx="3" fill="#c0432f"/><text x="476.679" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="476.679" dy="0">1,18</tspan></text><rect x="324" y="275" width="258.649" height="24.5" rx="3" fill="#6b7c86"/><text x="589.649" y="291.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="589.649" dy="0">8,00</tspan></text><rect x="324" y="302.5" width="99.5396" height="24.5" rx="3" fill="#c0432f"/><text x="430.54" y="319.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="430.54" dy="0">0,54</tspan></text><text x="595.82" y="377" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="595.82" dy="0">Avisos o irreversibles por sesión (escala logarítmica)</tspan></text><rect x="10" y="391" width="920" height="92.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="415.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Entre paréntesis, el porcentaje de sesiones con alguna acción irreversible ejecutada. El clasificador de riesgo supone un</tspan></text><text x="470" y="432.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">90 % de aciertos y un 8 % de falsas alarmas. Preguntar por todo agota la atención en lo rutinario. La última política</tspan></text><text x="470" y="449.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">supone saber qué es irreversible. La función de atención, el 4 % y el clasificador son supuestos del autor: no se observó a</tspan></text><text x="470" y="465.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">ninguna persona.</tspan></text><text x="470" y="513.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
