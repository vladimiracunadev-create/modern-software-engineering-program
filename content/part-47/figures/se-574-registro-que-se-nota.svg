<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 477" width="940" height="477" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cinco manipulaciones de un registro de auditoría de 500 eventos: fracción detectada por esquema (200 ensayos cada una)</title><desc id="d">Mapa de calor con la fracción detectada de cinco manipulaciones de un registro de 500 eventos: un registro simple detecta 0 por ciento en todas; una cadena de huellas detecta 100 por ciento de editar, borrar e intercambiar eventos y 0 de cortar los últimos 20 o reescribir y recalcular; con la huella final guardada aparte se detectan las cinco al 100 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="477" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cinco manipulaciones de un registro de auditoría de 500 eventos: fracción detectada por esquema (200 ensayos</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">cada una)</tspan></text><text x="423.333" y="79" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="423.333" dy="0">Registro simple</tspan></text><text x="622" y="79" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="622" dy="0">Cadena de huellas</tspan></text><text x="820.667" y="79" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="820.667" dy="0">Cadena y huella final</tspan></text><text x="820.667" y="96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="820.667" dy="0">aparte</tspan></text><text x="314" y="134.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Editar un evento</tspan></text><text x="314" y="178.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Borrar un evento</tspan></text><text x="314" y="222.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Intercambiar dos eventos</tspan></text><text x="314" y="266.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Cortar los últimos 20 eventos</tspan></text><text x="314" y="302" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Reescribir desde un punto y recalcular la</tspan></text><text x="314" y="319" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">cadena</tspan></text><rect x="325.5" y="109.5" width="195.667" height="41" rx="4" fill="#d9e2ec" stroke="#ffffff" stroke-width="1"/><text x="423.333" y="134.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="423.333" dy="0">0</tspan></text><rect x="524.167" y="109.5" width="195.667" height="41" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="622" y="134.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="622" dy="0">100</tspan></text><rect x="722.833" y="109.5" width="195.667" height="41" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="820.667" y="134.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="820.667" dy="0">100</tspan></text><rect x="325.5" y="153.5" width="195.667" height="41" rx="4" fill="#d9e2ec" stroke="#ffffff" stroke-width="1"/><text x="423.333" y="178.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="423.333" dy="0">0</tspan></text><rect x="524.167" y="153.5" width="195.667" height="41" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="622" y="178.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="622" dy="0">100</tspan></text><rect x="722.833" y="153.5" width="195.667" height="41" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="820.667" y="178.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="820.667" dy="0">100</tspan></text><rect x="325.5" y="197.5" width="195.667" height="41" rx="4" fill="#d9e2ec" stroke="#ffffff" stroke-width="1"/><text x="423.333" y="222.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="423.333" dy="0">0</tspan></text><rect x="524.167" y="197.5" width="195.667" height="41" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="622" y="222.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="622" dy="0">100</tspan></text><rect x="722.833" y="197.5" width="195.667" height="41" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="820.667" y="222.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="820.667" dy="0">100</tspan></text><rect x="325.5" y="241.5" width="195.667" height="41" rx="4" fill="#d9e2ec" stroke="#ffffff" stroke-width="1"/><text x="423.333" y="266.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="423.333" dy="0">0</tspan></text><rect x="524.167" y="241.5" width="195.667" height="41" rx="4" fill="#d9e2ec" stroke="#ffffff" stroke-width="1"/><text x="622" y="266.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="622" dy="0">0</tspan></text><rect x="722.833" y="241.5" width="195.667" height="41" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="820.667" y="266.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="820.667" dy="0">100</tspan></text><rect x="325.5" y="285.5" width="195.667" height="41" rx="4" fill="#d9e2ec" stroke="#ffffff" stroke-width="1"/><text x="423.333" y="310.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="423.333" dy="0">0</tspan></text><rect x="524.167" y="285.5" width="195.667" height="41" rx="4" fill="#d9e2ec" stroke="#ffffff" stroke-width="1"/><text x="622" y="310.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="622" dy="0">0</tspan></text><rect x="722.833" y="285.5" width="195.667" height="41" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="820.667" y="310.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="820.667" dy="0">100</tspan></text><text x="324" y="354" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><rect x="339.54" y="342" width="30.5" height="14" fill="#d9e2ec"/><rect x="369.54" y="342" width="30.5" height="14" fill="#bcc8d4"/><rect x="399.54" y="342" width="30.5" height="14" fill="#a0adbc"/><rect x="429.54" y="342" width="30.5" height="14" fill="#8393a4"/><rect x="459.54" y="342" width="30.5" height="14" fill="#66798b"/><rect x="489.54" y="342" width="30.5" height="14" fill="#495f73"/><rect x="519.54" y="342" width="30.5" height="14" fill="#2d445b"/><rect x="549.54" y="342" width="30.5" height="14" fill="#102a43"/><text x="587.54" y="354" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="587.54" dy="0">100</tspan></text><text x="618.16" y="354" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="618.16" dy="0">más oscuro = mayor (Detectado (%))</tspan></text><rect x="10" y="370" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="394.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La integridad de un registro es una propiedad de quién controla la referencia: quien puede reescribir la cadena entera</tspan></text><text x="470" y="411.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">produce una cadena válida. Un atacante que controle también la referencia no sería detectado.</tspan></text><text x="470" y="459.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
