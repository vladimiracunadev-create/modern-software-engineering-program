<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 531" width="940" height="531" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Simulación en software de 300 escenarios de calentamiento: escenarios que superan 250 grados según el retardo del sensor</title><desc id="d">Línea con los escenarios con violación: 0 con retardo de 0, 2 y 5 muestras, 30 con 10 muestras y 52 con 15 muestras de retardo, con el limitador en 245 grados.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="531" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Simulación en software de 300 escenarios de calentamiento: escenarios que superan 250 grados según el</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">retardo del sensor</tspan></text><line x1="71.08" y1="348" x2="910" y2="348" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="348" x2="71.08" y2="348" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="352.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="258" x2="910" y2="258" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="258" x2="71.08" y2="258" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="262.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="168" x2="910" y2="168" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="168" x2="71.08" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="172.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">40</tspan></text><line x1="71.08" y1="78" x2="910" y2="78" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="78" x2="71.08" y2="78" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="82.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">60</tspan></text><line x1="71.08" y1="78" x2="71.08" y2="348" stroke="#5b7280" stroke-width="1.6"/><line x1="89.08" y1="78" x2="89.08" y2="348" stroke="#d5dde1" stroke-width="1"/><line x1="89.08" y1="348" x2="89.08" y2="353" stroke="#5b7280" stroke-width="1.4"/><text x="89.08" y="369" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="89.08" dy="0">0</tspan></text><line x1="196.136" y1="78" x2="196.136" y2="348" stroke="#d5dde1" stroke-width="1"/><line x1="196.136" y1="348" x2="196.136" y2="353" stroke="#5b7280" stroke-width="1.4"/><text x="196.136" y="369" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="196.136" dy="0">2</tspan></text><line x1="356.72" y1="78" x2="356.72" y2="348" stroke="#d5dde1" stroke-width="1"/><line x1="356.72" y1="348" x2="356.72" y2="353" stroke="#5b7280" stroke-width="1.4"/><text x="356.72" y="369" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="356.72" dy="0">5</tspan></text><line x1="624.36" y1="78" x2="624.36" y2="348" stroke="#d5dde1" stroke-width="1"/><line x1="624.36" y1="348" x2="624.36" y2="353" stroke="#5b7280" stroke-width="1.4"/><text x="624.36" y="369" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="624.36" dy="0">10</tspan></text><line x1="892" y1="78" x2="892" y2="348" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="348" x2="892" y2="353" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="369" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">15</tspan></text><line x1="71.08" y1="348" x2="910" y2="348" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="213" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 213)">Escenarios de 300 con T mayor que 250</text><text x="490.54" y="394" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="490.54" dy="0">Retardo del sensor (muestras)</tspan></text><polyline points="89.08,348 196.136,348 356.72,348 624.36,213 892,114" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="89.08" cy="348" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="89.08" y="337" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="89.08" dy="0">0</tspan></text><circle cx="196.136" cy="348" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="196.136" y="337" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="196.136" dy="0">0</tspan></text><circle cx="356.72" cy="348" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="356.72" y="337" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="356.72" dy="0">0</tspan></text><circle cx="624.36" cy="213" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="624.36" y="202" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="624.36" dy="0">30</tspan></text><circle cx="892" cy="114" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="103" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">52</tspan></text><rect x="10" y="408" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="432.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Con retardo cero la lógica es correcta en los 300 escenarios; el defecto aparece solo cuando el sensor llega tarde, una</tspan></text><text x="470" y="449.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">propiedad del hardware y del tiempo que un banco de prueba con el sensor real (HIL) reproduce y una simulación ideal no.</tspan></text><text x="470" y="466.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Por eso se combinan: simulación para volumen y banco para lo que el modelo no incluye.</tspan></text><text x="470" y="513.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 47; muestra un mecanismo, no mide un producto real.</tspan></text></svg>
