<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 497" width="940" height="497" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Doce tareas típicas de un agente y cinco políticas sobre datos privados, contenido no confiable y comunicación hacia fuera</title><desc id="d">Barras apiladas horizontales con las 12 tareas según la política: sin restricción pasan 12 sin ayuda; quitar la comunicación hacia fuera deja 6 y bloquea 6; quitar el contenido no confiable deja 4 y bloquea 8; quitar los datos privados deja 2 y bloquea 10; marcar lo leído y exigir aprobación para salir deja 9 sin ayuda y 3 con aprobación, sin ninguna bloqueada.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="497" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Doce tareas típicas de un agente y cinco políticas sobre datos privados, contenido no confiable y</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">comunicación hacia fuera</tspan></text><rect x="16" y="64" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Sin ayuda</tspan></text><rect x="131.86" y="64" width="12" height="12" rx="2" fill="#c0432f"/><text x="151.86" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="151.86" dy="0">Bloqueadas</tspan></text><rect x="255.26" y="64" width="12" height="12" rx="2" fill="#946512"/><text x="275.26" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="275.26" dy="0">Con aprobación</tspan></text><line x1="334" y1="96" x2="334" y2="316" stroke="#d5dde1" stroke-width="1"/><line x1="334" y1="316" x2="334" y2="321" stroke="#5b7280" stroke-width="1.4"/><text x="334" y="337" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="334" dy="0">0</tspan></text><line x1="442.34" y1="96" x2="442.34" y2="316" stroke="#d5dde1" stroke-width="1"/><line x1="442.34" y1="316" x2="442.34" y2="321" stroke="#5b7280" stroke-width="1.4"/><text x="442.34" y="337" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442.34" dy="0">2,5</tspan></text><line x1="550.68" y1="96" x2="550.68" y2="316" stroke="#d5dde1" stroke-width="1"/><line x1="550.68" y1="316" x2="550.68" y2="321" stroke="#5b7280" stroke-width="1.4"/><text x="550.68" y="337" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="550.68" dy="0">5</tspan></text><line x1="659.02" y1="96" x2="659.02" y2="316" stroke="#d5dde1" stroke-width="1"/><line x1="659.02" y1="316" x2="659.02" y2="321" stroke="#5b7280" stroke-width="1.4"/><text x="659.02" y="337" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="659.02" dy="0">7,5</tspan></text><line x1="767.36" y1="96" x2="767.36" y2="316" stroke="#d5dde1" stroke-width="1"/><line x1="767.36" y1="316" x2="767.36" y2="321" stroke="#5b7280" stroke-width="1.4"/><text x="767.36" y="337" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767.36" dy="0">10</tspan></text><line x1="875.7" y1="96" x2="875.7" y2="316" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="316" x2="875.7" y2="321" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="337" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">12,5</tspan></text><line x1="334" y1="316" x2="875.7" y2="316" stroke="#5b7280" stroke-width="1.6"/><text x="324" y="122.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="324" dy="0">Sin restricción</tspan></text><text x="324" y="166.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="324" dy="0">Quitar la comunicación hacia fuera</tspan></text><text x="324" y="210.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="324" dy="0">Quitar el contenido no confiable</tspan></text><text x="324" y="254.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="324" dy="0">Quitar los datos privados</tspan></text><text x="324" y="290" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="324" dy="0">Marcar lo leído como no confiable y exigir</tspan></text><text x="324" y="307" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="324" dy="0">aprobación para salir</tspan></text><rect x="334" y="103" width="520.032" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="594.016" y="122.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="594.016" dy="0">12</tspan></text><rect x="854.032" y="103" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><rect x="854.032" y="103" width="0" height="30" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="861.032" y="122.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="861.032" dy="0">12</tspan></text><rect x="334" y="147" width="260.016" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="464.008" y="166.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="464.008" dy="0">6</tspan></text><rect x="594.016" y="147" width="260.016" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="724.024" y="166.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="724.024" dy="0">6</tspan></text><rect x="854.032" y="147" width="0" height="30" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="861.032" y="166.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="861.032" dy="0">12</tspan></text><rect x="334" y="191" width="173.344" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="420.672" y="210.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="420.672" dy="0">4</tspan></text><rect x="507.344" y="191" width="346.688" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="680.688" y="210.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="680.688" dy="0">8</tspan></text><rect x="854.032" y="191" width="0" height="30" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="861.032" y="210.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="861.032" dy="0">12</tspan></text><rect x="334" y="235" width="86.672" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="377.336" y="254.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="377.336" dy="0">2</tspan></text><rect x="420.672" y="235" width="433.36" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="637.352" y="254.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="637.352" dy="0">10</tspan></text><rect x="854.032" y="235" width="0" height="30" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="861.032" y="254.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="861.032" dy="0">12</tspan></text><rect x="334" y="279" width="390.024" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="529.012" y="298.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="529.012" dy="0">9</tspan></text><rect x="724.024" y="279" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><rect x="724.024" y="279" width="130.008" height="30" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="789.028" y="298.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="789.028" dy="0">3</tspan></text><text x="861.032" y="298.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="861.032" dy="0">12</tspan></text><text x="604.85" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="604.85" dy="0">Tareas de 12</tspan></text><rect x="10" y="374" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="398.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Sin restricción, 3 de las 12 tareas reúnen las tres capacidades sin aprobación. En 5 000 configuraciones de 6 herramientas</tspan></text><text x="470" y="415.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de un catálogo de 15, el 73,5 % reúne las tres capacidades. Las tareas y sus capacidades son una clasificación del autor</tspan></text><text x="470" y="432.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">tratada como todo o nada.</tspan></text><text x="470" y="479.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
