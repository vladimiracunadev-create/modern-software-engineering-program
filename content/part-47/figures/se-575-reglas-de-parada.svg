<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 457" width="940" height="457" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Pasos ejecutados antes de la parada según la regla, para cinco comportamientos de agente (tope de 200)</title><desc id="d">Mapa de calor con los pasos antes de la parada de cinco comportamientos según cinco reglas: repetir el mismo paso se detiene en 50 con el máximo, 25 con el presupuesto, 3 con el estado repetido y 9 sin avance; oscilar en 50, 25, 5 y 9; cambiar de estado sin avanzar en 50, 25, nunca y 9; avanzar 12 pasos y estancarse en 50, 25, nunca y 21; la tarea legítima de 60 pasos se corta por error en 50 y 25; combinadas, 3, 5, 9, 21 y 25.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="457" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Pasos ejecutados antes de la parada según la regla, para cinco comportamientos de agente (tope de 200)</tspan></text><text x="347.6" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="347.6" dy="0">50 pasos</tspan></text><text x="474.8" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="474.8" dy="0">30 000 tokens</tspan></text><text x="602" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="602" dy="0">Estado 3 veces</tspan></text><text x="729.2" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="729.2" dy="0">Sin avance en 8</tspan></text><text x="856.4" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="856.4" dy="0">Combinadas</tspan></text><text x="274" y="98.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="274" dy="0">Repite el mismo paso</tspan></text><text x="274" y="142.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="274" dy="0">Oscila entre dos estados</tspan></text><text x="274" y="186.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="274" dy="0">Cambia de estado sin avanzar</tspan></text><text x="274" y="230.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="274" dy="0">Avanza 12 pasos y se estanca</tspan></text><text x="274" y="274.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="274" dy="0">Tarea larga legítima (60 pasos)</tspan></text><rect x="285.5" y="73.5" width="124.2" height="41" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="347.6" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="347.6" dy="0">50</tspan></text><rect x="412.7" y="73.5" width="124.2" height="41" rx="4" fill="#de9486" stroke="#ffffff" stroke-width="1"/><text x="474.8" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="474.8" dy="0">25</tspan></text><rect x="539.9" y="73.5" width="124.2" height="41" rx="4" fill="#f7dad4" stroke="#ffffff" stroke-width="1"/><text x="602" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="602" dy="0">3</tspan></text><rect x="667.1" y="73.5" width="124.2" height="41" rx="4" fill="#f0c7be" stroke="#ffffff" stroke-width="1"/><text x="729.2" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="729.2" dy="0">9</tspan></text><rect x="794.3" y="73.5" width="124.2" height="41" rx="4" fill="#f7dad4" stroke="#ffffff" stroke-width="1"/><text x="856.4" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="856.4" dy="0">3</tspan></text><rect x="285.5" y="117.5" width="124.2" height="41" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="347.6" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="347.6" dy="0">50</tspan></text><rect x="412.7" y="117.5" width="124.2" height="41" rx="4" fill="#de9486" stroke="#ffffff" stroke-width="1"/><text x="474.8" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="474.8" dy="0">25</tspan></text><rect x="539.9" y="117.5" width="124.2" height="41" rx="4" fill="#f5d4cc" stroke="#ffffff" stroke-width="1"/><text x="602" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="602" dy="0">5</tspan></text><rect x="667.1" y="117.5" width="124.2" height="41" rx="4" fill="#f0c7be" stroke="#ffffff" stroke-width="1"/><text x="729.2" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="729.2" dy="0">9</tspan></text><rect x="794.3" y="117.5" width="124.2" height="41" rx="4" fill="#f5d4cc" stroke="#ffffff" stroke-width="1"/><text x="856.4" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="856.4" dy="0">5</tspan></text><rect x="285.5" y="161.5" width="124.2" height="41" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="347.6" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="347.6" dy="0">50</tspan></text><rect x="412.7" y="161.5" width="124.2" height="41" rx="4" fill="#de9486" stroke="#ffffff" stroke-width="1"/><text x="474.8" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="474.8" dy="0">25</tspan></text><rect x="539.9" y="161.5" width="124.2" height="41" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><text x="602" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="602" dy="0">—</tspan></text><rect x="667.1" y="161.5" width="124.2" height="41" rx="4" fill="#f0c7be" stroke="#ffffff" stroke-width="1"/><text x="729.2" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="729.2" dy="0">9</tspan></text><rect x="794.3" y="161.5" width="124.2" height="41" rx="4" fill="#f0c7be" stroke="#ffffff" stroke-width="1"/><text x="856.4" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="856.4" dy="0">9</tspan></text><rect x="285.5" y="205.5" width="124.2" height="41" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="347.6" y="230.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="347.6" dy="0">50</tspan></text><rect x="412.7" y="205.5" width="124.2" height="41" rx="4" fill="#de9486" stroke="#ffffff" stroke-width="1"/><text x="474.8" y="230.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="474.8" dy="0">25</tspan></text><rect x="539.9" y="205.5" width="124.2" height="41" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><text x="602" y="230.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="602" dy="0">—</tspan></text><rect x="667.1" y="205.5" width="124.2" height="41" rx="4" fill="#e2a094" stroke="#ffffff" stroke-width="1"/><text x="729.2" y="230.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="729.2" dy="0">21</tspan></text><rect x="794.3" y="205.5" width="124.2" height="41" rx="4" fill="#e2a094" stroke="#ffffff" stroke-width="1"/><text x="856.4" y="230.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="856.4" dy="0">21</tspan></text><rect x="285.5" y="249.5" width="124.2" height="41" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="347.6" y="274.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="347.6" dy="0">50</tspan></text><rect x="412.7" y="249.5" width="124.2" height="41" rx="4" fill="#de9486" stroke="#ffffff" stroke-width="1"/><text x="474.8" y="274.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="474.8" dy="0">25</tspan></text><rect x="539.9" y="249.5" width="124.2" height="41" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><text x="602" y="274.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="602" dy="0">—</tspan></text><rect x="667.1" y="249.5" width="124.2" height="41" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><text x="729.2" y="274.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="729.2" dy="0">—</tspan></text><rect x="794.3" y="249.5" width="124.2" height="41" rx="4" fill="#de9486" stroke="#ffffff" stroke-width="1"/><text x="856.4" y="274.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="856.4" dy="0">25</tspan></text><text x="284" y="318" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="284" dy="0">0</tspan></text><rect x="299.54" y="306" width="30.5" height="14" fill="#fbe4de"/><rect x="329.54" y="306" width="30.5" height="14" fill="#f3cdc5"/><rect x="359.54" y="306" width="30.5" height="14" fill="#eab6ac"/><rect x="389.54" y="306" width="30.5" height="14" fill="#e29f93"/><rect x="419.54" y="306" width="30.5" height="14" fill="#d9887a"/><rect x="449.54" y="306" width="30.5" height="14" fill="#d17161"/><rect x="479.54" y="306" width="30.5" height="14" fill="#c85a48"/><rect x="509.54" y="306" width="30.5" height="14" fill="#c0432f"/><text x="547.54" y="318" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="547.54" dy="0">50</tspan></text><text x="570.62" y="318" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="570.62" dy="0">más oscuro = mayor (Pasos hasta parar (celda vacía: no para))</tspan></text><rect x="10" y="334" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="358.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Las celdas vacías son los casos en que la regla no para al agente. La última fila no debe detenerse: el máximo y el</tspan></text><text x="470" y="375.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">presupuesto la cortan sin motivo y las combinadas heredan el falso paro. Los comportamientos son máquinas de estados del</tspan></text><text x="470" y="392.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">autor y los parámetros son arbitrarios.</tspan></text><text x="470" y="439.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
