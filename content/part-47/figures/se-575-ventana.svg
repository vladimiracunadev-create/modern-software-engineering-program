<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 531" width="940" height="531" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Variante original del modelo: configuraciones inconsistentes por 100 000 tratamientos según la duración de la ventana de ajuste</title><desc id="d">Línea con las configuraciones inconsistentes: 1129 con una ventana de 2 segundos, 2574 con 4, 5669 con 8 y 8611 con 12 segundos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="531" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Variante original del modelo: configuraciones inconsistentes por 100 000 tratamientos según la duración de</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">la ventana de ajuste</tspan></text><line x1="93.7" y1="348" x2="910" y2="348" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="348" x2="93.7" y2="348" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="352.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">0</tspan></text><line x1="93.7" y1="258" x2="910" y2="258" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="258" x2="93.7" y2="258" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="262.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">3 000</tspan></text><line x1="93.7" y1="168" x2="910" y2="168" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="168" x2="93.7" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="172.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">6 000</tspan></text><line x1="93.7" y1="78" x2="910" y2="78" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="78" x2="93.7" y2="78" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="82.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">9 000</tspan></text><line x1="93.7" y1="78" x2="93.7" y2="348" stroke="#5b7280" stroke-width="1.6"/><line x1="111.7" y1="78" x2="111.7" y2="348" stroke="#d5dde1" stroke-width="1"/><line x1="111.7" y1="348" x2="111.7" y2="353" stroke="#5b7280" stroke-width="1.4"/><text x="111.7" y="369" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="111.7" dy="0">2</tspan></text><line x1="267.76" y1="78" x2="267.76" y2="348" stroke="#d5dde1" stroke-width="1"/><line x1="267.76" y1="348" x2="267.76" y2="353" stroke="#5b7280" stroke-width="1.4"/><text x="267.76" y="369" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="267.76" dy="0">4</tspan></text><line x1="579.88" y1="78" x2="579.88" y2="348" stroke="#d5dde1" stroke-width="1"/><line x1="579.88" y1="348" x2="579.88" y2="353" stroke="#5b7280" stroke-width="1.4"/><text x="579.88" y="369" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="579.88" dy="0">8</tspan></text><line x1="892" y1="78" x2="892" y2="348" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="348" x2="892" y2="353" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="369" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">12</tspan></text><line x1="93.7" y1="348" x2="910" y2="348" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="213" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 213)">Inconsistencias por 100 000</text><text x="501.85" y="394" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="501.85" dy="0">Ventana de ajuste (segundos)</tspan></text><polyline points="111.7,314.13 267.76,270.78 579.88,177.93 892,89.67" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="111.7" cy="314.13" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="111.7" y="303.13" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="111.7" dy="0">1 129</tspan></text><circle cx="267.76" cy="270.78" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="267.76" y="259.78" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="267.76" dy="0">2 574</tspan></text><circle cx="579.88" cy="177.93" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="579.88" y="166.93" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="579.88" dy="0">5 669</tspan></text><circle cx="892" cy="89.67" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="78.67" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">8 611</tspan></text><rect x="10" y="408" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="432.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El riesgo crece casi en proporción a la ventana durante la que una edición no se vuelve a comprobar. En el modelo, acortar</tspan></text><text x="470" y="449.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">el ajuste reduce la exposición pero no la elimina; lo que la elimina es invalidar el ajuste ante cada edición. Solo el tope</tspan></text><text x="470" y="466.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de 8 segundos es un dato del caso; el resto de los valores es del autor.</tspan></text><text x="470" y="513.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 47; muestra un mecanismo, no mide un producto real.</tspan></text></svg>
