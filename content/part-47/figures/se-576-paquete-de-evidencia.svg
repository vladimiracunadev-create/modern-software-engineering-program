<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 613" width="940" height="613" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Paquete de evidencia de diez requisitos y doce pruebas: qué requisitos tienen una variante que su prueba detecta</title><desc id="d">Mapa de calor con diez requisitos de un servicio de avisos, todos en verde con el servicio de referencia: seis de ellos, del cuatro al nueve, tienen una variante defectuosa que su prueba detecta; los cuatro restantes, uno, dos, tres y diez, no tienen variante que demuestre que su prueba puede fallar.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="613" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Paquete de evidencia de diez requisitos y doce pruebas: qué requisitos tienen una variante que su prueba</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">detecta</tspan></text><text x="637" y="79" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="637" dy="0">Variante que su prueba detecta</tspan></text><text x="344" y="112.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">RF-01 umbrales de 72, 24 y 1 hora</tspan></text><text x="344" y="146.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">RF-02 no repetir un aviso</tspan></text><text x="344" y="180.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">RF-03 no avisar si está entregada</tspan></text><text x="344" y="214.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">RF-04 no avisar si está silenciada</tspan></text><text x="344" y="248.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">RF-05 no avisar tras el vencimiento</tspan></text><text x="344" y="274" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">RF-06 solo el umbral más cercano tras una</tspan></text><text x="344" y="291" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">caída</tspan></text><text x="344" y="316.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">RF-07 cambiar el vencimiento reabre umbrales</tspan></text><text x="344" y="350.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">RF-08 registrar cada aviso en el historial</tspan></text><text x="344" y="384.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">RF-09 reiniciar no repite avisos</tspan></text><text x="344" y="418.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">RF-10 una copia restaurada es consistente</tspan></text><rect x="355.5" y="92.5" width="563" height="31" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="637" y="112.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="637" dy="0">sin variante</tspan></text><rect x="355.5" y="126.5" width="563" height="31" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="637" y="146.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="637" dy="0">sin variante</tspan></text><rect x="355.5" y="160.5" width="563" height="31" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="637" y="180.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="637" dy="0">sin variante</tspan></text><rect x="355.5" y="194.5" width="563" height="31" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="637" y="214.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="637" dy="0">sí</tspan></text><rect x="355.5" y="228.5" width="563" height="31" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="637" y="248.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="637" dy="0">sí</tspan></text><rect x="355.5" y="262.5" width="563" height="31" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="637" y="282.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="637" dy="0">sí</tspan></text><rect x="355.5" y="296.5" width="563" height="31" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="637" y="316.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="637" dy="0">sí</tspan></text><rect x="355.5" y="330.5" width="563" height="31" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="637" y="350.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="637" dy="0">sí</tspan></text><rect x="355.5" y="364.5" width="563" height="31" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="637" y="384.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="637" dy="0">sí</tspan></text><rect x="355.5" y="398.5" width="563" height="31" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="637" y="418.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="637" dy="0">sin variante</tspan></text><text x="354" y="457" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="354" dy="0">sin variante</tspan></text><rect x="452.48" y="445" width="30.5" height="14" fill="#dff1ee"/><rect x="482.48" y="445" width="30.5" height="14" fill="#c0e1e0"/><rect x="512.48" y="445" width="30.5" height="14" fill="#a2d0d2"/><rect x="542.48" y="445" width="30.5" height="14" fill="#83c0c4"/><rect x="572.48" y="445" width="30.5" height="14" fill="#64b0b6"/><rect x="602.48" y="445" width="30.5" height="14" fill="#45a0a8"/><rect x="632.48" y="445" width="30.5" height="14" fill="#278f9a"/><rect x="662.48" y="445" width="30.5" height="14" fill="#087f8c"/><text x="700.48" y="457" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="700.48" dy="0">sí</tspan></text><text x="723.56" y="457" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="723.56" dy="0">más oscuro = mayor (Con variante)</tspan></text><rect x="10" y="473" width="920" height="92.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="497.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Defectos que rompen cada requisito: RF-04 D4, RF-05 D6, RF-06 D1, RF-07 D2, RF-08 D5 y RF-09 D3. Las pruebas por requisito</tspan></text><text x="470" y="514.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">son 2, 1, 1, 1, 2, 1, 1, 1, 1 y 1. Cuatro requisitos están en verde sin una variante que demuestre que su prueba puede</tspan></text><text x="470" y="531.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">fallar: verde significa pasa, no verificado. Hay una sola variante por requisito, de modo que la figura muestra que la</tspan></text><text x="470" y="547.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">capacidad de detección no es nula, no cuánta tiene.</tspan></text><text x="470" y="595.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
