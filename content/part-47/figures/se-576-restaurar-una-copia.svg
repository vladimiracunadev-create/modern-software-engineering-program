<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 566" width="940" height="566" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Restaurar una copia de un servicio con 30 entregas y 60 pasadas al día durante tres días (400 caídas por fila)</title><desc id="d">Barras agrupadas con las pasadas perdidas y los avisos reenviados de media según la frecuencia de copia: una copia cada 24 horas pierde 28,9 pasadas y reenvía 6,8 avisos, con algún reenvío en el 87 por ciento de las caídas; cada 6 horas 6,9 y 1,4, el 60 por ciento; cada hora 0,8 y 0,0, el 0 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="566" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Restaurar una copia de un servicio con 30 entregas y 60 pasadas al día durante tres días (400 caídas por</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">fila)</tspan></text><rect x="16" y="64" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Pasadas perdidas</tspan></text><rect x="184.64" y="64" width="12" height="12" rx="2" fill="#946512"/><text x="204.64" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="204.64" dy="0">Avisos reenviados</tspan></text><line x1="71.08" y1="374" x2="920" y2="374" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="374" x2="71.08" y2="374" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="378.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="287.333" x2="920" y2="287.333" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="287.333" x2="71.08" y2="287.333" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="291.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="200.667" x2="920" y2="200.667" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="200.667" x2="71.08" y2="200.667" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="205.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="114" x2="920" y2="114" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="114" x2="71.08" y2="114" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="118.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">30</tspan></text><line x1="71.08" y1="114" x2="71.08" y2="374" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="244" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 244)">Pasadas o avisos (media)</text><rect x="99.3773" y="123.533" width="111.189" height="250.467" rx="3" fill="#c0432f"/><text x="154.972" y="117.533" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="154.972" dy="0">28,9</tspan></text><rect x="214.567" y="315.067" width="111.189" height="58.9333" rx="3" fill="#946512"/><text x="270.161" y="309.067" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="270.161" dy="0">6,8</tspan></text><text x="212.567" y="395" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="212.567" dy="0">Cada 24 h (87 % de caídas con</tspan></text><text x="212.567" y="412" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="212.567" dy="0">reenvío)</tspan></text><rect x="382.351" y="314.2" width="111.189" height="59.8" rx="3" fill="#c0432f"/><text x="437.945" y="308.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="437.945" dy="0">6,9</tspan></text><rect x="497.54" y="361.867" width="111.189" height="12.1333" rx="3" fill="#946512"/><text x="553.135" y="355.867" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="553.135" dy="0">1,4</tspan></text><text x="495.54" y="395" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="495.54" dy="0">Cada 6 h (60 %)</tspan></text><rect x="665.324" y="367.067" width="111.189" height="6.93333" rx="3" fill="#c0432f"/><text x="720.919" y="361.067" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="720.919" dy="0">0,8</tspan></text><rect x="780.513" y="372" width="111.189" height="2" rx="3" fill="#946512"/><text x="836.108" y="366" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="836.108" dy="0">0,0</tspan></text><text x="778.513" y="395" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="778.513" dy="0">Cada 1 h (0 %)</tspan></text><rect x="10" y="443" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="467.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Entre paréntesis, las caídas con algún reenvío. Todas las copias pasan la comprobación de integridad. La copia en línea de</tspan></text><text x="470" y="484.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">SQLite sale siempre íntegra; la frecuencia decide cuántos estudiantes reciben un aviso repetido. La caída uniforme en el</tspan></text><text x="470" y="501.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">tiempo y la ausencia de escrituras concurrentes son supuestos del autor.</tspan></text><text x="470" y="548.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
