<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 538" width="940" height="538" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Quitar un componente del harness cambia el fallo: siete configuraciones sobre seis tareas</title><desc id="d">Barras apiladas horizontales con el destino de seis tareas de corrección de errores en siete configuraciones del harness: el completo resuelve 6 de 6 con 5 pasos de media; sin contexto, sin herramienta de escritura o con un solo paso resuelve 0 de 6; sin criterio de parada resuelve las seis pero consume 12 pasos; sin comprobación de pruebas o sin instrucciones resuelve 3 de 6 y declara terminadas en falso otras 3.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="538" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Quitar un componente del harness cambia el fallo: siete configuraciones sobre seis tareas</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Resueltas</tspan></text><rect x="131.86" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="151.86" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="151.86" dy="0">Terminadas en falso</tspan></text><rect x="323.12" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="343.12" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="343.12" dy="0">Sin resolver</tspan></text><line x1="294" y1="77" x2="294" y2="357" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="357" x2="294" y2="362" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="378" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">0</tspan></text><line x1="487.9" y1="77" x2="487.9" y2="357" stroke="#d5dde1" stroke-width="1"/><line x1="487.9" y1="357" x2="487.9" y2="362" stroke="#5b7280" stroke-width="1.4"/><text x="487.9" y="378" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487.9" dy="0">2</tspan></text><line x1="681.8" y1="77" x2="681.8" y2="357" stroke="#d5dde1" stroke-width="1"/><line x1="681.8" y1="357" x2="681.8" y2="362" stroke="#5b7280" stroke-width="1.4"/><text x="681.8" y="378" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="681.8" dy="0">4</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="357" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="357" x2="875.7" y2="362" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="378" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">6</tspan></text><line x1="294" y1="357" x2="875.7" y2="357" stroke="#5b7280" stroke-width="1.6"/><text x="284" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Harness completo (5,0 pasos)</tspan></text><text x="284" y="141.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Sin contexto entre pasos (12,0)</tspan></text><text x="284" y="181.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Sin herramienta de escritura (12,0)</tspan></text><text x="284" y="221.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Sin bucle, un solo paso (1,0)</tspan></text><text x="284" y="261.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Sin criterio de parada (12,0)</tspan></text><text x="284" y="301.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Sin comprobación de pruebas (3,0)</tspan></text><text x="284" y="341.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Sin instrucciones (3,0)</tspan></text><rect x="294" y="84" width="581.7" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="584.85" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="584.85" dy="0">6</tspan></text><rect x="875.7" y="84" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><rect x="875.7" y="84" width="0" height="26" fill="#6b7c86" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">6</tspan></text><rect x="294" y="124" width="0" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="294" y="124" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><rect x="294" y="124" width="581.7" height="26" fill="#6b7c86" stroke="#ffffff" stroke-width="1.5"/><text x="584.85" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="584.85" dy="0">6</tspan></text><text x="882.7" y="141.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">6</tspan></text><rect x="294" y="164" width="0" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="294" y="164" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><rect x="294" y="164" width="581.7" height="26" fill="#6b7c86" stroke="#ffffff" stroke-width="1.5"/><text x="584.85" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="584.85" dy="0">6</tspan></text><text x="882.7" y="181.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">6</tspan></text><rect x="294" y="204" width="0" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="294" y="204" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><rect x="294" y="204" width="581.7" height="26" fill="#6b7c86" stroke="#ffffff" stroke-width="1.5"/><text x="584.85" y="221.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="584.85" dy="0">6</tspan></text><text x="882.7" y="221.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">6</tspan></text><rect x="294" y="244" width="581.7" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="584.85" y="261.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="584.85" dy="0">6</tspan></text><rect x="875.7" y="244" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><rect x="875.7" y="244" width="0" height="26" fill="#6b7c86" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="261.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">6</tspan></text><rect x="294" y="284" width="290.85" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="439.425" y="301.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="439.425" dy="0">3</tspan></text><rect x="584.85" y="284" width="290.85" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="730.275" y="301.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="730.275" dy="0">3</tspan></text><rect x="875.7" y="284" width="0" height="26" fill="#6b7c86" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="301.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">6</tspan></text><rect x="294" y="324" width="290.85" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="439.425" y="341.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="439.425" dy="0">3</tspan></text><rect x="584.85" y="324" width="290.85" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="730.275" y="341.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="730.275" dy="0">3</tspan></text><rect x="875.7" y="324" width="0" height="26" fill="#6b7c86" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="341.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">6</tspan></text><text x="584.85" y="401" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="584.85" dy="0">Tareas de 6 (entre paréntesis, pasos medios)</tspan></text><rect x="10" y="415" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="439.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cada componente falla de una manera distinta: unos impiden resolver, uno solo desperdicia pasos y dos producen el peor</tspan></text><text x="470" y="456.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">fallo, declarar terminada una tarea que no pasa. La política es un guion, así que el gráfico mide el harness, no a un</tspan></text><text x="470" y="473.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">modelo.</tspan></text><text x="470" y="520.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; ninguna cifra viene de un modelo de lenguaje.</tspan></text></svg>
