<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 443" width="960" height="443" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tareas resueltas de seis según el componente que se quita</title><desc id="d">Gráfico de barras con las tareas resueltas de seis: harness completo 6, sin criterio de parada 6, sin comprobación de pruebas 3, sin instrucciones 3, sin contexto 0, sin escritura 0 y sin bucle 0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="443" fill="#ffffff"/><text x="334" y="37" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Harness completo</tspan></text><rect x="344" y="16" width="600" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="952" y="37" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="952" dy="0">6</tspan></text><text x="334" y="83" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Sin criterio de parada</tspan></text><rect x="344" y="62" width="600" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="952" y="83" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="952" dy="0">6</tspan></text><text x="334" y="129" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Sin comprobación de pruebas</tspan></text><rect x="344" y="108" width="300" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="652" y="129" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="652" dy="0">3</tspan></text><text x="334" y="175" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Sin instrucciones</tspan></text><rect x="344" y="154" width="300" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="652" y="175" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="652" dy="0">3</tspan></text><text x="334" y="221" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Sin contexto</tspan></text><rect x="344" y="200" width="4" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="356" y="221" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="356" dy="0">0</tspan></text><text x="334" y="267" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Sin escritura</tspan></text><rect x="344" y="246" width="4" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="356" y="267" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="356" dy="0">0</tspan></text><text x="334" y="313" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Sin bucle</tspan></text><rect x="344" y="292" width="4" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="356" y="313" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="356" dy="0">0</tspan></text><rect x="10" y="340" width="940" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="364.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Resolver las seis no basta: la configuración sin parada llega al mismo resultado con 12 pasos en vez de 5. La eficiencia es</tspan></text><text x="480" y="381.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">una propiedad del harness.</tspan></text><text x="480" y="429.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; ninguna cifra viene de un modelo de lenguaje.</tspan></text></svg>
