<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 366" width="940" height="366" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un comprobador de reglas del repositorio: dónde acierta y dónde se equivoca (17 casos)</title><desc id="d">Barras horizontales con los 17 casos de un comprobador determinista de reglas: 9 aciertos al detectar una infracción, 4 omisiones, como la ruta temporal armada por concatenación, el token partido en dos cadenas, la llamada a eval por un nombre armado y la prueba vacía, 1 falsa alarma ante un comentario que menciona la ruta y 3 casos sin infracción que no se marcan.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="366" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un comprobador de reglas del repositorio: dónde acierta y dónde se equivoca (17 casos)</tspan></text><line x1="314" y1="49" x2="314" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="314" y1="201" x2="314" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="314" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="314" dy="0">0</tspan></text><line x1="462.485" y1="49" x2="462.485" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="462.485" y1="201" x2="462.485" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="462.485" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462.485" dy="0">3</tspan></text><line x1="610.97" y1="49" x2="610.97" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="610.97" y1="201" x2="610.97" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="610.97" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="610.97" dy="0">6</tspan></text><line x1="759.455" y1="49" x2="759.455" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="759.455" y1="201" x2="759.455" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="759.455" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="759.455" dy="0">9</tspan></text><line x1="907.94" y1="49" x2="907.94" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="907.94" y1="201" x2="907.94" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="907.94" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907.94" dy="0">12</tspan></text><line x1="314" y1="201" x2="907.94" y2="201" stroke="#5b7280" stroke-width="1.6"/><text x="304" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Infracciones detectadas (aciertos)</tspan></text><text x="304" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Infracciones que se escapan (omisiones)</tspan></text><text x="304" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Falsas alarmas</tspan></text><text x="304" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Casos sin infracción que no se marcan</tspan></text><rect x="314" y="55" width="445.455" height="26" rx="3" fill="#946512"/><text x="766.455" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="766.455" dy="0">9</tspan></text><rect x="314" y="93" width="197.98" height="26" rx="3" fill="#946512"/><text x="518.98" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="518.98" dy="0">4</tspan></text><rect x="314" y="131" width="49.495" height="26" rx="3" fill="#946512"/><text x="370.495" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="370.495" dy="0">1</tspan></text><rect x="314" y="169" width="148.485" height="26" rx="3" fill="#946512"/><text x="469.485" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="469.485" dy="0">3</tspan></text><text x="610.97" y="245" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="610.97" dy="0">Casos de 17</tspan></text><rect x="10" y="259" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="283.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Con 17 casos: 9 aciertos, 1 falsa alarma y 4 omisiones (precisión 90 %, cobertura 69 %). Una regla mecánica es barata y</tspan></text><text x="470" y="300.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">exacta en lo que escribe, y ciega a lo que se escribe de otra forma.</tspan></text><text x="470" y="348.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; ninguna cifra viene de un modelo de lenguaje.</tspan></text></svg>
