<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 255" width="960" height="255" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Del módulo al componente: cómo se componen módulos de lenguajes distintos con interfaces tipadas (no se ejecutó)</title><desc id="d">Diagrama de cuatro cajas encadenadas: interfaces escritas en WIT, componentes compilados desde lenguajes distintos, composición que enlaza lo exportado con lo importado y un mundo final con las importaciones que el anfitrión debe conceder; una nota indica que esta parte no se ejecutó.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="255" fill="#ffffff"/><rect x="10" y="14" width="202" height="118" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="111" y="51.68" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="111" dy="0">Interfaz en WIT</tspan></text><text x="111" y="68.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="111" dy="0">Tipos ricos: cadenas,</tspan></text><text x="111" y="84.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="111" dy="0">listas, registros,</tspan></text><text x="111" y="101.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="111" dy="0">variantes</tspan></text><rect x="256" y="14" width="202" height="118" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="357" y="51.68" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="357" dy="0">Componentes</tspan></text><text x="357" y="68.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="357" dy="0">Compilados desde</tspan></text><text x="357" y="84.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="357" dy="0">lenguajes distintos</tspan></text><text x="357" y="101.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="357" dy="0">contra esa interfaz</tspan></text><polyline points="212,73 256,73" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="502" y="14" width="202" height="118" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="603" y="51.68" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="603" dy="0">Composición</tspan></text><text x="603" y="68.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="603" dy="0">Lo que uno exporta se</tspan></text><text x="603" y="84.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="603" dy="0">enlaza con lo que otro</tspan></text><text x="603" y="101.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="603" dy="0">importa</tspan></text><polyline points="458,73 502,73" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="748" y="14" width="202" height="118" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="849" y="60" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="849" dy="0">Mundo final</tspan></text><text x="849" y="76.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="849" dy="0">Las importaciones que el</tspan></text><text x="849" y="93.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="849" dy="0">anfitrión debe conceder</tspan></text><polyline points="704,73 748,73" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="146" width="940" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="170.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Según la especificación, el modelo de componentes evita acordar a mano cómo se pasa una cadena entre módulos, pero no elimina</tspan></text><text x="480" y="187.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">el costo de convertir tipos ni los permisos: siguen siendo importaciones concedidas. El paquete de Python de wasmtime 50.0.1</tspan></text><text x="480" y="204.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">no expone componentes y esta parte no se ejecutó.</tspan></text><text x="480" y="245.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Diagrama conceptual basado en la documentación citada; no es una medición.</tspan></text></svg>
