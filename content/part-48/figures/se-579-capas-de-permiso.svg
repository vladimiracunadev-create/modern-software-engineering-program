<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 201" width="960" height="201" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Capas de control de una llamada a herramienta, de la más barata a la más estricta</title><desc id="d">Diagrama con cuatro cajas: la herramienta debe estar ofrecida al modelo; el análisis de argumentos permite o deniega; el confinamiento resuelve rutas dentro de la raíz; la aprobación humana decide lo irreversible.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="201" fill="#ffffff"/><rect x="10" y="14" width="202" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="111" y="57.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="111" dy="0">Herramienta ofrecida</tspan></text><rect x="256" y="14" width="202" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="357" y="57.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="357" dy="0">Análisis de argumentos</tspan></text><polyline points="212,54 256,54" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="502" y="14" width="202" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="603" y="57.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="603" dy="0">Confinamiento de rutas</tspan></text><polyline points="458,54 502,54" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="748" y="14" width="202" height="80" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="849" y="57.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="849" dy="0">Aprobación humana</tspan></text><polyline points="704,54 748,54" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="108" width="940" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="132.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Cada capa cubre lo que la anterior no ve. Ninguna sustituye a la última para lo irreversible, y la última deja de valer si se</tspan></text><text x="480" y="149.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">concede por costumbre.</tspan></text><text x="480" y="191.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; ninguna cifra viene de un modelo de lenguaje.</tspan></text></svg>
