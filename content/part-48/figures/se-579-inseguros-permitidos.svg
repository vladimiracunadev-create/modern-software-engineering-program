<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 305" width="960" height="305" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Comandos inseguros permitidos de 18 según la política</title><desc id="d">Gráfico de barras: la lista de prefijos permite 13 de 18 comandos inseguros y el análisis del comando permite 0; entre los 12 comandos seguros, los prefijos deniegan 0 y el análisis deniega 1.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="305" fill="#ffffff"/><text x="384" y="37" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="384" dy="0">Lista de prefijos: inseguros permitidos</tspan></text><rect x="394" y="16" width="650" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="1052" y="37" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="1052" dy="0">13 de 18</tspan></text><text x="384" y="83" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="384" dy="0">Análisis: inseguros permitidos</tspan></text><rect x="394" y="62" width="4" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="406" y="83" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="406" dy="0">0 de 18</tspan></text><text x="384" y="129" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="384" dy="0">Lista de prefijos: seguros denegados</tspan></text><rect x="394" y="108" width="4" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="406" y="129" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="406" dy="0">0 de 12</tspan></text><text x="384" y="175" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="384" dy="0">Análisis: seguros denegados</tspan></text><rect x="394" y="154" width="50" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="452" y="175" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="452" dy="0">1 de 12</tspan></text><rect x="10" y="202" width="940" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="226.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Un permiso por prefijo describe cómo empieza un comando, no qué hace. Los operadores de shell convierten un comando permitido</tspan></text><text x="480" y="243.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">en dos.</tspan></text><text x="480" y="291.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; ninguna cifra viene de un modelo de lenguaje.</tspan></text></svg>
