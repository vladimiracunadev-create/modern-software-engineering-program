<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 259" width="960" height="259" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Hechos recordados de 10 con una ventana de 12 000 fichas</title><desc id="d">Gráfico de barras con una ventana de 12 000 fichas: truncar lo antiguo conserva 1 de 10 hechos, resumir lo declarado 6 y el archivo de notas del harness 8.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="259" fill="#ffffff"/><text x="334" y="37" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Truncar lo antiguo</tspan></text><rect x="344" y="16" width="60" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="412" y="37" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="412" dy="0">1 de 10</tspan></text><text x="334" y="83" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Resumir lo declarado</tspan></text><rect x="344" y="62" width="360" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="712" y="83" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="712" dy="0">6 de 10</tspan></text><text x="334" y="129" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Archivo de notas del harness</tspan></text><rect x="344" y="108" width="480" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="832" y="129" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="832" dy="0">8 de 10</tspan></text><rect x="10" y="156" width="940" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="180.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Los 2 hechos que ninguna estrategia conserva aparecieron solo dentro de la salida de una herramienta, nunca en un mensaje de</tspan></text><text x="480" y="197.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">la persona: nadie los declaró ni los anotó.</tspan></text><text x="480" y="245.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; ninguna cifra viene de un modelo de lenguaje.</tspan></text></svg>
