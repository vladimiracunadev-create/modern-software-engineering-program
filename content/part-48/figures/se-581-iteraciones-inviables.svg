<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 305" width="960" height="305" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Iteraciones gastadas en las tareas inviables según la regla de parada</title><desc id="d">Gráfico de barras con las iteraciones gastadas en tareas inviables: sin tope 60, tope de 30 iteraciones 30, tope de 10 iteraciones 10 y detector de falta de progreso 6.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="305" fill="#ffffff"/><text x="334" y="37" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Sin tope</tspan></text><rect x="344" y="16" width="660" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="1012" y="37" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="1012" dy="0">60</tspan></text><text x="334" y="83" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Tope de 30</tspan></text><rect x="344" y="62" width="330" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="682" y="83" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="682" dy="0">30</tspan></text><text x="334" y="129" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Tope de 10</tspan></text><rect x="344" y="108" width="110" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="462" y="129" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="462" dy="0">10</tspan></text><text x="334" y="175" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Detector de falta de progreso</tspan></text><rect x="344" y="154" width="66" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="418" y="175" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="418" dy="0">6</tspan></text><rect x="10" y="202" width="940" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="226.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">El costo de una tarea inviable es proporcional a la regla de parada, no a la tarea. Una tarea inviable sin tope gasta 10 veces</tspan></text><text x="480" y="243.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">más que con el detector.</tspan></text><text x="480" y="291.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Simulación con semilla fija (parámetros del autor) ejecutada en Windows 11 con CPython 3.12.9; no mide ningún modelo real.</tspan></text></svg>
