<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 546" width="940" height="546" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cinco reglas de parada sobre 4 000 tareas sintéticas: resueltas frente a costo</title><desc id="d">Dispersión de las tareas resueltas frente a las iteraciones medias de cinco reglas de parada: sin tope resuelve 69,9 por ciento con 20,1 iteraciones de media; el tope de 10 resuelve 68,8 con 5,0; el tope de 30 resuelve 69,2 con 11,2; el detector de falta de progreso resuelve 77,0 con 3,5, igual que combinado con el tope de 10.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="546" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cinco reglas de parada sobre 4 000 tareas sintéticas: resueltas frente a costo</tspan></text><line x1="71.08" y1="379" x2="910" y2="379" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="379" x2="71.08" y2="379" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="383.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">60</tspan></text><line x1="71.08" y1="299" x2="910" y2="299" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="299" x2="71.08" y2="299" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="303.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">65</tspan></text><line x1="71.08" y1="219" x2="910" y2="219" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="219" x2="71.08" y2="219" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="223.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">70</tspan></text><line x1="71.08" y1="139" x2="910" y2="139" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="139" x2="71.08" y2="139" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="143.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">75</tspan></text><line x1="71.08" y1="59" x2="910" y2="59" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="59" x2="71.08" y2="59" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="63.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">80</tspan></text><line x1="71.08" y1="59" x2="71.08" y2="379" stroke="#5b7280" stroke-width="1.6"/><line x1="89.08" y1="59" x2="89.08" y2="379" stroke="#d5dde1" stroke-width="1"/><line x1="89.08" y1="379" x2="89.08" y2="384" stroke="#5b7280" stroke-width="1.4"/><text x="89.08" y="400" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="89.08" dy="0">0</tspan></text><line x1="249.664" y1="59" x2="249.664" y2="379" stroke="#d5dde1" stroke-width="1"/><line x1="249.664" y1="379" x2="249.664" y2="384" stroke="#5b7280" stroke-width="1.4"/><text x="249.664" y="400" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="249.664" dy="0">5</tspan></text><line x1="410.248" y1="59" x2="410.248" y2="379" stroke="#d5dde1" stroke-width="1"/><line x1="410.248" y1="379" x2="410.248" y2="384" stroke="#5b7280" stroke-width="1.4"/><text x="410.248" y="400" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="410.248" dy="0">10</tspan></text><line x1="570.832" y1="59" x2="570.832" y2="379" stroke="#d5dde1" stroke-width="1"/><line x1="570.832" y1="379" x2="570.832" y2="384" stroke="#5b7280" stroke-width="1.4"/><text x="570.832" y="400" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="570.832" dy="0">15</tspan></text><line x1="731.416" y1="59" x2="731.416" y2="379" stroke="#d5dde1" stroke-width="1"/><line x1="731.416" y1="379" x2="731.416" y2="384" stroke="#5b7280" stroke-width="1.4"/><text x="731.416" y="400" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="731.416" dy="0">20</tspan></text><line x1="892" y1="59" x2="892" y2="379" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="379" x2="892" y2="384" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="400" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">25</tspan></text><line x1="71.08" y1="379" x2="910" y2="379" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="219" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 219)">Tareas resueltas (%)</text><text x="490.54" y="425" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="490.54" dy="0">Iteraciones medias por tarea</tspan></text><circle cx="734.628" cy="220.6" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="724.628" y="225.1" font-size="13" text-anchor="end" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="724.628" dy="0">Sin tope (60 en las inviables)</tspan></text><circle cx="249.664" cy="238.2" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="249.664" y="262.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="249.664" dy="0">Tope de 10</tspan></text><circle cx="448.788" cy="231.8" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="458.788" y="236.3" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="458.788" dy="0">Tope de 30</tspan></text><circle cx="201.489" cy="107" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="211.489" y="111.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="211.489" dy="0">Detector de falta de progreso, solo o con tope de 10 (6 en las inviables)</tspan></text><rect x="10" y="439" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="463.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Mezcla del autor: 70 % de tareas reintentables, 15 % que exigen cambiar de plan y 15 % inviables. Un tope solo limita el</tspan></text><text x="470" y="480.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">daño; cambiar de plan al detectar que no hay progreso añade 7 puntos.</tspan></text><text x="470" y="528.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación con semilla fija (parámetros del autor) ejecutada en Windows 11 con CPython 3.12.9; no mide ningún modelo real.</tspan></text></svg>
