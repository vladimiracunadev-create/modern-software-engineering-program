<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 255" width="960" height="255" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La escala de fronteras de aislamiento según lo que comparten con el anfitrión</title><desc id="d">Diagrama de cuatro cajas encadenadas: un hilo que comparte todo el proceso, un proceso o contenedor que comparten el núcleo, un núcleo de aplicación o un módulo de WebAssembly que reducen la superficie compartida y una microVM que comparte solo el hipervisor; una nota indica que la fuerza depende de qué se comparte y no del nombre.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="255" fill="#ffffff"/><rect x="10" y="14" width="202" height="118" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="111" y="51.68" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="111" dy="0">Hilo</tspan></text><text x="111" y="68.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="111" dy="0">Comparte todo el proceso</tspan></text><text x="111" y="84.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="111" dy="0">y no se puede cortar</tspan></text><text x="111" y="101.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="111" dy="0">desde fuera</tspan></text><rect x="256" y="14" width="202" height="118" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="357" y="60" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="357" dy="0">Proceso o contenedor</tspan></text><text x="357" y="76.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="357" dy="0">Comparten el núcleo del</tspan></text><text x="357" y="93.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="357" dy="0">anfitrión</tspan></text><polyline points="212,73 256,73" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="502" y="14" width="202" height="118" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="603" y="43.36" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="603" dy="0">Núcleo de aplicación o</tspan></text><text x="603" y="60" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="603" dy="0">Wasm</tspan></text><text x="603" y="76.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="603" dy="0">Reducen la superficie</tspan></text><text x="603" y="93.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="603" dy="0">compartida con el</tspan></text><text x="603" y="109.92" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="603" dy="0">anfitrión</tspan></text><polyline points="458,73 502,73" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="748" y="14" width="202" height="118" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="849" y="51.68" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="849" dy="0">microVM</tspan></text><text x="849" y="68.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="849" dy="0">Núcleo propio; se</tspan></text><text x="849" y="84.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="849" dy="0">comparte el hipervisor y</tspan></text><text x="849" y="101.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="849" dy="0">sus dispositivos</tspan></text><polyline points="704,73 748,73" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="146" width="940" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="170.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">No es un orden total de seguridad: la fuerza depende de qué superficie queda compartida y de cuánto código la implementa, no</tspan></text><text x="480" y="187.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">del nombre. Cada frontera tiene configuraciones que la acercan o la alejan de su caja. Resumen conceptual de la documentación</tspan></text><text x="480" y="204.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">citada; solo se midieron hilo, instancia de Wasm y proceso.</tspan></text><text x="480" y="245.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Diagrama conceptual basado en NIST SP 800-190 y en la documentación de gVisor, Firecracker y Kata; no es una medición.</tspan></text></svg>
