<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 397" width="960" height="397" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Defectos atrapados por cada compuerta del menú único (de 11)</title><desc id="d">Gráfico de barras con los defectos atrapados de once por compuerta: sintaxis 1, estilo 5, secretos 1, pruebas 2, no debilitar pruebas 2; el menú completo atrapa 9.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="397" fill="#ffffff"/><text x="334" y="37" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Sintaxis</tspan></text><rect x="344" y="16" width="40" height="30" rx="3" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="392" y="37" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="392" dy="0">1</tspan></text><text x="334" y="83" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Estilo</tspan></text><rect x="344" y="62" width="200" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="552" y="83" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="552" dy="0">5</tspan></text><text x="334" y="129" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Secretos</tspan></text><rect x="344" y="108" width="40" height="30" rx="3" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="392" y="129" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="392" dy="0">1</tspan></text><text x="334" y="175" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Pruebas</tspan></text><rect x="344" y="154" width="80" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="432" y="175" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="432" dy="0">2</tspan></text><text x="334" y="221" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">No debilitar pruebas</tspan></text><rect x="344" y="200" width="80" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="432" y="221" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="432" dy="0">2</tspan></text><text x="334" y="267" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Menú completo</tspan></text><rect x="344" y="246" width="360" height="30" rx="3" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="712" y="267" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="712" dy="0">9</tspan></text><rect x="10" y="294" width="940" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="318.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Las compuertas baratas atrapan más defectos que la costosa: las pruebas tardan cientos de milisegundos; la sintaxis, el estilo</tspan></text><text x="480" y="335.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">y los secretos, unos pocos. Orden: lo barato primero.</tspan></text><text x="480" y="383.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; ninguna cifra viene de un modelo de lenguaje.</tspan></text></svg>
