<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 313" width="960" height="313" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un solo punto de entrada que ejecuta las compuertas de la más barata a la más cara</title><desc id="d">Diagrama con dos filas: el agente y la persona invocan el mismo comando; el menú ejecuta sintaxis, estilo, secretos, pruebas y la comprobación de que no se debilitaron pruebas; al primer fallo se detiene e imprime el nombre de la compuerta y el motivo; el código de salida decide.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="313" fill="#ffffff"/><rect x="10" y="14" width="284" height="76" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="152" y="55.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="152" dy="0">Mismo comando para agente y persona</tspan></text><rect x="338" y="14" width="284" height="76" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="480" y="55.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">Sintaxis, estilo y secretos</tspan></text><polyline points="294,52 338,52" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="666" y="14" width="284" height="76" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="808" y="55.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="808" dy="0">Pruebas y no debilitar pruebas</tspan></text><polyline points="622,52 666,52" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="130" width="284" height="76" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="152" y="163.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="152" dy="0">Primer fallo detiene y nombra la</tspan></text><text x="152" y="179.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="152" dy="0">compuerta</tspan></text><rect x="338" y="130" width="284" height="76" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="480" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="480" dy="0">Código de salida decide</tspan></text><polyline points="294,168 338,168" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="666" y="130" width="284" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="808" y="163.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="808" dy="0">Misma compuerta en integración</tspan></text><text x="808" y="179.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="808" dy="0">continua</tspan></text><polyline points="622,168 666,168" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="808,90 808,110 152,110 152,130" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="220" width="940" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="244.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Un menú único elimina que cada quien corra una parte. La compuerta que corre en la integración continua debe ser exactamente</tspan></text><text x="480" y="261.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">la que corre el agente antes de entregar.</tspan></text><text x="480" y="303.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; ninguna cifra viene de un modelo de lenguaje.</tspan></text></svg>
