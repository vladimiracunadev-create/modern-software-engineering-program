<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 425" width="940" height="425" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dos agentes en ramas de Git reales: lo que dice la fusión y lo que dicen las pruebas</title><desc id="d">Diagrama de flujo de cuatro escenarios de dos ramas de Git creadas en directorios temporales: archivos distintos y zonas lejanas del mismo archivo se fusionan limpios y las pruebas pasan; editar las mismas líneas produce un conflicto; renombrar una función en una rama y usarla desde otra se fusiona limpio y las pruebas fallan.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="425" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dos agentes en ramas de Git reales: lo que dice la fusión y lo que dicen las pruebas</tspan></text><text x="184" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="184" dy="0">Escenario</tspan></text><text x="498" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="498" dy="0">Fusión de Git</tspan></text><text x="767" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="767" dy="0">Pruebas tras fusionar</tspan></text><rect x="14" y="71" width="340" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="184" y="97.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="184" dy="0">Archivos distintos</tspan></text><polyline points="358,94 384,94" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="388" y="71" width="220" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="498" y="97.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="498" dy="0">Fusión limpia</tspan></text><polyline points="612,94 638,94" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="642" y="71" width="250" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="767" y="97.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="767" dy="0">Las pruebas pasan</tspan></text><rect x="14" y="129" width="340" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="184" y="155.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="184" dy="0">Mismo archivo, zonas lejanas</tspan></text><polyline points="358,152 384,152" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="388" y="129" width="220" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="498" y="155.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="498" dy="0">Fusión limpia</tspan></text><polyline points="612,152 638,152" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="642" y="129" width="250" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="767" y="155.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="767" dy="0">Las pruebas pasan</tspan></text><rect x="14" y="187" width="340" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="184" y="213.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="184" dy="0">Mismas líneas</tspan></text><polyline points="358,210 384,210" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="388" y="187" width="220" height="46" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="498" y="213.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="498" dy="0">Conflicto de texto</tspan></text><polyline points="612,210 638,210" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="642" y="187" width="250" height="46" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="767" y="213.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="767" dy="0">No aplica</tspan></text><rect x="14" y="245" width="340" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="184" y="267.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="184" dy="0">Renombrar una función en una rama y usarla</tspan></text><text x="184" y="284.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="184" dy="0">desde otra</tspan></text><polyline points="358,272.64 384,272.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="388" y="245" width="220" height="55.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="498" y="276.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="498" dy="0">Fusión limpia</tspan></text><polyline points="612,272.64 638,272.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="642" y="245" width="250" height="55.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="767" y="276.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="767" dy="0">Las pruebas FALLAN</tspan></text><rect x="10" y="318.28" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="343.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Que Git fusione sin conflicto no significa que el resultado funcione. El conflicto semántico solo lo ve una verificación</tspan></text><text x="470" y="359.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">posterior a la fusión, y el conflicto textual es el caso fácil.</tspan></text><text x="470" y="407.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; ninguna cifra viene de un modelo de lenguaje.</tspan></text></svg>
