<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 477" width="940" height="477" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Desigualdad de Mosca en cinco escenarios: años hasta un ordenador cuántico capaz frente a vida del dato más migración</title><desc id="d">Mancuernas con cinco escenarios: el tiempo hasta el ordenador cuántico supuesto frente a la vida del dato más la migración: 15 frente a 4, 15 frente a 20, 15 frente a 30, 15 frente a 18 y 25 frente a 36 años.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="477" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Desigualdad de Mosca en cinco escenarios: años hasta un ordenador cuántico capaz frente a vida del dato más</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">migración</tspan></text><circle cx="22" cy="70" r="6" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">z: años hasta un ordenador capaz (supuesto)</tspan></text><circle cx="394.22" cy="70" r="6" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="408.22" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="408.22" dy="0">x + y: vida del dato más migración</tspan></text><line x1="248.12" y1="96" x2="248.12" y2="296" stroke="#d5dde1" stroke-width="1"/><line x1="248.12" y1="296" x2="248.12" y2="301" stroke="#5b7280" stroke-width="1.4"/><text x="248.12" y="317" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="248.12" dy="0">0</tspan></text><line x1="406.56" y1="96" x2="406.56" y2="296" stroke="#d5dde1" stroke-width="1"/><line x1="406.56" y1="296" x2="406.56" y2="301" stroke="#5b7280" stroke-width="1.4"/><text x="406.56" y="317" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="406.56" dy="0">10</tspan></text><line x1="565" y1="96" x2="565" y2="296" stroke="#d5dde1" stroke-width="1"/><line x1="565" y1="296" x2="565" y2="301" stroke="#5b7280" stroke-width="1.4"/><text x="565" y="317" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="565" dy="0">20</tspan></text><line x1="723.44" y1="96" x2="723.44" y2="296" stroke="#d5dde1" stroke-width="1"/><line x1="723.44" y1="296" x2="723.44" y2="301" stroke="#5b7280" stroke-width="1.4"/><text x="723.44" y="317" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="723.44" dy="0">30</tspan></text><line x1="881.88" y1="96" x2="881.88" y2="296" stroke="#d5dde1" stroke-width="1"/><line x1="881.88" y1="296" x2="881.88" y2="301" stroke="#5b7280" stroke-width="1.4"/><text x="881.88" y="317" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="881.88" dy="0">40</tspan></text><line x1="248.12" y1="296" x2="881.88" y2="296" stroke="#5b7280" stroke-width="1.6"/><text x="204" y="120.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="204" dy="0">x = 1, y = 3, z = 15</tspan></text><text x="204" y="160.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="204" dy="0">x = 15, y = 5, z = 15</tspan></text><text x="204" y="200.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="204" dy="0">x = 25, y = 5, z = 15</tspan></text><text x="204" y="240.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="204" dy="0">x = 10, y = 8, z = 15</tspan></text><text x="204" y="280.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="204" dy="0">x = 30, y = 6, z = 25</tspan></text><line x1="485.78" y1="116" x2="311.496" y2="116" stroke="#087f8c" stroke-width="4"/><circle cx="485.78" cy="116" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="311.496" cy="116" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="497.78" y="120.5" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="497.78" dy="0">15</tspan></text><text x="299.496" y="120.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="299.496" dy="0">4</tspan></text><line x1="485.78" y1="156" x2="565" y2="156" stroke="#c0432f" stroke-width="4"/><circle cx="485.78" cy="156" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="565" cy="156" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="473.78" y="160.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="473.78" dy="0">15</tspan></text><text x="577" y="160.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="577" dy="0">20</tspan></text><line x1="485.78" y1="196" x2="723.44" y2="196" stroke="#c0432f" stroke-width="4"/><circle cx="485.78" cy="196" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="723.44" cy="196" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="473.78" y="200.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="473.78" dy="0">15</tspan></text><text x="735.44" y="200.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="735.44" dy="0">30</tspan></text><line x1="485.78" y1="236" x2="533.312" y2="236" stroke="#c0432f" stroke-width="4"/><circle cx="485.78" cy="236" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="533.312" cy="236" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="473.78" y="240.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="473.78" dy="0">15</tspan></text><text x="545.312" y="240.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="545.312" dy="0">18</tspan></text><line x1="644.22" y1="276" x2="818.504" y2="276" stroke="#c0432f" stroke-width="4"/><circle cx="644.22" cy="276" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="818.504" cy="276" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="632.22" y="280.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="632.22" dy="0">25</tspan></text><text x="830.504" y="280.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="830.504" dy="0">36</tspan></text><text x="565" y="340" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="565" dy="0">Años</tspan></text><rect x="10" y="354" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="378.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Hay riesgo cuando x + y supera a z: cuatro de los cinco escenarios lo tienen. El cuarto (x = 10, y = 8) muestra que datos</tspan></text><text x="470" y="395.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de vida media con una migración lenta ya son urgentes. Todos los valores son ejemplos del autor, no pronósticos; la fecha z</tspan></text><text x="470" y="412.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">es la incógnita y se hace un análisis de sensibilidad en lugar de buscar una predicción.</tspan></text><text x="470" y="459.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 48; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
