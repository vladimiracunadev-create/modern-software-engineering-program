<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 522" width="940" height="522" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Probabilidad de falsificar un mensaje nuevo tras k firmas con el mismo par de claves de Lamport</title><desc id="d">Líneas con la probabilidad de poder falsificar un mensaje nuevo tras k firmas con el mismo par de claves de Lamport: prácticamente cero con 1, 2 y 4 firmas, 0,367 con 8, 0,939 con 12 y 0,996 con 16.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="522" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Probabilidad de falsificar un mensaje nuevo tras k firmas con el mismo par de claves de Lamport</tspan></text><line x1="86.16" y1="339" x2="910" y2="339" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="339" x2="86.16" y2="339" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="343.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">0</tspan></text><line x1="86.16" y1="269" x2="910" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="269" x2="86.16" y2="269" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="273.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">0,25</tspan></text><line x1="86.16" y1="199" x2="910" y2="199" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="199" x2="86.16" y2="199" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="203.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">0,5</tspan></text><line x1="86.16" y1="129" x2="910" y2="129" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="129" x2="86.16" y2="129" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="133.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">0,75</tspan></text><line x1="86.16" y1="59" x2="910" y2="59" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="59" x2="86.16" y2="59" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="63.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">1</tspan></text><line x1="86.16" y1="59" x2="86.16" y2="339" stroke="#5b7280" stroke-width="1.6"/><line x1="104.16" y1="59" x2="104.16" y2="339" stroke="#d5dde1" stroke-width="1"/><line x1="104.16" y1="339" x2="104.16" y2="344" stroke="#5b7280" stroke-width="1.4"/><text x="104.16" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="104.16" dy="0">1</tspan></text><line x1="156.683" y1="59" x2="156.683" y2="339" stroke="#d5dde1" stroke-width="1"/><line x1="156.683" y1="339" x2="156.683" y2="344" stroke="#5b7280" stroke-width="1.4"/><text x="156.683" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="156.683" dy="0">2</tspan></text><line x1="261.728" y1="59" x2="261.728" y2="339" stroke="#d5dde1" stroke-width="1"/><line x1="261.728" y1="339" x2="261.728" y2="344" stroke="#5b7280" stroke-width="1.4"/><text x="261.728" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="261.728" dy="0">4</tspan></text><line x1="471.819" y1="59" x2="471.819" y2="339" stroke="#d5dde1" stroke-width="1"/><line x1="471.819" y1="339" x2="471.819" y2="344" stroke="#5b7280" stroke-width="1.4"/><text x="471.819" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="471.819" dy="0">8</tspan></text><line x1="681.909" y1="59" x2="681.909" y2="339" stroke="#d5dde1" stroke-width="1"/><line x1="681.909" y1="339" x2="681.909" y2="344" stroke="#5b7280" stroke-width="1.4"/><text x="681.909" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="681.909" dy="0">12</tspan></text><line x1="892" y1="59" x2="892" y2="339" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="339" x2="892" y2="344" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">16</tspan></text><line x1="86.16" y1="339" x2="910" y2="339" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="199" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 199)">Probabilidad de falsificar</text><text x="498.08" y="385" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="498.08" dy="0">Firmas ya emitidas con el mismo par de claves</tspan></text><polyline points="104.16,339 156.683,339 261.728,339 471.819,236.184 681.909,75.968 892,60.092" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="104.16" cy="339" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="104.16" y="328" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="104.16" dy="0">0,000</tspan></text><circle cx="156.683" cy="339" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="156.683" y="328" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="156.683" dy="0">0,000</tspan></text><circle cx="261.728" cy="339" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="261.728" y="328" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="261.728" dy="0">0,000</tspan></text><circle cx="471.819" cy="236.184" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="471.819" y="225.184" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="471.819" dy="0">0,367</tspan></text><circle cx="681.909" cy="75.968" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="681.909" y="64.968" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="681.909" dy="0">0,939</tspan></text><circle cx="892" cy="60.092" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="49.092" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">0,996</tspan></text><rect x="10" y="399" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="423.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">La curva despega entre 4 y 8 firmas y casi se satura en 16: cada firma revela la mitad de los secretos. La fórmula es el</tspan></text><text x="470" y="440.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">promedio sobre mensajes y firmas al azar; con 8 firmas reales y 300 mensajes nuevos se falsificaron 49 (16,3 %), porque ese</tspan></text><text x="470" y="457.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">conjunto concreto dejó 3 de 512 secretos sin revelar (probabilidad 2⁻³). SLH-DSA evita el problema con un árbol de claves.</tspan></text><text x="470" y="504.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; los recuentos se repiten y los tiempos varían de una ejecución y de un equipo a otro.</tspan></text></svg>
