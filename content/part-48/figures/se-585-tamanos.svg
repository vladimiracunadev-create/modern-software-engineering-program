<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tamaño en bytes de claves públicas y de firmas o textos cifrados en algoritmos clásicos y poscuánticos</title><desc id="d">Barras agrupadas en escala logarítmica con el tamaño en bytes de la clave pública y de la firma o texto cifrado: X25519 32 y 32, Ed25519 32 y 64, ML-KEM-768 1184 y 1088, ML-DSA-65 1952 y 3309 y la firma de Lamport con SHA-256 16384 y 8192.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="560" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Tamaño en bytes de claves públicas y de firmas o textos cifrados en algoritmos clásicos y poscuánticos</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Clave pública</tspan></text><rect x="162.02" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="182.02" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="182.02" dy="0">Firma, texto cifrado o valor intercambiado</tspan></text><line x1="108.78" y1="385" x2="980" y2="385" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="385" x2="108.78" y2="385" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="389.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">10</tspan></text><line x1="108.78" y1="312.5" x2="980" y2="312.5" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="312.5" x2="108.78" y2="312.5" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="317" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">100</tspan></text><line x1="108.78" y1="240" x2="980" y2="240" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="240" x2="108.78" y2="240" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="244.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">1 000</tspan></text><line x1="108.78" y1="167.5" x2="980" y2="167.5" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="167.5" x2="108.78" y2="167.5" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="172" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">10 000</tspan></text><line x1="108.78" y1="95" x2="980" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="95" x2="108.78" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">100 000</tspan></text><line x1="108.78" y1="95" x2="108.78" y2="385" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="240" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 240)">Bytes (escala logarítmica) (escala logarítmica)</text><rect x="126.204" y="348.377" width="67.6976" height="36.6234" rx="3" fill="#102a43"/><text x="160.053" y="342.377" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="160.053" dy="0">32</tspan></text><rect x="197.902" y="348.377" width="67.6976" height="36.6234" rx="3" fill="#c0432f"/><text x="231.751" y="342.377" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="231.751" dy="0">32</tspan></text><text x="195.902" y="406" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="195.902" dy="0">X25519</tspan></text><rect x="300.448" y="348.377" width="67.6976" height="36.6234" rx="3" fill="#102a43"/><text x="334.297" y="342.377" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="334.297" dy="0">32</tspan></text><rect x="372.146" y="326.552" width="67.6976" height="58.448" rx="3" fill="#c0432f"/><text x="405.995" y="320.552" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="405.995" dy="0">64</tspan></text><text x="370.146" y="406" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="370.146" dy="0">Ed25519</tspan></text><rect x="474.692" y="234.682" width="67.6976" height="150.318" rx="3" fill="#102a43"/><text x="508.541" y="228.682" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="508.541" dy="0">1 184</tspan></text><rect x="546.39" y="237.344" width="67.6976" height="147.656" rx="3" fill="#c0432f"/><text x="580.239" y="231.344" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="580.239" dy="0">1 088</tspan></text><text x="544.39" y="406" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="544.39" dy="0">ML-KEM-768</tspan></text><rect x="648.936" y="218.94" width="67.6976" height="166.06" rx="3" fill="#102a43"/><text x="682.785" y="212.94" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="682.785" dy="0">1 952</tspan></text><rect x="720.634" y="202.322" width="67.6976" height="182.678" rx="3" fill="#c0432f"/><text x="754.483" y="196.322" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="754.483" dy="0">3 309</tspan></text><text x="718.634" y="406" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="718.634" dy="0">ML-DSA-65</tspan></text><rect x="823.18" y="151.955" width="67.6976" height="233.045" rx="3" fill="#102a43"/><text x="857.029" y="145.955" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="857.029" dy="0">16 384</tspan></text><rect x="894.878" y="173.779" width="67.6976" height="211.221" rx="3" fill="#c0432f"/><text x="928.727" y="167.779" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="928.727" dy="0">8 192</tspan></text><text x="892.878" y="406" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892.878" dy="0">Lamport (SHA-256)</tspan></text><rect x="10" y="437" width="980" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="500" y="461.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">Una firma de ML-DSA-65 es unas 52 veces mayor que una de Ed25519 y una clave pública de ML-KEM-768 unas 37 veces mayor que la de</tspan></text><text x="500" y="478.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">X25519. En un saludo, el intercambio pasa de 64 bytes (un segmento) a 2 272 con ML-KEM-768 y a 2 336 con el híbrido (dos segmentos</tspan></text><text x="500" y="495.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">de 1 460). Para X25519 se muestra el valor de 32 bytes que cada lado envía. La firma de Lamport es una ilustración, no un estándar.</tspan></text><text x="500" y="542.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; los recuentos se repiten y los tiempos varían de una ejecución y de un equipo a otro.</tspan></text></svg>
