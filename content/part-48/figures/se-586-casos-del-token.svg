<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 448" width="940" height="448" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro casos de un token presentado al servicio de calificaciones y las tres comprobaciones que se aplican en orden</title><desc id="d">Mapa de calor con cuatro casos de un token y tres comprobaciones: el token legítimo pasa firma, vigencia y audiencia; el de otra audiencia falla la audiencia; el vencido falla la vigencia; el de firma alterada falla la firma; cada rechazo lo es por una sola comprobación.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="448" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuatro casos de un token presentado al servicio de calificaciones y las tres comprobaciones que se aplican</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">en orden</tspan></text><text x="415" y="79" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="415" dy="0">Firma</tspan></text><text x="617" y="79" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="617" dy="0">Vigencia</tspan></text><text x="819" y="79" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="819" dy="0">Audiencia</tspan></text><text x="304" y="119.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">Token legítimo</tspan></text><text x="304" y="167.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">Token para otra audiencia</tspan></text><text x="304" y="215.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">Token vencido (seis minutos después)</tspan></text><text x="304" y="263.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">Token con la firma alterada</tspan></text><rect x="315.5" y="92.5" width="199" height="45" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="415" y="119.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="415" dy="0">pasa</tspan></text><rect x="517.5" y="92.5" width="199" height="45" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="617" y="119.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="617" dy="0">pasa</tspan></text><rect x="719.5" y="92.5" width="199" height="45" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="819" y="119.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="819" dy="0">pasa</tspan></text><rect x="315.5" y="140.5" width="199" height="45" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="415" y="167.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="415" dy="0">pasa</tspan></text><rect x="517.5" y="140.5" width="199" height="45" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="617" y="167.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="617" dy="0">pasa</tspan></text><rect x="719.5" y="140.5" width="199" height="45" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="819" y="167.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="819" dy="0">falla</tspan></text><rect x="315.5" y="188.5" width="199" height="45" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="415" y="215.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="415" dy="0">pasa</tspan></text><rect x="517.5" y="188.5" width="199" height="45" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="617" y="215.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="617" dy="0">falla</tspan></text><rect x="719.5" y="188.5" width="199" height="45" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><text x="819" y="215.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="819" dy="0">—</tspan></text><rect x="315.5" y="236.5" width="199" height="45" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="415" y="263.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="415" dy="0">falla</tspan></text><rect x="517.5" y="236.5" width="199" height="45" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><text x="617" y="263.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="617" dy="0">—</tspan></text><rect x="719.5" y="236.5" width="199" height="45" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><text x="819" y="263.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="819" dy="0">—</tspan></text><text x="314" y="309" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="314" dy="0">pasa</tspan></text><rect x="352.16" y="297" width="30.5" height="14" fill="#fbe4de"/><rect x="382.16" y="297" width="30.5" height="14" fill="#f3cdc5"/><rect x="412.16" y="297" width="30.5" height="14" fill="#eab6ac"/><rect x="442.16" y="297" width="30.5" height="14" fill="#e29f93"/><rect x="472.16" y="297" width="30.5" height="14" fill="#d9887a"/><rect x="502.16" y="297" width="30.5" height="14" fill="#d17161"/><rect x="532.16" y="297" width="30.5" height="14" fill="#c85a48"/><rect x="562.16" y="297" width="30.5" height="14" fill="#c0432f"/><text x="600.16" y="309" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="600.16" dy="0">falla</tspan></text><text x="645.86" y="309" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="645.86" dy="0">más oscuro = mayor (resultado)</tspan></text><rect x="10" y="325" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="349.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las comprobaciones se aplican en orden (firma, vigencia, audiencia) y una vez que una falla las siguientes no se evalúan</tspan></text><text x="470" y="366.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">(guion). Cada propiedad del token tiene un caso que la ejercita. Tokens firmados con HMAC-SHA-256 y una clave compartida:</tspan></text><text x="470" y="383.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">no es OAuth ni SPIFFE, y faltan la revocación, la rotación de claves y la firma asimétrica.</tspan></text><text x="470" y="430.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; los recuentos se repiten y los tiempos varían de una ejecución y de un equipo a otro.</tspan></text></svg>
