<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" width="940" height="420" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Clasificación de riesgo por reglas sobre rutas, tamaño y dependencias: ocho de doce cambios</title><desc id="d">Diagrama con ocho de doce cambios agrupados por el nivel de riesgo que les asignan reglas deterministas: en el riesgo bajo la documentación y un cambio de código con su prueba y 40 líneas; en el medio el código sin prueba, el cambio de 400 líneas y el archivo de dependencias; en el alto el workflow de integración continua, la autenticación y la migración.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="420" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Clasificación de riesgo por reglas sobre rutas, tamaño y dependencias: ocho de doce cambios</tspan></text><rect x="14" y="49" width="290" height="220" rx="16" fill="#dff1ee" fill-opacity="0.45" stroke="#087f8c" stroke-width="1.6" stroke-dasharray="8 5"/><text x="28" y="71" font-size="14" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="28" dy="0">Riesgo bajo</tspan></text><rect x="26" y="87" width="266" height="48" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="159" y="114.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="159" dy="0">docs/guia.md</tspan></text><rect x="26" y="145" width="266" height="48" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="159" y="164.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="159" dy="0">src/a.py con su prueba (40</tspan></text><text x="159" y="180.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="159" dy="0">líneas)</tspan></text><rect x="324" y="49" width="290" height="220" rx="16" fill="#f7ebc8" fill-opacity="0.45" stroke="#a8761a" stroke-width="1.6" stroke-dasharray="8 5"/><text x="338" y="71" font-size="14" text-anchor="start" font-weight="700" fill="#4a3209"><tspan x="338" dy="0">Riesgo medio</tspan></text><rect x="336" y="87" width="266" height="48" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="469" y="114.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="469" dy="0">src/a.py sin prueba</tspan></text><rect x="336" y="145" width="266" height="48" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="469" y="172.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="469" dy="0">src/a.py con prueba, 400 líneas</tspan></text><rect x="336" y="203" width="266" height="48" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="469" y="230.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="469" dy="0">requirements.txt (dependencias)</tspan></text><rect x="634" y="49" width="290" height="220" rx="16" fill="#fbe4de" fill-opacity="0.45" stroke="#c0432f" stroke-width="1.6" stroke-dasharray="8 5"/><text x="648" y="71" font-size="14" text-anchor="start" font-weight="700" fill="#5c1f14"><tspan x="648" dy="0">Riesgo alto</tspan></text><rect x="646" y="87" width="266" height="48" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="779" y="114.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="779" dy="0">.github/workflows/ci.yml</tspan></text><rect x="646" y="145" width="266" height="48" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="779" y="172.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="779" dy="0">auth/login.py con su prueba</tspan></text><rect x="646" y="203" width="266" height="48" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="779" y="230.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="779" dy="0">migrations/0004.sql</tspan></text><text x="14" y="295" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="14" dy="0">Las reglas se leen de arriba abajo por ruta, tamaño y dependencias; el primer nivel que coincide fija el riesgo.</tspan></text><rect x="10" y="313" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="337.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Una regla de rutas es barata, auditable y fácil de eludir: un cambio peligroso en una carpeta que no aparece en la lista es</tspan></text><text x="470" y="354.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de riesgo bajo. Se complementa con revisión humana de las reglas.</tspan></text><text x="470" y="402.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; ninguna cifra viene de un modelo de lenguaje.</tspan></text></svg>
