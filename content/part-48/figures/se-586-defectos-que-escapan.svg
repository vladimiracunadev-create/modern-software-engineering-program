<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 259" width="960" height="259" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Defectos que escapan por cada 1000 cambios según el modo de trabajo (modelo del autor)</title><desc id="d">Gráfico de barras con los defectos que escapan por cada mil cambios: sin controles 89, revisión humana de todo 38 con 271 horas, y compuertas más revisión por riesgo 22 con 201 horas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="259" fill="#ffffff"/><text x="334" y="37" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Sin controles</tspan></text><rect x="344" y="16" width="373.8" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="725.8" y="37" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="725.8" dy="0">89 (0 h)</tspan></text><text x="334" y="83" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Revisión humana de todo</tspan></text><rect x="344" y="62" width="159.6" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="511.6" y="83" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="511.6" dy="0">38 (271 h)</tspan></text><text x="334" y="129" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Compuertas + revisión por riesgo</tspan></text><rect x="344" y="108" width="92.4" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="444.4" y="129" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="444.4" dy="0">22 (201 h)</tspan></text><rect x="10" y="156" width="940" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="180.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Modelo paramétrico: tres niveles de riesgo con probabilidades de defecto del autor y compuertas que atrapan 60 % de los</tspan></text><text x="480" y="197.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">defectos. Sirve para razonar la forma del compromiso; ninguna cifra es una tasa real.</tspan></text><text x="480" y="245.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Simulación con semilla fija (parámetros del autor) ejecutada en Windows 11 con CPython 3.12.9; no mide ningún modelo real.</tspan></text></svg>
