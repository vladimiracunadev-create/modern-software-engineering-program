<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 344" width="940" height="344" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Servicios alcanzables con una credencial robada de un servicio al azar entre 200, según la arquitectura</title><desc id="d">Barras horizontales con los servicios alcanzables con una credencial robada de un servicio al azar entre 200: red plana tras el perímetro 200, segmentada en 5 partes 40 y con credencial limitada por destinatario a 3 dependencias 3.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="344" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Servicios alcanzables con una credencial robada de un servicio al azar entre 200, según la arquitectura</tspan></text><line x1="294" y1="49" x2="294" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="163" x2="294" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">0</tspan></text><line x1="443.455" y1="49" x2="443.455" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="443.455" y1="163" x2="443.455" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="443.455" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="443.455" dy="0">50</tspan></text><line x1="592.91" y1="49" x2="592.91" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="592.91" y1="163" x2="592.91" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="592.91" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592.91" dy="0">100</tspan></text><line x1="742.365" y1="49" x2="742.365" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="742.365" y1="163" x2="742.365" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="742.365" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742.365" dy="0">150</tspan></text><line x1="891.82" y1="49" x2="891.82" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="891.82" y1="163" x2="891.82" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="891.82" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="891.82" dy="0">200</tspan></text><line x1="294" y1="163" x2="891.82" y2="163" stroke="#5b7280" stroke-width="1.6"/><text x="284" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Red plana tras el perímetro</tspan></text><text x="284" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Segmentada en 5 partes</tspan></text><text x="284" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Credencial limitada a 3 dependencias</tspan></text><rect x="294" y="55" width="597.82" height="26" rx="3" fill="#c0432f"/><text x="898.82" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="898.82" dy="0">200</tspan></text><rect x="294" y="93" width="119.564" height="26" rx="3" fill="#c0432f"/><text x="420.564" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="420.564" dy="0">40</tspan></text><rect x="294" y="131" width="8.9673" height="26" rx="3" fill="#c0432f"/><text x="309.967" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="309.967" dy="0">3</tspan></text><text x="592.91" y="207" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="592.91" dy="0">Servicios alcanzables de 200</tspan></text><rect x="10" y="221" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="245.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Segmentar divide el radio de daño por el número de segmentos y limitar la credencial por destinatario lo reduce al grado de</tspan></text><text x="470" y="262.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">dependencia del servicio comprometido. Valores del modelo con supuestos del autor (200 servicios, 5 segmentos, 3</tspan></text><text x="470" y="279.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">dependencias por servicio); en un sistema real el grafo es heterogéneo y los servicios muy conectados alcanzan más.</tspan></text><text x="470" y="326.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 48; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
