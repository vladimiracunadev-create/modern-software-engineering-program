<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 213" width="960" height="213" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagnósticos correctos de 30 con cada versión de la traza</title><desc id="d">Gráfico de barras con los diagnósticos correctos de treinta casos: la traza mínima acierta 24 y la traza enriquecida con herramientas ofrecidas, contexto visible y observación acierta 30.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="213" fill="#ffffff"/><text x="334" y="37" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Traza mínima</tspan></text><rect x="344" y="16" width="672" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="1024" y="37" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="1024" dy="0">24 de 30</tspan></text><text x="334" y="83" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Traza enriquecida</tspan></text><rect x="344" y="62" width="840" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="1192" y="83" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="1192" dy="0">30 de 30</tspan></text><rect x="10" y="110" width="940" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="134.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Los 6 casos que falla la traza mínima son un mismo fallo, no seis: se corrige con un solo campo. Un diagnóstico que acierta</tspan></text><text x="480" y="151.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">siempre en un conjunto inyectado no garantiza lo mismo ante fallos que no se inyectaron.</tspan></text><text x="480" y="199.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; ninguna cifra viene de un modelo de lenguaje.</tspan></text></svg>
