<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 529" width="960" height="529" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Árbol de decisión del taller: de la capacidad de la carga a la frontera, con la batería hostil al final</title><desc id="d">Diagrama con tres filas de cajas: una pregunta de capacidad sobre si la carga se puede compilar a WebAssembly, una pregunta de amenaza sobre si el código es de un inquilino o de varios y la elección entre módulo, proceso con límites y frontera reforzada; una nota indica que la batería hostil se repite tras cada cambio.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="529" fill="#ffffff"/><rect x="10" y="14" width="284" height="104" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="152" y="53" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="152" dy="0">Pregunta 1: capacidad</tspan></text><text x="152" y="69.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="152" dy="0">¿Se puede compilar a Wasm y no</tspan></text><text x="152" y="86.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="152" dy="0">necesita bibliotecas del sistema?</tspan></text><rect x="10" y="158" width="284" height="104" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="152" y="197" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="152" dy="0">Pregunta 2: amenaza</tspan></text><text x="152" y="213.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="152" dy="0">¿Código de un inquilino o de varios,</tspan></text><text x="152" y="230.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="152" dy="0">conocido o arbitrario?</tspan></text><polyline points="152,118 152,138 152,138 152,158" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="302" width="284" height="104" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="152" y="341" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="152" dy="0">Módulo de Wasm</tspan></text><text x="152" y="357.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="152" dy="0">Combustible, memoria acotada y cero</tspan></text><text x="152" y="374.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="152" dy="0">importaciones</tspan></text><rect x="338" y="302" width="284" height="104" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="480" y="341" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">Proceso con límites</tspan></text><text x="480" y="357.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">Entorno vacío, directorio propio y</tspan></text><text x="480" y="374.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">tiempo máximo</tspan></text><polyline points="294,354 338,354" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="666" y="302" width="284" height="104" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="808" y="341" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="808" dy="0">Frontera reforzada</tspan></text><text x="808" y="357.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="808" dy="0">Contenedor, núcleo de aplicación o</tspan></text><text x="808" y="374.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="808" dy="0">microVM alrededor</tspan></text><polyline points="622,354 666,354" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="152,262 152,282 152,282 152,302" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="420" width="940" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="444.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Cada hoja pasa por la misma batería de seis comportamientos y la decisión se confirma con cada cambio de configuración, no una</tspan></text><text x="480" y="461.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">sola vez. El árbol tiene tres hojas porque el taller probó tres candidatos; con contenedores y microVM tendría más y sus</tspan></text><text x="480" y="478.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">costos habría que medirlos.</tspan></text><text x="480" y="519.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Diagrama de decisión del taller; no es una medición.</tspan></text></svg>
