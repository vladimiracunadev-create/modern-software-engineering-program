<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 213" width="960" height="213" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Escenarios adversos que el harness gobernado contiene, de cuatro</title><desc id="d">Gráfico de barras con los escenarios adversos contenidos de cuatro: sin controles 1, que es el intento repetido que solo acota el tope, y harness gobernado 4.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="213" fill="#ffffff"/><text x="254" y="37" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="254" dy="0">Sin controles</tspan></text><rect x="264" y="16" width="30" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="302" y="37" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="302" dy="0">1 de 4</tspan></text><text x="254" y="83" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="254" dy="0">Gobernado</tspan></text><rect x="264" y="62" width="120" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="392" y="83" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="392" dy="0">4 de 4</tspan></text><rect x="10" y="110" width="940" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="134.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Sin controles, solo el tope de 12 pasos limitó un escenario. Contener los cuatro no prueba que el harness sea seguro: prueba</tspan></text><text x="480" y="151.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">que estos cuatro controles funcionan contra estos cuatro intentos.</tspan></text><text x="480" y="199.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; ninguna cifra viene de un modelo de lenguaje.</tspan></text></svg>
