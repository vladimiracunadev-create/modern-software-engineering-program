<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 275" width="1000" height="275" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tokens medios por solicitud y solicitudes resueltas según la arquitectura de Avisos</title><desc id="d">Barras con los tokens medios por solicitud de Avisos: el workflow para todo usa 774 tokens y resuelve el 85,0 por ciento, el agente para todo usa 1 862 tokens y resuelve el 97,5 por ciento, y el híbrido que usa el agente solo en las incidencias usa 1 421 tokens y resuelve el 99,0 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="275" fill="#ffffff"/><text x="334" y="37" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Workflow para todo</tspan></text><rect x="344" y="16" width="131.58" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="483.58" y="37" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="483.58" dy="0">774 tokens; 85,0 % resueltas</tspan></text><text x="334" y="83" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Agente para todo</tspan></text><rect x="344" y="62" width="316.54" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="668.54" y="83" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="668.54" dy="0">1 862 tokens; 97,5 % resueltas</tspan></text><text x="334" y="129" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Híbrido: agente solo en incidencias</tspan></text><rect x="344" y="108" width="241.57" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="593.57" y="129" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="593.57" dy="0">1 421 tokens; 99,0 % resueltas</tspan></text><rect x="10" y="156" width="980" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="500" y="180.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">Cómo leer la figura: la barra mide el costo y la etiqueta, el resultado. Dónde deja de valer: los tokens son una aproximación de un</tspan></text><text x="500" y="197.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">token por cuatro caracteres y cada llamada del agente vuelve a leer todo el historial; con otra política de caché el cociente</tspan></text><text x="500" y="214.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">cambia.</tspan></text><text x="500" y="261.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Experimento propio con la biblioteca estándar; el modelo es sintético con semilla fija y no se invocó ningún modelo de lenguaje.</tspan></text></svg>
