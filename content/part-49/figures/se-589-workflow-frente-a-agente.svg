<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 484" width="940" height="484" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Workflow fijo frente a agente en tres tipos de solicitud de Avisos: llamadas, solicitudes resueltas y tokens</title><desc id="d">Barras agrupadas con el porcentaje de solicitudes resueltas por tipo de solicitud de Avisos: en la consulta de plazo el workflow resuelve el 100,0 por ciento y el agente el 99,0 con 1,2 veces los tokens; en silenciar un curso 100,0 y 96,7 con 2,8 veces; en la incidencia abierta el workflow no resuelve ninguna y se escala a una persona, mientras el agente resuelve el 93,1 con 7,0 veces los tokens.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="484" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Workflow fijo frente a agente en tres tipos de solicitud de Avisos: llamadas, solicitudes resueltas y tokens</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Workflow fijo</tspan></text><rect x="162.02" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="182.02" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="182.02" dy="0">Agente</tspan></text><line x1="384" y1="77" x2="384" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="384" y1="269" x2="384" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="384" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="384" dy="0">0</tspan></text><line x1="506.925" y1="77" x2="506.925" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="506.925" y1="269" x2="506.925" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="506.925" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="506.925" dy="0">25</tspan></text><line x1="629.85" y1="77" x2="629.85" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="629.85" y1="269" x2="629.85" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="629.85" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="629.85" dy="0">50</tspan></text><line x1="752.775" y1="77" x2="752.775" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="752.775" y1="269" x2="752.775" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="752.775" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752.775" dy="0">75</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="269" x2="875.7" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">100</tspan></text><line x1="384" y1="269" x2="875.7" y2="269" stroke="#5b7280" stroke-width="1.6"/><text x="374" y="105" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="374" dy="0">Consulta de plazo (60 %) · 2,0 llamadas frente a</tspan></text><text x="374" y="122" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="374" dy="0">2,1 · agente ×1,2 tokens</tspan></text><text x="374" y="169" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="374" dy="0">Silenciar un curso (25 %) · 2,0 frente a 4,2</tspan></text><text x="374" y="186" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="374" dy="0">llamadas · ×2,8 tokens</tspan></text><text x="374" y="233" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="374" dy="0">Incidencia abierta, de 3 a 8 pasos (15 %) · 2,0</tspan></text><text x="374" y="250" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="374" dy="0">frente a 6,8 llamadas · ×7,0 tokens</tspan></text><rect x="384" y="83" width="491.7" height="24.5" rx="3" fill="#087f8c"/><text x="882.7" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100,0</tspan></text><rect x="384" y="110.5" width="486.783" height="24.5" rx="3" fill="#c0432f"/><text x="877.783" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="877.783" dy="0">99,0</tspan></text><rect x="384" y="147" width="491.7" height="24.5" rx="3" fill="#087f8c"/><text x="882.7" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100,0</tspan></text><rect x="384" y="174.5" width="475.474" height="24.5" rx="3" fill="#c0432f"/><text x="866.474" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="866.474" dy="0">96,7</tspan></text><rect x="384" y="211" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="393" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="393" dy="0">0,0</tspan></text><rect x="384" y="238.5" width="457.773" height="24.5" rx="3" fill="#c0432f"/><text x="848.773" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="848.773" dy="0">93,1</tspan></text><text x="629.85" y="313" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="629.85" dy="0">% de solicitudes resueltas</tspan></text><rect x="10" y="327" width="920" height="109.2" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="351.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cada grupo es un tipo de solicitud con las llamadas y los tokens en la etiqueta; el agente (p95 de 3, 5 y 10 llamadas)</tspan></text><text x="470" y="368.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cuesta más cuanto más fijo era el camino, y el workflow no resuelve las incidencias y las escala a una persona. Cómo leer</tspan></text><text x="470" y="385.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">la figura: cada fila es un tipo de solicitud y el agente cuesta más cuanto más fijo era el camino. Dónde deja de valer: el</tspan></text><text x="470" y="401.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">modelo es sintético, con 8 % de pasos equivocados y 1 % de pasos irreversibles por llamada, y 2 000 solicitudes con semilla</tspan></text><text x="470" y="418.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">42; la tasa de errores de un modelo real es otra.</tspan></text><text x="470" y="466.2" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Experimento propio con la biblioteca estándar; el modelo es sintético con semilla fija y no se invocó ningún modelo de lenguaje.</tspan></text></svg>
