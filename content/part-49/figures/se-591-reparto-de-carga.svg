<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 550" width="940" height="550" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tiempo de reloj de un repaso de entregas con un agente, con reparto fijo y con orquestador</title><desc id="d">Barras agrupadas con el tiempo de reloj en unidades de trabajo de un repaso de entregas: con cursos de tamaño parecido un solo agente tarda 57,2, un reparto fijo entre tres trabajadores 23,1 y un orquestador 20,8; con cursos de tamaño de cola larga 155,4, 87,1 y 68,5.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="550" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Tiempo de reloj de un repaso de entregas con un agente, con reparto fijo y con orquestador</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Un solo agente</tspan></text><rect x="169.56" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="189.56" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="189.56" dy="0">Reparto fijo entre 3</tspan></text><rect x="368.36" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="388.36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="388.36" dy="0">Orquestador</tspan></text><line x1="78.62" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="375" x2="78.62" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="305" x2="920" y2="305" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="305" x2="78.62" y2="305" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="309.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">50</tspan></text><line x1="78.62" y1="235" x2="920" y2="235" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="235" x2="78.62" y2="235" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="239.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="165" x2="920" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="165" x2="78.62" y2="165" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="169.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">150</tspan></text><line x1="78.62" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="95" x2="78.62" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">200</tspan></text><line x1="78.62" y1="95" x2="78.62" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">unidades de trabajo (tiempo de reloj)</text><rect x="120.689" y="294.92" width="109.517" height="80.08" rx="3" fill="#c0432f"/><text x="175.448" y="288.92" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="175.448" dy="0">57,2</tspan></text><rect x="234.206" y="342.66" width="109.517" height="32.34" rx="3" fill="#946512"/><text x="288.965" y="336.66" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="288.965" dy="0">23,1</tspan></text><rect x="347.724" y="345.88" width="109.517" height="29.12" rx="3" fill="#087f8c"/><text x="402.482" y="339.88" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="402.482" dy="0">20,8</tspan></text><text x="288.965" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="288.965" dy="0">Cursos de tamaño parecido</tspan></text><rect x="541.379" y="157.44" width="109.517" height="217.56" rx="3" fill="#c0432f"/><text x="596.138" y="151.44" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="596.138" dy="0">155,4</tspan></text><rect x="654.896" y="253.06" width="109.517" height="121.94" rx="3" fill="#946512"/><text x="709.655" y="247.06" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="709.655" dy="0">87,1</tspan></text><rect x="768.414" y="279.1" width="109.517" height="95.9" rx="3" fill="#087f8c"/><text x="823.172" y="273.1" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="823.172" dy="0">68,5</tspan></text><text x="709.655" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="709.655" dy="0">Cursos con tamaño de cola larga</tspan></text><rect x="10" y="427" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Cómo leer la figura: la ventaja del orquestador crece con el desequilibrio, de 10 % a 21 % menos que el reparto fijo; la</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">coordinación añade dos llamadas que no están en el gráfico. Dónde deja de valer: 500 repasos sintéticos con semilla 3 y</tspan></text><text x="470" y="485.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">trabajo medido en unidades, no en segundos.</tspan></text><text x="470" y="532.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Experimento propio con la biblioteca estándar; el modelo es sintético con semilla fija y no se invocó ningún modelo de lenguaje.</tspan></text></svg>
