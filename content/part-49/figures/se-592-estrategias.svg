<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 604" width="940" height="604" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro estrategias en un entorno de avisos con contactos que faltan o estudiantes que se cambiaron de curso</title><desc id="d">Líneas con el éxito de cuatro estrategias según la tasa de sorpresas del entorno: sin sorpresas ReAct resuelve el 90,6 por ciento y las otras tres el 100; con 15 por ciento ReAct 88,2, el plan solo 54,2, la replanificación 94,9 y la reflexión 93,7; con 35 por ciento ReAct 89,0, el plan solo 21,1, la replanificación 88,2 y la reflexión 87,6.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="604" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuatro estrategias en un entorno de avisos con contactos que faltan o estudiantes que se cambiaron de curso</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Plan</tspan></text><rect x="94.16" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="114.16" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="114.16" dy="0">Plan con replanificación</tspan></text><polygon points="329.12,44.1 335.72,56.4 322.52,56.4" fill="#946512" stroke="#946512" stroke-width="2"/><text x="343.12" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="343.12" dy="0">Plan con reflexión</tspan></text><polygon points="512.84,43.5 520.34,51 512.84,58.5 505.34,51" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="526.84" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="526.84" dy="0">ReAct</tspan></text><line x1="78.62" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="387" x2="78.62" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="327" x2="910" y2="327" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="327" x2="78.62" y2="327" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="331.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">20</tspan></text><line x1="78.62" y1="267" x2="910" y2="267" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="267" x2="78.62" y2="267" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="271.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">40</tspan></text><line x1="78.62" y1="207" x2="910" y2="207" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="207" x2="78.62" y2="207" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="211.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">60</tspan></text><line x1="78.62" y1="147" x2="910" y2="147" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="147" x2="78.62" y2="147" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="151.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">80</tspan></text><line x1="78.62" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="87" x2="78.62" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="87" x2="78.62" y2="387" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="87" x2="96.62" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="387" x2="96.62" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">0 %</tspan></text><line x1="437.497" y1="87" x2="437.497" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="437.497" y1="387" x2="437.497" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="437.497" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437.497" dy="0">15 %</tspan></text><line x1="892" y1="87" x2="892" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="387" x2="892" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">35 %</tspan></text><line x1="78.62" y1="387" x2="910" y2="387" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 237)">Solicitudes resueltas (%)</text><text x="494.31" y="433" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Tasa de sorpresas del entorno (%)</tspan></text><polyline points="96.62,87 437.497,224.4 892,323.7" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="96.62" cy="87" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="96.62" y="111" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">100,0</tspan></text><circle cx="437.497" cy="224.4" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="437.497" y="248.4" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="437.497" dy="0">54,2</tspan></text><circle cx="892" cy="323.7" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="347.7" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">21,1</tspan></text><polyline points="96.62,87 437.497,102.3 892,122.4" fill="none" stroke="#087f8c" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="91.12" y="81.5" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><rect x="431.997" y="96.8" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><rect x="886.5" y="116.9" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polyline points="96.62,87 437.497,105.9 892,124.2" fill="none" stroke="#946512" stroke-width="2.4"/><polygon points="96.62,80.675 102.67,91.95 90.57,91.95" fill="#946512" stroke="#946512" stroke-width="2"/><polygon points="437.497,99.575 443.547,110.85 431.447,110.85" fill="#946512" stroke="#946512" stroke-width="2"/><polygon points="892,117.875 898.05,129.15 885.95,129.15" fill="#946512" stroke="#946512" stroke-width="2"/><polyline points="96.62,115.2 437.497,122.4 892,120" fill="none" stroke="#102a43" stroke-width="2.4" stroke-dasharray="7 4"/><polygon points="96.62,108.325 103.495,115.2 96.62,122.075 89.745,115.2" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="96.62" y="139.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">90,6</tspan></text><polygon points="437.497,115.525 444.372,122.4 437.497,129.275 430.622,122.4" fill="#102a43" stroke="#102a43" stroke-width="2"/><polygon points="892,113.125 898.875,120 892,126.875 885.125,120" fill="#102a43" stroke="#102a43" stroke-width="2"/><rect x="10" y="447" width="920" height="109.2" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Éxito con 15 y 35 % de sorpresas: ReAct 88,2 y 89,0; replanificación 94,9 y 88,2; reflexión 93,7 y 87,6. Llamadas medias</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">con 0, 15 y 35 % de sorpresas: ReAct 10,4, 11,1 y 11,7; plan 1,0 en los tres; replanificación 1,0, 1,6 y 2,3; reflexión</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">1,0, 2,5 y 3,9. Cómo leer la figura: ReAct paga más llamadas pero casi no depende de las sorpresas; el plan solo se hunde.</tspan></text><text x="470" y="521.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Dónde deja de valer: 3 000 episodios con semilla 8, 5 % de decisiones equivocadas y 1 % de fatales por llamada para ReAct;</tspan></text><text x="470" y="538.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">las probabilidades de replanificar y reflexionar con éxito (0,90 y 0,85) son supuestos del autor.</tspan></text><text x="470" y="586.2" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Experimento propio con la biblioteca estándar; el modelo es sintético con semilla fija y no se invocó ningún modelo de lenguaje.</tspan></text></svg>
