<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 648" width="940" height="648" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tokens de memoria que se envían al preguntar, aciertos y fallo típico de cada estrategia</title><desc id="d">Puntos con los tokens de memoria enviados al preguntar y el porcentaje de acierto: contexto completo con presupuesto 1 973 tokens y 67,1 por ciento, ventana de 20 turnos 1 041 y 41,5, resumen con pérdidas 150 y 74,8, almacén sin versión 80 y 40,8 y almacén con versión 80 y 95,2; el almacén con versión es el punto de menor costo y mayor acierto.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="648" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Tokens de memoria que se envían al preguntar, aciertos y fallo típico de cada estrategia</tspan></text><circle cx="22" cy="51" r="6" fill="#946512" stroke="#946512" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Contexto completo con presupuesto</tspan></text><rect x="312.82" y="45" width="12" height="12" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="332.82" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="332.82" dy="0">Ventana de 20 turnos</tspan></text><polygon points="517.62,44.1 524.22,56.4 511.02,56.4" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="531.62" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="531.62" dy="0">Resumen con pérdidas</tspan></text><polygon points="716.42,43.5 723.92,51 716.42,58.5 708.92,51" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><text x="730.42" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="730.42" dy="0">Almacén sin versión</tspan></text><path d="M16,69 L28,81 M28,69 L16,81" stroke="#087f8c" stroke-width="2.4" fill="none"/><text x="36" y="80" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Almacén con versión</tspan></text><line x1="78.62" y1="431" x2="910" y2="431" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="431" x2="78.62" y2="431" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="435.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="367" x2="910" y2="367" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="367" x2="78.62" y2="367" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="371.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">20</tspan></text><line x1="78.62" y1="303" x2="910" y2="303" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="303" x2="78.62" y2="303" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="307.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">40</tspan></text><line x1="78.62" y1="239" x2="910" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="239" x2="78.62" y2="239" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="243.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">60</tspan></text><line x1="78.62" y1="175" x2="910" y2="175" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="175" x2="78.62" y2="175" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="179.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">80</tspan></text><line x1="78.62" y1="111" x2="910" y2="111" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="111" x2="78.62" y2="111" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="115.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="111" x2="78.62" y2="431" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="111" x2="96.62" y2="431" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="431" x2="96.62" y2="436" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="452" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">80</tspan></text><line x1="252.607" y1="111" x2="252.607" y2="431" stroke="#d5dde1" stroke-width="1"/><line x1="252.607" y1="431" x2="252.607" y2="436" stroke="#5b7280" stroke-width="1.4"/><text x="252.607" y="452" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="252.607" dy="0">150</tspan></text><line x1="733.342" y1="111" x2="733.342" y2="431" stroke="#d5dde1" stroke-width="1"/><line x1="733.342" y1="431" x2="733.342" y2="436" stroke="#5b7280" stroke-width="1.4"/><text x="733.342" y="452" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="733.342" dy="0">1 041</tspan></text><line x1="892" y1="111" x2="892" y2="431" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="431" x2="892" y2="436" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="452" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">1 973</tspan></text><line x1="78.62" y1="431" x2="910" y2="431" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="271" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 271)">Hechos vigentes recuperados (%)</text><text x="494.31" y="477" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Tokens de memoria enviados al preguntar (escala logarítmica)</tspan></text><circle cx="892" cy="216.28" r="5.5" fill="#946512" stroke="#946512" stroke-width="2"/><text x="882" y="220.78" font-size="13" text-anchor="end" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="882" dy="0">67,1 %</tspan></text><rect x="727.842" y="292.7" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="743.342" y="302.7" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="743.342" dy="0">41,5 %</tspan></text><polygon points="252.607,185.315 258.657,196.59 246.557,196.59" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="262.607" y="196.14" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="262.607" dy="0">74,8 %</tspan></text><polygon points="96.62,293.565 103.495,300.44 96.62,307.315 89.745,300.44" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><text x="106.62" y="304.94" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="106.62" dy="0">40,8 %</tspan></text><path d="M91.12,120.86 L102.12,131.86 M102.12,120.86 L91.12,131.86" stroke="#087f8c" stroke-width="2.4" fill="none"/><text x="106.62" y="130.86" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="106.62" dy="0">95,2 %</tspan></text><rect x="10" y="491" width="920" height="109.2" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="515.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Fallo típico: el contexto completo pierde lo más antiguo sin aviso, la ventana olvida todo lo anterior, el resumen deja el</tspan></text><text x="470" y="532.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">valor viejo si un cambio no se resume, el almacén sin versión devuelve el primer valor, ya obsoleto, y el almacén con</tspan></text><text x="470" y="549.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">versión falla si el extractor no detecta el hecho. Cómo leer la figura: menos tokens no significa menos aciertos; una</tspan></text><text x="470" y="565.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">memoria externa bien versionada gasta una fracción y acierta más. Dónde deja de valer: el costo de extraer, escribir y</tspan></text><text x="470" y="582.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">consultar el almacén no está en los tokens del gráfico.</tspan></text><text x="470" y="630.2" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Experimento propio con la biblioteca estándar; el modelo es sintético con semilla fija y no se invocó ningún modelo de lenguaje.</tspan></text></svg>
