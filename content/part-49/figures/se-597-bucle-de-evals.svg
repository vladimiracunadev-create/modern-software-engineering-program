<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 309" width="960" height="309" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Bucle de evaluación y operación de un sistema con LLM</title><desc id="d">Diagrama en dos filas. Primero se reúnen casos reales, difíciles y con etiqueta, se ejecutan con traza de cada tramo y se califican con código, una persona o un juez calibrado. Después se comparan versiones con intervalo y pareando casos, una puerta con umbral y margen decididos antes decide la publicación y los fallos del tráfico real pasan a ser casos nuevos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="309" fill="#ffffff"/><rect x="10" y="14" width="284" height="84" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="152" y="51.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="152" dy="0">Casos: reales, difíciles y con</tspan></text><text x="152" y="67.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="152" dy="0">etiqueta</tspan></text><rect x="338" y="14" width="284" height="84" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="480" y="59.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">Ejecutar con traza de cada tramo</tspan></text><polyline points="294,56 338,56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="666" y="14" width="284" height="84" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="808" y="51.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="808" dy="0">Calificar: código, persona o juez</tspan></text><text x="808" y="67.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="808" dy="0">calibrado</tspan></text><polyline points="622,56 666,56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="138" width="284" height="84" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="152" y="175.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="152" dy="0">Comparar versiones con intervalo y</tspan></text><text x="152" y="191.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="152" dy="0">pareando casos</tspan></text><rect x="338" y="138" width="284" height="84" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="175.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Puerta: umbral y margen decididos</tspan></text><text x="480" y="191.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">antes</tspan></text><polyline points="294,180 338,180" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="666" y="138" width="284" height="84" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="808" y="175.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="808" dy="0">Tráfico real: fallos nuevos pasan a</tspan></text><text x="808" y="191.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="808" dy="0">ser casos</tspan></text><polyline points="622,180 666,180" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="808,98 808,118 152,118 152,138" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="236" width="940" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="260.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Cómo leer la figura: la última caja devuelve al principio y por eso el conjunto de casos crece con la operación. Dónde deja de</tspan></text><text x="480" y="277.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">valer: con datos personales en los casos, guardar trazas exige minimizar y anonimizar.</tspan></text></svg>
