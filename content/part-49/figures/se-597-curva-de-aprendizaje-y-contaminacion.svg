<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 631" width="940" height="631" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Exactitud de un clasificador según los ejemplos de entrenamiento, con evaluación limpia y contaminada</title><desc id="d">Líneas con la exactitud en porcentaje frente al número de ejemplos de entrenamiento, en escala logarítmica. El clasificador de vecino más próximo, que memoriza, marca 56,1, 53,4, 70,8, 77,3, 80,6 y 86,7 con evaluación limpia y 77,6, 76,6, 85,8, 88,9, 89,1 y 93,2 cuando la mitad de los ejemplos de evaluación son copias del entrenamiento; el clasificador bayesiano ingenuo, con evaluación limpia, marca 62,1, 69,1, 88,0, 97,5, 99,2 y 99,7.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="631" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Exactitud de un clasificador según los ejemplos de entrenamiento, con evaluación limpia y contaminada</tspan></text><circle cx="22" cy="51" r="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Vecino más próximo, evaluación limpia</tspan></text><rect x="342.98" y="45" width="12" height="12" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="362.98" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="362.98" dy="0">Vecino más próximo, evaluación con 50 % de copias</tspan></text><polygon points="22,68.1 28.6,80.4 15.4,80.4" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="36" y="80" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Bayesiano ingenuo, evaluación limpia</tspan></text><line x1="78.62" y1="431" x2="910" y2="431" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="431" x2="78.62" y2="431" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="435.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">50</tspan></text><line x1="78.62" y1="367" x2="910" y2="367" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="367" x2="78.62" y2="367" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="371.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">60</tspan></text><line x1="78.62" y1="303" x2="910" y2="303" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="303" x2="78.62" y2="303" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="307.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">70</tspan></text><line x1="78.62" y1="239" x2="910" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="239" x2="78.62" y2="239" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="243.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">80</tspan></text><line x1="78.62" y1="175" x2="910" y2="175" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="175" x2="78.62" y2="175" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="179.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">90</tspan></text><line x1="78.62" y1="111" x2="910" y2="111" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="111" x2="78.62" y2="111" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="115.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="111" x2="78.62" y2="431" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="111" x2="96.62" y2="431" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="431" x2="96.62" y2="436" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="452" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">10</tspan></text><line x1="249.819" y1="111" x2="249.819" y2="431" stroke="#d5dde1" stroke-width="1"/><line x1="249.819" y1="431" x2="249.819" y2="436" stroke="#5b7280" stroke-width="1.4"/><text x="249.819" y="452" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="249.819" dy="0">30</tspan></text><line x1="417.71" y1="111" x2="417.71" y2="431" stroke="#d5dde1" stroke-width="1"/><line x1="417.71" y1="431" x2="417.71" y2="436" stroke="#5b7280" stroke-width="1.4"/><text x="417.71" y="452" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="417.71" dy="0">100</tspan></text><line x1="570.91" y1="111" x2="570.91" y2="431" stroke="#d5dde1" stroke-width="1"/><line x1="570.91" y1="431" x2="570.91" y2="436" stroke="#5b7280" stroke-width="1.4"/><text x="570.91" y="452" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="570.91" dy="0">300</tspan></text><line x1="738.801" y1="111" x2="738.801" y2="431" stroke="#d5dde1" stroke-width="1"/><line x1="738.801" y1="431" x2="738.801" y2="436" stroke="#5b7280" stroke-width="1.4"/><text x="738.801" y="452" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="738.801" dy="0">1 000</tspan></text><line x1="892" y1="111" x2="892" y2="431" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="431" x2="892" y2="436" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="452" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">3 000</tspan></text><line x1="78.62" y1="431" x2="910" y2="431" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="271" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 271)">Exactitud (%)</text><text x="494.31" y="477" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Ejemplos de entrenamiento (escala logarítmica)</tspan></text><polyline points="96.62,391.96 249.819,409.24 417.71,297.88 570.91,256.28 738.801,235.16 892,196.12" fill="none" stroke="#087f8c" stroke-width="2.4"/><circle cx="96.62" cy="391.96" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><circle cx="249.819" cy="409.24" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><circle cx="417.71" cy="297.88" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><circle cx="570.91" cy="256.28" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><circle cx="738.801" cy="235.16" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><circle cx="892" cy="196.12" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polyline points="96.62,254.36 249.819,260.76 417.71,201.88 570.91,182.04 738.801,180.76 892,154.52" fill="none" stroke="#c0432f" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="91.12" y="248.86" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><rect x="244.319" y="255.26" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><rect x="412.21" y="196.38" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><rect x="565.41" y="176.54" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><rect x="733.301" y="175.26" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><rect x="886.5" y="149.02" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><polyline points="96.62,353.56 249.819,308.76 417.71,187.8 570.91,127 738.801,116.12 892,112.92" fill="none" stroke="#102a43" stroke-width="2.4"/><polygon points="96.62,347.235 102.67,358.51 90.57,358.51" fill="#102a43" stroke="#102a43" stroke-width="2"/><polygon points="249.819,302.435 255.869,313.71 243.769,313.71" fill="#102a43" stroke="#102a43" stroke-width="2"/><polygon points="417.71,181.475 423.76,192.75 411.66,192.75" fill="#102a43" stroke="#102a43" stroke-width="2"/><polygon points="570.91,120.675 576.96,131.95 564.86,131.95" fill="#102a43" stroke="#102a43" stroke-width="2"/><polygon points="738.801,109.795 744.851,121.07 732.751,121.07" fill="#102a43" stroke="#102a43" stroke-width="2"/><polygon points="892,106.595 898.05,117.87 885.95,117.87" fill="#102a43" stroke="#102a43" stroke-width="2"/><rect x="10" y="491" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="515.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La contaminación suma al modelo que memoriza entre 6,5 y 23,2 puntos que no tiene (21,5 con 10 ejemplos, 23,2 con 30 y 6,5</tspan></text><text x="470" y="532.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">con 3 000) y no mejora a ningún otro modelo: la medida deja de decir qué ocurrirá con ejemplos nuevos. La curva limpia es</tspan></text><text x="470" y="549.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">la que decide cuántos ejemplos conviene reunir, y aquí otro modelo con mejor sesgo para la tarea supera con 100 ejemplos al</tspan></text><text x="470" y="565.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">que memoriza con 3 000.</tspan></text><text x="470" y="613.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija (scripts/experiments_part49_ext.py); un clasificador pequeño, no un modelo de lenguaje.</tspan></text></svg>
