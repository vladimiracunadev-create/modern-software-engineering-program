<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 587" width="940" height="587" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Costo relativo de un bucle de N pasos con y sin caché del prefijo estable</title><desc id="d">Líneas con el costo relativo de un bucle según los pasos: sin caché sube de 3 750 con un paso a 12 450, 22 750 y 55 500 con 3, 5 y 10 pasos; con caché de 4 500 a 7 440, 10 540 y 18 990, de modo que cuesta 20 por ciento más con un paso y 40, 54 y 66 por ciento menos con 3, 5 y 10.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="587" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Costo relativo de un bucle de N pasos con y sin caché del prefijo estable</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Sin caché</tspan></text><rect x="131.86" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="151.86" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="151.86" dy="0">Con caché</tspan></text><line x1="101.24" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="387" x2="101.24" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">0</tspan></text><line x1="101.24" y1="287" x2="910" y2="287" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="287" x2="101.24" y2="287" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="291.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">20 000</tspan></text><line x1="101.24" y1="187" x2="910" y2="187" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="187" x2="101.24" y2="187" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="191.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">40 000</tspan></text><line x1="101.24" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="87" x2="101.24" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">60 000</tspan></text><line x1="101.24" y1="87" x2="101.24" y2="387" stroke="#5b7280" stroke-width="1.6"/><line x1="119.24" y1="87" x2="119.24" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="119.24" y1="387" x2="119.24" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="119.24" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="119.24" dy="0">1</tspan></text><line x1="290.964" y1="87" x2="290.964" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="290.964" y1="387" x2="290.964" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="290.964" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="290.964" dy="0">3</tspan></text><line x1="462.689" y1="87" x2="462.689" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="462.689" y1="387" x2="462.689" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="462.689" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462.689" dy="0">5</tspan></text><line x1="892" y1="87" x2="892" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="387" x2="892" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">10</tspan></text><line x1="101.24" y1="387" x2="910" y2="387" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 237)">Costo relativo (unidades de la clase)</text><text x="505.62" y="433" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="505.62" dy="0">Pasos del bucle</tspan></text><polyline points="119.24,368.25 290.964,324.75 462.689,273.25 892,109.5" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="119.24" cy="368.25" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="119.24" y="357.25" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="119.24" dy="0">3 750</tspan></text><circle cx="290.964" cy="324.75" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="290.964" y="313.75" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="290.964" dy="0">12 450</tspan></text><circle cx="462.689" cy="273.25" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="462.689" y="262.25" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="462.689" dy="0">22 750</tspan></text><circle cx="892" cy="109.5" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">55 500</tspan></text><polyline points="119.24,364.5 290.964,349.8 462.689,334.3 892,292.05" fill="none" stroke="#087f8c" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="113.74" y="359" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="129.24" y="369" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="129.24" dy="0">4 500</tspan></text><rect x="285.464" y="344.3" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="290.964" y="373.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="290.964" dy="0">7 440</tspan></text><rect x="457.189" y="328.8" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="462.689" y="358.3" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="462.689" dy="0">10 540</tspan></text><rect x="886.5" y="286.55" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="316.05" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">18 990</tspan></text><rect x="10" y="447" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Diferencia con caché: +20 % con 1 paso, −40 % con 3, −54 % con 5 y −66 % con 10. Cómo leer la figura: sin caché cada paso</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">paga de nuevo todo el historial y el costo crece de forma cuadrática; con caché, el primer paso cuesta más y los siguientes</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">mucho menos. Dónde deja de valer: las unidades son de la clase (salida cinco veces la entrada, lectura de caché 0,1 y</tspan></text><text x="470" y="521.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">escritura 1,25), no precios de ningún proveedor.</tspan></text><text x="470" y="569.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo de costo propio con supuestos declarados; no son precios ni se invocó ningún modelo de lenguaje.</tspan></text></svg>
