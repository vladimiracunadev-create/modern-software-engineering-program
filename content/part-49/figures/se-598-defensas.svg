<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 586" width="940" height="586" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ataques exitosos por inyección y envíos legítimos afectados según la defensa, en 4 000 solicitudes sintéticas</title><desc id="d">Barras agrupadas con cuatro defensas: sin defensa el 19,23 por ciento de las solicitudes sufre un ataque exitoso y ningún envío legítimo se afecta; con lista de destinatarios permitidos 3,02 y 0; con confirmación humana 7,42 por ciento de ataques y se retrasa el 25 por ciento de los envíos; sin canal de salida si hay contenido no confiable 0,00 y se bloquea el 49 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="586" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Ataques exitosos por inyección y envíos legítimos afectados según la defensa, en 4 000 solicitudes</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">sintéticas</tspan></text><rect x="16" y="64" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Ataques exitosos</tspan></text><rect x="184.64" y="64" width="12" height="12" rx="2" fill="#946512"/><text x="204.64" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="204.64" dy="0">Envíos legítimos afectados</tspan></text><line x1="71.08" y1="394" x2="920" y2="394" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="394" x2="71.08" y2="394" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="398.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="338" x2="920" y2="338" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="338" x2="71.08" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="342.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="282" x2="920" y2="282" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="282" x2="71.08" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="286.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="226" x2="920" y2="226" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="226" x2="71.08" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="230.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">30</tspan></text><line x1="71.08" y1="170" x2="920" y2="170" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="170" x2="71.08" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="174.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">40</tspan></text><line x1="71.08" y1="114" x2="920" y2="114" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="114" x2="71.08" y2="114" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="118.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">50</tspan></text><line x1="71.08" y1="114" x2="71.08" y2="394" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 254)">% de las solicitudes</text><rect x="92.303" y="286.312" width="82.892" height="107.688" rx="3" fill="#c0432f"/><text x="133.749" y="280.312" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="133.749" dy="0">19,23</tspan></text><rect x="179.195" y="392" width="82.892" height="2" rx="3" fill="#946512"/><text x="220.641" y="386" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="220.641" dy="0">0,00</tspan></text><text x="177.195" y="415" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="177.195" dy="0">Ninguna</tspan></text><rect x="304.533" y="377.088" width="82.892" height="16.912" rx="3" fill="#c0432f"/><text x="345.979" y="371.088" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="345.979" dy="0">3,02</tspan></text><rect x="391.425" y="392" width="82.892" height="2" rx="3" fill="#946512"/><text x="432.871" y="386" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="432.871" dy="0">0,00</tspan></text><text x="389.425" y="415" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="389.425" dy="0">Lista de destinatarios</tspan></text><rect x="516.763" y="352.448" width="82.892" height="41.552" rx="3" fill="#c0432f"/><text x="558.209" y="346.448" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="558.209" dy="0">7,42</tspan></text><rect x="603.655" y="254" width="82.892" height="140" rx="3" fill="#946512"/><text x="645.101" y="248" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="645.101" dy="0">25,00</tspan></text><text x="601.655" y="415" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="601.655" dy="0">Confirmación humana</tspan></text><rect x="728.993" y="392" width="82.892" height="2" rx="3" fill="#c0432f"/><text x="770.439" y="386" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="770.439" dy="0">0,00</tspan></text><rect x="815.885" y="119.6" width="82.892" height="274.4" rx="3" fill="#946512"/><text x="857.331" y="113.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="857.331" dy="0">49,00</tspan></text><text x="813.885" y="415" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="813.885" dy="0">Sin canal de salida</tspan></text><rect x="10" y="446" width="920" height="92.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="470.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Con la confirmación humana el 25 % de los envíos se retrasa y sin canal de salida se bloquea el 49 %. Cómo leer la figura:</tspan></text><text x="470" y="487.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">ninguna defensa es gratuita; la que elimina el ataque elimina también la capacidad que lo hace posible. Dónde deja de</tspan></text><text x="470" y="504.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">valer: el modelo obedece la instrucción inyectada con probabilidad 0,40 y la fatiga humana aprueba el 35 %; ambos son</tspan></text><text x="470" y="520.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">supuestos del autor.</tspan></text><text x="470" y="568.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Experimento propio con la biblioteca estándar; el modelo es sintético con semilla fija y no se invocó ningún modelo de lenguaje.</tspan></text></svg>
