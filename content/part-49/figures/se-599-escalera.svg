<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 309" width="960" height="309" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Escalera de degradación de un sistema con LLM y los disparadores que bajan o suben de nivel</title><desc id="d">Diagrama en dos filas. La escalera baja del agente con presupuesto de pasos al workflow fijo con los mismos permisos, a una plantilla o respuesta guardada y a una cola para una persona con el contexto. Los disparadores son errores, costo, latencia y confianza, y la vuelta al nivel superior ocurre tras sondas correctas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="309" fill="#ffffff"/><rect x="10" y="14" width="284" height="84" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="152" y="59.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="152" dy="0">Agente con presupuesto de pasos</tspan></text><rect x="338" y="14" width="284" height="84" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="480" y="51.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">Workflow fijo con los mismos</tspan></text><text x="480" y="67.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">permisos</tspan></text><polyline points="294,56 338,56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="666" y="14" width="284" height="84" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="808" y="59.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="808" dy="0">Plantilla o respuesta guardada</tspan></text><polyline points="622,56 666,56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="138" width="284" height="84" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="152" y="175.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="152" dy="0">Cola para una persona con el</tspan></text><text x="152" y="191.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="152" dy="0">contexto</tspan></text><rect x="338" y="138" width="284" height="84" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="480" y="175.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="480" dy="0">Disparadores: errores, costo,</tspan></text><text x="480" y="191.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="480" dy="0">latencia, confianza</tspan></text><polyline points="294,180 338,180" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="666" y="138" width="284" height="84" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="808" y="175.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="808" dy="0">Vuelta al nivel superior tras sondas</tspan></text><text x="808" y="191.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="808" dy="0">correctas</tspan></text><polyline points="622,180 666,180" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="808,98 808,118 152,118 152,138" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="236" width="940" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="260.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Cómo leer la figura: cada escalón pierde capacidad y gana previsibilidad. Dónde deja de valer: la escalera exige que cada</tspan></text><text x="480" y="277.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">nivel inferior exista y se pruebe antes del incidente.</tspan></text></svg>
