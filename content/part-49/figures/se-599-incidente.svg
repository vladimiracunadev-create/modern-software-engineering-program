<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 335" width="940" height="335" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mil solicitudes con un incidente del proveedor: política fija frente a degradación a un workflow</title><desc id="d">Barras horizontales con las solicitudes resueltas de mil con un incidente del proveedor: con agente fijo resuelve el 60,4 por ciento con 5,42 llamadas por solicitud y un p95 de 24,9 segundos; con degradación a un workflow resuelve el 70,7 por ciento con 3,67 llamadas, un p95 de 13,7 segundos y 420 solicitudes degradadas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="335" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Mil solicitudes con un incidente del proveedor: política fija frente a degradación a un workflow</tspan></text><line x1="384" y1="49" x2="384" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="384" y1="137" x2="384" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="384" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="384" dy="0">0</tspan></text><line x1="508.94" y1="49" x2="508.94" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="508.94" y1="137" x2="508.94" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="508.94" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="508.94" dy="0">25</tspan></text><line x1="633.88" y1="49" x2="633.88" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="633.88" y1="137" x2="633.88" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="633.88" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="633.88" dy="0">50</tspan></text><line x1="758.82" y1="49" x2="758.82" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="758.82" y1="137" x2="758.82" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="758.82" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="758.82" dy="0">75</tspan></text><line x1="883.76" y1="49" x2="883.76" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="883.76" y1="137" x2="883.76" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="883.76" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="883.76" dy="0">100</tspan></text><line x1="384" y1="137" x2="883.76" y2="137" stroke="#5b7280" stroke-width="1.6"/><text x="374" y="67" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="374" dy="0">Agente fijo (5,42 llamadas · p95 24,9 s · 0</tspan></text><text x="374" y="84" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="374" dy="0">degradadas)</tspan></text><text x="374" y="111" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="374" dy="0">Con degradación a workflow (3,67 llamadas · p95</tspan></text><text x="374" y="128" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="374" dy="0">13,7 s · 420 degradadas)</tspan></text><rect x="384" y="55" width="301.855" height="32" rx="3" fill="#087f8c"/><text x="692.855" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="692.855" dy="0">60,4</tspan></text><rect x="384" y="99" width="353.33" height="32" rx="3" fill="#087f8c"/><text x="744.33" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="744.33" dy="0">70,7</tspan></text><text x="633.88" y="181" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="633.88" dy="0">% de solicitudes resueltas</tspan></text><rect x="10" y="195" width="920" height="92.56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="219.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Entre paréntesis, las llamadas por solicitud, el p95 de latencia y las solicitudes degradadas. Cómo leer la figura:</tspan></text><text x="470" y="236.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">degradar cuesta calidad en lo que el workflow no sabe hacer, pero corta la espera y el gasto en reintentos. Dónde deja de</tspan></text><text x="470" y="253.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">valer: el interruptor abre con 6 fallos de las últimas 20 y se sondea cada 20 solicitudes; esos umbrales son del autor y el</tspan></text><text x="470" y="269.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">costo de la calidad perdida no está en el gráfico.</tspan></text><text x="470" y="317.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Experimento propio con la biblioteca estándar; el modelo es sintético con semilla fija y no se invocó ningún modelo de lenguaje.</tspan></text></svg>
