<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 434" width="940" height="434" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un mismo modelo ante cuatro fallas en servicio: AUC fuera de línea y con cada falla</title><desc id="d">Mancuernas con el AUC fuera de línea y con cada falla en servicio: unidad distinta 0,845 a 0,818, deriva de covariables 0,845 a 0,851, deriva de concepto 0,845 a 0,796 y historial en cero 0,845 a 0,741.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="434" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un mismo modelo ante cuatro fallas en servicio: AUC fuera de línea y con cada falla</tspan></text><circle cx="22" cy="51" r="6" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Fuera de línea</tspan></text><circle cx="175.56" cy="51" r="6" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="189.56" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="189.56" dy="0">Con la falla</tspan></text><line x1="402.3" y1="77" x2="402.3" y2="253" stroke="#d5dde1" stroke-width="1"/><line x1="402.3" y1="253" x2="402.3" y2="258" stroke="#5b7280" stroke-width="1.4"/><text x="402.3" y="274" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402.3" dy="0">0</tspan></text><line x1="480.908" y1="77" x2="480.908" y2="253" stroke="#d5dde1" stroke-width="1"/><line x1="480.908" y1="253" x2="480.908" y2="258" stroke="#5b7280" stroke-width="1.4"/><text x="480.908" y="274" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="480.908" dy="0">0,2</tspan></text><line x1="559.516" y1="77" x2="559.516" y2="253" stroke="#d5dde1" stroke-width="1"/><line x1="559.516" y1="253" x2="559.516" y2="258" stroke="#5b7280" stroke-width="1.4"/><text x="559.516" y="274" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="559.516" dy="0">0,4</tspan></text><line x1="638.124" y1="77" x2="638.124" y2="253" stroke="#d5dde1" stroke-width="1"/><line x1="638.124" y1="253" x2="638.124" y2="258" stroke="#5b7280" stroke-width="1.4"/><text x="638.124" y="274" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="638.124" dy="0">0,6</tspan></text><line x1="716.732" y1="77" x2="716.732" y2="253" stroke="#d5dde1" stroke-width="1"/><line x1="716.732" y1="253" x2="716.732" y2="258" stroke="#5b7280" stroke-width="1.4"/><text x="716.732" y="274" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="716.732" dy="0">0,8</tspan></text><line x1="795.34" y1="77" x2="795.34" y2="253" stroke="#d5dde1" stroke-width="1"/><line x1="795.34" y1="253" x2="795.34" y2="258" stroke="#5b7280" stroke-width="1.4"/><text x="795.34" y="274" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="795.34" dy="0">1</tspan></text><line x1="402.3" y1="253" x2="795.34" y2="253" stroke="#5b7280" stroke-width="1.6"/><text x="334" y="103.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Unidad distinta (tasa de lectura x100)</tspan></text><text x="334" y="147.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Deriva de covariables (carga +2,5 tareas)</tspan></text><text x="334" y="183" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Deriva de concepto (peso del historial</tspan></text><text x="334" y="200" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">x0,25)</tspan></text><text x="334" y="235.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Historial de tardanzas llega en cero</tspan></text><line x1="734.419" y1="99" x2="723.807" y2="99" stroke="#c0432f" stroke-width="4"/><circle cx="734.419" cy="99" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="723.807" cy="99" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="746.419" y="103.5" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="746.419" dy="0">0,845</tspan></text><text x="711.807" y="103.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="711.807" dy="0">0,818</tspan></text><text x="926" y="103.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">-0,027</tspan></text><line x1="734.419" y1="143" x2="736.777" y2="143" stroke="#087f8c" stroke-width="4"/><circle cx="734.419" cy="143" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="736.777" cy="143" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="722.419" y="147.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="722.419" dy="0">0,845</tspan></text><text x="748.777" y="147.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="748.777" dy="0">0,851</tspan></text><text x="926" y="147.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">+0,006</tspan></text><line x1="734.419" y1="187" x2="715.16" y2="187" stroke="#c0432f" stroke-width="4"/><circle cx="734.419" cy="187" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="715.16" cy="187" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="746.419" y="191.5" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="746.419" dy="0">0,845</tspan></text><text x="703.16" y="191.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="703.16" dy="0">0,796</tspan></text><text x="926" y="191.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">-0,049</tspan></text><line x1="734.419" y1="231" x2="693.543" y2="231" stroke="#c0432f" stroke-width="4"/><circle cx="734.419" cy="231" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="693.543" cy="231" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="746.419" y="235.5" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="746.419" dy="0">0,845</tspan></text><text x="681.543" y="235.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="681.543" dy="0">0,741</tspan></text><text x="926" y="235.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">-0,104</tspan></text><text x="598.82" y="297" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="598.82" dy="0">AUC</tspan></text><rect x="10" y="311" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="335.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La deriva de covariables mueve las entradas más que ninguna y no daña; la deriva de concepto no mueve ninguna entrada y</tspan></text><text x="470" y="352.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">baja 0,049; el historial en cero es la mayor caída, 0,104, sin ningún valor fuera de rango. Las magnitudes de cada falla</tspan></text><text x="470" y="369.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">las eligió el autor.</tspan></text><text x="470" y="416.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo sintético con parámetros del autor y semilla fija 46; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
