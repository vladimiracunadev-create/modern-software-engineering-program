<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 559" width="860" height="559" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El modelo cambia lo que mide: tasa de entregas tardías entre los marcados y AUC antes y después de reentrenar</title><desc id="d">Barras agrupadas con la tasa de entregas tardías entre los 5408 marcados, 0,681 real sin recordatorio y 0,340 observada con recordatorio, y el AUC en datos sin intervención, 0,852 del modelo original y 0,843 del reentrenado con etiquetas observadas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="860" height="559" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">El modelo cambia lo que mide: tasa de entregas tardías entre los marcados y AUC antes y después de</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">reentrenar</tspan></text><rect x="16" y="64" width="12" height="12" rx="2" fill="#102a43"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Real sin recordatorio / modelo original</tspan></text><rect x="358.06" y="64" width="12" height="12" rx="2" fill="#087f8c"/><text x="378.06" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="378.06" dy="0">Observado con recordatorio / reentrenado con lo observado</tspan></text><line x1="78.62" y1="384" x2="840" y2="384" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="384" x2="78.62" y2="384" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="388.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="330" x2="840" y2="330" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="330" x2="78.62" y2="330" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="334.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,2</tspan></text><line x1="78.62" y1="276" x2="840" y2="276" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="276" x2="78.62" y2="276" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="280.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,4</tspan></text><line x1="78.62" y1="222" x2="840" y2="222" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="222" x2="78.62" y2="222" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="226.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,6</tspan></text><line x1="78.62" y1="168" x2="840" y2="168" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="168" x2="78.62" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="172.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,8</tspan></text><line x1="78.62" y1="114" x2="840" y2="114" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="114" x2="78.62" y2="114" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="118.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">1</tspan></text><line x1="78.62" y1="114" x2="78.62" y2="384" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="249" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 249)">Proporción</text><rect x="116.689" y="200.13" width="150.276" height="183.87" rx="3" fill="#102a43"/><text x="191.827" y="194.13" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="191.827" dy="0">0,681</tspan></text><rect x="270.965" y="292.2" width="150.276" height="91.8" rx="3" fill="#087f8c"/><text x="346.103" y="286.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="346.103" dy="0">0,340</tspan></text><text x="268.965" y="405" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="268.965" dy="0">Entregas tardías entre los 5 408 marcados</tspan></text><rect x="497.379" y="153.96" width="150.276" height="230.04" rx="3" fill="#102a43"/><text x="572.517" y="147.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="572.517" dy="0">0,852</tspan></text><rect x="651.655" y="156.39" width="150.276" height="227.61" rx="3" fill="#087f8c"/><text x="726.793" y="150.39" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="726.793" dy="0">0,843</tspan></text><text x="649.655" y="405" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="649.655" dy="0">AUC en datos sin intervención</tspan></text><rect x="10" y="436" width="840" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="430" y="460.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="430" dy="0">El recordatorio, supuesto de efecto del 50 %, reduce a la mitad la tasa que el equipo ve entre los marcados, de</tspan></text><text x="430" y="477.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="430" dy="0">modo que esa cifra mezcla la calidad del modelo con la eficacia del recordatorio. El AUC casi no se mueve porque</tspan></text><text x="430" y="494.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="430" dy="0">la intervención alcanza solo al 18 % de la población.</tspan></text><text x="430" y="541.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="430" dy="0">Modelo sintético con parámetros del autor y semilla fija 46; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
