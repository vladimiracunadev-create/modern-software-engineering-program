<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 346" width="940" height="346" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una característica construida con la etiqueta: AUC fuera de línea y en servicio</title><desc id="d">Mancuernas con el AUC fuera de línea y en servicio de dos modelos: el modelo sin fuga pasa de 0,851 a 0,851 y el modelo con una característica construida con la etiqueta pasa de 0,987 fuera de línea a 0,837 en servicio.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="346" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Una característica construida con la etiqueta: AUC fuera de línea y en servicio</tspan></text><circle cx="22" cy="51" r="6" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Fuera de línea</tspan></text><circle cx="175.56" cy="51" r="6" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="189.56" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="189.56" dy="0">En servicio</tspan></text><line x1="412.3" y1="77" x2="412.3" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="412.3" y1="165" x2="412.3" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="412.3" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412.3" dy="0">0</tspan></text><line x1="488.908" y1="77" x2="488.908" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="488.908" y1="165" x2="488.908" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="488.908" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="488.908" dy="0">0,2</tspan></text><line x1="565.516" y1="77" x2="565.516" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="565.516" y1="165" x2="565.516" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="565.516" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="565.516" dy="0">0,4</tspan></text><line x1="642.124" y1="77" x2="642.124" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="642.124" y1="165" x2="642.124" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="642.124" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642.124" dy="0">0,6</tspan></text><line x1="718.732" y1="77" x2="718.732" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="718.732" y1="165" x2="718.732" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="718.732" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="718.732" dy="0">0,8</tspan></text><line x1="795.34" y1="77" x2="795.34" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="795.34" y1="165" x2="795.34" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="795.34" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="795.34" dy="0">1</tspan></text><line x1="412.3" y1="165" x2="795.34" y2="165" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="103.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">Modelo sin fuga</tspan></text><text x="344" y="139" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">Con una característica construida con la</tspan></text><text x="344" y="156" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">etiqueta</tspan></text><line x1="738.267" y1="99" x2="738.267" y2="99" stroke="#c0432f" stroke-width="4"/><circle cx="738.267" cy="99" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="738.267" cy="99" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="726.267" y="103.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="726.267" dy="0">0,851</tspan></text><text x="750.267" y="103.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="750.267" dy="0">0,851</tspan></text><text x="926" y="103.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">+0,000</tspan></text><line x1="790.36" y1="143" x2="732.904" y2="143" stroke="#c0432f" stroke-width="4"/><circle cx="790.36" cy="143" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="732.904" cy="143" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="802.36" y="147.5" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="802.36" dy="0">0,987</tspan></text><text x="720.904" y="147.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="720.904" dy="0">0,837</tspan></text><text x="926" y="147.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">-0,150</tspan></text><text x="603.82" y="209" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="603.82" dy="0">AUC</tspan></text><rect x="10" y="223" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="247.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El modelo con fuga tiene la mejor puntuación fuera de línea de todas y termina por debajo del modelo limpio: aprendió a</tspan></text><text x="470" y="264.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">apoyarse en una señal que en servicio llega como la media histórica. La fuga es la etiqueta más un ruido de desviación</tspan></text><text x="470" y="281.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">0,35.</tspan></text><text x="470" y="328.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo sintético con parámetros del autor y semilla fija 46; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
