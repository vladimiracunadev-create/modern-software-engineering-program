<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 393" width="940" height="393" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La misma característica implementada dos veces: AUC con la definición del entrenamiento y con la del servicio</title><desc id="d">Mancuernas con el AUC del modelo con la definición de entrenamiento y con una definición distinta en servicio: idéntica 0,846; horas restantes redondeadas a días, con el 100 por ciento de los valores distintos, 0,845; carga con otra definición, con el 95 por ciento de los valores distintos, 0,834.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="393" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">La misma característica implementada dos veces: AUC con la definición del entrenamiento y con la del</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">servicio</tspan></text><circle cx="22" cy="70" r="6" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Definición del entrenamiento</tspan></text><circle cx="281.12" cy="70" r="6" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="295.12" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="295.12" dy="0">Definición del servicio</tspan></text><line x1="412.3" y1="96" x2="412.3" y2="228" stroke="#d5dde1" stroke-width="1"/><line x1="412.3" y1="228" x2="412.3" y2="233" stroke="#5b7280" stroke-width="1.4"/><text x="412.3" y="249" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412.3" dy="0">0</tspan></text><line x1="488.908" y1="96" x2="488.908" y2="228" stroke="#d5dde1" stroke-width="1"/><line x1="488.908" y1="228" x2="488.908" y2="233" stroke="#5b7280" stroke-width="1.4"/><text x="488.908" y="249" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="488.908" dy="0">0,2</tspan></text><line x1="565.516" y1="96" x2="565.516" y2="228" stroke="#d5dde1" stroke-width="1"/><line x1="565.516" y1="228" x2="565.516" y2="233" stroke="#5b7280" stroke-width="1.4"/><text x="565.516" y="249" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="565.516" dy="0">0,4</tspan></text><line x1="642.124" y1="96" x2="642.124" y2="228" stroke="#d5dde1" stroke-width="1"/><line x1="642.124" y1="228" x2="642.124" y2="233" stroke="#5b7280" stroke-width="1.4"/><text x="642.124" y="249" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642.124" dy="0">0,6</tspan></text><line x1="718.732" y1="96" x2="718.732" y2="228" stroke="#d5dde1" stroke-width="1"/><line x1="718.732" y1="228" x2="718.732" y2="233" stroke="#5b7280" stroke-width="1.4"/><text x="718.732" y="249" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="718.732" dy="0">0,8</tspan></text><line x1="795.34" y1="96" x2="795.34" y2="228" stroke="#d5dde1" stroke-width="1"/><line x1="795.34" y1="228" x2="795.34" y2="233" stroke="#5b7280" stroke-width="1.4"/><text x="795.34" y="249" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="795.34" dy="0">1</tspan></text><line x1="412.3" y1="228" x2="795.34" y2="228" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="122.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">Idéntica (misma función)</tspan></text><text x="344" y="158" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">Horas restantes redondeadas a días (100 %</tspan></text><text x="344" y="175" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">distintas)</tspan></text><text x="344" y="210.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">Carga con otra definición (95 % distintas)</tspan></text><line x1="736.352" y1="118" x2="736.352" y2="118" stroke="#c0432f" stroke-width="4"/><circle cx="736.352" cy="118" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="736.352" cy="118" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="724.352" y="122.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="724.352" dy="0">0,846</tspan></text><text x="748.352" y="122.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="748.352" dy="0">0,846</tspan></text><text x="926" y="122.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">+0,000</tspan></text><line x1="736.352" y1="162" x2="735.969" y2="162" stroke="#c0432f" stroke-width="4"/><circle cx="736.352" cy="162" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="735.969" cy="162" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="748.352" y="166.5" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="748.352" dy="0">0,846</tspan></text><text x="723.969" y="166.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="723.969" dy="0">0,845</tspan></text><text x="926" y="166.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">-0,001</tspan></text><line x1="736.352" y1="206" x2="731.755" y2="206" stroke="#c0432f" stroke-width="4"/><circle cx="736.352" cy="206" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="731.755" cy="206" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="748.352" y="210.5" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="748.352" dy="0">0,846</tspan></text><text x="719.755" y="210.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="719.755" dy="0">0,834</tspan></text><text x="926" y="210.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">-0,012</tspan></text><text x="603.82" y="272" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="603.82" dy="0">AUC</tspan></text><rect x="10" y="286" width="920" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="310.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Cambiar el 100 % de las horas restantes casi no cuesta porque el modelo les da poco peso; cambiar la definición de la carga</tspan></text><text x="470" y="327.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">cuesta más. La prueba de paridad por característica separa las divergencias que duelen de las que no.</tspan></text><text x="470" y="375.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo sintético con parámetros del autor y semilla fija 46; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
