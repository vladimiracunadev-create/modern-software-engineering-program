<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 516" width="940" height="516" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Elegir el mejor de N candidatos casi idénticos con una validación de 300 filas: optimismo de la elección</title><desc id="d">Líneas con la brecha entre el AUC de validación y el de prueba del candidato elegido según el número de candidatos probados: 0,0011 con 1, 0,0052 con 5, 0,0081 con 20 y 0,0101 con 80, con una validación de 300 filas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="516" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Elegir el mejor de N candidatos casi idénticos con una validación de 300 filas: optimismo de la elección</tspan></text><line x1="93.7" y1="349" x2="910" y2="349" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="349" x2="93.7" y2="349" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="353.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">0</tspan></text><line x1="93.7" y1="300.667" x2="910" y2="300.667" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="300.667" x2="93.7" y2="300.667" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="305.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">0,002</tspan></text><line x1="93.7" y1="252.333" x2="910" y2="252.333" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="252.333" x2="93.7" y2="252.333" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="256.833" font-siz