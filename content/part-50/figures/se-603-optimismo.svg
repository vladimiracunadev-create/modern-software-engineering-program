y1="59" x2="645.145" y2="349" stroke="#d5dde1" stroke-width="1"/><line x1="645.145" y1="349" x2="645.145" y2="354" stroke="#5b7280" stroke-width="1.4"/><text x="645.145" y="370" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="645.145" dy="0">20</tspan></text><line x1="892" y1="59" x2="892" y2="349" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="349" x2="892" y2="354" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="370" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">80</tspan></text><line x1="93.7" y1="349" x2="910" y2="349" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="204" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 204)">AUC de validación menos AUC de prueba</text><text x="501.85" y="395" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="501.85" dy="0">Candidatos probados (escala logarítmica)</tspan></text><polyline points="111.7,322.417 398.29,223.333 645.145,153.25 892,104.917" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="111.7" cy="322.417" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="111.7" y="311.417" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="111.7" dy="0">0,0011</tspan></text><circle cx="398.29" cy="223.333" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="398.29" y="212.333" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="398.29" dy="0">0,0052</tspan></text><circle cx="645.145" cy="153.25" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="645.145" y="142.25" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="645.145" dy="0">0,0081</tspan></text><circle cx="892" cy="104.917" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="93.9167" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">0,0101</tspan></text><rect x="10" y="409" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="433.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los candidatos valen lo mismo, de modo que toda la brecha es suerte: el elegido es el más afortunado en esa validación. De</tspan></text><text x="470" y="450.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">1 a 5 candidatos se obtiene casi la mitad de la brecha final. Media de 40 repeticiones.</tspan></text><text x="470" y="498.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo sintético con parámetros del autor y semilla fija 46; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
