<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" width="940" height="480" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Intervalo del 95 % del AUC (bootstrap) según el tamaño de la evaluación</title><desc id="d">Intervalos del AUC con bootstrap del 95 por ciento según el tamaño de la evaluación: con 200 filas 0,829 en el intervalo de 0,774 a 0,902; con 2000 filas 0,852 en el intervalo de 0,829 a 0,871; con 20000 filas 0,849 en el intervalo de 0,844 a 0,854.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="480" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Intervalo del 95 % del AUC (bootstrap) según el tamaño de la evaluación</tspan></text><rect x="16" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">2,5 %</tspan></text><polygon points="107.7,44.1 114.3,56.4 101.1,56.4" fill="#946512" stroke="#946512" stroke-width="2"/><text x="121.7" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="121.7" dy="0">AUC medido</tspan></text><polygon points="231.1,43.5 238.6,51 231.1,58.5 223.6,51" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="245.1" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="245.1" dy="0">97,5 %</tspan></text><line x1="148.72" y1="77" x2="148.72" y2="299" stroke="#d5dde1" stroke-width="1"/><line x1="148.72" y1="299" x2="148.72" y2="304" stroke="#5b7280" stroke-width="1.4"/><text x="148.72" y="320" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="148.72" dy="0">0</tspan></text><line x1="296.976" y1="77" x2="296.976" y2="299" stroke="#d5dde1" stroke-width="1"/><line x1="296.976" y1="299" x2="296.976" y2="304" stroke="#5b7280" stroke-width="1.4"/><text x="296.976" y="320" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="296.976" dy="0">0,2</tspan></text><line x1="445.232" y1="77" x2="445.232" y2="299" stroke="#d5dde1" stroke-width="1"/><line x1="445.232" y1="299" x2="445.232" y2="304" stroke="#5b7280" stroke-width="1.4"/><text x="445.232" y="320" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="445.232" dy="0">0,4</tspan></text><line x1="593.488" y1="77" x2="593.488" y2="299" stroke="#d5dde1" stroke-width="1"/><line x1="593.488" y1="299" x2="593.488" y2="304" stroke="#5b7280" stroke-width="1.4"/><text x="593.488" y="320" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="593.488" dy="0">0,6</tspan></text><line x1="741.744" y1="77" x2="741.744" y2="299" stroke="#d5dde1" stroke-width="1"/><line x1="741.744" y1="299" x2="741.744" y2="304" stroke="#5b7280" stroke-width="1.4"/><text x="741.744" y="320" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="741.744" dy="0">0,8</tspan></text><line x1="890" y1="77" x2="890" y2="299" stroke="#d5dde1" stroke-width="1"/><line x1="890" y1="299" x2="890" y2="304" stroke="#5b7280" stroke-width="1.4"/><text x="890" y="320" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="890" dy="0">1</tspan></text><line x1="148.72" y1="299" x2="890" y2="299" stroke="#5b7280" stroke-width="1.6"/><text x="118.72" y="118.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="118.72" dy="0">200 filas</tspan></text><text x="118.72" y="192.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="118.72" dy="0">2 000 filas</tspan></text><text x="118.72" y="266.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="118.72" dy="0">20 000 filas</tspan></text><line x1="722.471" y1="114" x2="817.355" y2="114" stroke="#8a9aa3" stroke-width="5"/><rect x="715.471" y="107" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="722.471" y="98" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="722.471" dy="0">0,774</tspan></text><polygon points="763.241,105.95 770.941,120.3 755.541,120.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="763.241" y="143" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="763.241" dy="0">0,829</tspan></text><polygon points="817.355,105.25 826.105,114 817.355,122.75 808.605,114" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="817.355" y="98" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="817.355" dy="0">0,902</tspan></text><line x1="763.241" y1="188" x2="794.375" y2="188" stroke="#8a9aa3" stroke-width="5"/><rect x="756.241" y="181" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="763.241" y="172" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="763.241" dy="0">0,829</tspan></text><polygon points="780.291,179.95 787.991,194.3 772.591,194.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="780.291" y="217" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="780.291" dy="0">0,852</tspan></text><polygon points="794.375,179.25 803.125,188 794.375,196.75 785.625,188" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="794.375" y="172" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="794.375" dy="0">0,871</tspan></text><line x1="774.36" y1="262" x2="781.773" y2="262" stroke="#8a9aa3" stroke-width="5"/><polygon points="774.36,253.95 782.06,268.3 766.66,268.3" fill="#946512" stroke="#946512" stroke-width="2"/><rect x="767.36" y="255" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="774.36" y="246" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="774.36" dy="0">0,844 · 2,5 %, AUC medido</tspan></text><polygon points="781.773,253.25 790.523,262 781.773,270.75 773.023,262" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="781.773" y="291" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="781.773" dy="0">0,854</tspan></text><text x="519.36" y="343" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="519.36" dy="0">AUC</tspan></text><rect x="10" y="357" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="381.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Con 200 filas el intervalo mide 0,128 y cubre valores que cambiarían cualquier decisión; con 20 000 mide 0,011. Una</tspan></text><text x="470" y="398.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">diferencia de 0,02 entre dos modelos solo se ve con la evaluación grande. 200 remuestreos de una sola muestra, con</tspan></text><text x="470" y="415.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">observaciones independientes.</tspan></text><text x="470" y="462.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo sintético con parámetros del autor y semilla fija 46; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
