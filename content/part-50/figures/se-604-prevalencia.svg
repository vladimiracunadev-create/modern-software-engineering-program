<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" width="940" height="540" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Con una prevalencia del 2,8 %: el modelo frente a un clasificador que siempre dice que no</title><desc id="d">Barras agrupadas con tres métricas del modelo y de un clasificador que siempre dice no cuando la prevalencia es 0,028: exactitud 0,972 y 0,972, recall con umbral 0,5 de 0,074 y 0, y precisión promedio de 0,236 y 0,028.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="540" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Con una prevalencia del 2,8 %: el modelo frente a un clasificador que siempre dice que no</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Modelo</tspan></text><rect x="109.24" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="129.24" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="129.24" dy="0">Siempre dice que no</tspan></text><line x1="78.62" y1="365" x2="920" y2="365" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="365" x2="78.62" y2="365" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="369.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="311" x2="920" y2="311" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="311" x2="78.62" y2="311" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="315.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,2</tspan></text><line x1="78.62" y1="257" x2="920" y2="257" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="257" x2="78.62" y2="257" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="261.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,4</tspan></text><line x1="78.62" y1="203" x2="920" y2="203" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="203" x2="78.62" y2="203" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="207.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,6</tspan></text><line x1="78.62" y1="149" x2="920" y2="149" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="149" x2="78.62" y2="149" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="153.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,8</tspan></text><line x1="78.62" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="95" x2="78.62" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">1</tspan></text><line x1="78.62" y1="95" x2="78.62" y2="365" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 230)">Valor de la métrica (0 a 1)</text><rect x="106.666" y="102.56" width="110.184" height="262.44" rx="3" fill="#102a43"/><text x="161.758" y="96.56" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="161.758" dy="0">0,972</tspan></text><rect x="220.85" y="102.56" width="110.184" height="262.44" rx="3" fill="#6b7c86"/><text x="275.942" y="96.56" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="275.942" dy="0">0,972</tspan></text><text x="218.85" y="386" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="218.85" dy="0">Exactitud</tspan></text><rect x="387.126" y="345.02" width="110.184" height="19.98" rx="3" fill="#102a43"/><text x="442.218" y="339.02" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="442.218" dy="0">0,074</tspan></text><rect x="501.31" y="363" width="110.184" height="2" rx="3" fill="#6b7c86"/><text x="556.402" y="357" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="556.402" dy="0">0,000</tspan></text><text x="499.31" y="386" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="499.31" dy="0">Recall con umbral 0,5</tspan></text><rect x="667.586" y="301.28" width="110.184" height="63.72" rx="3" fill="#102a43"/><text x="722.678" y="295.28" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="722.678" dy="0">0,236</tspan></text><rect x="781.77" y="357.44" width="110.184" height="7.56" rx="3" fill="#6b7c86"/><text x="836.862" y="351.44" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="836.862" dy="0">0,028</tspan></text><text x="779.77" y="386" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="779.77" dy="0">Precisión promedio (PR-AUC)</tspan></text><rect x="10" y="417" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="441.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">La exactitud es idéntica y no distingue al modelo del clasificador trivial; el recall y la precisión promedio sí. El AUC</tspan></text><text x="470" y="458.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">del modelo es 0,870: ordena bien pero el umbral de 0,5 heredado de otra población detecta a uno de cada trece estudiantes</tspan></text><text x="470" y="475.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">en riesgo.</tspan></text><text x="470" y="522.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo sintético con parámetros del autor y semilla fija 46; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
