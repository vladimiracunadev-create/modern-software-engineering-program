<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 522" width="940" height="522" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El umbral que minimiza el costo según cuánto más cuesta una omisión que una falsa alarma</title><desc id="d">Línea con el umbral óptimo según cuánto más cuesta una omisión que una falsa alarma: 0,51 con costos iguales, 0,16 con relación 1 a 5 y 0,09 con relación 1 a 10; las falsas alarmas correspondientes son 1199, 5849 y 8350.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="522" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">El umbral que minimiza el costo según cuánto más cuesta una omisión que una falsa alarma</tspan></text><line x1="78.62" y1="339" x2="910" y2="339" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="339" x2="78.62" y2="339" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="343.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="292.333" x2="910" y2="292.333" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="292.333" x2="78.62" y2="292.333" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="296.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,1</tspan></text><line x1="78.62" y1="245.667" x2="910" y2="245.667" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="245.667" x2="78.62" y2="245.667" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="250.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,2</tspan></text><line x1="78.62" y1="199" x2="910" y2="199" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="199" x2="78.62" y2="199" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="203.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,3</tspan></text><line x1="78.62" y1="152.333" x2="910" y2="152.333" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="152.333" x2="78.62" y2="152.333" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="156.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,4</tspan></text><line x1="78.62" y1="105.667" x2="910" y2="105.667" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="105.667" x2="78.62" y2="105.667" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="110.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,5</tspan></text><line x1="78.62" y1="59" x2="910" y2="59" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="59" x2="78.62" y2="59" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="63.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,6</tspan></text><line x1="78.62" y1="59" x2="78.62" y2="339" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="59" x2="96.62" y2="339" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="339" x2="96.62" y2="344" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">1 a 1</tspan></text><line x1="450.122" y1="59" x2="450.122" y2="339" stroke="#d5dde1" stroke-width="1"/><line x1="450.122" y1="339" x2="450.122" y2="344" stroke="#5b7280" stroke-width="1.4"/><text x="450.122" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="450.122" dy="0">5 a 1</tspan></text><line x1="892" y1="59" x2="892" y2="339" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="339" x2="892" y2="344" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">10 a 1</tspan></text><line x1="78.62" y1="339" x2="910" y2="339" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="199" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 199)">Umbral que minimiza el costo</text><text x="494.31" y="385" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Costo de una omisión frente a una falsa alarma</tspan></text><polyline points="96.62,101 450.122,264.333 892,297" fill="none" stroke="#087f8c" stroke-width="2.4"/><circle cx="96.62" cy="101" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="96.62" y="90" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">0,51</tspan></text><circle cx="450.122" cy="264.333" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="450.122" y="253.333" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="450.122" dy="0">0,16</tspan></text><circle cx="892" cy="297" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="286" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">0,09</tspan></text><rect x="10" y="399" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="423.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Con 20 000 estudiantes, el umbral óptimo produce 1 199 falsas alarmas y 2 629 omisiones con costos iguales, 5 849 y 598 con</tspan></text><text x="470" y="440.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">relación 5 a 1, y 8 350 y 220 con 10 a 1: pasar de 1 a 10 multiplica por siete las falsas alarmas. El costo es lineal y</tspan></text><text x="470" y="457.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">supuesto.</tspan></text><text x="470" y="504.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo sintético con parámetros del autor y semilla fija 46; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
