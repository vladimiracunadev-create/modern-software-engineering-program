<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 328" width="940" height="328" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Horas de un acelerador para entrenar un modelo de 7 000 millones de parámetros según los tokens</title><desc id="d">Barras horizontales en escala logarítmica con las horas de un acelerador que implica la regla de seis operaciones por parámetro y por token para un modelo de 7000 millones de parámetros: 1,2 horas con 10 millones de tokens, 117 horas con 1000 millones y 116700 horas con un billón, suponiendo 1e14 operaciones por segundo sostenidas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="328" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Horas de un acelerador para entrenar un modelo de 7 000 millones de parámetros según los tokens</tspan></text><line x1="234" y1="49" x2="234" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="234" y1="163" x2="234" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="234" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="234" dy="0">1</tspan></text><line x1="335.577" y1="49" x2="335.577" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="335.577" y1="163" x2="335.577" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="335.577" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="335.577" dy="0">10</tspan></text><line x1="437.153" y1="49" x2="437.153" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="437.153" y1="163" x2="437.153" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="437.153" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437.153" dy="0">100</tspan></text><line x1="538.73" y1="49" x2="538.73" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="538.73" y1="163" x2="538.73" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="538.73" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="538.73" dy="0">1 000</tspan></text><line x1="640.307" y1="49" x2="640.307" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="640.307" y1="163" x2="640.307" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="640.307" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="640.307" dy="0">10 000</tspan></text><line x1="741.883" y1="49" x2="741.883" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="741.883" y1="163" x2="741.883" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="741.883" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="741.883" dy="0">100 000</tspan></text><line x1="843.46" y1="49" x2="843.46" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="843.46" y1="163" x2="843.46" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="843.46" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="843.46" dy="0">1 000 000</tspan></text><line x1="234" y1="163" x2="843.46" y2="163" stroke="#5b7280" stroke-width="1.6"/><text x="224" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="224" dy="0">10 millones de tokens</tspan></text><text x="224" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="224" dy="0">1 000 millones de tokens</tspan></text><text x="224" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="224" dy="0">1 billón de tokens</tspan></text><rect x="234" y="55" width="8.04297" height="26" rx="3" fill="#102a43"/><text x="249.043" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="249.043" dy="0">1,2</tspan></text><rect x="234" y="93" width="209.966" height="26" rx="3" fill="#102a43"/><text x="450.966" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="450.966" dy="0">116,7</tspan></text><rect x="234" y="131" width="514.684" height="26" rx="3" fill="#102a43"/><text x="755.684" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="755.684" dy="0">116 666,7</tspan></text><text x="538.73" y="207" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="538.73" dy="0">Horas con 1e14 operaciones por segundo sostenidas (escala logarítmica)</tspan></text><rect x="10" y="221" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="245.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cada barra es cien veces la anterior porque los tokens se multiplican por cien. Es aritmética con la regla publicada de</tspan></text><text x="470" y="262.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">seis operaciones por parámetro y por token y un rendimiento sostenido supuesto, no una medición de ningún acelerador.</tspan></text><text x="470" y="310.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Aritmética con supuestos declarados; no es una medición.</tspan></text></svg>
