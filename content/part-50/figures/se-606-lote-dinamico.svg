<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 550" width="940" height="550" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Lote dinámico con una carga del 80 % de la capacidad sin lotes: p50 y p99 según la espera y el lote máximos</title><desc id="d">Barras agrupadas con el p50 y el p99 en milisegundos de cinco configuraciones de lote dinámico con una carga del 80 por ciento de la capacidad sin lotes: sin espera y lote 1, 0,10 y 0,47; 0,5 ms y lote 8, 0,32 y 0,64; 2 ms y lote 32, 1,12 y 2,21; 5 ms y lote 64, 2,03 y 4,25; 20 ms y lote 256, 7,67 y 15,16.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="550" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Lote dinámico con una carga del 80 % de la capacidad sin lotes: p50 y p99 según la espera y el lote máximos</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">p50</tspan></text><rect x="86.62" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="106.62" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="106.62" dy="0">p99</tspan></text><line x1="71.08" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="375" x2="71.08" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="305" x2="920" y2="305" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="305" x2="71.08" y2="305" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="309.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">5</tspan></text><line x1="71.08" y1="235" x2="920" y2="235" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="235" x2="71.08" y2="235" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="239.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="165" x2="920" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="165" x2="71.08" y2="165" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="169.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">15</tspan></text><line x1="71.08" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="95" x2="71.08" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="95" x2="71.08" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">Milisegundos</text><rect x="88.0584" y="373" width="65.9136" height="2" rx="3" fill="#087f8c"/><text x="121.015" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="121.015" dy="0">0,10</tspan></text><rect x="157.972" y="368.42" width="65.9136" height="6.58" rx="3" fill="#102a43"/><text x="190.929" y="362.42" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="190.929" dy="0">0,47</tspan></text><text x="155.972" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="155.972" dy="0">Sin espera, lote 1</tspan></text><rect x="257.842" y="370.52" width="65.9136" height="4.48" rx="3" fill="#087f8c"/><text x="290.799" y="364.52" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="290.799" dy="0">0,32</tspan></text><rect x="327.756" y="366.04" width="65.9136" height="8.96" rx="3" fill="#102a43"/><text x="360.713" y="360.04" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="360.713" dy="0">0,64</tspan></text><text x="325.756" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="325.756" dy="0">0,5 ms, lote 8</tspan></text><rect x="427.626" y="359.32" width="65.9136" height="15.68" rx="3" fill="#087f8c"/><text x="460.583" y="353.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="460.583" dy="0">1,12</tspan></text><rect x="497.54" y="344.06" width="65.9136" height="30.94" rx="3" fill="#102a43"/><text x="530.497" y="338.06" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="530.497" dy="0">2,21</tspan></text><text x="495.54" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="495.54" dy="0">2 ms, lote 32</tspan></text><rect x="597.41" y="346.58" width="65.9136" height="28.42" rx="3" fill="#087f8c"/><text x="630.367" y="340.58" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="630.367" dy="0">2,03</tspan></text><rect x="667.324" y="315.5" width="65.9136" height="59.5" rx="3" fill="#102a43"/><text x="700.281" y="309.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="700.281" dy="0">4,25</tspan></text><text x="665.324" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="665.324" dy="0">5 ms, lote 64</tspan></text><rect x="767.194" y="267.62" width="65.9136" height="107.38" rx="3" fill="#087f8c"/><text x="800.151" y="261.62" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="800.151" dy="0">7,67</tspan></text><rect x="837.108" y="162.76" width="65.9136" height="212.24" rx="3" fill="#102a43"/><text x="870.065" y="156.76" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="870.065" dy="0">15,16</tspan></text><text x="835.108" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="835.108" dy="0">20 ms, lote 256</tspan></text><rect x="10" y="427" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">A esta carga el rendimiento servido es el mismo en las cinco configuraciones (unas 18 340 peticiones por segundo): esperar</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">solo añade latencia porque el servicio sin lotes ya tenía holgura. Llegadas de Poisson, un servidor y tiempo de servicio</tspan></text><text x="470" y="485.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">medido e interpolado.</tspan></text><text x="470" y="532.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9, numpy 2.4.4 y scikit-learn 1.8.0; los recuentos con semilla se repiten y los tiempos varían de un equipo a otro.</tspan></text></svg>
