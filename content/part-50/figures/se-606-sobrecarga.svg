<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 378" width="940" height="378" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">p99 con carga igual, doble y cuádruple de la capacidad sin lotes: sin lotes y con lote dinámico de 2 ms y 64</title><desc id="d">Mancuernas en escala logarítmica con el p99 en milisegundos sin lotes y con lote dinámico de 2 ms y 64: con carga igual a la capacidad sin lotes 9,4 y 2,3, con el doble 858 y 1,9, con el cuádruple 1291 y 1,1.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="378" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">p99 con carga igual, doble y cuádruple de la capacidad sin lotes: sin lotes y con lote dinámico de 2 ms y 64</tspan></text><circle cx="22" cy="51" r="6" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Sin lotes</tspan></text><circle cx="137.86" cy="51" r="6" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="151.86" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="151.86" dy="0">Lote dinámico 2 ms y 64</tspan></text><line x1="388.42" y1="77" x2="388.42" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="388.42" y1="197" x2="388.42" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="388.42" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="388.42" dy="0">1</tspan></text><line x1="486.12" y1="77" x2="486.12" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="486.12" y1="197" x2="486.12" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="486.12" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="486.12" dy="0">10</tspan></text><line x1="583.82" y1="77" x2="583.82" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="583.82" y1="197" x2="583.82" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="583.82" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="583.82" dy="0">100</tspan></text><line x1="681.52" y1="77" x2="681.52" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="681.52" y1="197" x2="681.52" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="681.52" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="681.52" dy="0">1 000</tspan></text><line x1="779.22" y1="77" x2="779.22" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="779.22" y1="197" x2="779.22" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="779.22" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="779.22" dy="0">10 000</tspan></text><line x1="388.42" y1="197" x2="779.22" y2="197" stroke="#5b7280" stroke-width="1.6"/><text x="304" y="101.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">Carga igual a la capacidad sin lotes</tspan></text><text x="304" y="141.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">Doble de la capacidad sin lotes</tspan></text><text x="304" y="181.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">Cuádruple de la capacidad sin lotes</tspan></text><line x1="483.495" y1="97" x2="423.761" y2="97" stroke="#087f8c" stroke-width="4"/><circle cx="483.495" cy="97" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="423.761" cy="97" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="495.495" y="101.5" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="495.495" dy="0">9,4</tspan></text><text x="411.761" y="101.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="411.761" dy="0">2,3</tspan></text><text x="926" y="101.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">×4</tspan></text><line x1="675.037" y1="137" x2="415.654" y2="137" stroke="#087f8c" stroke-width="4"/><circle cx="675.037" cy="137" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="415.654" cy="137" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="687.037" y="141.5" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="687.037" dy="0">858,3</tspan></text><text x="403.654" y="141.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="403.654" dy="0">1,9</tspan></text><text x="926" y="141.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">×452</tspan></text><line x1="692.341" y1="177" x2="392.848" y2="177" stroke="#087f8c" stroke-width="4"/><circle cx="692.341" cy="177" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="392.848" cy="177" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="704.341" y="181.5" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="704.341" dy="0">1 290,5</tspan></text><text x="380.848" y="181.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="380.848" dy="0">1,1</tspan></text><text x="926" y="181.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">×1 163</tspan></text><text x="583.82" y="241" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="583.82" dy="0">p99 en milisegundos (escala logarítmica)</tspan></text><rect x="10" y="255" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="279.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Sin lotes, la cola crece mientras dura la sobrecarga y el p99 depende de cuántas peticiones se simulan (40 000); con lotes,</tspan></text><text x="470" y="296.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">la capacidad por petición es unas quince veces mayor y el p99 casi no se mueve. Una cola sin límite no es una solución en</tspan></text><text x="470" y="313.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">ningún caso.</tspan></text><text x="470" y="360.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9, numpy 2.4.4 y scikit-learn 1.8.0; los recuentos con semilla se repiten y los tiempos varían de un equipo a otro.</tspan></text></svg>
