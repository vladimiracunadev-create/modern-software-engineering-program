<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" width="940" height="420" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Errores adicionales esperados en el segmento hasta volver atrás, según la estrategia de despliegue</title><desc id="d">Barras horizontales con los errores adicionales esperados en el segmento antes de volver atrás según la estrategia: despliegue total 610, canary del 25 por ciento 153, del 5 por ciento 31, del 1 por ciento 6 y sombra 0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="420" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Errores adicionales esperados en el segmento hasta volver atrás, según la estrategia de despliegue</tspan></text><line x1="214" y1="49" x2="214" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="214" y1="239" x2="214" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="214" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="214" dy="0">0</tspan></text><line x1="383.455" y1="49" x2="383.455" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="383.455" y1="239" x2="383.455" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="383.455" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="383.455" dy="0">200</tspan></text><line x1="552.91" y1="49" x2="552.91" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="552.91" y1="239" x2="552.91" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="552.91" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552.91" dy="0">400</tspan></text><line x1="722.365" y1="49" x2="722.365" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="722.365" y1="239" x2="722.365" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="722.365" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722.365" dy="0">600</tspan></text><line x1="891.82" y1="49" x2="891.82" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="891.82" y1="239" x2="891.82" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="891.82" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="891.82" dy="0">800</tspan></text><line x1="214" y1="239" x2="891.82" y2="239" stroke="#5b7280" stroke-width="1.6"/><text x="204" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="204" dy="0">Despliegue total</tspan></text><text x="204" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="204" dy="0">Canary del 25 %</tspan></text><text x="204" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="204" dy="0">Canary del 5 %</tspan></text><text x="204" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="204" dy="0">Canary del 1 %</tspan></text><text x="204" y="224.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="204" dy="0">Sombra</tspan></text><rect x="214" y="55" width="516.838" height="26" rx="3" fill="#c0432f"/><text x="737.838" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="737.838" dy="0">610</tspan></text><rect x="214" y="93" width="129.633" height="26" rx="3" fill="#c0432f"/><text x="350.633" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="350.633" dy="0">153</tspan></text><rect x="214" y="131" width="26.2655" height="26" rx="3" fill="#c0432f"/><text x="247.266" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="247.266" dy="0">31</tspan></text><rect x="214" y="169" width="5.08365" height="26" rx="3" fill="#c0432f"/><text x="226.084" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="226.084" dy="0">6</tspan></text><rect x="214" y="207" width="2" height="26" rx="3" fill="#c0432f"/><text x="223" y="224.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="223" dy="0">0</tspan></text><text x="552.91" y="283" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="552.91" dy="0">Errores adicionales del segmento</tspan></text><rect x="10" y="297" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="321.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Se suman 72 horas de detección con etiquetas retrasadas, 4 de decisión y 0,1 de conmutación (76,1 horas) con 20 000</tspan></text><text x="470" y="338.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">decisiones diarias y un exceso de error de 5,7 puntos. La sombra no expone a nadie pero cuesta el doble de cómputo mientras</tspan></text><text x="470" y="355.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">dura.</tspan></text><text x="470" y="402.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo sintético con parámetros del autor y semilla fija 46; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
