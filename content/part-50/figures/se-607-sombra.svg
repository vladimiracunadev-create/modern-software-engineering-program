<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" width="860" height="540" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ejecución en sombra, sin etiquetas: a qué estudiantes marca cada modelo en dos segmentos</title><desc id="d">Barras agrupadas con la tasa de estudiantes marcados por el modelo vigente y por el candidato en dos segmentos: en el resto del tráfico 45,0 por ciento y 31,1; en el segmento móvil y nocturno 58,7 y 3,6.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="860" height="540" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Ejecución en sombra, sin etiquetas: a qué estudiantes marca cada modelo en dos segmentos</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Modelo vigente</tspan></text><rect x="169.56" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="189.56" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="189.56" dy="0">Candidato</tspan></text><line x1="71.08" y1="365" x2="840" y2="365" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="365" x2="71.08" y2="365" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="369.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="275" x2="840" y2="275" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="275" x2="71.08" y2="275" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="279.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="185" x2="840" y2="185" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="185" x2="71.08" y2="185" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="189.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">40</tspan></text><line x1="71.08" y1="95" x2="840" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="95" x2="71.08" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">60</tspan></text><line x1="71.08" y1="95" x2="71.08" y2="365" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 230)">% de estudiantes marcados</text><rect x="109.526" y="162.5" width="151.784" height="202.5" rx="3" fill="#102a43"/><text x="185.418" y="156.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="185.418" dy="0">45,0</tspan></text><rect x="265.31" y="225.05" width="151.784" height="139.95" rx="3" fill="#c0432f"/><text x="341.202" y="219.05" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="341.202" dy="0">31,1</tspan></text><text x="263.31" y="386" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="263.31" dy="0">Resto del tráfico (83 %)</tspan></text><rect x="493.986" y="100.85" width="151.784" height="264.15" rx="3" fill="#102a43"/><text x="569.878" y="94.85" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="569.878" dy="0">58,7</tspan></text><rect x="649.77" y="348.8" width="151.784" height="16.2" rx="3" fill="#c0432f"/><text x="725.662" y="342.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="725.662" dy="0">3,6</tspan></text><text x="647.77" y="386" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647.77" dy="0">Segmento móvil y nocturno (17 %)</tspan></text><rect x="10" y="417" width="840" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="430" y="441.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="430" dy="0">El candidato casi deja de marcar al segmento móvil y nocturno: es la regresión, visible el primer día sin una</tspan></text><text x="430" y="458.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="430" dy="0">sola etiqueta. En el resto del tráfico la baja puede ser una mejora legítima: la tasa de marcados dice dónde</tspan></text><text x="430" y="475.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="430" dy="0">difieren los modelos, no cuál acierta.</tspan></text><text x="430" y="522.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="430" dy="0">Modelo sintético con parámetros del autor y semilla fija 46; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
