<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 346" width="940" height="346" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dos derivas con el mismo modelo: AUC antes y después, y lo que ve el índice de estabilidad</title><desc id="d">Mancuernas con el AUC antes y después de dos derivas: con deriva de covariables, carga más 2,5 tareas, de 0,845 a 0,851 con un PSI de la carga de 0,259 ya con +1,0; con deriva de concepto, el peso del historial a 0,3, de 0,846 a 0,802 con PSI máximo de las entradas de 0,002.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="346" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dos derivas con el mismo modelo: AUC antes y después, y lo que ve el índice de estabilidad</tspan></text><circle cx="22" cy="51" r="6" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Antes</tspan></text><circle cx="107.7" cy="51" r="6" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="121.7" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="121.7" dy="0">Después</tspan></text><line x1="462.3" y1="77" x2="462.3" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="462.3" y1="165" x2="462.3" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="462.3" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462.3" dy="0">0</tspan></text><line x1="528.908" y1="77" x2="528.908" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="528.908" y1="165" x2="528.908" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="528.908" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="528.908" dy="0">0,2</tspan></text><line x1="595.516" y1="77" x2="595.516" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="595.516" y1="165" x2="595.516" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="595.516" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="595.516" dy="0">0,4</tspan></text><line x1="662.124" y1="77" x2="662.124" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="662.124" y1="165" x2="662.124" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="662.124" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662.124" dy="0">0,6</tspan></text><line x1="728.732" y1="77" x2="728.732" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="728.732" y1="165" x2="728.732" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="728.732" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="728.732" dy="0">0,8</tspan></text><line x1="795.34" y1="77" x2="795.34" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="795.34" y1="165" x2="795.34" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="795.34" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="795.34" dy="0">1</tspan></text><line x1="462.3" y1="165" x2="795.34" y2="165" stroke="#5b7280" stroke-width="1.6"/><text x="394" y="95" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="394" dy="0">Deriva de covariables: carga +2,5 (PSI de la carga</tspan></text><text x="394" y="112" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="394" dy="0">0,259 con +1,0)</tspan></text><text x="394" y="139" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="394" dy="0">Deriva de concepto: peso del historial a 0,3 (PSI</tspan></text><text x="394" y="156" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="394" dy="0">máximo de entradas 0,002)</tspan></text><line x1="743.719" y1="99" x2="745.717" y2="99" stroke="#087f8c" stroke-width="4"/><circle cx="743.719" cy="99" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="745.717" cy="99" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="731.719" y="103.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="731.719" dy="0">0,845</tspan></text><text x="757.717" y="103.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="757.717" dy="0">0,851</tspan></text><text x="926" y="103.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">+0,006</tspan></text><line x1="744.052" y1="143" x2="729.398" y2="143" stroke="#c0432f" stroke-width="4"/><circle cx="744.052" cy="143" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="729.398" cy="143" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="756.052" y="147.5" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="756.052" dy="0">0,846</tspan></text><text x="717.398" y="147.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="717.398" dy="0">0,802</tspan></text><text x="926" y="147.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">-0,044</tspan></text><text x="628.82" y="209" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="628.82" dy="0">AUC</tspan></text><rect x="10" y="223" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="247.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">La deriva que mueve las entradas no daña y la que daña no mueve ninguna: el PSI de la salida fue 0,000 en la deriva de</tspan></text><text x="470" y="264.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">concepto. Solo una métrica con etiquetas ve la segunda. Las dos derivas son construcciones del autor con magnitudes</tspan></text><text x="470" y="281.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">elegidas.</tspan></text><text x="470" y="328.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo sintético con parámetros del autor y semilla fija 46; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
