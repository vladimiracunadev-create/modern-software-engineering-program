<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 429" width="940" height="429" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ventanas en que el PSI de la carga supera 0,2, según el tamaño de la ventana y el aumento de la media</title><desc id="d">Mapa de calor con el porcentaje de ventanas en que el PSI de la carga supera 0,2 según el tamaño de la ventana y la deriva de la media: con 100 observaciones 17 por ciento para +0,5, 86 para +1,0 y 100 para +2,0; con 500, 0, 93 y 100; con 2000 y 10000, 0, 100 y 100.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="429" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Ventanas en que el PSI de la carga supera 0,2, según el tamaño de la ventana y el aumento de la media</tspan></text><text x="323.333" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="323.333" dy="0">+0,5 tareas</tspan></text><text x="562" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="562" dy="0">+1,0 tareas</tspan></text><text x="800.667" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="800.667" dy="0">+2,0 tareas</tspan></text><text x="194" y="100.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="194" dy="0">100 observaciones</tspan></text><text x="194" y="148.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="194" dy="0">500 observaciones</tspan></text><text x="194" y="196.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="194" dy="0">2 000 observaciones</tspan></text><text x="194" y="244.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="194" dy="0">10 000 observaciones</tspan></text><rect x="205.5" y="73.5" width="235.667" height="45" rx="4" fill="#b7c3cf" stroke="#ffffff" stroke-width="1"/><text x="323.333" y="100.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="323.333" dy="0">17 %</tspan></text><rect x="444.167" y="73.5" width="235.667" height="45" rx="4" fill="#2c445b" stroke="#ffffff" stroke-width="1"/><text x="562" y="100.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="562" dy="0">86 %</tspan></text><rect x="682.833" y="73.5" width="235.667" height="45" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="800.667" y="100.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="800.667" dy="0">100 %</tspan></text><rect x="205.5" y="121.5" width="235.667" height="45" rx="4" fill="#d9e2ec" stroke="#ffffff" stroke-width="1"/><text x="323.333" y="148.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="323.333" dy="0">0 %</tspan></text><rect x="444.167" y="121.5" width="235.667" height="45" rx="4" fill="#1e374f" stroke="#ffffff" stroke-width="1"/><text x="562" y="148.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="562" dy="0">93 %</tspan></text><rect x="682.833" y="121.5" width="235.667" height="45" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="800.667" y="148.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="800.667" dy="0">100 %</tspan></text><rect x="205.5" y="169.5" width="235.667" height="45" rx="4" fill="#d9e2ec" stroke="#ffffff" stroke-width="1"/><text x="323.333" y="196.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="323.333" dy="0">0 %</tspan></text><rect x="444.167" y="169.5" width="235.667" height="45" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="562" y="196.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="562" dy="0">100 %</tspan></text><rect x="682.833" y="169.5" width="235.667" height="45" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="800.667" y="196.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="800.667" dy="0">100 %</tspan></text><rect x="205.5" y="217.5" width="235.667" height="45" rx="4" fill="#d9e2ec" stroke="#ffffff" stroke-width="1"/><text x="323.333" y="244.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="323.333" dy="0">0 %</tspan></text><rect x="444.167" y="217.5" width="235.667" height="45" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="562" y="244.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="562" dy="0">100 %</tspan></text><rect x="682.833" y="217.5" width="235.667" height="45" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="800.667" y="244.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="800.667" dy="0">100 %</tspan></text><text x="204" y="290" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="204" dy="0">0 %</tspan></text><rect x="234.62" y="278" width="30.5" height="14" fill="#d9e2ec"/><rect x="264.62" y="278" width="30.5" height="14" fill="#bcc8d4"/><rect x="294.62" y="278" width="30.5" height="14" fill="#a0adbc"/><rect x="324.62" y="278" width="30.5" height="14" fill="#8393a4"/><rect x="354.62" y="278" width="30.5" height="14" fill="#66798b"/><rect x="384.62" y="278" width="30.5" height="14" fill="#495f73"/><rect x="414.62" y="278" width="30.5" height="14" fill="#2d445b"/><rect x="444.62" y="278" width="30.5" height="14" fill="#102a43"/><text x="482.62" y="290" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="482.62" dy="0">100 %</tspan></text><text x="528.32" y="290" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="528.32" dy="0">más oscuro = mayor (% de ventanas que alertan)</tspan></text><rect x="10" y="306" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="330.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">300 ventanas por celda. Con 100 observaciones hubo además un 10,7 % de falsas alarmas con umbral 0,1; con 500 o más no hubo</tspan></text><text x="470" y="347.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ninguna. Un aumento de +0,5 no se ve con ninguna ventana: no es cuestión de más datos sino de que el PSI con cuantiles de</tspan></text><text x="470" y="364.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">un entero no ve cambios pequeños.</tspan></text><text x="470" y="411.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo sintético con parámetros del autor y semilla fija 46; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
