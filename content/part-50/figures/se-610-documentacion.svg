rect x="334.62" y="303" width="30.5" height="14" fill="#c0e1e0"/><rect x="364.62" y="303" width="30.5" height="14" fill="#a2d0d2"/><rect x="394.62" y="303" width="30.5" height="14" fill="#83c0c4"/><rect x="424.62" y="303" width="30.5" height="14" fill="#64b0b6"/><rect x="454.62" y="303" width="30.5" height="14" fill="#45a0a8"/><rect x="484.62" y="303" width="30.5" height="14" fill="#278f9a"/><rect x="514.62" y="303" width="30.5" height="14" fill="#087f8c"/><text x="552.62" y="315" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="552.62" dy="0">100 %</tspan></text><text x="598.32" y="315" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="598.32" dy="0">más oscuro = mayor (% de elementos cubiertos)</tspan></text><rect x="10" y="331" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="355.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Veinte elementos elegidos por el autor en cinco áreas, que no reproducen ningún requisito. La documentación abundante puede</tspan></text><text x="470" y="372.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">dejar un área entera en cero: la columna de supervisión y transparencia está vacía hasta el último estado. Mide ausencia de</tspan></text><text x="470" y="389.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">documentos, no su calidad.</tspan></text><text x="470" y="436.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Lista de verificación didáctica del autor; no es una evaluación de conformidad.</tspan></text></svg>
