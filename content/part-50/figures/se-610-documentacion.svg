="855.4" y="77" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="855.4" dy="0">transparencia</tspan></text><text x="264" y="118.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Solo la ficha técnica (3 de 20)</tspan></text><text x="264" y="168.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Ficha y evaluación (7 de 20)</tspan></text><text x="264" y="210" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Operación sin supervisión (16 de</tspan></text><text x="264" y="227" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">20)</tspan></text><text x="264" y="268.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Completa (20 de 20)</tspan></text><rect x="275.5" y="90.5" width="126.2" height="47" rx="4" fill="#74b8bd" stroke="#ffffff" stroke-width="1"/><text x="338.6" y="118.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="338.6" dy="0">50 %</tspan></text><rect x="404.7" y="90.5" width="126.2" height="47" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="467.8" y="118.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="467.8" dy="0">0 %</tspan></text><rect x="533.9" y="90.5" width="126.2" height="47" rx="4" fill="#a9d4d6" stroke="#ffffff" stroke-width="1"/><text x="597" y="118.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="597" dy="0">25 %</tspan></text><rect x="663.1" y="90.5" width="126.2" height="47" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="726.2" y="118.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="726.2" dy="0">0 %</tspan></text><rect x="792.3" y="90.5" width="126.2" height="47" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="855.4" y="118.5" font-si