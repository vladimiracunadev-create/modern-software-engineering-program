<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tasas de error por grupo con un umbral común de 0,4: dos grupos con prevalencias de 0,249 y 0,342</title><desc id="d">Barras agrupadas con cuatro medidas por grupo con un umbral de 0,4: la tasa de marcados es 0,272 en el grupo 0 y 0,278 en el grupo 1, el recall 0,655 y 0,594, las falsas alarmas 0,145 y 0,114 y la precisión 0,600 y 0,729.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="900" height="550" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Tasas de error por grupo con un umbral común de 0,4: dos grupos con prevalencias de 0,249 y 0,342</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Grupo 0</tspan></text><rect x="116.78" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="136.78" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="136.78" dy="0">Grupo 1</tspan></text><line x1="78.62" y1="375" x2="880" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="375" x2="78.62" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="305" x2="880" y2="305" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="305" x2="78.62" y2="305" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="309.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,2</tspan></text><line x1="78.62" y1="235" x2="880" y2="235" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="235" x2="78.62" y2="235" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="239.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,4</tspan></text><line x1="78.62" y1="165" x2="880" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="165" x2="78.62" y2="165" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="169.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,6</tspan></text><line x1="78.62" y1="95" x2="880" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="95" x2="78.62" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,8</tspan></text><line x1="78.62" y1="95" x2="78.62" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">Valor de la medida (0 a 1)</text><rect x="98.6545" y="279.8" width="78.138" height="95.2" rx="3" fill="#102a43"/><text x="137.724" y="273.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137.724" dy="0">0,272</tspan></text><rect x="180.793" y="277.7" width="78.138" height="97.3" rx="3" fill="#c0432f"/><text x="219.862" y="271.7" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="219.862" dy="0">0,278</tspan></text><text x="178.793" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="178.793" dy="0">Tasa de marcados</tspan></text><rect x="299" y="145.75" width="78.138" height="229.25" rx="3" fill="#102a43"/><text x="338.069" y="139.75" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="338.069" dy="0">0,655</tspan></text><rect x="381.138" y="167.1" width="78.138" height="207.9" rx="3" fill="#c0432f"/><text x="420.207" y="161.1" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="420.207" dy="0">0,594</tspan></text><text x="379.138" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="379.138" dy="0">Recall (TPR)</tspan></text><rect x="499.344" y="324.25" width="78.138" height="50.75" rx="3" fill="#102a43"/><text x="538.413" y="318.25" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="538.413" dy="0">0,145</tspan></text><rect x="581.482" y="335.1" width="78.138" height="39.9" rx="3" fill="#c0432f"/><text x="620.551" y="329.1" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="620.551" dy="0">0,114</tspan></text><text x="579.482" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="579.482" dy="0">Falsas alarmas (FPR)</tspan></text><rect x="699.689" y="165" width="78.138" height="210" rx="3" fill="#102a43"/><text x="738.758" y="159" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="738.758" dy="0">0,600</tspan></text><rect x="781.827" y="119.85" width="78.138" height="255.15" rx="3" fill="#c0432f"/><text x="820.896" y="113.85" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="820.896" dy="0">0,729</tspan></text><text x="779.827" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="779.827" dy="0">Precisión</tspan></text><rect x="10" y="427" width="880" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="450" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">La tasa de marcados es casi igual y el recall y la precisión difieren en sentidos opuestos. Igualar la tasa con</tspan></text><text x="450" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">umbrales por grupo (0,400 y 0,408) dejó el recall en 0,655 y 0,583 y la precisión en 0,600 y 0,733: igualar una medida</tspan></text><text x="450" y="485.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">no iguala las otras. El grupo es una columna del generador.</tspan></text><text x="450" y="532.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">Modelo sintético con parámetros del autor y semilla fija 46; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
