<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 421" width="940" height="421" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Horas hasta la primera alerta tras la falla, por falla inyectada y por monitor</title><desc id="d">Mapa de calor con las horas hasta la primera alerta tras la falla por monitor: unidad distinta 0 horas con la validación de entrada, 4 con el PSI de entradas, 11 con el PSI del puntaje y 51 con el AUC con etiquetas; nulos 0 y 53, con los dos PSI sin alertar; deriva de covariables 8 y 20 con los PSI, sin alerta de validación ni de AUC; deriva de concepto 57 solo con el AUC con etiquetas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="421" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Horas hasta la primera alerta tras la falla, por falla inyectada y por monitor</tspan></text><text x="302.25" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="302.25" dy="0">Validación de entrada</tspan></text><text x="478.75" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="478.75" dy="0">PSI de entradas</tspan></text><text x="655.25" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="655.25" dy="0">PSI del puntaje</tspan></text><text x="831.75" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="831.75" dy="0">AUC con etiquetas</tspan></text><text x="204" y="101.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="204" dy="0">Unidad distinta</tspan></text><text x="204" y="151.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="204" dy="0">Nulos en el historial</tspan></text><text x="204" y="201.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="204" dy="0">Deriva de covariables</tspan></text><text x="204" y="251.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="204" dy="0">Deriva de concepto</tspan></text><rect x="215.5" y="73.5" width="173.5" height="47" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="302.25" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="302.25" dy="0">0</tspan></text><rect x="392" y="73.5" width="173.5" height="47" rx="4" fill="#f7d9d2" stroke="#ffffff" stroke-width="1"/><text x="478.75" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="478.75" dy="0">4</tspan></text><rect x="568.5" y="73.5" width="173.5" height="47" rx="4" fill="#f0c6be" stroke="#ffffff" stroke-width="1"/><text x="655.25" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="655.25" dy="0">11</tspan></text><rect x="745" y="73.5" width="173.5" height="47" rx="4" fill="#c95b49" stroke="#ffffff" stroke-width="1"/><text x="831.75" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="831.75" dy="0">51</tspan></text><rect x="215.5" y="123.5" width="173.5" height="47" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="302.25" y="151.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="302.25" dy="0">0</tspan></text><rect x="392" y="123.5" width="173.5" height="47" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><text x="478.75" y="151.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="478.75" dy="0">—</tspan></text><rect x="568.5" y="123.5" width="173.5" height="47" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><text x="655.25" y="151.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="655.25" dy="0">—</tspan></text><rect x="745" y="123.5" width="173.5" height="47" rx="4" fill="#c75643" stroke="#ffffff" stroke-width="1"/><text x="831.75" y="151.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="831.75" dy="0">53</tspan></text><rect x="215.5" y="173.5" width="173.5" height="47" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><text x="302.25" y="201.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="302.25" dy="0">—</tspan></text><rect x="392" y="173.5" width="173.5" height="47" rx="4" fill="#f3cfc7" stroke="#ffffff" stroke-width="1"/><text x="478.75" y="201.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="478.75" dy="0">8</tspan></text><rect x="568.5" y="173.5" width="173.5" height="47" rx="4" fill="#e7aea4" stroke="#ffffff" stroke-width="1"/><text x="655.25" y="201.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="655.25" dy="0">20</tspan></text><rect x="745" y="173.5" width="173.5" height="47" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><text x="831.75" y="201.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="831.75" dy="0">—</tspan></text><rect x="215.5" y="223.5" width="173.5" height="47" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><text x="302.25" y="251.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="302.25" dy="0">—</tspan></text><rect x="392" y="223.5" width="173.5" height="47" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><text x="478.75" y="251.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="478.75" dy="0">—</tspan></text><rect x="568.5" y="223.5" width="173.5" height="47" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><text x="655.25" y="251.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="655.25" dy="0">—</tspan></text><rect x="745" y="223.5" width="173.5" height="47" rx="4" fill="#c34b38" stroke="#ffffff" stroke-width="1"/><text x="831.75" y="251.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="831.75" dy="0">57</tspan></text><text x="214" y="298" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="214" dy="0">0</tspan></text><rect x="229.54" y="286" width="30.5" height="14" fill="#fbe4de"/><rect x="259.54" y="286" width="30.5" height="14" fill="#f3cdc5"/><rect x="289.54" y="286" width="30.5" height="14" fill="#eab6ac"/><rect x="319.54" y="286" width="30.5" height="14" fill="#e29f93"/><rect x="349.54" y="286" width="30.5" height="14" fill="#d9887a"/><rect x="379.54" y="286" width="30.5" height="14" fill="#d17161"/><rect x="409.54" y="286" width="30.5" height="14" fill="#c85a48"/><rect x="439.54" y="286" width="30.5" height="14" fill="#c0432f"/><text x="477.54" y="298" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="477.54" dy="0">60</tspan></text><text x="500.62" y="298" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="500.62" dy="0">más oscuro = mayor (horas hasta la primera alerta (raya: nunca alertó))</tspan></text><rect x="10" y="314" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="338.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Catorce días simulados con 400 decisiones por hora y la falla a los siete; etiquetas con 48 horas de retraso. Cada monitor</tspan></text><text x="470" y="355.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">deja sin ver al menos una falla, y la deriva de concepto solo la ve el monitor más lento. Los umbrales son del autor.</tspan></text><text x="470" y="403.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo sintético con parámetros del autor y semilla fija 46; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
