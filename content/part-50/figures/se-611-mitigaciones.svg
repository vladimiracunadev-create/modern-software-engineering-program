<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 346" width="940" height="346" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dos mitigaciones de la falla de unidad: AUC del modelo degradado frente al AUC con cada mitigación</title><desc id="d">Mancuernas con el AUC durante la falla de unidad sin mitigar y con dos mitigaciones: con el respaldo por reglas pasa de 0,791 a 0,752, que es peor, y con la conversión de unidad corregida pasa de 0,791 a 0,849, igual que antes de la falla.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="346" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dos mitigaciones de la falla de unidad: AUC del modelo degradado frente al AUC con cada mitigación</tspan></text><circle cx="22" cy="51" r="6" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Modelo degradado</tspan></text><circle cx="190.64" cy="51" r="6" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="204.64" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="204.64" dy="0">Con la mitigación</tspan></text><line x1="382.3" y1="77" x2="382.3" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="382.3" y1="165" x2="382.3" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="382.3" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382.3" dy="0">0</tspan></text><line x1="464.908" y1="77" x2="464.908" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="464.908" y1="165" x2="464.908" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="464.908" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="464.908" dy="0">0,2</tspan></text><line x1="547.516" y1="77" x2="547.516" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="547.516" y1="165" x2="547.516" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="547.516" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547.516" dy="0">0,4</tspan></text><line x1="630.124" y1="77" x2="630.124" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="630.124" y1="165" x2="630.124" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="630.124" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="630.124" dy="0">0,6</tspan></text><line x1="712.732" y1="77" x2="712.732" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="712.732" y1="165" x2="712.732" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="712.732" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="712.732" dy="0">0,8</tspan></text><line x1="795.34" y1="77" x2="795.34" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="795.34" y1="165" x2="795.34" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="795.34" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="795.34" dy="0">1</tspan></text><line x1="382.3" y1="165" x2="795.34" y2="165" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="103.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Caer a la regla de respaldo</tspan></text><text x="314" y="139" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Corregir la conversión de unidad en el</tspan></text><text x="314" y="156" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">servicio</tspan></text><line x1="709.015" y1="99" x2="692.906" y2="99" stroke="#c0432f" stroke-width="4"/><circle cx="709.015" cy="99" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="692.906" cy="99" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="721.015" y="103.5" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="721.015" dy="0">0,791</tspan></text><text x="680.906" y="103.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="680.906" dy="0">0,752</tspan></text><text x="926" y="103.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">-0,039</tspan></text><line x1="709.015" y1="143" x2="732.971" y2="143" stroke="#087f8c" stroke-width="4"/><circle cx="709.015" cy="143" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="732.971" cy="143" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="697.015" y="147.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="697.015" dy="0">0,791</tspan></text><text x="744.971" y="147.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="744.971" dy="0">0,849</tspan></text><text x="926" y="147.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">+0,058</tspan></text><text x="588.82" y="209" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="588.82" dy="0">AUC en las 48 horas siguientes a la falla</tspan></text><rect x="10" y="223" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="247.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">La regla usa dos de las seis características y la falla afecta a una: el modelo degradado conservaba la señal de las otras</tspan></text><text x="470" y="264.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">cinco y era mejor que la regla. Corregir la causa devolvió el AUC de 0,849 anterior a la falla. La regla sigue siendo el</tspan></text><text x="470" y="281.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">plan para una falla que inutilice el modelo entero.</tspan></text><text x="470" y="328.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo sintético con parámetros del autor y semilla fija 46; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
