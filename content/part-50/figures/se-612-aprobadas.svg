<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 390" width="940" height="390" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Comprobaciones que pasa cada variante frente a las once que exige la puerta</title><desc id="d">Barras con las comprobaciones aprobadas por cada variante frente a las once que exige la puerta: completa 11, sin rollback verificable 10, monitor con umbral inalcanzable 10 y sin guarda, dueño ni ficha completa 8.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="390" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Comprobaciones que pasa cada variante frente a las once que exige la puerta</tspan></text><line x1="274" y1="49" x2="274" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="225" x2="274" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0</tspan></text><line x1="399.176" y1="49" x2="399.176" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="399.176" y1="225" x2="399.176" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="399.176" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="399.176" dy="0">2,5</tspan></text><line x1="524.352" y1="49" x2="524.352" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="524.352" y1="225" x2="524.352" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="524.352" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="524.352" dy="0">5</tspan></text><line x1="649.528" y1="49" x2="649.528" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="649.528" y1="225" x2="649.528" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="649.528" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="649.528" dy="0">7,5</tspan></text><line x1="774.704" y1="49" x2="774.704" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="774.704" y1="225" x2="774.704" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="774.704" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="774.704" dy="0">10</tspan></text><line x1="899.88" y1="49" x2="899.88" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="899.88" y1="225" x2="899.88" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="899.88" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="899.88" dy="0">12,5</tspan></text><line x1="274" y1="225" x2="899.88" y2="225" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="75.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Completa</tspan></text><text x="264" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Sin rollback verificable</tspan></text><text x="264" y="163.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Monitor con umbral inalcanzable</tspan></text><text x="264" y="199" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Sin guarda, dueño ni ficha</tspan></text><text x="264" y="216" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">completa</tspan></text><rect x="274" y="55" width="550.774" height="32" rx="3" fill="#102a43"/><text x="831.774" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="831.774" dy="0">11</tspan></text><rect x="274" y="99" width="500.704" height="32" rx="3" fill="#102a43"/><text x="781.704" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="781.704" dy="0">10</tspan></text><rect x="274" y="143" width="500.704" height="32" rx="3" fill="#102a43"/><text x="781.704" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="781.704" dy="0">10</tspan></text><rect x="274" y="187" width="400.563" height="32" rx="3" fill="#102a43"/><text x="681.563" y="207.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="681.563" dy="0">8</tspan></text><line x1="824.774" y1="49" x2="824.774" y2="225" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="829.774" y="62" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="829.774" dy="0">Exigidas por la puerta</tspan></text><text x="586.94" y="269" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="586.94" dy="0">Comprobaciones aprobadas de 11</tspan></text><rect x="10" y="283" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="307.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Dos variantes quedan a una sola comprobación del umbral y aun así se bloquean: un sistema casi completo no es un sistema</tspan></text><text x="470" y="324.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">operable. El recuento no dice qué comprobación falta ni cuánto pesa; la puerta exige todas.</tspan></text><text x="470" y="372.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9, numpy 2.4.4 y scikit-learn 1.8.0; los recuentos con semilla se repiten y los tiempos varían de un equipo a otro.</tspan></text></svg>
