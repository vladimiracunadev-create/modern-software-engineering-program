.5" width="153.5" height="31" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="372.25" y="450.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="372.25" dy="0">pasa</tspan></text><rect x="452" y="430.5" width="153.5" height="31" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="528.75" y="450.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="528.75" dy="0">pasa</tspan></text><rect x="608.5" y="430.5" width="153.5" height="31" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="685.25" y="450.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="685.25" dy="0">pasa</tspan></text><rect x="765" y="430.5" width="153.5" height="31" rx="4" fill="#dff1ee" stroke="#102a43" stroke-width="3"/><text x="841.75" y="450.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="841.75" dy="0">falla</tspan></text><text x="294" y="489" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="294" dy="0">falla</tspan></text><rect x="339.7" y="477" width="30.5" height="14" fill="#dff1ee"/><rect x="369.7" y="477" width="30.5" height="14" fill="#c0e1e0"/><rect x="399.7" y="477" width="30.5" height="14" fill="#a2d0d2"/><rect x="429.7" y="477" width="30.5" height="14" fill="#83c0c4"/><rect x="459.7" y="477" width="30.5" height="14" fill="#64b0b6"/><rect x="489.7" y="477" width="30.5" height="14" fill="#45a0a8"/><rect x="519.7" y="477" width="30.5" height="14" fill="#278f9a"/><rect x="549.7" y="477" width="30.5" height="14" fill="#087f8c"/><text x="587.7" y="489" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="587.7" dy="0">pasa</tspan></text><text x="625.86" y="489" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="625.86" dy="0">más oscuro = mayor (1 pasa, 0 falla)</tspan></text><rect x="10" y="505" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="529.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cada variante falla exactamente donde se sembró su defecto, y la puerta bloquea con el motivo. El monitor con umbral 5,0</tspan></text><text x="470" y="546.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">pasaría una revisión documental (existe, tiene umbral) y solo lo delata la comprobación que lo dispara. Cuatro variantes</tspan></text><text x="470" y="563.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">del autor, cada una con defectos conocidos.</tspan></text><text x="470" y="610.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9, numpy 2.4.4 y scikit-learn 1.8.0; los recuentos con semilla se repiten y los tiempos varían de un equipo a otro.</tspan></text></svg>
