<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 628" width="940" height="628" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Las once comprobaciones de la puerta de liberación frente a cuatro variantes del proyecto</title><desc id="d">Mapa de calor con las once comprobaciones de la puerta y cuatro variantes del proyecto: la completa pasa todas; sin rollback verificable falla solo el rollback exacto; el monitor con umbral inalcanzable falla solo la alerta de deriva probada; sin guarda, dueño ni ficha completa falla tres comprobaciones.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="628" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Las once comprobaciones de la puerta de liberación frente a cuatro variantes del proyecto</tspan></text><text x="372.25" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="372.25" dy="0">Completa</tspan></text><text x="528.75" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="528.75" dy="0">Sin rollback</tspan></text><text x="528.75" y="77" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="528.75" dy="0">verificable</tspan></text><text x="685.25" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="685.25" dy="0">Monitor con umbral</tspan></text><text x="685.25" y="77" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="685.25" dy="0">inalcanzable</tspan></text><text x="841.75" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="841.75" dy="0">Sin guarda, dueño ni</tspan></text><text x="841.75" y="77" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="841.75" dy="0">ficha completa</tspan></text><text x="284" y="110.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="284" dy="0">Huella del modelo coincide</tspan></text><text x="284" y="144.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="284" dy="0">Reproducible bit a bit</tspan></text><text x="284" y="178.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="284" dy="0">AUC de al menos 0,80</tspan></text><text x="284" y="204" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="284" dy="0">Brecha entre segmentos de 0,05 o</tspan></text><text x="284" y="221" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="284" dy="0">menos</tspan></text><text x="284" y="246.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="284" dy="0">Rollback exacto</tspan></text><text x="284" y="280.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="284" dy="0">Alerta de deriva probada</tspan></text><text x="284" y="314.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="284" dy="0">Sin falsa alarma</tspan></text><text x="284" y="348.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="284" dy="0">Validación bloquea la unidad errónea</tspan></text><text x="284" y="382.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="284" dy="0">Guarda de canary por segmento</tspan></text><text x="284" y="416.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="284" dy="0">Ficha con 10 campos</tspan></text><text x="284" y="450.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="284" dy="0">Dueño en el runbook</tspan></text><rect x="295.5" y="90.5" width="153.5" height="31" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="372.25" y="110.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="372.25" dy="0">pasa</tspan></text><rect x="452" y="90.5" width="153.5" height="31" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="528.75" y="110.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="528.75" dy="0">pasa</tspan></text><rect x="608.5" y="90.5" width="153.5" height="31" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="685.25" y="110.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="685.25" dy="0">pasa</tspan></text><rect x="765" y="90.5" width="153.5" height="31" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="841.75" y="110.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="841.75" dy="0">pasa</tspan></text><rect x="295.5" y="124.5" width="153.5" height="31" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="372.25" y="144.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="372.25" dy="0">pasa</tspan></text><rect x="452" y="124.5" width="153.5" height="31" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="528.75" y="144.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="528.75" dy="0">pasa</tspan></text><rect x="608.5" y="124.5" width="153.5" height="31" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="685.25" y="144.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="685.25" dy="0">pasa</tspan></text><rect x="765" y="124.5" width="153.5" height="31" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="841.75" y="144.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan