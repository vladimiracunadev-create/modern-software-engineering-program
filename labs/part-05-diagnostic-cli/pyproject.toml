[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "msep-diagnostic-cli"
version = "0.1.0"
description = "CLI educativa que materializa una especificación diagnóstica contrastable"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
diagnostic-cli = "diagnostic_cli.cli:entrypoint"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
