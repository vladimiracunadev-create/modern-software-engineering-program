<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 783 203" width="783" height="203" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Estructura interna» … «Feedback»</title><desc id="d">Diagrama de flujo con 5 pasos. «Estructura interna» lleva a «Comportamiento». «Comportamiento» lleva a «Resultado en contexto». «Usuarios, tareas y entorno» lleva a «Resultado en contexto». «Resultado en contexto» lleva a «Feedback». «Feedback» lleva a «Estructura interna».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="783" height="203" fill="#ffffff"/><path d="M207,109.5 L229.8,109.5 Q238.8,109.5 238.8,100.5 L238.8,69.0 Q238.8,60 247.8,60.0 L270.5,60" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M420.5,60 L443.2,60.0 Q452.2,60 452.2,69.0 L452.2,96.2 Q452.2,105.2 461.2,105.2 L484,105.2" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M438,150.5 L452.0,150.5 Q461,150.5 461.0,141.5 L461.0,114.2 Q461,105.2 470.0,105.2 L484,105.2" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M617,105.2 L663,105.2" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M712,83.2 L712.0,33.0 Q712,24 703.0,24.0 L123.5,24.0 Q114.5,24 114.5,33.0 L114.5,87.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="87.5" width="185" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="114.5" y="113.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="114.5" dy="0">Estructura interna</tspan></text><rect x="270.5" y="38" width="150" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="345.5" y="64.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="345.5" dy="0">Comportamiento</tspan></text><rect x="484" y="74.7" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="550.5" y="99.8" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="550.5" dy="0">Resultado en</tspan><tspan x="550.5" dy="19.2">contexto</tspan></text><rect x="253" y="120" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="345.5" y="145.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="345.5" dy="0">Usuarios, tareas y</tspan><tspan x="345.5" dy="19.2">entorno</tspan></text><rect x="663" y="83.2" width="98" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="712" y="109.4" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="712" dy="0">Feedback</tspan></text></svg>
