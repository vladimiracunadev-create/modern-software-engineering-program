<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 473 854" width="473" height="854" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Compilación» … «Reversión»</title><desc id="d">Diagrama de flujo con 10 pasos. «Compilación» lleva a «Artefacto». «Artefacto» lleva a «Resumen y firma». «Artefacto» lleva a «Canal de entrega». «Canal de entrega» lleva a «Descarga a temporal». «Descarga a temporal» lleva a «¿Verifica?». «¿Verifica?» lleva a «Reemplazo atómico» (sí). «¿Verifica?» lleva a «Rechazo y aviso» (no). «Reemplazo atómico» lleva a «Escalón de despliegue». «Escalón de despliegue» lleva a «Reversión» (falla).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="473" height="854" fill="#ffffff"/><path d="M262.2,66 L262.2,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M262.2,168 L262.2,188.0 Q262.2,197 253.2,197.0 L177.7,197.0 Q168.7,197 168.7,206.0 L168.7,226" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M262.2,168 L262.2,188.0 Q262.2,197 271.2,197.0 L357.2,197.0 Q366.2,197 366.2,206.0 L366.2,226" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M366.2,270 L366.2,290.0 Q366.2,299 357.2,299.0 L312.0,299.0 Q303,299 303.0,308.0 L303,328" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M303,389 L303.0,409.0 Q303,418 294.0,418.0 L250.3,418.0 Q241.3,418 241.3,427.0 L241.3,447" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M241.3,509 L241.3,517.0 Q241.3,525 233.3,525.0 L119.0,525.0 Q110,525 110.0,534.0 L110,567" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M241.3,509 L241.3,517.0 Q241.3,525 249.3,525.0 L302.5,525.0 Q311.5,525 311.5,534.0 L311.5,567" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M113.2,611 L113.2,669" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M118.8,730 L118.8,788" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="200.2" y="22" width="124" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="262.2" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="262.2" dy="0">Compilación</tspan></text><rect x="208.7" y="124" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="262.2" y="150.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="262.2" dy="0">Artefacto</tspan></text><rect x="89.2" y="226" width="159" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="168.7" y="252.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="168.7" dy="0">Resumen y firma</tspan></text><rect x="282.2" y="226" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="366.2" y="252.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="366.2" dy="0">Canal de entrega</tspan></text><rect x="245.5" y="328" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="303" y="353.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="303" dy="0">Descarga a</tspan><tspan x="303" dy="19.2">temporal</tspan></text><polygon points="241.3,447 311.8,478 241.3,509 170.8,478" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="241.3" y="482.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="241.3" dy="0">¿Verifica?</tspan></text><rect x="22" y="567" width="176" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="110" y="593.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">Reemplazo atómico</tspan></text><rect x="232" y="567" width="159" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="311.5" y="593.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="311.5" dy="0">Rechazo y aviso</tspan></text><rect x="58.9" y="669" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="116.4" y="694.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="116.4" dy="0">Escalón de</tspan><tspan x="116.4" dy="19.2">despliegue</tspan></text><rect x="67.7" y="788" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="121.2" y="814.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="121.2" dy="0">Reversión</tspan></text><rect x="116" y="534" width="29" height="24" rx="4" fill="#ffffff"/><text x="130.5" y="549.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="130.5" dy="0">sí</tspan></text><rect x="317.5" y="534" width="29" height="24" rx="4" fill="#ffffff"/><text x="332" y="549.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="332" dy="0">no</tspan></text><rect x="124.8" y="747" width="53" height="24" rx="4" fill="#ffffff"/><text x="151.3" y="762.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="151.3" dy="0">falla</tspan></text></svg>
