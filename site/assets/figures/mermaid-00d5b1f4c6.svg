<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 365 961" width="365" height="961" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Control aparente» … «Regresión en integración continua»</title><desc id="d">Diagrama de flujo con 9 pasos. «Control aparente» lleva a «Qué dato usa y quién lo controla». «Qué dato usa y quién lo controla» lleva a «Hipótesis de ruptura». «Hipótesis de ruptura» lleva a «Entradas que atacan el control». «Entradas que atacan el control» lleva a «Explotación confirmada» (elude). «Entradas que atacan el control» lleva a «Hipótesis refutada, nueva hipótesis» (no elude). «Explotación confirmada» lleva a «Reparar la causa». «Reparar la causa» lleva a «Prueba que falla antes y pasa después». «Prueba que falla antes y pasa después» lleva a «Regresión en integración continua».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="365" height="961" fill="#ffffff"/><path d="M208.2,66 L208.2,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M208.2,185 L208.2,209.1 Q208.2,214 203.3,214.0 L203.3,214.0 Q198.4,214 198.4,218.9 L198.4,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M198.4,304 L198.4,325.2 Q198.4,333 190.7,333.0 L190.7,333.0 Q182.9,333 182.9,340.8 L182.9,362" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M182.9,423 L182.9,431.0 Q182.9,439 174.9,439.0 L93.0,439.0 Q84,439 84.0,448.0 L84,490.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M182.9,423 L182.9,431.0 Q182.9,439 190.9,439.0 L250.5,439.0 Q259.5,439 259.5,448.0 L259.5,481" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M84,551.5 L84.0,576.2 Q84,585.2 93.0,585.2 L100.3,585.2 Q109.3,585.2 109.3,594.2 L109.3,619" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M109.3,663 L109.3,683.0 Q109.3,692 118.3,692.0 L121.2,692.0 Q130.2,692 130.2,701.0 L130.2,721" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M130.2,801 L130.2,824.6 Q130.2,830 135.6,830.0 L135.6,830.0 Q141,830 141.0,835.4 L141,859" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="124.2" y="22" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="208.2" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="208.2" dy="0">Control aparente</tspan></text><rect x="120.2" y="124" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="208.2" y="149.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="208.2" dy="0">Qué dato usa y</tspan><tspan x="208.2" dy="19.2">quién lo controla</tspan></text><rect x="131.9" y="243" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="198.4" y="268.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="198.4" dy="0">Hipótesis de</tspan><tspan x="198.4" dy="19.2">ruptura</tspan></text><rect x="94.9" y="362" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="182.9" y="387.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="182.9" dy="0">Entradas que</tspan><tspan x="182.9" dy="19.2">atacan el control</tspan></text><rect x="22" y="490.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="84" y="515.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="84" dy="0">Explotación</tspan><tspan x="84" dy="19.2">confirmada</tspan></text><rect x="180" y="481" width="159" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="259.5" y="506" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="259.5" dy="0">Hipótesis</tspan><tspan x="259.5" dy="19.2">refutada, nueva</tspan><tspan x="259.5" dy="19.2">hipótesis</tspan></text><rect x="25.3" y="619" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="109.3" y="645.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="109.3" dy="0">Reparar la causa</tspan></text><rect x="46.2" y="721" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="130.2" y="746" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="130.2" dy="0">Prueba que falla</tspan><tspan x="130.2" dy="19.2">antes y pasa</tspan><tspan x="130.2" dy="19.2">después</tspan></text><rect x="74.5" y="859" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="141" y="884" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="141" dy="0">Regresión en</tspan><tspan x="141" dy="19.2">integración</tspan><tspan x="141" dy="19.2">continua</tspan></text><rect x="90" y="452.8" width="53" height="24" rx="4" fill="#ffffff"/><text x="116.5" y="468.7" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="116.5" dy="0">elude</tspan></text><rect x="265.5" y="448" width="77" height="24" rx="4" fill="#ffffff"/><text x="304" y="463.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="304" dy="0">no elude</tspan></text></svg>
