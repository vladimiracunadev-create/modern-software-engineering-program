<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 803" width="540" height="803" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Edición local» … «Paquete y validador»</title><desc id="d">Diagrama de flujo con 9 pasos. «Edición local» lleva a «Registro de operaciones». «Registro de operaciones» lleva a «Envío con identificador». «Envío con identificador» lleva a «Canal con fallos». «Canal con fallos» lleva a «Reintento» (pérdida). «Canal con fallos» lleva a «Deduplicación por identificador» (duplicado). «Canal con fallos» lleva a «Aplicación idempotente» (desorden). «Reintento» lleva a «Estado del servidor». «Deduplicación por identificador» lleva a «Estado del servidor». «Aplicación idempotente» lleva a «Estado del servidor». «Estado del servidor» lleva a «Paquete y validador». «Paquete y validador» lleva a «Edición local» (hallazgo).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="540" height="803" fill="#ffffff"/><path d="M254.4,66 L254.4,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M254.3,185 L254.3,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M254,304 L254,362" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M253.9,424 L253.9,432.0 Q253.9,440 245.9,440.0 L84.5,440.0 Q75.5,440 75.5,449.0 L75.5,490.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M252.5,424 L252.5,482" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M253.9,424 L253.9,432.0 Q253.9,440 261.9,440.0 L426.0,440.0 Q435,440 435.0,449.0 L435,482" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M75.5,534.5 L75.5,558.8 Q75.5,567.8 84.5,567.8 L244.8,567.8 Q253.8,567.8 253.8,576.8 L253.8,601" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M252.4,543 L252.4,601" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M435,543 L435.0,563.0 Q435,572 426.0,572.0 L262.8,572.0 Q253.8,572 253.8,581.0 L253.8,601" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M253.8,662 L253.8,720" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M307.3,750.5 L350.0,750.5 Q359,750.5 359.0,741.5 L359.0,446.7 Q359,438 367.7,438.0 L367.7,438.0 Q376.4,438 376.4,429.3 L376.4,53.0 Q376.4,44 367.4,44.0 L325.4,44" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="183.4" y="22" width="142" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="254.4" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="254.4" dy="0">Edición local</tspan></text><rect x="192.4" y="124" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="254.4" y="149.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="254.4" dy="0">Registro de</tspan><tspan x="254.4" dy="19.2">operaciones</tspan></text><rect x="183.2" y="243" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="254.2" y="268.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="254.2" dy="0">Envío con</tspan><tspan x="254.2" dy="19.2">identificador</tspan></text><polygon points="253.9,362 362.4,393 253.9,424 145.4,393" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="253.9" y="397.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="253.9" dy="0">Canal con fallos</tspan></text><rect x="22" y="490.5" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="75.5" y="516.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="75.5" dy="0">Reintento</tspan></text><rect x="163" y="482" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="251" y="507.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="251" dy="0">Deduplicación por</tspan><tspan x="251" dy="19.2">identificador</tspan></text><rect x="373" y="482" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="435" y="507.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="435" dy="0">Aplicación</tspan><tspan x="435" dy="19.2">idempotente</tspan></text><rect x="196.3" y="601" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="253.8" y="626.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="253.8" dy="0">Estado del</tspan><tspan x="253.8" dy="19.2">servidor</tspan></text><rect x="200.3" y="720" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="253.8" y="745.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="253.8" dy="0">Paquete y</tspan><tspan x="253.8" dy="19.2">validador</tspan></text><rect x="81.5" y="453.2" width="69" height="24" rx="4" fill="#ffffff"/><text x="116" y="469.1" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="116" dy="0">pérdida</tspan></text><rect x="258.5" y="441" width="86" height="24" rx="4" fill="#ffffff"/><text x="301.5" y="456.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="301.5" dy="0">duplicado</tspan></text><rect x="441" y="449" width="77" height="24" rx="4" fill="#ffffff"/><tex