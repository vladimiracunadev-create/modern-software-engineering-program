<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 783 362" width="783" height="362" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Módulo de WebAssembly» … «Proyecto: plataforma con evidencia»</title><desc id="d">Diagrama de flujo con 12 pasos. «Módulo de WebAssembly» lleva a «Servidor, borde y componentes». «Servidor, borde y componentes» lleva a «eBPF en el núcleo». «eBPF en el núcleo» lleva a «Aceleradores: modelo». «Aceleradores: modelo» lleva a «Aceleradores: costo». «Aceleradores: costo» lleva a «Fronteras de aislamiento». «Fronteras de aislamiento» lleva a «Hardware seguro y atestación». «Hardware seguro y atestación» lleva a «Computación cuántica». «Computación cuántica» lleva a «Criptografía poscuántica». «Criptografía poscuántica» lleva a «Confianza cero». «Confianza cero» lleva a «Taller: batería hostil». «Taller: batería hostil» lleva a «Proyecto: plataforma con evidencia». «Proyecto: plataforma con evidencia» lleva a «Fronteras de aislamiento» (incidente o cambio de supuesto).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="783" height="362" fill="#ffffff"/><path d="M150.5,52.5 L201,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M360,52.5 L428,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M543,52.5 L615,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M686,83 L686,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M615,171.5 L552,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M419,171.5 L360,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M201,171.5 L150.5,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M88.5,202 L88.5,269.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M155,300 L205.5,300" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M355.5,300 L406,300" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M565,300 L611,300" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M686,260 L686.0,225.0 Q686,216 677.0,216.0 L492.5,216.0 Q485.5,216 485.5,209.0 L485.5,202" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="26.5" y="22" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="88.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="88.5" dy="0">Módulo de</tspan><tspan x="88.5" dy="19.2">WebAssembly</tspan></text><rect x="201" y="22" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="280.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="280.5" dy="0">Servidor, borde</tspan><tspan x="280.5" dy="19.2">y componentes</tspan></text><rect x="428" y="22" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="485.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="485.5" dy="0">eBPF en el</tspan><tspan x="485.5" dy="19.2">núcleo</tspan></text><rect x="615" y="22" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="686" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="686" dy="0">Aceleradores:</tspan><tspan x="686" dy="19.2">modelo</tspan></text><rect x="615" y="141" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="686" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="686" dy="0">Aceleradores:</tspan><tspan x="686" dy="19.2">costo</tspan></text><rect x="419" y="141" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="485.5" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="485.5" dy="0">Fronteras de</tspan><tspan x="485.5" dy="19.2">aislamiento</tspan></text><rect x="201" y="141" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="280.5" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="280.5" dy="0">Hardware seguro</tspan><tspan x="280.5" dy="19.2">y atestación</tspan></text><rect x="26.5" y="141" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="88.5" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="88.5" dy="0">Computación</tspan><tspan x="88.5" dy="19.2">cuántica</tspan></text><rect x="22" y="269.5" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="88.5" y="294.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="88.5" dy="0">Criptografía</tspan><tspan x="88.5" dy="19.2">poscuántica</tspan></text><rect x="205.5" y="278" width="150" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="280.5" y="304.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="280.5" dy="0">Confianza cero</tspan></text><rect x="406" y="269.5" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="485.5" y="294.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="485.5" dy="0">Taller: batería</tspan><tspan x="485.5" dy="19.2">hostil</tspan></text><rect x="611" y="260" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="686" y="285" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="686" dy="0">Proyecto:</tspan><tspan x="686" dy="19.2">plataforma con</tspan><tspan x="686" dy="19.2">evidencia</tspan></text><rect x="498.8" y="206" width="102" height="60" rx="4" fill="#ffffff"/><text x="549.8" y="221.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="549.8" dy="0">incidente o</tspan><tspan x="549.8" dy="17.92">cambio de</tspan><tspan x="549.8" dy="17.92">supuesto</tspan></text></svg>
