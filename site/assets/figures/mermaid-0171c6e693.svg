<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 766 281" width="766" height="281" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Primer plano» … «Restaurar desde disco»</title><desc id="d">Diagrama de flujo con 5 pasos. «Primer plano» lleva a «Segundo plano» (usuario cambia de app). «Segundo plano» lleva a «Suspendido» (inactividad). «Suspendido» lleva a «Terminado sin aviso» (sistema recupera memoria). «Segundo plano» lleva a «Primer plano» (vuelve). «Suspendido» lleva a «Primer plano» (vuelve). «Terminado sin aviso» lleva a «Restaurar desde disco» (arranque en frío). «Restaurar desde disco» lleva a «Primer plano».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="766" height="281" fill="#ffffff"/><path d="M155,86 L313.5,86" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M455.5,86 L603.5,86" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M661,108 L661,198" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M590,228.5 L464,228.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M384.5,64 L384.5,57.0 Q384.5,50 377.5,50.0 L95.5,50.0 Q88.5,50 88.5,57.0 L88.5,64" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><path d="M661,64 L661.0,57.0 Q661,50 654.0,50.0 L478.5,50.0 Q469.5,50 469.5,59.0 L469.5,113.0 Q469.5,122 460.5,122.0 L95.5,122.0 Q88.5,122 88.5,115.0 L88.5,108" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><path d="M305,228.5 L178.0,228.5 Q169,228.5 169.0,219.5 L169.0,93.0 Q169,86 162.0,86.0 L155,86" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="64" width="133" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="88.5" y="90.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="88.5" dy="0">Primer plano</tspan></text><rect x="313.5" y="64" width="142" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="384.5" y="90.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="384.5" dy="0">Segundo plano</tspan></text><rect x="603.5" y="64" width="115" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="661" y="90.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="661" dy="0">Suspendido</tspan></text><rect x="590" y="198" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="661" y="223.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="661" dy="0">Terminado sin</tspan><tspan x="661" dy="19.2">aviso</tspan></text><rect x="305" y="198" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="384.5" y="223.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="384.5" dy="0">Restaurar desde</tspan><tspan x="384.5" dy="19.2">disco</tspan></text><rect x="171.2" y="65" width="126" height="42" rx="4" fill="#ffffff"/><text x="234.2" y="80.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="234.2" dy="0">usuario cambia</tspan><tspan x="234.2" dy="17.92">de app</tspan></text><rect x="478.5" y="58" width="102" height="24" rx="4" fill="#ffffff"/><text x="529.5" y="73.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="529.5" dy="0">inactividad</tspan