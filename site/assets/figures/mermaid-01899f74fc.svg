<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 322" width="810" height="322" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Elementos de trabajo» y «Orden de entrega» … «Fecha con rango»</title><desc id="d">Diagrama de flujo con 8 pasos. «Elementos de trabajo» lleva a «Red de dependencias». «Red de dependencias» lleva a «Camino crítico con medianas». «Red de dependencias» lleva a «Distribución del plazo». «Dependencias externas» lleva a «Distribución del plazo». «Orden de entrega» lleva a «Valor al agotarse el tiempo». «Distribución del plazo» lleva a «Fecha con rango». «Valor al agotarse el tiempo» lleva a «Fecha con rango». «Fecha con rango» lleva a «Red de dependencias» (avance real).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="810" height="322" fill="#ffffff"/><path d="M172.5,120 L195.2,120.0 Q204.2,120 204.2,111.0 L204.2,61.5 Q204.2,52.5 213.2,52.5 L236,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M369,52.5 L387.5,52.5 Q396.5,52.5 396.5,61.5 L396.5,102.5 Q396.5,111.5 405.5,111.5 L424,111.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M369,52.5 L383.0,52.5 Q392,52.5 392.0,61.5 L392.0,201.5 Q392,210.5 401.0,210.5 L415,210.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M369,269.5 L383.0,269.5 Q392,269.5 392.0,260.5 L392.0,219.5 Q392,210.5 401.0,210.5 L415,210.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M190,210.5 L206.2,210.5 Q215.2,210.5 215.2,201.5 L215.2,170.0 Q215.2,161 224.2,161.0 L240.5,161" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M583,210.5 L629,210.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M364.5,161 L699.5,161.0 Q708.5,161 708.5,170.0 L708.5,188.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M708.5,232.5 L708.5,246.0 Q708.5,255 699.5,255.0 L387.5,255.0 Q378.5,255 378.5,246.0 L378.5,106.0 Q378.5,97 369.5,97.0 L309.5,97.0 Q302.5,97 302.5,90.0 L302.5,83" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="39.5" y="89.5" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="114.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Elementos de</tspan><tspan x="106" dy="19.2">trabajo</tspan></text><rect x="236" y="22" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="302.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="302.5" dy="0">Red de</tspan><tspan x="302.5" dy="19.2">dependencias</tspan></text><rect x="424" y="81" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="499" y="106.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="499" dy="0">Camino crítico</tspan><tspan x="499" dy="19.2">con medianas</tspan></text><rect x="415" y="180" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="499" y="205.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="499" dy="0">Distribución del</tspan><tspan x="499" dy="19.2">plazo</tspan></text><rect x="236" y="239" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="302.5" y="264.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="