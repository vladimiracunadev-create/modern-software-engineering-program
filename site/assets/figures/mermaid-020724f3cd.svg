<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 809 381" width="809" height="381" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Modelo conceptual, lógico y físico» … «Paquete de capa de datos»</title><desc id="d">Diagrama de flujo con 12 pasos. «Modelo conceptual, lógico y físico» lleva a «Modelos de almacenamiento». «Modelos de almacenamiento» lleva a «Transacciones y aislamiento». «Transacciones y aislamiento» lleva a «Restricciones e invariantes». «Restricciones e invariantes» lleva a «Consultas e índices». «Consultas e índices» lleva a «Migraciones compatibles». «Migraciones compatibles» lleva a «Replicación y partición». «Replicación y partición» lleva a «Cachés entre capas». «Cachés entre capas» lleva a «Respaldos y restauración». «Respaldos y restauración» lleva a «Privacidad y ciclo de vida». «Privacidad y ciclo de vida» lleva a «Taller de migración peligrosa». «Taller de migración peligrosa» lleva a «Paquete de capa de datos». «Paquete de capa de datos» lleva a «Modelo conceptual, lógico y físico» (incidente o hallazgo).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="809" height="381" fill="#ffffff"/><path d="M181,62 L227,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M377,62 L423,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M582,62 L628,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M707.5,92.5 L707.5,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M645.5,190.5 L564.5,190.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M440.5,190.5 L373,190.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M231,190.5 L168,190.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M101.5,221 L101.5,288.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M168,319 L231,319" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M373,319 L449,319" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M556,319 L628,319" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M707.5,288.5 L707.5,244.0 Q707.5,235 698.5,235.0 L191.0,235.0 Q182,235 182.0,226.0 L182.0,125.0 Q182,116 173.0,116.0 L108.5,116.0 Q101.5,116 101.5,109.0 L101.5,102" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="22" width="159" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101.5" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101.5" dy="0">Modelo</tspan><tspan x="101.5" dy="19.2">conceptual,</tspan><tspan x="101.5" dy="19.2">lógico y físico</tspan></text><rect x="227" y="31.5" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="302" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="302" dy="0">Modelos de</tspan><tspan x="302" dy="19.2">almacenamiento</tspan></text><rect x="423" y="31.5" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="502.5" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="502.5" dy="0">Transacciones y</tspan><tspan x="502.5" dy="19.2">aislamiento</tspan></text><rect x="628" y="31.5" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="707.5" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="707.5" dy="0">Restricciones e</tspan><tspan x="707.5" dy="19.2">invariantes</tspan></text><rect x="645.5" y="160" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="707.5" y="185.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="707.5" dy="0">Consultas e</tspan><tspan x="707.5" dy="19.2">índices</tspan></text><rect x="440.5" y="160" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="502.5" y="185.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="502.5" dy="0">Migraciones</tspan><tspan x="502.5" dy="19.2">compatibles</tspan></text><rect x="231" y="160" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="302" y="185.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="302" dy="0">Replicación y</tspan><tspan x="302" dy="19.2">partición</tspan></text><rect x="35" y="160" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101.5" y="185.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101.5" dy="0">Cachés entre</tspan><tspan x="101.5" dy="19.2">capas</tspan></text><rect x="35" y="288.5" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101.5" y="313.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101.5" dy="0">Respaldos y</tspan><tspan x="101.5" dy="19.2">restauración</tspan></text><rect x="231" y="288.5" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="302" y="313.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="302" dy="0">Privacidad y</tspan><tspan x="302" dy="19.2">ciclo de vida</tspan></text><rect x="449" y="279" width="107" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="502.5" y="304" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="502.5" dy="0">Taller de</tspan><tspan x="502.5" dy="19.2">migración</tspan><tspan x="502.5" dy="19.2">peligrosa</tspan></text><rect x="628" y="288.5" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="707.5" y="313.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="707.5" dy="0">Paquete de capa</tspan><tspan x="707.5" dy="19.2">de datos</tspan></text><rect x="341.2" y="239" width="102" height="42" rx="4" fill="#ffffff"/><text x="392.2" y="254.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="392.2" dy="0">incidente o</tspan><tspan x="392.2" dy="17.92">hallazgo</tspan></text></svg>
