<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 415 632" width="415" height="632" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Programa» y «Supervisor» … «Salida y recursos recuperados»</title><desc id="d">Diagrama de flujo con 8 pasos. «Programa» lleva a «Proceso creado». «Proceso creado» lleva a «Listo». «Listo» lleva a «Ejecutando». «Ejecutando» lleva a «Esperando I/O o evento». «Esperando I/O o evento» lleva a «Listo». «Ejecutando» lleva a «Terminación cooperativa». «Terminación cooperativa» lleva a «Salida y recursos recuperados». «Supervisor» lleva a «Proceso creado». «Salida y recursos recuperados» lleva a «Supervisor».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="415" height="632" fill="#ffffff"/><path d="M75.1,66 L75.1,86.0 Q75.1,95 84.1,95.0 L136.3,95.0 Q145.3,95 145.3,104.0 L145.3,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M145.3,168 L145.3,188.0 Q145.3,197 154.3,197.0 L156.1,197.0 Q165.1,197 165.1,206.0 L165.1,226" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M165.1,270 L165.1,290.0 Q165.1,299 174.1,299.0 L180.2,299.0 Q189.2,299 189.2,308.0 L189.2,328" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M189.2,372 L189.2,392.0 Q189.2,401 180.2,401.0 L126.5,401.0 Q117.5,401 117.5,410.0 L117.5,430" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M189.2,372 L189.2,392.0 Q189.2,401 198.2,401.0 L284.0,401.0 Q293,401 293.0,410.0 L293,430" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M290.7,491 L290.7,549" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M215.6,66 L215.6,86.0 Q215.6,95 206.6,95.0 L154.3,95.0 Q145.3,95 145.3,104.0 L145.3,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M38,460.5 L31.0,460.5 Q24,460.5 24.0,453.5 L24.0,257.0 Q24,248 33.0,248.0 L127.1,248" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><path d="M376.4,579.5 L383.4,579.5 Q390.4,579.5 390.4,572.5 L390.4,53.0 Q390.4,44 381.4,44.0 L273.1,44" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="26.1" y="22" width="98" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="75.1" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="75.1" dy="0">Programa</tspan></text><rect x="70.3" y="124" width="150" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="145.3" y="150.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="145.3" dy="0">Proceso creado</tspan></text><rect x="127.1" y="226" width="76" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="165.1" y="252.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="165.1" dy="0">Listo</tspan></text><rect x="131.7" y="328" width="115" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="189.2" y="354.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="189.2" dy="0">Ejecutando</tspan></text><rect x="38" y="430" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="117.5" y="455.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="117.5" dy="0">Esperando I/O o</tspan><tspan x="117.5" dy="19.2">evento</tspan></text><