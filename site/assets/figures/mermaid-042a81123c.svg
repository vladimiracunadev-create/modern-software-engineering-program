<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 764 686" width="764" height="686" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Tarea» … «Revertir o reencargar»</title><desc id="d">Diagrama de flujo con 12 pasos. «Tarea» lleva a «Alcance». «Alcance» lleva a «Autocompletado» (una línea o expresión). «Alcance» lleva a «Chat» (pregunta o diseño). «Alcance» lleva a «Edición» (cambio en archivos existentes). «Alcance» lleva a «Generación» (código nuevo). «Autocompletado» lleva a «Aceptar o rechazar». «Chat» lleva a «Respuesta a contrastar». «Edición» lleva a «Diff a revisar». «Generación» lleva a «Archivo nuevo a entender». «Aceptar o rechazar» lleva a «Pruebas y revisión». «Diff a revisar» lleva a «Pruebas y revisión». «Archivo nuevo a entender» lleva a «Pruebas y revisión». «Respuesta a contrastar» lleva a «Pruebas y revisión». «Pruebas y revisión» lleva a «Revertir o reencargar» (rechaza).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="764" height="686" fill="#ffffff"/><path d="M388.7,66 L388.7,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M388.7,186 L388.7,194.0 Q388.7,202 380.7,202.0 L195.1,202.0 Q186.1,202 186.1,211.0 L186.1,280" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M388.7,186 L388.7,194.0 Q388.7,202 380.7,202.0 L342.1,202.0 Q333.1,202 333.1,211.0 L333.1,280" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M388.7,186 L388.7,194.0 Q388.7,202 396.7,202.0 L440.6,202.0 Q449.6,202 449.6,211.0 L449.6,280" fill="none" stroke="#3