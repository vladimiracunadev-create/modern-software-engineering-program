<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 429 977" width="429" height="977" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Hipótesis probada en preproducción y en el pipeline» … «Experimento continuo y automatizado»</title><desc id="d">Diagrama de flujo con 9 pasos. «Hipótesis probada en preproducción y en el pipeline» lleva a «Precondiciones: observabilidad, aborto, reversión, holgura». «Precondiciones: observabilidad, aborto, reversión, holgura» lleva a «Experimento concentrado con control y experimento». «Experimento concentrado con control y experimento» lleva a «¿Se mantiene el estado estable?». «¿Se mantiene el estado estable?» lleva a «Interruptor: detener y revertir» (no). «¿Se mantiene el estado estable?» lleva a «Más radio o más intensidad» (sí). «Más radio o más intensidad» lleva a «Evacuación de una región con la métrica agregada». «Interruptor: detener y revertir» lleva a «Corrección y repetición». «Evacuación de una región con la métrica agregada» lleva a «Experimento continuo y automatizado».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="429" height="977" fill="#ffffff"/><path d="M221.4,102 L221.4,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M220.8,259 L220.8,317" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M219.4,416 L219.4,474" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M218.5,560 L218.5,568.0 Q218.5,576 210.5,576.0 L123.5,576.0 Q114.5,576 114.5,585.0 L114.5,618" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M218.5,560 L218.5,568.0 Q218.5,576 226.5,576.0 L311.5,576.0 Q320.5,576 320.5,585.0 L320.5,618" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M319.5,679 L319.5,737" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M114.3,679 L114.3,746.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M317.7,817 L317.7,875" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="128.9" y="22" width="185" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="221.4" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="221.4" dy="0">Hipótesis probada</tspan><tspan x="221.4" dy="19.2">en preproducción y</tspan><tspan x="221.4" dy="19.2">en el pipeline</tspan></text><rect x="128.9" y="160" width="185" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="221.4" y="184.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="221.4" dy="0">Precondiciones:</tspan><tspan x="221.4" dy="19.2">observabilidad,</tspan><tspan x="221.4" dy="19.2">aborto, reversión,</tspan><tspan x="221.4" dy="19.2">holgura</tspan></text><rect x="140.7" y="317" width="159" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="220.2" y="341.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="220.2" dy="0">Experimento</tspan><tspan x="220.2" dy="19.2">concentrado con</tspan><tspan x="220.2" dy="19.2">control y</tspan><tspan x="220.2" dy="19.2">experimento</tspan></text><polygon points="218.5,474 346,517 218.5,560 91,517" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="218.5" y="511.6" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="218.5" dy="0">¿Se mantiene el</tspan><tspan x="218.5" dy="19.2">estado estable?</tspan></text><rect x="22" y="618" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="114.5" y="643.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="114.5" dy="0">Interruptor:</tspan><tspan x="114.5" dy="19.2">detener y revertir</tspan></text><rect x="241" y="618" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="320.5" y="643.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="320.5" dy="0">Más radio o más</tspan><tspan x="320.5" dy="19.2">intensidad</tspan></text><rect x="230.5" y="737" width="176" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="318.5" y="762" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="318.5" dy="0">Evacuación de una</tspan><tspan x="318.5" dy="19.2">región con la</tspan><tspan x="318.5" dy="19.2">métrica agregada</tspan></text><rect x="47.6" y="746.5" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="114.1" y="771.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="114.1" dy="0">Corrección y</tspan><tspan x="114.1" dy="19.2">repetición</tspan></text><rect x="250.3" y="875" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="316.8" y="900" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="316.8" dy="0">Experimento</tspan><tspan x="316.8" dy="19.2">continuo y</tspan><tspan x="316.8" dy="19.2">automatizado</tspan></text><rect x="120.5" y="585" width="29" height="24" rx="4" fill="#ffffff"/><text x="135" y="600.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="135" dy="0">no</tspan></text><rect x="326.5" y="585" width="29" height="24" rx="4" fill="#ffffff"/><text x="341" y="600.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="341" dy="0">sí</tspan></text></s