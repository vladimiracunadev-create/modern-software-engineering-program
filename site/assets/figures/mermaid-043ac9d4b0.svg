<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 579 223" width="579" height="223" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Valor 513» … «Bytes big-endian 02 01» y «Bytes little-endian 01 02»</title><desc id="d">Diagrama de flujo con 4 pasos. «Valor 513» lleva a «Binario 00000010 00000001». «Binario 00000010 00000001» lleva a «Bytes big-endian 02 01». «Binario 00000010 00000001» lleva a «Bytes little-endian 01 02». «Bytes big-endian 02 01» lleva a «Valor 513». «Bytes little-endian 01 02» lleva a «Valor 513».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="579" height="223" fill="#ffffff"/><path d="M129,111.5 L175,111.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M343,111.5 L357.0,111.5 Q366,111.5 366.0,102.5 L366.0,61.5 Q366,52.5 375.0,52.5 L389,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M343,111.5 L357.0,111.5 Q366,111.5 366.0,120.5 L366.0,152.0 Q366,161 375.0,161.0 L389,161" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M389,52.5 L84.5,52.5 Q75.5,52.5 75.5,61.5 L75.5,89.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><path d="M389,161 L84.5,161.0 Q75.5,161 75.5,152.0 L75.5,133.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="89.5" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="75.5" y="115.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="75.5" dy="0">Valor 513</tspan></text><rect x="175" y="81" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="259" y="106.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="259" dy="0">Binario 00000010</tspan><tspan x="259" dy="19.2">00000001</tspan></text><rect x="389" y="22" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="473" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="473" dy="0">Bytes big-endian</tspan><tspan x="473" dy="19.2">02 01</tspan></text><rect x="389" y="121" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="473" y="146" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="473" dy="0">Bytes</tspan><tspan x="473" dy="19.2">little-endian 01</tspan><tspan x="473" dy="19.2">02</tspan></text></svg>
