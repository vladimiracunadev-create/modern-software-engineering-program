<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 659 583" width="659" height="583" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Lado de oferta: vendedores» y «Lado de demanda: compradores» … «Liberación al vendedor» y «Resolución y reembolso»</title><desc id="d">Diagrama de flujo con 10 pasos. «Lado de oferta: vendedores» lleva a «Plataforma». «Lado de demanda: compradores» lleva a «Plataforma». «Plataforma» lleva a «Búsqueda y emparejamiento». «Plataforma» lleva a «Confianza: verificación, reseñas, garantía». «Plataforma» lleva a «Pago retenido». «Pago retenido» lleva a «Confirmación o plazo». «Confirmación o plazo» lleva a «Liberación al vendedor» (conforme). «Confirmación o plazo» lleva a «Resolución y reembolso» (disputa). «Búsqueda y emparejamiento» lleva a «Liquidez». «Liquidez» lleva a «Lado de oferta: vendedores». «Liquidez» lleva a «Lado de demanda: compradores».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="659" height="583" fill="#ffffff"/><path d="M213,83 L213.0,103.0 Q213,112 222.0,112.0 L302.8,112.0 Q311.8,112 311.8,121.0 L311.8,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M410.5,83 L410.5,103.0 Q410.5,112 401.5,112.0 L320.8,112.0 Q311.8,112 311.8,121.0 L311.8,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M311.8,185 L311.8,209.8 Q311.8,218.8 302.8,218.8 L122.0,218.8 Q113,218.8 113.0,227.8 L113,252.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M310.9,185 L310.9,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M311.8,185 L311.8,214.0 Q311.8,223 320.8,223.0 L494.0,223.0 Q503,223 503.0,232.0 L503,261" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M503,305 L503.0,334.0 Q503,343 494.0,343.0 L493.9,343.0 Q484.9,343 484.9,352.0 L484.9,381" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M484.9,442 L484.9,450.0 Q484.9,458 476.9,458.0 L399.5,458.0 Q390.5,458 390.5,467.0 L390.5,500" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M484.9,442 L484.9,450.0 Q484.9,458 492.9,458.0 L553.0,458.0 Q562,458 562.0,467.0 L562,500" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M112.6,313.5 L112.6,389.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M63.3,411.5 L33.0,411.5 Q24,411.5 24.0,402.5 L24.0,61.5 Q24,52.5 33.0,52.5 L133.5,52.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><path d="M161.3,411.5 L199.0,411.5 Q208,411.5 208.0,402.5 L208.0,106.0 Q208,97 217.0,97.0 L303.5,97.0 Q312.5,97 312.5,88.0 L312.5,59.5 Q312.5,52.5 319.5,52.5 L326.5,52.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="133.5" y="22" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="213" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="213" dy="0">Lado de oferta:</tspan><tspan x="213" dy="19.2">vendedores</tspan></text><rect x="254.3" y="141" width="115" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="311.8" y="167.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="311.8" dy="0">Plataforma</tspan></text><rect x="326.5" y="22" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="410.5" y="47.1" font-