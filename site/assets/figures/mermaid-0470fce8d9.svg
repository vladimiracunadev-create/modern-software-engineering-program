1ee" stroke="#087f8c" stroke-width="1.6"/><text x="112.3" y="415.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="112.3" dy="0">Liquidez</tspan></text><rect x="396.5" y="467" width="77" height="24" rx="4" fill="#ffffff"/><text x="435" y="482.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="435" dy="0">conforme</tspan></text><rect x="568" y="467" width="69" height="24" rx="4" fill="#ffffff"/><text x="602.5" y="482.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602.5" dy="0">disputa</tspan></text></svg>
