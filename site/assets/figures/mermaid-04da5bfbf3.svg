<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 823 189" width="823" height="189" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Persona y contexto» … «Etapa que más pierde»</title><desc id="d">Diagrama de flujo con 5 pasos. «Persona y contexto» lleva a «Tarea y meta». «Tarea y meta» lleva a «Pasos y operadores». «Pasos y operadores» lleva a «Tiempo y errores». «Tiempo y errores» lleva a «Etapa que más pierde». «Etapa que más pierde» lleva a «Pasos y operadores» (rediseño). «Persona y contexto» lleva a «Etapa que más pierde» (variación).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="823" height="189" fill="#ffffff"/><path d="M129,94.5 L175,94.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M308,94.5 L354,94.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M469,94.5 L515,94.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M613,94.5 L659,94.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M75.5,64 L75.5,57.0 Q75.5,50 82.5,50.0 L723.0,50.0 Q730,50 730.0,57.0 L730,64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M730,125 L730.0,132.0 Q730,139 723.0,139.0 L418.5,139.0 Q411.5,139 411.5,132.0 L411.5,125" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="64" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="75.5" y="89.1" font-size="15" text-anchor="middle" 