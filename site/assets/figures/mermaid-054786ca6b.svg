<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 328 649" width="328" height="649" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Decisión» … «Monitorear y reparar»</title><desc id="d">Diagrama de flujo con 7 pasos. «Decisión» lleva a «Afectados». «Decisión» lleva a «Evidencia e incertidumbre». «Afectados» lleva a «Beneficios y daños». «Evidencia e incertidumbre» lleva a «Beneficios y daños». «Beneficios y daños» lleva a «Opciones y controles». «Opciones y controles» lleva a «Juicio profesional». «Juicio profesional» lleva a «Monitorear y reparar».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="328" height="649" fill="#ffffff"/><path d="M154.8,66 L154.8,90.2 Q154.8,99.2 145.8,99.2 L84.5,99.2 Q75.5,99.2 75.5,108.2 L75.5,132.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M154.8,66 L154.8,86.0 Q154.8,95 163.8,95.0 L225.1,95.0 Q234.1,95 234.1,104.0 L234.1,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M75.5,176.5 L75.5,200.8 Q75.5,209.8 84.5,209.8 L145.8,209.8 Q154.8,209.8 154.8,218.8 L154.8,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M234.1,185 L234.1,205.0 Q234.1,214 225.1,214.0 L163.8,214.0 Q154.8,214 154.8,223.0 L154.8,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M154.8,287 L154.8,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M154.8,406 L154.8,464" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M154.8,508 L154.8,566" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="105.8" y="22" width="98" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="154.8" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="154.8" dy="0">Decisión</tspan></text><rect x="22" y="132.5" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="75.5" y="158.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="75.5" dy="0">Afectados</tspan></text><rect x="163.1" y="124" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="234.1" y="149.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="234.1" dy="0">Evidencia e</tspan><tspan x="234.1" dy="19.2">incertidumbre</tspan></text><rect x="62.3" y="243" width="185" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="154.8" y="269.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="154.8" dy="0">Beneficios y daños</tspan></text><rect x="97.3" y="345" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="154.8" y="370.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="154.8" dy="0">Opciones y</tspan><tspan x="154.8" dy="19.2">controles</tspan></text><rect x="62.3" y="464" width="185" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="154.8" y="490.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="154.8" dy="0">Juicio profesional</tspan></text><rect x="88.3" y="566" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="154.8" y="591.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="154.8" dy="0">Monitorear y</tspan><tspan x="154.8" dy="19.2">reparar</tspan></text></svg>
