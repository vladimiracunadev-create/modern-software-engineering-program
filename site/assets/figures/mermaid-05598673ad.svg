<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 246" width="810" height="246" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Tokens de color y tipo» … «Señal redundante»</title><desc id="d">Diagrama de flujo con 6 pasos. «Tokens de color y tipo» lleva a «Contraste y distancia». «Contraste y distancia» lleva a «Simulación de visión». «Tokens de color y tipo» lleva a «Maquetación y reflujo». «Maquetación y reflujo» lleva a «Zoom y texto ampliado». «Simulación de visión» lleva a «Señal redundante». «Zoom y texto ampliado» lleva a «Señal redundante». «Señal redundante» lleva a «Tokens de color y tipo» (nuevo tema).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="810" height="246" fill="#ffffff"/><path d="M198,144 L216.5,144.0 Q225.5,144 225.5,135.0 L225.5,103.5 Q225.5,94.5 234.5,94.5 L253,94.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M377,94.5 L432,94.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M198,144 L212.0,144.0 Q221,144 221.0,153.0 L221.0,184.5 Q221,193.5 230.0,193.5 L244,193.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M386,193.5 L436.5,193.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M574,94.5 L588.0,94.5 Q597,94.5 597.0,103.5 L597.0,135.0 Q597,144 606.0,144.0 L620,144" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M569.5,193.5 L585.8,193.5 Q594.8,193.5 594.8,184.5 L594.8,153.0 Q594.8,144 603.8,144.0 L620,144" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M704,122 L704.0,59.0 Q704,50 695.0,50.0 L119.0,50.0 Q110,50 110.0,59.0 L110,113.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="113.5" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="110" y="138.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">Tokens de color y</tspan><tspan x="110" dy="19.2">tipo</tspan></text><rect x="253" y="64" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="315" y="89.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="315" dy="0">Contraste y</tspan><tspan x="315" dy="19.2">distancia</tspan></text><rect x="432" y="64" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="503" y="89.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="503" dy="0">Simulación de</tspan><tspan x="503" dy="19.2">visión</tspan></text><rect x="244" y="163" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="315" y="188.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="315" dy="0">Maquetación y</tspan><tspan x="315" dy="19.2">reflujo</tspan></text><rect x="436.5" y="163" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="503" y="188.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="503" dy="0">Zoom y texto</tspan><tspan x="503" dy="19.2">ampliado</tspan></text><rect x="620" y="122" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="704" y="148.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="704" dy="0">Señal redundante</tspan></text><rect x="360" y="22" width="94" height="24" rx="4" fill="#fffff