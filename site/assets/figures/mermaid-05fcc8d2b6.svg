<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 599 776" width="599" height="776" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Aplicación» … «Informes y modelos»</title><desc id="d">Diagrama de flujo con 8 pasos. «Aplicación» lleva a «Base operacional estado actual». «Base operacional estado actual» lleva a «Zona cruda dato sin tocar» (registro de cambios o copia). «Zona cruda dato sin tocar» lleva a «Zona intermedia tipos y duplicados». «Zona intermedia tipos y duplicados» lleva a «Modelo analítico hechos con historia». «Modelo analítico hechos con historia» lleva a «Informes y modelos». «Base operacional estado actual» lleva a «¿bloquea a la aplicación?» (lectura pesada). «Zona cruda dato sin tocar» lleva a «Reproceso posible» (sin tocar la operación).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="599" height="776" fill="#ffffff"/><path d="M358.2,66 L358.2,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M358.2,197 L358.2,205.0 Q358.2,213 350.2,213.0 L233.1,213.0 Q224.1,213 224.1,222.0 L224.1,303.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M224.1,364.5 L224.1,399.8 Q224.1,408.8 215.1,408.8 L123.5,408.8 Q114.5,408.8 114.5,417.8 L114.5,453" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M114.5,514 L114.5,534.0 Q114.5,543 123.5,543.0 L153.2,543.0 Q162.2,543 162.2,552.0 L162.2,572" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M162.2,652 L162.2,672.0 Q162.2,681 171.2,681.0 L185.9,681.0 Q194.9,681 194.9,690.0 L194.9,710" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M358.2,197 L358.2,205.0 Q358.2,213 366.2,213.0 L435.6,213.0 Q444.6,213 444.6,222.0 L444.6,291" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M224.1,364.5 L224.1,372.5 Q224.1,380.5 232.1,380.5 L320.0,380.5 Q329,380.5 329.0,389.5 L329,461.5" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="300.7" y="22" width="115" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="358.2" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="358.2" dy="0">Aplicación</tspan></text><path d="M274.2,131 v59 a84,7 0 0 0 168,0 v-59" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><ellipse cx="358.2" cy="131" rx="84" ry="7" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="358.2" y="158.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="358.2" dy="0">Base operacional</tspan><tspan x="358.2" dy="19.2">estado actual</tspan></text><rect x="149.1" y="303.5" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="224.1" y="328.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="224.1" dy="0">Zona cruda</tspan><tspan x="224.1" dy="19.2">dato sin tocar</tspan></text><rect x="22" y="453" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="114.5" y="478.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="114.5" dy="0">Zona intermedia</tspan><tspan x="114.5" dy="19.2">tipos y duplicados</tspan></text><rect x="78.2" y="572" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="162.2" y="597" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="162.2" dy="0">Modelo analítico</tspan><tspan x="162.2" dy="19.2">hechos con</tspan><tspan x="162.2" dy="19.2">historia</tspan></text><rect x="102.4" y="710" width="185" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="194.9" y="736.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="194.9" dy="0">Informes y modelos</tspan></text><polygon points="444.6,291 556.1,334 444.6,377 333.1,334" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="444.6" y="328.6" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="444.6" dy="0">¿bloquea a la</tspan><tspan x="444.6" dy="19.2">aplicación?</tspan></text><rect x="241" y="461.5" width="176" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="329" y="487.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="329" dy="0">Reproceso posible</tspan></text><rect x="116.1" y="228.2" width="102" height="60" rx="4" fill="#ffffff"/><text x="167.1" y="244.1" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="167.1" dy="0">registro de</tspan><tspan x="167.1" dy="17.92">cambios o</tspan><tspan x="167.1" dy="17.92">copia</tspan></text><rect x="450.6" y="240" width="126" height="24" rx="4" fill="#ffffff"/><text x="513.6" y="255.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="513.6" dy="0">lectura pesada</tspan></text><rect x="335" y="400" width="110" height="42" rx="4" fill="#ffffff"/><text x="390" y="415.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="390" dy="0">sin tocar la</tspan><tspan x="390" dy="17.92">operación</tspan></text></svg>
