<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 766 262" width="766" height="262" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Catálogo de fallas» … «Siguiente día o experimento automático»</title><desc id="d">Diagrama de flujo con 8 pasos. «Catálogo de fallas» lleva a «Escenario realista». «Escenario realista» lleva a «Preparación: roles, reglas, aborto». «Preparación: roles, reglas, aborto» lleva a «Inyección y respuesta del equipo». «Inyección y respuesta del equipo» lleva a «Observación: tiempos y decisiones». «Observación: tiempos y decisiones» lleva a «Retrospectiva sin culpa». «Retrospectiva sin culpa» lleva a «Acciones verificables». «Acciones verificables» lleva a «Siguiente día o experimento automático». «Siguiente día o experimento automático» lleva a «Escenario realista».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="766" height="262" fill="#ffffff"/><path d="M163.5,62 L240,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M347,62 L406,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M556,62 L602,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M673,102 L673,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M606.5,200 L552,200" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M410,200 L360,200" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M227,200 L181,200" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M101.5,160 L101.5,115.5 Q101.5,106.5 110.5,106.5 L286.5,106.5 Q293.5,106.5 293.5,99.5 L293.5,92.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="39.5" y="31.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101.5" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101.5" dy="0">Catálogo de</tspan><tspan x="101.5" dy="19.2">fallas</tspan></text><rect x="240" y="31.5" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="293.5" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="293.5" dy="0">Escenario</tspan><tspan x="293.5" dy="19.2">realista</tspan></text><rect x="406" y="22" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="481" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="481" dy="0">Preparación:</tspan><tspan x="481" dy="19.2">roles, reglas,</tspan><tspan x="481" dy="19.2">aborto</tspan></text><rect x="602" y="22" width="142" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="673" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="673" dy="0">Inyección y</tspan><tspan x="673" dy="19.2">respuesta del</tspan><tspan x="673" dy="19.2">equipo</tspan></text><rect x="606.5" y="160" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="673" y="185" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="673" dy="0">Observación:</tspan><tspan x="673" dy="19.2">tiempos y</tspan><tspan x="673" dy="19.2">decisiones</tspan></text><rect x="410" y="169.5" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="481" y="194.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="481" dy="0">Retrospectiva</tspan><tspan x="481" dy="19.2">sin culpa</tspan></text><rect x="227" y="169.5" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="293.5" y="194.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="293.5" dy="0">Acciones</tspan><tspan x="293.5" dy="19.2">verificables</tspan></text><rect x="22" y="160" width="159" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101.5" y="185" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101.5" dy="0">Siguiente día o</tspan><tspan x="101.5" dy="19.2">experimento</tspan><tspan x="101.5" dy="19.2">automático</tspan></text></svg>
