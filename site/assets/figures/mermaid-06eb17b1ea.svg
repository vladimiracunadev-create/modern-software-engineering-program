<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 597 1025" width="597" height="1025" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Tema a decidir» … «Aclarar y reenviar»</title><desc id="d">Diagrama de flujo con 11 pasos. «Tema a decidir» lleva a «Escribir solo antes de hablar». «Escribir solo antes de hablar» lleva a «Mostrar a la vez». «Mostrar a la vez» lleva a «Agrupar y discutir diferencias». «Agrupar y discutir diferencias» lleva a «Tipo de desacuerdo». «Tipo de desacuerdo» lleva a «Medir o probar» (hechos). «Tipo de desacuerdo» lleva a «Negociar costos y beneficios» (intereses). «Tipo de desacuerdo» lleva a «Escalar a quien decide» (valores). «Medir o probar» lleva a «Decisión con 5 campos». «Negociar costos y beneficios» lleva a «Decisión con 5 campos». «Escalar a quien decide» lleva a «Decisión con 5 campos». «Decisión con 5 campos» lleva a «Mensaje escrito con acuse». «Mensaje escrito con acuse» lleva a «Aclarar y reenviar» (se pierde un campo). «Aclarar y reenviar» lleva a «Decisión con 5 campos».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="597" height="1025" fill="#ffffff"/><path d="M296,66 L296,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M296,185 L296,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M295.8,287 L295.8,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M295.7,406 L295.7,464" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M295.6,526 L295.6,534.0 Q295.6,542 287.6,542.0 L106.0,542.0 Q97,542 97.0,551.0 L97,592.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M294.8,526 L294.8,584" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M295.6,526 L295.6,534.0 Q295.6,542 303.6,542.0 L486.5,542.0 Q495.5,542 495.5,551.0 L495.5,584" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M97,636.5 L97.0,660.8 Q97,669.8 106.0,669.8 L286.5,669.8 Q295.5,669.8 295.5,678.8 L295.5,703" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M294.7,645 L294.7,703" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M495.5,645 L495.5,665.0 Q495.5,674 486.5,674.0 L304.5,674.0 Q295.5,674 295.5,683.0 L295.5,703" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M295.5,764 L295.5,822" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M295.6,883 L295.6,959" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M203.1,981 L196.1,981.0 Q189.1,981 189.1,974.0 L189.1,742.5 Q189.1,733.5 198.1,733.5 L220.5,733.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="221" y="22" width="150" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="296" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="296" dy="0">Tema a decidir</tspan></text><rect x="216.5" y="124" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="296" y="149.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="296" dy="0">Escribir solo</tspan><tspan x="296" dy="19.2">antes de hablar</tspan></text><rect x="211.9" y="243" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="295.9" y="269.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="295.9" dy="0">Mostrar a la vez</tspan></text><rect x="203.2" y="345" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="295.7" y="370.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="295.7" dy="0">Agrupar y discutir</tspan><tspan x="295.7" dy="19.2">diferencias</tspan></text><polygon points="295.6,464 416.6,495 295.6,526 174.6,495" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="295.6" y="499.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="295.6" dy="0">Tipo de desacuerdo</tspan></text><rect x="22" y="592.5" width="150" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="97" y="618.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="97" dy="0">Medir o probar</tspan></text><rect x="206" y="584" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="294" y="609.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="294" dy="0">Negociar costos y</tspan><tspan x="294" dy="19.2">beneficios</tspan></text><rect x="416" y="584" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="495.5" y="609.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="495.5" dy="0">Escalar a quien</tspan><tspan x="495.5" dy="19.2">decide</tspan></text><rect x="220.5" y="703" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="295.5" y="728.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="295.5" dy="0">Decisión con 5</tspan><tspan x="295.5" dy="19.2">campos</tspan></text><rect x="216.1" y="822" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="295.6" y="847.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="295.6" dy="0">Mensaje escrito</tspan><tspan x="295.6" dy="19.2">con acuse</tspan></text><rect x="203.1" y="959" width="185" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="295.6" y="985.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="295.6" dy="0">Aclarar y reenviar</tspan></text><rect x="103" y="555.2" width="61" height="24" rx="4" fill="#ffffff"/><text x="133.5" y="571.1" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="133.5" dy="0">hechos</tspan></text><rect x="300.8" y="543" width="86" height="24" rx="4" fill="#ffffff"/><text x="343.8" y="558.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="343.8" dy="0">intereses</tspan></text><rect x="501.5" y="551" width="69" height="24" rx="4" fill="#ffffff"/><text x="536" y="566.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="536" dy="0">valores</tspan></text><rect x="301.6" y="900" width="110" height="42" rx="4" fill="#ffffff"/><text x="356.6" y="915.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="356.6" dy="0">se pierde un</tspan><tspan x="356.6" dy="17.92">campo</tspan></text></svg>
