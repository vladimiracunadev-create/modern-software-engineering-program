<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 438 1001" width="438" height="1001" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Función con cadena de condiciones» … «Conservar con condición de salida» y «Revertir o simplificar»</title><desc id="d">Diagrama de flujo con 10 pasos. «Función con cadena de condiciones» lleva a «Registrar con maestro dorado». «Registrar con maestro dorado» lleva a «Sembrar mutantes: ¿los detecta?». «Sembrar mutantes: ¿los detecta?» lleva a «Añadir entradas de frontera» (no todos). «Añadir entradas de frontera» lleva a «Sembrar mutantes: ¿los detecta?». «Sembrar mutantes: ¿los detecta?» lleva a «Refactorizar en pasos pequeños» (todos). «Refactorizar en pasos pequeños» lleva a «Comprobar el maestro tras cada paso». «Comprobar el maestro tras cada paso» lleva a «Medir antes y después». «Medir antes y después» lleva a «¿Compensa el costo?». «¿Compensa el costo?» lleva a «Conservar con condición de salida» (sí). «¿Compensa el costo?» lleva a «Revertir o simplificar» (no).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="438" height="1001" fill="#ffffff"/><path d="M209.2,83 L209.2,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M209.2,202 L209.2,224.1 Q209.2,231 216.1,231.0 L216.1,231.0 Q223,231 223.0,237.9 L223,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M223,321 L223.0,329.0 Q223,337 215.0,337.0 L139.5,337.0 Q130.5,337 130.5,346.0 L130.5,379" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M223,321 L223.0,329.0 Q223,337 231.0,337.0 L327.5,337.0 Q336.5,337 336.5,346.0 L336.5,379" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M336.5,440 L336.5,460.0 Q336.5,469 327.5,469.0 L304.8,469.0 Q295.8,469 295.8,478.0 L295.8,498" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M295.8,578 L295.8,598.0 Q295.8,607 286.8,607.0 L268.0,607.0 Q259,607 259.0,616.0 L259,636" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M259,697 L259.0,717.0 Q259,726 250.0,726.0 L239.6,726.0 Q230.6,726 230.6,735.0 L230.6,755" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M230.6,841 L230.6,849.0 Q230.6,857 222.6,857.0 L145.8,857.0 Q136.8,857 136.8,866.0 L136.8,899" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M230.6,841 L230.6,849.0 Q230.6,857 238.6,857.0 L294.8,857.0 Q303.8,857 303.8,866.0 L303.8,908.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M38,409.5 L31.0,409.5 Q24,409.5 24.0,402.5 L24.0,299.5 Q24,290.5 33.0,290.5 L135,290.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="116.7" y="22" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="209.2" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="209.2" dy="0">Función con cadena</tspan><tspan x="209.2" dy="19.2">de condiciones</tspan></text><rect x="134.2" y="141" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="209.2" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="209.2" dy="0">Registrar con</tspan><tspan x="209.2" dy="19.2">maestro dorado</tspan></text><rect x="135" y="260" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="223" y="285.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="223" dy="0">Sembrar mutantes:</tspan><tspan x="223" dy="19.2">¿los detecta?</tspan></text><rect x="38" y="379" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="130.5" y="404.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="130.5" dy="0">Añadir entradas de</tspan><tspan x="130.5" dy="19.2">frontera</tspan></text><rect x="257" y="379" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="336.5" y="404.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="336.5" dy="0">Refactorizar en</tspan><tspan x="336.5" dy="19.2">pasos pequeños</tspan></text><rect x="207.8" y="498" width="176" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="295.8" y="523" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="295.8" dy="0">Comprobar el</tspan><tspan x="295.8" dy="19.2">maestro tras cada</tspan><tspan x="295.8" dy="19.2">paso</tspan></text><rect x="188" y="636" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="259" y="661.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="259" dy="0">Medir antes y</tspan><tspan x="259" dy="19.2">después</tspan></text><polygon points="230.6,755 334.6,798 230.6,841 126.6,798" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="230.6" y="792.6" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="230.6" dy="0">¿Compensa el</tspan><tspan x="230.6" dy="19.2">costo?</tspan></text><rect x="65.8" y="899" width="142" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="136.8" y="924" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="136.8" dy="0">Conservar con</tspan><tspan x="136.8" dy="19.2">condición de</tspan><tspan x="136.8" dy="19.2">salida</tspan></text><rect x="241.8" y="908.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="303.8" y="933.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="303.8" dy="0">Revertir o</tspan><tspan x="303.8" dy="19.2">simplificar</tspan></text><rect x="136.5" y="346" width="77" height="24" rx="4" fill="#ffffff"/><text x="175" y="361.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="175" dy="0">no todos</tspan></text><rect x="342.5" y="346" width="53" height="24" rx="4" fill="#ffffff"/><text x="369" y="361.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="369" dy="0">todos</tspan></text><rect x="142.8" y="866" width="29" height="24" rx="4" fill="#ffffff"/><text x="157.3" y="881.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="157.3" dy="0">sí</tspan></text><rect x="309.8" y="870.8" width="29" height="24" rx="4" fill="#ffffff"/><text x="324.3" y="886.7" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324.3" dy="0">no</tspan></text></svg>
