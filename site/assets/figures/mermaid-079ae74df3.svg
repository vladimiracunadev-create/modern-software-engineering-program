<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 561 805" width="561" height="805" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Cambio» … «Revisión periódica»</title><desc id="d">Diagrama de flujo con 10 pasos. «Cambio» lleva a «Etapas baratas primero». «Etapas baratas primero» lleva a «Se detiene: feedback temprano» (rojo). «Etapas baratas primero» lleva a «Etapas caras». «Etapas caras» lleva a «Políticas sobre la propia canalización». «Políticas sobre la propia canalización» lleva a «Compuerta». «Compuerta» lleva a «Integración» (pasa). «Compuerta» lleva a «Corrección» (bloquea). «Compuerta» lleva a «Registro, dueño y caducidad» (excepción). «Registro, dueño y caducidad» lleva a «Revisión periódica».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="561" height="805" fill="#ffffff"/><path d="M193.5,66 L193.5,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M193.5,185 L193.5,193.0 Q193.5,201 185.5,201.0 L119.0,201.0 Q110,201 110.0,210.0 L110,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M193.5,185 L193.5,209.2 Q193.5,218.2 202.5,218.2 L289.5,218.2 Q298.5,218.2 298.5,227.2 L298.5,251.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M298.5,295.5 L298.5,320.5 Q298.5,328.8 290.1,328.8 L290.1,328.8 Q281.8,328.8 281.8,337.1 L281.8,362" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M281.8,442 L281.8,466.4 Q281.8,471 277.2,471.0 L277.2,471.0 Q272.7,471 272.7,475.6 L272.7,500" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M272.7,562 L272.7,570.0 Q272.7,578 264.7,578.0 L122.7,578.0 Q113.7,578 113.7,587.0 L113.7,628.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M269.9,562 L269.9,628.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M272.7,562 L272.7,570.0 Q272.7,578 280.7,578.0 L437.7,578.0 Q446.7,578 446.7,587.0 L446.7,620" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M443.3,681 L443.3,739" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="153" y="22" width="81" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="193.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="193.5" dy="0">Cambio</tspan></text><rect x="118.5" y="124" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="193.5" y="149.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="193.5" dy="0">Etapas baratas</tspan><tspan x="193.5" dy="19.2">primero</tspan></text><rect x="22" y="243" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="110" y="268.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">Se detiene:</tspan><tspan x="110" dy="19.2">feedback temprano</tspan></text><rect x="232" y="251.5" width="133" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="298.5" y="277.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="298.5" dy="0">Etapas caras</tspan></text><rect x="189.3" y="362" width="185" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="281.8" y="387" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="281.8" dy="0">Políticas sobre la</tspan><tspan x="281.8" dy="19.2">propia</tspan><tspan x="281.8" dy="19.2">canalización</tspan></text><polygon points="272.7,500 337.2,531 272.7,562 208.2,531" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="272.7" y="535.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="272.7" dy="0">Compuerta</tspan></text><rect x="51.7" y="628.5" width="124" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="113.7" y="654.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="113.7" dy="0">Integración</tspan></text><rect x="209.7" y="628.5" width="115" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="267.2" y="654.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="267.2" dy="0">Corrección</tspan></text><rect x="358.7" y="620" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="446.7" y="645.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="446.7" dy="0">Registro, dueño y</tspan><tspan x="446.7" dy="19.2">caducidad</tspan></text><rect x="347.5" y="739" width="185" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="440" y="765.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="440" dy="0">Revisión periódica</tspan></text><rect x="116" y="210" width="45" height="24" rx="4" fill="#ffffff"/><text x="138.5" y="225.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="138.5" dy="0">rojo</tspan></text><rect x="119.7" y="591.2" width="45" height="24" rx="4" fill="#ffffff"/><text x="142.2" y="607.1" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="142.2" dy="0">pasa</tspan></text><rect x="275.9" y="583.2" width="69" height="24" rx="4" fill="#ffffff"/><text x="310.4" y="599.1" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="310.4" dy="0">bloquea</tspan>