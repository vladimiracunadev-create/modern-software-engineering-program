<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 475 853" width="475" height="853" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Alerta o reporte» … «Cerrar y pasar a análisis»</title><desc id="d">Diagrama de flujo con 12 pasos. «Alerta o reporte» lleva a «Declarar incidente». «Declarar incidente» lleva a «Clasificar severidad». «Clasificar severidad» lleva a «Asignar roles». «Asignar roles» lleva a «Comando». «Asignar roles» lleva a «Operaciones». «Asignar roles» lleva a «Comunicaciones». «Asignar roles» lleva a «Escriba». «Operaciones» lleva a «Mitigar». «Mitigar» lleva a «Verificar». «Comunicaciones» lleva a «Actualizar a las partes». «Verificar» lleva a «Cerrar y pasar a análisis». «Actualizar a las partes» lleva a «Comando» (preguntas).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="475" height="853" fill="#ffffff"/><path d="M293.8,66 L293.8,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M293.8,168 L293.8,190.4 Q293.8,197 287.2,197.0 L287.2,197.0 Q280.7,197 280.7,203.6 L280.7,226" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M280.7,287 L280.7,307.0 Q280.7,316 271.7,316.0 L268.5,316.0 Q259.5,316 259.5,325.0 L259.5,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M330.5,367 L343.2,367.0 Q352.2,367 352.2,376.0 L352.2,526.0 Q352.2,535 361.2,535.0 L367.0,535.0 Q376,535 376.0,544.0 L376.0,681.0 Q376,690 367.0,690.0 L335.1,690" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M259.5,389 L259.5,409