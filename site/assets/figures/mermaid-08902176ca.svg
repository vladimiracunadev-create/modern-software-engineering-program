<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 902" width="670" height="902" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Origen: base de la plataforma» … «Reconciliar con el origen»</title><desc id="d">Diagrama de flujo con 9 pasos. «Origen: base de la plataforma» lleva a «¿Cómo se detecta el cambio?». «¿Cómo se detecta el cambio?» lleva a «Sondeo: ve altas y cambios, no bajas» (marca de tiempo). «¿Cómo se detecta el cambio?» lleva a «Captura de cambios: altas, cambios y bajas en orden» (registro de cambios). «¿Cómo se detecta el cambio?» lleva a «Copia completa: cara, ve todo» (comparación completa). «Captura de cambios: altas, cambios y bajas en orden» lleva a «Flujo de cambios». «Flujo de cambios» lleva a «Aplicar con versión y de forma idempotente». «Sondeo: ve altas y cambios, no bajas» lleva a «Aplicar con versión y de forma idempotente». «Copia completa: cara, ve todo» lleva a «Aplicar con versión y de forma idempotente». «Aplicar con versión y de forma idempotente» lleva a «Destino: crudo y transformado». «Destino: crudo y transformado» lleva a «Reconciliar con el origen». «Reconciliar con el origen» lleva a «¿Cómo se detecta el cambio?» (divergencia).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="670" height="902" fill="#ffffff"/><path d="M329,83 L329,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M329,227 L329.0,235.0 Q329,243 321.0,243.0 L123.5,243.0 Q114.5,243 114.5,252.0 L114.5,322" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M331.3,227 L331.3,303" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M329,227 L329.0,235.0 Q329,243 337.0,243.0 L530.5,243.0 Q539.5,243 539.5,252.0 L539.5,322" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M332.5,402 L332.5,460" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M330.6,504 L330.6,562" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M207,352.5 L215.1,352.5 Q223.2,352.5 223.2,360.6 L223.2,595.0 Q223.2,602 230.2,602.0 L237.2,602" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M460,352.5 L445.2,352.5 Q436.2,352.5 436.2,361.5 L436.2,595.0 Q436.2,602 429.2,602.0 L422.2,602" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M329,642 L329,700" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M328,761 L328,819" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M235.2,849.5 L228.1,849.5 Q221,849.5 221.0,842.4 L221.0,250.0 Q221,241 212.0,241.0 L188.5,241.0 Q179.5,241 179.5,232.0 L179.5,191.0 Q179.5,184 186.5,184.0 L193.5,184" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="236.5" y="22" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="329" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="329" dy="0">Origen: base de la</tspan><tspan x="329" dy="19.2">plataforma</tspan></text><polygon points="329,141 464.5,184 329,227 193.5,184" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="329" y="178.6" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="329" dy="0">¿Cómo se detecta</tspan><tspan x="329" dy="19.2">el cambio?</tspan></text><rect x="22" y="322" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="114.5" y="347.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="114.5" dy="0">Sondeo: ve altas y</tspan><tspan x="114.5" dy="19.2">cambios, no bajas</tspan></text><rect x="241" y="303" width="185" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="333.5" y="327.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="333.5" dy="0">Captura de</tspan><tspan x="333.5" dy="19.2">cambios: altas,</tspan><tspan x="333.5" dy="19.2">cambios y bajas en</tspan><tspan x="333.5" dy="19.2">orden</tspan></text><rect x="460" y="322" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="539.5" y="347.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="539.5" dy="0">Copia completa:</tspan><tspan x="539.5" dy="19.2">cara, ve todo</tspan></text><rect x="247.5" y="460" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="331.5" y="486.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="331.5" dy="0">Flujo de cambios</tspan></text><rect x="237.2" y="562" width="185" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="329.7" y="587" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="329.7" dy="0">Aplicar con</tspan><tspan x="329.7" dy="19.2">versión y de forma</tspan><tspan x="329.7" dy="19.2">idempotente</tspan></text><rect x="244.3" y="700" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="328.3" y="725.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="328.3" dy="0">Destino: crudo y</tspan><tspan x="328.3" dy="19.2">transformado</tspan></text><rect x="235.2" y="819" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="327.7" y="844.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="327.7" dy="0">Reconciliar con el</tspan><tspan x="327.7" dy="19.2">origen</tspan></text><rect x="120.5" y="261.5" width="77" height="42" rx="4" fill="#ffffff"/><text x="159" y="277.4" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="159" dy="0">marca de</tspan><tspan x="159" dy="17.92">tiempo</tspan></text><rect x="337.3" y="244" width="102" height="42" rx="4" fill="#ffffff"/><text x="388.3" y="259.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="388.3" dy="0">registro de</tspan><tspan x="388.3" dy="17.92">cambios</tspan></text><rect x="545.5" y="261.5" width="102" height="42" rx="4" fill="#ffffff"/><text x="596.5" y="277.4" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="596.5" dy="0">comparación</tspan><tspan x="596.5" dy="17.92">completa</tspan></text><rect x="227" y="533.2" width="102" height="24" rx="4" fill="#ffffff"/><text x="278" y="549.1" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="278" dy="0">divergencia</tspan></text></svg>
