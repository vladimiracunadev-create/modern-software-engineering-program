="642.6" dy="0">Generador y huella</tspan><tspan x="642.6" dy="19.2">del archivo</tspan></text><rect x="478" y="595" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="562" y="621.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="562" dy="0">Deriva detectada</tspan></text><rect x="259" y="577" width="185" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="351.5" y="602" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="351.5" dy="0">Significado:</tspan><tspan x="351.5" dy="19.2">pruebas y revisión</tspan><tspan x="351.5" dy="19.2">humana</tspan></text><rect x="534.7" y="269" width="77" height="42" rx="4" fill="#ffffff"/><text x="573.2" y="284.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="573.2" dy="0">nadie la</tspan><tspan x="573.2" dy="17.92">mantiene</tspan></text><rect x="337.2" y="273.2" width="118" height="42" rx="4" fill="#ffffff"/><text x="396.2" y="289.1" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="396.2" dy="0">se mantiene y</tspan><tspan x="396.2" dy="17.92">se comprueba</tspan></text><rect x="736.2" y="273.2" width="110" height="42" rx="4" fill="#ffffff"/><text x="791.2" y="289.1" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="791.2" dy="0">se genera el</tspan><tspan x="791.2" dy="17.92">código</tspan></text></svg>
