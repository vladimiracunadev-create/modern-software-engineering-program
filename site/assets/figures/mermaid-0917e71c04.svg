<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 869 679" width="869" height="679" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Especificación» … «Significado: pruebas y revisión humana» y «Deriva detectada»</title><desc id="d">Diagrama de flujo con 11 pasos. «Especificación» lleva a «Plan y tareas». «Plan y tareas» lleva a «Código y pruebas». «Especificación» lleva a «¿Quién manda tras la primera versión?». «¿Quién manda tras la primera versión?» lleva a «Spec-first: deriva sin aviso» (nadie la mantiene). «¿Quién manda tras la primera versión?» lleva a «Spec-anchored» (se mantiene y se comprueba). «¿Quién manda tras la primera versión?» lleva a «Spec-as-source» (se genera el código). «Spec-anchored» lleva a «Comprobador: reglas, valores, cambios». «Spec-as-source» lleva a «Generador y huella del archivo». «Comprobador: reglas, valores, cambios» lleva a «Deriva detectada». «Generador y huella del archivo» lleva a «Deriva detectada». «Comprobador: reglas, valores, cambios» lleva a «Significado: pruebas y revisión humana».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="869" height="679" fill="#ffffff"/><path d="M354.2,66 L354.2,105.0 Q354.2,114 345.2,114.0 L233.8,114.0 Q224.8,114 224.8,123.0 L224.8,162" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M224.8,206 L224.8,258.2 Q224.8,267.2 215.8,267.2 L115.0,267.2 Q106,267.2 106.0,276.2 L106,328.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M354.2,66 L354.2,86.0 Q354.2,95 363.2,95.0 L474.5,95.0 Q483.5,95 483.5,104.0 L483.5,1