<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 477 876" width="477" height="876" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Cambio en el proveedor» … «Reconciliar por listado periódico»</title><desc id="d">Diagrama de flujo con 8 pasos. «Cambio en el proveedor» lleva a «¿Quién inicia?». «¿Quién inicia?» lleva a «Webhook» (el proveedor empuja). «¿Quién inicia?» lleva a «Sondeo con petición condicional» (la plataforma pregunta). «Webhook» lleva a «Verificar: firma, marca de tiempo, identificador». «Verificar: firma, marca de tiempo, identificador» lleva a «Responder rápido y encolar». «Responder rápido y encolar» lleva a «Procesar de forma idempotente». «Sondeo con petición condicional» lleva a «Procesar de forma idempotente». «Procesar de forma idempotente» lleva a «Reconciliar por listado periódico». «Reconciliar por listado periódico» lleva a «Cambio en el proveedor» (diferencia).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="477" height="876" fill="#ffffff"/><path d="M214.5,83 L214.5,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M214.5,203 L214.5,211.0 Q214.5,219 206.5,219.0 L147.0,219.0 Q138,219 138.0,228.0 L138,297" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M214.5,203 L214.5,211.0 Q214.5,219 222.5,219.0 L269.5,219.0 Q278.5,219 278.5,228.0 L278.5,279" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M138,341 L138.0,370.0 Q138,379 147.0,379.0 L154.9,379.0 Q163.9,379 163.9,388.0 L163.9,417" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M163.9,497 L163.9,517.0 Q163.9,526 172.9,526.0 L177.3,526.0 Q186.3,526 186.3,535.0 L186.3,555" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M186.3,616 L186.3,637.5 Q186.3,645 193.9,645.0 L193.9,645.0 Q201.4,645 201.4,652.5 L201.4,674" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M278.5,359 L278.5,532.0 Q278.5,541 287.5,541.0 L294.4,541.0 Q303.4,541 303.4,550.0 L303.4,697.5 Q303.4,704.5 296.4,704.5 L289.4,704.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M205.1,735 L205.1,793" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M296.9,823.5 L345.5,823.5 Q354.5,823.5 354.5,814.5 L354.5,61.5 Q354.5,52.5 345.5,52.5 L281,52.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="148" y="22" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="214.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="214.5" dy="0">Cambio en el</tspan><tspan x="214.5" dy="19.2">proveedor</tspan></text><polygon points="214.5,141 310.5,172 214.5,203 118.5,172" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="214.5" y="176.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="214.5" dy="0">¿Quién inicia?</tspan></text><rect x="93.5" y="297" width="89" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="138" y="323.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="138" dy="0">Webhook</tspan></text><rect x="216.5" y="279" width="124" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="278.5" y="304" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="278.5" dy="0">Sondeo con</tspan><tspan x="278.5" dy="19.2">peti