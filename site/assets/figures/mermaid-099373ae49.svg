<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 757" width="920" height="757" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Dato entra» y «Solicitud de supresión» … «Agregados: k mínimo» y «Purga programada»</title><desc id="d">Diagrama de flujo con 13 pasos. «Dato entra» lleva a «Clasificación: nombre y contenido». «Clasificación: nombre y contenido» lleva a «¿Personal?». «¿Personal?» lleva a «Marca en el catálogo y en el contrato» (sí). «Marca en el catálogo y en el contrato» lleva a «Seudonimización con clave». «Marca en el catálogo y en el contrato» lleva a «Retención declarada». «Marca en el catálogo y en el contrato» lleva a «Acceso mínimo». «Seudonimización con clave» lleva a «Agregados: k mínimo». «Retención declarada» lleva a «Purga programada». «Solicitud de supresión» lleva a «Linaje: todas las copias». «Linaje: todas las copias» lleva a «Borrado propagado». «Linaje: todas las copias» lleva a «Exportaciones y copias de seguridad: plazo declarado».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="920" height="757" fill="#ffffff"/><path d="M236,74.5 L236,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M236,202 L236.0,231.2 Q236,240.2 227.0,240.2 L197.6,240.2 Q188.6,240.2 188.6,249.2 L188.6,278.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M188.6,340.5 L188.6,348.5 Q188.6,356.5 196.6,356.5 L244.3,356.5 Q253.3,356.5 253.3,365.5 L253.3,417" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M253.3,497 L253.3,517.0 Q253.3,526 