<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 695 360" width="695" height="360" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Valor por defecto», «Archivo», «Entorno», «Flag» y «Secreto» … «Valor final» y «Diagnóstico»</title><desc id="d">Diagrama de flujo con 8 pasos. «Valor por defecto» lleva a «Resolvedor». «Archivo» lleva a «Resolvedor». «Entorno» lleva a «Resolvedor». «Flag» lleva a «Resolvedor». «Resolvedor» lleva a «Valor final». «Secreto» lleva a «Resolvedor» (archivo o stdin). «Resolvedor» lleva a «Diagnóstico» (registra la fuente).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="695" height="360" fill="#ffffff"/><path d="M198,44 L244.0,44.0 Q253,44 253.0,53.0 L253.0,171.0 Q253,180 262.0,180.0 L308,180" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M154.5,112 L222.2,112.0 Q231.2,112 231.2,121.0 L231.2,171.0 Q231.2,180 240.2,180.0 L308,180" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M154.5,180 L308,180" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M148,248 L219.0,248.0 Q228,248 228.0,239.0 L228.0,189.0 Q228,180 237.0,180.0 L308,180" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M423,180 L477.0,180.0 Q486,180 486.0,171.0 L486.0,155.0 Q486,146 495.0,146.0 L549,146" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M154.5,316 L162.5,316.0 Q170.5,316 170.5,308.0 L170.5,189.0 Q170.5,180 179.5,180.0 L308,180" fill="none" stroke="#32505f" stroke-width="1.8" ma