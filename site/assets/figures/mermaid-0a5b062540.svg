<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 422 651" width="422" height="651" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Intención» … «Archivo final»</title><desc id="d">Diagrama de flujo con 8 pasos. «Intención» lleva a «Clave de idempotencia». «Clave de idempotencia» lleva a «¿Ya hecho?». «¿Ya hecho?» lleva a «Omitir» (sí). «¿Ya hecho?» lleva a «Efecto» (no). «Efecto» lleva a «Archivo temporal». «Archivo temporal» lleva a «Archivo final» (reemplazo atómico). «Efecto» lleva a «Marca de progreso».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="422" height="651" fill="#ffffff"/><path d="M177.1,66 L177.1,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M180.4,185 L180.4,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M183.8,305 L183.8,313.0 Q183.8,321 175.8,321.0 L140.4,321.0 Q131.4,321 131.4,330.0 L131.4,363" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M183.8,305 L183.8,313.0 Q183.8,321 191.8,321.0 L237.4,321.0 Q246.4,321 246.4,330.0 L246.4,363" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M246.4,407 L246.4,427.0 Q246.4,436 237.4,436.0 L115.0,436.0 Q106,436 106.0,445.0 L106,465" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M105.2,509 L105.2,585" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M246.4,407 L246.4,427.0 Q246.4,436 255.4,436.0 L303.0,436.0 Q312,436 312.0,445.0 L312,465" fill="none" stroke="#32505f" st