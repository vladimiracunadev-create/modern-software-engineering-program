<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 335 905" width="335" height="905" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Síntoma reproducido» … «Documentación y limpieza»</title><desc id="d">Diagrama de flujo con 8 pasos. «Síntoma reproducido» lleva a «Evidencia inicial». «Evidencia inicial» lleva a «Hipótesis rivales». «Hipótesis rivales» lleva a «Prueba discriminante». «Prueba discriminante» lleva a «¿Causa confirmada?». «¿Causa confirmada?» lleva a «Hipótesis rivales» (No). «¿Causa confirmada?» lleva a «Cambio mínimo reversible» (Sí). «Cambio mínimo reversible» lleva a «Verificación y regresión». «Verificación y regresión» lleva a «Documentación y limpieza».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="335" height="905" fill="#ffffff"/><path d="M143,83 L143,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M143,185 L143,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M143,287 L143,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M143,406 L143,464" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M143,526 L143,584" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M143,645 L143,703" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M143,764 L143,822" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M264,495 L271.0,495.0 Q278,495 278.0,488.0 L278.0,274.0 Q278,265 269.0,265.0 L231,265" fi