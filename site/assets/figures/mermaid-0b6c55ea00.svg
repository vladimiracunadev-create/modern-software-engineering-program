</text><rect x="63.5" y="822" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="143" y="847.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="143" dy="0">Documentación y</tspan><tspan x="143" dy="19.2">limpieza</tspan></text><rect x="284" y="368" width="29" height="24" rx="4" fill="#ffffff"/><text x="298.5" y="383.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="298.5" dy="0">No</tspan></text><rect x="149" y="543" width="29" height="24" rx="4" fill="#ffffff"/><text x="163.5" y="558.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="163.5" dy="0">Sí</tspan></text></svg>
