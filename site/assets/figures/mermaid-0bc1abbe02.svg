<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 803 652" width="803" height="652" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «De la intención a la especificación durable» … «Proyecto final: producto operable construido desde SPEC»</title><desc id="d">Diagrama de flujo con 12 pasos. «De la intención a la especificación durable» lleva a «Constitución, specify, clarify, plan y tasks». «Constitución, specify, clarify, plan y tasks» lleva a «Implementación, análisis y convergencia contra SPEC». «Implementación, análisis y convergencia contra SPEC» lleva a «Greenfield, brownfield, bug fixing e idea assessment». «Greenfield, brownfield, bug fixing e idea assessment» lleva a «Agentes, herramientas, permisos y límites de autoridad». «Agentes, herramientas, permisos y límites de autoridad» lleva a «Skills, plugins, hooks y entornos aislados». «Skills, plugins, hooks y entornos aislados» lleva a «MCP, recursos, prompts, tools y confianza». «MCP, recursos, prompts, tools y confianza» lleva a «Delegación, subagentes y sistemas multiagente». «Delegación, subagentes y sistemas multiagente» lleva a «Human-in-the-loop, aprobación y acciones reversibles». «Human-in-the-loop, aprobación y acciones reversibles» lleva a «Seguridad agentic, prompt injection y auditoría». «Seguridad agentic, prompt injection y auditoría» lleva a «Taller: detener, recuperar y evaluar un agente». «Taller: detener, recuperar y evaluar un agente» lleva a «Proyecto final: producto operable construido desde SPEC». «Proyecto final: producto operable construido desde SPEC» lleva a «De la intención a la especificación durable» (hallazgo de la revisión).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="803" height="652" fill="#ffffff"/><path d="M331.5,71.5 L386.5,71.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M545.5,71.5 L609,71.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M688.5,121 L688.5,188.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M609,238 L537,238" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M395,238 L336,238" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M252,278 L252,364.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M336,404.5 L399.5,404.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M532.5,404.5 L596,404.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M688.5,454 L688.5,521.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M609,571 L550,571" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M382,571 L336,571" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M168,571 L161.0,571.0 Q154,571 154.0,564.0 L154.0,80.5 Q154,71.5 163.0,71.5 L172.5,71.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="172.5" y="22" width="159" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="252" y="46.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="252" dy="0">De la intención</tspan><tspan x="252" dy="19.2">a la</tspan><tspan x="252" dy="19.2">especificación</tspan><tspan x="252" dy="19.2">durable</tspan></text><rect x="386.5" y="22" width="159" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="466