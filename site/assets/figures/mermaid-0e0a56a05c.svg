<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 598 699" width="598" height="699" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Acción del agente» … «Conservar el cambio», «Restaurar la instantánea» y «Aprobación humana antes»</title><desc id="d">Diagrama de flujo con 10 pasos. «Acción del agente» lleva a «¿Dentro de la raíz?». «¿Dentro de la raíz?» lleva a «Impedir: bloquear» (no). «¿Dentro de la raíz?» lleva a «Instantánea previa» (sí). «Instantánea previa» lleva a «Ejecutar». «Ejecutar» lleva a «¿Verificación pasa?». «¿Verificación pasa?» lleva a «Conservar el cambio» (sí). «¿Verificación pasa?» lleva a «Restaurar la instantánea» (no). «Ejecutar» lleva a «¿Efecto externo irreversible?». «¿Efecto externo irreversible?» lleva a «Aprobación humana antes» (sí).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="598" height="699" fill="#ffffff"/><path d="M311.6,66 L311.6,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M311.6,210 L311.6,218.0 Q311.6,226 303.6,226.0 L218.0,226.0 Q209,226 209.0,235.0 L209,268" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M311.6,210 L311.6,218.0 Q311.6,226 319.6,226.0 L414.5,226.0 Q423.5,226 423.5,235.0 L423.5,268" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M423.5,312 L423.5,332.0 Q423.5,341 414.5,341.0 L357.3,341.0 Q348.3,341 348.3,350.0 L348.3,370" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M348.3,414 L348.3,434.0 Q348.3,443 339.3,443.0 L184.1,443.0 Q175.1,443 175.1,452.0 L175.1,472" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M175.1,558 L175.1,566.0 Q175.1,574 167.1,574.0 L97.5,574.0 Q88.5,574 88.5,583.0 L88.5,616" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M175.1,558 L175.1,566.0 Q175.1,574 183.1,574.0 L246.5,574.0 Q255.5,574 255.5,583.0 L255.5,616" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M348.3,414 L348.3,434.0 Q348.3,443 357.3,443.0 L439.1,443.0 Q448.1,443 448.1,452.0 L448.1,472" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M446.1,558 L446.1,616" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="223.6" y="22" width="176" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="311.6" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="311.6" dy="0">Acción del agente</tspan></text><polygon points="311.6,124 423.1,167 311.6,210 200.1,167" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="311.6" y="161.6" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="311.6" dy="0">¿Dentro de la</tspan><tspan x="311.6" dy="19.2">raíz?</tspan></text><rect x="121" y="268" width="176" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="209" y="294.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="209" dy="0">Impedir: bloquear</tspan></text><rect x="331" y="268" width="185" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="423.5" y="294.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="423.5" dy="0">Instantánea previa</tspan></text><rect x="299.3" y="370" width="98" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="348.3" y="396.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="348.3" dy="0">Ejecutar</tspan></text><polygon points="175.1,472 286.6,515 175.1,558 63.6,515" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="175.1" y="509.6" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="175.1" dy="0">¿Verificación</tspan><tspan x="175.1" dy="19.2">pasa?</tspan></text><rect x="22" y="616" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="88.5" y="641.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="88.5" dy="0">Conservar el</tspan><tspan x="88.5" dy="19.2">cambio</tspan></text><rect x="189" y="616" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="255.5" y="641.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="255.5" dy="0">Restaurar la</tspan><tspan x="255.5" dy="19.2">instantánea</tspan></text><polygon points="448.1,472 575.6,515 448.1,558 320.6,515" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="448.1" y="509.6" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="448.1" dy="0">¿Efecto externo</tspan><tspan x="448.1" dy="19.2">irreversible?</tspan></text><rect x="356" y="616" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="444" y="641.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="444" dy="0">Aprobación humana</tspan><tspan x="444" dy="19.2">antes</tspan></text><rect x="215" y="235" width="29" height="24" rx="4" fill="#ffffff"/><text x="229.5" y="250.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="229.5" dy="0">no</tspan></text><rect x="429.5" y="235" width="29" height="24" rx="4" fill="#ffffff"/><text x="444" y="250.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="444" dy="0">sí</tspan></text><rect x="94.5" y="583" width="29" height="24" rx="4" fill="#ffffff"/><text x="109" y="598.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="109" dy="0">sí</tspan></text><rect x="261.5" y="583" width="29" height="24" rx="4" fill="#ffffff"/><text x="276" y="598.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="276" dy="0">no</tspan></text><rect x="452.1" y="575" width="29" height="24" rx="4" fill="#ffffff"/><text x="466.6" y="590.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="466.6" dy="0">sí</tspan></text></svg>
