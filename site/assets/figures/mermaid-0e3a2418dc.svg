<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 418 785" width="418" height="785" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Nueva versión» … «Reversión a la anterior» y «Confirmar»</title><desc id="d">Diagrama de flujo con 9 pasos. «Nueva versión» lleva a «Manifiesto y verificación». «Manifiesto y verificación» lleva a «Escritura en la ranura inactiva». «Escritura en la ranura inactiva» lleva a «Validación». «Validación» lleva a «Cambio de indicador». «Cambio de indicador» lleva a «Arranque en la nueva». «Arranque en la nueva» lleva a «Reversión a la anterior» (falla). «Arranque en la nueva» lleva a «Confirmar» (ok). «Corte de energía» lleva a «Escritura en la ranura inactiva». «Corte de energía» lleva a «Cambio de indicador».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="418" height="785" fill="#ffffff"/><path d="M93,66 L93,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M93,185 L93.0,205.0 Q93,214 102.0,214.0 L200.4,214.0 Q209.4,214 209.4,223.0 L209.4,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M209.4,304 L209.4,324.0 Q209.4,333 218.4,333.0 L220.9,333.0 Q229.9,333 229.9,342.0 L229.9,362" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M229.9,406 L229.9,427.1 Q229.9,435 237.9,435.0 L237.9,435.0 Q245.8,435 245.8,442.9 L245.8,464" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M245.8,525 L245.8,548.6 Q245.8,554 251.2,554.0 L251.2,554.0 Q256.6,554 256.6,559.4 L256.6,583" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M256.6,644 L256.6,652.0 Q256.6,660 248.6,660.0 L188.1,660.0 Q179.1,660 179.1,669.0 L179.1,702" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M256.6,644 L256.6,652.0 Q256.6,660 264.6,660.0 L332.6,660.0 Q341.6,660 341.6,669.0 L341.6,710.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M277.5,176.5 L277.5,200.8 Q277.5,209.8 268.5,209.8 L218.4,209.8 Q209.4,209.8 209.4,218.8 L209.4,243" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M361.5,154.5 L368.5,154.5 Q375.5,154.5 375.5,161.5 L375.5,485.5 Q375.5,494.5 366.5,494.5 L299.3,494.5" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="22" y="22" width="142" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="93" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="93" dy="0">Nueva versión</tspan></text><rect x="26.5" y="124" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="93" y="149.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="93" dy="0">Manifiesto y</tspan><tspan x="93" dy="19.2">verificación</tspan></text><rect x="129.9" y="243" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="209.4" y="268.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="209.4" dy="0">Escritura en la</tspan><tspan x="209.4" dy="19.2">ranura inactiva</tspan></text><rect x="172.4" y="362" width="115" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="229.9" y="388.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="229.9" dy="0">Validación</tspan></text><rect x="192.3" y="464" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="245.8" y="489.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="245.8" dy="0">Cambio de</tspan><tspan x="245.8" dy="19.2">indicador</tspan></text><rect x="181.6" y="583" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="256.6" y="608.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="256.6" dy="0">Arranque en la</tspan><tspan x="256.6" dy="19.2">nueva</tspan></text><rect x="104.1" y="702" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="179.1" y="727.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="179.1" dy="0">Reversión a la</tspan><tspan x="179.1" dy="19.2">anterior</tspan></text><rect x="288.1" y="710.5" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="341.6" y="736.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="341.6" dy="0">Confirmar</tspan></text><rect x="193.5" y="132.5" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="277.5" y="158.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="277.5" dy="0">Corte de energía</tspan></text><rect x="185.1" y="669" width="53" height="24" rx="4" fill="#ffffff"/><text x="211.6" y="684.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="211.6" dy="0">falla</tspan></text><rect x="347.6" y="673.2" width="29" height="24" rx="4" fill="#ffffff"/><text x="362.1" y="689.1" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362.1" dy="0">ok</tspan></text></svg>
