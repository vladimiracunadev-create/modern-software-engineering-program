"503" y="175.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="503" dy="0">Rendimiento</tspan></text><rect x="257.5" y="149.5" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="311" y="175.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="311" dy="0">Seguridad</tspan></text><rect x="35" y="149.5" width="133" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101.5" y="175.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101.5" dy="0">Sin conexión</tspan></text><rect x="22" y="268.5" width="159" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101.5" y="294.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101.5" dy="0">Descubribilidad</tspan></text><rect x="227" y="268.5" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="311" y="294.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="311" dy="0">Flujo resiliente</tspan></text><rect x="445.5" y="260" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="503" y="285.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="503" dy="0">Paquete de</tspan><tspan x="503" dy="19.2">evidencia</tspan></text><rect x="295.5" y="211.5" width="94" height="42" rx="4" fill="#ffffff"/><text x="342.5" y="227.4" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="342.5" dy="0">hallazgo o</tspan><tspan x="342.5" dy="17.92">cambio</tspan></text></svg>
