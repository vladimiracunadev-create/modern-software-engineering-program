<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 783 343" width="783" height="343" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Documento» … «Paquete de evidencia»</title><desc id="d">Diagrama de flujo con 11 pasos. «Documento» lleva a «Comportamiento». «Comportamiento» lleva a «Dónde se construye». «Dónde se construye» lleva a «Estado y datos». «Estado y datos» lleva a «Formularios y URLs». «Formularios y URLs» lleva a «Rendimiento». «Rendimiento» lleva a «Seguridad». «Seguridad» lleva a «Sin conexión». «Sin conexión» lleva a «Descubribilidad». «Descubribilidad» lleva a «Flujo resiliente». «Flujo resiliente» lleva a «Paquete de evidencia». «Paquete de evidencia» lleva a «Documento» (hallazgo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="783" height="343" fill="#ffffff"/><path d="M155,52.5 L236,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M386,52.5 L449.5,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M556.5,52.5 L611,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M686,74.5 L686,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M615,171.5 L565,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M441,171.5 L364.5,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M257.5,171.5 L168,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M101.5,193.5 L101.5,268.5