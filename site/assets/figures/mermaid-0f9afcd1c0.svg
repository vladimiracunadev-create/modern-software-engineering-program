<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 619 840" width="619" height="840" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Modelo y supuestos» … «Afirmación con intervalo y límites»</title><desc id="d">Diagrama de flujo con 9 pasos. «Modelo y supuestos» lleva a «Código y entorno fijados». «Código y entorno fijados» lleva a «Ejecución con semilla». «Ejecución con semilla» lleva a «Resultado». «Resultado» lleva a «Repetición exacta» (mismo entorno). «Resultado» lleva a «Diferencia numérica» (otra máquina u orden). «Resultado» lleva a «Dispersión de la estimación» (otras semillas). «Diferencia numérica» lleva a «Tolerancia declarada». «Dispersión de la estimación» lleva a «Tolerancia declarada». «Tolerancia declarada» lleva a «Afirmación con intervalo y límites». «Afirmación con intervalo y límites» lleva a «Modelo y supuestos» (datos o modelo nuevos).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="619" height="840" fill="#ffffff"/><path d="M223.1,66 L223.1,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M223.1,185 L223.1,205.0 Q223.1,214 232.1,214.0 L233.4,214.0 Q242.4,214 242.4,223.0 L242.4,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M242.4,304 L242.4,324.0 Q242.4,333 251.4,333.0 L264.3,333.0 Q273.3,333 273.3,342.0 L273.3,362" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M273.3,424 L273.3,432.0 Q273.3,440 265.3,440.0 L119.0,440.0 Q110,440 110.0,449.0 L110,508.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M273.3,424 L273.3,432.0 Q273.3,440 281.3,440.0 L281.4,440.0 Q289.5,440 289.5,448.1 L289.5,500" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M273.3,424 L273.3,432.0 Q273.3,440 281.3,440.0 L456.0,440.0 Q465,440 465.0,449.0 L465,500" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M289.5,561 L289.5,581.0 Q289.5,590 298.5,590.0 L352.4,590.0 Q361.4,590 361.4,599.0 L361.4,619" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M465,561 L465.0,581.0 Q465,590 456.0,590.0 L370.4,590.0 Q361.4,590 361.4,599.0 L361.4,619" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M361.4,680 L361.4,703.5 Q361.4,709 355.9,709.0 L355.9,709.0 Q350.5,709 350.5,714.5 L350.5,738" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M425.5,778 L432.5,778.0 Q439.5,778 439.5,771.0 L439.5,584.0 Q439.5,575 430.5,575.0 L370.0,575.0 Q361,575 361.0,566.0 L361.0,53.0 Q361,44 352.0,44.0 L315.6,44" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="130.6" y="22" width="185" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="223.1" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="223.1" dy="0">Modelo y supuestos</tspan></text><rect x="139.1" y="124" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="223.1" y="149.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="223.1" dy="0">Código y entorno</tspan><tspan x="223.1" dy="19.2">fijados</tspan></text><rect x="171.4" y="243" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="242.4" y="268.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="242.4" dy="0">Ejecución con</tspan><tspan x="242.4" dy="19.2">semilla</tspan></text><polygon points="273.3,362 337.8,393 273.3,424 208.8,393" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="273.3" y="397.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="273.3" dy="0">Resultado</tspan></text><rect x="22" y="508.5" width="176" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="110" y="534.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">Repetición exacta</tspan></text><rect x="232" y="500" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="289.5" y="525.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="289.5" dy="0">Diferencia</tspan><tspan x="289.5" dy="19.2">numérica</tspan></text><rect x="381" y="500" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="465" y="525.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="465" dy="0">Dispersión de la</tspan><tspan x="465" dy="19.2">estimación</tspan></text><rect x="303.9" y="619" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="361.4" y="644.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="361.4" dy="0">Tolerancia</tspan><tspan x="361.4" dy="19.2">declarada</tspan></text><rect x="275.5" y="738" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="350.5" y="763" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="350.5" dy="0">Afirmación con</tspan><tspan x="350.5" dy="19.2">intervalo y</tspan><tspan x="350.5" dy="19.2">límites</tspan></text><rect x="116" y="462.2" width="118" height="24" rx="4" fill="#ffffff"/><text x="175" y="478.1" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="175" dy="0">mismo entorno</tspan></text><rect x="295.5" y="449" width="126" height="42" rx="4" fill="#ffffff"/><text x="358.5" y="464.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="358.5" dy="0">otra máquina u</tspan><tspan x="358.5" dy="17.92">orden</tspan></text><rect x="471" y="458" width="126" height="24" rx="4" fill="#ffffff"/><text x="534" y="473.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="534" dy="0">otras semillas</tspan></text><rect x="367" y="288.5" width="126" height="42" rx="4" fill="#ffffff"/><text x="430" y="304.4" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="430" dy="0">datos o modelo</tspan><tspan x="430" dy="17.92">nuevos</tspan></text></svg>
