<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 835 380" width="835" height="380" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Cambio propuesto» … «Medida posterior: defectos que escaparon»</title><desc id="d">Diagrama de flujo con 8 pasos. «Cambio propuesto» lleva a «Revisión por pares». «Cambio propuesto» lleva a «Análisis estático: reglas sobre el código». «Cambio propuesto» lleva a «Pruebas y cobertura». «Revisión por pares» lleva a «Quality gate: reglas de decisión». «Análisis estático: reglas sobre el código» lleva a «Quality gate: reglas de decisión». «Pruebas y cobertura» lleva a «Quality gate: reglas de decisión». «Quality gate: reglas de decisión» lleva a «Integración» (pasa). «Quality gate: reglas de decisión» lleva a «Corrección o excepción registrada» (bloquea). «Integración» lleva a «Medida posterior: defectos que escaparon». «Medida posterior: defectos que escaparon» lleva a «Quality gate: reglas de decisión» (ajusta reglas y umbrales).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="835" height="380" fill="#ffffff"/><path d="M129,200 L143.0,200.0 Q152,200 152.0,191.0 L152.0,81.5 Q152,72.5 161.0,72.5 L175,72.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M129,200 L175,200" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M129,200 L143.0,200.0 Q152,200 152.0,209.0 L152.0,318.5 Q152,327.5 161.0,327.5 L175,327.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M282,72.5 L296.0,72.5 Q305,72.5 305.0,81.5 L305.0,191.0 Q305,200 314.0,200.0 L328,200" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M282,200 L328,200" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M282,327.5 L296.0,327.5 Q305,327.5 305.0,318.5 L305.0,209.0 Q305,200 314.0,200.0 L328,200" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M435,200 L443.0,200.0 Q451,200 451.0,192.0 L451.0,150.0 Q451,141 460.0,141.0 L528,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M435,200 L443.0,200.0 Q451,200 451.0,208.0 L451.0,232.0 Q451,241 460.0,241.0 L528,241" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M652,141 L698,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M755.5,82 L755.5,75.0 Q755.5,68 748.5,68.0 L390.5,68.0 Q381.5,68 381.5,77.0 L381.5,150.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="169.5" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="75.5" y="194.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="75.5" dy="0">Cambio</tspan><tspan x="75.5" dy="19.2">propuesto</tspan></text><rect x="175" y="42" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="228.5" y="67.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="228.5" dy="0">Revisión</tspan><tspan x="228.5" dy="19.2">por pares</tspan></text><rect x="175" y="141" width="107" height="118" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="228.5" y="165.8" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="228.5" dy="0">Análisis</tspan><tspan x="228.5" dy="19.2">estático:</tspan><tspan x="228.5" dy="19.2">reglas</tspan><tspan x="228.5" dy="19.2">sobre el</tspan><tspan x="228.5" dy="19.2">código</ts