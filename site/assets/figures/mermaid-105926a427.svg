<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 685 614" width="685" height="614" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Cambio en el código» … «Registro de cambios» y «Obsolescencia anunciada antes»</title><desc id="d">Diagrama de flujo con 10 pasos. «Cambio en el código» lleva a «Afecta a la API pública?». «Afecta a la API pública?» lleva a «Parche o interno» (no). «Afecta a la API pública?» lleva a «Compatible con los clientes?» (sí). «Compatible con los clientes?» lleva a «Menor» (añade). «Compatible con los clientes?» lleva a «Mayor» (rompe). «Comparador de firmas» lleva a «Compatible con los clientes?» (ve parte). «Revisión humana y pruebas de contrato» lleva a «Compatible con los clientes?» (ve el resto). «Menor» lleva a «Registro de cambios». «Mayor» lleva a «Registro de cambios». «Mayor» lleva a «Obsolescencia anunciada antes».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="685" height="614" fill="#ffffff"/><path d="M149.5,83 L149.5,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M153.1,227 L153.1,306" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M149.5,227 L149.5,235.0 Q149.5,243 157.5,243.0 L417.2,243.0 Q426.2,243 426.2,252.0 L426.2,285" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M426.2,371 L426.2,379.0 Q426.2,387 418.2,387.0 L382.0,387.0 Q373,387 373.0,396.0 L373,429" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M426.2,371 L426.2,379.0 Q426.2,387 434.2,387.0 L474.0,387.0 