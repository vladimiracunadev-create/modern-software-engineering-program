<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 721 603" width="721" height="603" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Suceso en un nodo» … «Híbrido: hora física acotada más contador»</title><desc id="d">Diagrama de flujo con 9 pasos. «Suceso en un nodo» lleva a «Qué pregunta». «Qué pregunta» lleva a «Reloj monotónico» (cuánto duró). «Qué pregunta» lleva a «Reloj de pared sincronizado» (qué hora era). «Qué pregunta» lleva a «Reloj lógico» (qué causó qué). «Reloj lógico» lleva a «Lamport: orden total consistente con causa». «Reloj lógico» lleva a «Vectorial: causa y concurrencia». «Reloj de pared sincronizado» lleva a «Desfase entre nodos». «Desfase entre nodos» lleva a «Híbrido: hora física acotada más contador».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="721" height="603" fill="#ffffff"/><path d="M283.5,66 L283.5,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M283.5,186 L283.5,194.0 Q283.5,202 275.5,202.0 L115.0,202.0 Q106,202 106.0,211.0 L106,252.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M283.5,186 L283.5,194.2 Q283.5,202 291.2,202.0 L291.2,202.0 Q299,202 299.0,209.8 L299,244" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M283.5,186 L283.5,194.0 Q283.5,202 291.5,202.0 L465.5,202.0 Q474.5,202 474.5,211.0 L474.5,252.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M474.5,296.5 L474.5,320.8 Q474.5,329.8 465.5,329.8 L401.0,329.8 Q392,329.8 392.0,338.8 L392,363" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M474.5,296.5 L474.5,325.5 Q474.5,334.5 483.5,334.5 L597.5,334.5 Q606.5,334.5 606.5,343.5 L606.5,372.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M299,305 L299.0,329.8 Q299,338.8 290.0,338.8 L142.6,338.8 Q133.6,338.8 133.6,347.8 L133.6,372.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M133.6,433.5 L133.6,461.5 Q133.6,467.2 127.9,467.2 L127.9,467.2 Q122.2,467.2 122.2,472.9 L122.2,501" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="195.5" y="22" width="176" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="283.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="283.5" dy="0">Suceso en un nodo</tspan></text><polygon points="283.5,124 366.5,155 283.5,186 200.5,155" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="283.5" y="159.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="283.5" dy="0">Qué pregunta</tspan></text><rect x="22" y="252.5" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="278.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Reloj monotónico</tspan></text><rect x="224" y="244" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="299" y="269.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="299" dy="0">Reloj de pared</tspan><tspan x="299" dy="19.2">sincronizado</tspan></text><rect x="408" y="252.5" width="133" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="474.5" y="278.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="474.5" dy="0">Reloj lógico</tspan></text><rect x="304" y="363" width="176" height="80" rx="10" fill="#dff1ee" stroke=