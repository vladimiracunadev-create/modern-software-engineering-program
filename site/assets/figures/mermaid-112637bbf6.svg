<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 1042" width="580" height="1042" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Dominio elegido» … «Entrega»</title><desc id="d">Diagrama de flujo con 11 pasos. «Dominio elegido» lleva a «Afirmación refutable». «Afirmación refutable» lleva a «Invariantes y modelo de referencia». «Invariantes y modelo de referencia» lleva a «Experimentos con semilla». «Experimentos con semilla» lleva a «Sensibilidad de supuestos». «Sensibilidad de supuestos» lleva a «Decisión con incertidumbre». «Decisión con incertidumbre» lleva a «Dosier de diez secciones». «Dosier de diez secciones» lleva a «Validador de forma». «Dosier de diez secciones» lleva a «Revisión de contenido». «Dosier de diez secciones» lleva a «Huella canónica». «Validador de forma» lleva a «Entrega». «Revisión de contenido» lleva a «Entrega». «Huella canónica» lleva a «Entrega».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="580" height="1042" fill="#ffffff"/><path d="M296,66 L296,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M296.1,185 L296.1,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M296.4,323 L296.4,381" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M296.9,442 L296.9,500" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M297.5,561 L297.5,619" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M298.1,680 L298.1,738" fill="none" stroke="#32505f" stroke-width