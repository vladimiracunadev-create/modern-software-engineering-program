<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 641 739" width="641" height="739" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Operación de negocio» … «Invariante protegida o rota»</title><desc id="d">Diagrama de flujo con 10 pasos. «Operación de negocio» lleva a «Transacción: todo o nada». «Transacción: todo o nada» lleva a «Qué ven las demás». «Qué ven las demás» lleva a «Lee lo confirmado». «Qué ven las demás» lleva a «Lee una instantánea». «Qué ven las demás» lleva a «Serializable». «Lee lo confirmado» lleva a «Anomalías: actualización perdida, lectura no repetible». «Lee una instantánea» lleva a «Anomalía: sesgo de escritura». «Serializable» lleva a «Costo: bloqueos o abortos y reintentos». «Anomalías: actualización perdida, lectura no repetible» lleva a «Invariante protegida o rota». «Anomalía: sesgo de escritura» lleva a «Invariante protegida o rota». «Costo: bloqueos o abortos y reintentos» lleva a «Invariante protegida o rota».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="641" height="739" fill="#ffffff"/><path d="M317.9,83 L317.9,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M318,202 L318,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M318,322 L318.0,346.2 Q318,355.2 309.0,355.2 L150.2,355.2 Q141.2,355.2 141.2,364.2 L141.2,388.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M321.6,322 L321.6,380" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M318,322 L318.0,346.2 Q318,355.2 3