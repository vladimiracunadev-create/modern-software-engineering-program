<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 613 243" width="613" height="243" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Tiempo de pared / CPU» … «Perfil como hipótesis»</title><desc id="d">Diagrama de flujo con 5 pasos. «Tiempo de pared / CPU» lleva a «Perfil determinista / muestreo». «Perfil determinista / muestreo» lleva a «Asignaciones, retención / pico». «Asignaciones, retención / pico» lleva a «I/O / red». «I/O / red» lleva a «Perfil como hipótesis». «Perfil como hipótesis» lleva a «Tiempo de pared / CPU» (fallo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="613" height="243" fill="#ffffff"/><path d="M181,62 L227,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M377,62 L423,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M507,92.5 L507,168.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M453.5,190.5 L364,190.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M240,190.5 L110.5,190.5 Q101.5,190.5 101.5,181.5 L101.5,92.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="31.5" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101.5" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101.5" dy="0">Tiempo de pared</tspan><tspan x="101.5" dy="19.2">/ CPU</tspan></text><rect x="227" y="22" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="302" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="302" dy="0">Perfil</tspan><tspan x="302" dy="19.2">determinista /</tspan><tspan x="302" dy="19.2">muestreo</tspan></text><rect x="423" y="31.5" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="507" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="507" dy="0">Asignaciones,</tspan><tspan x="507" dy="19.2">retención / pico</tspan></text><rect x="453.5" y="168.5" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="507" y="194.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="507" dy="0">I/O / red</tspan></text><rect x="240" y="160" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="302" y="185.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="302" dy="0">Perfil como</tspan><tspan x="302" dy="19.2">hipótesis</tspan></text><rect x="107.8" y="162.5" width="126" height="24" rx="4" fill="#ffffff"/><text x="170.8" y="178.4" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="170.8" dy="0">fallo o cambio</tspan></text></svg>
