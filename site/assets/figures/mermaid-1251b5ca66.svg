<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432 685" width="432" height="685" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Fuentes: páginas, ADR, API, runbooks» … «Informe de entrega»</title><desc id="d">Diagrama de flujo con 8 pasos. «Fuentes: páginas, ADR, API, runbooks» lleva a «Comprobadores». «Comprobadores» lleva a «Construcción reproducible». «Construcción reproducible» lleva a «Versiones etiquetadas». «Versiones etiquetadas» lleva a «Paquete con huella». «Comprobadores» lleva a «Auditoría con límites». «Versiones etiquetadas» lleva a «Política de enlaces entre versiones». «Auditoría con límites» lleva a «Informe de entrega». «Paquete con huella» lleva a «Informe de entrega». «Política de enlaces entre versiones» lleva a «Informe de entrega».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="432" height="685" fill="#ffffff"/><path d="M243.3,83 L243.3,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M243.3,185 L243.3,205.0 Q243.3,214 234.3,214.0 L160.5,214.0 Q151.5,214 151.5,223.0 L151.5,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M151.5,304 L151.5,324.0 Q151.5,333 160.5,333.0 L184.9,333.0 Q193.9,333 193.9,342.0 L193.9,362" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M193.9,423 L193.9,452.0 Q193.9,461 184.9,461.0 L123.5,461.0 Q114.5,461 114.5,470.0 L114.5,499" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M243.3,185 L243.3,205.0 Q243.3,214 252.3,214.0 L314.0,214.0 Q323,214 323.0,