<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 911 360" width="911" height="360" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Operación del analizador local de eventos» … «Prueba mínima siguiente»</title><desc id="d">Diagrama de flujo con 8 pasos. «Operación del analizador local de eventos» lleva a «Eventos de aplicación». «Operación del analizador local de eventos» lleva a «Métricas locales». «Operación del analizador local de eventos» lleva a «Código y stderr». «Contexto del sistema» lleva a «Correlación temporal». «Eventos de aplicación» lleva a «Correlación temporal». «Métricas locales» lleva a «Correlación temporal». «Código y stderr» lleva a «Correlación temporal». «Correlación temporal» lleva a «Hipótesis contrastables». «Hipótesis contrastables» lleva a «Prueba mínima siguiente».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="911" height="360" fill="#ffffff"/><path d="M164,180 L182.5,180.0 Q191.5,180 191.5,171.0 L191.5,61.5 Q191.5,52.5 200.5,52.5 L219,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M164,180 L186.8,180.0 Q195.8,180 195.8,171.0 L195.8,146.5 Q195.8,137.5 204.8,137.5 L227.5,137.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M164,180 L186.8,180.0 Q195.8,180 195.8,189.0 L195.8,213.5 Q195.8,222.5 204.8,222.5 L227.5,222.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M343,307.5 L357.0,307.5 Q366,307.5 366.0,298.5 L366.0,189.0 Q366,180 375.0,180.0 L389,180" fill="none" stroke="#32505f" stroke-width="1.8" marke