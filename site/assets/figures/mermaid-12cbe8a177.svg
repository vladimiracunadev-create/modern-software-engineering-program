<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 526 224" width="526" height="224" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Perfil de operaciones» … «Recomendación condicionada»</title><desc id="d">Diagrama de flujo con 5 pasos. «Perfil de operaciones» lleva a «Candidatos equivalentes». «Candidatos equivalentes» lleva a «Matriz de compromisos». «Matriz de compromisos» lleva a «Cargas adversarias». «Cargas adversarias» lleva a «Recomendación condicionada». «Recomendación condicionada» lleva a «Perfil de operaciones» (fallo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="526" height="224" fill="#ffffff"/><path d="M146,52.5 L196.5,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M329.5,52.5 L380,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M442,83 L442,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M380,171.5 L334,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M192,171.5 L93.0,171.5 Q84,171.5 84.0,162.5 L84,83" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="22" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="84" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="84" dy="0">Perfil de</tspan><tspan x="84" dy="19.2">operaciones</tspan></text><rect x="196.5" y="22" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="263" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="263" dy="0">Candidatos</tspan><tspan x="263" dy="19.2">equivalentes</tspan></text><rect x="380" y="22" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="442" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="442" dy="0">Matriz de</tspan><tspan x="442" dy="19.2">compromisos</tspan></text><rect x="380" y="141" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="442" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="442" dy="0">Cargas</tspan><tspan x="442" dy="19.2">adversarias</tspan></text><rect x="192" y="141" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="263" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="263" dy="0">Recomendación</tspan><tspan x="263" dy="19.2">condicionada</tspan></text><rect x="53.4" y="143.5" width="126" height="24" rx="4" fill="#ffffff"/><text x="116.4" y="159.4" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="116.4" dy="0">fallo o cambio</tspan></text></svg>
