idth="1.6"/><text x="336" y="664" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="336" dy="0">¿Cumple los</tspan><tspan x="336" dy="19.2">criterios de</tspan><tspan x="336" dy="19.2">aceptación?</tspan></text><rect x="165.6" y="797" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="245.1" y="822.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="245.1" dy="0">Corregir datos,</tspan><tspan x="245.1" dy="19.2">umbral o modelo</tspan></text><rect x="358.6" y="797" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="451.1" y="822.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="451.1" dy="0">Ficha del modelo y</tspan><tspan x="451.1" dy="19.2">registro</tspan></text><rect x="251.1" y="764" width="29" height="24" rx="4" fill="#ffffff"/><text x="265.6" y="779.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="265.6" dy="0">no</tspan></text><rect x="457.1" y="764" width="29" height="24" rx="4" fill="#ffffff"/><text x="471.6" y="779.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="471.6" dy="0">sí</tspan></text></svg>
