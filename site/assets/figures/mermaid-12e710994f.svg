<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 835 880" width="835" height="880" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Decisión y costo de cada error» y «Puntaje del modelo» … «Corregir datos, umbral o modelo» y «Ficha del modelo y registro»</title><desc id="d">Diagrama de flujo con 11 pasos. «Decisión y costo de cada error» lleva a «Métrica de decisión». «Métrica de decisión» lleva a «Umbral por costo». «Puntaje del modelo» lleva a «Umbral por costo». «Puntaje del modelo» lleva a «Calibración». «Puntaje del modelo» lleva a «Desglose por grupo». «Umbral por costo» lleva a «Tasas de error por grupo». «Desglose por grupo» lleva a «Tasas de error por grupo». «Calibración» lleva a «Informe con intervalos y tamaño de muestra». «Tasas de error por grupo» lleva a «Informe con intervalos y tamaño de muestra». «Informe con intervalos y tamaño de muestra» lleva a «¿Cumple los criterios de aceptación?». «¿Cumple los criterios de aceptación?» lleva a «Corregir datos, umbral o modelo» (no). «¿Cumple los criterios de aceptación?» lleva a «Ficha del modelo y registro» (sí).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="835" height="880" fill="#ffffff"/><path d="M106,83 L106,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M106,202 L106.0,222.0 Q106,231 115.0,231.0 L180.6,231.0 Q189.6,231 189.6,240.0 L189.6,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M533.8,52.5 L296.6,52.5 Q287.6,52.5 287.6,61.5 L287.6,275.0 Q287.6,282 280.6,282.0 L273.6,282" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M626.3,74.5 L626.3,103.0 Q626.3,112 617.3,112.0 L541.0,112.0 Q532,112 532.0,121.0 L532,149.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M626.3,74.5 L626.3,103.0 Q626.3,112 635.3,112.0 L711.5,112.0 Q720.5,112 720.5,121.0 L720.5,149.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M189.6,304 L189.6,324.0 Q189.6,333 198.6,333.0 L244.9,333.0 Q253.9,333 253.9,342.0 L253.9,362" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M628,171.5 L617.0,171.5 Q608,171.5 608.0,180.5 L608.0,383.5 Q608,392.5 599.0,392.5 L346.4,392.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M470,171.5 L412.6,171.5 Q403.6,171.5 403.6,180.5 L403.6,514.0 Q403.6,521 396.6,521.0 L389.6,521" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M253.9,423 L253.9,443.0 Q253.9,452 262.9,452.0 L292.6,452.0 Q301.6,452 301.6,461.0 L301.6,481" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M301.6,561 L301.6,581.0 Q301.6,590 310.6,590.0 L327.0,590.0 Q336,590 336.0,599.0 L336,619" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M336,739 L336.0,747.0 Q336,755 328.0,755.0 L254.1,755.0 Q245.1,755 245.1,764.0 L245.1,797" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M336,739 L336.0,747.0 Q336,755 344.0,755.0 L442.1,755.0 Q451.1,755 451.1,764.0 L451.1,797" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="22" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Decisión y costo</tspan><tspan x="106" dy="19.2">de cada error</tspan></text><rect x="48.5" y="141" width="115" height="61" rx="10" fill