<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 873 88" width="873" height="88" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «🎯 Fricción» … «📈 Adopción»</title><desc id="d">Diagrama de flujo con 5 pasos. «🎯 Fricción» lleva a «🧠 Hipótesis». «🧠 Hipótesis» lleva a «🛠️ Herramienta». «🛠️ Herramienta» lleva a «🔎 Feedback». «🔎 Feedback» lleva a «📈 Adopción».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="873" height="88" fill="#ffffff"/><path d="M144,44 L190,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M321,44 L367,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M515,44 L561,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M683,44 L729,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="22" width="122" height="44" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="83" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="83" dy="0">🎯 Fricción</tspan></text><rect x="190" y="22" width="131" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="255.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="255.5" dy="0">🧠 Hipótesis</tspan></text><rect x="367" y="22" width="148" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="441" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="441" dy="0">🛠️ Herramienta</tspan></text><rect x="561" y="22" width="122" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="622" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="622" dy="0">🔎 Feedback</tspan></text><rect x="729" y="22" width="122" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="790" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="790" dy="0">📈 Adopción</tspan></text></svg>
