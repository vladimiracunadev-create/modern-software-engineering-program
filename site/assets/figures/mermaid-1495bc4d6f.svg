<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 834 740" width="834" height="740" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Entradas del servicio», «Salidas del modelo» y «Etiquetas con retraso» … «Entrenar, evaluar, desplegar por etapas» y «Corregir la fuente o ajustar el umbral»</title><desc id="d">Diagrama de flujo con 12 pasos. «Entradas del servicio» lleva a «Calidad: rango, nulos, esquema». «Entradas del servicio» lleva a «Distribución: PSI, KS por característica». «Salidas del modelo» lleva a «Distribución del puntaje y tasa de marcados». «Etiquetas con retraso» lleva a «Métrica real por segmento». «Calidad: rango, nulos, esquema» lleva a «¿Alerta?» (inmediato). «Distribución: PSI, KS por característica» lleva a «¿Alerta?» (horas). «Distribución del puntaje y tasa de marcados» lleva a «¿Alerta?» (horas). «Métrica real por segmento» lleva a «¿Alerta?» (semanas). «¿Alerta?» lleva a «Diagnóstico: runbook» (sí). «Diagnóstico: runbook» lleva a «¿Reentrenar?». «¿Reentrenar?» lleva a «Entrenar, evaluar, desplegar por etapas» (sí). «¿Reentrenar?» lleva a «Corregir la fuente o ajustar el umbral» (no).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="834" height="740" fill="#ffffff"/><path d="M204.5,83 L204.5,107.8 Q204.5,116.8 195.5,116.8 L110.5,116.8 Q101.5,116.8 101.5,125.8 L101.5,150.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M204.5,83 L204.5,103.0 Q204.5,112 213.5,112.0 L298.5,112.0 Q307.5,112 307.5,121.0 L307.5,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d