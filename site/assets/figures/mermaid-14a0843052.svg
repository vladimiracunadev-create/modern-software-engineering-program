<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 553 262" width="553" height="262" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Estado como memoria de la ejecución» … «Estado local, compartido / persistente»</title><desc id="d">Diagrama de flujo con 5 pasos. «Estado como memoria de la ejecución» lleva a «Comandos, expresiones / secuencia». «Comandos, expresiones / secuencia» lleva a «Asignación, aliasing / mutación». «Asignación, aliasing / mutación» lleva a «Invariantes alrededor de transiciones». «Invariantes alrededor de transiciones» lleva a «Estado local, compartido / persistente». «Estado local, compartido / persistente» lleva a «Estado como memoria de la ejecución» (fallo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="553" height="262" fill="#ffffff"/><path d="M164,62 L210,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M352,62 L402.5,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M464.5,102 L464.5,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M398,200 L352,200" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M210,200 L102.0,200.0 Q93,200 93.0,191.0 L93,102" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="22" width="142" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="93" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="93" dy="0">Estado como</tspan><tspan x="93" dy="19.2">memoria de la</tspan><tspan x="93" dy="19.2">ejecución</tspan></text><rect x="210" y="22" width="142" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="281" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="281" dy="0">Comandos,</tspan><tspan x="281" dy="19.2">expresiones /</tspan><tspan x="281" dy="19.2">secuencia</tspan></text><rect x="402.5" y="22" width="124" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="464.5" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="464.5" dy="0">Asignación,</tspan><tspan x="464.5" dy="19.2">aliasing /</tspan><tspan x="464.5" dy="19.2">mutación</tspan></text><rect x="398" y="160" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="464.5" y="185" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="464.5" dy="0">Invariantes</tspan><tspan x="464.5" dy="19.2">alrededor de</tspan><tspan x="464.5" dy="19.2">transiciones</tspan></text><rect x="210" y="160" width="142" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="281" y="185" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="281" dy="0">Estado local,</tspan><tspan x="281" dy="19.2">compartido /</tspan><tspan x="281" dy="19.2">persistente</tspan></text><rect x="76.8" y="172" width="126" height="24" rx="4" fill="#ffffff"/><text x="139.8" y="187.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="139.8" dy="0">fallo o cambio</tspan></text></svg>
