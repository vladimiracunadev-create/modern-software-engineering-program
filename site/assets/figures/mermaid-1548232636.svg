<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 917 105" width="917" height="105" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «🎯 Modelo de máquina» … «📈 Recuperación»</title><desc id="d">Diagrama de flujo con 5 pasos. «🎯 Modelo de máquina» lleva a «🧠 Recursos». «🧠 Recursos» lleva a «🛠️ Concurrencia». «🛠️ Concurrencia» lleva a «🔎 Medición». «🔎 Medición» lleva a «📈 Recuperación».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="917" height="105" fill="#ffffff"/><path d="M153,52.5 L199,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M321,52.5 L367,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M524,52.5 L570,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M692,52.5 L738,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="22" width="131" height="61" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="87.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="87.5" dy="0">🎯 Modelo de</tspan><tspan x="87.5" dy="19.2">máquina</tspan></text><rect x="199" y="30.5" width="122" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="260" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="260" dy="0">🧠 Recursos</tspan></text><rect x="367" y="30.5" width="157" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="445.5" y="56.7" font-size="15" text-ancho