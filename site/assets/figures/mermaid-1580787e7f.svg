<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 776 381" width="776" height="381" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Calidad por riesgo» … «Proyecto: estrategia ejecutable»</title><desc id="d">Diagrama de flujo con 12 pasos. «Calidad por riesgo» lleva a «Pruebas unitarias y testabilidad». «Pruebas unitarias y testabilidad» lleva a «Integración y contratos». «Integración y contratos» lleva a «Extremo a extremo y aceptación». «Extremo a extremo y aceptación» lleva a «Propiedades y modelos». «Propiedades y modelos» lleva a «Mutación y fuzzing». «Mutación y fuzzing» lleva a «Dobles y entornos». «Dobles y entornos» lleva a «Datos y fixtures deterministas». «Datos y fixtures deterministas» lleva a «Exploración». «Exploración» lleva a «Flakiness y mantenimiento». «Flakiness y mantenimiento» lleva a «Taller: demostrar la detección». «Taller: demostrar la detección» lleva a «Proyecto: estrategia ejecutable». «Proyecto: estrategia ejecutable» lleva a «Calidad por riesgo» (incidente o hallazgo).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="776" height="381" fill="#ffffff"/><path d="M168,62 L240.5,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M373.5,62 L424,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M566,62 L625.5,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M683,102 L683,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M612,190.5 L552.5,190.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M437.5,190.5 L356,190.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M258,190.5 L190,190.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M106,221 L106,297" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M168,319 L236,319" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M378,319 L428.5,319" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M561.5,319 L625.5,319" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M683,279 L683.0,244.0 Q683,235 674.0,235.0 L213.0,235.0 Q204,235 204.0,226.0 L204.0,115.5 Q204,106.5 195.0,106.5 L113.0,106.5 Q106,106.5 106.0,99.5 L106,92.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="44" y="31.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Calidad por</tspan><tspan x="106" dy="19.2">riesgo</tspan></text><rect x="240.5" y="22" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="307" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="307" dy="0">Pruebas</tspan><tspan x="307" dy="19.2">unitarias y</tspan><tspan x="307" dy="19.2">testabilidad</tspan></text><rect x="424" y="31.5" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="495" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="495" dy="0">Integración y</tspan><tspan x="495" dy="19.2">contratos</tspan></text><rect x="625.5" y="22" width="115" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="683" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="683" dy="0">Extremo a</tspan><tspan x="683" dy="19.2">extremo y</tspan><tspan x="683" dy="19.2">aceptación</tspan></text><rect x="612" y="160" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="683" y="185.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="683" dy="0">Propiedades y</tspan><tspan x="683" dy="19.2">modelos</tspan></text><rect x="437.5" y="160" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="495" y="185.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="495" dy="0">Mutación y</tspan><tspan x="495" dy="19.2">fuzzing</tspan></text><rect x="258" y="160" width="98" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="307" y="185.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="307" dy="0">Dobles y</tspan><tspan x="307" dy="19.2">entornos</tspan></text><rect x="22" y="160" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="185.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Datos y fixtures</tspan><tspan x="106" dy="19.2">deterministas</tspan></text><rect x="44" y="297" width="124" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="323.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Exploración</tspan></text><rect x="236" y="288.5" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="307" y="313.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="307" dy="0">Flakiness y</tspan><tspan x="307" dy="19.2">mantenimiento</tspan></text><rect x="428.5" y="279" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="495" y="304" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="495" dy="0">Taller:</tspan><tspan x="495" dy="19.2">demostrar la</tspan><tspan x="495" dy="19.2">detección</tspan></text><rect x="625.5" y="279" width="115" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="683" y="304" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="683" dy="0">Proyecto:</tspan><tspan x="683" dy="19.2">estrategia</tspan><tspan x="683" dy="19.2">ejecutable</tspan></text><rect x="296.7" y="239" width="102" height="42" rx="4" fill="#ffffff"/><text x="347.7" y="254.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="347.7" dy="0">incidente o</tspan><tspan x="347.7" dy="17.92">hallazgo</tspan></text></svg>
