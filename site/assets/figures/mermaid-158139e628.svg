<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 774 343" width="774" height="343" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Modelo de aplicación» … «Cliente con sincronización»</title><desc id="d">Diagrama de flujo con 12 pasos. «Modelo de aplicación» lleva a «Ciclo de vida». «Ciclo de vida» lleva a «Construcción». «Construcción» lleva a «Almacenamiento y sincronización». «Almacenamiento y sincronización» lleva a «Permisos y capacidades». «Permisos y capacidades» lleva a «Interacción y accesibilidad». «Interacción y accesibilidad» lleva a «Distribución y versiones». «Distribución y versiones» lleva a «Offline y conflictos». «Offline y conflictos» lleva a «Recursos». «Recursos» lleva a «Seguridad del cliente». «Seguridad del cliente» lleva a «Dos plataformas». «Dos plataformas» lleva a «Cliente con sincronización». «Cliente con sincronización» lleva a «Modelo de aplicación» (medición o fallo).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="774" height="343" fill="#ffffff"/><path d="M137,52.5 L187,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M329,52.5 L392,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M525,52.5 L584,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M668,83 L668,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M606,171.5 L529.5,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M387.5,171.5 L333,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M183,171.5 L137,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M79.5,202 L79.5,268.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M128.5,290.5 L187,290.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M329,290.5 L379,290.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M538,290.5 L593,290.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M668,260 L668.0,225.0 Q668,216 659.0,216.0 L160.0,216.0 Q151,216 151.0,207.0 L151.0,106.0 Q151,97 142.0,97.0 L86.5,97.0 Q79.5,97 79.5,90.0 L79.5,83" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="22" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="79.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="79.5" dy="0">Modelo de</tspan><tspan x="79.5" dy="19.2">aplicación</tspan></text><rect x="187" y="30.5" width="142" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="258" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="258" dy="0">Ciclo de vida</tspan></text><rect x="392" y="30.5" width="133" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="458.5" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="458.5" dy="0">Construcción</tspan></text><rect x="584" y="22" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="668" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="668" dy="0">Almacenamiento y</tspan><tspan x="668" dy="19.2">sincronización</tspan></text><rect x="606" y="141" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="668" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="668" dy="0">Permisos y</tspan><tspan x="668" dy="19.2">capacidades</tspan></text><rect x="387.5" y="141" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="458.5" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="458.5" dy="0">Interacción y</tspan><tspan x="458.5" dy="19.2">accesibilidad</tspan></text><rect x="183" y="141" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="258" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="258" dy="0">Distribución y</tspan><tspan x="258" dy="19.2">versiones</tspan></text><rect x="22" y="141" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="79.5" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="79.5" dy="0">Offline y</tspan><tspan x="79.5" dy="19.2">conflictos</tspan></text><rect x="30.5" y="268.5" width="98" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="79.5" y="294.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="79.5" dy="0">Recursos</tspan></text><rect x="187" y="260" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="258" y="285.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="258" dy="0">Seguridad del</tspan><tspan x="258" dy="19.2">cliente</tspan></text><rect x="379" y="268.5" width="159" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="458.5" y="294.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="458.5" dy="0">Dos plataformas</tspan></text><rect x="593" y="260" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="668" y="285.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="668" dy="0">Cliente con</tspan><tspan x="668" dy="19.2">sincronización</tspan></text><rect x="362.5" y="220" width="94" height="42" rx="4" fill="#ffffff"/><text x="409.5" y="235.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="409.5" dy="0">medición o</tspan><tspan x="409.5" dy="17.92">fallo</tspan></text></svg>
