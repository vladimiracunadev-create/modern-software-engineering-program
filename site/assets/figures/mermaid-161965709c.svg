<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 455 821" width="455" height="821" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Historia de usuario» … «Respuesta a vulnerabilidades»</title><desc id="d">Diagrama de flujo con 9 pasos. «Historia de usuario» lleva a «Casos de abuso». «Casos de abuso» lleva a «Requisito negativo». «Requisito negativo» lleva a «Prueba que falla si la defensa se rompe». «Prueba que falla si la defensa se rompe» lleva a «Integración continua». «Historia de usuario» lleva a «Diseño y revisión». «Diseño y revisión» lleva a «Análisis estático y de dependencias». «Integración continua» lleva a «Evidencia por versión». «Análisis estático y de dependencias» lleva a «Evidencia por versión». «Evidencia por versión» lleva a «Respuesta a vulnerabilidades». «Respuesta a vulnerabilidades» lleva a «Casos de abuso» (lección).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="455" height="821" fill="#ffffff"/><path d="M236.1,83 L236.1,103.0 Q236.1,112 227.1,112.0 L146.6,112.0 Q137.6,112 137.6,121.0 L137.6,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M134,185 L134,251.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M130.5,295.5 L130.5,321.4 Q130.5,328.8 137.9,328.8 L137.9,328.8 Q145.3,328.8 145.3,336.2 L145.3,362" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M145.3,442 L145.3,464.1 Q145.3,471 152.2,471.0 L152.2,471.0 Q159.1,471 159.1,477.9 L159.1,500" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arro