<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 658 243" width="658" height="243" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Intento de comunicación» … «Evidencia para la siguiente clase»</title><desc id="d">Diagrama de flujo con 6 pasos. «Intento de comunicación» lleva a «Observación localizada». «Observación localizada» lleva a «Hipótesis y alternativa». «Hipótesis y alternativa» lleva a «Prueba discriminante». «Prueba discriminante» lleva a «Decisión reversible». «Decisión reversible» lleva a «Evidencia para la siguiente clase». «Prueba discriminante» lleva a «Hipótesis y alternativa» (no separa hipótesis).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="658" height="243" fill="#ffffff"/><path d="M163.5,52.5 L218,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M342,52.5 L397,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M459,83 L459,150.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M388,181 L337.5,181" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M222.5,181 L172,181" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M530,181 L537.0,181.0 Q544,181 544.0,174.0 L544.0,61.5 Q544,52.5 535.0,52.5 L521,52.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="30.5" y="22" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="97" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="97" dy="0">Intento de</tspan><tspan x="97" dy="19.2">comunicación</tspan></text><rect x="218" y="22" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="280" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="280" dy="0">Observación</tspan><tspan x="280" dy="19.2">localizada</tspan></text><rect x="397" y="22" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="459" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="459" dy="0">Hipótesis y</tspan><tspan x="459" dy="19.2">alternativa</tspan></text><rect x="388" y="150.5" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="459" y="175.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="459" dy="0">Prueba</tspan><tspan x="459" dy="19.2">discriminante</tspan></text><rect x="222.5" y="150.5" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="280" y="175.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="280" dy="0">Decisión</tspan><tspan x="280" dy="19.2">reversible</tspan></text><rect x="22" y="141" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="97" y="166" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="97" dy="0">Evidencia para</tspan><tspan x="97" dy="19.2">la siguiente</tspan><tspan x="97" dy="19.2">clase</tspan></text><rect x="550" y="95.8" width="86" height="42" rx="4" fill="#ffffff"/><text x="593" y="111.7" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="593" dy="0">no separa</tspan><tspan x="593" dy="17.92">hipótesis</tspan></text></svg>
