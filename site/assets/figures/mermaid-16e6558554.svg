<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 534 207" width="534" height="207" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Pregunta» … «Decisión provisional»</title><desc id="d">Diagrama de flujo con 6 pasos. «Pregunta» lleva a «Hipótesis». «Hipótesis» lleva a «Prueba». «Prueba» lleva a «Observación». «Observación» lleva a «Interpretación». «Interpretación» lleva a «Decisión provisional». «Decisión provisional» lleva a «Pregunta».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="534" height="207" fill="#ffffff"/><path d="M133,44 L213.5,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M320.5,44 L409.5,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M450,66 L450,132.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M388,154.5 L342,154.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M192,154.5 L146,154.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M84,124 L84,66" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="35" y="22" width="98" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="84" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="84" dy="0">Pregunta</tspan></text><rect x="213.5" y="22" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="267" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="267" dy="0">Hipótesis</tspan></text><rect x="409.5" y="22" width="81" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="450" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="450" dy="0">Prueba</tspan></text><rect x="388" y="132.5" width="124" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="450" y="158.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="450" dy="0">Observación</tspan></text><rect x="192" y="132.5" width="150" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="267" y="158.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="267" dy="0">Interpretación</tspan></text><rect x="22" y="124" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="84" y="149.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="84" dy="0">Decisión</tspan><tspan x="84" dy="19.2">provisional</tspan></text></svg>
