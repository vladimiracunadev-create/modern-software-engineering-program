<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 428 590" width="428" height="590" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Entrada» … «Descartar tiempo acumulado» y «Presentar fotograma»</title><desc id="d">Diagrama de flujo con 7 pasos. «Entrada» lleva a «Acumular tiempo». «Acumular tiempo» lleva a «Hay un paso fijo completo?». «Hay un paso fijo completo?» lleva a «Actualizar estado un paso» (sí). «Actualizar estado un paso» lleva a «Hay un paso fijo completo?». «Hay un paso fijo completo?» lleva a «Dibujar con interpolación» (no). «Dibujar con interpolación» lleva a «Presentar fotograma». «Presentar fotograma» lleva a «Entrada». «Actualizar estado un paso» lleva a «Descartar tiempo acumulado» (más pasos de los permitidos).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="428" height="590" fill="#ffffff"/><path d="M221.5,66 L221.5,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M221.8,168 L221.8,226" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M222.1,312 L222.1,320.0 Q222.1,328 214.1,328.0 L135.0,328.0 Q126,328 126.0,337.0 L126,370" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M222.1,312 L222.1,320.0 Q222.1,328 230.1,328.0 L310.0,328.0 Q319,328 319.0,337.0 L319,370" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M319.1,431 L319.1,507" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M126.1,431 L126.1,507" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M38,400.5 L31.0,400.5 Q24,400.5 24.0,393.5 L24.0,278.0 Q24,269 33.0,269.0 L86.6,269" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><path d="M372.7,537.5 L395.0,537.5 Q404,537.5 404.0,528.5 L404.0,53.0 Q404,44 395.0,44.0 L266,44" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="177" y="22" width="89" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="221.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="221.5" dy="0">Entrada</tspan></text><rect x="142" y="124" width="159" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="221.5" y="150.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="221.5" dy="0">Acumular tiempo</tspan></text><polygon points="222.1,226 357.6,269 222.1,312 86.6,269" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="222.1" y="263.6" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="222.1" dy="0">Hay un paso fijo</tspan><tspan x="222.1" dy="19.2">completo?</tspan></text><rect x="38" y="370" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="126" y="395.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="126" dy="0">Actualizar estado</tspan><tspan x="126" dy="19.2">un paso</tspan></text><rect x="248" y="370" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="319" y="395.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="319" dy="0">Dibujar con</tspan><tspan x="319" dy="19.2">interpolación</tspan></text><rect x="265.7" y="507" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="319.2" y="532.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="319.2" dy="0">Presentar</tspan><tspan x="319.2" dy="19.2">fotograma</tspan></text><rect x="42.2" y="507" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="126.2" y="532.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="126.2" dy="0">Descartar tiempo</tspan><tspan x="126.2" dy="19.2">acumulado</tspan></text><rect x="132" y="337" width="29" height="24" rx="4" fill="#ffffff"/><text x="146.5" y="352.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="146.5" dy="0">sí</tspan></text><rect x="325" y="337" width="29" height="24" rx="4" fill="#ffffff"/><text x="339.5" y="352.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="339.5" dy="0">no</tspan></text><rect x="132.1" y="448" width="126" height="42" rx="4" fill="#ffffff"/><text x="195.1" y="463.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="195.1" dy="0">más pasos de</tspan><tspan x="195.1" dy="17.92">los permitidos</tspan></text></svg>
