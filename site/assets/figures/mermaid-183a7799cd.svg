<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 538" width="590" height="538" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Datos» … «Interactividad»</title><desc id="d">Diagrama de flujo con 8 pasos. «Datos» lleva a «Dónde se construye el HTML». «Dónde se construye el HTML» lleva a «Cliente» (navegador). «Dónde se construye el HTML» lleva a «Servidor» (petición). «Dónde se construye el HTML» lleva a «Estático» (publicación). «Dónde se construye el HTML» lleva a «Regeneración» (caducidad). «Cliente» lleva a «Primer contenido». «Servidor» lleva a «Primer contenido». «Estático» lleva a «Primer contenido». «Regeneración» lleva a «Primer contenido». «Primer contenido» lleva a «Interactividad». «Interactividad» lleva a «Dónde se construye el HTML» (desajuste o dato viejo).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="590" height="538" fill="#ffffff"/><path d="M265.5,66 L265.5,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M265.5,210 L265.5,218.0 Q265.5,226 257.5,226.0 L75.5,226.0 Q66.5,226 66.5,235.0 L66.5,268" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M265.5,210 L265.5,218.0 Q265.5,226 257.5,226.0 L203.0,226.0 Q194,226 194.0,235.0 L194,268" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M265.5,210 L265.5,218.0 Q265.5,226 273.5,226.0 L317.0,226.0 Q326,226 326.0,235.0 L326,268" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M265.5,210 L265.5,218.0 Q265.5,226 273.5,226.0 L466.5,226.0 Q475.5,22