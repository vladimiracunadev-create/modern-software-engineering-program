<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 643" width="500" height="643" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Sistema externo: su modelo y su vocabulario» … «Resto del sistema» y «Revisión humana o regla nueva»</title><desc id="d">Diagrama de flujo con 8 pasos. «Sistema externo: su modelo y su vocabulario» lleva a «Capa anticorrupción». «Capa anticorrupción» lleva a «¿Se puede traducir sin ambigüedad?». «¿Se puede traducir sin ambigüedad?» lleva a «Modelo de dominio propio» (sí). «¿Se puede traducir sin ambigüedad?» lleva a «Cuarentena con motivo» (no). «Capa anticorrupción» lleva a «Original conservado». «Modelo de dominio propio» lleva a «Resto del sistema». «Cuarentena con motivo» lleva a «Revisión humana o regla nueva». «Sistema externo: su modelo y su vocabulario» lleva a «Capa anticorrupción» (cambia el proveedor).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="500" height="643" fill="#ffffff"/><path d="M328.4,102 L328.4,178" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M328.4,239 L328.4,259.0 Q328.4,268 319.4,268.0 L186.5,268.0 Q177.5,268 177.5,277.0 L177.5,297" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M177.5,383 L177.5,391.0 Q177.5,399 169.5,399.0 L119.0,399.0 Q110,399 110.0,408.0 L110,441" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M177.5,383 L177.5,391.0 Q177.5,399 185.5,399.0 L298.0,399.0 Q307,399 307.0,408.0 L307,441" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M328.4,239 L328.4,265.2 Q328.4,274.2 337.4,274.2 L411.5,274.2 Q420.5,274.2 420.5,283.2 L420.5,309.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M110,502 L110.0,529.0 Q110,535.2 116.2,535.2 L116.2,535.2 Q122.5,535.2 122.5,541.5 L122.5,568.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M307,502 L307.0,522.0 Q307,531 316.0,531.0 L323.5,531.0 Q332.5,531 332.5,540.0 L332.5,560" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M328.4,102 L328.4,178" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="244.4" y="22" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="328.4" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="328.4" dy="0">Sistema externo:</tspan><tspan x="328.4" dy="19.2">su modelo y su</tspan><tspan x="328.4" dy="19.2">vocabulario</tspan></text><rect x="253.4" y="178" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="328.4" y="203.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="328.4" dy="0">Capa</tspan><tspan x="328.4" dy="19.2">anticorrupción</tspan></text><polygon points="177.5,297 329,340 177.5,383 26,340" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="177.5" y="334.6" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="177.5" dy="0">¿Se puede traducir</tspan><tspan x="177.5" dy="19.2">sin ambigüedad?</tspan></text><rect x="22" y="441" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="110" y="466.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">Modelo de dominio</tspan><tspan x="110" dy="19.2">propio</tspan></text><rect x="232" y="441" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="307" y="466.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="307" dy="0">Cuarentena con</tspan><tspan x="307" dy="19.2">motivo</tspan></text><rect x="363" y="309.5" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="420.5" y="334.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="420.5" dy="0">Original</tspan><tspan x="420.5" dy="19.2">conservado</tspan></text><rect x="34.5" y="568.5" width="176" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="122.5" y="594.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="122.5" dy="0">Resto del sistema</tspan></text><rect x="244.5" y="560" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="332.5" y="585.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="332.5" dy="0">Revisión humana o</tspan><tspan x="332.5" dy="19.2">regla nueva</tspan></text><rect x="116" y="408" width="29" height="24" rx="4" fill="#ffffff"/><text x="130.5" y="423.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="130.5" dy="0">sí</tspan></text><rect x="313" y="408" width="29" height="24" rx="4" fill="#ffffff"/><text x="327.5" y="423.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="327.5" dy="0">no</tspan></text><rect x="334.4" y="119" width="86" height="42" rx="4" fill="#ffffff"/><text x="377.4" y="134.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="377.4" dy="0">cambia el</tspan><tspan x="377.4" dy="17.92">proveedor</tspan></text></svg>
