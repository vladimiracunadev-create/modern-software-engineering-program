<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 444 878" width="444" height="878" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Control declarado en la política» … «Revisión periódica»</title><desc id="d">Diagrama de flujo con 9 pasos. «Control declarado en la política» lleva a «Hipótesis falsable con tolerancia». «Hipótesis falsable con tolerancia» lleva a «Ensayos: n repeticiones del evento». «Ensayos: n repeticiones del evento» lleva a «¿Cuántas fallas?». «¿Cuántas fallas?» lleva a «Evidencia: la tasa de fallas es menor que el límite» (ninguna con n suficiente). «¿Cuántas fallas?» lleva a «Hallazgo: control débil» (alguna). «Evidencia: la tasa de fallas es menor que el límite» lleva a «Registro versionado y huella». «Hallazgo: control débil» lleva a «Corrección y nueva serie de ensayos». «Registro versionado y huella» lleva a «Revisión periódica».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="444" height="878" fill="#ffffff"/><path d="M219,83 L219,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M219.4,202 L219.4,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M220.4,340 L220.4,398" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M221,460 L221.0,468.0 Q221,476 213.0,476.0 L123.5,476.0 Q114.5,476 114.5,485.0 L114.5,536" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M221,460 L221.0,468.0 Q221,476 229.0,476.0 L320.0,476.0 Q329,476 329.0,485.0 L329,545.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M115.3,616 L115.3,674" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M329.1,606.5 L329.1,683.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M116.8,754 L116.8,812" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="131" y="22" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="219" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="219" dy="0">Control declarado</tspan><tspan x="219" dy="19.2">en la política</tspan></text><rect x="126.5" y="141" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="219" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="219" dy="0">Hipótesis falsable</tspan><tspan x="219" dy="19.2">con tolerancia</tspan></text><rect x="135.8" y="260" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="219.8" y="285" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="219.8" dy="0">Ensayos: n</tspan><tspan x="219.8" dy="19.2">repeticiones del</tspan><tspan x="219.8" dy="19.2">evento</tspan></text><polygon points="221,398 329.5,429 221,460 112.5,429" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="221" y="433.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="221" dy="0">¿Cuántas fallas?</tspan></text><rect x="22" y="536" width="185" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="114.5" y="561" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="114.5" dy="0">Evidencia: la tasa</tspan><tspan x="114.5" dy="19.2">de fallas es menor</tspan><tspan x="114.5" dy="19.2">que el límite</tspan></text><rect x="241" y="545.5" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="329" y="570.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="329" dy="0">Hallazgo: control</tspan><tspan x="329" dy="19.2">débil</tspan></text><rect x="49.6" y="674" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="116.1" y="699" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="116.1" dy="0">Registro</tspan><tspan x="116.1" dy="19.2">versionado y</tspan><tspan x="116.1" dy="19.2">huella</tspan></text><rect x="236.7" y="683.5" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="329.2" y="708.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="329.2" dy="0">Corrección y nueva</tspan><tspan x="329.2" dy="19.2">serie de ensayos</tspan></text><rect x="25.1" y="812" width="185" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="117.6" y="838.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="117.6" dy="0">Revisión periódica</tspan></text><rect x="120.5" y="485" width="118" height="42" rx="4" fill="#ffffff"/><text x="179.5" y="500.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="179.5" dy="0">ninguna con n</tspan><tspan x="179.5" dy="17.92">suficiente</tspan></text><rect x="335" y="498.8" width="61" height="24" rx="4" fill="#ffffff"/><text x="365.5" y="514.7" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="365.5" dy="0">alguna</tspan></text></svg>
