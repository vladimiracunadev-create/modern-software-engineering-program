<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 814 166" width="814" height="166" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Búsqueda lineal / binaria» … «Selección parcial»</title><desc id="d">Diagrama de flujo con 5 pasos. «Búsqueda lineal / binaria» lleva a «Contrato de comparación». «Contrato de comparación» lleva a «Estabilidad». «Estabilidad» lleva a «Familias de ordenamiento». «Familias de ordenamiento» lleva a «Selección parcial». «Selección parcial» lleva a «Búsqueda lineal / binaria» (fallo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="814" height="166" fill="#ffffff"/><path d="M120,104 L166,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M290,104 L336,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M460,104 L506,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M639,104 L685,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M738.5,73.5 L738.5,59.0 Q738.5,50 729.5,50.0 L78.0,50.0 Q71,50 71.0,57.0 L71,64" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="64" width="98" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="71" y="89" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="71" dy="0">Búsqueda</tspan><tspan x="71" dy="19.2">lineal /</tspan><tspan x="71" dy="19.2">binaria</tspan></text><rect x="166" y="73.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="228" y="98.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="228" dy="0">Contrato de</tspan><tspan x="228" dy="19.2">comparación</tspan></text><rect x="336" y="82" width="124" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="398" y="108.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="398" dy="0">Estabilidad</tspan></text><rect x="506" y="73.5" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="572.5" y="98.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="572.5" dy="0">Familias de</tspan><tspan x="572.5" dy="19.2">ordenamiento</tspan></text><rect x="685" y="73.5" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="738.5" y="98.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="738.5" dy="0">Selección</tspan><tspan x="738.5" dy="19.2">parcial</tspan></text><rect x="341.8" y="22" width="126" height="24" rx="4" fill="#ffffff"/><text x="404.8" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="404.8" dy="0">fallo o cambio</tspan></text></svg>
