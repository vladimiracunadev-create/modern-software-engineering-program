<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 932 820" width="932" height="820" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Tipo de cambio probable» … «Se retira la estructura»</title><desc id="d">Diagrama de flujo con 14 pasos. «Tipo de cambio probable» lleva a «Principio que lo atiende». «Principio que lo atiende» lleva a «Responsabilidad única: separar razones». «Principio que lo atiende» lleva a «Abierto/cerrado: extender sin reabrir». «Principio que lo atiende» lleva a «Sustitución: subtipos que cumplen el contrato». «Principio que lo atiende» lleva a «Segregación: interfaces por cliente». «Principio que lo atiende» lleva a «Inversión: depender de abstracciones». «Responsabilidad única: separar razones» lleva a «Medida: sitios y razones de cambio». «Abierto/cerrado: extender sin reabrir» lleva a «Medida: funciones existentes modificadas». «Sustitución: subtipos que cumplen el contrato» lleva a «Medida: fallos de contrato». «Segregación: interfaces por cliente» lleva a «Medida: clientes afectados». «Inversión: depender de abstracciones» lleva a «Medida: ciclos y dobles de prueba». «Medida: sitios y razones de cambio» lleva a «¿El cambio previsto ocurre?». «Medida: funciones existentes modificadas» lleva a «¿El cambio previsto ocurre?». «Medida: fallos de contrato» lleva a «¿El cambio previsto ocurre?». «Medida: clientes afectados» lleva a «¿El cambio previsto ocurre?». «Medida: ciclos y dobles de prueba» lleva a «¿El cambio previsto ocurre?». «¿El cambio previsto ocurre?» lleva a «Se retira la estructura» (no ocurre).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/