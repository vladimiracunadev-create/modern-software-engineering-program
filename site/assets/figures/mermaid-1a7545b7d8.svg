<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 632 715" width="632" height="715" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Solicitud» … «Presupuesto con tope y acción al exceder»</title><desc id="d">Diagrama de flujo con 8 pasos. «Solicitud» lleva a «Costo: llamadas × contexto × caché». «Solicitud» lleva a «Latencia: cadena, cola y paralelos». «Solicitud» lleva a «Seguridad: ¿qué puede leer y qué puede hacer?». «Seguridad: ¿qué puede leer y qué puede hacer?» lleva a «Datos privados + contenido no confiable + canal de salida». «Datos privados + contenido no confiable + canal de salida» lleva a «Violación: quitar una condición» (las tres). «Datos privados + contenido no confiable + canal de salida» lleva a «Aceptable con confirmación en lo irreversible» (menos de tres). «Costo: llamadas × contexto × caché» lleva a «Presupuesto con tope y acción al exceder». «Latencia: cadena, cola y paralelos» lleva a «Presupuesto con tope y acción al exceder». «Violación: quitar una condición» lleva a «Presupuesto con tope y acción al exceder».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="632" height="715" fill="#ffffff"/><path d="M318.7,66 L318.7,90.8 Q318.7,99.8 309.7,99.8 L119.0,99.8 Q110,99.8 110.0,108.8 L110,133.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M319.4,66 L319.4,133.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M318.7,66 L318.7,86.0 Q318.7,95 327.7,95.0 L517.0,95.0 Q526,95 526.0,104.0 L526,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#