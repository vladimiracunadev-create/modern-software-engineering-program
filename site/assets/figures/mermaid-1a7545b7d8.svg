526" y="149" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="526" dy="0">Seguridad: ¿qué</tspan><tspan x="526" dy="19.2">puede leer y qué</tspan><tspan x="526" dy="19.2">puede hacer?</tspan></text><polygon points="415.6,262 563.6,339.5 415.6,417 267.6,339.5" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="415.6" y="314.9" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="415.6" dy="0">Datos privados +</tspan><tspan x="415.6" dy="19.2">contenido no</tspan><tspan x="415.6" dy="19.2">confiable + canal</tspan><tspan x="415.6" dy="19.2">de salida</tspan></text><rect x="167" y="484.5" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="255" y="509.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="255" dy="0">Violación: quitar</tspan><tspan x="255" dy="19.2">una condición</tspan></text><rect x="377" y="475" width="185" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="469.5" y="500" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="469.5" dy="0">Aceptable con</tspan><tspan x="469.5" dy="19.2">confirmación en lo</tspan><tspan x="469.5" dy="19.2">irreversible</tspan></text><rect x="165.1" y="613" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="249.1" y="638" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="249.1" dy="0">Presupuesto con</tspan><tspan x="249.1" dy="19.2">tope y acción al</tspan><tspan x="249.1" dy="19.2">exceder</tspan></text><rect x="261" y="441.6" width="77" height="24" rx="4" fill="#ffffff"/><text x="299.5" y="457.5" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="299.5" dy="0">las tres</tspan></text><rect x="475.5" y="442" width="118" height="24" rx="4" fill="#ffffff"/><text x="534.5" y="457.9" font-size="14" text-anchor="middle" font-weight="400" fi