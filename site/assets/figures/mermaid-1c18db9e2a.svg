<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 613 262" width="613" height="262" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Observable / contrato de notificaciones» … «Errores, reintentos / cancelación»</title><desc id="d">Diagrama de flujo con 5 pasos. «Observable / contrato de notificaciones» lleva a «Operadores como álgebra de flujos». «Operadores como álgebra de flujos» lleva a «Flujos calientes / fríos». «Flujos calientes / fríos» lleva a «Backpressure / pérdida». «Backpressure / pérdida» lleva a «Errores, reintentos / cancelación». «Errores, reintentos / cancelación» lleva a «Observable / contrato de notificaciones» (fallo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="613" height="262" fill="#ffffff"/><path d="M172,62 L218,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M377,62 L423,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M507,92.5 L507,169.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M432,200 L364,200" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M231,200 L106.0,200.0 Q97,200 97.0,191.0 L97,102" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="22" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="97" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="97" dy="0">Observable /</tspan><tspan x="97" dy="19.2">contrato de</tspan><tspan x="97" dy="19.2">notificaciones</tspan></text><rect x="218" y="22" width="159" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="297.5" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="297.5" dy="0">Operadores como</tspan><tspan x="297.5" dy="19.2">álgebra de</tspan><tspan x="297.5" dy="19.2">flujos</tspan></text><rect x="423" y="31.5" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="507" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="507" dy="0">Flujos calientes</tspan><tspan x="507" dy="19.2">/ fríos</tspan></text><rect x="432" y="169.5" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="507" y="194.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="507" dy="0">Backpressure /</tspan><tspan x="507" dy="19.2">pérdida</tspan></text><rect x="231" y="160" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="297.5" y="185" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="297.5" dy="0">Errores,</tspan><tspan x="297.5" dy="19.2">reintentos /</tspan><tspan x="297.5" dy="19.2">cancelación</tspan></text><rect x="101" y="172" width="126" height="24" rx="4" fill="#ffffff"/><text x="164" y="187.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="164" dy="0">fallo o cambio</tspan></text></svg>
