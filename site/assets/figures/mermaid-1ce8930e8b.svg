<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 934 499" width="934" height="499" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Petición con identidad de inquilino» … «Riesgo de fuga por consulta olvidada», «Riesgo en conexiones que la eluden» y «Costo operativo por inquilino»</title><desc id="d">Diagrama de flujo con 11 pasos. «Petición con identidad de inquilino» lleva a «Nivel de aislamiento de datos». «Nivel de aislamiento de datos» lleva a «Filtro en cada consulta» (tabla compartida). «Nivel de aislamiento de datos» lleva a «Vista o política de fila» (barrera por solicitud). «Nivel de aislamiento de datos» lleva a «Conexión propia» (base por inquilino). «Petición con identidad de inquilino» lleva a «Aislamiento de cómputo». «Aislamiento de cómputo» lleva a «Vecino ruidoso afecta a todos» (cola común). «Aislamiento de cómputo» lleva a «El ruidoso espera, los demás no» (tope por inquilino). «Filtro en cada consulta» lleva a «Riesgo de fuga por consulta olvidada». «Vista o política de fila» lleva a «Riesgo en conexiones que la eluden». «Conexión propia» lleva a «Costo operativo por inquilino».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="934" height="499" fill="#ffffff"/><path d="M155,257 L189.0,257.0 Q198,257 198.0,248.0 L198.0,211.0 Q198,202 207.0,202.0 L241,202" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M400,202 L408.0,202.0 Q416,202 416.0,194.0 L416.0,77.0 Q416,68 425.0,68.0 L566,68" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M400,202 L408.0,202.0 Q416,202