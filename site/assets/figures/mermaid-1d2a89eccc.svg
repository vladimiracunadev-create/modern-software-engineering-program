<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 823 166" width="823" height="166" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Idempotencia» … «Journal / rollback»</title><desc id="d">Diagrama de flujo con 5 pasos. «Idempotencia» lleva a «Precondición / postcondición». «Precondición / postcondición» lleva a «Plan / dry-run». «Plan / dry-run» lleva a «Retry / operaciones inciertas». «Retry / operaciones inciertas» lleva a «Journal / rollback». «Journal / rollback» lleva a «Idempotencia» (fallo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="823" height="166" fill="#ffffff"/><path d="M155,104 L201,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M343,104 L389,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M478,104 L524,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M648,104 L694,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M747.5,73.5 L747.5,59.0 Q747.5,50 738.5,50.0 L97.5,50.0 Q88.5,50 88.5,59.0 L88.5,82" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="82" width="133" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="88.5" y="108.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="88.5" dy="0">Idempotencia</tspan></text><rect x="201" y="64" width="142" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="272" y="89" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="272" dy="0">Precondición</tspan><tspan x="272" dy="19.2">/</tspan><tspan x="272" dy="19.2">postcondición</tspan></text><rect x="389" y="73.5" width="89" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="433.5" y="98.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="433.5" dy="0">Plan /</tspan><tspan x="433.5" dy="19.2">dry-run</tspan></text><rect x="524" y="64" width="124" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="586" y="89" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="586" dy="0">Retry /</tspan><tspan x="586" dy="19.2">operaciones</tspan><tspan x="586" dy="19.2">inciertas</tspan></text><rect x="694" y="73.5" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="747.5" y="98.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="747.5" dy="0">Journal /</tspan><tspan x="747.5" dy="19.2">rollback</tspan></text><rect x="355" y="22" width="126" height="24" rx="4" fill="#ffffff"/><text x="418" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="418" dy="0">fallo o cambio</tspan></text></svg>
