<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 805 202" width="805" height="202" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Costo por resultado» … «Atribución y rendición de cuentas»</title><desc id="d">Diagrama de flujo con 5 pasos. «Costo por resultado» lleva a «Costos fijos y variables». «Costos fijos y variables» lleva a «Reparto del costo compartido». «Reparto del costo compartido» lleva a «Compromiso de capacidad». «Compromiso de capacidad» lleva a «Atribución y rendición de cuentas». «Atribución y rendición de cuentas» lleva a «Costo por resultado» (un reparto o un volumen cambia).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="805" height="202" fill="#ffffff"/><path d="M129,140 L175,140" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M282,140 L328,140" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M452,140 L498,140" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M613,140 L659,140" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M721,100 L721.0,93.0 Q721,86 714.0,86.0 L84.5,86.0 Q75.5,86 75.5,95.0 L75.5,109.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="109.5" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="75.5" y="134.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="75.5" dy="0">Costo por</tspan><tspan x="75.5" dy="19.2">resultado</tspan></text><rect x="175" y="100" width="107" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="228.5" y="125" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="228.5" dy="0">Costos</tspan><tspan x="228.5" dy="19.2">fijos y</tspan><tspan x="228.5" dy="19.2">variables</tspan></text><rect x="328" y="100" width="124" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="390" y="125" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="390" dy="0">Reparto del</tspan><tspan x="390" dy="19.2">costo</tspan><tspan x="390" dy="19.2">compartido</tspan></text><rect x="498" y="100" width="115" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="555.5" y="125" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="555.5" dy="0">Compromiso</tspan><tspan x="555.5" dy="19.2">de</tspan><tspan x="555.5" dy="19.2">capacidad</tspan></text><rect x="659" y="100" width="124" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="721" y="125" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="721" dy="0">Atribución</tspan><tspan x="721" dy="19.2">y rendición</tspan><tspan x="721" dy="19.2">de cuentas</tspan></text><rect x="343.2" y="22" width="110" height="60" rx="4" fill="#ffffff"/><text x="398.2" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="398.2" dy="0">un reparto o</tspan><tspan x="398.2" dy="17.92">un volumen</tspan><tspan x="398.2" dy="17.92">cambia</tspan></text></svg>
