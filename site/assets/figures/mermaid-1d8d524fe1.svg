="400" fill="#0b3f45"><tspan x="230.6" dy="0">Parada</tspan></text><rect x="198" y="22" width="76" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="236" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="236" dy="0">Traza</tspan></text><rect x="122.4" y="432" width="29" height="24" rx="4" fill="#ffffff"/><text x="136.9" y="447.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="136.9" dy="0">no</tspan></text><rect x="293.4" y="432" width="29" height="24" rx="4" fill="#ffffff"/><text x="307.9" y="447.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="307.9" dy="0">sí</tspan></text><rect x="372.9" y="443.5" width="29" height="24" rx="4" fill="#ffffff"/><text x="387.4" y="459.4" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="387.4" dy="0">no</tspan></text><rect x="236.6" y="797" width="29" height="24" rx="4" fill="#ffffff"/><text x="251.1" y="812.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="251.1" dy="0">sí</tspan></text><rect x="170.5" y="91" width="77" height="24" rx="4" fill="#ffffff"/><text x="209" y="106.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="209" dy="0">registra</tspan></text></svg>
