<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 424 896" width="424" height="896" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Instrucciones» y «Traza» … «Parada»</title><desc id="d">Diagrama de flujo con 10 pasos. «Instrucciones» lleva a «Contexto visible». «Contexto visible» lleva a «Modelo propone acción». «Modelo propone acción» lleva a «¿Permitida?». «¿Permitida?» lleva a «Observación de denegación» (no). «¿Permitida?» lleva a «Herramienta ejecuta» (sí). «Herramienta ejecuta» lleva a «Observación». «Observación de denegación» lleva a «Contexto visible». «Observación» lleva a «Contexto visible». «Observación» lleva a «¿Verificada y terminada?». «¿Verificada y terminada?» lleva a «Contexto visible» (no). «¿Verificada y terminada?» lleva a «Parada» (sí). «Traza» lleva a «Contexto visible» (registra).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="424" height="896" fill="#ffffff"/><path d="M93,66 L93.0,86.0 Q93,95 102.0,95.0 L155.5,95.0 Q164.5,95 164.5,104.0 L164.5,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M164.5,168 L164.5,191.1 Q164.5,197 170.4,197.0 L170.4,197.0 Q176.4,197 176.4,202.9 L176.4,226" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M176.4,287 L176.4,308.6 Q176.4,316 183.9,316.0 L183.9,316.0 Q191.3,316 191.3,323.4 L191.3,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M191.3,407 L191.3,415.0 Q191.3,423 183.3,423.0 L125.4,423.0 Q116.4,423 116.4,432.0 L116.4,465" fill="none" stroke="#32505f" stroke-width="1.8" 