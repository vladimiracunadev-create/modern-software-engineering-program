<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 801 343" width="801" height="343" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Intención» … «Taller y paquete operable»</title><desc id="d">Diagrama de flujo con 10 pasos. «Intención» lleva a «Superficie y contrato». «Superficie y contrato» lleva a «Flujos y composición». «Flujos y composición» lleva a «Configuración y códigos». «Configuración y códigos» lleva a «Presentación». «Presentación» lleva a «Servicio y ciclo de vida». «Servicio y ciclo de vida» lleva a «Trabajo programado». «Trabajo programado» lleva a «Repetible y reanudable». «Repetible y reanudable» lleva a «Entrega y privacidad». «Entrega y privacidad» lleva a «Taller y paquete operable». «Taller y paquete operable» lleva a «Intención» (incidente o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="801" height="343" fill="#ffffff"/><path d="M137.5,52.5 L209.5,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M342.5,52.5 L428,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M552,52.5 L620,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M699.5,83 L699.5,149.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M633,171.5 L574,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M406,171.5 L333.5,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M218.5,171.5 L146,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M84,202 L84,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M141.5,290.5 L192,290.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M276,260 L276.0,225.0 Q276,216 267.0,216.0 L164.5,216.0 Q155.5,216 155.5,207.0 L155.5,97.5 Q155.5,88.5 146.5,88.5 L91.0,88.5 Q84,88.5 84.0,81.5 L84,74.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="30.5" y="30.5" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="84" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="84" dy="0">Intención</tspan></text><rect x="209.5" y="22" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="276" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="276" dy="0">Superficie y</tspan><tspan x="276" dy="19.2">contrato</tspan></text><rect x="428" y="22" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="490" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">Flujos y</tspan><tspan x="490" dy="19.2">composición</tspan></text><rect x="620" y="22" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="699.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="699.5" dy="0">Configuración y</tspan><tspan x="699.5" dy="19.2">códigos</tspan></text><rect x="633" y="149.5" width="133" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="699.5" y="175.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="699.5" dy="0">Presentación</tspan></text><rect x="406" y="141" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="490" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">Servicio y ciclo</tspan><tspan x="490" dy="19.2">de vida</tspan></text><rect x="218.5" y="141" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="276" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="276" dy="0">Trabajo</tspan><tspan x="276" dy="19.2">programado</tspan></text><rect x="22" y="141" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="84" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="84" dy="0">Repetible y</tspan><tspan x="84" dy="19.2">reanudable</tspan></text><rect x="26.5" y="260" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="84" y="285.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="84" dy="0">Entrega y</tspan><tspan x="84" dy="19.2">privacidad</tspan></text><rect x="192" y="260" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="276" y="285.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="276" dy="0">Taller y paquete</tspan><tspan x="276" dy="19.2">operable</tspan></text><rect x="161.5" y="93" width="102" height="42" rx="4" fill="#ffffff"/><text x="212.5" y="108.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="212.5" dy="0">incidente o</tspan><tspan x="212.5" dy="17.92">cambio</tspan></text></svg>
