<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 447 1081" width="447" height="1081" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Conversación: negocio, desarrollo y prueba» … «Regresión»</title><desc id="d">Diagrama de flujo con 10 pasos. «Conversación: negocio, desarrollo y prueba» lleva a «Ejemplos concretos». «Ejemplos concretos» lleva a «Reglas y preguntas abiertas». «Reglas y preguntas abiertas» lleva a «Formulación: escenarios Dado, Cuando, Entonces». «Formulación: escenarios Dado, Cuando, Entonces» lleva a «Definiciones de paso». «Definiciones de paso» lleva a «Automatización contra el sistema». «Automatización contra el sistema» lleva a «¿Pasa?». «¿Pasa?» lleva a «Código o ejemplo equivocado» (no). «¿Pasa?» lleva a «Documentación viva» (sí). «Código o ejemplo equivocado» lleva a «Conversación: negocio, desarrollo y prueba». «Documentación viva» lleva a «Regresión».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="447" height="1081" fill="#ffffff"/><path d="M139.5,121 L139.5,179" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M141.9,223 L141.9,281" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M148.2,342 L148.2,400" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M152.1,480 L152.1,502.9 Q152.1,509 158.2,509.0 L158.2,509.0 Q164.3,509 164.3,515.1 L164.3,538" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M164.3,599 L164.3,619.0 Q164.3,628 173.3,628.0 L173.6,628.0 Q182.6,628 182.6,637.0 L182.6,657" 