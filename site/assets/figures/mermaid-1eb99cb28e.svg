<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 761 430" width="761" height="430" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Catálogo de planes», «Excepciones por cliente con vencimiento», «Estado de la suscripción», «Consumo medido» y «Banderas de funcionalidad» … «Mensaje y oferta de cambio de plan» y «Operación permitida»</title><desc id="d">Diagrama de flujo con 9 pasos. «Catálogo de planes» lleva a «Motor de derechos». «Excepciones por cliente con vencimiento» lleva a «Motor de derechos». «Estado de la suscripción» lleva a «Motor de derechos». «Consumo medido» lleva a «Motor de derechos». «Motor de derechos» lleva a «Operación permitida» (sí). «Motor de derechos» lleva a «Mensaje y oferta de cambio de plan» (no con razón). «Banderas de funcionalidad» lleva a «Qué código se ejecuta». «Qué código se ejecuta» lleva a «Operación permitida».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="761" height="430" fill="#ffffff"/><path d="M207,44 L221.0,44.0 Q230,44 230.0,53.0 L230.0,163.5 Q230,172.5 239.0,172.5 L253,172.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M194,130 L214.5,130.0 Q223.5,130 223.5,139.0 L223.5,163.5 Q223.5,172.5 232.5,172.5 L253,172.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M181,224.5 L208.0,224.5 Q217,224.5 217.0,215.5 L217.0,181.5 Q217,172.5 226.0,172.5 L253,172.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M189.5,301 L212.2,301.0 Q221.2,301 221.2,292.0 L221.2,181.5 Q221.2,172.5 230.2,172.5 L253,172.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M429,172.5 L437.0,172.5 Q445,172.5 445.0,180.5 L445.0,248.5 Q445,257.5 454.0,257.5 L597.5,257.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M429,172.5 L563,172.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M185.5,377.5 L218.8,377.5 Q227.8,377.5 227.8,368.5 L227.8,258.0 Q227.8,249 236.8,249.0 L270,249" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M412,253.2 L597.5,253.2" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="22" width="185" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="114.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="114.5" dy="0">Catálogo de planes</tspan></text><rect x="253" y="150.5" width="176" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="341" y="176.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="341" dy="0">Motor de derechos</tspan></text><rect x="35" y="90" width="159" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="114.5" y="115" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="114.5" dy="0">Excepciones por</tspan><tspan x="114.5" dy="19.2">cliente con</tspan><tspan x="114.5" dy="19.2">vencimiento</tspan></text><rect x="48" y="194" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="114.5" y="219.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="114.5" dy="0">Estado de la</tspan><tspan x="114.5" dy="19.2">suscripción</tspan></text><rect x="39.5" y="279" width="150" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="114.5" y="305.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="114.5" dy="0">Consumo medido</tspan></text><rect x="597.5" y="227" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="651" y="252.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="651" dy="0">Operación</tspan><tspan x="651" dy="19.2">permitida</tspan></text><rect x="563" y="142" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="651" y="167.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="651" dy="0">Mensaje y oferta</tspan><tspan x="651" dy="19.2">de cambio de plan</tspan></text><rect x="43.5" y="347" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="114.5" y="372.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="114.5" dy="0">Banderas de</tspan><tspan x="114.5" dy="19.2">funcionalidad</tspan></text><rect x="270" y="218.5" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="341" y="243.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="341" dy="0">Qué código se</tspan><tspan x="341" dy="19.2">ejecuta</tspan></text><rect x="506.8" y="261.5" width="29" height="24" rx="4" fill="#ffffff"/><text x="521.3" y="277.4" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="521.3" dy="0">sí</tspan></text><rect x="441" y="144.5" width="110" height="24" rx="4" fill="#ffffff"/><text x="496" y="160.4" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="496" dy="0">no con razón</tspan></text></svg>
