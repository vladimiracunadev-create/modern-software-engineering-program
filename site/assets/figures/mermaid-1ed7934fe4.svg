<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 406 1035" width="406" height="1035" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Decisiones de SE-397 a SE-407» … «Paquete aprobado y fechado»</title><desc id="d">Diagrama de flujo con 9 pasos. «Decisiones de SE-397 a SE-407» lleva a «Paquete: plan, estado, políticas, presupuesto, destrucción, límites». «Paquete: plan, estado, políticas, presupuesto, destrucción, límites» lleva a «Construcción reproducible: mismos bytes en dos sistemas». «Construcción reproducible: mismos bytes en dos sistemas» lleva a «Validador de forma». «Validador de forma» lleva a «Corregir el paquete» (falla). «Validador de forma» lleva a «Revisión por otra persona» (pasa). «Revisión por otra persona» lleva a «Reconstrucción desde un checkout limpio». «Reconstrucción desde un checkout limpio» lleva a «Paquete aprobado y fechado». «Validador de forma» lleva a «LIMITES.md: lo que nada comprueba» (no ve). «LIMITES.md: lo que nada comprueba» lleva a «Revisión por otra persona».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="406" height="1035" fill="#ffffff"/><path d="M141.3,83 L141.3,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M141.3,259 L141.3,283.1 Q141.3,288 146.2,288.0 L146.2,288.0 Q151,288 151.0,292.9 L151,317" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M151,416 L151.0,437.1 Q151,445 158.8,445.0 L158.8,445.0 Q166.7,445 166.7,452.9 L166.7,474" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M166.7,518 L166