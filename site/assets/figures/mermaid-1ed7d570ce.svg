<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 775 207" width="775" height="207" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Fronteras» … «Proyecto profesional»</title><desc id="d">Diagrama de flujo con 8 pasos. «Fronteras» lleva a «Ciclo de vida». «Ciclo de vida» lleva a «Responsabilidad». «Responsabilidad» lleva a «Evidencia». «Evidencia» lleva a «Calidad y riesgo». «Calidad y riesgo» lleva a «Impacto». «Impacto» lleva a «Taller integrador». «Taller integrador» lleva a «Proyecto profesional».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="775" height="207" fill="#ffffff"/><path d="M137.5,44 L192,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M334,44 L380,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M539,44 L615.5,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M669,66 L669,132.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M585,154.5 L504,154.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M415,154.5 L320.5,154.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M205.5,154.5 L146,154.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="30.5" y="22" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="84" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="84" dy="0">Fronteras</tspan></text><rect x="192" 