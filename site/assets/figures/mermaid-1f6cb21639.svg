<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 104" width="810" height="104" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «PC» … «Write result»</title><desc id="d">Diagrama de flujo con 6 pasos. «PC» lleva a «Fetch». «Fetch» lleva a «Decode». «Decode» lleva a «Execute». «Execute» lleva a «Memory». «Memory» lleva a «Write result». «Write result» lleva a «PC».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="810" height="104" fill="#ffffff"/><path d="M98,60 L144,60" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M220,60 L266,60" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M347,60 L393,60" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M482,60 L528,60" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M609,60 L655,60" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M721.5,38 L721.5,31.0 Q721.5,24 714.5,24.0 L67.0,24.0 Q60,24 60.0,31.0 L60,38" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="38" width="76" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="60" y="64.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="60" dy="0">PC</tspan></text><rect x="144" y="38" width="76" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="182" y="64.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="182" dy="0">Fetch</tspan></text><rect x="266" y="38" width="81" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="306.5" y="64.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="306.5" dy="0">Decode</tspan></text><rect x="393" y="38" width="89" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="437.5" y="64.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="437.5" dy="0">Execute</tspan></text><rect x="528" y="38" width="81" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="568.5" y="64.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="568.5" dy="0">Memory</tspan></text><rect x="655" y="38" width="133" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="721.5" y="64.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="721.5" dy="0">Write result</tspan></text></svg>
