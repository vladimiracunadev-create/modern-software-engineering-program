<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 635 952" width="635" height="952" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Servicio de recordatorios» … «Clásico sigue en verde» y «Londres puede romperse»</title><desc id="d">Diagrama de flujo con 11 pasos. «Servicio de recordatorios» lleva a «Repositorio». «Servicio de recordatorios» lleva a «Canal de envío». «Servicio de recordatorios» lleva a «Reloj». «Dobles con estado: repositorio y canal en memoria» lleva a «Verifica el resultado: mensajes entregados y envíos registrados». «Dobles simulados de los tres colaboradores» lleva a «Verifica las llamadas: qué se pidió y con qué argumentos». «Repositorio» lleva a «Dobles con estado: repositorio y canal en memoria». «Repositorio» lleva a «Dobles simulados de los tres colaboradores». «Verifica el resultado: mensajes entregados y envíos registrados» lleva a «Refactor del interior». «Verifica las llamadas: qué se pidió y con qué argumentos» lleva a «Refactor del interior». «Refactor del interior» lleva a «Clásico sigue en verde» (conserva el resultado). «Refactor del interior» lleva a «Londres puede romperse» (cambia cómo se consulta).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="635" height="952" fill="#ffffff"/><rect x="22" y="269" width="243" height="336" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="36" y="291" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="36" dy="0">Clásico</tspan></text><rect x="325" y="269" width="260" height="326.5" rx="16"