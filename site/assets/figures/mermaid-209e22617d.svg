<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 825 781" width="825" height="781" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Entrada del cliente» … «Dato que no cambia de papel»</title><desc id="d">Diagrama de flujo con 9 pasos. «Entrada del cliente» lleva a «Decodificación y normalización». «Decodificación y normalización» lleva a «Validación: forma y rango». «Validación: forma y rango» lleva a «Intérprete que lo recibe». «Intérprete que lo recibe» lleva a «Parámetros enlazados y lista blanca de identificadores» (SQL). «Intérprete que lo recibe» lleva a «Codificación por contexto» (HTML). «Intérprete que lo recibe» lleva a «Resolver ruta y comprobar la raíz» (Sistema de archivos). «Intérprete que lo recibe» lleva a «Lista de argumentos, sin shell» (Proceso). «Parámetros enlazados y lista blanca de identificadores» lleva a «Dato que no cambia de papel». «Codificación por contexto» lleva a «Dato que no cambia de papel». «Resolver ruta y comprobar la raíz» lleva a «Dato que no cambia de papel». «Lista de argumentos, sin shell» lleva a «Dato que no cambia de papel».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="825" height="781" fill="#ffffff"/><path d="M417.2,83 L417.2,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M417.4,202 L417.4,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M417.7,321 L417.7,379" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M417.8,465 L417.8,473.0 Q417.8,481 409.8,481.0 L119.0,481.0 Q110,481 110.0,490.