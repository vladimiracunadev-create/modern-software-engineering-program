<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 831 166" width="831" height="166" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Ergonomía / carga» … «Automatización / agencia»</title><desc id="d">Diagrama de flujo con 5 pasos. «Ergonomía / carga» lleva a «Teclado / foco». «Teclado / foco» lleva a «Color, texto / movimiento». «Color, texto / movimiento» lleva a «Salida accesible». «Salida accesible» lleva a «Automatización / agencia». «Automatización / agencia» lleva a «Ergonomía / carga» (fallo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="831" height="166" fill="#ffffff"/><path d="M146,104 L192,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M299,104 L345,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M460,104 L506,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M613,104 L659,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M734,73.5 L734.0,59.0 Q734,50 725.0,50.0 L93.0,50.0 Q84,50 84.0,59.0 L84,73.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="73.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="84" y="98.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="84" dy="0">Ergonomía /</tspan><tspan x="84" dy="19.2">carga</tspan></text><rect x="192" y="73.5" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="245.5" y="98.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="245.5" dy="0">Teclado /</tspan><tspan x="245.5" dy="19.2">foco</tspan></text><rect x="345" y="64" width="115" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="402.5" y="89" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="402.5" dy="0">Color,</tspan><tspan x="402.5" dy="19.2">texto /</tspan><tspan x="402.5" dy="19.2">movimiento</tspan></text><rect x="506" y="73.5" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="559.5" y="98.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="559.5" dy="0">Salida</tspan><tspan x="559.5" dy="19.2">accesible</tspan></text><rect x="659" y="73.5" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="734" y="98.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="734" dy="0">Automatización</tspan><tspan x="734" dy="19.2">/ agencia</tspan></text><rect x="346" y="22" width="126" height="24" rx="4" fill="#ffffff"/><text x="409" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="409" dy="0">fallo o cambio</tspan></text></svg>
