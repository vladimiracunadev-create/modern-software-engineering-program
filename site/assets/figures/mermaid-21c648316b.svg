<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 805 184" width="805" height="184" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Raíz y factores» … «Hoja que mover primero»</title><desc id="d">Diagrama de flujo con 5 pasos. «Raíz y factores» lleva a «Nodos completos». «Nodos completos» lleva a «Validador y mutaciones». «Validador y mutaciones» lleva a «Descomposición exacta». «Descomposición exacta» lleva a «Hoja que mover primero». «Hoja que mover primero» lleva a «Raíz y factores» (un baseline cambia).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="805" height="184" fill="#ffffff"/><path d="M120,122 L166,122" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M273,122 L319,122" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M443,122 L489,122" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M639,122 L685,122" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M734,82 L734.0,75.0 Q734,68 727.0,68.0 L80.0,68.0 Q71,68 71.0,77.0 L71,91.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="91.5" width="98" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="71" y="116.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="71" dy="0">Raíz y</tspan><tspan x="71" dy="19.2">factores</tspan></text><rect x="166" y="91.5" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="219.5" y="116.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="219.5" dy="0">Nodos</tspan><tspan x="219.5" dy="19.2">completos</tspan></text><rect x="319" y="91.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="381" y="116.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="381" dy="0">Validador y</tspan><tspan x="381" dy="19.2">mutaciones</tspan></text><rect x="489" y="91.5" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="564" y="116.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="564" dy="0">Descomposición</tspan><tspan x="564" dy="19.2">exacta</tspan></text><rect x="685" y="82" width="98" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="734" y="107" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="734" dy="0">Hoja que</tspan><tspan x="734" dy="19.2">mover</tspan><tspan x="734" dy="19.2">primero</tspan></text><rect x="351.5" y="22" width="102" height="42" rx="4" fill="#ffffff"/><text x="402.5" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="402.5" dy="0">un baseline</tspan><tspan x="402.5" dy="17.92">cambia</tspan></text></svg>
