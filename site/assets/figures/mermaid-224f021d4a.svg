<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 372 666" width="372" height="666" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Medición de posición» y «Instante en UTC» … «Mapa de sedes»</title><desc id="d">Diagrama de flujo con 10 pasos. «Medición de posición» lleva a «Sistema de referencia». «Sistema de referencia» lleva a «Proyección o esfera». «Proyección o esfera» lleva a «Distancia y consulta». «Distancia y consulta» lleva a «Índice espacial». «Instante en UTC» lleva a «Regla de la zona». «Regla de la zona» lleva a «Hora civil mostrada». «Hora civil mostrada» lleva a «Agenda de una persona». «Índice espacial» lleva a «Mapa de sedes». «Agenda de una persona» lleva a «Mapa de sedes».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="372" height="666" fill="#ffffff"/><path d="M89.8,83 L89.8,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M91.6,202 L91.6,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M95.4,321 L95.4,379" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M99.5,440 L99.5,498" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M265.3,74.5 L265.3,149.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M265.1,193.5 L265.1,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M264.9,321 L264.9,379" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M102.9,542 L102.9,600" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M264.9,440 L264.9,613.0 Q264.9,622 255.9,622.0 L175.4,622" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="27.8" y="22" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="89.8" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="89.8" dy="0">Medición de</tspan><tspan x="89.8" dy="19.2">posición</tspan></text><rect x="32.3" y="141" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="89.8" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="89.8" dy="0">Sistema de</tspan><tspan x="89.8" dy="19.2">referencia</tspan></text><rect x="26.9" y="260" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="93.4" y="285.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="93.4" dy="0">Proyección o</tspan><tspan x="93.4" dy="19.2">esfera</tspan></text><rect x="35.5" y="379" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="97.5" y="404.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="97.5" dy="0">Distancia y</tspan><tspan x="97.5" dy="19.2">consulta</tspan></text><rect x="22" y="498" width="159" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101.5" y="524.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101.5" dy="0">Índice espacial</tspan></text><rect x="185.8" y="30.5" width="159" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="265.3" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="265.3" dy="0">Instante en UTC</tspan></text><rect x="181.3" y="149.5" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="265.3" y