<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 487 776" width="487" height="776" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Cambio de configuración o de código» … «Reversión automática» y «Corrección y nueva regresión»</title><desc id="d">Diagrama de flujo con 8 pasos. «Cambio de configuración o de código» lleva a «Lectura estática: esperas, reintentos, cortacircuitos». «Lectura estática: esperas, reintentos, cortacircuitos» lleva a «Suite dinámica con fallas deterministas». «Suite dinámica con fallas deterministas» lleva a «Preproducción con tráfico sintético». «Preproducción con tráfico sintético» lleva a «Canario con grupo de control». «Lectura estática: esperas, reintentos, cortacircuitos» lleva a «Cambio bloqueado» (rojo). «Suite dinámica con fallas deterministas» lleva a «Cambio bloqueado» (rojo). «Preproducción con tráfico sintético» lleva a «Cambio bloqueado» (rojo). «Canario con grupo de control» lleva a «Reversión automática» (se degrada). «Cambio bloqueado» lleva a «Corrección y nueva regresión».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="487" height="776" fill="#ffffff"/><path d="M214.5,102 L214.5,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M214.2,259 L214.2,317" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M213.7,397 L213.7,455" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M213.4,516 L213.4,536.0 Q213.4,545 204.4,545.0 L119.0,545.0 Q110,545 110.0,554.0 L110,574" fill="none" stroke="#32505f" stroke-width="