<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 748 248" width="748" height="248" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Obligación externa» … «Evidencia»</title><desc id="d">Diagrama de flujo con 5 pasos. «Obligación externa» lleva a «Interpretación». «Interpretación» lleva a «Requisito verificable». «Requisito verificable» lleva a «Evidencia». «Amenaza» lleva a «Requisito verificable». «Evidencia» lleva a «Obligación externa» (cambio de norma o incidente).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="748" height="248" fill="#ffffff"/><path d="M207,163 L221.0,163.0 Q230,163 230.0,154.0 L230.0,131.0 Q230,122 239.0,122.0 L253,122" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M403,122 L417.0,122.0 Q426,122 426.0,131.0 L426.0,154.0 Q426,163 435.0,163.0 L449,163" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M573,163 L619,163" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M372.5,204 L401.8,204.0 Q410.8,204 410.8,195.0 L410.8,172.0 Q410.8,163 419.8,163.0 L449,163" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M672.5,141 L672.5,95.0 Q672.5,86 663.5,86.0 L123.5,86.0 Q114.5,86 114.5,95.0 L114.5,141" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="141" width="185" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="114.5" y="167.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="114.5" dy="0">Obligación externa</tspan></text><rect x="253" y="100" width="150" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="328" y="126.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="328" dy="0">Interpretación</tspan></text><rect x="449" y="132.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="511" y="157.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="511" dy="0">Requisito</tspan><tspan x="511" dy="19.2">verificable</tspan></text><rect x="619" y="141" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="672.5" y="167.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="672.5" dy="0">Evidencia</tspan></text><rect x="283.5" y="182" width="89" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="328" y="208.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="328" dy="0">Amenaza</tspan></text><rect x="350.5" y="22" width="86" height="60" rx="4" fill="#ffffff"/><text x="393.5" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="393.5" dy="0">cambio de</tspan><tspan x="393.5" dy="17.92">norma o</tspan><tspan x="393.5" dy="17.92">incidente</tspan></text></svg>
