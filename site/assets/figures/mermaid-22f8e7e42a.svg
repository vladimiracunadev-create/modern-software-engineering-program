<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 608" width="800" height="608" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Mensaje original» … «Clave + efecto en una transacción»</title><desc id="d">Diagrama de flujo con 9 pasos. «Mensaje original» lleva a «¿De dónde viene el segundo?». «¿De dónde viene el segundo?» lleva a «Reentrega» (el consumidor cae antes de acusar). «¿De dónde viene el segundo?» lleva a «Reentrega» (se pierde el acuse). «¿De dónde viene el segundo?» lleva a «Mensaje nuevo, mismo contenido» (el productor reintenta con otro id). «¿De dónde viene el segundo?» lleva a «Entrega a otro consumidor» (el proceso supera la visibilidad). «¿De dónde viene el segundo?» lleva a «Relectura» (reinicio de desplazamientos). «Reentrega» lleva a «Clave del mensaje». «Mensaje nuevo, mismo contenido» lleva a «Clave de negocio». «Entrega a otro consumidor» lleva a «Clave del mensaje». «Relectura» lleva a «Clave del mensaje». «Clave del mensaje» lleva a «Clave + efecto en una transacción». «Clave de negocio» lleva a «Clave + efecto en una transacción».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="800" height="608" fill="#ffffff"/><path d="M379.3,66 L379.3,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M379.3,210 L379.3,218.0 Q379.3,226 371.3,226.0 L322.0,226.0 Q313,226 313.0,235.0 L313,312.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M379.3,210 L379.3,218.0 Q379.3,226 371.3,226.0 L322.0,226.0 Q313,226 313.0,235.0 L313,312.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M379.3,210 L379.3,218.0 Q379.3,226 371.3,226.0 L155.0,226.0 Q146,226 146.0,235.0 L146,304" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M379.3,210 L379.3,218.0 Q379.3,226 387.3,226.0 L466.5,226.0 Q475.5,226 475.5,235.0 L475.5,304" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M379.3,210 L379.3,218.0 Q379.3,226 387.3,226.0 L629.0,226.0 Q638,226 638.0,235.0 L638,312.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M313,356.5 L313.0,380.8 Q313,389.8 322.0,389.8 L445.7,389.8 Q454.7,389.8 454.7,398.8 L454.7,423" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M146,365 L146.0,385.0 Q146,394 155.0,394.0 L239.7,394.0 Q248.7,394 248.7,403.0 L248.7,423" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M475.5,365 L475.5,385.0 Q475.5,394 466.5,394.0 L463.7,394.0 Q454.7,394 454.7,403.0 L454.7,423" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M638,356.5 L638.0,380.8 Q638,389.8 629.0,389.8 L463.7,389.8 Q454.7,389.8 454.7,398.8 L454.7,423" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M454.7,467 L454.7,487.0 Q454.7,496 445.7,496.0 L365.2,496.0 Q356.2,496 356.2,505.0 L356.2,525" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M248.7,467 L248.7,487.0 Q248.7,496 257.7,496.0 L347.2,496.0 Q356.2,496 356.2,505.0 L356.2,525" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="295.3" y="22" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="379.3" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="379.3" dy="0">Mensaje original</tspan></text><polygon points="379.3,124 530.8,167 379.3,210 227.8,167" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="379.3" y="161.6" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="379.3" dy="0">¿De dónde viene el</tspan><tspan x="379.3" dy="19.2">segundo?</tspan></text><rect x="259.5" y="312.5" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="313" y="338.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="313" dy="0">Reentrega</tspan></text><rect x="66.5" y="304" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="146" y="329.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="146" dy="0">Mensaje nuevo,</tspan><tspan x="146" dy="19.2">mismo contenido</tspan></text><rect x="400.5" y="304" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="475.5" y="329.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="475.5" dy="0">Entrega a otro</tspan><tspan x="475.5" dy="19.2">consumidor</tspan></text><rect x="584.5" y="312.5" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="638" y="338.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="638" dy="0">Relectura</tspan></text><rect x="366.7" y="423" width="176" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="454.7" y="449.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="454.7" dy="0">Clave del mensaje</tspan></text><rect x="164.7" y="423" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="248.7" y="449.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="248.7" dy="0">Clave de negocio</tspan></text><rect x="268.2" y="525" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="356.2" y="550.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="356.2" dy="0">Clave + efecto en</tspan><tspan x="356.2" dy="19.2">una transacción</tspan></text><rect x="319" y="239.2" width="118" height="60" rx="4" fill="#ffffff"/><text x="378" y="255.1" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="378" dy="0">el consumidor</tspan><tspan x="378" dy="17.92">cae antes de</tspan><tspan x="378" dy="17.92">acusar</tspan></text><rect x="197" y="248.2" width="110" height="42" rx="4" fill="#ffffff"/><text x="252" y="264.1" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="252" dy="0">se pierde el</tspan><tspan x="252" dy="17.92">acuse</tspan></text><rect x="22" y="235" width="118" height="60" rx="4" fill="#ffffff"/><text x="81" y="250.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="81" dy="0">el productor</tspan><tspan x="81" dy="17.92">reintenta con</tspan><tspan x="81" dy="17.92">otro id</tspan></text><rect x="481.5" y="235" width="102" height="60" rx="4" fill="#ffffff"/><text x="532.5" y="250.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532.5" dy="0">el proceso</tspan><tspan x="532.5" dy="17.92">supera la</tspan><tspan x="532.5" dy="17.92">visibilidad</tspan></text><rect x="644" y="248.2" width="134" height="42" rx="4" fill="#ffffff"/><text x="711" y="264.1" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="711" dy="0">reinicio de</tspan><tspan x="711" dy="17.92">desplazamientos</tspan></text></svg>
