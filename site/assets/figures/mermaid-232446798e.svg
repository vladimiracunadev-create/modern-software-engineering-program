<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 427 846" width="427" height="846" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Evento ocurre tiempo del evento» … «Se cuenta» y «Tardío: corregir o apartar»</title><desc id="d">Diagrama de flujo con 10 pasos. «Evento ocurre tiempo del evento» lleva a «Retraso variable». «Retraso variable» lleva a «Llega tiempo de llegada». «Llega tiempo de llegada» lleva a «¿Duplicado?». «¿Duplicado?» lleva a «Se ignora» (sí, misma clave). «¿Duplicado?» lleva a «Ventana por tiempo del evento» (no). «Ventana por tiempo del evento» lleva a «¿Llegó antes de la marca de agua?». «¿Llegó antes de la marca de agua?» lleva a «Se cuenta» (sí). «¿Llegó antes de la marca de agua?» lleva a «Tardío: corregir o apartar» (no). «Lote» lleva a «Ventana por tiempo del evento» (espera y reprocesa).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="427" height="846" fill="#ffffff"/><path d="M129,83 L129,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M128.7,185 L128.7,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M128.8,304 L128.8,362" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M129.2,424 L129.2,432.0 Q129.2,440 121.2,440.0 L84.5,440.0 Q75.5,440 75.5,449.0 L75.5,508.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M129.2,424 L129.2,432.0 Q129.2,440 137.2,440.0 L246.5,440.0 Q255.5,440 255.5,449.0 L255.5,500" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M255.5,561 L255.5,581.0 Q255.5,590 246.5,590.0 L241.6,590.0 Q232.6,590 232.6,599.0 L232.6,619" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M232.6,705 L232.6,713.0 Q232.6,721 224.6,721.0 L141.2,721.0 Q132.2,721 132.2,730.0 L132.2,771.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M232.6,705 L232.6,713.0 Q232.6,721 240.6,721.0 L303.2,721.0 Q312.2,721 312.2,730.0 L312.2,763" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M278.2,415 L278.2,423.0 Q278.2,431 270.2,431.0 L264.5,431.0 Q255.5,431 255.5,440.0 L255.5,500" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="41" y="22" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="129" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="129" dy="0">Evento ocurre</tspan><tspan x="129" dy="19.2">tiempo del evento</tspan></text><rect x="45" y="141" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="129" y="167.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="129" dy="0">Retraso variable</tspan></text><rect x="40.4" y="243" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="128.4" y="268.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="128.4" dy="0">Llega</tspan><tspan x="128.4" dy="19.2">tiempo de llegada</tspan></text><polygon points="129.2,362 206.2,393 129.2,424 52.2,393" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="129.2" y="397.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="129.2" dy="0">¿Duplicado?</tspan></text><rect x="22" y="508.5" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="75.5" y="534.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="75.5" dy="0">Se ignora</tspan></text><rect x="163" y="500" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="255.5" y="525.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="255.5" dy="0">Ventana por tiempo</tspan><tspan x="255.5" dy="19.2">del evento</tspan></text><polygon points="232.6,619 384.1,662 232.6,705 81.1,662" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="232.6" y="656.6" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="232.6" dy="0">¿Llegó antes de la</tspan><tspan x="232.6" dy="19.2">marca de agua?</tspan></text><rect x="78.7" y="771.5" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="132.2" y="797.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="132.2" dy="0">Se cuenta</tspan></text><rect x="219.7" y="763" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="312.2" y="788.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="312.2" dy="0">Tardío: corregir o</tspan><tspan x="312.2" dy="19.2">apartar</tspan></text><rect x="240.2" y="371" width="76" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="278.2" y="397.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="278.2" dy="0">Lote</tspan></text><rect x="81.5" y="453.2" width="86" height="42" rx="4" fill="#ffffff"/><text x="124.5" y="469.1" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="124.5" dy="0">sí, misma</tspan><tspan x="124.5" dy="17.92">clave</tspan></text><rect x="261.5" y="458" width="29" height="24" rx="4" fill="#ffffff"/><text x="276" y="473.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="276" dy="0">no</tspan></text><rect x="138.2" y="734.2" width="29" height="24" rx="4" fill="#ffffff"/><text x="152.7" y="750.1" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="152.7" dy="0">sí</tspan></text><rect x="318.2" y="730" width="29" height="24" rx="4" fill="#ffffff"/><text x="332.7" y="745.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="332.7" dy="0">no</tspan></text><rect x="296.5" y="444.5" width="86" height="42" rx="4" fill="#ffffff"/><text x="339.5" y="460.4" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="339.5" dy="0">espera y</tspan><tspan x="339.5" dy="17.92">reprocesa</tspan></text></svg>
