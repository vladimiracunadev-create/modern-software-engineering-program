<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 828 791" width="828" height="791" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Sistema legado» … «Entrar a la modernización» y «Cerrar la condición y volver»</title><desc id="d">Diagrama de flujo con 10 pasos. «Sistema legado» lleva a «1. Construcción reproducible». «Sistema legado» lleva a «2. Suite con rojo significativo». «Sistema legado» lleva a «3. Caracterización de puntos calientes». «Sistema legado» lleva a «4. Camino de vuelta probado». «Sistema legado» lleva a «5. Línea base de métricas». «Sistema legado» lleva a «6. Inventario de dependencias y propietarios». «1. Construcción reproducible» lleva a «Puerta de entrada». «2. Suite con rojo significativo» lleva a «Puerta de entrada». «3. Caracterización de puntos calientes» lleva a «Puerta de entrada». «4. Camino de vuelta probado» lleva a «Puerta de entrada». «5. Línea base de métricas» lleva a «Puerta de entrada». «6. Inventario de dependencias y propietarios» lleva a «Puerta de entrada». «Puerta de entrada» lleva a «Entrar a la modernización» (todas cumplen). «Puerta de entrada» lleva a «Cerrar la condición y volver» (falta alguna). «Cerrar la condición y volver» lleva a «Puerta de entrada».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="828" height="791" fill="#ffffff"/><path d="M111,395.5 L131.5,395.5 Q140.5,395.5 140.5,386.5 L140.5,71.0 Q140.5,62 149.5,62.0 L170,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M111,395.5 L129.2,395.5 Q138.2,395.5 138.2,386.5 L138.2,189.0 Q138.2,180 147.2,180.0 L