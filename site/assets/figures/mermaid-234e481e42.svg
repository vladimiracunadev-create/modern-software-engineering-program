<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 683" width="412" height="683" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Entrada de la persona» … «Mensaje asociado al campo» y «Confirmación»</title><desc id="d">Diagrama de flujo con 7 pasos. «Entrada de la persona» lleva a «Restricciones nativas». «Restricciones nativas» lleva a «Validación del cliente». «Validación del cliente» lleva a «Envío». «Envío» lleva a «Validación del servidor». «Validación del servidor» lleva a «Mensaje asociado al campo» (errores). «Mensaje asociado al campo» lleva a «Entrada de la persona». «Validación del servidor» lleva a «Confirmación» (aceptado).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="412" height="683" fill="#ffffff"/><path d="M212.4,83 L212.4,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M212.6,202 L212.6,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M213.1,321 L213.1,379" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M213.7,423 L213.7,481" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M214,542 L214.0,550.0 Q214,558 206.0,558.0 L131.0,558.0 Q122,558 122.0,567.0 L122,600" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M214,542 L214.0,550.0 Q214,558 222.0,558.0 L297.5,558.0 Q306.5,558 306.5,567.0 L306.5,608.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M38,630.5 L31.0,630.5 Q24,630.5 24.0,623.5 L24.0,61.5 Q24,52.5 33.0,52.5 L141.4,52.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="141.4" y="22" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="212.4" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="212.4" dy="0">Entrada de la</tspan><tspan x="212.4" dy="19.2">persona</tspan></text><rect x="141.4" y="141" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="212.4" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="212.4" dy="0">Restricciones</tspan><tspan x="212.4" dy="19.2">nativas</tspan></text><rect x="137.8" y="260" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="212.8" y="285.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="212.8" dy="0">Validación del</tspan><tspan x="212.8" dy="19.2">cliente</tspan></text><rect x="175.4" y="379" width="76" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="213.4" y="405.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="213.4" dy="0">Envío</tspan></text><rect x="139" y="481" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="214" y="506.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="214" dy="0">Validación del</tspan><tspan x="214" dy="19.2">servidor</tspan></text><rect x="38" y="600" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="122" y="625.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="122" dy="0">Mensaje asociado</tspan><tspan x="122" dy="19.2">al campo</tspan></text><rect x="240" y="608.5" width="133" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="306.5" y="634.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="306.5" dy="0">Confirmación</tspan></text><rect x="128" y="567" width="69" height="24" rx="4" fill="#ffffff"/><text x="162.5" y="582.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="162.5" dy="0">errores</tspan></text><rect x="312.5" y="571.2" width="77" height="24" rx="4" fill="#ffffff"/><text x="351" y="587.1" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="351" dy="0">aceptado</tspan></text></svg>
