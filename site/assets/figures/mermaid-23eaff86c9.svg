<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 601 832" width="601" height="832" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Eventos: commits, fusiones, despliegues, incidentes» … «Cambio en la práctica»</title><desc id="d">Diagrama de flujo con 9 pasos. «Eventos: commits, fusiones, despliegues, incidentes» lleva a «Definiciones escritas». «Definiciones escritas» lleva a «Métricas: plazo, frecuencia, fallos, recuperación». «Métricas: plazo, frecuencia, fallos, recuperación» lleva a «Interpretación». «Interpretación» lleva a «Intervalo de incertidumbre» (volumen pequeño). «Interpretación» lleva a «Atajos: la métrica mejora, el trabajo no» (se convierte en objetivo). «Interpretación» lleva a «Conversación y experimento» (diagnóstico). «Conversación y experimento» lleva a «Cambio en la práctica». «Cambio en la práctica» lleva a «Eventos: commits, fusiones, despliegues, incidentes». «Métricas: plazo, frecuencia, fallos, recuperación» lleva a «Medidas de contrapeso: defectos, valor».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="601" height="832" fill="#ffffff"/><path d="M383.6,121 L383.6,179" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M383.6,240 L383.6,260.0 Q383.6,269 374.6,269.0 L371.6,269.0 Q362.6,269 362.6,278.0 L362.6,298" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M362.6,397 L362.6,421.5 Q362.6,430.5 353.6,430.5 L250.5,430.5 Q241.5,430.5 241.5,439.5 L241.5,464" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M241.5,526 L241.