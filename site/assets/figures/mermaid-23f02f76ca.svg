<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 439 921" width="439" height="921" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Petición con inquilino» … «Cómputo y datos dedicados»</title><desc id="d">Diagrama de flujo con 9 pasos. «Petición con inquilino» lleva a «Cuota por inquilino». «Cuota por inquilino» lleva a «Cola por inquilino» (dentro). «Cuota por inquilino» lleva a «Rechazo con 429 y reintento» (excede). «Cola por inquilino» lleva a «Planificador justo». «Planificador justo» lleva a «Capacidad compartida». «Capacidad compartida» lleva a «Métricas por inquilino». «Métricas por inquilino» lleva a «Alerta y traslado de nivel». «Alerta y traslado de nivel» lleva a «Cómputo y datos dedicados» (silo).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="439" height="921" fill="#ffffff"/><path d="M231.1,83 L231.1,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M231.1,202 L231.1,210.0 Q231.1,218 223.1,218.0 L123.5,218.0 Q114.5,218 114.5,227.0 L114.5,268.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M231.1,202 L231.1,210.0 Q231.1,218 239.1,218.0 L320.0,218.0 Q329,218 329.0,227.0 L329,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M114.5,312.5 L114.5,336.8 Q114.5,345.8 123.5,345.8 L146.8,345.8 Q155.8,345.8 155.8,354.8 L155.8,379" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M155.8,423 L155.8,443.0 Q155.8,452 164.8,452.0 L183.3,452.0 Q192.3,452 192.3,461.0 L192.3,481" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M192.3,542 L192.3,562.0 Q192.3,571 201.3,571.0 L209.9,571.0 Q218.9,571 218.9,580.0 L218.9,600" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M218.9,661 L218.9,681.4 Q218.9,690 227.6,690.0 L227.6,690.0 Q236.2,690 236.2,698.6 L236.2,719" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M240.4,780 L240.4,838" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="164.6" y="22" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="231.1" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="231.1" dy="0">Petición con</tspan><tspan x="231.1" dy="19.2">inquilino</tspan></text><rect x="177.6" y="141" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="231.1" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="231.1" dy="0">Cuota por</tspan><tspan x="231.1" dy="19.2">inquilino</tspan></text><rect x="22" y="268.5" width="185" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="114.5" y="294.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="114.5" dy="0">Cola por inquilino</tspan></text><rect x="241" y="260" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="329" y="285.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="329" dy="0">Rechazo con 429 y</tspan><tspan x="329" dy="19.2">reintento</tspan></text><rect x="63.3" y="379" width="185" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="155.8" y="405.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="155.8" dy="0">Planificador justo</tspan></text><rect x="134.8" y="481" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="192.3" y="506.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="192.3" dy="0">Capacidad</tspan><tspan x="192.3" dy="19.2">compartida</tspan></text><rect x="152.4" y="600" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="218.9" y="625.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="218.9" dy="0">Métricas por</tspan><tspan x="218.9" dy="19.2">inquilino</tspan></text><rect x="148.2" y="719" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="236.2" y="744.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="236.2" dy="0">Alerta y traslado</tspan><tspan x="236.2" dy="19.2">de nivel</tspan></text><rect x="165.1" y="838" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="244.6" y="863.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="244.6" dy="0">Cómputo y datos</tspan><tspan x="244.6" dy="19.2">dedicados</tspan></text><rect x="120.5" y="231.2" width="61" height="24" rx="4" fill="#ffffff"/><text x="151" y="247.1" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="151" dy="0">dentro</tspan></text><rect x="335" y="227" width="61" height="24" rx="4" fill="#ffffff"/><text x="365.5" y="242.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="365.5" dy="0">excede</tspan></text><rect x="246.4" y="797" width="45" height="24" rx="4" fill="#ffffff"/><text x="268.9" y="812.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="268.9" dy="0">silo</tspan></text></svg>
