<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 614 343" width="614" height="343" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Intención» … «Paquete trazable»</title><desc id="d">Diagrama de flujo con 9 pasos. «Intención» lleva a «Lecturas y ejemplos». «Lecturas y ejemplos» lleva a «Contratos e invariantes». «Contratos e invariantes» lleva a «Modelos y estados». «Modelos y estados» lleva a «Esquemas e interfaces». «Esquemas e interfaces» lleva a «Evolución y versionado». «Evolución y versionado» lleva a «Fuente de verdad». «Fuente de verdad» lleva a «Pruebas contractuales». «Pruebas contractuales» lleva a «Paquete trazable». «Paquete trazable» lleva a «Intención» (cambio o discrepancia).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="614" height="343" fill="#ffffff"/><path d="M159.5,52.5 L249.5,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M364.5,52.5 L446,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M508,83 L508,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M454.5,171.5 L364.5,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M249.5,171.5 L168,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M106,202 L106,268.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M190,290.5 L236,290.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M378,290.5 L424,290.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M508,268.5 L508.0,225.0 Q508,216 499.0,216.0 L191.0,216.0 Q182,216 182.0,207.0 L182.0,97.5 Q182,88.5 173.0,88.5 L113.0,88.5 Q106,88.5 106.0,81.5 L106,74.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="52.5" y="30.5" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Intención</tspan></text><rect x="249.5" y="22" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="307" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="307" dy="0">Lecturas y</tspan><tspan x="307" dy="19.2">ejemplos</tspan></text><rect x="446" y="22" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="508" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="508" dy="0">Contratos e</tspan><tspan x="508" dy="19.2">invariantes</tspan></text><rect x="454.5" y="141" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="508" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="508" dy="0">Modelos y</tspan><tspan x="508" dy="19.2">estados</tspan></text><rect x="249.5" y="141" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="307" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="307" dy="0">Esquemas e</tspan><tspan x="307" dy="19.2">interfaces</tspan></text><rect x="44" y="141" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Evolución y</tspan><tspan x="106" dy="19.2">versionado</tspan></text><rect x="22" y="268.5" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="294.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Fuente de verdad</tspan></text><rect x="236" y="260" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="307" y="285.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="307" dy="0">Pruebas</tspan><tspan x="307" dy="19.2">contractuales</tspan></text><rect x="424" y="268.5" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="508" y="294.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="508" dy="0">Paquete trazable</tspan></text><rect x="387.8" y="220" width="110" height="42" rx="4" fill="#ffffff"/><text x="442.8" y="235.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="442.8" dy="0">cambio o</tspan><tspan x="442.8" dy="17.92">discrepancia</tspan></text></svg>
