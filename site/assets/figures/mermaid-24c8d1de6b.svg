<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 206" width="880" height="206" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Elemento nativo» … «Tecnología de apoyo»</title><desc id="d">Diagrama de flujo con 6 pasos. «Elemento nativo» lleva a «Rol, nombre y estado». «Rol, nombre y estado» lleva a «Orden de foco y teclado». «Orden de foco y teclado» lleva a «Tecnología de apoyo». «Elemento nativo» lleva a «Se pierde rol, foco y teclado» (se imita con div). «Se pierde rol, foco y teclado» lleva a «ARIA compensa parte». «ARIA compensa parte» lleva a «Tecnología de apoyo».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="880" height="206" fill="#ffffff"/><path d="M181,95 L241.0,95.0 Q250,95 250.0,86.0 L250.0,61.5 Q250,52.5 259.0,52.5 L319,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M461,52.5 L511,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M670,52.5 L684.0,52.5 Q693,52.5 693.0,61.5 L693.0,86.0 Q693,95 702.0,95.0 L716,95" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M181,95 L189.0,95.0 Q197,95 197.0,103.0 L197.0,128.5 Q197,137.5 206.0,137.5 L315,137.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M465,137.5 L519.5,137.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M661.5,137.5 L679.8,137.5 Q688.8,137.5 688.8,128.5 L688.8,104.0 Q688.8,95 697.8,95.0 L716,95" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="73" width="159" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101.5" y="99.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101.5" dy="0">Elemento nativo</tspan></text><rect x="319" y="22" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="390" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="390" dy="0">Rol, nombre y</tspan><tspan x="390" dy="19.2">estado</tspan></text><rect x="511" y="22" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="590.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="590.5" dy="0">Orden de foco y</tspan><tspan x="590.5" dy="19.2">teclado</tspan></text><rect x="716" y="64.5" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="787" y="89.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="787" dy="0">Tecnología de</tspan><tspan x="787" dy="19.2">apoyo</tspan></text><rect x="315" y="107" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="390" y="132.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="390" dy="0">Se pierde rol,</tspan><tspan x="390" dy="19.2">foco y teclado</tspan></text><rect x="519.5" y="107" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="590.5" y="132.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="590.5" dy="0">ARIA compensa</tspan><tspan x="590.5" dy="19.2">parte</tspan></text><rect x="201" y="141.5" width="110" height="42" rx="4" fill="#ffffff"/><text x="256" y="157.4" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="256" dy="0">se imita con</tspan><tspan x="256" dy="17.92">div</tspan></text></svg>
