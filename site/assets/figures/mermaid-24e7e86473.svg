<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 960" width="580" height="960" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Conjunto de tareas» … «Adoptar con controles» y «Medir más o no cambiar»</title><desc id="d">Diagrama de flujo con 11 pasos. «Conjunto de tareas» lleva a «Asignación pareada y orden alternado». «Asignación pareada y orden alternado» lleva a «Flujo manual». «Asignación pareada y orden alternado» lleva a «Flujo asistido». «Asignación pareada y orden alternado» lleva a «Flujo automatizado». «Flujo manual» lleva a «Registro: horas, defectos, revisión». «Flujo asistido» lleva a «Registro: horas, defectos, revisión». «Flujo automatizado» lleva a «Registro: horas, defectos, revisión». «Registro: horas, defectos, revisión» lleva a «Análisis: mediana, intervalo, defectos». «Análisis: mediana, intervalo, defectos» lleva a «Sensibilidad: tasa de aciertos». «Sensibilidad: tasa de aciertos» lleva a «Decisión». «Decisión» lleva a «Adoptar con controles» (diferencia clara). «Decisión» lleva a «Medir más o no cambiar» (diferencia dentro del ruido).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="580" height="960" fill="#ffffff"/><path d="M272.6,66 L272.6,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M272.6,185 L272.6,205.0 Q272.6,214 263.6,214.0 L97.5,214.0 Q88.5,214 88.5,223.0 L88.5,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M268.3,185 L268.3,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M272.6,185 L272.6,2