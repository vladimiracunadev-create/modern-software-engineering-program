<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 582 769" width="582" height="769" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Petición entrante» … «Qué optimizar»</title><desc id="d">Diagrama de flujo con 11 pasos. «Petición entrante» lleva a «Contexto: traza y span». «Contexto: traza y span» lleva a «Llamadas HTTP». «Contexto: traza y span» lleva a «Colas y mensajes». «Contexto: traza y span» lleva a «Hilos y tareas». «Llamadas HTTP» lleva a «Spans en el recolector». «Colas y mensajes» lleva a «Spans en el recolector». «Hilos y tareas» lleva a «Spans en el recolector». «Spans en el recolector» lleva a «Árbol de la traza». «Árbol de la traza» lleva a «Ruta crítica». «Spans en el recolector» lleva a «Muestreo de cabeza o de cola». «Ruta crítica» lleva a «Qué optimizar». «Colas y mensajes» lleva a «Traza fragmentada» (contexto perdido).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="582" height="769" fill="#ffffff"/><path d="M282.3,66 L282.3,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M282.3,185 L282.3,205.0 Q282.3,214 273.3,214.0 L111.2,214.0 Q102.2,214 102.2,223.0 L102.2,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M282.3,185 L282.3,205.0 Q282.3,214 291.3,214.0 L466.2,214.0 Q475.2,214 475.2,223.0 L475.2,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M282.3,185 L282.3,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M102.2,287 L102.2,316.0 Q102.2,325 111.2,325.0 L245.8,325.0 Q25