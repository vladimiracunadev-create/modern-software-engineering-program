<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 166" width="822" height="166" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Entrevista como método» … «De la cita a la afirmación»</title><desc id="d">Diagrama de flujo con 5 pasos. «Entrevista como método» lleva a «Preguntas sobre el pasado». «Preguntas sobre el pasado» lleva a «Muestreo y saturación». «Muestreo y saturación» lleva a «Codificación y acuerdo». «Codificación y acuerdo» lleva a «De la cita a la afirmación». «De la cita a la afirmación» lleva a «Entrevista como método» (fallo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="822" height="166" fill="#ffffff"/><path d="M146,104 L192,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M299,104 L345,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M460,104 L506,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M639,104 L685,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M742.5,64 L742.5,57.0 Q742.5,50 735.5,50.0 L93.0,50.0 Q84,50 84.0,59.0 L84,73.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="73.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="84" y="98.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="84" dy="0">Entrevista</tspan><tspan x="84" dy="19.2">como método</tspan></text><rect x="192" y="64" width="107" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="245.5" y="89" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="245.5" dy="0">Preguntas</tspan><tspan x="245.5" dy="19.2">sobre el</tspan><tspan x="245.5" dy="19.2">pasado</tspan></text><rect x="345" y="73.5" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="402.5" y="98.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="402.5" dy="0">Muestreo y</tspan><tspan x="402.5" dy="19.2">saturación</tspan></text><rect x="506" y="73.5" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="572.5" y="98.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="572.5" dy="0">Codificación</tspan><tspan x="572.5" dy="19.2">y acuerdo</tspan></text><rect x="685" y="64" width="115" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="742.5" y="89" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="742.5" dy="0">De la cita</tspan><tspan x="742.5" dy="19.2">a la</tspan><tspan x="742.5" dy="19.2">afirmación</tspan></text><rect x="350.2" y="22" width="126" height="24" rx="4" fill="#ffffff"/><text x="413.2" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="413.2" dy="0">fallo o cambio</tspan></text></svg>
