<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 456 1083" width="456" height="1083" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Salida del sistema» … «Ventana más larga o más muestra»</title><desc id="d">Diagrama de flujo con 10 pasos. «Salida del sistema» lleva a «Indicador y ventana». «Indicador y ventana» lleva a «Línea base en sistema sano». «Línea base en sistema sano» lleva a «Banda: ruido natural». «Banda: ruido natural» lleva a «Hipótesis: seguirá dentro de la banda». «Hipótesis: seguirá dentro de la banda» lleva a «Inyección en el grupo experimental». «Inyección en el grupo experimental» lleva a «¿Sale de la banda frente al control?». «¿Sale de la banda frente al control?» lleva a «Hipótesis refutada» (sí). «¿Sale de la banda frente al control?» lleva a «No refutada: confianza acotada» (no). «No refutada: confianza acotada» lleva a «Ventana más larga o más muestra» (¿potencia suficiente?).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="456" height="1083" fill="#ffffff"/><path d="M130.4,66 L130.4,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M132.9,185 L132.9,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M139.5,304 L139.5,362" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M143.7,423 L143.7,445.6 Q143.7,452 150.1,452.0 L150.1,452.0 Q156.5,452 156.5,458.4 L156.5,481" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M156.5,542 L156.5,562.0 Q156.5,571 165.5,571.0 L166.6,571.0 Q175.6,571 175.6,580.0 L175.6,600" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M175.6,661 L175.6,681.0 Q175.6,690 184.6,690.0 L194.0,690.0 Q203,690 203.0,699.0 L203,719" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M203,805 L203.0,813.0 Q203,821 195.0,821.0 L123.5,821.0 Q114.5,821 114.5,830.0 L114.5,871.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M203,805 L203.0,813.0 Q203,821 211.0,821.0 L320.0,821.0 Q329,821 329.0,830.0 L329,863" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M326,924 L326,1000" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="37.9" y="22" width="185" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="130.4" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="130.4" dy="0">Salida del sistema</tspan></text><rect x="68.4" y="124" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="130.4" y="149.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="130.4" dy="0">Indicador y</tspan><tspan x="130.4" dy="19.2">ventana</tspan></text><rect x="64.4" y="243" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135.4" y="268.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="135.4" dy="0">Línea base en</tspan><tspan x="135.4" dy="19.2">sistema sano</tspan></text><rect x="77.2" y="362" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="143.7" y="387.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="143.7" dy="0">Banda: ruido</tspan><tspan x="143.7" dy="19.2">natural</tspan></text><rect x="64" y="481" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="156.5" y="506.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="156.5" dy="0">Hipótesis: seguirá</tspan><tspan x="156.5" dy="19.2">dentro de la banda</tspan></text><rect x="83.1" y="600" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="175.6" y="625.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="175.6" dy="0">Inyección en el</tspan><tspan x="175.6" dy="19.2">grupo experimental</tspan></text><polygon points="203,719 354.5,762 203,805 51.5,762" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="203" y="756.6" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="203" dy="0">¿Sale de la banda</tspan><tspan x="203" dy="19.2">frente al control?</tspan></text><rect x="22" y="871.5" width="185" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="114.5" y="897.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="114.5" dy="0">Hipótesis refutada</tspan></text><rect x="241" y="863" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="329" y="888.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="329" dy="0">No refutada:</tspan><tspan x="329" dy="19.2">confianza acotada</tspan></text><rect x="235.1" y="1000" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="323.1" y="1025.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="323.1" dy="0">Ventana más larga</tspan><tspan x="323.1" dy="19.2">o más muestra</tspan></text><rect x="120.5" y="834.2" width="29" height="24" rx="4" fill="#ffffff"/><text x="135" y="850.1" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="135" dy="0">sí</tspan></text><rect x="335" y="830" width="29" height="24" rx="4" fill="#ffffff"/><text x="349.5" y="845.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="349.5" dy="0">no</tspan></text><rect x="332" y="941" width="102" height="42" rx="4" fill="#ffffff"/><text x="383" y="956.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="383" dy="0">¿potencia</tspan><tspan x="383" dy="17.92">suficiente?</tspan></text></svg>
