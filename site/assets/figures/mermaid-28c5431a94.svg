<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 304" width="940" height="304" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Partición: dos grupos sin comunicación» … «Último escritor gana: pierde trabajo» y «Tipo fusionable: conserva lo que conmuta»</title><desc id="d">Diagrama de flujo con 9 pasos. «Partición: dos grupos sin comunicación» lleva a «Qué hace cada lado». «Qué hace cada lado» lleva a «Consistente, no disponible» (rechaza). «Qué hace cada lado» lleva a «Disponible, divergente» (acepta). «Disponible, divergente» lleva a «Reparación al volver la red». «Reparación al volver la red» lleva a «Último escritor gana: pierde trabajo». «Reparación al volver la red» lleva a «Tipo fusionable: conserva lo que conmuta». «Consistente, no disponible» lleva a «Cuórum: mayoría necesaria». «Partición: dos grupos sin comunicación» lleva a «Sin partición: latencia frente a consistencia».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="304" fill="#ffffff"/><path d="M155,152 L169.0,152.0 Q178,152 178.0,143.0 L178.0,90.0 Q178,81 187.0,81.0 L201,81" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M361,81 L454,81" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M361,81 L369.0,81.0 Q377,81 377.0,89.0 L377.0,214.0 Q377,223 386.0,223.0 L458.5,223" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M582.5,223 L633,223" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M748,223 L768.5,223.0 Q777.5,223 777.5,214.0 L777.5,90.0 Q777.5,81 786.5,81.0 L807,81" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M748,223 L794,223" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M587,81 L637,81" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M155,152 L175.8,152.0 Q184.8,152 184.8,161.0 L184.8,214.0 Q184.8,223 193.8,223.0 L214.5,223" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="102.5" width="133" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="88.5" y="127.4" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="88.5" dy="0">Partición:</tspan><tspan x="88.5" dy="19.2">dos grupos</tspan><tspan x="88.5" dy="19.2">sin</tspan><tspan x="88.5" dy="19.2">comunicación</tspan></text><polygon points="281,38 361,81 281,124 201,81" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="281" y="75.6" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="281" dy="0">Qué hace</tspan><tspan x="281" dy="19.2">cada lado</tspan></text><rect x="454" y="41" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="520.5" y="66" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="520.5" dy="0">Consistente,</tspan><tspan x="520.5" dy="19.2">no</tspan><tspan x="520.5" dy="19.2">disponible</tspan></text><rect x="458.5" y="192.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="520.5" y="217.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="520.5" dy="0">Disponible,</tspan><tspan x="520.5" dy="19.2">divergente</tspan></text><rect x="633" y="183" width="115" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="690.5" y="208" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="690.5" dy="0">Reparación</tspan><tspan x="690.5" dy="19.2">al volver</tspan><tspan x="690.5" dy="19.2">la red</tspan></text><rect x="807" y="22" width="98" height="118" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="856" y="46.8" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="856" dy="0">Último</tspan><tspan x="856" dy="19.2">escritor</tspan><tspan x="856" dy="19.2">gana:</tspan><tspan x="856" dy="19.2">pierde</tspan><tspan x="856" dy="19.2">trabajo</tspan></text><rect x="794" y="173.5" width="124" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="856" y="198.4" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="856" dy="0">Tipo</tspan><tspan x="856" dy="19.2">fusionable:</tspan><tspan x="856" dy="19.2">conserva lo</tspan><tspan x="856" dy="19.2">que conmuta</tspan></text><rect x="637" y="41" width="107" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="690.5" y="66" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="690.5" dy="0">Cuórum:</tspan><tspan x="690.5" dy="19.2">mayoría</tspan><tspan x="690.5" dy="19.2">necesaria</tspan></text><rect x="214.5" y="164" width="133" height="118" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="281" y="188.8" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="281" dy="0">Sin</tspan><tspan x="281" dy="19.2">partición:</tspan><tspan x="281" dy="19.2">latencia</tspan><tspan x="281" dy="19.2">frente a</tspan><tspan x="281" dy="19.2">consistencia</tspan></text><rect x="373" y="53" width="69" height="24" rx="4" fill="#ffffff"/><text x="407.5" y="68.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="407.5" dy="0">rechaza</tspan></text><rect x="387.2" y="195" width="61" height="24" rx="4" fill="#ffffff"/><text x="417.7" y="210.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="417.7" dy="0">acepta</tspan></text></svg>
