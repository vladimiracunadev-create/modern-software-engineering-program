<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 741 224" width="741" height="224" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Reporte» … «Vínculo perdido»</title><desc id="d">Diagrama de flujo con 7 pasos. «Reporte» lleva a «Issue». «Issue» lleva a «Discusión y decisión». «Discusión y decisión» lleva a «Cambio». «Cambio» lleva a «Commit con referencia». «Commit con referencia» lleva a «Integración». «Integración» lleva a «Issue» (cierra). «Integración» lleva a «Vínculo perdido» (squash sin cuerpo).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="741" height="224" fill="#ffffff"/><path d="M111,52.5 L198.5,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M274.5,52.5 L434,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M558,52.5 L621,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M661.5,74.5 L661.5,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M604,171.5 L558,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M434,171.5 L316,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M496,149.5 L496.0,106.0 Q496,97 487.0,97.0 L245.5,97.0 Q236.5,97 236.5,88.0 L236.5,74.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="30.5" width="89" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="66.5" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="66.5" dy="0">Reporte</tspan></text><rect x="198.5" y="30.5" width="76" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="236.5" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="236.5" dy="0">Issue</tspan></text><rect x="434" y="22" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="496" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="496" dy="0">Discusión y</tspan><tspan x="496" dy="19.2">decisión</tspan></text><rect x="621" y="30.5" width="81" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="661.5" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="661.5" dy="0">Cambio</tspan></text><rect x="604" y="141" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="661.5" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="661.5" dy="0">Commit con</tspan><tspan x="661.5" dy="19.2">referencia</tspan></text><rect x="434" y="149.5" width="124" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="496" y="175.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="496" dy="0">Integración</tspan></text><rect x="157" y="149.5" width="159" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="236.5" y="175.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="236.5" dy="0">Vínculo perdido</tspan></text><rect x="335.8" y="69" width="61" height="24" rx="4" fill="#ffffff"/><text x="366.3" y="84.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="366.3" dy="0">cierra</tspan></text><rect x="328" y="125.5" width="94" height="42" rx="4" fill="#ffffff"/><text x="375" y="141.4" font-size="14" text-anc