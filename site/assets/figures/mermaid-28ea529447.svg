<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 904" width="672" height="904" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Filtro de texto» … «Huella externa»</title><desc id="d">Diagrama de flujo con 10 pasos. «Contenido no confiable: página, correo, nota, resultado de herramienta» lleva a «Contexto del agente». «Datos privados» lleva a «Contexto del agente». «Contexto del agente» lleva a «Decisión del modelo». «Decisión del modelo» lleva a «Herramienta con efecto». «Herramienta con efecto» lleva a «Comunicación hacia fuera». «Filtro de texto» lleva a «Contenido no confiable: página, correo, nota, resultado de herramienta» (detecta formas conocidas). «Política: romper una capacidad» lleva a «Contexto del agente». «Política: romper una capacidad» lleva a «Herramienta con efecto». «Decisión del modelo» lleva a «Registro de auditoría encadenado». «Herramienta con efecto» lleva a «Registro de auditoría encadenado». «Registro de auditoría encadenado» lleva a «Huella externa».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="672" height="904" fill="#ffffff"/><path d="M114.5,260 L114.5,280.0 Q114.5,289 123.5,289.0 L339.5,289.0 Q348.5,289 348.5,298.0 L348.5,318" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M316,223 L316.0,261.5 Q316,270.5 325.0,270.5 L339.5,270.5 Q348.5,270.5 348.5,279.5 L348.5,318" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M348.5,379 L348.5,399.0 Q348.5,408 357.5,408.0 L394.3,408.0 Q403.3,408 403.3,417.0 L403.3,437" fill="none" stroke="#32505f" stroke-