" fill="#0b3f45"><tspan x="415.7" dy="0">Plan</tspan></text><rect x="325.1" y="739" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="413.1" y="764.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="413.1" dy="0">Costo por usuario</tspan><tspan x="413.1" dy="19.2">y equilibrio</tspan></text><rect x="334.6" y="470.8" width="45" height="24" rx="4" fill="#ffffff"/><text x="357.1" y="486.7" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357.1" dy="0">baja</tspan></text><rect x="518.6" y="466" width="45" height="24" rx="4" fill="#ffffff"/><text x="541.1" y="481.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="541.1" dy="0">alta</tspan></text><rect x="22" y="449.5" width="102" height="42" rx="4" fill="#ffffff"/><text x="73" y="465.4" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="73" dy="0">cambian los</tspan><tspan x="73" dy="17.92">supuestos</tspan></text></svg>
