<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 593 822" width="593" height="822" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Iniciativas posibles» … «Costo por usuario y equilibrio»</title><desc id="d">Diagrama de flujo con 10 pasos. «Iniciativas posibles» lleva a «Costo de demora y duración». «Costo de demora y duración» lleva a «Orden de ejecución». «Iniciativas posibles» lleva a «Flujos de beneficio y costo». «Flujos de beneficio y costo» lleva a «Valor presente y retorno». «Valor presente y retorno» lleva a «Tasa de descuento». «Tasa de descuento» lleva a «Favorece beneficios tardíos» (baja). «Tasa de descuento» lleva a «Favorece beneficios tempranos» (alta). «Orden de ejecución» lleva a «Plan». «Favorece beneficios tardíos» lleva a «Plan». «Favorece beneficios tempranos» lleva a «Plan». «Plan» lleva a «Costo por usuario y equilibrio». «Costo por usuario y equilibrio» lleva a «Costo de demora y duración» (cambian los supuestos).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="593" height="822" fill="#ffffff"/><path d="M346.1,83 L346.1,103.0 Q346.1,112 337.1,112.0 L250.1,112.0 Q241.1,112 241.1,121.0 L241.1,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M238.8,202 L238.8,268.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M346.1,83 L346.1,103.0 Q346.1,112 355.1,112.0 L442.1,112.0 Q451.1,112 451.1,121.0 L451.1,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M449.1,202 L449.1,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M447,321 L447.0,341.1 Q447,350 438.1,350.0 L438.1,350.0 Q429.2,350 429.2,358.9 L429.2,379" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M429.2,441 L429.2,449.0 Q429.2,457 421.2,457.0 L337.6,457.0 Q328.6,457 328.6,466.0 L328.6,508.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M429.2,441 L429.2,449.0 Q429.2,457 437.2,457.0 L503.6,457.0 Q512.6,457 512.6,466.0 L512.6,499" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M236.5,312.5 L236.5,487.3 Q236.5,494.5 229.3,494.5 L229.3,494.5 Q222.1,494.5 222.1,501.7 L222.1,650.0 Q222.1,659 231.1,659.0 L377.7,659" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M328.6,569.5 L328.6,594.2 Q328.6,603.2 337.6,603.2 L406.7,603.2 Q415.7,603.2 415.7,612.2 L415.7,637" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M512.6,579 L512.6,599.0 Q512.6,608 503.6,608.0 L424.7,608.0 Q415.7,608 415.7,617.0 L415.7,637" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M414.4,681 L414.4,739" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M325.1,769.5 L139.0,769.5 Q130,769.5 130.0,760.5 L130.0,180.5 Q130,171.5 139.0,171.5 L153.1,171.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="284.1" y="22" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="346.1" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="346.1" dy="0">Iniciativas</tspan><tspan x="346.1" dy="19.2">posibles</tspan></text><rect x="153.1" y="141" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="241.1" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="241.1" dy="0">Costo de demora y<