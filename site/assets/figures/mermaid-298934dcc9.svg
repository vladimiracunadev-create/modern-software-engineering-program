<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 881 105" width="881" height="105" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «🎯 Fuente» … «📈 Consumo»</title><desc id="d">Diagrama de flujo con 5 pasos. «🎯 Fuente» lleva a «🧠 Contrato de datos». «🧠 Contrato de datos» lleva a «🛠️ Transformación». «🛠️ Transformación» lleva a «🔎 Calidad». «🔎 Calidad» lleva a «📈 Consumo».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="881" height="105" fill="#ffffff"/><path d="M127,52.5 L173,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M321,52.5 L367,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M541,52.5 L587,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M700,52.5 L746,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="30.5" width="105" height="44" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="74.5" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="74.5" dy="0">🎯 Fuente</tspan></text><rect x="173" y="22" width="148" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="247" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="247" dy="0">🧠 Contrato de</tspan><tspan x="247" dy="19.2">datos</tspan></text><rect x="367" y="30.5" width="174" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="454" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="454" dy="0">🛠️ Transformación</tspan></text><rect x="587" y="30.5" width="113" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="643.5" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="643.5" dy="0">🔎 Calidad</tspan></text><rect x="746" y="30.5" width="113" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="802.5" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="802.5" dy="0">📈 Consumo</tspan></text></svg>
