<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 427 640" width="427" height="640" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Emisor de credenciales: vida corta, destinatario» … «Recurso» y «Rechazo y registro»</title><desc id="d">Diagrama de flujo con 7 pasos. «Solicitante: identidad + dispositivo + contexto» lleva a «Punto de aplicación PEP». «Punto de aplicación PEP» lleva a «Punto de decisión PDP: política». «Punto de decisión PDP: política» lleva a «Recurso» (permite). «Punto de decisión PDP: política» lleva a «Rechazo y registro» (deniega). «Emisor de credenciales: vida corta, destinatario» lleva a «Solicitante: identidad + dispositivo + contexto». «Telemetría y detección» lleva a «Punto de decisión PDP: política». «Recurso» lleva a «Telemetría y detección». «Rechazo y registro» lleva a «Telemetría y detección».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="427" height="640" fill="#ffffff"/><path d="M119.5,278 L119.5,298.0 Q119.5,307 110.5,307.0 L106.0,307.0 Q97,307 97.0,316.0 L97,336" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M97,397 L97.0,417.0 Q97,426 106.0,426.0 L194.5,426.0 Q203.5,426 203.5,435.0 L203.5,455" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M203.5,516 L203.5,524.0 Q203.5,532 195.5,532.0 L134.2,532.0 Q125.2,532 125.2,541.0 L125.2,574" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M203.5,516 L203.5,524.0 Q203.5,532 211.5,532.0 L287.2,532.0 Q296.2,532 296.2,541.0 L296.2,574" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M119.5,121 L119.5,179" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M272.5,397 L272.5,417.0 Q272.5,426 263.5,426.0 L212.5,426.0 Q203.5,426 203.5,435.0 L203.5,455" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M80.7,596 L73.7,596.0 Q66.7,596 66.7,589.0 L66.7,420.0 Q66.7,411 75.7,411.0 L183.0,411.0 Q192,411 192.0,402.0 L192.0,373.5 Q192,366.5 199.0,366.5 L206,366.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><path d="M388.7,596 L395.7,596.0 Q402.7,596 402.7,589.0 L402.7,375.5 Q402.7,366.5 393.7,366.5 L339,366.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="48.5" y="179" width="142" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="119.5" y="203.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="119.5" dy="0">Solicitante:</tspan><tspan x="119.5" dy="19.2">identidad +</tspan><tspan x="119.5" dy="19.2">dispositivo +</tspan><tspan x="119.5" dy="19.2">contexto</tspan></text><rect x="22" y="336" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="97" y="361.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="97" dy="0">Punto de</tspan><tspan x="97" dy="19.2">aplicación PEP</tspan></text><rect x="115.5" y="455" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="203.5" y="480.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="203.5" dy="0">Punto de decisión</tspan><tspan x="203.5" dy="19.2">PDP: política</tspan></text><rect x="80.7" y="574" width="89" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="125.2" y="600.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="