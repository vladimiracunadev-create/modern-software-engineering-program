<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 545 937" width="545" height="937" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Validador de referencias» y «Huella en dos sistemas» … «Guardia y escalamiento»</title><desc id="d">Diagrama de flujo con 12 pasos. «Servicios» lleva a «SLO y presupuesto». «SLO y presupuesto» lleva a «Alertas». «Alertas» lleva a «Runbooks». «Runbooks» lleva a «Guardia y escalamiento». «SLO y presupuesto» lleva a «Protocolo de incidentes». «Protocolo de incidentes» lleva a «Postmortem y acciones». «Servicios» lleva a «Copias y restauración». «Copias y restauración» lleva a «Ejercicio y hallazgos». «Postmortem y acciones» lleva a «Ejercicio y hallazgos». «Ejercicio y hallazgos» lleva a «Runbooks» (actualiza). «Validador de referencias» lleva a «Servicios». «Validador de referencias» lleva a «Alertas». «Validador de referencias» lleva a «Runbooks». «Validador de referencias» lleva a «Copias y restauración». «Huella en dos sistemas» lleva a «Informe con límites».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="545" height="937" fill="#ffffff"/><path d="M231,209.5 L231.0,238.0 Q231,247 222.0,247.0 L135.0,247.0 Q126,247 126.0,256.0 L126,284.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M126,328.5 L126.0,357.0 Q126,366 117.0,366.0 L104.7,366.0 Q95.7,366 95.7,375.0 L95.7,403.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M95.7,447.5 L95.7,765.0 Q95.7,774 104.7,774.0 L263.9,774" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)