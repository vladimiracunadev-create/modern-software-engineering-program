<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 319 615" width="319" height="615" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Usuario» … «Operación»</title><desc id="d">Diagrama de flujo con 8 pasos. «Usuario» lleva a «Interfaz». «Interfaz» lleva a «Contrato». «Contrato» lleva a «Lógica». «Lógica» lleva a «Datos». «Lógica» lleva a «Dependencias». «Datos» lleva a «Operación». «Operación» lleva a «Usuario». «Fuentes y decisiones» lleva a «Contrato». «Fuentes y decisiones» lleva a «Lógica».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="319" height="615" fill="#ffffff"/><path d="M82.5,66 L82.5,132.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M82.5,176.5 L82.5,200.8 Q82.5,209.8 91.5,209.8 L158.9,209.8 Q167.9,209.8 167.9,218.8 L167.9,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M165.1,287 L165.1,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M162.2,389 L162.2,409.0 Q162.2,418 153.2,418.0 L95.4,418.0 Q86.4,418 86.4,427.0 L86.4,447" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M162.2,389 L162.2,409.0 Q162.2,418 171.2,418.0 L215.9,418.0 Q224.9,418 224.9,427.0 L224.9,447" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M89.2,491 L89.2,549" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M223,185 L223.0,205.0 Q223,214 214.0,214.0 L176.9,214.0 Q167.9,214 167.9,223.0 L167.9,243" fill="none" stroke="#32505f" stroke-width="1.8