<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 684" width="580" height="684" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Decisión que se quiere informar» … «Revisar con otra métrica»</title><desc id="d">Diagrama de flujo con 9 pasos. «Decisión que se quiere informar» lleva a «Métrica de flujo». «Decisión que se quiere informar» lleva a «Métrica de calidad». «Decisión que se quiere informar» lleva a «Métrica de resultado». «Métrica de flujo» lleva a «Contrapeso». «Métrica de calidad» lleva a «Contrapeso». «Métrica de resultado» lleva a «Contrapeso». «Contrapeso» lleva a «Se premia». «Se premia» lleva a «Se infla sin mejora» (sí). «Se premia» lleva a «Informa la decisión» (no). «Se infla sin mejora» lleva a «Revisar con otra métrica».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="580" height="684" fill="#ffffff"/><path d="M307.6,83 L307.6,107.2 Q307.6,116.2 298.6,116.2 L115.0,116.2 Q106,116.2 106.0,125.2 L106,149.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M312.1,83 L312.1,149.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M307.6,83 L307.6,103.0 Q307.6,112 316.6,112.0 L491.5,112.0 Q500.5,112 500.5,121.0 L500.5,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M106,193.5 L106.0,217.8 Q106,226.8 115.0,226.8 L292.6,226.8 Q301.6,226.8 301.6,235.8 L301.6,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M316.5,193.5 L316.5,219.4 Q316.5,226.8 309.1,226.8 L309.1,226.8 Q301.6,226.8 301.6,234