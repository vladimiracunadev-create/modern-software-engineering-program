<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 421 894" width="421" height="894" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Registro de uso y riesgo» … «Recortar pasos o mover a un nivel inferior» y «Suite pequeña y estable»</title><desc id="d">Diagrama de flujo con 8 pasos. «Registro de uso y riesgo» lleva a «Recorridos candidatos». «Recorridos candidatos» lleva a «Selección por tráfico e impacto». «Selección por tráfico e impacto» lleva a «Criterio de aceptación ejecutable». «Criterio de aceptación ejecutable» lleva a «Aserción semántica o instantánea». «Aserción semántica o instantánea» lleva a «Presupuesto de inestabilidad por paso». «Presupuesto de inestabilidad por paso» lleva a «Recortar pasos o mover a un nivel inferior» (demasiado inestable). «Recortar pasos o mover a un nivel inferior» lleva a «Criterio de aceptación ejecutable». «Presupuesto de inestabilidad por paso» lleva a «Suite pequeña y estable».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="421" height="894" fill="#ffffff"/><path d="M220.2,83 L220.2,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M220.2,202 L220.2,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M220.4,321 L220.4,379" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M220.4,459 L220.4,517" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M220.6,578 L220.6,636" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M220.7,716 L220.7,724.0 Q220.7,732 212.7,732.0 L131.0,732.0 Q122,732 122.0,741.0 L122,792" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M220.7,716 L220.7,749.8 Q220.7,758.8 229.7,758.8 L310.5,758.8 Q319.5,758.8 319.5,767.8 L319.5,801.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M38,832 L31.0,832.0 Q24,832 24.0,825.0 L24.0,428.0 Q24,419 33.0,419.0 L158.4,419" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="132.2" y="22" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="220.2" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="220.2" dy="0">Registro de uso y</tspan><tspan x="220.2" dy="19.2">riesgo</tspan></text><rect x="162.7" y="141" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="220.2" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="220.2" dy="0">Recorridos</tspan><tspan x="220.2" dy="19.2">candidatos</tspan></text><rect x="132.3" y="260" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="220.3" y="285.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="220.3" dy="0">Selección por</tspan><tspan x="220.3" dy="19.2">tráfico e impacto</tspan></text><rect x="158.4" y="379" width="124" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="220.4" y="404" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="220.4" dy="0">Criterio de</tspan><tspan x="220.4" dy="19.2">aceptación</tspan><tspan x="220.4" dy="19.2">ejecutable</tspan></text><rect x="128" y="517" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="220.5" y="542.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="220.5" dy="0">Aserción semántica</tspan><tspan x="220.5" dy="19.2">o instantánea</tspan></text><rect x="132.7" y="636" width="176" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="220.7" y="661" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="220.7" dy="0">Presupuesto de</tspan><tspan x="220.7" dy="19.2">inestabilidad por</tspan><tspan x="220.7" dy="19.2">paso</tspan></text><rect x="38" y="792" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="122" y="817" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="122" dy="0">Recortar pasos o</tspan><tspan x="122" dy="19.2">mover a un nivel</tspan><tspan x="122" dy="19.2">inferior</tspan></text><rect x="240" y="801.5" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="319.5" y="826.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="319.5" dy="0">Suite pequeña y</tspan><tspan x="319.5" dy="19.2">estable</tspan></text><rect x="128" y="741" width="86" height="42" rx="4" fill="#ffffff"/><text x="171" y="756.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="171" dy="0">demasiado</tspan><tspan x="171" dy="17.92">inestable</tspan></text></svg>
