<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 819 400" width="819" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Capacidades y límites» … «Proyecto: cambio con trazabilidad»</title><desc id="d">Diagrama de flujo con 12 pasos. «Capacidades y límites» lleva a «Prompting y criterios de salida». «Prompting y criterios de salida» lleva a «Contexto, memoria y recuperación». «Contexto, memoria y recuperación» lleva a «Autocompletado, chat, edición y generación». «Autocompletado, chat, edición y generación» lleva a «Prototipado y alternativas». «Prototipado y alternativas» lleva a «Pruebas, documentación y migraciones». «Pruebas, documentación y migraciones» lleva a «Revisión, refactorización y explicación». «Revisión, refactorización y explicación» lleva a «Context engineering». «Context engineering» lleva a «Evals». «Evals» lleva a «Privacidad, licencias y código inseguro». «Privacidad, licencias y código inseguro» lleva a «Taller: comparar flujos». «Taller: comparar flujos» lleva a «Proyecto: cambio con trazabilidad». «Proyecto: cambio con trazabilidad» lleva a «Capacidades y límites» (incidente o hallazgo).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="819" height="400" fill="#ffffff"/><path d="M164,62 L223,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M356,62 L432.5,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M565.5,62 L633.5,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M713,102 L713,169.5" fill="none" stro