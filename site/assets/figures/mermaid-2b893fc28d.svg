<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 447 721" width="447" height="721" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Drivers» … «Validador de forma y limites declarados»</title><desc id="d">Diagrama de flujo con 9 pasos. «Drivers» lleva a «Escenarios medibles». «Escenarios medibles» lleva a «ADR con alternativas». «ADR con alternativas» lleva a «Modelo ejecutable». «Modelo ejecutable» lleva a «Veredictos y simulacion». «Escenarios medibles» lleva a «Funciones de aptitud». «ADR con alternativas» lleva a «Trazabilidad decision a escenario». «Trazabilidad decision a escenario» lleva a «Impacto de revertir». «Veredictos y simulacion» lleva a «Validador de forma y limites declarados». «Validador de forma y limites declarados» lleva a «ADR con alternativas» (falla un escenario).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="447" height="721" fill="#ffffff"/><path d="M285.4,66 L285.4,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M285.4,185 L285.4,205.0 Q285.4,214 276.4,214.0 L199.6,214.0 Q190.6,214 190.6,223.0 L190.6,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M190.6,304 L190.6,333.0 Q190.6,342 181.6,342.0 L135.0,342.0 Q126,342 126.0,351.0 L126,380" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M126,424 L126.0,453.0 Q126,462 135.0,462.0 L145.4,462.0 Q154.4,462 154.4,471.0 L154.4,500" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M285.4,185 L285.4,205.0 Q285.4,214 294.4,214.0 L348.6,214.0 Q357.6,214 357.6,223.0 L357.6,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M190.6,304 L190.6,324.0 Q190.6,333 199.6,333.0 L305.5,333.0 Q314.5,333 314.5,342.0 L314.5,362" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M314.5,442 L314.5,464.1 Q314.5,471 321.4,471.0 L321.4,471.0 Q328.3,471 328.3,477.9 L328.3,500" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M154.4,561 L154.4,582.7 Q154.4,590 161.7,590.0 L161.7,590.0 Q169,590 169.0,597.3 L169,619" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M76.5,659 L33.0,659.0 Q24,659 24.0,650.0 L24.0,282.5 Q24,273.5 33.0,273.5 L124.1,273.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="240.9" y="22" width="89" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="285.4" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="285.4" dy="0">Drivers</tspan></text><rect x="227.9" y="124" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="285.4" y="149.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="285.4" dy="0">Escenarios</tspan><tspan x="285.4" dy="19.2">medibles</tspan></text><rect x="124.1" y="243" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="190.6" y="268.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="190.6" dy="0">ADR con</tspan><tspan x="190.6" dy="19.2">alternativas</tspan></text><rect x="38" y="380" width="176" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="126" y="406.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="126" dy="0">Modelo ejecutable</tspan></text><rect x="87.9" y="500" width="133" height="61" rx="10" fill="#dff