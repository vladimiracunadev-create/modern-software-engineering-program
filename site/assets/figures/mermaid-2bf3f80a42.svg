<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 501 776" width="501" height="776" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Persona: dispositivo, red, necesidad» … «Acción: bloquear, avisar, recortar» y «Seguimiento en campo»</title><desc id="d">Diagrama de flujo con 7 pasos. «Persona: dispositivo, red, necesidad» lleva a «Segmento de la población». «Segmento de la población» lleva a «Medida: tiempo, peso, contraste, tareas completadas». «Medida: tiempo, peso, contraste, tareas completadas» lleva a «Presupuesto: umbral con dueño». «Presupuesto: umbral con dueño» lleva a «Compuerta: absoluta, de cambio o de tendencia». «Compuerta: absoluta, de cambio o de tendencia» lleva a «Acción: bloquear, avisar, recortar» (supera). «Compuerta: absoluta, de cambio o de tendencia» lleva a «Seguimiento en campo» (cumple). «Seguimiento en campo» lleva a «Segmento de la población» (segmento excluido).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="501" height="776" fill="#ffffff"/><path d="M207.2,102 L207.2,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M207.4,221 L207.4,279" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M207.7,359 L207.7,417" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M208.1,478 L208.1,536" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M208.4,635 L208.4,643.0 Q208.4,651 200.4,651.0 L119.0,651.0 Q110,651 110.0,660.0 L110,693" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M208.4,635 L208.4,643.0 Q208.4,651 216.4,651.0 L298.0,651.0 Q307,651 307.0,660.0 L307,693" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M382,723.5 L389.0,723.5 Q396,723.5 396.0,716.5 L396.0,199.5 Q396,190.5 387.0,190.5 L282.2,190.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="119.2" y="22" width="176" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="207.2" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="207.2" dy="0">Persona:</tspan><tspan x="207.2" dy="19.2">dispositivo, red,</tspan><tspan x="207.2" dy="19.2">necesidad</tspan></text><rect x="132.2" y="160" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="207.2" y="185.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="207.2" dy="0">Segmento de la</tspan><tspan x="207.2" dy="19.2">población</tspan></text><rect x="115" y="279" width="185" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="207.5" y="304" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="207.5" dy="0">Medida: tiempo,</tspan><tspan x="207.5" dy="19.2">peso, contraste,</tspan><tspan x="207.5" dy="19.2">tareas completadas</tspan></text><rect x="123.9" y="417" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="207.9" y="442.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="207.9" dy="0">Presupuesto:</tspan><tspan x="207.9" dy="19.2">umbral con dueño</tspan></text><rect x="141.9" y="536" width="133" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="208.4" y="560.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="208.4" dy="0">Compuerta:</tspan><tspan x="208.4" dy="19.2">absoluta, de</tspan><tspan x="208.4" dy="19.2">cambio o de</tspan><tspan x="208.4" dy="19.2">tendencia</tspan></text><rect x="22" y="693" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="110" y="718.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">Acción: bloquear,</tspan><tspan x="110" dy="19.2">avisar, recortar</tspan></text><rect x="232" y="693" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="307" y="718.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="307" dy="0">Seguimiento en</tspan><tspan x="307" dy="19.2">campo</tspan></text><rect x="116" y="660" width="61" height="24" rx="4" fill="#ffffff"/><text x="146.5" y="675.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="146.5" dy="0">supera</tspan></text><rect x="313" y="660" width="61" height="24" rx="4" fill="#ffffff"/><text x="343.5" y="675.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="343.5" dy="0">cumple</tspan></text><rect x="402" y="436" width="77" height="42" rx="4" fill="#ffffff"/><text x="440.5" y="451.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="440.5" dy="0">segmento</tspan><tspan x="440.5" dy="17.92">excluido</tspan></text></svg>
