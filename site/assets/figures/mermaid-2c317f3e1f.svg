<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 882 617" width="882" height="617" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Paquete del dispositivo» … «Revisión humana»</title><desc id="d">Diagrama de flujo con 10 pasos. «Paquete del dispositivo» lleva a «Identidad y claves». «Paquete del dispositivo» lleva a «Versiones y reversión». «Paquete del dispositivo» lleva a «Comunicación y reintentos». «Paquete del dispositivo» lleva a «Umbrales y vigilancia». «Paquete del dispositivo» lleva a «Despliegue por etapas». «Paquete del dispositivo» lleva a «Responsable y revisión». «Identidad y claves» lleva a «Validador de forma». «Versiones y reversión» lleva a «Validador de forma». «Comunicación y reintentos» lleva a «Validador de forma». «Umbrales y vigilancia» lleva a «Validador de forma». «Despliegue por etapas» lleva a «Validador de forma». «Validador de forma» lleva a «Revisión humana» (sentido). «Paquete del dispositivo» lleva a «Simulación del dispositivo y de la flota».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="882" height="617" fill="#ffffff"/><path d="M146,308.5 L160.0,308.5 Q169,308.5 169.0,299.5 L169.0,53.0 Q169,44 178.0,44.0 L192,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M146,308.5 L175.2,308.5 Q184.2,308.5 184.2,299.5 L184.2,129.5 Q184.2,120.5 193.2,120.5 L222.5,120.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M146,308.5 L168.8,308.5 Q177.8,308.5 177.8,299.5 L177.8,214.5 Q177.8,205.5 186.8,205.5 L209.5,205.5" fill="none" stroke="#32505f" stroke-