<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 932 156" width="932" height="156" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Contexto» … «Señales y revisión»</title><desc id="d">Diagrama de flujo con 7 pasos. «Contexto» lleva a «Restricciones». «Contexto» lleva a «Riesgos». «Restricciones» lleva a «Opciones». «Riesgos» lleva a «Opciones». «Opciones» lleva a «Trade-offs». «Trade-offs» lleva a «Decisión». «Decisión» lleva a «Señales y revisión».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="932" height="156" fill="#ffffff"/><path d="M120,78 L134.0,78.0 Q143,78 143.0,69.0 L143.0,53.0 Q143,44 152.0,44.0 L166,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M120,78 L147.2,78.0 Q156.2,78 156.2,87.0 L156.2,103.0 Q156.2,112 165.2,112.0 L192.5,112" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M308,44 L322.0,44.0 Q331,44 331.0,53.0 L331.0,69.0 Q331,78 340.0,78.0 L354,78" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M281.5,112 L308.8,112.0 Q317.8,112 317.8,103.0 L317.8,87.0 Q317.8,78 326.8,78.0 L354,78" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M452,78 L498,78" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M613,78 L659,78" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M757,78 L803,78" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="56" width="98" height="44" rx="10" fill="#dff1ee" str