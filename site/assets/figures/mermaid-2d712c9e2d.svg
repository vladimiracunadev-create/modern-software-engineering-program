<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 405 822" width="405" height="822" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Ruta recibida» … «Abrir con modo declarado»</title><desc id="d">Diagrama de flujo con 8 pasos. «Ruta recibida» lleva a «¿Absoluta?». «¿Absoluta?» lleva a «Combinar con directorio base explícito» (No). «¿Absoluta?» lleva a «Conservar raíz o volumen» (Sí). «Combinar con directorio base explícito» lleva a «Normalizar componentes». «Conservar raíz o volumen» lleva a «Normalizar componentes». «Normalizar componentes» lleva a «Resolver enlaces según la operación». «Resolver enlaces según la operación» lleva a «Comprobar tipo y metadatos». «Comprobar tipo y metadatos» lleva a «Abrir con modo declarado».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="405" height="822" fill="#ffffff"/><path d="M200.3,66 L200.3,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M200.3,186 L200.3,194.0 Q200.3,202 192.3,202.0 L110.5,202.0 Q101.5,202 101.5,211.0 L101.5,244" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M200.3,186 L200.3,194.0 Q200.3,202 208.3,202.0 L290.0,202.0 Q299,202 299.0,211.0 L299,253.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M101.5,324 L101.5,344.0 Q101.5,353 110.5,353.0 L191.3,353.0 Q200.3,353 200.3,362.0 L200.3,382" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M299,314.5 L299.0,339.2 Q299,348.2 290.0,348.2 L209.3,348.2 Q200.3,348.2 200.3,357.2 L200.3,382" fill="none" s