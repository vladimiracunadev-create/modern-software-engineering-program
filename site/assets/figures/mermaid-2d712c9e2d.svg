ht="400" fill="#0b3f45"><tspan x="200.4" dy="0">Resolver enlaces</tspan><tspan x="200.4" dy="19.2">según la operación</tspan></text><rect x="116.5" y="620" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="200.5" y="645.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="200.5" dy="0">Comprobar tipo y</tspan><tspan x="200.5" dy="19.2">metadatos</tspan></text><rect x="125.5" y="739" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="200.5" y="764.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="200.5" dy="0">Abrir con modo</tspan><tspan x="200.5" dy="19.2">declarado</tspan></text><rect x="107.5" y="211" width="29" height="24" rx="4" fill="#ffffff"/><text x="122" y="226.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="122" dy="0">No</tspan></text><rect x="305" y="215.8" width="29" height="24" rx="4" fill="#ffffff"/><text x="319.5" y="231.7" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="319.5" dy="0">Sí</tspan></text></svg>
