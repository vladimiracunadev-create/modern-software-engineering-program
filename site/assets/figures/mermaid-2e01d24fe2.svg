<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 224" width="920" height="224" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Valor del dominio» … «Validación»</title><desc id="d">Diagrama de flujo con 7 pasos. «Valor del dominio» lleva a «Modelo». «Modelo» lleva a «Entero escalado». «Modelo» lleva a «Binario flotante». «Modelo» lleva a «Decimal». «Entero escalado» lleva a «Operaciones y límites». «Binario flotante» lleva a «Operaciones y límites». «Decimal» lleva a «Operaciones y límites». «Operaciones y límites» lleva a «Validación».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="920" height="224" fill="#ffffff"/><path d="M198,112 L244,112" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M335,112 L351.2,112.0 Q360.2,112 360.2,103.0 L360.2,53.0 Q360.2,44 369.2,44.0 L385.5,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M335,112 L381,112" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M289.5,143 L289.5,171.0 Q289.5,180 298.5,180.0 L420.5,180" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M544.5,44 L560.8,44.0 Q569.8,44 569.8,53.0 L569.8,103.0 Q569.8,112 578.8,112.0 L595,112" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M549,112 L595,112" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M509.5,180 L657.0,180.0 Q666,180 666.0,171.0 L666,142.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M73