<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 622 262" width="622" height="262" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «el analizador local de eventos solicita lectura» … «el analizador local de eventos recibe los datos»</title><desc id="d">Diagrama de flujo con 6 pasos. «el analizador local de eventos solicita lectura» lleva a «Sistema operativo valida y programa I/O». «Sistema operativo valida y programa I/O» lleva a «Dispositivo inicia la operación». «Dispositivo inicia la operación» lleva a «Interrupción o señal de completado». «Interrupción o señal de completado» lleva a «Kernel despierta el hilo bloqueado». «Kernel despierta el hilo bloqueado» lleva a «el analizador local de eventos recibe los datos».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="622" height="262" fill="#ffffff"/><path d="M190,62 L236,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M404,62 L463,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M525,102 L525,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M450,200 L404,200" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M236,200 L190,200" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="22" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">el analizador</tspan><tspan x="106" dy="19.2">local de eventos</tspan><tspan x="106" dy="19.2">solicita lectura</tspan></text><rect x="236" y="22" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="320" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="320" dy="0">Sistema</tspan><tspan x="320" dy="19.2">operativo valida</tspan><tspan x="320" dy="19.2">y programa I/O</tspan></text><rect x="463" y="22" width="124" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="525" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="525" dy="0">Dispositivo</tspan><tspan x="525" dy="19.2">inicia la</tspan><tspan x="525" dy="19.2">operación</tspan></text><rect x="450" y="160" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="525" y="185" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="525" dy="0">Interrupción o</tspan><tspan x="525" dy="19.2">señal de</tspan><tspan x="525" dy="19.2">completado</tspan></text><rect x="236" y="160" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="320" y="185" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="320" dy="0">Kernel despierta</tspan><tspan x="320" dy="19.2">el hilo</tspan><tspan x="320" dy="19.2">bloqueado</tspan></text><rect x="22" y="160" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="185" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">el analizador</tspan><tspan x="106" dy="19.2">local de eventos</tspan><tspan x="106" dy="19.2">recibe los datos</tspan></text></svg>
