<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 919 292" width="919" height="292" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Cliente móvil» y «Cliente web» … «Malla: proxies y políticas»</title><desc id="d">Diagrama de flujo con 10 pasos. «Cliente móvil» lleva a «BFF móvil». «Cliente web» lleva a «BFF web». «BFF móvil» lleva a «API gateway». «BFF web» lleva a «API gateway». «API gateway» lleva a «Perfil». «API gateway» lleva a «Cursos». «API gateway» lleva a «Entregas». «API gateway» lleva a «Notificaciones». «Perfil» lleva a «Malla: proxies y políticas». «Cursos» lleva a «Malla: proxies y políticas». «Entregas» lleva a «Malla: proxies y políticas». «Notificaciones» lleva a «Malla: proxies y políticas».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="919" height="292" fill="#ffffff"/><path d="M164,112 L210,112" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M155,180 L219,180" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M317,112 L331.0,112.0 Q340,112 340.0,121.0 L340.0,137.0 Q340,146 349.0,146.0 L363,146" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M308,180 L326.5,180.0 Q335.5,180 335.5,171.0 L335.5,155.0 Q335.5,146 344.5,146.0 L363,146" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M487,146 L518.2,146.0 Q527.2,146 527.2,137.0 L527.2,53.0 Q527.2,44 536.2,44.0 L567.5,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M487,146 L518.2,146.0 Q527.2,146 527.2,137.