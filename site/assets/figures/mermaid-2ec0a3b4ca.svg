<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 812 497" width="812" height="497" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Incertidumbre del plan» … «Respuesta o contingencia»</title><desc id="d">Diagrama de flujo con 7 pasos. «Incertidumbre del plan» lleva a «Qué es». «Qué es» lleva a «Riesgo: probabilidad, impacto, disparador» (puede ocurrir). «Qué es» lleva a «Supuesto: validar antes de construir» (se da por cierto). «Qué es» lleva a «Issue: dueño y fecha» (ya ocurrió). «Qué es» lleva a «Decisión: contexto, opciones, revisión» (se eligió). «Riesgo: probabilidad, impacto, disparador» lleva a «Respuesta o contingencia». «Supuesto: validar antes de construir» lleva a «Respuesta o contingencia». «Issue: dueño y fecha» lleva a «Respuesta o contingencia». «Decisión: contexto, opciones, revisión» lleva a «Incertidumbre del plan» (disparador).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="812" height="497" fill="#ffffff"/><path d="M164,248.5 L210,248.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M301,248.5 L309.0,248.5 Q317,248.5 317.0,240.5 L317.0,80.5 Q317,71.5 326.0,71.5 L456,71.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M301,248.5 L309.0,248.5 Q317,248.5 317.0,240.5 L317.0,208.0 Q317,199 326.0,199.0 L443,199" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M301,248.5 L309.0,248.5 Q317,248.5 317.0,256.5 L317.0,298.5 Q317,307.5 326.0,307.5 L452,307.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/>