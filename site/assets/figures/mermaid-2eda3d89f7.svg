<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 872 326" width="872" height="326" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Lenguaje del negocio» … «Capa anticorrupcion», «Objetos de valor», «Eventos de dominio» y «Control de concurrencia»</title><desc id="d">Diagrama de flujo con 8 pasos. «Lenguaje del negocio» lleva a «Contextos delimitados». «Contextos delimitados» lleva a «Mapa de contextos y contratos». «Contextos delimitados» lleva a «Agregados con invariantes». «Agregados con invariantes» lleva a «Objetos de valor». «Agregados con invariantes» lleva a «Eventos de dominio». «Mapa de contextos y contratos» lleva a «Capa anticorrupcion» (traduccion). «Agregados con invariantes» lleva a «Control de concurrencia» (version).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="872" height="326" fill="#ffffff"/><path d="M155,163 L201,163" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M325,163 L339.0,163.0 Q348,163 348.0,154.0 L348.0,129.5 Q348,120.5 357.0,120.5 L371,120.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M325,163 L347.5,163.0 Q356.5,163 356.5,172.0 L356.5,196.5 Q356.5,205.5 365.5,205.5 L388,205.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M530,205.5 L592.8,205.5 Q601.8,205.5 601.8,196.5 L601.8,138.0 Q601.8,129 610.8,129.0 L673.5,129" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M530,201.2 L665,201.2" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d=