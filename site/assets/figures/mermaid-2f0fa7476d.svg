<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 596 224" width="596" height="224" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Estrategia voraz» … «Reconstrucción de la solución»</title><desc id="d">Diagrama de flujo con 5 pasos. «Estrategia voraz» lleva a «Contraejemplo mínimo». «Contraejemplo mínimo» lleva a «Subproblemas superpuestos». «Subproblemas superpuestos» lleva a «Memoización / tabulación». «Memoización / tabulación» lleva a «Reconstrucción de la solución». «Reconstrucción de la solución» lleva a «Estrategia voraz» (fallo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="596" height="224" fill="#ffffff"/><path d="M190,52.5 L240,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M382,52.5 L436.5,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M503,83 L503,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M432,171.5 L386,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M236,171.5 L115.0,171.5 Q106,171.5 106.0,162.5 L106,74.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="30.5" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Estrategia voraz</tspan></text><rect x="240" y="22" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="311" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="311" dy="0">Contraejemplo</tspan><tspan x="311" dy="19.2">mínimo</tspan></text><rect x="436.5" y="22" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="503" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="503" dy="0">Subproblemas</tspan><tspan x="503" dy="19.2">superpuestos</tspan></text><rect x="432" y="141" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="503" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="503" dy="0">Memoización /</tspan><tspan x="503" dy="19.2">tabulación</tspan></text><rect x="236" y="141" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="311" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="311" dy="0">Reconstrucción</tspan><tspan x="311" dy="19.2">de la solución</tspan></text><rect x="95" y="143.5" width="126" height="24" rx="4" fill="#ffffff"/><text x="158" y="159.4" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="158" dy="0">fallo o cambio</tspan></text></svg>
