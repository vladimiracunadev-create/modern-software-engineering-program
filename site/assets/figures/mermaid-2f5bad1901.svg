<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 659 400" width="659" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Recurso con identidad» … «Seguro y cacheable», «Idempotente», «No idempotente por defecto», «412 si cambió» y «Paginación por clave»</title><desc id="d">Diagrama de flujo con 9 pasos. «Recurso con identidad» lleva a «Método». «Método» lleva a «Seguro y cacheable» (GET HEAD). «Método» lleva a «Idempotente» (PUT DELETE). «Método» lleva a «No idempotente por defecto» (POST PATCH). «Recurso con identidad» lleva a «ETag: versión». «ETag: versión» lleva a «412 si cambió» (If-Match). «Recurso con identidad» lleva a «Colección». «Colección» lleva a «Paginación por clave».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="659" height="400" fill="#ffffff"/><path d="M146,203 L172.8,203.0 Q181.8,203 181.8,194.0 L181.8,144.0 Q181.8,135 190.8,135.0 L217.5,135" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M308.5,135 L316.5,135.0 Q324.5,135 324.5,127.0 L324.5,59.0 Q324.5,50 333.5,50.0 L452,50" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M308.5,135 L316.5,135.0 Q324.5,135 324.5,127.0 L324.5,126.5 Q324.5,118 333.0,118.0 L482.5,118" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M263,166 L263.0,173.0 Q263,180 270.0,180.0 L430.8,180.0 Q438,180 438.0,187.2 L438.0,187.5 Q438,194.5 445.0,194.5 L452,194.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M146,203 L164.5,203.0 Q169,203 169.0,207.5 L16