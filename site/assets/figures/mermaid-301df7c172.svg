<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 535 589" width="535" height="589" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Requisitos y riesgo» … «Valor solo si termina» y «Valor aunque se corte»</title><desc id="d">Diagrama de flujo con 8 pasos. «Requisitos y riesgo» lleva a «Volatilidad y coste de cambiar». «Volatilidad y coste de cambiar» lleva a «Plan predictivo» (baja). «Volatilidad y coste de cambiar» lleva a «Ciclos iterativos» (alta). «Ciclos iterativos» lleva a «Incrementos liberables». «Plan predictivo» lleva a «Entrega única». «Incrementos liberables» lleva a «Valor aunque se corte». «Entrega única» lleva a «Valor solo si termina». «Valor aunque se corte» lleva a «Requisitos y riesgo» (aprendizaje).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="535" height="589" fill="#ffffff"/><path d="M202.3,83 L202.3,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M202.3,227 L202.3,235.0 Q202.3,243 194.3,243.0 L110.5,243.0 Q101.5,243 101.5,252.0 L101.5,285" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M202.3,227 L202.3,235.0 Q202.3,243 210.3,243.0 L294.0,243.0 Q303,243 303.0,252.0 L303,285" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M302.9,329 L302.9,387" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M101.7,329 L101.7,395.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M302.6,448 L302.6,506" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M101.9,439.5 L101.9,506" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M382,536.5 L396.0,536.5 Q405,536.5 405.0,527.5 L405.0,61.5 Q405,52.5 396.0,52.5 L268.8,52.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="135.8" y="22" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="202.3" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="202.3" dy="0">Requisitos y</tspan><tspan x="202.3" dy="19.2">riesgo</tspan></text><polygon points="202.3,141 337.8,184 202.3,227 66.8,184" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="202.3" y="178.6" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="202.3" dy="0">Volatilidad y</tspan><tspan x="202.3" dy="19.2">coste de cambiar</tspan></text><rect x="22" y="285" width="159" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101.5" y="311.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101.5" dy="0">Plan predictivo</tspan></text><rect x="215" y="285" width="176" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="303" y="311.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="303" dy="0">Ciclos iterativos</tspan></text><rect x="240.7" y="387" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="302.7" y="412.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="302.7" dy="0">Incrementos</tspan><tspan x="302.7" dy="19.2">liberables</tspan></text><rect x="30.8" y="395.5" width="142" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101.8" y="421.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101.8" dy="0">Entrega única</tspan></text><rect x="223" y="506" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="302.5" y="531.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="302.5" dy="0">Valor aunque se</tspan><tspan x="302.5" dy="19.2">corte</tspan></text><rect x="31" y="506" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="102" y="531.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="102" dy="0">Valor solo si</tspan><tspan x="102" dy="19.2">termina</tspan></text><rect x="107.5" y="252" width="45" height="24" rx="4" fill="#ffffff"/><text x="130" y="267.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="130" dy="0">baja</tspan></text><rect x="309" y="252" width="45" height="24" rx="4" fill="#ffffff"/><text x="331.5" y="267.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="331.5" dy="0">alta</tspan></text><rect x="411" y="282.5" width="102" height="24" rx="4" fill="#ffffff"/><text x="462" y="298.4" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="462" dy="0">aprendizaje</tspan></text></svg>
