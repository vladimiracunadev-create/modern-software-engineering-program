<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 437 1002" width="437" height="1002" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Trabajo realizado» … «Plan de aprendizaje»</title><desc id="d">Diagrama de flujo con 9 pasos. «Trabajo realizado» lleva a «Entrada con evidencia reproducible». «Entrada con evidencia reproducible» lleva a «Comprobación por otra persona». «Comprobación por otra persona» lleva a «Autoevaluación contra niveles». «Autoevaluación contra niveles» lleva a «Conversación estructurada». «Conversación estructurada» lleva a «Pregunta más profunda». «Pregunta más profunda» lleva a «Responder con evidencia» (sé la respuesta). «Pregunta más profunda» lleva a «Declarar el límite y proponer cómo comprobarlo» (no la sé). «Responder con evidencia» lleva a «Conversación estructurada». «Declarar el límite y proponer cómo comprobarlo» lleva a «Plan de aprendizaje». «Plan de aprendizaje» lleva a «Trabajo realizado».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="437" height="1002" fill="#ffffff"/><path d="M133.1,66 L133.1,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M136.3,204 L136.3,262" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M139.6,323 L139.6,346.6 Q139.6,352 144.9,352.0 L144.9,352.0 Q150.3,352 150.3,357.4 L150.3,381" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M150.3,442 L150.3,462.8 Q150.3,471 158.6,471.0 L158.6,471.0 Q166.8,471 166.8,479.2 L166.8,500" fill="none" stroke="#32505f" stroke-width="1.8" marker-end=