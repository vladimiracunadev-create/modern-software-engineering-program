<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 362" width="800" height="362" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Anatomía del harness» … «Proyecto: harness gobernado»</title><desc id="d">Diagrama de flujo con 12 pasos. «Anatomía del harness» lleva a «Instrucciones y comprobador». «Instrucciones y comprobador» lleva a «Herramientas y permisos». «Herramientas y permisos» lleva a «Contexto y relevo». «Contexto y relevo» lleva a «Bucles y parada». «Bucles y parada» lleva a «Sandbox y daño». «Sandbox y daño» lleva a «Verificación y menú». «Verificación y menú» lleva a «Multiagente». «Multiagente» lleva a «Trazas y evals». «Trazas y evals» lleva a «Gobierno». «Gobierno» lleva a «Taller: diagnóstico». «Taller: diagnóstico» lleva a «Proyecto: harness gobernado». «Proyecto: harness gobernado» lleva a «Anatomía del harness» (fallos nuevos).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="800" height="362" fill="#ffffff"/><path d="M163.5,52.5 L218,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M377,52.5 L423,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M573,52.5 L641,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M698.5,83 L698.5,149.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M619,171.5 L573,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M423,171.5 L372.5,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arro