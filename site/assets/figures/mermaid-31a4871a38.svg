<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 757 343" width="757" height="343" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Volatilidad y riesgo» … «Plan adaptativo»</title><desc id="d">Diagrama de flujo con 11 pasos. «Volatilidad y riesgo» lleva a «Modelo y principios». «Modelo y principios» lleva a «Políticas de los marcos». «Políticas de los marcos» lleva a «Flujo y colas». «Flujo y colas» lleva a «Estimación con rango». «Estimación con rango» lleva a «Dependencias y entrega». «Dependencias y entrega» lleva a «Riesgos y decisiones». «Riesgos y decisiones» lleva a «Puertas de calidad». «Puertas de calidad» lleva a «Métricas con contrapesos». «Métricas con contrapesos» lleva a «Mejora del sistema». «Mejora del sistema» lleva a «Plan adaptativo». «Plan adaptativo» lleva a «Volatilidad y riesgo» (evidencia nueva).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="757" height="343" fill="#ffffff"/><path d="M164,52.5 L210,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M325,52.5 L371,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M539,52.5 L589,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M660,74.5 L660,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M585,171.5 L530,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M380,171.5 L325,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M210,171.5 L150.5,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M93,202 L93,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M159.5,290.5 L210,290.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M325,290.5 L375.5,290.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M455,268.5 L455.0,225.0 Q455,216 446.0,216.0 L173.5,216.0 Q164.5,216 164.5,207.0 L164.5,106.0 Q164.5,97 155.5,97.0 L100.0,97.0 Q93,97 93.0,90.0 L93,83" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="22" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="93" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="93" dy="0">Volatilidad y</tspan><tspan x="93" dy="19.2">riesgo</tspan></text><rect x="210" y="22" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="267.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="267.5" dy="0">Modelo y</tspan><tspan x="267.5" dy="19.2">principios</tspan></text><rect x="371" y="22" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="455" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="455" dy="0">Políticas de los</tspan><tspan x="455" dy="19.2">marcos</tspan></text><rect x="589" y="30.5" width="142" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="660" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="660" dy="0">Flujo y colas</tspan></text><rect x="585" y="141" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="660" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="660" dy="0">Estimación con</tspan><tspan x="660" dy="19.2">rango</tspan></text><rect x="380" y="141" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="455" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="455" dy="0">Dependencias y</tspan><tspan x="455" dy="19.2">entrega</tspan></text><rect x="210" y="141" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="267.5" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="267.5" dy="0">Riesgos y</tspan><tspan x="267.5" dy="19.2">decisiones</tspan></text><rect x="35.5" y="141" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="93" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="93" dy="0">Puertas de</tspan><tspan x="93" dy="19.2">calidad</tspan></text><rect x="26.5" y="260" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="93" y="285.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="93" dy="0">Métricas con</tspan><tspan x="93" dy="19.2">contrapesos</tspan></text><rect x="210" y="260" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="267.5" y="285.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="267.5" dy="0">Mejora del</tspan><tspan x="267.5" dy="19.2">sistema</tspan></text><rect x="375.5" y="268.5" width="159" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="455" y="294.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="455" dy="0">Plan adaptativo</tspan></text><rect x="353.9" y="220" width="86" height="42" rx="4" fill="#ffffff"/><text x="396.9" y="235.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="396.9" dy="0">evidencia</tspan><tspan x="396.9" dy="17.92">nueva<