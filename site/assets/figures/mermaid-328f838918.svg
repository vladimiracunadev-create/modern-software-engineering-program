<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 190" width="830" height="190" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Elicitación» … «Línea base»</title><desc id="d">Diagrama de flujo con 5 pasos. «Elicitación» lleva a «Análisis». «Análisis» lleva a «Especificación». «Especificación» lleva a «Validación». «Validación» lleva a «Línea base». «Validación» lleva a «Elicitación» (defecto o ausencia). «Análisis» lleva a «Elicitación» (conflicto).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="830" height="190" fill="#ffffff"/><path d="M146,104 L192,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M290,104 L336,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M486,104 L532,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M647,104 L693,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M589.5,82 L589.5,75.0 Q589.5,68 582.5,68.0 L91.0,68.0 Q84,68 84.0,75.0 L84,82" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><path d="M241,126 L241.0,133.0 Q241,140 234.0,140.0 L91.0,140.0 Q84,140 84.0,133.0 L84,126" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="82" width="124" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="84" y="108.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="84" dy="0">Elicitación</tspan></t