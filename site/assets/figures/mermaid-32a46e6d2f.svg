<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 398 789" width="398" height="789" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Descubrir URL» … «Persona»</title><desc id="d">Diagrama de flujo con 9 pasos. «Descubrir URL» lleva a «robots.txt». «robots.txt» lleva a «Rastrear» (permitido). «robots.txt» lleva a «No se lee la página» (bloqueado). «Rastrear» lleva a «noindex o canónica». «noindex o canónica» lleva a «Indexar» (indexable). «noindex o canónica» lleva a «No se muestra» (excluida o duplicada). «Indexar» lleva a «Mostrar». «Mostrar» lleva a «Persona» (título y descripción).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="398" height="789" fill="#ffffff"/><path d="M217.7,66 L217.7,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M217.7,186 L217.7,194.0 Q217.7,202 209.7,202.0 L142.8,202.0 Q133.8,202 133.8,211.0 L133.8,252.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M217.7,186 L217.7,194.0 Q217.7,202 225.7,202.0 L274.3,202.0 Q283.3,202 283.3,211.0 L283.3,244" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M133.8,296.5 L133.8,325.2 Q133.8,329.8 138.4,329.8 L138.4,329.8 Q143,329.8 143.0,334.4 L143,363" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M143,425 L143.0,433.0 Q143,441 135.0,441.0 L78.7,441.0 Q69.7,441 69.7,450.0 L69.7,501" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M143,425 L143.0,433.0 Q143,441 151.0,441.0 L210.2,441.0 Q219.2,441 219.2,450.0