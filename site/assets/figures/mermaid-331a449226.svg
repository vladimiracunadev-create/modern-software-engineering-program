<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 622 262" width="622" height="262" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Procedimiento / contrato» … «Composición / nivel de abstracción»</title><desc id="d">Diagrama de flujo con 5 pasos. «Procedimiento / contrato» lleva a «Descomposición por responsabilidad». «Descomposición por responsabilidad» lleva a «Flujo de datos / dependencias». «Flujo de datos / dependencias» lleva a «Efectos en los bordes». «Efectos en los bordes» lleva a «Composición / nivel de abstracción». «Composición / nivel de abstracción» lleva a «Procedimiento / contrato» (fallo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="622" height="262" fill="#ffffff"/><path d="M181,62 L227,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M386,62 L432,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M516,92.5 L516,169.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M441,200 L377.5,200" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M235.5,200 L110.5,200.0 Q101.5,200 101.5,191.0 L101.5,92.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="31.5" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101.5" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101.5" dy="0">Procedimiento /</tspan><tspan x="101.5" dy="19.2">contrato</tspan></text><rect x="227" y="22" width="159" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="306.5" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="306.5" dy="0">Descomposición</tspan><tspan x="306.5" dy="19.2">por</tspan><tspan x="306.5" dy="19.2">responsabilidad</tspan></text><rect x="432" y="31.5" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="516" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="516" dy="0">Flujo de datos /</tspan><tspan x="516" dy="19.2">dependencias</tspan></text><rect x="441" y="169.5" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="516" y="194.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="516" dy="0">Efectos en los</tspan><tspan x="516" dy="19.2">bordes</tspan></text><rect x="235.5" y="160" width="142" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="306.5" y="185" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="306.5" dy="0">Composición /</tspan><tspan x="306.5" dy="19.2">nivel de</tspan><tspan x="306.5" dy="19.2">abstracción</tspan></text><rect x="105.5" y="172" width="126" height="24" rx="4" fill="#ffffff"/><text x="168.5" y="187.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="168.5" dy="0">fallo o cambio</tspan></text></svg>
