<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 815 166" width="815" height="166" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Compilación / front-end» … «Análisis estático / límites»</title><desc id="d">Diagrama de flujo con 5 pasos. «Compilación / front-end» lleva a «Formatter». «Formatter» lleva a «Linter». «Linter» lleva a «Tipos / flujo». «Tipos / flujo» lleva a «Análisis estático / límites». «Análisis estático / límites» lleva a «Compilación / front-end» (fallo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="815" height="166" fill="#ffffff"/><path d="M164,104 L210,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M317,104 L363,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M444,104 L490,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M632,104 L678,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M735.5,64 L735.5,57.0 Q735.5,50 728.5,50.0 L102.0,50.0 Q93,50 93.0,59.0 L93,73.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="73.5" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="93" y="98.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="93" dy="0">Compilación /</tspan><tspan x="93" dy="19.2">front-end</tspan></text><rect x="210" y="82" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="263.5" y="108.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="263.5" dy="0">Formatter</tspan></text><rect x="363" y="82" width="81" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="403.5" y="108.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="403.5" dy="0">Linter</tspan></text><rect x="490" y="82" width="142" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="561" y="108.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="561" dy="0">Tipos / flujo</tspan></text><rect x="678" y="64" width="115" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="735.5" y="89" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="735.5" dy="0">Análisis</tspan><tspan x="735.5" dy="19.2">estático /</tspan><tspan x="735.5" dy="19.2">límites</tspan></text><rect x="351.2" y="22" width="126" height="24" rx="4" fill="#ffffff"/><text x="414.2" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="414.2" dy="0">fallo o cambio</tspan></text></svg>
