<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 418 734" width="418" height="734" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Comando» … «Usuario»</title><desc id="d">Diagrama de flujo con 8 pasos. «Comando» lleva a «Agregado». «Agregado» lleva a «Evento con id y secuencia». «Evento con id y secuencia» lleva a «Bus o registro de eventos». «Bus o registro de eventos» lleva a «Proyector». «Proyector» lleva a «Modelo de lectura». «Bus o registro de eventos» lleva a «Otro contexto». «Modelo de lectura» lleva a «Usuario» (lectura propia). «Bus o registro de eventos» lleva a «Agregado» (reproducir).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="418" height="734" fill="#ffffff"/><path d="M212,66 L212,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M212,168 L212.0,191.9 Q212,197 206.9,197.0 L206.9,197.0 Q201.9,197 201.9,202.1 L201.9,226" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M201.9,287 L201.9,308.1 Q201.9,316 193.9,316.0 L193.9,316.0 Q186,316 186.0,323.9 L186,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M186,406 L186.0,426.0 Q186,435 177.0,435.0 L104.3,435.0 Q95.3,435 95.3,444.0 L95.3,464" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M95.3,508 L95.3,529.6 Q95.3,537 102.7,537.0 L102.7,537.0 Q110,537 110.0,544.4 L110,566" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M186,406 L186.0,426.0 Q186,435 195.0,435.0 L244.8,435.0 Q253.8,435 253.8,444.0 L253.8