<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 630 224" width="630" height="224" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Consentimiento y finalidad» … «Daño, retiro y revisión»</title><desc id="d">Diagrama de flujo con 5 pasos. «Consentimiento y finalidad» lleva a «Minimización y retención». «Minimización y retención» lleva a «Identificabilidad». «Identificabilidad» lleva a «Seudonimización». «Seudonimización» lleva a «Daño, retiro y revisión». «Daño, retiro y revisión» lleva a «Consentimiento y finalidad» (fallo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="630" height="224" fill="#ffffff"/><path d="M190,52.5 L236,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M386,52.5 L432,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M520,74.5 L520,149.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M440.5,171.5 L386,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M236,171.5 L115.0,171.5 Q106,171.5 106.0,162.5 L106,83" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="22" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Consentimiento y</tspan><tspan x="106" dy="19.2">finalidad</tspan></text><rect x="236" y="22" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="311" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="311" dy="0">Minimización y</tspan><tspan x="311" dy="19.2">retención</tspan></text><rect x="432" y="30.5" width="176" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="520" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="520" dy="0">Identificabilidad</tspan></text><rect x="440.5" y="149.5" width="159" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="520" y="175.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="520" dy="0">Seudonimización</tspan></text><rect x="236" y="141" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="311" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="311" dy="0">Daño, retiro y</tspan><tspan x="311" dy="19.2">revisión</tspan></text><rect x="95" y="143.5" width="126" height="24" rx="4" fill="#ffffff"/><text x="158" y="159.4" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="158" dy="0">fallo o cambio</tspan></text></svg>
