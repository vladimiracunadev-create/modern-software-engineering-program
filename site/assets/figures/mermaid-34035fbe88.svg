<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 832 283" width="832" height="283" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Intención en prosa» … «Comprobación ejecutable»</title><desc id="d">Diagrama de flujo con 6 pasos. «Intención en prosa» lleva a «Lecturas posibles». «Lecturas posibles» lleva a «Ejemplos que las separan». «Lecturas posibles» lleva a «Tabla o plantilla semiformal». «Tabla o plantilla semiformal» lleva a «Predicado formal». «Ejemplos que las separan» lleva a «Comprobación ejecutable». «Predicado formal» lleva a «Comprobación ejecutable». «Comprobación ejecutable» lleva a «Intención en prosa» (defecto o lectura nueva).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="832" height="283" fill="#ffffff"/><path d="M155,111.5 L201,111.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M299,111.5 L313.0,111.5 Q322,111.5 322.0,102.5 L322.0,61.5 Q322,52.5 331.0,52.5 L345,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M299,111.5 L317.5,111.5 Q326.5,111.5 326.5,120.5 L326.5,152.0 Q326.5,161 335.5,161.0 L354,161" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M469,161 L524,161" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M478,52.5 L734.5,52.5 Q743.5,52.5 743.5,61.5 L743.5,130.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M631,161 L677,161" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M743.5,191.5 L743.5,206.0 Q743.5,215 734.5,215.0 L97.5,215.0 Q88.5,215 88.5,206.0 L88.5,142" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="81" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="88.5" y="106.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="88.5" dy="0">Intención en</tspan><tspan x="88.5" dy="19.2">prosa</tspan></text><rect x="201" y="81" width="98" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="250" y="106.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="250" dy="0">Lecturas</tspan><tspan x="250" dy="19.2">posibles</tspan></text><rect x="345" y="22" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="411.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="411.5" dy="0">Ejemplos que</tspan><tspan x="411.5" dy="19.2">las separan</tspan></text><rect x="354" y="121" width="115" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="411.5" y="146" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="411.5" dy="0">Tabla o</tspan><tspan x="411.5" dy="19.2">plantilla</tspan><tspan x="411.5" dy="19.2">semiformal</tspan></text><rect x="524" y="130.5" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="577.5" y="155.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="577.5" dy="0">Predicado</tspan><tspan x="577.5" dy="19.2">formal</tspan></text><rect x="677" y="130.5" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="743.5" y="155.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="743.5" dy="0">Comprobación</tspan><tspan x="743.5" dy="19.2">ejecutable</tspan></text><rect x="357" y="219" width="118" heig