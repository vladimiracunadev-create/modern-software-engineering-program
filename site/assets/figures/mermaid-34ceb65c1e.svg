<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 558 858" width="558" height="858" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Listado con ttlMs» … «Servidor: ejecuta el cuerpo»</title><desc id="d">Diagrama de flujo con 10 pasos. «Agente cliente» lleva a «Pieza que consume». «Pieza que consume» lleva a «Herramientas» (controlada por el modelo). «Pieza que consume» lleva a «Recursos» (dirigida por la aplicación). «Pieza que consume» lleva a «Plantillas de petición» (controlada por la persona). «Herramientas» lleva a «Pasarela: autoriza por cabecera». «Pasarela: autoriza por cabecera» lleva a «Servidor: ejecuta el cuerpo». «Pasarela: autoriza por cabecera» lleva a «Servidor: ejecuta el cuerpo» (debe coincidir con). «Descripción de la herramienta» lleva a «Agente cliente» (texto no confiable en el contexto). «Listado con ttlMs» lleva a «Caché del cliente». «Caché del cliente» lleva a «Agente cliente» (dato viejo).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="558" height="858" fill="#ffffff"/><path d="M310.4,323 L310.4,343.0 Q310.4,352 301.4,352.0 L266.5,352.0 Q257.5,352 257.5,361.0 L257.5,381" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M257.5,443 L257.5,451.0 Q257.5,459 249.5,459.0 L97.5,459.0 Q88.5,459 88.5,468.0 L88.5,527.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M257.5,443 L257.5,451.0 Q257.5,459 249.5,459.0 L247.0,459.0 Q238,459 238.0,468.0 L238,527.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M257.5,443 L257.5,451.0