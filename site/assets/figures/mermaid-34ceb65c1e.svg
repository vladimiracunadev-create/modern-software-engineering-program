nt-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="157.5" dy="0">controlada por</tspan><tspan x="157.5" dy="17.92">el modelo</tspan></text><rect x="244" y="472.2" width="118" height="42" rx="4" fill="#ffffff"/><text x="303" y="488.1" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="303" dy="0">dirigida por</tspan><tspan x="303" dy="17.92">la aplicación</tspan></text><rect x="398" y="468" width="126" height="42" rx="4" fill="#ffffff"/><text x="461" y="483.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="461" dy="0">controlada por</tspan><tspan x="461" dy="17.92">la persona</tspan></text><rect x="143.8" y="724" width="126" height="42" rx="4" fill="#ffffff"/><text x="206.8" y="739.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="206.8" dy="0">debe coincidir</tspan><tspan x="206.8" dy="17.92">con</tspan></text><rect x="316.4" y="210" width="110" height="60" rx="4" fill="#ffffff"/><text x="371.4" y="225.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="371.4" dy="0">texto no</tspan><tspan x="371.4" dy="17.92">confiable en</tspan><tspan x="371.4" dy="17.92">el contexto</tspan></text><rect x="210.4" y="223.8" width="94" height="24" rx="4" fill="#ffffff"/><text x="257.4" y="239.7" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="257.4" dy="0">dato viejo</tspan></text></svg>
