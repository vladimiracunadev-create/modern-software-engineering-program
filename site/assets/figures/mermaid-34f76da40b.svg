<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516 738" width="516" height="738" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Valor o comportamiento sin explicación» … «Prevención: dueños y metadatos»</title><desc id="d">Diagrama de flujo con 7 pasos. «Valor o comportamiento sin explicación» lleva a «Historial: cuándo, quién, qué». «Historial: cuándo, quién, qué» lleva a «Otras fuentes: incidencias, correos, personas». «Otras fuentes: incidencias, correos, personas» lleva a «Afirmaciones clasificadas». «Afirmaciones clasificadas» lleva a «ADR retrospectivo». «Afirmaciones clasificadas» lleva a «Hipótesis a confirmar». «ADR retrospectivo» lleva a «Prevención: dueños y metadatos». «Hipótesis a confirmar» lleva a «Afirmaciones clasificadas» (se confirma o se descarta).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="516" height="738" fill="#ffffff"/><path d="M251.4,102 L251.4,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M251.4,221 L251.4,243.4 Q251.4,250 244.9,250.0 L244.9,250.0 Q238.3,250 238.3,256.6 L238.3,279" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M238.3,359 L238.3,379.0 Q238.3,388 229.3,388.0 L226.3,388.0 Q217.3,388 217.3,397.0 L217.3,417" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M217.3,478 L217.3,502.2 Q217.3,511.2 208.3,511.2 L119.0,511.2 Q110,511.2 110.0,520.2 L110,544.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M217.3,478 L217.3,498.0 Q217.3,507 226.3,507.0 L285.0,507.0 Q294,507 294.0,516.0 L294,536" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M112.7,588.5 L112.7,655" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M356,566.5 L363.0,566.5 Q370,566.5 370.0,559.5 L370.0,456.5 Q370,447.5 361.0,447.5 L283.8,447.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="158.9" y="22" width="185" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="251.4" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="251.4" dy="0">Valor o</tspan><tspan x="251.4" dy="19.2">comportamiento sin</tspan><tspan x="251.4" dy="19.2">explicación</tspan></text><rect x="158.9" y="160" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="251.4" y="185.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="251.4" dy="0">Historial: cuándo,</tspan><tspan x="251.4" dy="19.2">quién, qué</tspan></text><rect x="150.3" y="279" width="176" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="238.3" y="304" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="238.3" dy="0">Otras fuentes:</tspan><tspan x="238.3" dy="19.2">incidencias,</tspan><tspan x="238.3" dy="19.2">correos, personas</tspan></text><rect x="150.8" y="417" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="217.3" y="442.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="217.3" dy="0">Afirmaciones</tspan><tspan x="217.3" dy="19.2">clasificadas</tspan></text><rect x="22" y="544.5" width="176" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="110" y="570.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">ADR retrospectivo</tspan></text><rect x="232" y="536" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="294" y="561.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="294" dy="0">Hipótesis a</tspan><tspan x="294" dy="19.2">confirmar</tspan></text><rect x="22.9" y="655" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="115.4" y="680.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="115.4" dy="0">Prevención: dueños</tspan><tspan x="115.4" dy="19.2">y metadatos</tspan></text><rect x="376" y="486" width="118" height="42" rx="4" fill="#ffffff"/><text x="435" y="501.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="435" dy="0">se confirma o</tspan><tspan x="435" dy="17.92">se descarta</tspan></text></svg>
