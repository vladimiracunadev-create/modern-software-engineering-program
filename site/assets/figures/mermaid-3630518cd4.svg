<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 662" width="720" height="662" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Síntoma: miedo a tocar» … «Amortizar con un cambio medido» y «Aceptar con condición de revisión»</title><desc id="d">Diagrama de flujo con 10 pasos. «Síntoma: miedo a tocar» lleva a «¿Qué señal lo respalda?». «¿Qué señal lo respalda?» lleva a «Cohesión y dependencias» (clase enorme). «¿Qué señal lo respalda?» lleva a «Ciclos» (módulos que se importan en círculo). «¿Qué señal lo respalda?» lleva a «Interés de la deuda» (cambios cada vez más caros). «Cohesión y dependencias» lleva a «Separar por razón de cambio». «Ciclos» lleva a «Extraer lo común». «Interés de la deuda» lleva a «¿Compensa pagar?». «¿Compensa pagar?» lleva a «Amortizar con un cambio medido» (sí). «¿Compensa pagar?» lleva a «Aceptar con condición de revisión» (no).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="720" height="662" fill="#ffffff"/><path d="M305,83 L305,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M305,227 L305.0,235.0 Q305,243 297.0,243.0 L175.6,243.0 Q166.6,243 166.6,252.0 L166.6,321" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M306.3,227 L306.3,329.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M305,227 L305.0,235.0 Q305,243 313.0,243.0 L444.1,243.0 Q453.1,243 453.1,252.0 L453.1,321" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M166.6,382 L166.6,402.2 Q166.6,411.2 157.6,411.2 L119.0,411.2 Q110,411.2 110.0,420.2 L110,440.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M311.8,373.5 L311.8,449" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M453.1,382 L453.1,402.0 Q453.1,411 462.1,411.0 L533.5,411.0 Q542.5,411 542.5,420.0 L542.5,440" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M542.5,502 L542.5,510.0 Q542.5,518 534.5,518.0 L456.0,518.0 Q447,518 447.0,527.0 L447,569.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M542.5,502 L542.5,510.0 Q542.5,518 550.5,518.0 L622.5,518.0 Q631.5,518 631.5,527.0 L631.5,560" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="221" y="22" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="305" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="305" dy="0">Síntoma: miedo a</tspan><tspan x="305" dy="19.2">tocar</tspan></text><polygon points="305,141 416.5,184 305,227 193.5,184" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="305" y="178.6" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="305" dy="0">¿Qué señal lo</tspan><tspan x="305" dy="19.2">respalda?</tspan></text><rect x="100.1" y="321" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="166.6" y="346.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="166.6" dy="0">Cohesión y</tspan><tspan x="166.6" dy="19.2">dependencias</tspan></text><rect x="267.1" y="329.5" width="81" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="307.6" y="355.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="307.6" dy="0">Ciclos</tspan></text><rect x="382.1" y="321" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="453.1" y="346.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="453.1" dy="0">Interés de la</tspan><tspan x="453.1" dy="19.2">deuda</tspan></text><rect x="22" y="440.5" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="110" y="465.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">Separar por razón</tspan><tspan x="110" dy="19.2">de cambio</tspan></text><rect x="232" y="449" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="316" y="475.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="316" dy="0">Extraer lo común</tspan></text><polygon points="542.5,440 651,471 542.5,502 434,471" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="542.5" y="475.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="542.5" dy="0">¿Compensa pagar?</tspan></text><rect x="363" y="569.5" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="447" y="594.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="447" dy="0">Amortizar con un</tspan><tspan x="447" dy="19.2">cambio medido</tspan></text><rect x="565" y="560" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="631.5" y="585" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="631.5" dy="0">Aceptar con</tspan><tspan x="631.5" dy="19.2">condición de</tspan><tspan x="631.5" dy="19.2">revisión</tspan></text><rect x="172.6" y="270" width="110" height="24" rx="4" fill="#ffffff"/><text x="227.6" y="285.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="227.6" dy="0">clase enorme</tspan></text><rect x="312.3" y="248.2" width="126" height="60" rx="4" fill="#ffffff"/><text x="375.3" y="264.1" font-size="14" text-anchor="middle" font-weight="400" fill="#14