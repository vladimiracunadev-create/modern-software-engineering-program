<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 286" width="840" height="286" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Fabricación», «Extracción física» y «Aleatoriedad débil» … «Rotación y revocación»</title><desc id="d">Diagrama de flujo con 8 pasos. «Fabricación» lleva a «Clave o certificado del dispositivo». «Clave o certificado del dispositivo» lleva a «Mensaje firmado con contador o tiempo». «Mensaje firmado con contador o tiempo» lleva a «Servidor verifica». «Extracción física» lleva a «Clave o certificado del dispositivo». «Reproducción de un mensaje» lleva a «Mensaje firmado con contador o tiempo». «Aleatoriedad débil» lleva a «Clave o certificado del dispositivo». «Servidor verifica» lleva a «Rotación y revocación». «Rotación y revocación» lleva a «Clave o certificado del dispositivo».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="840" height="286" fill="#ffffff"/><path d="M150.5,44 L171.2,44.0 Q180.2,44 180.2,53.0 L180.2,84.5 Q180.2,93.5 189.2,93.5 L210,93.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M334,93.5 L352.5,93.5 Q361.5,93.5 361.5,102.5 L361.5,143.5 Q361.5,152.5 370.5,152.5 L389,152.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M513,152.5 L559,152.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M146,134.5 L169.0,134.5 Q178,134.5 178.0,125.5 L178.0,102.5 Q178,93.5 187.0,93.5 L210,93.5" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M343,211.5 L357.0,211.5 Q366,211.5 366.0,202.5 L366.0,161.5 Q366,152.5 375.0,152.5 L389,152.5" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M155,233.5 L173.5,233.5 Q182.5,233.5 182.5,224.5 L182.5,102.5 Q182.5,93.5 191.5,93.5 L210,93.5" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M657,152.5 L703,152.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M760.5,122 L760.5,39.0 Q760.5,30 751.5,30.0 L279.0,30.0 Q272,30 272.0,37.0 L272,44" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="26.5" y="22" width="124" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="88.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="88.5" dy="0">Fabricación</tspan></text><rect x="210" y="44" width="124" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="272" y="68.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="272" dy="0">Clave o</tspan><tspan x="272" dy="19.2">certificado</tspan><tspan x="272" dy="19.2">del</tspan><tspan x="272" dy="19.2">dispositivo</tspan></text><rect x="389" y="103" width="124" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="451" y="127.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="451" dy="0">Mensaje</tspan><tspan x="451" dy="19.2">firmado con</tspan><tspan x="451" dy="19.2">contador o</tspan><tspan x="451" dy="19.2">tiempo</tspan></text><rect x="559" y="122" width="98" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="608" y="147.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="608" dy="0">Servidor</tspan><tspan x="608" dy="19.2">verifica</tspan></text><rect x="31" y="104" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="88.5" y="129.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="88.5" dy="0">Extracción</tspan><tspan x="88.5" dy="19.2">física</tspan></text><rect x="201" y="181" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="272" y="206.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="272" dy="0">Reproducción</tspan><tspan x="272" dy="19.2">de un mensaje</tspan></text><rect x="22" y="203" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="88.5" y="228.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="88.5" dy="0">Aleatoriedad</tspan><tspan x="88.5" dy="19.2">débil</tspan></text><rect x="703" y="122" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="760.5" y="147.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="760.5" dy="0">Rotación y</tspan><tspan x="760.5" dy="19.2">revocación</tspan></text></svg>
