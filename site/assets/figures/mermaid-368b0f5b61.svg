<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 283 633" width="283" height="633" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Archivo» … «Productor recibe error»</title><desc id="d">Diagrama de flujo con 7 pasos. «Productor» lleva a «Búfer» (stdout). «Búfer» lleva a «Tubería» (bloque lleno o flush). «Tubería» lleva a «Consumidor». «Consumidor» lleva a «Productor recibe error» (cierra). «Productor» lleva a «Diagnóstico» (stderr). «Archivo» lleva a «Productor» (iterar).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="283" height="633" fill="#ffffff"/><path d="M133.5,168 L133.5,176.0 Q133.5,184 125.5,184.0 L69.0,184.0 Q60,184 60.0,193.0 L60,226" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M60,270 L60.0,278.0 Q60,286 68.0,286.0 L72.1,286.0 Q81.1,286 81.1,295.0 L81.1,346" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M81.1,390 L81.1,410.4 Q81.1,419 89.7,419.0 L89.7,419.0 Q98.3,419 98.3,427.6 L98.3,448" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M102.7,492 L102.7,550" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M133.5,168 L133.5,176.0 Q133.5,184 141.5,184.0 L185.0,184.0 Q194,184 194.0,193.0 L194,226" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M133.5,66 L133.5,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="80" y="124" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="133.5" y