<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 509 600" width="509" height="600" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Experiencia de la persona usuaria» … «Política: qué se hace al gastarlo» y «Alertas por consumo»</title><desc id="d">Diagrama de flujo con 8 pasos. «Experiencia de la persona usuaria» lleva a «SLI: eventos buenos / eventos válidos». «SLI: eventos buenos / eventos válidos» lleva a «Punto de medición». «SLI: eventos buenos / eventos válidos» lleva a «SLO: objetivo y ventana». «SLO: objetivo y ventana» lleva a «Presupuesto de error». «Presupuesto de error» lleva a «Política: qué se hace al gastarlo». «SLO: objetivo y ventana» lleva a «SLA: contrato con consecuencia». «Presupuesto de error» lleva a «Alertas por consumo» (consumo rápido). «Punto de medición» lleva a «SLI: eventos buenos / eventos válidos» (servidor o cliente).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="509" height="600" fill="#ffffff"/><path d="M248.9,83 L248.9,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M248.9,221 L248.9,245.2 Q248.9,254.2 239.9,254.2 L166.2,254.2 Q157.2,254.2 157.2,263.2 L157.2,287.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M248.9,221 L248.9,241.0 Q248.9,250 257.9,250.0 L349.7,250.0 Q358.7,250 358.7,259.0 L358.7,279" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M358.7,340 L358.7,360.0 Q358.7,369 349.7,369.0 L210.9,369.0 Q201.9,369 201.9,378.0 L201.9,398" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M201.9,459 L201.9,479.0 Q201.9,488 192.9,488.0 L115.0,488.0 Q106,488 106.0,497.0 L106,517" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M358.7,340 L358.7,360.0 Q358.7,369 367.7,369.0 L389.9,369.0 Q398.9,369 398.9,378.0 L398.9,398" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M201.9,459 L201.9,467.0 Q201.9,475 209.9,475.0 L277.0,475.0 Q286,475 286.0,484.0 L286,517" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M69.2,309.5 L62.2,309.5 Q55.2,309.5 55.2,302.5 L55.2,190.0 Q55.2,181 64.2,181.0 L164.9,181" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="160.9" y="22" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="248.9" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="248.9" dy="0">Experiencia de la</tspan><tspan x="248.9" dy="19.2">persona usuaria</tspan></text><rect x="164.9" y="141" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="248.9" y="166" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="248.9" dy="0">SLI: eventos</tspan><tspan x="248.9" dy="19.2">buenos / eventos</tspan><tspan x="248.9" dy="19.2">válidos</tspan></text><rect x="69.2" y="287.5" width="176" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="157.2" y="313.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="157.2" dy="0">Punto de medición</tspan></text><rect x="279.2" y="279" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="358.7" y="304.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="358.7" dy="0">SLO: objetivo y</tspan><tspan x="358.7" dy="19.2">ventana</tspan></text><rect x="126.9" y="398" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="201.9" y="423.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="201.9" dy="0">Presupuesto de</tspan><tspan x="201.9" dy="19.2">error</tspan></text><rect x="22" y="517" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="542.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Política: qué se</tspan><tspan x="106" dy="19.2">hace al gastarlo</tspan></text><rect x="310.9" y="398" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="398.9" y="423.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="398.9" dy="0">SLA: contrato con</tspan><tspan x="398.9" dy="19.2">consecuencia</tspan></text><rect x="224" y="517" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="286" y="542.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="286" dy="0">Alertas por</tspan><tspan x="286" dy="19.2">consumo</tspan></text><rect x="292" y="484" width="126" height="24" rx="4" fill="#ffffff"/><text x="355" y="499.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="355" dy="0">consumo rápido</tspan></text><rect x="61.2" y="224.2" width="94" height="42" rx="4" fill="#ffffff"/><text x="108.2" y="240.1" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="108.2" dy="0">servidor o</tspan><tspan x="108.2" dy="17.92">cliente</tspan></text></svg>
