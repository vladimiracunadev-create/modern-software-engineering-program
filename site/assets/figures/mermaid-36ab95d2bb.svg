<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 523 865" width="523" height="865" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Casos: reales, difíciles, etiquetados» … «Operación: trazas, costo, escalados»</title><desc id="d">Diagrama de flujo con 9 pasos. «Casos: reales, difíciles, etiquetados» lleva a «Ejecutar con traza». «Ejecutar con traza» lleva a «Calificar: código, persona o juez calibrado». «Calificar: código, persona o juez calibrado» lleva a «Comparar versiones pareando casos». «Comparar versiones pareando casos» lleva a «Puerta: umbral y margen». «Puerta: umbral y margen» lleva a «Publicar» (pasa). «Puerta: umbral y margen» lleva a «Más casos o repeticiones» (duda). «Puerta: umbral y margen» lleva a «Rechazar» (no pasa). «Publicar» lleva a «Operación: trazas, costo, escalados». «Operación: trazas, costo, escalados» lleva a «Casos: reales, difíciles, etiquetados» (fallos reales).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="523" height="865" fill="#ffffff"/><path d="M344.6,102 L344.6,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M344.6,204 L344.6,227.4 Q344.6,233 339.0,233.0 L339.0,233.0 Q333.4,233 333.4,238.6 L333.4,262" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M333.4,342 L333.4,362.0 Q333.4,371 324.4,371.0 L324.3,371.0 Q315.3,371 315.3,380.0 L315.3,400" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M315.3,461 L315.3,481.0 Q315.3,490 306.3,490.0 L297.6,490.0 Q288.6,490 288.6,499.0 L288.6,519" fill="none" strok