<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 515 928" width="515" height="928" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Dependencia real» … «Declarar el entorno: versión, codificación, semilla»</title><desc id="d">Diagrama de flujo con 9 pasos. «Dependencia real» lleva a «¿Se puede usar en la prueba?». «¿Se puede usar en la prueba?» lleva a «Usar la real o una en memoria» (sí, barata). «¿Se puede usar en la prueba?» lleva a «Doble: stub, fake, espía» (no). «Doble: stub, fake, espía» lleva a «Batería de contrato contra doble y real». «Batería de contrato contra doble y real» lleva a «¿Pasa las mismas comprobaciones?». «¿Pasa las mismas comprobaciones?» lleva a «Corregir el doble o declarar la diferencia» (no). «¿Pasa las mismas comprobaciones?» lleva a «Prueba de estado con el doble» (sí). «Prueba de estado con el doble» lleva a «Declarar el entorno: versión, codificación, semilla». «Corregir el doble o declarar la diferencia» lleva a «Batería de contrato contra doble y real».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="515" height="928" fill="#ffffff"/><path d="M211.5,66 L211.5,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M211.5,210 L211.5,218.0 Q211.5,226 203.5,226.0 L123.5,226.0 Q114.5,226 114.5,235.0 L114.5,268" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M211.5,210 L211.5,218.0 Q211.5,226 219.5,226.0 L324.5,226.0 Q333.5,226 333.5,235.0 L333.5,268" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M333.5,329 L333.5,3