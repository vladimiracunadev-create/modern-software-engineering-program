<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 437 751" width="437" height="751" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Decisión de producto» … «Monitoreo y deriva»</title><desc id="d">Diagrama de flujo con 8 pasos. «Decisión de producto» lleva a «Datos disponibles al decidir». «Datos disponibles al decidir» lleva a «Partición y evaluación». «Partición y evaluación» lleva a «Modelo». «Modelo» lleva a «Umbral y acción». «Umbral y acción» lleva a «Persona o proceso». «Persona o proceso» lleva a «Monitoreo y deriva». «Monitoreo y deriva» lleva a «Datos disponibles al decidir» (cambia la población). «Umbral y acción» lleva a «Plan de respaldo» (error).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="437" height="751" fill="#ffffff"/><path d="M298.6,83 L298.6,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M298.6,202 L298.6,225.7 Q298.6,231 293.3,231.0 L293.3,231.0 Q288,231 288.0,236.3 L288,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M288,321 L288.0,341.4 Q288,350 279.4,350.0 L279.4,350.0 Q270.8,350 270.8,358.6 L270.8,379" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M270.8,423 L270.8,443.0 Q270.8,452 261.8,452.0 L254.4,452.0 Q245.4,452 245.4,461.0 L245.4,481" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M245.4,525 L245.4,545.0 Q245.4,554 236.4,554.0 L133.7,554.0 Q124.7,554 124.7,563.0 L124.7,583" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M127.