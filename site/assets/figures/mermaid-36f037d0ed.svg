<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 648 779" width="648" height="779" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Petición con correlación» … «Reconstruir el flujo por correlación» y «Alarmas por síntoma»</title><desc id="d">Diagrama de flujo con 10 pasos. «Petición con correlación» lleva a «Servicio A». «Servicio A» lleva a «Cola» (encabezados del mensaje). «Cola» lleva a «Consumidor B». «Consumidor B» lleva a «Proveedor externo». «Servicio A» lleva a «Registros sin datos sensibles». «Consumidor B» lleva a «Registros sin datos sensibles». «Cola» lleva a «Métricas: profundidad, edad, procesados, errores». «Consumidor B» lleva a «Métricas: profundidad, edad, procesados, errores». «Registros sin datos sensibles» lleva a «Reconstruir el flujo por correlación». «Métricas: profundidad, edad, procesados, errores» lleva a «Alarmas por síntoma». «Petición con correlación» lleva a «Controles: autenticar, autorizar, firmar, limitar».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="648" height="779" fill="#ffffff"/><path d="M312.6,83 L312.6,116.8 Q312.6,125.8 303.6,125.8 L229.6,125.8 Q220.6,125.8 220.6,134.8 L220.6,168.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M220.6,212.5 L220.6,220.5 Q220.6,228.5 228.6,228.5 L258.6,228.5 Q267.6,228.5 267.6,237.5 L267.6,316" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M267.6,360 L267.6,380.0 Q267.6,389 276.6,389.0 L302.0,389.0 Q311,389 311.0,398.0 L311,418" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arro