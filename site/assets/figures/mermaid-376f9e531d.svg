<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 546 772" width="546" height="772" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Código fuente» … «Anfitrión: funciones, WASI»</title><desc id="d">Diagrama de flujo con 9 pasos. «Código fuente» lleva a «Compilador». «Compilador» lleva a «Módulo .wasm». «Módulo .wasm» lleva a «Validación». «Validación» lleva a «Instanciación». «Instanciación» lleva a «Memoria lineal propia». «Instanciación» lleva a «Importaciones concedidas». «Importaciones concedidas» lleva a «Anfitrión: funciones, WASI». «Instanciación» lleva a «Límites del anfitrión: combustible y memoria».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="546" height="772" fill="#ffffff"/><path d="M274.3,66 L274.3,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M274.5,168 L274.5,226" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M274.8,270 L274.8,328" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M275.2,372 L275.2,430" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M275.5,474 L275.5,503.5 Q275.5,512.5 266.5,512.5 L106.0,512.5 Q97,512.5 97.0,521.5 L97,551" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M276.2,474 L276.2,551" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M276.9,612 L276.9,689" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M275.5,474 L275.5,494.0 Q275.5,503 284.5,503.0 L444.0,50