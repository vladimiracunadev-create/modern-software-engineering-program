<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 638" width="700" height="638" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Experiencia del cliente» … «Se congela la funcionalidad y se invierte en fiabilidad», «Se permite riesgo y velocidad» y «Comunicación y postmortem»</title><desc id="d">Diagrama de flujo con 10 pasos. «Experiencia del cliente» lleva a «SLI: éxito por solicitud o por tarea». «SLI: éxito por solicitud o por tarea» lleva a «SLO interno más estricto». «SLO interno más estricto» lleva a «Presupuesto de errores». «Presupuesto de errores» lleva a «Se congela la funcionalidad y se invierte en fiabilidad» (se agota). «Presupuesto de errores» lleva a «Se permite riesgo y velocidad» (sobra). «SLO interno más estricto» lleva a «SLA del plan con crédito». «SLI: éxito por solicitud o por tarea» lleva a «Medición por inquilino». «Medición por inquilino» lleva a «Soporte por severidad y plan». «Soporte por severidad y plan» lleva a «Comunicación y postmortem». «Comunicación y postmortem» lleva a «Experiencia del cliente».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="700" height="638" fill="#ffffff"/><path d="M432.7,83 L432.7,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M432.7,221 L432.7,241.0 Q432.7,250 423.7,250.0 L342.3,250.0 Q333.3,250 333.3,259.0 L333.3,279" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M333.3,340 L333.3,360.0 Q333.3,369 324.3,369.0 L191.4,369.0 Q182.4,369 182.4,378.0 L182.4,398" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M182.4,459 L182.4,467.0 Q182.4,475 174.4,475.0 L123.5,475.0 Q114.5,475 114.5,484.0 L114.5,517" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M182.4,459 L182.4,467.0 Q182.4,475 190.4,475.0 L320.0,475.0 Q329,475 329.0,484.0 L329,536" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M333.3,340 L333.3,360.0 Q333.3,369 342.3,369.0 L366.4,369.0 Q375.4,369 375.4,378.0 L375.4,398" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M432.7,221 L432.7,241.0 Q432.7,250 441.7,250.0 L504.3,250.0 Q513.3,250 513.3,259.0 L513.3,279" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M513.3,340 L513.3,360.0 Q513.3,369 522.3,369.0 L568.4,369.0 Q577.4,369 577.4,378.0 L577.4,398" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M577.4,459 L577.4,488.5 Q577.4,497.5 568.4,497.5 L535.0,497.5 Q526,497.5 526.0,506.5 L526,536" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M601,566.5 L666.4,566.5 Q675.4,566.5 675.4,557.5 L675.4,61.5 Q675.4,52.5 666.4,52.5 L512.2,52.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="353.2" y="22" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="432.7" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="432.7" dy="0">Experiencia del</tspan><tspan x="432.7" dy="19.2">cliente</tspan></text><rect x="353.2" y="141" width="159" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="432.7" y="166" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="432.7" dy="0">SLI: éxito por</tspan><tspan x="432.7" dy="19.2">solicitud o por</tspan><tspan x="432.7" dy="19.2">tarea</tspan></text><rect x="253.8" y="279" width="159" height="61" rx="10" fill="#dff