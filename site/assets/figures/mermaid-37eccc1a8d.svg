<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 901 281" width="901" height="281" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Identificar plataforma» … «Explicar y proponer recuperación»</title><desc id="d">Diagrama de flujo con 9 pasos. «Identificar plataforma» lleva a «Resolver rutas». «Resolver rutas» lleva a «Comprobar identidad y permisos». «Comprobar identidad y permisos» lleva a «Observar procesos y servicios». «Observar procesos y servicios» lleva a «Ejecutar comandos con contratos». «Ejecutar comandos con contratos» lleva a «Leer configuración sin exponer secretos». «Leer configuración sin exponer secretos» lleva a «Inventariar dependencias». «Inventariar dependencias» lleva a «Recolectar evidencia». «Recolectar evidencia» lleva a «Explicar y proponer recuperación».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="901" height="281" fill="#ffffff"/><path d="M146,62 L192,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M342,62 L388,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M512,62 L567,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M682,62 L741.5,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M808,102 L808,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M737,209.5 L691,209.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M558,209.5 L507.5,209.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M392.5,209.5 L333.5,209.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="31.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="84" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="84" dy="0">Identificar</tspan><tspan x="84" dy="19.2">plataforma</tspan></text><rect x="192" y="40" width="150" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="267" y="66.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="267" dy="0">Resolver rutas</tspan></text><rect x="388" y="22" width="124" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="450" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="450" dy="0">Comprobar</tspan><tspan x="450" dy="19.2">identidad y</tspan><tspan x="450" dy="19.2">permisos</tspan></text><rect x="567" y="22" width="115" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="624.5" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="624.5" dy="0">Observar</tspan><tspan x="624.5" dy="19.2">procesos y</tspan><tspan x="624.5" dy="19.2">servicios</tspan></text><rect x="741.5" y="22" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="808" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="808" dy="0">Ejecutar</tspan><tspan x="808" dy="19.2">comandos con</tspan><tspan x="808" dy="19.2">contratos</tspan></text><rect x="737" y="160" width="142" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="808" y="184.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="808" dy="0">Leer</tspan><tspan x="808" dy="19.2">configuración</tspan><tspan x="808" dy="19.2">sin exponer</tspan><tspan x="808" dy="19.2">secretos</tspan></text><rect x="558" y="179" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="624.5" y="204.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="624.5" dy="0">Inventariar</tspan><tspan x="624.5" dy="19.2">dependencias</tspan></text><rect x="392.5" y="179" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="450" y="204.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="450" dy="0">Recolectar</tspan><tspan x="450" dy="19.2">evidencia</tspan></text><rect x="200.5" y="169.5" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="267" y="194.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="267" dy="0">Explicar y</tspan><tspan x="267" dy="19.2">proponer</tspan><tspan x="267" dy="19.2">recuperación</tspan></text></svg>
