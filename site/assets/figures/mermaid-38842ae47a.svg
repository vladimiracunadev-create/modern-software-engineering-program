<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 827 362" width="827" height="362" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Qué es SaaS» … «Taller y proyecto integrador»</title><desc id="d">Diagrama de flujo con 12 pasos. «Qué es SaaS» lleva a «Aislamiento y vecino ruidoso». «Aislamiento y vecino ruidoso» lleva a «Alta y configuración». «Alta y configuración» lleva a «Suscripciones y dunning». «Suscripciones y dunning» lleva a «Medición de uso». «Medición de uso» lleva a «Planes, derechos y banderas». «Planes, derechos y banderas» lleva a «Precios y límites». «Precios y límites» lleva a «Marketplaces». «Marketplaces» lleva a «Pagos, idempotencia y conciliación». «Pagos, idempotencia y conciliación» lleva a «Tienda: carrito, inventario, devoluciones». «Tienda: carrito, inventario, devoluciones» lleva a «SLA, soporte y operación». «SLA, soporte y operación» lleva a «Taller y proyecto integrador». «Taller y proyecto integrador» lleva a «Aislamiento y vecino ruidoso» (un defecto no visto).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="827" height="362" fill="#ffffff"/><path d="M159,52.5 L227,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M377,52.5 L445,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M587,52.5 L646,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M725.5,83 L725.5,149.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M646,171.5 L600,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M432,171.5 L355.5,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M248.5,171.5 L163.5,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M97,193.5 L97,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M172,300 L218,300" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M386,300 L441,300" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M591,300 L668,300" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M725.5,260 L725.5,225.0 Q725.5,216 716.5,216.0 L378.5,216.0 Q369.5,216 369.5,207.0 L369.5,106.0 Q369.5,97 360.5,97.0 L309.0,97.0 Q302,97 302.0,90.0 L302,83" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="35" y="30.5" width="124" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="97" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="97" dy="0">Qué es SaaS</tspan></text><rect x="227" y="22" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="302" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="302" dy="0">Aislamiento y</tspan><tspan x="302" dy="19.2">vecino ruidoso</tspan></text><rect x="445" y="22" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="516" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="516" dy="0">Alta y</tspan><tspan x="516" dy="19.2">configuración</tspan></text><rect x="646" y="22" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="725.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="725.5" dy="0">Suscripciones y</tspan><tspan x="725.5" dy="19.2">dunning</tspan></text><rect x="646" y="149.5" width="159" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="725.5" y="175.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="725.5" dy="0">Medición de uso</tspan></text><rect x="432" y="141" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="516" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="516" dy="0">Planes, derechos</tspan><tspan x="516" dy="19.2">y banderas</tspan></text><rect x="248.5" y="141" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="302" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="302" dy="0">Precios y</tspan><tspan x="302" dy="19.2">límites</tspan></text><rect x="30.5" y="149.5" width="133" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="97" y="175.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="97" dy="0">Marketplaces</tspan></text><rect x="22" y="260" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="97" y="285" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="97" dy="0">Pagos,</tspan><tspan x="97" dy="19.2">idempotencia y</tspan><tspan x="97" dy="19.2">conciliación</tspan></text><rect x="218" y="260" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="302" y="285" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="302" dy="0">Tienda: carrito,</tspan><tspan x="302" dy="19.2">inventario,</tspan><tspan x="302" dy="19.2">devoluciones</tspan></text><rect x="441" y="269.5" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="516" y="294.6" font-size="15" text-anchor="middle" font-weight="400" fill