<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 325 752" width="325" height="752" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Responsable» … «Reintento» y «Registro de ejecuciones»</title><desc id="d">Diagrama de flujo con 9 pasos. «Disparador: evento o fecha» lleva a «Condición». «Condición» lleva a «Acción 1» (sí). «Condición» lleva a «Acción 2» (no). «Acción 1» lleva a «Conector externo». «Acción 2» lleva a «Conector externo». «Conector externo» lleva a «Reintento» (falla o repite). «Reintento» lleva a «Conector externo». «Responsable» lleva a «Revisión periódica». «Revisión periódica» lleva a «Disparador: evento o fecha». «Conector externo» lleva a «Registro de ejecuciones».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="325" height="752" fill="#ffffff"/><path d="M166.6,287 L166.6,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M166.5,407 L166.5,415.0 Q166.5,423 158.5,423.0 L109.5,423.0 Q100.5,423 100.5,432.0 L100.5,465" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M166.5,407 L166.5,415.0 Q166.5,423 174.5,423.0 L223.5,423.0 Q232.5,423 232.5,432.0 L232.5,465" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M100.5,509 L100.5,529.0 Q100.5,538 109.5,538.0 L157.4,538.0 Q166.4,538 166.4,547.0 L166.4,567" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M232.5,509 L232.5,529.0 Q232.5,538 223.5,538.0 L175.4,538.0 Q166.4,538 166.4,547.0 L166.4,567" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M166.4,611 L166.4,619.0 Q166.4,627 158.4,627.0 L100.5,627.0 Q91.5,627 91.5,636.0 L91.5,677.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M166.8,66 L166.8,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M166.7,168 L166.7,226" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M166.4,611 L166.4,631.0 Q166.4,640 175.4,640.0 L232.0,640.0 Q241,640 241.0,649.0 L241,669" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M38,699.5 L31.0,699.5 Q24,699.5 24.0,692.5 L24.0,598.0 Q24,589 33.0,589.0 L82.4,589" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="74.2" y="226" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="166.7" y="251.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="166.7" dy="0">Disparador: evento</tspan><tspan x="166.7" dy="19.2">o fecha</tspan></text><polygon points="166.5,345 231,376 166.5,407 102,376" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="166.5" y="380.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="166.5" dy="0">Condición</tspan></text><rect x="51.5" y="465" width="98" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="100.5" y="491.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="100.5" dy="0">Acción 1</tspan></text><rect x="183.5" y="465" width="98" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="232.5" y="491.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="232.5" dy="0">Acción 2</tspan></text><rect x="82.4" y="567" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="166.4" y="593.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="166.4" dy="0">Conector externo</tspan></text><rect x="38" y="677.5" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="91.5" y="703.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="91.5" dy="0">Reintento</tspan></text><rect x="104.8" y="22" width="124" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="166.8" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="166.8" dy="0">Responsable</tspan></text><rect x="74.3" y="124" width="185" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="166.8" y="150.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="166.8" dy="0">Revisión periódica</tspan></text><rect x="179" y="669" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="241" y="694.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="241" dy="0">Registro de</tspan><tspan x="241" dy="19.2">ejecuciones</tspan></text><rect x="106.5" y="432" width="29" height="24" rx="4" fill="#ffffff"/><text x="121" y="447.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="121" dy="0">sí</tspan></text><rect x="238.5" y="432" width="29" height="24" rx="4" fill="#ffffff"/><text x="253" y="447.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="253" dy="0">no</tspan></text><rect x="36" y="631" width="126" height="24" rx="4" fill="#ffffff"/><text x="99" y="646.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="99" dy="0">falla o repite</tspan></text></svg>
