<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 846 88" width="846" height="88" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «🎯 Valor» … «📈 Seguimiento»</title><desc id="d">Diagrama de flujo con 5 pasos. «🎯 Valor» lleva a «🧠 Consumo». «🧠 Consumo» lleva a «🛠️ Asignación». «🛠️ Asignación» lleva a «🔎 Decisión». «🔎 Decisión» lleva a «📈 Seguimiento».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="846" height="88" fill="#ffffff"/><path d="M118,44 L164,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M277,44 L323,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M462,44 L508,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M630,44 L676,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="22" width="96" height="44" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="70" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="70" dy="0">🎯 Valor</tspan></text><rect x="164" y="22" width="113" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="220.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="220.5" dy="0">🧠 Consumo</tspan></text><rect x="323" y="22" width="139" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="392.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="392.5" dy="0">🛠️ Asignación</tspan></text><rect x="508" y="22" width="122" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="569" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="569" dy="0">🔎 Decisión</tspan></text><rect x="676" y="22" width="148" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="750" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="750" dy="0">📈 Seguimiento</tspan></text></svg>
