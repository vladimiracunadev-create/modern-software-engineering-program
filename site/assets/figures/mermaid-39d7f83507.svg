<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 919 124" width="919" height="124" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «🧱 Base común» … «🔭 Operación y evolución»</title><desc id="d">Diagrama de flujo con 6 pasos. «🧱 Base común» lleva a «📚 Partes núcleo». «📚 Partes núcleo» lleva a «🔗 Clases asociadas». «🔗 Clases asociadas» lleva a «⚖️ Decisiones». «⚖️ Decisiones» lleva a «🧪 Evidencia». «🧪 Evidencia» lleva a «🔭 Operación y evolución».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="919" height="124" fill="#ffffff"/><path d="M109,62 L155,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M260,62 L306,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M413,62 L459,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M574,62 L620,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M727,62 L773,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="31.5" width="87" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="65.5" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="65.5" dy="0">🧱 Base</tspan><tspan x="65.5" dy="19.2">común</tspan></text><rect x="155" y="31.5" width="105" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="207.5" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="207.5" dy="0">📚 Partes</tspan><tspan x="207.5" dy="19.2">núcleo</tspan></text><rect x="306" y="31.5" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="359.5" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="359.5" dy="0">🔗 Clases</tspan><tspan x="359.5" dy="19.2">asociadas</tspan></text><rect x="459" y="31.5" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="516.5" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="516.5" dy="0">⚖️</tspan><tspan x="516.5" dy="19.2">Decisiones</tspan></text><rect x="620" y="31.5" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="673.5" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="673.5" dy="0">🧪</tspan><tspan x="673.5" dy="19.2">Evidencia</tspan></text><rect x="773" y="22" width="124" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="835" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="835" dy="0">🔭</tspan><tspan x="835" dy="19.2">Operación y</tspan><tspan x="835" dy="19.2">evolución</tspan></text></svg>
