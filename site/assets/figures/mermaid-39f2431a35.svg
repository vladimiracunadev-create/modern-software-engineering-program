<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 582 704" width="582" height="704" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Tres ramas» … «Reiniciar y repetir», «Corrección hacia delante» y «Rama figura integrada»</title><desc id="d">Diagrama de flujo con 9 pasos. «Tres ramas» lleva a «Integración con conflicto». «Integración con conflicto» lleva a «Resolución». «Resolución» lleva a «Intención perdida» (automática). «Resolución» lleva a «Resultado correcto» (manual con las tres versiones). «Intención perdida» lleva a «¿Publicada?». «¿Publicada?» lleva a «Reiniciar y repetir» (no). «¿Publicada?» lleva a «Corrección hacia delante» (sí). «¿Publicada?» lleva a «Rama figura integrada» (revert de la fusión).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="582" height="704" fill="#ffffff"/><path d="M325.7,66 L325.7,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M325.7,185 L325.7,208.2 Q325.7,214 319.9,214.0 L319.9,214.0 Q314.1,214 314.1,219.8 L314.1,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M314.1,305 L314.1,313.0 Q314.1,321 306.1,321.0 L206.7,321.0 Q197.7,321 197.7,330.0 L197.7,381" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M314.1,305 L314.1,313.0 Q314.1,321 322.1,321.0 L403.2,321.0 Q412.2,321 412.2,330.0 L412.2,381" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M197.7,425 L197.7,445.0 Q197.7,454 206.7,454.0 L239.7,454.0 Q248.7,454 248.7,463.0 L248.7,483" fill="none" stroke="#32505f" 