<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 658 956" width="658" height="956" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Qubits: amplitudes complejas» y «Ruido» … «Decisiones: inventario y migración criptográfica»</title><desc id="d">Diagrama de flujo con 11 pasos. «Qubits: amplitudes complejas» lleva a «Puertas: transformaciones unitarias». «Puertas: transformaciones unitarias» lleva a «Interferencia: refuerza o cancela». «Interferencia: refuerza o cancela» lleva a «Medición: una respuesta al azar». «Medición: una respuesta al azar» lleva a «Problema con estructura». «Problema con estructura» lleva a «Shor: ventaja exponencial» (periodo, logaritmo discreto). «Problema con estructura» lleva a «Grover: ventaja cuadrática» (búsqueda sin estructura). «Problema con estructura» lleva a «Sin ventaja conocida» (casi todo lo demás). «Ruido» lleva a «Corrección de errores: muchos qubits físicos por lógico». «Shor: ventaja exponencial» lleva a «Decisiones: inventario y migración criptográfica».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="658" height="956" fill="#ffffff"/><path d="M326.6,83 L326.6,150.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M323.6,230.5 L323.6,298" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M320.6,359 L320.6,382.1 Q320.6,388 314.7,388.0 L314.7,388.0 Q308.8,388 308.8,393.9 L308.8,417" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M308.8,478 L308.8,498.0 Q308.8,507 299.8,507.0 L295.6,507.0 Q286.6,507 286.6,516.0 L286.6,536" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M286.6,622 L286.6,630.0 Q286.6,638 278.6,638.0 L102.0,638.0 Q93,638 93.0,647.0 L93,716" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M286.6,622 L286.6,633.5 Q286.6,638 282.1,638.0 L282.1,638.0 Q277.5,638 277.5,642.5 L277.5,716" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M286.6,622 L286.6,630.0 Q286.6,638 294.6,638.0 L444.0,638.0 Q453,638 453.0,647.0 L453,716" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M543.3,74.5 L543.3,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M95.7,777 L95.7,835" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="234.1" y="22" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="326.6" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="326.6" dy="0">Qubits: amplitudes</tspan><tspan x="326.6" dy="19.2">complejas</tspan></text><rect x="242.6" y="150.5" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="326.6" y="175.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="326.6" dy="0">Puertas:</tspan><tspan x="326.6" dy="19.2">transformaciones</tspan><tspan x="326.6" dy="19.2">unitarias</tspan></text><rect x="228.1" y="298" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="320.6" y="323.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="320.6" dy="0">Interferencia:</tspan><tspan x="320.6" dy="19.2">refuerza o cancela</tspan></text><rect x="220.8" y="417" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="308.8" y="442.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="308.8" dy="0">Medición: una</tspan><tspan x="308.8" dy="19.2">respuesta al azar</tspan></text><polygon points="286.6,536 390.6,579 286.6,622 182.6,579" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="286.6" y="573.6" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="286.6" dy="0">Problema con</tspan><tspan x="286.6" dy="19.2">estructura</tspan></text><rect x="22" y="716" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="93" y="741.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="93" dy="0">Shor: ventaja</tspan><tspan x="93" dy="19.2">exponencial</tspan></text><rect x="198" y="716" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="277.5" y="741.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="277.5" dy="0">Grover: ventaja</tspan><tspan x="277.5" dy="19.2">cuadrática</tspan></text><rect x="391" y="716" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="453" y="741.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="453" dy="0">Sin ventaja</tspan><tspan x="453" dy="19.2">conocida</tspan></text><rect x="505.3" y="30.5" width="76" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="543.3" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="543.3" dy="0">Ruido</tspan></text><rect x="450.8" y="141" width="185" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="543.3" y="165.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="543.3" dy="0">Corrección de</tspan><tspan x="543.3" dy="19.2">errores: muchos</tspan><tspan x="543.3" dy="19.2">qubits físicos por</tspan><tspan x="543.3" dy="19.2">lógico</tspan></text><rect x="27.3" y="835" width="142" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="98.3" y="859.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="98.3" dy="0">Decisiones:</tspan><tspan x="98.3" dy="19.2">inventario y</tspan><tspan x="98.3" dy="19.2">migración</tspan><tspan x="98.3" dy="19.2">criptográfica</tspan></text><rect x="99" y="647" width="86" height="60" rx="4" fill="#ffffff"/><text x="142" y="662.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="142" dy="0">periodo,</tspan><tspan x="142" dy="17.92">logaritmo</tspan><tspan x="142" dy="17.92">discreto</tspan></text><rect x="283.5" y="656" width="110" height="42" rx="4" fill="#ffffff"/><text x="338.5" y="671.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="338.5" dy="0">búsqueda sin</tspan><tspan x="338.5" dy="17.92">estructura</tspan></text><rect x="459" y="656" width="110" height="42" rx="4" fill="#ffffff"/><text x="514" y="671.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="514" dy="0">casi todo lo</tspan><tspan x="514" dy="17.92">demás</tspan></text></svg>
