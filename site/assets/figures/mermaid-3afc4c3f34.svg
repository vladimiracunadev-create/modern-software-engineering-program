<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 398 823" width="398" height="823" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Impacto en el negocio» … «Hallazgos y acciones»</title><desc id="d">Diagrama de flujo con 9 pasos. «Impacto en el negocio» lleva a «RPO y RTO». «RPO y RTO» lleva a «Estrategia: copias, réplicas, regiones». «Estrategia: copias, réplicas, regiones» lleva a «Copia o réplica existente». «Copia o réplica existente» lleva a «Verificación: restaurar y consultar». «RPO y RTO» lleva a «Orden de recuperación». «Orden de recuperación» lleva a «Dependencias y ciclos». «Verificación: restaurar y consultar» lleva a «Ejercicio». «Dependencias y ciclos» lleva a «Ejercicio». «Ejercicio» lleva a «Hallazgos y acciones». «Hallazgos y acciones» lleva a «Estrategia: copias, réplicas, regiones» (cambian el plan).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="398" height="823" fill="#ffffff"/><path d="M203.2,83 L203.2,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M203.2,185 L203.2,205.0 Q203.2,214 194.2,214.0 L119.0,214.0 Q110,214 110.0,223.0 L110,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M111.2,323 L111.2,381" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M116.5,442 L116.5,500" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M203.2,185 L203.2,209.8 Q203.2,218.8 212.2,218.8 L289.5,218.8 Q298.5,218.8 298.5,227.8 L298.5,252.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end=