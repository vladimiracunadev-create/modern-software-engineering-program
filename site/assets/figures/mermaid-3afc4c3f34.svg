th="1.6"/><text x="120.6" y="525" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="120.6" dy="0">Verificación:</tspan><tspan x="120.6" dy="19.2">restaurar y</tspan><tspan x="120.6" dy="19.2">consultar</tspan></text><rect x="232" y="252.5" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="298.5" y="277.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="298.5" dy="0">Orden de</tspan><tspan x="298.5" dy="19.2">recuperación</tspan></text><rect x="225.9" y="381" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="300.9" y="406.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="300.9" dy="0">Dependencias y</tspan><tspan x="300.9" dy="19.2">ciclos</tspan></text><rect x="74.6" y="638" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="128.1" y="664.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="128.1" dy="0">Ejercicio</tspan></text><rect x="70.3" y="740" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="132.3" y="765.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="132.3" dy="0">Hallazgos y</tspan><tspan x="132.3" dy="19.2">acciones</tspan></text><rect x="218" y="505.8" width="94" height="42" rx="4" fill="#ffffff"/><text x="265" y="521.7" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="265" dy="0">cambian el</tspan><tspan x="265" dy="17.92">plan</tspan></text></svg>
