<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 931 891" width="931" height="891" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Un cambio de comportamiento» … «Combinar prácticas con puntos ciegos distintos»</title><desc id="d">Diagrama de flujo con 14 pasos. «Un cambio de comportamiento» lleva a «¿Qué pregunta domina?». «¿Qué pregunta domina?» lleva a «BDD · ATDD · SDD» (qué debe hacer). «¿Qué pregunta domina?» lleva a «DDD» (con qué palabras). «¿Qué pregunta domina?» lleva a «Contratos» (con qué interfaces). «¿Qué pregunta domina?» lleva a «TDD» (cómo construirlo). «¿Qué pregunta domina?» lleva a «EDD · ODD» (sigue sirviendo). «BDD · ATDD · SDD» lleva a «Oráculo: ejemplos o especificación». «DDD» lleva a «Oráculo: lenguaje y contexto». «Contratos» lleva a «Oráculo: precondiciones y esquemas». «TDD» lleva a «Oráculo: pruebas de ejemplo». «EDD · ODD» lleva a «Oráculo: evaluaciones y flujo con evidencia». «Oráculo: ejemplos o especificación» lleva a «Punto ciego propio». «Oráculo: precondiciones y esquemas» lleva a «Punto ciego propio». «Oráculo: pruebas de ejemplo» lleva a «Punto ciego propio». «Oráculo: evaluaciones y flujo con evidencia» lleva a «Punto ciego propio». «Punto ciego propio» lleva a «Combinar prácticas con puntos ciegos distintos».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="931" height="891" fill="#ffffff"/><path d="M477.4,102 L477.4,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M477.4,280 L477.4,288.0 Q477.4,296 469.4,296.0 L352.2,296.0 Q343.2,296 343.2,305.0 L343.2,356" fill="none"