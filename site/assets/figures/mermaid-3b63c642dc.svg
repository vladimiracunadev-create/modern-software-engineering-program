<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 166" width="856" height="166" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Contenedor de desarrollo» … «Desechabilidad / persistencia»</title><desc id="d">Diagrama de flujo con 5 pasos. «Contenedor de desarrollo» lleva a «Imagen, tag / digest». «Imagen, tag / digest» lleva a «Workspace, mounts / permisos». «Workspace, mounts / permisos» lleva a «Lifecycle / caché». «Lifecycle / caché» lleva a «Desechabilidad / persistencia». «Desechabilidad / persistencia» lleva a «Contenedor de desarrollo» (fallo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="856" height="166" fill="#ffffff"/><path d="M137,104 L183,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M307,104 L353,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M468,104 L514,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M638,104 L684,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M759,64 L759.0,57.0 Q759,50 752.0,50.0 L86.5,50.0 Q79.5,50 79.5,57.0 L79.5,64" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="64" width="115" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="79.5" y="89" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="79.5" dy="0">Contenedor</tspan><tspan x="79.5" dy="19.2">de</tspan><tspan x="79.5" dy="19.2">desarrollo</tspan></text><rect x="183" y="73.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="245" y="98.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="245" dy="0">Imagen, tag</tspan><tspan x="245" dy="19.2">/ digest</tspan></text><rect x="353" y="64" width="115" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="410.5" y="89" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="410.5" dy="0">Workspace,</tspan><tspan x="410.5" dy="19.2">mounts /</tspan><tspan x="410.5" dy="19.2">permisos</tspan></text><rect x="514" y="73.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="576" y="98.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="576" dy="0">Lifecycle /</tspan><tspan x="576" dy="19.2">caché</tspan></text><rect x="684" y="64" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="759" y="89" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="759" dy="0">Desechabilidad</tspan><tspan x="759" dy="19.2">/</tspan><tspan x="759" dy="19.2">persistencia</tspan></text><rect x="356.2" y="22" width="126" height="24" rx="4" fill="#ffffff"/><text x="419.2" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="419.2" dy="0">fallo o cambio</tspan></text></svg>
