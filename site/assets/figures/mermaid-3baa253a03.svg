<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 569 243" width="569" height="243" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Copyright / licencia» … «REUSE / verificación»</title><desc id="d">Diagrama de flujo con 5 pasos. «Copyright / licencia» lleva a «Identificadores / expresiones SPDX». «Identificadores / expresiones SPDX» lleva a «Procedencia». «Procedencia» lleva a «Dependencias / distribución». «Dependencias / distribución» lleva a «REUSE / verificación». «REUSE / verificación» lleva a «Copyright / licencia» (fallo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="569" height="243" fill="#ffffff"/><path d="M146,62 L192,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M351,62 L410,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M472,84 L472,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M397,190.5 L338,190.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M205,190.5 L93.0,190.5 Q84,190.5 84.0,181.5 L84,92.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="31.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="84" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="84" dy="0">Copyright /</tspan><tspan x="84" dy="19.2">licencia</tspan></text><rect x="192" y="22" width="159" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="271.5" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="271.5" dy="0">Identificadores</tspan><tspan x="271.5" dy="19.2">/ expresiones</tspan><tspan x="271.5" dy="19.2">SPDX</tspan></text><rect x="410" y="40" width="124" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="472" y="66.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="472" dy="0">Procedencia</tspan></text><rect x="397" y="160" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="472" y="185.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="472" dy="0">Dependencias /</tspan><tspan x="472" dy="19.2">distribución</tspan></text><rect x="205" y="160" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="271.5" y="185.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="271.5" dy="0">REUSE /</tspan><tspan x="271.5" dy="19.2">verificación</tspan></text><rect x="69.4" y="162.5" width="126" height="24" rx="4" fill="#ffffff"/><text x="132.4" y="178.4" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="132.4" dy="0">fallo o cambio</tspan></text></svg>
