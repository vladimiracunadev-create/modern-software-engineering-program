<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 818 297" width="818" height="297" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Modelo de aplicación» … «Decisión de arquitectura del cliente»</title><desc id="d">Diagrama de flujo con 7 pasos. «Modelo de aplicación» lleva a «Proceso y ventanas». «Modelo de aplicación» lleva a «Instancias». «Modelo de aplicación» lleva a «Espacio de pantalla». «Proceso y ventanas» lleva a «Qué sobrevive entre usos». «Instancias» lleva a «Qué sobrevive entre usos». «Espacio de pantalla» lleva a «Qué controles se alcanzan». «Qué sobrevive entre usos» lleva a «Decisión de arquitectura del cliente». «Qué controles se alcanzan» lleva a «Decisión de arquitectura del cliente». «Decisión de arquitectura del cliente» lleva a «Modelo de aplicación» (medición o fallo).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="818" height="297" fill="#ffffff"/><path d="M137,162 L151.0,162.0 Q160,162 160.0,153.0 L160.0,80.5 Q160,71.5 169.0,71.5 L183,71.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M137,157.7 L218,157.7" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M137,162 L168.5,162.0 Q177.5,162 177.5,171.0 L177.5,235.0 Q177.5,244 186.5,244.0 L218,244" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M368,71.5 L388.5,71.5 Q397.5,71.5 397.5,80.5 L397.5,103.5 Q397.5,112.5 406.5,112.5 L427,112.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M333,153.5 L371.0,153.5 Q380,153.5 380.0,144.5 L380