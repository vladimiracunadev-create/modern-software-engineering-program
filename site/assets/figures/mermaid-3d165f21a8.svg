<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 487 847" width="487" height="847" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Turno de trabajo» … «Comprobar que el estado coincide»</title><desc id="d">Diagrama de flujo con 8 pasos. «Turno de trabajo» lleva a «¿Decisión o restricción?». «¿Decisión o restricción?» lleva a «Escribir en el archivo de relevo» (sí). «¿Decisión o restricción?» lleva a «Queda solo en el contexto» (no). «Queda solo en el contexto» lleva a «¿Ventana llena?». «¿Ventana llena?» lleva a «Truncar o resumir: se pierde» (sí). «¿Ventana llena?» lleva a «Turno de trabajo» (no). «Escribir en el archivo de relevo» lleva a «Sesión nueva: leer relevo y estado del repositorio». «Truncar o resumir: se pierde» lleva a «Sesión nueva: leer relevo y estado del repositorio». «Sesión nueva: leer relevo y estado del repositorio» lleva a «Comprobar que el estado coincide». «Comprobar que el estado coincide» lleva a «Turno de trabajo».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="487" height="847" fill="#ffffff"/><path d="M219.7,66 L219.7,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M219.7,210 L219.7,218.0 Q219.7,226 211.7,226.0 L135.0,226.0 Q126,226 126.0,235.0 L126,268" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M219.7,210 L219.7,218.0 Q219.7,226 227.7,226.0 L323.0,226.0 Q332,226 332.0,235.0 L332,268" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M332,329 L332.0,349.0 Q332,358 323.0,358.0 L303.6,358.0 Q294.6,358 294.6,367.0 L294.6,387" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M294.6,449 L294.6,457.0 Q294.6,465 286.6,465.0 L271.3,465.0 Q262.3,465 262.3,474.0 L262.3,507" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M126,329 L126.0,657.0 Q126,666 135.0,666.0 L148.2,666" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M262.3,568 L262.3,588.0 Q262.3,597 253.3,597.0 L249.7,597.0 Q240.7,597 240.7,606.0 L240.7,626" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M240.7,706 L240.7,729.6 Q240.7,735 235.3,735.0 L235.3,735.0 Q229.9,735 229.9,740.4 L229.9,764" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M396.6,418 L421.0,418.0 Q430,418 430.0,409.0 L430.0,53.0 Q430,44 421.0,44.0 L303.7,44" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><path d="M145.9,794.5 L33.0,794.5 Q24,794.5 24.0,785.5 L24.0,53.0 Q24,44 33.0,44.0 L135.7,44" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="135.7" y="22" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="219.7" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="219.7" dy="0">Turno de trabajo</tspan></text><polygon points="219.7,124 323.7,167 219.7,210 115.7,167" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="219.7" y="161.6" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="219.7" dy="0">¿Decisión o</tspan><tspan x="219.7" dy="19.2">restricción?</tspan></text><rect x="38" y="268" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="126" y="293.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="126" dy="0">Escribir en el</tspan><tspan x="126" dy="19.2">archivo de relevo</tspan></text><rect x="248" y="268" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="332" y="293.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="332" dy="0">Queda solo en el</tspan><tspan x="332" dy="19.2">contexto</tspan></text><polygon points="294.6,387 396.6,418 294.6,449 192.6,418" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="294.6" y="422.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="294.6" dy="0">¿Ventana llena?</tspan></text><rect x="169.8" y="507" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="262.3" y="532.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="262.3" dy="0">Truncar o resumir:</tspan><tspan x="262.3" dy="19.2">se pierde</tspan></text><rect x="148.2" y="626" width="185" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="240.7" y="651" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="240.7" dy="0">Sesión nueva: leer</tspan><tspan x="240.7" dy="19.2">relevo y estado</tspan><tspan x="240.7" dy="19.2">del repositorio</tspan></text><rect x="145.9" y="764" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="229.9" y="789.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="229.9" dy="0">Comprobar que el</tspan><tspan x="229.9" dy="19.2">estado coincide</tspan></text><rect x="132" y="235" width="29" height="24" rx="4" fill="#ffffff"/><text x="146.5" y="250.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="146.5" dy="0">sí</tspan></text><rect x="338" y="235" width="29" height="24" rx="4" fill="#ffffff"/><text x="352.5" y="250.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352.5" dy="0">no</tspan></text><rect x="268.3" y="474" width="29" height="24" rx="4" fill="#ffffff"/><text x="282.8" y="489.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="282.8" dy="0">sí</tspan></text><rect x="436" y="219" width="29" height="24" rx="4" fill="#ffffff"/><text x="450.5" y="234.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450.5" dy="0">no</tspan></text></svg>
