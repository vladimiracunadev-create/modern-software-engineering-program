<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 853 436" width="853" height="436" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Componentes: MTBF y MTTR» y «Fallo real» … «Disponibilidad del sistema» y «Pérdida de datos esperada»</title><desc id="d">Diagrama de flujo con 10 pasos. «Componentes: MTBF y MTTR» lleva a «Disponibilidad por componente». «Disponibilidad por componente» lleva a «Composición: serie y paralelo». «Composición: serie y paralelo» lleva a «Disponibilidad del sistema». «Causa común: despliegue, lote, región» lleva a «Composición: serie y paralelo» (rompe la independencia). «Componentes: MTBF y MTTR» lleva a «Durabilidad: réplicas y tiempo de reparación». «Durabilidad: réplicas y tiempo de reparación» lleva a «Pérdida de datos esperada». «Fallo real» lleva a «Detección: umbral de latidos». «Detección: umbral de latidos» lleva a «Recuperación: RTO y RPO». «Recuperación: RTO y RPO» lleva a «Disponibilidad del sistema». «Recuperación: RTO y RPO» lleva a «Pérdida de datos esperada».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="853" height="436" fill="#ffffff"/><path d="M155,184 L169.0,184.0 Q178,184 178.0,175.0 L178.0,61.5 Q178,52.5 187.0,52.5 L201,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M351,52.5 L415.2,52.5 Q424.2,52.5 424.2,61.5 L424.2,166.5 Q424.2,175.5 433.2,175.5 L497.5,175.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M630.5,175.5 L681,175.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M342.5,147 L350.5,147.0 Q358.5,147 358.5,155.0 L358.5,166.5 Q358.5,175.5 367.5,175.5 L497.5,175.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M155,184 L173.2,184.0 Q182.2,184 182.2,193.0 L182.2,251.5 Q182.2,260.5 191.2,260.5 L209.5,260.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M342.5,260.5 L474.5,260.5 Q483.5,260.5 483.5,269.5 L483.5,305.5 Q483.5,314.5 492.5,314.5 L747.0,314.5 Q756,314.5 756.0,305.5 L756,291" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M146,260.5 L173.2,260.5 Q182.2,260.5 182.2,269.5 L182.2,365.0 Q182.2,374 191.2,374.0 L218.5,374" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M333.5,374 L404.2,374.0 Q413.2,374 413.2,365.0 L413.2,279.0 Q413.2,270 422.2,270.0 L493,270" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M635,270 L649.0,270.0 Q658,270 658.0,261.0 L658.0,184.5 Q658,175.5 667.0,175.5 L681,175.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M635,270 L653.2,270.0 Q658,270 658.0,265.2 L658.0,265.2 Q658,260.5 662.8,260.5 L681,260.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="153.5" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="88.5" y="178.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="88.5" dy="0">Componentes:</tspan><tspan x="88.5" dy="19.2">MTBF y MTTR</tspan></text><rect x="201" y="22" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="276" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="276" dy="0">Disponibilidad</tspan><tspan x="276" dy="19.2">por componente</tspan></text><rect x="497.5" y="135.5" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="564" y="160.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="564" dy="0">Composición:</tspan><tspan x="564" dy="19.2">serie y</tspan><tspan x="564" dy="19.2">paralelo</tspan></text><rect x="681" y="145" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="756" y="170.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="756" dy="0">Disponibilidad</tspan><tspan x="756" dy="19.2">del sistema</tspan></text><rect x="209.5" y="107" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="276" y="132" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="276" dy="0">Causa común:</tspan><tspan x="276" dy="19.2">despliegue,</tspan><tspan x="276" dy="19.2">lote, región</tspan></text><rect x="209.5" y="211" width="133" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="276" y="235.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="276" dy="0">Durabilidad:</tspan><tspan x="276" dy="19.2">réplicas y</tspan><tspan x="276" dy="19.2">tiempo de</tspan><tspan x="276" dy="19.2">reparación</tspan></text><rect x="681" y="230" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="756" y="255.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="756" dy="0">Pérdida de</tspan><tspan x="756" dy="19.2">datos esperada</tspan></text><rect x="31" y="238.5" width="115" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="88.5" y="264.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="88.5" dy="0">Fallo real</tspan></text><rect x="218.5" y="334" width="115" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="276" y="359" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="276" dy="0">Detección:</tspan><tspan x="276" dy="1