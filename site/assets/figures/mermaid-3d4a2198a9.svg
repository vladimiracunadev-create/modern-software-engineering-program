 stroke-width="1.6"/><text x="329" y="901.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="329" dy="0">Contraer: retirar</tspan><tspan x="329" dy="19.2">lo viejo</tspan></text><rect x="339.2" y="619" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="396.7" y="644.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="396.7" dy="0">Paquete de</tspan><tspan x="396.7" dy="19.2">evidencia</tspan></text><rect x="323.8" y="738" width="176" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="411.8" y="763" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="411.8" dy="0">Validador: forma,</tspan><tspan x="411.8" dy="19.2">cruce,</tspan><tspan x="411.8" dy="19.2">verosimilitud</tspan></text><rect x="120.5" y="842.8" width="29" height="24" rx="4" fill="#ffffff"/><text x="135" y="858.7" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="135" dy="0">no</tspan></text><rect x="335" y="838.5" width="29" height="24" rx="4" fill="#ffffff"/><text x="349.5" y="854.4" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="349.5" dy="0">sí</tspan></text></svg>
