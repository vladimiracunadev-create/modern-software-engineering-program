<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 522 959" width="522" height="959" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Cambio integrado» … «Retroceso ensayado» y «Contraer: retirar lo viejo»</title><desc id="d">Diagrama de flujo con 11 pasos. «Cambio integrado» lleva a «Construir y verificar». «Construir y verificar» lleva a «Política y seguridad». «Política y seguridad» lleva a «Preproducción y humo». «Preproducción y humo» lleva a «Canario con criterio de retroceso». «Canario con criterio de retroceso» lleva a «Producción». «Producción» lleva a «Señal sana». «Señal sana» lleva a «Retroceso ensayado» (no). «Señal sana» lleva a «Contraer: retirar lo viejo» (sí). «Construir y verificar» lleva a «Paquete de evidencia». «Política y seguridad» lleva a «Paquete de evidencia». «Preproducción y humo» lleva a «Paquete de evidencia». «Canario con criterio de retroceso» lleva a «Paquete de evidencia». «Paquete de evidencia» lleva a «Validador: forma, cruce, verosimilitud».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="522" height="959" fill="#ffffff"/><path d="M333.9,66 L333.9,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M333.1,185 L333.1,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M331,304 L331,362" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M327.5,423 L327.5,481" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M325.4,561 L325.4,585.2 Q325.4,594.2 316.4,594.2 L256.7,594.2 Q247.7,594.2 247.7,603.2 L247.7,627.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M247.7,671.5 L247.7,700.2 Q247.7,709.2 238.7,709.2 L228.3,709.2 Q219.3,709.2 219.3,718.2 L219.3,747" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M219.3,809 L219.3,817.0 Q219.3,825 211.3,825.0 L123.5,825.0 Q114.5,825 114.5,834.0 L114.5,884.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M219.3,809 L219.3,817.0 Q219.3,825 227.3,825.0 L320.0,825.0 Q329,825 329.0,834.0 L329,876" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M395.9,154.5 L459.2,154.5 Q468.2,154.5 468.2,163.5 L468.2,642.5 Q468.2,649.5 461.2,649.5 L454.2,649.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M274.8,273.5 L245.2,273.5 Q236.2,273.5 236.2,282.5 L236.2,604.5 Q236.2,613.5 245.2,613.5 L316.2,613.5 Q325.2,613.5 325.2,622.5 L325.2,642.5 Q325.2,649.5 332.2,649.5 L339.2,649.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M409.2,392.5 L416.2,392.5 Q423.2,392.5 423.2,399.5 L423.2,596.0 Q423.2,605 414.2,605.0 L403.7,605.0 Q396.7,605 396.7,612.0 L396.7,619" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M325.4,561 L325.4,581.0 Q325.4,590 334.4,590.0 L387.7,590.0 Q396.7,590 396.7,599.0 L396.7,619" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M396.7,680 L396.7,701.5 Q396.7,709 404.2,709.0 L404.2,709.0 Q411.8,709 411.8,716.5 L411.8,738" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="249.9" y="22" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="333.9" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="333.9" dy="0">Cambio integrado</tspan></text><rect x="271.9" y="124" width="124" height="61" rx="10" fill="#dff1ee" stroke="#08