<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 1097" width="480" height="1097" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Módulo subido» … «Informe firmado ML-DSA»</title><desc id="d">Diagrama de flujo con 11 pasos. «Módulo subido» lleva a «Validador: importaciones permitidas». «Validador: importaciones permitidas» lleva a «Registro: rechazado y motivo» (rechaza). «Validador: importaciones permitidas» lleva a «Módulo compilado + huella SHA-256» (acepta). «Petición» lleva a «Instancia nueva: combustible y memoria acotados». «Módulo compilado + huella SHA-256» lleva a «Instancia nueva: combustible y memoria acotados». «Instancia nueva: combustible y memoria acotados» lleva a «Resultado». «Resultado» lleva a «Respuesta» (ok). «Resultado» lleva a «Política: aviso por defecto» (trampa o combustible). «Respuesta» lleva a «Registro: rechazado y motivo». «Política: aviso por defecto» lleva a «Registro: rechazado y motivo». «Registro: rechazado y motivo» lleva a «Cadena de resúmenes». «Cadena de resúmenes» lleva a «Informe firmado ML-DSA».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="480" height="1097" fill="#ffffff"/><path d="M151.5,66 L151.5,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M80.5,164 L33.0,164.0 Q24,164 24.0,173.0 L24.0,797.5 Q24,806.5 33.0,806.5 L177.5,806.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M151.5,204 L151.5,212.0 Q151.5,220 143.5,220.0 L139.5,220.0 Q130.5,220 130.5,229.0 L130.5,262" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M306,314.5 L306.0,338.8 Q306,347.8 297.0,347.8 L247.0,347.8 Q238,347.8 238.0,356.8 L238,381" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M130.5,323 L130.5,343.0 Q130.5,352 139.5,352.0 L229.0,352.0 Q238,352 238.0,361.0 L238,381" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M238,461 L238.0,481.0 Q238,490 247.0,490.0 L248.4,490.0 Q257.4,490 257.4,499.0 L257.4,519" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M257.4,581 L257.4,589.0 Q257.4,597 249.4,597.0 L191.3,597.0 Q182.3,597 182.3,606.0 L182.3,665.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M257.4,581 L257.4,589.0 Q257.4,597 265.4,597.0 L340.3,597.0 Q349.3,597 349.3,606.0 L349.3,657" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M182.3,709.5 L182.3,733.8 Q182.3,742.8 191.3,742.8 L261.0,742.8 Q270,742.8 270.0,751.8 L270,776" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M349.3,718 L349.3,738.0 Q349.3,747 340.3,747.0 L279.0,747.0 Q270,747 270.0,756.0 L270,776" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M271.7,837 L271.7,895" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M274.2,956 L274.2,1014" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="80.5" y="22" width="142" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="151.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="151.5" dy="0">Módulo subido</tspan></text><rect x="80.5" y="124" width="142" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="151.5" y="149" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="151.5" dy="0">Validador:</tspan><tspan x="151.5" dy="19.2">importaciones</tspan><tspan x="151.5" dy="19.2">permitidas</tspan></text><rect x="177.5" y="776" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="270" y="801.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="270" dy="0">Registro:</tspan><tspan x="270" dy="19.2">rechazado y motivo</tspan></text><rect x="38" y="262" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="130.5" y="287.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="130.5" dy="0">Módulo compilado +</tspan><tspan x="130.5" dy="19.2">huella SHA-256</tspan></text><rect x="257" y="270.5" width="98" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="306" y="296.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="306" dy="0">Petición</tspan></text><rect x="154" y="381" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="238" y="406" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="238" dy="0">Instancia nueva:</tspan><tspan x="238" dy="19.2">combustible y</tspan><tspan x="238" dy="19.2">memoria acotados</tspan></text><polygon points="257.4,519 321.9,550 257.4,581 192.9,550" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="257.4" y="554.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="257.4" dy="0">Resultado</tspan></text><rect x="128.8" y="665.5" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="182.3" y="691.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="182.3" dy="0">Respuesta</tspan></text><rect x="269.8" y="657" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="349.3" y="682.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="349.3" dy="0">Política: aviso</tspan><tspan x="349.3" dy="19.2">por defecto</tspan></text><rect x="219.8" y="895" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="273.3" y="920.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="273.3" dy="0">Cadena de</tspan><tspan x="273.3" dy="19.2">resúmenes</tspan></text><rect x="195.6" y="1014" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="275.1" y="1039.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="275.1" dy="0">Informe firmado</tspan><tspan x="275.1" dy="19.2">ML-DSA</tspan></text><rect x="66.3" y="778.5" width="69" height="24" rx="4" fill="#ffffff"/><text x="100.8" y="794.4" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="100.8" dy="0">rechaza</tspan></text><rect x="136.5" y="229" width="61" height="24" rx="4" fill="#ffffff"/><text x="167" y="244.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="167" dy="0">acepta</tspan></text><rect x="188.3" y="619.2" width="29" height="24" rx="4" fill="#ffffff"/><text x="202.8" y="635.1" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="202.8" dy="0">ok</tspan></text><rect x="355.3" y="606" width="102" height="42" rx="4" fill="#ffffff"/><text x="406.3" y="621.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="406.3" dy="0">trampa o</tspan><tspan x="406.3" dy="17.92">combustible</tspan></text></svg>
