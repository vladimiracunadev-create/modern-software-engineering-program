<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 771 105" width="771" height="105" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «🎯 Unidad funcional» … «📈 Rebote»</title><desc id="d">Diagrama de flujo con 5 pasos. «🎯 Unidad funcional» lleva a «🧠 Energía». «🧠 Energía» lleva a «🛠️ Carbono». «🛠️ Carbono» lleva a «🔎 Cambio». «🔎 Cambio» lleva a «📈 Rebote».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="771" height="105" fill="#ffffff"/><path d="M129,52.5 L175,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M288,52.5 L334,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M447,52.5 L493,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M598,52.5 L644,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="22" width="107" height="61" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="75.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="75.5" dy="0">🎯 Unidad</tspan><tspan x="75.5" dy="19.2">funcional</tspan></text><rect x="175" y="30.5" width="113" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="231.5" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="231.5" dy="0">🧠 Energía</tspan></text><rect x="334" y="30.5" width="113" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="390.5" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="390.5" dy="0">🛠️ Carbono</tspan></text><rect x="493" y="30.5" width="105" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="545.5" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="545.5" dy="0">🔎 Cambio</tspan></text><rect x="644" y="30.5" width="105" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="696.5" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="696.5" dy="0">📈 Rebote</tspan></text></svg>
