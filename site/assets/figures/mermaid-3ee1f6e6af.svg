<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 901 332" width="901" height="332" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Operación del servicio» … «Escalera: lectura obsoleta, cola de escrituras, rechazo», «Cola acotada y prioridad» y «Límites declarados»</title><desc id="d">Diagrama de flujo con 10 pasos. «Operación del servicio» lleva a «Garantía declarada». «Garantía declarada» lleva a «Presupuesto de tiempo y reintentos». «Presupuesto de tiempo y reintentos» lleva a «Falla una dependencia». «Falla una dependencia» lleva a «Escalera: lectura obsoleta, cola de escrituras, rechazo». «Presupuesto de tiempo y reintentos» lleva a «Sobrecarga». «Sobrecarga» lleva a «Cola acotada y prioridad». «Garantía declarada» lleva a «Prueba para cada promesa». «Prueba para cada promesa» lleva a «Revisión cruzada». «Revisión cruzada» lleva a «Límites declarados».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="901" height="332" fill="#ffffff"/><path d="M164,166 L210,166" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M317,166 L331.0,166.0 Q340,166 340.0,157.0 L340.0,132.5 Q340,123.5 349.0,123.5 L363,123.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M513,123.5 L527.0,123.5 Q536,123.5 536.0,114.5 L536.0,90.0 Q536,81 545.0,81.0 L559,81" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M683,81 L729,81" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M513,123.5 L529.2,123.5 Q538.2,123.5 538.2,132.5 L538.2,185.5 Q538.2,194.5 547.2,194.5 L563.5,194.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M678.5,194.5 L729,194.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M317,166 L335.2,166.0 Q344.2,166 344.2,175.0 L344.2,209.0 Q344.2,218 353.2,218.0 L371.5,218" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M504.5,218 L529.2,218.0 Q538.2,218 538.2,227.0 L538.2,270.5 Q538.2,279.5 547.2,279.5 L572,279.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M670,279.5 L746.5,279.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="135.5" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="93" y="160.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="93" dy="0">Operación del</tspan><tspan x="93" dy="19.2">servicio</tspan></text><rect x="210" y="135.5" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="263.5" y="160.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="263.5" dy="0">Garantía</tspan><tspan x="263.5" dy="19.2">declarada</tspan></text><rect x="363" y="83.5" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="438" y="108.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="438" dy="0">Presupuesto de</tspan><tspan x="438" dy="19.2">tiempo y</tspan><tspan x="438" dy="19.2">reintentos</tspan></text><rect x="559" y="50.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="621" y="75.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="621" dy="0">Falla una</tspan><tspan x="621" dy="19.2">dependencia</tspan></text><rect x="729" y="22" width="150" height="118" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="804" y="46.8" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="804" dy="0">Escalera:</tspan><tspan x="804" dy="19.2">lectura</tspan><tspan x="804" dy="19.2">obsoleta, cola</tspan><tspan x="804" dy="19.2">de escrituras,</tspan><tspan x="804" dy="19.2">rechazo</tspan></text><rect x="563.5" y="172.5" width="115" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="621" y="198.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="621" dy="0">Sobrecarga</tspan></text><rect x="729" y="164" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="804" y="189.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="804" dy="0">Cola acotada y</tspan><tspan x="804" dy="19.2">prioridad</tspan></text><rect x="371.5" y="187.5" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="438" y="212.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="438" dy="0">Prueba para</tspan><tspan x="438" dy="19.2">cada promesa</tspan></text><rect x="572" y="249" width="98" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="621" y="274.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="621" dy="0">Revisión</tspan><tspan x="621" dy="19.2">cruzada</tspan></text><rect x="746.5" y="249" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="804" y="274.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="804" dy="0">Límites</tspan><tspan x="804" dy="19.2">declarados</tspan></text></svg>
