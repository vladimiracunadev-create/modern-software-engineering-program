<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 765 262" width="765" height="262" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Escala y dependencia» … «Nuevos riesgos»</title><desc id="d">Diagrama de flujo con 7 pasos. «Escala y dependencia» lleva a «Coordinación difícil». «Coordinación difícil» lleva a «Retraso, costo, defectos». «Retraso, costo, defectos» lleva a «Modularidad, proceso, revisión». «Modularidad, proceso, revisión» lleva a «Iteración y automatización». «Iteración y automatización» lleva a «Entrega y operación continuas». «Entrega y operación continuas» lleva a «Nuevos riesgos». «Nuevos riesgos» lleva a «Modularidad, proceso, revisión».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="765" height="262" fill="#ffffff"/><path d="M146,62 L200.5,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M333.5,62 L388,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M547,62 L601.5,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M668,102 L668,169.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M593,200 L521,200" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M414,200 L342,200" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M267,178 L267.0,115.5 Q267,106.5 276.0,106.5 L578.5,106.5 Q587.5,106.5 587.5,97.5 L587.5,69.0 Q587.5,62 594.5,62.0 L601.5,62" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="31.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="84" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="84" dy="0">Escala y</tspan><tspan x="84" dy="19.2">dependencia</tspan></text><rect x="200.5" y="31.5" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="267" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="267" dy="0">Coordinación</tspan><tspan x="267" dy="19.2">difícil</tspan></text><rect x="388" y="31.5" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="467.5" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="467.5" dy="0">Retraso, costo,</tspan><tspan x="467.5" dy="19.2">defectos</tspan></text><rect x="601.5" y="22" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="668" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="668" dy="0">Modularidad,</tspan><tspan x="668" dy="19.2">proceso,</tspan><tspan x="668" dy="19.2">revisión</tspan></text><rect x="593" y="169.5" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="668" y="194.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="668" dy="0">Iteración y</tspan><tspan x="668" dy="19.2">automatización</tspan></text><rect x="414" y="160" width="107" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="467.5" y="185" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="467.5" dy="0">Entrega y</tspan><tspan x="467.5" dy="19.2">operación</tspan><tspan x="467.5" dy="19.2">continuas</tspan></text><rect x="192" y="178" width="150" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="267" y="204.2" font-size="15"