<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 899 105" width="899" height="105" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «🎯 Estado estable» … «📈 Aprendizaje»</title><desc id="d">Diagrama de flujo con 5 pasos. «🎯 Estado estable» lleva a «🧠 Hipótesis». «🧠 Hipótesis» lleva a «🛠️ Experimento». «🛠️ Experimento» lleva a «🔎 Contención». «🔎 Contención» lleva a «📈 Aprendizaje».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="899" height="105" fill="#ffffff"/><path d="M127,52.5 L173,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M304,52.5 L350,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M498,52.5 L544,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M683,52.5 L729,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="22" width="105" height="61" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="74.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="74.5" dy="0">🎯 Estado</tspan><tspan x="74.5" dy="19.2">estable</tspan></text><rect x="173" y="30.5" width="131" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="238.5" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="238.5" dy="0">🧠 Hipótesis</tspan></text><rect x="350" y="30.5" width="148" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="424" y="56.7" font-size="15" text-anchor="m