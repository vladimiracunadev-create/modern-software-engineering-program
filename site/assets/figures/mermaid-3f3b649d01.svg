<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 613 224" width="613" height="224" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Runtime e implementación» … «Actualización / rollback»</title><desc id="d">Diagrama de flujo con 5 pasos. «Runtime e implementación» lleva a «Resolución por PATH». «Resolución por PATH» lleva a «Gestor de versiones». «Gestor de versiones» lleva a «Compatibilidad / sintaxis». «Compatibilidad / sintaxis» lleva a «Actualización / rollback». «Actualización / rollback» lleva a «Runtime e implementación» (fallo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="613" height="224" fill="#ffffff"/><path d="M172,52.5 L222.5,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M372.5,52.5 L453.5,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M507,83 L507,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M423,171.5 L377,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M218,171.5 L106.0,171.5 Q97,171.5 97.0,162.5 L97,83" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="22" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="97" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="97" dy="0">Runtime e</tspan><tspan x="97" dy="19.2">implementación</tspan></text><rect x="222.5" y="22" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="297.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="297.5" dy="0">Resolución por</tspan><tspan x="297.5" dy="19.2">PATH</tspan></text><rect x="453.5" y="22" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="507" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="507" dy="0">Gestor de</tspan><tspan x="507" dy="19.2">versiones</tspan></text><rect x="423" y="141" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="507" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="507" dy="0">Compatibilidad /</tspan><tspan x="507" dy="19.2">sintaxis</tspan></text><rect x="218" y="141" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="297.5" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="297.5" dy="0">Actualización /</tspan><tspan x="297.5" dy="19.2">rollback</tspan></text><rect x="82.4" y="143.5" width="126" height="24" rx="4" fill="#ffffff"/><text x="145.4" y="159.4" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="145.4" dy="0">fallo o cambio</tspan></text></svg>
