<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 882 105" width="882" height="105" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «🎯 Tarea de usuario» … «📈 Recuperación»</title><desc id="d">Diagrama de flujo con 5 pasos. «🎯 Tarea de usuario» lleva a «🧠 Estado». «🧠 Estado» lleva a «🛠️ Interacción». «🛠️ Interacción» lleva a «🔎 Medición». «🔎 Medición» lleva a «📈 Recuperación».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="882" height="105" fill="#ffffff"/><path d="M144,52.5 L190,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M295,52.5 L341,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M489,52.5 L535,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M657,52.5 L703,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="22" width="122" height="61" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="83" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="83" dy="0">🎯 Tarea de</tspan><tspan x="83" dy="19.2">usuario</tspan></text><rect x="190" y="30.5" width="105" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="242.5" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="242.5" dy="0">🧠 Estado</tspan></text><rect x="341" y="30.5" width="148" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="415" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="415" dy="0">🛠️ Interacción</tspan></text><rect x="535" y="30.5" width="122" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="596" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="596" dy="0">🔎 Medición</tspan></text><rect x="703" y="30.5" width="157" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="781.5" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="781.5" dy="0">📈 Recuperación</tspan></text></svg>
