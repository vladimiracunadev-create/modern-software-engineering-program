<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 452 836" width="452" height="836" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Cambio del agente» … «Aceptado» y «Rechazado con compuerta y motivo»</title><desc id="d">Diagrama de flujo con 9 pasos. «Cambio del agente» lleva a «Menú único». «Menú único» lleva a «Sintaxis». «Sintaxis» lleva a «Estilo». «Estilo» lleva a «Secretos». «Secretos» lleva a «Pruebas». «Pruebas» lleva a «Pruebas no debilitadas». «Pruebas no debilitadas» lleva a «Aceptado». «Sintaxis» lleva a «Rechazado con compuerta y motivo» (falla). «Estilo» lleva a «Rechazado con compuerta y motivo» (falla). «Secretos» lleva a «Rechazado con compuerta y motivo» (falla). «Pruebas» lleva a «Rechazado con compuerta y motivo» (falla). «Pruebas no debilitadas» lleva a «Rechazado con compuerta y motivo» (falla).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="452" height="836" fill="#ffffff"/><path d="M183,66 L183,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M182.6,168 L182.6,226" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M181.7,270 L181.7,328" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M180.5,372 L180.5,430" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M179,474 L179,532" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M177.4,576 L177.4,634" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M176.6,695 L176.6,719.2 Q1