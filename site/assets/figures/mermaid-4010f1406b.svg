<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 561 362" width="561" height="362" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Petición o síntoma» … «Brief con evidencia»</title><desc id="d">Diagrama de flujo con 9 pasos. «Petición o síntoma» lleva a «Problema y necesidad». «Problema y necesidad» lleva a «Actores y contexto». «Actores y contexto» lleva a «Evidencia cualitativa». «Evidencia cualitativa» lleva a «Hipótesis falsables». «Hipótesis falsables» lleva a «Propuesta, segmento y alternativas». «Propuesta, segmento y alternativas» lleva a «Experimento y prioridad». «Experimento y prioridad» lleva a «Protocolo ético y abandono». «Protocolo ético y abandono» lleva a «Brief con evidencia». «Brief con evidencia» lleva a «Petición o síntoma» (nueva evidencia).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="561" height="362" fill="#ffffff"/><path d="M150.5,52.5 L232,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M347,52.5 L423.5,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M477,83 L477,150.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M415,181 L343,181" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M236,181 L159.5,181" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M93,221 L93,279" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M164,309.5 L210,309.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M369,309.5 L423.5,309.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M477,279 L477.0,234.5 Q477,225.5 468.0,225.5 L182.5,225.5 Q173.5,225.5 173.5,216.5 L173.5,106.0 Q173.5,97 164.5,97.0 L100.0,97.0 Q93,97 93.0,90.0 L93,83" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="35.5" y="22" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="93" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="93" dy="0">Petición o</tspan><tspan x="93" dy="19.2">síntoma</tspan></text><rect x="232" y="22" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="289.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="289.5" dy="0">Problema y</tspan><tspan x="289.5" dy="19.2">necesidad</tspan></text><rect x="423.5" y="22" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="477" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="477" dy="0">Actores y</tspan><tspan x="477" dy="19.2">contexto</tspan></text><rect x="415" y="150.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="477" y="175.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="477" dy="0">Evidencia</tspan><tspan x="477" dy="19.2">cualitativa</tspan></text><rect x="236" y="150.5" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="289.5" y="175.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="289.5" dy="0">Hipótesis</tspan><tspan x="289.5" dy="19.2">falsables</tspan></text><rect x="26.5" y="141" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="93" y="166" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="93" dy="0">Propuesta,</tspan><tspan x="93" dy="19.2">segmento y</tspan><tspan x="93" dy="19.2">alternativas</tspan></text><rect x="22" y="279" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="93" y="304.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="93" dy="0">Experimento y</tspan><tspan x="93" dy="19.2">prioridad</tspan></text><rect x="210" y="279" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="289.5" y="304.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="289.5" dy="0">Protocolo ético</tspan><tspan x="289.5" dy="19.2">y abandono</tspan></text><rect x="423.5" y="279" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="477" y="304.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="477" dy="0">Brief con</tspan><tspan x="477" dy="19.2">evidencia</tspan></text><rect x="282.2" y="229.5" width="86" height="42" rx="4" fill="#ffffff"/><text x="325.2" y="245.4" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="325.2" dy="0">nueva</tspan><tspan x="325.2" dy="17.92">evidencia</tspan></text></svg>
