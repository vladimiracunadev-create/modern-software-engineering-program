<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 552 243" width="552" height="243" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Contrato / corpus de comparación» … «Reproducción / revisión»</title><desc id="d">Diagrama de flujo con 5 pasos. «Contrato / corpus de comparación» lleva a «Oráculo / propiedades». «Oráculo / propiedades» lleva a «Métricas interpretadas». «Métricas interpretadas» lleva a «Informe de decisión». «Informe de decisión» lleva a «Reproducción / revisión». «Reproducción / revisión» lleva a «Contrato / corpus de comparación» (fallo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="552" height="243" fill="#ffffff"/><path d="M146,62 L205,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M329,62 L388,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M459,92.5 L459,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M401.5,190.5 L342,190.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M192,190.5 L93.0,190.5 Q84,190.5 84.0,181.5 L84,102" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="22" width="124" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="84" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="84" dy="0">Contrato /</tspan><tspan x="84" dy="19.2">corpus de</tspan><tspan x="84" dy="19.2">comparación</tspan></text><rect x="205" y="31.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="267" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="267" dy="0">Oráculo /</tspan><tspan x="267" dy="19.2">propiedades</tspan></text><rect x="388" y="31.5" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="459" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="459" dy="0">Métricas</tspan><tspan x="459" dy="19.2">interpretadas</tspan></text><rect x="401.5" y="160" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="459" y="185.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="459" dy="0">Informe de</tspan><tspan x="459" dy="19.2">decisión</tspan></text><rect x="192" y="160" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="267" y="185.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="267" dy="0">Reproducción /</tspan><tspan x="267" dy="19.2">revisión</tspan></text><rect x="53.4" y="162.5" width="126" height="24" rx="4" fill="#ffffff"/><text x="116.4" y="178.4" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="116.4" dy="0">fallo o cambio</tspan></text></svg>
