<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 88" width="830" height="88" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «🎯 Contexto» … «📈 Auditoría»</title><desc id="d">Diagrama de flujo con 5 pasos. «🎯 Contexto» lleva a «🧠 Riesgo». «🧠 Riesgo» lleva a «🛠️ Control». «🛠️ Control» lleva a «🔎 Evidencia». «🔎 Evidencia» lleva a «📈 Auditoría».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="830" height="88" fill="#ffffff"/><path d="M144,44 L190,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M295,44 L341,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M454,44 L500,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M631,44 L677,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="22" width="122" height="44" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="83" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="83" dy="0">🎯 Contexto</tspan></text><rect x="190" y="22" width="105" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="242.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="242.5" dy="0">🧠 Riesgo</tspan></text><rect x="341" y="22" width="113" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="397.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="397.5" dy="0">🛠️ Control</tspan></text><rect x="500" y="22" width="131" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="565.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="565.5" dy="0">🔎 Evidencia</tspan></text><rect x="677" y="22" width="131" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="742.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="742.5" dy="0">📈 Auditoría</tspan></text></svg>
