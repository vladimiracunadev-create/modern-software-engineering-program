<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 473 1022" width="473" height="1022" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Demanda por minuto» … «Decisión y revisión»</title><desc id="d">Diagrama de flujo con 10 pasos. «Demanda por minuto» lleva a «Capacidad necesaria». «Capacidad necesaria» lleva a «Política: fija, reactiva, programada». «Política: fija, reactiva, programada» lleva a «Instancias listas tras el arranque». «Instancias listas tras el arranque» lleva a «Demanda atendida o perdida». «Instancias listas tras el arranque» lleva a «Instancias-hora pagadas». «Instancias-hora pagadas» lleva a «Tarifa: bajo demanda o comprometida». «Tarifa: bajo demanda o comprometida» lleva a «Costo total». «Demanda atendida o perdida» lleva a «Nivel de servicio». «Costo total» lleva a «Decisión y revisión». «Nivel de servicio» lleva a «Decisión y revisión».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="473" height="1022" fill="#ffffff"/><path d="M226.7,66 L226.7,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M226.4,185 L226.4,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M225.8,363 L225.8,421" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M225.4,482 L225.4,502.0 Q225.4,511 216.4,511.0 L131.2,511.0 Q122.2,511 122.2,520.0 L122.2,540" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M225.4,482 L225.4,502.0 Q225.4,511 234.4,511.0 L319.2,511.0 Q328.2,511 328.2,520.0 L328.2,540" fill="none" stroke="