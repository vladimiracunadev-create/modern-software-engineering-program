<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 860" width="448" height="860" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Cambios inyectados» … «Cambios sin detectar: capa adicional»</title><desc id="d">Diagrama de flujo con 9 pasos. «Registro de metadatos» lleva a «Control de siete reglas». «Plataforma construida: raw, staging, mart» lleva a «Control de siete reglas». «Control de siete reglas» lleva a «¿Pasa?». «¿Pasa?» lleva a «Se publica y se registra evidencia» (sí). «¿Pasa?» lleva a «Se detiene y avisa al dueño con regla y conjunto» (no). «Cambios inyectados» lleva a «Plataforma construida: raw, staging, mart». «Cambios inyectados» lleva a «Registro de metadatos». «Se detiene y avisa al dueño con regla y conjunto» lleva a «Matriz mutación por regla». «Se publica y se registra evidencia» lleva a «Matriz mutación por regla». «Matriz mutación por regla» lleva a «Cambios sin detectar: capa adicional».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="448" height="860" fill="#ffffff"/><path d="M134,194.5 L134.0,219.2 Q134,228.2 143.0,228.2 L215.0,228.2 Q224,228.2 224.0,237.2 L224,262" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M314,204 L314.0,224.0 Q314,233 305.0,233.0 L233.0,233.0 Q224,233 224.0,242.0 L224,262" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M224,323 L224,381" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M224,443 L224.0,451.0 Q224,459 216.0,459.0 L123.5,459.0 Q114.5,459 114.5,468.0 L114.5,510.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M224,443 L224.0,451.0 Q224,459 232.0,459.0 L324.5,459.0 Q333.5,459 333.5,468.0 L333.5,501" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M224,66 L224.0,86.0 Q224,95 233.0,95.0 L305.0,95.0 Q314,95 314.0,104.0 L314,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M224,66 L224.0,90.8 Q224,99.8 215.0,99.8 L143.0,99.8 Q134,99.8 134.0,108.8 L134,133.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M333.5,581 L333.5,601.0 Q333.5,610 324.5,610.0 L233.0,610.0 Q224,610 224.0,619.0 L224,639" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M114.5,571.5 L114.5,596.2 Q114.5,605.2 123.5,605.2 L215.0,605.2 Q224,605.2 224.0,614.2 L224,639" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M224,700 L224,758" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="72" y="133.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="134" y="158.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="134" dy="0">Registro de</tspan><tspan x="134" dy="19.2">metadatos</tspan></text><rect x="140" y="262" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="224" y="287.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="224" dy="0">Control de siete</tspan><tspan x="224" dy="19.2">reglas</tspan></text><rect x="230" y="124" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="314" y="149" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="314" dy="0">Plataforma</tspan><tspan x="314" dy="19.2">construida: raw,</tspan><tspan x="314" dy="19.2">staging, mart</tspan></text><polygon points="224,381 269.5,412 224,443 178.5,412" fill