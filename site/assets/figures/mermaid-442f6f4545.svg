<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 613 362" width="613" height="362" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Sistema antiguo» … «Disposición segura de soportes»</title><desc id="d">Diagrama de flujo con 9 pasos. «Sistema antiguo» lleva a «Inventario de consumidores». «Inventario de consumidores» lleva a «Observar uso un ciclo completo». «Observar uso un ciclo completo» lleva a «Anunciar fecha de retiro». «Anunciar fecha de retiro» lleva a «Congelar escrituras». «Congelar escrituras» lleva a «Apagar lectura gradualmente». «Apagar lectura gradualmente» lleva a «Archivar con suma y prueba de restauración». «Archivar con suma y prueba de restauración» lleva a «Aplicar reglas de retención». «Aplicar reglas de retención» lleva a «Disposición segura de soportes». «Apagar lectura gradualmente» lleva a «Observar uso un ciclo completo» (aparece un consumidor). «Archivar con suma y prueba de restauración» lleva a «Archivar con suma y prueba de restauración» (restauración falla).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="613" height="362" fill="#ffffff"/><path d="M185.5,52.5 L240,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M382,52.5 L432,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M511.5,83 L511.5,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M436.5,171.5 L368.5,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M253.5,171.5 L181,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M106,202 L106,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M190,300 L236,300" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M386,300 L449.5,300" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M106,141 L106.0,106.0 Q106,97 115.0,97.0 L409.0,97.0 Q418,97 418.0,88.0 L418.0,59.5 Q418,52.5 425.0,52.5 L432,52.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><path d="M176,260 L176.0,247.0 Q176,238 185.0,238.0 L199.0,238.0 Q208,238 208.0,247.0 L208.0,291.0 Q208,300 199.0,300.0 L190,300" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="26.5" y="30.5" width="159" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Sistema antiguo</tspan></text><rect x="240" y="22" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="311" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="311" dy="0">Inventario de</tspan><tspan x="311" dy="19.2">consumidores</tspan></text><rect x="432" y="22" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="511.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="511.5" dy="0">Observar uso un</tspan><tspan x="511.5" dy="19.2">ciclo completo</tspan></text><rect x="436.5" y="141" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="511.5" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="511.5" dy="0">Anunciar fecha</tspan><tspan x="511.5" dy="19.2">de retiro</tspan></text><rect x="253.5" y="141" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="311" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="311" dy="0">Congelar</tspan><tspan x="311" dy="19.2">escrituras</tspan></text><rect x="31" y="141" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Apagar lectura</tspan><tspan x="106" dy="19.2">gradualmente</tspan></text><rect x="22" y="260" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="285" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Archivar con</tspan><tspan x="106" dy="19.2">suma y prueba de</tspan><tspan x="106" dy="19.2">restauración</tspan></text><rect x="236" y="269.5" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="311" y="294.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="311" dy="0">Aplicar reglas</tspan><tspan x="311" dy="19.2">de retención</tspan></text><rect x="449.5" y="260" width="124" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="511.5" y="285" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="511.5" dy="0">Disposición</tspan><tspan x="511.5" dy="19.2">segura de</tspan><tspan x="511.5" dy="19.2">soportes</tspan></text><rect x="112" y="93.6" width="94" height="42" rx="4" fill="#ffffff"/><text x="159" y="109.5" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="159" dy="0">aparece un</tspan><tspan x="159" dy="17.92">consumidor</tspan></text><rect x="214" y="223.2" width="110" height="42" rx="4" fill="#ffffff"/><text x="269" y="239.1" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="269" dy="0">restauración</tspan><tspan x="269" dy="17.