<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 368 531" width="368" height="531" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Petición» y «Acción sin conexión» … «Respuesta»</title><desc id="d">Diagrama de flujo con 9 pasos. «Petición» lleva a «Service worker». «Service worker» lleva a «Estrategia». «Estrategia» lleva a «Caché» (caché). «Estrategia» lleva a «Red» (red). «Caché» lleva a «Respuesta». «Red» lleva a «Respuesta». «Acción sin conexión» lleva a «Cola local». «Cola local» lleva a «Servidor» (con red). «Servidor» lleva a «Cola local» (confirmación perdida).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="368" height="531" fill="#ffffff"/><path d="M104.6,74.5 L104.6,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M107.9,185 L107.9,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M111.3,305 L111.3,313.0 Q111.3,321 103.3,321.0 L69.0,321.0 Q60,321 60.0,330.0 L60,363" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M111.3,305 L111.3,313.0 Q111.3,321 119.3,321.0 L161.0,321.0 Q170,321 170.0,330.0 L170,363" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M60,407 L60.0,427.0 Q60,436 69.0,436.0 L108.0,436.0 Q117,436 117.0,445.0 L117,465" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M170,407 L170.0,427.0 Q170,436 161.0,436.0 L126.0,436.0 Q117,436 117.0,445.0 L117,465" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M271.1,83 L2