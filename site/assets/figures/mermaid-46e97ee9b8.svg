<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 551 262" width="551" height="262" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Especificación el modelo de decisión diagnóstica» … «Prueba y diagnóstico»</title><desc id="d">Diagrama de flujo con 6 pasos. «Especificación el modelo de decisión diagnóstica» lleva a «Valores y contratos». «Valores y contratos» lleva a «Control y transformación». «Control y transformación» lleva a «Efectos en la frontera». «Efectos en la frontera» lleva a «Salida observable». «Salida observable» lleva a «Prueba y diagnóstico». «Prueba y diagnóstico» lleva a «Especificación el modelo de decisión diagnóstica» (defecto o caso nuevo).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="551" height="262" fill="#ffffff"/><path d="M172,71.5 L222,71.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M329,71.5 L379,71.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M454,102 L454,179" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M383,209.5 L333,209.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M218,209.5 L159,209.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M97,179 L97,121" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="22" width="150" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="97" y="46.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="97" dy="0">Especificación</tspan><tspan x="97" dy="19.2">el modelo de</tspan><tspan x="97" dy="19.2">decisión</tspan><tspan x="97" dy="19.2">diagnóstica</tspan></text><rect x="222" y="41" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="275.5" y="66.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="275.5" dy="0">Valores y</tspan><tspan x="275.5" dy="19.2">contratos</tspan></text><rect x="379" y="41" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="454" y="66.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="454" dy="0">Control y</tspan><tspan x="454" dy="19.2">transformación</tspan></text><rect x="383" y="179" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="454" y="204.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="454" dy="0">Efectos en la</tspan><tspan x="454" dy="19.2">frontera</tspan></text><rect x="218" y="179" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="275.5" y="204.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="275.5" dy="0">Salida</tspan><tspan x="275.5" dy="19.2">observable</tspan></text><rect x="35" y="179" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="97" y="204.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="97" dy="0">Prueba y</tspan><tspan x="97" dy="19.2">diagnóstico</tspan></text><rect x="103" y="129" width="126" height="42" rx="4" fill="#ffffff"/><text x="166" y="144.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="166" dy="0">defecto o caso</tspan><tspan x="166" dy="17.92">nuevo</tspan></text></svg>
