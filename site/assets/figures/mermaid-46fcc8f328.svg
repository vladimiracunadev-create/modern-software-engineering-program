<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 622 362" width="622" height="362" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Brief de la Parte 10» … «Caso de viabilidad»</title><desc id="d">Diagrama de flujo con 9 pasos. «Brief de la Parte 10» lleva a «Modelo de negocio y costos». «Modelo de negocio y costos» lleva a «Resultados y métricas». «Resultados y métricas» lleva a «Telemetría y consentimiento». «Telemetría y consentimiento» lleva a «Experimentos y causalidad». «Experimentos y causalidad» lleva a «Metas, guardas y costo por resultado». «Metas, guardas y costo por resultado» lleva a «Cartera y reversibilidad». «Cartera y reversibilidad» lleva a «Árbol de métricas». «Árbol de métricas» lleva a «Caso de viabilidad». «Caso de viabilidad» lleva a «Modelo de negocio y costos» (nueva evidencia).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="622" height="362" fill="#ffffff"/><path d="M168,52.5 L236,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M404,52.5 L458.5,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M525,83 L525,150.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M450,181 L395,181" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M245,181 L190,181" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M106,221 L106,279" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M181,309.5 L271,309.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M369,309.5 L467.5,309.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M525,279 L525.0,234.5 Q525,225.5 516.0,225.5 L418.0,225.5 Q409,225.5 409.0,216.5 L409.0,106.0 Q409,97 400.0,97.0 L327.0,97.0 Q320,97 320.0,90.0 L320,83" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="44" y="22" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Brief de la</tspan><tspan x="106" dy="19.2">Parte 10</tspan></text><rect x="236" y="22" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="320" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="320" dy="0">Modelo de</tspan><tspan x="320" dy="19.2">negocio y costos</tspan></text><rect x="458.5" y="22" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="525" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="525" dy="0">Resultados y</tspan><tspan x="525" dy="19.2">métricas</tspan></text><rect x="450" y="150.5" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="525" y="175.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="525" dy="0">Telemetría y</tspan><tspan x="525" dy="19.2">consentimiento</tspan></text><rect x="245" y="150.5" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="320" y="175.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="320" dy="0">Experimentos y</tspan><tspan x="320" dy="19.2">causalidad</tspan></text><rect x="22" y="141" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="166" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Metas, guardas y</tspan><tspan x="106" dy="19.2">costo por</tspan><tspan x="106" dy="19.2">resultado</tspan></text><rect x="31" y="279" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="304.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Cartera y</tspan><tspan x="106" dy="19.2">reversibilidad</tspan></text><rect x="271" y="279" width="98" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="320" y="304.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="320" dy="0">Árbol de</tspan><tspan x="320" dy="19.2">métricas</tspan></text><rect x="467.5" y="279" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="525" y="304.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="525" dy="0">Caso de</tspan><tspan x="525" dy="19.2">viabilidad</tspan></text><rect x="415" y="101.7" width="86" height="42" rx="4" fill="#ffffff"/><text x="458" y="117.6" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="458" dy="0">nueva</tspan><tspan x="458" dy="17.92">evidencia</tspan></text></svg>
