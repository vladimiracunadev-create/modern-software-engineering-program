<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 635 224" width="635" height="224" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Síntoma» … «Causa y regresión»</title><desc id="d">Diagrama de flujo con 7 pasos. «Síntoma» lleva a «Entorno capturado». «Entorno capturado» lleva a «Reproducción mínima». «Reproducción mínima» lleva a «Hipótesis rivales». «Hipótesis rivales» lleva a «Observación dirigida». «Observación dirigida» lleva a «Primera divergencia». «Primera divergencia» lleva a «Causa y regresión». «Causa y regresión» lleva a «Entorno capturado» (no reproduce).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="635" height="224" fill="#ffffff"/><path d="M111,52.5 L157,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M264,52.5 L310,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M443,52.5 L497.5,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M551,83 L551,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M489,171.5 L438.5,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M314.5,171.5 L264,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M210.5,141 L210.5,83" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="30.5" width="89" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="66.5" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="66.5" dy="0">Síntoma</tspan></text><rect x="157" y="22" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="210.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="210.5" dy="0">Entorno</tspan><tspan x="210.5" dy="19.2">capturado</tspan></text><rect x="310" y="22" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="376.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="376.5" dy="0">Reproducción</tspan><tspan x="376.5" dy="19.2">mínima</tspan></text><rect x="497.5" y="22" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="551" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="551" dy="0">Hipótesis</tspan><tspan x="551" dy="19.2">rivales</tspan></text><rect x="489" y="141" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="551" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="551" dy="0">Observación</tspan><tspan x="551" dy="19.2">dirigida</tspan></text><rect x="314.5" y="141" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="376.5" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="376.5" dy="0">Primera</tspan><tspan x="376.5" dy="19.2">divergencia</tspan></text><rect x="157" y="141" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="210.5" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="210.5" dy="0">Causa y</tspan><tspan x="210.5" dy="19.2">regresión</tspan></text><rect x="216.5" y="100" width="110" height="24" rx="4" fill="#ffffff"/><text x="271.5" y="115.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><ts