<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 923 376" width="923" height="376" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Prueba» … «Validador: re-ejecuta y comprueba»</title><desc id="d">Diagrama de flujo con 11 pasos. «Prueba» lleva a «Ejecutar contra el código correcto». «Prueba» lleva a «Ejecutar contra el defecto». «Prueba» lleva a «Ejecutar contra un refactor neutro». «Ejecutar contra el código correcto» lleva a «Pasa». «Ejecutar contra el defecto» lleva a «Falla por aserción». «Ejecutar contra un refactor neutro» lleva a «Pasa». «Pasa» lleva a «Paquete de evidencia». «Falla por aserción» lleva a «Paquete de evidencia». «Pasa» lleva a «Paquete de evidencia». «Paquete de evidencia» lleva a «Validador: re-ejecuta y comprueba». «Falla por aserción» lleva a «Reforzar la aserción» (solo por excepción). «Pasa» lleva a «Reducir acoplamiento a la implementación» (falla).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="923" height="376" fill="#ffffff"/><path d="M103,188 L117.0,188.0 Q126,188 126.0,179.0 L126.0,80.5 Q126,71.5 135.0,71.5 L149,71.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M103,188 L149,188" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M103,188 L117.0,188.0 Q126,188 126.0,197.0 L126.0,295.5 Q126,304.5 135.0,304.5 L149,304.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M256,71.5 L347.5,71.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M256,188 L302,188" fill="none" stroke="