x="202.5" y="279.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="202.5" dy="0">Ejecutar</tspan><tspan x="202.5" dy="19.2">contra un</tspan><tspan x="202.5" dy="19.2">refactor</tspan><tspan x="202.5" dy="19.2">neutro</tspan></text><polygon points="382,40.5 416.5,71.5 382,102.5 347.5,71.5" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="382" y="75.7" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="382" dy="0">Pasa</tspan></text><polygon points="382,145 462,188 382,231 302,188" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="382" y="182.6" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="382" dy="0">Falla por</tspan><tspan x="382" dy="19.2">aserción</tspan></text><polygon points="382,273.5 416.5,304.5 382,335.5 347.5,304.5" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="382" y="308.7" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="382" dy="0">Pasa</tspan></text><rect x="589.5" y="41" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="647" y="66.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="647" dy="0">Paquete de</tspan><tspan x="647" dy="19.2">evidencia</tspan></text><rect x="768" y="31.5" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="834.5" y="56.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="834.5" dy="0">Validador:</tspan><tspan x="834.5" dy="19.2">re-ejecuta y</tspan><tspan x="834.5" dy="19.2">comprueba</tspan></text><rect x="585" y="157.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="647" y="182.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="647" dy="0">Reforzar la</tspan><tspan x="647" dy="19.2">aserción</tspan></text><rect x="572" y="255" width="150" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="647" y="279.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="647" dy="0">Reducir</tspan><tspan x="647" dy="19.2">acoplamiento a</tspan><tspan x="647" dy="19.2">la</tspan><tspan x="647" dy="19.2">implementación</tspan></text><rect x="528.5" y="107" width="86" height="42" rx="4" fill="#ffffff"/><text x="571.5" y="122.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="571.5" dy="0">solo por</tspan><tspan x="571.5" dy="17.92">excepción</tspan></text><rect x="467.8" y="308.5" width="53" height="24" rx="4" fill="#ffffff"/><text x="494.3" y="324.4" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="494.3" dy="0">falla</tspan></text></svg>
