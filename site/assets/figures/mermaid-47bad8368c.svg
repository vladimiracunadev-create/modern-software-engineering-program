<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 298" width="616" height="298" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Herramienta» … «Continuar», «Reintentar», «Alertar» y «Investigar»</title><desc id="d">Diagrama de flujo con 7 pasos. «Herramienta» lleva a «Padre» (código). «Herramienta» lleva a «Persona» (mensaje en stderr). «Padre» lleva a «Continuar» (0). «Padre» lleva a «Reintentar» (temporal). «Padre» lleva a «Alertar» (uso o datos). «Padre» lleva a «Investigar» (señal).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="616" height="298" fill="#ffffff"/><path d="M146,152 L154.0,152.0 Q162,152 162.0,144.0 L162.0,127.0 Q162,118 171.0,118.0 L270.5,118" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M146,152 L154.0,152.0 Q162,152 162.0,160.0 L162.0,177.0 Q162,186 171.0,186.0 L264,186" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M346.5,118 L354.5,118.0 Q362.5,118 362.5,110.0 L362.5,59.0 Q362.5,50 371.5,50.0 L483,50" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M346.5,118 L479,118" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M346.5,118 L354.5,118.0 Q362.5,118 362.5,126.0 L362.5,177.0 Q362.5,186 371.5,186.0 L492,186" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M346.5,118 L354.5,118.0 Q362.5,118 362.5,126.0 L362.5,245.0 Q362.5,254 371.5,254.0 L479,254" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="130" width