<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 823 185" width="823" height="185" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Journey de desarrollador» … «Feedback, telemetría / privacidad»</title><desc id="d">Diagrama de flujo con 5 pasos. «Journey de desarrollador» lleva a «Time to first success». «Time to first success» lleva a «Diseño de errores». «Diseño de errores» lleva a «Documentación ejecutable». «Documentación ejecutable» lleva a «Feedback, telemetría / privacidad». «Feedback, telemetría / privacidad» lleva a «Journey de desarrollador» (fallo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="823" height="185" fill="#ffffff"/><path d="M164,113.5 L210,113.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M299,113.5 L345,113.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M452,113.5 L498,113.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M640,113.5 L686,113.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M743.5,64 L743.5,57.0 Q743.5,50 736.5,50.0 L102.0,50.0 Q93,50 93.0,59.0 L93,83" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="83" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="93" y="108.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="93" dy="0">Journey de</tspan><tspan x="93" dy="19.2">desarrollador</tspan></text><rect x="210" y="73.5" width="89" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="254.5" y="98.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="254.5" dy="0">Time to</tspan><tspan x="254.5" dy="19.2">first</tspan><tspan x="254.5" dy="19.2">success</tspan></text><rect x="345" y="83" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="398.5" y="108.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="398.5" dy="0">Diseño de</tspan><tspan x="398.5" dy="19.2">errores</tspan></text><rect x="498" y="83" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="569" y="108.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="569" dy="0">Documentación</tspan><tspan x="569" dy="19.2">ejecutable</tspan></text><rect x="686" y="64" width="115" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="743.5" y="88.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="743.5" dy="0">Feedback,</tspan><tspan x="743.5" dy="19.2">telemetría</tspan><tspan x="743.5" dy="19.2">/</tspan><tspan x="743.5" dy="19.2">privacidad</tspan></text><rect x="355.2" y="22" width="126" height="24" rx="4" fill="#ffffff"/><text x="418.2" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="418.2" dy="0">fallo o cambio</tspan></text></svg>
