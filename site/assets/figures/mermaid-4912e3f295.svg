<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 455 1367" width="455" height="1367" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Criterios de aceptación» … «Reversión ensayada»</title><desc id="d">Diagrama de flujo con 14 pasos. «Criterios de aceptación» lleva a «Plan del cambio». «Plan del cambio» lleva a «Trabajo asistido». «Trabajo asistido» lleva a «Bitácora encadenada». «Trabajo asistido» lleva a «Diff mínimo». «Diff mínimo» lleva a «Compuerta: pruebas». «Compuerta: pruebas» lleva a «Compuerta: análisis estático y seguridad». «Compuerta: análisis estático y seguridad» lleva a «Compuerta: revisión humana nombrada». «Compuerta: revisión humana nombrada» lleva a «Integración con trailers». «Integración con trailers» lleva a «Compuerta: canario». «Compuerta: canario» lleva a «Producción». «Bitácora encadenada» lleva a «Ancla externa del último hash». «Producción» lleva a «Reconstrucción desde la bitácora» (incidente). «Reconstrucción desde la bitácora» lleva a «Reversión ensayada». «Reversión ensayada» lleva a «Plan del cambio».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="455" height="1367" fill="#ffffff"/><path d="M214.9,83 L214.9,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M215.1,185 L215.1,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M215.3,287 L215.3,307.0 Q215.3,316 206.3,316.0 L148.0,316.0 Q139,316 139.0,325.0 L139,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M215.3,287 L215.3,311.2 Q215.3,320.2 224.3,320.2 L283.5,320.2 Q292.5,320.2 292.5,329.2 L292.5,353.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M292.5,397.5 L292.5,426.0 Q292.5,435 301.5,435.0 L315.5,435.0 Q324.5,435 324.5,444.0 L324.5,472.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M324.5,516.5 L324.5,540.8 Q324.5,549.8 315.5,549.8 L311.1,549.8 Q302.1,549.8 302.1,558.8 L302.1,583" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M302.1,663 L302.1,683.0 Q302.1,692 293.1,692.0 L289.9,692.0 Q280.9,692 280.9,701.0 L280.9,721" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M280.9,801 L280.9,821.3 Q280.9,830 272.2,830.0 L272.2,830.0 Q263.5,830 263.5,838.7 L263.5,859" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M263.5,920 L263.5,942.4 Q263.5,949 256.9,949.0 L256.9,949.0 Q250.2,949 250.2,955.6 L250.2,978" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M250.2,1022 L250.2,1046.3 Q250.2,1051 245.5,1051.0 L245.5,1051.0 Q240.8,1051 240.8,1055.7 L240.8,1080" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M139,406 L139.0,426.0 Q139,435 130.0,435.0 L119.0,435.0 Q110,435 110.0,444.0 L110,464" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M237.8,1124 L237.8,1182" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M233.5,1243 L233.5,1301" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M324.6,1323 L422.0,1323.0 Q431,1323 431.0,1314.0 L431.0,172.0 Q431,163 422.0,163.0 L294.4,163" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="148.4" y="22" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="214.9" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="214.9" dy="0">Criterios de</tspan><tspan x="214.9" dy="19.2">aceptación</tspan></text><rect x="135.4" y="141" width="159" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="214.9" y="167.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="214.9" dy="0">Plan del cambio</tspan></text><rect x="131.3" y="243" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="215.3" y="269.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="215.3" dy="0">Trabajo asistido</tspan></text><rect x="81.5" y="345" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="139" y="370.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="139" dy="0">Bitácora</tspan><tspan x="139" dy="19.2">encadenada</tspan></text><rect x="230.5" y="353.5" width="124" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="292.5" y="379.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="292.5" dy="0">Diff mínimo</tspan></text><rect x="232" y="472.5" width="185" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="324.5" y="498.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="324.5" dy="0">Compuerta: pruebas</tspan></text><rect x="214.1" y="583" width="176" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="302.1" y="608" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="302.1" dy="0">Compuerta:</tspan><tspan x="302.1" dy="19.2">análisis estático</tspan><tspan x="302.1" dy="19.2">y seguridad</tspan></text><rect x="201.4" y="721" width="159" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="280.9" y="746" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="280.9" dy="0">Comp