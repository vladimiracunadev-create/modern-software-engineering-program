<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 651 395" width="651" height="395" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Catálogo de fallas por mecanismo» … «Corrección y regresión»</title><desc id="d">Diagrama de flujo con 8 pasos. «Catálogo de fallas por mecanismo» lleva a «Especificación del experimento». «Especificación del experimento» lleva a «Validador: forma y contenido». «Validador: forma y contenido» lleva a «Especificación del experimento» (rojo). «Validador: forma y contenido» lleva a «Ejecución con control y aborto» (verde). «Ejecución con control y aborto» lleva a «Resultados y huella». «Resultados y huella» lleva a «Informe de límites». «Informe de límites» lleva a «Revisión por otra persona». «Revisión por otra persona» lleva a «Corrección y regresión» (hallazgo). «Corrección y regresión» lleva a «Especificación del experimento».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="651" height="395" fill="#ffffff"/><path d="M150.5,94.5 L256,94.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M415,94.5 L461,94.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M545,125 L545,192.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M461,223 L402,223" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M269,223 L146,223" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M88.5,253.5 L88.5,311.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M155,342 L269,342" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M545,64 L545.0,57.0 Q545,50 538.0,50.0 L342.5,50.0 Q335.5,50 335.5,57.0 L335.5,64" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><path d="M402,342 L409.0,342.0 Q416,342 416.0,335.0 L416.0,148.0 Q416,139 407.0,139.0 L342.5,139.0 Q335.5,139 335.5,132.0 L335.5,125" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="26.5" y="54.5" width="124" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="88.5" y="79.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="88.5" dy="0">Catálogo de</tspan><tspan x="88.5" dy="19.2">fallas por</tspan><tspan x="88.5" dy="19.2">mecanismo</tspan></text><rect x="256" y="64" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="335.5" y="89.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="335.5" dy="0">Especificación</tspan><tspan x="335.5" dy="19.2">del experimento</tspan></text><rect x="461" y="64" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="545" y="89.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="545" dy="0">Validador: forma</tspan><tspan x="545" dy="19.2">y contenido</tspan></text><rect x="461" y="192.5" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="545" y="217.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="545" dy="0">Ejecución con</tspan><tspan x="545" dy="19.2">control y aborto</tspan></text><rect x="269" y="192.5" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="335.5" y="217.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="335.5" dy="0">Resultados y</tspan><tspan x="335.5" dy="19.2">huella</tspan></text><rect x="31" y="192.5" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="88.5" y="217.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="88.5" dy="0">Informe de</tspan><tspan x="88.5" dy="19.2">límites</tspan></text><rect x="22" y="311.5" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="88.5" y="336.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="88.5" dy="0">Revisión por</tspan><tspan x="88.5" dy="19.2">otra persona</tspan></text><rect x="269" y="311.5" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="335.5" y="336.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="335.5" dy="0">Corrección y</tspan><tspan x="335.5" dy="19.2">regresión</tspan></text><rect x="417.8" y="22" width="45" height="24" rx="4" fill="#ffffff"/><text x="440.3" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="440.3" dy="0">rojo</tspan></text><rect x="551" y="146.7" width="53" height="24" rx="4" fill="#ffffff"/><text x="577.5" y="162.6" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577.5" dy="0">verde</tspan></text><rect x="173.5" y="314" width="77" height="24" rx="4" fill="#ffffff"/><text x="212" y="329.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="212" dy="0">hallazgo</tspan></text></svg>
