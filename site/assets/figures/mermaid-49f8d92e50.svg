<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 579 262" width="579" height="262" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Regla» … «Documentación viva»</title><desc id="d">Diagrama de flujo con 6 pasos. «Regla» lleva a «Descubrir ejemplos con las tres perspectivas». «Descubrir ejemplos con las tres perspectivas» lleva a «Escenarios declarativos». «Escenarios declarativos» lleva a «Pasos y definiciones». «Pasos y definiciones» lleva a «Suite que discrimina». «Suite que discrimina» lleva a «Documentación viva». «Documentación viva» lleva a «Regla» (defecto o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="579" height="262" fill="#ffffff"/><path d="M131,71.5 L210,71.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M378,71.5 L424,71.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M490.5,102 L490.5,179" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M424,209.5 L351.5,209.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M236.5,209.5 L164,209.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M93,179 L93,93.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="55" y="49.5" width="76" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="93" y="75.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="93" dy="0">Regla</tspan></text><rect x="210" y="22" width="168" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="294" y="46.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="294" dy="0">Descubrir</tspan><tspan x="294" dy="19.2">ejemplos con las</tspan><tspan x="294" dy="19.2">tres</tspan><tspan x="294" dy="19.2">perspectivas</tspan></text><rect x="424" y="41" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="490.5" y="66.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490.5" dy="0">Escenarios</tspan><tspan x="490.5" dy="19.2">declarativos</tspan></text><rect x="424" y="179" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="490.5" y="204.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490.5" dy="0">Pasos y</tspan><tspan x="490.5" dy="19.2">definiciones</tspan></text><rect x="236.5" y="179" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="294" y="204.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="294" dy="0">Suite que</tspan><tspan x="294" dy="19.2">discrimina</tspan></text><rect x="22" y="179" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="93" y="204.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="93" dy="0">Documentación</tspan><tspan x="93" dy="19.2">viva</tspan></text><rect x="99" y="115.2" width="86" height="42" rx="4" fill="#ffffff"/><text x="142" y="131.1" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="142" dy="0">defecto o</tspan><tspan x="142" dy="17.92">cambio</tspan></text></svg>
