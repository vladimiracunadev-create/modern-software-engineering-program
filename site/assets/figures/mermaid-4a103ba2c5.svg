<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 797 277" width="797" height="277" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Escalador automático» y «Revertir el commit» … «Acción: crear, cambiar, podar»</title><desc id="d">Diagrama de flujo con 6 pasos. «Repositorio: estado deseado versionado» lleva a «Controlador: extrae y compara». «Clúster: estado actual» lleva a «Controlador: extrae y compara». «Controlador: extrae y compara» lleva a «Acción: crear, cambiar, podar» (diferencia). «Acción: crear, cambiar, podar» lleva a «Clúster: estado actual». «Escalador automático» lleva a «Clúster: estado actual» (modifica réplicas). «Controlador: extrae y compara» lleva a «Escalador automático» (ignorar campos ajenos). «Revertir el commit» lleva a «Repositorio: estado deseado versionado».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="797" height="277" fill="#ffffff"/><path d="M380,205.5 L394.0,205.5 Q403,205.5 403.0,196.5 L403.0,150.8 Q403,141.8 412.0,141.8 L426,141.8" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M362.5,78 L385.2,78.0 Q394.2,78 394.2,87.0 L394.2,132.8 Q394.2,141.8 403.2,141.8 L426,141.8" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M559,141.8 L677,141.8" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M141.5,78 L264.5,78" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M146,205.5 L247,205.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M726,92.3 L726.0,33.0 Q726,24 717.0,24.0 L320.5,24.0 Q313.5,24 313.5,31.0 L313.5,38" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><path d="M492.5,181.8 L492.5,188.8 Q492.5,195.8 485.5,195.8 L403.0,195.8 Q394,195.8 394.0,186.8 L394.0,141.0 Q394,132 385.0,132.0 L93.0,132.0 Q84,132 84.0,123.0 L84,108.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="247" y="156" width="133" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="313.5" y="180.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="313.5" dy="0">Repositorio:</tspan><tspan x="313.5" dy="19.2">estado</tspan><tspan x="313.5" dy="19.2">deseado</tspan><tspan x="313.5" dy="19.2">versionado</tspan></text><rect x="426" y="101.8" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="492.5" y="126.8" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="492.5" dy="0">Controlador:</tspan><tspan x="492.5" dy="19.2">extrae y</tspan><tspan x="492.5" dy="19.2">compara</tspan></text><rect x="264.5" y="38" width="98" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="313.5" y="63" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="313.5" dy="0">Clúster:</tspan><tspan x="313.5" dy="19.2">estado</tspan><tspan x="313.5" dy="19.2">actual</tspan></text><rect x="677" y="92.3" width="98" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="726" y="117.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="726" dy="0">Acción:</tspan><tspan x="726" dy="19.2">crear,</tspan><tspan x="726" dy="19.2">cambiar,</tspan><tspan x="726" dy="19.2">podar</tspan></text><rect x="26.5" y="47.5" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="84" y="72.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="84" dy="0">Escalador</tspan><tspan x="84" dy="19.2">automático</tspan></text><rect x="22" y="175" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="84" y="200.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="84" dy="0">Revertir el</tspan><tspan x="84" dy="19.2">commit</tspan></text><rect x="571" y="113.8" width="94" height="24" rx="4" fill="#ffffff"/><text x="618" y="129.7" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="618" dy="0">diferencia</tspan></text><rect x="164.5" y="32" width="77" height="42" rx="4" fill="#ffffff"/><text x="203" y="47.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="203" dy="0">modifica</tspan><tspan x="203" dy="17.92">réplicas</tspan></text><rect x="409.8" y="199.8" width="126" height="42" rx="4" fill="#ffffff"/><text x="472.8" y="215.7" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="472.8" dy="0">ignorar campos</tspan><tspan x="472.8" dy="17.92">ajenos</tspan></text></svg>
