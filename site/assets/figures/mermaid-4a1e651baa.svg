<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 389 769" width="389" height="769" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Fuente de eventos» … «Tablero» y «Cuarentena»</title><desc id="d">Diagrama de flujo con 8 pasos. «Fuente de eventos» lleva a «Ingesta». «Ingesta» lleva a «Partición por clave». «Partición por clave» lleva a «Ventana por tiempo del evento». «Ventana por tiempo del evento» lleva a «Escritura idempotente». «Escritura idempotente» lleva a «Tabla analítica». «Tabla analítica» lleva a «Tablero». «Ingesta» lleva a «Ventana por tiempo del evento» (evento tardío). «Escritura idempotente» lleva a «Escritura idempotente» (fallo y reintento). «Tabla analítica» lleva a «Cuarentena» (regla de calidad).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="389" height="769" fill="#ffffff"/><path d="M136.3,66 L136.3,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M136.1,168 L136.1,226" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M135.8,287 L135.8,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M135.4,406 L135.4,464" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M135,525 L135,583" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M134.7,627 L134.7,656.0 Q134.7,665 125.7,665.0 L75.5,665.0 Q66.5,665 66.5,674.0 L66.5,703" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M180.8,146 L233.1,146.0 Q242.1,146 242.1,155.0 L242.1,368.5 Q242.1,375.5 235.1,375.5 L228.1,375.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M134.7,627 L134.7,635.0 Q134.7,643 142.7,643.0 L193.5,643.0 Q202.5,643 202.5,652.0 L202.5,703" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M183.2,464 L183.2,451.0 Q183.2,442 192.2,442.0 L206.2,442.0 Q215.2,442 215.2,451.0 L215.2,485.5 Q215.2,494.5 206.2,494.5 L197.2,494.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="48.3" y="22" width="176" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="136.3" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="136.3" dy="0">Fuente de eventos</tspan></text><rect x="91.8" y="124" width="89" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="136.3" y="150.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="136.3" dy="0">Ingesta</tspan></text><rect x="65" y="226" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="136" y="251.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="136" dy="0">Partición por</tspan><tspan x="136" dy="19.2">clave</tspan></text><rect x="43.1" y="345" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135.6" y="370.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="135.6" dy="0">Ventana por tiempo</tspan><tspan x="135.6" dy="19.2">del evento</tspan></text><rect x="73.2" y="464" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135.2" y="489.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="135.2" dy="0">Escritura</tspan><tspan x="135.2" dy="19.2">idempotente</tspan></text><rect x="55.2" y="583" width="159" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="134.7" y="609.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="134.7" dy="0">Tabla analítica</tspan></text><rect x="22" y="703" width="89" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="66.5" y="729.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="66.5" dy="0">Tablero</tspan></text><rect x="145" y="703" width="115" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="202.5" y="729.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="202.5" dy="0">Cuarentena</tspan></text><rect x="248.1" y="248.8" width="118" height="24" rx="4" fill="#ffffff"/><text x="307.1" y="264.7" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="307.1" dy="0">evento tardío</tspan></text><rect x="221.2" y="447.2" width="86" height="42" rx="4" fill="#ffffff"/><text x="264.2" y="463.1" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="264.2" dy="0">fallo y</tspan><tspan x="264.2" dy="17.92">reintento</tspan></text><rect x="208.5" y="652" width="77" height="42" rx="4" fill="#ffffff"/><text x="247" y="667.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="247" dy="0">regla de</tspan><tspan x="247" dy="17.92">calidad</tspan></text></svg>
