<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 563 447" width="563" height="447" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Bytecode del analizador local de eventos» … «Gestión automática»</title><desc id="d">Diagrama de flujo con 6 pasos. «Bytecode del analizador local de eventos» lleva a «Máquina virtual». «Máquina virtual» lleva a «Pilas y marcos». «Máquina virtual» lleva a «Heap de objetos». «Heap de objetos» lleva a «Gestión automática». «Máquina virtual» lleva a «Servicios del sistema». «Gestión automática» lleva a «Heap de objetos».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="563" height="447" fill="#ffffff"/><path d="M284,102 L284,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M284,204 L284.0,228.2 Q284,237.2 275.0,237.2 L106.0,237.2 Q97,237.2 97.0,246.2 L97,270.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M284.8,204 L284.8,270.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M285.5,314.5 L285.5,381" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M284,204 L284.0,224.0 Q284,233 293.0,233.0 L461.0,233.0 Q470,233 470.0,242.0 L470,262" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M377.9,403 L384.9,403.0 Q391.9,403 391.9,396.0 L391.9,343.4 Q391.9,337 385.4,337.0 L385.4,337.0 Q379,337 379.0,330.6 L379.0,299.5 Q379,292.5 372.0,292.5 L365,292.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/>