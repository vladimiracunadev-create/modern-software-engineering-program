<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 666" width="470" height="666" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Invariante» … «Expediente reproducible»</title><desc id="d">Diagrama de flujo con 8 pasos. «Invariante» lleva a «Prueba que la vigila». «Invariante» lleva a «Defecto sembrado que la rompe». «Defecto sembrado que la rompe» lleva a «La prueba falla». «Prueba que la vigila» lleva a «La prueba falla». «La prueba falla» lleva a «Matriz defecto por prueba». «Matriz defecto por prueba» lleva a «Huecos: defecto sin prueba». «Huecos: defecto sin prueba» lleva a «Prueba que la vigila». «Matriz defecto por prueba» lleva a «Ejecución limpia». «Ejecución limpia» lleva a «Expediente reproducible».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="470" height="666" fill="#ffffff"/><path d="M203.5,66 L203.5,86.0 Q203.5,95 194.5,95.0 L118.0,95.0 Q109,95 109.0,104.0 L109,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M203.5,66 L203.5,86.0 Q203.5,95 212.5,95.0 L289.0,95.0 Q298,95 298.0,104.0 L298,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M298,185 L298.0,205.0 Q298,214 289.0,214.0 L222.6,214.0 Q213.6,214 213.6,223.0 L213.6,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M109,185 L109.0,205.0 Q109,214 118.0,214.0 L204.6,214.0 Q213.6,214 213.6,223.0 L213.6,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M213.6,287 L213.6,307.0 Q213.6,316 222.6,316.0 L236.7,316.0 Q245.7,316 245.7,325.0 L245.7,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M245.7,406 L245.7,426.0 Q245.7,435 236.7,435.0 L174.7,435.0 Q165.7,435 165.7,444.0 L165.7,464" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M245.7,406 L245.7,430.2 Q245.7,439.2 254.7,439.2 L354.2,439.2 Q363.2,439.2 363.2,448.2 L363.2,472.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M360.7,516.5 L360.7,583" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M86.2,494.5 L33.0,494.5 Q24,494.5 24.0,485.5 L24.0,161.5 Q24,154.5 31.0,154.5 L38,154.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="146" y="22" width="115" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="203.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="203.5" dy="0">Invariante</tspan></text><rect x="38" y="124" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="109" y="149.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="109" dy="0">Prueba que la</tspan><tspan x="109" dy="19.2">vigila</tspan></text><rect x="214" y="124" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="298" y="149.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="298" dy="0">Defecto sembrado</tspan><tspan x="298" dy="19.2">que la rompe</tspan></text><rect x="134.1" y="243" width="159" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="213.6" y="269.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="213.6" dy="0">La prueba falla</tspan></text><rect x="153.2" y="345" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="245.7" y="370.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="245.7" dy="0">Matriz defecto por</tspan><tspan x="245.7" dy="19.2">prueba</tspan></text><rect x="86.2" y="464" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="165.7" y="489.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="165.7" dy="0">Huecos: defecto</tspan><tspan x="165.7" dy="19.2">sin prueba</tspan></text><rect x="279.2" y="472.5" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="363.2" y="498.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="363.2" dy="0">Ejecución limpia</tspan></text><rect x="291.8" y="583" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="358.3" y="608.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="358.3" dy="0">Expediente</tspan><tspan x="358.3" dy="19.2">reproducible</tspan></text></svg>
