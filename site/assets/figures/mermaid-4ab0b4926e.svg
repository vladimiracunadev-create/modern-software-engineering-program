<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 771 147" width="771" height="147" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Síntoma o petición» … «Causa y evidencia»</title><desc id="d">Diagrama de flujo con 5 pasos. «Síntoma o petición» lleva a «Problema». «Problema» lleva a «Necesidad». «Necesidad» lleva a «Oportunidad». «Oportunidad» lleva a «Causa y evidencia». «Causa y evidencia» lleva a «Síntoma o petición» (fallo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="771" height="147" fill="#ffffff"/><path d="M129,94.5 L175,94.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M273,94.5 L319,94.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M426,94.5 L472,94.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M596,94.5 L642,94.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M695.5,64 L695.5,57.0 Q695.5,50 688.5,50.0 L82.5,50.0 Q75.5,50 75.5,57.0 L75.5,64" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="64" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="75.5" y="89.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="75.5" dy="0">Síntoma o</tspan><tspan x="75.5" dy="19.2">petición</tspan></text><rect x="175" y="72.5" width="98" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="224" y="98.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="224" dy="0">Problema</tspan></text><rect x="319" y="72.5" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="372.5" y="98.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="372.5" dy="0">Necesidad</tspan></text><rect x="472" y="72.5" width="124" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="534" y="98.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="534" dy="0">Oportunidad</tspan></text><rect x="642" y="64" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="695.5" y="89.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="695.5" dy="0">Causa y</tspan><tspan x="695.5" dy="19.2">evidencia</tspan></text><rect x="322.5" y="22" width="126" height="24" rx="4" fill="#ffffff"/><text x="385.5" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="385.5" dy="0">fallo o cambio</tspan></text></svg>
