<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 561 734" width="561" height="734" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Llamada con latencia con cola» … «Error inmediato al llamador» y «Espera: exponencial con jitter»</title><desc id="d">Diagrama de flujo con 8 pasos. «Llamada con latencia con cola» lleva a «Timeout: cuánto esperar». «Timeout: cuánto esperar» lleva a «¿Operación idempotente y fallo transitorio?» (vence). «¿Operación idempotente y fallo transitorio?» lleva a «Error inmediato al llamador» (no). «¿Operación idempotente y fallo transitorio?» lleva a «Reintento: cuántos y con qué presupuesto» (sí). «Reintento: cuántos y con qué presupuesto» lleva a «Espera: exponencial con jitter». «Espera: exponencial con jitter» lleva a «Llamada con latencia con cola». «Reintento: cuántos y con qué presupuesto» lleva a «Error inmediato al llamador» (presupuesto agotado). «Llamada con latencia con cola» lleva a «Carga sobre el servicio: trabajo útil y desperdiciado». «Carga sobre el servicio: trabajo útil y desperdiciado» lleva a «Colapso metaestable» (sobrecarga).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="561" height="734" fill="#ffffff"/><path d="M334,83 L334.0,112.5 Q334,121.5 325.0,121.5 L242.3,121.5 Q233.3,121.5 233.3,130.5 L233.3,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M233.3,221 L233.3,229.0 Q233.3,237 225.3,237.0 L214.1,237.0 Q205.1,237 205.1,246.0 L205.1,298" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M45.1,358 L33.0,358.0 Q24,358 24.0,367.0 L24.0,665.0 Q24,672 31.0,672.0 L38,672" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M205.1,418 L205.1,426.0 Q205.1,434 213.1,434.0 L215.9,434.0 Q224.9,434 224.9,443.0 L224.9,476" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M224.9,556 L224.9,585.0 Q224.9,594 233.9,594.0 L327.5,594.0 Q336.5,594 336.5,603.0 L336.5,632" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M224.9,556 L224.9,564.0 Q224.9,572 216.9,572.0 L139.5,572.0 Q130.5,572 130.5,581.0 L130.5,641.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M334,83 L334.0,103.0 Q334,112 343.0,112.0 L425.8,112.0 Q434.8,112 434.8,121.0 L434.8,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M434.8,240 L434.8,248.0 Q434.8,256 442.8,256.0 L452.1,256.0 Q461.1,256 461.1,265.0 L461.1,327.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M416,672 L527.8,672.0 Q536.8,672 536.8,663.0 L536.8,61.5 Q536.8,52.5 527.8,52.5 L422,52.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="246" y="22" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="334" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="334" dy="0">Llamada con</tspan><tspan x="334" dy="19.2">latencia con cola</tspan></text><rect x="153.8" y="160" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="233.3" y="185.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="233.3" dy="0">Timeout: cuánto</tspan><tspan x="233.3" dy="19.2">esperar</tspan></text><polygon points="205.1,298 365.1,358 205.1,418 45.1,358" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="205.1" y="343" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="205.1" dy="0">¿Operación</tspan><tspan x="205.1" dy="19.2">idempotente y</tspan><tspan x="205.1" dy="19.2">fallo transitorio?</tspan></text><rect x="38" y="641.5" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="130.5" y="666.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="130.5" dy="0">Error inmediato al</tspan><tspan x="130.5" dy="19.2">llamador</tspan></text><rect x="132.4" y="476" width="185" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="224.9" y="501" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="224.9" dy="0">Reintento: cuántos</tspan><tspan x="224.9" dy="19.2">y con qué</tspan><tspan x="224.9" dy="19.2">presupuesto</tspan></text><rect x="257" y="632" width="159" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="336.5" y="657" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="336.5" dy="0">Espera:</tspan><tspan x="336.5" dy="19.2">exponencial con</tspan><tspan x="336.5" dy="19.2">jitter</tspan></text><rect x="346.8" y="141" width="176" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="434.8" y="165.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="434.8" dy="0">Carga sobre el</tspan><tspan x="434.8" dy="19.2">servicio: trabajo</tspan><tspan x="434.8" dy="19.2">útil y</tspan><tspan x="434.8" dy="19.2">desperdiciado</tspan></text><rect x="399.1" y="327.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="461.1" y="352.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="461.1" dy="0">Colapso</tspan><tspan x="461.1" dy="19.2">metaestable</tspan></text><rect x="211.1" y="255.5" width="53" height="24" rx="4" fill="#ffffff"/><text x="237.6" y="271.4" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="237.6" dy="0">vence</tspan></text><rect x="30" y="503" width="29" height="24" rx="4" fill="#ffffff"/><text x="44.5" y="518.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="44.5" dy="0">no</tspan></text><rect x="230.9" y="443" width="29" height="24" rx="4" fill="#ffffff"/><text x="245.4" y="458.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="245.4" dy="0">sí</tspan></text><rect x="117.3" y="576" width="102" height="42" rx="4" fill="#ffffff"/><text x="168.3" y="591.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="168.3" dy="0">presupuesto</tspan><tspan x="168.3" dy="17.92">agotado</tspan></text><rect x="361.1" y="265.4" width="94" height="24" rx="4" fill="#ffffff"/><text x="408.1" y="281.3" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="408.1" dy="0">sobrecarga</tspan></text></svg>
