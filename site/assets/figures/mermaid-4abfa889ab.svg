<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 391 690" width="391" height="690" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Cambio en el código» y «Credencial de una persona» … «Registro de auditoría: escritura separada»</title><desc id="d">Diagrama de flujo con 7 pasos. «Cambio en el código» lleva a «Desarrollo: cuenta propia». «Desarrollo: cuenta propia» lleva a «Preproducción: cuenta propia» (promoción automática tras pruebas). «Preproducción: cuenta propia» lleva a «Producción: cuenta propia» (aprobación de otra persona). «Credencial de una persona» lleva a «Desarrollo: cuenta propia» (solo su entorno). «Acceso de emergencia» lleva a «Producción: cuenta propia» (registrado y limitado en el tiempo). «Producción: cuenta propia» lleva a «Registro de auditoría: escritura separada».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="391" height="690" fill="#ffffff"/><path d="M88.5,83 L88.5,112.0 Q88.5,121 97.5,121.0 L173.8,121.0 Q182.8,121 182.8,130.0 L182.8,159" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M182.8,220 L182.8,228.0 Q182.8,236 174.8,236.0 L153.2,236.0 Q144.2,236 144.2,245.0 L144.2,314" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M144.2,375 L144.2,383.0 Q144.2,391 152.2,391.0 L231.6,391.0 Q240.6,391 240.6,400.0 L240.6,469" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M277,83 L277.0,91.0 Q277,99 269.0,99.0 L191.8,99.0 Q182.8,99 182.8,108.0 L182.8,159" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M310.7,375 L310.7,383.0 Q310.7,391 302.7,391.0 L249.6,391.0 Q240.6,391 240.6,400.0 L240.6,469" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M242.9,530 L242.9,588" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="22" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="88.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="88.5" dy="0">Cambio en el</tspan><tspan x="88.5" dy="19.2">código</tspan></text><rect x="90.3" y="159" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="182.8" y="184.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="182.8" dy="0">Desarrollo: cuenta</tspan><tspan x="182.8" dy="19.2">propia</tspan></text><rect x="69.2" y="314" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="144.2" y="339.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="144.2" dy="0">Preproducción:</tspan><tspan x="144.2" dy="19.2">cuenta propia</tspan></text><rect x="148.1" y="469" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="240.6" y="494.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="240.6" dy="0">Producción: cuenta</tspan><tspan x="240.6" dy="19.2">propia</tspan></text><rect x="189" y="22" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="277" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="277" dy="0">Credencial de una</tspan><tspan x="277" dy="19.2">persona</tspan></text><rect x="253.2" y="314" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="310.7" y="339.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="310.7" dy="0">Acceso de</tspan><tspan x="310.7" dy="19.2">emergencia</tspan></text><rect x="152.7" y="588" width="185" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="245.2" y="613" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="245.2" dy="0">Registro de</tspan><tspan x="245.2" dy="19.2">auditoría:</tspan><tspan x="245.2" dy="19.2">escritura separada</tspan></text><rect x="150.2" y="245" width="110" height="60" rx="4" fill="#ffffff"/><text x="205.2" y="260.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="205.2" dy="0">promoción</tspan><tspan x="205.2" dy="17.92">automática</tspan><tspan x="205.2" dy="17.92">tras pruebas</tspan></text><rect x="246.6" y="409" width="118" height="42" rx="4" fill="#ffffff"/><text x="305.6" y="424.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="305.6" dy="0">aprobación de</tspan><tspan x="305.6" dy="17.92">otra persona</tspan></text><rect x="188.8" y="108" width="69" height="42" rx="4" fill="#ffffff"/><text x="223.3" y="123.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="223.3" dy="0">solo su</tspan><tspan x="223.3" dy="17.92">entorno</tspan></text><rect x="108.6" y="400" width="126" height="60" rx="4" fill="#ffffff"/><text x="171.6" y="415.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="171.6" dy="0">registrado y</tspan><tspan x="171.6" dy="17.92">limitado en el</tspan><tspan x="171.6" dy="17.92">tiempo</tspan></text></svg>
