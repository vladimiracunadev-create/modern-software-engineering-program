<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 572 687" width="572" height="687" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Dependencia B se vuelve lenta» … «Degradación: respuesta parcial o antigua» y «Error claro y rápido»</title><desc id="d">Diagrama de flujo con 9 pasos. «Dependencia B se vuelve lenta» lleva a «¿Recurso compartido con A?». «¿Recurso compartido con A?» lleva a «A también falla» (sí). «¿Recurso compartido con A?» lleva a «Solo B se ve afectada» (no: compartimentos). «Solo B se ve afectada» lleva a «¿Hay respaldo para B?». «¿Hay respaldo para B?» lleva a «Degradación: respuesta parcial o antigua» (sí). «¿Hay respaldo para B?» lleva a «Error claro y rápido» (no). «Dependencia B se vuelve lenta» lleva a «Sidecar o ambassador». «Sidecar o ambassador» lleva a «Políticas de red fuera de la aplicación».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="572" height="687" fill="#ffffff"/><path d="M307.5,83 L307.5,103.0 Q307.5,112 298.5,112.0 L199.0,112.0 Q190,112 190.0,121.0 L190,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M190,227 L190.0,235.0 Q190,243 182.0,243.0 L110.5,243.0 Q101.5,243 101.5,252.0 L101.5,321" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M190,227 L190.0,235.0 Q190,243 198.0,243.0 L272.5,243.0 Q281.5,243 281.5,252.0 L281.5,312.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M282.1,373.5 L282.1,441" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M282.7,527 L282.7,535.0 Q282.7,543 274.7,543.0 L195.8,543.0 Q186.8,543 186.8,552.0 L186.8,585" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M282.7,527 L282.7,535.0 Q282.7,543 290.7,543.0 L370.8,543.0 Q379.8,543 379.8,552.0 L379.8,594.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M307.5,83 L307.5,109.2 Q307.5,118.2 316.5,118.2 L416.0,118.2 Q425,118.2 425.0,127.2 L425,153.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M425,214.5 L425.0,249.8 Q425,258.8 434.0,258.8 L457.0,258.8 Q466,258.8 466.0,267.8 L466,303" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="223.5" y="22" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="307.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="307.5" dy="0">Dependencia B se</tspan><tspan x="307.5" dy="19.2">vuelve lenta</tspan></text><polygon points="190,141 333.5,184 190,227 46.5,184" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="190" y="178.6" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="190" dy="0">¿Recurso</tspan><tspan x="190" dy="19.2">compartido con A?</tspan></text><rect x="22" y="321" width="159" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101.5" y="347.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101.5" dy="0">A también falla</tspan></text><rect x="215" y="312.5" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="281.5" y="337.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="281.5" dy="0">Solo B se ve</tspan><tspan x="281.5" dy="19.2">afectada</tspan></text><polygon points="282.7,441 434.2,484 282.7,527 131.2,484" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="282.7" y="478.6" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="282.7" dy="0">¿Hay respaldo para</tspan><tspan x="282.7" dy="19.2">B?</tspan></text><rect x="98.8" y="585" width="176" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="186.8" y="610" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="186.8" dy="0">Degradación:</tspan><tspan x="186.8" dy="19.2">respuesta parcial</tspan><tspan x="186.8" dy="19.2">o antigua</tspan></text><rect x="308.8" y="594.5" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="379.8" y="619.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="379.8" dy="0">Error claro y</tspan><tspan x="379.8" dy="19.2">rápido</tspan></text><rect x="367.5" y="153.5" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="425" y="178.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="425" dy="0">Sidecar o</tspan><tspan x="425" dy="19.2">ambassador</tspan></text><rect x="382" y="303" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="466" y="328" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="466" dy="0">Políticas de red</tspan><tspan x="466" dy="19.2">fuera de la</tspan><tspan x="466" dy="19.2">aplicación</tspan></text><rect x="107.5" y="270" width="29" height="24" rx="4" fill="#ffffff"/><text x="122" y="285.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="122" dy="0">sí</tspan></text><rect x="287.5" y="256.8" width="126" height="42" rx="4" fill="#ffffff"/><text x="350.5" y="272.7" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="350.5" dy="0">no:</tspan><tspan x="350.5" dy="17.92">compartimentos</tspan></text><rect x="192.8" y="552" width="29" height="24" rx="4" fill="#ffffff"/><text x="207.3" y="567.9" font-size="14" text-anchor="middle"