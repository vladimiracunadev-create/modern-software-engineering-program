<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 622 243" width="622" height="243" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Fixture semántico común» … «Retrospectiva basada en evidencia»</title><desc id="d">Diagrama de flujo con 5 pasos. «Fixture semántico común» lleva a «Implementaciones idiomáticas». «Implementaciones idiomáticas» lleva a «Trazas comparables». «Trazas comparables» lleva a «Cambio dirigido». «Cambio dirigido» lleva a «Retrospectiva basada en evidencia». «Retrospectiva basada en evidencia» lleva a «Fixture semántico común» (fallo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="622" height="243" fill="#ffffff"/><path d="M181,52.5 L227,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M395,52.5 L458.5,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M520.5,83 L520.5,159" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M441,181 L382,181" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M240,181 L110.5,181.0 Q101.5,181 101.5,172.0 L101.5,83" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="22" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101.5" dy="0">Fixture</tspan><tspan x="101.5" dy="19.2">semántico común</tspan></text><rect x="227" y="22" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="311" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="311" dy="0">Implementaciones</tspan><tspan x="311" dy="19.2">idiomáticas</tspan></text><rect x="458.5" y="22" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="520.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="520.5" dy="0">Trazas</tspan><tspan x="520.5" dy="19.2">comparables</tspan></text><rect x="441" y="159" width="159" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="520.5" y="185.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="520.5" dy="0">Cambio dirigido</tspan></text><rect x="240" y="141" width="142" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="311" y="166" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="311" dy="0">Retrospectiva</tspan><tspan x="311" dy="19.2">basada en</tspan><tspan x="311" dy="19.2">evidencia</tspan></text><rect x="107.8" y="153" width="126" height="24" rx="4" fill="#ffffff"/><text x="170.8" y="168.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="170.8" dy="0">fallo o cambio</tspan></text></svg>
