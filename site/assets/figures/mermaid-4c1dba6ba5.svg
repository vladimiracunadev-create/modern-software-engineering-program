<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 605 224" width="605" height="224" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Quién paga y quién usa» … «Concentración y dependencia»</title><desc id="d">Diagrama de flujo con 5 pasos. «Quién paga y quién usa» lleva a «Ingreso por modelo de precio». «Ingreso por modelo de precio» lleva a «Economía unitaria». «Economía unitaria» lleva a «Sostenibilidad y caja». «Sostenibilidad y caja» lleva a «Concentración y dependencia». «Concentración y dependencia» lleva a «Quién paga y quién usa» (un cliente o supuesto cambia).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="605" height="224" fill="#ffffff"/><path d="M155,52.5 L201,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M369,52.5 L450,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M499,83 L499,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M415,171.5 L364.5,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M205.5,171.5 L97.5,171.5 Q88.5,171.5 88.5,162.5 L88.5,83" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="22" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="88.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="88.5" dy="0">Quién paga y</tspan><tspan x="88.5" dy="19.2">quién usa</tspan></text><rect x="201" y="22" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="285" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="285" dy="0">Ingreso por</tspan><tspan x="285" dy="19.2">modelo de precio</tspan></text><rect x="450" y="22" width="98" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="499" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="499" dy="0">Economía</tspan><tspan x="499" dy="19.2">unitaria</tspan></text><rect x="415" y="141" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="499" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="499" dy="0">Sostenibilidad y</tspan><tspan x="499" dy="19.2">caja</tspan></text><rect x="205.5" y="141" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="285" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="285" dy="0">Concentración y</tspan><tspan x="285" dy="19.2">dependencia</tspan></text><rect x="92" y="107.5" width="110" height="60" rx="4" fill="#ffffff"/><text x="147" y="123.4" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="147" dy="0">un cliente o</tspan><tspan x="147" dy="17.92">supuesto</tspan><tspan x="147" dy="17.92">cambia</tspan></text></svg>
