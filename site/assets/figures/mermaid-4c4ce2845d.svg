<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 844 266" width="844" height="266" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Cliente» … «Reintento o cola de muertos»</title><desc id="d">Diagrama de flujo con 7 pasos. «Cliente» lleva a «Frontera HTTP» (solicitud). «Frontera HTTP» lleva a «Validación e identidad». «Validación e identidad» lleva a «Transacción: fila + outbox». «Transacción: fila + outbox» lleva a «Cliente» (202 o 201). «Transacción: fila + outbox» lleva a «Relevo». «Relevo» lleva a «Trabajo diferido». «Trabajo diferido» lleva a «Cliente» (resultado consultable). «Trabajo diferido» lleva a «Reintento o cola de muertos» (fallo).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="844" height="266" fill="#ffffff"/><path d="M111,94.5 L234,94.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M376,94.5 L483.5,94.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M616.5,94.5 L680,94.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M751,125 L751,191.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M710.5,213.5 L634,213.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M466,213.5 L389,213.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M751,64 L751.0,57.0 Q751,50 744.0,50.0 L75.5,50.0 Q66.5,50 66.5,59.0 L66.5,72.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><path d="M550,191.5 L550.0,148.0 Q550,139 541.0,139.0 L75.5,139.0 Q66.5,139 66.5,130.0 L66.5,116.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="72.5" width="89" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="66.5" y="98.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="66.5" dy="0">Cliente</tspan></text><rect x="234" y="72.5" width="142" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="305" y="98.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="305" dy="0">Frontera HTTP</tspan></text><rect x="483.5" y="64" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="550" y="89.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="550" dy="0">Validación e</tspan><tspan x="550" dy="19.2">identidad</tspan></text><rect x="680" y="64" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="751" y="89.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="751" dy="0">Transacción:</tspan><tspan x="751" dy="19.2">fila + outbox</tspan></text><rect x="710.5" y="191.5" width="81" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="751" y="217.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="751" dy="0">Relevo</tspan></text><rect x="466" y="191.5" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="550" y="217.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="550" dy="0">Trabajo diferido</tspan></text><rect x="221" y="183" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="305" y="208.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="305" dy="0">Reintento o cola</tspan><tspan x="305" dy="19.2">de muertos</tspan></text><rect x="129.5" y="66.5" width="86" height="24" rx="4" fill="#ffffff"/><text x="172.5" y="82.4" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="172.5" dy="0">solicitud</tspan></text><rect x="365.8" y="22" width="86" height="24" rx="4" fill="#ffffff"/><text x="408.8" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="408.8" dy="0">202 o 201</tspan></text><rect x="402.3" y="143" width="102" height="42" rx="4" fill="#ffffff"/><text x="453.3" y="158.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="453.3" dy="0">resultado</tspan><tspan x="453.3" dy="17.92">consultable</tspan></text><rect x="401" y="217.5" width="53" height="24" rx="4" fill="#ffffff"/><text x="427.5" y="233.4" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="427.5" dy="0">fallo</tspan></text></svg>
