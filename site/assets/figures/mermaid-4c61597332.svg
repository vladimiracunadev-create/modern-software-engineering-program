<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 835 360" width="835" height="360" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Petición del inquilino» … «Fallo contenido en la celda 1»</title><desc id="d">Diagrama de flujo con 8 pasos. «Petición del inquilino» lleva a «Enrutador de celdas». «Enrutador de celdas» lleva a «Celda 1: pila completa». «Enrutador de celdas» lleva a «Celda 2: pila completa». «Enrutador de celdas» lleva a «Celda N: pila completa». «Inquilino venenoso» lleva a «Celda 1: pila completa». «Celda 1: pila completa» lleva a «Fallo contenido en la celda 1». «Enrutador de celdas» lleva a «Punto de fallo compartido».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="835" height="360" fill="#ffffff"/><path d="M155,180 L182.0,180.0 Q191,180 191.0,171.0 L191.0,155.0 Q191,146 200.0,146.0 L227,146" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M360,146 L389.0,146.0 Q398,146 398.0,155.0 L398.0,213.5 Q398,222.5 407.0,222.5 L436,222.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M360,146 L389.0,146.0 Q398,146 398.0,137.0 L398.0,61.5 Q398,52.5 407.0,52.5 L436,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M360,141.8 L436,141.8" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M386,222.5 L436,222.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M578,222.5 L628,222.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M360,1