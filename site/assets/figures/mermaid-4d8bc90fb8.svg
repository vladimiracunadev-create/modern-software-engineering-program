<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 472 1021" width="472" height="1021" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Código con la función detrás de una bandera» … «100 %: retirar la bandera y el código muerto»</title><desc id="d">Diagrama de flujo con 10 pasos. «Código con la función detrás de una bandera» lleva a «Despliegue: bandera apagada». «Despliegue: bandera apagada» lleva a «Evaluación: contexto de usuario + reglas». «Evaluación: contexto de usuario + reglas» lleva a «Cubo menor que el porcentaje?» (huella con sal por bandera). «Cubo menor que el porcentaje?» lleva a «Variante nueva» (sí). «Cubo menor que el porcentaje?» lleva a «Variante anterior» (no). «Variante nueva» lleva a «Observación: métricas y errores». «Observación: métricas y errores» lleva a «Ampliar el porcentaje» (bien). «Observación: métricas y errores» lleva a «Apagar sin desplegar» (mal). «Ampliar el porcentaje» lleva a «100 %: retirar la bandera y el código muerto».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="472" height="1021" fill="#ffffff"/><path d="M312.1,102 L312.1,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M312.1,221 L312.1,243.6 Q312.1,250 305.7,250.0 L305.7,250.0 Q299.3,250 299.3,256.4 L299.3,279" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M299.3,359 L299.3,367.0 Q299.3,375 291.3,375.0 L287.6,375.0 Q278.6,375 278.6,384.0 L278.6,435" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M278.6,521 L278.6,529.0 Q278.6,537 270.6,537.0 L174.0,537.0 Q165,537 165.0,546.0 L165,579" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M278.6,521 L278.6,529.0 Q278.6,537 286.6,537.0 L353.0,537.0 Q362,537 362.0,546.0 L362,579" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M165,623 L165.0,647.2 Q165,652 169.8,652.0 L169.8,652.0 Q174.5,652 174.5,656.8 L174.5,681" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M174.5,742 L174.5,750.0 Q174.5,758 166.5,758.0 L110.0,758.0 Q101,758 101.0,767.0 L101,800" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M174.5,742 L174.5,750.0 Q174.5,758 182.5,758.0 L241.0,758.0 Q250,758 250.0,767.0 L250,800" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M101,861 L101.0,885.5 Q101,890 105.5,890.0 L105.5,890.0 Q110,890 110.0,894.5 L110,919" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="224.1" y="22" width="176" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="312.1" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="312.1" dy="0">Código con la</tspan><tspan x="312.1" dy="19.2">función detrás de</tspan><tspan x="312.1" dy="19.2">una bandera</tspan></text><rect x="232.6" y="160" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="312.1" y="185.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="312.1" dy="0">Despliegue:</tspan><tspan x="312.1" dy="19.2">bandera apagada</tspan></text><rect x="215.3" y="279" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="299.3" y="304" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="299.3" dy="0">Evaluación:</tspan><tspan x="299.3" dy="19.2">contexto de</tspan><tspan x="299.3" dy="19.2">usuario + reglas</tspan></text><polygon points="278.6,435 422.1,478 278.6,521 135.1,478" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="278.6" y="472.6" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="278.6" dy="0">Cubo menor que el</tspan><tspan x="278.6" dy="19.2">porcentaje?</tspan></text><rect x="90" y="579" width="150" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="165" y="605.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="165" dy="0">Variante nueva</tspan></text><rect x="274" y="579" width="176" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="362" y="605.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="362" dy="0">Variante anterior</tspan></text><rect x="82" y="681" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="174.5" y="706.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="174.5" dy="0">Observación:</tspan><tspan x="174.5" dy="19.2">métricas y errores</tspan></text><rect x="43.5" y="800" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101" y="825.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101" dy="0">Ampliar el</tspan><tspan x="101" dy="19.2">porcentaje</tspan></text><rect x="192.5" y="800" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="250" y="825.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="250" dy="0">Apagar sin</tspan><tspan x="250" dy="19.2">desplegar</tspan></text><rect x="22" y="919" width="176" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="110" y="944" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">100 %: retirar la</tspan><tspan x="110" dy="19.2">bandera y el</tspan><tspan x="110" dy="19.2">código muerto</tspan></text><rect x="284.6" y="384" width="126" height="42" rx="4" fill="#ffffff"/><text x="347.6" y="399.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="347.6" dy="0">huella con sal</tspan><tspan x="347.6" dy="17.92">por bandera</tspan></text><rect x="171" y="546" width="29" height="24" rx="4" fill="#ffffff"/><text x="185.5" y="561.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="185.5" dy="0">sí</tspan></text><rect x="368" y="546" width="29" height="24" rx="4" fill="#ffffff"/><text x="382.5" y="561.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382.5" dy="0">no</tspan></text><rect x="107" y="767" width="45" height="24" rx="4" fill="#ffffff"/><text x="129.5" y="782.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="129.5" dy="0">bien</tspan></text><rect x="256" y="767" width="37" height="24" rx="4" fill="#ffffff"/><text x="274.5" y="782.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274.5" dy="0">mal</tspan></text></svg>
