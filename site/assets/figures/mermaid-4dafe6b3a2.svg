<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 528 819" width="528" height="819" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Datos de origen» … «Monitoreo»</title><desc id="d">Diagrama de flujo con 9 pasos. «Datos de origen» lleva a «Etiquetas». «Datos de origen» lleva a «Características». «Etiquetas» lleva a «Entrenamiento». «Características» lleva a «Entrenamiento». «Entrenamiento» lleva a «Evaluación». «Evaluación» lleva a «Registro del modelo». «Registro del modelo» lleva a «Despliegue». «Despliegue» lleva a «Servicio». «Servicio» lleva a «Monitoreo». «Monitoreo» lleva a «Entrenamiento» (deriva o falla). «Servicio» lleva a «Datos de origen» (decisión que cambia el mundo).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="528" height="819" fill="#ffffff"/><path d="M289,66 L289.0,86.0 Q289,95 280.0,95.0 L214.5,95.0 Q205.5,95 205.5,104.0 L205.5,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M289,66 L289.0,86.0 Q289,95 298.0,95.0 L363.5,95.0 Q372.5,95 372.5,104.0 L372.5,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M205.5,168 L205.5,188.0 Q205.5,197 214.5,197.0 L280.0,197.0 Q289,197 289.0,206.0 L289,226" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M372.5,168 L372.5,188.0 Q372.5,197 363.5,197.0 L298.0,197.0 Q289,197 289.0,206.0 L289,226" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M289,270 L289,328" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M289,