<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 166" width="840" height="166" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Contrato multicapa» … «Aceptación desde el consumidor»</title><desc id="d">Diagrama de flujo con 5 pasos. «Contrato multicapa» lleva a «Matriz de compatibilidad». «Matriz de compatibilidad» lleva a «Release candidate». «Release candidate» lleva a «Supply chain mínima». «Supply chain mínima» lleva a «Aceptación desde el consumidor». «Aceptación desde el consumidor» lleva a «Contrato multicapa» (fallo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="840" height="166" fill="#ffffff"/><path d="M129,104 L175,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M325,104 L371,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M478,104 L524,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M657,104 L703,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M760.5,64 L760.5,57.0 Q760.5,50 753.5,50.0 L84.5,50.0 Q75.5,50 75.5,59.0 L75.5,73.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="73.5" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="75.5" y="98.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="75.5" dy="0">Contrato</tspan><tspan x="75.5" dy="19.2">multicapa</tspan></text><rect x="175" y="73.5" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="250" y="98.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="250" dy="0">Matriz de</tspan><tspan x="250" dy="19.2">compatibilidad</tspan></text><rect x="371" y="73.5" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="424.5" y="98.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="424.5" dy="0">Release</tspan><tspan x="424.5" dy="19.2">candidate</tspan></text><rect x="524" y="73.5" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="590.5" y="98.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="590.5" dy="0">Supply chain</tspan><tspan x="590.5" dy="19.2">mínima</tspan></text><rect x="703" y="64" width="115" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="760.5" y="89" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="760.5" dy="0">Aceptación</tspan><tspan x="760.5" dy="19.2">desde el</tspan><tspan x="760.5" dy="19.2">consumidor</tspan></text><rect x="355" y="22" width="126" height="24" rx="4" fill="#ffffff"/><text x="418" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="418" dy="0">fallo o cambio</tspan></text></svg>
