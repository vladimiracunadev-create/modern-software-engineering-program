<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 383 771" width="383" height="771" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Pregunta» … «Límites: quién no aparece»</title><desc id="d">Diagrama de flujo con 8 pasos. «Pregunta» lleva a «Evento mínimo». «Evento mínimo» lleva a «Compuerta». «Compuerta» lleva a «No se envía» (sin consentimiento). «Compuerta» lleva a «Se envía» (consentimiento y sin señal de rechazo). «Se envía» lleva a «Agregación». «Agregación» lleva a «Resultado» (ruido o umbral). «Resultado» lleva a «Límites: quién no aparece».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="383" height="771" fill="#ffffff"/><path d="M137,66 L137,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M137,168 L137.0,191.6 Q137,197 142.4,197.0 L142.4,197.0 Q147.9,197 147.9,202.4 L147.9,226" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M147.9,288 L147.9,296.0 Q147.9,304 139.9,304.0 L93.0,304.0 Q84,304 84.0,313.0 L84,382" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M147.9,288 L147.9,296.0 Q147.9,304 155.9,304.0 L220.0,304.0 Q229,304 229.0,313.0 L229,382" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M229,426 L229.0,446.0 Q229,455 220.0,455.0 L216.6,455.0 Q207.6,455 207.6,464.0 L207.6,484" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M207.6,528 L207.6,536.0 Q207.6,544 199.6,544.0 L198.8,544.0 Q190,544 190.0,552.8 L190,586" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M190,630 L190.0,654.5 Q190,659 185.5,659.0 L185.5,659.0 Q181,659 181.0,663.5 L181,688" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="88" y="22" width="98" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="137" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="137" dy="0">Pregunta</tspan></text><rect x="66" y="124" width="142" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="137" y="150.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="137" dy="0">Evento mínimo</tspan></text><polygon points="147.9,226 212.4,257 147.9,288 83.4,257" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="147.9" y="261.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="147.9" dy="0">Compuerta</tspan></text><rect x="22" y="382" width="124" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="84" y="408.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="84" dy="0">No se envía</tspan></text><rect x="180" y="382" width="98" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="229" y="408.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="229" dy="0">Se envía</tspan></text><rect x="150.1" y="484" width="115" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="207.6" y="510.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="207.6" dy="0">Agregación</tspan></text><rect x="136.5" y="586" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="190" y="612.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="190" dy="0">Resultado</tspan></text><rect x="93" y="688" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="181" y="713.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="181" dy="0">Límites: quién no</tspan><tspan x="181" dy="19.2">aparece</tspan></text><rect x="90" y="322" width="126" height="42" rx="4" fill="#ffffff"/><text x="153" y="337.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="153" dy="0">sin</tspan><tspan x="153" dy="17.92">consentimiento</tspan></text><rect x="235" y="313" width="126" height="60" rx="4" fill="#ffffff"/><text x="298" y="328.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="298" dy="0">consentimiento</tspan><tspan x="298" dy="17.92">y sin señal de</tspan><tspan x="298" dy="17.92">rechazo</tspan></text><rect x="196" y="553" width="126" height="24" rx="4" fill="#ffffff"/><text x="259" y="568.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="259" dy="0">ruido o umbral</tspan></text></svg>
