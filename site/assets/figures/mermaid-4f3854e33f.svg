<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 848 166" width="848" height="166" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Espacio de estados» … «Recurrencias / umbral práctico»</title><desc id="d">Diagrama de flujo con 5 pasos. «Espacio de estados» lleva a «Backtracking». «Backtracking» lleva a «Poda segura». «Poda segura» lleva a «Divide / vencerás». «Divide / vencerás» lleva a «Recurrencias / umbral práctico». «Recurrencias / umbral práctico» lleva a «Espacio de estados» (fallo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="848" height="166" fill="#ffffff"/><path d="M137,104 L183,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M316,104 L362,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M486,104 L532,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M630,104 L676,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M751,64 L751.0,57.0 Q751,50 744.0,50.0 L88.5,50.0 Q79.5,50 79.5,59.0 L79.5,73.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="73.5" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="79.5" y="98.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="79.5" dy="0">Espacio de</tspan><tspan x="79.5" dy="19.2">estados</tspan></text><rect x="183" y="82" width="133" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="249.5" y="108.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="249.5" dy="0">Backtracking</tspan></text><rect x="362" y="82" width="124" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="424" y="108.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="424" dy="0">Poda segura</tspan></text><rect x="532" y="73.5" width="98" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="581" y="98.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="581" dy="0">Divide /</tspan><tspan x="581" dy="19.2">vencerás</tspan></text><rect x="676" y="64" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="751" y="89" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="751" dy="0">Recurrencias /</tspan><tspan x="751" dy="19.2">umbral</tspan><tspan x="751" dy="19.2">práctico</tspan></text><rect x="352.2" y="22" width="126" height="24" rx="4" fill="#ffffff"/><text x="415.2" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="415.2" dy="0">fallo o cambio</tspan></text></svg>
