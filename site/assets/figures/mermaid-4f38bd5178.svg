<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 758 206" width="758" height="206" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Documento recibido» y «Patrón con retroceso» … «Reglas de negocio» y «Rechazo con motivo»</title><desc id="d">Diagrama de flujo con 6 pasos. «Documento recibido» lleva a «Esquema: forma». «Esquema: forma» lleva a «Reglas entre campos» (válido). «Reglas entre campos» lleva a «Reglas de negocio» (válido). «Esquema: forma» lleva a «Rechazo con motivo» (inválido). «Reglas entre campos» lleva a «Rechazo con motivo» (inválido). «Patrón con retroceso» lleva a «Esquema: forma» (agota CPU).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="758" height="206" fill="#ffffff"/><path d="M133,52.5 L181.0,52.5 Q190,52.5 190.0,61.5 L190.0,86.0 Q190,95 199.0,95.0 L247,95" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M345,95 L430,95" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M511,95 L519.0,95.0 Q527,95 527.0,87.0 L527.0,61.5 Q527,52.5 536.0,52.5 L620.5,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M296,125.5 L296.0,173.0 Q296,182 305.0,182.0 L667.0,182.0 Q674,182 674.0,175.0 L674,168" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M511,95 L519.0,95.0 Q527,95 527.0,103.0 L527.0,128.5 Q527,137.5 536.0,137.5 L612,137.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M137,137.5 L145.0,137.5 Q153,137.5 153.0,129.5 L153.0,104.0 Q153,95 162.0,95.0 L247,95"