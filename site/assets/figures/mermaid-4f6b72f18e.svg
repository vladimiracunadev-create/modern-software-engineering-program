<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 894 379" width="894" height="379" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Decisión con n condiciones» … «Cada condición, aislada, cambia el resultado»</title><desc id="d">Diagrama de flujo con 10 pasos. «Decisión con n condiciones» lleva a «Vectores de prueba». «Vectores de prueba» lleva a «Criterio». «Criterio» lleva a «2 pruebas mínimas» (decisión). «Criterio» lleva a «2 pruebas mínimas» (condiciones). «Criterio» lleva a «n + 1 pruebas mínimas» (MC/DC). «n + 1 pruebas mínimas» lleva a «Cada condición, aislada, cambia el resultado». «Decisión con n condiciones» lleva a «Simulación SIL». «Simulación SIL» lleva a «Banco con hardware HIL». «Banco con hardware HIL» lleva a «Sistema real».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="894" height="379" fill="#ffffff"/><path d="M146,189.5 L160.0,189.5 Q169,189.5 169.0,180.5 L169.0,156.0 Q169,147 178.0,147.0 L192,147" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M316,147 L334.2,147.0 Q339,147 339.0,142.2 L339.0,142.2 Q339,137.5 343.8,137.5 L362,137.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M478,137.5 L486.0,137.5 Q494,137.5 494.0,129.5 L494.0,61.5 Q494,52.5 503.0,52.5 L604,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M478,137.5 L604,137.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M478,137.5 L486.0,137.5 Q494,137.5 494.0,145.5 L494.0,223.0 Q494,232 503.0,232.0 L613,232" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M702,232 L757,232" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M146,189.5 L162.2,189.5 Q171.2,189.5 171.2,198.5 L171.2,223.0 Q171.2,232 180.2,232.0 L196.5,232" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M311.5,232.2 L366.5,232.2" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M473.5,232.5 L534.2,232.5 Q543.2,232.5 543.2,241.5 L543.2,317.5 Q543.2,326.5 552.2,326.5 L613,326.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="149.5" width="124" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="84" y="174.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="84" dy="0">Decisión</tspan><tspan x="84" dy="19.2">con n</tspan><tspan x="84" dy="19.2">condiciones</tspan></text><rect x="192" y="116.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="254" y="141.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="254" dy="0">Vectores de</tspan><tspan x="254" dy="19.2">prueba</tspan></text><polygon points="420,106.5 478,137.5 420,168.5 362,137.5" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="420" y="141.7" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="420" dy="0">Criterio</tspan></text><rect x="604" y="22" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="657.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="657.5" dy="0">2 pruebas</tspan><tspan x="657.5" dy="19.2">mínimas</tspan></text><rect x="604" y="107" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="657.5" y="132.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="657.5" dy="0">2 pruebas</tspan><tspan x="657.5" dy="19.2">mínimas</tspan></text><rect x="613" y="192" width="89" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="657.5" y="217" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="657.5" dy="0">n + 1</tspan><tspan x="657.5" dy="19.2">pruebas</tspan><tspan x="657.5" dy="19.2">mínimas</tspan></text><rect x="757" y="173" width="115" height="118" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="814.5" y="197.8" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="814.5" dy="0">Cada</tspan><tspan x="814.5" dy="19.2">condición,</tspan><tspan x="814.5" dy="19.2">aislada,</tspan><tspan x="814.5" dy="19.2">cambia el</tspan><tspan x="814.5" dy="19.2">resultado</tspan></text><rect x="196.5" y="201.5" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="254" y="226.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="254" dy="0">Simulación</tspan><tspan x="254" dy="19.2">SIL</tspan></text><rect x="366.5" y="192.5" width="107" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="420" y="217.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="420" dy="0">Banco con</tspan><tspan x="420" dy="19.2">hardware</tspan><tspan x="420" dy="19.2">HIL</tspan></text><rect x="613" y="296" width="89" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="657.5" y="321.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="657.5" dy="0">Sistema</tspan><tspan x="657.5" dy="19.2">real</tspan></text><rect x="510.5" y="24.5" width="77" height="24" rx="4" fill="#ffffff"/><text x="549" y="40.4" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="549" dy="0">decisión</tspan></text><rect x="502" y="175.5" width="102" height="24" rx="4" fill="#ffffff"/><text x="553" y="191.4" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="553" dy="0">condiciones</tspan></text><rect x="527" y="204" width="53" height="24" rx="4" fill="#ffffff"/><text x="553.5" y="219.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="553.5" dy="0">MC/DC</tspan></text></svg>
