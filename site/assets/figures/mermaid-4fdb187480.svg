<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 831 165" width="831" height="165" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Producción» … «Métrica de vanidad y meta»</title><desc id="d">Diagrama de flujo con 5 pasos. «Producción» lleva a «Actividad». «Actividad» lleva a «Resultado». «Resultado» lleva a «Impacto». «Impacto» lleva a «Métrica de vanidad y meta». «Métrica de vanidad y meta» lleva a «Producción» (la meta cambia la conducta).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="831" height="165" fill="#ffffff"/><path d="M137,112.5 L183,112.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M290,112.5 L336,112.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M443,112.5 L489,112.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M578,112.5 L624,112.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M716.5,82 L716.5,75.0 Q716.5,68 709.5,68.0 L88.5,68.0 Q79.5,68 79.5,77.0 L79.5,90.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="90.5" width="115" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="79.5" y="116.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="79.5" dy="0">Producción</tspan></text><rect x="183" y="90.5" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="236.5" y="116.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="236.5" dy="0">Actividad</tspan></text><rect x="336" y="90.5" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="389.5" y="116.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="389.5" dy="0">Resultado</tspan></text><rect x="489" y="90.5" width="89" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="533.5" y="116.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="533.5" dy="0">Impacto</tspan></text><rect x="624" y="82" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="716.5" y="107.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="716.5" dy="0">Métrica de vanidad</tspan><tspan x="716.5" dy="19.2">y meta</tspan></text><rect x="335" y="22" width="126" height="42" rx="4" fill="#ffffff"/><text x="398" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="398" dy="0">la meta cambia</tspan><tspan x="398" dy="17.92">la conducta</tspan></text></svg>
