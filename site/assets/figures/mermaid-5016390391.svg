<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 224" width="756" height="224" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Automatización frágil» … «Matriz tras el cambio»</title><desc id="d">Diagrama de flujo con 7 pasos. «Automatización frágil» lleva a «Inyección de fallos». «Inyección de fallos» lleva a «Matriz de resultados». «Matriz de resultados» lleva a «Debilidades priorizadas». «Debilidades priorizadas» lleva a «Endurecimiento». «Endurecimiento» lleva a «Reinyección». «Reinyección» lleva a «Matriz tras el cambio».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="756" height="224" fill="#ffffff"/><path d="M172,52.5 L226.5,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M359.5,52.5 L418.5,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M533.5,52.5 L597,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M659,83 L659,149.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M584,171.5 L538,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M414,171.5 L368,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="22" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="97" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="97" dy="0">Automatización</tspan><tspan x="97" dy="19.2">frágil</tspan></text><rect x="226.5" y="22" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="293" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="293" dy="0">Inyección de</tspan><tspan x="293" dy="19.2">fallos</tspan></text><rect x="418.5" y="22" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="476" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="476" dy="0">Matriz de</tspan><tspan x="476" dy="19.2">resultados</tspan></text><rect x="597" y="22" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="659" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="659" dy="0">Debilidades</tspan><tspan x="659" dy="19.2">priorizadas</tspan></text><rect x="584" y="149.5" width="150" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="659" y="175.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="659" dy="0">Endurecimiento</tspan></text><rect x="414" y="149.5" width="124" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="476" y="175.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="476" dy="0">Reinyección</tspan></text><rect x="218" y="141" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="293" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="293" dy="0">Matriz tras el</tspan><tspan x="293" dy="19.2">cambio</tspan></text></svg>
