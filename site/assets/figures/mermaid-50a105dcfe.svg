<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 332" width="840" height="332" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Función del cliente» … «Revisión con personas»</title><desc id="d">Diagrama de flujo con 8 pasos. «Función del cliente» lleva a «Entradas posibles». «Entradas posibles» lleva a «Tacto: tamaño y separación». «Entradas posibles» lleva a «Teclado: orden de foco». «Entradas posibles» lleva a «Lector: nombre y rol». «Función del cliente» lleva a «Presentación: contraste». «Tacto: tamaño y separación» lleva a «Comprobación automática». «Teclado: orden de foco» lleva a «Comprobación automática». «Presentación: contraste» lleva a «Comprobación automática». «Comprobación automática» lleva a «Revisión con personas». «Lector: nombre y rol» lleva a «Revisión con personas».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="840" height="332" fill="#ffffff"/><path d="M146,166 L171.0,166.0 Q180,166 180.0,157.0 L180.0,132.5 Q180,123.5 189.0,123.5 L214,123.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M312,123.5 L337.0,123.5 Q346,123.5 346.0,114.5 L346.0,71.0 Q346,62 355.0,62.0 L380,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M312,123.5 L341.2,123.5 Q350.2,123.5 350.2,132.5 L350.2,157.0 Q350.2,166 359.2,166.0 L388.5,166" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M312,123.5 L341.2,123.5 Q350.2,123.5 350.2,132.5 L350.2,261.0 Q350.2,270 359.2,270.0 L388.5,270" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="