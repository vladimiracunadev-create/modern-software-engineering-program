<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 562 649" width="562" height="649" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Turno de conversación» … «Respuesta con origen»</title><desc id="d">Diagrama de flujo con 9 pasos. «Turno de conversación» lleva a «Contexto de trabajo: lo que se envía ahora». «Contexto de trabajo: lo que se envía ahora» lleva a «Resumen con pérdidas» (se llena). «Turno de conversación» lleva a «Extractor de hechos». «Extractor de hechos» lleva a «Almacén: clave, valor, versión, origen». «Pregunta» lleva a «Lectura por clave o similitud». «Almacén: clave, valor, versión, origen» lleva a «Lectura por clave o similitud». «Resumen con pérdidas» lleva a «Lectura por clave o similitud». «Contexto de trabajo: lo que se envía ahora» lleva a «Lectura por clave o similitud». «Lectura por clave o similitud» lleva a «Respuesta con origen». «Almacén: clave, valor, versión, origen» lleva a «Olvido deliberado» (caducidad o borrado).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="562" height="649" fill="#ffffff"/><path d="M259.6,83 L259.6,103.0 Q259.6,112 250.6,112.0 L172.1,112.0 Q163.1,112 163.1,121.0 L163.1,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M163.1,221 L163.1,229.0 Q163.1,237 155.1,237.0 L109.0,237.0 Q100,237 100.0,246.0 L100,294.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M259.6,83 L259.6,107.8 Q259.6,116.8 268.6,116.8 L347.1,116.8 Q356.1,116.8 356.1,125.8 L356.1,150.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#a