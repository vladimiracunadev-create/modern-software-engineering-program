<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 360" width="810" height="360" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Decisión que puede cambiar» … «Diseño revisable»</title><desc id="d">Diagrama de flujo con 8 pasos. «Decisión que puede cambiar» lleva a «Cambiar: módulo que la esconde». «Decisión que puede cambiar» lleva a «Probar: dependencia inyectada». «Decisión que puede cambiar» lleva a «Operar: dato registrado». «Cambiar: módulo que la esconde» lleva a «Medida: módulos tocados por cambio». «Probar: dependencia inyectada» lleva a «Medida: ejecuciones deterministas». «Operar: dato registrado» lleva a «Medida: solicitudes reconstruibles». «Medida: módulos tocados por cambio» lleva a «Diseño revisable». «Medida: ejecuciones deterministas» lleva a «Diseño revisable». «Medida: solicitudes reconstruibles» lleva a «Diseño revisable». «Diseño revisable» lleva a «Decisión que puede cambiar» (incidente o cambio inesperado).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="810" height="360" fill="#ffffff"/><path d="M164,180 L178.0,180.0 Q187,180 187.0,171.0 L187.0,71.0 Q187,62 196.0,62.0 L210,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M164,180 L227.5,180" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M164,180 L184.5,180.0 Q193.5,180 193.5,189.0 L193.5,289.0 Q193.5,298 202.5,298.0 L223,298" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M369,62 L415,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M351.5,180 L423.5,180" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M356,298 L419.5,298" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M574,62 L588.0,62.0 Q597,62 597.0,71.0 L597.0,171.0 Q597,180 606.0,180.0 L620,180" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M565.5,180 L620,180" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M569.5,298 L585.8,298.0 Q594.8,298 594.8,289.0 L594.8,189.0 Q594.8,180 603.8,180.0 L620,180" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M704,158 L704.0,135.0 Q704,126 695.0,126.0 L102.0,126.0 Q93,126 93.0,135.0 L93,149.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="149.5" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="93" y="174.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="93" dy="0">Decisión que</tspan><tspan x="93" dy="19.2">puede cambiar</tspan></text><rect x="210" y="31.5" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="289.5" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="289.5" dy="0">Cambiar: módulo</tspan><tspan x="289.5" dy="19.2">que la esconde</tspan></text><rect x="227.5" y="140" width="124" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="289.5" y="165" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="289.5" dy="0">Probar:</tspan><tspan x="289.5" dy="19.2">dependencia</tspan><tspan x="289.5" dy="19.2">inyectada</tspan></text><rect x="223" y="267.5" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="289.5" y="292.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="289.5" dy="0">Operar: dato</tspan><tspan x="289.5" dy="19.2">registrado</tspan></text><rect x="415" y="22" width="159" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="494.5" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="494.5" dy="0">Medida: módulos</tspan><tspan x="494.5" dy="19.2">tocados por</tspan><tspan x="494.5" dy="19.2">cambio</tspan></text><rect x="423.5" y="140" width="142" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="494.5" y="165" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="494.5" dy="0">Medida:</tspan><tspan x="494.5" dy="19.2">ejecuciones</tspan><tspan x="494.5" dy="19.2">deterministas</tspan></text><rect x="419.5" y="258" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="494.5" y="283" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="494.5" dy="0">Medida:</tspan><tspan x="494.5" dy="19.2">solicitudes</tspan><tspan x="494.5" dy="19.2">reconstruibles</tspan></text><rect x="620" y="158" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="704" y="184.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="704" dy="0">Diseño revisable</tspan></text><rect x="653" y="92" width="102" height="60" rx="4" fill="#ffffff"/><text x="704" y="107.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="704" dy="0">incidente o</tspan><tspan x="704" dy="17.92">cambio</tspan><tspan x="704" dy="17.92">inesperado</tspan></text></svg>
