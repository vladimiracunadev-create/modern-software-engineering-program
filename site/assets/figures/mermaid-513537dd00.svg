<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 338 769" width="338" height="769" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Persona externa» … «Conocimiento repartido»</title><desc id="d">Diagrama de flujo con 8 pasos. «Persona externa» lleva a «Guía de contribución». «Guía de contribución» lleva a «Copia propia». «Copia propia» lleva a «Original» (sincronizar). «Copia propia» lleva a «Propuesta». «Propuesta» lleva a «Regla de decisión». «Regla de decisión» lleva a «Original» (acepta). «Regla de decisión» lleva a «Respuesta con motivo» (rechaza). «Original» lleva a «Conocimiento repartido».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="338" height="769" fill="#ffffff"/><path d="M219.5,66 L219.5,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M215.3,185 L215.3,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M144.5,265 L33.0,265.0 Q24,265 24.0,274.0 L24.0,590.5 Q24,597.5 31.0,597.5 L38,597.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M211,287 L211.0,309.2 Q211,316 204.2,316.0 L204.2,316.0 Q197.4,316 197.4,322.8 L197.4,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M197.4,389 L197.4,409.0 Q197.4,418 188.4,418.0 L186.6,418.0 Q177.6,418 177.6,427.0 L177.6,447" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M177.6,509 L177.6,517.0 Q177.6,525 169.6,525.0 L96.0,525.0 Q87,525 87.0,534.0 L87,575.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M177.6,509 L177.6,517.0 Q177.6,525 185.6,525.0 L232.0,525.0 Q241,525 241.0,534.0 L241,567" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M89.1,619.5 L89.1,686" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="140" y="22" width="159" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="219.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="219.5" dy="0">Persona externa</tspan></text><rect x="153" y="124" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="219.5" y="149.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="219.5" dy="0">Guía de</tspan><tspan x="219.5" dy="19.2">contribución</tspan></text><rect x="144.5" y="243" width="133" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="211" y="269.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="211" dy="0">Copia propia</tspan></text><rect x="38" y="575.5" width="98" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="87" y="601.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="87" dy="0">Original</tspan></text><rect x="143.9" y="345" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="197.4" y="371.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="197.4" dy="0">Propuesta</tspan></text><polygon points="177.6,447 292.1,478 177.6,509 63.1,478" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="177.6" y="482.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="177.6" dy="0">Regla de decisión</tspan></text><rect x="170" y="567" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="241" y="592.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="241" dy="0">Respuesta con</tspan><tspan x="241" dy="19.2">motivo</tspan></text><rect x="24.7" y="686" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="91.2" y="711.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="91.2" dy="0">Conocimiento</tspan><tspan x="91.2" dy="19.2">repartido</tspan></text><rect x="30" y="419.2" width="102" height="24" rx="4" fill="#ffffff"/><text x="81" y="435.1" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="81" dy="0">sincronizar</tspan></text><rect x="93" y="538.2" width="61" height="24" rx="4" fill="#ffffff"/><text x="123.5" y="554.1" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="123.5" dy="0">acepta</tspan></text><rect x="247" y="534" width="69" height="24" rx="4" fill="#ffffff"/><text x="281.5" y="549.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="281.5" dy="0">rechaza</tspan></text></svg>
