<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 926 88" width="926" height="88" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «🎯 Cuenta» … «📈 Recuperación»</title><desc id="d">Diagrama de flujo con 5 pasos. «🎯 Cuenta» lleva a «🧠 Identidad». «🧠 Identidad» lleva a «🛠️ Infraestructura». «🛠️ Infraestructura» lleva a «🔎 Servicio». «🔎 Servicio» lleva a «📈 Recuperación».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="926" height="88" fill="#ffffff"/><path d="M127,44 L173,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M304,44 L350,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M533,44 L579,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M701,44 L747,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="22" width="105" height="44" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="74.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="74.5" dy="0">🎯 Cuenta</tspan></text><rect x="173" y="22" width="131" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="238.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="238.5" dy="0">🧠 Identidad</tspan></text><rect x="350" y="22" width="183" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="441.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="441.5" dy="0">🛠️ Infraestructura</tspan></text><rect x="579" y="22" width="122" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="640" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="640" dy="0">🔎 Servicio</tspan></text><rect x="747" y="22" width="157" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="825.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="825.5" dy="0">📈 Recuperación</tspan></text></svg>
