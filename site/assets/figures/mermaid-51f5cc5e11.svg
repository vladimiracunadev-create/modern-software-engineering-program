<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 379 924" width="379" height="924" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Programa en bytecode eBPF» … «Lectura desde el espacio de usuario»</title><desc id="d">Diagrama de flujo con 9 pasos. «Programa en bytecode eBPF» lleva a «bpf PROG_LOAD». «bpf PROG_LOAD» lleva a «Verificador». «Verificador» lleva a «Error y mensaje» (rechaza). «Verificador» lleva a «Compilación a código nativo» (acepta). «Compilación a código nativo» lleva a «Enganche a un punto: paquetes, llamadas, trazas». «Enganche a un punto: paquetes, llamadas, trazas» lleva a «Ejecución en el núcleo». «Ejecución en el núcleo» lleva a «Mapas». «Mapas» lleva a «Lectura desde el espacio de usuario».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="379" height="924" fill="#ffffff"/><path d="M170.7,83 L170.7,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M170.7,185 L170.7,207.5 Q170.7,214 177.2,214.0 L177.2,214.0 Q183.7,214 183.7,220.5 L183.7,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M183.7,305 L183.7,313.0 Q183.7,321 175.7,321.0 L110.5,321.0 Q101.5,321 101.5,330.0 L101.5,371.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M183.7,305 L183.7,313.0 Q183.7,321 191.7,321.0 L277.0,321.0 Q286,321 286.0,330.0 L286,363" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M286,424 L286.0,444.0 Q286,453 277.0,453.0 L262.8,453.0 Q253.8,453 253.8,462.0 L253.8,482" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M253.8,562 L253.8,582.0 Q253.8,591 244.8,591.0 L234.8,591.0 Q225.8,591 225.8,600.0 L225.8,620" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M225.8,681 L225.8,701.0 Q225.8,710 216.8,710.0 L216.0,710.0 Q207,710 207.0,719.0 L207,739" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M207,783 L207.0,807.2 Q207,812 202.2,812.0 L202.2,812.0 Q197.5,812 197.5,816.8 L197.5,841" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="99.7" y="22" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="170.7" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="170.7" dy="0">Programa en</tspan><tspan x="170.7" dy="19.2">bytecode eBPF</tspan></text><rect x="99.7" y="141" width="142" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="170.7" y="167.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="170.7" dy="0">bpf PROG_LOAD</tspan></text><polygon points="183.7,243 260.7,274 183.7,305 106.7,274" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="183.7" y="278.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="183.7" dy="0">Verificador</tspan></text><rect x="22" y="371.5" width="159" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101.5" y="397.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101.5" dy="0">Error y mensaje</tspan></text><rect x="215" y="363" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="286" y="388.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="286" dy="0">Compilación a</tspan><tspan x="286" dy="19.2">código nativo</tspan></text><rect x="169.8" y=