<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 439 757" width="439" height="757" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Datos y carga de la plataforma» … «Decisión con medida»</title><desc id="d">Diagrama de flujo con 9 pasos. «Datos y carga de la plataforma» lleva a «¿Qué crece?». «¿Qué crece?» lleva a «Replicar: copias del mismo dato» (lecturas o disponibilidad). «¿Qué crece?» lleva a «Particionar: repartir por clave» (volumen o escrituras). «Replicar: copias del mismo dato» lleva a «Riesgo: lecturas viejas y conflictos». «Particionar: repartir por clave» lleva a «Riesgo: movimiento de datos y clave caliente». «Riesgo: lecturas viejas y conflictos» lleva a «Lectura propia, cuórum o líder». «Riesgo: movimiento de datos y clave caliente» lleva a «Anillo con puntos virtuales y subclaves». «Lectura propia, cuórum o líder» lleva a «Decisión con medida». «Anillo con puntos virtuales y subclaves» lleva a «Decisión con medida».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="439" height="757" fill="#ffffff"/><path d="M211.2,83 L211.2,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M211.2,203 L211.2,211.0 Q211.2,219 203.2,219.0 L115.0,219.0 Q106,219 106.0,228.0 L106,279" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M211.2,203 L211.2,211.0 Q211.2,219 219.2,219.0 L307.5,219.0 Q316.5,219 316.5,228.0 L316.5,279" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M106,340 L106,398" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M316.5,340 L316.5,398" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M108.2,478 L108.2,545.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M314.3,478 L314.3,536" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M110.5,606.5 L110.5,631.2 Q110.5,640.2 119.5,640.2 L202.3,640.2 Q211.3,640.2 211.3,649.2 L211.3,674" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M312,616 L312.0,636.0 Q312,645 303.0,645.0 L220.3,645.0 Q211.3,645 211.3,654.0 L211.3,674" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="127.2" y="22" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="211.2" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="211.2" dy="0">Datos y carga de</tspan><tspan x="211.2" dy="19.2">la plataforma</tspan></text><polygon points="211.2,141 288.2,172 211.2,203 134.2,172" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="211.2" y="176.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="211.2" dy="0">¿Qué crece?</tspan></text><rect x="22" y="279" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="304.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Replicar: copias</tspan><tspan x="106" dy="19.2">del mismo dato</tspan></text><rect x="224" y="279" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="316.5" y="304.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="316.5" dy="0">Particionar:</tspan><tspan x="316.5" dy="19.2">repartir por clave</tspan></text><rect x="22" y="398" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="423" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Riesgo: lecturas</tspan><tspan x="106" dy="19.2">viejas y</tspan><tspan x="106" dy="19.2">conflictos</tspan></text><rect x="224" y="398" width="185" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="316.5" y="423" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="316.5" dy="0">Riesgo: movimiento</tspan><tspan x="316.5" dy="19.2">de datos y clave</tspan><tspan x="316.5" dy="19.2">caliente</tspan></text><rect x="31" y="545.5" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="110.5" y="570.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110.5" dy="0">Lectura propia,</tspan><tspan x="110.5" dy="19.2">cuórum o líder</tspan></text><rect x="224" y="536" width="176" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="312" y="561" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="312" dy="0">Anillo con puntos</tspan><tspan x="312" dy="19.2">virtuales y</tspan><tspan x="312" dy="19.2">subclaves</tspan></text><rect x="144.8" y="674" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="211.3" y="699.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="211.3" dy="0">Decisión con</tspan><tspan x="211.3" dy="19.2">medida</tspan></text><rect x="112" y="228" width="126" height="42" rx="4" fill="#ffffff"/><text x="175" y="243.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="175" dy="0">lecturas o</tspan><tspan x="175" dy="17.92">disponibilidad</tspan></text><rect x="322.5" y="228" width="94" height="42" rx="4" fill="#ffffff"/><text x="369.5" y="243.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="369.5" dy="0">volumen o</tspan><tspan x="369.5" dy="17.92">escrituras</tspan></text></svg>
