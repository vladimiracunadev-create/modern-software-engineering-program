<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 849 166" width="849" height="166" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Triage / contención» … «Causa, corrección / seguimiento»</title><desc id="d">Diagrama de flujo con 5 pasos. «Triage / contención» lleva a «Cronología / hechos». «Cronología / hechos» lleva a «Hipótesis rivales». «Hipótesis rivales» lleva a «Escalera de herramientas». «Escalera de herramientas» lleva a «Causa, corrección / seguimiento». «Causa, corrección / seguimiento» lleva a «Triage / contención» (fallo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="849" height="166" fill="#ffffff"/><path d="M137,104 L183,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M316,104 L362,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M469,104 L515,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M648,104 L694,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M760.5,64 L760.5,57.0 Q760.5,50 753.5,50.0 L88.5,50.0 Q79.5,50 79.5,59.0 L79.5,73.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="73.5" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="79.5" y="98.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="79.5" dy="0">Triage /</tspan><tspan x="79.5" dy="19.2">contención</tspan></text><rect x="183" y="73.5" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="249.5" y="98.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="249.5" dy="0">Cronología /</tspan><tspan x="249.5" dy="19.2">hechos</tspan></text><rect x="362" y="73.5" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="415.5" y="98.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="415.5" dy="0">Hipótesis</tspan><tspan x="415.5" dy="19.2">rivales</tspan></text><rect x="515" y="73.5" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="581.5" y="98.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="581.5" dy="0">Escalera de</tspan><tspan x="581.5" dy="19.2">herramientas</tspan></text><rect x="694" y="64" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="760.5" y="89" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="760.5" dy="0">Causa,</tspan><tspan x="760.5" dy="19.2">corrección /</tspan><tspan x="760.5" dy="19.2">seguimiento</tspan></text><rect x="357" y="22" width="126" height="24" rx="4" fill="#ffffff"/><text x="420" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="420" dy="0">fallo o cambio</tspan></text></svg>
