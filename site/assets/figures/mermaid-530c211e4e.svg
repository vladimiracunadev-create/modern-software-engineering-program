<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 587 303" width="587" height="303" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Pregunta de decisión» … «Comprobación estructural», «Deriva con el código» y «Normalización»</title><desc id="d">Diagrama de flujo con 7 pasos. «Pregunta de decisión» lleva a «Modelo estructural». «Pregunta de decisión» lleva a «Modelo conductual». «Pregunta de decisión» lleva a «Modelo de información». «Modelo estructural» lleva a «Comprobación estructural». «Modelo de información» lleva a «Normalización». «Modelo estructural» lleva a «Deriva con el código». «Deriva con el código» lleva a «Modelo estructural» (actualizar).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="587" height="303" fill="#ffffff"/><path d="M146,151.5 L160.0,151.5 Q169,151.5 169.0,142.5 L169.0,61.5 Q169,52.5 178.0,52.5 L192,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M146,151.5 L196.5,151.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M146,151.5 L175.2,151.5 Q184.2,151.5 184.2,160.5 L184.2,241.5 Q184.2,250.5 193.2,250.5 L222.5,250.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M377,52.5 L427.5,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M346.5,250.5 L423,250.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M377,52.5 L391.0,52.5 Q400,52.5 400.0,61.5 L400.0,142.5 Q400,151.5 409.0,151.5 L423,151.5" fill="none" stroke="#32505f" stroke-width="1.8" ma