<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 589 621" width="589" height="621" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Medida del servicio» … «Memoria y coste» y «Consulta y alerta»</title><desc id="d">Diagrama de flujo con 9 pasos. «Medida del servicio» lleva a «Tipo: contador, indicador, histograma». «Tipo: contador, indicador, histograma» lleva a «Nombre y unidad». «Tipo: contador, indicador, histograma» lleva a «Dimensiones: etiquetas». «Dimensiones: etiquetas» lleva a «Series = producto de cardinalidades». «Series = producto de cardinalidades» lleva a «Memoria y coste». «Tipo: contador, indicador, histograma» lleva a «Muestreo periódico». «Muestreo periódico» lleva a «Qué se reconstruye: incrementos, picos, percentiles». «Qué se reconstruye: incrementos, picos, percentiles» lleva a «Consulta y alerta». «Memoria y coste» lleva a «Dimensiones: etiquetas» (presupuesto excedido).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="589" height="621" fill="#ffffff"/><path d="M275.9,83 L275.9,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M275.9,221 L275.9,245.2 Q275.9,254.2 266.9,254.2 L110.5,254.2 Q101.5,254.2 101.5,263.2 L101.5,287.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M278.7,221 L278.7,279" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M281.5,340 L281.5,369.5 Q281.5,378.5 272.5,378.5 L252.3,378.5 Q243.3,378.5 243.3,387.5 L243.3,417" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d=