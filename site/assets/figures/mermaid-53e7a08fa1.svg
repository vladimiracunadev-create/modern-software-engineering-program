<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 713 224" width="713" height="224" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Carga y operaciones» … «Decisión»</title><desc id="d">Diagrama de flujo con 7 pasos. «Carga y operaciones» lleva a «Representación». «Representación» lleva a «Invariantes». «Invariantes» lleva a «Algoritmo». «Algoritmo» lleva a «Corrección y complejidad». «Corrección y complejidad» lleva a «Benchmark y perfil». «Benchmark y perfil» lleva a «Decisión». «Decisión» lleva a «Carga y operaciones» (cambia la carga).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="713" height="224" fill="#ffffff"/><path d="M146,52.5 L192,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M342,52.5 L388,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M512,52.5 L571,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M624.5,74.5 L624.5,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M558,171.5 L512,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M388,171.5 L316,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M218,171.5 L93.0,171.5 Q84,171.5 84.0,162.5 L84,83" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="22" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="84" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="84" dy="0">Carga y</tspan><tspan x="84" dy="19.2">operaciones</tspan></text><rect x="192" y="30.5" width="150" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="267" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="267" dy="0">Representación</tspan></text><rect x="388" y="30.5" width="124" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="450" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="450" dy="0">Invariantes</tspan></text><rect x="571" y="30.5" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="624.5" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="624.5" dy="0">Algoritmo</tspan></text><rect x="558" y="141" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="624.5" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="624.5" dy="0">Corrección y</tspan><tspan x="624.5" dy="19.2">complejidad</tspan></text><rect x="388" y="141" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="450" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="450" dy="0">Benchmark y</tspan><tspan x="450" dy="19.2">perfil</tspan></text><rect x="218" y="149.5" width="98" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="267" y="175.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="267" dy="0">Decisión</tspan></text><rect x="108" y="125.5" width="86" height="42" rx="4" fill="#ffffff"/><text x="151" y="141.4" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="151" dy="0">cambia la</tspan><tspan x="151" dy="17.92">carga</tspan></text></svg>
