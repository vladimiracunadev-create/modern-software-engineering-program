<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 806 183" width="806" height="183" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Construir» … «Valor del tiempo»</title><desc id="d">Diagrama de flujo con 5 pasos. «Construir» lleva a «Operar y mantener». «Operar y mantener» lleva a «Costo de oportunidad». «Costo de oportunidad» lleva a «Estimar con incertidumbre». «Estimar con incertidumbre» lleva a «Valor del tiempo». «Valor del tiempo» lleva a «Construir» (nueva estimación o tasa).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="806" height="183" fill="#ffffff"/><path d="M129,130.5 L175,130.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M273,130.5 L319,130.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M443,130.5 L489,130.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M631,130.5 L677,130.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M730.5,100 L730.5,93.0 Q730.5,86 723.5,86.0 L84.5,86.0 Q75.5,86 75.5,95.0 L75.5,108.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="108.5" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="75.5" y="134.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="75.5" dy="0">Construir</tspan></text><rect x="175" y="100" width="98" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="224" y="125.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="224" dy="0">Operar y</tspan><tspan x="224" dy="19.2">mantener</tspan></text><rect x="319" y="100" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="381" y="125.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="381" dy="0">Costo de</tspan><tspan x="381" dy="19.2">oportunidad</tspan></text><rect x="489" y="100" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="560" y="125.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="560" dy="0">Estimar con</tspan><tspan x="560" dy="19.2">incertidumbre</tspan></text><rect x="677" y="100" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="730.5" y="125.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="730.5" dy="0">Valor del</tspan><tspan x="730.5" dy="19.2">tiempo</tspan></text><rect x="348" y="22" width="110" height="60" rx="4" fill="#ffffff"/><text x="403" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="403" dy="0">nueva</tspan><tspan x="403" dy="17.92">estimación o</tspan><tspan x="403" dy="17.92">tasa</tspan></text></svg>
