<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 908 814" width="908" height="814" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Necesidad de los equipos» … «Medir adopción y tiempo»</title><desc id="d">Diagrama de flujo con 11 pasos. «Necesidad de los equipos» lleva a «Capacidades de plataforma». «Capacidades de plataforma» lleva a «Camino dorado: valores por defecto». «Capacidades de plataforma» lleva a «Catálogo: quién es dueño de qué». «Camino dorado: valores por defecto» lleva a «Adopción». «Adopción» lleva a «Menos carga cognitiva» (cubre y es fácil). «Adopción» lleva a «Cada equipo improvisa» (incompleto o costoso). «Capacidades de plataforma» lleva a «Ticket o autoservicio». «Ticket o autoservicio» lleva a «Cola humana» (ticket). «Ticket o autoservicio» lleva a «Automatización» (autoservicio). «Menos carga cognitiva» lleva a «Medir adopción y tiempo». «Medir adopción y tiempo» lleva a «Necesidad de los equipos».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="908" height="814" fill="#ffffff"/><path d="M473,102 L473,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M473,240 L473.0,260.0 Q473,269 464.0,269.0 L308.4,269.0 Q299.4,269 299.4,278.0 L299.4,298" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M473,240 L473.0,262.9 Q473,269 466.9,269.0 L466.9,269.0 Q460.8,269 460.8,275.1 L460.8,298" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M299.4,397 L299.4,417.0 Q299.4,426 290.4,426.0 L165.4,426.0 Q156.4,426 156.4,435.0 L156.4,455" f