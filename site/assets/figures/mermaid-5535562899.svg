<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 748 345" width="748" height="345" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Mapa de metodologías» … «Proyecto: política de equipo»</title><desc id="d">Diagrama de flujo con 12 pasos. «Mapa de metodologías» lleva a «TDD: ciclo». «TDD: ciclo» lleva a «TDD: escuelas y límites». «TDD: escuelas y límites» lleva a «BDD». «BDD» lleva a «ATDD y ejemplos». «ATDD y ejemplos» lleva a «DDD y lenguaje». «DDD y lenguaje» lleva a «Contratos». «Contratos» lleva a «SDD». «SDD» lleva a «EDD». «EDD» lleva a «ODD». «ODD» lleva a «Taller: cinco metodologías». «Taller: cinco metodologías» lleva a «Proyecto: política de equipo». «Proyecto: política de equipo» lleva a «Mapa de metodologías» (defectos escapados).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="748" height="345" fill="#ffffff"/><path d="M155,52.5 L201,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M316,52.5 L362,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M521,52.5 L608.5,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M646.5,74.5 L646.5,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M567,163 L516.5,163" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M366.5,163 L312,163" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M205,163 L126.5,163" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M88.5,185 L88.5,261" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M126.5,283 L220.5,283" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M296.5,283 L370.5,283" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M512.5,283 L584.5,283" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M646.5,243 L646.5,208.0 Q646.5,199 637.5,199.0 L149.5,199.0 Q140.5,199 140.5,190.0 L140.5,106.0 Q140.5,97 131.5,97.0 L95.5,97.0 Q88.5,97 88.5,90.0 L88.5,83" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="22" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="88.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="88.5" dy="0">Mapa de</tspan><tspan x="88.5" dy="19.2">metodologías</tspan></text><rect x="201" y="30.5" width="115" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="258.5" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="258.5" dy="0">TDD: ciclo</tspan></text><rect x="362" y="22" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="441.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="441.5" dy="0">TDD: escuelas y</tspan><tspan x="441.5" dy="19.2">límites</tspan></text><rect x="608.5" y="30.5" width="76" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="646.5" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="646.5" dy="0">BDD</tspan></text><rect x="567" y="141" width="159" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="646.5" y="167.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="646.5" dy="0">ATDD y ejemplos</tspan></text><rect x="366.5" y="141" width="150" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="441.5" y="167.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="441.5" dy="0">DDD y lenguaje</tspan></text><rect x="205" y="141" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="258.5" y="167.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="258.5" dy="0">Contratos</tspan></text><rect x="50.5" y="141" width="76" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="88.5" y="167.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="88.5" dy="0">SDD</tspan></text><rect x="50.5" y="261" width="76" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="88.5" y="287.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="88.5" dy="0">EDD</tspan></text><rect x="220.5" y="261" width="76" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="258.5" y="287.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="258.5" dy="0">ODD</tspan></text><rect x="370.5" y="252.5" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="441.5" y="277.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="441.5" dy="0">Taller: cinco</tspan><tspan x="441.5" dy="19.2">metodologías</tspan></text><rect x="584.5" y="243" width="124" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="646.5" y="268" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="646.5" dy="0">Proyecto:</tspan><tspan x="646.5" dy="19.2">política de</tspan><tspan x="646.5" dy="19.2">equipo</tspan></text><rect x="350.5" y="203" width="86" height="42" rx="4" fill="#ffffff"/><text x="393.5" y="218.9" font-size="14" 