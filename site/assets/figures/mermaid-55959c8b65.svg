<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 602 702" width="602" height="702" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Llegadas: tasa y forma» y «Servicio: media y variabilidad» … «Capacidad: servidores y margen»</title><desc id="d">Diagrama de flujo con 8 pasos. «Llegadas: tasa y forma» lleva a «Cola y servidores». «Servicio: media y variabilidad» lleva a «Cola y servidores». «Cola y servidores» lleva a «Utilización ρ = λ / μ». «Utilización ρ = λ / μ» lleva a «Espera y latencia: media y cola». «Espera y latencia: media y cola» lleva a «Objetivo de percentil». «Objetivo de percentil» lleva a «Capacidad: servidores y margen». «Espera y latencia: media y cola» lleva a «Concurrencia L = λ · W» (Little). «Capacidad: servidores y margen» lleva a «Servicio: media y variabilidad» (la medida real contradice).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="602" height="702" fill="#ffffff"/><path d="M139.1,83 L139.1,103.0 Q139.1,112 148.1,112.0 L233.1,112.0 Q242.1,112 242.1,121.0 L242.1,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M345.1,83 L345.1,103.0 Q345.1,112 336.1,112.0 L251.1,112.0 Q242.1,112 242.1,121.0 L242.1,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M242.1,185 L242.1,205.0 Q242.1,214 233.1,214.0 L230.1,214.0 Q221.1,214 221.1,223.0 L221.1,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M221.1,304 L221.1,324.0 Q221.1,333 212.1,333.0 L204.5,333.0 Q195.5,333 195.5,342.0 L195.5,362" fill="none" stroke="#32505f" s