ight="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="122" y="616" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="122" dy="0">Volver al</tspan><tspan x="122" dy="19.2">artefacto que la</tspan><tspan x="122" dy="19.2">causa</tspan></text><rect x="240" y="609" width="150" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="315" y="635.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="315" dy="0">Implementación</tspan></text><rect x="351.4" y="77.8" width="126" height="60" rx="4" fill="#ffffff"/><text x="414.4" y="93.7" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="414.4" dy="0">puerta: el</tspan><tspan x="414.4" dy="17.92">plan respeta</tspan><tspan x="414.4" dy="17.92">los principios</tspan></text><rect x="110" y="537" width="110" height="24" rx="4" fill="#ffffff"/><text x="165" y="552.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="165" dy="0">incoherencia</tspan></text><rect x="321" y="567" width="61" height="24" rx="4" fill="#ffffff"/><text x="351.5" y="582.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="351.5" dy="0">limpio</tspan></text></svg>
