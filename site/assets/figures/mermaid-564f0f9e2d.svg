<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 693" width="500" height="693" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Constitución» … «Volver al artefacto que la causa» y «Implementación»</title><desc id="d">Diagrama de flujo con 8 pasos. «Constitución» lleva a «Especificación». «Especificación» lleva a «Clarificación: hasta 5 preguntas». «Clarificación: hasta 5 preguntas» lleva a «Especificación». «Especificación» lleva a «Plan». «Constitución» lleva a «Plan» (puerta: el plan respeta los principios). «Plan» lleva a «Tareas». «Tareas» lleva a «Análisis entre artefactos». «Especificación» lleva a «Análisis entre artefactos». «Plan» lleva a «Análisis entre artefactos». «Análisis entre artefactos» lleva a «Volver al artefacto que la causa» (incoherencia). «Análisis entre artefactos» lleva a «Implementación» (limpio). «Volver al artefacto que la causa» lleva a «Especificación». «Volver al artefacto que la causa» lleva a «Plan». «Volver al artefacto que la causa» lleva a «Tareas».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="500" height="693" fill="#ffffff"/><path d="M206.8,66 L206.8,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M206.8,168 L206.8,188.0 Q206.8,197 197.8,197.0 L142.4,197.0 Q133.4,197 133.4,206.0 L133.4,226" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M206.8,168 L206.8,192.2 Q206.8,201.2 215.8,201.2 L284.4,201.2 Q293.4,201.2 293.4,210.2 L293.4,234.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M273.3,44 L