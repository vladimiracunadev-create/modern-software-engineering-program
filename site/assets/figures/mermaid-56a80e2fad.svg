<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 467 946" width="467" height="946" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Tarea» … «Integrado»</title><desc id="d">Diagrama de flujo con 10 pasos. «Tarea» lleva a «¿Divisible por propiedad de archivos?». «¿Divisible por propiedad de archivos?» lleva a «Un solo agente» (no). «¿Divisible por propiedad de archivos?» lleva a «Coordinador divide y asigna» (sí). «Coordinador divide y asigna» lleva a «Agente A: rama y árbol propios». «Coordinador divide y asigna» lleva a «Agente B: rama y árbol propios». «Agente A: rama y árbol propios» lleva a «Integrador». «Agente B: rama y árbol propios» lleva a «Integrador». «Integrador» lleva a «Fusionar de uno en uno». «Fusionar de uno en uno» lleva a «Menú completo tras cada fusión». «Menú completo tras cada fusión» lleva a «Coordinador divide y asigna» (falla). «Menú completo tras cada fusión» lleva a «Integrado» (pasa).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="467" height="946" fill="#ffffff"/><path d="M184.6,66 L184.6,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M184.6,244 L184.6,252.0 Q184.6,260 176.6,260.0 L106.0,260.0 Q97,260 97.0,269.0 L97,310.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M184.6,244 L184.6,252.0 Q184.6,260 192.6,260.0 L289.5,260.0 Q298.5,260 298.5,269.0 L298.5,302" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M298.5,363 L298.5,383.0 Q298.5,392 289.5,392.0 L167.7,392.0 Q158.7,392 158.7,401.0 L158.7,421" fill="