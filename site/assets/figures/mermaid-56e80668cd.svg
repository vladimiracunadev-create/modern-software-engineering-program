<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 543 685" width="543" height="685" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Contexto y escenarios» … «Comprobador de forma» y «Funcion de aptitud»</title><desc id="d">Diagrama de flujo con 7 pasos. «Contexto y escenarios» lleva a «Alternativas». «Alternativas» lleva a «Matriz o analisis de sensibilidad». «Matriz o analisis de sensibilidad» lleva a «Decision». «Decision» lleva a «ADR con consecuencias y reversibilidad». «ADR con consecuencias y reversibilidad» lleva a «Comprobador de forma». «ADR con consecuencias y reversibilidad» lleva a «Funcion de aptitud». «Funcion de aptitud» lleva a «Contexto y escenarios» (condicion de revision).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="543" height="685" fill="#ffffff"/><path d="M199.6,83 L199.6,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M199.4,185 L199.4,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M198.9,304 L198.9,362" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M198.3,406 L198.3,464" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M198,544 L198.0,564.0 Q198,573 189.0,573.0 L106.0,573.0 Q97,573 97.0,582.0 L97,602" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M198,544 L198.0,568.2 Q198,577.2 207.0,577.2 L289.5,577.2 Q298.5,577.2 298.5,586.2 L298.5,610.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M391,632.5 L398.0,632.5 Q405,632.5 405.0,625.5 L405.0,61.5 Q405,52.5 396.0,52.5 L257.1,52.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="142.1" y="22" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="199.6" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="199.6" dy="0">Contexto y</tspan><tspan x="199.6" dy="19.2">escenarios</tspan></text><rect x="133.1" y="141" width="133" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="199.6" y="167.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="199.6" dy="0">Alternativas</tspan></text><rect x="111.2" y="243" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="199.2" y="268.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="199.2" dy="0">Matriz o analisis</tspan><tspan x="199.2" dy="19.2">de sensibilidad</tspan></text><rect x="149.6" y="362" width="98" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="198.6" y="388.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="198.6" dy="0">Decision</tspan></text><rect x="118.5" y="464" width="159" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="198" y="489" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="198" dy="0">ADR con</tspan><tspan x="198" dy="19.2">consecuencias y</tspan><tspan x="198" dy="19.2">reversibilidad</tspan></text><rect x="22" y="602" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="97" y="627.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="97" dy="0">Comprobador de</tspan><tspan x="97" dy="19.2">forma</tspan></text><rect x="206" y="610.5" width="185" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="298.5" y="636.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="298.5" dy="0">Funcion de aptitud</tspan></text><rect x="411" y="321.5" width="110" height="42" rx="4" fill="#ffffff"/><text x="466" y="337.4" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="466" dy="0">condicion de</tspan><tspan x="466" dy="17.92">revision</tspan></text></svg>
