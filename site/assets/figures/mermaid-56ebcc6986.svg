<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 395 666" width="395" height="666" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Pregunta de la evaluación» … «Decisión»</title><desc id="d">Diagrama de flujo con 7 pasos. «Pregunta de la evaluación» lleva a «Tareas y métricas». «Tareas y métricas» lleva a «Muestra y reclutamiento». «Muestra y reclutamiento» lleva a «Observación y registro». «Observación y registro» lleva a «Hallazgos cualitativos». «Observación y registro» lleva a «Estimaciones con intervalo». «Hallazgos cualitativos» lleva a «Decisión». «Estimaciones con intervalo» lleva a «Decisión». «Decisión» lleva a «Pregunta de la evaluación» (nueva pregunta).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="395" height="666" fill="#ffffff"/><path d="M197.6,83 L197.6,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M197.4,185 L197.4,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M197.1,304 L197.1,362" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M196.9,423 L196.9,443.0 Q196.9,452 187.9,452.0 L113.5,452.0 Q104.5,452 104.5,461.0 L104.5,481" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M196.9,423 L196.9,443.0 Q196.9,452 205.9,452.0 L280.0,452.0 Q289,452 289.0,461.0 L289,481" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M104.5,542 L104.5,562.0 Q104.5,571 113.5,571.0 L187.7,571.0 Q196.7,571 196.7,580.0 L196.7,600" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M289,542 L289.0,562.0 Q289,571 280.0,571.0 L205.7,571.0 Q196.7,571 196.7,580.0 L196.7,600" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M147.7,622 L33.0,622.0 Q24,622 24.0,613.0 L24.0,61.5 Q24,52.5 33.0,52.5 L122.6,52.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="122.6" y="22" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="197.6" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="197.6" dy="0">Pregunta de la</tspan><tspan x="197.6" dy="19.2">evaluación</tspan></text><rect x="109.6" y="141" width="176" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="197.6" y="167.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="197.6" dy="0">Tareas y métricas</tspan></text><rect x="126.3" y="243" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="197.3" y="268.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="197.3" dy="0">Muestra y</tspan><tspan x="197.3" dy="19.2">reclutamiento</tspan></text><rect x="125.9" y="362" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="196.9" y="387.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="196.9" dy="0">Observación y</tspan><tspan x="196.9" dy="19.2">registro</tspan></text><rect x="38" y="481" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="104.5" y="506.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="104.5" dy="0">Hallazgos</tspan><tspan x="104.5" dy="19.2">cualitativos</tspan></text><rect x="205" y="481" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="289" y="506.1" font-size="15" tex