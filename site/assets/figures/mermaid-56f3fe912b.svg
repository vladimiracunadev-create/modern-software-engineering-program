<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 454 822" width="454" height="822" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Acuerdo de mentoría» … «Siguiente nivel de dificultad» y «Ajustar tarea o apoyo»</title><desc id="d">Diagrama de flujo con 8 pasos. «Acuerdo de mentoría» lleva a «Tarea que estira». «Tarea que estira» lleva a «Trabajo observable». «Trabajo observable» lleva a «Retroalimentación a tiempo sobre la tarea». «Retroalimentación a tiempo sobre la tarea» lleva a «Práctica con ajuste». «Práctica con ajuste» lleva a «Evaluación con rúbrica calibrada». «Evaluación con rúbrica calibrada» lleva a «Siguiente nivel de dificultad» (criterio cumplido). «Evaluación con rúbrica calibrada» lleva a «Ajustar tarea o apoyo» (no cumplido). «Siguiente nivel de dificultad» lleva a «Tarea que estira». «Ajustar tarea o apoyo» lleva a «Tarea que estira».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="454" height="822" fill="#ffffff"/><path d="M231.7,83 L231.7,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M231.9,185 L231.9,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M232.2,287 L232.2,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M232.6,425 L232.6,483" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M233,544 L233,602" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M233.3,663 L233.3,671.0 Q233.3,679 225.3,679.0 L139.5,679.0 Q130.5,679 130.5,688.0 L130.5,739" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M233.3,663 L233.3,671.0 Q233.3,679 241.3,679.0 L327.5,679.0 Q336.5,679 336.5,688.0 L336.5,739" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M38,769.5 L31.0,769.5 Q24,769.5 24.0,762.5 L24.0,172.0 Q24,163 33.0,163.0 L147.7,163" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><path d="M416,769.5 L423.0,769.5 Q430,769.5 430.0,762.5 L430.0,172.0 Q430,163 421.0,163.0 L315.7,163" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="174.2" y="22" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="231.7" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="231.7" dy="0">Acuerdo de</tspan><tspan x="231.7" dy="19.2">mentoría</tspan></text><rect x="147.7" y="141" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="231.7" y="167.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="231.7" dy="0">Tarea que estira</tspan></text><rect x="139.5" y="243" width="185" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="232" y="269.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="232" dy="0">Trabajo observable</tspan></text><rect x="144.4" y="345" width="176" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="232.4" y="370" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="232.4" dy="0">Retroalimentación</tspan><tspan x="232.4" dy="19.2">a tiempo sobre la</tspan><tspan x="232.4" dy="19.2">tarea</tspan></text><rect x="166.3" y="483" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="232.8" y="508.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="232.8" dy="0">Práctica con</tspan><tspan x="232.8" dy="19.2">ajuste</tspan></text><rect x="145.3" y="602" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="233.3" y="627.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="233.3" dy="0">Evaluación con</tspan><tspan x="233.3" dy="19.2">rúbrica calibrada</tspan></text><rect x="38" y="739" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="130.5" y="764.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="130.5" dy="0">Siguiente nivel de</tspan><tspan x="130.5" dy="19.2">dificultad</tspan></text><rect x="257" y="739" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="336.5" y="764.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="336.5" dy="0">Ajustar tarea o</tspan><tspan x="336.5" dy="19.2">apoyo</tspan></text><rect x="136.5" y="688" width="77" height="42" rx="4" fill="#ffffff"/><text x="175" y="703.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="175" dy="0">criterio</tspan><tspan x="175" dy="17.92">cumplido</tspan></text><rect x="228.5" y="697" width="102" height="24" rx="4" fill="#ffffff"/><text x="279.5" y="712.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="279.5" dy="0">no cumplido</tspan></text></svg>
