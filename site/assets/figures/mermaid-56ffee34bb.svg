<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 766 224" width="766" height="224" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Capacidad interna» … «Consumidor y compatibilidad»</title><desc id="d">Diagrama de flujo con 7 pasos. «Capacidad interna» lleva a «Contrato público». «Contrato público» lleva a «Versión y dependencia». «Versión y dependencia» lleva a «Artefacto publicado». «Artefacto publicado» lleva a «API / SDK / CLI». «API / SDK / CLI» lleva a «Extensión y automatización». «Extensión y automatización» lleva a «Consumidor y compatibilidad». «Consumidor y compatibilidad» lleva a «Contrato público» (feedback o ruptura).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="766" height="224" fill="#ffffff"/><path d="M129,52.5 L175,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M343,52.5 L402,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M526,52.5 L611,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M664.5,83 L664.5,149.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M585,171.5 L539,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M389,171.5 L334,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M259,141 L259,74.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="22" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="75.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="75.5" dy="0">Capacidad</tspan><tspan x="75.5" dy="19.2">interna</tspan></text><rect x="175" y="30.5" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="259" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="259" dy="0">Contrato público</tspan></text><rect x="402" y="22" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="464" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="464" dy="0">Versión y</tspan><tspan x="464" dy="19.2">dependencia</tspan></text><rect x="611" y="22" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="664.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="664.5" dy="0">Artefacto</tspan><tspan x="664.5" dy="19.2">publicado</tspan></text><rect x="585" y="149.5" width="159" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="664.5" y="175.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="664.5" dy="0">API / SDK / CLI</tspan></text><rect x="389" y="141" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="464" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="464" dy="0">Extensión y</tspan><tspan x="464" dy="19.2">automatización</tspan></text><rect x="184" y="141" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="259" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="259" dy="0">Consumidor y</tspan><tspan x="259" dy="19.2">compatibilidad</tspan></text><rect x="265" y="86.8" width="94" height="42" rx="4" fill="#ffffff"/><text x="312" y="102.7" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="312" dy="0">feedback o</tspan><tspan x="312" dy="17.92">ruptura</tspan></text></svg>
