<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 262" width="810" height="262" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Necesidad de negocio y contexto» … «Verificación con simulación o prueba»</title><desc id="d">Diagrama de flujo con 7 pasos. «Necesidad de negocio y contexto» lleva a «Drivers y restricciones». «Drivers y restricciones» lleva a «Escenarios de calidad medibles». «Escenarios de calidad medibles» lleva a «Tácticas y alternativas». «Tácticas y alternativas» lleva a «Descartar por restricciones y dominancia». «Descartar por restricciones y dominancia» lleva a «Decisión con atributos sacrificados». «Decisión con atributos sacrificados» lleva a «Verificación con simulación o prueba». «Verificación con simulación o prueba» lleva a «Escenarios de calidad medibles» (el escenario falla).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="810" height="262" fill="#ffffff"/><path d="M155,62 L214,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M356,62 L415,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M583,62 L642,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M708.5,92.5 L708.5,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M629,200 L565.5,200" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M432.5,200 L369,200" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M285,160 L285.0,115.5 Q285,106.5 294.0,106.5 L492.0,106.5 Q499,106.5 499.0,99.5 L499,92.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="22" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="88.5" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="88.5" dy="0">Necesidad de</tspan><tspan x="88.5" dy="19.2">negocio y</tspan><tspan x="88.5" dy="19.2">contexto</tspan></text><rect x="214" y="31.5" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="285" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="285" dy="0">Drivers y</tspan><tspan x="285" dy="19.2">restricciones</tspan></text><rect x="415" y="31.5" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="499" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="499" dy="0">Escenarios de</tspan><tspan x="499" dy="19.2">calidad medibles</tspan></text><rect x="642" y="31.5" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="708.5" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="708.5" dy="0">Tácticas y</tspan><tspan x="708.5" dy="19.2">alternativas</tspan></text><rect x="629" y="160" width="159" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="708.5" y="185" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="708.5" dy="0">Descartar por</tspan><tspan x="708.5" dy="19.2">restricciones y</tspan><tspan x="708.5" dy="19.2">dominancia</tspan></text><rect x="432.5" y="160" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="499" y="185" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="499" dy="0">Decisión con</tspan><tspan x="499" dy="19.2">atributos</tspan><tspan x="499" dy="19.2">sacrificados</tspan></text><rect x="201" y="160" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="285" y="185" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="285" dy="0">Verificación con</tspan><tspan x="285" dy="19.2">simulación o</tspan><tspan x="285" dy="19.2">prueba</tspan></text><rect x="337" y="110.5" width="110" height="42" rx="4" fill="#ffffff"/><text x="392" y="126.4" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="392" dy="0">el escenario</tspan><tspan x="392" dy="17.92">falla</tspan></text></svg>
