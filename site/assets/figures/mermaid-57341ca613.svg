" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="520.5" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="520.5" dy="0">Métricas,</tspan><tspan x="520.5" dy="19.2">dimensiones y</tspan><tspan x="520.5" dy="19.2">cardinalidad</tspan></text><rect x="650.5" y="22" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="725.5" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="725.5" dy="0">Trazas</tspan><tspan x="725.5" dy="19.2">distribuidas y</tspan><tspan x="725.5" dy="19.2">contexto</tspan></text><rect x="646" y="160" width="159" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="725.5" y="185" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="725.5" dy="0">SLI, SLO, SLA y</tspan><tspan x="725.5" dy="19.2">presupuestos de</tspan><tspan x="725.5" dy="19.2">error</tspan></text><rect x="449.5" y="160" width="142" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="520.5" y="185" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="520.5" dy="0">Alertas</tspan><tspan x="520.5" dy="19.2">accionables y</tspan><tspan x="520.5" dy="19.2">fatiga</tspan></text><rect x="249" y="160" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="315.5" y="185" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="315.5" dy="0">Runbooks,</tspan><tspan x="315.5" dy="19.2">on-call y</tspan><tspan x="315.5" dy="19.2">escalamiento</tspan></text><rect x="39.5" y="160" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="185" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Gestión de</tspan><tspan x="106" dy="19.2">incidentes y</tspan><tspan x="106" dy="19.2">comunicación</tspan></text><rect x="26.5" y="307.5