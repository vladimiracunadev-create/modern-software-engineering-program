<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 827 419" width="827" height="419" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Señales, eventos y observabilidad útil» … «Paquete operativo observable y recuperable»</title><desc id="d">Diagrama de flujo con 12 pasos. «Señales, eventos y observabilidad útil» lleva a «Logs estructurados y correlación». «Logs estructurados y correlación» lleva a «Métricas, dimensiones y cardinalidad». «Métricas, dimensiones y cardinalidad» lleva a «Trazas distribuidas y contexto». «Trazas distribuidas y contexto» lleva a «SLI, SLO, SLA y presupuestos de error». «SLI, SLO, SLA y presupuestos de error» lleva a «Alertas accionables y fatiga». «Alertas accionables y fatiga» lleva a «Runbooks, on-call y escalamiento». «Runbooks, on-call y escalamiento» lleva a «Gestión de incidentes y comunicación». «Gestión de incidentes y comunicación» lleva a «Postmortems sin culpa y aprendizaje». «Postmortems sin culpa y aprendizaje» lleva a «Continuidad, disaster recovery y ejercicios». «Continuidad, disaster recovery y ejercicios» lleva a «Taller de diagnóstico con telemetría incompleta». «Taller de diagnóstico con telemetría incompleta» lleva a «Paquete operativo observable y recuperable». «Paquete operativo observable y recuperable» lleva a «Señales, eventos y observabilidad útil» (incidente o ejercicio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="827" height="419" fill="#ffffff"/><path d="M190,62 L236,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M395,62 L449.5,62" fill="none" strok