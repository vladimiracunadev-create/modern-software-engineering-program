<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 465 775" width="465" height="775" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Requisito: ley, contrato o política» … «Ancla externa de la huella»</title><desc id="d">Diagrama de flujo con 8 pasos. «Requisito: ley, contrato o política» lleva a «Control propio». «Control propio» lleva a «Prueba automática o revisión». «Prueba automática o revisión» lleva a «Evidencia con fecha, versión y huella». «Evidencia con fecha, versión y huella» lleva a «Revisión por una tercera parte». «Revisión por una tercera parte» lleva a «Control propio» (brecha). «Evidencia con fecha, versión y huella» lleva a «Registro de auditoría». «Registro de auditoría» lleva a «Ancla externa de la huella». «Requisito: ley, contrato o política» lleva a «Límites que no decide la ingeniería» (interpretación legal).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="465" height="775" fill="#ffffff"/><path d="M205,102 L205.0,140.0 Q205,149 196.0,149.0 L122.0,149.0 Q113,149 113.0,158.0 L113,196" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M113,240 L113.0,269.0 Q113,278 122.0,278.0 L167.4,278.0 Q176.4,278 176.4,287.0 L176.4,316" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M176.4,377 L176.4,397.0 Q176.4,406 185.4,406.0 L229.3,406.0 Q238.3,406 238.3,415.0 L238.3,435" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M238.3,515 L238.3,535.0 Q238.3,544 229.3,544.0 L187.6,544.0 Q178.6,544 178.6,553.0 L178.6,573" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M238.3,515 L238.3,535.0 Q238.3,544 247.3,544.0 L349.6,544.0 Q358.6,544 358.6,553.0 L358.6,573" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M358.5,634 L358.5,692" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M205,102 L205.0,110.0 Q205,118 213.0,118.0 L288.0,118.0 Q297,118 297.0,127.0 L297,178" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M94.6,603.5 L33.0,603.5 Q24,603.5 24.0,594.5 L24.0,225.0 Q24,218 31.0,218.0 L38,218" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="125.5" y="22" width="159" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="205" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="205" dy="0">Requisito: ley,</tspan><tspan x="205" dy="19.2">contrato o</tspan><tspan x="205" dy="19.2">política</tspan></text><rect x="38" y="196" width="150" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="113" y="222.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="113" dy="0">Control propio</tspan></text><rect x="88.4" y="316" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="176.4" y="341.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="176.4" dy="0">Prueba automática</tspan><tspan x="176.4" dy="19.2">o revisión</tspan></text><rect x="154.3" y="435" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="238.3" y="460" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="238.3" dy="0">Evidencia con</tspan><tspan x="238.3" dy="19.2">fecha, versión y</tspan><tspan x="238.3" dy="19.2">huella</tspan></text><rect x="94.6" y="573" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="178.6" y="598.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="178.6" dy="0">Revisión por una</tspan><tspan x="178.6" dy="19.2">tercera parte</tspan></text><rect x="296.6" y="573" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="358.6" y="598.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="358.6" dy="0">Registro de</tspan><tspan x="358.6" dy="19.2">auditoría</tspan></text><rect x="274.5" y="692" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="358.5" y="717.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="358.5" dy="0">Ancla externa de</tspan><tspan x="358.5" dy="19.2">la huella</tspan></text><rect x="222" y="178" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="297" y="203" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="297" dy="0">Límites que no</tspan><tspan x="297" dy="19.2">decide la</tspan><tspan x="297" dy="19.2">ingeniería</tspan></text><rect x="30" y="398.8" width="61" height="24" rx="4" fill="#ffffff"/><text x="60.5" y="414.7" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="60.5" dy="0">brecha</tspan></text><rect x="303" y="127" width="126" height="42" rx="4" fill="#ffffff"/><text x="366" y="142.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="366" dy="0">interpretación</tspan><tspan x="366" dy="17.92">legal</tspan></text></svg>
