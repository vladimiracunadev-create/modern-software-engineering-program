<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 844 244" width="844" height="244" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Sensor» … «Actuador local»</title><desc id="d">Diagrama de flujo con 7 pasos. «Sensor» lleva a «Dispositivo: decisión con plazo». «Sensor» lleva a «Estrategia de reporte». «Estrategia de reporte» lleva a «Pasarela: agrega, filtra, almacena». «Pasarela: agrega, filtra, almacena» lleva a «Nube: histórico y análisis». «Dispositivo: decisión con plazo» lleva a «Actuador local». «Nube: histórico y análisis» lleva a «Actuador local» (red caída). «Pasarela: agrega, filtra, almacena» lleva a «Codificación y compresión».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="844" height="244" fill="#ffffff"/><path d="M103,130 L117.0,130.0 Q126,130 126.0,121.0 L126.0,87.0 Q126,78 135.0,78.0 L149,78" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M103,130 L121.5,130.0 Q130.5,130 130.5,139.0 L130.5,173.0 Q130.5,182 139.5,182.0 L158,182" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M273,182 L295.8,182.0 Q300.5,182 300.5,177.2 L300.5,177.2 Q300.5,172.5 305.2,172.5 L328,172.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M435,172.5 L451.2,172.5 Q460.2,172.5 460.2,163.5 L460.2,87.0 Q460.2,78 469.2,78.0 L485.5,78" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M282,78 L449.0,78.0 Q458,78 458.0,69.0 L458.0,33.0 Q458,24 467.0,24.0 L764.0,24.0 Q773,24 773.0,33.0 L773,47.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M609.5,78 L724,78" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M435,172.5 L453.2,172.5 Q458,172.5 458.0,177.2 L458.0,177.2 Q458,182 462.8,182.0 L481,182" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="108" width="81" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="62.5" y="134.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="62.5" dy="0">Sensor</tspan></text><rect x="149" y="38" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="215.5" y="63" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="215.5" dy="0">Dispositivo:</tspan><tspan x="215.5" dy="19.2">decisión</tspan><tspan x="215.5" dy="19.2">con plazo</tspan></text><rect x="158" y="151.5" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="215.5" y="176.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="215.5" dy="0">Estrategia</tspan><tspan x="215.5" dy="19.2">de reporte</tspan></text><rect x="328" y="123" width="107" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="381.5" y="147.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="381.5" dy="0">Pasarela:</tspan><tspan x="381.5" dy="19.2">agrega,</tspan><tspan x="381.5" dy="19.2">filtra,</tspan><tspan x="381.5" dy="19.2">almacena</tspan></text><rect x="485.5" y="38" width="124" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="547.5" y="63" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="547.5" dy="0">Nube:</tspan><tspan x="547.5" dy="19.2">histórico y</tspan><tspan x="547.5" dy="19.2">análisis</tspan></text><rect x="724" y="47.5" width="98" height="61" rx="10" fill="#dff1ee" str