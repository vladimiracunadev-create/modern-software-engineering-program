<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 707 516" width="707" height="516" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de secuencia: Verificador (cliente) → Atestador (servicio en el TEE) → Hardware: raíz de confianza</title><desc id="d">Diagrama de secuencia con 3 participantes y 6 eventos en orden. Verificador (cliente) envía a Atestador (servicio en el TEE): desafío fresco (nonce). Atestador (servicio en el TEE) envía a Hardware: raíz de confianza: pedir cita con la medición y el nonce. Hardware: raíz de confianza envía a Atestador (servicio en el TEE): cita firmada con la clave del dispositivo. Atestador (servicio en el TEE) envía a Verificador (cliente): evidencia: medición, nonce, cita. Verificador (cliente) se autoenvía: comprobar firma, nonce y medición esperada. Verificador (cliente) envía a Atestador (servicio en el TEE): liberar la clave de datos solo si coincide.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="707" height="516" fill="#ffffff"/><rect x="22" y="22" width="122" height="58.4" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="83" y="45.8" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="83" dy="0">Verificador</tspan><tspan x="83" dy="19.2">(cliente)</tspan></text><line x1="83" y1="80.4" x2="83" y2="493.52" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="240.24" y="22" width="192" height="58.4" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="336.24" y="45.8" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="336.24" dy="0">Atestador (servicio</tspan><tspan x="336.24" dy="19.2">en el TEE)</tspan></text><line x1="336.24" y1="80.4" x2="336.24" y2="493.52" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="510.6" y="22" width="174" height="58.4" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="597.6" y="45.8" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="597.6" dy="0">Hardware: raíz de</tspan><tspan x="597.6" dy="19.2">confianza</tspan></text><line x1="597.6" y1="80.4" x2="597.6" y2="493.52" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="83" y1="128.32" x2="336.24" y2="128.32" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="209.62" y="112.3" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="209.62" dy="0">desafío fresco (nonce)</tspan></text><line x1="336.24" y1="196.16" x2="597.6" y2="196.16" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="466.92" y="162.2" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="466.92" dy="0">pedir cita con la medición y</tspan><tspan x="466.92" dy="17.92">el nonce</tspan></text><line x1="597.6" y1="264" x2="336.24" y2="264" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="466.92" y="230" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="466.92" dy="0">cita firmada con la clave</tspan><tspan x="466.92" dy="17.92">del dispositivo</tspan></text><line x1="336.24" y1="331.84" x2="83" y2="331.84" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="209.62" y="297.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="209.62" dy="0">evidencia: medición, nonce,</tspan><tspan x="209.62" dy="17.92">cita</tspan></text><path d="M83,385.68 H123 V399.68 H83" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="131" y="365.7" font-size="14" text-anchor="start" font-weight="400" fill="#142231"><tspan x="131" dy="0">comprobar firma, nonce y</tspan><tspan x="131" dy="17.92">medición esperada</tspan></text><line x1="83" y1="467.52" x2="336.24" y2="467.52" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="209.62" y="433.6" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="209.62" dy="0">liberar la clave de datos</tspan><tspan x="209.62" dy="17.92">solo si coincide</tspan></text></svg>
