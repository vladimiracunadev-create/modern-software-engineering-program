<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 792 362" width="792" height="362" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Responsabilidad compartida» … «Plataforma mínima reproducible»</title><desc id="d">Diagrama de flujo con 12 pasos. «Responsabilidad compartida» lleva a «Aislamiento». «Aislamiento» lleva a «Orquestación». «Orquestación» lleva a «Ejecución gestionada». «Ejecución gestionada» lleva a «Redes, identidad y secretos». «Redes, identidad y secretos» lleva a «Infraestructura como código». «Infraestructura como código» lleva a «Entornos y cuentas». «Entornos y cuentas» lleva a «Escalado y costos». «Escalado y costos» lleva a «Multi-cloud y portabilidad». «Multi-cloud y portabilidad» lleva a «Plataformas internas». «Plataformas internas» lleva a «Taller de despliegue y destrucción». «Taller de despliegue y destrucción» lleva a «Plataforma mínima reproducible». «Plataforma mínima reproducible» lleva a «Responsabilidad compartida» (incidente o hallazgo).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="792" height="362" fill="#ffffff"/><path d="M181,52.5 L227,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M351,52.5 L410,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M543,52.5 L628.5,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M686,83 L686,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M602,171.5 L556,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M397,171.5 L346.5,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M231.5,171.5 L159,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M101.5,202 L101.5,269.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M172.5,300 L227,300" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M351,300 L410,300" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M543,300 L619.5,300" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M686,260 L686.0,225.0 Q686,216 677.0,216.0 L182.0,216.0 Q173,216 173.0,207.0 L173.0,106.0 Q173,97 164.0,97.0 L108.5,97.0 Q101.5,97 101.5,90.0 L101.5,83" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="22" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101.5" dy="0">Responsabilidad</tspan><tspan x="101.5" dy="19.2">compartida</tspan></text><rect x="227" y="30.5" width="124" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="289" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="289" dy="0">Aislamiento</tspan></text><rect x="410" y="30.5" width="133" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="476.5" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="476.5" dy="0">Orquestación</tspan></text><rect x="628.5" y="22" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="686" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="686" dy="0">Ejecución</tspan><tspan x="686" dy="19.2">gestionada</tspan></text><rect x="602" y="141" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="686" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="686" dy="0">Redes, identidad</tspan><tspan x="686" dy="19.2">y secretos</tspan></text><rect x="397" y="141" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="476.5" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="476.5" dy="0">Infraestructura</tspan><tspan x="476.5" dy="19.2">como código</tspan></text><rect x="231.5" y="141" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="289" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="289" dy="0">Entornos y</tspan><tspan x="289" dy="19.2">cuentas</tspan></text><rect x="44" y="141" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101.5" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101.5" dy="0">Escalado y</tspan><tspan x="101.5" dy="19.2">costos</tspan></text><rect x="30.5" y="269.5" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101.5" y="294.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101.5" dy="0">Multi-cloud y</tspan><tspan x="101.5" dy="19.2">portabilidad</tspan></text><rect x="227" y="269.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="289" y="294.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="289" dy="0">Plataformas</tspan><tspan x="289" dy="19.2">internas</tspan></text><rect x="410" y="260" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="476.5" y="285" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="476.5" dy="0">Taller de</tspan><tspan x="476.5" dy="19.2">despliegue y</tspan><tspan x="476.5" dy="19.2">destrucción</tspan></text><rect x="619.5" y="260" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="686" y="285" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="686" dy="0">Plataforma</tspan><tspan x="686" dy="19.2">mínima</tspan><tspan x="686" dy="19.2">reproducible</tspan></text><rect x="275.9" y="220" width="102" height="42" rx="4" fill="#ffffff"/><text x="326.9" y="235.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="326.9" dy="0">incidente o</tspan><tspan x="326.9" dy="17.92">hallazgo</tspan></text></svg>
