 font-weight="400" fill="#0b3f45"><tspan x="195.1" dy="0">Un solo</tspan><tspan x="195.1" dy="19.2">sospechoso: el</tspan><tspan x="195.1" dy="19.2">último paso</tspan></text><rect x="304.1" y="723" width="185" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="396.6" y="749.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="396.6" dy="0">Confirmar y seguir</tspan></text><rect x="164.7" y="432" width="29" height="24" rx="4" fill="#ffffff"/><text x="179.2" y="447.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="179.2" dy="0">no</tspan></text><rect x="344.7" y="441" width="29" height="24" rx="4" fill="#ffffff"/><text x="359.2" y="456.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="359.2" dy="0">sí</tspan></text><rect x="201.1" y="672" width="53" height="24" rx="4" fill="#ffffff"/><text x="227.6" y="687.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="227.6" dy="0">falla</tspan></text><rect x="402.6" y="681" width="45" height="24" rx="4" fill="#ffffff"/><text x="425.1" y="696.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="425.1" dy="0">pasa</tspan></text></svg>
