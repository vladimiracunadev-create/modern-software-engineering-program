<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 807" width="512" height="807" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Refactor planeado» … «Un solo sospechoso: el último paso» y «Confirmar y seguir»</title><desc id="d">Diagrama de flujo con 10 pasos. «Refactor planeado» lleva a «Red de pruebas». «Red de pruebas» lleva a «Medida: mutantes muertos». «Red de pruebas» lleva a «Medida: cobertura de líneas». «Medida: mutantes muertos» lleva a «¿Suficiente?». «Medida: cobertura de líneas» lleva a «¿Suficiente?». «¿Suficiente?» lleva a «Añadir bordes y comparación con referencia» (no). «Añadir bordes y comparación con referencia» lleva a «Red de pruebas». «¿Suficiente?» lleva a «Paso pequeño» (sí). «Paso pequeño» lleva a «Ejecutar la red». «Ejecutar la red» lleva a «Un solo sospechoso: el último paso» (falla). «Ejecutar la red» lleva a «Confirmar y seguir» (pasa). «Un solo sospechoso: el último paso» lleva a «Paso pequeño».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="512" height="807" fill="#ffffff"/><path d="M221.2,66 L221.2,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M221.2,168 L221.2,188.0 Q221.2,197 212.2,197.0 L131.0,197.0 Q122,197 122.0,206.0 L122,226" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M221.2,168 L221.2,188.0 Q221.2,197 230.2,197.0 L319.0,197.0 Q328,197 328.0,206.0 L328,226" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M122,287 L122.0,307.0 Q122,316 131.0,316.0 L225.4,316.0 Q234.4,316 234.4,325.0 L234.4,