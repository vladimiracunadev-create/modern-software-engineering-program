<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 816 294" width="816" height="294" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Fuente de verdad» … «Vista»</title><desc id="d">Diagrama de flujo con 7 pasos. «Fuente de verdad» lleva a «Estado local». «Fuente de verdad» lleva a «Estado compartido». «Fuente de verdad» lleva a «Estado remoto». «Estado local» lleva a «Valor derivado». «Estado compartido» lleva a «Valor derivado». «Estado remoto» lleva a «Valor derivado». «Valor derivado» lleva a «Vista». «Vista» lleva a «Fuente de verdad» (evento). «Estado remoto» lleva a «Carrera» (respuesta tardía). «Carrera» lleva a «Vista».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="816" height="294" fill="#ffffff"/><path d="M190,168 L214.8,168.0 Q223.8,168 223.8,159.0 L223.8,95.0 Q223.8,86 232.8,86.0 L257.5,86" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M190,168 L236,168" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M190,168 L212.5,168.0 Q221.5,168 221.5,177.0 L221.5,241.0 Q221.5,250 230.5,250.0 L253,250" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M390.5,86 L447.2,86.0 Q456.2,86 456.2,95.0 L456.2,118.0 Q456.2,127 465.2,127.0 L522,127" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M412,168 L458.0,168.0 Q467,168 467.0,159.0 L467.0,136.0 Q467,127 476.0,127.0 L522,127" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M395,250 L449.5,250.0 Q458.5,250 458.5,241.0 L458.5,136.0 