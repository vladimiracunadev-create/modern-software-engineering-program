<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 620" width="590" height="620" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Tarea» … «Replanificar con el modelo», «Fallar, reflexionar y reintentar» y «Fallar y escalar»</title><desc id="d">Diagrama de flujo con 9 pasos. «Tarea» lleva a «ReAct: razonar → actuar → observar». «ReAct: razonar → actuar → observar» lleva a «ReAct: razonar → actuar → observar» (observación). «ReAct: razonar → actuar → observar» lleva a «Fin o tope». «Tarea» lleva a «Plan único con N pasos». «Plan único con N pasos» lleva a «Ejecutar con código». «Ejecutar con código» lleva a «Ejecutar con código» (observación = plan). «Ejecutar con código» lleva a «Qué hacer» (observación contradice el plan). «Qué hacer» lleva a «Replanificar con el modelo». «Qué hacer» lleva a «Fallar, reflexionar y reintentar». «Qué hacer» lleva a «Fallar y escalar». «Replanificar con el modelo» lleva a «Ejecutar con código». «Fallar, reflexionar y reintentar» lleva a «Plan único con N pasos».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="590" height="620" fill="#ffffff"/><path d="M223.4,66 L223.4,86.0 Q223.4,95 214.4,95.0 L127.6,95.0 Q118.6,95 118.6,104.0 L118.6,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M119.6,185 L119.6,251.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M223.4,66 L223.4,86.0 Q223.4,95 232.4,95.0 L319.1,95.0 Q328.1,95 328.1,104.0 L328.1,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M328.1,185 L328.1,20