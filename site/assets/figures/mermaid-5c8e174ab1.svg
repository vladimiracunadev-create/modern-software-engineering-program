<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 861" width="440" height="861" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Solicitud» … «Salida»</title><desc id="d">Diagrama de flujo con 9 pasos. «Solicitud» lleva a «Enrutador». «Enrutador» lleva a «Cadena: extraer → validar → redactar» (intención conocida). «Enrutador» lleva a «Persona» (confianza baja). «Cadena: extraer → validar → redactar» lleva a «Puerta: la fecha existe y el curso es del solicitante». «Puerta: la fecha existe y el curso es del solicitante» lleva a «Reintento acotado o escalado» (falla). «Puerta: la fecha existe y el curso es del solicitante» lleva a «Subtareas independientes en paralelo» (pasa). «Subtareas independientes en paralelo» lleva a «Unión de resultados». «Unión de resultados» lleva a «Salida».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="440" height="861" fill="#ffffff"/><path d="M203.1,66 L203.1,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M203.1,186 L203.1,194.0 Q203.1,202 195.1,202.0 L124.4,202.0 Q115.4,202 115.4,211.0 L115.4,262" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M203.1,186 L203.1,194.0 Q203.1,202 211.1,202.0 L276.4,202.0 Q285.4,202 285.4,211.0 L285.4,280" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M115.4,342 L115.4,362.0 Q115.4,371 124.4,371.0 L172.9,371.0 Q181.9,371 181.9,380.0 L181.9,400" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M181.9,480 L181.9,488.0 Q181.9,496 173.9,496.0 L119.0,496.0 Q110,496 110.0,505.0 L110,547.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M181.9,480 L181.9,488.0 Q181.9,496 189.9,496.0 L311.0,496.0 Q320,496 320.0,505.0 L320,538" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M317.3,618 L317.3,676" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M312.6,737 L312.6,795" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="149.6" y="22" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="203.1" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="203.1" dy="0">Solicitud</tspan></text><polygon points="203.1,124 267.6,155 203.1,186 138.6,155" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="203.1" y="159.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="203.1" dy="0">Enrutador</tspan></text><rect x="23.9" y="262" width="183" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="115.4" y="287" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="115.4" dy="0">Cadena: extraer →</tspan><tspan x="115.4" dy="19.2">validar →</tspan><tspan x="115.4" dy="19.2">redactar</tspan></text><rect x="240.9" y="280" width="89" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="285.4" y="306.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="285.4" dy="0">Persona</tspan></text><rect x="89.4" y="400" width="185" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="181.9" y="425" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="181.9" dy="0">Puerta: la fecha</tspan><tspan x="181.9" dy="19.2">existe y el curso</tspan><tspan x="181.9" dy="19.2">es del solicitante</tspan></text><rect x="22" y="547.5" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="110" y="572.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">Reintento acotado</tspan><tspan x="110" dy="19.2">o escalado</tspan></text><rect x="232" y="538" width="176" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="320" y="563" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="320" dy="0">Subtareas</tspan><tspan x="320" dy="19.2">independientes en</tspan><tspan x="320" dy="19.2">paralelo</tspan></text><rect x="257.2" y="676" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="314.7" y="701.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="314.7" dy="0">Unión de</tspan><tspan x="314.7" dy="19.2">resultados</tspan></text><rect x="270" y="795" width="81" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="310.5" y="821.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="310.5" dy="0">Salida</tspan></text><rect x="121.4" y="211" width="86" height="42" rx="4" fill="#ffffff"/><text x="164.4" y="226.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="164.4" dy="0">intención</tspan><tspan x="164.4" dy="17.92">conocida</tspan></text><rect x="291.4" y="229" width="126" height="24" rx="4" fill="#ffffff"/><text x="354.4" y="244.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354.4" dy="0">confianza baja</tspan></text><rect x="116" y="509.8" width="53" height="24" rx="4" fill="#ffffff"/><text x="142.5" y="525.7" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="142.5" dy="0">falla</tspan></text><rect x="326" y="505" width="45" height="24" rx="4" fill="#ffffff"/><text x="348.5" y="520.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="348.5" dy="0"