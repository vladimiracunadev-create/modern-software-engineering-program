<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 661 806" width="661" height="806" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Carga de trabajo» … «Límites de CPU, memoria, entorno, red»</title><desc id="d">Diagrama de flujo con 9 pasos. «Carga de trabajo» lleva a «¿Confías en el código?». «¿Confías en el código?» lleva a «Hilo o proceso propio» (sí). «¿Confías en el código?» lleva a «¿Mismo inquilino?» (no). «¿Mismo inquilino?» lleva a «Proceso con límites o módulo Wasm» (sí). «¿Mismo inquilino?» lleva a «¿Qué comparte con el anfitrión?» (no). «¿Qué comparte con el anfitrión?» lleva a «Contenedor reforzado o núcleo de aplicación» (núcleo). «¿Qué comparte con el anfitrión?» lleva a «microVM o máquina virtual» (nada salvo el hipervisor). «Hilo o proceso propio» lleva a «Límites de CPU, memoria, entorno, red». «Proceso con límites o módulo Wasm» lleva a «Límites de CPU, memoria, entorno, red». «Contenedor reforzado o núcleo de aplicación» lleva a «Límites de CPU, memoria, entorno, red». «microVM o máquina virtual» lleva a «Límites de CPU, memoria, entorno, red».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="661" height="806" fill="#ffffff"/><path d="M182.1,66 L182.1,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M182.1,210 L182.1,218.0 Q182.1,226 174.1,226.0 L106.0,226.0 Q97,226 97.0,235.0 L97,268.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M182.1,210 L182.1,218.0 Q182.1,226 190.1,226.0 L311.5,226.0 Q320.5,226 320.5,235.0 L320.5,268" fill="none" stroke="#32505f"