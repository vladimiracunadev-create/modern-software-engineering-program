<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 455 856" width="455" height="856" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Peligro del dispositivo» … «Evidencia en el expediente»</title><desc id="d">Diagrama de flujo con 8 pasos. «Peligro del dispositivo» lleva a «Situación peligrosa». «Situación peligrosa» lleva a «Contribución posible del software». «Contribución posible del software» lleva a «Controles fuera del software». «Controles fuera del software» lleva a «Clase de seguridad del elemento». «Clase de seguridad del elemento» lleva a «Rigor de procesos y verificación». «Rigor de procesos y verificación» lleva a «Evidencia en el expediente». «Clase de seguridad del elemento» lleva a «Elementos de clase menor» (segregación argumentada).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="455" height="856" fill="#ffffff"/><path d="M291.9,83 L291.9,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M291.9,202 L291.9,225.4 Q291.9,231 286.3,231.0 L286.3,231.0 Q280.7,231 280.7,236.6 L280.7,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M280.7,340 L280.7,360.0 Q280.7,369 271.7,369.0 L271.6,369.0 Q262.6,369 262.6,378.0 L262.6,398" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M262.6,459 L262.6,479.0 Q262.6,488 253.6,488.0 L244.9,488.0 Q235.9,488 235.9,497.0 L235.9,517" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M235.9,578 L235.9,607.0 Q235.9,616 226.9,616.0 L119.0,616.0 Q110,616 110.0,625.0 L110,654" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M113,715 L113,773" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M235.9,578 L235.9,586.0 Q235.9,594 243.9,594.0 L315.5,594.0 Q324.5,594 324.5,603.0 L324.5,654" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="229.9" y="22" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="291.9" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="291.9" dy="0">Peligro del</tspan><tspan x="291.9" dy="19.2">dispositivo</tspan></text><rect x="238.4" y="141" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="291.9" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="291.9" dy="0">Situación</tspan><tspan x="291.9" dy="19.2">peligrosa</tspan></text><rect x="214.2" y="260" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="280.7" y="285" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="280.7" dy="0">Contribución</tspan><tspan x="280.7" dy="19.2">posible del</tspan><tspan x="280.7" dy="19.2">software</tspan></text><rect x="183.1" y="398" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="262.6" y="423.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="262.6" dy="0">Controles fuera</tspan><tspan x="262.6" dy="19.2">del software</tspan></text><rect x="143.4" y="517" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="235.9" y="542.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="235.9" dy="0">Clase de seguridad</tspan><tspan x="235.9" dy="19.2">del elemento</tspan></text><rect x="22" y="654" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="110" y="679.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">Rigor de procesos</tspan><tspan x="110" dy="19.2">y verificación</tspan></text><rect x="36.5" y="773" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="116" y="798.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="116" dy="0">Evidencia en el</tspan><tspan x="116" dy="19.2">expediente</tspan></text><rect x="232" y="654" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="324.5" y="679.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="324.5" dy="0">Elementos de clase</tspan><tspan x="324.5" dy="19.2">menor</tspan></text><rect x="330.5" y="603" width="102" height="42" rx="4" fill="#ffffff"/><text x="381.5" y="618.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="381.5" dy="0">segregación</tspan><tspan x="381.5" dy="17.92">argumentada</tspan></text></svg>
