<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 474 823" width="474" height="823" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Cliente» … «Corregir o revertir la rebanada»</title><desc id="d">Diagrama de flujo con 8 pasos. «Cliente» lleva a «Fachada o enrutador». «Fachada o enrutador» lleva a «Sistema antiguo» (rebanadas pendientes). «Fachada o enrutador» lleva a «Sistema nuevo» (rebanadas migradas). «Fachada o enrutador» lleva a «Comparación en sombra» (copia del tráfico). «Sistema antiguo» lleva a «Comparación en sombra». «Sistema nuevo» lleva a «Comparación en sombra». «Sistema nuevo» lleva a «Capa anticorrupción». «Capa anticorrupción» lleva a «Sistema antiguo». «Comparación en sombra» lleva a «Corregir o revertir la rebanada» (diferencia). «Corregir o revertir la rebanada» lleva a «Fachada o enrutador». «Sistema antiguo» lleva a «Retiro» (sin tráfico y observado).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="474" height="823" fill="#ffffff"/><path d="M236,66 L236,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M289.5,154.5 L305.0,154.5 Q314,154.5 314.0,163.5 L314.0,495.0 Q314,504 305.0,504.0 L279.7,504" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M232.5,185 L232.5,261" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M182.5,154.5 L33.0,154.5 Q24,154.5 24.0,163.5 L24.0,625.5 Q24,632.5 31.0,632.5 L38,632.5" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M200.2,526 L200.2,555.0 Q200.2,564 191.2,564.0 L122.0,564.0 Q113,564 113.0,573.0 L113,602" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M300,283 L308.5,283.0 Q317,283 317.0,291.5 L317.0,587.5 Q317,596.5 308.0,596.5 L211.0,596.5 Q202,596.5 202.0,605.5 L202.0,625.5 Q202,632.5 195.0,632.5 L188,632.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M229,305 L229.0,328.3 Q229,334 223.3,334.0 L223.3,334.0 Q217.6,334 217.6,339.7 L217.6,363" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M217.6,424 L217.6,444.3 Q217.6,453 208.9,453.0 L208.9,453.0 Q200.2,453 200.2,461.7 L200.2,482" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M115.1,663 L115.1,721" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M200.2,526 L200.2,534.0 Q200.2,542 208.2,542.0 L253.5,542.0 Q262.5,542 262.5,551.0 L262.5,610.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M179.3,761 L338.0,761.0 Q347,761 347.0,752.0 L347.0,163.5 Q347,154.5 338.0,154.5 L289.5,154.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="191.5" y="22" width="89" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="236" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="236" dy="0">Cliente</tspan></text><rect x="182.5" y="124" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="236" y="149.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="236" dy="0">Fachada o</tspan><tspan x="236" dy="19.2">enrutador</tspan></text><rect x="120.7" y="482" width="159" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="200.2" y="508.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="200.2" dy="0">Sistema antiguo</tspan></text><rect x="158" y="261" width="142" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="229" y="287.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="229" dy="0">Sistema nuevo</tspan></text><rect x="38" y="602" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="113" y="627.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="113" dy="0">Comparación en</tspan><tspan x="113" dy="19.2">sombra</tspan></text><rect x="142.6" y="363" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="217.6" y="388.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="217.6" dy="0">Capa</tspan><tspan x="217.6" dy="19.2">anticorrupción</tspan></text><rect x="55.3" y="721" width="124" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="117.3" y="746" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="117.3" dy="0">Corregir o</tspan><tspan x="117.3" dy="19.2">revertir la</tspan><tspan x="117.3" dy="19.2">rebanada</tspan></text><rect x="222" y="610.5" width="81" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="262.5" y="636.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="262.5" dy="0">Retiro</tspan></text><rect x="357.8" y="483" width="94" height="42" rx="4" fill="#ffffff"/><text x="404.8" y="498.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="404.8" dy="0">rebanadas</tspan><tspan x="404.8" dy="17.92">pendientes</tspan></text><rect x="140.5" y="202" width="86" height="42" rx="4" fill="#ffffff"/><text x="183.5" y="217.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="183.5" dy="0">rebanadas</tspan><tspan x="183.5" dy="17.92">migradas</tspan></text><rect x="30" y="372.5" width="86" heig