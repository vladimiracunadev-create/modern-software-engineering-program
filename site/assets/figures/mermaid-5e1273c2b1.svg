<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 378 1201" width="378" height="1201" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Síntoma reproducido» … «Verificación y regresión»</title><desc id="d">Diagrama de flujo con 11 pasos. «Síntoma reproducido» lleva a «Plataforma y capacidad». «Plataforma y capacidad» lleva a «Ruta, tipo y metadatos». «Ruta, tipo y metadatos» lleva a «Identidad y autorización». «Identidad y autorización» lleva a «Configuración efectiva». «Configuración efectiva» lleva a «Dependencias y procedencia». «Dependencias y procedencia» lleva a «Proceso, flujos y salida». «Proceso, flujos y salida» lleva a «Hipótesis confirmada?». «Hipótesis confirmada?» lleva a «Nueva prueba discriminante» (No). «Nueva prueba discriminante» lleva a «Plataforma y capacidad». «Hipótesis confirmada?» lleva a «Cambio mínimo reversible» (Sí). «Cambio mínimo reversible» lleva a «Verificación y regresión».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="378" height="1201" fill="#ffffff"/><path d="M119.1,83 L119.1,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M120.4,202 L120.4,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M123.9,321 L123.9,379" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M129.6,440 L129.6,498" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M133.1,559 L133.1,582.8 Q133.1,588 138.3,588.0 L138.3,588.0 Q143.6,588 143.6,593.2 L143.6,617" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M143.6,678 L143.6,699.2 Q143.6,707 151.4,707.0 L151.4,707.0 Q159.2,707 159.2,714.8 L159.2,736" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M159.2,797 L159.2,817.0 Q159.2,826 168.2,826.0 L172.6,826.0 Q181.6,826 181.6,835.0 L181.6,855" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M181.6,941 L181.6,949.0 Q181.6,957 173.6,957.0 L118.0,957.0 Q109,957 109.0,966.0 L109,999" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M181.6,941 L181.6,949.0 Q181.6,957 189.6,957.0 L276.0,957.0 Q285,957 285.0,966.0 L285,999" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M282.5,1060 L282.5,1118" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M38,1029.5 L31.0,1029.5 Q24,1029.5 24.0,1022.5 L24.0,180.5 Q24,171.5 33.0,171.5 L52.6,171.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="57.1" y="22" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="119.1" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="119.1" dy="0">Síntoma</tspan><tspan x="119.1" dy="19.2">reproducido</tspan></text><rect x="52.6" y="141" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="119.1" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="119.1" dy="0">Plataforma y</tspan><tspan x="119.1" dy="19.2">capacidad</tspan></text><rect x="55.2" y="260" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="121.7" y="285.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="121.7" dy="0">Ruta, tipo y</tspan><tspan x="121.7" dy="19.2">metadatos</tspan></text><rect x="59.6" y="379" width="133" height="61" rx="10" fill="#dff1ee