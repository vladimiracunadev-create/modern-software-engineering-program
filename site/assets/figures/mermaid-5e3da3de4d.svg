<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 827 438" width="827" height="438" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Modelos de calidad y atributos medibles» … «Informe reproducible de calidad»</title><desc id="d">Diagrama de flujo con 12 pasos. «Modelos de calidad y atributos medibles» lleva a «Revisión, análisis estático y quality gates». «Revisión, análisis estático y quality gates» lleva a «Carga, estrés, picos y endurance». «Carga, estrés, picos y endurance» lleva a «Latencia, throughput, saturación y capacidad». «Latencia, throughput, saturación y capacidad» lleva a «Perfiles, benchmarks y errores de medición». «Perfiles, benchmarks y errores de medición» lleva a «Timeouts, retries, backoff y jitter». «Timeouts, retries, backoff y jitter» lleva a «Circuit breakers, bulkheads y degradación». «Circuit breakers, bulkheads y degradación» lleva a «Disponibilidad, durabilidad y recuperación». «Disponibilidad, durabilidad y recuperación» lleva a «Compatibilidad, portabilidad e interoperabilidad». «Compatibilidad, portabilidad e interoperabilidad» lleva a «Calidad de experiencia y presupuestos». «Calidad de experiencia y presupuestos» lleva a «Taller de presión controlada». «Taller de presión controlada» lleva a «Informe reproducible de calidad». «Informe reproducible de calidad» lleva a «Modelos de calidad y atributos medibles» (incidente o hallazgo).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="827" height="438" fill="#ffffff"/><path d="M167.5,71.5 L244,71.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M386,71.5 L441,71.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M591,71.5 L659,71.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M725.5,121 L725.5,179" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M659,228.5 L600,228.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M432,228.5 L377,228.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M253,228.5 L189.5,228.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M110,268.5 L110,336" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M198,376 L244,376" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M386,376 L458.5,376" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M573.5,376 L646,376" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M725.5,336 L725.5,301.0 Q725.5,292 716.5,292.0 L212.5,292.0 Q203.5,292 203.5,283.0 L203.5,144.0 Q203.5,135 194.5,135.0 L117.0,135.0 Q110,135 110.0,128.0 L110,121" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="52.5" y="22" width="115" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="110" y="46.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">Modelos de</tspan><tspan x="110" dy="19.2">calidad y</tspan><tspan x="110" dy="19.2">atributos</tspan><tspan x="110" dy="19.2">medibles</tspan></text><rect x="244" y="22" width="142" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="315" y="46.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="315" dy="0">Revisión,</tspan><tspan x="315" dy="19.2">análisis</tspan><tspan x="315" dy="19.2">estático y</tspan><tspan x="315" dy="19.2">quality gates</tspan></text><rect x="441" y="31.5" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="516" y="56.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="516" dy="0">Carga, estrés,</tspan><tspan x="516" dy="19.2">picos y</tspan><tspan x="516" dy="19.2">endurance</tspan></text><rect x="659" y="22" width="133" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="725.5" y="46.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="725.5" dy="0">Latencia,</tspan><tspan x="725.5" dy="19.2">throughput,</tspan><tspan x="725.5" dy="19.2">saturación y</tspan><tspan x="725.5" dy="19.2">capacidad</tspan></text><rect x="659" y="179" width="133" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="725.5" y="203.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="725.5" dy="0">Perfiles,</tspan><tspan x="725.5" dy="19.2">benchmarks y</tspan><tspan x="725.5" dy="19.2">errores de</tspan><tspan x="725.5" dy="19.2">medición</tspan></text><rect x="432" y="188.5" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="516" y="213.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="516" dy="0">Timeouts,</tspan><tspan x="516" dy="19.2">retries, backoff</tspan><tspan x="516" dy="19.2">y jitter</tspan></text><rect x="253" y="179" width="124" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="315" y="203.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="315" dy="0">Circuit</tspan><tspan x="315" dy="19.2">breakers,</tspan><tspan x="315" dy="19.2">bulkheads y</tspan><tspan x="315" dy="19.2">degradación</tspan></text><rect x="30.5" y="188.5" width="159" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="110" y="213.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">Disponibilidad,</tspan><tspan x="110" dy="19.2">durabilidad y</tspan><tspan x="110" dy="19.2">recuperación</tspan></text><rect x="22" y="336" width="176" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="110" y="361" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">Compatibilidad,</tspan><tspan x="110" dy="19.2">portabilidad e</tspan><tspan x="110" dy="19.2">interoperabilidad</tspan></text><rect x="244" y="336" width="142" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="315" y="361" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="315" dy="0">Calidad de</tspan><tspan x="315" dy="19.2">experiencia y</tspan><tspan x="315" dy="19.2">presupuestos</tspan></text><rect x="458.5" y="336" width="115" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="516" y="361" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="516" dy="0">Taller de</tspan><tspan x="516" dy="19.2">presión</tspan><tspan x="516" dy="19.2">controlada</tspan></text><rect x="646" y="336" width="159" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="725.5" y="361" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="725.5" dy="0">Informe</tspan><tspan x="725.5" dy="19.2">reproducible de</tspan><tspan x="725.5" dy="19.2">calidad</tspan></text><rect x="209.5" y="129.7" width="102" height="42" rx="4" fill="#ffffff"/><text x="260.5" y="145.6" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="260.5" dy="0">incidente o</tspan><tspan x="260.5" dy="17.92">hallazgo</tspan></text></svg>
