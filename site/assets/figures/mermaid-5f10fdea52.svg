<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 513 847" width="513" height="847" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Plan: objetivo, supuestos y rangos» … «Registro de decisión»</title><desc id="d">Diagrama de flujo con 8 pasos. «Plan: objetivo, supuestos y rangos» lleva a «Señales semanales». «Señales semanales» lleva a «Regla de replanificación». «Regla de replanificación» lleva a «Señales semanales» (no se cumple). «Regla de replanificación» lleva a «Revisión con responsable» (se cumple). «Revisión con responsable» lleva a «Barreras». «Barreras» lleva a «Plan revisado» (recortar alcance). «Barreras» lleva a «Prohibido» (recortar calidad o seguridad). «Plan revisado» lleva a «Señales semanales» (nuevos datos). «Plan revisado» lleva a «Registro de decisión».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="513" height="847" fill="#ffffff"/><path d="M241.3,83 L241.3,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M237.4,185 L237.4,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M233.5,329 L233.5,338.6 Q233.5,345 227.1,345.0 L227.1,345.0 Q220.7,345 220.7,351.4 L220.7,387" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M220.7,448 L220.7,468.0 Q220.7,477 211.7,477.0 L210.7,477.0 Q201.7,477 201.7,486.0 L201.7,506" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M201.7,568 L201.7,576.0 Q201.7,584 193.7,584.0 L118.0,584.0 Q109,584 109.0,593.0 L109,662" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M201.7,568 L201.7,576.0 Q201.7,584 209.7,584.0 L258.5,584.0 Q267.5,584 267.5,593.0 L267.5,662" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M111.3,706 L111.3,764" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M361,286 L368.0,286.0 Q375,286 375.0,279.0 L375.0,172.0 Q375,163 366.0,163.0 L329.3,163" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><path d="M38,684 L31.0,684.0 Q24,684 24.0,677.0 L24.0,172.0 Q24,163 33.0,163.0 L153.3,163" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="148.8" y="22" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="241.3" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="241.3" dy="0">Plan: objetivo,</tspan><tspan x="241.3" dy="19.2">supuestos y rangos</tspan></text><rect x="153.3" y="141" width="176" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="241.3" y="167.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="241.3" dy="0">Señales semanales</tspan></text><polygon points="233.5,243 361,286 233.5,329 106,286" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="233.5" y="280.6" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="233.5" dy="0">Regla de</tspan><tspan x="233.5" dy="19.2">replanificación</tspan></text><rect x="154.2" y="387" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="220.7" y="412.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="220.7" dy="0">Revisión con</tspan><tspan x="220.7" dy="19.2">responsable</tspan></text><polygon points="201.7,506 259.7,537 201.7,568 143.7,537" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="201