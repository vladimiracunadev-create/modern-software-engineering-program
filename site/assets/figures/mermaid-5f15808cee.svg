<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 479 530" width="479" height="530" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Quien llega» … «Dónde sigo» y «Comprobación automática»</title><desc id="d">Diagrama de flujo con 7 pasos. «Quien llega» lleva a «Qué es y para qué». «Qué es y para qué» lleva a «Instalar». «Instalar» lleva a «Primer éxito verificable». «Primer éxito verificable» lleva a «Dónde sigo». «Instalar» lleva a «Abandono o ayuda» (falla un paso). «Primer éxito verificable» lleva a «Comprobación automática». «Comprobación automática» lleva a «Instalar» (deriva).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="479" height="530" fill="#ffffff"/><path d="M287.5,66 L287.5,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M287.5,168 L287.5,188.0 Q287.5,197 278.5,197.0 L269.8,197.0 Q260.8,197 260.8,206.0 L260.8,226" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M260.8,270 L260.8,290.0 Q260.8,299 251.8,299.0 L157.0,299.0 Q148,299 148.0,308.0 L148,328" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M148,389 L148.0,413.2 Q148,422.2 139.0,422.2 L88.5,422.2 Q79.5,422.2 79.5,431.2 L79.5,455.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M260.8,270 L260.8,278.0 Q260.8,286 268.8,286.0 L323.5,286.0 Q332.5,286 332.5,295.0 L332.5,336.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M148,389 L148.0,409.0 Q148,418 157.0,418.0 L228.5,418.0 Q237.5,418 237.5,427.0 L237.5,447" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M237.5,447 L237.5,293.0 Q237.5,284 228.5,284.0 L206.8,284.0 Q197.8,284 197.8,275.0 L197.8,255.0 Q197.8,248 204.8,248.0 L211.8,248" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="225.5" y="22" width="124" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="287.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="287.5" dy="0">Quien llega</tspan></text><rect x="199.5" y="124" width="176" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="287.5" y="150.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="287.5" dy="0">Qué es y para qué</tspan></text><rect x="211.8" y="226" width="98" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="260.8" y="252.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="260.8" dy="0">Instalar</tspan></text><rect x="81.5" y="328" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="148" y="353.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="148" dy="0">Primer éxito</tspan><tspan x="148" dy="19.2">verificable</tspan></text><rect x="22" y="455.5" width="115" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="79.5" y="481.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="79.5" dy="0">Dónde sigo</tspan></text><rect x="248.5" y="336.5" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="332.5" y="362.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="332.5" dy="0">Abandono o ayuda</tspan></text><rect x="171" y="447" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text