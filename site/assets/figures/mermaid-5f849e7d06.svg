<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 584 547" width="584" height="547" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Actuar y observar» … «Cambiar de plan» y «Escalar con la traza»</title><desc id="d">Diagrama de flujo con 7 pasos. «Actuar y observar» lleva a «¿Verificación pasa?». «¿Verificación pasa?» lleva a «Parar: éxito verificado» (sí). «¿Verificación pasa?» lleva a «¿Mismo resultado repetido?» (no). «¿Mismo resultado repetido?» lleva a «Actuar y observar» (no). «¿Mismo resultado repetido?» lleva a «Cambiar de plan» (sí, primera vez). «Cambiar de plan» lleva a «Actuar y observar». «¿Mismo resultado repetido?» lleva a «Escalar con la traza» (sí, otra vez). «Actuar y observar» lleva a «¿Tope o presupuesto agotado?». «¿Tope o presupuesto agotado?» lleva a «Escalar con la traza» (sí).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="584" height="547" fill="#ffffff"/><path d="M260.2,66 L260.2,94.5 Q260.2,103.5 251.2,103.5 L158.5,103.5 Q149.5,103.5 149.5,112.5 L149.5,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M149.5,227 L149.5,235.0 Q149.5,243 141.5,243.0 L109.4,243.0 Q100.4,243 100.4,252.0 L100.4,314.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M261,184 L272.0,184.0 Q281,184 281.0,193.0 L281.0,279.0 Q281,288 290.0,288.0 L329.4,288.0 Q336.4,288 336.4,295.0 L336.4,302" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M336.4,388 L336.4,396.0 Q336.4,404 328.4,404.0 L257.6,404.0 Q248.6,404 248.6,413.0 L248.6,472.5" fill=