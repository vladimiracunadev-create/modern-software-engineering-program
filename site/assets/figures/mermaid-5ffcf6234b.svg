 y="269.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="88.5" dy="0">Un equipo lo</tspan><tspan x="88.5" dy="19.2">completa</tspan></text><rect x="189" y="244" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="260" y="269.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="260" dy="0">Relevos entre</tspan><tspan x="260" dy="19.2">equipos</tspan></text><rect x="92.8" y="363" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="180.8" y="388.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="180.8" dy="0">Responsable y</tspan><tspan x="180.8" dy="19.2">segundo conocedor</tspan></text><rect x="108.9" y="482" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="201.4" y="507.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="201.4" dy="0">Revisión por quien</tspan><tspan x="201.4" dy="19.2">conoce</tspan></text><rect x="164.1" y="601" width="124" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="226.1" y="626" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="226.1" dy="0">Guardia con</tspan><tspan x="226.1" dy="19.2">rotación</tspan><tspan x="226.1" dy="19.2">suficiente</tspan></text><rect x="83.9" y="739" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="150.4" y="764.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="150.4" dy="0">Conocimiento</tspan><tspan x="150.4" dy="19.2">disponible</tspan></text><rect x="250.9" y="747.5" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="334.9" y="773.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="334.9" dy="0">Archivo huérfano</tspan></text><rect x="250.5" y="858" width="159"