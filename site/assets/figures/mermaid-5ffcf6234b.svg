<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 457 960" width="457" height="960" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Cambio a realizar» … «Relevo, pares y documentación operable»</title><desc id="d">Diagrama de flujo con 10 pasos. «Cambio a realizar» lleva a «Frontera de equipo». «Frontera de equipo» lleva a «Un equipo lo completa» (por dominio). «Frontera de equipo» lleva a «Relevos entre equipos» (por capa). «Un equipo lo completa» lleva a «Responsable y segundo conocedor». «Relevos entre equipos» lleva a «Responsable y segundo conocedor». «Responsable y segundo conocedor» lleva a «Revisión por quien conoce». «Revisión por quien conoce» lleva a «Guardia con rotación suficiente». «Guardia con rotación suficiente» lleva a «Conocimiento disponible» (persona se va). «Guardia con rotación suficiente» lleva a «Archivo huérfano» (nadie más sabe). «Archivo huérfano» lleva a «Relevo, pares y documentación operable». «Relevo, pares y documentación operable» lleva a «Responsable y segundo conocedor».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="457" height="960" fill="#ffffff"/><path d="M171.7,66 L171.7,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M171.7,186 L171.7,194.0 Q171.7,202 163.7,202.0 L97.5,202.0 Q88.5,202 88.5,211.0 L88.5,244" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M171.7,186 L171.7,194.0 Q171.7,202 179.7,202.0 L251.0,202.0 Q260,202 260.0,211.0 L260,244" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M88.5,30