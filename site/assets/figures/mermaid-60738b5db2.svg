<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 505 930" width="505" height="930" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Solicitud de integración» … «Datos eliminados»</title><desc id="d">Diagrama de flujo con 10 pasos. «Solicitud de integración» lleva a «Entorno de vista previa». «Entorno de vista previa» lleva a «Datos: sintéticos o enmascarados». «Datos: sintéticos o enmascarados» lleva a «Riesgo de reidentificación». «Riesgo de reidentificación» lleva a «Generalizar o suprimir» (alto). «Riesgo de reidentificación» lleva a «Uso del entorno» (aceptable). «Uso del entorno» lleva a «Actividad reciente». «Actividad reciente» lleva a «Renovar la vida» (sí). «Actividad reciente» lleva a «Destruir» (no, o cerrada). «Destruir» lleva a «Datos eliminados».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="505" height="930" fill="#ffffff"/><path d="M137,83 L137,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M137,202 L137.0,224.7 Q137,231 143.3,231.0 L143.3,231.0 Q149.7,231 149.7,237.3 L149.7,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M149.7,321 L149.7,341.0 Q149.7,350 158.7,350.0 L161.1,350.0 Q170.1,350 170.1,359.0 L170.1,379" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M170.1,465 L170.1,473.0 Q170.1,481 162.1,481.0 L102.0,481.0 Q93,481 93.0,490.0 L93,523" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M170.1,465 L170.1,473.0 Q170.1,481 178.1,481.0 L268.5,481.0 Q277.5,481 277.5,490.0 L277.