<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 831 185" width="831" height="185" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Vértices, aristas / dirección» … «Componentes / alcanzabilidad»</title><desc id="d">Diagrama de flujo con 5 pasos. «Vértices, aristas / dirección» lleva a «Lista / matriz de adyacencia». «Lista / matriz de adyacencia» lleva a «BFS / distancia no ponderada». «BFS / distancia no ponderada» lleva a «DFS, ciclos / orden». «DFS, ciclos / orden» lleva a «Componentes / alcanzabilidad». «Componentes / alcanzabilidad» lleva a «Vértices, aristas / dirección» (fallo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="831" height="185" fill="#ffffff"/><path d="M129,113.5 L175,113.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M290,113.5 L336,113.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M443,113.5 L489,113.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M613,113.5 L659,113.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M734,73.5 L734.0,59.0 Q734,50 725.0,50.0 L84.5,50.0 Q75.5,50 75.5,59.0 L75.5,73.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="73.5" width="107" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="75.5" y="98.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="75.5" dy="0">Vértices,</tspan><tspan x="75.5" dy="19.2">aristas /</tspan><tspan x="75.5" dy="19.2">dirección</tspan></text><rect x="175" y="73.5" width="115" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="232.5" y="98.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="232.5" dy="0">Lista /</tspan><tspan x="232.5" dy="19.2">matriz de</tspan><tspan x="232.5" dy="19.2">adyacencia</tspan></text><rect x="336" y="64" width="107" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="389.5" y="88.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="389.5" dy="0">BFS /</tspan><tspan x="389.5" dy="19.2">distancia</tspan><tspan x="389.5" dy="19.2">no</tspan><tspan x="389.5" dy="19.2">ponderada</tspan></text><rect x="489" y="83" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="551" y="108.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="551" dy="0">DFS, ciclos</tspan><tspan x="551" dy="19.2">/ orden</tspan></text><rect x="659" y="73.5" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="734" y="98.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="734" dy="0">Componentes</tspan><tspan x="734" dy="19.2">/</tspan><tspan x="734" dy="19.2">alcanzabilidad</tspan></text><rect x="341.8" y="22" width="126" height="24" rx="4" fill="#ffffff"/><text x="404.8" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="404.8" dy="0">fallo o cambio</tspan></text></svg>
