<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 583 199" width="583" height="199" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Historia» … «Criterios ejecutables»</title><desc id="d">Diagrama de flujo con 4 pasos. «Historia» lleva a «Reglas». «Reglas» lleva a «Ejemplos». «Ejemplos» lleva a «Criterios ejecutables». «Ejemplos» lleva a «Historia» (pregunta abierta). «Criterios ejecutables» lleva a «Ejemplos» (mutante vivo).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="583" height="199" fill="#ffffff"/><path d="M120,104 L166,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M247,104 L293,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M391,104 L437,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M342,82 L342.0,75.0 Q342,68 335.0,68.0 L78.0,68.0 Q71,68 71.0,75.0 L71,82" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><path d="M499,134.5 L499.0,141.5 Q499,148.5 492.0,148.5 L351.0,148.5 Q342,148.5 342.0,139.5 L342,126" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="82" width="98" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="71" y="108.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="71" dy="0">Historia</tspan></text><rect x="166" y="82" width="81" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="206.5" y="108.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="206.5" dy="0">Reglas</tspan></text><rect x="293" y="82" width="98" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="342" y="108.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="342" dy="0">Ejemplos</tspan></text><rect x="437" y="73.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="499" y="98.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="499" dy="0">Criterios</tspan><tspan x="499" dy="19.2">ejecutables</tspan></text><rect x="168" y="22" width="77" height="42" rx="4" fill="#ffffff"/><text x="206.5" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="206.5" dy="0">pregunta</tspan><tspan x="206.5" dy="17.92">abierta</tspan></text><rect x="365.5" y="152.5" width="110" height="24" rx="4" fill="#ffffff"/><text x="420.5" y="168.4" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="420.5" dy="0">mutante vivo</tspan></text></svg>
