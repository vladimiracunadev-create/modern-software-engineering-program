<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 586 400" width="586" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Necesidad y origen» … «Especificación revisable»</title><desc id="d">Diagrama de flujo con 9 pasos. «Necesidad y origen» lleva a «Reglas y requisitos funcionales». «Reglas y requisitos funcionales» lleva a «Calidad y restricciones». «Calidad y restricciones» lleva a «Relatos y ejemplos de aceptación». «Relatos y ejemplos de aceptación» lleva a «Orden, dependencias y negociación». «Orden, dependencias y negociación» lleva a «Trazabilidad y obligaciones externas». «Trazabilidad y obligaciones externas» lleva a «Línea base y control de cambios». «Línea base y control de cambios» lleva a «Defectos y reparación». «Defectos y reparación» lleva a «Especificación revisable». «Especificación revisable» lleva a «Necesidad y origen» (defecto o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="586" height="400" fill="#ffffff"/><path d="M159,62 L231,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M355,62 L418,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M489,92.5 L489,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M427,200 L368,200" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M218,200 L172,200" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M97,240 L97,298" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M163.5,338 L235.5,338" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M350.5,338 L414,338" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M489,307.5 L489.0,263.0 Q489,254 480.0,254.0 L195.0,254.0 Q186,254 186.0,245.0 L186.0,115.5 Q186,106.5 177.0,106.5 L104.0,106.5 Q97,106.5 97.0,99.5 L97,92.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="35" y="31.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="97" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="97" dy="0">Necesidad y</tspan><tspan x="97" dy="19.2">origen</tspan></text><rect x="231" y="22" width="124" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="293" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="293" dy="0">Reglas y</tspan><tspan x="293" dy="19.2">requisitos</tspan><tspan x="293" dy="19.2">funcionales</tspan></text><rect x="418" y="31.5" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="489" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="489" dy="0">Calidad y</tspan><tspan x="489" dy="19.2">restricciones</tspan></text><rect x="427" y="160" width="124" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="489" y="185" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="489" dy="0">Relatos y</tspan><tspan x="489" dy="19.2">ejemplos de</tspan><tspan x="489" dy="19.2">aceptación</tspan></text><rect x="218" y="160" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="293" y="185" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="293" dy="0">Orden,</tspan><tspan x="293" dy="19.2">dependencias y</tspan><tspan x="293" dy="19.2">negociación</tspan></text><rect x="22" y="160" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="97" y="185" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="97" dy="0">Trazabilidad y</tspan><tspan x="97" dy="19.2">obligaciones</tspan><tspan x="97" dy="19.2">externas</tspan></text><rect x="30.5" y="298" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="97" y="323" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="97" dy="0">Línea base y</tspan><tspan x="97" dy="19.2">control de</tspan><tspan x="97" dy="19.2">cambios</tspan></text><rect x="235.5" y="307.5" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="293" y="332.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="293" dy="0">Defectos y</tspan><tspan x="293" dy="19.2">reparación</tspan></text><rect x="414" y="307.5" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="489" y="332.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="489" dy="0">Especificación</tspan><tspan x="489" dy="19.2">revisable</tspan></text><rect x="294.5" y="258" width="86" height="42" rx="4" fill="#ffffff"/><text x="337.5" y="273.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="337.5" dy="0">defecto o</tspan><tspan x="337.5" dy="17.92">cambio</tspan></text></svg>
