<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 811 1036" width="811" height="1036" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Fuente revisada» … «Registro del motivo» y «Instalación atómica»</title><desc id="d">Diagrama de flujo con 12 pasos. «Fuente revisada» lleva a «Build reproducible». «Build reproducible» lleva a «Artefacto + SBOM + procedencia». «Artefacto + SBOM + procedencia» lleva a «Manifiesto: nombre, versión, secuencia, huellas». «Manifiesto: nombre, versión, secuencia, huellas» lleva a «Firma con clave en servicio de claves». «Firma con clave en servicio de claves» lleva a «Repositorio de releases». «Repositorio de releases» lleva a «Verificador en otro sistema: valores esperados fijados». «Verificador en otro sistema: valores esperados fijados» lleva a «Registro del motivo» (rechaza). «Verificador en otro sistema: valores esperados fijados» lleva a «Instalación atómica» (acepta). «Repositorio de releases» lleva a «Retroceso: nuevo release con secuencia mayor». «Repositorio de releases» lleva a «Pérdida del repositorio: reconstruir y comparar». «Firma con clave en servicio de claves» lleva a «Rotación declarada o pérdida de la clave».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="811" height="1036" fill="#ffffff"/><path d="M695.9,66 L695.9,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M695.9,168 L695.9,188.0 Q695.9,197 686.9,197.0 L679.2,197.0 Q670.2,197 670.2,206.0 L670.2,226" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M670.2,287 L670.2,307.0 Q670.2,316 661.2,316.0 L637.5,316.0 Q628.5,316 628.5,325.0 L628.5,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M628.5,425 L628.5,445.0 Q628.5,454 619.5,454.0 L575.0,454.0 Q566,454 566.0,463.0 L566,483" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M566,544 L566.0,568.8 Q566,577.8 557.0,577.8 L429.9,577.8 Q420.9,577.8 420.9,586.8 L420.9,611.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M420.9,672.5 L420.9,697.2 Q420.9,706.2 411.9,706.2 L163.9,706.2 Q154.9,706.2 154.9,715.2 L154.9,740" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M154.9,895 L154.9,903.0 Q154.9,911 146.9,911.0 L97.5,911.0 Q88.5,911 88.5,920.0 L88.5,953" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M154.9,895 L154.9,903.0 Q154.9,911 162.9,911.0 L242.0,911.0 Q251,911 251.0,920.0 L251,953" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M420.9,672.5 L420.9,716.2 Q420.9,725 412.1,725.0 L412.1,725.0 Q403.4,725 403.4,733.8 L403.4,777.5" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M420.9,672.5 L420.9,711.2 Q420.9,720.2 429.9,720.2 L583.4,720.2 Q592.4,720.2 592.4,729.2 L592.4,768" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M566,544 L566.0,564.0 Q566,573 575.0,573.0 L613.4,573.0 Q622.4,573 622.4,582.0 L622.4,602" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="616.4" y="22" width="159" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="695.9" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="695.9" dy="0">Fuente revisada</tspan></text><rect x="603.4" y="124" width="185" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="695.9" y="150.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="695.9" dy="0">Build reproducible</tspan></text><rect x="577.7" y="226" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="670.2" y="251.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="670.2" dy="0">Artefacto + SBOM +</tspan><tspan x="670.2" dy="19.2">procedencia</tspan></text><rect x="536" y="345" width="185" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="628.5" y="370" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="628.5" dy="0">Manifiesto:</tspan><tspan x="628.5" dy="19.2">nombre, versión,</tspan><tspan x="628.5" dy="19.2">secuencia, huellas</tspan></text><rect x="473.5" y="483" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="566" y="508.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="566" dy="0">Firma con clave en</tspan><tspan x="566" dy="19.2">servicio de claves</tspan></text><rect x="345.9" y="611.5" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="420.9" y="636.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="420.9" dy="0">Repositorio de</tspan><tspan x="420.9" dy="19.2">releases</tspan></text><polygon points="154.9,740 285.4,817.5 154.9,895 24.4,817.5" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="154.9" y="792.9" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="154.9" dy="0">Verificador en</tspan><tspan x="154.9" dy="19.2">otro sistema:</tspan><tspan x="154.9" dy="19.2">valores esperados</tspan><tspan x="154.9" dy="19.2">fijados</tspan></text><rect x="22" y="953" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="88.5" y="978.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="88.5" dy="0">Registro del</tspan><tspan x="88.5" dy="19.2">motivo</tspan></text><rect x="189" y="953" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="251" y="978.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="251" dy="0">Instalación</tspan><tspan x="251" dy="19.2">atómica</tspan></text><rect x="319.4" y="777.5" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="403.4" y="802.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="403.4" dy="0">Retroceso: nuevo</tspan><tspan x="403.4" dy="19.2">release con</tspan><tspan x="403.4" dy="19.2">secuencia mayor</tspan></text><rect x="521.4" y="768" width="142" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="592.4" y="792.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="592.4" dy="0">Pérdida del</tspan><tspan x="592.4" dy="19.2">repositorio:</tspan><tspan x="592.4" dy="19.2">reconstruir y</tspan><tspan x="592.4" dy="19.2">comparar</tspan></text><rect x="529.9" y="602" width="185" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="622.4" y="627" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="622.4" dy="0">Rotación declarada</tspan><tspan x="622.4" dy="19.2">o pérdida de la</tspan><tspan x="622.4" dy="19.2">clave</tspan></text><rect x="94.5" y="920" width="69" height="24" rx="4" fill="#ffffff"/><text x="129" y="935.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="129" dy="0">rechaza</tspan></text><rect x="257" y="920" width="61" height="24" rx="4" fill="#ffffff"/><text x="287.5" y="935.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="287.5" dy="0">acepta</tspan></text></svg>
