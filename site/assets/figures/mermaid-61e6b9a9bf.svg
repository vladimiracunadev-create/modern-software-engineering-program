<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 845 419" width="845" height="419" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Estado estable e hipótesis» … «Proyecto: programa de caos con evidencia»</title><desc id="d">Diagrama de flujo con 12 pasos. «Estado estable e hipótesis» lleva a «Alcance, radio y aborto». «Alcance, radio y aborto» lleva a «Fallos de red, latencia y dependencias». «Fallos de red, latencia y dependencias» lleva a «Fallos de recursos e infraestructura». «Fallos de recursos e infraestructura» lleva a «Kubernetes y plataformas cloud». «Kubernetes y plataformas cloud» lleva a «Fallos de datos y de estado». «Fallos de datos y de estado» lleva a «Game days y respuesta a incidentes». «Game days y respuesta a incidentes» lleva a «Caos continuo: CI/CD y producción». «Caos continuo: CI/CD y producción» lleva a «Seguridad y gobernanza». «Seguridad y gobernanza» lleva a «Aprender de los experimentos». «Aprender de los experimentos» lleva a «Taller: experimento acotado con aborto». «Taller: experimento acotado con aborto» lleva a «Proyecto: programa de caos con evidencia». «Proyecto: programa de caos con evidencia» lleva a «Estado estable e hipótesis» (hallazgo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="845" height="419" fill="#ffffff"/><path d="M190,62 L236,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M404,62 L454.5,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M604.5,62 L659.5,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M739,102 L739,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M672.5,200 L609,200" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M450,200 L382,200" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M258,200 L181,200" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M106,240 L106,317" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M168,347.5 L240.5,347.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M399.5,347.5 L467.5,347.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M591.5,347.5 L655,347.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M739,307.5 L739.0,263.0 Q739,254 730.0,254.0 L204.0,254.0 Q195,254 195.0,245.0 L195.0,115.5 Q195,106.5 186.0,106.5 L113.0,106.5 Q106,106.5 106.0,99.5 L106,92.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="31.5" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Estado estable e</tspan><tspan x="106" dy="19.2">hipótesis</tspan></text><rect x="236" y="31.5" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="320" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="320" dy="0">Alcance, radio y</tspan><tspan x="320" dy="19.2">aborto</tspan></text><rect x="454.5" y="22" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="529.5" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="529.5" dy="0">Fallos de red,</tspan><tspan x="529.5" dy="19.2">latencia y</tspan><tspan x="529.5" dy="19.2">dependencias</tspan></text><rect x="659.5" y="22" width="159" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="739" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="739" dy="0">Fallos de</tspan><tspan x="739" dy="19.2">recursos e</tspan><tspan x="739" dy="19.2">infraestructura</tspan></text><rect x="672.5" y="160" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="739" y="185" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="739" dy="0">Kubernetes y</tspan><tspan x="739" dy="19.2">plataformas</tspan><tspan x="739" dy="19.2">cloud</tspan></text><rect x="450" y="169.5" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="529.5" y="194.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="529.5" dy="0">Fallos de datos</tspan><tspan x="529.5" dy="19.2">y de estado</tspan></text><rect x="258" y="160" width="124" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="320" y="185" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="320" dy="0">Game days y</tspan><tspan x="320" dy="19.2">respuesta a</tspan><tspan x="320" dy="19.2">incidentes</tspan></text><rect x="31" y="160" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="185" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Caos continuo:</tspan><tspan x="106" dy="19.2">CI/CD y</tspan><tspan x="106" dy="19.2">producción</tspan></text><rect x="44" y="317" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="342.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Seguridad y</tspan><tspan x="106" dy="19.2">gobernanza</tspan></text><rect x="240.5" y="317