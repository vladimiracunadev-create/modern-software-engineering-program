<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 596 262" width="596" height="262" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Concurrencia, paralelismo e intercalación» … «Consistencia / presión del buzón»</title><desc id="d">Diagrama de flujo con 5 pasos. «Concurrencia, paralelismo e intercalación» lleva a «Actor, buzón / propiedad del estado». «Actor, buzón / propiedad del estado» lleva a «Protocolos de mensajes». «Protocolos de mensajes» lleva a «Fallo, enlaces / supervisión». «Fallo, enlaces / supervisión» lleva a «Consistencia / presión del buzón». «Consistencia / presión del buzón» lleva a «Concurrencia, paralelismo e intercalación» (fallo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="596" height="262" fill="#ffffff"/><path d="M164,62 L210,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M360,62 L419,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M490,92.5 L490,169.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M406,200 L360,200" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M210,200 L102.0,200.0 Q93,200 93.0,191.0 L93,102" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="22" width="142" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="93" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="93" dy="0">Concurrencia,</tspan><tspan x="93" dy="19.2">paralelismo e</tspan><tspan x="93" dy="19.2">intercalación</tspan></text><rect x="210" y="22" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="285" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="285" dy="0">Actor, buzón /</tspan><tspan x="285" dy="19.2">propiedad del</tspan><tspan x="285" dy="19.2">estado</tspan></text><rect x="419" y="31.5" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="490" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">Protocolos de</tspan><tspan x="490" dy="19.2">mensajes</tspan></text><rect x="406" y="169.5" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="490" y="194.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">Fallo, enlaces /</tspan><tspan x="490" dy="19.2">supervisión</tspan></text><rect x="210" y="160" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="285" y="185" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="285" dy="0">Consistencia /</tspan><tspan x="285" dy="19.2">presión del</tspan><tspan x="285" dy="19.2">buzón</tspan></text><rect x="76.8" y="172" width="126" height="24" rx="4" fill="#ffffff"/><text x="139.8" y="187.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="139.8" dy="0">fallo o cambio</tspan></text></svg>
