748" dy="0">ReAct, plan y</tspan><tspan x="748" dy="19.2">reflexión</tspan></text><rect x="703.5" y="168.5" width="89" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="748" y="194.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="748" dy="0">Memoria</tspan></text><rect x="467.5" y="168.5" width="133" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="534" y="194.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="534" dy="0">Recuperación</tspan></text><rect x="266.5" y="168.5" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="320" y="194.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="320" dy="0">MCP y A2A</tspan></text><rect x="52.5" y="160" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="185.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Ejecución</tspan><tspan x="106" dy="19.2">durable</tspan></text><rect x="31" y="297" width="150" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="323.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Evals y LLMOps</tspan></text><rect x="236" y="288.5" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="320" y="313.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="320" dy="0">Costo, latencia,</tspan><tspan x="320" dy="19.2">seguridad</tspan></text><rect x="450" y="288.5" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="534" y="313.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="534" dy="0">Taller: elegir y</tspan><tspan x="534" dy="19.2">degradar</tspan></text><rect x="664" y="279" width="168" height="80"