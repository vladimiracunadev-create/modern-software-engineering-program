<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 854 381" width="854" height="381" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Workflows frente a agentes» … «Proyecto: sistema evaluado y operable»</title><desc id="d">Diagrama de flujo con 12 pasos. «Workflows frente a agentes» lleva a «Encadenar, enrutar, paralelizar». «Encadenar, enrutar, paralelizar» lleva a «Orquestador y evaluador». «Orquestador y evaluador» lleva a «ReAct, plan y reflexión». «ReAct, plan y reflexión» lleva a «Memoria». «Memoria» lleva a «Recuperación». «Recuperación» lleva a «MCP y A2A». «MCP y A2A» lleva a «Ejecución durable». «Ejecución durable» lleva a «Evals y LLMOps». «Evals y LLMOps» lleva a «Costo, latencia, seguridad». «Costo, latencia, seguridad» lleva a «Taller: elegir y degradar». «Taller: elegir y degradar» lleva a «Proyecto: sistema evaluado y operable». «Proyecto: sistema evaluado y operable» lleva a «Workflows frente a agentes» (fallos reales).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="854" height="381" fill="#ffffff"/><path d="M190,62 L258,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M382,62 L463,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M605,62 L677,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M748,92.5 L748,168.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M703.5,190.5 L600.5,190.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M467.5,190.5 L373.