<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 764" width="590" height="764" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Tareas» … «Detener y llamar a una persona»</title><desc id="d">Diagrama de flujo con 8 pasos. «Tareas» lleva a «Implementar». «Implementar» lleva a «Verificador independiente». «Verificador independiente» lleva a «Convergido» (todos los criterios cumplidos). «Verificador independiente» lleva a «Tareas añadidas» (criterios abiertos). «Tareas añadidas» lleva a «Implementar». «Verificador independiente» lleva a «Regresión» (más abiertos que antes). «Regresión» lleva a «Condición de parada». «Tareas añadidas» lleva a «Condición de parada». «Condición de parada» lleva a «Detener y llamar a una persona» (máximo de pasadas, sin progreso o presupuesto). «Condición de parada» lleva a «Implementar» (sigue habiendo progreso).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="590" height="764" fill="#ffffff"/><path d="M245.6,66 L245.6,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M245.6,168 L245.6,188.0 Q245.6,197 254.6,197.0 L261.7,197.0 Q270.7,197 270.7,206.0 L270.7,226" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M270.7,287 L270.7,295.0 Q270.7,303 262.7,303.0 L123.0,303.0 Q114,303 114.0,312.0 L114,381" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M270.7,287 L270.7,295.9 Q270.7,303 277.9,303.0 L277.9,303.0 Q285,303 285.0,310.1 L285,381" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M270.7,287 L270.7,295.0 Q270.7,303 278.7,303.0 L443.0,303.0 Q452,303 452.0,312.0 L452,381" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M452,425 L452.0,445.0 Q452,454 443.0,454.0 L362.0,454.0 Q353,454 353.0,463.0 L353,483" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M285,425 L285.0,445.0 Q285,454 294.0,454.0 L344.0,454.0 Q353,454 353.0,463.0 L353,483" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M353,569 L353.0,579.6 Q353,585 347.6,585.0 L347.6,585.0 Q342.3,585 342.3,590.4 L342.3,681" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M205.5,403 L194.5,403.0 Q185.5,403 185.5,394.0 L185.5,189.9 Q185.5,182 177.6,182.0 L177.6,182.0 Q169.6,182 169.6,174.1 L169.6,153.0 Q169.6,146 176.6,146.0 L183.6,146" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><path d="M249,526 L200.5,526.0 Q191.5,526 191.5,517.0 L191.5,191.0 Q191.5,182 200.5,182.0 L312.6,182.0 Q321.6,182 321.6,173.0 L321.6,153.0 Q321.6,146 314.6,146.0 L307.6,146" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="205.1" y="22" width="81" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="245.6" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="245.6" dy="0">Tareas</tspan></text><rect x="183.6" y="124" width="124" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="245.6" y="150.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="245.6" dy="0">Implementar</tspan></text><rect x="199.7" y="226" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="270.7" y="251.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="270.7" dy="0">Verificador</tspan><tspan x="270.7"