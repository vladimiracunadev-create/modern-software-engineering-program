<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 464 683" width="464" height="683" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Necesidad: matricularse» … «Otros sistemas»</title><desc id="d">Diagrama de flujo con 8 pasos. «Necesidad: matricularse» lleva a «Sistema sociotécnico». «Sistema sociotécnico» lleva a «Producto de inscripción». «Producto de inscripción» lleva a «Software web». «Producto de inscripción» lleva a «Operación y soporte». «Sistema sociotécnico» lleva a «Reglas académicas». «Software web» lleva a «Identidad, pagos, cupos». «Identidad, pagos, cupos» lleva a «Otros sistemas».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="464" height="683" fill="#ffffff"/><path d="M281.1,83 L281.1,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M281.1,202 L281.1,222.0 Q281.1,231 272.1,231.0 L178.7,231.0 Q169.7,231 169.7,240.0 L169.7,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M169.7,321 L169.7,345.2 Q169.7,354.2 160.7,354.2 L97.5,354.2 Q88.5,354.2 88.5,363.2 L88.5,387.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M169.7,321 L169.7,341.0 Q169.7,350 178.7,350.0 L242.0,350.0 Q251,350 251.0,359.0 L251,379" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M281.1,202 L281.1,226.2 Q281.1,235.2 290.1,235.2 L344.7,235.2 Q353.7,235.2 353.7,244.2 L353.7,268.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M88.5,431.5 L88.5,455.8 Q88.5,464.8 97.5,464.8 L118.0,464.