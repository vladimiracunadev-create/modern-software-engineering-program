<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 809 362" width="809" height="362" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Tarea y personas» … «Prototipo y declaración»</title><desc id="d">Diagrama de flujo con 10 pasos. «Tarea y personas» lleva a «Estructura y navegación». «Estructura y navegación» lleva a «Interacción y retroalimentación». «Interacción y retroalimentación» lleva a «Estados y recuperación». «Estados y recuperación» lleva a «Accesibilidad: criterios». «Accesibilidad: criterios» lleva a «Semántica, teclado y foco». «Semántica, teclado y foco» lleva a «Visual, adaptación e idioma». «Visual, adaptación e idioma» lleva a «Evaluación con personas». «Evaluación con personas» lleva a «Auditoría y reparación». «Auditoría y reparación» lleva a «Prototipo y declaración». «Prototipo y declaración» lleva a «Tarea y personas» (hallazgos).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="809" height="362" fill="#ffffff"/><path d="M190,52.5 L236,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M369,52.5 L415,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M591,52.5 L645.5,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M712,83 L712,150.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M637,181 L578,181" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M428,181 L369,181" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M236,181 L181,181" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M106,211.5 L106,279" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M168,309.5 L240.5,309.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M302.5,279 L302.5,244.0 Q302.5,235 293.5,235.0 L204.0,235.0 Q195,235 195.0,226.0 L195.0,97.5 Q195,88.5 186.0,88.5 L113.0,88.5 Q106,88.5 106.0,81.5 L106,74.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="30.5" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Tarea y personas</tspan></text><rect x="236" y="22" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="302.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="302.5" dy="0">Estructura y</tspan><tspan x="302.5" dy="19.2">navegación</tspan></text><rect x="415" y="22" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="503" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="503" dy="0">Interacción y</tspan><tspan x="503" dy="19.2">retroalimentación</tspan></text><rect x="645.5" y="22" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="712" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="712" dy="0">Estados y</tspan><tspan x="712" dy="19.2">recuperación</tspan></text><rect x="637" y="150.5" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="712" y="175.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="712" dy="0">Accesibilidad:</tspan><tspan x="712" dy="19.2">criterios</tspan></text><rect x="428" y="150.5" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="503" y="175.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="503" dy="0">Semántica,</tspan><tspan x="503" dy="19.2">teclado y foco</tspan></text><rect x="236" y="141" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="302.5" y="166" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="302.5" dy="0">Visual,</tspan><tspan x="302.5" dy="19.2">adaptación e</tspan><tspan x="302.5" dy="19.2">idioma</tspan></text><rect x="31" y="150.5" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="175.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Evaluación con</tspan><tspan x="106" dy="19.2">personas</tspan></text><rect x="44" y="279" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="304.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Auditoría y</tspan><tspan x="106" dy="19.2">reparación</tspan></text><rect x="240.5" y="279" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="302.5" y="304.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="302.5" dy="0">Prototipo y</tspan><tspan x="302.5" dy="19.2">declaración</tspan></text><rect x="103" y="120.5" width="86" height="24" rx="4" fill="#ffffff"/><text x="146" y="136.4" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="146" dy="0">hallazgos</tspan></text></svg>
