<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 190" width="580" height="190" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «⚠️ Síntoma» … «📚 Prevención»</title><desc id="d">Diagrama de flujo con 6 pasos. «⚠️ Síntoma» lleva a «🔎 Hipótesis». «🔎 Hipótesis» lleva a «🧯 Contención». «🧯 Contención» lleva a «🧠 Diagnóstico». «🧠 Diagnóstico» lleva a «🛠️ Recuperación». «🛠️ Recuperación» lleva a «📚 Prevención».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="580" height="190" fill="#ffffff"/><path d="M148,44 L220,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M351,44 L414.5,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M484,66 L484,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M410,146 L364,146" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M207,146 L161,146" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="35" y="22" width="113" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="91.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="91.5" dy="0">⚠️ Síntoma</tspan></text><rect x="220" y="22" width="131" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="285.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="285.5" dy="0">🔎 Hipótesis</tspan></text><rect x="414.5" y="22" width="139" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="484" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="484" dy="0">🧯 Contención</tspan></text><rect x="410" y="124" width="148" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="484" y="150.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="484" dy="0">🧠 Diagnóstico</tspan></text><rect x="207" y="124" width="157" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="285.5" y="150.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="285.5" dy="0">🛠️ Recuperación</tspan></text><rect x="22" y="124" width="139" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="91.5" y="150.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="91.5" dy="0">📚 Prevención</tspan></text></svg>
