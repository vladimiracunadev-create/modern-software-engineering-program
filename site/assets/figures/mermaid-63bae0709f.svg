<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 766 224" width="766" height="224" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Incidente ambiguo» … «Especificación contrastable»</title><desc id="d">Diagrama de flujo con 8 pasos. «Incidente ambiguo» lleva a «Descomposición y vocabulario». «Descomposición y vocabulario» lleva a «Lógica y estructuras». «Lógica y estructuras» lleva a «Contratos e invariantes». «Contratos e invariantes» lleva a «Algoritmo y terminación». «Algoritmo y terminación» lleva a «Complejidad y límites». «Complejidad y límites» lleva a «Estados e hipótesis». «Estados e hipótesis» lleva a «Especificación contrastable». «Especificación contrastable» lleva a «Descomposición y vocabulario» (contraejemplo).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="766" height="224" fill="#ffffff"/><path d="M150.5,52.5 L218,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M386,52.5 L441,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M565,52.5 L620,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M682,83 L682,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M620,171.5 L574,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M432,171.5 L355.5,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M248.5,171.5 L172,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M97,141 L97.0,106.0 Q97,97 106.0,97.0 L295.0,97.0 Q302,97 302.0,90.0 L302,83" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="43.5" y="22" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="97" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="97" dy="0">Incidente</tspan><tspan x="97" dy="19.2">ambiguo</tspan></text><rect x="218" y="22" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="302" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="302" dy="0">Descomposición y</tspan><tspan x="302" dy="19.2">vocabulario</tspan></text><rect x="441" y="22" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="503" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="503" dy="0">Lógica y</tspan><tspan x="503" dy="19.2">estructuras</tspan></text><rect x="620" y="22" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="682" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="682" dy="0">Contratos e</tspan><tspan x="682" dy="19.2">invariantes</tspan></text><rect x="620" y="141" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="682" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="682" dy="0">Algoritmo y</tspan><tspan x="682" dy="19.2">terminación</tspan></text><rect x="432" y="141" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="503" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="503" dy="0">Complejidad y</tspan><tspan x="503" dy="19.2">límites</tspan></text><rect x="248.5" y="141" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="302" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="302" dy="0">Estados e</tspan><tspan x="302" dy="19.2">hipótesis</tspan></text><rect x="22" y="141" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="97" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="97" dy="0">Especificación</tspan><tspan x="97" dy="19.2">contrastable</tspan></text><rect x="140.5" y="101" width="118" height="24" rx="4" fill="#ffffff"/><text x="199.5" y="116.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="199.5" dy="0">contraejemplo</tspan></text></svg>
