<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 809 224" width="809" height="224" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Contrato común» … «Decisión contextual»</title><desc id="d">Diagrama de flujo con 8 pasos. «Contrato común» lleva a «Estado y descomposición». «Estado y descomposición» lleva a «Objetos y valores». «Objetos y valores» lleva a «Reglas y resolución». «Reglas y resolución» lleva a «Eventos y flujos». «Eventos y flujos» lleva a «Concurrencia y actores». «Concurrencia y actores» lleva a «Pruebas comunes». «Pruebas comunes» lleva a «Decisión contextual». «Decisión contextual» lleva a «Contrato común» (cambio de regla).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="809" height="224" fill="#ffffff"/><path d="M172,52.5 L222.5,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M372.5,52.5 L444.5,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M551.5,52.5 L645.5,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M703,83 L703,149.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M619,171.5 L573,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M423,171.5 L377,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M218,171.5 L154.5,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M97,141 L97,74.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="30.5" width="150" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="97" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="97" dy="0">Contrato común</tspan></text><rect x="222.5" y="22" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="297.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="297.5" dy="0">Estado y</tspan><tspan x="297.5" dy="19.2">descomposición</tspan></text><rect x="444.5" y="22" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="498" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="498" dy="0">Objetos y</tspan><tspan x="498" dy="19.2">valores</tspan></text><rect x="645.5" y="22" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="703" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="703" dy="0">Reglas y</tspan><tspan x="703" dy="19.2">resolución</tspan></text><rect x="619" y="149.5" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="703" y="175.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="703" dy="0">Eventos y flujos</tspan></text><rect x="423" y="141" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="498" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="498" dy="0">Concurrencia y</tspan><tspan x="498" dy="19.2">actores</tspan></text><rect x="218" y="149.5" width="159" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="297.5" y="175.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="297.5" dy="0">Pruebas comunes</tspan></text><rect x="39.5" y="141" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="97" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="97" dy="0">Decisión</tspan><tspan x="97" dy="19.2">contextual</tspan></text><rect x="103" y="86.8" width="86" height="42" rx="4" fill="#ffffff"/><text x="146" y="102.7" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="146" dy="0">cambio de</tspan><tspan x="146" dy="17.92">regla</tspan></text></svg>
