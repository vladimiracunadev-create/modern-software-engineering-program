<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 891 105" width="891" height="105" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «🎯 Necesidad interna» … «📈 Evolución»</title><desc id="d">Diagrama de flujo con 5 pasos. «🎯 Necesidad interna» lleva a «🧠 Capacidad». «🧠 Capacidad» lleva a «🛠️ Golden path». «🛠️ Golden path» lleva a «🔎 Adopción». «🔎 Adopción» lleva a «📈 Evolución».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="891" height="105" fill="#ffffff"/><path d="M153,52.5 L199,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M330,52.5 L376,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M524,52.5 L570,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M692,52.5 L738,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="22" width="131" height="61" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="87.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="87.5" dy="0">🎯 Necesidad</tspan><tspan x="87.5" dy="19.2">interna</tspan></text><rect x="199" y="30.5" width="131" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="264.5" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="264.5" dy="0">🧠 Capacidad</tspan></text><rect x="376" y="30.5" width="148" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="450" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="450" dy="0">🛠️ Golden path</tspan></text><rect x="570" y="30.5" width="122" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="631" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="631" dy="0">🔎 Adopción</tspan></text><rect x="738" y="30.5" width="131" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="803.5" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="803.5" dy="0">📈 Evolución</tspan></text></svg>
