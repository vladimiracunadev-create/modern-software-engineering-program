<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 805 184" width="805" height="184" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Contrafactual y asignación» … «Qué se puede afirmar»</title><desc id="d">Diagrama de flujo con 5 pasos. «Contrafactual y asignación» lleva a «Sesgo de selección». «Sesgo de selección» lleva a «Control de la asignación». «Control de la asignación» lleva a «Regresión a la media». «Regresión a la media» lleva a «Qué se puede afirmar». «Qué se puede afirmar» lleva a «Contrafactual y asignación» (un defecto de diseño).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="805" height="184" fill="#ffffff"/><path d="M164,122 L210,122" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M317,122 L363,122" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M478,122 L524,122" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M648,122 L694,122" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M738.5,82 L738.5,75.0 Q738.5,68 731.5,68.0 L100.0,68.0 Q93,68 93.0,75.0 L93,82" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="82" width="142" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="93" y="107" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="93" dy="0">Contrafactual</tspan><tspan x="93" dy="19.2">y</tspan><tspan x="93" dy="19.2">asignación</tspan></text><rect x="210" y="91.5" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="263.5" y="116.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="263.5" dy="0">Sesgo de</tspan><tspan x="263.5" dy="19.2">selección</tspan></text><rect x="363" y="82" width="115" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="420.5" y="107" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="420.5" dy="0">Control de</tspan><tspan x="420.5" dy="19.2">la</tspan><tspan x="420.5" dy="19.2">asignación</tspan></text><rect x="524" y="91.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="586" y="116.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="586" dy="0">Regresión a</tspan><tspan x="586" dy="19.2">la media</tspan></text><rect x="694" y="82" width="89" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="738.5" y="107" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="738.5" dy="0">Qué se</tspan><tspan x="738.5" dy="19.2">puede</tspan><tspan x="738.5" dy="19.2">afirmar</tspan></text><rect x="356.8" y="22" width="118" height="42" rx="4" fill="#ffffff"/><text x="415.8" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="415.8" dy="0">un defecto de</tspan><tspan x="415.8" dy="17.92">diseño</tspan></text></svg>
