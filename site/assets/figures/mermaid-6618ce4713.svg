<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 423 686" width="423" height="686" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Afirmación principal en un contexto» … «Enlace sospechoso»</title><desc id="d">Diagrama de flujo con 9 pasos. «Afirmación principal en un contexto» lleva a «Estrategia: por peligros». «Estrategia: por peligros» lleva a «Subafirmación 1». «Estrategia: por peligros» lleva a «Subafirmación 2». «Subafirmación 1» lleva a «Evidencia con versión». «Subafirmación 2» lleva a «Evidencia con versión». «Afirmación principal en un contexto» lleva a «Supuestos y contexto». «Evidencia con versión» lleva a «Requisito» (resumen del texto). «Requisito» lleva a «Enlace sospechoso» (cambia).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="423" height="686" fill="#ffffff"/><path d="M250.3,102 L250.3,122.0 Q250.3,131 241.3,131.0 L171.6,131.0 Q162.6,131 162.6,140.0 L162.6,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M162.6,221 L162.6,241.0 Q162.6,250 153.6,250.0 L110.5,250.0 Q101.5,250 101.5,259.0 L101.5,279" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M162.6,221 L162.6,241.0 Q162.6,250 171.6,250.0 L285.5,250.0 Q294.5,250 294.5,259.0 L294.5,279" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M101.5,323 L101.5,343.0 Q101.5,352 110.5,352.0 L127.1,352.0 Q136.1,352 136.1,361.0 L136.1,381" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M294.5,323 L294.5,343.2 Q294.5,352 303.3,352.0 L303.3,352.0 