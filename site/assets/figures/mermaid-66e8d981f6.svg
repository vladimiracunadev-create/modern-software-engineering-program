<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 648 708" width="648" height="708" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Prueba» … «Costo de preparación»</title><desc id="d">Diagrama de flujo con 10 pasos. «Prueba» lleva a «¿Qué estado necesita?». «¿Qué estado necesita?» lleva a «Fixture compartido». «¿Qué estado necesita?» lleva a «Base nueva por prueba». «¿Qué estado necesita?» lleva a «Transacción con retroceso». «Fixture compartido» lleva a «Dependencia del orden». «Base nueva por prueba» lleva a «Costo de preparación». «Transacción con retroceso» lleva a «Costo de preparación». «Prueba» lleva a «Fuentes de no determinismo». «Fuentes de no determinismo» lleva a «Inyectar, fijar o ordenar». «Inyectar, fijar o ordenar» lleva a «Resultado reproducible». «Dependencia del orden» lleva a «Base nueva por prueba» (aislar).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="648" height="708" fill="#ffffff"/><path d="M370.2,66 L370.2,86.0 Q370.2,95 361.2,95.0 L278.7,95.0 Q269.7,95 269.7,104.0 L269.7,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M269.7,210 L269.7,234.2 Q269.7,243.2 260.7,243.2 L139.5,243.2 Q130.5,243.2 130.5,252.2 L130.5,276.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M173.7,167 L33.0,167.0 Q24,167 24.0,176.0 L24.0,527.5 Q24,536.5 33.0,536.5 L116.4,536.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M269.7,210 L269.7,230.0 Q269.7,239 278.7,239.0 L327.5,239.0 Q336.5,239 336.5,248.0 L336.5,268" fill="none" stroke