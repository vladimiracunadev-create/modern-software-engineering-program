><tspan x="542.8" dy="0">Resultado</tspan><tspan x="542.8" dy="19.2">reproducible</tspan></text><rect x="197.4" y="473" width="61" height="24" rx="4" fill="#ffffff"/><text x="227.9" y="488.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="227.9" dy="0">aislar</tspan></text></svg>
