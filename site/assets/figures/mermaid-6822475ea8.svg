<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 605 319" width="605" height="319" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Migración propuesta» … «Ejecución con respaldo verificado y punto de no retorno»</title><desc id="d">Diagrama de flujo con 6 pasos. «Migración propuesta» lleva a «Analizador de texto: defectos de forma». «Analizador de texto: defectos de forma» lleva a «Ensayo en copia con invariantes: defectos de sentido». «Ensayo en copia con invariantes: defectos de sentido» lleva a «Plan de cortes: qué estado queda si se interrumpe». «Plan de cortes: qué estado queda si se interrumpe» lleva a «Corrección en fases compatibles». «Corrección en fases compatibles» lleva a «Ejecución con respaldo verificado y punto de no retorno». «Ejecución con respaldo verificado y punto de no retorno» lleva a «Migración propuesta» (hallazgo nuevo).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="605" height="319" fill="#ffffff"/><path d="M146.5,71.5 L210,71.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M369,71.5 L415,71.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M499,121 L499,198" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M415,238 L360.5,238" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M218.5,238 L164,238" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M93,179 L93,102" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="39.5" y="41" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="93" y="66.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="93" dy="0">Migración</tspan><tspan x="93" dy="19.2">propuesta</tspan></text><rect x="210" y="31.5" width="159" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="289.5" y="56.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="289.5" dy="0">Analizador de</tspan><tspan x="289.5" dy="19.2">texto: defectos</tspan><tspan x="289.5" dy="19.2">de forma</tspan></text><rect x="415" y="22" width="168" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="499" y="46.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="499" dy="0">Ensayo en copia</tspan><tspan x="499" dy="19.2">con invariantes:</tspan><tspan x="499" dy="19.2">defectos de</tspan><tspan x="499" dy="19.2">sentido</tspan></text><rect x="415" y="198" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="499" y="223" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="499" dy="0">Plan de cortes:</tspan><tspan x="499" dy="19.2">qué estado queda</tspan><tspan x="499" dy="19.2">si se interrumpe</tspan></text><rect x="218.5" y="198" width="142" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="289.5" y="223" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="289.5" dy="0">Corrección en</tspan><tspan x="289.5" dy="19.2">fases</tspan><tspan x="289.5" dy="19.2">compatibles</tspan></text><rect x="22" y="179" width="142" height="118" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="93" y="203.8" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="93" dy="0">Ejecución con</tspan><tspan x="93" dy="19.2">respaldo</tspan><tspan x="93" dy="19.2">verificado y</tspan><tspan x="93" dy="19.2">punto de no</tspan><tspan x="93" dy="19.2">retorno</tspan></text><rect x="99" y="128.5" width="126" height="24" rx="4" fill="#ffffff"/><text x="162" y="144.4" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="162" dy="0">hallazgo nuevo</tspan></text></svg>
