<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 499 667" width="499" height="667" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Consumo del presupuesto» y «Alertas relacionadas» … «Acción en el runbook» y «Fatiga: se ignora la siguiente»</title><desc id="d">Diagrama de flujo con 11 pasos. «Consumo del presupuesto» lleva a «Tasa de consumo». «Tasa de consumo» lleva a «Ventana larga». «Tasa de consumo» lleva a «Ventana corta». «Ventana larga» lleva a «Ambas superan». «Ventana corta» lleva a «Ambas superan». «Ambas superan» lleva a «Página» (sí). «Ambas superan» lleva a «Ticket» (solo lenta). «Alertas relacionadas» lleva a «Agrupación e inhibición». «Agrupación e inhibición» lleva a «Página». «Página» lleva a «Acción en el runbook». «Página» lleva a «Fatiga: se ignora la siguiente» (sin acción).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="499" height="667" fill="#ffffff"/><path d="M162.1,83 L162.1,149.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M162.1,193.5 L162.1,217.8 Q162.1,226.8 153.1,226.8 L102.0,226.8 Q93,226.8 93.0,235.8 L93,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M162.1,193.5 L162.1,217.8 Q162.1,226.8 171.1,226.8 L260.0,226.8 Q269,226.8 269.0,235.8 L269,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M93,304 L93.0,324.0 Q93,333 102.0,333.0 L193.3,333.0 Q202.3,333 202.3,342.0 L202.3,362" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M269,304 L269.0,324.0 Q269,333 260.0,333