<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 570 243" width="570" height="243" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Contrato de bootstrap» … «Limpieza / recuperación»</title><desc id="d">Diagrama de flujo con 5 pasos. «Contrato de bootstrap» lleva a «Configuración versionada mínima». «Configuración versionada mínima» lleva a «Diagnóstico incorporado». «Diagnóstico incorporado» lleva a «Rebuild / prueba cruzada». «Rebuild / prueba cruzada» lleva a «Limpieza / recuperación». «Limpieza / recuperación» lleva a «Contrato de bootstrap» (fallo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="570" height="243" fill="#ffffff"/><path d="M146,62 L192,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M334,62 L402,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M464,92.5 L464,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M380,190.5 L329.5,190.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M196.5,190.5 L93.0,190.5 Q84,190.5 84.0,181.5 L84,92.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="31.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="84" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="84" dy="0">Contrato de</tspan><tspan x="84" dy="19.2">bootstrap</tspan></text><rect x="192" y="22" width="142" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="263" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="263" dy="0">Configuración</tspan><tspan x="263" dy="19.2">versionada</tspan><tspan x="263" dy="19.2">mínima</tspan></text><rect x="402" y="31.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="464" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="464" dy="0">Diagnóstico</tspan><tspan x="464" dy="19.2">incorporado</tspan></text><rect x="380" y="160" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="464" y="185.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="464" dy="0">Rebuild / prueba</tspan><tspan x="464" dy="19.2">cruzada</tspan></text><rect x="196.5" y="160" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="263" y="185.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="263" dy="0">Limpieza /</tspan><tspan x="263" dy="19.2">recuperación</tspan></text><rect x="66" y="162.5" width="126" height="24" rx="4" fill="#ffffff"/><text x="129" y="178.4" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="129" dy="0">fallo o cambio</tspan></text></svg>
