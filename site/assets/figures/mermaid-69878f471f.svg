<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 787 88" width="787" height="88" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «🎯 Tarea» … «📈 Operación»</title><desc id="d">Diagrama de flujo con 5 pasos. «🎯 Tarea» lleva a «🧠 Datos». «🧠 Datos» lleva a «🛠️ Modelo». «🛠️ Modelo» lleva a «🔎 Guardrail». «🔎 Guardrail» lleva a «📈 Operación».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="787" height="88" fill="#ffffff"/><path d="M118,44 L164,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M260,44 L306,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M411,44 L457,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M588,44 L634,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="22" width="96" height="44" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="70" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="70" dy="0">🎯 Tarea</tspan></text><rect x="164" y="22" width="96" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="212" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="212" dy="0">🧠 Datos</tspan></text><rect x="306" y="22" width="105" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="358.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="358.5" dy="0">🛠️ Modelo</tspan></text><rect x="457" y="22" width="131" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="522.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="522.5" dy="0">🔎 Guardrail</tspan></text><rect x="634" y="22" width="131" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="699.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="699.5" dy="0">📈 Operación</tspan></text></svg>
