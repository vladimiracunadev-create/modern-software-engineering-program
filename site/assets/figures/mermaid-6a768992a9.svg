<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 484 683" width="484" height="683" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Desglose en tareas» … «Comunicación con supuestos»</title><desc id="d">Diagrama de flujo con 7 pasos. «Desglose en tareas» lleva a «Estimación típica por tarea». «Estimación típica por tarea» lleva a «Dispersión y cola larga». «Dispersión y cola larga» lleva a «Distribución del total». «Historia de rendimiento» lleva a «Distribución del total». «Distribución del total» lleva a «Rango con percentiles». «Rango con percentiles» lleva a «Comunicación con supuestos». «Comunicación con supuestos» lleva a «Historia de rendimiento» (nueva evidencia).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="484" height="683" fill="#ffffff"/><path d="M134,66 L134,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M134,185 L134.0,205.0 Q134,214 125.0,214.0 L119.0,214.0 Q110,214 110.0,223.0 L110,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M110,304 L110.0,324.0 Q110,333 119.0,333.0 L212.4,333.0 Q221.4,333 221.4,342.0 L221.4,362" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M294,304 L294.0,324.0 Q294,333 285.0,333.0 L230.4,333.0 Q221.4,333 221.4,342.0 L221.4,362" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M221.4,423 L221.4,445.8 Q221.4,452 227.7,452.0 L227.7,452.0 Q233.9,452 233.9,458.2 L233.9,481" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M237.5,542 L237.5,600" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M325,630.5 L361.0,630.5 Q370,630.5 370.0,621.5 L370.0,280.5 Q370,273.5 363.0,273.5 L356,273.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="41.5" y="22" width="185" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="134" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="134" dy="0">Desglose en tareas</tspan></text><rect x="46" y="124" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="134" y="149.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="134" dy="0">Estimación típica</tspan><tspan x="134" dy="19.2">por tarea</tspan></text><rect x="22" y="243" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="110" y="268.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">Dispersión y cola</tspan><tspan x="110" dy="19.2">larga</tspan></text><rect x="137.4" y="362" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="221.4" y="387.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="221.4" dy="0">Distribución del</tspan><tspan x="221.4" dy="19.2">total</tspan></text><rect x="232" y="243" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="294" y="268.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="294" dy="0">Historia de</tspan><tspan x="294" dy="19.2">rendimiento</tspan></text><rect x="171.9" y="481" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="233.9" y="506.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="233.9" dy="0">Rango con</tspan><tspan x="233.9" dy="19.2">percentiles</tspan></text><rect x="157" y="600" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="241" y="625.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="241" dy="0">Comunicación con</tspan><tspan x="241" dy="19.2">supuestos</tspan></text><rect x="376" y="431" width="86" height="42" rx="4" fill="#ffffff"/><text x="419" y="446.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="419" dy="0">nueva</tspan><tspan x="419" dy="17.92">evidencia</tspan></text></svg>
