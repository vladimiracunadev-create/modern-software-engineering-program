<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 831 185" width="831" height="185" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Evento, productor / manejador» … «Cancelación / ciclo de vida»</title><desc id="d">Diagrama de flujo con 5 pasos. «Evento, productor / manejador» lleva a «Bucle de eventos / cola». «Bucle de eventos / cola» lleva a «Callbacks, promesas / corrutinas». «Callbacks, promesas / corrutinas» lleva a «Orden, duplicados e idempotencia». «Orden, duplicados e idempotencia» lleva a «Cancelación / ciclo de vida». «Cancelación / ciclo de vida» lleva a «Evento, productor / manejador» (fallo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="831" height="185" fill="#ffffff"/><path d="M146,113.5 L192,113.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M299,113.5 L345,113.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M460,113.5 L506,113.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M639,113.5 L685,113.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M747,73.5 L747.0,59.0 Q747,50 738.0,50.0 L93.0,50.0 Q84,50 84.0,59.0 L84,73.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="73.5" width="124" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="84" y="98.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="84" dy="0">Evento,</tspan><tspan x="84" dy="19.2">productor /</tspan><tspan x="84" dy="19.2">manejador</tspan></text><rect x="192" y="73.5" width="107" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="245.5" y="98.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="245.5" dy="0">Bucle de</tspan><tspan x="245.5" dy="19.2">eventos /</tspan><tspan x="245.5" dy="19.2">cola</tspan></text><rect x="345" y="73.5" width="115" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="402.5" y="98.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="402.5" dy="0">Callbacks,</tspan><tspan x="402.5" dy="19.2">promesas /</tspan><tspan x="402.5" dy="19.2">corrutinas</tspan></text><rect x="506" y="64" width="133" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="572.5" y="88.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="572.5" dy="0">Orden,</tspan><tspan x="572.5" dy="19.2">duplicados</tspan><tspan x="572.5" dy="19.2">e</tspan><tspan x="572.5" dy="19.2">idempotencia</tspan></text><rect x="685" y="73.5" width="124" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="747" y="98.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="747" dy="0">Cancelación</tspan><tspan x="747" dy="19.2">/ ciclo de</tspan><tspan x="747" dy="19.2">vida</tspan></text><rect x="352.5" y="22" width="126" height="24" rx="4" fill="#ffffff"/><text x="415.5" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="415.5" dy="0">fallo o cambio</tspan></text></svg>
