<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 566" width="810" height="566" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Alerta» … «Responsable»</title><desc id="d">Diagrama de flujo con 10 pasos. «Alerta» lleva a «Runbook». «Runbook» lleva a «Diagnóstico». «Runbook» lleva a «Mitigación y reversión». «Runbook» lleva a «Verificación». «Alerta» lleva a «Guardia primaria». «Guardia primaria» lleva a «Guardia secundaria» (sin respuesta a tiempo). «Guardia secundaria» lleva a «Responsable» (sin respuesta). «Guardia primaria» lleva a «Carga y descanso». «Runbook» lleva a «Revisión y ejercicio». «Revisión y ejercicio» lleva a «Runbook» (deriva).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="810" height="566" fill="#ffffff"/><path d="M103,283 L119.2,283.0 Q128.2,283 128.2,274.0 L128.2,242.5 Q128.2,233.5 137.2,233.5 L153.5,233.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M242.5,233.5 L309.0,233.5 Q318,233.5 318.0,224.5 L318.0,53.0 Q318,44 327.0,44.0 L393.5,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M242.5,233.5 L306.8,233.5 Q315.8,233.5 315.8,224.5 L315.8,143.5 Q315.8,134.5 324.8,134.5 L389,134.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M242.5,229.2 L389,229.2" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M103,283 L117.0,283.0 Q126,283 126.0,292.0 L126.0,315.0 Q126,324 135.0,324.0 L149,324" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M247,319.