<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 361 904" width="361" height="904" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Modelo de amenazas» … «Revisión independiente»</title><desc id="d">Diagrama de flujo con 9 pasos. «Modelo de amenazas» lleva a «Selección de requisitos». «Selección de requisitos» lleva a «Control y prueba por requisito». «Control y prueba por requisito» lleva a «Evidencia con fecha y huella». «Evidencia con fecha y huella» lleva a «Validador del paquete». «Validador del paquete» lleva a «Ejecución en dos sistemas». «Ejecución en dos sistemas» lleva a «Huella canónica». «Validador del paquete» lleva a «LIMITES.md». «Huella canónica» lleva a «Revisión independiente». «LIMITES.md» lleva a «Revisión independiente».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="361" height="904" fill="#ffffff"/><path d="M241.8,66 L241.8,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M238.4,185 L238.4,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M234.9,304 L234.9,327.3 Q234.9,333 229.2,333.0 L229.2,333.0 Q223.5,333 223.5,338.7 L223.5,362" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M223.5,423 L223.5,443.4 Q223.5,452 214.8,452.0 L214.8,452.0 Q206.2,452 206.2,460.6 L206.2,481" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M206.2,542 L206.2,562.0 Q206.2,571 197.2,571.0 L115.0,571.0 Q106,571 106.0,580.0 L106,600" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/