<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 681 946" width="681" height="946" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Versión nueva desplegada sin tráfico» … «Reparación manual o compensación»</title><desc id="d">Diagrama de flujo con 8 pasos. «Versión nueva desplegada sin tráfico» lleva a «Canary: fracción pequeña del tráfico». «Canary: fracción pequeña del tráfico» lleva a «Métricas del canario frente a la línea base». «Métricas del canario frente a la línea base» lleva a «Retroceso: dirigir el tráfico a la versión anterior» (peor con evidencia). «Métricas del canario frente a la línea base» lleva a «Esperar y ampliar la fracción» (sin evidencia suficiente). «Esperar y ampliar la fracción» lleva a «Métricas del canario frente a la línea base». «Métricas del canario frente a la línea base» lleva a «Promover a 100 %» (mejor o igual tras la ventana). «Retroceso: dirigir el tráfico a la versión anterior» lleva a «¿Los datos escritos son legibles por la anterior?». «¿Los datos escritos son legibles por la anterior?» lleva a «Reparación manual o compensación» (no).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="681" height="946" fill="#ffffff"/><path d="M366,102 L366,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M366,240 L366.0,260.0 Q366,269 357.0,269.0 L348.8,269.0 Q339.8,269 339.8,278.0 L339.8,298" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M339.8,418 L339.8,426.0 Q339.8,434 331.8,434.0 L123.5,434.0 Q114.5,434 114.5,443.0 L114.5,512" fill="none" stroke="