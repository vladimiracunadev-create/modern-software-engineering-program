<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 925 88" width="925" height="88" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «🎯 Comunidad» … «📈 Sostenibilidad»</title><desc id="d">Diagrama de flujo con 5 pasos. «🎯 Comunidad» lleva a «🧠 Contribución». «🧠 Contribución» lleva a «🛠️ Revisión». «🛠️ Revisión» lleva a «🔎 Release». «🔎 Release» lleva a «📈 Sostenibilidad».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="925" height="88" fill="#ffffff"/><path d="M153,44 L199,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M356,44 L402,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M524,44 L570,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M683,44 L729,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="22" width="131" height="44" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="87.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="87.5" dy="0">🎯 Comunidad</tspan></text><rect x="199" y="22" width="157" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="277.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="277.5" dy="0">🧠 Contribución</tspan></text><rect x="402" y="22" width="122" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="463" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="463" dy="0">🛠️ Revisión</tspan></text><rect x="570" y="22" width="113" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="626.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="626.5" dy="0">🔎 Release</tspan></text><rect x="729" y="22" width="174" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="816" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="816" dy="0">📈 Sostenibilidad</tspan></text></svg>
