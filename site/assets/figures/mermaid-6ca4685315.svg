<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 655 602" width="655" height="602" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Escenario que fuerza la separacion» … «Compensaciones y observabilidad»</title><desc id="d">Diagrama de flujo con 7 pasos. «Escenario que fuerza la separacion» lleva a «Frontera necesaria». «Frontera necesaria» lleva a «Modulos con reglas» (Solo orden interno). «Frontera necesaria» lleva a «Servicios» (Despliegue independiente). «Modulos con reglas» lleva a «Comprobador de fronteras». «Servicios» lleva a «Coste de red y consistencia». «Coste de red y consistencia» lleva a «Compensaciones y observabilidad». «Comprobador de fronteras» lleva a «Modulos con reglas» (violaciones). «Compensaciones y observabilidad» lleva a «Frontera necesaria» (el escenario no se cumple).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="655" height="602" fill="#ffffff"/><path d="M326.5,102 L326.5,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M326.5,222 L326.5,230.0 Q326.5,238 318.5,238.0 L245.5,238.0 Q236.5,238 236.5,247.0 L236.5,298" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M326.5,222 L326.5,230.0 Q326.5,238 334.5,238.0 L407.5,238.0 Q416.5,238 416.5,247.0 L416.5,298" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M235.6,342 L235.6,400" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M417.6,342 L417.6,400" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M418.5,461 L418.5,519" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M159.7,430.5 L139.0,430.5 Q130,430.5 130.0,421.5 L130.0,327.0 Q130,320 137.0,320.0 L144,320" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><path d="M502.4,549.5 L509.4,549.5 Q516.4,549.5 516.4,542.5 L516.4,200.0 Q516.4,191 507.4,191.0 L447.5,191" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="255.5" y="22" width="142" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="326.5" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="326.5" dy="0">Escenario que</tspan><tspan x="326.5" dy="19.2">fuerza la</tspan><tspan x="326.5" dy="19.2">separacion</tspan></text><polygon points="326.5,160 447.5,191 326.5,222 205.5,191" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="326.5" y="195.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="326.5" dy="0">Frontera necesaria</tspan></text><rect x="144" y="298" width="185" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="236.5" y="324.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="236.5" dy="0">Modulos con reglas</tspan></text><rect x="363" y="298" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="416.5" y="324.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="416.5" dy="0">Servicios</tspan></text><rect x="159.7" y="400" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="234.7" y="425.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="234.7" dy="0">Comprobador de</tspan><tspan x="234.7" dy="19.2">fronteras</tspan></text><rect x="343.7" y="400" width="150" height="61" rx="10" fill="#dff1ee" stroke="#