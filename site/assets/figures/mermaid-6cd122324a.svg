y="781.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="261.6" dy="0">no quedan</tspan></text><rect x="447.2" y="294.2" width="29" height="24" rx="4" fill="#ffffff"/><text x="461.7" y="310.1" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="461.7" dy="0">no</tspan></text></svg>
