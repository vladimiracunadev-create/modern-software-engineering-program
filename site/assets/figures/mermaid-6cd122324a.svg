<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 499 882" width="499" height="882" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Recogida con finalidad» … «Evidencia del borrado»</title><desc id="d">Diagrama de flujo con 8 pasos. «Recogida con finalidad» lleva a «Uso y almacenamiento». «Uso y almacenamiento» lleva a «Copias: réplicas, cachés, respaldos, registros». «Uso y almacenamiento» lleva a «Retención con plazo». «Retención con plazo» lleva a «¿Venció el plazo o hay solicitud?». «¿Venció el plazo o hay solicitud?» lleva a «Borrado o anonimización» (sí). «Borrado o anonimización» lleva a «Comprobar restos: archivo, copias, índices». «Comprobar restos: archivo, copias, índices» lleva a «Borrado o anonimización» (quedan). «Comprobar restos: archivo, copias, índices» lleva a «Evidencia del borrado» (no quedan). «¿Venció el plazo o hay solicitud?» lleva a «Uso y almacenamiento» (no).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="499" height="882" fill="#ffffff"/><path d="M204.4,83 L204.4,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M204.4,202 L204.4,222.0 Q204.4,231 195.4,231.0 L123.5,231.0 Q114.5,231 114.5,240.0 L114.5,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M204.4,202 L204.4,226.8 Q204.4,235.8 213.4,235.8 L303.0,235.8 Q312,235.8 312.0,244.8 L312,269.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M312,330.5 L312.0,355.2 Q312,364.2 303.0,364.2 L284.7,364.2 Q275.7,364.2 275.7,373.2 L275.7,398" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M275.7,484 L275.7,492.0 Q275.7,500 267.7,500.0 L253.2,500.0 Q244.2,500 244.2,509.0 L244.2,542" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M244.2,603 L244.2,623.0 Q244.2,632 235.2,632.0 L232.1,632.0 Q223.1,632 223.1,641.0 L223.1,661" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M223.1,741 L223.1,751.8 Q223.1,757 217.8,757.0 L217.8,757.0 Q212.6,757 212.6,762.2 L212.6,799" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M311.1,701 L320.2,701.0 Q329.2,701 329.2,692.0 L329.2,579.5 Q329.2,572.5 322.2,572.5 L315.2,572.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><path d="M427.2,441 L434.2,441.0 Q441.2,441 441.2,434.0 L441.2,180.5 Q441.2,171.5 432.2,171.5 L279.4,171.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="137.9" y="22" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="204.4" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="204.4" dy="0">Recogida con</tspan><tspan x="204.4" dy="19.2">finalidad</tspan></text><rect x="129.4" y="141" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="204.4" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="204.4" dy="0">Uso y</tspan><tspan x="204.4" dy="19.2">almacenamiento</tspan></text><rect x="22" y="260" width="185" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="114.5" y="285" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="114.5" dy="0">Copias: réplicas,</tspan><tspan x="114.5" dy="19.2">cachés, respaldos,</tspan><tspan x="114.5" dy="19.2">registros</tspan></text><rect x="241" y="269.5" width="142" height="61" rx