<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 769 362" width="769" height="362" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Sujeto: rol y atributos», «Recurso: dueño, curso, estado», «Acción» y «Entorno: plazo, horario, revocación» … «Política corregida»</title><desc id="d">Diagrama de flujo con 8 pasos. «Sujeto: rol y atributos» lleva a «Decisión: permitir o denegar». «Recurso: dueño, curso, estado» lleva a «Decisión: permitir o denegar». «Acción» lleva a «Decisión: permitir o denegar». «Entorno: plazo, horario, revocación» lleva a «Decisión: permitir o denegar». «Decisión: permitir o denegar» lleva a «Registro de la decisión». «Decisión: permitir o denegar» lleva a «Pruebas: matriz de casos negativos». «Pruebas: matriz de casos negativos» lleva a «Política corregida» (defecto).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="769" height="362" fill="#ffffff"/><path d="M172.5,52.5 L190.8,52.5 Q199.8,52.5 199.8,61.5 L199.8,167.0 Q199.8,176 208.8,176.0 L227,176" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M181,137.5 L195.0,137.5 Q204,137.5 204.0,146.5 L204.0,167.0 Q204,176 213.0,176.0 L227,176" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M142,214 L175.5,214.0 Q184.5,214 184.5,205.0 L184.5,185.0 Q184.5,176 193.5,176.0 L227,176" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M181,300 L195.0,300.0 Q204,300 204.0,291.0 L204.0,185.0 Q204,176 213.0,176.0 L227,176" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/