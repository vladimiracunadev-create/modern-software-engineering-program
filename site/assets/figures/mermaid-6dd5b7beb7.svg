<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 599 769" width="599" height="769" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Escenarios y modelo de SE-347» … «Reabrir con la evidencia» y «La decisión se mantiene»</title><desc id="d">Diagrama de flujo con 11 pasos. «Escenarios y modelo de SE-347» lleva a «ADR: decisión y alternativas». «ADR: decisión y alternativas» lleva a «Consecuencias negativas y reversibilidad». «ADR: decisión y alternativas» lleva a «Supuestos de vigilancia con medida». «Supuestos de vigilancia con medida» lleva a «Disparador numérico de revisión». «ADR: decisión y alternativas» lleva a «Función de aptitud en CI». «Función de aptitud en CI» lleva a «¿Se viola la restricción?». «¿Se viola la restricción?» lleva a «La integración falla» (sí). «¿Se viola la restricción?» lleva a «La decisión se mantiene» (no). «Disparador numérico de revisión» lleva a «¿Se cumple el disparador?». «¿Se cumple el disparador?» lleva a «Reabrir con la evidencia» (sí). «¿Se cumple el disparador?» lleva a «La decisión se mantiene» (no).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="599" height="769" fill="#ffffff"/><path d="M279.3,83 L279.3,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M279.3,202 L279.3,222.0 Q279.3,231 270.3,231.0 L107.8,231.0 Q98.8,231 98.8,240.0 L98.8,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M281.1,202 L281.1,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M282.8,340 L282.8,361.5 Q282.8,370.5 273.