<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 714 212" width="714" height="212" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Adjetivo» … «Verificación»</title><desc id="d">Diagrama de flujo con 5 pasos. «Adjetivo» lleva a «Escenario de calidad». «Escenario de calidad» lleva a «Medida y ventana». «Medida y ventana» lleva a «Verificación». «Escenario de calidad» lleva a «Restricción». «Verificación» lleva a «Escenario de calidad» (choque).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="714" height="212" fill="#ffffff"/><path d="M120,127 L166,127" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M299,127 L313.0,127.0 Q322,127 322.0,118.0 L322.0,95.0 Q322,86 331.0,86.0 L345,86" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M513,86 L559,86" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M299,127 L324.0,127.0 Q333,127 333.0,136.0 L333.0,159.0 Q333,168 342.0,168.0 L367,168" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M625.5,64 L625.5,57.0 Q625.5,50 618.5,50.0 L241.5,50.0 Q232.5,50 232.5,59.0 L232.5,96.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="105" width="98" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="71" y="131.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="71" dy="0">Adjetivo</tspan></text><rect x="166" y="96.5" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="232.5" y="121.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="232.5" dy="0">Escenario de</tspan><tspan x="232.5" dy="19.2">calidad</tspan></text><rect x="345" y="64" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="429" y="90.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="429" dy="0">Medida y ventana</tspan></text><rect x="559" y="64" width="133" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="625.5" y="90.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="625.5" dy="0">Verificación</tspan></text><rect x="367" y="146" width="124" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="429" y="172.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="429" dy="0">Restricción</tspan></text><rect x="398.5" y="22" width="61" height="24" rx="4" fill="#ffffff"/><text x="429" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="429" dy="0">choque</tspan></text></svg>
