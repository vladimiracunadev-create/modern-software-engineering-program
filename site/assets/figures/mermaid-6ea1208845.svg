<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 748 362" width="748" height="362" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Fuerzas de calidad» … «Proyecto: ADR defendido»</title><desc id="d">Diagrama de flujo con 12 pasos. «Fuerzas de calidad» lleva a «Microkernel». «Microkernel» lleva a «Pipes and filters». «Pipes and filters» lleva a «Microservicios». «Microservicios» lleva a «BFF, gateway y malla». «BFF, gateway y malla» lleva a «Multi-tenancy». «Multi-tenancy» lleva a «Data mesh». «Data mesh» lleva a «Celdas». «Celdas» lleva a «12-factor». «12-factor» lleva a «Migración entre estilos». «Migración entre estilos» lleva a «Taller: escenarios y sensibilidad». «Taller: escenarios y sensibilidad» lleva a «Proyecto: ADR defendido». «Proyecto: ADR defendido» lleva a «Fuerzas de calidad» (disparador cumplido).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="748" height="362" fill="#ffffff"/><path d="M137,52.5 L200.5,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M324.5,52.5 L405.5,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M512.5,52.5 L576,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M651,74.5 L651,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M576,171.5 L530,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M388,171.5 L316,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M209,171.5 L120,171.5"