<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 402 915" width="402" height="915" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Equipo de producto: necesita un servicio» … «Equipo de plataforma: mejora el camino»</title><desc id="d">Diagrama de flujo con 9 pasos. «Equipo de producto: necesita un servicio» lleva a «¿Camino dorado?». «¿Camino dorado?» lleva a «Plantilla con guardas incorporadas» (sí). «¿Camino dorado?» lleva a «Pasos manuales propios» (no). «Plantilla con guardas incorporadas» lleva a «Verificador de políticas». «Pasos manuales propios» lleva a «Verificador de políticas». «Verificador de políticas» lleva a «Despliegue» (cumple). «Verificador de políticas» lleva a «Corrección o excepción registrada» (no cumple). «Despliegue» lleva a «Medidas: pasos, errores, tiempo, adopción». «Medidas: pasos, errores, tiempo, adopción» lleva a «Equipo de plataforma: mejora el camino». «Equipo de plataforma: mejora el camino» lleva a «Plantilla con guardas incorporadas». «Corrección o excepción registrada» lleva a «Equipo de plataforma: mejora el camino».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="402" height="915" fill="#ffffff"/><path d="M218.4,102 L218.4,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M218.4,222 L218.4,230.0 Q218.4,238 210.4,238.0 L133.1,238.0 Q124.1,238 124.1,247.0 L124.1,280" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M218.4,222 L218.4,230.0 Q218.4,238 226.4,238.0 L295.1,238.0 Q304.1,238 304.1,247.0 L304.1,289.5" fill="none" stroke="#32505f" 