<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 848 181" width="848" height="181" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Requisitos con origen» … «Línea base»</title><desc id="d">Diagrama de flujo con 5 pasos. «Requisitos con origen» lleva a «Especificación». «Especificación» lleva a «Validador». «Validador» lleva a «Revisión humana». «Revisión humana» lleva a «Línea base». «Validador» lleva a «Especificación» (defecto). «Revisión humana» lleva a «Especificación» (defecto o duda).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="848" height="181" fill="#ffffff"/><path d="M172,86 L218,86" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M368,86 L414,86" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M521,86 L567,86" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M665,86 L711,86" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M467.5,64 L467.5,57.0 Q467.5,50 460.5,50.0 L300.0,50.0 Q293,50 293.0,57.0 L293,64" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><path d="M616,116.5 L616.0,123.5 Q616,130.5 609.0,130.5 L302.0,130.5 Q293,130.5 293.0,121.5 L293,108" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="55.5" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="97" y="80.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="97" dy="0">Requisitos con</tspan><tspan x="97" dy="19.2">origen</tspan></text><rect x="218" y="64" width="150" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="293" y="90.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="293" dy="0">Especificación</tspan></text><rect x="414" y="64" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="467.5" y="90.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="467.5" dy="0">Validador</tspan></text><rect x="567" y="55.5" width="98" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="616" y="80.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="616" dy="0">Revisión</tspan><tspan x="616" dy="19.2">humana</tspan></text><rect x="711" y="64" width="115" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="768.5" y="90.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="768.5" dy="0">Línea base</tspan></text><rect x="345.8" y="22" width="69" height="24" rx="4" fill="#ffffff"/><text x="380.3" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="380.3" dy="0">defecto</tspan></text><rect x="391.5" y="134.5" width="126" height="24" rx="4" fill="#ffffff"/><text x="454.5" y="150.4" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="454.5" dy="0">defecto o duda</tspan></text></svg>
