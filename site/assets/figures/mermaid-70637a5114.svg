<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 839 88" width="839" height="88" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «🎯 Carga» … «📈 Restauración»</title><desc id="d">Diagrama de flujo con 5 pasos. «🎯 Carga» lleva a «🧠 Capacidad». «🧠 Capacidad» lleva a «🛠️ Cambio». «🛠️ Cambio» lleva a «🔎 Respaldo». «🔎 Respaldo» lleva a «📈 Restauración».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="839" height="88" fill="#ffffff"/><path d="M118,44 L164,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M295,44 L341,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M446,44 L492,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M614,44 L660,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="22" width="96" height="44" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="70" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="70" dy="0">🎯 Carga</tspan></text><rect x="164" y="22" width="131" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="229.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="229.5" dy="0">🧠 Capacidad</tspan></text><rect x="341" y="22" width="105" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="393.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="393.5" dy="0">🛠️ Cambio</tspan></text><rect x="4