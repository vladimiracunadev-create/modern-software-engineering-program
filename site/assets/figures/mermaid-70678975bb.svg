<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 565 786" width="565" height="786" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Regla del equipo» … «Medir aciertos, falsas alarmas y omisiones»</title><desc id="d">Diagrama de flujo con 8 pasos. «Regla del equipo» lleva a «¿Se puede comprobar con un programa?». «¿Se puede comprobar con un programa?» lleva a «Prosa y revisión humana» (no). «¿Se puede comprobar con un programa?» lleva a «¿Hay que impedirla al escribir?» (sí). «¿Hay que impedirla al escribir?» lleva a «Hook previo a la escritura» (sí). «¿Hay que impedirla al escribir?» lleva a «Compuerta de integración» (no). «Hook previo a la escritura» lleva a «Casos de prueba de la regla». «Compuerta de integración» lleva a «Casos de prueba de la regla». «Casos de prueba de la regla» lleva a «Medir aciertos, falsas alarmas y omisiones». «Medir aciertos, falsas alarmas y omisiones» lleva a «Regla del equipo».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="565" height="786" fill="#ffffff"/><path d="M237.5,66 L237.5,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M237.5,244 L237.5,252.0 Q237.5,260 229.5,260.0 L131.0,260.0 Q122,260 122.0,269.0 L122,314.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M237.5,244 L237.5,252.0 Q237.5,260 245.5,260.0 L382.5,260.0 Q391.5,260 391.5,269.0 L391.5,302" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M391.5,388 L391.5,396.0 Q391.5,404 383.5,404.0 L264.9,404.0 Q255.9,404 255.9,413.0 L255.9,446" fill=