<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 546 583" width="546" height="583" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Contrato: rutas, estados, errores» … «Respuesta de una persona»</title><desc id="d">Diagrama de flujo con 8 pasos. «Contrato: rutas, estados, errores» lleva a «Implementación». «Implementación» lleva a «Comprobación de conformidad». «Comprobación de conformidad» lleva a «Contrato: rutas, estados, errores» (deriva). «Implementación» lleva a «Inyección de caídas». «Inyección de caídas» lleva a «Invariantes: sin duplicados, sin pérdida». «Implementación» lleva a «Señales y SLO». «Señales y SLO» lleva a «Alertas por consumo». «Alertas por consumo» lleva a «Respuesta de una persona».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="546" height="583" fill="#ffffff"/><path d="M267.2,83 L267.2,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M267.2,185 L267.2,205.0 Q267.2,214 258.2,214.0 L110.5,214.0 Q101.5,214 101.5,223.0 L101.5,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M267.2,185 L267.2,206.8 Q267.2,214 274.4,214.0 L274.4,214.0 Q281.5,214 281.5,221.2 L281.5,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M281.5,304 L281.5,324.0 Q281.5,333 272.5,333.0 L272.5,333.0 Q263.5,333 263.5,342.0 L263.5,362" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M267.2,185 L267.2,209.2 Q267.2,218.2 276.2,218.2 L444.0,218.2 Q453,218.2 453.0,227.2 L453,251.5" fill="none" stroke="#32505f" 