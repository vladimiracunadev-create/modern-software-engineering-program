<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 407 1042" width="407" height="1042" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Petición» … «Estado atascado: intervención»</title><desc id="d">Diagrama de flujo con 10 pasos. «Petición» lleva a «Transacción local». «Transacción local» lleva a «Entrega + outbox» (misma transacción). «Entrega + outbox» lleva a «Relevo: publica y marca». «Relevo: publica y marca» lleva a «Corredor». «Corredor» lleva a «Consumidor: inbox + efecto». «Consumidor: inbox + efecto» lleva a «¿Siguiente paso falla?». «¿Siguiente paso falla?» lleva a «Compensación del paso anterior» (sí). «¿Siguiente paso falla?» lleva a «Saga completa» (no). «Compensación del paso anterior» lleva a «Estado atascado: intervención» (falla).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="407" height="1042" fill="#ffffff"/><path d="M278.5,66 L278.5,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M276.4,168 L276.4,244" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M270.9,298 L270.9,356" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M267.4,417 L267.4,440.6 Q267.4,446 262.0,446.0 L262.0,446.0 Q256.6,446 256.6,451.4 L256.6,475" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M256.6,519 L256.6,539.9 Q256.6,548 248.5,548.0 L248.5,548.0 Q240.3,548 240.3,556.1 L240.3,577" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M240.3,638 L240.3,658.0 Q240.3,667 231.3,667.0 L225.9,667.0 Q216.9,667 216.9,676.0 L216.9,696" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M216.9,782 L216.9,790.0 Q216.9,798 208.9,798.0 L115.0,798.0 Q106,798 106.0,807.0 L106,840" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M216.9,782 L216.9,790.0 Q216.9,798 224.9,798.0 L286.0,798.0 Q295,798 295.0,807.0 L295,848.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M108.7,901 L108.7,959" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="229.5" y="22" width="98" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="278.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="278.5" dy="0">Petición</tspan></text><rect x="190.5" y="124" width="176" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="278.5" y="150.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="278.5" dy="0">Transacción local</tspan></text><path d="M190.3,251 v40 a84,7 0 0 0 168,0 v-40" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><ellipse cx="274.3" cy="251" rx="84" ry="7" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="274.3" y="278.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="274.3" dy="0">Entrega + outbox</tspan></text><rect x="179.4" y="356" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="267.4" y="381.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="267.4" dy="0">Relevo: publica y</tspan><tspan x="267.4" dy="19.2">marca</tspan></text><rect x="207.6" y="475" width="98" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="256.6" y="501.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="256.6" dy="0">Corredor</tspan></text><rect x="152.3" y="577" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="240.3" y="602.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="240.3" dy="0">Consumidor: inbox</tspan><tspan x="240.3" dy="19.2">+ efecto</tspan></text><polygon points="216.9,696 344.4,739 216.9,782 89.4,739" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="216.9" y="733.6" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="216.9" dy="0">¿Siguiente paso</tspan><tspan x="216.9" dy="19.2">falla?</tspan></text><rect x="22" y="840" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="865.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Compensación del</tspan><tspan x="106" dy="19.2">paso anterior</tspan></text><rect x="224" y="848.5" width="142" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="295" y="874.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="295" dy="0">Saga completa</tspan></text><rect x="27.3" y="959" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="111.3" y="984.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="111.3" dy="0">Estado atascado:</tspan><tspan x="111.3" dy="19.2">intervención</tspan></text><rect x="282.4" y="185" width="102" height="42" rx="4" fill="#ffffff"/><text x="333.4" y="200.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="333.4" dy="0">misma</tspan><tspan x="333.4" dy="17.92">transacción</tspan></text><rect x="112" y="807" width="29" height="24" rx="4" fill="#ffffff"/><text x="126.5" y="822.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="126.5" dy="0">sí</tspan></text><rect x="301" y="811.2" width="29" height="24" rx="4" fill="#ffffff"/><text x="315.5" y="827.1" font-size="14" 