<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 788 762" width="788" height="762" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Fallo sin cambios en el código» … «Cuarentena con fecha»</title><desc id="d">Diagrama de flujo con 11 pasos. «Fallo sin cambios en el código» lleva a «Historial de ejecuciones». «Historial de ejecuciones» lleva a «Tasa de fallo y correlaciones». «Tasa de fallo y correlaciones» lleva a «Rota: defecto determinista» (98 % o más). «Tasa de fallo y correlaciones» lleva a «Dependencia del entorno» (se agrupa con carga). «Tasa de fallo y correlaciones» lleva a «Dependencia del orden» (se agrupa tras otra prueba). «Tasa de fallo y correlaciones» lleva a «Azar o carrera» (sin patrón). «Dependencia del entorno» lleva a «Aislar o inyectar». «Dependencia del orden» lleva a «Aislar o inyectar». «Azar o carrera» lleva a «Enumerar intercalaciones o fijar semilla». «Rota: defecto determinista» lleva a «Corregir ya». «Aislar o inyectar» lleva a «Cuarentena con fecha». «Enumerar intercalaciones o fijar semilla» lleva a «Cuarentena con fecha».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="788" height="762" fill="#ffffff"/><path d="M384.7,83 L384.7,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M383.5,202 L383.5,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M382.3,346 L382.3,354.0 Q382.3,362 374.3,362.0 L108.5,362.0 Q99.5,362 99.5,371.0 L99.5,422" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M382.3,346 L382.3,354.0 Q3