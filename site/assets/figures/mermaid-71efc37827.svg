<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 396 619" width="396" height="619" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Contrato del kit de diagnóstico multiplataforma» … «Mismas pruebas de contrato»</title><desc id="d">Diagrama de flujo con 7 pasos. «Contrato del kit de diagnóstico multiplataforma» lleva a «Adaptador PowerShell». «Contrato del kit de diagnóstico multiplataforma» lleva a «Adaptador Bash». «Adaptador PowerShell» lleva a «APIs y herramientas Windows». «Adaptador Bash» lleva a «APIs y herramientas POSIX». «APIs y herramientas Windows» lleva a «Resultado normalizado». «APIs y herramientas POSIX» lleva a «Resultado normalizado». «Resultado normalizado» lleva a «Mismas pruebas de contrato».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="396" height="619" fill="#ffffff"/><path d="M185,102 L185.0,122.0 Q185,131 176.0,131.0 L110.8,131.0 Q101.8,131 101.8,140.0 L101.8,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M185,102 L185.0,126.2 Q185,135.2 194.0,135.2 L259.3,135.2 Q268.3,135.2 268.3,144.2 L268.3,168.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M101.8,221 L101.8,243.3 Q101.8,250 95.2,250.0 L95.2,250.0 Q88.5,250 88.5,256.6 L88.5,279" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M268.3,212.5 L268.3,243.9 Q268.3,250.5 274.9,250.5 L274.9,250.5 Q281.5,250.5 281.5,257.1 L281.5,288.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M88.5,359 L88.5,379.0 Q88.5,388 97.5,388.0 L176.0,388.0 Q185,388 185.0,397.0 L185,417" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M281.5,349.5 L281.5,374.2 Q281.5,383.2 272.5,383.2 L194.0,383.2 Q185,383.2 185.0,392.2 L185,417" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M185,478 L185,536" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="101" y="22" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="185" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="185" dy="0">Contrato del kit</tspan><tspan x="185" dy="19.2">de diagnóstico</tspan><tspan x="185" dy="19.2">multiplataforma</tspan></text><rect x="44.3" y="160" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101.8" y="185.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101.8" dy="0">Adaptador</tspan><tspan x="101.8" dy="19.2">PowerShell</tspan></text><rect x="193.3" y="168.5" width="150" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="268.3" y="194.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="268.3" dy="0">Adaptador Bash</tspan></text><rect x="22" y="279" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="88.5" y="304" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="88.5" dy="0">APIs y</tspan><tspan x="88.5" dy="19.2">herramientas</tspan><tspan x="88.5" dy="19.2">Windows</tspan></text><rect x="189" y="288.5" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="281.5" y="313.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="281.5" dy="0">APIs y</tspan><tspan x="281.5" dy="19.2">herramientas POSIX</tspan></text><rect x="123" y="417" width="124" height="61" rx="10" fill="#dff1ee" stroke="#0