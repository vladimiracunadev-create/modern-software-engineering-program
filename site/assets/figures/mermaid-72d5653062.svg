<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 848 303" width="848" height="303" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Texto en un idioma» … «Recursos por locale»</title><desc id="d">Diagrama de flujo con 6 pasos. «Texto en un idioma» lleva a «Separar texto y código». «Separar texto y código» lleva a «Plurales, géneros y orden». «Separar texto y código» lleva a «Números, fechas y moneda». «Separar texto y código» lleva a «Normalización y longitud». «Plurales, géneros y orden» lleva a «Recursos por locale». «Números, fechas y moneda» lleva a «Recursos por locale». «Normalización y longitud» lleva a «Recursos por locale». «Recursos por locale» lleva a «Separar texto y código» (pseudolocalización).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="848" height="303" fill="#ffffff"/><path d="M207,151.5 L253,151.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M412,151.5 L426.0,151.5 Q435,151.5 435.0,142.5 L435.0,61.5 Q435,52.5 444.0,52.5 L458,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M412,151.5 L458,151.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M412,151.5 L430.2,151.5 Q439.2,151.5 439.2,160.5 L439.2,241.5 Q439.2,250.5 448.2,250.5 L466.5,250.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M634,52.5 L648.0,52.5 Q657,52.5 657.0,61.5 L657.0,142.5 Q657,151.5 666.0,151.5 L680,151.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M634,151.5 L680,151.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M625.5,250.5 L643.8,250.5 Q652.8,250.5 652.8,241.5 L652.8,160.5 Q652.8,151.5 661.8,151.5 L680,151.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M746.5,121 L746.5,114.0 Q746.5,107 739.5,107.0 L339.5,107.0 Q332.5,107 332.5,114.0 L332.5,121" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="129.5" width="185" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="114.5" y="155.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="114.5" dy="0">Texto en un idioma</tspan></text><rect x="253" y="121" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="332.5" y="146.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="332.5" dy="0">Separar texto y</tspan><tspan x="332.5" dy="19.2">código</tspan></text><rect x="458" y="22" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="546" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="546" dy="0">Plurales, géneros</tspan><tspan x="546" dy="19.2">y orden</tspan></text><rect x="458" y="121" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="546" y="146.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="546" dy="0">Números, fechas y</tspan><tspan x="546" dy="19.2">moneda</tspan></text><rect x="466.5" y="220" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="546" y="245.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="546" dy="0">Normalización y</tspan><tspan x="546" dy="19.2">longitud</tspan></text><rect x="680" y="121" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1