<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 526 934" width="526" height="934" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Modelo base» … «Registrar el modelo con su base y sus datos» y «Más datos, otra adaptación o volver atrás»</title><desc id="d">Diagrama de flujo con 10 pasos. «Modelo base» lleva a «¿Rinde en la población nueva?». «¿Rinde en la población nueva?» lleva a «Usarlo tal cual y medir» (sí). «¿Rinde en la población nueva?» lleva a «¿Hay datos etiquetados?» (no). «¿Hay datos etiquetados?» lleva a «Adaptar pocos parámetros» (pocos). «¿Hay datos etiquetados?» lleva a «Adaptar completo o entrenar desde cero» (muchos). «Adaptar pocos parámetros» lleva a «Evaluar en población nueva y en la original». «Adaptar completo o entrenar desde cero» lleva a «Evaluar en población nueva y en la original». «Evaluar en población nueva y en la original» lleva a «¿Olvido aceptable y mejora real?». «¿Olvido aceptable y mejora real?» lleva a «Registrar el modelo con su base y sus datos» (sí). «¿Olvido aceptable y mejora real?» lleva a «Más datos, otra adaptación o volver atrás» (no).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="526" height="934" fill="#ffffff"/><path d="M230.1,66 L230.1,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M230.1,210 L230.1,218.0 Q230.1,226 222.1,226.0 L140.4,226.0 Q131.4,226 131.4,235.0 L131.4,280.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M230.1,210 L230.1,218.0 Q230.1,226 238.1,226.0 L348.4,226.0 Q357.4,226 357.4,235.0 L357.4,268" fi