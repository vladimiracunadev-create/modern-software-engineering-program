"131.4" y="305.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="131.4" dy="0">Usarlo tal cual y</tspan><tspan x="131.4" dy="19.2">medir</tspan></text><polygon points="357.4,268 461.4,311 357.4,354 253.4,311" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="357.4" y="305.6" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="357.4" dy="0">¿Hay datos</tspan><tspan x="357.4" dy="19.2">etiquetados?</tspan></text><rect x="142.1" y="421.5" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="213.1" y="446.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="213.1" dy="0">Adaptar pocos</tspan><tspan x="213.1" dy="19.2">parámetros</tspan></text><rect x="318.1" y="412" width="185" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="410.6" y="437" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="410.6" dy="0">Adaptar completo o</tspan><tspan x="410.6" dy="19.2">entrenar desde</tspan><tspan x="410.6" dy="19.2">cero</tspan></text><rect x="188.2" y="550" width="176" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="276.2" y="575" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="276.2" dy="0">Evaluar en</tspan><tspan x="276.2" dy="19.2">población nueva y</tspan><tspan x="276.2" dy="19.2">en la original</tspan></text><polygon points="234.1,688 377.6,731 234.1,774 90.6,731" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="234.1" y="725.6" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="234.1" dy="0">¿Olvido aceptable</tspan><tspan x="234.1" dy="19.2">y mejora real?</tspan></text><rect x="22" y="832" width="185" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="114.5" y="857" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="