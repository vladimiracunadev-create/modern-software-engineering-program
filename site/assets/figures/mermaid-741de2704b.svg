<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 839 88" width="839" height="88" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «🎯 Descubrir» … «📈 Retirar»</title><desc id="d">Diagrama de flujo con 5 pasos. «🎯 Descubrir» lleva a «🧠 Caracterizar». «🧠 Caracterizar» lleva a «🛠️ Aislar». «🛠️ Aislar» lleva a «🔎 Migrar». «🔎 Migrar» lleva a «📈 Retirar».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="839" height="88" fill="#ffffff"/><path d="M153,44 L199,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M356,44 L402,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M507,44 L553,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M658,44 L704,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="22" width="131" height="44" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="87.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="87.5" dy="0">🎯 Descubrir</tspan></text><rect x="199" y="22" width="157" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="277.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="277.5" dy="0">🧠 Caracterizar</tspan></text><rect x="402" y="22" width="105" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="454.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="454.5" dy="0">🛠️ Aislar</tspan></text><rect x="553" y="22" width="105" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="605.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="605.5" dy="0">🔎 Migrar</tspan></text><rect x="704" y="22" width="113" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="760.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="760.5" dy="0">📈 Retirar</tspan></text></svg>
