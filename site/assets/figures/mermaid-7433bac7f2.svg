<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 784 243" width="784" height="243" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Predeterminados seguros» … «Informe con procedencia y redacción»</title><desc id="d">Diagrama de flujo con 7 pasos. «Predeterminados seguros» lleva a «Archivo». «Archivo» lleva a «Entorno». «Entorno» lleva a «CLI». «CLI» lleva a «Validar esquema y semántica». «Validar esquema y semántica» lleva a «Configuración efectiva». «Configuración efectiva» lleva a «Informe con procedencia y redacción».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="784" height="243" fill="#ffffff"/><path d="M181,52.5 L253.5,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M342.5,52.5 L441.5,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M530.5,52.5 L644.5,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M682.5,74.5 L682.5,150.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M603,181 L557,181" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M415,181 L369,181" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="22" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101.5" dy="0">Predeterminados</tspan><tspan x="101.5" dy="19.2">seguros</tspan></text><rect x="253.5" y="30.5" width="89" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="298" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="298" dy="0">Archivo</tspan></text><rect x="441.5" y="30.5" width="89" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="486" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="486" dy="0">Entorno</tspan></text><rect x="644.5" y="30.5" width="76" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="682.5" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="682.5" dy="0">CLI</tspan></text><rect x="603" y="150.5" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="682.5" y="175.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="682.5" dy="0">Validar esquema</tspan><tspan x="682.5" dy="19.2">y semántica</tspan></text><rect x="415" y="150.5" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="486" y="175.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="486" dy="0">Configuración</tspan><tspan x="486" dy="19.2">efectiva</tspan></text><rect x="227" y="141" width="142" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="298" y="166" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="298" dy="0">Informe con</tspan><tspan x="298" dy="19.2">procedencia y</tspan><tspan x="298" dy="19.2">redacción</tspan></text></svg>
