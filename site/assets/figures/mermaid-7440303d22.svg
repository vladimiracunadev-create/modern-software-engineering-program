<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 849 166" width="849" height="166" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Términos, hechos / consultas» … «Restricciones / explicación»</title><desc id="d">Diagrama de flujo con 5 pasos. «Términos, hechos / consultas» lleva a «Unificación». «Unificación» lleva a «Resolución / backtracking». «Resolución / backtracking» lleva a «Negación / mundo cerrado». «Negación / mundo cerrado» lleva a «Restricciones / explicación». «Restricciones / explicación» lleva a «Términos, hechos / consultas» (fallo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="849" height="166" fill="#ffffff"/><path d="M129,104 L175,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M299,104 L345,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M478,104 L524,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M639,104 L685,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M756,64 L756.0,57.0 Q756,50 749.0,50.0 L82.5,50.0 Q75.5,50 75.5,57.0 L75.5,64" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="64" width="107" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="75.5" y="89" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="75.5" dy="0">Términos,</tspan><tspan x="75.5" dy="19.2">hechos /</tspan><tspan x="75.5" dy="19.2">consultas</tspan></text><rect x="175" y="82" width="124" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="237" y="108.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="237" dy="0">Unificación</tspan></text><rect x="345" y="64" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="411.5" y="89" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="411.5" dy="0">Resolución</tspan><tspan x="411.5" dy="19.2">/</tspan><tspan x="411.5" dy="19.2">backtracking</tspan></text><rect x="524" y="64" width="115" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="581.5" y="89" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="581.5" dy="0">Negación /</tspan><tspan x="581.5" dy="19.2">mundo</tspan><tspan x="581.5" dy="19.2">cerrado</tspan></text><rect x="685" y="64" width="142" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="756" y="89" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="756" dy="0">Restricciones</tspan><tspan x="756" dy="19.2">/</tspan><tspan x="756" dy="19.2">explicación</tspan></text><rect x="352.8" y="22" width="126" height="24" rx="4" fill="#ffffff"/><text x="415.8" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="415.8" dy="0">fallo o cambio</tspan></text></svg>
