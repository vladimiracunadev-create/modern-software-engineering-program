<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 464 1115" width="464" height="1115" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Código sin pruebas» … «Corregir a propósito y actualizar»</title><desc id="d">Diagrama de flujo con 10 pasos. «Código sin pruebas» lleva a «Encontrar o crear una costura». «Encontrar o crear una costura» lleva a «Ejecutar sin dependencias lentas». «Ejecutar sin dependencias lentas» lleva a «Registrar entradas y salidas actuales». «Registrar entradas y salidas actuales» lleva a «Normalizar lo no determinista». «Normalizar lo no determinista» lleva a «Prueba de caracterización». «Prueba de caracterización» lleva a «Medir: cobertura y mutantes». «Medir: cobertura y mutantes» lleva a «Registrar entradas y salidas actuales» (sobreviven mutantes). «Prueba de caracterización» lleva a «Cambiar con red de seguridad». «Cambiar con red de seguridad» lleva a «Qué falló» (la prueba falla). «Qué falló» lleva a «Cambiar con red de seguridad» (cambio no deseado). «Qué falló» lleva a «Corregir a propósito y actualizar» (defecto conocido).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="464" height="1115" fill="#ffffff"/><path d="M168.9,66 L168.9,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M172,185 L172,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M175.1,323 L175.1,346.9 Q175.1,352 180.2,352.0 L180.2,352.0 Q185.4,352 185.4,357.1 L185.4,381" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M185.4,442 L185.4,463.2 Q18