<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 613 224" width="613" height="224" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Reproducción determinista» … «Caso mínimo / representatividad»</title><desc id="d">Diagrama de flujo con 5 pasos. «Reproducción determinista» lleva a «Reducción por dimensiones». «Reducción por dimensiones» lleva a «Una variable por experimento». «Una variable por experimento» lleva a «Primera divergencia». «Primera divergencia» lleva a «Caso mínimo / representatividad». «Caso mínimo / representatividad» lleva a «Reproducción determinista» (fallo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="613" height="224" fill="#ffffff"/><path d="M155,52.5 L218,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M360,52.5 L423,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M507,83 L507,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M445,171.5 L377,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M201,171.5 L97.5,171.5 Q88.5,171.5 88.5,162.5 L88.5,83" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="22" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="88.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="88.5" dy="0">Reproducción</tspan><tspan x="88.5" dy="19.2">determinista</tspan></text><rect x="218" y="22" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="289" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="289" dy="0">Reducción por</tspan><tspan x="289" dy="19.2">dimensiones</tspan></text><rect x="423" y="22" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="507" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="507" dy="0">Una variable por</tspan><tspan x="507" dy="19.2">experimento</tspan></text><rect x="445" y="141" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="507" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="507" dy="0">Primera</tspan><tspan x="507" dy="19.2">divergencia</tspan></text><rect x="201" y="141" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="289" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="289" dy="0">Caso mínimo /</tspan><tspan x="289" dy="19.2">representatividad</tspan></text><rect x="70.5" y="143.5" width="126" height="24" rx="4" fill="#ffffff"/><text x="133.5" y="159.4" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="133.5" dy="0">fallo o cambio</tspan></text></svg>
