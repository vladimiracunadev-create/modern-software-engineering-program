<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 778 166" width="778" height="166" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Módulo, paquete e importación» … «Publicación / repositorio»</title><desc id="d">Diagrama de flujo con 5 pasos. «Módulo, paquete e importación» lleva a «Metadata de proyecto». «Metadata de proyecto» lleva a «sdist / wheel». «sdist / wheel» lleva a «Build aislado». «Build aislado» lleva a «Publicación / repositorio». «Publicación / repositorio» lleva a «Módulo, paquete e importación» (fallo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="778" height="166" fill="#ffffff"/><path d="M146,104 L192,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M316,104 L362,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M451,104 L497,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M586,104 L632,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M694,64 L694.0,57.0 Q694,50 687.0,50.0 L91.0,50.0 Q84,50 84.0,57.0 L84,64" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="64" width="124" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="84" y="89" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="84" dy="0">Módulo,</tspan><tspan x="84" dy="19.2">paquete e</tspan><tspan x="84" dy="19.2">importación</tspan></text><rect x="192" y="73.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="254" y="98.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="254" dy="0">Metadata de</tspan><tspan x="254" dy="19.2">proyecto</tspan></text><rect x="362" y="73.5" width="89" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="406.5" y="98.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="406.5" dy="0">sdist /</tspan><tspan x="406.5" dy="19.2">wheel</tspan></text><rect x="497" y="73.5" width="89" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="541.5" y="98.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="541.5" dy="0">Build</tspan><tspan x="541.5" dy="19.2">aislado</tspan></text><rect x="632" y="64" width="124" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="694" y="89" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="694" dy="0">Publicación</tspan><tspan x="694" dy="19.2">/</tspan><tspan x="694" dy="19.2">repositorio</tspan></text><rect x="326" y="22" width="126" height="24" rx="4" fill="#ffffff"/><text x="389" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="389" dy="0">fallo o cambio</tspan></text></svg>
