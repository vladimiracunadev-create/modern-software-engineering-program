<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 874 88" width="874" height="88" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «🎯 Fuente» … «📈 Promoción»</title><desc id="d">Diagrama de flujo con 5 pasos. «🎯 Fuente» lleva a «🧠 Build hermético». «🧠 Build hermético» lleva a «🛠️ Artefacto». «🛠️ Artefacto» lleva a «🔎 Firma». «🔎 Firma» lleva a «📈 Promoción».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="874" height="88" fill="#ffffff"/><path d="M127,44 L173,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M356,44 L402,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M533,44 L579,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M675,44 L721,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="22" width="105" height="44" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="74.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="74.5" dy="0">🎯 Fuente</tspan></text><rect x="173" y="22" width="183" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="264.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="264.5" dy="0">🧠 Build hermético</tspan></text><rect x="402" y="22" width="131" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="467.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="467.5" dy="0">🛠️ Artefacto</