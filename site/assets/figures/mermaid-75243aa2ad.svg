<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 422 582" width="422" height="582" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Problema con alternativas» … «ADR que sustituye»</title><desc id="d">Diagrama de flujo con 6 pasos. «Problema con alternativas» lleva a «RFC: propuesta para revisar». «RFC: propuesta para revisar» lleva a «ADR: decisión registrada». «ADR: decisión registrada» lleva a «Suposiciones y fecha de revisión». «Suposiciones y fecha de revisión» lleva a «ADR que sustituye» (cambia una suposición). «ADR que sustituye» lleva a «ADR: decisión registrada». «ADR: decisión registrada» lleva a «Comprobación de forma y de grafo».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="422" height="582" fill="#ffffff"/><path d="M250.2,83 L250.2,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M250.2,202 L250.2,222.0 Q250.2,231 241.2,231.0 L238.2,231.0 Q229.2,231 229.2,240.0 L229.2,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M229.2,321 L229.2,341.0 Q229.2,350 220.2,350.0 L119.0,350.0 Q110,350 110.0,359.0 L110,379" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M113.1,440 L113.1,516" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M229.2,321 L229.2,341.0 Q229.2,350 238.2,350.0 L307.0,350.0 Q316,350 316.0,359.0 L316,379" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M204.2,538 L211.2,538.0 Q218.2,538 218.2,531.0 L218.2,344.0 Q218.2,335 209.2,335.0 L153.2,335.0 Q144.2,335 144.2,326.0 L144.2,297.5 Q144.2,290.5 151.2,290.5 L158.2,290.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="183.7" y="22" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="250.2" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="250.2" dy="0">Problema con</tspan><tspan x="250.2" dy="19.2">alternativas</tspan></text><rect x="175.2" y="141" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="250.2" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="250.2" dy="0">RFC: propuesta</tspan><tspan x="250.2" dy="19.2">para revisar</tspan></text><rect x="158.2" y="260" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="229.2" y="285.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="229.2" dy="0">ADR: decisión</tspan><tspan x="229.2" dy="19.2">registrada</tspan></text><rect x="22" y="379" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="110" y="404.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">Suposiciones y</tspan><tspan x="110" dy="19.2">fecha de revisión</tspan></text><rect x="28.2" y="516" width="176" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="116.2" y="542.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="116.2" dy="0">ADR que sustituye</tspan></text><rect x="232" y="379" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="316" y="404.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="316" dy="0">Comprobación de</tspan><tspan x="316" dy="19.2">forma y de grafo</tspan></text><rect x="119.1" y="457" width="94" height="42" rx="4" fill="#ffffff"/><text x="166.1" y="472.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="166.1" dy="0">cambia una</tspan><tspan x="166.1" dy="17.92">suposición</tspan></text></svg>
