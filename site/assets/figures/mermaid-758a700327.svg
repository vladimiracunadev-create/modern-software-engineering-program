<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 586 783" width="586" height="783" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Acción propuesta» … «Efecto residual y aviso a las personas afectadas»</title><desc id="d">Diagrama de flujo con 9 pasos. «Acción propuesta» lleva a «Clase de reversibilidad». «Clase de reversibilidad» lleva a «Ejecutar con diario» (reversible). «Clase de reversibilidad» lleva a «Ejecutar con compensación registrada» (compensable). «Clase de reversibilidad» lleva a «Aprobación humana con pausa» (irreversible). «Ejecutar con diario» lleva a «Resultado». «Ejecutar con compensación registrada» lleva a «Resultado». «Aprobación humana con pausa» lleva a «Resultado» (aprobada). «Aprobación humana con pausa» lleva a «No se ejecuta» (denegada o sin respuesta). «Resultado» lleva a «Deshacer o compensar» (error). «Deshacer o compensar» lleva a «Efecto residual y aviso a las personas afectadas» (el paso irreversible quedó hecho).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="586" height="783" fill="#ffffff"/><path d="M255.2,66 L255.2,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M255.2,210 L255.2,218.0 Q255.2,226 247.2,226.0 L97.5,226.0 Q88.5,226 88.5,235.0 L88.5,277.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M255.4,210 L255.4,268" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M255.2,210 L255.2,218.0 Q255.2,226 263.2,226.0 L435.0,226.0 Q444,226 444.0,235.0 L444,277.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M88.5,338.5 L88.5,372.2 Q88.5,381.2 97.5,381.2 L236.0,381.2 Q245,381.2 245.0,390.2 L245,424" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M255.5,348 L255.5,380.8 Q255.5,386 250.2,386.0 L250.2,386.0 Q245,386 245.0,391.2 L245,424" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M444,338.5 L444.0,346.5 Q444,354.5 436.0,354.5 L254.0,354.5 Q245,354.5 245.0,363.5 L245,424" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M444,338.5 L444.0,348.1 Q444,354.5 437.6,354.5 L437.6,354.5 Q431.1,354.5 431.1,360.9 L431.1,424" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M245,468 L245.0,476.9 Q245,484 237.9,484.0 L237.9,484.0 Q230.8,484 230.8,491.1 L230.8,526" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M230.8,587 L230.8,598.5 Q230.8,603 226.2,603.0 L226.2,603.0 Q221.7,603 221.7,607.5 L221.7,681" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="171.2" y="22" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="255.2" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="255.2" dy="0">Acción propuesta</tspan></text><polygon points="255.2,124 374.7,167 255.2,210 135.7,167" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="255.2" y="161.6" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="255.2" dy="0">Clase de</tspan><tspan x="255.2" dy="19.2">reversibilidad</tspan></text><rect x="22" y="277.5" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="88.5" y="302.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="88.5" dy="0">Ejecutar con</tspan><tspan x="88.5" dy="19.2">diario</tspan></text><rect x="189" y="268" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="255.5" y="293" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="255.5" dy="0">Ejecutar con</tspan><tspan x="255.5" dy="19.2">compensación</tspan><tspan x="255.5" dy="19.2">registrada</tspan></text><rect x="356" y="277.5" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="444" y="302.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="444" dy="0">Aprobación humana</tspan><tspan x="444" dy="19.2">con pausa</tspan></text><rect x="191.5" y="424" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="245" y="450.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="245" dy="0">Resultado</tspan></text><rect x="360.1" y="424" width="142" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="431.1" y="450.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="431.1" dy="0">No se ejecuta</tspan></text><rect x="173.3" y="526" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="230.8" y="551.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="230.8" dy="0">Deshacer o</tspan><tspan x="230.8" dy="19.2">compensar</tspan></text><rect x="129.2" y="681" width="185" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="221.7" y="706" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="221.7" dy="0">Efecto residual y</tspan><tspan x="221.7" dy="19.2">aviso a las</tspan><tspan x="221.7" dy="19.2">personas afectadas</tspan></text><rect x="94.5" y="239.8" width="94" height="24" rx="4" fill="#ffffff"/><text x="141.5" y="255.7" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="141.5" dy="0">reversible</tspan></text><rect x="261.4" y="227" width="102" height="24" rx="4" fill="#ffffff"/><text x="312.4" y="242.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="312.4" dy="0">compensable</tspan></text><rect x="450" y="239.8" width="110" height="24" rx="4" fill="#ffffff"/><text x="505" y="255.7" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="505" dy="0">irreversible</tspan></text><rect x="162" y="384.2" width="77" height="24" rx="4" fill="#ffffff"/><text x="200.5" y="400.1" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="200.5" dy="0">aprobada</tspan></text><rect x="437.1" y="368.2" width="126" height="42" rx="4" fill="#ffffff"/><text x="500.1" y="384.1" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="500.1" dy="0">denegada o sin</tspan><tspan x="500.1" dy="17.92">respuesta</tspan></text><rect x="236.8" y="493" width="53" height="24" rx="4" fill="#ffffff"/><text x="263.3" y="508.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="263.3" dy="0">error</tspan></text><rect x="227.7" y="612" width="110" height="60" rx="4" fill="#ffffff"/><text x="282.7" y="627.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="282.7" dy="0">el paso</tspan><tspan x="282.7" dy="17.92">irreversible</tspan><tspan x="282.7" dy="17.92">quedó hecho</tspan></text></svg>
