<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 901 105" width="901" height="105" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «🎯 Objetivo» … «📈 Recuperación»</title><desc id="d">Diagrama de flujo con 5 pasos. «🎯 Objetivo» lleva a «🧠 Contexto». «🧠 Contexto» lleva a «🛠️ Herramientas». «🛠️ Herramientas» lleva a «🔎 Bucle y evaluación». «🔎 Bucle y evaluación» lleva a «📈 Recuperación».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="901" height="105" fill="#ffffff"/><path d="M144,52.5 L190,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M312,52.5 L358,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M515,52.5 L561,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M676,52.5 L722,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="30.5" width="122" height="44" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="83" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="83" dy="0">🎯 Objetivo</tspan></text><rect x="190" y="30.5" width="122" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="251" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="251" dy="0">🧠 Contexto</tspan></text><rect x="358" y="30.5" width="157" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="436.5" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="436.5" dy="0">🛠️ Herramientas</tspan></text><rect x="561" y="22" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="618.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="618.5" dy="0">🔎 Bucle y</tspan><tspan x="618.5" dy="19.2">evaluación</tspan></text><rect x="722" y="30.5" width="157" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="800.5" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="800.5" dy="0">📈 Recuperación</tspan></text></svg>
