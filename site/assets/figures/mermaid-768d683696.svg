<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 604 381" width="604" height="381" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Decisión a revisar» … «Puntuación de las probabilidades»</title><desc id="d">Diagrama de flujo con 9 pasos. «Decisión a revisar» lleva a «Expediente con lo conocido entonces». «Expediente con lo conocido entonces» lleva a «Panel de dominios distintos». «Panel de dominios distintos» lleva a «Ejercicio previo al fallo». «Ejercicio previo al fallo» lleva a «Modos de fallo por dominio». «Modos de fallo por dominio» lleva a «Probabilidades escritas». «Probabilidades escritas» lleva a «Acciones y responsables». «Acciones y responsables» lleva a «Fecha de nueva revisión». «Fecha de nueva revisión» lleva a «Puntuación de las probabilidades». «Puntuación de las probabilidades» lleva a «Probabilidades escritas» (calibración).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="604" height="381" fill="#ffffff"/><path d="M154.5,62 L218,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M368,62 L444.5,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M498,102 L498,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M414,190.5 L368,190.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M218,190.5 L172,190.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M97,221 L97,288.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M163.5,319 L218,319" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M368,319 L423,319" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M498,279 L498.0,244.0 Q498,235 489.0,235.0 L195.0,235.0 Q186,235 186.0,226.0 L186.0,197.5 Q186,190.5 179.0,190.5 L172,190.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="39.5" y="31.5" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="97" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="97" dy="0">Decisión a</tspan><tspan x="97" dy="19.2">revisar</tspan></text><rect x="218" y="22" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="293" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="293" dy="0">Expediente con</tspan><tspan x="293" dy="19.2">lo conocido</tspan><tspan x="293" dy="19.2">entonces</tspan></text><rect x="444.5" y="22" width="107" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="498" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="498" dy="0">Panel de</tspan><tspan x="498" dy="19.2">dominios</tspan><tspan x="498" dy="19.2">distintos</tspan></text><rect x="414" y="160" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="498" y="185.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="498" dy="0">Ejercicio previo</tspan><tspan x="498" dy="19.2">al fallo</tspan></text><rect x="218" y="160" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="293" y="185.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="293" dy="0">Modos de fallo</tspan><tspan x="293" dy="19.2">por dominio</tspan></text><rect x="22" y="160" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="97" y="185.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="97" dy="0">Probabilidades</tspan><tspan x="97" dy="19.2">escritas</tspan></text><rect x="30.5" y="288.5" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="97" y="313.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="97" dy="0">Acciones y</tspan><tspan x="97" dy="19.2">responsables</tspan></text><rect x="218" y="288.5" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="293" y="313.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="293" dy="0">Fecha de nueva</tspan><tspan x="293" dy="19.2">revisión</tspan></text><rect x="423" y="279" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="498" y="304" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="498" dy="0">Puntuación de</tspan><tspan x="498" dy="19.2">las</tspan><tspan x="498" dy="19.2">probabilidades</tspan></text><rect x="291" y="239" width="102" height="24" rx="4" fill="#ffffff"/><text x="342" y="254.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="342" dy="0">calibración</tspan></text></svg>
