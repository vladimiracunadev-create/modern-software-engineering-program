<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 569 300" width="569" height="300" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Dominio: entidades y reglas» … «Prueba de anomalías y de tamaño»</title><desc id="d">Diagrama de flujo con 5 pasos. «Dominio: entidades y reglas» lleva a «Modelo conceptual: entidades, relaciones, cardinalidad». «Modelo conceptual: entidades, relaciones, cardinalidad» lleva a «Modelo lógico: tablas, claves, dependencias». «Modelo lógico: tablas, claves, dependencias» lleva a «Modelo físico: tipos, índices, almacenamiento». «Modelo físico: tipos, índices, almacenamiento» lleva a «Prueba de anomalías y de tamaño». «Prueba de anomalías y de tamaño» lleva a «Modelo lógico: tablas, claves, dependencias» (defecto). «Prueba de anomalías y de tamaño» lleva a «Dominio: entidades y reglas» (defecto de dominio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="569" height="300" fill="#ffffff"/><path d="M146,81 L200.5,81" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M333.5,81 L388,81" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M467.5,121 L467.5,198" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M388,238 L342,238" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M267,198 L267.0,163.0 Q267,154 276.0,154.0 L365.0,154.0 Q374,154 374.0,145.0 L374.0,88.0 Q374,81 381.0,81.0 L388,81" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><path d="M192,238 L93.0,238.0 Q84,238 84.0,229.0 L84,121" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="41" width="124" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="84" y="66" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="84" dy="0">Dominio:</tspan><tspan x="84" dy="19.2">entidades y</tspan><tspan x="84" dy="19.2">reglas</tspan></text><rect x="200.5" y="22" width="133" height="118" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="267" y="46.8" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="267" dy="0">Modelo</tspan><tspan x="267" dy="19.2">conceptual:</tspan><tspan x="267" dy="19.2">entidades,</tspan><tspan x="267" dy="19.2">relaciones,</tspan><tspan x="267" dy="19.2">cardinalidad</tspan></text><rect x="388" y="41" width="159" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="467.5" y="66" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="467.5" dy="0">Modelo lógico:</tspan><tspan x="467.5" dy="19.2">tablas, claves,</tspan><tspan x="467.5" dy="19.2">dependencias</tspan></text><rect x="388" y="198" width="159" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="467.5" y="223" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="467.5" dy="0">Modelo físico:</tspan><tspan x="467.5" dy="19.2">tipos, índices,</tspan><tspan x="467.5" dy="19.2">almacenamiento</tspan></text><rect x="192" y="198" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="267" y="223" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="267" dy="0">Prueba de</tspan><tspan x="267" dy="19.2">anomalías y de</tspan><tspan x="267" dy="19.2">tamaño</tspan></text><rect x="286" y="158" width="69" height="24" rx="4" fill="#ffffff"/><text x="320.5"