<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 796 185" width="796" height="185" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Contrato de la biblioteca» … «Informe / decisión»</title><desc id="d">Diagrama de flujo con 5 pasos. «Contrato de la biblioteca» lleva a «Invariantes / pruebas de propiedades». «Invariantes / pruebas de propiedades» lleva a «Casos límite / oráculo». «Casos límite / oráculo» lleva a «Benchmark versionado». «Benchmark versionado» lleva a «Informe / decisión». «Informe / decisión» lleva a «Contrato de la biblioteca» (fallo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="796" height="185" fill="#ffffff"/><path d="M146,113.5 L192,113.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M316,113.5 L362,113.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M460,113.5 L506,113.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M621,113.5 L667,113.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M720.5,83 L720.5,59.0 Q720.5,50 711.5,50.0 L93.0,50.0 Q84,50 84.0,59.0 L84,73.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="73.5" width="124" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="84" y="98.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="84" dy="0">Contrato de</tspan><tspan x="84" dy="19.2">la</tspan><tspan x="84" dy="19.2">biblioteca</tspan></text><rect x="192" y="64" width="124" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="254" y="88.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="254" dy="0">Invariantes</tspan><tspan x="254" dy="19.2">/ pruebas</tspan><tspan x="254" dy="19.2">de</tspan><tspan x="254" dy="19.2">propiedades</tspan></text><rect x="362" y="73.5" width="98" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="411" y="98.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="411" dy="0">Casos</tspan><tspan x="411" dy="19.2">límite /</tspan><tspan x="411" dy="19.2">oráculo</tspan></text><rect x="506" y="83" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="563.5" y="108.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="563.5" dy="0">Benchmark</tspan><tspan x="563.5" dy="19.2">versionado</tspan></text><rect x="667" y="83" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="720.5" y="108.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="720.5" dy="0">Informe /</tspan><tspan x="720.5" dy="19.2">decisión</tspan></text><rect x="339.2" y="22" width="126" height="24" rx="4" fill="#ffffff"/><text x="402.2" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="402.2" dy="0">fallo o cambio</tspan></text></svg>
