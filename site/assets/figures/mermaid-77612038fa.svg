<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 684" width="393" height="684" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Persona operadora» y «Pruebas de contrato» … «Informe redactado»</title><desc id="d">Diagrama de flujo con 8 pasos. «Persona operadora» lleva a «Contrato CLI». «Contrato CLI» lleva a «Núcleo del kit de diagnóstico multiplataforma». «Núcleo del kit de diagnóstico multiplataforma» lleva a «Adaptador PowerShell». «Núcleo del kit de diagnóstico multiplataforma» lleva a «Adaptador Bash». «Adaptador PowerShell» lleva a «Modelo normalizado». «Adaptador Bash» lleva a «Modelo normalizado». «Modelo normalizado» lleva a «Informe redactado». «Pruebas de contrato» lleva a «Contrato CLI». «Pruebas de contrato» lleva a «Adaptador PowerShell». «Pruebas de contrato» lleva a «Adaptador Bash».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="393" height="684" fill="#ffffff"/><path d="M110,90.5 L110.0,114.8 Q110,123.8 119.0,123.8 L190.7,123.8 Q199.7,123.8 199.7,132.8 L199.7,157" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M198.7,201 L198.7,259" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M197.7,339 L197.7,359.0 Q197.7,368 188.7,368.0 L122.4,368.0 Q113.4,368 113.4,377.0 L113.4,397" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M197.7,339 L197.7,363.2 Q197.7,372.2 206.7,372.2 L270.9,372.2 Q279.9,372.2 279.9,381.2 L279.9,405.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M113.4,458 L113.4,47