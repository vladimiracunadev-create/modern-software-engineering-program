<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 603" width="620" height="603" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Pantalla» … «N+1» y «2 consultas»</title><desc id="d">Diagrama de flujo con 9 pasos. «Pantalla» lleva a «Qué necesita». «Qué necesita» lleva a «REST: 2 viajes, muchos bytes» (recursos completos). «Qué necesita» lleva a «Selección de campos» (campos elegidos). «Qué necesita» lleva a «Llamada tipo RPC» (forma a medida). «Selección de campos» lleva a «Resolvedores». «Resolvedores» lleva a «N+1» (una consulta por elemento). «Resolvedores» lleva a «2 consultas» (carga por lotes). «Selección de campos» lleva a «Límite de profundidad y coste».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="620" height="603" fill="#ffffff"/><path d="M286.4,66 L286.4,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M286.4,186 L286.4,194.0 Q286.4,202 278.4,202.0 L110.5,202.0 Q101.5,202 101.5,211.0 L101.5,262" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M283.9,186 L283.9,262" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M286.4,186 L286.4,194.0 Q286.4,202 294.4,202.0 L457.0,202.0 Q466,202 466.0,211.0 L466,270.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M281.5,323 L281.5,352.0 Q281.5,361 272.5,361.0 L166.8,361.0 Q157.8,361 157.8,370.0 L157.8,399" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M157.8,443 L157.8,451.0 Q157.8,459 149.8,459.0 L104.3,459.0 Q95.3,459 95.3,468.0 L95.3,537" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M157.8,443 L157.8,451.0 Q157.8,459 165.8,459.0 L220.3,459.0 Q229.3,459 229.3,468.0 L229.3,537" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M281.5,323 L281.5,343.0 Q281.5,352 290.5,352.0 L320.3,352.0 Q329.3,352 329.3,361.0 L329.3,381" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="237.4" y="22" width="98" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="286.4" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="286.4" dy="0">Pantalla</tspan></text><polygon points="286.4,124 369.4,155 286.4,186 203.4,155" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="286.4" y="159.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="286.4" dy="0">Qué necesita</tspan></text><rect x="22" y="262" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101.5" y="287.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101.5" dy="0">REST: 2 viajes,</tspan><tspan x="101.5" dy="19.2">muchos bytes</tspan></text><rect x="215" y="262" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="281.5" y="287.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="281.5" dy="0">Selección de</tspan><tspan x="281.5" dy="19.2">campos</tspan></text><rect x="382" y="270.5" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="466" y="296.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="466" dy="0">Llamada tipo RPC</tspan></text><rect x="91.3" y="399" width="133" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="157.8" y="425.2" font-size="15" text-anchor="middle" font-weight="400" fill=