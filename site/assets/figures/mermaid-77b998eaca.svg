<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 493 967" width="493" height="967" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Documentos» … «Medir acierto, abstención y respaldo»</title><desc id="d">Diagrama de flujo con 11 pasos. «Documentos» lleva a «Fragmentar por encabezado, con título y origen». «Fragmentar por encabezado, con título y origen» lleva a «Índice léxico BM25». «Fragmentar por encabezado, con título y origen» lleva a «Índice vectorial». «Consulta» lleva a «Índice léxico BM25». «Consulta» lleva a «Índice vectorial». «Índice léxico BM25» lleva a «Fusión por rango recíproco». «Índice vectorial» lleva a «Fusión por rango recíproco». «Fusión por rango recíproco» lleva a «¿Puntuación sobre el umbral?». «¿Puntuación sobre el umbral?» lleva a «Abstenerse o escalar» (no). «¿Puntuación sobre el umbral?» lleva a «Top k fragmentos al modelo» (sí). «Top k fragmentos al modelo» lleva a «Respuesta con citas». «Respuesta con citas» lleva a «Medir acierto, abstención y respaldo».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="493" height="967" fill="#ffffff"/><path d="M123.7,66 L123.7,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M123.7,204 L123.7,228.4 Q123.7,233 119.1,233.0 L119.1,233.0 Q114.5,233 114.5,237.6 L114.5,262" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M123.7,204 L123.7,224.0 Q123.7,233 132.7,233.0 L316.0,233.0 Q325,233 325.0,242.0 L325,262" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M286.2,186 L286.2,215.0 Q