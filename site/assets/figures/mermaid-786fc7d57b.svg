<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 805 387" width="805" height="387" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Lista de escenarios» … «Sobrevivientes y escenarios que faltan»</title><desc id="d">Diagrama de flujo con 9 pasos. «Lista de escenarios» lleva a «Elegir uno». «Elegir uno» lleva a «Prueba concreta». «Prueba concreta» lleva a «¿Falla por la razón esperada?». «¿Falla por la razón esperada?» lleva a «Prueba concreta» (no). «¿Falla por la razón esperada?» lleva a «Código mínimo» (sí). «Código mínimo» lleva a «¿Pasan todas?». «¿Pasan todas?» lleva a «Código mínimo» (no). «¿Pasan todas?» lleva a «Refactor con todo en verde» (sí). «Refactor con todo en verde» lleva a «¿Lista vacía?». «¿Lista vacía?» lleva a «Elegir uno» (no). «¿Lista vacía?» lleva a «Sobrevivientes y escenarios que faltan» (sí). «Sobrevivientes y escenarios que faltan» lleva a «Lista de escenarios».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="805" height="387" fill="#ffffff"/><path d="M169,52.5 L279,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M394,52.5 L527,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M606.5,74.5 L606.5,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M479,184 L407.5,184" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M265.5,184 L201,184" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M111.5,215 L111.5,294.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M182.5,325 L247,325" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M426,325 L522.5,325" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M734,184 L741.0,184.0 Q748,184 748.0,177.0 L748.0,61.5 Q748,52.5 739.0,52.5 L686,52.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><path d="M111.5,153 L111.5,146.0 Q111.5,139 118.5,139.0 L327.5,139.0 Q336.5,139 336.5,148.0 L336.5,162" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><path d="M336.5,294 L336.5,229.0 Q336.5,220 345.5,220.0 L412.5,220.0 Q421.5,220 421.5,211.0 L421.5,97.5 Q421.5,88.5 412.5,88.5 L343.5,88.5 Q336.5,88.5 336.5,81.5 L336.5,74.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><path d="M606.5,285 L606.5,250.0 Q606.5,241 597.5,241.0 L224.0,241.0 Q215,241 215.0,232.0 L215.0,106.0 Q215,97 206.0,97.0 L118.5,97.0 Q111.5,97 111.5,90.0 L111.5,83" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="54" y="22" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="111.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="111.5" dy="0">Lista de</tspan><tspan x="111.5" dy="19.2">escenarios</tspan></text><rect x="279" y="30.5" width="115" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="336.5" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="336.5" dy="0">Elegir uno</tspan></text><rect x="527" y="30.5" width="159" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="606.5" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="606.5" dy="0">Prueba concreta</tspan></text><polygon points="606.5,141 734,184 606.5,227 479,184" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="606.5" y="178.6" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="606.5" dy="0">¿Falla por la</tspan><tspan x="606.5" dy="19.2">razón esperada?</tspan></text><rect x="265.5" y="162" width="142" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="336.5" y="188.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="336.5" dy="0">Código mínimo</tspan></text><polygon points="111.5,153 201,184 111.5,215 22,184" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="111.5" y="188.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="111.5" dy="0">¿Pasan todas?</tspan></text><rect x="40.5" y="294.5" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="111.5" y="319.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="111.5" dy="0">Refactor con</tspan><tspan x="111.5" dy="19.2">todo en verde</tspan></text><polygon points="336.5,294 426,325 336.5,356 247,325" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="336.5" y="329.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="336.5" dy="0">¿Lista vacía?</tspan></text><rect x="522.5" y="285" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="606.5" y="310" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="606.5" dy="0">Sobrevivientes y</tspan><tspan x="606.5" dy="19.2">escenarios que</tspan><tspan x="606.5" dy="19.2">faltan</tspan></text><rect x="754" y="106.2" width="29" height="24" rx="4" fill="#ffffff"/><text x="768.5" y="122.1" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="768.5" dy="0">no</tspan></text><rect x="428.8" y="156" width="29" height="24" rx="4" fill="#ffffff"/><text x="443.3"