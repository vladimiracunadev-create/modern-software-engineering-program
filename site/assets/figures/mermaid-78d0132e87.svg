<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 792 343" width="792" height="343" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Ciclo de vida y fallas» … «Proyecto: sistema operable»</title><desc id="d">Diagrama de flujo con 12 pasos. «Ciclo de vida y fallas» lleva a «Datos y etiquetas». «Datos y etiquetas» lleva a «Entrenamiento reproducible». «Entrenamiento reproducible» lleva a «Evaluación y sesgos». «Evaluación y sesgos» lleva a «Adaptación y costo». «Adaptación y costo» lleva a «Servir: latencia y lotes». «Servir: latencia y lotes» lleva a «Despliegue seguro». «Despliegue seguro» lleva a «Monitoreo y reentrenamiento». «Monitoreo y reentrenamiento» lleva a «Seguridad y robustez». «Seguridad y robustez» lleva a «Gobierno y regulación». «Gobierno y regulación» lleva a «Taller: degradar y recuperar». «Taller: degradar y recuperar» lleva a «Proyecto: sistema operable». «Proyecto: sistema operable» lleva a «Ciclo de vida y fallas» (la evidencia reabre el mapa).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="792" height="343" fill="#ffffff"/><path d="M181,52.5 L231,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M338,52.5 L401,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M543,52.5 L619.5,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M686,83 L686,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M619.5,171.5 L556,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M388,171.5 L342,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M227,171.5 L181,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M101.5,202 L101.5,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M163.5,290.5 L227,290.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M342,290.5 L388,290.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M556,290.5 L602,290.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M686,260 L686.0,225.0 Q686,216 677.0,216.0 L204.0,216.0 Q195,216 195.0,207.0 L195.0,106.0 Q195,97 186.0,97.0 L108.5,97.0 Q101.5,97 101.5,90.0 L101.5,83" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="22" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101.5" dy="0">Ciclo de vida y</tspan><tspan x="101.5" dy="19.2">fallas</tspan></text><rect x="231" y="22" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="284.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="284.5" dy="0">Datos y</tspan><tspan x="284.5" dy="19.2">etiquetas</tspan></text><rect x="401" y="22" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="472" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="472" dy="0">Entrenamiento</tspan><tspan x="472" dy="19.2">reproducible</tspan></text><rect x="619.5" y="22" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="686" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="686" dy="0">Evaluación y</tspan><tspan x="686" dy="19.2">sesgos</tspan></text><rect x="619.5" y="141" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="686" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="686" dy="0">Adaptación y</tspan><tspan x="686" dy="19.2">costo</tspan></text><rect x="388" y="141" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="472" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="472" dy="0">Servir: latencia</tspan><tspan x="472" dy="19.2">y lotes</tspan></text><rect x="227" y="141" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="284.5" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="284.5" dy="0">Despliegue</tspan><tspan x="284.5" dy="19.2">seguro</tspan></text><rect x="22" y="141" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101.5" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101.5" dy="0">Monitoreo y</tspan><tspan x="101.5" dy="19.2">reentrenamiento</tspan></text><rect x="39.5" y="260" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101.5" y="285.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101.5" dy="0">Seguridad y</tspan><tspan x="101.5" dy="19.2">robustez</tspan></text><rect x="227" y="260" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="284.5" y="285.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="284.5" dy="0">Gobierno y</tspan><tspan x="284.5" dy="19.2">regulación</tspan></text><rect x="388" y="260" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="472" y="285.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="472" dy="0">Taller: degradar</tspan><tspan x="472" dy="19.2">y recuperar</tspan></text><rect x="602" y="260" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="686" y="285.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="686" dy="0">Proyecto:</tspan><tspan x="686" dy="19.2">sistema operable</tspan></text><rect x="201" y="87.9" width="126" height="42" rx="4" fill="#ffffff"/><text x="264" y="103.8" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="264" dy="0">la evidencia</tspan><tspan x="264" dy="17.92">reabre el mapa</tspan></text></svg>
