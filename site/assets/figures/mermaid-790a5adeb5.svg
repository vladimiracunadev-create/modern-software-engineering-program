<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 643 721" width="643" height="721" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Código: un repositorio» … «Drenar y devolver trabajo»</title><desc id="d">Diagrama de flujo con 10 pasos. «Código: un repositorio» lleva a «Construir: una vez». «Construir: una vez» lleva a «Artefacto inmutable». «Configuración: entorno» lleva a «Ejecutar: proceso sin estado». «Artefacto inmutable» lleva a «Ejecutar: proceso sin estado». «Servicios de apoyo: base de datos, cola, caché» lleva a «Ejecutar: proceso sin estado». «Ejecutar: proceso sin estado» lleva a «Registros a la salida estándar». «Ejecutar: proceso sin estado» lleva a «Señal de parada». «Señal de parada» lleva a «Drenar y devolver trabajo». «Ejecutar: proceso sin estado» lleva a «Más copias: concurrencia por procesos».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="643" height="721" fill="#ffffff"/><path d="M139.1,83 L139.1,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M139.1,185 L139.1,209.8 Q139.1,218.8 130.1,218.8 L115.8,218.8 Q106.8,218.8 106.8,227.8 L106.8,252.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M269.3,313.5 L269.3,338.2 Q269.3,347.2 278.3,347.2 L299.8,347.2 Q308.8,347.2 308.8,356.2 L308.8,381" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M106.8,313.5 L106.8,338.2 Q106.8,347.2 115.8,347.2 L299.8,347.2 Q308.8,347.2 308.8,356.2 L308.8,381" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d=