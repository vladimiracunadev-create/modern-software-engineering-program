<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 565 777" width="565" height="777" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Carga de trabajo» … «Medir antes de comprar»</title><desc id="d">Diagrama de flujo con 9 pasos. «Carga de trabajo» lleva a «Muchos datos independientes». «Muchos datos independientes» lleva a «CPU» (no). «Muchos datos independientes» lleva a «Acceso a memoria regular» (sí). «Acceso a memoria regular» lleva a «Reorganizar datos o CPU» (no). «Acceso a memoria regular» lleva a «Operaciones por byte movido» (sí). «Operaciones por byte movido» lleva a «Limitada por memoria: el ancho de banda manda» (pocas). «Operaciones por byte movido» lleva a «Limitada por cómputo: el pico manda» (muchas). «Limitada por memoria: el ancho de banda manda» lleva a «Medir antes de comprar». «Limitada por cómputo: el pico manda» lleva a «Medir antes de comprar».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="565" height="777" fill="#ffffff"/><path d="M141.5,66 L141.5,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M141.5,210 L141.5,218.0 Q141.5,226 133.5,226.0 L71.9,226.0 Q62.9,226 62.9,235.0 L62.9,289" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M141.5,210 L141.5,218.0 Q141.5,226 149.5,226.0 L261.4,226.0 Q270.4,226 270.4,235.0 L270.4,268" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M270.4,354 L270.4,362.0 Q270.4,370 262.4,370.0 L170.5,370.0 Q161.5,370 161.5,379.0 L161.5,424.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M270.4,354 L270.4,362.0 Q270.4,370 278.4,370.0 L402.0,370.0 Q411,370 411.0,379.0 L411,412" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M411,498 L411.0,506.0 Q411,514 403.0,514.0 L261.7,514.0 Q252.7,514 252.7,523.0 L252.7,556" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M411,498 L411.0,506.0 Q411,514 419.0,514.0 L449.7,514.0 Q458.7,514 458.7,523.0 L458.7,556" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M252.7,636 L252.7,656.0 Q252.7,665 261.7,665.0 L312.7,665.0 Q321.7,665 321.7,674.0 L321.7,694" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M458.7,636 L458.7,656.0 Q458.7,665 449.7,665.0 L330.7,665.0 Q321.7,665 321.7,674.0 L321.7,694" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="57.5" y="22" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="141.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="141.5" dy="0">Carga de trabajo</tspan></text><polygon points="141.5,124 261,167 141.5,210 22,167" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="141.5" y="161.6" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="141.5" dy="0">Muchos datos</tspan><tspan x="141.5" dy="19.2">independientes</tspan></text><rect x="24.9" y="289" width="76" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="62.9" y="315.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="62.9" dy="0">CPU</tspan></text><polygon points="270.4,268 405.9,311 270.4,354 134.9,311" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="270.4" y="305.6" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="270.4" dy="0">Acceso a memoria</tspan><tspan x="270.4" dy="19.2">regular</tspan></text