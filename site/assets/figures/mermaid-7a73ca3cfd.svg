<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 928 313" width="928" height="313" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Caso de uso» … «Vuelve atrás: nada persistido» y «Confirma todo»</title><desc id="d">Diagrama de flujo con 10 pasos. «Caso de uso» lleva a «Repository: leer y buscar». «Caso de uso» lleva a «Unit of Work: agrupar cambios». «Repository: leer y buscar» lleva a «Contar consultas». «Unit of Work: agrupar cambios» lleva a «Una transacción». «Una transacción» lleva a «¿Falla a mitad?». «¿Falla a mitad?» lleva a «Vuelve atrás: nada persistido» (sí). «¿Falla a mitad?» lleva a «Confirma todo» (no). «Caso de uso» lleva a «Active Record: la entidad se guarda». «Active Record: la entidad se guarda» lleva a «Regla y persistencia mezcladas».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="928" height="313" fill="#ffffff"/><path d="M146,156.5 L162.0,156.5 Q171,156.5 171.0,147.5 L171.0,61.5 Q171,52.5 180.0,52.5 L196,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M146,156.5 L166.2,156.5 Q171,156.5 171.0,151.8 L171.0,151.8 Q171,147 175.8,147.0 L196,147" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M338,52.5 L401,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M338,147 L392.5,147" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M516.5,147 L567,147" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M711,147 L719.0,147.0 Q727,147 727.0,139.0 L727.0,131.5 Q727,122.5 736.0,122.5 L764,122.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M711,147 L719.0,147.0 Q727,147 727.0,155.0 L727.0,199.5 Q727,208.5 736.0,208.5 L764,208.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M146,156.5 L160.0,156.5 Q169,156.5 169.0,165.5 L169.0,242.0 Q169,251 178.0,251.0 L192,251" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M342,251 L388,251" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="134.5" width="124" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="84" y="160.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="84" dy="0">Caso de uso</tspan></text><rect x="196" y="22" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="267" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="267" dy="0">Repository:</tspan><tspan x="267" dy="19.2">leer y buscar</tspan></text><rect x="196" y="107" width="142" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="267" y="132" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="267" dy="0">Unit of Work:</tspan><tspan x="267" dy="19.2">agrupar</tspan><tspan x="267" dy="19.2">cambios</tspan></text><rect x="401" y="22" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="454.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="454.5" dy="0">Contar</tspan><tspan x="454.5" dy="19.2">consultas</tspan></text><rect x="392.5" y="116.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="454.5" y="141.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="454.5" dy="0">Una</tspan><tspan x="454.5" dy="19.2">transacción</tspan></