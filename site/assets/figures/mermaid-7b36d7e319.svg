<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 468 899" width="468" height="899" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Productor» y «Cambio semántico» … «Se publica con versión menor» y «Expandir, migrar, contraer con versión mayor»</title><desc id="d">Diagrama de flujo con 10 pasos. «Productor» lleva a «Contrato: esquema, significado, calidad, frescura, dueño». «Contrato: esquema, significado, calidad, frescura, dueño» lleva a «Verificador de compatibilidad en CI». «Verificador de compatibilidad en CI» lleva a «¿Compatible?». «¿Compatible?» lleva a «Se publica con versión menor» (sí). «¿Compatible?» lleva a «Expandir, migrar, contraer con versión mayor» (no). «Contrato: esquema, significado, calidad, frescura, dueño» lleva a «Consumidores». «Consumidores» lleva a «Pruebas de contrato del consumidor». «Pruebas de contrato del consumidor» lleva a «Verificador de compatibilidad en CI». «Cambio semántico» lleva a «Definición con ejemplos y registro de cambios» (no lo ve el esquema).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="468" height="899" fill="#ffffff"/><path d="M136.1,66 L136.1,142" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M43.6,191.5 L36.6,191.5 Q29.6,191.5 29.6,198.5 L29.6,570.0 Q29.6,579 38.6,579.0 L92.3,579" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M180.3,619 L180.3,642.5 Q180.3,648 185.9,648.0 L185.9,648.0 Q191.4,648 191.4,653.5 L191.4,677" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M191.4,739 L191.4,747.0 Q191.4,755 183.4,755.0 L106.0,755.0 Q97,755 97.0,764.0 L97,806.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M191.4,739 L191.4,747.0 Q191.4,755 199.4,755.0 L285.0,755.0 Q294,755 294.0,764.0 L294,797" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M136.1,241 L136.1,262.4 Q136.1,270 143.6,270.0 L143.6,270.0 Q151.2,270 151.2,277.6 L151.2,299" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M151.2,343 L151.2,364.4 Q151.2,372 158.8,372.0 L158.8,372.0 Q166.5,372 166.5,379.6 L166.5,401" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M166.5,481 L166.5,503.1 Q166.5,510 173.4,510.0 L173.4,510.0 Q180.3,510 180.3,516.9 L180.3,539" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M337.6,66 L337.6,142" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="82.6" y="22" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="136.1" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="136.1" dy="0">Productor</tspan></text><rect x="43.6" y="142" width="185" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="136.1" y="166.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="136.1" dy="0">Contrato: esquema,</tspan><tspan x="136.1" dy="19.2">significado,</tspan><tspan x="136.1" dy="19.2">calidad, frescura,</tspan><tspan x="136.1" dy="19.2">dueño</tspan></text><rect x="92.3" y="539" width="176" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="180.3" y="564" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="180.3" dy="0">Verificador de</tspan><tspan x="180.3" dy="19.2">compatibilidad en</tspan><tspan x="180.3" dy="19.2">CI</tspan></text><polygon points="191.4,677 27