<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 909 436" width="909" height="436" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Necesidad de un dato» … «Eliminar al vencer el plazo», «Generalizar: k-anonimato», «Consultar con ruido: privacidad diferencial» y «Seudonimizar con clave por propósito»</title><desc id="d">Diagrama de flujo con 10 pasos. «Necesidad de un dato» lleva a «Finalidad concreta y plazo». «Finalidad concreta y plazo» lleva a «No recoger» (no). «Finalidad concreta y plazo» lleva a «Recoger lo mínimo» (sí). «Recoger lo mínimo» lleva a «Proteger: acceso, cifrado, retención». «Recoger lo mínimo» lleva a «Publicar o compartir». «Publicar o compartir» lleva a «Generalizar: k-anonimato». «Publicar o compartir» lleva a «Consultar con ruido: privacidad diferencial». «Publicar o compartir» lleva a «Seudonimizar con clave por propósito». «Proteger: acceso, cifrado, retención» lleva a «Eliminar al vencer el plazo».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="909" height="436" fill="#ffffff"/><path d="M155,218 L201,218" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M370,218 L378.0,218.0 Q386,218 386.0,210.0 L386.0,184.5 Q386,175.5 395.0,175.5 L423,175.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M370,218 L378.0,218.0 Q386,218 386.0,226.0 L386.0,243.0 Q386,252 395.0,252.0 L423,252" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M538,252 L554.0,252.0 Q563,252 563.0,243.0 L563.0,184.5 Q563,175.5 572.0,175.5 L588,175.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M538,252 L552.0,252.0 Q561,252 561.0,261.0 L561.0,270.5 Q561,279.5 570.0,279.5 L584,279.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M699,279.5 L715.2,279.5 Q724.2,279.5 724.2,270.5 L724.2,165.5 Q724.2,156.5 733.2,156.5 L749.5,156.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M699,279.5 L713.0,279.5 Q722,279.5 722.0,270.5 L722.0,269.5 Q722,260.5 731.0,260.5 L745,260.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M699,279.5 L713.0,279.5 Q722,279.5 722.0,288.5 L722.0,365.0 Q722,374 731.0,374.0 L745,374" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M695,175.5 L715.5,175.5 Q724.5,175.5 724.5,166.5 L724.5,71.0 Q724.5,62 733.5,62.0 L754,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="187.5" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="88.5" y="212.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="88.5" dy="0">Necesidad de</tspan><tspan x="88.5" dy="19.2">un dato</tspan></text><polygon points="285.5,158 370,218 285.5,278 201,218" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="285.5" y="203" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="285.5" dy="0">Finalidad</tspan><tspan x="285.5" dy="19.2">concreta y</tspan><tspan x="285.5" dy="19.2">plazo</tspan></text><rect x="423" y="153.5" width="115" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="480.5" y="179.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480.5" dy="0">No recoger</tspan></text><rect x="423" y="221.5" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="480.5" y="246.6" font-size="15" text-anchor="middle" fo