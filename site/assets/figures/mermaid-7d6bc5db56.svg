<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 662 624" width="662" height="624" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Instrucciones y comprobador», «Permisos y confinamiento» y «Pruebas protegidas» … «Escalar con la traza»</title><desc id="d">Diagrama de flujo con 10 pasos. «Instrucciones y comprobador» lleva a «Bucle del agente». «Permisos y confinamiento» lleva a «Bucle del agente». «Pruebas protegidas» lleva a «Bucle del agente». «Bucle del agente» lleva a «Terminar: ¿verificación en verde?». «Terminar: ¿verificación en verde?» lleva a «¿Sin progreso?» (no). «¿Sin progreso?» lleva a «Bucle del agente» (no). «¿Sin progreso?» lleva a «Escalar con la traza» (sí). «Terminar: ¿verificación en verde?» lleva a «Aceptar» (sí). «Bucle del agente» lleva a «Traza». «Traza» lleva a «Evaluación y regresión».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="662" height="624" fill="#ffffff"/><path d="M165.2,83 L165.2,103.0 Q165.2,112 174.2,112.0 L345.1,112.0 Q354.1,112 354.1,121.0 L354.1,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M351.9,83 L351.9,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M547.2,74.5 L547.2,98.8 Q547.2,107.8 538.2,107.8 L363.1,107.8 Q354.1,107.8 354.1,116.8 L354.1,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M354.1,185 L354.1,205.0 Q354.1,214 345.1,214.0 L265.4,214.0 Q256.4,214 256.4,223.0 L256.4,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M256.4,363 L256.4