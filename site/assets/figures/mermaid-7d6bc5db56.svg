chor="middle" font-weight="400" fill="#0b3f45"><tspan x="547.2" dy="0">Pruebas protegidas</tspan></text><polygon points="256.4,243 345.9,303 256.4,363 166.9,303" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="256.4" y="288" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="256.4" dy="0">Terminar:</tspan><tspan x="256.4" dy="19.2">¿verificación en</tspan><tspan x="256.4" dy="19.2">verde?</tspan></text><polygon points="134,421 230,452 134,483 38,452" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="134" y="456.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="134" dy="0">¿Sin progreso?</tspan></text><rect x="62.1" y="541" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="137.1" y="566.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="137.1" dy="0">Escalar con la</tspan><tspan x="137.1" dy="19.2">traza</tspan></text><rect x="264" y="430" width="89" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="308.5" y="456.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="308.5" dy="0">Aceptar</tspan></text><rect x="379.9" y="281" width="76" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="417.9" y="307.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="417.9" dy="0">Traza</tspan></text><rect x="387" y="421.5" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="453.5" y="446.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="453.5" dy="0">Evaluación y</tspan><tspan x="453.5" dy="19.2">regresión</tspan></text><rect x="140" y="388" width="29" height="24" rx="4" fill="#ffffff"/><text x="154.5" y="403.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="154.5" dy="0">no</tspan></text><rect x="30" y="295