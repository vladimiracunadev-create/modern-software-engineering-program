<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 564" width="860" height="564" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Falla del catálogo» … «Controles: alcance, aborto, privilegios, auditoría»</title><desc id="d">Diagrama de flujo con 7 pasos. «Falla del catálogo» lleva a «¿En qué capa se produce?». «¿En qué capa se produce?» lleva a «Proxy: Toxiproxy, tc/netem» (conexión). «¿En qué capa se produce?» lleva a «Orquestador: Chaos Mesh, LitmusChaos» (contenedor y nodo). «¿En qué capa se produce?» lleva a «Servicio gestionado: AWS FIS, Azure Chaos Studio» (recurso de nube). «¿En qué capa se produce?» lleva a «Terminación al azar: Chaos Monkey» (instancia). «Proxy: Toxiproxy, tc/netem» lleva a «Controles: alcance, aborto, privilegios, auditoría». «Orquestador: Chaos Mesh, LitmusChaos» lleva a «Controles: alcance, aborto, privilegios, auditoría». «Servicio gestionado: AWS FIS, Azure Chaos Studio» lleva a «Controles: alcance, aborto, privilegios, auditoría». «Terminación al azar: Chaos Monkey» lleva a «Controles: alcance, aborto, privilegios, auditoría».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="860" height="564" fill="#ffffff"/><path d="M428.8,66 L428.8,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M428.8,210 L428.8,218.0 Q428.8,226 420.8,226.0 L119.0,226.0 Q110,226 110.0,235.0 L110,305" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M428.8,210 L428.8,218.0 Q428.8,226 420.8,226.0 L333.5,226.0 Q324.5,226 324.5,235.0 L324.5,305" fill="none" stroke="#32505f" st