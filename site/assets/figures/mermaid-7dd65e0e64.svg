<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 758 742" width="758" height="742" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Esquema v1» … «Registro de esquemas verifica en CI»</title><desc id="d">Diagrama de flujo con 12 pasos. «Esquema v1» lleva a «Cambio propuesto». «Cambio propuesto» lleva a «¿Compatible?». «¿Compatible?» lleva a «Hacia atrás» (nuevo lee viejos). «¿Compatible?» lleva a «Hacia adelante» (viejo lee nuevos). «¿Compatible?» lleva a «Completa» (ambos). «¿Compatible?» lleva a «Incompatible: fases expandir-migrar-contraer» (ninguno). «Hacia atrás» lleva a «Desplegar consumidores primero». «Hacia adelante» lleva a «Desplegar productores primero». «Completa» lleva a «Cualquier orden». «Incompatible: fases expandir-migrar-contraer» lleva a «Nuevo tópico o campo paralelo». «Desplegar consumidores primero» lleva a «Registro de esquemas verifica en CI». «Desplegar productores primero» lleva a «Registro de esquemas verifica en CI». «Cualquier orden» lleva a «Registro de esquemas verifica en CI».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="758" height="742" fill="#ffffff"/><path d="M343.3,66 L343.3,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M343.6,168 L343.6,226" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M343.9,288 L343.9,296.0 Q343.9,304 335.9,304.0 L95.6,304.0 Q86.6,304 86.6,313.0 L86.6,382" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M343.9,288 L343.9,296.0 Q343.9,304 335.9,304.0 L266.6,304.0 Q257.6,304 257.6,313.0 L257.6,382" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M343.9,288 L343.9,296.0 Q343.9,304 351.9,304.0 L406.6,304.0 Q415.6,304 415.6,313.0 L415.6,382" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M343.9,288 L343.9,296.0 Q343.9,304 351.9,304.0 L608.1,304.0 Q617.1,304 617.1,313.0 L617.1,364" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M87.5,426 L87.5,502" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M254.3,426 L254.3,502" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M415.6,426 L415.6,467.6 Q415.6,473 421.1,473.0 L421.1,473.0 Q426.5,473 426.5,478.4 L426.5,520" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M616,444 L616,511.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M88.5,582 L88.5,602.0 Q88.5,611 97.5,611.0 L247.0,611.0 Q256,611 256.0,620.0 L256,640" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M253.5,582 L253.5,640" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M426.5,564 L426.5,593.0 Q426.5,602 417.5,602.0 L265.0,602.0 Q256,602 256.0,611.0 L256,640" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="285.8" y="22" width="115" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="343.3" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="343.3" dy="0">Esquema v1</tspan></text><rect x="259.3" y="124" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="343.3" y="150.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="343.3" dy="0">Cambio propuesto</tspan></text><polygon points="343.9,226 426.9,257 343.9,288 260.9,257" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="343.9" y="261.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="343.9" dy="0">¿Compatible?</tspan></text><rect x="24.6" y="382" width="124" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="86.6" y="408.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="86.6" dy="0">Hacia atrás</tspan></text><rect x="182.6" y="382" width="150" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="257.6" y="408.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="257.6" dy="0">Hacia adelante</tspan></text><rect x="366.6" y="382" width="98" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="415.6" y="408.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="415.6" dy="0">Completa</tspan></text><rect x="498.6" y="364" width="237" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="617.1" y="389" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="617.1" dy="0">Incompatible:</tspan><tspan x="617.1" dy="19.2">fases</tspan><tspan x="617.1" dy="19.2">expandir-migrar-contraer</tspan></text><rect x="22" y="502" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="88.5" y="527" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="88.5" dy="0">Desplegar</tspan><tspan x="88.5" dy="19.2">consumidores</tspan><tspan x="88.5" dy="19.2">primero</tspan></text><rect x="189" y="502" width="124" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="251" y="527" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="251" dy="0">Desplegar</tspan><tspan x="251" dy="19.2">productores</tspan><tspan x="251" dy="19.2">primero</tspan></text><rect x="347" y="520" width="159" height="44" rx="10" fill="#dff1ee" stroke="