<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 683 568" width="683" height="568" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Aplicación», «Aplicación aislada» y «Proceso Linux» … «Hipervisor/anfitrión»</title><desc id="d">Diagrama de flujo con 8 pasos. «Aplicación» lleva a «Kernel invitado». «Kernel invitado» lleva a «Hipervisor/anfitrión». «Aplicación aislada» lleva a «Kernel compartido». «Kernel compartido» lleva a «Hipervisor/anfitrión». «Proceso Linux» lleva a «Kernel Linux administrado». «Kernel Linux administrado» lleva a «Integración con Windows». «Integración con Windows» lleva a «Hipervisor/anfitrión».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="683" height="568" fill="#ffffff"/><rect x="22" y="22" width="191" height="234.5" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="36" y="44" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="36" dy="0">Máquina virtual</tspan></text><rect x="237.9" y="22" width="217" height="234.5" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="251.9" y="44" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="251.9" dy="0">Contenedor</tspan></text><rect x="465.9" y="22" width="195" height="392" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="479.9" y="44" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="479.9" dy="0">WSL 2</tspan></tex