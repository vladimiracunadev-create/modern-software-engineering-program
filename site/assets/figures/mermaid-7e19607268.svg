<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 166" width="822" height="166" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Propuesta de valor» … «Valor percibido y cambio»</title><desc id="d">Diagrama de flujo con 5 pasos. «Propuesta de valor» lleva a «Resultados deseados». «Resultados deseados» lleva a «Oportunidad y ranking». «Oportunidad y ranking» lleva a «Indicadores y demora». «Indicadores y demora» lleva a «Valor percibido y cambio». «Valor percibido y cambio» lleva a «Propuesta de valor» (fallo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="822" height="166" fill="#ffffff"/><path d="M129,104 L175,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M290,104 L336,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M460,104 L506,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M630,104 L676,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M738,64 L738.0,57.0 Q738,50 731.0,50.0 L84.5,50.0 Q75.5,50 75.5,59.0 L75.5,73.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="73.5" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="75.5" y="98.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="75.5" dy="0">Propuesta</tspan><tspan x="75.5" dy="19.2">de valor</tspan></text><rect x="175" y="73.5" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="232.5" y="98.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="232.5" dy="0">Resultados</tspan><tspan x="232.5" dy="19.2">deseados</tspan></text><rect x="336" y="73.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="398" y="98.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="398" dy="0">Oportunidad</tspan><tspan x="398" dy="19.2">y ranking</tspan></text><rect x="506" y="73.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="568" y="98.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="568" dy="0">Indicadores</tspan><tspan x="568" dy="19.2">y demora</tspan></text><rect x="676" y="64" width="124" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="738" y="89" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="738" dy="0">Valor</tspan><tspan x="738" dy="19.2">percibido y</tspan><tspan x="738" dy="19.2">cambio</tspan></text><rect x="343.8" y="22" width="126" height="24" rx="4" fill="#ffffff"/><text x="406.8" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="406.8" dy="0">fallo o cambio</tspan></text></svg>
