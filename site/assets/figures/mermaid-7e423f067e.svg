<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 928 428" width="928" height="428" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Evento real: servidor cae, disco se llena, reloj se desfasa» … «Hipótesis y experimento»</title><desc id="d">Diagrama de flujo con 10 pasos. «Evento real: servidor cae, disco se llena, reloj se desfasa» lleva a «Mecanismo de falla». «Mecanismo de falla» lleva a «Red». «Mecanismo de falla» lleva a «Recursos». «Mecanismo de falla» lleva a «Dependencias». «Mecanismo de falla» lleva a «Reloj». «Mecanismo de falla» lleva a «Discos». «Mecanismo de falla» lleva a «Procesos». «Red» lleva a «Huella en las señales». «Recursos» lleva a «Huella en las señales». «Dependencias» lleva a «Huella en las señales». «Reloj» lleva a «Huella en las señales». «Discos» lleva a «Huella en las señales». «Procesos» lleva a «Huella en las señales». «Huella en las señales» lleva a «Hipótesis y experimento».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="928" height="428" fill="#ffffff"/><path d="M190,214 L236,214" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M369,214 L397.2,214.0 Q406.2,214 406.2,205.0 L406.2,53.0 Q406.2,44 415.2,44.0 L443.5,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M369,214 L391.8,214.0 Q400.8,214 400.8,205.0 L400.8,121.0 Q400.8,112 409.8,112.0 L432.5,112" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M369,214 L383.0,214.0 Q392,214 392.0,205.0 L392.0,189.0 Q392,180 401.0,180.0 L415,180" fill="none" stroke="#325