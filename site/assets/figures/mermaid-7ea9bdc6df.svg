<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 893 803" width="893" height="803" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Nueva responsabilidad» … «Variaciones protegidas»</title><desc id="d">Diagrama de flujo con 11 pasos. «Nueva responsabilidad» lleva a «¿Quién tiene los datos?». «¿Quién tiene los datos?» lleva a «Experto en información». «Nueva responsabilidad» lleva a «¿Quién crea el objeto?». «¿Quién crea el objeto?» lleva a «Creador». «Nueva responsabilidad» lleva a «¿Quién recibe el evento externo?». «¿Quién recibe el evento externo?» lleva a «Controlador». «Experto en información» lleva a «¿Sube el acoplamiento o baja la cohesión?». «Creador» lleva a «¿Sube el acoplamiento o baja la cohesión?». «Controlador» lleva a «¿Sube el acoplamiento o baja la cohesión?». «¿Sube el acoplamiento o baja la cohesión?» lleva a «Indirección, Fabricación pura, Polimorfismo» (sí). «¿Sube el acoplamiento o baja la cohesión?» lleva a «Asignación estable» (no). «Indirección, Fabricación pura, Polimorfismo» lleva a «Variaciones protegidas».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="893" height="803" fill="#ffffff"/><path d="M446.5,83 L446.5,103.0 Q446.5,112 437.5,112.0 L166.5,112.0 Q157.5,112 157.5,121.0 L157.5,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M157.5,227 L157.5,247.0 Q157.5,256 166.5,256.0 L284.1,256.0 Q293.1,256 293.1,265.0 L293.1,285" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M446.5,83 L446.5,141" fill="none" stroke="#32505f" stroke-width="1.8" marker