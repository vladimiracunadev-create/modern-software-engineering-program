<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 438 598" width="438" height="598" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Enlace o escritura» … «URL nueva»</title><desc id="d">Diagrama de flujo con 7 pasos. «Enlace o escritura» lleva a «Análisis de la URL». «Análisis de la URL» lleva a «Normalización». «Normalización» lleva a «Resolución de ruta». «Resolución de ruta» lleva a «Vista con estado». «Vista con estado» lleva a «URL nueva» (pushState). «URL nueva» lleva a «Enlace o escritura». «Resolución de ruta» lleva a «Redirección o 404» (sin ruta).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="438" height="598" fill="#ffffff"/><path d="M282.2,66 L282.2,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M282.2,168 L282.2,189.3 Q282.2,197 274.5,197.0 L274.5,197.0 Q266.8,197 266.8,204.7 L266.8,226" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M266.8,270 L266.8,290.0 Q266.8,299 257.8,299.0 L251.4,299.0 Q242.4,299 242.4,308.0 L242.4,328" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M242.4,372 L242.4,392.0 Q242.4,401 233.4,401.0 L131.0,401.0 Q122,401 122.0,410.0 L122,430" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M124.9,474 L124.9,532" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M242.4,372 L242.4,380.0 Q242.4,388 250.4,388.0 L319.0,388.0 Q328,388 328.0,397.0 L328,430" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M74.3,554 L33.0,554.0 Q24,554 24.0,545.0 L24.0,53.0 Q24,44 33.0,44.0 L189.7,44" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="189.7" y="22" width="185" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="282.2" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="282.2" dy="0">Enlace o escritura</tspan></text><rect x="189.7" y="124" width="185" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="282.2" y="150.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="282.2" dy="0">Análisis de la URL</tspan></text><rect x="195.8" y="226" width="142" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="266.8" y="252.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="266.8" dy="0">Normalización</tspan></text><rect x="149.9" y="328" width="185" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="242.4" y="354.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="242.4" dy="0">Resolución de ruta</tspan></text><rect x="38" y="430" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="122" y="456.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="122" dy="0">Vista con estado</tspan></text><rect x="74.3" y="532" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="127.8" y="558.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="127.8" dy="0">URL nueva</tspan></text><rect x="240" y="430" width="176" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="328" y="456.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="328" dy="0">Redirección o 404</tspan></text><rect x="130.9" y="491" width="86"