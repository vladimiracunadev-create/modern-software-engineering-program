<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 833 343" width="833" height="343" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Base común» … «Decisión humana»</title><desc id="d">Diagrama de flujo con 9 pasos. «Base común» lleva a «Rama A». «Base común» lleva a «Rama B». «Rama A» lleva a «Integrar». «Rama B» lleva a «Integrar». «Integrar» lleva a «Commit de fusión» (fusión). «Integrar» lleva a «Commits reescritos» (rebase). «Integrar» lleva a «Un commit nuevo» (squash). «Integrar» lleva a «Conflicto» (mismo sitio). «Conflicto» lleva a «Decisión humana».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="833" height="343" fill="#ffffff"/><path d="M137,171.5 L151.0,171.5 Q160,171.5 160.0,162.5 L160.0,146.5 Q160,137.5 169.0,137.5 L183,137.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M137,171.5 L151.0,171.5 Q160,171.5 160.0,180.5 L160.0,196.5 Q160,205.5 169.0,205.5 L183,205.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M264,137.5 L278.0,137.5 Q287,137.5 287.0,146.5 L287.0,162.5 Q287,171.5 296.0,171.5 L310,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M264,205.5 L278.0,205.5 Q287,205.5 287.0,196.5 L287.0,180.5 Q287,171.5 296.0,171.5 L310,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M426,171.5 L434.0,171.5 Q442,171.5 442.0,163.5 L442.0,61.5 Q442,52.5 451.0,52.5 L556,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M426,171.5 L434.0,171.5 Q442,171