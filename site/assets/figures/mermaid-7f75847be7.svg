<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Necesidad» … «Ejecutar salida o renegociar»</title><desc id="d">Diagrama de flujo con 9 pasos. «Necesidad» lleva a «Construir comprar o adoptar». «Construir comprar o adoptar» lleva a «Requisitos que descartan». «Requisitos que descartan» lleva a «Evaluación ponderada de los que quedan». «Evaluación ponderada de los que quedan» lleva a «Prueba de sensibilidad de pesos». «Prueba de sensibilidad de pesos» lleva a «Costo total con alzas y salida». «Costo total con alzas y salida» lleva a «Disponibilidad compuesta y contrato». «Disponibilidad compuesta y contrato» lleva a «Decisión con plan de salida». «Decisión con plan de salida» lleva a «Ejecutar salida o renegociar» (el proveedor cambia). «Ejecutar salida o renegociar» lleva a «Construir comprar o adoptar».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="720" height="440" fill="#ffffff"/><path d="M155,82 L227,82" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M396,82 L539,82" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M614,112.5 L614,200" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M530,240 L391,240" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M232,240 L181,240" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M101.5,270.5 L101.5,338" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M176.5,378 L236.5,378" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M386.5,378 L534.5,378" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M614,347.5 L614.0,303.0 Q614,294 605.0,294.0 L409.5,294.0 Q400.5,294 400.5,285.0 L400.5,165.0 Q400.5,156 391.5,156.0 L318.5,156.0 Q311.5,156 311.5,149.0 L311.5,142" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="48" y="60" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101.5" y="86.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101.5" dy="0">Necesidad</tspan></text><polygon points="311.5,22 396,82 311.5,142 227,82" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="311.5" y="67" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="311.5" dy="0">Construir</tspan><tspan x="311.5" dy="19.2">comprar o</tspan><tspan x="311.5" dy="19.2">adoptar</tspan></text><rect x="539" y="51.5" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="614" y="76.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="614" dy="0">Requisitos que</tspan><tspan x="614" dy="19.2">descartan</tspan></text><rect x="530" y="200" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="614" y="225" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="614" dy="0">Evaluación</tspan><tspan x="614" dy="19.2">ponderada de los</tspan><tspan x="614" dy="19.2">que quedan</tspan></text><rect x="232" y="200" width="159" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="311.5" y="225" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="311.5" dy="0">Prueba de</tspan><tspan x="311.5" dy="19.2">sensibilidad de</tspan><tspan x="311.5" dy="19.2">pesos</tspan></text><rect x="22" y="209.5" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101.5" y="234.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101.5" dy="0">Costo total con</tspan><tspan x="101.5" dy="19.2">alzas y salida</tspan></text><rect x="26.5" y="338" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101.5" y="363" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101.5" dy="0">Disponibilidad</tspan><tspan x="101.5" dy="19.2">compuesta y</tspan><tspan x="101.5" dy="19.2">contrato</tspan></text><rect x="236.5" y="347.5" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="311.5" y="372.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="311.5" dy="0">Decisión con</tspan><tspan x="311.5" dy="19.2">plan de salida</tspan></text><rect x="534.5" y="347.5" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="614" y="372.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="614" dy="0">Ejecutar salida</tspan><tspan x="614" dy="19.2">o renegociar</tspan></text><rect x="405.5" y="332" width="110" height="42" rx="4" fill="#ffffff"/><text x="460.5" y="347.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="460.5" dy="0">el proveedor</tspan><tspan x="460.5" dy="17.92">cambia</tspan></text></svg>
