<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 648 224" width="648" height="224" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Evento y esquema» … «Control técnico y pruebas»</title><desc id="d">Diagrama de flujo con 5 pasos. «Evento y esquema» lleva a «Consentimiento y estado». «Consentimiento y estado» lleva a «Minimización e identificabilidad». «Minimización e identificabilidad» lleva a «Sesgo por quién consiente». «Sesgo por quién consiente» lleva a «Control técnico y pruebas». «Control técnico y pruebas» lleva a «Evento y esquema» (un defecto o un campo nuevo).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="648" height="224" fill="#ffffff"/><path d="M190,52.5 L236,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M404,52.5 L450,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M538,83 L538,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M458.5,171.5 L399.5,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M240.5,171.5 L115.0,171.5 Q106,171.5 106.0,162.5 L106,74.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="30.5" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Evento y esquema</tspan></text><rect x="236" y="22" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="320" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="320" dy="0">Consentimiento y</tspan><tspan x="320" dy="19.2">estado</tspan></text><rect x="450" y="22" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="538" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="538" dy="0">Minimización e</tspan><tspan x="538" dy="19.2">identificabilidad</tspan></text><rect x="458.5" y="141" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="538" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="538" dy="0">Sesgo por quién</tspan><tspan x="538" dy="19.2">consiente</tspan></text><rect x="240.5" y="141" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="320" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="320" dy="0">Control técnico</tspan><tspan x="320" dy="19.2">y pruebas</tspan></text><rect x="110.2" y="125.5" width="126" height="42" rx="4" fill="#ffffff"/><text x="173.2" y="141.4" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="173.2" dy="0">un defecto o</tspan><tspan x="173.2" dy="17.92">un campo nuevo</tspan></text></svg>
