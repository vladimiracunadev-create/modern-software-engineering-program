<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 755 1024" width="755" height="1024" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Tareas del módulo» … «Decisión con incertidumbre»</title><desc id="d">Diagrama de flujo con 13 pasos. «Tareas del módulo» lleva a «Criterio ejecutable». «Criterio ejecutable» lleva a «Conjunto de desarrollo». «Criterio ejecutable» lleva a «Conjunto reservado». «Conjunto de desarrollo» lleva a «Ajustar configuración». «Ajustar configuración» lleva a «Ejecutar eval». «Conjunto reservado» lleva a «Ejecutar eval». «Ejecutar eval» lleva a «Tasa de éxito con intervalo». «Ejecutar eval» lleva a «Costo por intento». «Ejecutar eval» lleva a «Latencia». «Tasa de éxito con intervalo» lleva a «Costo por solución aceptada». «Costo por intento» lleva a «Costo por solución aceptada». «Revisión humana» lleva a «Costo por solución aceptada». «Costo por solución aceptada» lleva a «Frontera de Pareto». «Latencia» lleva a «Frontera de Pareto». «Frontera de Pareto» lleva a «Decisión con incertidumbre».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="755" height="1024" fill="#ffffff"/><path d="M533.5,66 L533.5,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M533.5,185 L533.5,205.0 Q533.5,214 524.5,214.0 L429.9,214.0 Q420.9,214 420.9,223.0 L420.9,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M533.5,185 L533.5,209.2 Q533.5,218.2 542.5,218.2 L600.4,218.2 Q609.4,218.2 609.4,227.2 L609.4,251.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arro