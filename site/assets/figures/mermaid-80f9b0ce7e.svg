<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 633 944" width="633" height="944" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Inyectar falla» … «Postmortem y acciones»</title><desc id="d">Diagrama de flujo con 11 pasos. «Inyectar falla» lleva a «Monitores: validación, PSI, puntaje, etiquetas». «Monitores: validación, PSI, puntaje, etiquetas» lleva a «¿Alerta?». «¿Alerta?» lleva a «Brecha de monitoreo» (no). «¿Alerta?» lleva a «Diagnóstico por runbook» (sí). «Diagnóstico por runbook» lleva a «Causa». «Causa» lleva a «Corregir la conversión o bloquear el lote» (entrada). «Causa» lleva a «Rollback al modelo anterior» (modelo). «Causa» lleva a «Reentrenar con ventana reciente» (mundo). «Corregir la conversión o bloquear el lote» lleva a «Verificar métrica». «Rollback al modelo anterior» lleva a «Verificar métrica». «Reentrenar con ventana reciente» lleva a «Verificar métrica». «Verificar métrica» lleva a «Postmortem y acciones». «Brecha de monitoreo» lleva a «Postmortem y acciones».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="633" height="944" fill="#ffffff"/><path d="M283.5,66 L283.5,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M287,204 L287,262" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M290.6,324 L290.6,332.0 Q290.6,340 282.6,340.0 L221.8,340.0 Q212.8,340 212.8,349.0 L212.8,382" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M290.6,324 L290.6,332.0 Q290.6,340 298.6,340.0 L370.8,340.0 Q379.8,340 379.8,349.0 L379.8,382" fil