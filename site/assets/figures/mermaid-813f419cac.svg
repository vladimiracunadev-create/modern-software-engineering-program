<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 671 704" width="671" height="704" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Intención» … «Deriva»</title><desc id="d">Diagrama de flujo con 9 pasos. «Intención» lleva a «Especificación: qué y por qué». «Especificación: qué y por qué» lleva a «Plan: cómo». «Plan: cómo» lleva a «Tareas». «Tareas» lleva a «Código y pruebas». «Código y pruebas» lleva a «Especificación: qué y por qué» (evidencia). «Especificación: qué y por qué» lleva a «Ambigüedad». «Ambigüedad» lleva a «Un comportamiento» (resuelta antes). «Ambigüedad» lleva a «Muchos comportamientos» (sin resolver). «Muchos comportamientos» lleva a «Código y pruebas» (el agente elige). «Código y pruebas» lleva a «Deriva» (cambio sin actualizar la especificación). «Deriva» lleva a «Especificación: qué y por qué».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="671" height="704" fill="#ffffff"/><path d="M305.3,66 L305.3,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M305.3,185 L305.3,209.5 Q305.3,218.5 296.3,218.5 L238.2,218.5 Q229.2,218.5 229.2,227.5 L229.2,252" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M229.2,296 L229.2,324.8 Q229.2,333.8 220.2,333.8 L177.5,333.8 Q168.5,333.8 168.5,342.8 L168.5,371.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M168.5,415.5 L168.5,448.8 Q168.5,457.8 177.5,457.8 L335.2,457.8 Q344.2,457.8 344.2,466.8 L344.2,500" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M