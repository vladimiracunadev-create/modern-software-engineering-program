ght="400" fill="#142231"><tspan x="262" dy="0">resuelta antes</tspan></text><rect x="538.5" y="330" width="110" height="24" rx="4" fill="#ffffff"/><text x="593.5" y="345.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="593.5" dy="0">sin resolver</tspan></text><rect x="350.2" y="449" width="86" height="42" rx="4" fill="#ffffff"/><text x="393.2" y="464.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="393.2" dy="0">el agente</tspan><tspan x="393.2" dy="17.92">elige</tspan></text><rect x="210.1" y="561" width="126" height="60" rx="4" fill="#ffffff"/><text x="273.1" y="576.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="273.1" dy="0">cambio sin</tspan><tspan x="273.1" dy="17.92">actualizar la</tspan><tspan x="273.1" dy="17.92">especificación</tspan></text></svg>
