1060.0 Q505.5,1069 496.5,1069.0 L466,1069" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="179" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101.5" y="204.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101.5" dy="0">Información del</tspan><tspan x="101.5" dy="19.2">módulo</tspan></text><polygon points="408.5,22 491.5,53 408.5,84 325.5,53" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="408.5" y="57.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="408.5" dy="0">Sensibilidad</tspan></text><rect x="324.5" y="707" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="408.5" y="732.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="408.5" dy="0">Filtro previo al</tspan><tspan x="408.5" dy="19.2">envío</tspan></text><rect x="359.5" y="554" width="98" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="408.5" y="580.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="408.5" dy="0">Se envía</tspan></text><rect x="22" y="758" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101.5" y="783.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101.5" dy="0">Se redacta o se</tspan><tspan x="101.5" dy="19.2">bloquea</tspan></text><rect x="63.5" y="843" width="76" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101.5" y="869.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101.5" dy="0">Fuga</tspan></text><rect x="44" y="264" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101.5" y="289.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101.5" dy="0">Salida del</tspan><tspan x