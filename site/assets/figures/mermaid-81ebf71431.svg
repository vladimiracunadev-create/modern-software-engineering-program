<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 681 1113" width="681" height="1113" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Información del módulo» y «Salida del asistente» … «Se redacta o se bloquea» y «Fuga»</title><desc id="d">Diagrama de flujo con 15 pasos. «Información del módulo» lleva a «Sensibilidad». «Sensibilidad» lleva a «Filtro previo al envío» (secreto o dato personal). «Sensibilidad» lleva a «Se envía» (público o sintético). «Filtro previo al envío» lleva a «Se redacta o se bloquea» (detecta). «Filtro previo al envío» lleva a «Fuga» (no detecta). «Salida del asistente» lleva a «Análisis estático y revisión». «Análisis estático y revisión» lleva a «Se rechaza o corrige» (patrón inseguro). «Análisis estático y revisión» lleva a «Vulnerabilidad integrada» (no detecta). «Salida del asistente» lleva a «Parecido con corpus con licencia». «Parecido con corpus con licencia» lleva a «Investigar procedencia» (alto). «Parecido con corpus con licencia» lleva a «Se registra y se integra» (bajo). «Salida del asistente» lleva a «Dependencias nuevas». «Dependencias nuevas» lleva a «Se rechaza» (inexistente o no verificada).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="681" height="1113" fill="#ffffff"/><path d="M181,209.5 L244.2,209.5 Q253.2,209.5 253.2,200.5 L253.2,62.0 Q253.2,53 262.2,53.0 L325.5,53" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M491.5,53 L517.5,53.0 Q526.5,53 526.5,62.0 L526.5,728.5 Q526.5,737.5 517.5,737.5 L492.5,737.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="u