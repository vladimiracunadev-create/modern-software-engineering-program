<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 807 757" width="807" height="757" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Inventario criptográfico» … «Despliegue gradual con retroceso»</title><desc id="d">Diagrama de flujo con 10 pasos. «Inventario criptográfico» lleva a «Primitiva». «Primitiva» lleva a «ML-KEM, en híbrido con X25519» (acuerdo de claves). «Primitiva» lleva a «ML-DSA o SLH-DSA» (firma). «Primitiva» lleva a «Claves de 256 bits y resúmenes largos» (simétrico y resumen). «Inventario criptográfico» lleva a «Vida útil de los datos». «Vida útil de los datos» lleva a «Prioridad alta: cosechar ahora, descifrar después» (larga). «Vida útil de los datos» lleva a «Prioridad menor» (corta). «ML-KEM, en híbrido con X25519» lleva a «Probar tamaños: saludos, certificados, límites». «ML-DSA o SLH-DSA» lleva a «Probar tamaños: saludos, certificados, límites». «Probar tamaños: saludos, certificados, límites» lleva a «Despliegue gradual con retroceso».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="807" height="757" fill="#ffffff"/><path d="M436.1,83 L436.1,109.0 Q436.1,118 427.1,118.0 L298.1,118.0 Q289.1,118 289.1,127.0 L289.1,153" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M289.1,215 L289.1,223.0 Q289.1,231 281.1,231.0 L93.0,231.0 Q84,231 84.0,240.0 L84,322" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M289.1,215 L289.1,223.0 Q289.1,231 281.1,231.0 L238.0,231.0 Q229,231 229.0,240.0 L229,331.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arro