tamaños:</tspan><tspan x="168" dy="19.2">saludos,</tspan><tspan x="168" dy="19.2">certificados,</tspan><tspan x="168" dy="19.2">límites</tspan></text><rect x="117.4" y="655" width="124" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="179.4" y="680" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="179.4" dy="0">Despliegue</tspan><tspan x="179.4" dy="19.2">gradual con</tspan><tspan x="179.4" dy="19.2">retroceso</tspan></text><rect x="90" y="255.5" width="94" height="42" rx="4" fill="#ffffff"/><text x="137" y="271.4" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="137" dy="0">acuerdo de</tspan><tspan x="137" dy="17.92">claves</tspan></text><rect x="235" y="269.2" width="53" height="24" rx="4" fill="#ffffff"/><text x="261.5" y="285.1" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="261.5" dy="0">firma</tspan></text><rect x="389" y="250.8" width="102" height="42" rx="4" fill="#ffffff"/><text x="440" y="266.7" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="440" dy="0">simétrico y</tspan><tspan x="440" dy="17.92">resumen</tspan></text><rect x="569" y="261" width="53" height="24" rx="4" fill="#ffffff"/><text x="595.5" y="276.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="595.5" dy="0">larga</tspan></text><rect x="731.5" y="275.2" width="53" height="24" rx="4" fill="#ffffff"/><text x="758" y="291.1" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="758" dy="0">corta</tspan></text></svg>
