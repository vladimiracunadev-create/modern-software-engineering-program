<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 753" width="304" height="753" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Manifiesto con huellas» … «Prueba»</title><desc id="d">Diagrama de flujo con 8 pasos. «Intención» lleva a «Requisito». «Requisito» lleva a «Contrato». «Contrato» lleva a «Ejemplo». «Contrato» lleva a «Prueba». «Ejemplo» lleva a «Prueba». «Validador» lleva a «Intención» (enlaces, tipos, ciclos, huellas). «Validador» lleva a «Requisito». «Validador» lleva a «Contrato». «Validador» lleva a «Ejemplo». «Validador» lleva a «Prueba». «Manifiesto con huellas» lleva a «Validador». «Cambio» lleva a «Requisito» (alcance).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="304" height="753" fill="#ffffff"/><path d="M96.8,323 L96.8,343.0 Q96.8,352 105.8,352.0 L165.6,352.0 Q174.6,352 174.6,361.0 L174.6,381" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M174.6,425 L174.6,448.7 Q174.6,454 179.9,454.0 L179.9,454.0 Q185.2,454 185.2,459.3 L185.2,483" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M188.9,527 L188.9,585" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M234.2,505 L242.3,505.0 Q250.5,505 250.5,513.1 L250.5,702.0 Q250.5,709 243.5,709.0 L236.5,709" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M194.3,629 L194.3,687" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M113,185 L113.0,193.0 Q113,201 105.0,201.0 L104.9,201.0 Q96.8,201 96.8,209.1 L96.8,279" fil