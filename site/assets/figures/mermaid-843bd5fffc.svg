eight="400" fill="#0b3f45"><tspan x="168.6" dy="0">Cambio propuesto</tspan><tspan x="168.6" dy="19.2">por el agente</tspan></text><rect x="93.6" y="141" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="168.6" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="168.6" dy="0">Clasificar por</tspan><tspan x="168.6" dy="19.2">riesgo</tspan></text><rect x="22" y="260" width="76" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="60" y="286.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="60" dy="0">Bajo</tspan></text><rect x="132" y="260" width="76" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="170" y="286.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="170" dy="0">Medio</tspan></text><rect x="242" y="260" width="76" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="280" y="286.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="280" dy="0">Alto</tspan></text><rect x="112.6" y="362" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="174.6" y="387.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="174.6" dy="0">Compuertas</tspan><tspan x="174.6" dy="19.2">automáticas</tspan></text><polygon points="196.2,481 247.7,512 196.2,543 144.7,512" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="196.2" y="516.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="196.2" dy="0">¿Pasan?</tspan></text><rect x="65.5" y="601.5" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="132" y="626.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="132" dy="0">Rechazar con</tspan><tspan x="132" dy="19.2">motivo</tspan></text><polygon points="284,601 335.5,632 284,663 232.5,632" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="284" y="636.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="284" dy="0">¿Nivel?</tspan></text><rect x="189.4" y="823" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="246.9" y="848.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="246.9" dy="0">Integrar y</tspan><tspan x="246.9" dy="19.2">registrar</tspan></text><rect x="184.2" y="721" width="159" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="263.7" y="747.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="263.7" dy="0">Revisión humana</tspan></text><rect x="145.6" y="942" width="185" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="238.1" y="968.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="238.1" dy="0">Medir en operación</tspan></text><rect x="138" y="568.2" width="29" height="24" rx="4" fill="#ffffff"/><text x="152.5" y="584.1" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="152.5" dy="0">no</tspan></text><rect x="290" y="568" width="29" height="24" rx="4" fill="#ffffff"/><text x="304.5" y="583.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="304.5" dy="0">sí</tspan></text><rect x="308.3" y="825.5" width="45" height="24" rx="4" fill="#ffffff"/><text x="330.8" y="841.4" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="330.8" dy="0">bajo</tspan></text><rect x="147.7" y="688" width="110" height="24" rx="4" fill="#ffffff"/><text x="202.7" y="703.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="202.7" dy="0">medio o alto</tspan></text></svg>
