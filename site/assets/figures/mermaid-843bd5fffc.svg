<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 1008" width="412" height="1008" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Cambio propuesto por el agente» … «Medir en operación»</title><desc id="d">Diagrama de flujo con 12 pasos. «Cambio propuesto por el agente» lleva a «Clasificar por riesgo». «Clasificar por riesgo» lleva a «Bajo». «Clasificar por riesgo» lleva a «Medio». «Clasificar por riesgo» lleva a «Alto». «Bajo» lleva a «Compuertas automáticas». «Medio» lleva a «Compuertas automáticas». «Alto» lleva a «Compuertas automáticas». «Compuertas automáticas» lleva a «¿Pasan?». «¿Pasan?» lleva a «Rechazar con motivo» (no). «¿Pasan?» lleva a «¿Nivel?» (sí). «¿Nivel?» lleva a «Integrar y registrar» (bajo). «¿Nivel?» lleva a «Revisión humana» (medio o alto). «Revisión humana» lleva a «Integrar y registrar». «Integrar y registrar» lleva a «Medir en operación». «Medir en operación» lleva a «Clasificar por riesgo».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="412" height="1008" fill="#ffffff"/><path d="M168.6,83 L168.6,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M168.6,202 L168.6,222.0 Q168.6,231 159.6,231.0 L69.0,231.0 Q60,231 60.0,240.0 L60,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M169.3,202 L169.3,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M168.6,202 L168.6,222.0 Q168.6,231 177.6,231.0 L271.0,231.0 Q280,231 280.0,240.0 L280,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><p