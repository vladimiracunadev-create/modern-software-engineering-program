<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 378 1015" width="378" height="1015" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Hallazgo: interno, externo o automático» … «Registro público: identificador y nota»</title><desc id="d">Diagrama de flujo con 9 pasos. «Hallazgo: interno, externo o automático» lleva a «Recepción y acuse». «Recepción y acuse» lleva a «Triaje: validar y reproducir». «Triaje: validar y reproducir» lleva a «Evaluación: gravedad, explotación, exposición». «Evaluación: gravedad, explotación, exposición» lleva a «Corrección o mitigación». «Corrección o mitigación» lleva a «Divulgación coordinada y aviso». «Divulgación coordinada y aviso» lleva a «Aprendizaje: caso de abuso y prueba». «Aprendizaje: caso de abuso y prueba» lleva a «Registro público: identificador y nota». «Triaje: validar y reproducir» lleva a «Respuesta al reportante» (inválido o duplicado).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="378" height="1015" fill="#ffffff"/><path d="M192.8,102 L192.8,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M192.8,204 L192.8,227.1 Q192.8,233 186.9,233.0 L186.9,233.0 Q181.1,233 181.1,238.9 L181.1,262" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M181.1,323 L181.1,352.0 Q181.1,361 172.1,361.0 L97.5,361.0 Q88.5,361 88.5,370.0 L88.5,399" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M88.5,498 L88.5,518.0 Q88.5,527 97.5,527.0 L108.5,527.0 Q117.5,527 117.5,536.0 L117.5,556" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M117.5,617 L117.5,637.0 Q117.5,646 126.5,646.0 L133.6,646.0 Q142.6,646 142.6,655.0 L142.6,675" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M142.6,736 L142.6,756.5 Q142.6,765 151.1,765.0 L151.1,765.0 Q159.5,765 159.5,773.5 L159.5,794" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M163.7,855 L163.7,913" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M181.1,323 L181.1,331.0 Q181.1,339 189.1,339.0 L246.5,339.0 Q255.5,339 255.5,348.0 L255.5,418" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="100.3" y="22" width="185" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="192.8" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="192.8" dy="0">Hallazgo: interno,</tspan><tspan x="192.8" dy="19.2">externo o</tspan><tspan x="192.8" dy="19.2">automático</tspan></text><rect x="104.8" y="160" width="176" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="192.8" y="186.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="192.8" dy="0">Recepción y acuse</tspan></text><rect x="93.1" y="262" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="181.1" y="287.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="181.1" dy="0">Triaje: validar y</tspan><tspan x="181.1" dy="19.2">reproducir</tspan></text><rect x="22" y="399" width="133" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="88.5" y="423.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="88.5" dy="0">Evaluación:</tspan><tspan x="88.5" dy="19.2">gravedad,</tspan><tspan x="88.5" dy="19.2">explotación,</tspan><tspan x="88.5" dy="19.2">exposición</tspan></text><rect x="51" y="556" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="117.5" y="581.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="117.5" dy="0">Corrección o</tspan><tspan x="117.5" dy="19.2">mitigación</tspan></text><rect x="50.1" y="675" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="142.6" y="700.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="142.6" dy="0">Divulgación</tspan><tspan x="142.6" dy="19.2">coordinada y aviso</tspan></text><rect x="71.5" y="794" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="159.5" y="819.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="159.5" dy="0">Aprendizaje: caso</tspan><tspan x="159.5" dy="19.2">de abuso y prueba</tspan></text><rect x="80" y="913" width="176" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="168" y="938" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="168" dy="0">Registro público:</tspan><tspan x="168" dy="19.2">identificador y</tspan><tspan x="168" dy="19.2">nota</tspan></text><rect x="189" y="418" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="255.5" y="443.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="255.5" dy="0">Respuesta al</tspan><tspan x="255.5" dy="19.2">reportante</tspan></text><rect x="261.5" y="357.5" width="94" height="42" rx="4" fill="#ffffff"/><text x="308.5" y="373.4" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="308.5" dy="0">inválido o</tspan><tspan x="308.5" dy="17.92">duplicado</tspan></text></svg>
