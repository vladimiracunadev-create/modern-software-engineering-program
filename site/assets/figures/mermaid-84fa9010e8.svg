<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 475 875" width="475" height="875" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Fuentes revisadas» y «Entorno: herramientas, variables, hora, ruta» … «Declarar o neutralizar la entrada»</title><desc id="d">Diagrama de flujo con 8 pasos. «Fuentes revisadas» lleva a «Build: transforma entradas declaradas». «Entorno: herramientas, variables, hora, ruta» lleva a «Build: transforma entradas declaradas» (si se filtra). «Build: transforma entradas declaradas» lleva a «Artefacto y huella». «Artefacto y huella» lleva a «Otra persona, otro sistema: misma huella?». «Otra persona, otro sistema: misma huella?» lleva a «Reproducible: se puede verificar» (sí). «Otra persona, otro sistema: misma huella?» lleva a «Comparar por archivo y localizar la entrada que difiere» (no). «Comparar por archivo y localizar la entrada que difiere» lleva a «Declarar o neutralizar la entrada». «Declarar o neutralizar la entrada» lleva a «Build: transforma entradas declaradas».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="475" height="875" fill="#ffffff"/><path d="M110,93.5 L110.0,127.2 Q110,136.2 119.0,136.2 L204.0,136.2 Q213,136.2 213.0,145.2 L213,179" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M316,121 L316.0,129.0 Q316,137 308.0,137.0 L222.0,137.0 Q213,137 213.0,146.0 L213,179" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M213,259 L213.0,279.0 Q213,288 222.0,288.0 L224.1,288.0 Q233.1,288 233.1,297.0 L233.1,317" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M233.1,361 L233.1,381.0 Q233.1,390 242.1,390.0 L248.7,390.0 Q257.7,390 257.7,399.0 L257.7,419" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M257.7,539 L257.7,547.0 Q257.7,555 249.7,555.0 L191.1,555.0 Q182.1,555 182.1,564.0 L182.1,625.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M257.7,539 L257.7,547.0 Q257.7,555 265.7,555.0 L357.6,555.0 Q366.6,555 366.6,564.0 L366.6,597" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M364.1,715 L364.1,773" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M436.6,813 L443.6,813.0 Q450.6,813 450.6,806.0 L450.6,228.0 Q450.6,219 441.6,219.0 L301,219" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="49.5" width="176" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="110" y="75.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">Fuentes revisadas</tspan></text><rect x="125" y="179" width="176" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="213" y="204" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="213" dy="0">Build: transforma</tspan><tspan x="213" dy="19.2">entradas</tspan><tspan x="213" dy="19.2">declaradas</tspan></text><rect x="232" y="22" width="168" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="316" y="46.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="316" dy="0">Entorno:</tspan><tspan x="316" dy="19.2">herramientas,</tspan><tspan x="316" dy="19.2">variables, hora,</tspan><tspan x="316" dy="19.2">ruta</tspan></text><rect x="140.6" y="317" width="185" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="233.1" y="343.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="233.1" dy="0">Artefacto y huella</tspan></text><polygon points="257.7,419 417.7,479 257.7,539 97.7,479" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="257.7" y="464" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="257.7" dy="0">Otra persona, otro</tspan><tspan x="257.7" dy="19.2">sistema: misma</tspan><tspan x="257.7" dy="19.2">huella?</tspan></text><rect x="98.1" y="625.5" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="182.1" y="650.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="182.1" dy="0">Reproducible: se</tspan><tspan x="182.1" dy="19.2">puede verificar</tspan></text><rect x="300.1" y="597" width="133" height="118" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="366.6" y="621.8" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="366.6" dy="0">Comparar por</tspan><tspan x="366.6" dy="19.2">archivo y</tspan><tspan x="366.6" dy="19.2">localizar la</tspan><tspan x="366.6" dy="19.2">entrada que</tspan><tspan x="366.6" dy="19.2">difiere</tspan></text><rect x="286.6" y="773" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="361.6" y="798" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="361.6" dy="0">Declarar o</tspan><tspan x="361.6" dy="19.2">neutralizar la</tspan><tspan x="361.6" dy="19.2">entrada</tspan></text><rect x="219" y="146" width="110" height="24" rx="4" fill="#ffffff"/><text x="274" y="161.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">si se filtra</tspan></text><rect x="188.1" y="578.2" width="29" height="24" rx="4" fill="#ffffff"/><text x="202.6" y="594.1" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="202.6" dy="0">sí</tspan></text><rect x="372.6" y="564" width="29" height=