<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 785 243" width="785" height="243" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Peligro» … «Prueba o análisis con evidencia»</title><desc id="d">Diagrama de flujo con 7 pasos. «Peligro» lleva a «Situación peligrosa». «Situación peligrosa» lleva a «Daño posible». «Daño posible» lleva a «Riesgo: gravedad y probabilidad». «Riesgo: gravedad y probabilidad» lleva a «Medida de control». «Medida de control» lleva a «Requisito verificable». «Requisito verificable» lleva a «Prueba o análisis con evidencia». «Prueba o análisis con evidencia» lleva a «Peligro» (supuestos que se revisan).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="785" height="243" fill="#ffffff"/><path d="M190.5,52.5 L249.5,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M356.5,52.5 L415.5,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M548.5,52.5 L594.5,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M678.5,83 L678.5,150.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M625,181 L544,181" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M420,181 L369.5,181" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M236.5,181 L155.0,181.0 Q146,181 146.0,172.0 L146,74.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="101.5" y="30.5" width="89" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="146" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="146" dy="0">Peligro</tspan></text><rect x="249.5" y="22" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="303" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="303" dy="0">Situación</tspan><tspan x="303" dy="19.2">peligrosa</tspan></text><rect x="415.5" y="30.5" width="133" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="482" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="482" dy="0">Daño posible</tspan></text><rect x="594.5" y="22" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="678.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="678.5" dy="0">Riesgo: gravedad</tspan><tspan x="678.5" dy="19.2">y probabilidad</tspan></text><rect x="625" y="150.5" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="678.5" y="175.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="678.5" dy="0">Medida de</tspan><tspan x="678.5" dy="19.2">control</tspan></text><rect x="420" y="150.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="482" y="175.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="482" dy="0">Requisito</tspan><tspan x="482" dy="19.2">verificable</tspan></text><rect x="236.5" y="141" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="303" y="166" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="303" dy="0">Prueba o</tspan><tspan x="303" dy="19.2">análisis con</tspan><tspan x="303" dy="19.2">evidencia</tspan></text><rect x="22" y="106.8" width="118" height="42" rx=