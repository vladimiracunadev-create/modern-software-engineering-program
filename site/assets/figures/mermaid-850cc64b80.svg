8.7" dy="0">Reanudar desde el</tspan><tspan x="388.7" dy="19.2">paso</tspan></text><rect x="22" y="500" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="114.5" y="525.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="114.5" dy="0">Registro para la</tspan><tspan x="114.5" dy="19.2">revisión posterior</tspan></text><rect x="321.4" y="211" width="86" height="42" rx="4" fill="#ffffff"/><text x="364.4" y="226.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="364.4" dy="0">situación</tspan><tspan x="364.4" dy="17.92">conocida</tspan></text><rect x="389.3" y="484.5" width="86" height="42" rx="4" fill="#ffffff"/><text x="432.3" y="500.4" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432.3" dy="0">situación</tspan><tspan x="432.3" dy="17.92">abierta</tspan></text><rect x="313.5" y="457.7" width="102" height="24" rx="4" fill="#ffffff"/><text x="364.5" y="473.6" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="364.5" dy="0">no resuelve</tspan></text><rect x="322.4" y="343" width="118" height="24" rx="4" fill="#ffffff"/><text x="381.4" y="358.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="381.4" dy="0">se interrumpe</tspan></text></svg>
