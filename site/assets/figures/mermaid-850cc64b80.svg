<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 515 583" width="515" height="583" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Síntoma observado» … «Registro para la revisión posterior» y «Preguntas de decisión»</title><desc id="d">Diagrama de flujo con 7 pasos. «Síntoma observado» lleva a «Runbook o playbook». «Runbook o playbook» lleva a «Precondiciones y pasos» (situación conocida). «Runbook o playbook» lleva a «Preguntas de decisión» (situación abierta). «Precondiciones y pasos» lleva a «Verificación». «Verificación» lleva a «Preguntas de decisión» (no resuelve). «Precondiciones y pasos» lleva a «Reanudar desde el paso» (se interrumpe). «Verificación» lleva a «Registro para la revisión posterior».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="515" height="583" fill="#ffffff"/><path d="M342.6,66 L342.6,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M342.6,186 L342.6,194.0 Q342.6,202 334.6,202.0 L324.4,202.0 Q315.4,202 315.4,211.0 L315.4,262" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M463.6,155 L481.7,155.0 Q490.7,155 490.7,164.0 L490.7,521.5 Q490.7,530.5 481.7,530.5 L374,530.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M315.4,323 L315.4,347.2 Q315.4,356.2 306.4,356.2 L209.2,356.2 Q200.2,356.2 200.2,365.2 L200.2,389.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M200.2,433.5 L200.2,441.5 Q200.2,449.5 208.2,449.5 L298.5,449.5 Q307.5,449.5 307.5,458.5 L307.5,500" fill="none" stroke=