<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 741 304" width="741" height="304" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Defecto frecuente del lenguaje» … «Análisis estático y verificación»</title><desc id="d">Diagrama de flujo con 8 pasos. «Defecto frecuente del lenguaje» lleva a «Regla comprobable por máquina». «Regla comprobable por máquina» lleva a «Comprobación automática en cada cambio». «Comprobación automática en cada cambio» lleva a «¿Cumple?». «¿Cumple?» lleva a «Revisión y pruebas» (sí). «¿Cumple?» lleva a «Corregir o desviar» (no). «Corregir o desviar» lleva a «Desviación justificada y revisada». «Desviación justificada y revisada» lleva a «Revisión y pruebas». «Revisión y pruebas» lleva a «Análisis estático y verificación».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="741" height="304" fill="#ffffff"/><path d="M164,104 L210,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M369,104 L415,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M557,104 L603,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M661,73 L661.0,59.0 Q661,50 652.0,50.0 L392.0,50.0 Q383,50 383.0,59.0 L383.0,188.5 Q383,197.5 374.0,197.5 L296.5,197.5 Q289.5,197.5 289.5,204.5 L289.5,211.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M661,135 L661,211.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M603.5,242 L557,242" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M415,242 L347,242" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M232,242 L159.5,242" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="64" width="142" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="93" y="89" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="93" dy="0">Defecto</tspan><tspan x="93" dy="19.2">frecuente del</tspan><tspan x="93" dy="19.2">lenguaje</tspan></text><rect x="210" y="64" width="159" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="289.5" y="89" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="289.5" dy="0">Regla</tspan><tspan x="289.5" dy="19.2">comprobable por</tspan><tspan x="289.5" dy="19.2">máquina</tspan></text><rect x="415" y="64" width="142" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="486" y="89" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="486" dy="0">Comprobación</tspan><tspan x="486" dy="19.2">automática en</tspan><tspan x="486" dy="19.2">cada cambio</tspan></text><polygon points="661,73 719,104 661,135 603,104" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="661" y="108.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="661" dy="0">¿Cumple?</tspan></text><rect x="232" y="211.5" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="289.5" y="236.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="289.5" dy="0">Revisión y</tspan><tspan x="289.5" dy="19.2">pruebas</tspan></text><rect x="603.5" y="211.5" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="661" y="236.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="661" dy="0">Corregir o</tspan><tspan x="661" dy="19.2">desviar</tspan></text><rect x="415" y="202" width="142" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="486" y="227" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="486" dy="0">Desviación</tspan><tspan x="486" dy="19.2">justificada y</tspan><tspan x="486" dy="19.2">revisada</tspan></text><rect x="26.5" y="202" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="93" y="227" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="93" dy="0">Análisis</tspan><tspan x="93" dy="19.2">estático y</tspan><tspan x="93" dy="19.2">verificación</tspan></text><rect x="507.5" y="22" width="29" height="24" rx="4" fill="#ffffff"/><text x="522" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="522" dy="0">sí</tspan></text><rect x="667" y="161.2" width="29" height="24" rx="4" fill="#ffffff"/><text x="681.5" y="177.1" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="681.5" dy="0">no</tspan></text></svg>
