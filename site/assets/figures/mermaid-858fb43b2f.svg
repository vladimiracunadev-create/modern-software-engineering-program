<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 806 147" width="806" height="147" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Supuestos» … «Evidencia y umbral»</title><desc id="d">Diagrama de flujo con 5 pasos. «Supuestos» lleva a «Hipótesis falsable». «Hipótesis falsable» lleva a «Preguntas críticas». «Preguntas críticas» lleva a «Sensibilidad». «Sensibilidad» lleva a «Evidencia y umbral». «Evidencia y umbral» lleva a «Supuestos» (fallo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="806" height="147" fill="#ffffff"/><path d="M129,94.5 L175,94.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M282,94.5 L328,94.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M435,94.5 L481,94.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M614,94.5 L660,94.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M722,64 L722.0,57.0 Q722,50 715.0,50.0 L84.5,50.0 Q75.5,50 75.5,59.0 L75.5,72.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="72.5" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="75.5" y="98.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="75.5" dy="0">Supuestos</tspan></text><rect x="175" y="64" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="228.5" y="89.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="228.5" dy="0">Hipótesis</tspan><tspan x="228.5" dy="19.2">falsable</tspan></text><rect x="328" y="64" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="381.5" y="89.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="381.5" dy="0">Preguntas</tspan><tspan x="381.5" dy="19.2">críticas</tspan></text><rect x="481" y="72.5" width="133" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="547.5" y="98.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="547.5" dy="0">Sensibilidad</tspan></text><rect x="660" y="64" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="722" y="89.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="722" dy="0">Evidencia y</tspan><tspan x="722" dy="19.2">umbral</tspan></text><rect x="335.8" y="22" width="126" height="24" rx="4" fill="#ffffff"/><text x="398.8" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="398.8" dy="0">fallo o cambio</tspan></text></svg>
