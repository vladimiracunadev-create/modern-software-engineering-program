 fill="#0b3f45"><tspan x="332.5" dy="0">Proceso o hilo con</tspan><tspan x="332.5" dy="19.2">límite</tspan></text><rect x="154.5" y="456" width="29" height="24" rx="4" fill="#ffffff"/><text x="169" y="471.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="169" dy="0">no</tspan></text><rect x="295" y="465" width="29" height="24" rx="4" fill="#ffffff"/><text x="309.5" y="480.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="309.5" dy="0">sí</tspan></text><rect x="128" y="857" width="86" height="24" rx="4" fill="#ffffff"/><text x="171" y="872.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="171" dy="0">excepción</tspan></text><rect x="338.5" y="857" width="69" height="24" rx="4" fill="#ffffff"/><text x="373" y="872.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="373" dy="0">bloqueo</tspan></text></svg>
