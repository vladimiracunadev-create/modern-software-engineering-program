<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 463 973" width="463" height="973" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Núcleo mínimo» … «Aislar con try y except» y «Proceso o hilo con límite»</title><desc id="d">Diagrama de flujo con 10 pasos. «Núcleo mínimo» lleva a «Contrato del complemento». «Contrato del complemento» lleva a «Descubrimiento». «Descubrimiento» lleva a «¿Versión compatible?». «¿Versión compatible?» lleva a «Rechazo al arrancar o adaptador» (no). «¿Versión compatible?» lleva a «Registro» (sí). «Registro» lleva a «Despacho de eventos». «Despacho de eventos» lleva a «¿Falla o se bloquea?». «¿Falla o se bloquea?» lleva a «Aislar con try y except» (excepción). «¿Falla o se bloquea?» lleva a «Proceso o hilo con límite» (bloqueo). «Aislar con try y except» lleva a «Despacho de eventos». «Proceso o hilo con límite» lleva a «Despacho de eventos».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="463" height="973" fill="#ffffff"/><path d="M193.8,66 L193.8,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M197.2,185 L197.2,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M200.5,287 L200.5,310.7 Q200.5,316 205.8,316.0 L205.8,316.0 Q211.1,316 211.1,321.3 L211.1,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M211.1,431 L211.1,439.0 Q211.1,447 203.1,447.0 L157.5,447.0 Q148.5,447 148.5,456.0 L148.5,489" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M211.1,431 L211.1,439.0 Q211.1,447 219.1,447.0 L280.0,447.0 Q289,447 289.0,456.0 L289,507" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M289,551 L289.0,580.0 Q289,589 280.0,589.0 L270.2,589.0 Q261.2,589 261.2,598.0 L261.2,627" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M261.2,688 L261.2,708.0 Q261.2,717 252.2,717.0 L245.4,717.0 Q236.4,717 236.4,726.0 L236.4,746" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M236.4,832 L236.4,840.0 Q236.4,848 228.4,848.0 L131.0,848.0 Q122,848 122.0,857.0 L122,890" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M236.4,832 L236.4,840.0 Q236.4,848 244.4,848.0 L323.5,848.0 Q332.5,848 332.5,857.0 L332.5,890" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M38,920.5 L31.0,920.5 Q24,920.5 24.0,913.5 L24.0,666.5 Q24,657.5 33.0,657.5 L199.2,657.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><path d="M425,920.5 L432.0,920.5 Q439,920.5 439.0,913.5 L439.0,666.5 Q439,657.5 430.0,657.5 L323.2,657.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="122.8" y="22" width="142" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="193.8" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="193.8" dy="0">Núcleo mínimo</tspan></text><rect x="127.3" y="124" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="193.8" y="149.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="193.8" dy="0">Contrato del</tspan><tspan x="193.8" dy="19.2">complemento</tspan></text><rect x="125.5" y="243" width="150" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="200.5" y="269.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45