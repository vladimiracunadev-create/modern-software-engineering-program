<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 777" width="448" height="777" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Carga: solicitudes con espera y cálculo» … «Límite de Amdahl»</title><desc id="d">Diagrama de flujo con 8 pasos. «Carga: solicitudes con espera y cálculo» lleva a «Qué domina». «Qué domina» lleva a «Concurrencia: solapar esperas» (espera de red o disco). «Qué domina» lleva a «Paralelismo: repartir entre núcleos» (cálculo). «Concurrencia: solapar esperas» lleva a «Asincronía cooperativa: ceder en cada espera». «Paralelismo: repartir entre núcleos» lleva a «Procesos o hilos sin GIL: coordinar resultados». «Asincronía cooperativa: ceder en cada espera» lleva a «Medir con conteos y razones». «Procesos o hilos sin GIL: coordinar resultados» lleva a «Medir con conteos y razones». «Medir con conteos y razones» lleva a «Límite de Amdahl» (parte secuencial).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="448" height="777" fill="#ffffff"/><path d="M224.1,102 L224.1,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M224.1,222 L224.1,230.0 Q224.1,238 216.1,238.0 L138.8,238.0 Q129.8,238 129.8,247.0 L129.8,307.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M224.1,222 L224.1,230.0 Q224.1,238 232.1,238.0 L309.3,238.0 Q318.3,238 318.3,247.0 L318.3,298" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M129.8,368.5 L129.8,394.5 Q129.8,402.2 122.2,402.2 L122.2,402.2 Q114.5,402.2 114.5,409.9 L114.5,436" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M318.3,378 L318.3,399.4 Q318.3,407 325.9,407.0 L325.9,407.0 Q333.5,407 333.5,414.6 L333.5,436" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M114.5,516 L114.5,536.0 Q114.5,545 123.5,545.0 L215.0,545.0 Q224,545 224.0,554.0 L224,574" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M333.5,516 L333.5,536.0 Q333.5,545 324.5,545.0 L233.0,545.0 Q224,545 224.0,554.0 L224,574" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M224,635 L224,711" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="131.6" y="22" width="185" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="224.1" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="224.1" dy="0">Carga: solicitudes</tspan><tspan x="224.1" dy="19.2">con espera y</tspan><tspan x="224.1" dy="19.2">cálculo</tspan></text><polygon points="224.1,160 294.6,191 224.1,222 153.6,191" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="224.1" y="195.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="224.1" dy="0">Qué domina</tspan></text><rect x="50.3" y="307.5" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="129.8" y="332.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="129.8" dy="0">Concurrencia:</tspan><tspan x="129.8" dy="19.2">solapar esperas</tspan></text><rect x="243.3" y="298" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="318.3" y="323" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="318.3" dy="0">Paralelismo:</tspan><tspan x="318.3" dy="19.2">repartir entre</tspan><tspan x="318.3" dy="19.2">núcleos</tspan></text><rect x="22" y="436" width="185" height="80" rx="10" fill="#dff1ee" stroke="