<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 705 600" width="705" height="600" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Función del cliente» … «Comprobar en cada uso»</title><desc id="d">Diagrama de flujo con 8 pasos. «Función del cliente» lleva a «Capacidad necesaria». «Capacidad necesaria» lleva a «Estado del permiso». «Estado del permiso» lleva a «Usar» (concedido). «Estado del permiso» lleva a «Usar con menor precisión» (aproximado). «Estado del permiso» lleva a «Alternativa y explicación» (denegado o revocado). «Estado del permiso» lleva a «Función no disponible» (restringido). «Usar» lleva a «Comprobar en cada uso». «Comprobar en cada uso» lleva a «Estado del permiso» (cambia el estado).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="705" height="600" fill="#ffffff"/><path d="M355.7,83 L355.7,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M351.6,202 L351.6,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M347.5,322 L347.5,330.0 Q347.5,338 339.5,338.0 L278.0,338.0 Q269,338 269.0,347.0 L269,406.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M347.5,322 L347.5,330.0 Q347.5,338 339.5,338.0 L131.0,338.0 Q122,338 122.0,347.0 L122,398" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M347.5,322 L347.5,330.0 Q347.5,338 355.5,338.0 L403.0,338.0 Q412,338 412.0,347.0 L412,398" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M347.5,322 L347.5,330.0 Q347.5,338 355.5,338.0 L565.5,338.0 Q574.5,338 574.5,347.0 L574.5,398" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M269.6,450.5 L269.6,517" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M182.2,547.5 L175.2,547.5 Q168.2,547.5 168.2,540.5 L168.2,482.0 Q168.2,473 177.2,473.0 L203.5,473.0 Q212.5,473 212.5,464.0 L212.5,298.0 Q212.5,291 219.5,291.0 L226.5,291" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="293.7" y="22" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="355.7" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="355.7" dy="0">Función del</tspan><tspan x="355.7" dy="19.2">cliente</tspan></text><rect x="302.2" y="141" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="355.7" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="355.7" dy="0">Capacidad</tspan><tspan x="355.7" dy="19.2">necesaria</tspan></text><polygon points="347.5,260 468.5,291 347.5,322 226.5,291" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="347.5" y="295.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="347.5" dy="0">Estado del permiso</tspan></text><rect x="231" y="406.5" width="76" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="269" y="432.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="269" dy="0">Usar</tspan></text><rect x="47" y="398" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="122" y="423.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="122" dy="0">Usar con menor</tspan><tspan x="122" dy="19.2">precisión</tspan></text><rect x="341" y="398" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="412" y="423.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="412" dy="0">Alternativa y</tspan><tspan x="412" dy="19.2">explicación</tspan></text><rect x="517" y="398" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="574.5" y="423.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="574.5" dy="0">Función no</tspan><tspan x="574.5" dy="19.2">disponible</tspan></text><rect x="182.2" y="517" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="270.2" y="542.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="270.2" dy="0">Comprobar en cada</tspan><tspan x="270.2" dy="19.2">uso</tspan></text><rect x="275" y="360.2" width="86" height="24" rx="4" fill="#ffffff"/><text x="318" y="376.1" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="318" dy="0">concedido</tspan></text><rect x="22" y="356" width="94" height="24" rx="4" fill="#ffffff"/><text x="69" y="371.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="69" dy="0">aproximado</tspan></text><rect x="418" y="347" width="94" height="42" rx="4" fill="#ffffff"/><text x="465" y="362.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="465" dy="0">denegado o</tspan><tspan x="465" dy="17.92">revocado</tspan></text><rect x="580.5" y="356" width="102" height="24" rx="4" fill="#ffffff"/><text x="631.5" y="371.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="631.5" dy="0">restringido</tspan></text><rect x="120.5" y="288.2" width="86" height="42" rx="4" fill="#ffffff"/><text x="163.5" y="304.1" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="163.5" dy="0">cambia el</tspan><tspan x="163.5" dy="17.92">estado</tspan></text></svg>
