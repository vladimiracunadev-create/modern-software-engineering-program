<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 786 281" width="786" height="281" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Pregunta: ¿es más rápida esta versión?» … «Decisión: diferencia mayor que el ruido»</title><desc id="d">Diagrama de flujo con 6 pasos. «Pregunta: ¿es más rápida esta versión?» lleva a «Protocolo: repeticiones, procesos, estadístico». «Protocolo: repeticiones, procesos, estadístico» lleva a «Medición: reloj, perfilador». «Medición: reloj, perfilador» lleva a «Ruido: proceso, equipo, caché, calentamiento». «Ruido: proceso, equipo, caché, calentamiento» lleva a «Resumen: mínimo, mediana, intervalo». «Resumen: mínimo, mediana, intervalo» lleva a «Decisión: diferencia mayor que el ruido». «Decisión: diferencia mayor que el ruido» lleva a «Protocolo: repeticiones, procesos, estadístico» (no distinguible). «Ruido: proceso, equipo, caché, calentamiento» lleva a «Medición: reloj, perfilador» (el instrumento altera).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="786" height="281" fill="#ffffff"/><path d="M185.5,71.5 L249,71.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M391,71.5 L450,71.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M534,102 L534,179" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M454.5,219 L404,219" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M236,219 L190,219" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M106,179 L106.0,144.0 Q106,135 115.0,135.0 L313.0,135.0 Q320,135 320.0,128.0 L320,121" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><path d="M613.5,219 L623.0,219.0 Q632,219 632.0,210.0 L632.0,78.5 Q632,71.5 625.0,71.5 L618,71.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="26.5" y="31.5" width="159" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="56.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Pregunta: ¿es</tspan><tspan x="106" dy="19.2">más rápida esta</tspan><tspan x="106" dy="19.2">versión?</tspan></text><rect x="249" y="22" width="142" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="320" y="46.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="320" dy="0">Protocolo:</tspan><tspan x="320" dy="19.2">repeticiones,</tspan><tspan x="320" dy="19.2">procesos,</tspan><tspan x="320" dy="19.2">estadístico</tspan></text><rect x="450" y="41" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="534" y="66.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="534" dy="0">Medición: reloj,</tspan><tspan x="534" dy="19.2">perfilador</tspan></text><rect x="454.5" y="179" width="159" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="534" y="204" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="534" dy="0">Ruido: proceso,</tspan><tspan x="534" dy="19.2">equipo, caché,</tspan><tspan x="534" dy="19.2">calentamiento</tspan></text><rect x="236" y="179" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="320" y="204" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="320" dy="0">Resumen: mínimo,</tspan><tspan x="320" dy="19.2">mediana,</tspan><tspan x="320" dy="19.2">intervalo</tspan></text><rect x="22" y="179" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="204" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Decisión:</tspan><tspan x="106" dy="19.2">diferencia mayor</tspan><tspan x="106" dy="19.2">que el ruido</tspan></text><rect x="112" y="131.6" width="110" height="42" rx="4" fill="#ffffff"/><text x="167" y="147.5" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="167" dy="0">no</tspan><tspan x="167" dy="17.92">distinguible</tspan></text><rect x="638" y="124.2" width="126" height="42" rx="4" fill="#ffffff"/><text x="701" y="140.1" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="701" dy="0">el instrumento</tspan><tspan x="701" dy="17.92">altera</tspan></text></svg>
