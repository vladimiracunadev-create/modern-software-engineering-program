<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Build reproducible y hermético» … «Proyecto: release firmado y recuperable»</title><desc id="d">Diagrama de flujo con 12 pasos. «Build reproducible y hermético» lleva a «Artefactos, repositorios y promoción». «Artefactos, repositorios y promoción» lleva a «Dependencias y vendorización». «Dependencias y vendorización» lleva a «SBOM, procedencia y atestaciones». «SBOM, procedencia y atestaciones» lleva a «Firmas, checksums y verificación». «Firmas, checksums y verificación» lleva a «Versionado y changelog». «Versionado y changelog» lleva a «Feature flags». «Feature flags» lleva a «Canary, blue-green y rollback». «Canary, blue-green y rollback» lleva a «Instaladores y actualizaciones». «Instaladores y actualizaciones» lleva a «Riesgos de CI». «Riesgos de CI» lleva a «Taller: verificar procedencia». «Taller: verificar procedencia» lleva a «Proyecto: release firmado y recuperable». «Proyecto: release firmado y recuperable» lleva a «Build reproducible y hermético» (incidente o hallazgo).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="800" height="400" fill="#ffffff"/><path d="M176.5,62 L227,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M377,62 L423,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M573,62 L627.5,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M698.5,102 L698.5,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M632,200 L564.5,200" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M431.5,200 L373,200" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M231,200 L168,200" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M101.5,240 L101.5,307.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M181,338 L231,338" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M373,338 L436,338" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M560,338 L619,338" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M698.5,298 L698.5,263.0 Q698.5,254 689.5,254.0 L191.0,254.0 Q182,254 182.0,245.0 L182.0,125.0 Q182,116 173.0,116.0 L108.5,116.0 Q101.5,116 101.5,109.0 L101.5,102" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="26.5" y="22" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101.5" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101.5" dy="0">Build</tspan><tspan x="101.5" dy="19.2">reproducible y</tspan><tspan x="101.5" dy="19.2">hermético</tspan></text><rect x="227" y="22" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="302" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="302" dy="0">Artefactos,</tspan><tspan x="302" dy="19.2">repositorios y</tspan><tspan x="302" dy="19.2">promoción</tspan></text><rect x="423" y="31.5" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="498" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="498" dy="0">Dependencias y</tspan><tspan x="498" dy="19.2">vendorización</tspan></text><rect x="627.5" y="22" width="142" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="698.5" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="698.5" dy="0">SBOM,</tspan><tspan x="698.5" dy="19.2">procedencia y</tspan><tspan x="698.5" dy="19.2">atestaciones</tspan></text><rect x="632" y="160" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="698.5" y="185" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="698.5" dy="0">Firmas,</tspan><tspan x="698.5" dy="19.2">checksums y</tspan><tspan x="698.5" dy="19.2">verificación</tspan></text><rect x="431.5" y="169.5" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="498" y="194.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="498" dy="0">Versionado y</tspan><tspan x="498" dy="19.2">changelog</tspan></text><rect x="231" y="178" width="142" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="302" y="204.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="302" dy="0">Feature flags</tspan></text><rect x="35" y="160" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101.5" y="185" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101.5" dy="0">Canary,</tspan><tspan x="101.5" dy="19.2">blue-green y</tspan><tspan x="101.5" dy="19.2">rollback</tspan></text><rect x="22" y="307.5" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101.5" y="332.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101.5" dy="0">Instaladores y</tspan><tspan x="101.5" dy="19.2">actualizaciones</tspan></text><rect x="231" y="316" width="142" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="302" y="342.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="302" dy="0">Riesgos de CI</tspan></text><rect x="436" y="298" width="124" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="498" y="323" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="498" dy="0">Taller:</tspan><tspan x="498" dy="19.2">verificar</tspan><tspan x="498" dy="19.2">procedencia</tspan></text><rect x="619" y="298" width="159" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="698.5" y="323" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="698.5" dy="0">Proyecto:</tspan><tspan x="698.5" dy="19.2">release firmado</tspan><tspan x="698.5" dy="19.2">y recuperable</tspan></text><rect x="286" y="258" width="102" height="42" rx="4" fill="#ffffff"/><text x="337" y="273.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="337" dy="0">incidente o</tspan><tspan x="337" dy="17.92">hallazgo</tspan></text></svg>
