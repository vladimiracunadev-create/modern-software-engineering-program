<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 685" width="520" height="685" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Entrada de tamaño variable» … «Generador corrige», «Salida» y «Escalar a una persona»</title><desc id="d">Diagrama de flujo con 10 pasos. «Entrada de tamaño variable» lleva a «Orquestador: estima y divide». «Orquestador: estima y divide» lleva a «Trabajador 1». «Orquestador: estima y divide» lleva a «Trabajador 2». «Orquestador: estima y divide» lleva a «Trabajador 3». «Trabajador 1» lleva a «Síntesis». «Trabajador 2» lleva a «Síntesis». «Trabajador 3» lleva a «Síntesis». «Síntesis» lleva a «Evaluador». «Evaluador» lleva a «Generador corrige» (fallas concretas). «Generador corrige» lleva a «Evaluador». «Evaluador» lleva a «Salida» (pasa). «Evaluador» lleva a «Escalar a una persona» (tope de vueltas).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="520" height="685" fill="#ffffff"/><path d="M264,83 L264,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M264,202 L264.0,222.0 Q264,231 255.0,231.0 L106.1,231.0 Q97.1,231 97.1,240.0 L97.1,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M264,202 L264,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M264,202 L264.0,222.0 Q264,231 273.0,231.0 L422.1,231.0 Q431.1,231 431.1,240.0 L431.1,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M97.1,304 L97.1,324.0 Q97.1,333 106.1,333.0 L255.6,333.0 Q264.6,333 264.6,342.0 L264.6,362" f