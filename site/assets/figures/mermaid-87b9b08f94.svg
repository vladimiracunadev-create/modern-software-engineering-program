<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 563 824" width="563" height="824" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Código que huele» … «SE-307: cambio seguro con pruebas»</title><desc id="d">Diagrama de flujo con 10 pasos. «Código que huele» lleva a «Medida: largo, anidamiento, complejidad, duplicación». «Medida: largo, anidamiento, complejidad, duplicación» lleva a «Contexto». «Contexto» lleva a «¿Lo cambian a menudo?». «Contexto» lleva a «¿Es lógica o es dato?». «Contexto» lleva a «¿Cambia por la misma razón?». «¿Lo cambian a menudo?» lleva a «Costo real». «¿Es lógica o es dato?» lleva a «Costo real». «¿Cambia por la misma razón?» lleva a «Costo real». «Costo real» lleva a «Candidato a refactorizar» (alto). «Costo real» lleva a «Se deja y se documenta por qué» (bajo). «Candidato a refactorizar» lleva a «SE-307: cambio seguro con pruebas». «Se deja y se documenta por qué» lleva a «Código que huele».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="563" height="824" fill="#ffffff"/><path d="M291,66 L291,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M287,223 L287,281" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M283,343 L283.0,363.0 Q283,372 274.0,372.0 L102.0,372.0 Q93,372 93.0,381.0 L93,401" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M280.2,343 L280.2,401" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M283,343 L283.0,363.0 Q283,372 292.0,372.0 L457.0,372.0 Q466,372 466.0,381.0