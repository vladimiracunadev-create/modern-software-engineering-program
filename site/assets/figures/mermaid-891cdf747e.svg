<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 381" width="810" height="381" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Hardware y firmware» … «Dispositivo operable»</title><desc id="d">Diagrama de flujo con 12 pasos. «Hardware y firmware» lleva a «Periféricos y buses». «Periféricos y buses» lleva a «Energía, memoria y precisión». «Energía, memoria y precisión» lleva a «Plazos y tiempo real». «Plazos y tiempo real» lleva a «Interrupciones y estado compartido». «Interrupciones y estado compartido» lleva a «Conectividad intermitente». «Conectividad intermitente» lleva a «Actualización y recuperación». «Actualización y recuperación» lleva a «Identidad y claves». «Identidad y claves» lleva a «Borde y pasarelas». «Borde y pasarelas» lleva a «Safety, seguridad y vida útil». «Safety, seguridad y vida útil» lleva a «Modelo de fallos». «Modelo de fallos» lleva a «Dispositivo operable». «Dispositivo operable» lleva a «Hardware y firmware» (incidente o hallazgo).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="810" height="381" fill="#ffffff"/><path d="M141.5,52.5 L205,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M347,52.5 L406,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M574,52.5 L624.5,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M704,83 L704,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M620,181 L556.5,181" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#a