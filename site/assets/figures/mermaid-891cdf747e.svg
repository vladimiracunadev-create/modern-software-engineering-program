tspan x="704" dy="19.2">real</tspan></text><rect x="620" y="141" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="704" y="166" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="704" dy="0">Interrupciones y</tspan><tspan x="704" dy="19.2">estado</tspan><tspan x="704" dy="19.2">compartido</tspan></text><rect x="423.5" y="150.5" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="490" y="175.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">Conectividad</tspan><tspan x="490" dy="19.2">intermitente</tspan></text><rect x="196.5" y="150.5" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="276" y="175.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="276" dy="0">Actualización y</tspan><tspan x="276" dy="19.2">recuperación</tspan></text><rect x="22" y="150.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="84" y="175.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="84" dy="0">Identidad y</tspan><tspan x="84" dy="19.2">claves</tspan></text><rect x="30.5" y="288.5" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="84" y="313.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="84" dy="0">Borde y</tspan><tspan x="84" dy="19.2">pasarelas</tspan></text><rect x="192" y="279" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="276" y="304" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="276" dy="0">Safety,</tspan><tspan x="276" dy="19.2">seguridad y vida</tspan><tspan x="276" dy="19.2">útil</tspan></text><rect x="406" y="297" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="490" y="323.2" fo