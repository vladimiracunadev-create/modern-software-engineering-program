<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 387 1016" width="387" height="1016" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Escenarios con medida» … «Disparador y medida de vigilancia»</title><desc id="d">Diagrama de flujo con 9 pasos. «Escenarios con medida» lleva a «Importancia por contexto». «Escenarios con medida» lleva a «Modelo de cada candidato». «Modelo de cada candidato» lleva a «Medidas: p99, disponibilidad, radio, coordinación, costo, extensión». «Medidas: p99, disponibilidad, radio, coordinación, costo, extensión» lleva a «Utilidad por escenario». «Importancia por contexto» lleva a «Utilidad ponderada». «Utilidad por escenario» lleva a «Utilidad ponderada». «Utilidad ponderada» lleva a «Barrido de equipos e importancias». «Barrido de equipos e importancias» lleva a «Supuesto que invierte la decisión». «Supuesto que invierte la decisión» lleva a «Disparador y medida de vigilancia».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="387" height="1016" fill="#ffffff"/><path d="M195.8,83 L195.8,103.0 Q195.8,112 186.8,112.0 L110.5,112.0 Q101.5,112 101.5,121.0 L101.5,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M195.8,83 L195.8,103.0 Q195.8,112 204.8,112.0 L281.0,112.0 Q290,112 290.0,121.0 L290,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M290,202 L290.0,222.0 Q290,231 281.0,231.0 L259.8,231.0 Q250.8,231 250.8,240.0 L250.8,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M250.8,378 L250.8,398.0 Q250.8,407 241.8,4