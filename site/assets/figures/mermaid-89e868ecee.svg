<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 429 839" width="429" height="839" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Riesgos y zonas poco probadas» … «Nuevo riesgo o nueva misión»</title><desc id="d">Diagrama de flujo con 8 pasos. «Riesgos y zonas poco probadas» lleva a «Misión de exploración». «Misión de exploración» lleva a «Heurísticas: límites, vacíos, repetir, deshacer». «Heurísticas: límites, vacíos, repetir, deshacer» lleva a «Sesión con registro». «Sesión con registro» lleva a «¿Hallazgo?». «¿Hallazgo?» lleva a «Reportar con pasos y entrada mínima» (defecto). «¿Hallazgo?» lleva a «Regla o prueba automática» (patrón). «Reportar con pasos y entrada mínima» lleva a «Nuevo riesgo o nueva misión». «Regla o prueba automática» lleva a «Nuevo riesgo o nueva misión». «Nuevo riesgo o nueva misión» lleva a «Misión de exploración».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="429" height="839" fill="#ffffff"/><path d="M213.9,83 L213.9,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M214.1,202 L214.1,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M214.4,340 L214.4,398" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M214.8,459 L214.8,517" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M215.1,579 L215.1,587.0 Q215.1,595 207.1,595.0 L123.5,595.0 Q114.5,595 114.5,604.0 L114.5,637" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M215.1,579 L215.1,587.0 Q215.1,595 223.1,595.0 L307.0,595.0 Q316,595 316.0,604.0 L316,637" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M114.5,698 L114.5,718.0 Q114.5,727 123.5,727.0 L206.4,727.0 Q215.4,727 215.4,736.0 L215.4,756" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M316,698 L316.0,718.0 Q316,727 307.0,727.0 L224.4,727.0 Q215.4,727 215.4,736.0 L215.4,756" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M290.4,786.5 L396.0,786.5 Q405,786.5 405.0,777.5 L405.0,180.5 Q405,171.5 396.0,171.5 L275.9,171.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="134.4" y="22" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="213.9" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="213.9" dy="0">Riesgos y zonas</tspan><tspan x="213.9" dy="19.2">poco probadas</tspan></text><rect x="151.9" y="141" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="213.9" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="213.9" dy="0">Misión de</tspan><tspan x="213.9" dy="19.2">exploración</tspan></text><rect x="126.2" y="260" width="176" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="214.2" y="285" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="214.2" dy="0">Heurísticas:</tspan><tspan x="214.2" dy="19.2">límites, vacíos,</tspan><tspan x="214.2" dy="19.2">repetir, deshacer</tspan></text><rect x="157.1" y="398" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="214.6" y="423.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="214.6" dy="0">Sesión con</tspan><tspan x="214.6" dy="19.2">registro</tspan></text><polygon points="215.1,517 285.6,548 215.1,579 14