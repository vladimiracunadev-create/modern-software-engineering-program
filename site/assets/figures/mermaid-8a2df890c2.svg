<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 826 626" width="826" height="626" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Regla del negocio» … «Dato inválido no persiste»</title><desc id="d">Diagrama de flujo con 9 pasos. «Regla del negocio» lleva a «Alcance de la regla». «Alcance de la regla» lleva a «NOT NULL, CHECK, tipo» (una columna). «Alcance de la regla» lleva a «UNIQUE, clave primaria» (una tabla). «Alcance de la regla» lleva a «Clave foránea y acción de borrado» (dos tablas). «Alcance de la regla» lleva a «Disparador, aserción o servicio» (varias filas o estados). «NOT NULL, CHECK, tipo» lleva a «El motor rechaza». «UNIQUE, clave primaria» lleva a «El motor rechaza». «Clave foránea y acción de borrado» lleva a «El motor rechaza». «Disparador, aserción o servicio» lleva a «Hay que probar que se ejecuta». «El motor rechaza» lleva a «Dato inválido no persiste». «Hay que probar que se ejecuta» lleva a «Dato inválido no persiste».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="826" height="626" fill="#ffffff"/><path d="M390.5,66 L390.5,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M390.5,210 L390.5,218.0 Q390.5,226 382.5,226.0 L115.0,226.0 Q106,226 106.0,235.0 L106,295.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M390.5,210 L390.5,218.0 Q390.5,226 382.5,226.0 L304.0,226.0 Q295,226 295.0,235.0 L295,295.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M390.5,210 L390.5,218.0 Q390.5,226 398.5,226.0 L479.0,226.0 Q488,22