<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 462 837" width="462" height="837" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Historia» … «Ajustar puertas»</title><desc id="d">Diagrama de flujo con 8 pasos. «Historia» lleva a «Definición de listo». «Definición de listo» lleva a «Refinar» (incompleta). «Definición de listo» lleva a «Construir» (lista). «Construir» lleva a «Definición de terminado». «Definición de terminado» lleva a «Construir» (falta una comprobación). «Definición de terminado» lleva a «Aceptación» (cumple). «Aceptación» lleva a «Construir» (criterios no cumplidos). «Aceptación» lleva a «Incremento utilizable» (aceptada). «Incremento utilizable» lleva a «Ajustar puertas» (defecto escapado). «Ajustar puertas» lleva a «Definición de listo».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="462" height="837" fill="#ffffff"/><path d="M149.5,66 L149.5,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M149.5,210 L149.5,218.0 Q149.5,226 141.5,226.0 L98.5,226.0 Q89.5,226 89.5,235.0 L89.5,268" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M149.5,210 L149.5,218.0 Q149.5,226 157.5,226.0 L212.5,226.0 Q221.5,226 221.5,235.0 L221.5,268" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M221.5,312 L221.5,332.0 Q221.5,341 212.5,341.0 L206.9,341.0 Q197.9,341 197.9,350.0 L197.9,370" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M197.9,456 L197.9,464.0 Q197.9,472 189.9,472.0 L186.5,472.0 Q177.5,472 177.5,