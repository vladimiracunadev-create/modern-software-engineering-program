<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 461 865" width="461" height="865" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Dato compartido y mutable» … «Orden global de adquisición» y «Granularidad»</title><desc id="d">Diagrama de flujo con 10 pasos. «Dato compartido y mutable» lleva a «Intercalación de pasos». «Intercalación de pasos» lleva a «Se rompe una invariante». «Se rompe una invariante» lleva a «Carrera» (sí). «Carrera» lleva a «Exclusión mutua: cerrojo». «Exclusión mutua: cerrojo» lleva a «Riesgo: espera circular». «Exclusión mutua: cerrojo» lleva a «Costo: contención». «Carrera» lleva a «Alternativas: inmutabilidad, confinamiento, atómicas». «Riesgo: espera circular» lleva a «Orden global de adquisición». «Costo: contención» lleva a «Granularidad».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="461" height="865" fill="#ffffff"/><path d="M326.5,83 L326.5,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M326.5,202 L326.5,223.1 Q326.5,231 318.6,231.0 L318.6,231.0 Q310.6,231 310.6,238.9 L310.6,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M310.6,346 L310.6,354.0 Q310.6,362 302.6,362.0 L294.2,362.0 Q285.2,362 285.2,371.0 L285.2,404" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M285.2,448 L285.2,477.5 Q285.2,486.5 276.2,486.5 L179.2,486.5 Q170.2,486.5 170.2,495.5 L170.2,525" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M170.2,586 L170.2,615.5 Q170.2,624.5 161.2,624.5 L106.0,624.5