<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 891 703" width="891" height="703" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Tarea», «Instrucciones del proyecto» y «Documentos recuperados» … «Salida revisable»</title><desc id="d">Diagrama de flujo con 14 pasos. «Tarea» lleva a «Dimensiones de decisión». «Dimensiones de decisión» lleva a «Espacio de interpretaciones». «Instrucciones del proyecto» lleva a «Contradicciones». «Contradicciones» lleva a «Elección arbitraria» (sí). «Contradicciones» lleva a «Reglas coherentes» (no). «Documentos recuperados» lleva a «Versión vigente». «Versión vigente» lleva a «Mezcla de versiones» (sin filtro). «Versión vigente» lleva a «Solo lo vigente» (con metadatos). «Reglas coherentes» lleva a «Contexto diseñado». «Solo lo vigente» lleva a «Contexto diseñado». «Espacio de interpretaciones» lleva a «Contexto diseñado» (restricciones). «Contexto diseñado» lleva a «Pocas interpretaciones restantes». «Pocas interpretaciones restantes» lleva a «Salida revisable».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="891" height="703" fill="#ffffff"/><path d="M155.8,74.5 L155.8,141.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M155.8,202.5 L155.8,222.8 Q155.8,231.8 164.8,231.8 L246.0,231.8 Q255,231.8 255.0,240.8 L255,261" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M366.8,83 L366.8,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M366.8,203 L366.8,211.0 Q366.8,219 358.8,219.0 L88.5,219.0 Q79.5,219 79.5,228