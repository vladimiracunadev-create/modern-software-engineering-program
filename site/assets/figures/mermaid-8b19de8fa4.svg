<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 831 147" width="831" height="147" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Prototipo y pregunta» … «Incertidumbre residual»</title><desc id="d">Diagrama de flujo con 5 pasos. «Prototipo y pregunta» lleva a «Experimento de demanda». «Experimento de demanda» lleva a «Tamaño y potencia». «Tamaño y potencia» lleva a «Mirar los resultados». «Mirar los resultados» lleva a «Incertidumbre residual». «Incertidumbre residual» lleva a «Prototipo y pregunta» (fallo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="831" height="147" fill="#ffffff"/><path d="M146,94.5 L192,94.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M316,94.5 L362,94.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M460,94.5 L506,94.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M621,94.5 L667,94.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M738,64 L738.0,57.0 Q738,50 731.0,50.0 L91.0,50.0 Q84,50 84.0,57.0 L84,64" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="64" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="84" y="89.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="84" dy="0">Prototipo y</tspan><tspan x="84" dy="19.2">pregunta</tspan></text><rect x="192" y="64" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="254" y="89.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="254" dy="0">Experimento</tspan><tspan x="254" dy="19.2">de demanda</tspan></text><rect x="362" y="64" width="98" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="411" y="89.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="411" dy="0">Tamaño y</tspan><tspan x="411" dy="19.2">potencia</tspan></text><rect x="506" y="64" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="563.5" y="89.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="563.5" dy="0">Mirar los</tspan><tspan x="563.5" dy="19.2">resultados</tspan></text><rect x="667" y="64" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="738" y="89.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="738" dy="0">Incertidumbre</tspan><tspan x="738" dy="19.2">residual</tspan></text><rect x="348" y="22" width="126" height="24" rx="4" fill="#ffffff"/><text x="411" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="411" dy="0">fallo o cambio</tspan></text></svg>
