<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 445" width="800" height="445" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Atacante» … «Defensa por capa y vigilancia»</title><desc id="d">Diagrama de flujo con 11 pasos. «Atacante» lleva a «Entrada del servicio». «Atacante» lleva a «Consultas repetidas a la interfaz». «Atacante» lleva a «Datos de entrenamiento». «Atacante» lleva a «Registro y artefactos». «Entrada del servicio» lleva a «Evasión: la decisión cambia». «Consultas repetidas a la interfaz» lleva a «Extracción: copia del modelo». «Consultas repetidas a la interfaz» lleva a «Pertenencia: ¿estaba este dato?». «Datos de entrenamiento» lleva a «Envenenamiento y puerta trasera». «Registro y artefactos» lleva a «Modelo sustituido o alterado». «Evasión: la decisión cambia» lleva a «Defensa por capa y vigilancia». «Extracción: copia del modelo» lleva a «Defensa por capa y vigilancia». «Pertenencia: ¿estaba este dato?» lleva a «Defensa por capa y vigilancia». «Envenenamiento y puerta trasera» lleva a «Defensa por capa y vigilancia». «Modelo sustituido o alterado» lleva a «Defensa por capa y vigilancia».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="800" height="445" fill="#ffffff"/><path d="M120,222.5 L140.5,222.5 Q149.5,222.5 149.5,213.5 L149.5,94.5 Q149.5,85.5 158.5,85.5 L179,85.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M120,222.5 L134.0,222.5 Q143,222.5 143.0,213.5 L143.0,189.0 Q143,180 152.0,180.0 L166,180" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M