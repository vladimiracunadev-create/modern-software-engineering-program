<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 931 231" width="931" height="231" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Atacante en internet» … «Dato sensible»</title><desc id="d">Diagrama de flujo con 7 pasos. «Atacante en internet» lleva a «Servicio expuesto». «Servicio expuesto» lleva a «Servicio interno» (regla de red permitida). «Servicio interno» lleva a «Base de datos» (regla permitida). «Servicio expuesto» lleva a «Identidad con permisos» (credencial robada o filtrada). «Identidad con permisos» lleva a «Base de datos» (permiso concedido). «Repositorio, script, registro» lleva a «Identidad con permisos» (secreto en claro). «Base de datos» lleva a «Dato sensible».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="931" height="231" fill="#ffffff"/><path d="M146,120 L168.8,120.0 Q177.8,120 177.8,111.0 L177.8,77.0 Q177.8,68 186.8,68.0 L209.5,68" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M307.5,68 L463.5,68" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M561.5,68 L569.5,68.0 Q577.5,68 577.5,76.0 L577.5,106.3 Q577.5,115.3 586.5,115.3 L676,115.3" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M258.5,98.5 L258.5,105.5 Q258.5,112.5 265.5,112.5 L507.5,112.5 Q512.5,112.5 512.5,117.5 L512.5,122.5" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M566,162.5 L574.0,162.5 Q582,162.5 582.0,154.5 L582.0,124.3 Q582,115.3 591.0,115.3 L676,115.3" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M325,162.5 L459,162.5" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M765,115.3 L811,115.3" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="89.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="84" y="114.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="84" dy="0">Atacante en</tspan><tspan x="84" dy="19.2">internet</tspan></text><rect x="209.5" y="37.5" width="98" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="258.5" y="62.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="258.5" dy="0">Servicio</tspan><tspan x="258.5" dy="19.2">expuesto</tspan></text><rect x="463.5" y="37.5" width="98" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="512.5" y="62.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="512.5" dy="0">Servicio</tspan><tspan x="512.5" dy="19.2">interno</tspan></text><rect x="676" y="84.8" width="89" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="720.5" y="109.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="720.5" dy="0">Base de</tspan><tspan x="720.5" dy="19.2">datos</tspan></text><rect x="459" y="122.5" width="107" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="512.5" y="147.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="512.5" dy="0">Identidad</tspan><tspan x="512.5" dy="19.2">con</tspan><tspan x="512.5" dy="19.2">permisos</tspan></text><rect x="192" y="122.5" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="258.5" y="147.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="258.5" dy="0">Repositorio,</tspan><tspan x="258.5" dy="19.2">script,</tspan><tspan x="258.5" dy="19.2">registro</tspan></text><rect x="811" y="84.8" width="98" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="860" y="109.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="860" dy="0">Dato</tspan><tspan x="860" dy="19.2">sensible</tspan></text><rect x="330.5" y="22" width="110" height="42" rx="4" fill="#ffffff"/><text x="385.5" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="385.5" dy="0">regla de red</tspan><tspan x="385.5" dy="17.92">permitida</tspan></text><rect x="583.8" y="69.3" width="86" height="42" rx="4" fill="#ffffff"/><text x="626.8" y="85.2" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="626.8" dy="0">regla</tspan><tspan x="626.8" dy="17.92">permitida</tspan></text><rect x="338.5" y="82.5" width="94" height="60" rx="4" fill="#ffffff"/><text x="385.5" y="98.4" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="385.5" dy="0">credencial</tspan><tspan x="385.5" dy="17.92">robada o</tspan><tspan x="385.5" dy="17.92">filtrada</tspan></text><rect x="586" y="119.3" width="86" height="42" rx="4" fill="#ffffff"/><text x="629" y="135.2" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="629" dy="0">permiso</tspan><tspan x="629" dy="17.92">concedido</tspan></text><rect x="345" y="166.5" width="94" height="42" rx="4" fill="#ffffff"/><text x="392" y="182.4" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="392" dy="0">secreto en</tspan><tspan x="392" dy="17.92">claro</tspan></text></svg>
