<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 511 565" width="511" height="565" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Contenido y tareas» … «Prueba de hallazgo»</title><desc id="d">Diagrama de flujo con 6 pasos. «Contenido y tareas» lleva a «Agrupación y etiquetas». «Agrupación y etiquetas» lleva a «Estructura de navegación». «Estructura de navegación» lleva a «Alcance y profundidad». «Alcance y profundidad» lleva a «Prueba de hallazgo». «Prueba de hallazgo» lleva a «Agrupación y etiquetas» (etiquetas o ramas confusas). «Estructura de navegación» lleva a «Orientación» (entrada directa).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="511" height="565" fill="#ffffff"/><path d="M363.3,66 L363.3,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M363.3,185 L363.3,205.9 Q363.3,214 355.2,214.0 L355.2,214.0 Q347.2,214 347.2,222.1 L347.2,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M347.2,304 L347.2,333.0 Q347.2,342 338.2,342.0 L264.7,342.0 Q255.7,342 255.7,351.0 L255.7,380" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M258.1,441 L258.1,499" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M347.2,304 L347.2,312.0 Q347.2,320 355.2,320.0 L404.7,320.0 Q413.7,320 413.7,329.0 L413.7,388.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M168,521 L161.0,521.0 Q154,521 154.0,514.0 L154.0,163.5 Q154,154.5 163.0,154.5 L296.8,154.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="270.8" y="22" width="185" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="363.3" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="363.3" dy="0">Contenido y tareas</tspan></text><rect x="296.8" y="124" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="363.3" y="149.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="363.3" dy="0">Agrupación y</tspan><tspan x="363.3" dy="19.2">etiquetas</tspan></text><rect x="276.2" y="243" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="347.2" y="268.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="347.2" dy="0">Estructura de</tspan><tspan x="347.2" dy="19.2">navegación</tspan></text><rect x="193.7" y="380" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="255.7" y="405.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="255.7" dy="0">Alcance y</tspan><tspan x="255.7" dy="19.2">profundidad</tspan></text><rect x="168" y="499" width="185" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="260.5" y="525.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="260.5" dy="0">Prueba de hallazgo</tspan></text><rect x="351.7" y="388.5" width="124" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="413.7" y="414.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="413.7" dy="0">Orientación</tspan></text><rect x="22" y="316.8" width="126" height="42" rx="4" fill="#ffffff"/><text x="85" y="332.7" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="85" dy="0">etiquetas o</tspan><tspan x="85" dy="17.92">ramas confusas</tspan></text><rect x="4