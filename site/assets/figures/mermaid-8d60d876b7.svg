<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 639 1004" width="639" height="1004" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Cambio propuesto» … «Revisión trimestral con los defectos escapados»</title><desc id="d">Diagrama de flujo con 12 pasos. «Cambio propuesto» lleva a «¿Tiene reglas deterministas?». «¿Tiene reglas deterministas?» lleva a «Evaluación con puerta y revisión humana» (no). «¿Tiene reglas deterministas?» lleva a «¿Qué riesgo tiene?» (sí). «¿Qué riesgo tiene?» lleva a «TDD» (bajo). «¿Qué riesgo tiene?» lleva a «TDD y contrato» (medio). «¿Qué riesgo tiene?» lleva a «TDD, contrato y modelo ejecutable» (alto). «TDD y contrato» lleva a «¿Es ambiguo?». «TDD, contrato y modelo ejecutable» lleva a «¿Es ambiguo?». «¿Es ambiguo?» lleva a «Añadir ejemplos acordados con negocio» (sí). «¿Es ambiguo?» lleva a «Sin cambios» (no). «TDD» lleva a «Registrar el cambio y su clase». «Evaluación con puerta y revisión humana» lleva a «Registrar el cambio y su clase». «Añadir ejemplos acordados con negocio» lleva a «Registrar el cambio y su clase». «Sin cambios» lleva a «Registrar el cambio y su clase». «Registrar el cambio y su clase» lleva a «Revisión trimestral con los defectos escapados». «Revisión trimestral con los defectos escapados» lleva a «Cambio propuesto».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="639" height="1004" fill="#ffffff"/><path d="M221.9,66 L221.9,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M221.9,210 L221.9,218.0 Q221.9,226 213.9,226.0 L135.0,226.0 Q126,226 126.0,235.0 L126,26