<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 831 166" width="831" height="166" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Segmentación por necesidad» … «Segmento inicial»</title><desc id="d">Diagrama de flujo con 5 pasos. «Segmentación por necesidad» lleva a «Estabilidad de segmentos». «Estabilidad de segmentos» lleva a «Tamaño del mercado». «Tamaño del mercado» lleva a «Alternativas existentes». «Alternativas existentes» lleva a «Segmento inicial». «Segmento inicial» lleva a «Segmentación por necesidad» (fallo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="831" height="166" fill="#ffffff"/><path d="M155,104 L201,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M325,104 L371,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M486,104 L532,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M665,104 L711,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M760,73.5 L760.0,59.0 Q760,50 751.0,50.0 L95.5,50.0 Q88.5,50 88.5,57.0 L88.5,64" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="64" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="88.5" y="89" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="88.5" dy="0">Segmentación</tspan><tspan x="88.5" dy="19.2">por</tspan><tspan x="88.5" dy="19.2">necesidad</tspan></text><rect x="201" y="64" width="124" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="263" y="89" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="263" dy="0">Estabilidad</tspan><tspan x="263" dy="19.2">de</tspan><tspan x="263" dy="19.2">segmentos</tspan></text><rect x="371" y="73.5" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="428.5" y="98.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="428.5" dy="0">Tamaño del</tspan><tspan x="428.5" dy="19.2">mercado</tspan></text><rect x="532" y="73.5" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="598.5" y="98.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="598.5" dy="0">Alternativas</tspan><tspan x="598.5" dy="19.2">existentes</tspan></text><rect x="711" y="73.5" width="98" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="760" y="98.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="760" dy="0">Segmento</tspan><tspan x="760" dy="19.2">inicial</tspan></text><rect x="361.2" y="22" width="126" height="24" rx="4" fill="#ffffff"/><text x="424.2" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="424.2" dy="0">fallo o cambio</tspan></text></svg>
