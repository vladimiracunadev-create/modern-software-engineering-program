<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 792 343" width="792" height="343" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Objetos y áreas» … «Contribución revisable»</title><desc id="d">Diagrama de flujo con 12 pasos. «Objetos y áreas» lleva a «Commits atómicos». «Commits atómicos» lleva a «Ramas e integración». «Ramas e integración» lleva a «Revisión por riesgo». «Revisión por riesgo» lleva a «Flujo de ramas». «Flujo de ramas» lleva a «Issues y trazabilidad». «Issues y trazabilidad» lleva a «Convenciones y propietarios». «Convenciones y propietarios» lleva a «Comunidad abierta». «Comunidad abierta» lleva a «Licencias». «Licencias» lleva a «Firmas y protección». «Firmas y protección» lleva a «Rescate». «Rescate» lleva a «Contribución revisable». «Contribución revisable» lleva a «Commits atómicos» (rechazo o hallazgo).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="792" height="343" fill="#ffffff"/><path d="M181,52.5 L227,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M395,52.5 L445.5,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M569.5,52.5 L628.5,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M695,83 L695,149.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M620,171.5 L574,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M441,171.5 L386,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M236,171.5 L155,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M101.5,202 L101.5,268.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M155,290.5 L253.5,290.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M368.5,290.5 L463,290.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M552,290.5 L628.5,290.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M695,260 L695.0,225.0 Q695,216 686.0,216.0 L409.0,216.0 Q400,216 400.0,207.0 L400.0,97.5 Q400,88.5 391.0,88.5 L318.0,88.5 Q311,88.5 311.0,81.5 L311,74.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="30.5" width="159" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101.5" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101.5" dy="0">Objetos y áreas</tspan></text><rect x="227" y="30.5" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="311" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="311" dy="0">Commits atómicos</tspan></text><rect x="445.5" y="22" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="507.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="507.5" dy="0">Ramas e</tspan><tspan x="507.5" dy="19.2">integración</tspan></text><rect x="628.5" y="22" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="695" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="695" dy="0">Revisión por</tspan><tspan x="695" dy="19.2">riesgo</tspan></text><rect x="620" y="149.5" width="150" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="695" y="175.