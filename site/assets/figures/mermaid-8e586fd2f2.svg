<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 836 262" width="836" height="262" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Fallos posibles del sistema» … «Incidente o dato nuevo»</title><desc id="d">Diagrama de flujo con 7 pasos. «Fallos posibles del sistema» lleva a «Probabilidad e impacto por componente». «Probabilidad e impacto por componente» lleva a «Reparto del presupuesto de pruebas». «Reparto del presupuesto de pruebas» lleva a «Nivel que puede ver cada clase de fallo». «Nivel que puede ver cada clase de fallo» lleva a «Plan: qué se prueba y con qué técnica». «Plan: qué se prueba y con qué técnica» lleva a «Exclusiones con razón y caducidad». «Exclusiones con razón y caducidad» lleva a «Incidente o dato nuevo». «Incidente o dato nuevo» lleva a «Probabilidad e impacto por componente» (reestimar).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="836" height="262" fill="#ffffff"/><path d="M181,62 L236,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M386,62 L445.5,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M595.5,62 L650.5,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M730,102 L730,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M646,200 L600,200" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M441,200 L395,200" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M311,169.5 L311,102" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="31.5" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101.5" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101.5" dy="0">Fallos posibles</tspan><tspan x="101.5" dy="19.2">del sistema</tspan></text><rect x="236" y="22" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="311" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="311" dy="0">Probabilidad e</tspan><tspan x="311" dy="19.2">impacto por</tspan><tspan x="311" dy="19.2">componente</tspan></text><rect x="445.5" y="22" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="520.5" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="520.5" dy="0">Reparto del</tspan><tspan x="520.5" dy="19.2">presupuesto de</tspan><tspan x="520.5" dy="19.2">pruebas</tspan></text><rect x="650.5" y="22" width="159" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="730" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="730" dy="0">Nivel que puede</tspan><tspan x="730" dy="19.2">ver cada clase</tspan><tspan x="730" dy="19.2">de fallo</tspan></text><rect x="646" y="160" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="730" y="185" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="730" dy="0">Plan: qué se</tspan><tspan x="730" dy="19.2">prueba y con qué</tspan><tspan x="730" dy="19.2">técnica</tspan></text><rect x="441" y="160" width="159" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="520.5" y="185" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="520.5" dy="0">Exclusiones con</tspan><tspan x="520.5" dy="19.2">razón y</tspan><tspan x="520.5" dy="19.2">caducidad</tspan></text><rect x="227" y="169.5" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="311" y="194.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="311" dy="0">Incidente o dato</tspan><tspan x="311" dy="19.2">nuevo</tspan></text><rect x="317" y="123.8" width="86" height="24" rx="4" fill="#ffffff"/><text x="360" y="139.7" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="360" dy="0">reestimar</tspan></text></svg>
