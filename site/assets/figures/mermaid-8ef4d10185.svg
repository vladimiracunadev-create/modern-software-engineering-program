<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 737 727" width="737" height="727" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Petición» … «Respuesta a cada petición»</title><desc id="d">Diagrama de flujo con 9 pasos. «Petición» lleva a «Validación de entrada». «Validación de entrada» lleva a «Cola». «Cola» lleva a «¿Lote lleno o espera agotada?». «¿Lote lleno o espera agotada?» lleva a «Cola» (no). «¿Lote lleno o espera agotada?» lleva a «Ejecución del lote en CPU o acelerador» (sí). «Ejecución del lote en CPU o acelerador» lleva a «Respuesta a cada petición». «Carga mayor que capacidad» lleva a «Rechazar, degradar o escalar». «Cola» lleva a «Rechazar, degradar o escalar». «Pesos y formato: precisión, tamaño, carga» lleva a «Ejecución del lote en CPU o acelerador».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="737" height="727" fill="#ffffff"/><path d="M329.2,66 L329.2,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M329.2,185 L329.2,209.2 Q329.2,218.2 320.2,218.2 L286.0,218.2 Q277,218.2 277.0,227.2 L277,251.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M277,295.5 L277.0,319.8 Q277,328.8 268.0,328.8 L158.5,328.8 Q149.5,328.8 149.5,337.8 L149.5,362" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M149.5,448 L149.5,456.0 Q149.5,464 157.5,464.0 L407.6,464.0 Q416.6,464 416.6,473.0 L416.6,506" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M416.6,586 L416.6,607.5 Q416.6,615 424.1,615.0 L424.1,615.0 Q431.6,615 431.6,622.5 L431.6,644" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M428.5,304 L428.5,330.2 Q428.5,339.2 419.5,339.2 L412.5,339.2 Q403.5,339.2 403.5,348.2 L403.5,374.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M277,295.5 L277.0,326.0 Q277,335 286.0,335.0 L394.5,335.0 Q403.5,335 403.5,344.0 L403.5,374.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M622.5,445 L622.5,466.5 Q622.5,475.5 613.5,475.5 L425.6,475.5 Q416.6,475.5 416.6,484.5 L416.6,506" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M277,405 L288.0,405.0 Q297,405 297.0,396.0 L297.0,318.5 Q297,309.5 306.0,309.5 L320.0,309.5 Q329,309.5 329.0,300.5 L329.0,280.5 Q329,273.5 322.0,273.5 L315,273.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="280.2" y="22" width="98" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="329.2" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="329.2" dy="0">Petición</tspan></text><rect x="258.2" y="124" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="329.2" y="149.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="329.2" dy="0">Validación de</tspan><tspan x="329.2" dy="19.2">entrada</tspan></text><rect x="239" y="251.5" width="76" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="277" y="277.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="277" dy="0">Cola</tspan></text><polygon points="149.5,362 277,405 149.5,448 22,405" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="149.5" y="399.6" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="149.5" dy="0">¿Lote lleno o</tspan><tspan x="149.5" dy="19.2">espera agotada?</tspan></text><rect x="324.1" y="506" width="185" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="416.6" y="531" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="416.6" dy="0">Ejecución del lote</tspan><tspan x="416.6" dy="19.2">en CPU o</tspan><tspan x="416.6" dy="19.2">acelerador</tspan></text><rect x="347.6" y="644" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="431.6" y="669.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="431.6" dy="0">Respuesta a cada</tspan><tspan x="431.6" dy="19.2">petición</tspan></text><rect x="349" y="243" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="428.5" y="268.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="428.5" dy="0">Carga mayor que</tspan><tspan x="428.5" dy="19.2">capacidad</tspan></text><rect x="311" y="374.5" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="403.5" y="399.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="403.5" dy="0">Rechazar, degradar</tspan><tspan x="403.5" dy="19.2">o escalar</tspan></text><rect x="530" y="365" width="185" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="622.5" y="390" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="622.5" dy="0">Pesos y formato:</tspan><tspan x="622.5" dy="19.2">precisión, tamaño,</tspan><tspan x="622.5" dy="19.2">carga</tspan></text><rect x="303" y="345.2" width="29" height="24" rx="4" fill="#ffffff"/><text x="317.5" y="361.1" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="317.5" dy="0">no</tspan></text><rect x="381.6" y="473" width="29" height="24" rx="4" fill="#ffffff"/><text x="396.1" y="488.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="396.1" dy="0">sí</tspan></text></svg>
