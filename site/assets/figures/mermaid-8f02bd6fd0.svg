<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 369 915" width="369" height="915" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Hipótesis y efecto a detectar» … «Aborto y restauración» y «Informe de evidencia»</title><desc id="d">Diagrama de flujo con 8 pasos. «Hipótesis y efecto a detectar» lleva a «Radio mínimo con potencia suficiente». «Radio mínimo con potencia suficiente» lleva a «Dimensiones: tráfico, duración, intensidad, alcance». «Dimensiones: tráfico, duración, intensidad, alcance» lleva a «Condiciones de aborto sobre el grupo experimental». «Condiciones de aborto sobre el grupo experimental» lleva a «Reversión probada». «Reversión probada» lleva a «Ejecución y comparación con el control». «Ejecución y comparación con el control» lleva a «Aborto y restauración» (se supera un límite). «Ejecución y comparación con el control» lleva a «Informe de evidencia» (termina el tiempo).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="369" height="915" fill="#ffffff"/><path d="M166.3,83 L166.3,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M166.4,221 L166.4,279" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M166.7,378 L166.7,436" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M166.9,516 L166.9,574" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M167.3,618 L167.3,676" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M167.4,756 L167.4,764.0 Q167.4,772 159.4,772.0 L97.5,772.0 Q88.5,772 88.5,781.0 L88.5,832" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M167.4,756 L167.4,764.0 Q167.4,772 175.4,772.0 L237.5,772.0 Q246.5,772 246.5,781.0 L246.5,832" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="73.8" y="22" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="166.3" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="166.3" dy="0">Hipótesis y efecto</tspan><tspan x="166.3" dy="19.2">a detectar</tspan></text><rect x="82.3" y="141" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="166.3" y="166" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="166.3" dy="0">Radio mínimo con</tspan><tspan x="166.3" dy="19.2">potencia</tspan><tspan x="166.3" dy="19.2">suficiente</tspan></text><rect x="74" y="279" width="185" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="166.5" y="303.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="166.5" dy="0">Dimensiones:</tspan><tspan x="166.5" dy="19.2">tráfico, duración,</tspan><tspan x="166.5" dy="19.2">intensidad,</tspan><tspan x="166.5" dy="19.2">alcance</tspan></text><rect x="74.3" y="436" width="185" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="166.8" y="461" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="166.8" dy="0">Condiciones de</tspan><tspan x="166.8" dy="19.2">aborto sobre el</tspan><tspan x="166.8" dy="19.2">grupo experimental</tspan></text><rect x="79.1" y="574" width="176" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="167.1" y="600.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="167.1" dy="0">Reversión probada</tspan></text><rect x="74.9" y="676" width="185" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="167.4" y="701" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="167.4" dy="0">Ejecución y</tspan><tspan x="167.4" dy="19.2">comparación con el</tspan><tspan x="167.4" dy="19.2">control</tspan></text><rect x="22" y="832" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="88.5" y="857.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="88.5" dy="0">Aborto y</tspan><tspan x="88.5" dy="19.2">restauración</tspan></text><rect x="189" y="832" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="246.5" y="857.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="246.5" dy="0">Informe de</tspan><tspan x="246.5" dy="19.2">evidencia</tspan></text><rect x="94.5" y="781" width="110" height="42" rx="4" fill="#ffffff"/><text x="149.5" y="796.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="149.5" dy="0">se supera un</tspan><tspan x="149.5" dy="17.92">límite</tspan></text><rect x="252.5" y="781" width="94" height="42" rx="4" fill="#ffffff"/><text x="299.5" y="796.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="299.5" dy="0">termina el</tspan><tspan x="299.5" dy="17.92">tiempo</tspan></text></svg>
