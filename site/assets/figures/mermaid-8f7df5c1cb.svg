<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 184" width="840" height="184" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Adopción» … «Censura e incertidumbre»</title><desc id="d">Diagrama de flujo con 5 pasos. «Adopción» lleva a «Tarea útil». «Tarea útil» lleva a «Retención por cohortes». «Retención por cohortes» lleva a «Segmentos y heterogeneidad». «Segmentos y heterogeneidad» lleva a «Censura e incertidumbre». «Censura e incertidumbre» lleva a «Adopción» (la definición cambia).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="840" height="184" fill="#ffffff"/><path d="M120,122 L166,122" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M281,122 L327,122" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M434,122 L480,122" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M630,122 L676,122" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M747,91.5 L747.0,77.0 Q747,68 738.0,68.0 L80.0,68.0 Q71,68 71.0,77.0 L71,100" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="100" width="98" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="71" y="126.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="71" dy="0">Adopción</tspan></text><rect x="166" y="100" width="115" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="223.5" y="126.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="223.5" dy="0">Tarea útil</tspan></text><rect x="327" y="82" width="107" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="380.5" y="107" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="380.5" dy="0">Retención</tspan><tspan x="380.5" dy="19.2">por</tspan><tspan x="380.5" dy="19.2">cohortes</tspan></text><rect x="480" y="91.5" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="555" y="116.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="555" dy="0">Segmentos y</tspan><tspan x="555" dy="19.2">heterogeneidad</tspan></text><rect x="676" y="91.5" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="747" y="116.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="747" dy="0">Censura e</tspan><tspan x="747" dy="19.2">incertidumbre</tspan></text><rect x="350" y="22" width="118" height="42" rx="4" fill="#ffffff"/><text x="409" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="409" dy="0">la definición</tspan><tspan x="409" dy="17.92">cambia</tspan></text></svg>
