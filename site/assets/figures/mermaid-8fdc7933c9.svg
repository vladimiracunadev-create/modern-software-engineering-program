<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 334" width="700" height="334" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Persona» y «Guion» … «Ayuda», «Error de uso», «Resultado» y «Compatibilidad»</title><desc id="d">Diagrama de flujo con 7 pasos. «Persona» lleva a «Gramática» (teclea). «Guion» lleva a «Gramática» (invoca). «Gramática» lleva a «Ayuda». «Gramática» lleva a «Error de uso». «Gramática» lleva a «Resultado». «Ayuda» lleva a «Persona» (stdout, código 0). «Error de uso» lleva a «Guion» (stderr, código 2). «Resultado» lleva a «Guion» (stdout, código 0). «Gramática» lleva a «Compatibilidad» (cambia). «Compatibilidad» lleva a «Guion» (rompe a).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="700" height="334" fill="#ffffff"/><path d="M250.5,126 L258.5,126.0 Q266.5,126 266.5,134.0 L266.5,158.0 Q266.5,167 275.5,167.0 L335.5,167" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M244,208 L252.0,208.0 Q260,208 260.0,200.0 L260.0,176.0 Q260,167 269.0,167.0 L335.5,167" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M442.5,167 L494.5,167.0 Q503.5,167 503.5,158.0 L503.5,53.0 Q503.5,44 512.5,44.0 L564.5,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M442.5,167 L480.3,167.0 Q489.3,167 489.3,158.0 L489.3,135.0 Q489.3,126 498.3,126.0 L536,126" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M442.5,167 L486.7,167.0 Q495.7,167 495.7,176.0 L495.7,199.0 Q495.7,208 504.7,208.0 L549,208" fill="none" stroke