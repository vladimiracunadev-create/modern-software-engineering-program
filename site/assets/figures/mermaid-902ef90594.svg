<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 818 245" width="818" height="245" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Palabras del lector» y «Páginas» … «Recuperabilidad medida»</title><desc id="d">Diagrama de flujo con 7 pasos. «Palabras del lector» lleva a «Buscador léxico». «Palabras del lector» lleva a «Glosario: término preferido y alternativos». «Glosario: término preferido y alternativos» lleva a «Buscador léxico». «Páginas» lleva a «Buscador léxico». «Páginas» lleva a «Estructura: índices y enlaces». «Estructura: índices y enlaces» lleva a «Alcance desde la portada». «Buscador léxico» lleva a «Recuperabilidad medida». «Alcance desde la portada» lleva a «Recuperabilidad medida». «Recuperabilidad medida» lleva a «Glosario: término preferido y alternativos» (consulta sin resultado).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="818" height="245" fill="#ffffff"/><path d="M88.5,47.5 L88.5,33.0 Q88.5,24 97.5,24.0 L498.0,24.0 Q507,24 507.0,33.0 L507,56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M155,78 L201,78" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M377,78 L427.5,78" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M88.5,164.5 L88.5,141.0 Q88.5,132 97.5,132.0 L498.0,132.0 Q507,132 507.0,123.0 L507,100" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M133,186.5 L201,186.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M377,186.5 L423,186.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M586.5,78 L602.8,78.0 Q611.8,78 611.8,87.0 L611.8,123.2 Q611.8,132.2 620.8,132.2 L637,132.2" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M591,186.5 L605.0,186.5 Q614,186.5 614.0,177.5 L614.0,141.2 Q614,132.2 623.0,132.2 L637,132.2" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M716.5,162.7 L716.5,169.7 Q716.5,176.7 709.5,176.7 L609.5,176.7 Q600.5,176.7 600.5,167.7 L600.5,141.2 Q600.5,132.2 591.5,132.2 L296.1,132.2 Q289,132.2 289.0,125.1 L289,118" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="47.5" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="88.5" y="72.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="88.5" dy="0">Palabras del</tspan><tspan x="88.5" dy="19.2">lector</tspan></text><rect x="427.5" y="56" width="159" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="507" y="82.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="507" dy="0">Buscador léxico</tspan></text><rect x="201" y="38" width="176" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="289" y="63" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="289" dy="0">Glosario: término</tspan><tspan x="289" dy="19.2">preferido y</tspan><tspan x="289" dy="19.2">alternativos</tspan></text><rect x="44" y="164.5" width="89" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="88.5" y="190.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="88.5" dy="0">Páginas</tspan></text><rect x="201" y="156" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="289" y="181.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="289" dy="0">Estructura:</tspan><tspan x="289" dy="19.2">índices y enlaces</tspan></text><rect x="423" y="156" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="507" y="181.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="507" dy="0">Alcance desde la</tspan><tspan x="507" dy="19.2">portada</tspan></text><rect x="637" y="101.7" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="716.5" y="126.8" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="716.5" dy="0">Recuperabilidad</tspan><tspan x="716.5" dy="19.2">medida</tspan></text><rect x="615.1" y="180.7" width="110" height="42" rx="4" fill="#ffffff"/><text x="670.1" y="196.6" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="670.1" dy="0">consulta sin</tspan><tspan x="670.1" dy="17.92">resultado</tspan></text></svg>
