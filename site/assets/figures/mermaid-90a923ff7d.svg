os y</tspan><tspan x="365" dy="19.2">sobrante</tspan></text><rect x="99" y="256.2" width="86" height="42" rx="4" fill="#ffffff"/><text x="142" y="272.1" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="142" dy="0">lotes por</tspan><tspan x="142" dy="17.92">ciclo</tspan></text><rect x="292" y="252" width="94" height="42" rx="4" fill="#ffffff"/><text x="339" y="267.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="339" dy="0">extracción</tspan><tspan x="339" dy="17.92">continua</tspan></text><rect x="396" y="247" width="110" height="24" rx="4" fill="#ffffff"/><text x="451" y="262.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="451" dy="0">apetito fijo</tspan></text><rect x="613" y="300" width="86" height="24" rx="4" fill="#ffffff"/><text x="656" y="315.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="656" dy="0">evidencia</tspan></text></svg>
