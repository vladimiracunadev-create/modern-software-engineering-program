<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 721 624" width="721" height="624" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Tipo de trabajo y riesgo» … «Espera, fallos y sobrante»</title><desc id="d">Diagrama de flujo con 9 pasos. «Tipo de trabajo y riesgo» lleva a «Política de entrada». «Política de entrada» lleva a «Scrum: sprint» (lotes por ciclo). «Política de entrada» lleva a «Kanban: límite de trabajo» (extracción continua). «Política de entrada» lleva a «Shape Up: ciclo de seis semanas» (apetito fijo). «Tipo de trabajo y riesgo» lleva a «Prácticas técnicas: XP». «Scrum: sprint» lleva a «Política de compromiso». «Kanban: límite de trabajo» lleva a «Política de compromiso». «Shape Up: ciclo de seis semanas» lleva a «Política de recorte». «Política de compromiso» lleva a «Espera, fallos y sobrante». «Política de recorte» lleva a «Espera, fallos y sobrante». «Espera, fallos y sobrante» lleva a «Tipo de trabajo y riesgo» (evidencia).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="721" height="624" fill="#ffffff"/><path d="M351.2,83 L351.2,103.0 Q351.2,112 342.2,112.0 L261.9,112.0 Q252.9,112 252.9,121.0 L252.9,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M252.9,227 L252.9,235.0 Q252.9,243 244.9,243.0 L102.0,243.0 Q93,243 93.0,252.0 L93,311.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M252.9,227 L252.9,235.0 Q252.9,243 260.9,243.0 L277.0,243.0 Q286,243 286.0,252.0 L286,303" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M