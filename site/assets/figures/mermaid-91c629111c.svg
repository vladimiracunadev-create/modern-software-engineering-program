<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 679 795" width="679" height="795" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Archivo de bloqueo» y «Build: constructor, fuente, parámetros, materiales» … «Se puede desplegar» y «Se rechaza»</title><desc id="d">Diagrama de flujo con 10 pasos. «Archivo de bloqueo» lleva a «SBOM: componentes, versiones, huellas, relaciones». «Build: constructor, fuente, parámetros, materiales» lleva a «Procedencia». «Artefacto y huella» lleva a «Atestación: afirmación ligada a la huella». «SBOM: componentes, versiones, huellas, relaciones» lleva a «Atestación: afirmación ligada a la huella». «Procedencia» lleva a «Atestación: afirmación ligada a la huella». «Atestación: afirmación ligada a la huella» lleva a «Verificador: ¿coincide con lo esperado?». «Verificador: ¿coincide con lo esperado?» lleva a «Se puede desplegar» (sí). «Verificador: ¿coincide con lo esperado?» lleva a «Se rechaza» (no). «Lo que el documento no puede decir: fuente maliciosa, constructor deshonesto» lleva a «Verificador: ¿coincide con lo esperado?».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="679" height="795" fill="#ffffff"/><path d="M115.7,103 L115.7,198" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M306.4,140 L306.4,225.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M493.8,269.5 L493.8,317.8 Q493.8,326.8 484.8,326.8 L331.7,326.8 Q322.7,326.8 322.7,335.8 L322.7,384" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M116.8,297 L1