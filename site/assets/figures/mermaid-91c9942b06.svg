<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 630 644" width="630" height="644" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Carga: solicitudes de tamaños muy distintos» y «Datos: escrituras confirmadas» … «Turnos o azar: iguala solicitudes, no trabajo», «Dos opciones o menos conexiones: iguala la cola», «Asíncrona: pérdida al conmutar», «Síncrona o semisíncrona: latencia», «Hash: esparce escrituras, dispersa consultas» y «Rango: agrupa consultas, acumula escrituras»</title><desc id="d">Diagrama de flujo con 11 pasos. «Carga: solicitudes de tamaños muy distintos» lleva a «Balanceo». «Balanceo» lleva a «Turnos o azar: iguala solicitudes, no trabajo». «Balanceo» lleva a «Dos opciones o menos conexiones: iguala la cola». «Datos: escrituras confirmadas» lleva a «Replicación». «Replicación» lleva a «Asíncrona: pérdida al conmutar». «Replicación» lleva a «Síncrona o semisíncrona: latencia». «Datos: escrituras confirmadas» lleva a «Reparto». «Reparto» lleva a «Hash: esparce escrituras, dispersa consultas». «Reparto» lleva a «Rango: agrupa consultas, acumula escrituras».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="630" height="644" fill="#ffffff"/><path d="M207,279.5 L227.5,279.5 Q236.5,279.5 236.5,270.5 L236.5,263.0 Q236.5,254 245.5,254.0 L266,254" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M364,254 L391.0,254.0 Q400,254 400.0,245.0 L400.0,80.5 Q400,71.5 409.0,71.5 L436,71.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M364,254 L386.8,254.0 Q395.8,254 395.8,245.0 L39