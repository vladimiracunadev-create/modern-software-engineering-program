<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 933 88" width="933" height="88" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «🎯 Ambigüedad» … «📈 Aprendizaje»</title><desc id="d">Diagrama de flujo con 5 pasos. «🎯 Ambigüedad» lleva a «🧠 Alineamiento». «🧠 Alineamiento» lleva a «🛠️ Decisión». «🛠️ Decisión» lleva a «🔎 Delegación». «🔎 Delegación» lleva a «📈 Aprendizaje».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="933" height="88" fill="#ffffff"/><path d="M161,44 L207,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M364,44 L410,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M532,44 L578,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M717,44 L763,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="22" width="139" height="44" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="91.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="91.5" dy="0">🎯 Ambigüedad</tspan></text><rect x="207" y="22" width="157" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="285.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="285.5" dy="0">🧠 Alineamiento</tspan></text><rect x="410" y="22" width="122" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="471" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="471" dy="0">🛠️ 