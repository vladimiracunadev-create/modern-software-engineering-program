<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 534 839" width="534" height="839" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Dominio dueño del dato» y «Plataforma de autoservicio» … «Consumidor reporta una deriva»</title><desc id="d">Diagrama de flujo con 10 pasos. «Dominio dueño del dato» lleva a «Producto de datos». «Producto de datos» lleva a «Contrato: esquema, calidad, frescura». «Contrato: esquema, calidad, frescura» lleva a «Comprobaciones automáticas al publicar». «Comprobaciones automáticas al publicar» lleva a «¿Pasa?». «¿Pasa?» lleva a «Catálogo y consumidores» (sí). «¿Pasa?» lleva a «El dueño corrige antes de publicar» (no). «Plataforma de autoservicio» lleva a «Producto de datos». «Gobernanza federada» lleva a «Contrato: esquema, calidad, frescura». «Catálogo y consumidores» lleva a «Consumidor reporta una deriva». «Consumidor reporta una deriva» lleva a «Dominio dueño del dato».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="534" height="839" fill="#ffffff"/><path d="M126,83 L126.0,107.2 Q126,116.2 135.0,116.2 L213.5,116.2 Q222.5,116.2 222.5,125.2 L222.5,149.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M222.5,193.5 L222.5,217.8 Q222.5,226.8 231.5,226.8 L329.6,226.8 Q338.6,226.8 338.6,235.8 L338.6,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M341.3,321 L341.3,379" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M341.5,459 L341.5,517" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><pat