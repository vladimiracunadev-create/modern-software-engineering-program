<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 766 343" width="766" height="343" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Frontera de confirmación» … «Servicio contractual»</title><desc id="d">Diagrama de flujo con 11 pasos. «Frontera de confirmación» lleva a «Recursos y métodos». «Recursos y métodos» lleva a «Estilo de interfaz». «Estilo de interfaz» lleva a «Validación y errores». «Validación y errores» lleva a «Identidad y política». «Identidad y política» lleva a «Idempotencia y reintentos». «Idempotencia y reintentos» lleva a «Trabajo diferido». «Trabajo diferido» lleva a «Archivos y límites». «Archivos y límites» lleva a «Caché y protección». «Caché y protección» lleva a «Sondeos y apagado». «Sondeos y apagado» lleva a «Servicio contractual». «Servicio contractual» lleva a «Frontera de confirmación» (incidente o deriva).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="766" height="343" fill="#ffffff"/><path d="M155,52.5 L227.5,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M342.5,52.5 L436.5,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M543.5,52.5 L611,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M677.5,83 L677.5,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M615.5,171.5 L565,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M415,171.5 L369,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><pat