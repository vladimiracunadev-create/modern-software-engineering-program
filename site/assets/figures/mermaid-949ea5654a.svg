<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 831 183" width="831" height="183" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Métrica norte» … «Alarmas y potencia»</title><desc id="d">Diagrama de flujo con 5 pasos. «Métrica norte» lleva a «Guardas». «Guardas» lleva a «Métricas contrarias». «Métricas contrarias» lleva a «Descomposición». «Descomposición» lleva a «Alarmas y potencia». «Alarmas y potencia» lleva a «Métrica norte» (un umbral o una definición cambia).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="831" height="183" fill="#ffffff"/><path d="M164,130.5 L210,130.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M299,130.5 L345,130.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M460,130.5 L506,130.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M656,130.5 L702,130.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M755.5,100 L755.5,93.0 Q755.5,86 748.5,86.0 L102.0,86.0 Q93,86 93.0,95.0 L93,108.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="108.5" width="142" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="93" y="134.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="93" dy="0">Métrica norte</tspan></text><rect x="210" y="108.5" width="89" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="254.5" y="134.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="254.5" dy="0">Guardas</tspan></text><rect x="345" y="100" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="402.5" y="125.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="402.5" dy="0">Métricas</tspan><tspan x="402.5" dy="19.2">contrarias</tspan></text><rect x="506" y="108.5" width="150" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="581" y="134.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="581" dy="0">Descomposición</tspan></text><rect x="702" y="100" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="755.5" y="125.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="755.5" dy="0">Alarmas y</tspan><tspan x="755.5" dy="19.2">potencia</tspan></text><rect x="361.2" y="22" width="126" height="60" rx="4" fill="#ffffff"/><text x="424.2" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="424.2" dy="0">un umbral o</tspan><tspan x="424.2" dy="17.92">una definición</tspan><tspan x="424.2" dy="17.92">cambia</tspan></text></svg>
