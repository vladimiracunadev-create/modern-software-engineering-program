<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 696 199" width="696" height="199" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Valor y costo» … «Negociación»</title><desc id="d">Diagrama de flujo con 4 pasos. «Valor y costo» lleva a «Dependencias». «Dependencias» lleva a «Conjunto entregable». «Conjunto entregable» lleva a «Negociación». «Negociación» lleva a «Valor y costo» (ciclo o veto). «Dependencias» lleva a «Valor y costo» (requisito faltante).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="696" height="199" fill="#ffffff"/><path d="M164,94.5 L210,94.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M343,94.5 L389,94.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M504,94.5 L550,94.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M612,72.5 L612.0,59.0 Q612,50 603.0,50.0 L102.0,50.0 Q93,50 93.0,59.0 L93,72.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><path d="M276.5,116.5 L276.5,123.5 Q276.5,130.5 269.5,130.5 L100.0,130.5 Q93,130.5 93.0,123.5 L93,116.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="72.5" width="142" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="93" y="98.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="93" dy="0">Valor y costo</tspan></text><rect x="210" y="72.5" width="133" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="276.5" y="98.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="276.5" dy="0">Dependencias</tspan></text><rect x="389" y="64" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="446.5" y="89.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="446.5" dy="0">Conjunto</tspan><tspan x="446.5" dy="19.2">entregable</tspan></text><rect x="550" y="72.5" width="124" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="612" y="98.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="612" dy="0">Negociación</tspan></text><rect x="297.5" y="22" width="110" height="24" rx="4" fill="#ffffff"/><text x="352.5" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="352.5" dy="0">ciclo o veto</tspan></text><rect x="141.8" y="134.5" width="86" height="42" rx="4" fill="#ffffff"/><text x="184.8" y="150.4" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="184.8" dy="0">requisito</tspan><tspan x="184.8" dy="17.92">faltante</tspan></text></svg>
