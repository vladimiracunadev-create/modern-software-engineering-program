<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 509 231" width="509" height="231" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Cliente» y «Subtipo» … «Estado»</title><desc id="d">Diagrama de flujo con 4 pasos. «Cliente» lleva a «Operación» (cumple precondición). «Operación» lleva a «Cliente» (garantiza postcondición). «Operación» lleva a «Estado». «Estado» lleva a «Operación» (invariante). «Subtipo» lleva a «Operación» (acepta más, garantiza más).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="509" height="231" fill="#ffffff"/><path d="M111,104 L119.0,104.0 Q127,104 127.0,112.0 L127.0,136.0 Q127,145 136.0,145.0 L253,145" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M360,145 L406,145" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M111,186 L119.0,186.0 Q127,186 127.0,178.0 L127.0,154.0 Q127,145 136.0,145.0 L253,145" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M306.5,123 L306.5,77.0 Q306.5,68 297.5,68.0 L73.5,68.0 Q66.5,68 66.5,75.0 L66.5,82" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><path d="M446.5,167 L446.5,174.0 Q446.5,181 439.5,181.0 L313.5,181.0 Q306.5,181 306.5,174.0 L306.5,167" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="82" width="89" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="66.5" y="108.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="66.5" dy="0">Cliente</tspan></text><rect x="253" y="123" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="306.5" y="149.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="306.5" dy="0">Operación</tspan></text><rect x="406" y="123" width="81" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="446.5" y="149.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="446.5" dy="0">Estado</tspan></text><rect x="22" y="164" width="89" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="66.5" y="190.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="66.5" dy="0">Subtipo</tspan></text><rect x="135" y="99" width="110" height="42" rx="4" fill="#ffffff"/><text x="190" y="114.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="190" dy="0">cumple</tspan><tspan x="190" dy="17.92">precondición</tspan></text><rect x="127.5" y="22" width="118" height="42" rx="4" fill="#ffffff"/><text x="186.5" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="186.5" dy="0">garantiza</tspan><tspan x="186.5" dy="17.92">postcondición</tspan></text><rect x="329.5" y="185" width="94" height="24" rx="4" fill="#ffffff"/><text x="376.5" y="200.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="376.5" dy="0">invariante</tspan></text><rect x="131" y="149" width="118" height="42" rx="4" fill="#ffffff"/><text x="190" y="164.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="190" dy="0">acepta más,</tspan><tspan x="190" dy="17.92">garantiza más</tspan></text></svg>
