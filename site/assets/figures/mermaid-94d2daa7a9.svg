<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 405 787" width="405" height="787" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Manifiesto y restricciones» y «Índices firmados o metadatos» … «Actualizar o revertir»</title><desc id="d">Diagrama de flujo con 8 pasos. «Manifiesto y restricciones» lleva a «Resolver grafo». «Índices firmados o metadatos» lleva a «Resolver grafo». «Resolver grafo» lleva a «Bloqueo o plan». «Bloqueo o plan» lleva a «Verificar procedencia e integridad». «Verificar procedencia e integridad» lleva a «Aplicar en alcance elegido». «Aplicar en alcance elegido» lleva a «Probar». «Probar» lleva a «Actualizar o revertir».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="405" height="787" fill="#ffffff"/><path d="M93,83 L93.0,103.0 Q93,112 102.0,112.0 L182.7,112.0 Q191.7,112 191.7,121.0 L191.7,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M290.5,83 L290.5,103.0 Q290.5,112 281.5,112.0 L200.7,112.0 Q191.7,112 191.7,121.0 L191.7,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M192.2,185 L192.2,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M193.3,287 L193.3,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M194.3,425 L194.3,483" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M195,544 L195,602" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M195.5,646 L195.5,704" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="22" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="93" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="93" dy="0">Manifiesto y</tspan><tspan x="93" dy="19.2">restricciones</tspan></text><rect x="116.7" y="141" width="150" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="191.7" y="167.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="191.7" dy="0">Resolver grafo</tspan></text><rect x="198" y="22" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="290.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="290.5" dy="0">Índices firmados o</tspan><tspan x="290.5" dy="19.2">metadatos</tspan></text><rect x="117.7" y="243" width="150" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="192.7" y="269.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="192.7" dy="0">Bloqueo o plan</tspan></text><rect x="122.8" y="345" width="142" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="193.8" y="370" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="193.8" dy="0">Verificar</tspan><tspan x="193.8" dy="19.2">procedencia e</tspan><tspan x="193.8" dy="19.2">integridad</tspan></text><rect x="102.2" y="483" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="194.7" y="508.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="194.7" dy="0">Aplicar en alcance</tspan><tspan x="194.7" dy="19.2">elegido</tspan></text><rect x="154.8" y="602" width="81" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="195.3" y="628.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="195.3" dy="