<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 934 275" width="934" height="275" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Commit», «Rama protegida» y «Reescritura» … «Sin push forzado»</title><desc id="d">Diagrama de flujo con 10 pasos. «Commit» lleva a «Firma con clave». «Firma con clave» lleva a «Verificación con firmantes permitidos». «Rama protegida» lleva a «PR obligatorio». «PR obligatorio» lleva a «Revisión y comprobaciones». «Revisión y comprobaciones» lleva a «Commits firmados». «Commits firmados» lleva a «Sin push forzado». «Reescritura» lleva a «Firmas inválidas» (cambia identificadores).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="934" height="275" fill="#ffffff"/><path d="M124.5,52.5 L312.5,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M419.5,52.5 L442.0,52.5 Q451,52.5 451.0,61.5 L451.0,86.0 Q451,95 460.0,95.0 L482.5,95" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M137.5,137.5 L304,137.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M428,137.5 L442.0,137.5 Q451,137.5 451.0,146.5 L451.0,190.0 Q451,199 460.0,199.0 L474,199" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M624,199 L670,199" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M768,199 L814,199" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M146,222.5 L312.5,222.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><re