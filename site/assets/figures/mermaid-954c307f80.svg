<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 738 739" width="738" height="739" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Sistema en uso» … «Deuda y degradación»</title><desc id="d">Diagrama de flujo con 10 pasos. «Sistema en uso» lleva a «Solicitud de cambio». «Solicitud de cambio» lleva a «Qué la origina». «Qué la origina» lleva a «Correctivo» (un defecto). «Qué la origina» lleva a «Adaptativo» (el entorno cambió). «Qué la origina» lleva a «Perfectivo» (alguien quiere más). «Qué la origina» lleva a «Preventivo» (proteger la capacidad de cambiar). «Correctivo» lleva a «Capacidad mensual». «Adaptativo» lleva a «Capacidad mensual». «Perfectivo» lleva a «Capacidad mensual». «Preventivo» lleva a «Capacidad mensual». «Capacidad mensual» lleva a «Deuda y degradación» (el correctivo consume la reserva). «Deuda y degradación» lleva a «Correctivo» (más incidencias). «Adaptativo» lleva a «Restricción de calendario» (fecha externa).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="738" height="739" fill="#ffffff"/><path d="M400,66 L400,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M400,185 L400.0,205.4 Q400,214 391.4,214.0 L391.4,214.0 Q382.8,214 382.8,222.6 L382.8,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M382.8,305 L382.8,313.0 Q382.8,321 374.8,321.0 L310.4,321.0 Q301.4,321 301.4,330.0 L301.4,399" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M382.8,305 L382.8,313.0 Q382.8,321 374.8,321.0 L161.4,321.0 Q152.4,321 152.4,330.0 L152.4,399" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M382.8,305 L382.8,313.0 Q382.8,321 390.8,321.0 L441.4,321.0 Q450.4,321 450.4,330.0 L450.4,399" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M382.8,305 L382.8,313.0 Q382.8,321 390.8,321.0 L590.4,321.0 Q599.4,321 599.4,330.0 L599.4,399" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M301.4,443 L301.4,467.2 Q301.4,476.2 310.4,476.2 L380.6,476.2 Q389.6,476.2 389.6,485.2 L389.6,509.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M152.4,443 L152.4,467.2 Q152.4,476.2 161.4,476.2 L380.6,476.2 Q389.6,476.2 389.6,485.2 L389.6,509.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M450.4,443 L450.4,467.2 Q450.4,476.2 441.4,476.2 L398.6,476.2 Q389.6,476.2 389.6,485.2 L389.6,509.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M599.4,443 L599.4,467.2 Q599.4,476.2 590.4,476.2 L398.6,476.2 Q389.6,476.2 389.6,485.2 L389.6,509.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M392,553.5 L392,656" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M152.4,443 L152.4,452.7 Q152.4,459 158.7,459.0 L158.7,459.0 Q165,459 165.0,465.3 L165,501" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M332.4,686.5 L263.0,686.5 Q254,686.5 254.0,677.5 L254.0,466.0 Q254,457 245.0,457.0 L238.9,457.0 Q229.9,457 229.9,448.0 L229.9,428.0 Q229.9,421 236.9,421.0 L243.9,421" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="325" y="22" width="150" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="400" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="400" dy="0">Sistema en uso</tspan></text><rect x="333.5" y