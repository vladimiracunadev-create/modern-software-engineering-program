><tspan x="394.4" dy="0">Deuda y</tspan><tspan x="394.4" dy="19.2">degradación</tspan></text><rect x="90" y="501" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="165" y="526.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="165" dy="0">Restricción de</tspan><tspan x="165" dy="19.2">calendario</tspan></text><rect x="307.4" y="348" width="94" height="24" rx="4" fill="#ffffff"/><text x="354.4" y="363.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354.4" dy="0">un defecto</tspan></text><rect x="158.4" y="339" width="94" height="42" rx="4" fill="#ffffff"/><text x="205.4" y="354.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="205.4" dy="0">el entorno</tspan><tspan x="205.4" dy="17.92">cambió</tspan></text><rect x="456.4" y="339" width="126" height="42" rx="4" fill="#ffffff"/><text x="519.4" y="354.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="519.4" dy="0">alguien quiere</tspan><tspan x="519.4" dy="17.92">más</tspan></text><rect x="605.4" y="330" width="110" height="60" rx="4" fill="#ffffff"/><text x="660.4" y="345.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="660.4" dy="0">proteger la</tspan><tspan x="660.4" dy="17.92">capacidad de</tspan><tspan x="660.4" dy="17.92">cambiar</tspan></text><rect x="398" y="574.8" width="118" height="60" rx="4" fill="#ffffff"/><text x="457" y="590.7" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">el correctivo</tspan><tspan x="457" dy="17.92">consume la</tspan><tspan x="457" dy="17.92">reserva</tspan></text><rect x="260" y="573.7" width="102" height="42" rx="4" fill="#ffffff"/><text x="311" y="589.6" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="311" dy="0">más</tspan><tspan x="311" dy="17.92">incidencias</tspan></text><rect x="22" y="468" width="118"