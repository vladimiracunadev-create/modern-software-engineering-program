<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 895 366" width="895" height="366" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Objeto cliente» … «Política resultante»</title><desc id="d">Diagrama de flujo con 9 pasos. «Objeto cliente» lleva a «¿Qué quiero?». «¿Qué quiero?» lleva a «Adapter» (otra interfaz). «¿Qué quiero?» lleva a «Facade» (menos llamadas). «¿Qué quiero?» lleva a «Proxy» (controlar el acceso). «¿Qué quiero?» lleva a «Composite» (tratar grupo como uno). «¿Qué quiero?» lleva a «Decorator» (añadir comportamiento). «Decorator» lleva a «Orden de la pila». «Orden de la pila» lleva a «Política resultante».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="895" height="366" fill="#ffffff"/><path d="M111,186 L157,186" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M285,186 L293.0,186.0 Q301,186 301.0,178.0 L301.0,59.0 Q301,50 310.0,50.0 L444,50" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M285,186 L293.0,186.0 Q301,186 301.0,178.0 L301.0,127.0 Q301,118 310.0,118.0 L448,118" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M285,186 L450.5,186" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M285,186 L293.0,186.0 Q301,186 301.0,194.0 L301.0,313.0 Q301,322 310.0,322.0 L435,322" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M285,186 L293.0,186.0 Q301,186 301.0,194.0 L301.0,245.0 Q301,254 310.0,254.0 L435,254" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M542,254 L588,254" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M712,254 L758,254" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="155.5" width="89" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="66.5" y="180.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="66.5" dy="0">Objeto</tspan><tspan x="66.5" dy="19.2">cliente</tspan></text><polygon points="221,143 285,186 221,229 157,186" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="221" y="180.6" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="221" dy="0">¿Qué</tspan><tspan x="221" dy="19.2">quiero?</tspan></text><rect x="444" y="28" width="89" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="488.5" y="54.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="488.5" dy="0">Adapter</tspan></text><rect x="448" y="96" width="81" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="488.5" y="122.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="488.5" dy="0">Facade</tspan></text><rect x="450.5" y="164" width="76" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="488.5" y="190.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="488.5" dy="0">Proxy</tspan></text><rect x="435" y="300" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="488.5" y="326.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="488.5" dy="0">Composite</tspan></text><rect x="435" y="232" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="488.5" y="258.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="488.5" dy="0">Decorator</tspan></text><rect x="588" y="223.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="650" y="248.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="650" dy="0">Orden de la</tspan><tspan x="650" dy="19.2">pila</tspan></text><rect x="758" y="223.5" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="815.5" y="248.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="815.5" dy="0">Política</tspan><tspan x="815.5" dy="19.2">resultante</tspan></text><rect x="313.5" y="22" width="118" height="24" rx="4" fill="#ffffff"/><text x="372.5" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372.5" dy="0">otra interfaz</tspan></text><rect x="311.5" y="90" width="126" height="24" rx="4" fill="#ffffff"/><text x="374.5" y="105.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="374.5" dy="0">menos llamadas</tspan></text><rect x="312.8" y="140" width="110" height="42" rx="4" fill="#ffffff"/><text x="367.8" y="155.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="367.8" dy="0">controlar el</tspan><tspan x="367.8" dy="17.92">acceso</tspan></text><rect x="313" y="276" width="110" height="42" rx="4" fill="#ffffff"/><text x="368" y="291.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="368" dy="0">tratar grupo</tspan><tspan x="368" dy="17.92">como uno</tspan></text><rect x="305" y="208" width="126" height="42" rx="4" fill="#ffffff"/><text x="368" y="223.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="368" dy="0">añadir</tspan><tspan x="368" dy="17.92">comportamiento</tspan></text></svg>
