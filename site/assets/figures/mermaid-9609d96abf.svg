<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 799 1040" width="799" height="1040" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Funcionalidad pedida» … «Regresión»</title><desc id="d">Diagrama de flujo con 13 pasos. «Funcionalidad pedida» lleva a «Dimensiones del problema». «Dimensiones del problema» lleva a «Tiempo restante». «Dimensiones del problema» lleva a «Estado de la entrega». «Dimensiones del problema» lleva a «Silencio del curso». «Dimensiones del problema» lleva a «Cursos y personas». «Tiempo restante» lleva a «Ejemplos de frontera». «Estado de la entrega» lleva a «Ejemplos combinatorios». «Silencio del curso» lleva a «Ejemplos combinatorios». «Cursos y personas» lleva a «Ejemplos combinatorios». «Ejemplos de frontera» lleva a «Tabla de ejemplos acordada». «Ejemplos combinatorios» lleva a «Tabla de ejemplos acordada». «Tabla de ejemplos acordada» lleva a «Prueba de aceptación en rojo». «Prueba de aceptación en rojo» lleva a «Ciclos internos de TDD». «Ciclos internos de TDD» lleva a «Aceptación en verde». «Aceptación en verde» lleva a «Regresión».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="799" height="1040" fill="#ffffff"/><path d="M386.1,83 L386.1,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M386.1,202 L386.1,226.2 Q386.1,235.2 377.1,235.2 L110.5,235.2 Q101.5,235.2 101.5,244.2 L101.5,268.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M386.1,202 L386.1,222.0 Q386.1,231 377.1,231.0 L290.5,231.0 Q281.5,231 281.5,240.0 L281.5,260" fill="none" stroke