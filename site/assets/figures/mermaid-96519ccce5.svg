<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 349 753" width="349" height="753" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Texto» … «Revisión reproducible»</title><desc id="d">Diagrama de flujo con 8 pasos. «Texto» lleva a «Bytes». «Bytes» lleva a «Objetos del analizador local de eventos». «Objetos del analizador local de eventos» lleva a «AST y bytecode». «AST y bytecode» lleva a «Proceso». «Proceso» lleva a «Tiempo y memoria». «Proceso» lleva a «Salida». «Salida» lleva a «Revisión reproducible».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="349" height="753" fill="#ffffff"/><path d="M126.2,66 L126.2,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M126.2,168 L126.2,192.4 Q126.2,197 130.8,197.0 L130.8,197.0 Q135.4,197 135.4,201.6 L135.4,226" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M135.4,306 L135.4,327.7 Q135.4,335 142.7,335.0 L142.7,335.0 Q150,335 150.0,342.3 L150,364" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M150,408 L150.0,428.0 Q150,437 159.0,437.0 L162.0,437.0 Q171,437 171.0,446.0 L171,466" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M171,510 L171.0,530.0 Q171,539 162.0,539.0 L115.0,539.0 Q106,539 106.0,548.0 L106,568" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M171,510 L171.0,530.0 Q171,539 180.0,539.0 L255.5,539.0 Q264.5,539 264.5,548.0 L264.5,568" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="