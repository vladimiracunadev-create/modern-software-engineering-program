<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 459 717" width="459" height="717" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Magnitud física» … «Dato validado»</title><desc id="d">Diagrama de flujo con 9 pasos. «Magnitud física» lleva a «Sensor». «Sensor» lleva a «Convertidor ADC». «Convertidor ADC» lleva a «Bus I²C o SPI». «Bus I²C o SPI» lleva a «Trama con código de control». «Trama con código de control» lleva a «Microcontrolador». «Ruido» lleva a «Convertidor ADC». «Errores de bits» lleva a «Bus I²C o SPI». «Microcontrolador» lleva a «Dato validado».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="459" height="717" fill="#ffffff"/><path d="M101.5,66 L101.5,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M101.5,168 L101.5,188.0 Q101.5,197 110.5,197.0 L154.7,197.0 Q163.7,197 163.7,206.0 L163.7,226" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M163.7,270 L163.7,290.0 Q163.7,299 172.7,299.0 L289.1,299.0 Q298.1,299 298.1,308.0 L298.1,328" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M298.1,372 L298.1,392.0 Q298.1,401 307.1,401.0 L320.7,401.0 Q329.7,401 329.7,410.0 L329.7,430" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M329.7,491 L329.7,511.0 Q329.7,520 338.7,520.0 L343.1,520.0 Q352.1,520 352.1,529.0 L352.1,549" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M214,168 L214.0,188.0 Q214,197 205.0,197.0 L172.7,197.0 Q163.7,197 163.7,206.0 L163.7,226" fill="n