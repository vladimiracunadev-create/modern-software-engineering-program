<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 582 768" width="582" height="768" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Intención de cobro con clave» … «Cierre» y «Investigación y ajuste con asiento»</title><desc id="d">Diagrama de flujo con 11 pasos. «Intención de cobro con clave» lleva a «Almacén de claves». «Almacén de claves» lleva a «Procesador» (nueva). «Almacén de claves» lleva a «Respuesta guardada» (repetida). «Procesador» lleva a «Evento de resultado». «Evento de resultado» lleva a «Asiento en el libro». «Asiento en el libro» lleva a «Saldos por cuenta». «Procesador» lleva a «Liquidación del procesador». «Asiento en el libro» lleva a «Conciliación». «Liquidación del procesador» lleva a «Conciliación». «Conciliación» lleva a «Cierre» (explicada). «Conciliación» lleva a «Investigación y ajuste con asiento» (diferencia).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="582" height="768" fill="#ffffff"/><path d="M238.7,83 L238.7,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M238.7,185 L238.7,193.0 Q238.7,201 230.7,201.0 L141.6,201.0 Q132.6,201 132.6,210.0 L132.6,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M238.7,185 L238.7,193.0 Q238.7,201 246.7,201.0 L307.6,201.0 Q316.6,201 316.6,210.0 L316.6,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M132.6,287 L132.6,307.0 Q132.6,316 123.6,316.0 L84.5,316.0 Q75.5,316 75.5,325.0 L75.5,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path