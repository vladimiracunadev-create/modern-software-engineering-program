<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 936 366" width="936" height="366" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Comportamiento que varía» … «Baja de oyentes y aislamiento», «Deshacer comprobado» y «Transiciones explícitas»</title><desc id="d">Diagrama de flujo con 10 pasos. «Comportamiento que varía» lleva a «¿Qué varía?». «¿Qué varía?» lleva a «Strategy» (algoritmo). «¿Qué varía?» lleva a «Observer» (receptores). «¿Qué varía?» lleva a «Command» (la acción misma). «¿Qué varía?» lleva a «State» (según el estado). «¿Qué varía?» lleva a «Template Method» (pasos de un esqueleto). «Observer» lleva a «Baja de oyentes y aislamiento». «Command» lleva a «Deshacer comprobado». «State» lleva a «Transiciones explícitas».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="936" height="366" fill="#ffffff"/><path d="M207,186 L253,186" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M407,186 L415.0,186.0 Q423,186 423.0,178.0 L423.0,59.0 Q423,50 432.0,50.0 L563.5,50" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M407,186 L415.0,186.0 Q423,186 423.0,178.0 L423.0,127.0 Q423,118 432.0,118.0 L563.5,118" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M407,186 L568,186" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M407,186 L415.0,186.0 Q423,186 423.0,194.0 L423.0,245.0 Q423,254 432.0,254.0 L574.5,254" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M407,186 L415.0,186.0 Q423,1