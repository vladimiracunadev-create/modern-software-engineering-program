<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 649 704" width="649" height="704" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Demanda: peticiones por segundo» y «Parte serie + transferencia» … «Costo por petición»</title><desc id="d">Diagrama de flujo con 10 pasos. «Demanda: peticiones por segundo» lleva a «Lote: amortiza la llamada». «Lote: amortiza la llamada» lleva a «Latencia por petición». «Lote: amortiza la llamada» lleva a «Throughput». «Throughput» lleva a «Unidades necesarias». «Unidades necesarias» lleva a «Costo por hora». «Demanda: peticiones por segundo» lleva a «Utilización = demanda / capacidad comprada». «Utilización = demanda / capacidad comprada» lleva a «Costo por petición». «Costo por hora» lleva a «Costo por petición». «Parte serie + transferencia» lleva a «Aceleración total». «Aceleración total» lleva a «Throughput».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="649" height="704" fill="#ffffff"/><path d="M217.3,102 L217.3,126.8 Q217.3,135.8 208.3,135.8 L119.0,135.8 Q110,135.8 110.0,144.8 L110,169.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M110,230.5 L110.0,256.6 Q110,264.2 117.7,264.2 L117.7,264.2 Q125.3,264.2 125.3,271.8 L125.3,298" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M110,230.5 L110.0,259.5 Q110,268.5 119.0,268.5 L349.8,268.5 Q358.8,268.5 358.8,277.5 L358.8,306.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M358.8,350.5 L358.8,374.8 Q358.8,383.8 367.8,383.8 L387.9,383.8 Q396.9,383.8 396.9,3