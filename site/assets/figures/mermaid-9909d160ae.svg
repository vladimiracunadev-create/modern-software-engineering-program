<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 224" width="822" height="224" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Estructura de equipos» … «Colas y esperas»</title><desc id="d">Diagrama de flujo con 7 pasos. «Estructura de equipos» lleva a «Canales de comunicacion». «Canales de comunicacion» lleva a «Arquitectura resultante». «Arquitectura resultante» lleva a «Cambios que cruzan equipos». «Cambios que cruzan equipos» lleva a «Colas y esperas». «Estructura de equipos» lleva a «Propiedad y conocimiento de modulos». «Propiedad y conocimiento de modulos» lleva a «Riesgo por salidas». «Arquitectura resultante» lleva a «Estructura de equipos» (maniobra inversa).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="822" height="224" fill="#ffffff"/><path d="M137,112.5 L151.0,112.5 Q160,112.5 160.0,103.5 L160.0,62.5 Q160,53.5 169.0,53.5 L183,53.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M316,53.5 L362,53.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M495,53.5 L513.2,53.5 Q518,53.5 518.0,58.2 L518.0,58.2 Q518,63 522.8,63.0 L541,63" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M665,63 L711,63" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M137,112.5 L151.0,112.5 Q160,112.5 160.0,121.5 L160.0,153.0 Q160,162 169.0,162.0 L183,162" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M316,162 L371,162" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M428.5,84 L428.5,91.0 Q428.5,98 421.5,98.0 L160.0,98.0 Q151,98 151.0,89.0 L151.0,77.0 Q151,68 142.0,68.0 L86.5,68.0 Q79.5,68 79.5,75.0 L79.5,82" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="82" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="79.5" y="107.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="79.5" dy="0">Estructura</tspan><tspan x="79.5" dy="19.2">de equipos</tspan></text><rect x="183" y="23" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="249.5" y="48.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="249.5" dy="0">Canales de</tspan><tspan x="249.5" dy="19.2">comunicacion</tspan></text><rect x="362" y="23" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="428.5" y="48.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="428.5" dy="0">Arquitectura</tspan><tspan x="428.5" dy="19.2">resultante</tspan></text><rect x="541" y="23" width="124" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="603" y="48" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="603" dy="0">Cambios que</tspan><tspan x="603" dy="19.2">cruzan</tspan><tspan x="603" dy="19.2">equipos</tspan></text><rect x="711" y="32.5" width="89" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="755.5" y="57.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="755.5" dy="0">Colas y</tspan><tspan x="755.5" dy="19.2">esperas</tspan></text><rect x="183" y="122" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="249.5" y="147" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="249.5" dy="0">Propiedad y</tspan>