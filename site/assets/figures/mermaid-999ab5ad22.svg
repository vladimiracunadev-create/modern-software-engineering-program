<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 805 147" width="805" height="147" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Brief como contrato» … «Abandono y límites»</title><desc id="d">Diagrama de flujo con 5 pasos. «Brief como contrato» lleva a «Evidencia trazable». «Evidencia trazable» lleva a «Tipos de evidencia». «Tipos de evidencia» lleva a «Decisión con rangos». «Decisión con rangos» lleva a «Abandono y límites». «Abandono y límites» lleva a «Brief como contrato» (fallo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="805" height="147" fill="#ffffff"/><path d="M137,94.5 L183,94.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M290,94.5 L336,94.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M443,94.5 L489,94.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M622,94.5 L668,94.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M725.5,64 L725.5,57.0 Q725.5,50 718.5,50.0 L86.5,50.0 Q79.5,50 79.5,57.0 L79.5,64" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="64" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="79.5" y="89.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="79.5" dy="0">Brief como</tspan><tspan x="79.5" dy="19.2">contrato</tspan></text><rect x="183" y="64" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="236.5" y="89.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="236.5" dy="0">Evidencia</tspan><tspan x="236.5" dy="19.2">trazable</tspan></text><rect x="336" y="64" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="389.5" y="89.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="389.5" dy="0">Tipos de</tspan><tspan x="389.5" dy="19.2">evidencia</tspan></text><rect x="489" y="64" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="555.5" y="89.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="555.5" dy="0">Decisión con</tspan><tspan x="555.5" dy="19.2">rangos</tspan></text><rect x="668" y="64" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="725.5" y="89.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="725.5" dy="0">Abandono y</tspan><tspan x="725.5" dy="19.2">límites</tspan></text><rect x="339.5" y="22" width="126" height="24" rx="4" fill="#ffffff"/><text x="402.5" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="402.5" dy="0">fallo o cambio</tspan></text></svg>
