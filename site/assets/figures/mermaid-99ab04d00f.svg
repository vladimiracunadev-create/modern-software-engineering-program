<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 885 400" width="885" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Operacional frente a analítico» … «Proyecto: plataforma gobernada»</title><desc id="d">Diagrama de flujo con 12 pasos. «Operacional frente a analítico» lleva a «Ingesta batch y streaming». «Ingesta batch y streaming» lleva a «Modelado: hechos y dimensiones». «Modelado: hechos y dimensiones» lleva a «Transformación idempotente y backfills». «Transformación idempotente y backfills» lleva a «Calidad y observabilidad». «Calidad y observabilidad» lleva a «Contratos y evolución de esquemas». «Contratos y evolución de esquemas» lleva a «Linaje, catálogo y metadatos». «Linaje, catálogo y metadatos» lleva a «Warehouse, lake, lakehouse y formatos». «Warehouse, lake, lakehouse y formatos» lleva a «Gobierno, privacidad y retención». «Gobierno, privacidad y retención» lleva a «Costos y operación». «Costos y operación» lleva a «Taller: pipeline defectuoso». «Taller: pipeline defectuoso» lleva a «Proyecto: plataforma gobernada». «Proyecto: plataforma gobernada» lleva a «Calidad y observabilidad» (cambio que el control no ve).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="885" height="400" fill="#ffffff"/><path d="M168,62 L240.5,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M399.5,62 L450,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M618,62 L664,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M739,102 L739,169.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M664,200 L600.5,200" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M467.5,200 L404,200" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M236,200 L190,200" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M106,240 L106,298" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M172.5,338 L266.5,338" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M373.5,338 L450,338" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M618,338 L681.5,338" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M739,298 L739,230.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="44" y="22" width="124" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Operacional</tspan><tspan x="106" dy="19.2">frente a</tspan><tspan x="106" dy="19.2">analítico</tspan></text><rect x="240.5" y="31.5" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="320" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="320" dy="0">Ingesta batch y</tspan><tspan x="320" dy="19.2">streaming</tspan></text><rect x="450" y="31.5" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="534" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="534" dy="0">Modelado: hechos</tspan><tspan x="534" dy="19.2">y dimensiones</tspan></text><rect x="664" y="22" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="739" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="739" dy="0">Transformación</tspan><tspan x="739" dy="19.2">idempotente y</tspan><tspan x="739" dy="19.2">backfills</tspan></text><rect x="664" y="169.5" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="739" y="194.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="739" dy="0">Calidad y</tspan><tspan x="739" dy="19.2">observabilidad</tspan></text><rect x="467.5" y="160" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="534" y="185" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="534" dy="0">Contratos y</tspan><tspan x="534" dy="19.2">evolución de</tspan><tspan x="534" dy="19.2">esquemas</tspan></text><rect x="236" y="169.5" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="320" y="194.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="320" dy="0">Linaje, catálogo</tspan><tspan x="320" dy="19.2">y metadatos</tspan></text><rect x="22" y="160" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="185" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Warehouse, lake,</tspan><tspan x="106" dy="19.2">lakehouse y</tspan><tspan x="106" dy="19.2">formatos</tspan></text><rect x="39.5" y="298" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="323" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Gobierno,</tspan><tspan x="106" dy="19.2">privacidad y</tspan><tspan x="106" dy="19.2">retención</tspan></text><rect x="266.5" y="307.5" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="320" y="332.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="320" dy="0">Costos y</tspan><tspan x="320" dy="19.2">operación</tspan></text><rect x="450" y="307.5" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="534" y="332.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="534" dy="0">Taller: pipeline</tspan><tspan x="534" dy="19.2">defectuoso</tspan></text><rect x="681.5" y="298" width="115" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="739" y="323" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="739" dy="0">Proyecto:</tspan><tspan x="739" dy="19.2">plataforma</tspan><tspan x="739" dy="19.2">gobernada</tspan></text><rect x="745" y="243.2" width="118" height="42" rx="4" fill="#ffffff"/><text x="804" y="259.1" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="804" dy="0">cambio que el</tspan><tspan x="804" dy="17.92">control no ve</tspan></text></svg>
