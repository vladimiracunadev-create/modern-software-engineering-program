<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 622 360" width="622" height="360" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Qué se protege y de quién» … «Validación: prueba o revisión que contradiga el modelo»</title><desc id="d">Diagrama de flujo con 6 pasos. «Qué se protege y de quién» lleva a «Diagrama de flujo de datos con fronteras». «Diagrama de flujo de datos con fronteras» lleva a «Amenazas por elemento: STRIDE». «Amenazas por elemento: STRIDE» lleva a «Grafo de ataque con costos». «Grafo de ataque con costos» lleva a «Decisión: mitigar, aceptar, transferir o eliminar». «Decisión: mitigar, aceptar, transferir o eliminar» lleva a «Validación: prueba o revisión que contradiga el modelo». «Validación: prueba o revisión que contradiga el modelo» lleva a «Diagrama de flujo de datos con fronteras» (el sistema cambia). «Validación: prueba o revisión que contradiga el modelo» lleva a «Grafo de ataque con costos» (un camino nuevo aparece).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="622" height="360" fill="#ffffff"/><path d="M190,62 L236,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M386,62 L432,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M516,92.5 L516,188.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M436.5,219 L377.5,219" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M244.5,219 L177,219" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M106,160 L106.0,125.0 Q106,116 115.0,116.0 L304.0,116.0 Q311,116 311.0,109.0 L311,102" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><path d="M106,278 L106.0,285.0 Q106,292 113.0,292.0 L507.0,292.0 Q516,292 516.0,283.0 L516,249.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="31.5" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Qué se protege y</tspan><tspan x="106" dy="19.2">de quién</tspan></text><rect x="236" y="22" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="311" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="311" dy="0">Diagrama de</tspan><tspan x="311" dy="19.2">flujo de datos</tspan><tspan x="311" dy="19.2">con fronteras</tspan></text><rect x="432" y="31.5" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="516" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="516" dy="0">Amenazas por</tspan><tspan x="516" dy="19.2">elemento: STRIDE</tspan></text><rect x="436.5" y="188.5" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="516" y="213.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="516" dy="0">Grafo de ataque</tspan><tspan x="516" dy="19.2">con costos</tspan></text><rect x="244.5" y="160" width="133" height="118" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="311" y="184.8" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="311" dy="0">Decisión:</tspan><tspan x="311" dy="19.2">mitigar,</tspan><tspan x="311" dy="19.2">aceptar,</tspan><tspan x="311" dy="19.2">transferir o</tspan><tspan x="311" dy="19.2">eliminar</tspan></text><rect x="35" y="160" width="142" height="118" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="184.8" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Validación:</tspan><tspan x="106" dy="19.2">prueba o</tspan><tspan x="106" dy="19.2">revisión que</tspan><tspan x="106" dy="19.2">contradiga el</tspan><tspan x="106" dy="19.2">modelo</tspan></text><rect x="112" y="112.6" width="94" height="42" rx="4" fill="#ffffff"/><text x="159" y="128.5" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="159" dy="0">el sistema</tspan><tspan x="159" dy="17.92">cambia</tspan></text><rect x="252" y="296" width="118" height="42" rx="4" fill="#ffffff"/><text x="311" y="311.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="311" dy="0">un camino</tspan><tspan x="311" dy="17.92">nuevo aparece</tspan></text></svg>
