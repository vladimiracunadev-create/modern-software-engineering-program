<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 552 819" width="552" height="819" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Artefactos de la parte» … «Defensa con límites declarados»</title><desc id="d">Diagrama de flujo con 8 pasos. «Artefactos de la parte» lleva a «Afirmaciones numeradas». «Afirmaciones numeradas» lleva a «Tabla afirmación evidencia huella». «Tabla afirmación evidencia huella» lleva a «Verificador automático». «Verificador automático» lleva a «Corregir y repetir» (defectos). «Corregir y repetir» lleva a «Verificador automático». «Verificador automático» lleva a «Revisión por otra persona» (sin defectos). «Revisión por otra persona» lleva a «Muestreo y reproducción». «Muestreo y reproducción» lleva a «Defensa con límites declarados». «Defensa con límites declarados» lleva a «Afirmaciones numeradas» (hallazgo).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="552" height="819" fill="#ffffff"/><path d="M188,83 L188,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M188,202 L188.0,224.3 Q188,231 194.7,231.0 L194.7,231.0 Q201.3,231 201.3,237.7 L201.3,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M201.3,321 L201.3,341.0 Q201.3,350 210.3,350.0 L213.4,350.0 Q222.4,350 222.4,359.0 L222.4,379" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M222.4,440 L222.4,448.0 Q222.4,456 214.4,456.0 L139.5,456.0 Q130.5,456 130.5,465.0 L130.5,506.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M222.4,440 L222.4,448.0 Q222.4,456 230.4,456.0 L336.0,456.0 Q345,456 345.0,465.0 L345,498" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M345,559 L345.0,579.0 Q345,588 336.0,588.0 L334.0,588.0 Q325,588 325.0,597.0 L325,617" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M325,678 L325.0,700.1 Q325,707 318.1,707.0 L318.1,707.0 Q311.3,707 311.3,713.9 L311.3,736" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M38,528.5 L31.0,528.5 Q24,528.5 24.0,521.5 L24.0,418.5 Q24,409.5 33.0,409.5 L160.4,409.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><path d="M403.8,766.5 L438.0,766.5 Q447,766.5 447.0,757.5 L447.0,180.5 Q447,171.5 438.0,171.5 L254.5,171.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="104" y="22" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="188" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="188" dy="0">Artefactos de la</tspan><tspan x="188" dy="19.2">parte</tspan></text><rect x="121.5" y="141" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="188" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="188" dy="0">Afirmaciones</tspan><tspan x="188" dy="19.2">numeradas</tspan></text><rect x="117.3" y="260" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="201.3" y="285.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="201.3" dy="0">Tabla afirmación</tspan><tspan x="201.3" dy="19.2">evidencia huella</tspan></text><rect x="160.4" y="379" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="222.4" y="404.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="222.4" dy="0">Verificador</tspan><tspan x="222.4" dy="19.2">automático</tspan></text><rect x="38" y="506.5" width="185" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="130.5" y="532.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="130.5" dy="0">Corregir y repetir</tspan></text><rect x="257" y="498" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="345" y="523.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="345" dy="0">Revisión por otra</tspan><tspan x="345" dy="19.2">persona</tspan></text><rect x="258.5" y="617" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="325" y="642.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="325" dy="0">Muestreo y</tspan><tspan x="325" dy="19.2">reproducción</tspan></text><rect x="218.8" y="736" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="311.3" y="761.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="311.3" dy="0">Defensa con</tspan><tspan x="311.3" dy="19.2">límites declarados</tspan></text><rect x="136.5" y="469.2" width="77" height="24" rx="4" fill="#ffffff"/><text x="175" y="485.1" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="175" dy="0">defectos</tspan></text><rect x="229" y="465" width="110" height="24" rx="4" fill="#ffffff"/><text x="284" y="480.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="284" dy="0">sin defectos</tspan></text><rect x="453" y="457" width="77" height="24" rx="4" fill="#ffffff"/><text x="491.5" y="472.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="491.5" dy="0">hallazgo</tspan></text></svg>
