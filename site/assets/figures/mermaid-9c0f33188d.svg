<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 608 865" width="608" height="865" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Harness v1 y v2» … «Añadir tareas de regresión»</title><desc id="d">Diagrama de flujo con 9 pasos. «Harness v1 y v2» lleva a «Mismas tareas». «Mismas tareas» lleva a «Trazas estructuradas». «Trazas estructuradas» lleva a «Métricas: resueltas, pasos, denegaciones». «Métricas: resueltas, pasos, denegaciones» lleva a «¿Diferencia mayor que el ruido?». «¿Diferencia mayor que el ruido?» lleva a «Adoptar el cambio» (sí). «¿Diferencia mayor que el ruido?» lleva a «Descartar el cambio» (no, con muestra suficiente). «¿Diferencia mayor que el ruido?» lleva a «Añadir tareas» (no, con muestra insuficiente). «Adoptar el cambio» lleva a «Añadir tareas de regresión».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="608" height="865" fill="#ffffff"/><path d="M373.5,66 L373.5,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M373.5,168 L373.5,190.5 Q373.5,197 367.0,197.0 L367.0,197.0 Q360.5,197 360.5,203.5 L360.5,226" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M360.5,287 L360.5,307.0 Q360.5,316 351.5,316.0 L348.3,316.0 Q339.3,316 339.3,325.0 L339.3,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M339.3,425 L339.3,445.0 Q339.3,454 330.3,454.0 L316.7,454.0 Q307.7,454 307.7,463.0 L307.7,483" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M307.7,569 L307.7,577.0 Q307.7,585 299.7,585.0 L119.0,585.0 Q110,585 110.0,594.0 L110,671.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M307.7,569 L307.7,580.4 Q307.7,585 303.1,585.0 L303.1,585.0 Q298.5,585 298.5,589.6 L298.5,663" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M307.7,569 L307.7,577.0 Q307.7,585 315.7,585.0 L461.0,585.0 Q470,585 470.0,594.0 L470,671.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M112.3,715.5 L112.3,782" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="294" y="22" width="159" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="373.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="373.5" dy="0">Harness v1 y v2</tspan></text><rect x="302.5" y="124" width="142" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="373.5" y="150.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="373.5" dy="0">Mismas tareas</tspan></text><rect x="289.5" y="226" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="360.5" y="251.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="360.5" dy="0">Trazas</tspan><tspan x="360.5" dy="19.2">estructuradas</tspan></text><rect x="251.3" y="345" width="176" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="339.3" y="370" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="339.3" dy="0">Métricas:</tspan><tspan x="339.3" dy="19.2">resueltas, pasos,</tspan><tspan x="339.3" dy="19.2">denegaciones</tspan></text><polygon points="307.7,483 451.2,526 307.7,569 164.2,526" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="307.7" y="520.6" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="307.7" dy="0">¿Diferencia mayor</tspan><tspan x="307.7" dy="19.2">que el ruido?</tspan></text><rect x="22" y="671.5" width="176" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="110" y="697.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">Adoptar el cambio</tspan></text><rect x="232" y="663" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="298.5" y="688.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="298.5" dy="0">Descartar el</tspan><tspan x="298.5" dy="19.2">cambio</tspan></text><rect x="399" y="671.5" width="142" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="697.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Añadir tareas</tspan></text><rect x="30.7" y="782" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="114.7" y="807.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="114.7" dy="0">Añadir tareas de</tspan><tspan x="114.7" dy="19.2">regresión</tspan></text><rect x="116" y="616.2" width="29" height="24" rx="4" fill="#ffffff"/><text x="130.5" y="632.1" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="130.5" dy="0">sí</tspan></text><rect x="304.5" y="594" width="94" height="60" rx="4" fill="#ffffff"/><text x="351.5" y="609.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="351.5" dy="0">no, con</tspan><tspan x="351.5" dy="17.92">muestra</tspan><tspan x="351.5" dy="17.92">suficiente</tspan></text><rect x="476" y="598.2" width="110" height="60" rx="4" fill="#ffffff"/><text x="531" y="614.1" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="531" dy="0">no, con</tspan><tspan x="531" dy="17.92">muestra</tspan><tspan x="531" dy="17.92">insuficiente</tspan></text></svg>
