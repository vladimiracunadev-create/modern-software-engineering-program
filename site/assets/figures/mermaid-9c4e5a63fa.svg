<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 479 643" width="479" height="643" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Solicitud» … «Llamada con timeout» y «Respuesta degradada»</title><desc id="d">Diagrama de flujo con 8 pasos. «Solicitud» lleva a «Criticidad». «Criticidad» lleva a «Compartimento propio» (crítica). «Criticidad» lleva a «Compartimento compartido y acotado» (secundaria). «Compartimento compartido y acotado» lleva a «Interruptor de la dependencia». «Interruptor de la dependencia» lleva a «Llamada con timeout» (cerrado). «Interruptor de la dependencia» lleva a «Respuesta degradada» (abierto). «Llamada con timeout» lleva a «Interruptor de la dependencia» (fallos seguidos). «Interruptor de la dependencia» lleva a «Llamada con timeout» (semiabierto: una sonda). «Compartimento propio» lleva a «Llamada con timeout». «Solicitud» lleva a «Descarte con criterio» (cola excedida).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="479" height="643" fill="#ffffff"/><path d="M247,66 L247.0,86.0 Q247,95 238.0,95.0 L170.5,95.0 Q161.5,95 161.5,104.0 L161.5,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M161.5,186 L161.5,194.0 Q161.5,202 153.5,202.0 L114.3,202.0 Q105.3,202 105.3,211.0 L105.3,253.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M161.5,186 L161.5,194.0 Q161.5,202 169.5,202.0 L272.3,202.0 Q281.3,202 281.3,211.0 L281.3,244" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M281.3,324 L281.3,344.0 Q281.3,353 272.3,353.0 L271.5,353.0 Q262.5,353 262.5,362.0 L262.5,382" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M262.5,468 L262.5,476.0 Q262.5,484 254.5,484.0 L213.5,484.0 Q204.5,484 204.5,493.0 L204.5,544" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M262.5,468 L262.5,476.0 Q262.5,484 270.5,484.0 L345.0,484.0 Q354,484 354.0,493.0 L354,544" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M262.5,468 L262.5,476.0 Q262.5,484 254.5,484.0 L213.5,484.0 Q204.5,484 204.5,493.0 L204.5,544" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M105.3,314.5 L105.3,565.5 Q105.3,574.5 114.3,574.5 L142.5,574.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M247,66 L247.0,74.0 Q247,82 255.0,82.0 L323.5,82.0 Q332.5,82 332.5,91.0 L332.5,124.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M204.5,605 L204.5,612.0 Q204.5,619 197.5,619.0 L114.0,619.0 Q105,619 105.0,610.0 L105.0,432.0 Q105,425 112.0,425.0 L119,425" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="193.5" y="22" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="247" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="247" dy="0">Solicitud</tspan></text><polygon points="161.5,124 232,155 161.5,186 91,155" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="161.5" y="159.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="161.5" dy="0">Criticidad</tspan></text><rect x="34.3" y="253.5" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="105.3" y="278.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="105.3" dy="0">Compartimento</tspan><tspan x="105.3" dy="19.2">propio</tspan></text><rect x="210.3" y="244" width="142" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="281.3" y="269" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="281.3" dy="0">Compartimento</tspan><tspan x="281.3" dy="19.2">compartido y</tspan><tspan x="281.3" dy="19.2">acotado</tspan></text><polygon points="262.5,382 406,425 262.5,468 119,425" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="262.5" y="419.6" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="262.5" dy="0">Interruptor de la</tspan><tspan x="262.5" dy="19.2">dependencia</tspan></text><rect x="142.5" y="544" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="204.5" y="569.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="204.5" dy="0">Llamada con</tspan><tspan x="204.5" dy="19.2">timeout</tspan></text><rect x="300.5" y="544" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="354" y="569.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="354" dy="0">Respuesta</tspan><tspan x="354" dy="19.2">degradada</tspan></text><rect x="266" y="124.5" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="332.5" y="149.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="332.5" dy="0">Descarte con</tspan><tspan x="332.5" dy="19.2">criterio</tspan></text><rect x="111.3" y="215.8" width="69" height="24" rx="4" fill="#ffffff"/><text x="145.8" y="231.7" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="145.8" dy="0">crítica</tspan></text><rect x="287.3" y="211" width="94" height="24" rx="4" fill="#ffffff"/><text x="334.3" y="226.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="334.3" dy="0">secundaria</tspan></text><rect x="210.5" y="502" width="69" height="24" rx="4" fill="#ffffff"/><text x="245" y="517.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="245" dy="0">cerrado</tspan></text><rect x="360" y="502" width="69" height="24" rx="4" fill="#ffffff"/><text x="394.5" y="517.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="394.5" dy="0">abierto</tspan></text><rect x="22" y="501" width="77" height="42" rx="4" fill="#ffffff"/><text x="60.5" y="516.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="60.5" dy="0">fallos</tspan><tspan x="60.5" dy="17.92">seguidos</tspan></text><rect x="29.5" y="553" width="110" height="42" rx="4" fill="#ffffff"/><text x="84.5" y="568.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="84.5" dy="0">semiabierto:</tspan><tspan x="84.5" dy="17.92">una sonda</tspan></text><rect x="338.5" y="91.2" width="118" height="24" rx="4" fill="#ffffff"/><text x="397.5" y="107.1" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397.5" dy="0">cola excedida</tspan></text></svg>
