ia</tspan><tspan x="286.1" dy="19.2">con el estado</tspan></text><rect x="239.5" y="149.5" width="176" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="327.5" y="175.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="327.5" dy="0">Estado registrado</tspan></text><rect x="333.7" y="22" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="408.7" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="408.7" dy="0">Realidad en la</tspan><tspan x="408.7" dy="19.2">nube</tspan></text><polygon points="258.5,379 373,410 258.5,441 144,410" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="258.5" y="414.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="258.5" dy="0">Revisión del plan</tspan></text><rect x="179.4" y="517" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="236.9" y="542.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="236.9" dy="0">Aprobación</tspan><tspan x="236.9" dy="19.2">explícita</tspan></text><rect x="166.7" y="636" width="115" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="224.2" y="662.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="224.2" dy="0">Aplicación</tspan></text><rect x="126" y="738" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="218.5" y="763.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="218.5" dy="0">Orden topológico y</tspan><tspan x="218.5" dy="19.2">bloqueo del estado</tspan></text><rect x="449.5" y="149.5" width="81" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="490" y="175.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">Deriva</tspan></text><rect x="211.5" y="1