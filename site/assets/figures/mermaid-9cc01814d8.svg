<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 636 821" width="636" height="821" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Realidad en la nube» … «Orden topológico y bloqueo del estado»</title><desc id="d">Diagrama de flujo con 9 pasos. «Código: estado deseado» lleva a «Plan: diferencia con el estado». «Estado registrado» lleva a «Plan: diferencia con el estado». «Realidad en la nube» lleva a «Estado registrado» (se actualiza). «Plan: diferencia con el estado» lleva a «Revisión del plan». «Revisión del plan» lleva a «Aprobación explícita» (destruye o reemplaza). «Revisión del plan» lleva a «Aplicación» (solo crea o actualiza). «Aprobación explícita» lleva a «Aplicación». «Aplicación» lleva a «Orden topológico y bloqueo del estado». «Orden topológico y bloqueo del estado» lleva a «Realidad en la nube». «Realidad en la nube» lleva a «Deriva» (cambio manual). «Deriva» lleva a «Plan: diferencia con el estado».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="636" height="821" fill="#ffffff"/><path d="M130.5,202 L130.5,222.0 Q130.5,231 139.5,231.0 L277.1,231.0 Q286.1,231 286.1,240.0 L286.1,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M327.5,193.5 L327.5,217.8 Q327.5,226.8 318.5,226.8 L295.1,226.8 Q286.1,226.8 286.1,235.8 L286.1,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M408.7,83 L408.7,91.0 Q408.7,99 400.7,99.0 L336.5,99.0 Q327.5,99 327.5,108.0 L327.5,149.5" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><pat