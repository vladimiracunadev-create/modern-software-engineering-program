<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 439 769" width="439" height="769" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Importe y moneda» … «Investigación»</title><desc id="d">Diagrama de flujo con 9 pasos. «Importe y moneda» lleva a «Regla de redondeo y reparto». «Regla de redondeo y reparto» lleva a «Asiento de doble entrada». «Asiento de doble entrada» lleva a «Libro mayor». «Libro mayor» lleva a «Invariantes». «Invariantes» lleva a «Conciliación con el proveedor» (se cumplen). «Invariantes» lleva a «Alarma y bloqueo» (se violan). «Petición con clave» lleva a «Asiento de doble entrada». «Conciliación con el proveedor» lleva a «Investigación» (diferencia).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="439" height="769" fill="#ffffff"/><path d="M110,66 L110,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M110,185 L110.0,205.0 Q110,214 119.0,214.0 L233.0,214.0 Q242,214 242.0,223.0 L242,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M243,304 L243,362" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M239.7,406 L239.7,464" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M235.5,526 L235.5,534.0 Q235.5,542 227.5,542.0 L132.0,542.0 Q123,542 123.0,551.0 L123,584" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M235.5,526 L235.5,534.0 Q235.5,542 243.5,542.0 L316.0,542.0 Q325,542 325.0,551.0 L325,592.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M324.5,176.5 L324.5,200.8 Q324.5,209.8 315.5,209.8 L251.0,209.8 Q242,209.8 242.0,218.8 L242,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M126.7,645 L126.7,703" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="26" y="22" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="110" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">Importe y moneda</tspan></text><rect x="22" y="124" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="110" y="149.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">Regla de redondeo</tspan><tspan x="110" dy="19.2">y reparto</tspan></text><rect x="158" y="243" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="242" y="268.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="242" dy="0">Asiento de doble</tspan><tspan x="242" dy="19.2">entrada</tspan></text><rect x="181.9" y="362" width="124" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="243.9" y="388.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="243.9" dy="0">Libro mayor</tspan></text><polygon points="235.5,464 312.5,495 235.5,526 158.5,495" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="235.5" y="499.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="235.5" dy="0">Invariantes</tspan></text><rect x="39" y="584" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="123" y="609.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="123" dy="0">Conciliación con</tspan><tspan x="123" dy="19.2">el proveedor</tspan></text><rect x="241" y="592.5" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="325" y="618.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="325" dy="0">Alarma y bloqueo</tspan></text><rect x="232" y="132.5" width="185" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="324.5" y="158.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="324.5" dy="0">Petición con clave</tspan></text><rect x="59.4" y="703" width="142" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="130.4" y="729.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="130.4" dy="0">Investigación</tspan></text><rect x="129" y="551" width="94" height="24" rx="4" fill="#ffffff"/><text x="176" y="566.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="176" dy="0">se cumplen</tspan></text><rect x="331" y="555.2" width="86" height="24" rx="4" fill="#ffffff"/><text x="374" y="571.1" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="374" dy="0">se violan</tspan></text><rect x="132.7" y="662" width="94" height="24" rx="4" fill="#ffffff"/><text x="179.7" y="677.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="179.7" dy="0">diferencia</tspan></text></svg>
