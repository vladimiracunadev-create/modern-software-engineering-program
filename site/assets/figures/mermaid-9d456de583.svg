<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 857 88" width="857" height="88" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «🎯 Audiencia» … «📈 Mantenimiento»</title><desc id="d">Diagrama de flujo con 5 pasos. «🎯 Audiencia» lleva a «🧠 Tarea». «🧠 Tarea» lleva a «🛠️ Contenido». «🛠️ Contenido» lleva a «🔎 Prueba». «🔎 Prueba» lleva a «📈 Mantenimiento».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="857" height="88" fill="#ffffff"/><path d="M153,44 L199,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M295,44 L341,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M472,44 L518,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M623,44 L669,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="22" width="131" height="44" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="87.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="87.5" dy="0">🎯 Audiencia</tspan></text><rect x="199" y="22" width="96" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="247" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="247" dy="0">🧠 Tarea</tspan></text><rect x="341" y="22" width="131" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="406.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="406.5" dy="0">🛠️ Contenido</tspan></text><rect x="518" y="22" width="105" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="570.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="570.5" dy="0">🔎 Prueba</tspan></text><rect x="669" y="22" width="166" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="752" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="752" dy="0">📈 Mantenimiento</tspan></text></svg>
