<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 931 338" width="931" height="338" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Fuerza: equipos o escala» … «Costo operativo», «Despliegues sin coordinar» y «Monolito distribuido»</title><desc id="d">Diagrama de flujo con 11 pasos. «Fuerza: equipos o escala» lleva a «Separar en servicios». «Separar en servicios» lleva a «Llamadas por red». «Separar en servicios» lleva a «Datos por servicio». «Separar en servicios» lleva a «Despliegue independiente». «Llamadas por red» lleva a «Latencia y disponibilidad multiplicadas». «Datos por servicio» lleva a «Consistencia eventual y sagas». «Despliegue independiente» lleva a «¿Contratos compatibles?». «¿Contratos compatibles?» lleva a «Despliegues sin coordinar» (sí). «¿Contratos compatibles?» lleva a «Monolito distribuido» (no). «Latencia y disponibilidad multiplicadas» lleva a «Costo operativo». «Consistencia eventual y sagas» lleva a «Costo operativo».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="931" height="338" fill="#ffffff"/><path d="M129,169 L175,169" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M290,169 L315.0,169.0 Q324,169 324.0,160.0 L324.0,71.0 Q324,62 333.0,62.0 L358,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M290,167.5 L353.5,167.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M290,169 L304.0,169.0 Q313,169 313.0,178.0 L313.0,264.0 Q313,273 322.0,273.0 L336,273" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="u