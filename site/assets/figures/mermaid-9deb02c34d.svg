<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 185" width="840" height="185" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Entorno virtual» … «Secretos / configuración»</title><desc id="d">Diagrama de flujo con 5 pasos. «Entorno virtual» lleva a «Activación / ejecutable explícito». «Activación / ejecutable explícito» lleva a «Dependencias de proyecto / herramientas». «Dependencias de proyecto / herramientas» lleva a «Recreación / comprobación». «Recreación / comprobación» lleva a «Secretos / configuración». «Secretos / configuración» lleva a «Entorno virtual» (fallo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="840" height="185" fill="#ffffff"/><path d="M111,113.5 L157,113.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M272,113.5 L318,113.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M451,113.5 L497,113.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M630,113.5 L676,113.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M747,83 L747.0,59.0 Q747,50 738.0,50.0 L75.5,50.0 Q66.5,50 66.5,59.0 L66.5,83" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="83" width="89" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="66.5" y="108.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="66.5" dy="0">Entorno</tspan><tspan x="66.5" dy="19.2">virtual</tspan></text><rect x="157" y="64" width="115" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="214.5" y="88.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="214.5" dy="0">Activación</tspan><tspan x="214.5" dy="19.2">/</tspan><tspan x="214.5" dy="19.2">ejecutable</tspan><tspan x="214.5" dy="19.2">explícito</tspan></text><rect x="318" y="64" width="133" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="384.5" y="88.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="384.5" dy="0">Dependencias</tspan><tspan x="384.5" dy="19.2">de proyecto</tspan><tspan x="384.5" dy="19.2">/</tspan><tspan x="384.5" dy="19.2">herramientas</tspan></text><rect x="497" y="73.5" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="563.5" y="98.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="563.5" dy="0">Recreación</tspan><tspan x="563.5" dy="19.2">/</tspan><tspan x="563.5" dy="19.2">comprobación</tspan></text><rect x="676" y="83" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="747" y="108.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="747" dy="0">Secretos /</tspan><tspan x="747" dy="19.2">configuración</tspan></text><rect x="343.8" y="22" width="126" height="24" rx="4" fill="#ffffff"/><text x="406.8" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="406.8" dy="0">fallo o cambio</tspan></text></svg>
