<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 755 713" width="755" height="713" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Mensaje o tarea» … «Retención frente al retraso del duplicado»</title><desc id="d">Diagrama de flujo con 9 pasos. «Mensaje o tarea» lleva a «Orden de aplicar y confirmar». «Orden de aplicar y confirmar» lleva a «Al menos una vez: duplicados» (aplicar y luego confirmar). «Orden de aplicar y confirmar» lleva a «Como mucho una vez: pérdidas» (confirmar y luego aplicar). «Orden de aplicar y confirmar» lleva a «Efecto único» (aplicar y recordar en una transacción). «Efecto único» lleva a «Clave de idempotencia con huella». «Clave de idempotencia con huella» lleva a «Retención frente al retraso del duplicado». «Mensaje o tarea» lleva a «Trabajo distribuido: reintento de tareas». «Trabajo distribuido: reintento de tareas» lleva a «Determinismo y escritura por clave».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="755" height="713" fill="#ffffff"/><path d="M437.2,66 L437.2,89.2 Q437.2,98.2 428.2,98.2 L320.2,98.2 Q311.2,98.2 311.2,107.2 L311.2,130.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M311.2,216.5 L311.2,224.5 Q311.2,232.5 303.2,232.5 L119.0,232.5 Q110,232.5 110.0,241.5 L110,344.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M309.1,216.5 L309.1,344.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M311.2,216.5 L311.2,224.5 Q311.2,232.5 319.2,232.5 L473.5,232.5 Q482.5,232.5 482.5,241.5 L482.5,353" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M478.4,397 L478.4,473" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M471,553 L471,611" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M437.2,66 L437.2,86.0 Q437.2,95 446.2,95.0 L554.2,95.0 Q563.2,95 563.2,104.0 L563.2,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M563.2,223 L563.2,270.0 Q563.2,279 572.2,279.0 L649.0,279.0 Q658,279 658.0,288.0 L658,335" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="357.7" y="22" width="159" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="437.2" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="437.2" dy="0">Mensaje o tarea</tspan></text><polygon points="311.2,130.5 462.7,173.5 311.2,216.5 159.7,173.5" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="311.2" y="168.1" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="311.2" dy="0">Orden de aplicar y</tspan><tspan x="311.2" dy="19.2">confirmar</tspan></text><rect x="22" y="344.5" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="110" y="369.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">Al menos una vez:</tspan><tspan x="110" dy="19.2">duplicados</tspan></text><rect x="232" y="344.5" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="307" y="369.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="307" dy="0">Como mucho una</tspan><tspan x="307" dy="19.2">vez: pérdidas</tspan></text><rect x="416" y="353" width="133" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="482.5" y="379.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="482.5" dy="0">Efecto único</tspan></text><rect x="390.4" y="473" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="474.4" y="498" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="474.4" dy="0">Clave de</tspan><tspan x="474.4" dy="19.2">idempotencia con</tspan><tspan x="474.4" dy="19.2">huella</tspan></text><rect x="383.7" y="611" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="467.7" y="636" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="467.7" dy="0">Retención frente</tspan><tspan x="467.7" dy="19.2">al retraso del</tspan><tspan x="467.7" dy="19.2">duplicado</tspan></text><rect x="496.7" y="124" width="133" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="563.2" y="148.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="563.2" dy="0">Trabajo</tspan><tspan x="563.2" dy="19.2">distribuido:</tspan><tspan x="563.2" dy="19.2">reintento de</tspan><tspan x="563.2" dy="19.2">tareas</tspan></text><rect x="583" y="335" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="658" y="360" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="658" dy="0">Determinismo y</tspan><tspan x="658" dy="19.2">escritura por</tspan><tspan x="658" dy="19.2">clave</tspan></text><rect x="116" y="258.5" width="86" height="60" rx="4" fill="#ffffff"/><text x="159" y="274.4" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="159" dy="0">aplicar y</tspan><tspan x="159" dy="17.92">luego</tspan><tspan x="159" dy="17.92">confirmar</tspan></text><rect x="315.1" y="259.5" width="118" height="42" rx="4" fill="#ffffff"/><text x="374.1" y="275.4" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="374.1" dy="0">confirmar y</tspan><tspan x="374.1" dy="17.92">luego aplicar</tspan></text><rect x="443.5" y="253.8" width="102" height="78" rx="4" fill="#ffffff"/><text x="494.5" y="269.7" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="494.5" dy="0">aplicar y</tspan><tspan x="494.5" dy="17.92">recordar en</tspan><tspan x="494.5" dy="17.92">una</tspan><tspan x="494.5" dy="17.92">transacción</tspan></text></svg>
