<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 908 608" width="908" height="608" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Código del repositorio y solicitudes de integración», «Acciones y dependencias de terceros», «Datos del contexto: título, rama, mensaje» y «Controles: SHA fijado, permisos mínimos, entornos con aprobación, runners efímeros, reconstrucción independiente» … «Daño: lectura, escritura, secretos» y «Release firmado con contenido malicioso»</title><desc id="d">Diagrama de flujo con 9 pasos. «Código del repositorio y solicitudes de integración» lleva a «CI: flujo de trabajo». «Acciones y dependencias de terceros» lleva a «CI: flujo de trabajo». «Datos del contexto: título, rama, mensaje» lleva a «CI: flujo de trabajo» (si se interpolan). «CI: flujo de trabajo» lleva a «Permisos del token y secretos». «CI: flujo de trabajo» lleva a «Artefacto, firma y publicación». «Permisos del token y secretos» lleva a «Daño: lectura, escritura, secretos» (paso comprometido). «Artefacto, firma y publicación» lleva a «Release firmado con contenido malicioso» (paso comprometido). «Controles: SHA fijado, permisos mínimos, entornos con aprobación, runners efímeros, reconstrucción independiente» lleva a «CI: flujo de trabajo».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="908" height="608" fill="#ffffff"/><path d="M172,71.5 L222.0,71.5 Q231,71.5 231.0,80.5 L231.0,249.5 Q231,258.5 240.0,258.5 L290,258.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M163.5,185 L217.8,185.0 Q226.8,185 226.8,194.0 L226.8,249.5 