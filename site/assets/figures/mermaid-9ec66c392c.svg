<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 531 835" width="531" height="835" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Build: artefacto con huella» … «Retroceso: versión anterior conservada»</title><desc id="d">Diagrama de flujo con 7 pasos. «Build: artefacto con huella» lleva a «Repositorio: almacén por contenido». «Repositorio: almacén por contenido» lleva a «Integración: prueba el artefacto». «Integración: prueba el artefacto» lleva a «Preproducción» (metadato: probado). «Preproducción» lleva a «Producción: mismo artefacto, otra configuración» (metadato: aprobado). «Producción: mismo artefacto, otra configuración» lleva a «Retroceso: versión anterior conservada» (fallo). «Repositorio: almacén por contenido» lleva a «¿Se borra algo que el retroceso necesita?» (limpieza).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="531" height="835" fill="#ffffff"/><path d="M231.2,83 L231.2,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M231.2,221 L231.2,251.0 Q231.2,260 222.2,260.0 L97.5,260.0 Q88.5,260 88.5,269.0 L88.5,299" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M88.5,379 L88.5,387.0 Q88.5,395 96.5,395.0 L121.3,395.0 Q130.3,395 130.3,404.0 L130.3,475" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M130.3,519 L130.3,527.0 Q130.3,535 138.3,535.0 L155.7,535.0 Q164.7,535 164.7,544.0 L164.7,595" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M164.7,675 L164.7,683.0 Q164.7,691 172.7,691.0 L173.6,691.0 Q182.4,691 182.4,699.9 L182.4,733" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M231.2,221 L231.2,229.0 Q231.2,237 239.2,237.0 L340.0,237.0 Q349,237 349.0,246.0 L349,279" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="147.2" y="22" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="231.2" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="231.2" dy="0">Build: artefacto</tspan><tspan x="231.2" dy="19.2">con huella</tspan></text><rect x="164.7" y="141" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="231.2" y="166" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="231.2" dy="0">Repositorio:</tspan><tspan x="231.2" dy="19.2">almacén por</tspan><tspan x="231.2" dy="19.2">contenido</tspan></text><rect x="22" y="299" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="88.5" y="324" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="88.5" dy="0">Integración:</tspan><tspan x="88.5" dy="19.2">prueba el</tspan><tspan x="88.5" dy="19.2">artefacto</tspan></text><rect x="59.3" y="475" width="142" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="130.3" y="501.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="130.3" dy="0">Preproducción</tspan></text><rect x="76.7" y="595" width="176" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="164.7" y="620" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="164.7" dy="0">Producción: mismo</tspan><tspan x="164.7" dy="19.2">artefacto, otra</tspan><tspan x="164.7" dy="19.2">configuración</tspan></text><rect x="89.9" y="733" width="185" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="182.4" y="758" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="182.4" dy="0">Retroceso: versión</tspan><tspan x="182.4" dy="19.2">anterior</tspan><tspan x="182.4" dy="19.2">conservada</tspan></text><polygon points="349,279 509,339 349,399 189,339" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="349" y="324" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="349" dy="0">¿Se borra algo que</tspan><tspan x="349" dy="19.2">el retroceso</tspan><tspan x="349" dy="19.2">necesita?</tspan></text><rect x="136.3" y="414" width="86" height="42" rx="4" fill="#ffffff"/><text x="179.3" y="429.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="179.3" dy="0">metadato:</tspan><tspan x="179.3" dy="17.92">probado</tspan></text><rect x="170.7" y="544" width="86" height="42" rx="4" fill="#ffffff"/><text x="213.7" y="559.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="213.7" dy="0">metadato:</tspan><tspan x="213.7" dy="17.92">aprobado</tspan></text><rect x="188.4" y="700" width="53" height="24" rx="4" fill="#ffffff"/><text x="214.9" y="715.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="214.9" dy="0">fallo</tspan></text><rect x="355" y="246" width="77" height="24" rx="4" fill="#ffffff"/><text x="393.5" y="261.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="393.5" dy="0">limpieza</tspan></text></svg>
