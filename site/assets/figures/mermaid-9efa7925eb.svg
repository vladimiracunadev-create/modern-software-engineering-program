<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 649 739" width="649" height="739" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Problema recurrente» … «Se retira el patrón» y «Se documenta intención y costo»</title><desc id="d">Diagrama de flujo con 11 pasos. «Problema recurrente» lleva a «Familia de patrón». «Familia de patrón» lleva a «Creacional: cómo se crea y quién lo crea». «Familia de patrón» lleva a «Estructural: cómo se compone y se adapta». «Familia de patrón» lleva a «Conductual: cómo se reparten las responsabilidades en ejecución». «Creacional: cómo se crea y quién lo crea» lleva a «Prueba: orden y aislamiento». «Estructural: cómo se compone y se adapta» lleva a «Prueba: contrato de la interfaz». «Conductual: cómo se reparten las responsabilidades en ejecución» lleva a «Prueba: fallos y reentrada». «Prueba: orden y aislamiento» lleva a «¿Se resolvió el problema?». «Prueba: contrato de la interfaz» lleva a «¿Se resolvió el problema?». «Prueba: fallos y reentrada» lleva a «¿Se resolvió el problema?». «¿Se resolvió el problema?» lleva a «Se retira el patrón» (no). «¿Se resolvió el problema?» lleva a «Se documenta intención y costo» (sí).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="649" height="739" fill="#ffffff"/><path d="M327.5,83 L327.5,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M327.5,203 L327.5,227.8 Q327.5,236.8 318.5,236.8 L123.5,236.8 Q114.5,236.8 114.5,245.8 L114.5,270.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M328.3,203 L328.3,270.5" 