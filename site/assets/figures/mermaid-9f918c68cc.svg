<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 822" width="550" height="822" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Sistema real» … «Corregir modelo o sistema»</title><desc id="d">Diagrama de flujo con 8 pasos. «Sistema real» lleva a «Modelo: estados y transiciones». «Modelo: estados y transiciones» lleva a «Propiedad: invariante o vivacidad». «Propiedad: invariante o vivacidad» lleva a «Verificador: explorar estados». «Verificador: explorar estados» lleva a «¿Se cumple?». «¿Se cumple?» lleva a «Demostrado en el modelo» (sí). «¿Se cumple?» lleva a «Contraejemplo: traza de pasos» (no). «Contraejemplo: traza de pasos» lleva a «Corregir modelo o sistema». «Demostrado en el modelo» lleva a «Sistema real» (¿modelo fiel y propiedad completa?).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="550" height="822" fill="#ffffff"/><path d="M280.8,66 L280.8,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M280.8,185 L280.8,208.9 Q280.8,214 285.9,214.0 L285.9,214.0 Q291,214 291.0,219.1 L291,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M291,323 L291.0,343.8 Q291,352 299.2,352.0 L299.2,352.0 Q307.5,352 307.5,360.2 L307.5,381" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M307.5,442 L307.5,462.0 Q307.5,471 316.5,471.0 L322.6,471.0 Q331.6,471 331.6,480.0 L331.6,500" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M331.6,562 L331.6,570.0 Q331.6,578 323.6,578.0 L261.0,578.0 Q252,578 252.0,587.0 L252,620" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M331.6,562 L331.6,570.0 Q331.6,578 339.6,578.0 L436.0,578.0 Q445,578 445.0,587.0 L445,620" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M442.3,681 L442.3,739" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M168,650.5 L161.0,650.5 Q154,650.5 154.0,643.5 L154.0,53.0 Q154,44 163.0,44.0 L214.3,44" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="214.3" y="22" width="133" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="280.8" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="280.8" dy="0">Sistema real</tspan></text><rect x="192.8" y="124" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="280.8" y="149.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="280.8" dy="0">Modelo: estados y</tspan><tspan x="280.8" dy="19.2">transiciones</tspan></text><rect x="224.5" y="243" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="291" y="268" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="291" dy="0">Propiedad:</tspan><tspan x="291" dy="19.2">invariante o</tspan><tspan x="291" dy="19.2">vivacidad</tspan></text><rect x="223.5" y="381" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="307.5" y="406.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="307.5" dy="0">Verificador:</tspan><tspan x="307.5" dy="19.2">explorar estados</tspan></text><polygon points="331.6,500 408.6,531 331.6,562 254.6,531" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="331.6" y="535.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="331.6" dy="0">¿Se cumple?</tspa