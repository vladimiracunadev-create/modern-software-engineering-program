<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 791 1173" width="791" height="1173" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Inventario de sistemas de IA» … «Vigilancia posterior y gestión de incidentes»</title><desc id="d">Diagrama de flujo con 11 pasos. «Inventario de sistemas de IA» lleva a «Triaje de riesgo por uso». «Triaje de riesgo por uso» lleva a «¿Alto riesgo o prohibido?». «¿Alto riesgo o prohibido?» lleva a «No se desarrolla» (prohibido). «¿Alto riesgo o prohibido?» lleva a «Requisitos completos: riesgo, datos, documentación, registro, supervisión, robustez» (alto). «¿Alto riesgo o prohibido?» lleva a «Avisar a la persona» (transparencia). «¿Alto riesgo o prohibido?» lleva a «Buenas prácticas» (mínimo). «Requisitos completos: riesgo, datos, documentación, registro, supervisión, robustez» lleva a «Evidencia de ingeniería: SE-602 a SE-609». «Evidencia de ingeniería: SE-602 a SE-609» lleva a «Expediente y registro de decisiones». «Expediente y registro de decisiones» lleva a «Revisión interna y, si procede, evaluación de conformidad». «Revisión interna y, si procede, evaluación de conformidad» lleva a «Vigilancia posterior y gestión de incidentes». «Vigilancia posterior y gestión de incidentes» lleva a «Inventario de sistemas de IA».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="791" height="1173" fill="#ffffff"/><path d="M412.7,83 L412.7,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M409.3,202 L409.3,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d=