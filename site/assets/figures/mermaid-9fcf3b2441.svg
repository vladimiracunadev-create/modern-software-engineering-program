<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 406 854" width="406" height="854" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Manifiesto: dependencias directas con rango» … «Actualizar, parchear o vendorizar con dueño»</title><desc id="d">Diagrama de flujo con 8 pasos. «Manifiesto: dependencias directas con rango» lleva a «Resolvedor: elige versiones». «Resolvedor: elige versiones» lleva a «Archivo de bloqueo: versiones y huellas fijadas». «Archivo de bloqueo: versiones y huellas fijadas» lleva a «Clausura transitiva instalada». «Clausura transitiva instalada» lleva a «Artefacto». «Aviso de vulnerabilidad» lleva a «¿Está en la clausura y es alcanzable?». «Clausura transitiva instalada» lleva a «¿Está en la clausura y es alcanzable?». «¿Está en la clausura y es alcanzable?» lleva a «Actualizar, parchear o vendorizar con dueño» (sí). «Actualizar, parchear o vendorizar con dueño» lleva a «Manifiesto: dependencias directas con rango».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="406" height="854" fill="#ffffff"/><path d="M141.1,102 L141.1,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M140.8,221 L140.8,279" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M141.1,359 L141.1,417" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M141.7,497 L141.7,536.0 Q141.7,545 132.7,545.0 L100.5,545.0 Q91.5,545 91.5,554.0 L91.5,593" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M308.2,487.5 L308.2,512.2 Q308.2,521.2 