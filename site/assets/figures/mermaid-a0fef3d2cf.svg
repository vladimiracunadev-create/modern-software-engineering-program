<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 421 604" width="421" height="604" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Interrupción» y «Bucle principal» … «Prueba por enumeración de posiciones» y «Coste: latencia de la interrupción»</title><desc id="d">Diagrama de flujo con 8 pasos. «Interrupción» lleva a «Dato compartido» (escribe). «Bucle principal» lleva a «Dato compartido» (lee y escribe). «Dato compartido» lleva a «Acceso atómico». «Acceso atómico» lleva a «Pérdida, lectura rota o desbordamiento» (no). «Acceso atómico» lleva a «Dato coherente» (sí, por protección). «Dato coherente» lleva a «Coste: latencia de la interrupción». «Pérdida, lectura rota o desbordamiento» lleva a «Prueba por enumeración de posiciones».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="421" height="604" fill="#ffffff"/><path d="M111.8,66 L111.8,74.0 Q111.8,82 119.8,82.0 L192.8,82.0 Q201.8,82 201.8,91.0 L201.8,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M291.8,66 L291.8,74.0 Q291.8,82 283.8,82.0 L210.8,82.0 Q201.8,82 201.8,91.0 L201.8,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M202,168 L202,226" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M202.3,288 L202.3,296.0 Q202.3,304 194.3,304.0 L115.0,304.0 Q106,304 106.0,313.0 L106,364" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M202.3,288 L202.3,296.0 Q202.3,304 210.3,304.0 L290.0,304.0 Q299,304 299.0,313.0 L299,382" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M301.1,426 L301.1,511.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M103.9,444 L103.9,502" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="45.3" y="22" width="133" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="111.8" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="111.8" dy="0">Interrupción</tspan></text><rect x="122.3" y="124" width="159" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="201.8" y="150.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="201.8" dy="0">Dato compartido</tspan></text><rect x="212.3" y="22" width="159" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="291.8" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="291.8" dy="0">Bucle principal</tspan></text><polygon points="202.3,226 298.3,257 202.3,288 106.3,257" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="202.3" y="261.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="202.3" dy="0">Acceso atómico</tspan></text><rect x="22" y="364" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="389" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Pérdida, lectura</tspan><tspan x="106" dy="19.2">rota o</tspan><tspan x="106" dy="19.2">desbordamiento</tspan></text><rect x="224" y="382" width="150" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="299" y="408.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="299" dy="0">Dato coherente</tspan></text><rect x="210.8" y="511.5" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="303.3" y="536.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="303.3" dy="0">Coste: latencia de</tspan><tspan x="303.3" dy="19.2">la interrupción</tspan></text><rect x="26.8" y="502" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101.8" y="527" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101.8" dy="0">Prueba por</tspan><tspan x="101.8" dy="19.2">enumeración de</tspan><tspan x="101.8" dy="19.2">posiciones</tspan></text><rect x="207.8" y="91" width="69" height="24" rx="4" fill="#ffffff"/><text x="242.3" y="106.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="242.3" dy="0">escribe</tspan></text><rect x="77.8" y="91" width="118" height="24" rx="4" fill="#ffffff"/><text x="136.8" y="106.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="136.8" dy="0">lee y escribe</tspan></text><rect x="112" y="322" width="29" height="24" rx="4" fill="#ffffff"/><text x="126.5" y="337.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="126.5" dy="0">no</tspan></text><rect x="305" y="322" width="94" height="42" rx="4" fill="#ffffff"/><text x="352" y="337.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352" dy="0">sí, por</tspan><tspan x="352" dy="17.92">protección</tspan></text></svg>
