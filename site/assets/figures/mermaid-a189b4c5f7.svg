<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 819 400" width="819" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Reproducibilidad científica» … «Diseño profundo de un dominio»</title><desc id="d">Diagrama de flujo con 12 pasos. «Reproducibilidad científica» lleva a «Datos y procesamiento analítico». «Datos y procesamiento analítico» lleva a «Aprendizaje automático en producto». «Aprendizaje automático en producto» lleva a «Juegos y simulación». «Juegos y simulación» lleva a «Gráficos, audio y realidad extendida». «Gráficos, audio y realidad extendida» lleva a «Dinero e invariantes». «Dinero e invariantes» lleva a «Salud y sistemas regulados». «Salud y sistemas regulados» lleva a «Cadenas de bloques y contratos». «Cadenas de bloques y contratos» lleva a «Espacio y tiempo». «Espacio y tiempo» lleva a «Low-code». «Low-code» lleva a «Taller de riesgos entre dominios». «Taller de riesgos entre dominios» lleva a «Diseño profundo de un dominio». «Diseño profundo de un dominio» lleva a «Reproducibilidad científica» (hallazgo o supuesto cambiado).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="819" height="400" fill="#ffffff"/><path d="M190,62 L249,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M391,62 L450,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M592,62 L660,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M717.5,92.5 L717.5,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M638,200 L583,200" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M459,200 L404,200" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M236,200 L163.5,200" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M106,240 L106,316" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M190,338 L271,338" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M369,338 L450,338" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M592,338 L638,338" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M717.5,307.5 L717.5,263.0 Q717.5,254 708.5,254.0 L186.5,254.0 Q177.5,254 177.5,245.0 L177.5,115.5 Q177.5,106.5 168.5,106.5 L113.0,106.5 Q106,106.5 106.0,99.5 L106,92.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="31.5" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Reproducibilidad</tspan><tspan x="106" dy="19.2">científica</tspan></text><rect x="249" y="22" width="142" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="320" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="320" dy="0">Datos y</tspan><tspan x="320" dy="19.2">procesamiento</tspan><tspan x="320" dy="19.2">analítico</tspan></text><rect x="450" y="22" width="142" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="521" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="521" dy="0">Aprendizaje</tspan><tspan x="521" dy="19.2">automático en</tspan><tspan x="521" dy="19.2">producto</tspan></text><rect x="660" y="31.5" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="717.5" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="717.5" dy="0">Juegos y</tspan><tspan x="717.5" dy="19.2">simulación</tspan></text><rect x="638" y="160" width="159" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="717.5" y="185" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="717.5" dy="0">Gráficos, audio</tspan><tspan x="717.5" dy="19.2">y realidad</tspan><tspan x="717.5" dy="19.2">extendida</tspan></text><rect x="459" y="169.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="521" y="194.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="521" dy="0">Dinero e</tspan><tspan x="521" dy="19.2">invariantes</tspan></text><rect x="236" y="169.5" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="320" y="194.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="320" dy="0">Salud y sistemas</tspan><tspan x="320" dy="19.2">regulados</tspan></text><rect x="48.5" y="160" width="115" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="185" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Cadenas de</tspan><tspan x="106" dy="19.2">bloques y</tspan><tspan x="106" dy="19.2">contratos</tspan></text><rect x="22" y="316" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="342.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Espacio y tiempo</tspan></text><rect x="271" y="316" width="98" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="320" y="342.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="320" dy="0">Low-code</tspan></text><rect x="450" y="298" width="142" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="521" y="323" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="521" dy="0">Taller de</tspan><tspan x="521" dy="19.2">riesgos entre</tspan><tspan x="521" dy="19.2">dominios</tspan></text><rect x="638" y="307.5" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="717.5" y="332.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="717.5" dy="0">Diseño profundo</tspan><tspan x="717.5" dy="19.2">de un dominio</tspan></text><rect x="183.5" y="106" width="94" height="60" rx="4" fill="#ffffff"/><text x="230.5" y="121.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="230.5" dy="0">hallazgo o</tspan><tspan x="230.5" dy="17.92">supuesto</tspan><tspan x="230.5" dy="17.92">cambiado</tspan></text></svg>
