<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 912 105" width="912" height="105" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «🎯 Restricción física» … «📈 Recuperación»</title><desc id="d">Diagrama de flujo con 5 pasos. «🎯 Restricción física» lleva a «🧠 Deadline». «🧠 Deadline» lleva a «🛠️ Telemetría». «🛠️ Telemetría» lleva a «🔎 Actualización». «🔎 Actualización» lleva a «📈 Recuperación».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="912" height="105" fill="#ffffff"/><path d="M170,52.5 L216,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M338,52.5 L384,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M523,52.5 L569,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M711,52.5 L757,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="22" width="148" height="61" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="96" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="96" dy="0">🎯 Restricción</tspan><tspan x="96" dy="19.2">física</tspan></text><rect x="216" y="30.5" width="122" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="277" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="277" dy="0">🧠 Deadline</tspan></text><rect x="384" y="30.5" width="139" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="453.5" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="453.5" dy="0">🛠️ Telemetría</tspan></text><rect x="569" y="22" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="640" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="640" dy="0">🔎</tspan><tspan x="640" dy="19.2">Actualización</tspan></text><rect x="757" y="22" width="133" height="61" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="823.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="823.5" dy="0">📈</tspan><tspan x="823.5" dy="19.2">Recuperación</tspan></text></svg>
