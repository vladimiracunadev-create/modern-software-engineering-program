<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 439 548" width="439" height="548" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Aplicación» y «Montajes y red» … «Hardware anfitrión»</title><desc id="d">Diagrama de flujo con 7 pasos. «Aplicación» lleva a «Espacio de usuario». «Espacio de usuario» lleva a «Kernel usado». «Kernel usado» lleva a «Hardware anfitrión» (Nativo). «Kernel usado» lleva a «Hipervisor o VM administrada» (Invitado). «Hipervisor o VM administrada» lleva a «Hardware anfitrión». «Montajes y red» lleva a «Espacio de usuario». «Montajes y red» lleva a «Recursos externos o del anfitrión».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="439" height="548" fill="#ffffff"/><path d="M84.8,66 L84.8,90.2 Q84.8,99.2 93.8,99.2 L105.5,99.2 Q114.5,99.2 114.5,108.2 L114.5,132.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M114.5,176.5 L114.5,200.8 Q114.5,209.8 123.5,209.8 L130.4,209.8 Q139.4,209.8 139.4,218.8 L139.4,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M222.4,274 L269.2,274.0 Q278.2,274 278.2,283.0 L278.2,497.0 Q278.2,504 271.2,504.0 L264.2,504" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M139.4,305 L139.4,313.0 Q139.4,321 147.4,321.0 L151.9,321.0 Q160.9,321 160.9,330.0 L160.9,363" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M160.9,424 L160.9,447.6 Q160.9,453 166.3,453.0 L166.3,453.0 Q171.7,453 171.7,458.4 L171.7,482" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M251.3,66 L251.3,90.2 Q251.3,99.2 242.3,99.2 L123.5,99.2 Q114.5,99.2 114.5,108.2 L114.5,132.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M251.3,66 L251.3,86.0 Q251.3,95 260.3,95.0 L320.0,95.0 Q329,95 329.0,104.0 L329,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="27.3" y="22" width="115" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="84.8" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="84.8" dy="0">Aplicación</tspan></text><rect x="22" y="132.5" width="185" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="114.5" y="158.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="114.5" dy="0">Espacio de usuario</tspan></text><polygon points="139.4,243 222.4,274 139.4,305 56.4,274" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="139.4" y="278.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="139.4" dy="0">Kernel usado</tspan></text><rect x="79.2" y="482" width="185" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="171.7" y="508.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="171.7" dy="0">Hardware anfitrión</tspan></text><rect x="81.4" y="363" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="160.9" y="388.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="160.9" dy="0">Hipervisor o VM</tspan><tspan x="160.9" dy="19.2">administrada</tspan></text><rect x="176.3" y="22" width="150" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="251.3" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="251.3" dy="0">Montajes y red</tspan></text><rect x="241" y="124" width="176" height="61" rx="10" fill="#d