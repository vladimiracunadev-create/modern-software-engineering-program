<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 818 638" width="818" height="638" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Modelo e invariantes», «Migraciones en fases», «Índices y patrones de acceso», «Distribución y caché», «Respaldo y restauración medidos» y «Inventario y ciclo de vida» … «Lo que ninguno ve: LIMITES.md»</title><desc id="d">Diagrama de flujo con 10 pasos. «Modelo e invariantes» lleva a «Paquete de datos». «Migraciones en fases» lleva a «Paquete de datos». «Índices y patrones de acceso» lleva a «Paquete de datos». «Distribución y caché» lleva a «Paquete de datos». «Respaldo y restauración medidos» lleva a «Paquete de datos». «Inventario y ciclo de vida» lleva a «Paquete de datos». «Paquete de datos» lleva a «Validador: forma y coherencia». «Paquete de datos» lleva a «Simulacro: incidentes inyectados». «Validador: forma y coherencia» lleva a «Lo que ninguno ve: LIMITES.md». «Simulacro: incidentes inyectados» lleva a «Lo que ninguno ve: LIMITES.md». «Lo que ninguno ve: LIMITES.md» lleva a «Modelo e invariantes» (incidente o hallazgo).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="818" height="638" fill="#ffffff"/><path d="M159,52.5 L179.5,52.5 Q188.5,52.5 188.5,61.5 L188.5,306.8 Q188.5,315.8 197.5,315.8 L218,315.8" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M172,151.5 L186.0,151.5 Q195,151.5 195.0,160.5 L195.0,306.8 Q195,315.8 204.0,315.8 L218,315.8" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M159,260 L179.5,260.0 Q188.5,260 188.5,269.0 L188.5