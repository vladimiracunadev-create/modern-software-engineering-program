<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 795 166" width="795" height="166" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Slice reusable» … «Cambio compatible»</title><desc id="d">Diagrama de flujo con 5 pasos. «Slice reusable» lleva a «Diseño desde consumidor». «Diseño desde consumidor» lleva a «Artefacto e instalación». «Artefacto e instalación» lleva a «API / CLI coherentes». «API / CLI coherentes» lleva a «Cambio compatible». «Cambio compatible» lleva a «Slice reusable» (fallo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="795" height="166" fill="#ffffff"/><path d="M120,104 L166,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M281,104 L327,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M451,104 L497,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M612,104 L658,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M715.5,73.5 L715.5,59.0 Q715.5,50 706.5,50.0 L80.0,50.0 Q71,50 71.0,59.0 L71,73.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="73.5" width="98" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="71" y="98.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="71" dy="0">Slice</tspan><tspan x="71" dy="19.2">reusable</tspan></text><rect x="166" y="64" width="115" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="223.5" y="89" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="223.5" dy="0">Diseño</tspan><tspan x="223.5" dy="19.2">desde</tspan><tspan x="223.5" dy="19.2">consumidor</tspan></text><rect x="327" y="73.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="389" y="98.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="389" dy="0">Artefacto e</tspan><tspan x="389" dy="19.2">instalación</tspan></text><rect x="497" y="73.5" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="554.5" y="98.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="554.5" dy="0">API / CLI</tspan><tspan x="554.5" dy="19.2">coherentes</tspan></text><rect x="658" y="73.5" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="715.5" y="98.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="715.5" dy="0">Cambio</tspan><tspan x="715.5" dy="19.2">compatible</tspan></text><rect x="330.2" y="22" width="126" height="24" rx="4" fill="#ffffff"/><text x="393.2" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="393.2" dy="0">fallo o cambio</tspan></text></svg>
