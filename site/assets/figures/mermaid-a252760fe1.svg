<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 1069" width="448" height="1069" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Dominio y personas expertas» … «Código y pruebas con las mismas palabras»</title><desc id="d">Diagrama de flujo con 11 pasos. «Dominio y personas expertas» lleva a «Lenguaje ubicuo». «Lenguaje ubicuo» lleva a «¿Una palabra, un sentido?». «¿Una palabra, un sentido?» lleva a «Un modelo» (sí). «¿Una palabra, un sentido?» lleva a «Contextos delimitados» (no). «Contextos delimitados» lleva a «Contexto académico». «Contextos delimitados» lleva a «Contexto de avisos». «Contexto académico» lleva a «Capa de traducción». «Contexto de avisos» lleva a «Capa de traducción». «Capa de traducción» lleva a «Glosario y mapa de contextos». «Glosario y mapa de contextos» lleva a «Instrucciones de repositorio para agentes». «Instrucciones de repositorio para agentes» lleva a «Código y pruebas con las mismas palabras».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="448" height="1069" fill="#ffffff"/><path d="M149.9,83 L149.9,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M149.9,185 L149.9,206.4 Q149.9,214 157.4,214.0 L157.4,214.0 Q165,214 165.0,221.6 L165,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M165,329 L165.0,337.0 Q165,345 157.0,345.0 L111.0,345.0 Q102,345 102.0,354.0 L102,395.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M165,329 L165.0,337.0 Q165,345 173.0,345.0 L242.5,345.0 Q251.5,345 251.5,354.0 L251.5,387" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M251.5,448 L251.5,468.0 Q251.5,477 242.5,477.0 L123.5,477.0 Q114.5,477 114.5,486.0 L114.5,506" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M251.5,448 L251.5,468.0 Q251.5,477 260.5,477.0 L324.5,477.0 Q333.5,477 333.5,486.0 L333.5,506" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M114.5,550 L114.5,570.0 Q114.5,579 123.5,579.0 L193.7,579.0 Q202.7,579 202.7,588.0 L202.7,608" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M333.5,550 L333.5,570.0 Q333.5,579 324.5,579.0 L211.7,579.0 Q202.7,579 202.7,588.0 L202.7,608" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M202.7,652 L202.7,672.0 Q202.7,681 193.7,681.0 L188.8,681.0 Q179.8,681 179.8,690.0 L179.8,710" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M179.8,771 L179.8,791.6 Q179.8,800 171.4,800.0 L171.4,800.0 Q163,800 163.0,808.4 L163,829" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M158.9,909 L158.9,967" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="57.4" y="22" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="149.9" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="149.9" dy="0">Dominio y personas</tspan><tspan x="149.9" dy="19.2">expertas</tspan></text><rect x="70.4" y="141" width="159" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="149.9" y="167.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="149.9" dy="0">Lenguaje ubicuo</tspan></text><polygon points="165,243 300.5,286 165,329 29.5,286" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="165" y="280.6" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"