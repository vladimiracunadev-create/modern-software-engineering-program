a</tspan><tspan x="163" dy="19.2">agentes</tspan></text><rect x="70.8" y="967" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="154.8" y="992" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="154.8" dy="0">Código y pruebas</tspan><tspan x="154.8" dy="19.2">con las mismas</tspan><tspan x="154.8" dy="19.2">palabras</tspan></text><rect x="108" y="358.2" width="29" height="24" rx="4" fill="#ffffff"/><text x="122.5" y="374.1" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="122.5" dy="0">sí</tspan></text><rect x="257.5" y="354" width="29" height="24" rx="4" fill="#ffffff"/><text x="272" y="369.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="272" dy="0">no</tspan></text></svg>
