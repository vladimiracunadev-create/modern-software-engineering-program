<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 501 1127" width="501" height="1127" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Archivos del proyecto» y «Memoria persistente» … «Revisión»</title><desc id="d">Diagrama de flujo con 14 pasos. «Pregunta o tarea» lleva a «Recuperación». «Archivos del proyecto» lleva a «Fragmentación». «Fragmentación» lleva a «Índice». «Índice» lleva a «Recuperación». «Memoria persistente» lleva a «Caducidad». «Caducidad» lleva a «Candidatos» (vigente). «Caducidad» lleva a «Descartada o refrescada» (vencida). «Recuperación» lleva a «Candidatos». «Candidatos» lleva a «Empaquetado en presupuesto». «Empaquetado en presupuesto» lleva a «Ventana de contexto». «Ventana de contexto» lleva a «Modelo». «Modelo» lleva a «Respuesta con citas». «Respuesta con citas» lleva a «Revisión» (cita no coincide).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="501" height="1127" fill="#ffffff"/><path d="M106,313.5 L106.0,337.8 Q106,346.8 115.0,346.8 L170.9,346.8 Q179.9,346.8 179.9,355.8 L179.9,380" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M231.7,83 L231.7,150" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M231.7,194 L231.7,222.8 Q231.7,231.8 240.7,231.8 L255.5,231.8 Q264.5,231.8 264.5,240.8 L264.5,269.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M264.5,313.5 L264.5,337.8 Q264.5,346.8 255.5,346.8 L188.9,346.8 Q179.9,346.8 179.9,355.8 L179.9,380" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M401.2,83 L401.2,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M336.7,172 L325.7,172.0 Q316.7,172 316.7,181.0 L316.7,495.0 Q316.7,504 307.7,504.0 L237.1,504" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M403.4,203 L403.4,261" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M179.7,424 L179.7,482" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M180.3,526 L180.3,584" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M182.3,645 L182.3,703" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M184.7,764 L184.7,822" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M186.7,866 L186.7,924" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M187.9,985 L187.9,1061" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="269.5" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="295.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Pregunta o tarea</tspan></text><rect x="113.4" y="380" width="133" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="179.9" y="406.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="179.9" dy="0">Recuperación</tspan></text><rect x="165.2" y="22" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="231.7" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="231.7" dy="0">Archivos del</tspan><tspan x="231.7" dy="19.2">proyecto</tspan></text><rect x="160.7" y="150" width="142" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="231.7" y="176.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="231.7" dy="0">Fragmentación</tspan></text><rect x="224" y="269.5" width="81" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="264.5" y="295.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="264.5" dy="0">Índice</tspan></text><rect x="339.2" y="22" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="401.2" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="401.2" dy="0">Memoria</tspan><tspan x="401.2" dy="19.2">persistente</tspan></text><polygon points="401.2,141 465.7,172 401.2,203 336.7,172" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="401.2" y="176.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="401.2" dy="0">Caducidad</tspan></text><rect x="122.1" y="482" width="115" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="179.6" y="508.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="179.6" dy="0">Candidatos</tspan></text><rect x="339" y="261" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="405.5" y="286.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="405.5" dy="0">Descartada o</tspan><tspan x="405.5" dy="19.2">refrescada</tspan></text><rect x="106.1" y="584" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="181.1" y="609.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="181.1" dy="0">Empaquetado en</tspan><tspan x="181.1" dy="19.2">presupuesto</tspan></text><rect x="126" y="703" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="183.5" y="728.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="183.5" dy="0">Ventana de</tspan><tspan x="183.5" dy="19.2">con