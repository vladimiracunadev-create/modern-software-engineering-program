<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 931 309" width="931" height="309" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Llegadas», «Utilización», «Variabilidad y lotes» y «Límite de trabajo» … «Terminado»</title><desc id="d">Diagrama de flujo con 10 pasos. «Llegadas» lleva a «Cola». «Cola» lleva a «Servicio». «Servicio» lleva a «Terminado». «Utilización» lleva a «Espera». «Variabilidad y lotes» lleva a «Espera». «Límite de trabajo» lleva a «Elementos en curso». «Elementos en curso» lleva a «Plazo = en curso ÷ rendimiento» (ley de Little). «Espera» lleva a «Plazo = en curso ÷ rendimiento».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="931" height="309" fill="#ffffff"/><path d="M159,44 L219.8,44.0 Q228.8,44 228.8,53.0 L228.8,77.5 Q228.8,86.5 237.8,86.5 L298.5,86.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M374.5,86.5 L485.5,86.5 Q494.5,86.5 494.5,95.5 L494.5,103.0 Q494.5,112 503.5,112.0 L614.5,112" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M712.5,112 L802,112" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M172,112 L225.0,112.0 Q234,112 234.0,121.0 L234.0,145.5 Q234,154.5 243.0,154.5 L296,154.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M185,188.5 L231.5,188.5 Q240.5,188.5 240.5,179.5 L240.5,163.5 Q240.5,154.5 249.5,154.5 L296,154.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M198,265 L212.0,265.0 Q221,265 221.0,256.0 L221.0,231.5 Q221,222.