<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 264" width="822" height="264" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Manifiesto» y «Herramienta» … «Revisión humana»</title><desc id="d">Diagrama de flujo con 8 pasos. «Manifiesto» lleva a «Validador de forma». «Herramienta» lleva a «Suite de contrato». «Suite de contrato» lleva a «Windows». «Suite de contrato» lleva a «Ubuntu». «Validador de forma» lleva a «Paquete». «Windows» lleva a «Paquete». «Ubuntu» lleva a «Paquete». «Paquete» lleva a «Revisión humana». «Revisión humana» lleva a «Manifiesto» (decisiones abiertas).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="822" height="264" fill="#ffffff"/><path d="M141.5,112.5 L192,112.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M146,211.5 L209.5,211.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M307.5,211.5 L330.2,211.5 Q339.2,211.5 339.2,202.5 L339.2,121.5 Q339.2,112.5 348.2,112.5 L371,112.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M307.5,211.5 L375,211.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M325,112.5 L332.0,112.5 Q339,112.5 339.0,105.5 L339.0,85.5 Q339,76.5 348.0,76.5 L541.5,76.5 Q550.5,76.5 550.5,85.5 L550.5,140" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M460,112.5 L474.0,112.5 Q483,112.5 483.0,121.5 L483.0,153.0 Q483,162 492.0,162.0 L506,162" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M456,211.5 L472.0,211.5 Q481,211.5 481.0,202.5 L481.0,171.0 Q481,162 490.0,162.0 L506,162" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M595,162 L641,162" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M720.5,140 L720.5,77.0 Q720.5,68 711.5,68.0 L93.0,68.0 Q84,68 84.0,77.0 L84,90.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="26.5" y="90.5" width="115" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="84" y="116.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="84" dy="0">Manifiesto</tspan></text><rect x="192" y="82" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="258.5" y="107.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="258.5" dy="0">Validador de</tspan><tspan x="258.5" dy="19.2">forma</tspan></text><rect x="22" y="189.5" width="124" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="84" y="215.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="84" dy="0">Herramienta</tspan></text><rect x="209.5" y="181" width="98" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="258.5" y="206.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="258.5" dy="0">Suite de</tspan><tspan x="258.5" dy="19.2">contrato</tspan></text><rect x="371" y="90.5" width="89" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="415.5" y="116.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="415.5" dy="0">Windows</tspan></text><rect x="375" y="189.5" width="81" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="415.5" y="215.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="415.5"