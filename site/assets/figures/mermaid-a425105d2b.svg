<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 622 243" width="622" height="243" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «REPL / ciclo de realimentación» … «Narrativa / verificación»</title><desc id="d">Diagrama de flujo con 5 pasos. «REPL / ciclo de realimentación» lleva a «Notebook / grafo oculto». «Notebook / grafo oculto» lleva a «Exploración frente a producto». «Exploración frente a producto» lleva a «Proveniencia de datos». «Proveniencia de datos» lleva a «Narrativa / verificación». «Narrativa / verificación» lleva a «REPL / ciclo de realimentación» (fallo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="622" height="243" fill="#ffffff"/><path d="M181,62 L227,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M395,62 L458.5,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M520.5,102 L520.5,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M441,190.5 L377.5,190.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M244.5,190.5 L110.5,190.5 Q101.5,190.5 101.5,181.5 L101.5,92.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="31.5" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101.5" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101.5" dy="0">REPL / ciclo de</tspan><tspan x="101.5" dy="19.2">realimentación</tspan></text><rect x="227" y="31.5" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="311" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="311" dy="0">Notebook / grafo</tspan><tspan x="311" dy="19.2">oculto</tspan></text><rect x="458.5" y="22" width="124" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="520.5" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="520.5" dy="0">Exploración</tspan><tspan x="520.5" dy="19.2">frente a</tspan><tspan x="520.5" dy="19.2">producto</tspan></text><rect x="441" y="160" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="520.5" y="185.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="520.5" dy="0">Proveniencia de</tspan><tspan x="520.5" dy="19.2">datos</tspan></text><rect x="244.5" y="160" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="311" y="185.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="311" dy="0">Narrativa /</tspan><tspan x="311" dy="19.2">verificación</tspan></text><rect x="110" y="162.5" width="126" height="24" rx="4" fill="#ffffff"/><text x="173" y="178.4" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="173" dy="0">fallo o cambio</tspan></text></svg>
