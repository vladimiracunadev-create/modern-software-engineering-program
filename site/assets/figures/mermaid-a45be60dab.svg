<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 434 638" width="434" height="638" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Síntoma» y «Señales: normal, desviada, sin datos» … «Mitigar y verificar» y «Elegir la observación que más separa»</title><desc id="d">Diagrama de flujo con 8 pasos. «Síntoma» lleva a «Hipótesis posibles». «Señales: normal, desviada, sin datos» lleva a «Candidatas compatibles». «Hipótesis posibles» lleva a «Candidatas compatibles». «Candidatas compatibles» lleva a «¿Una sola?». «¿Una sola?» lleva a «Mitigar y verificar» (sí). «¿Una sola?» lleva a «Elegir la observación que más separa» (no). «Elegir la observación que más separa» lleva a «Señales: normal, desviada, sin datos». «Señales: normal, desviada, sin datos» lleva a «Sesgo: parece normal» (telemetría perdida). «Sesgo: parece normal» lleva a «Candidatas compatibles».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="434" height="638" fill="#ffffff"/><path d="M114.5,84 L114.5,186.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M396,62 L403.0,62.0 Q410,62 410.0,69.0 L410.0,318.5 Q410,327.5 401.0,327.5 L275.5,327.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M114.5,230.5 L114.5,254.8 Q114.5,263.8 123.5,263.8 L204.5,263.8 Q213.5,263.8 213.5,272.8 L213.5,297" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M213.7,358 L213.7,416" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M214,478 L214.0,486.0 Q214,494 206.0,494.0 L139.7,494.0 Q130.7,494 130.7,503.0 L130.7,545.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M214,478 L214.0,486.0 Q214,494 222.0,494.0 L288.7,494.0 Q297.7,494 297.7,503.0 L297.7,536" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M312,102 L312,178" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M312,239 L312.0,259.0 Q312,268 303.0,268.0 L222.5,268.0 Q213.5,268 213.5,277.0 L213.5,297" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M377.2,576 L384.2,576.0 Q391.2,576 391.2,569.0 L391.2,125.0 Q391.2,116 382.2,116.0 L319.0,116.0 Q312,116 312.0,109.0 L312,102" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="70" y="40" width="89" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="114.5" y="66.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="114.5" dy="0">Síntoma</tspan></text><rect x="22" y="186.5" width="185" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="114.5" y="212.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="114.5" dy="0">Hipótesis posibles</tspan></text><rect x="228" y="22" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="312" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="312" dy="0">Señales: normal,</tspan><tspan x="312" dy="19.2">desviada, sin</tspan><tspan x="312" dy="19.2">datos</tspan></text><rect x="151.5" y="297" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="213.5" y="322.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="213.5" dy="0">Candidatas</tspan><tspan x="213.5" dy="19.2">compatibles</tspan></text><polygon points="214,416 284.5,447 214,478 143.5,447" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="214" y="451.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="214" dy="0">¿Una sola?</tspan></text><rect x="77.2" y="545.5" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="130.7" y="570.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="130.7" dy="0">Mitigar y</tspan><tspan x="130.7" dy="19.2">verificar</tspan></text><rect x="218.2" y="536" width="159" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="297.7" y="561" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="297.7" dy="0">Elegir la</tspan><tspan x="297.7" dy="19.2">observación que</tspan><tspan x="297.7" dy="19.2">más separa</tspan></text><rect x="241" y="178" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="312" y="203.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="312" dy="0">Sesgo: parece</tspan><tspan x="312" dy="19.2">normal</tspan></text><rect x="136.7" y="507.8" width="29" height="24" rx="4" fill="#ffffff"/><text x="151.2" y="523.7" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="151.2" dy="0">sí</tspan></text><rect x="303.7" y="503" width="29" height="24" rx="4" fill="#ffffff"/><text x="318.2" y="518.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="318.2" dy="0">no</tspan></text><rect x="212" y="119" width="94" height="42" rx="4" fill="#ffffff"/><text x="259" y="134.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="259" dy="0">telemetría</tspan><tspan x="259" dy="17.92">perdida</tspan></text></svg>
