<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 478 700" width="478" height="700" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de estados: «prueba» … «cancelada»</title><desc id="d">Diagrama de estados con 6 estados. inicio lleva a «prueba». «prueba» lleva a «activa» (pago correcto). «prueba» lleva a «cancelada» (vence sin pago). «activa» lleva a «pago pendiente» (cobro falla). «pago pendiente» lleva a «activa» (pago correcto). «pago pendiente» lleva a «suspendida» (reintentos agotados). «suspendida» lleva a «activa» (pago correcto). «suspendida» lleva a «cancelada» (plazo vencido). «activa» lleva a «cancelacion pedida» (cancelar al fin del ciclo). «cancelacion pedida» lleva a «cancelada» (fin del ciclo). «cancelada» lleva a fin.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="478" height="700" fill="#ffffff"/><path d="M257.8,48 L257.8,106" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M257.8,150 L257.8,158.4 Q257.8,166 250.2,166.0 L250.2,166.0 Q242.6,166 242.6,173.6 L242.6,208" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M217.3,128 L197.1,128.0 Q188.1,128 188.1,137.0 L188.1,305.0 Q188.1,314 197.1,314.0 L221.8,314.0 Q230.8,314 230.8,323.0 L230.8,527.0 Q230.8,536 239.8,536.0 L242.6,536.0 Q251.6,536 251.6,545.0 L251.6,565.0 Q251.6,572 244.6,572.0 L237.6,572" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M242.6,252 L242.6,260.0 Q242.6,268 234.6,268.0 L139.0,268.0 Q130,268 130.0,277.0 L130,328" fill="none" stroke="#32505f" stroke-width="1.8" marke