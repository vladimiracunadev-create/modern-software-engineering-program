<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 379" width="910" height="379" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Decisión técnica» … «Presupuesto y alertas»</title><desc id="d">Diagrama de flujo con 10 pasos. «Decisión técnica» lleva a «Consulta: bytes leídos». «Decisión técnica» lleva a «Refresco: frecuencia y alcance». «Decisión técnica» lleva a «Retención: TB-mes». «Decisión técnica» lleva a «Pipeline: ruta crítica». «Consulta: bytes leídos» lleva a «Costo = bytes × precio × ejecuciones». «Refresco: frecuencia y alcance» lleva a «Costo = bytes × precio × ejecuciones». «Retención: TB-mes» lleva a «Costo = bytes × precio × ejecuciones». «Pipeline: ruta crítica» lleva a «Hora de entrega». «Costo = bytes × precio × ejecuciones» lleva a «Atribución por dueño». «Atribución por dueño» lleva a «Presupuesto y alertas». «Hora de entrega» lleva a «SLO de frescura».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="910" height="379" fill="#ffffff"/><path d="M120,189.5 L138.2,189.5 Q147.2,189.5 147.2,180.5 L147.2,61.5 Q147.2,52.5 156.2,52.5 L174.5,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M120,189.5 L138.2,189.5 Q147.2,189.5 147.2,180.5 L147.2,156.0 Q147.2,147 156.2,147.0 L174.5,147" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M120,189.5 L142.8,189.5 Q151.8,189.5 151.8,198.5 L151.8,232.5 Q151.8,241.5 160.8,241.5 L183.5,241.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M120,189.5 L134.0,189.5 Q143,189.5 143.0,198.5 L14