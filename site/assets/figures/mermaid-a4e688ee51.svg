<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 614 675" width="614" height="675" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Motivo: disponibilidad, regulación, costo, dependencia» … «Disponibilidad ganada o perdida»</title><desc id="d">Diagrama de flujo con 9 pasos. «Motivo: disponibilidad, regulación, costo, dependencia» lleva a «Estrategia». «Estrategia» lleva a «Multi-cloud activo-activo» (dos proveedores a la vez). «Estrategia» lleva a «Híbrido» (local y nube). «Estrategia» lleva a «Portabilidad» (poder salir). «Multi-cloud activo-activo» lleva a «Costo: funciones comunes y pruebas». «Híbrido» lleva a «Costo: latencia y red entre sitios». «Portabilidad» lleva a «Costo: datos y servicios gestionados». «Costo: funciones comunes y pruebas» lleva a «Disponibilidad ganada o perdida». «Costo: latencia y red entre sitios» lleva a «Disponibilidad ganada o perdida». «Costo: datos y servicios gestionados» lleva a «Disponibilidad ganada o perdida».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="614" height="675" fill="#ffffff"/><path d="M315.6,121 L315.6,179" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M315.6,241 L315.6,249.0 Q315.6,257 307.6,257.0 L176.7,257.0 Q167.7,257 167.7,266.0 L167.7,335" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M316.4,241 L316.4,343.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M315.6,241 L315.6,249.0 Q315.6,257 323.6,257.0 L453.2,257.0 Q462.2,257 462.2,266.0 L462.2,343.5" fill="none" stroke="#32505f" s