<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 428 784" width="428" height="784" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Dominios» … «Decisión y límites»</title><desc id="d">Diagrama de flujo con 10 pasos. «Dominios» lleva a «Criterios y escala con anclas». «Criterios y escala con anclas» lleva a «Puntuaciones con justificación». «Puntuaciones con justificación» lleva a «Pesos». «Pesos» lleva a «Ranking». «Ranking» lleva a «Sensibilidad a los pesos». «Puntuaciones con justificación» lleva a «Acuerdo entre evaluadores». «Dominios» lleva a «Riesgos por dominio». «Riesgos por dominio» lleva a «Controles y cobertura». «Sensibilidad a los pesos» lleva a «Decisión y límites». «Acuerdo entre evaluadores» lleva a «Decisión y límites». «Controles y cobertura» lleva a «Decisión y límites».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="428" height="784" fill="#ffffff"/><path d="M246.2,66 L246.2,86.0 Q246.2,95 237.2,95.0 L160.9,95.0 Q151.9,95 151.9,104.0 L151.9,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M151.9,185 L151.9,208.8 Q151.9,214 146.7,214.0 L146.7,214.0 Q141.4,214 141.4,219.2 L141.4,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M141.4,304 L141.4,328.2 Q141.4,337.2 132.4,337.2 L72.2,337.2 Q63.2,337.2 63.2,346.2 L63.2,370.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M63.2,414.5 L63.2,438.8 Q63.2,447.8 72.2,447.8 L82.1,447.8 Q91.1,447.8 91.1,456.8 L91.1,481" fill="none" stroke="#32505f" stroke-width="1.8" marker-end