<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 598 746" width="598" height="746" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Tarea: periodo, plazo, cómputo» … «Planificable» y «Cambiar prioridades, cómputo o recurso»</title><desc id="d">Diagrama de flujo con 9 pasos. «Tarea: periodo, plazo, cómputo» lleva a «Prioridades fijas». «Prioridades fijas» lleva a «Interferencia de tareas más prioritarias». «Interferencia de tareas más prioritarias» lleva a «Tiempo de respuesta». «Peor caso de ejecución» lleva a «Tiempo de respuesta». «Bloqueo por recurso compartido» lleva a «Tiempo de respuesta». «Tiempo de respuesta» lleva a «Respuesta menor o igual al plazo». «Respuesta menor o igual al plazo» lleva a «Planificable» (sí). «Respuesta menor o igual al plazo» lleva a «Cambiar prioridades, cómputo o recurso» (no).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="598" height="746" fill="#ffffff"/><path d="M142.4,83 L142.4,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M142.4,185 L142.4,205.0 Q142.4,214 133.4,214.0 L115.0,214.0 Q106,214 106.0,223.0 L106,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M106,323 L106.0,343.0 Q106,352 115.0,352.0 L312.0,352.0 Q321,352 321.0,361.0 L321,381" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M290.5,313.5 L290.5,338.2 Q290.5,347.2 299.5,347.2 L312.0,347.2 Q321,347.2 321.0,356.2 L321,381" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M483.5,313.5 L483.5,338.2 Q483.5,347.2 474.5,347.2 L330.0,347.2 Q321,347.2 321.0,356.2 L321,381" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M321,442 L321.0,462.0 Q321,471 330.0,471.0 L337.1,471.0 Q346.1,471 346.1,480.0 L346.1,500" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M346.1,586 L346.1,594.0 Q346.1,602 338.1,602.0 L271.1,602.0 Q262.1,602 262.1,611.0 L262.1,662" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M346.1,586 L346.1,594.0 Q346.1,602 354.1,602.0 L441.6,602.0 Q450.6,602 450.6,611.0 L450.6,644" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="62.9" y="22" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="142.4" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="142.4" dy="0">Tarea: periodo,</tspan><tspan x="142.4" dy="19.2">plazo, cómputo</tspan></text><rect x="54.4" y="141" width="176" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="142.4" y="167.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="142.4" dy="0">Prioridades fijas</tspan></text><rect x="22" y="243" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="268" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Interferencia de</tspan><tspan x="106" dy="19.2">tareas más</tspan><tspan x="106" dy="19.2">prioritarias</tspan></text><rect x="267.5" y="381" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="321" y="406.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="321" dy="0">Tiempo de</tspan><tspan x="321" dy="19.2">respuesta</tspan></text><rect x="224" y="252.5" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="290.5" y="277.6" font-size