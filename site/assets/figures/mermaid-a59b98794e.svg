<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 886 105" width="886" height="105" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «🎯 Ciclo de vida» … «📈 Aprendizaje»</title><desc id="d">Diagrama de flujo con 5 pasos. «🎯 Ciclo de vida» lleva a «🧠 Estado local». «🧠 Estado local» lleva a «🛠️ Sincronización». «🛠️ Sincronización» lleva a «🔎 Distribución». «🔎 Distribución» lleva a «📈 Aprendizaje».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="886" height="105" fill="#ffffff"/><path d="M144,52.5 L190,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M295,52.5 L341,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M491,52.5 L537,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M670,52.5 L716,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="22" width="122" height="61" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="83" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="83" dy="0">🎯 Ciclo de</tspan><tspan x="83" dy="19.2">vida</tspan></text><rect x="190" y="22" width="105" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="242.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="242.5" dy="0">🧠 Estado</tspan><tspan x="242.5" dy="19.2">local</tspan></text><rect x="341" y="22" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="416" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="416" dy="0">🛠️</tspan><tspan x="416" dy="19.2">Sincronización</tspan></text><rect x="537" y="22" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="603.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="603.5" dy="0">🔎</tspan><tspan x="603.5" dy="19.2">Distribución</tspan></text><rect x="716" y="30.5" width="148" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="790" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="790" dy="0">📈 Aprendizaje</tspan></text></svg>
