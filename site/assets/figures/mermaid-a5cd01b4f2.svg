<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 918 513" width="918" height="513" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Cambio: silenciar un curso» … «Combinación recomendada»</title><desc id="d">Diagrama de flujo con 10 pasos. «Cambio: silenciar un curso» lleva a «TDD: dos pruebas». «Cambio: silenciar un curso» lleva a «BDD: tres escenarios». «Cambio: silenciar un curso» lleva a «ATDD: tabla de ejemplos». «Cambio: silenciar un curso» lleva a «Contrato: propiedades». «Cambio: silenciar un curso» lleva a «SDD: modelo ejecutable». «Siete silencios mal hechos» lleva a «Medir cada artefacto». «TDD: dos pruebas» lleva a «Medir cada artefacto». «BDD: tres escenarios» lleva a «Medir cada artefacto». «ATDD: tabla de ejemplos» lleva a «Medir cada artefacto». «Contrato: propiedades» lleva a «Medir cada artefacto». «SDD: modelo ejecutable» lleva a «Medir cada artefacto». «Medir cada artefacto» lleva a «Qué mata y qué deja vivo». «Qué mata y qué deja vivo» lleva a «Combinación recomendada».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="918" height="513" fill="#ffffff"/><path d="M155,256.5 L169.0,256.5 Q178,256.5 178.0,247.5 L178.0,53.0 Q178,44 187.0,44.0 L201,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M155,256.5 L182.2,256.5 Q191.2,256.5 191.2,247.5 L191.2,129.5 Q191.2,120.5 200.2,120.5 L227.5,120.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M155,256.5 L173.5,256.5 Q182.5,256.5 182.5,247.5 L182.5,214.5 Q182.5,205.5 191.5,205.5 L210,205.5" fill="none" stroke="#325