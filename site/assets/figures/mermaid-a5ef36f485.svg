<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 457 254" width="457" height="254" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Vacío» … «Con datos» y «Error»</title><desc id="d">Diagrama de flujo con 4 pasos. «Vacío» lleva a «Carga» (pedir). «Carga» lleva a «Con datos» (datos). «Carga» lleva a «Vacío» (sin resultados). «Carga» lleva a «Error» (fallo). «Error» lleva a «Carga» (reintentar). «Con datos» lleva a «Carga» (actualizar).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="457" height="254" fill="#ffffff"/><path d="M98,127 L175,127" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M251,127 L259.0,127.0 Q267,127 267.0,119.0 L267.0,95.0 Q267,86 276.0,86.0 L328,86" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M251,127 L259.0,127.0 Q267,127 267.0,135.0 L267.0,159.0 Q267,168 276.0,168.0 L343.5,168" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M213,105 L213.0,98.0 Q213,91 206.0,91.0 L67.0,91.0 Q60,91 60.0,98.0 L60,105" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><path d="M381.5,190 L381.5,197.0 Q381.5,204 374.5,204.0 L222.0,204.0 Q213,204 213.0,195.0 L213,149" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><path d="M381.5,64 L381.5,57.0 Q381.5,50 374.5,50.0 L222.0,50.0 Q213,50 213.0,59.0 L213,105" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="105" width