<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 439 997" width="439" height="997" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Sistema real» … «Retirar o simplificar»</title><desc id="d">Diagrama de flujo con 10 pasos. «Sistema real» lleva a «Inventario: candidatos por estructura». «Inventario: candidatos por estructura» lleva a «Verificación: ¿cumple la definición?». «Verificación: ¿cumple la definición?» lleva a «Descartado con razón» (no). «Verificación: ¿cumple la definición?» lleva a «Fuerza y costo medido» (sí). «Fuerza y costo medido» lleva a «¿Entrada completa?». «¿Entrada completa?» lleva a «No entra al catálogo» (falta evidencia, costo o salida). «¿Entrada completa?» lleva a «Catálogo» (completa). «Catálogo» lleva a «Revisión periódica». «Revisión periódica» lleva a «Retirar o simplificar» (la fuerza desapareció).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="439" height="997" fill="#ffffff"/><path d="M161,66 L161,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M161,204 L161.0,225.2 Q161,233 168.8,233.0 L168.8,233.0 Q176.7,233 176.7,240.8 L176.7,262" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M176.7,342 L176.7,350.0 Q176.7,358 168.7,358.0 L106.0,358.0 Q97,358 97.0,367.0 L97,400" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M176.7,342 L176.7,350.0 Q176.7,358 184.7,358.0 L272.0,358.0 Q281,358 281.0,367.0 L281,400" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M281,461 L281.0,482.4 