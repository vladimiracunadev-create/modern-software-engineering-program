<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 401 990" width="401" height="990" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Transacciones» … «Probabilidad de reversión» y «No se puede corregir»</title><desc id="d">Diagrama de flujo con 11 pasos. «Transacciones» lleva a «Bloque con hash del anterior». «Bloque con hash del anterior» lleva a «Prueba de trabajo». «Prueba de trabajo» lleva a «Difusión a la red». «Difusión a la red» lleva a «Hay bifurcación?». «Hay bifurcación?» lleva a «Gana la cadena más larga» (sí). «Hay bifurcación?» lleva a «Bloque aceptado» (no). «Gana la cadena más larga» lleva a «Bloque aceptado». «Bloque aceptado» lleva a «Confirmaciones». «Confirmaciones» lleva a «Probabilidad de reversión». «Bloque aceptado» lleva a «Contrato ejecuta código». «Contrato ejecuta código» lleva a «No se puede corregir» (error).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="401" height="990" fill="#ffffff"/><path d="M197.3,66 L197.3,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M197.3,185 L197.3,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M197.3,287 L197.3,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M197.4,389 L197.4,447" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M197.6,509 L197.6,567" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M306,478 L313.0,478.0 Q320,478 320.0,485.0 L320.0,699.0 Q320,708 311.0,708.0 L277.3,708" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M197.8,628 L197.8,686" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M197.8,730 L197.8,754.2 Q197.8,763.2 188.8,763.2 L110.4,763.2 Q101.4,763.2 101.4,772.2 L101.4,796.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M101.4,840.5 L101.4,907" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M197.8,730 L197.8,750.0 Q197.8,759 206.8,759.0 L285.4,759.0 Q294.4,759 294.4,768.0 L294.4,788" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M294.4,849 L294.4,907" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="126.3" y="22" width="142" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="197.3" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="197.3" dy="0">Transacciones</tspan></text><rect x="117.8" y="124" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="197.3" y="149.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="197.3" dy="0">Bloque con hash</tspan><tspan x="197.3" dy="19.2">del anterior</tspan></text><rect x="109.3" y="243" width="176" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="197.3" y="269.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="197.3" dy="0">Prueba de trabajo</tspan></text><rect x="109.4" y="345" width="176" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="197.4" y="371.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="197.4" dy="0">Difusión a la red</tspan></text><polygon points="197.5,447 306,478 197.5,509 89,478" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="197.5" y="482.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="197.5" dy="0">Hay bifurcación?</tspan></text><rect x="105.2" y="567" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="197.7" y="592.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="197.7" dy="0">Gana la cadena más</tspan><tspan x="197.7" dy="19.2">larga</tspan></text><rect x="118.3" y="686" width="159" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="197.8" y="712.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="197.8" dy="0">Bloque aceptado</tspan></text><rect x="26.4" y="796.5" width="150" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101.4" y="822.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101.4" dy="0">Confirmaciones</tspan></text><rect x="22" y="907" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101.5" y="932.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101.5" dy="0">Probabilidad de</tspan><tspan x="101.5" dy="19.2">reversión</tspan></text><rect x="210.4" y="788" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="294.4" y="813.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="294.4" dy="0">Contrato ejecuta</tspan><tspan x="294.4" dy="19.2">código</tspan></text><rect x="232.5" y="907" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="294.5" y="932.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="294.5" dy="0">No se puede</tspan><tspan x="294.5" dy="19.2">corregir</tspan></text><rect x="203.6" y="526" width="29" height="24" rx="4" fill="#ffffff"/><text x="218.1" y="541.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="218.1" dy="0">sí</tspan></text><rect x="284.2" y