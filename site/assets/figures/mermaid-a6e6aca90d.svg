<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 617 397" width="617" height="397" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Esquema antiguo» … «Contraer: retirar lo antiguo»</title><desc id="d">Diagrama de flujo con 9 pasos. «Esquema antiguo» lleva a «Expandir: añadir lo nuevo, nulo». «Expandir: añadir lo nuevo, nulo» lleva a «Escribir en ambos». «Escribir en ambos» lleva a «Rellenar lo histórico por lotes». «Rellenar lo histórico por lotes» lleva a «Verificar contenido». «Verificar contenido» lleva a «Rellenar lo histórico por lotes» (difiere). «Verificar contenido» lleva a «Leer del nuevo». «Leer del nuevo» lleva a «Dejar de escribir en el antiguo». «Dejar de escribir en el antiguo» lleva a «Periodo de reposo». «Periodo de reposo» lleva a «Contraer: retirar lo antiguo». «Leer del nuevo» lleva a «Escribir en ambos» (problema). «Dejar de escribir en el antiguo» lleva a «Leer del nuevo» (problema).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="617" height="397" fill="#ffffff"/><path d="M192.5,68.5 L238.5,68.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M406.5,68.5 L461.5,68.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M523.5,99 L523.5,157" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M452.5,197 L376,197" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M269,197 L188,197" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M113,219 L113,295" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M188,335 L265,335" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M380,335 L466,335" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M322.5,227.5 L322.5,242.0 Q322.5,251 331.5,251.0 L516.5,251.0 Q523.5,251 523.5,244.0 L523.5,237" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><path d="M113,175 L113.0,122.0 Q113,113 122.0,113.0 L443.0,113.0 Q452,113 452.0,104.0 L452.0,33.0 Q452,24 461.0,24.0 L516.5,24.0 Q523.5,24 523.5,31.0 L523.5,38" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><path d="M38,335 L31.0,335.0 Q24,335 24.0,328.0 L24.0,204.0 Q24,197 31.0,197.0 L38,197" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="33.5" y="46.5" width="159" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="113" y="72.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="113" dy="0">Esquema antiguo</tspan></text><rect x="238.5" y="38" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="322.5" y="63.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="322.5" dy="0">Expandir: añadir</tspan><tspan x="322.5" dy="19.2">lo nuevo, nulo</tspan></text><rect x="461.5" y="38" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="523.5" y="63.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="523.5" dy="0">Escribir en</tspan><tspan x="523.5" dy="19.2">ambos</tspan></text><rect x="452.5" y="157" width="142" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="523.5" y="182" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="523.5" dy="0">Rellenar lo</tspan><tspan x="523.5" dy="19.2">histórico por</tspan><tspan x="523.5" dy="19.2">lotes</tspan></text><rect x="269" y="166.5" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="322.5" y="191.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="322.5" dy="0">Verificar</tspan><tspan x="322.5" dy="19.2">contenido</tspan></text><rect x="38" y="175" width="150" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="113" y="201.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="113" dy="0">Leer del nuevo</tspan></text><rect x="38" y="295" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="113" y="320" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="113" dy="0">Dejar de</tspan><tspan x="113" dy="19.2">escribir en el</tspan><tspan x="113" dy="19.2">antiguo</tspan></text><rect x="265" y="304.5" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="322.5" y="329.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="322.5" dy="0">Periodo de</tspan><tspan x="322.5" dy="19.2">reposo</tspan></text><rect x="466" y="295" width="115" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="523.5" y="320" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="523.5" dy="0">Contraer:</tspan><tspan x="523.5" dy="19.2">retirar lo</tspan><tspan x="523.5" dy="19.2">antiguo</tspan></text><rect x="388.5" y="255" width="69" height="24" rx="4" fill="#ffffff"/><text x="423" y="270.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="423" dy="0">difiere</tspan></text><rect x="244" y="117" width="77" height="24" rx="4" fill="#ffffff"/><text x="282.5" y="132.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="282.5" dy=