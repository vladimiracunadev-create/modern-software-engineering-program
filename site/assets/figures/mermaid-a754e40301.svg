<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 562 638" width="562" height="638" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Problema del negocio» y «Solución elegida» … «Qué se prueba y cómo»</title><desc id="d">Diagrama de flujo con 9 pasos. «Problema del negocio» lleva a «Complejidad esencial: reglas y combinaciones». «Solución elegida» lleva a «Complejidad accidental: forma, estado, indirección». «Complejidad esencial: reglas y combinaciones» lleva a «Mínimo irreductible». «Complejidad accidental: forma, estado, indirección» lleva a «Reducible con otra forma». «Mínimo irreductible» lleva a «Medida: combinaciones de la regla». «Reducible con otra forma» lleva a «Medidas: caminos, anidamiento, cognitiva». «Medida: combinaciones de la regla» lleva a «Qué se prueba y cómo». «Medidas: caminos, anidamiento, cognitiva» lleva a «Qué se prueba y cómo». «Qué se prueba y cómo» lleva a «Problema del negocio» (el negocio cambia la regla).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="562" height="638" fill="#ffffff"/><path d="M228.5,83 L228.5,150.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M447.5,74.5 L447.5,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M230.3,230.5 L230.3,298" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M446,240 L446,298" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M233.8,359 L233.8,417" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M443,359 L443,417" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M235.6,497 L235.6,517.0 Q235.6,526 244.6,526.0 L329.8,526.0 Q338.8,526 338.8,535.0 L338.8,555" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M441.6,497 L441.6,517.0 Q441.6,526 432.6,526.0 L347.8,526.0 Q338.8,526 338.8,535.0 L338.8,555" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M259.3,585.5 L131.0,585.5 Q122,585.5 122.0,576.5 L122.0,61.5 Q122,52.5 131.0,52.5 L162,52.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="162" y="22" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="228.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="228.5" dy="0">Problema del</tspan><tspan x="228.5" dy="19.2">negocio</tspan></text><rect x="136" y="150.5" width="185" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="228.5" y="175.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="228.5" dy="0">Complejidad</tspan><tspan x="228.5" dy="19.2">esencial: reglas y</tspan><tspan x="228.5" dy="19.2">combinaciones</tspan></text><rect x="363.5" y="30.5" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="447.5" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="447.5" dy="0">Solución elegida</tspan></text><rect x="355" y="141" width="185" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="447.5" y="165.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="447.5" dy="0">Complejidad</tspan><tspan x="447.5" dy="19.2">accidental: forma,</tspan><tspan x="447.5" dy="19.2">estado,</tspan><tspan x="447.5" dy="19.2">indirección</tspan></text><rect x="165.5" y="298" width="133" height="61" rx="