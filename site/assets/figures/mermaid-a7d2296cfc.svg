<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 692" width="560" height="692" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Afirmación de identidad» … «Renovación, expiración y cierre» y «Secuestro de sesión»</title><desc id="d">Diagrama de flujo con 8 pasos. «Afirmación de identidad» lleva a «Prueba: algo que sabes, tienes o eres». «Prueba: algo que sabes, tienes o eres» lleva a «Verificación y decisión». «Verificación y decisión» lleva a «Sesión: identificador con ciclo de vida». «Sesión: identificador con ciclo de vida» lleva a «Renovación, expiración y cierre». «Prueba: algo que sabes, tienes o eres» lleva a «Costo por candidato» (base filtrada). «Prueba: algo que sabes, tienes o eres» lleva a «Relleno de credenciales» (credenciales reutilizadas). «Sesión: identificador con ciclo de vida» lleva a «Secuestro de sesión» (token predecible o robado).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="560" height="692" fill="#ffffff"/><path d="M271.4,83 L271.4,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M271.4,221 L271.4,250.0 Q271.4,259 262.4,259.0 L113.9,259.0 Q104.9,259 104.9,268.0 L104.9,297" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M104.9,358 L104.9,378.0 Q104.9,387 113.9,387.0 L142.2,387.0 Q151.2,387 151.2,396.0 L151.2,416" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M151.2,496 L151.2,534.0 Q151.2,543 142.2,543.0 L97.5,543.0 Q88.5,543 88.5,552.0 L88.5,590" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M269.4,221 L269.4,297" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M271.4,221 L271.4,229.0 Q271.4,237 279.4,237.0 L412.4,237.0 Q421.4,237 421.4,246.0 L421.4,297" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M151.2,496 L151.2,504.0 Q151.2,512 159.2,512.0 L246.5,512.0 Q255.5,512 255.5,521.0 L255.5,599.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="200.4" y="22" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="271.4" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="271.4" dy="0">Afirmación de</tspan><tspan x="271.4" dy="19.2">identidad</tspan></text><rect x="187.4" y="141" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="271.4" y="166" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="271.4" dy="0">Prueba: algo que</tspan><tspan x="271.4" dy="19.2">sabes, tienes o</tspan><tspan x="271.4" dy="19.2">eres</tspan></text><rect x="29.9" y="297" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="104.9" y="322.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="104.9" dy="0">Verificación y</tspan><tspan x="104.9" dy="19.2">decisión</tspan></text><rect x="63.2" y="416" width="176" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="151.2" y="441" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="151.2" dy="0">Sesión:</tspan><tspan x="151.2" dy="19.2">identificador con</tspan><tspan x="151.2" dy="19.2">ciclo de vida</tspan></text><rect x="22" y="590" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="88.5" y="615" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="88.5" dy="0">Renovación,</tspan><tspan x="88.5" dy="19.2">expiración y</tspan><tspan x="88.5" dy="19.2">cierre</tspan></text><rect x="213.9" y="297" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="267.4" y="322.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="267.4" dy="0">Costo por</tspan><tspan x="267.4" dy="19.2">candidato</tspan></text><rect x="354.9" y="297" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="421.4" y="322.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="421.4" dy="0">Relleno de</tspan><tspan x="421.4" dy="19.2">credenciales</tspan></text><rect x="189" y="599.5" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="255.5" y="624.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="255.5" dy="0">Secuestro de</tspan><tspan x="255.5" dy="19.2">sesión</tspan></text><rect x="275.4" y="247" width="118" height="24" rx="4" fill="#ffffff"/><text x="334.4" y="262.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="334.4" dy="0">base filtrada</tspan></text><rect x="427.4" y="246" width="110" height="42" rx="4" fill="#ffffff"/><text x="482.4" y="261.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482.4" dy="0">credenciales</tspan><tspan x="482.4" dy="17.92">reutilizadas</tspan></text><rect x="261.5" y="525.8" width="110" height="60" rx="4" fill="#ffffff"/><text x="316.5" y="541.7" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="316.5" dy="0">token</tspan><tspan x="316.5" dy="17.92">predecible o</tspan><tspan x="316.5" dy="17.92">robado</tspan></text></svg>
