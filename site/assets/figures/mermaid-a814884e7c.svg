<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 849 187" width="849" height="187" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Evidencia actual» y «Dirección y contexto» … «Revisión»</title><desc id="d">Diagrama de flujo con 6 pasos. «Evidencia actual» lleva a «Brechas». «Dirección y contexto» lleva a «Brechas». «Brechas» lleva a «Experimentos». «Experimentos» lleva a «Portafolio y feedback». «Portafolio y feedback» lleva a «Revisión». «Revisión» lleva a «Brechas».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="849" height="187" fill="#ffffff"/><path d="M190,44 L204.0,44.0 Q213,44 213.0,53.0 L213.0,80.2 Q213,89.2 222.0,89.2 L236,89.2" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M168,134.5 L193.0,134.5 Q202,134.5 202.0,125.5 L202.0,98.2 Q202,89.2 211.0,89.2 L236,89.2" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M325,89.2 L371,89.2" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M504,89.2 L550,89.2" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M683,89.2 L729,89.2" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M778,67.2 L778.0,53.7 Q778,44.7 769.0,44.7 L289.5,44.7 Q280.5,44.7 280.5,53.7 L280.5,67.2" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="22" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="48.2" font-size="15" text-anchor="middle"