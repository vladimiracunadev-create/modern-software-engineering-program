<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 434 782" width="434" height="782" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Diseño declara mecanismos» … «Siguiente falla o más intensidad» y «Corrección y repetición como regresión»</title><desc id="d">Diagrama de flujo con 8 pasos. «Diseño declara mecanismos» lleva a «Hipótesis: el sistema resiste la falla X». «Hipótesis: el sistema resiste la falla X» lleva a «Inyección controlada de X». «Inyección controlada de X» lleva a «¿Se mantiene el estado estable?». «¿Se mantiene el estado estable?» lleva a «Confianza acotada a esa falla y ese tráfico» (sí). «¿Se mantiene el estado estable?» lleva a «Debilidad encontrada antes del incidente» (no). «Debilidad encontrada antes del incidente» lleva a «Corrección y repetición como regresión». «Confianza acotada a esa falla y ese tráfico» lleva a «Siguiente falla o más intensidad». «Corrección y repetición como regresión» lleva a «Hipótesis: el sistema resiste la falla X».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="434" height="782" fill="#ffffff"/><path d="M212.4,83 L212.4,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M212.5,221 L212.5,279" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M212.7,340 L212.7,398" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M212.8,484 L212.8,492.0 Q212.8,500 204.8,500.0 L119.0,500.0 Q110,500 110.0,509.0 L110,542" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M212.8,484 L212.8,492.0 Q212.8,500 220.8,500.0 L307.0,500.0 Q316,500 316.0,509.0 L316,542" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M316,622 L316,680" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M110,622 L110,689.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M395.5,720 L402.5,720.0 Q409.5,720 409.5,713.0 L409.5,190.0 Q409.5,181 400.5,181.0 L304.9,181" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="137.4" y="22" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="212.4" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="212.4" dy="0">Diseño declara</tspan><tspan x="212.4" dy="19.2">mecanismos</tspan></text><rect x="119.9" y="141" width="185" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="212.4" y="166" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="212.4" dy="0">Hipótesis: el</tspan><tspan x="212.4" dy="19.2">sistema resiste la</tspan><tspan x="212.4" dy="19.2">falla X</tspan></text><rect x="133.1" y="279" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="212.6" y="304.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="212.6" dy="0">Inyección</tspan><tspan x="212.6" dy="19.2">controlada de X</tspan></text><polygon points="212.8,398 340.3,441 212.8,484 85.3,441" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="212.8" y="435.6" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="212.8" dy="0">¿Se mantiene el</tspan><tspan x="212.8" dy="19.2">estado estable?</tspan></text><rect x="22" y="542" width="176" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="110" y="567" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">Confianza acotada</tspan><tspan x="110" dy="19.2">a esa falla y ese</tspan><tspan x="110" dy="19.2">tráfico</tspan></text><rect x="232" y="542" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="316" y="567" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="316" dy="0">Debilidad</tspan><tspan x="316" dy="19.2">encontrada antes</tspan><tspan x="316" dy="19.2">del incidente</tspan></text><rect x="236.5" y="680" width="159" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="316" y="705" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="316" dy="0">Corrección y</tspan><tspan x="316" dy="19.2">repetición como</tspan><tspan x="316" dy="19.2">regresión</tspan></text><rect x="22" y="689.5" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="110" y="714.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">Siguiente falla o</tspan><tspan x="110" dy="19.2">más intensidad</tspan></text><rect x="116" y="509" width="29" height="24" rx="4" fill="#ffffff"/><text x="130.5" y="524.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="130.5" dy="0">sí</tspan></text><rect x="322" y="509" width="29" height="24" rx="4" fill="#ffffff"/><text x="336.5" y="524.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="336.5" dy="0">no</tspan></text></svg>
