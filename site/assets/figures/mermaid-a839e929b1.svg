<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 912 241" width="912" height="241" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Rama corta», «Indicador de funcionalidad» y «Rama larga» … «Rama de versión»</title><desc id="d">Diagrama de flujo con 9 pasos. «Rama corta» lleva a «Integración frecuente». «Integración frecuente» lleva a «Tronco comprobado». «Rama larga» lleva a «Integración rara». «Integración rara» lleva a «Conflictos y sorpresas». «Tronco comprobado» lleva a «Etiqueta de versión». «Etiqueta de versión» lleva a «Rama de versión» (corrección). «Indicador de funcionalidad» lleva a «Integración frecuente».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="912" height="241" fill="#ffffff"/><path d="M150.5,44 L171.2,44.0 Q180.2,44 180.2,53.0 L180.2,69.0 Q180.2,78 189.2,78.0 L210,78" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M334,78 L389,78" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M150.5,197 L171.2,197.0 Q180.2,197 180.2,188.0 L180.2,172.0 Q180.2,163 189.2,163.0 L210,163" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M334,163 L380,163" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M504,78 L559,78" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M683,78 L801,78" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M164,120.5 L178.0,120.5 Q187,120.5 187.0,111.5 L187.0,87.0 Q187,78 196.0,78.0 L210,78" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="35.5" y="22" width="115" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="93" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="93" dy="0">Rama corta</tspan></text><rect x="210" y="47.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="272" y="72.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="272" dy="0">Integración</tspan><tspan x="272" dy="19.2">frecuente</tspan></text><rect x="389" y="47.5" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="446.5" y="72.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="446.5" dy="0">Tronco</tspan><tspan x="446.5" dy="19.2">comprobado</tspan></text><rect x="35.5" y="175" width="115" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="93" y="201.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="93" dy="0">Rama larga</tspan></text><rect x="210" y="132.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="272" y="157.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="272" dy="0">Integración</tspan><tspan x="272" dy="19.2">rara</tspan></text><rect x="380" y="132.5" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="446.5" y="157.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="446.5" dy="0">Conflictos y</tspan><tspan x="446.5" dy="19.2">sorpresas</tspan></text><rect x="559" y="47.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="621" y="72.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="621" dy="0">Etiqueta de</tspan><tspan x="621" dy="19.2">versión</tspan></text><rect x="801" y="47.5" width="89" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="845.5" y="72.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="845.5" dy="0">Rama de</tspan><tspan x="845.5" dy="19.2">versión</tspan></text><rect x="22" y="90" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="93" y="115.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="93" dy="0">Indicador de</tspan><tspan x="93" dy="19.2">funcionalidad</tspan></text><rect x="695" y="50" width="94" height="24" rx="4" fill="#ffffff"/><text x="742" y="65.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">corrección</tspan></text></svg>
