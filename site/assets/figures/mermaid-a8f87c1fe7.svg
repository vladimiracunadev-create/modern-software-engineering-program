<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 839 166" width="839" height="166" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Interfaz de secuencia» … «Slicing, vistas / copias»</title><desc id="d">Diagrama de flujo con 5 pasos. «Interfaz de secuencia» lleva a «Arreglo contiguo / localidad». «Arreglo contiguo / localidad» lleva a «Lista dinámica / capacidad». «Lista dinámica / capacidad» lleva a «Estructuras enlazadas». «Estructuras enlazadas» lleva a «Slicing, vistas / copias». «Slicing, vistas / copias» lleva a «Interfaz de secuencia» (fallo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="839" height="166" fill="#ffffff"/><path d="M146,104 L192,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M307,104 L353,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M503,104 L549,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M673,104 L719,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M768,64 L768.0,57.0 Q768,50 761.0,50.0 L93.0,50.0 Q84,50 84.0,59.0 L84,73.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="73.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="84" y="98.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="84" dy="0">Interfaz de</tspan><tspan x="84" dy="19.2">secuencia</tspan></text><rect x="192" y="64" width="115" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="249.5" y="89" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="249.5" dy="0">Arreglo</tspan><tspan x="249.5" dy="19.2">contiguo /</tspan><tspan x="249.5" dy="19.2">localidad</tspan></text><rect x="353" y="73.5" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="428" y="98.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="428" dy="0">Lista dinámica</tspan><tspan x="428" dy="19.2">/ capacidad</tspan></text><rect x="549" y="73.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="611" y="98.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="611" dy="0">Estructuras</tspan><tspan x="611" dy="19.2">enlazadas</tspan></text><rect x="719" y="64" width="98" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="768" y="89" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="768" dy="0">Slicing,</tspan><tspan x="768" dy="19.2">vistas /</tspan><tspan x="768" dy="19.2">copias</tspan></text><rect x="363" y="22" width="126" height="24" rx="4" fill="#ffffff"/><text x="426" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="426" dy="0">fallo o cambio</tspan></text></svg>
