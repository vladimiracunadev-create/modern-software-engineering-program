<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 491 704" width="491" height="704" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Productor» … «Efecto exactamente una vez»</title><desc id="d">Diagrama de flujo con 8 pasos. «Productor» lleva a «Corredor» (envía). «Corredor» lleva a «Consumidor» (entrega). «Consumidor» lleva a «Corredor» (acuse). «Corredor» lleva a «Qué hacer» (pérdida o acuse perdido). «Qué hacer» lleva a «A lo sumo una vez: se pierde» (no reintentar). «Qué hacer» lleva a «Al menos una vez: se duplica» (reintentar). «Al menos una vez: se duplica» lleva a «Consumidor idempotente + versión». «Consumidor idempotente + versión» lleva a «Efecto exactamente una vez».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="491" height="704" fill="#ffffff"/><path d="M155.1,66 L155.1,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M155.1,168 L155.1,176.0 Q155.1,184 147.1,184.0 L104.5,184.0 Q95.5,184 95.5,193.0 L95.5,253" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M155.1,168 L155.1,176.0 Q155.1,184 163.1,184.0 L242.5,184.0 Q251.5,184 251.5,193.0 L251.5,244" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M251.5,306 L251.5,314.0 Q251.5,322 243.5,322.0 L162.8,322.0 Q153.8,322 153.8,331.0 L153.8,364" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M251.5,306 L251.5,314.0 Q251.5,322 259.5,322.0 L359.3,322.0 Q368.3,322 368.3,331.0 L368.3,364" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M368.3,425 L368.3,445.0 Q368.3,454 359.3,454.0 L339.5,454.0 Q330.5,454 330.5,463.0 L330.5,483" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M330.5,563 L330.5,583.0 Q330.5,592 321.5,592.0 L313.5,592.0 Q304.5,592 304.5,601.0 L304.5,621" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M38,275 L31.0,275.0 Q24,275 24.0,268.0 L24.0,155.0 Q24,146 33.0,146.0 L106.1,146" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="101.6" y="22" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="155.1" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="155.1" dy="0">Productor</tspan></text><rect x="106.1" y="124" width="98" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="155.1" y="150.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="155.1" dy="0">Corredor</tspan></text><rect x="38" y="253" width="115" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="95.5" y="279.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="95.5" dy="0">Consumidor</tspan></text><polygon points="251.5,244 316,275 251.5,306 187,275" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="251.5" y="279.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="251.5" dy="0">Qué hacer</tspan></text><rect x="61.3" y="364" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="153.8" y="389.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="153.8" dy="0">A lo sumo una vez:</tspan><tspan x="153.8" dy="19.2">se pierde</tspan></text><rect x="280.3" y="364" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="368.3" y="389.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="368.3" dy="0">Al menos una vez:</tspan><tspan x="368.3" dy="19.2">se duplica</tspan></text><rect x="259.5" y="483" width="142" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="330.5" y="508" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="330.5" dy="0">Consumidor</tspan><tspan x="330.5" dy="19.2">idempotente +</tspan><tspan x="330.5" dy="19.2">versión</tspan></text><rect x="212" y="621" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="304.5" y="646.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="304.5" dy="0">Efecto exactamente</tspan><tspan x="304.5" dy="19.2">una vez</tspan></text><rect x="161.1" y="83" width="53" height="24" rx="4" fill="#ffffff"/><text x="187.6" y="98.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="187.6" dy="0">envía</tspan></text><rect x="101.5" y="206.5" width="69" height="24" rx="4" fill="#ffffff"/><text x="136" y="222.4" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="136" dy="0">entrega</tspan></text><rect x="30" y="198.5" width="53" height="24" rx="4" fill="#ffffff"/><text x="56.5" y="214.4" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="56.5" dy="0">acuse</tspan></text><rect x="257.5" y="193" width="118" height="42" rx="4" fill="#ffffff"/><text x="316.5" y="208.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="316.5" dy="0">pérdida o</tspan><tspan x="316.5" dy="17.92">acuse perdido</tspan></text><rect x="159.8" y="331" width="118" height="24" rx="4" fill="#ffffff"/><text x="218.8" y="346.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="218.8" dy="0">no reintentar</tspan></text><rect x="374.3" y="331" width="94" height="24" rx="4" fill="#ffffff"/><text x="421.3" y="346.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="421.3" dy="0">reintentar</tspan></text></svg>
