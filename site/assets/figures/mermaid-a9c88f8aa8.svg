<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 166" width="822" height="166" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Debugger, adapter / runtime» … «Heisenbug / costo de pausa»</title><desc id="d">Diagrama de flujo con 5 pasos. «Debugger, adapter / runtime» lleva a «Breakpoint / condición». «Breakpoint / condición» lleva a «Stack frame / alcance». «Stack frame / alcance» lleva a «Step, continue / watch». «Step, continue / watch» lleva a «Heisenbug / costo de pausa». «Heisenbug / costo de pausa» lleva a «Debugger, adapter / runtime» (fallo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="822" height="166" fill="#ffffff"/><path d="M129,104 L175,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M299,104 L345,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M469,104 L515,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M630,104 L676,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M738,64 L738.0,57.0 Q738,50 731.0,50.0 L82.5,50.0 Q75.5,50 75.5,57.0 L75.5,64" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="64" width="107" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="75.5" y="89" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="75.5" dy="0">Debugger,</tspan><tspan x="75.5" dy="19.2">adapter /</tspan><tspan x="75.5" dy="19.2">runtime</tspan></text><rect x="175" y="73.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="237" y="98.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="237" dy="0">Breakpoint</tspan><tspan x="237" dy="19.2">/ condición</tspan></text><rect x="345" y="73.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="407" y="98.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="407" dy="0">Stack frame</tspan><tspan x="407" dy="19.2">/ alcance</tspan></text><rect x="515" y="64" width="115" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="572.5" y="89" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="572.5" dy="0">Step,</tspan><tspan x="572.5" dy="19.2">continue /</tspan><tspan x="572.5" dy="19.2">watch</tspan></text><rect x="676" y="64" width="124" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="738" y="89" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="738" dy="0">Heisenbug /</tspan><tspan x="738" dy="19.2">costo de</tspan><tspan x="738" dy="19.2">pausa</tspan></text><rect x="343.8" y="22" width="126" height="24" rx="4" fill="#ffffff"/><text x="406.8" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="406.8" dy="0">fallo o cambio</tspan></text></svg>
