<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 519 1425" width="519" height="1425" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Release recibido: artefacto, SBOM, procedencia, manifiesto, firma» … «Procede de la fuente revisada» y «Rechazar y registrar cuál»</title><desc id="d">Diagrama de flujo con 12 pasos. «Release recibido: artefacto, SBOM, procedencia, manifiesto, firma» lleva a «1. Firma del manifiesto con clave fijada». «1. Firma del manifiesto con clave fijada» lleva a «2. Nombre y secuencia del manifiesto». «2. Nombre y secuencia del manifiesto» lleva a «3. Huellas de artefacto, SBOM y procedencia». «3. Huellas de artefacto, SBOM y procedencia» lleva a «4. Procedencia: sujeto, constructor, repositorio». «4. Procedencia: sujeto, constructor, repositorio» lleva a «5. Coherencia: bloqueo, SBOM y artefacto». «5. Coherencia: bloqueo, SBOM y artefacto» lleva a «¿Alguna comprobación falla?». «¿Alguna comprobación falla?» lleva a «Rechazar y registrar cuál» (sí). «¿Alguna comprobación falla?» lleva a «Verificado: coherente» (no). «Verificado: coherente» lleva a «6. Reconstrucción independiente desde la fuente revisada». «6. Reconstrucción independiente desde la fuente revisada» lleva a «Procede de la fuente revisada» (coincide). «6. Reconstrucción independiente desde la fuente revisada» lleva a «Rechazar y registrar cuál» (difiere). «Verificado: coherente» lleva a «No verificable: fuente benigna, constructor honesto».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="519" height="1425" fill="#ffffff"/><path d="M408.3,121 L408.3,179" fill="none