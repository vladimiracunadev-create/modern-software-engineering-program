<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 848 263" width="848" height="263" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Detenido» … «Drenando» y «Espera de reinicio»</title><desc id="d">Diagrama de flujo con 5 pasos. «Detenido» lleva a «Arrancando» (arrancar). «Arrancando» lleva a «Preparado» (sonda de preparación ok). «Preparado» lleva a «Drenando» (petición de parada). «Drenando» lleva a «Detenido» (termina o vence el plazo). «Arrancando» lleva a «Espera de reinicio» (falla). «Preparado» lleva a «Espera de reinicio» (falla). «Espera de reinicio» lleva a «Arrancando» (espera creciente).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="848" height="263" fill="#ffffff"/><path d="M120,153.5 L221,153.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M336,153.5 L486,153.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M593,153.5 L601.0,153.5 Q609,153.5 609.0,145.5 L609.0,113.0 Q609,104 618.0,104.0 L723.5,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M278.5,175.5 L278.5,230.0 Q278.5,239 287.5,239.0 L765.5,239.0 Q772.5,239 772.5,232.0 L772.5,225" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M593,153.5 L601.0,153.5 Q609,153.5 609.0,161.5 L609.0,185.5 Q609,194.5 618.0,194.5 L719,194.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M772.5,82 L772.5,75.0 Q772.5,68 765.5,68.0 L80.0,68.0 Q71,68 71.0,77.0 L71,131.5" fill="none" stroke="#c0432f" stroke-width="1.8" 