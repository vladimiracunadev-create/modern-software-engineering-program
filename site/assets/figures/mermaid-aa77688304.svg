<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 493 985" width="493" height="985" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Cambio deseado» … «Observar el uso»</title><desc id="d">Diagrama de flujo con 9 pasos. «Cambio deseado» lleva a «Verificador de firma». «Verificador de firma» lleva a «Versión mayor o fase de ampliación» (rompe). «Verificador de firma» lleva a «Contratos de consumidores» (compatible). «Contratos de consumidores» lleva a «Versión mayor o fase de ampliación» (falla un contrato). «Contratos de consumidores» lleva a «Cambio con aviso» (pasan). «Versión mayor o fase de ampliación» lleva a «Ampliar: conviven la versión vieja y la nueva». «Ampliar: conviven la versión vieja y la nueva» lleva a «Migrar consumidores con plazo». «Migrar consumidores con plazo» lleva a «Contraer: retirar la versión vieja». «Cambio con aviso» lleva a «Observar el uso». «Contraer: retirar la versión vieja» lleva a «Observar el uso». «Observar el uso» lleva a «Migrar consumidores con plazo» (un consumidor no migró).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="493" height="985" fill="#ffffff"/><path d="M307.5,66 L307.5,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M188,167 L78.6,167.0 Q69.6,167 69.6,176.0 L69.6,428.5 Q69.6,435.5 76.6,435.5 L83.6,435.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M307.5,210 L307.5,218.7 Q307.5,226 300.1,226.0 L300.1,226.0 Q292.8,226 292.8,233.3 L292.8,268" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M292.8,329 L292.8,337.0 Q292.8,345 284.8,345.0 L185.1,345.0 Q176.1,345 176.1,354.0 L176.1,405" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M292.8,329 L292.8,337.0 Q292.8,345 300.8,345.0 L377.6,345.0 Q386.6,345 386.6,354.0 L386.6,413.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M176.1,466 L176.1,486.0 Q176.1,495 185.1,495.0 L203.5,495.0 Q212.5,495 212.5,504.0 L212.5,524" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M212.5,604 L212.5,624.0 Q212.5,633 221.5,633.0 L235.0,633.0 Q244,633 244.0,642.0 L244,662" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M244,742 L244.0,762.0 Q244,771 253.0,771.0 L256.2,771.0 Q265.2,771 265.2,780.0 L265.2,800" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M386.6,457.5 L386.6,932.0 Q386.6,941 377.6,941.0 L355.3,941" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M265.2,861 L265.2,884.7 Q265.2,890 270.5,890.0 L270.5,890.0 Q275.8,890 275.8,895.3 L275.8,919" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M196.3,941 L155.0,941.0 Q146,941 146.0,932.0 L146.0,709.0 Q146,702 153.0,702.0 L160,702" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="232.5" y="22" width="150" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="307.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="307.5" dy="0">Cambio deseado</tspan></text><polygon points="307.5,124 427,167 307.5,210 188,167" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="307.5" y="161.6" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="307.5" dy="0">Verificador de</tspan><tspan x="307.5" dy="19.2">firma</tspan></text><rect x="83.6" y="405" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="176.1" y="430.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="176.1" dy="0">Versión mayor o</tspan><tspan x="176.1" dy="19.2">fase de ampliación</tspan></text><rect x="226.3" y="268" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="292.8" y="293.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="292.8" dy="0">Contratos de</tspan><tspan x="292.8" dy="19.2">consumidores</tspan></text><rect x="302.6" y="413.5" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="386.6" y="439.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="386.6" dy="0">Cambio con aviso</tspan></text><rect x="120" y="524" width="185" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="212.5" y="549" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="212.5" dy="0">Ampliar: conviven</tspan><tspan x="212.5" dy="19.2">la versión vieja y</tspan><tspan x="212.5" dy="19.2">la nueva</tspan></text><rect x="160" y="662" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="244" y="687" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="244" dy="0">Migrar</tspan><tspan x="244" dy="19.2">consumidores con</tspan><tspan x="244" dy="19.2">plazo</tspan></text><rect x="177.2" y="800" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="265.2" y="825.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="265.2" dy="0">Contraer: retirar</tspan><tspan x="265.2" dy="19.2">la versión vieja</tspan></text><rect x="196.3" y="919" width="159" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="275.8" y="945.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="275.8" dy="0">Observar el uso</tspan></text><rect x="75.6" y="289.2" width="53" height="24" rx="4" fill="#ffffff"/><text x="102.1" y="305.1" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="102.1" dy="0">rompe</tspan></text><rect x="298.8" y="235" width="94" height="24" rx="4" fill="#ffffff"/><text x="345.8" y="250.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="345.8" dy="0">compatible</tspan></text><rect x="182.1" y="354" width="77" height="42" rx="4" fill="#ffffff"/><text x="220.6" y="369.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="220.6" dy="0">falla un</tspan><tspan x="220.6" dy="17.92">contrato</tspan></text><rect x="392.6" y="367.2" width="53" height="24" rx="4" fill="#ffffff"/><text x="419.1" y="383.1" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="419.1" dy="0">pasan</tspan></text><rect x="22" y="800.5" width="118" height="42" rx="4" fill="#ffffff"/><text x="81" y="816.4" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="81" dy="0">un consumidor</tspan><tspan x="81" dy="17.92">no migró</tspan></text></svg>
