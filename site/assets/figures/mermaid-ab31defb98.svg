<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 166" width="756" height="166" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Biblioteca» … «SDK»</title><desc id="d">Diagrama de flujo con 5 pasos. «Biblioteca» lleva a «Framework e inversión de control». «Framework e inversión de control» lleva a «Runtime». «Runtime» lleva a «Plataforma». «Plataforma» lleva a «SDK». «SDK» lleva a «Biblioteca» (fallo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="756" height="166" fill="#ffffff"/><path d="M137,104 L183,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M316,104 L362,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M451,104 L497,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M612,104 L658,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M696,82 L696.0,59.0 Q696,50 687.0,50.0 L88.5,50.0 Q79.5,50 79.5,59.0 L79.5,82" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="82" width="115" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="79.5" y="108.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="79.5" dy="0">Biblioteca</tspan></text><rect x="183" y="64" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="249.5" y="89" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="249.5" dy="0">Framework e</tspan><tspan x="249.5" dy="19.2">inversión de</tspan><tspan x="249.5" dy="19.2">control</tspan></text><rect x="362" y="82" width="89" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="406.5" y="108.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="406.5" dy="0">Runtime</tspan></text><rect x="497" y="82" width="115" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="554.5" y="108.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="554.5" dy="0">Plataforma</tspan></text><rect x="658" y="82" width="76" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="696" y="108.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="696" dy="0">SDK</tspan></text><rect x="324.8" y="22" width="126" height="24" rx="4" fill="#ffffff"/><text x="387.8" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="387.8" dy="0">fallo o cambio</tspan></text></svg>
