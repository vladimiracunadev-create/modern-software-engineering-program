<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 536 585" width="536" height="585" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Peligro» … «Análisis y prueba»</title><desc id="d">Diagrama de flujo con 7 pasos. «Peligro» lleva a «Safety o seguridad». «Safety o seguridad» lleva a «Redundancia, vigilancia, estado seguro» (falla accidental). «Safety o seguridad» lleva a «Identidad, actualización, mínimo privilegio» (ataque). «Redundancia, vigilancia, estado seguro» lleva a «Causa común y cobertura». «Identidad, actualización, mínimo privilegio» lleva a «Vida útil y soporte». «Causa común y cobertura» lleva a «Análisis y prueba». «Vida útil y soporte» lleva a «Análisis y prueba». «Análisis y prueba» lleva a «Peligro» (hallazgo).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="536" height="585" fill="#ffffff"/><path d="M221.7,66 L221.7,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M221.7,186 L221.7,194.0 Q221.7,202 213.7,202.0 L123.5,202.0 Q114.5,202 114.5,211.0 L114.5,262" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M221.7,186 L221.7,194.0 Q221.7,202 229.7,202.0 L320.0,202.0 Q329,202 329.0,211.0 L329,262" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M114.5,342 L114.5,362.0 Q114.5,371 123.5,371.0 L129.2,371.0 Q138.2,371 138.2,380.0 L138.2,400" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M329,342 L329.0,362.0 Q329,371 320.0,371.0 L314.2,371.0 Q305.2,371 305.2,380.0 L305.2,400" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M138.2,461 L138.2,481.0 Q138.2,490 147.2,490.0 L212.7,490.0 Q221.7,490 221.7,499.0 L221.7,519" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M305.2,461 L305.2,481.0 Q305.2,490 296.2,490.0 L230.7,490.0 Q221.7,490 221.7,499.0 L221.7,519" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M309.7,541 L422.0,541.0 Q431,541 431.0,532.0 L431.0,53.0 Q431,44 422.0,44.0 L266.2,44" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="177.2" y="22" width="89" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="221.7" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="221.7" dy="0">Peligro</tspan></text><polygon points="221.7,124 342.7,155 221.7,186 100.7,155" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="221.7" y="159.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="221.7" dy="0">Safety o seguridad</tspan></text><rect x="22" y="262" width="185" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="114.5" y="287" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="114.5" dy="0">Redundancia,</tspan><tspan x="114.5" dy="19.2">vigilancia, estado</tspan><tspan x="114.5" dy="19.2">seguro</tspan></text><rect x="241" y="262" width="176" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="329" y="287" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="329" dy="0">Identidad,</tspan><tspan x="329" dy="19.2">actualización,</tspan><tspan x="329" dy="19.2">mínimo privilegio</tspan></text><rect x="67.2" y="400" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="138.2" y="425.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="138.2" dy="0">Causa común y</tspan><tspan x="138.2" dy="19.2">cobertura</tspan></text><rect x="243.2" y="400" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="305.2" y="425.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="305.2" dy="0">Vida útil y</tspan><tspan x="305.2" dy="19.2">soporte</tspan></text><rect x="133.7" y="519" width="176" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="221.7" y="545.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="221.7" dy="0">Análisis y prueba</tspan></text><rect x="120.5" y="211" width="94" height="42" rx="4" fill="#ffffff"/><text x="167.5" y="226.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="167.5" dy="0">falla</tspan><tspan x="167.5" dy="17.92">accidental</tspan></text><rect x="335" y="220" width="61" height="24" rx="4" fill="#ffffff"/><text x="365.5" y="235.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="365.5" dy="0">ataque</tspan></text><rect x="437" y="280.5" width="77" height="24" rx="4" fill="#ffffff"/><text x="475.5" y="296.4" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475.5" dy="0">hallazgo</tspan></text></svg>
