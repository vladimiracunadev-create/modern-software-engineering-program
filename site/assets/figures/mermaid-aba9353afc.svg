<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 765 713" width="765" height="713" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Datos de la zona intermedia» … «Consultas sin abanico»</title><desc id="d">Diagrama de flujo con 9 pasos. «Datos de la zona intermedia» lleva a «¿Qué debe responder el modelo?». «¿Qué debe responder el modelo?» lleva a «Estrella: hecho + dimensiones» (preguntas de negocio claras). «¿Qué debe responder el modelo?» lleva a «Vault: hub, enlace, satélite» (integrar varias fuentes con trazabilidad). «Estrella: hecho + dimensiones» lleva a «Granularidad declarada». «Estrella: hecho + dimensiones» lleva a «Dimensión con historia: filas con vigencia». «Vault: hub, enlace, satélite» lleva a «Solo insertar: carga repetible». «Vault: hub, enlace, satélite» lleva a «Vista de negocio encima». «Granularidad declarada» lleva a «Consultas sin abanico». «Dimensión con historia: filas con vigencia» lleva a «Consultas sin abanico».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="765" height="713" fill="#ffffff"/><path d="M385.8,83 L385.8,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M385.8,261 L385.8,269.0 Q385.8,277 377.8,277.0 L260.1,277.0 Q251.1,277 251.1,286.0 L251.1,373" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M385.8,261 L385.8,269.0 Q385.8,277 393.8,277.0 L496.6,277.0 Q505.6,277 505.6,286.0 L505.6,373" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M251.1,434 L251.1,458.8 Q251.1,467.8 242.1,467.8 L97.5,467.8 Q88.