<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 888 624" width="888" height="624" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Dependencias y contribuciones» … «Decisión registrada»</title><desc id="d">Diagrama de flujo con 12 pasos. «Dependencias y contribuciones» lleva a «Inventario con licencia y origen». «Inventario con licencia y origen» lleva a «Política de distribución». «Política de distribución» lleva a «Registrar y avisar» (permitida). «Política de distribución» lleva a «Consulta legal» (revisar). «Política de distribución» lleva a «Reemplazar o resolver» (bloqueada o desconocida). «Inventario con licencia y origen» lleva a «Certificación de origen en cada contribución». «Dependencias y contribuciones» lleva a «Requisitos y contratos». «Requisitos y contratos» lleva a «Daño a personas usuarias». «Daño a personas usuarias» lleva a «Alternativa y escalamiento» (sí). «Daño a personas usuarias» lleva a «Adelante» (no). «Consulta legal» lleva a «Decisión registrada». «Reemplazar o resolver» lleva a «Decisión registrada». «Alternativa y escalamiento» lleva a «Decisión registrada».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="888" height="624" fill="#ffffff"/><path d="M538.8,83 L538.8,103.0 Q538.8,112 529.8,112.0 L444.6,112.0 Q435.6,112 435.6,121.0 L435.6,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M435.6,202 L435.6,222.0 Q435.6,231 426.6,231.0 L277.0,231.0 Q268,231 268.0,240.0 L268,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M268,346 L268.0,354.0 Q26