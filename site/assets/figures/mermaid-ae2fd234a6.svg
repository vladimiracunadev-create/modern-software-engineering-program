<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 817 322" width="817" height="322" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Especificación» … «Regenerar y comparar»</title><desc id="d">Diagrama de flujo con 8 pasos. «Especificación» lleva a «Spec-first: guía y se descarta». «Especificación» lleva a «Spec-anchored: se mantiene con el código». «Especificación» lleva a «Spec-as-source: genera el código». «Spec-anchored: se mantiene con el código» lleva a «Comprobación de deriva». «Spec-as-source: genera el código» lleva a «Generador determinista». «Spec-as-source: genera el código» lleva a «Región generada y región manual». «Comprobación de deriva» lleva a «Especificación» (discrepa). «Generador determinista» lleva a «Regenerar y comparar».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="817" height="322" fill="#ffffff"/><path d="M172,161 L186.0,161.0 Q195,161 195.0,152.0 L195.0,61.5 Q195,52.5 204.0,52.5 L218,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M172,161 L222.5,161" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M172,161 L190.2,161.0 Q199.2,161 199.2,170.0 L199.2,260.5 Q199.2,269.5 208.2,269.5 L226.5,269.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M398.5,161 L419.0,161.0 Q428,161 428.0,152.0 L428.0,61.5 Q428,52.5 437.0,52.5 L457.5,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M394.5,269.5 L423.5,269.5 Q432.5,269.5 432.5,260.5 L432.5,170.0 Q432.5,161 441.5,161.0 L470.5,161" 