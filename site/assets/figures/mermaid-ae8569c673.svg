<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 173" width="822" height="173" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Trabajo útil» … «Decisión»</title><desc id="d">Diagrama de flujo con 7 pasos. «Trabajo útil» lleva a «Tiempo». «Trabajo útil» lleva a «Recursos». «Tiempo» lleva a «Latencia y throughput». «Recursos» lleva a «Energía». «Energía» lleva a «Emisiones bajo frontera». «Latencia y throughput» lleva a «Decisión». «Emisiones bajo frontera» lleva a «Decisión».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="822" height="173" fill="#ffffff"/><path d="M155,86.5 L173.2,86.5 Q182.2,86.5 182.2,77.5 L182.2,61.5 Q182.2,52.5 191.2,52.5 L209.5,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M155,86.5 L169.0,86.5 Q178,86.5 178.0,95.5 L178.0,120.0 Q178,129 187.0,129.0 L201,129" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M290.5,52.5 L345,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M299,129 L358,129" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M447,124.8 L506,124.8" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M460,52.5 L742.0,52.5 Q751,52.5 751.0,61.5 L751,98.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M656,120.5 L702,120.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="64.5" width="133" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"