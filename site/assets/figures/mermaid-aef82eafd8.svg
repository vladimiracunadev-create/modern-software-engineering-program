<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 855 310" width="855" height="310" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Modelo único del sistema» … «Vista lógica»</title><desc id="d">Diagrama de flujo con 8 pasos. «Modelo único del sistema» lleva a «Vista lógica». «Modelo único del sistema» lleva a «Vista de ejecución». «Modelo único del sistema» lleva a «Vista de datos». «Modelo único del sistema» lleva a «Vista de despliegue». «Vista de ejecución» lleva a «Trazas observadas». «Trazas observadas» lleva a «Vista lógica» (aristas no declaradas). «Vista de despliegue» lleva a «Recorridos y radio de explosión». «Vista de ejecución» lleva a «Latencia de la ruta crítica».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="855" height="310" fill="#ffffff"/><path d="M106,132.5 L106.0,33.0 Q106,24 115.0,24.0 L757.5,24.0 Q766.5,24 766.5,33.0 L766.5,46.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M190,163 L214.8,163.0 Q223.8,163 223.8,154.0 L223.8,77.5 Q223.8,68.5 232.8,68.5 L257.5,68.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M190,163 L208.2,163.0 Q213,163 213.0,158.2 L213.0,158.2 Q213,153.5 217.8,153.5 L236,153.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M190,163 L212.8,163.0 Q221.8,163 221.8,172.0 L221.8,239.0 Q221.8,248 230.8,248.0 L253.5,248" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M364.5,68.5 L449.5,68.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/