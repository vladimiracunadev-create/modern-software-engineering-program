<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 701 466" width="701" height="466" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Condición de fallo del sistema» … «Eliminar o justificar»</title><desc id="d">Diagrama de flujo con 8 pasos. «Condición de fallo del sistema» lleva a «Gravedad». «Gravedad» lleva a «Nivel de rigor del software». «Nivel de rigor del software» lleva a «Requisitos de alto y bajo nivel». «Requisitos de alto y bajo nivel» lleva a «Pruebas basadas en requisitos». «Pruebas basadas en requisitos» lleva a «Cobertura estructural». «Cobertura estructural» lleva a «Código sin ejecutar». «Código sin ejecutar» lleva a «Pruebas basadas en requisitos» (falta prueba). «Código sin ejecutar» lleva a «Requisitos de alto y bajo nivel» (falta requisito). «Código sin ejecutar» lleva a «Eliminar o justificar» (muerto o no previsto).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="701" height="466" fill="#ffffff"/><path d="M176.5,62 L354.5,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M452.5,62 L529,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M604,92.5 L604,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M533,200 L483,200" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M324,200 L172,200" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M110,230.5 L110,298" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M198,341 L346,341" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M198,341 L205.0,341.0 Q212,341 212.0,334.0 L212.0,253.5 Q212,244.5 221.0,244.5 L396.5,244.5 Q403.5,244.5 403.5,237.5 L403.5,230.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><path d="M110,384 L110.0,391.0 Q110,398 117.0,398.0 L595.0,398.0 Q604,398 604.0,389.0 L604,240" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="43.5" y="22" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="110" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">Condición de</tspan><tspan x="110" dy="19.2">fallo del</tspan><tspan x="110" dy="19.2">sistema</tspan></text><rect x="354.5" y="40" width="98" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="403.5" y="66.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="403.5" dy="0">Gravedad</tspan></text><rect x="529" y="31.5" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="604" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="604" dy="0">Nivel de rigor</tspan><tspan x="604" dy="19.2">del software</tspan></text><rect x="533" y="160" width="142" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="604" y="185" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="604" dy="0">Requisitos de</tspan><tspan x="604" dy="19.2">alto y bajo</tspan><tspan x="604" dy="19.2">nivel</tspan></text><rect x="324" y="169.5" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="403.5" y="194.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="403.5" dy="0">Pruebas basadas</tspan><tspan x="403.5" dy="19.2">en requisitos</tspan></text><rect x="48" y="169.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="110" y="194.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">Cobertura</tspan><tspan x="110" dy="19.2">estructural</tspan></text><polygon points="110,298 198,341 110,384 22,341" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="110" y="335.6" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="110" dy="0">Código sin</tspan><tspan x="110" dy="19.2">ejecutar</tspan></text><rect x="346" y="310.5" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="403.5" y="335.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="403.5" dy="0">Eliminar o</tspan><tspan x="403.5" dy="19.2">justificar</tspan></text><rect x="252.8" y="248.5" width="110" height="24" rx="4" fill="#ffffff"/><text x="307.8" y="264.4" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="307.8" dy="0">falta prueba</tspan></text><rect x="314" y="402" width="86" height="42" rx="4" fill="#ffffff"/><text x="357" y="417.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="357" dy="0">falta</tspan><tspan x="357" dy="17.92">requisito</tspan></text><rect x="221" y="295" width="102" height="42" rx="4" fill="#ffffff"/><text x="272" y="310.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="272" dy="0">muerto o no</tspan><tspan x="272" dy="17.92">previsto</tspan></text></svg>
