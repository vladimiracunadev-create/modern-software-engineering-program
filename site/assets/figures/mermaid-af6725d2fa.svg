<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 934 88" width="934" height="88" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «🎯 Pregunta» … «📈 Acción»</title><desc id="d">Diagrama de flujo con 5 pasos. «🎯 Pregunta» lleva a «🧠 Instrumentación». «🧠 Instrumentación» lleva a «🛠️ Correlación». «🛠️ Correlación» lleva a «🔎 Diagnóstico». «🔎 Diagnóstico» lleva a «📈 Acción».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="934" height="88" fill="#ffffff"/><path d="M144,44 L190,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M373,44 L419,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M567,44 L613,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M761,44 L807,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="22" width="122" height="44" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="83" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="83" dy="0">🎯 Pregunta</tspan></text><rect x="190" y="22" width="183" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="281.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="281.5" dy="0">🧠 Instrumentación</tspan></text><rect x="419" y="22" width="148" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="493" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="493" dy="0">🛠️ Correlación</tspan></text><rect x="613" y="22" width="148" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="687" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="687" dy="0">🔎 Diagnóstico</tspan></text><rect x="807" y="22" width="105" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="859.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="859.5" dy="0">📈 Acción</tspan></text></svg>
