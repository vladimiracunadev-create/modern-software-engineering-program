<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 429 566" width="429" height="566" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Aplicación: kit de diagnóstico multiplataforma» y «Versión, arquitectura y política» … «Controladores y recursos»</title><desc id="d">Diagrama de flujo con 6 pasos. «Aplicación: kit de diagnóstico multiplataforma» lleva a «Runtime y bibliotecas». «Runtime y bibliotecas» lleva a «API del sistema». «API del sistema» lleva a «Kernel». «Kernel» lleva a «Controladores y recursos». «Versión, arquitectura y política» lleva a «Runtime y bibliotecas». «Versión, arquitectura y política» lleva a «API del sistema».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="429" height="566" fill="#ffffff"/><path d="M114.5,102 L114.5,122.0 Q114.5,131 123.5,131.0 L206.3,131.0 Q215.3,131 215.3,140.0 L215.3,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M215,221 L215,279" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M214.4,323 L214.4,381" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M214,425 L214,483" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M316,102 L316.0,122.0 Q316,131 307.0,131.0 L224.3,131.0 Q215.3,131 215.3,140.0 L215.3,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M391,62 L398.0,62.0 Q405,62 405.0,69.0 L405.0,292.0 Q405,301 396.0,301.0 L294.2,301" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="22" width="185" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="114.5" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="114.5" dy="0">Aplicación: kit de</tspan><tspan x="114.5" dy="19.2">diagnóstico</tspan><tspan x="114.5" dy="19.2">multiplataforma</tspan></text><rect x="153.3" y="160" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="215.3" y="185.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="215.3" dy="0">Runtime y</tspan><tspan x="215.3" dy="19.2">bibliotecas</tspan></text><rect x="135.2" y="279" width="159" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="214.7" y="305.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="214.7" dy="0">API del sistema</tspan></text><rect x="173.7" y="381" width="81" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="214.2" y="407.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="214.2" dy="0">Kernel</tspan></text><rect x="134.4" y="483" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="213.9" y="508.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="213.9" dy="0">Controladores y</tspan><tspan x="213.9" dy="19.2">recursos</tspan></text><rect x="241" y="22" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="316" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="316" dy="0">Versión,</tspan><tspan x="316" dy="19.2">arquitectura y</tspan><tspan x="316" dy="19.2">política</tspan></text></svg>
