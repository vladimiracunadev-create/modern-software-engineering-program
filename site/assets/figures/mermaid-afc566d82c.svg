<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 624 721" width="624" height="721" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Pruebas de contrato» … «Informe JSON o humano»</title><desc id="d">Diagrama de flujo con 8 pasos. «Contrato CLI» lleva a «Núcleo del kit de diagnóstico multiplataforma». «Núcleo del kit de diagnóstico multiplataforma» lleva a «Configuración y redacción». «Núcleo del kit de diagnóstico multiplataforma» lleva a «Adaptador Windows/PowerShell». «Núcleo del kit de diagnóstico multiplataforma» lleva a «Adaptador Linux-macOS/Bash». «Adaptador Windows/PowerShell» lleva a «Modelo común + detalles de plataforma». «Adaptador Linux-macOS/Bash» lleva a «Modelo común + detalles de plataforma». «Modelo común + detalles de plataforma» lleva a «Informe JSON o humano». «Pruebas de contrato» lleva a «Contrato CLI». «Pruebas de contrato» lleva a «Adaptador Windows/PowerShell». «Pruebas de contrato» lleva a «Adaptador Linux-macOS/Bash».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="624" height="721" fill="#ffffff"/><path d="M262.6,185 L262.6,205.0 Q262.6,214 271.6,214.0 L284.2,214.0 Q293.2,214 293.2,223.0 L293.2,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M293.2,323 L293.2,343.0 Q293.2,352 284.2,352.0 L110.5,352.0 Q101.5,352 101.5,361.0 L101.5,381" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M293.2,323 L293.2,344.9 Q293.2,352 300.4,352.0 L300.4,352.0 Q307.5,352 307.5,359.1 L307.5,381" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"