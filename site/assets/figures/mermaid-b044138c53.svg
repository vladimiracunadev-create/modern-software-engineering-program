<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 554 574" width="554" height="574" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Solicitud» … «Origen»</title><desc id="d">Diagrama de flujo con 8 pasos. «Solicitud» lleva a «Limitador por identidad». «Limitador por identidad» lleva a «429 + Retry-After» (excede). «Limitador por identidad» lleva a «Caché». «Caché» lleva a «Respuesta» (acierto fresco). «Caché» lleva a «Una carga en vuelo» (fallo). «Una carga en vuelo» lleva a «Origen». «Origen» lleva a «Caché». «Caché» lleva a «Revalidación» (acierto obsoleto).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="554" height="574" fill="#ffffff"/><path d="M177.8,66 L177.8,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M177.8,210 L177.8,218.0 Q177.8,226 169.8,226.0 L123.0,226.0 Q114,226 114.0,235.0 L114,277" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M177.8,210 L177.8,230.0 Q177.8,239 186.8,239.0 L266.0,239.0 Q275,239 275.0,248.0 L275,268" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M275,330 L275.0,338.0 Q275,346 267.0,346.0 L84.5,346.0 Q75.5,346 75.5,355.0 L75.5,406" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M275,330 L275.0,338.0 Q275,346 267.0,346.0 L264.5,346.0 Q255.5,346 255.5,355.0 L255.5,406" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M252.5,450 L252.5,508" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M275,330 L275.0,338.0 Q275,346 283.0,346.0 L439.5,346.0 Q448.5,346 448.5,355.0 L448.5,406" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M290,530 L353.0,530.0 Q362,530 362.0,521.0 L362.0,308.0 Q362,299 353.0,299.0 L314,299" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="124.3" y="22" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="177.8" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="177.8" dy="0">Solicitud</tspan></text><polygon points="177.8,124 289.3,167 177.8,210 66.3,167" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="177.8" y="161.6" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="177.8" dy="0">Limitador por</tspan><tspan x="177.8" dy="19.2">identidad</tspan></text><rect x="26" y="277" width="176" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="114" y="303.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="114" dy="0">429 + Retry-After</tspan></text><polygon points="275,268 314,299 275,330 236,299" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="275" y="303.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="275" dy="0">Caché</tspan></text><rect x="22" y="406" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="75.5" y="432.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="75.5" dy="0">Respuesta</tspan></text><rect x="163" y="406" width="185" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="255.5" y="432.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="255.5" dy="0">Una carga en vuelo</tspan></text><rect x="209" y="508" width="81" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="249.5" y="534.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="249.5" dy="0">Origen</tspan></text><rect x="382" y="406" width="133" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="448.5" y="432.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="448.5" dy="0">Revalidación</tspan></text><rect x="47" y="239.5" width="61" height="24" rx="4" fill="#ffffff"/><text x="77.5" y="255.4" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="77.5" dy="0">excede</tspan></text><rect x="81.5" y="364" width="126" height="24" rx="4" fill="#ffffff"/><text x="144.5" y="379.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="144.5" dy="0">acierto fresco</tspan></text><rect x="261.5" y="364" width="53" height="24" rx="4" fill="#ffffff"/><text x="288" y="379.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="288" dy="0">fallo</tspan></text><rect x="454.5" y="355" width="77" height="42" rx="4" fill="#ffffff"/><text x="493" y="370.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="493" dy="0">acierto</tspan><tspan x="493" dy="17.92">obsoleto</tspan></text></svg>
