<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 854 400" width="854" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Criterios para usar un catálogo» … «Proyecto: catálogo del sistema»</title><desc id="d">Diagrama de flujo con 12 pasos. «Criterios para usar un catálogo» lleva a «GoF creacionales». «GoF creacionales» lleva a «GoF estructurales». «GoF estructurales» lleva a «GoF conductuales». «GoF conductuales» lleva a «GRASP». «GRASP» lleva a «Repository, Unit of Work, Active Record». «Repository, Unit of Work, Active Record» lleva a «Integración empresarial». «Integración empresarial» lleva a «Resiliencia I: timeout, retry, breaker». «Resiliencia I: timeout, retry, breaker» lleva a «Resiliencia II: bulkhead, sidecar, degradación». «Resiliencia II: bulkhead, sidecar, degradación» lleva a «Antipatrones y deuda». «Antipatrones y deuda» lleva a «Taller: refactorizar y medir». «Taller: refactorizar y medir» lleva a «Proyecto: catálogo del sistema». «Proyecto: catálogo del sistema» lleva a «Criterios para usar un catálogo» (costos que no se justificaron).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="854" height="400" fill="#ffffff"/><path d="M190,52.5 L236,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M404,52.5 L463,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M605,52.5 L664,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M748,74.5 L748,159" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M710,181 L618,181" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M450,181 L382,181" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M258,181 L185.5,181" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M106,221 L106,279" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M185.5,328.5 L245,328.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M395,328.5 L459,328.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M609,328.5 L681.5,328.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M748,288.5 L748.0,244.0 Q748,235 739.0,235.0 L208.5,235.0 Q199.5,235 199.5,226.0 L199.5,106.0 Q199.5,97 190.5,97.0 L113.0,97.0 Q106,97 106.0,90.0 L106,83" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="22" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Criterios para</tspan><tspan x="106" dy="19.2">usar un catálogo</tspan></text><rect x="236" y="30.5" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="320" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="320" dy="0">GoF creacionales</tspan></text><rect x="463" y="22" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="534" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="534" dy="0">GoF</tspan><tspan x="534" dy="19.2">estructurales</tspan></text><rect x="664" y="30.5" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="748" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="748" dy="0">GoF conductuales</tspan></text><rect x="710" y="159" width="76" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="748" y="185.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="748" dy="0">GRASP</tspan></text><rect x="450" y="141" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="534" y="166" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="534" dy="0">Repository, Unit</tspan><tspan x="534" dy="19.2">of Work, Active</tspan><tspan x="534" dy="19.2">Record</tspan></text><rect x="258" y="150.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="320" y="175.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="320" dy="0">Integración</tspan><tspan x="320" dy="19.2">empresarial</tspan></text><rect x="26.5" y="141" width="159" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="166" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Resiliencia I:</tspan><tspan x="106" dy="19.2">timeout, retry,</tspan><tspan x="106" dy="19.2">breaker</tspan></text><rect x="26.5" y="279" width="159" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="303.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Resiliencia II:</tspan><tspan x="106" dy="19.2">bulkhead,</tspan><tspan x="106" dy="19.2">sidecar,</tspan><tspan x="106" dy="19.2">degradación</tspan></text><rect x="245" y="298" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="320" y="323.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="320" dy="0">Antipatrones y</tspan><tspan x="320" dy="19.2">deuda</tspan></text><rect x="459" y="288.5" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="534" y="313.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="534" dy="0">Taller:</tspan><tspan x="534" dy="19.2">refactorizar y</tspan><tspan x="534" dy="19.2">medir</tspan></text><rect x="681.5" y="288.5" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="748" y="313.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="748" dy="0">Proyecto:</tspan><tspan x="748" dy="19.2">catálogo del</tspan><tspan x="748" dy="19.2">sistema</tspan></text><rect x="205.5" y="80.8" width="118" height="60" rx="4" fill="#ffffff"/><text x="264.5" y="96.7" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="264.5" dy="0">costos que no</tspan><tspan x="264.5" dy="17.92">se</tspan><tspan x="264.5" dy="17.92">justificaron</tspan></text></svg>
