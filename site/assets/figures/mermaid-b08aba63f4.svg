<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 674 824" width="674" height="824" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Sistema que duele» … «Medir ese parámetro»</title><desc id="d">Diagrama de flujo con 11 pasos. «Sistema que duele» lleva a «Tres opciones». «Tres opciones» lleva a «No hacer nada». «Tres opciones» lleva a «Evolucionar: invertir en estructura». «Tres opciones» lleva a «Reescribir». «Reescribir» lleva a «Mantener el legado durante la construcción». «Reescribir» lleva a «Alcance que se mueve». «Reescribir» lleva a «Probabilidad de abandono». «No hacer nada» lleva a «Costo acumulado». «Evolucionar: invertir en estructura» lleva a «Costo acumulado». «Mantener el legado durante la construcción» lleva a «Costo acumulado». «Alcance que se mueve» lleva a «Costo acumulado». «Probabilidad de abandono» lleva a «Costo acumulado». «Costo acumulado» lleva a «Sensibilidad: qué parámetro domina». «Sensibilidad: qué parámetro domina» lleva a «Medir ese parámetro». «Medir ese parámetro» lleva a «Tres opciones».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="674" height="824" fill="#ffffff"/><path d="M247.9,66 L247.9,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M247.9,186 L247.9,215.0 Q247.9,224 238.9,224.0 L102.0,224.0 Q93,224 93.0,233.0 L93,262" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M247.9,186 L247.9,206.7 Q247.9,215 256.2,215.0 L256.2,215.0 Q264.5,215 264.5,223.3 L264.5,244" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/>