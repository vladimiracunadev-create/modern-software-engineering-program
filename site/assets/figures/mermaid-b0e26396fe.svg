troke="#087f8c" stroke-width="1.6"/><text x="293" y="169.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="293" dy="0">Documentación</tspan><tspan x="293" dy="19.2">generada</tspan><tspan x="293" dy="19.2">desde el</tspan><tspan x="293" dy="19.2">código</tspan></text><rect x="239.5" y="278.5" width="107" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="293" y="303.4" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="293" dy="0">Migración</tspan><tspan x="293" dy="19.2">generada</tspan><tspan x="293" dy="19.2">desde el</tspan><tspan x="293" dy="19.2">esquema</tspan></text><rect x="22" y="278.5" width="150" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="97" y="304.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="97" dy="0">Especificación</tspan></text><rect x="218" y="412" width="150" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="293" y="436.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="293" dy="0">Pruebas</tspan><tspan x="293" dy="19.2">derivadas</tspan><tspan x="293" dy="19.2">de la</tspan><tspan x="293" dy="19.2">especificación</tspan></text><rect x="569.5" y="41" width="89" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="614" y="66.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="614" dy="0">Pasa</tspan><tspan x="614" dy="19.2">siempre</tspan></text><polygon points="614,418.5 702,461.5 614,504.5 526,461.5" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="614" y="456.1" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="614" dy="0">Mutantes</tspan><tspan x="614" dy="19.2">detectados</tspan></text><polygon points="614,151.5 710,194.5 614,237.5 518,194.5" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="614" y="189.1" font-s