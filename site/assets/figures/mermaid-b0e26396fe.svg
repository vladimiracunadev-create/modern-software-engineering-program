<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 909 533" width="909" height="533" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Código» y «Especificación» … «Se vigila sola», «Envejece en silencio», «Cuarentena de lo inválido» y «Valores plausibles falsos»</title><desc id="d">Diagrama de flujo con 14 pasos. «Código» lleva a «Pruebas generadas desde el código». «Código» lleva a «Documentación generada desde el código». «Código» lleva a «Migración generada desde el esquema». «Especificación» lleva a «Pruebas derivadas de la especificación». «Pruebas generadas desde el código» lleva a «Pasa siempre» (copia el comportamiento). «Pruebas derivadas de la especificación» lleva a «Mutantes detectados». «Documentación generada desde el código» lleva a «Ejemplos ejecutables». «Ejemplos ejecutables» lleva a «Se vigila sola» (sí). «Ejemplos ejecutables» lleva a «Envejece en silencio» (no). «Migración generada desde el esquema» lleva a «Validación de contenido». «Validación de contenido» lleva a «Cuarentena de lo inválido» (sí). «Validación de contenido» lleva a «Valores plausibles falsos» (no).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="909" height="533" fill="#ffffff"/><path d="M137.5,232.5 L179.5,232.5 Q188.5,232.5 188.5,223.5 L188.5,80.5 Q188.5,71.5 197.5,71.5 L239.5,71.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M137.5,232.5 L170.8,232.5 Q179.8,232.5 179.8,223.5 L179.8,203.5 Q179.8,194.5 188.8,194.5 L222,194.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M137.5,232.5 L