<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 451 804" width="451" height="804" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Valor que obtiene el cliente» … «Revisión con datos»</title><desc id="d">Diagrama de flujo con 9 pasos. «Valor que obtiene el cliente» lleva a «Métrica de valor». «Métrica de valor» lleva a «Modelo de precio: fijo, puesto, uso, tramos». «Modelo de precio: fijo, puesto, uso, tramos» lleva a «Planes con límites y funciones». «Planes con límites y funciones» lleva a «Segmentos que eligen cada plan». «Segmentos que eligen cada plan» lleva a «Ingreso y costo por segmento». «Ingreso y costo por segmento» lleva a «Revisión con datos». «Revisión con datos» lleva a «Métrica de valor». «Planes con límites y funciones» lleva a «Motor de derechos». «Motor de derechos» lleva a «Límite que corta o cobra el exceso».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="451" height="804" fill="#ffffff"/><path d="M232.1,83 L232.1,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M232.2,185 L232.2,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M232.6,323 L232.6,381" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M232.8,442 L232.8,462.0 Q232.8,471 223.8,471.0 L139.0,471.0 Q130,471 130.0,480.0 L130,500" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M130.1,561 L130.1,619" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M130.3,680 L130.3,738" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M232.8,442 L232.8,466.2 Q232.8,475.2 241.8,475.2 L327.0,475.2 Q336,475.2 336.0,484.2 L336,508.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M336.1,552.5 L336.1,619" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M38,760 L31.0,760.0 Q24,760 24.0,753.0 L24.0,172.0 Q24,163 33.0,163.0 L148.1,163" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="144.1" y="22" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="232.1" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="232.1" dy="0">Valor que obtiene</tspan><tspan x="232.1" dy="19.2">el cliente</tspan></text><rect x="148.1" y="141" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="232.1" y="167.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="232.1" dy="0">Métrica de valor</tspan></text><rect x="139.9" y="243" width="185" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="232.4" y="268" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="232.4" dy="0">Modelo de precio:</tspan><tspan x="232.4" dy="19.2">fijo, puesto, uso,</tspan><tspan x="232.4" dy="19.2">tramos</tspan></text><rect x="140.3" y="381" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="232.8" y="406.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="232.8" dy="0">Planes con límites</tspan><tspan x="232.8" dy="19.2">y funciones</tspan></text><rect x="46" y="500" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="130" y="525.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="130" dy="0">Segmentos que</tspan><tspan x="130" dy="19.2">eligen cada plan</tspan></text><rect x="50.7" y="619" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="130.2" y="644.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="130.2" dy="0">Ingreso y costo</tspan><tspan x="130.2" dy="19.2">por segmento</tspan></text><rect x="38" y="738" width="185" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="130.5" y="764.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="130.5" dy="0">Revisión con datos</tspan></text><rect x="248" y="508.5" width="176" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="336" y="534.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="336" dy="0">Motor de derechos</tspan></text><rect x="243.7" y="619" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="336.2" y="644.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="336.2" dy="0">Límite que corta o</tspan><tspan x="336.2" dy="19.2">cobra el exceso</tspan></text></svg>
