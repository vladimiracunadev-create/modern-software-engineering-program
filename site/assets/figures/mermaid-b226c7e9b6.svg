<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 378 619" width="378" height="619" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Contrato común del kit de diagnóstico multiplataforma» … «Pruebas compartidas»</title><desc id="d">Diagrama de flujo con 7 pasos. «Contrato común del kit de diagnóstico multiplataforma» lleva a «Adaptador PowerShell». «Contrato común del kit de diagnóstico multiplataforma» lleva a «Adaptador Bash». «Adaptador PowerShell» lleva a «Capacidades Windows o PowerShell». «Adaptador Bash» lleva a «Capacidades POSIX o Unix». «Capacidades Windows o PowerShell» lleva a «Resultado común + detalle». «Capacidades POSIX o Unix» lleva a «Resultado común + detalle». «Resultado común + detalle» lleva a «Pruebas compartidas».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="378" height="619" fill="#ffffff"/><path d="M176,102 L176.0,122.0 Q176,131 167.0,131.0 L101.8,131.0 Q92.8,131 92.8,140.0 L92.8,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M176,102 L176.0,126.2 Q176,135.2 185.0,135.2 L250.3,135.2 Q259.3,135.2 259.3,144.2 L259.3,168.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M88.4,221 L88.4,279" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M263.7,212.5 L263.7,288.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M84,359 L84.0,379.0 Q84,388 93.0,388.0 L167.0,388.0 Q176,388 176.0,397.0 L176,417" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M268,349.5 L268.0,374.2 Q268,383.2 259.0,383.2 L185.0,383.2 Q176,383.2 176.0,392.2 L176,417" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M176,478 L176,536" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="83.5" y="22" width="185" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="176" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="176" dy="0">Contrato común del</tspan><tspan x="176" dy="19.2">kit de diagnóstico</tspan><tspan x="176" dy="19.2">multiplataforma</tspan></text><rect x="35.3" y="160" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="92.8" y="185.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="92.8" dy="0">Adaptador</tspan><tspan x="92.8" dy="19.2">PowerShell</tspan></text><rect x="184.3" y="168.5" width="150" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="259.3" y="194.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="259.3" dy="0">Adaptador Bash</tspan></text><rect x="22" y="279" width="124" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="84" y="304" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="84" dy="0">Capacidades</tspan><tspan x="84" dy="19.2">Windows o</tspan><tspan x="84" dy="19.2">PowerShell</tspan></text><rect x="180" y="288.5" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="268" y="313.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="268" dy="0">Capacidades POSIX</tspan><tspan x="268" dy="19.2">o Unix</tspan></text><rect x="88" y="417" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="176" y="442.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="176" dy="