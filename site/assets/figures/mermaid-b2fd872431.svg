<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 531 276" width="531" height="276" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Decision de arquitectura» … «Correccion o revision del umbral»</title><desc id="d">Diagrama de flujo con 6 pasos. «Decision de arquitectura» lleva a «Propiedad medible». «Propiedad medible» lleva a «Funcion de aptitud». «Funcion de aptitud» lleva a «Umbral y estadistica». «Umbral y estadistica» lleva a «Ejecucion continua». «Ejecucion continua» lleva a «Correccion o revision del umbral» (falla). «Ejecucion continua» lleva a «Umbral y estadistica» (falsa alarma). «Correccion o revision del umbral» lleva a «Decision de arquitectura».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="531" height="276" fill="#ffffff"/><path d="M155,52.5 L232,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M339,52.5 L389.5,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M447,83 L447,150.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M385,181 L339,181" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M232,181 L155,181" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M285.5,211.5 L285.5,218.5 Q285.5,225.5 292.5,225.5 L440.0,225.5 Q447,225.5 447.0,218.5 L447,211.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><path d="M88.5,141 L88.5,83" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="22" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="88.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="88.5" dy="0">Decision de</tspan><tspan x="88.5" dy="19.2">arquitectura</tspan></text><rect x="232" y="22" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="285.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="285.5" dy="0">Propiedad</tspan><tspan x="285.5" dy="19.2">medible</tspan></text><rect x="389.5" y="22" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="447" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="447" dy="0">Funcion de</tspan><tspan x="447" dy="19.2">aptitud</tspan></text><rect x="385" y="150.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="447" y="175.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="447" dy="0">Umbral y</tspan><tspan x="447" dy="19.2">estadistica</tspan></text><rect x="232" y="150.5" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="285.5" y="175.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="285.5" dy="0">Ejecucion</tspan><tspan x="285.5" dy="19.2">continua</tspan></text><rect x="22" y="141" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="88.5" y="166" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="88.5" dy="0">Correccion o</tspan><tspan x="88.5" dy="19.2">revision del</tspan><tspan x="88.5" dy="19.2">umbral</tspan></text><rect x="167" y="153" width="53" height="24" rx="4" fill="#ffffff"/><text x="193.5" y="168.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="193.5" dy="0">falla</tspan></text><rect x="311.2" y="229.5" width="110" height="24" rx="4" fill="#ffffff"/><text x="366.2" y="245.4" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="366.2" dy="0">falsa alarma</tspan></text></svg>
