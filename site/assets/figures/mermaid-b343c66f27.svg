<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 147" width="822" height="147" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «API pública» … «Deprecación / migración»</title><desc id="d">Diagrama de flujo con 5 pasos. «API pública» lleva a «Compatibilidad hacia atrás». «Compatibilidad hacia atrás» lleva a «SemVer». «SemVer» lleva a «Prerelease / metadata». «Prerelease / metadata» lleva a «Deprecación / migración». «Deprecación / migración» lleva a «API pública» (fallo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="822" height="147" fill="#ffffff"/><path d="M146,94.5 L192,94.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M342,94.5 L388,94.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M469,94.5 L515,94.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M630,94.5 L676,94.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M738,64 L738.0,57.0 Q738,50 731.0,50.0 L93.0,50.0 Q84,50 84.0,59.0 L84,72.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="72.5" width="124" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="84" y="98.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="84" dy="0">API pública</tspan></text><rect x="192" y="64" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="267" y="89.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="267" dy="0">Compatibilidad</tspan><tspan x="267" dy="19.2">hacia atrás</tspan></text><rect x="388" y="72.5" width="81" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="428.5" y="98.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="428.5" dy="0">SemVer</tspan></text><rect x="515" y="64" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="572.5" y="89.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="572.5" dy="0">Prerelease</tspan><tspan x="572.5" dy="19.2">/ metadata</tspan></text><rect x="676" y="64" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="738" y="89.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="738" dy="0">Deprecación</tspan><tspan x="738" dy="19.2">/ migración</tspan></text><rect x="348" y="22" width="126" height="24" rx="4" fill="#ffffff"/><text x="411" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="411" dy="0">fallo o cambio</tspan></text></svg>
