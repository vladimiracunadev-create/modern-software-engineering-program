<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 514 1237" width="514" height="1237" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Experimento propuesto» … «Evidencia con huella y límites declarados»</title><desc id="d">Diagrama de flujo con 9 pasos. «Experimento propuesto» lleva a «¿Hipótesis falsable y escrita?». «¿Hipótesis falsable y escrita?» lleva a «¿Radio mínimo que detecta el efecto?» (sí). «¿Radio mínimo que detecta el efecto?» lleva a «¿Aborto y reversión probados?» (sí). «¿Aborto y reversión probados?» lleva a «¿El presupuesto cubre el costo máximo?» (sí). «¿El presupuesto cubre el costo máximo?» lleva a «¿Responsable disponible y partes informadas?» (sí). «¿Responsable disponible y partes informadas?» lleva a «Ejecutar con privilegio mínimo y registro» (sí). «¿Hipótesis falsable y escrita?» lleva a «Corregir o posponer» (no). «¿Radio mínimo que detecta el efecto?» lleva a «Corregir o posponer» (no). «¿Aborto y reversión probados?» lleva a «Corregir o posponer» (no). «¿El presupuesto cubre el costo máximo?» lleva a «Corregir o posponer» (no). «¿Responsable disponible y partes informadas?» lleva a «Corregir o posponer» (no). «Ejecutar con privilegio mínimo y registro» lleva a «Evidencia con huella y límites declarados».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="514" height="1237" fill="#ffffff"/><path d="M266.3,83 L266.3,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M263.5,261 L263.5,319" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M260.6,405 L260.6