<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 541 727" width="541" height="727" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Entrada» … «Clasificación: reintentable o no» y «Contrato: esquema cerrado»</title><desc id="d">Diagrama de flujo con 8 pasos. «Entrada» lleva a «Análisis sintáctico». «Análisis sintáctico» lleva a «Validación estricta: tipos, rangos, campos». «Validación estricta: tipos, rangos, campos» lleva a «Error con forma única» (falla). «Validación estricta: tipos, rangos, campos» lleva a «Dominio: reglas de negocio» (pasa). «Dominio: reglas de negocio» lleva a «Error con forma única» (falla). «Dominio: reglas de negocio» lleva a «Respuesta». «Respuesta» lleva a «Contrato: esquema cerrado». «Error con forma única» lleva a «Clasificación: reintentable o no».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="541" height="727" fill="#ffffff"/><path d="M244.3,66 L244.3,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M244.1,185 L244.1,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M159.9,283 L75.0,283.0 Q66,283 66.0,292.0 L66.0,523.5 Q66,530.5 73.0,530.5 L80,530.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M243.6,323 L243.6,381" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M243.3,442 L243.3,450.0 Q243.3,458 235.3,458.0 L168.5,458.0 Q159.5,458 159.5,467.0 L159.5,500" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M243.3,442 L243.3,466.2 Q243.3,475.2 252.3,475.2 L317.5,475.2 Q326.5,475.2 326.5,484.2 L326.5,508.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M326.5,552.5 L326.5,576.8 Q326.5,585.8 335.5,585.8 L366.5,585.8 Q375.5,585.8 375.5,594.8 L375.5,619" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M159.5,561 L159.5,587.2 Q159.5,596.2 150.5,596.2 L119.0,596.2 Q110,596.2 110.0,605.2 L110,631.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="199.8" y="22" width="89" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="244.3" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="244.3" dy="0">Entrada</tspan></text><rect x="186.8" y="124" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="244.3" y="149.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="244.3" dy="0">Análisis</tspan><tspan x="244.3" dy="19.2">sintáctico</tspan></text><rect x="159.9" y="243" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="243.9" y="268" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="243.9" dy="0">Validación</tspan><tspan x="243.9" dy="19.2">estricta: tipos,</tspan><tspan x="243.9" dy="19.2">rangos, campos</tspan></text><rect x="80" y="500" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="159.5" y="525.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="159.5" dy="0">Error con forma</tspan><tspan x="159.5" dy="19.2">única</tspan></text><rect x="150.8" y="381" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="243.3" y="406.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="243.3" dy="0">Dominio: reglas de</tspan><tspan x="243.3" dy="19.2">negocio</tspan></text><rect x="273" y="508.5" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="326.5" y="534.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="326.5" dy="0">Respuesta</tspan></text><polygon points="375.5,619 519,662 375.5,705 232,662" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="375.5" y="656.6" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="375.5" dy="0">Contrato: esquema</tspan><tspan x="375.5" dy="19.2">cerrado</tspan></text><rect x="22" y="631.5" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="110" y="656.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">Clasificación:</tspan><tspan x="110" dy="19.2">reintentable o no</tspan></text><rect x="72" y="394.8" width="53" height="24" rx="4" fill="#ffffff"/><text x="98.5" y="410.7" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="98.5" dy="0">falla</tspan></text><rect x="249.6" y="340" width="45" height="24" rx="4" fill="#ffffff"/><text x="272.1" y="355.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="272.1" dy="0">pasa</tspan></text><rect x="165.5" y="467" width="53" height="24" rx="4" fill="#ffffff"/><text x="192" y="482.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="192" dy="0">falla</tspan></text></svg>
