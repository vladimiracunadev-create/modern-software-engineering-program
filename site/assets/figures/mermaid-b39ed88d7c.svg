<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 561 698" width="561" height="698" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Infraestructura real» … «Estado actualizado»</title><desc id="d">Diagrama de flujo con 7 pasos. «Código declarado» lleva a «Plan: diferencia». «Estado guardado» lleva a «Plan: diferencia». «Infraestructura real» lleva a «Estado guardado» (refresco). «Plan: diferencia» lleva a «¿Revisado por una persona?». «¿Revisado por una persona?» lleva a «Apply: crear, cambiar, borrar» (sí). «Apply: crear, cambiar, borrar» lleva a «Estado actualizado». «Apply: crear, cambiar, borrar» lleva a «Infraestructura real». «Infraestructura real» lleva a «Infraestructura real» (cambio manual: deriva).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="561" height="698" fill="#ffffff"/><path d="M111.1,209 L111.1,229.0 Q111.1,238 120.1,238.0 L175.5,238.0 Q184.5,238 184.5,247.0 L184.5,267" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M308.6,209 L308.6,229.0 Q308.6,238 299.6,238.0 L193.5,238.0 Q184.5,238 184.5,247.0 L184.5,267" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M308.6,107 L308.6,165" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M184.5,311 L184.5,331.0 Q184.5,340 175.5,340.0 L174.5,340.0 Q165.5,340 165.5,349.0 L165.5,369" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M165.5,455 L165.5,464.4 Q165.5,471 158.9,471.0 L158.9,471.0 Q152.3,471 152.3,477.6 L152.3,513" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M149.2,574 L149.2,632" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M231.8,543.5 L393.1,543.5 Q402.1,543.5 402.1,534.5 L402.1,83.5 Q402.1,76.5 395.1,76.5 L388.1,76.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><path d="M374.1,46 L374.1,33.0 Q374.1,24 383.1,24.0 L397.1,24.0 Q406.1,24 406.1,33.0 L406.1,67.5 Q406.1,76.5 397.1,76.5 L388.1,76.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="27.1" y="165" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="111.1" y="191.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="111.1" dy="0">Código declarado</tspan></text><rect x="100.5" y="267" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="184.5" y="293.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="184.5" dy="0">Plan: diferencia</tspan></text><rect x="229.1" y="165" width="159" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="308.6" y="191.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="308.6" dy="0">Estado guardado</tspan></text><rect x="229.1" y="46" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="308.6" y="71.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="308.6" dy="0">Infraestructura</tspan><tspan x="308.6" dy="19.2">real</tspan></text><polygon points="165.5,369 309,412 165.5,455 22,412" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="165.5" y="406.6" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="165.5" dy="0">¿Revisado por una</tspan><tspan x="165.5" dy="19.2">persona?</tspan></text><rect x="72.8"