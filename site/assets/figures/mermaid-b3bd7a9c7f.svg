<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 728 190" width="728" height="190" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Necesidad» … «Evidencia»</title><desc id="d">Diagrama de flujo con 5 pasos. «Necesidad» lleva a «Requisito». «Requisito» lleva a «Criterio». «Criterio» lleva a «Prueba». «Prueba» lleva a «Evidencia». «Evidencia» lleva a «Requisito» (enlace roto o prueba ausente). «Requisito» lleva a «Prueba» (cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="728" height="190" fill="#ffffff"/><path d="M129,86 L175,86" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M282,86 L328,86" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M426,86 L472,86" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M553,86 L599,86" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M228.5,64 L228.5,57.0 Q228.5,50 235.5,50.0 L505.5,50.0 Q512.5,50 512.5,57.0 L512.5,64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M652.5,108 L652.5,115.0 Q652.5,122 645.5,122.0 L235.5,122.0 Q228.5,122 228.5,115.0 L228.5,108" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="64" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="75.5" y="90.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="75.5" dy="0">Necesidad</tspan></text><rect x="175" y="64" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="228.5" y="90.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="228.5" dy="0">Requisito</tspan></text><rect x="328" y="64" width="98" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="377" y="90.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="377" dy="0">Criterio</tspan></text><rect x="472" y="64" width="81" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="512.5" y="90.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="512.5" dy="0">Prueba</tspan></text><rect x="599" y="64" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="652.5" y="90.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="652.5" dy="0">Evidencia</tspan></text><rect x="377.5" y="126" width="126" height="42" rx="4" fill="#ffffff"/><text x="440.5" y="141.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="440.5" dy="0">enlace roto o</tspan><tspan x="440.5" dy="17.92">prueba ausente</tspan></text><rect x="340" y="22" width="61" height="24" rx="4" fill="#ffffff"/><text x="370.5" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="370.5" dy="0">cambio</tspan></text></svg>
