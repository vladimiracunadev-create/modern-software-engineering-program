<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 510 632" width="510" height="632" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Documento HTML» … «Persona usuaria»</title><desc id="d">Diagrama de flujo con 8 pasos. «Documento HTML» lleva a «Árbol DOM». «Árbol DOM» lleva a «Árbol de accesibilidad». «Árbol DOM» lleva a «Cascada CSS». «Cascada CSS» lleva a «Estilo calculado». «Árbol de accesibilidad» lleva a «Tecnologías de apoyo». «Estilo calculado» lleva a «Pantalla». «Tecnologías de apoyo» lleva a «Persona usuaria». «Pantalla» lleva a «Persona usuaria». «Persona usuaria» lleva a «Documento HTML» (barrera encontrada).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="510" height="632" fill="#ffffff"/><path d="M192,66 L192,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M192,168 L192.0,188.0 Q192,197 183.0,197.0 L117.8,197.0 Q108.8,197 108.8,206.0 L108.8,226" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M192,168 L192.0,192.2 Q192,201.2 201.0,201.2 L266.8,201.2 Q275.8,201.2 275.8,210.2 L275.8,234.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M275.8,278.5 L275.8,308.9 Q275.8,316 282.9,316.0 L282.9,316.0 Q290,316 290.0,323.1 L290,353.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M108.8,287 L108.8,310.1 Q108.8,316 102.9,316.0 L102.9,316.0 Q97,316 97.0,321.9 L97,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M287.1,397.5 L287.1,464" fill="none" stroke="#3250