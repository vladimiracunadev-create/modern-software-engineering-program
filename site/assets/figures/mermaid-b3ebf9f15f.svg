<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 849 452" width="849" height="452" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Dolor observable» … «Dejar el diseño simple»</title><desc id="d">Diagrama de flujo con 9 pasos. «Dolor observable» lleva a «Fuerza nombrada». «Fuerza nombrada» lleva a «¿Existe la variación hoy?». «¿Existe la variación hoy?» lleva a «Dejar el diseño simple» (no). «¿Existe la variación hoy?» lleva a «Candidato: patrón del catálogo» (sí). «Candidato: patrón del catálogo» lleva a «Medir costo: nodos, indirección, aprendizaje». «Medir costo: nodos, indirección, aprendizaje» lleva a «¿El costo es menor que el dolor?». «¿El costo es menor que el dolor?» lleva a «Dejar el diseño simple» (no). «¿El costo es menor que el dolor?» lleva a «Aplicar con condición de salida» (sí). «Aplicar con condición de salida» lleva a «Revisar con evidencia». «Revisar con evidencia» lleva a «Dejar el diseño simple» (la fuerza desapareció).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="849" height="452" fill="#ffffff"/><path d="M215.5,65 L287,65" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M446,65 L572,65" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M811,65 L818.0,65.0 Q825,65 825.0,72.0 L825.0,375.0 Q825,384 816.0,384.0 L771,384" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M691.5,108 L691.5,186" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M634,226 L433,226" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M300,226 L241,226" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M241,226 L248.0,226.0 Q255,226 255.0,233.0 L255.0,330.5 Q255,339.5 264.0,339.5 L684.5,339.5 Q691.5,339.5 691.5,346.5 L691.5,353.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M131.5,286 L131.5,344" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M198,384 L304.5,384" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M428.5,384 L612,384" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="47.5" y="43" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="131.5" y="69.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="131.5" dy="0">Dolor observable</tspan></text><rect x="287" y="43" width="159" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="366.5" y="69.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="366.5" dy="0">Fuerza nombrada</tspan></text><polygon points="691.5,22 811,65 691.5,108 572,65" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="691.5" y="59.6" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="691.5" dy="0">¿Existe la</tspan><tspan x="691.5" dy="19.2">variación hoy?</tspan></text><rect x="612" y="353.5" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="691.5" y="378.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="691.5" dy="0">Dejar el diseño</tspan><tspan x="691.5" dy="19.2">simple</tspan></text><rect x="634" y="186" width="115" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="691.5" y="211" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="691.5" dy="0">Candidato:</tspan><tspan x="691.5" dy="19.2">patrón del</tspan><tspan x="691.5" dy="19.2">catálogo</tspan></text><rect x="300" y="176.5" width="133" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="366.5" y="201.4" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="366.5" dy="0">Medir costo:</tspan><tspan x="366.5" dy="19.2">nodos,</tspan><tspan x="366.5" dy="19.2">indirección,</tspan><tspan x="366.5" dy="19.2">aprendizaje</tspan></text><polygon points="131.5,166 241,226 131.5,286 22,226" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="131.5" y="211" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="131.5" dy="0">¿El costo es</tspan><tspan x="131.5" dy="19.2">menor que el</tspan><tspan x="131.5" dy="19.2">dolor?</tspan></text><rect x="65" y="344" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="131.5" y="369" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="131.5" dy="0">Aplicar con</tspan><tspan x="131.5" dy="19.2">condición de</tspan><tspan x="131.5" dy="19.2">salida</tspan></text><rect x="304.5" y="353.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="366.5" y="378.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="366.5" dy="0">Revisar con</tspan><tspan x="366.5" dy="19.2">evidencia</tspan></text><rect x="783.5" y="356" width="29" height="24" rx="4" fill="#ffffff"/><text x="798" y="371.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="798" dy="0">no</tspan></text><rect x="697.5" y="135" width="29" height="24" rx="4" fill="#ffffff"/><text x="712" y="150.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="712" dy="0">sí</tspan></text><rect x="458.8" y="311.5" width="29" height="24" rx="4" fill="#ffffff"/><text x="473.3" y="327.4" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="473.3" dy="0">no</tspan></text><rect x="137.5" y="303" width="29" height="24" rx="4" fill="#ffffff"/><text x="152" y="318.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="152" dy="0">sí</tspan></text><rect x="469.2" y="388" width="102" height="42" rx="4" fill="#ffffff"/><text x="520.2" y="403.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="520.2" dy="0">la fuerza</tspan><tspan x="520.2" dy="17.92">desapareció</tspan></text></svg>
