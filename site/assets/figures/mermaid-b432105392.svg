<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 887 721" width="887" height="721" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Datos con huella» … «Liberar por etapas» y «Bloquear con el motivo»</title><desc id="d">Diagrama de flujo con 11 pasos. «Datos con huella» lleva a «Entrenamiento reproducible». «Entrenamiento reproducible» lleva a «Modelo versionado con manifiesto». «Modelo versionado con manifiesto» lleva a «Evaluación por segmento». «Modelo versionado con manifiesto» lleva a «Rollback verificado». «Modelo versionado con manifiesto» lleva a «Canary con guardas por segmento». «Monitor de deriva probado» lleva a «Puerta de liberación». «Evaluación por segmento» lleva a «Puerta de liberación». «Rollback verificado» lleva a «Puerta de liberación». «Canary con guardas por segmento» lleva a «Puerta de liberación». «Ficha del modelo y runbook con dueño» lleva a «Puerta de liberación». «Puerta de liberación» lleva a «Liberar por etapas» (11 de 11). «Puerta de liberación» lleva a «Bloquear con el motivo» (alguna falla).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="887" height="721" fill="#ffffff"/><path d="M353.9,66 L353.9,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M353.9,185 L353.9,205.0 Q353.9,214 344.9,214.0 L298.9,214.0 Q289.9,214 289.9,223.0 L289.9,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M289.9,323 L289.9,347.8 Q289.9,356.8 280.9,356.8 L106.0,356.8 Q97,356.8 97.0,365.8 L97,390.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#