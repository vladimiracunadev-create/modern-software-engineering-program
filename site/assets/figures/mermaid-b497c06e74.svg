<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 849 203" width="849" height="203" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Problema» y «Producto UX Datos Seguridad Soporte» … «Evidencia»</title><desc id="d">Diagrama de flujo con 6 pasos. «Problema» lleva a «Decisión». «Decisión» lleva a «Construcción». «Construcción» lleva a «Operación». «Operación» lleva a «Evidencia». «Evidencia» lleva a «Problema». «Producto UX Datos Seguridad Soporte» lleva a «Decisión».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="849" height="203" fill="#ffffff"/><path d="M159,60 L192.5,60.0 Q201.5,60 201.5,69.0 L201.5,96.2 Q201.5,105.2 210.5,105.2 L244,105.2" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M342,105.2 L388,105.2" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M521,105.2 L567,105.2" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M674,105.2 L720,105.2" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M198,150.5 L212.0,150.5 Q221,150.5 221.0,141.5 L221.0,114.2 Q221,105.2 230.0,105.2 L244,105.2" fill="none" stroke="#32505f" stroke-width="1.8"/><path d="M773.5,83.2 L773.5,33.0 Q773.5,24 764.5,24.0 L117.0,24.0 Q110,24 110.0,31.0 L110,38" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="61" y="38" width="98" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="110" y="64.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">Problema</tspan></text><rect x="244" y="83.2" width="98" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="293" y="109.4" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="293" dy="0">Decisión</tspan></text><rect x="388" y="83.2" width="133" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="454.5" y="109.4" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="454.5" dy="0">Construcción</tspan></text><rect x="567" y="83.2" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="620.5" y="109.4" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="620.5" dy="0">Operación</tspan></text><rect x="720" y="83.2" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="773.5" y="109.4" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="773.5" dy="0">Evidencia</tspan></text><rect x="22" y="120" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="110" y="145.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">Producto UX Datos</tspan><tspan x="110" dy="19.2">Seguridad Soporte</tspan></text></svg>
