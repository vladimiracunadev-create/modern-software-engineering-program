<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 510 973" width="510" height="973" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Sistema antiguo» … «100 % y retiro del antiguo»</title><desc id="d">Diagrama de flujo con 10 pasos. «Sistema antiguo» lleva a «Fachada o abstracción». «Fachada o abstracción» lleva a «Modo sombra: ambos calculan». «Modo sombra: ambos calculan» lleva a «¿Divergencias explicadas?». «¿Divergencias explicadas?» lleva a «Decidir el comportamiento correcto» (no). «Decidir el comportamiento correcto» lleva a «Modo sombra: ambos calculan». «¿Divergencias explicadas?» lleva a «Escalón de tráfico al nuevo» (sí). «Escalón de tráfico al nuevo» lleva a «¿Dentro del criterio?». «¿Dentro del criterio?» lleva a «Retroceder» (no). «¿Dentro del criterio?» lleva a «Siguiente escalón» (sí). «Siguiente escalón» lleva a «100 % y retiro del antiguo».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="510" height="973" fill="#ffffff"/><path d="M164.1,66 L164.1,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M164.1,185 L164.1,207.6 Q164.1,214 170.6,214.0 L170.6,214.0 Q177,214 177.0,220.4 L177,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M177,304 L177.0,324.0 Q177,333 186.0,333.0 L189.0,333.0 Q198,333 198.0,342.0 L198,362" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M198,448 L198.0,456.0 Q198,464 190.0,464.0 L122.0,464.0 Q113,464 113.0,473.0 L113,506" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M198,448 L198.0,456.0 Q198,464 206.0,464.0 L305.5,464.0 Q314.5,464 314.5,473.0 L314.5,515.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M311.6,576.5 L311.6,644" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M308.7,730 L308.7,738.0 Q308.7,746 300.7,746.0 L229.3,746.0 Q220.3,746 220.3,755.0 L220.3,788" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M308.7,730 L308.7,738.0 Q308.7,746 316.7,746.0 L390.8,746.0 Q399.8,746 399.8,755.0 L399.8,788" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M399.8,832 L399.8,856.0 Q399.8,861 394.8,861.0 L394.8,861.0 Q389.8,861 389.8,866.0 L389.8,890" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M38,546 L31.0,546.0 Q24,546 24.0,539.0 L24.0,282.5 Q24,273.5 33.0,273.5 L84.5,273.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="84.6" y="22" width="159" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="164.1" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="164.1" dy="0">Sistema antiguo</tspan></text><rect x="102.1" y="124" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="164.1" y="149.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="164.1" dy="0">Fachada o</tspan><tspan x="164.1" dy="19.2">abstracción</tspan></text><rect x="84.5" y="243" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="177" y="268.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="177" dy="0">Modo sombra: ambos</tspan><tspan x="177" dy="19.2">calculan</tspan></text><polygon points="198,362 309.5,405 198,448 86.5,405" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="198" y="399.6" font-size="1