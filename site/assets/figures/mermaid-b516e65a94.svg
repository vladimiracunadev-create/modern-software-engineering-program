<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 918 400" width="918" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Cohesión y acoplamiento» … «Evolución compatible»</title><desc id="d">Diagrama de flujo con 12 pasos. «Cohesión y acoplamiento» lleva a «Principios y sus límites». «Principios y sus límites» lleva a «Herencia, composición y delegación». «Herencia, composición y delegación» lleva a «Patrones de diseño». «Patrones de diseño» lleva a «Funcional, reactivo y concurrente». «Funcional, reactivo y concurrente» lleva a «Olores y diagnóstico». «Olores y diagnóstico» lleva a «Refactorización segura». «Refactorización segura» lleva a «Diseño para cambio, prueba y operación». «Diseño para cambio, prueba y operación» lleva a «Complejidad esencial y accidental». «Complejidad esencial y accidental» lleva a «Deuda técnica e interés». «Deuda técnica e interés» lleva a «Taller de refactorización». «Taller de refactorización» lleva a «Evolución compatible». «Evolución compatible» lleva a «Cohesión y acoplamiento» (un consumidor se rompe o un cambio cuesta más de lo previsto).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="918" height="400" fill="#ffffff"/><path d="M172.5,62 L236,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M404,62 L458.5,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M600.5,62 L655,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M717,92.5 L717,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M655,200 L591.5,200" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M467.5,200 L399.5,200" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M240.5,200 L190,200" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M106,240 L106,298" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M168,338 L240.5,338" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M399.5,338 L450,338" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M609,338 L659.5,338" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M717,307.5 L717.0,263.0 Q717,254 708.0,254.0 L213.0,254.0 Q204,254 204.0,245.0 L204.0,115.5 Q204,106.5 195.0,106.5 L113.0,106.5 Q106,106.5 106.0,99.5 L106,92.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="39.5" y="31.5" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Cohesión y</tspan><tspan x="106" dy="19.2">acoplamiento</tspan></text><rect x="236" y="31.5" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="320" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="320" dy="0">Principios y sus</tspan><tspan x="320" dy="19.2">límites</tspan></text><rect x="458.5" y="22" width="142" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="529.5" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="529.5" dy="0">Herencia,</tspan><tspan x="529.5" dy="19.2">composición y</tspan><tspan x="529.5" dy="19.2">delegación</tspan></text><rect x="655" y="31.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="717" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="717" dy="0">Patrones de</tspan><tspan x="717" dy="19.2">diseño</tspan></text><rect x="655" y="160" width="124" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="717" y="185" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="717" dy="0">Funcional,</tspan><tspan x="717" dy="19.2">reactivo y</tspan><tspan x="717" dy="19.2">concurrente</tspan></text><rect x="467.5" y="169.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="529.5" y="194.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="529.5" dy="0">Olores y</tspan><tspan x="529.5" dy="19.2">diagnóstico</tspan></text><rect x="240.5" y="169.5" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="320" y="194.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="320" dy="0">Refactorización</tspan><tspan x="320" dy="19.2">segura</tspan></text><rect x="22" y="160" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="185" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Diseño para</tspan><tspan x="106" dy="19.2">cambio, prueba y</tspan><tspan x="106" dy="19.2">operación</tspan></text><rect x="44" y="298" width="124" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="323" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Complejidad</tspan><tspan x="106" dy="19.2">esencial y</tspan><tspan x="106" dy="19.2">accidental</tspan></text><rect x="240.5" y="307.5" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="320" y="332.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="320" dy="0">Deuda técnica e</tspan><tspan x="320" dy="19.2">interés</tspan></text><rect x="450" y="307.5" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="529.5" y="332.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="529.5" dy="0">Taller de</tspan><tspan x="529.5" dy="19.2">refactorización</tspan></text><rect x="659.5" y="307.5" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="717" y="332.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="717" dy="0">Evolución</tspan><tspan x="717" dy="19.2">compatible</tspan></text><rect x="778" y="252.8" width="118" height="96" rx="4" fill="#ffffff"/><text x="837" y="268.7" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="837" dy="0">un consumidor</tspan><tspan x="837" dy="17.92">se rompe o un</tspan><tspan x="837" dy="17.92">cambio cuesta</tspan><tspan x="837" dy="17.92">más de lo</tspan><tspan x="837" dy="17.92">previsto</tspan></text></svg>
