<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 801 362" width="801" height="362" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Audiencia y tarea» … «Portal versionado»</title><desc id="d">Diagrama de flujo con 10 pasos. «Audiencia y tarea» lleva a «Tipos de página». «Tipos de página» lleva a «Puerta de entrada y primer éxito». «Puerta de entrada y primer éxito» lleva a «Decisiones y diagramas». «Decisiones y diagramas» lleva a «API y operación». «API y operación» lleva a «Docs as code». «Docs as code» lleva a «Búsqueda y glosario». «Búsqueda y glosario» lleva a «Máquinas y agentes». «Máquinas y agentes» lleva a «Conocimiento perdido». «Conocimiento perdido» lleva a «Portal versionado». «Portal versionado» lleva a «Audiencia y tarea» (deriva o hallazgo).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="801" height="362" fill="#ffffff"/><path d="M150.5,62 L201,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M360,62 L406,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M574,62 L633,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M699.5,92.5 L699.5,168.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M620,190.5 L556.5,190.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M423.5,190.5 L338,190.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M223,190.5 L146,190.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(