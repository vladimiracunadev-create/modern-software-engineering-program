<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 466 959" width="466" height="959" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Servidor emite evento con identificador» … «Factura emitida inmutable»</title><desc id="d">Diagrama de flujo con 9 pasos. «Servidor emite evento con identificador» lleva a «Cola: al menos una vez». «Cola: al menos una vez» lleva a «Almacén con clave única». «Almacén con clave única» lleva a «Agregación por cliente y periodo de ocurrencia». «Agregación por cliente y periodo de ocurrencia» lleva a «Aplicación de la regla de precios». «Aplicación de la regla de precios» lleva a «Borrador de factura». «Borrador de factura» lleva a «Cierre del periodo». «Cierre del periodo» lleva a «Factura emitida inmutable». «Almacén con clave única» lleva a «Ajuste en la factura siguiente» (evento tardío).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="466" height="959" fill="#ffffff"/><path d="M241.1,102 L241.1,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M241.1,221 L241.1,242.7 Q241.1,250 233.8,250.0 L233.8,250.0 Q226.4,250 226.4,257.4 L226.4,279" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M226.4,340 L226.4,360.0 Q226.4,369 217.4,369.0 L119.0,369.0 Q110,369 110.0,378.0 L110,398" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M110,478 L110.0,498.0 Q110,507 119.0,507.0 L137.4,507.0 Q146.4,507 146.4,516.0 L146.4,536" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M146.4,597 L146.4,617.0 Q146.4,626 155.4,626.0 L169.1,626.0 Q178.1,626 178.1,635.0 L178.1,655" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M178.1,716 L178.1,736.0 Q178.1,745 187.1,745.0 L190.3,745.0 Q199.3,745 199.3,754.0 L199.3,774" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M199.3,818 L199.3,841.6 Q199.3,847 204.7,847.0 L204.7,847.0 Q210,847 210.0,852.4 L210,876" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M226.4,340 L226.4,348.0 Q226.4,356 234.4,356.0 L311.0,356.0 Q320,356 320.0,365.0 L320,407.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="166.1" y="22" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="241.1" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="241.1" dy="0">Servidor emite</tspan><tspan x="241.1" dy="19.2">evento con</tspan><tspan x="241.1" dy="19.2">identificador</tspan></text><rect x="148.6" y="160" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="241.1" y="185.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="241.1" dy="0">Cola: al menos una</tspan><tspan x="241.1" dy="19.2">vez</tspan></text><rect x="138.4" y="279" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="226.4" y="304.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="226.4" dy="0">Almacén con clave</tspan><tspan x="226.4" dy="19.2">única</tspan></text><rect x="22" y="398" width="176" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="110" y="423" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">Agregación por</tspan><tspan x="110" dy="19.2">cliente y periodo</tspan><tspan x="110" dy="19.2">de ocurrencia</tspan></text><rect x="62.4" y="536" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="146.4" y="561.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="146.4" dy="0">Aplicación de la</tspan><tspan x="146.4" dy="19.2">regla de precios</tspan></text><rect x="116.1" y="655" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="178.1" y="680.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="178.1" dy="0">Borrador de</tspan><tspan x="178.1" dy="19.2">factura</tspan></text><rect x="106.8" y="774" width="185" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="199.3" y="800.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="199.3" dy="0">Cierre del periodo</tspan></text><rect x="130.5" y="876" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="210" y="901.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="210" dy="0">Factura emitida</tspan><tspan x="210" dy="19.2">inmutable</tspan></text><rect x="232" y="407.5" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="320" y="432.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="320" dy="0">Ajuste en la</tspan><tspan x="320" dy="19.2">factura siguiente</tspan></text><rect x="326" y="369.8" width="118" height="24" rx="4" fill="#ffffff"/><text x="385" y="385.7" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="385" dy="0">evento tardío</tspan></text></svg>
