<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 679 997" width="679" height="997" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Agente en ejecución» … «Sin duplicados» y «Efectos repetidos»</title><desc id="d">Diagrama de flujo con 12 pasos. «Agente en ejecución» lleva a «Condiciones de parada». «Condiciones de parada» lleva a «Detener y guardar estado» (máximo de pasos, presupuesto, estado repetido, sin avance). «Condiciones de parada» lleva a «Agente en ejecución» (sigue con progreso). «Detener y guardar estado» lleva a «Persona decide». «Persona decide» lleva a «Reanudar desde el punto de control». «Reanudar desde el punto de control» lleva a «Efectos ya hechos». «Efectos ya hechos» lleva a «Sin duplicados» (clave de idempotencia o transacción única). «Efectos ya hechos» lleva a «Efectos repetidos» (sin protección). «Agente en ejecución» lleva a «Evaluación: tareas, intentos, intervalo». «Evaluación: tareas, intentos, intervalo» lleva a «Diferencia mayor que el ruido». «Diferencia mayor que el ruido» lleva a «Adoptar» (sí). «Diferencia mayor que el ruido» lleva a «Más tareas o más intentos» (no).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="679" height="997" fill="#ffffff"/><path d="M307.2,83 L307.2,103.0 Q307.2,112 298.2,112.0 L195.5,112.0 Q186.5,112 186.5,121.0 L186.5,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M186.5,227 L186.5,235.0 Q186.5,243 178.5,243.0 L150.9,243.0 Q141.9,243 141.9,252.0 L141.9,387.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M141.9,448.5 L141.9,479.0 Q141.9,488 132.9,488.0 L106.0,488.0 Q97,488 97.0,497.0 L97,527.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M97,571.5 L97.0,595.8 Q97,604.8 106.0,604.8 L144.1,604.8 Q153.1,604.8 153.1,613.8 L153.1,638" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M153.1,699 L153.1,719.0 Q153.1,728 162.1,728.0 L190.0,728.0 Q199,728 199.0,737.0 L199,757" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M199,819 L199.0,827.0 Q199,835 191.0,835.0 L126.4,835.0 Q117.4,835 117.4,844.0 L117.4,931" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M199,819 L199.0,827.0 Q199,835 207.0,835.0 L305.4,835.0 Q314.4,835 314.4,844.0 L314.4,931" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M307.2,83 L307.2,104.5 Q307.2,113.5 316.2,113.5 L419.0,113.5 Q428,113.5 428.0,122.5 L428,144" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M428,224 L428.0,290.5 Q428,299.5 437.0,299.5 L461.2,299.5 Q470.2,299.5 470.2,308.5 L470.2,375" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M470.2,461 L470.2,469.0 Q470.2,477 462.2,477.0 L418.9,477.0 Q409.9,477 409.9,486.0 L409.9,527.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M470.2,461 L470.2,469.0 Q470.2,477 478.2,477.0 L563.4,477.0 Q572.4,477 572.4,486.0 L572.4,519" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M306,184 L313.0,184.0 Q320,184 320.0,177.0 L320.0,136.0 Q320,127 311.0,127.0 L248.7,127.0 Q239.7,127 239.7,118.0 L239.7,59.5 Q239.7,52.5 246.7,52.5 L253.7,52.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="253.7" y="22" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="307.2" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="307.2" dy="0">Agente en</tspan><tspan x="307.2" dy="19.2">ejecución</tspan></text><polygon points="186.5,141 306,184 186.5,227 67,184" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="186.5" y="178.6" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="186.5" dy="0">Condiciones de</tspan><tspan x="186.5" dy="19.2">parada</tspan></text><rect x="53.9" y="387.5" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="141.9" y="412.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="141.9" dy="0">Detener y guardar</tspan><tspan x="141.9" dy="19.2">estado</tspan></text><rect x="22" y="527.5" width="150" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="97" y="553.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="97" dy="0">Persona decide</tspan></text><rect x="65.1" y="638" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="153.1" y="663.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="153.1" dy="0">Reanudar desde el</tspan><tspan x="153.1" dy="19.2">punto de control</tspan></text><polygon points="199,757 313.5,788 199,819 84.5,788" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="199" y="792.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="199" dy="0">Efectos ya hechos</tspan></text><rect x="42.4" y="931" width="150" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="117.4" y="957.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="117.4" dy="0">Sin duplicados</tspan></text><rect x="226.4" y="931" width="176" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="314.4" y="957.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="314.4" dy="0">Efectos repetidos</tspan></text><rect x="340" y="144" width="176" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="428" y="169" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="428" dy="0">Evaluación:</tspan><tspan x="428" dy="19.2">tareas, intentos,</tspan><tspan x="428" dy="19.2">intervalo</tspan></text><polygon points="470.2,375 605.7,418 470.2,461 334.7,418" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470.2" y="412.6" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470.2" dy="0">Diferencia mayor</tspan><tspan x="470.2" dy="19.2">que el ruido</tspan></text><rect x="365.4" y="527.5" width="89" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="409.9" y="553.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="409.9" dy="0">Adoptar</tspan></text><rect x="488.4" y="519" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="572.4" y="544.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="572.4" dy="0">Más tareas o más</tspan><tspan x="572.4" dy="19.2">intentos</tspan></text><rect x="147.9" y="258.2" width="118" height="114" rx="4" fill="#ffffff"/><text x="206.9" y="274.1" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="206.9" dy="0">máximo de</tspan><tspan x="206.9" dy="17.92">pasos,</tspan><tspan x="206.9" dy="17.92">presupuesto,</tspan><tspan x="206.9" dy="17.92">estado</tspan><tspan x="206.9" dy="17.92">repetido, sin</tspan><tspan x="206.9" dy="17.92">avance</tspan></text><rect x="147.7" y="68.8" width="86" height="42" rx="4" fill="#ffffff"/><text x="190.7" y="84.7" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="190.7" dy="0">sigue con</tspan><tspan x="190.7" dy="17.92">progreso</tspan></text><rect x="123.4" y="844" width="126" height="78" rx="4" fill="#ffffff"/><text x="186.4" y="859.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="186.4" dy="0">clave de</tspan><tspan x="186.4" dy="17.92">idempotencia o</tspan><tspan x="186.4" dy="17.92">transacción</tspan><tspan x="186.4" dy="17.92">única</tspan></text><rect x="320.4" y="871" width="126" height="24" rx="4" fill="#ffffff"/><text x="383.4" y="886.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="383.4" dy="0">sin protección</tspan></text><rect x="415.9" y="490.2" width="29" height="24" rx="4" fill="#ffffff"/><text x="430.4" y="506.1" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="430.4" dy="0">sí</tspan></text><rect x="578.4" y="486" width="29" height="24" rx="4" fill="#ffffff"/><text x="592.9" y="501.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592.9" dy="0">no</tspan></text></svg>
