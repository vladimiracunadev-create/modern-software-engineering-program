<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 246" width="840" height="246" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Pregunta y audiencia» … «Comparación con el código»</title><desc id="d">Diagrama de flujo con 6 pasos. «Pregunta y audiencia» lleva a «Nivel de abstracción». «Nivel de abstracción» lleva a «Modelo en texto». «Modelo en texto» lleva a «Diagrama generado». «Modelo en texto» lleva a «Alternativa textual». «Diagrama generado» lleva a «Comparación con el código». «Comparación con el código» lleva a «Modelo en texto» (diferencias).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="840" height="246" fill="#ffffff"/><path d="M137,144 L183,144" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M307,144 L353,144" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M460,144 L480.5,144.0 Q489.5,144 489.5,135.0 L489.5,103.5 Q489.5,94.5 498.5,94.5 L519,94.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M460,144 L474.0,144.0 Q483,144 483.0,153.0 L483.0,184.5 Q483,193.5 492.0,193.5 L506,193.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M617,94.5 L676,94.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M747,64 L747.0,57.0 Q747,50 740.0,50.0 L415.5,50.0 Q406.5,50 406.5,59.0 L406.5,113.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="113.5" width="115" height="61" rx="10" fill="#dff1ee" strok