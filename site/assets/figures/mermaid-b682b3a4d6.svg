<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 510 782" width="510" height="782" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Consumidor usa campos del proveedor» … «Prueba por interfaz localiza la frontera»</title><desc id="d">Diagrama de flujo con 7 pasos. «Consumidor usa campos del proveedor» lleva a «Contrato del consumidor». «Contrato del consumidor» lleva a «Verificación contra el proveedor». «Verificación contra el proveedor» lleva a «¿Rompe a algún consumidor?». «¿Rompe a algún consumidor?» lleva a «Avisar a ese consumidor» (sí). «¿Rompe a algún consumidor?» lleva a «Cambio compatible» (no). «Avisar a ese consumidor» lleva a «Prueba por interfaz localiza la frontera». «Prueba por interfaz localiza la frontera» lleva a «Contrato del consumidor» (nuevo uso).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="510" height="782" fill="#ffffff"/><path d="M358.4,102 L358.4,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M358.4,221 L358.4,242.8 Q358.4,250 351.1,250.0 L351.1,250.0 Q343.9,250 343.9,257.2 L343.9,279" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M343.9,359 L343.9,379.0 Q343.9,388 334.9,388.0 L330.2,388.0 Q321.2,388 321.2,397.0 L321.2,417" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M321.2,503 L321.2,511.0 Q321.2,519 313.2,519.0 L219.7,519.0 Q210.7,519 210.7,528.0 L210.7,561" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M321.2,503 L321.2,511.0 Q321.2,519 329.2,519.0 L390.2,519.0 Q399.2,519 399.2,528.0 L399.2,569.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M213.3,622 L213.3,680" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M128,720 L121.0,720.0 Q114,720 114.0,713.0 L114.0,199.5 Q114,190.5 123.0,190.5 L291.9,190.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="283.4" y="22" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="358.4" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="358.4" dy="0">Consumidor usa</tspan><tspan x="358.4" dy="19.2">campos del</tspan><tspan x="358.4" dy="19.2">proveedor</tspan></text><rect x="291.9" y="160" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="358.4" y="185.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="358.4" dy="0">Contrato del</tspan><tspan x="358.4" dy="19.2">consumidor</tspan></text><rect x="277.4" y="279" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="343.9" y="304" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="343.9" dy="0">Verificación</tspan><tspan x="343.9" dy="19.2">contra el</tspan><tspan x="343.9" dy="19.2">proveedor</tspan></text><polygon points="321.2,417 440.7,460 321.2,503 201.7,460" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="321.2" y="454.6" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="321.2" dy="0">¿Rompe a algún</tspan><tspan x="321.2" dy="19.2">consumidor?</tspan></text><rect x="144.2" y="561" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="210.7" y="586.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="210.7" dy="0">Avisar a ese</tspan><tspan x="210.7" dy="19.2">consumidor</tspan></text><rect x="311.2" y="569.5" width="176" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="399.2" y="595.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="399.2" dy="0">Cambio compatible</tspan></text><rect x="128" y="680" width="176" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="216" y="705" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="216" dy="0">Prueba por</tspan><tspan x="216" dy="19.2">interfaz localiza</tspan><tspan x="216" dy="19.2">la frontera</tspan></text><rect x="216.7" y="528" width="29" height="24" rx="4" fill="#ffffff"/><text x="231.2" y="543.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="231.2" dy="0">sí</tspan></text><rect x="405.2" y="532.2" width="29" height="24" rx="4" fill="#ffffff"/><text x="419.7" y="548.1" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="419.7" dy="0">no</tspan></text><rect x="22" y="443.2" width="86" height="24" rx="4" fill="#ffffff"/><text x="65" y="459.1" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="65" dy="0">nuevo uso</tspan></text></svg>
