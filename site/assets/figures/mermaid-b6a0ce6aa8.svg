<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 874 105" width="874" height="105" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «🎯 Dato internacional» … «📈 Verificación»</title><desc id="d">Diagrama de flujo con 5 pasos. «🎯 Dato internacional» lleva a «🧠 Locale». «🧠 Locale» lleva a «🛠️ Presentación». «🛠️ Presentación» lleva a «🔎 Localización». «🔎 Localización» lleva a «📈 Verificación».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="874" height="105" fill="#ffffff"/><path d="M164,52.5 L210,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M315,52.5 L361,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M494,52.5 L540,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M673,52.5 L719,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="22" width="142" height="61" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="93" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="93" dy="0">🎯 Dato</tspan><tspan x="93" dy="19.2">internacional</tspan></text><rect x="210" y="30.5" width="105" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="262.5" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="262.5" dy="0">🧠 Locale</tspan></text><rect x="361" y="22" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="427.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="427.5" dy="0">🛠️</tspan><tspan x="427.5" dy="19.2">Presentación</tspan></text><rect x="540" y="22" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="606.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="606.5" dy="0">🔎</tspan><tspan x="606.5" dy="19.2">Localización</tspan></text><rect x="719" y="22" width="133" height="61" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="785.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="785.5" dy="0">📈</tspan><tspan x="785.5" dy="19.2">Verificación</tspan></text></svg>
