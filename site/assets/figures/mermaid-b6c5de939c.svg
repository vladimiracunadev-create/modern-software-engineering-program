<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 703" width="580" height="703" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Decisión de atajo» … «Resultado observado»</title><desc id="d">Diagrama de flujo con 9 pasos. «Decisión de atajo» lleva a «Principal: costo de arreglarlo». «Decisión de atajo» lleva a «Interés: costo extra por cada vez que se toca». «Interés: costo extra por cada vez que se toca» lleva a «Frecuencia de cambio x fricción». «Principal: costo de arreglarlo» lleva a «Política». «Frecuencia de cambio x fricción» lleva a «Política». «Política» lleva a «Pagar ahora». «Política» lleva a «Pagar al primer cambio». «Política» lleva a «No pagar y aceptar el interés». «Pagar ahora» lleva a «Resultado observado». «Pagar al primer cambio» lleva a «Resultado observado». «No pagar y aceptar el interés» lleva a «Resultado observado». «Resultado observado» lleva a «Frecuencia de cambio x fricción» (la frecuencia de cambio varía).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="580" height="703" fill="#ffffff"/><path d="M293.7,66 L293.7,90.8 Q293.7,99.8 284.7,99.8 L197.4,99.8 Q188.4,99.8 188.4,108.8 L188.4,133.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M293.7,66 L293.7,86.0 Q293.7,95 302.7,95.0 L389.9,95.0 Q398.9,95 398.9,104.0 L398.9,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M398.9,204 L398.9,224.0 Q398.9,233 389.9,233.0 L349.5,233.0 Q340.5,233 340.5,242.0 L340.5,262" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="