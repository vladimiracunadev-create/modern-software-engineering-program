<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 766 362" width="766" height="362" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Integración continua» … «Camino a producción con retroceso»</title><desc id="d">Diagrama de flujo con 12 pasos. «Integración continua» lleva a «Pipelines y cachés». «Pipelines y cachés» lleva a «Compuertas». «Compuertas» lleva a «Credenciales efímeras». «Credenciales efímeras» lleva a «Entrega y despliegue». «Entrega y despliegue» lleva a «Infraestructura como código». «Infraestructura como código» lleva a «GitOps». «GitOps» lleva a «Entornos de vista previa». «Entornos de vista previa» lleva a «Plataforma interna». «Plataforma interna» lleva a «Métricas DORA». «Métricas DORA» lleva a «Taller de endurecimiento». «Taller de endurecimiento» lleva a «Camino a producción con retroceso». «Camino a producción con retroceso» lleva a «Integración continua» (incidente).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="766" height="362" fill="#ffffff"/><path d="M150.5,52.5 L210,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M334,52.5 L411,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M526,52.5 L602.5,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M669,83 L669,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M611.5,171.5 L548,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M389,171.5 L312.5,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M231.5,171.5 L155,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M88.5,202 L88.5,269.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M146,300 L201,300" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M343,300 L393.5,300" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M543.5,300 L594,300" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M669,260 L669.0,225.0 Q669,216 660.0,216.0 L173.5,216.0 Q164.5,216 164.5,207.0 L164.5,106.0 Q164.5,97 155.5,97.0 L95.5,97.0 Q88.5,97 88.5,90.0 L88.5,83" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="26.5" y="22" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="88.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="88.5" dy="0">Integración</tspan><tspan x="88.5" dy="19.2">continua</tspan></text><rect x="210" y="22" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="272" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="272" dy="0">Pipelines y</tspan><tspan x="272" dy="19.2">cachés</tspan></text><rect x="411" y="30.5" width="115" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="468.5" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="468.5" dy="0">Compuertas</tspan></text><rect x="602.5" y="22" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="669" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="669" dy="0">Credenciales</tspan><tspan x="669" dy="19.2">efímeras</tspan></text><rect x="611.5" y="141" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="669" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="669" dy="0">Entrega y</tspan><tspan x="669" dy="19.2">despliegue</tspan></text><rect x="389" y="141" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="468.5" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="468.5" dy="0">Infraestructura</tspan><tspan x="468.5" dy="19.2">como código</tspan></text><rect x="231.5" y="149.5" width="81" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="272" y="175.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="272" dy="0">GitOps</tspan></text><rect x="22" y="141" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="88.5" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="88.5" dy="0">Entornos de</tspan><tspan x="88.5" dy="19.2">vista previa</tspan></text><rect x="31" y="269.5" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="88.5" y="294.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="88.5" dy="0">Plataforma</tspan><tspan x="88.5" dy="19.2">interna</tspan></text><rect x="201" y="278" width="142" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="272" y="304.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="272" dy="0">Métricas DORA</tspan></text><rect x="393.5" y="269.5" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="468.5" y="294.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="468.5" dy="0">Taller de</tspan><tspan x="468.5" dy="19.2">endurecimiento</tspan></text><rect x="594" y="260" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f