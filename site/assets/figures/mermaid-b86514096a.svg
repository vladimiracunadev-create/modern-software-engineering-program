<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 477 1106" width="477" height="1106" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Texto de entrada» … «Error aceptado»</title><desc id="d">Diagrama de flujo con 11 pasos. «Texto de entrada» lleva a «Contexto finito». «Contexto finito» lleva a «Distribución de probabilidad sobre lo siguiente». «Distribución de probabilidad sobre lo siguiente» lleva a «Muestreo». «Muestreo» lleva a «Repite lo más probable» (temperatura baja). «Muestreo» lleva a «Más variedad y más error» (temperatura alta). «Repite lo más probable» lleva a «Respuesta». «Más variedad y más error» lleva a «Respuesta». «Respuesta» lleva a «Hay verificación externa». «Hay verificación externa» lleva a «Respuesta comprobada» (prueba, compilador, fuente). «Hay verificación externa» lleva a «Respuesta que solo suena bien» (no). «Respuesta que solo suena bien» lleva a «Error aceptado» (confianza no calibrada).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="477" height="1106" fill="#ffffff"/><path d="M179.1,66 L179.1,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M180.6,168 L180.6,226" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M184.8,306 L184.8,364" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M187.4,426 L187.4,434.0 Q187.4,442 179.4,442.0 L102.0,442.0 Q93,442 93.0,451.0 L93,502" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M187.4,426 L187.4,434.0 Q187.4,442 195.4,442.0 L281.5,442.0 Q290.5,442 290.5,451.0 L290.5,502" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M93,563 L93.0,583.0 Q93,592 102.0,592.0 L192.4,592.0 Q201.4,592 201.4,601.0 L201.4,621" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M290.5,563 L290.5,583.0 Q290.5,592 281.5,592.0 L210.4,592.0 Q201.4,592 201.4,601.0 L201.4,621" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M201.4,665 L201.4,685.0 Q201.4,694 210.4,694.0 L222.0,694.0 Q231,694 231.0,703.0 L231,723" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M231,809 L231.0,817.0 Q231,825 223.0,825.0 L165.4,825.0 Q156.4,825 156.4,834.0 L156.4,903" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M231,809 L231.0,817.0 Q231,825 239.0,825.0 L331.4,825.0 Q340.4,825 340.4,834.0 L340.4,903" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M338.1,964 L338.1,1040" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="95.1" y="22" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="179.1" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="179.1" dy="0">Texto de entrada</tspan></text><rect x="99.6" y="124" width="159" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="179.1" y="150.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="179.1" dy="0">Contexto finito</tspan></text><rect x="89.6" y="226" width="185" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="182.1" y="251" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="182.1" dy="0">Distribución de</tspan><tspan x="182.1" dy="19.2">probabilidad sobre</tspan><tspan x="182.1" dy="19.2">lo siguiente</tspan></text><polygon points="187.4,364 245.4,395 187.4,426 129