<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 689 645" width="689" height="645" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Carga a ejecutar» … «Evidencia: arranque, memoria, interferencia»</title><desc id="d">Diagrama de flujo con 9 pasos. «Carga a ejecutar» lleva a «¿Quién es el adversario?». «¿Quién es el adversario?» lleva a «Proceso o hilo» (código propio y de confianza). «¿Quién es el adversario?» lleva a «Contenedor con límites» (código de otros equipos). «¿Quién es el adversario?» lleva a «Máquina virtual o microVM» (código ajeno o hostil). «Proceso o hilo» lleva a «Comparte núcleo y memoria del proceso». «Contenedor con límites» lleva a «Comparte núcleo, vista y recursos acotados». «Máquina virtual o microVM» lleva a «Núcleo propio, hardware virtualizado». «Comparte núcleo y memoria del proceso» lleva a «Evidencia: arranque, memoria, interferencia». «Comparte núcleo, vista y recursos acotados» lleva a «Evidencia: arranque, memoria, interferencia». «Núcleo propio, hardware virtualizado» lleva a «Evidencia: arranque, memoria, interferencia». «Evidencia: arranque, memoria, interferencia» lleva a «¿Quién es el adversario?» (incidente o cambio de amenaza).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="689" height="645" fill="#ffffff"/><path d="M342.3,66 L342.3,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M342.3,210 L342.3,218.0 Q342.3,226 334.3,226.0 L163.0,226.0 Q154,226 154.0,235.0 L154,294.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M340.1,210 L340.1,286" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M342.3,210 L342.3,218.0 Q342.3,226 350.3,226.0 L526.0,226.0 Q535,226 535.0,235.0 L535,286" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M154,338.5 L154.0,365.2 Q154,371.8 147.4,371.8 L147.4,371.8 Q140.9,371.8 140.9,378.4 L140.9,405" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M342.4,347 L342.4,405" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M537.4,347 L537.4,405" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M140.9,485 L140.9,505.0 Q140.9,514 149.9,514.0 L333.6,514.0 Q342.6,514 342.6,523.0 L342.6,543" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M344.7,485 L344.7,543" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M539.9,485 L539.9,505.0 Q539.9,514 530.9,514.0 L351.6,514.0 Q342.6,514 342.6,523.0 L342.6,543" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M250.1,583 L243.1,583.0 Q236.1,583 236.1,576.0 L236.1,502.4 Q236.1,499 239.5,499.0 L239.5,499.0 Q242.9,499 242.9,495.6 L242.9,233.0 Q242.9,224 233.9,224.0 L233.3,224.0 Q224.3,224 224.3,215.0 L224.3,174.0 Q224.3,167 231.3,167.0 L238.3,167" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="258.3" y="22" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="342.3" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="342.3" dy="0">Carga a ejecutar</tspan></text><polygon points="342.3,124 446.3,167 342.3,210 238.3,167" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="342.3" y="161.6" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="342.3" dy="0">¿Quién es el</tspan><tspan x="342.3" dy="19.2">adversario?</tspan></text><rect x="79" y="294.5" width="150" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="154" y="320.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="154" dy="0">Proceso o hilo</tspan></text><rect x="263" y="286" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="338" y="311.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="338" dy="0">Contenedor con</tspan><tspan x="338" dy="19.2">límites</tspan></text><rect x="447" y="286" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="535" y="311.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="535" dy="0">Máquina virtual o</tspan><tspan x="535" dy="19.2">microVM</tspan></text><rect x="52.9" y="405" width="176" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="140.9" y="430" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="140.9" dy="0">Comparte núcleo y</tspan><tspan x="140.9" dy="19.2">memoria del</tspan><tspan x="140.9" dy="19.2">proceso</tspan></text><rect x="262.9" y="405" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="346.9" y="430" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="346.9" dy="0">Comparte núcleo,</tspan><tspan x="346.9" dy="19.2">vista y recursos</tspan><tspan x="346.9" dy="19.2">acotados</tspan></text><rect x="464.9" y="405" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="539.9" y="430" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="539.9" dy="0">Núcleo propio,</tspan><tspan x="539.9" dy="19.2">hardware</tspan><tspan x="539.9" dy="19.2">virtualizado</tspan></text><rect x="250.1" y="543" width="185" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="342.6" y="568" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="342.6" dy="0">Evidencia:</tspan><tspan x="342.6" dy="19.2">arranque, memoria,</tspan><tspan x="342.6" dy="19.2">interferencia</tspan></text><rect x="22" y="239.2" width="126" height="42" rx="4" fill="#ffffff"/><text x="85" y="255.1" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="85" dy="0">código propio</tspan><tspan x="85" dy="17.92">y de confianza</tspan></text><rect x="346.1" y="227" width="118" height="42" rx="4" fill="#ffffff"/><text x="405.1" y="242.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="405.1" dy="0">código de</tspan><tspan x="405.1" dy="17.92">otros equipos</tspan></text><rect x="541" y="235" width="126" height="42" rx="4" fill="#ffffff"/><text x="604" y="250.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="604" dy="0">código ajeno o</tspan><tspan x="604" dy="17.92">hostil</tspan></text><rect x="128.1" y="519.4" width="102" height="60" rx="4" fill="#ffffff"/><text x="179.1" y="535.3" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="179.1" dy="0">incidente o</tspan><tspan x="179.1" dy="17.92">cambio de</tspan><tspan x="179.1" dy="17.92">amenaza</tspan></text></svg>
