<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 782" width="770" height="782" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Datos analíticos» … «Orden por la columna de filtro» y «Tamaño de archivo adecuado»</title><desc id="d">Diagrama de flujo con 11 pasos. «Datos analíticos» lleva a «¿Quién gestiona el almacenamiento?». «¿Quién gestiona el almacenamiento?» lleva a «Almacén: esquema y transacciones propios» (el motor). «¿Quién gestiona el almacenamiento?» lleva a «Lago: esquema al leer» (archivos en almacenamiento de objetos). «Lago: esquema al leer» lleva a «Manifiesto de versiones». «Manifiesto de versiones» lleva a «Lakehouse: transacciones, versiones, esquema». «Lago: esquema al leer» lleva a «Formato de archivo». «Formato de archivo» lleva a «Filas: CSV, JSON, binario». «Formato de archivo» lleva a «Columnas: grupos, diccionario, estadísticas». «Columnas: grupos, diccionario, estadísticas» lleva a «Orden por la columna de filtro». «Columnas: grupos, diccionario, estadísticas» lleva a «Tamaño de archivo adecuado».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="770" height="782" fill="#ffffff"/><path d="M199.2,66 L199.2,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M199.2,210 L199.2,218.0 Q199.2,226 191.2,226.0 L123.5,226.0 Q114.5,226 114.5,235.0 L114.5,304" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M199.2,210 L199.2,218.0 Q199.2,226 207.2,226.0 L316.0,226.0 Q325,226 325.0,235.0 L325,313.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url