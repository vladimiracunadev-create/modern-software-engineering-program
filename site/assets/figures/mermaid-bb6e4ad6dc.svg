<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 567 686" width="567" height="686" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Agente» … «Duración: sesión, tarea, permanente»</title><desc id="d">Diagrama de flujo con 10 pasos. «Agente» lleva a «Herramientas». «Herramientas» lleva a «Regla». «Regla» lleva a «Bloqueo» (denegar). «Regla» lleva a «Aprobación humana» (preguntar). «Regla» lleva a «Acción» (permitir). «Acción» lleva a «Alcance: rutas, dominios, recursos». «Alcance: rutas, dominios, recursos» lleva a «Duración: sesión, tarea, permanente». «Aprobación humana» lleva a «Nueva regla» (permitir siempre). «Nueva regla» lleva a «Regla». «Aislamiento del sistema operativo» lleva a «Acción» (segunda barrera).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="567" height="686" fill="#ffffff"/><path d="M210.2,66 L210.2,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M210.2,168 L210.2,188.0 Q210.2,197 219.2,197.0 L235.5,197.0 Q244.5,197 244.5,206.0 L244.5,226" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M244.5,288 L244.5,296.0 Q244.5,304 236.5,304.0 L106.0,304.0 Q97,304 97.0,313.0 L97,364" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M244.5,288 L244.5,296.0 Q244.5,304 252.5,304.0 L254.5,304.0 Q263.5,304 263.5,313.0 L263.5,364" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M244.5,288 L244.5,296.0 Q244.5,304 252.5,304.0 L417.0,304.0 Q426,304 426.0,313.0 L426,364" fill="none" stroke="#32505f" stroke-