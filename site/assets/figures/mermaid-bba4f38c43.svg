><rect x="22" y="839.8" width="118" height="24" rx="4" fill="#ffffff"/><text x="81" y="855.7" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="81" dy="0">fallos reales</tspan></text></svg>
