<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 525 978" width="525" height="978" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Solicitud con presupuesto y permisos» … «Producción con degradación y alarmas» y «Rediseñar o reducir alcance»</title><desc id="d">Diagrama de flujo con 11 pasos. «Solicitud con presupuesto y permisos» lleva a «Enrutador con umbral». «Enrutador con umbral» lleva a «Workflow» (conocido). «Enrutador con umbral» lleva a «Agente acotado» (abierto). «Enrutador con umbral» lleva a «Persona» (duda). «Workflow» lleva a «Herramientas por protocolo, permisos mínimos». «Agente acotado» lleva a «Herramientas por protocolo, permisos mínimos». «Herramientas por protocolo, permisos mínimos» lleva a «Diario con clave de idempotencia». «Diario con clave de idempotencia» lleva a «Traza con versiones». «Traza con versiones» lleva a «Evaluación y puerta de entrada». «Evaluación y puerta de entrada» lleva a «Producción con degradación y alarmas» (pasa). «Evaluación y puerta de entrada» lleva a «Rediseñar o reducir alcance» (no pasa). «Producción con degradación y alarmas» lleva a «Evaluación y puerta de entrada» (fallos reales).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="525" height="978" fill="#ffffff"/><path d="M283.9,102 L283.9,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M283.9,221 L283.9,229.0 Q283.9,237 275.9,237.0 L128.6,237.0 Q119.6,237 119.6,246.0 L119.6,279" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M280.8,221 L280.8,279" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M283.9,221 L283.9,229.0 Q283.9,237 291.9,237.0 L422.1,237.0 Q431.1,237 431.1,246.0 L431.1,279" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M119.6,323 L119.6,343.0 Q119.6,352 128.6,352.0 L216.7,352.0 Q225.7,352 225.7,361.0 L225.7,381" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M277.6,323 L277.6,343.0 Q277.6,352 268.6,352.0 L234.7,352.0 Q225.7,352 225.7,361.0 L225.7,381" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M225.7,461 L225.7,481.0 Q225.7,490 234.7,490.0 L255.7,490.0 Q264.7,490 264.7,499.0 L264.7,519" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M264.7,580 L264.7,600.0 Q264.7,609 273.7,609.0 L288.0,609.0 Q297,609 297.0,618.0 L297,638" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M297,699 L297.0,719.0 Q297,728 306.0,728.0 L311.8,728.0 Q320.8,728 320.8,737.0 L320.8,757" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M320.8,818 L320.8,826.0 Q320.8,834 312.8,834.0 L244.0,834.0 Q235,834 235.0,843.0 L235,876" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M320.8,818 L320.8,826.0 Q320.8,834 328.8,834.0 L414.5,834.0 Q423.5,834 423.5,843.0 L423.5,885.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M160,916 L153.0,916.0 Q146,916 146.0,909.0 L146.0,796.5 Q146,787.5 155.0,787.5 L232.8,787.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="212.9" y="22" width="142" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="283.9" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="283.9" dy="0">Solicitud con</tspan><tspan x="283.9" dy="19.2">presupuesto y</tspan><tspan x="283.9" dy="19.2">permisos</tspan></text><rect x="212.9" y="160" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="283.9" y="185.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="283.9" dy="0">Enrutador con</tspan><tspan x="283.9" dy="19.2">umbral</tspan></text><rect x="70.6" y="279" width="98" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="119.6" y="305.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="119.6" dy="0">Workflow</tspan></text><rect x="202.6" y="279" width="150" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="277.6" y="305.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="277.6" dy="0">Agente acotado</tspan></text><rect x="386.6" y="279" width="89" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="431.1" y="305.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="431.1" dy="0">Persona</tspan></text><rect x="141.7" y="381" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="225.7" y="406" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="225.7" dy="0">Herramientas por</tspan><tspan x="225.7" dy="19.2">protocolo,</tspan><tspan x="225.7" dy="19.2">permisos mínimos</tspan></text><rect x="180.7" y="519" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="264.7" y="544.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="264.7" dy="0">Diario con clave</tspan><tspan x="264.7" dy="19.2">de idempotencia</tspan></text><rect x="243.5" y="638" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="297" y="663.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="297" dy="0">Traza con</tspan><tspan x="297" dy="19.2">versiones</t