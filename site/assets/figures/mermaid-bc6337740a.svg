<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 607 980" width="607" height="980" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Intención» … «Revisión por otra persona»</title><desc id="d">Diagrama de flujo con 10 pasos. «Intención» lleva a «Especificación y constitución». «Especificación y constitución» lleva a «Plan y tareas». «Plan y tareas» lleva a «Implementación por agente con autoridad mínima». «Implementación por agente con autoridad mínima» lleva a «Convergencia: pruebas por requisito». «Convergencia: pruebas por requisito» lleva a «Variantes defectuosas: ¿pueden fallar las pruebas?». «Implementación por agente con autoridad mínima» lleva a «Operación: reinicio, copia, restauración». «Implementación por agente con autoridad mínima» lleva a «Controles, parada, aprobación y registro». «Convergencia: pruebas por requisito» lleva a «Paquete de evidencia». «Variantes defectuosas: ¿pueden fallar las pruebas?» lleva a «Paquete de evidencia». «Operación: reinicio, copia, restauración» lleva a «Paquete de evidencia». «Controles, parada, aprobación y registro» lleva a «Paquete de evidencia». «Paquete de evidencia» lleva a «Revisión por otra persona». «Revisión por otra persona» lleva a «Especificación y constitución» (hallazgos).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="607" height="980" fill="#ffffff"/><path d="M344.4,66 L344.4,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M344.4,185 L344.4,205.7 Q344.4,214 336.1,214.0 L336.1,214.0 Q327.8,214 327.8,222.3 L327.8,243" fill="none" stroke="#32505f" s