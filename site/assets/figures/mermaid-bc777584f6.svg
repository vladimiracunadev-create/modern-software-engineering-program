<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 486 700" width="486" height="700" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de estados: «Creado» … «Finalizado»</title><desc id="d">Diagrama de estados con 6 estados. inicio lleva a «Creado». «Creado» lleva a «Listo». «Listo» lleva a «Ejecutando». «Ejecutando» lleva a «Esperando» (E/S o sincronización). «Esperando» lleva a «Listo» (evento disponible). «Ejecutando» lleva a «Listo» (replanificación). «Ejecutando» lleva a «Terminando» (salida o solicitud). «Terminando» lleva a «Finalizado» (recursos recuperados). «Finalizado» lleva a fin.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="486" height="700" fill="#ffffff"/><path d="M228.7,48 L228.7,106" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M233.1,150 L233.1,208" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M237.5,252 L237.5,273.9 Q237.5,281 244.6,281.0 L244.6,281.0 Q251.7,281 251.7,288.1 L251.7,310" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M251.7,354 L251.7,362.0 Q251.7,370 243.7,370.0 L198.5,370.0 Q189.5,370 189.5,379.0 L189.5,430" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M251.7,354 L251.7,362.0 Q251.7,370 259.7,370.0 L325.5,370.0 Q334.5,370 334.5,379.0 L334.5,430" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M334.5,474 L334.5,483.2 Q334.5,490 327.8,490.0 L327.8,490.0 Q321,490 321.0,496.8 L321,550" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="