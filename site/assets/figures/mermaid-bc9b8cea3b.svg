<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 589 863" width="589" height="863" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Tarea» … «Sin colisión salvo archivos comunes» y «Escritura serializada»</title><desc id="d">Diagrama de flujo con 12 pasos. «Tarea» lleva a «Se puede repartir en partes casi independientes». «Se puede repartir en partes casi independientes» lleva a «Un solo agente» (no). «Se puede repartir en partes casi independientes» lleva a «Agente principal» (sí). «Agente principal» lleva a «Subagente 1: contexto propio». «Agente principal» lleva a «Subagente 2: contexto propio». «Agente principal» lleva a «Subagente 3: contexto propio». «Subagente 1: contexto propio» lleva a «Resumen». «Subagente 2: contexto propio» lleva a «Resumen». «Subagente 3: contexto propio» lleva a «Resumen». «Resumen» lleva a «Agente principal». «Subagente 1: contexto propio» lleva a «Archivos y estado compartido» (pueden tocar). «Subagente 2: contexto propio» lleva a «Archivos y estado compartido». «Subagente 3: contexto propio» lleva a «Archivos y estado compartido». «Archivos y estado compartido» lleva a «Conflicto». «Conflicto» lleva a «Sin colisión salvo archivos comunes» (propiedad por carpeta). «Conflicto» lleva a «Escritura serializada» (versión o arrendamiento).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="589" height="863" fill="#ffffff"/><path d="M229.5,66 L229.5,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M229.5,244 L229.5,252.0 Q229.5,260 221.5,260.0 L155.1,260.0 Q146.1,260 146.1,269.0 L146.1,3