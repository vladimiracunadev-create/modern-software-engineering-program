<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 615 756" width="615" height="756" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «API con 10 defectos» … «Nueva prueba que llegue hasta él»</title><desc id="d">Diagrama de flujo con 8 pasos. «API con 10 defectos» lleva a «Suite de camino feliz». «API con 10 defectos» lleva a «Suite de contrato». «API con 10 defectos» lleva a «Suite adversaria». «Suite de camino feliz» lleva a «Resultados por defecto». «Suite de contrato» lleva a «Resultados por defecto». «Suite adversaria» lleva a «Resultados por defecto». «Resultados por defecto» lleva a «Reparar uno y su prueba de regresión». «Reparar uno y su prueba de regresión» lleva a «Reintroducir y comprobar la detección». «Reintroducir y comprobar la detección» lleva a «Nueva prueba que llegue hasta él» (defecto dormido).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="615" height="756" fill="#ffffff"/><path d="M304.5,83 L304.5,103.0 Q304.5,112 295.5,112.0 L110.5,112.0 Q101.5,112 101.5,121.0 L101.5,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M303.8,83 L303.8,149.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M304.5,83 L304.5,107.2 Q304.5,116.2 313.5,116.2 L500.0,116.2 Q509,116.2 509.0,125.2 L509,149.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M101.5,202 L101.5,222.0 Q101.5,231 110.5,231.0 L295.5,231.0 Q304.5,231 304.5,240.0 L304.5,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M303.8,193.5 L303.8,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M509,193.5 L509.0,217.8 Q509,226.8 500.0,226.8 L313.5,226.8 Q304.5,226.8 304.5,235.8 L304.5,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M304.5,321 L304.5,379" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M304.5,459 L304.5,517" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M304.5,597 L304.5,673" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="247" y="22" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="304.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="304.5" dy="0">API con 10</tspan><tspan x="304.5" dy="19.2">defectos</tspan></text><rect x="22" y="141" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101.5" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101.5" dy="0">Suite de camino</tspan><tspan x="101.5" dy="19.2">feliz</tspan></text><rect x="215" y="149.5" width="176" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="303" y="175.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="303" dy="0">Suite de contrato</tspan></text><rect x="425" y="149.5" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="509" y="175.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="509" dy="0">Suite adversaria</tspan></text><rect x="229.5" y="260" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="304.5" y="285.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="304.5" dy="0">Resultados por</tspan><tspan x="304.5" dy="19.2">defecto</tspan></text><rect x="220.5" y="379" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="304.5" y="404" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="304.5" dy="0">Reparar uno y su</tspan><tspan x="304.5" dy="19.2">prueba de</tspan><tspan x="304.5" dy="19.2">regresión</tspan></text><rect x="229.5" y="517" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="304.5" y="542" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="304.5" dy="0">Reintroducir y</tspan><tspan x="304.5" dy="19.2">comprobar la</tspan><tspan x="304.5" dy="19.2">detección</tspan></text><rect x="220.5" y="673" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="304.5" y="698.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="304.5" dy="0">Nueva prueba que</tspan><tspan x="304.5" dy="19.2">llegue hasta él</tspan></text><rect x="310.5" y="614" width="69" height="42" rx="4" fill="#ffffff"/><text x="345" y="629.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="345" dy="0">defecto</tspan><tspan x="345" dy="17.92">dormido</tspan></text></svg>
