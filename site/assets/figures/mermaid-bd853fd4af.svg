<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 892 314" width="892" height="314" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Dato con un único dueño: actor» … «Memoria y latencia crecen», «Contrapresión: el emisor espera o recibe rechazo» y «Operación indivisible protegida»</title><desc id="d">Diagrama de flujo con 9 pasos. «Dato con un único dueño: actor» lleva a «Buzón de mensajes». «Buzón de mensajes» lleva a «Cola con límite». «Cola con límite» lleva a «Memoria y latencia crecen» (sin límite). «Cola con límite» lleva a «Contrapresión: el emisor espera o recibe rechazo» (con límite). «Dato con un único dueño: actor» lleva a «Tareas hijas atadas a un bloque». «Tareas hijas atadas a un bloque» lleva a «Error: se cancelan las hermanas». «Tareas hijas atadas a un bloque» lleva a «Cancelación: puntos de espera». «Cancelación: puntos de espera» lleva a «Operación indivisible protegida».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="892" height="314" fill="#ffffff"/><path d="M155,157 L177.8,157.0 Q186.8,157 186.8,148.0 L186.8,114.0 Q186.8,105 195.8,105.0 L218.5,105" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M316.5,105 L339.2,105.0 Q348.2,105 348.2,96.0 L348.2,62.0 Q348.2,53 357.2,53.0 L380,53" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M584,53 L706.5,53" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M584,53 L592.0,53.0 Q600,53 600.0,61.0 L600.0,139.0 Q600,148 609.0,148.0 L702,148" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M155,157 L169.0,157.0 Q178,157 178.0,166.0 L178.0,190.5 Q178,199.5 187.0,199.5 L201,199.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M334,199.5 L365.8,199.5 Q374.8,199.5 374.8,190.5 L374.8,157.0 Q374.8,148 383.8,148.0 L415.5,148" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M334,199.5 L357.0,199.5 Q366,199.5 366.0,208.5 L366.0,243.0 Q366,252 375.0,252.0 L398,252" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M566,252 L724,252" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="117" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="88.5" y="142" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="88.5" dy="0">Dato con un</tspan><tspan x="88.5" dy="19.2">único dueño:</tspan><tspan x="88.5" dy="19.2">actor</tspan></text><rect x="218.5" y="74.5" width="98" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="267.5" y="99.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="267.5" dy="0">Buzón de</tspan><tspan x="267.5" dy="19.2">mensajes</tspan></text><polygon points="482,22 584,53 482,84 380,53" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="482" y="57.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="482" dy="0">Cola con límite</tspan></text><rect x="706.5" y="22.5" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="786" y="47.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="786" dy="0">Memoria y</tspan><tspan x="786" dy="19.2">latencia crecen</tspan></text><rect x="702" y="108" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="786" y="133" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="786" dy="0">Contrapresión:</tspan><tspan x="786" dy="19.2">el emisor espera</tspan><tspan x="786" dy="19.2">o recibe rechazo</tspan></text><rect x="201" y="159.5" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="267.5" y="184.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="267.5" dy="0">Tareas hijas</tspan><tspan x="267.5" dy="19.2">atadas a un</tspan><tspan x="267.5" dy="19.2">bloque</tspan></text><rect x="415.5" y="108" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="482" y="133" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="482" dy="0">Error: se</tspan><tspan x="482" dy="19.2">cancelan las</tspan><tspan x="482" dy="19.2">hermanas</tspan></text><rect x="398" y="221.5" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="482" y="246.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="482" dy="0">Cancelación:</tspan><tspan x="482" dy="19.2">puntos de espera</tspan></text><rect x="724" y="212" width="124" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="786" y="237" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="786" dy="0">Operación</tspan><tspan x="786" dy="19.2">indivisible</tspan><tspan x="786" dy="19.2">protegida</tspan></text><rect x="598.2" y="25" width="94" height="24" rx="4" fill="#ffffff"/><text x="645.2" y="40.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="645.2" dy="0">sin límite</tspan></text><rect x="604" y="120" width="94" height="24" rx="4" fill="#ffffff"/><text x="651" y="135.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="651" dy="0">con límite</tspan></text></svg>
