<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 513 758" width="513" height="758" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Regla que debe cumplirse siempre» … «Caso mínimo convertido en prueba de regresión»</title><desc id="d">Diagrama de flujo con 7 pasos. «Regla que debe cumplirse siempre» lleva a «Propiedad ejecutable». «Propiedad ejecutable» lleva a «Generador de casos con semilla». «Generador de casos con semilla» lleva a «¿Falla?». «¿Falla?» lleva a «Revisar el generador: ¿llega a las fronteras?» (no). «¿Falla?» lleva a «Reducir el contraejemplo» (sí). «Reducir el contraejemplo» lleva a «Caso mínimo convertido en prueba de regresión». «Caso mínimo convertido en prueba de regresión» lleva a «Regla que debe cumplirse siempre» (nueva regla).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="513" height="758" fill="#ffffff"/><path d="M152.1,83 L152.1,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M152.1,202 L152.1,223.6 Q152.1,231 159.4,231.0 L159.4,231.0 Q166.8,231 166.8,238.4 L166.8,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M166.8,321 L166.8,341.0 Q166.8,350 175.8,350.0 L181.0,350.0 Q190,350 190.0,359.0 L190,379" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M190,441 L190.0,449.0 Q190,457 182.0,457.0 L119.0,457.0 Q110,457 110.0,466.0 L110,499" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M190,441 L190.0,449.0 Q190,457 198.0,457.0 L294.0,457.0 Q303,457 303.0,466.0 L303,508.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M300.3,569.5 L300.3,637" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M368.6,686.5 L375.6,686.5 Q382.6,686.5 382.6,679.5 L382.6,61.5 Q382.6,52.5 373.6,52.5 L240.1,52.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="64.1" y="22" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="152.1" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="152.1" dy="0">Regla que debe</tspan><tspan x="152.1" dy="19.2">cumplirse siempre</tspan></text><rect x="94.6" y="141" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="152.1" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="152.1" dy="0">Propiedad</tspan><tspan x="152.1" dy="19.2">ejecutable</tspan></text><rect x="74.3" y="260" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="166.8" y="285.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="166.8" dy="0">Generador de casos</tspan><tspan x="166.8" dy="19.2">con semilla</tspan></text><polygon points="190,379 241.5,410 190,441 138.5,410" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="190" y="414.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="190" dy="0">¿Falla?</tspan></text><rect x="22" y="499" width="176" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="110" y="524" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">Revisar el</tspan><tspan x="110" dy="19.2">generador: ¿llega</tspan><tspan x="110" dy="19.2">a las fronteras?</tspan></text><rect x="232" y="508.5" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="303" y="533.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="303" dy="0">Reducir el</tspan><tspan x="303" dy="19.2">contraejemplo</tspan></text><rect x="226.6" y="637" width="142" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="297.6" y="661.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="297.6" dy="0">Caso mínimo</tspan><tspan x="297.6" dy="19.2">convertido en</tspan><tspan x="297.6" dy="19.2">prueba de</tspan><tspan x="297.6" dy="19.2">regresión</tspan></text><rect x="116" y="466" width="29" height="24" rx="4" fill="#ffffff"/><text x="130.5" y="481.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="130.5" dy="0">no</tspan></text><rect x="309" y="470.8" width="29" height="24" rx="4" fill="#ffffff"/><text x="323.5" y="486.7" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="323.5" dy="0">sí</tspan></text><rect x="388.6" y="357.5" width="102" height="24" rx="4" fill="#ffffff"/><text x="439.6" y="373.4" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="439.6" dy="0">nueva regla</tspan></text></svg>
