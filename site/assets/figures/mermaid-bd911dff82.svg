<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 924 1123" width="924" height="1123" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Fallo observado» … «Añadir tarea de regresión»</title><desc id="d">Diagrama de flujo con 14 pasos. «Fallo observado» lleva a «Reproducir con la misma configuración». «Reproducir con la misma configuración» lleva a «Leer la traza». «Leer la traza» lleva a «Patrón». «Patrón» lleva a «Contexto ausente o herramienta ausente» (lecturas repetidas, sin escritura). «Patrón» lleva a «Parada ignorada» (solicitud de cierre repetida). «Patrón» lleva a «Permiso» (escritura denegada). «Patrón» lleva a «Verificación ausente» (cierre sin pruebas). «Patrón» lleva a «Tope bajo» (pocos pasos y sin cierre). «Contexto ausente o herramienta ausente» lleva a «¿Herramienta ofrecida?». «¿Herramienta ofrecida?» lleva a «Herramienta ausente» (no). «¿Herramienta ofrecida?» lleva a «Contexto ausente» (sí). «Herramienta ausente» lleva a «Cambiar solo esa pieza y repetir». «Contexto ausente» lleva a «Cambiar solo esa pieza y repetir». «Parada ignorada» lleva a «Cambiar solo esa pieza y repetir». «Permiso» lleva a «Cambiar solo esa pieza y repetir». «Verificación ausente» lleva a «Cambiar solo esa pieza y repetir». «Tope bajo» lleva a «Cambiar solo esa pieza y repetir». «Cambiar solo esa pieza y repetir» lleva a «Añadir tarea de regresión».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="924" height="1123" fill="#ffffff"/><path d="M500.8,66 L500.8,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M500.8,204 L50