<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 207" width="822" height="207" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Línea base» … «Nueva línea base»</title><desc id="d">Diagrama de flujo con 5 pasos. «Línea base» lleva a «Solicitud de cambio». «Solicitud de cambio» lleva a «Análisis de alcance». «Análisis de alcance» lleva a «Decisión». «Decisión» lleva a «Nueva línea base». «Nueva línea base» lleva a «Línea base» (auditoría). «Análisis de alcance» lleva a «Solicitud de cambio» (demasiado ancho).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="822" height="207" fill="#ffffff"/><path d="M137,94.5 L183,94.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M316,94.5 L362,94.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M486,94.5 L532,94.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M630,94.5 L676,94.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M738,64 L738.0,57.0 Q738,50 731.0,50.0 L88.5,50.0 Q79.5,50 79.5,59.0 L79.5,72.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><path d="M424,125 L424.0,132.0 Q424,139 417.0,139.0 L256.5,139.0 Q249.5,139 249.5,132.0 L249.5,125" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="72.5" width="115" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="79.5" y="98.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="79.5" dy="0">Línea base</tspan></text><rect x="183" y="64" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="249.5" y="89.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="249.5" dy="0">Solicitud de</tspan><tspan x="249.5" dy="19.2">cambio</tspan></text><rect x="362" y="64" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="424" y="89.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="424" dy="0">Análisis de</tspan><tspan x="424" dy="19.2">alcance</tspan></text><rect x="532" y="72.5" width="98" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="581" y="98.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="581" dy="0">Decisión</tspan></text><rect x="676" y="64" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="738" y="89.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="738" dy="0">Nueva línea</tspan><tspan x="738" dy="19.2">base</tspan></text><rect x="365.8" y="22" width="86" height="24" rx="4" fill="#ffffff"/><text x="408.8" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="408.8" dy="0">auditoría</tspan></text><rect x="293.8" y="143" width="86" height="42" rx="4" fill="#ffffff"/><text x="336.8" y="158.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="336.8" dy="0">demasiado</tspan><tspan x="336.8" dy="17.92">ancho</tspan></text></svg>
