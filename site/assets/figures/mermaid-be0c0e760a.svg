<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 836 362" width="836" height="362" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Síncrono o asíncrono» … «Proyecto de flujo tolerante»</title><desc id="d">Diagrama de flujo con 12 pasos. «Síncrono o asíncrono» lleva a «Mensajes, eventos y comandos». «Mensajes, eventos y comandos» lleva a «Colas, tópicos y logs». «Colas, tópicos y logs» lleva a «Entrega, orden y duplicación». «Entrega, orden y duplicación» lleva a «Outbox, inbox y sagas». «Outbox, inbox y sagas» lleva a «CDC, ETL y sincronización». «CDC, ETL y sincronización» lleva a «Webhooks y sondeo». «Webhooks y sondeo» lleva a «Compatibilidad de esquemas». «Compatibilidad de esquemas» lleva a «Capa anticorrupción». «Capa anticorrupción» lleva a «Observabilidad y seguridad». «Observabilidad y seguridad» lleva a «Taller de duplicados». «Taller de duplicados» lleva a «Proyecto de flujo tolerante». «Proyecto de flujo tolerante» lleva a «Síncrono o asíncrono» (incidente o hallazgo).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="836" height="362" fill="#ffffff"/><path d="M154.5,62 L248.5,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M355.5,62 L432,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M600,62 L646,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M730,92.5 L730,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M650.5,190.5 L591,190.5" fill="none" stroke="#32505f" stroke-width="1.8" mark