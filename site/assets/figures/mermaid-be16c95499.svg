<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 813 88" width="813" height="88" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «🎯 Expectativa» … «📈 Aprendizaje»</title><desc id="d">Diagrama de flujo con 5 pasos. «🎯 Expectativa» lleva a «🧠 SLI». «🧠 SLI» lleva a «🛠️ SLO». «🛠️ SLO» lleva a «🔎 Respuesta». «🔎 Respuesta» lleva a «📈 Aprendizaje».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="813" height="88" fill="#ffffff"/><path d="M170,44 L216,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M295,44 L341,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M420,44 L466,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M597,44 L643,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="22" width="148" height="44" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="96" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="96" dy="0">🎯 Expectativa</tspan></text><rect x="216" y="22" width="79" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="255.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="255.5" dy="0">🧠 SLI</tspan></text><rect x="341" y="22" width="79" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="380.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="380.5" dy="0">🛠️ SLO</tspan></text><rect x="466" y="22" width="131" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="531.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="531.5" dy="0">🔎 Respuesta</tspan></text><rect x="643" y="22" width="148" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="717" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="717" dy="0">📈 Aprendizaje</tspan></text></svg>
