<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 554 715" width="554" height="715" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Interacción entre componentes» … «Medir y decidir»</title><desc id="d">Diagrama de flujo con 7 pasos. «Interacción entre componentes» lleva a «¿El emisor necesita la respuesta para continuar?». «¿El emisor necesita la respuesta para continuar?» lleva a «Síncrona: tiempo de espera, reintento acotado, idempotencia» (sí). «¿El emisor necesita la respuesta para continuar?» lleva a «Asíncrona: mensaje durable, consumidor, capacidad» (no). «Síncrona: tiempo de espera, reintento acotado, idempotencia» lleva a «Disponibilidad = producto de eslabones». «Asíncrona: mensaje durable, consumidor, capacidad» lleva a «Retraso y backlog en lugar de error». «Disponibilidad = producto de eslabones» lleva a «Medir y decidir». «Retraso y backlog en lugar de error» lleva a «Medir y decidir». «Medir y decidir» lleva a «Interacción entre componentes» (incidente).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="554" height="715" fill="#ffffff"/><path d="M224.1,83 L224.1,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M224.1,296 L224.1,304.0 Q224.1,312 216.1,312.0 L123.5,312.0 Q114.5,312 114.5,321.0 L114.5,354" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M224.1,296 L224.1,304.0 Q224.1,312 232.1,312.0 L324.5,312.0 Q333.5,312 333.5,321.0 L333.5,354" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M117.7,453 L117.7,511" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M330.3,453 L330.3,520.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M121,591 L121.0,611.0 Q121,620 130.0,620.0 L215.0,620.0 Q224,620 224.0,629.0 L224,649" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M327,581.5 L327.0,606.2 Q327,615.2 318.0,615.2 L233.0,615.2 Q224,615.2 224.0,624.2 L224,649" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M303.5,671 L431.0,671.0 Q440,671 440.0,662.0 L440.0,61.5 Q440,52.5 431.0,52.5 L312.1,52.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="136.1" y="22" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="224.1" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="224.1" dy="0">Interacción entre</tspan><tspan x="224.1" dy="19.2">componentes</tspan></text><polygon points="224.1,141 320.1,218.5 224.1,296 128.1,218.5" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="224.1" y="193.9" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="224.1" dy="0">¿El emisor</tspan><tspan x="224.1" dy="19.2">necesita la</tspan><tspan x="224.1" dy="19.2">respuesta para</tspan><tspan x="224.1" dy="19.2">continuar?</tspan></text><rect x="22" y="354" width="185" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="114.5" y="378.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="114.5" dy="0">Síncrona: tiempo</tspan><tspan x="114.5" dy="19.2">de espera,</tspan><tspan x="114.5" dy="19.2">reintento acotado,</tspan><tspan x="114.5" dy="19.2">idempotencia</tspan></text><rect x="241" y="354" width="185" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="333.5" y="378.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="333.5" dy="0">Asíncrona: mensaje</tspan><tspan x="333.5" dy="19.2">durable,</tspan><tspan x="333.5" dy="19.2">consumidor,</tspan><tspan x="333.5" dy="19.2">capacidad</tspan></text><rect x="37" y="511" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="121" y="536" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="121" dy="0">Disponibilidad =</tspan><tspan x="121" dy="19.2">producto de</tspan><tspan x="121" dy="19.2">eslabones</tspan></text><rect x="239" y="520.5" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="327" y="545.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="327" dy="0">Retraso y backlog</tspan><tspan x="327" dy="19.2">en lugar de error</tspan></text><rect x="144.5" y="649" width="159" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="224" y="675.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="224" dy="0">Medir y decidir</tspan></text><rect x="120.5" y="321" width="29" height="24" rx="4" fill="#ffffff"/><text x="135" y="336.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="135" dy="0">sí</tspan></text><rect x="339.5" y="321" width="29" height="24" rx="4" fill="#ffffff"/><text x="354" y="336.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">no</tspan></text><rect x="446" y="349.8" width="86" height="24" rx="4" fill="#ffffff"/><text x="489" y="365.7" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="489" dy="0">incidente</tspan></text></svg>
