<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 631 381" width="631" height="381" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Riesgos con supuestos» … «Incidente o dato nuevo»</title><desc id="d">Diagrama de flujo con 9 pasos. «Riesgos con supuestos» lleva a «Reparto de horas». «Reparto de horas» lleva a «Nivel de prueba por clase de fallo». «Nivel de prueba por clase de fallo» lleva a «Pruebas con demostración rojo-verde». «Pruebas con demostración rojo-verde» lleva a «Gates: qué bloquea y qué avisa». «Gates: qué bloquea y qué avisa» lleva a «Exclusiones con razón y caducidad». «Exclusiones con razón y caducidad» lleva a «Validador del paquete». «Validador del paquete» lleva a «Simulación del trimestre». «Simulación del trimestre» lleva a «Incidente o dato nuevo». «Incidente o dato nuevo» lleva a «Riesgos con supuestos» (reestimar).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="631" height="381" fill="#ffffff"/><path d="M163.5,62 L227,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M395,62 L445.5,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M525,102 L525,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M458.5,200 L382,200" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M240,200 L181,200" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M101.5,240 L101.5,298" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M172.5,328.5 L236,328.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M386,328.5 L441,328.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M525,298 L525.0,263.0 Q525,254 516.0,254.0 L204.0,254.0 Q195,254 195.0,245.0 L195.0,115.5 Q195,106.5 186.0,106.5 L108.5,106.5 Q101.5,106.5 101.5,99.5 L101.5,92.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="39.5" y="31.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101.5" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101.5" dy="0">Riesgos con</tspan><tspan x="101.5" dy="19.2">supuestos</tspan></text><rect x="227" y="40" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="311" y="66.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="311" dy="0">Reparto de horas</tspan></text><rect x="445.5" y="22" width="159" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="525" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="525" dy="0">Nivel de prueba</tspan><tspan x="525" dy="19.2">por clase de</tspan><tspan x="525" dy="19.2">fallo</tspan></text><rect x="458.5" y="160" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="525" y="185" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="525" dy="0">Pruebas con</tspan><tspan x="525" dy="19.2">demostración</tspan><tspan x="525" dy="19.2">rojo-verde</tspan></text><rect x="240" y="160" width="142" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="311" y="185" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="311" dy="0">Gates: qué</tspan><tspan x="311" dy="19.2">bloquea y qué</tspan><tspan x="311" dy="19.2">avisa</tspan></text><rect x="22" y="160" width="159" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101.5" y="185" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101.5" dy="0">Exclusiones con</tspan><tspan x="101.5" dy="19.2">razón y</tspan><tspan x="101.5" dy="19.2">caducidad</tspan></text><rect x="30.5" y="298" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101.5" y="323.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101.5" dy="0">Validador del</tspan><tspan x="101.5" dy="19.2">paquete</tspan></text><rect x="236" y="298" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="311" y="323.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="311" dy="0">Simulación del</tspan><tspan x="311" dy="19.2">trimestre</tspan></text><rect x="441" y="298" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="525" y="323.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="525" dy="0">Incidente o dato</tspan><tspan x="525" dy="19.2">nuevo</tspan></text><rect x="317" y="258" width="86" height="24" rx="4" fill="#ffffff"/><text x="360" y="273.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="360" dy="0">reestimar</tspan></text></svg>
