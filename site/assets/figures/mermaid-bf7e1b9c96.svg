<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 594 740" width="594" height="740" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Incidente resuelto» … «Sistema cambiado» y «El incidente se repite»</title><desc id="d">Diagrama de flujo con 8 pasos. «Incidente resuelto» lleva a «Línea de tiempo e impacto». «Línea de tiempo e impacto» lleva a «Factores contribuyentes». «Factores contribuyentes» lleva a «Acciones: propietario, fecha, verificación». «Acciones: propietario, fecha, verificación» lleva a «Seguimiento». «Seguimiento» lleva a «Sistema cambiado». «Sistema cambiado» lleva a «Incidente resuelto» (menos recurrencia). «Seguimiento» lleva a «El incidente se repite» (acciones sin cerrar). «Factores contribuyentes» lleva a «Aprendizaje perdido» (culpa o causa única).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="594" height="740" fill="#ffffff"/><path d="M385.9,66 L385.9,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M385.9,185 L385.9,208.7 Q385.9,214 380.5,214.0 L380.5,214.0 Q375.2,214 375.2,219.3 L375.2,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M375.2,304 L375.2,333.0 Q375.2,342 366.2,342.0 L294.4,342.0 Q285.4,342 285.4,351.0 L285.4,380" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M285.4,479 L285.4,499.0 Q285.4,508 294.4,508.0 L305.4,508.0 Q314.4,508 314.4,517.0 L314.4,537" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M314.4,581 L314.4,614.2 Q314.4,623.2 305.4,623.2 L237.0,623.2 Q228,623.2 228.0,632.2 L228,665.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M314.4,581 L314.4,589.0 Q314.4,597 322.4,597.0 L416.5,597.0 Q425.5,597 425.5,606.0 L425.5,657" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M375.2,304 L375.2,312.0 Q375.2,320 383.2,320.0 L438.9,320.0 Q447.9,320 447.9,329.0 L447.9,399" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M144,687.5 L137.0,687.5 Q130,687.5 130.0,680.5 L130.0,53.0 Q130,44 139.0,44.0 L293.4,44" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="293.4" y="22" width="185" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="385.9" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="385.9" dy="0">Incidente resuelto</tspan></text><rect x="297.9" y="124" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="385.9" y="149.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="385.9" dy="0">Línea de tiempo e</tspan><tspan x="385.9" dy="19.2">impacto</tspan></text><rect x="300.2" y="243" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="375.2" y="268.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="375.2" dy="0">Factores</tspan><tspan x="375.2" dy="19.2">contribuyentes</tspan></text><rect x="218.9" y="380" width="133" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="285.4" y="404.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="285.4" dy="0">Acciones:</tspan><tspan x="285.4" dy="19.2">propietario,</tspan><tspan x="285.4" dy="19.2">fecha,</tspan><tspan x="285.4" dy="19.2">verificación</tspan></text><rect x="252.4" y="537" width="124" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="314.4" y="563.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="314.4" dy="0">Seguimiento</tspan></text><rect x="144" y="665.5" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="228" y="691.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="228" dy="0">Sistema cambiado</tspan></text><rect x="346" y="657" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="425.5" y="682.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="425.5" dy="0">El incidente se</tspan><tspan x="425.5" dy="19.2">repite</tspan></text><rect x="385.9" y="399" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="447.9" y="424.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="447.9" dy="0">Aprendizaje</tspan><tspan x="447.9" dy="19.2">perdido</tspan></text><rect x="22" y="344.8" width="102" height="42" rx="4" fill="#ffffff"/><text x="73" y="360.7" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="73" dy="0">menos</tspan><tspan x="73" dy="17.92">recurrencia</tspan></text><rect x="431.5" y="606" width="110" height="42" rx="4" fill="#ffffff"/><text x="486.5" y="621.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="486.5" dy="0">acciones sin</tspan><tspan x="486.5" dy="17.92">cerrar</tspan></text><rect x="453.9" y="338.5" width="118" height="42" rx="4" fill="#ffffff"/><text x="512.9" y="354.4" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512.9" dy="0">culpa o causa</tspan><tspan x="512.9" dy="17.92">única</tspan></text></svg>
