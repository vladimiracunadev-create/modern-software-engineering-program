<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 823 185" width="823" height="185" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Índices ordenados / consultas de rango» … «Índice como proyección»</title><desc id="d">Diagrama de flujo con 5 pasos. «Índices ordenados / consultas de rango» lleva a «Bloom filter». «Bloom filter» lleva a «Sketches / aproximación». «Sketches / aproximación» lleva a «Estructuras persistentes». «Estructuras persistentes» lleva a «Índice como proyección». «Índice como proyección» lleva a «Índices ordenados / consultas de rango» (fallo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="823" height="185" fill="#ffffff"/><path d="M146,113.5 L192,113.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M273,113.5 L319,113.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M452,113.5 L498,113.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M631,113.5 L677,113.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M739,83 L739.0,59.0 Q739,50 730.0,50.0 L91.0,50.0 Q84,50 84.0,57.0 L84,64" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="64" width="124" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="84" y="88.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="84" dy="0">Índices</tspan><tspan x="84" dy="19.2">ordenados /</tspan><tspan x="84" dy="19.2">consultas</tspan><tspan x="84" dy="19.2">de rango</tspan></text><rect x="192" y="83" width="81" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="232.5" y="108.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="232.5" dy="0">Bloom</tspan><tspan x="232.5" dy="19.2">filter</tspan></text><rect x="319" y="83" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="385.5" y="108.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="385.5" dy="0">Sketches /</tspan><tspan x="385.5" dy="19.2">aproximación</tspan></text><rect x="498" y="83" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="564.5" y="108.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="564.5" dy="0">Estructuras</tspan><tspan x="564.5" dy="19.2">persistentes</tspan></text><rect x="677" y="83" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="739" y="108.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="739" dy="0">Índice como</tspan><tspan x="739" dy="19.2">proyección</tspan></text><rect x="348.5" y="22" width="126" height="24" rx="4" fill="#ffffff"/><text x="411.5" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="411.5" dy="0">fallo o cambio</tspan></text></svg>
