<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 777 247" width="777" height="247" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Tarea de quien lee» … «Prueba de recorrido»</title><desc id="d">Diagrama de flujo con 5 pasos. «Tarea de quien lee» lleva a «Audiencia y lo que ya sabe». «Audiencia y lo que ya sabe» lleva a «Vista de la verdad». «Fuente única» lleva a «Vista de la verdad». «Vista de la verdad» lleva a «Prueba de recorrido». «Prueba de recorrido» lleva a «Tarea de quien lee» (no encuentra o no entiende). «Fuente única» lleva a «Vista de la verdad» (cambia la política).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="777" height="247" fill="#ffffff"/><path d="M172,93.5 L186.0,93.5 Q195,93.5 195.0,84.5 L195.0,61.5 Q195,52.5 204.0,52.5 L218,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M368,52.5 L414.0,52.5 Q423,52.5 423.0,61.5 L423.0,103.8 Q423,112.8 432.0,112.8 L478,112.8" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M359.5,143 L409.8,143.0 Q418.8,143 418.8,134.0 L418.8,121.8 Q418.8,112.8 427.8,112.8 L478,112.8" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M602,112.8 L648,112.8" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M359.5,143 L367.5,143.0 Q375.5,143 375.5,135.0 L375.5,121.8 Q375.5,112.8 384.5,112.8 L478,112.8" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M701.5,143.3 L701.5,170.0 Q701.5,179 692.5,179.0 L106.0,179.0 Q97,179 97.0,170.0 L97,124" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="63" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="97" y="88.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="97" dy="0">Tarea de quien</tspan><tspan x="97" dy="19.2">lee</tspan></text><rect x="218" y="22" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="293" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="293" dy="0">Audiencia y lo</tspan><tspan x="293" dy="19.2">que ya sabe</tspan></text><rect x="478" y="82.3" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="540" y="107.4" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="540" dy="0">Vista de la</tspan><tspan x="540" dy="19.2">verdad</tspan></text><rect x="226.5" y="121" width="133" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="293" y="147.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="293" dy="0">Fuente única</tspan></text><rect x="648" y="82.3" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="701.5" y="107.4" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="701.5" dy="0">Prueba de</tspan><tspan x="701.5" dy="19.2">recorrido</tspan></text><rect x="336.2" y="183" width="126" height="42" rx="4" fill="#ffffff"/><text x="399.2" y="198.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="399.2" dy="0">no encuentra o</tspan><tspan x="399.2" dy="17.92">no entiende</tspan></text><rect x="431.8" y="31.8" width="86" height="42" rx="4" fill="#ffffff"/><text x="474.8" y="47.7" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="474.8" dy="0">cambia la</tspan><tspan x="474.8"