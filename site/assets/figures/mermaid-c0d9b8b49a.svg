<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 569 252" width="569" height="252" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Texto de requisitos» … «Pregunta al autor»</title><desc id="d">Diagrama de flujo con 5 pasos. «Texto de requisitos» lleva a «Ambigüedad». «Ambigüedad» lleva a «Pregunta al autor». «Texto de requisitos» lleva a «Contradicción». «Contradicción» lleva a «Pregunta al autor». «Texto de requisitos» lleva a «Incompletitud». «Incompletitud» lleva a «Pregunta al autor». «Pregunta al autor» lleva a «Texto de requisitos» (decisión).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="569" height="252" fill="#ffffff"/><path d="M137,126 L157.8,126.0 Q166.8,126 166.8,117.0 L166.8,53.0 Q166.8,44 175.8,44.0 L196.5,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M311.5,44 L332.2,44.0 Q341.2,44 341.2,53.0 L341.2,117.0 Q341.2,126 350.2,126.0 L371,126" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M137,126 L183,126" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M325,126 L371,126" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M137,126 L151.0,126.0 Q160,126 160.0,135.0 L160.0,199.0 Q160,208 169.0,208.0 L183,208" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M325,208 L339.0,208.0 Q348,208 348.0,199.0 L348.0,135.0 Q348,126 357.0,126.0 L371,126" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M459,148 L459.0,161.5 Q459,170.5 450.