<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 788 105" width="788" height="105" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «🎯 Tarea» … «📈 Prevención»</title><desc id="d">Diagrama de flujo con 5 pasos. «🎯 Tarea» lleva a «🧠 Barrera». «🧠 Barrera» lleva a «🛠️ Patrón accesible». «🛠️ Patrón accesible» lleva a «🔎 Prueba». «🔎 Prueba» lleva a «📈 Prevención».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="788" height="105" fill="#ffffff"/><path d="M118,52.5 L164,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M277,52.5 L323,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M430,52.5 L476,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M581,52.5 L627,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="30.5" width="96" height="44" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="70" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="70" dy="0">🎯 Tarea</tspan></text><rect x="164" y="30.5" width="113" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="220.5" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="220.5" dy="0">🧠 Barrera</tspan></text><rect x="323" y="22" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="376.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="376.5" dy="0">🛠️ Patrón</tspan><tspan x="376.5" dy="19.2">accesible</tspan></text><rect x="476" y="30.5" width="105" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="528.5" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="528.5" dy="0">🔎 Prueba</tspan></text><rect x="627" y="30.5" width="139" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="696.5" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="696.5" dy="0">📈 Prevención</tspan></text></svg>
