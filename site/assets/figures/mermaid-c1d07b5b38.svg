<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 491 566" width="491" height="566" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Solicitud» … «Revisión de una persona»</title><desc id="d">Diagrama de flujo con 7 pasos. «Solicitud» lleva a «Cola» (fila + outbox). «Cola» lleva a «Trabajador: toma con visibilidad». «Trabajador: toma con visibilidad» lleva a «Cola» (éxito: confirma). «Trabajador: toma con visibilidad» lleva a «Reaparece tras el tiempo de visibilidad» (cae). «Reaparece tras el tiempo de visibilidad» lleva a «Cola». «Trabajador: toma con visibilidad» lleva a «Cola de muertos» (falla N veces). «Cola de muertos» lleva a «Revisión de una persona». «Cola» lleva a «Estado consultable».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="491" height="566" fill="#ffffff"/><path d="M284.1,66 L284.1,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M284.1,168 L284.1,188.0 Q284.1,197 275.1,197.0 L175.0,197.0 Q166,197 166.0,206.0 L166,226" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M166,287 L166.0,295.0 Q166,303 158.0,303.0 L119.0,303.0 Q110,303 110.0,312.0 L110,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M166,287 L166.0,295.0 Q166,303 174.0,303.0 L302.5,303.0 Q311.5,303 311.5,312.0 L311.5,363" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M314.9,407 L314.9,483" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M284.1,168 L284.1,192.2 Q284.1,201.2 293.1,201.2 L