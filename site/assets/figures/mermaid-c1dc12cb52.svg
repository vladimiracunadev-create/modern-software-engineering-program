<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 361 922" width="361" height="922" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Edición sin conexión» … «Aviso a la persona»</title><desc id="d">Diagrama de flujo con 9 pasos. «Edición sin conexión» lleva a «Registro de operaciones». «Registro de operaciones» lleva a «Envío con identificador». «Envío con identificador» lleva a «Servidor aplica una vez». «Servidor aplica una vez» lleva a «Fusión con otras copias». «Fusión con otras copias» lleva a «Concurrentes?». «Concurrentes?» lleva a «Orden causal» (no). «Concurrentes?» lleva a «Política de conflicto» (sí). «Política de conflicto» lleva a «Aviso a la persona».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="361" height="922" fill="#ffffff"/><path d="M105.3,83 L105.3,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M108.2,202 L108.2,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M111.1,321 L111.1,345.2 Q111.1,350 115.8,350.0 L115.8,350.0 Q120.6,350 120.6,354.8 L120.6,379" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M120.6,440 L120.6,461.9 Q120.6,469 127.8,469.0 L127.8,469.0 Q134.9,469 134.9,476.1 L134.9,498" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M134.9,559 L134.9,579.0 Q134.9,588 143.9,588.0 L146.5,588.0 Q155.5,588 155.5,597.0 L155.5,617" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M155.5,679 L155.5,687.0 Q155.5,695 147.5,695.0 L97.5,695.0 Q88.5,695 88.5,704.0 L88.5,745.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M155.5,679 L155.5,687.0 Q155.5,695 163.5,695.0 L242.0,695.0 Q251,695 251.0,704.0 L251,737" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M248.7,798 L248.7,856" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="43.3" y="22" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="105.3" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="105.3" dy="0">Edición sin</tspan><tspan x="105.3" dy="19.2">conexión</tspan></text><rect x="43.3" y="141" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="105.3" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="105.3" dy="0">Registro de</tspan><tspan x="105.3" dy="19.2">operaciones</tspan></text><rect x="40.1" y="260" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="111.1" y="285.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="111.1" dy="0">Envío con</tspan><tspan x="111.1" dy="19.2">identificador</tspan></text><rect x="41.1" y="379" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="120.6" y="404.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="120.6" dy="0">Servidor aplica</tspan><tspan x="120.6" dy="19.2">una vez</tspan></text><rect x="50.9" y="498" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="134.9" y="523.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="134.9" dy="0">Fusión con otras</tspan><tspan x="134.9" dy="19.2">copias</tspan></text><polygon points="155.5,617 245,648 155.5,679 66,648" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="155.5" y="652.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="155.5" dy="0">Concurrentes?</tspan></text><rect x="22" y="745.5" width="133" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="88.5" y="771.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="88.5" dy="0">Orden causal</tspan></text><rect x="189" y="737" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="251" y="762.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="251" dy="0">Política de</tspan><tspan x="251" dy="19.2">conflicto</tspan></text><rect x="154" y="856" width="185" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="246.5" y="882.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="246.5" dy="0">Aviso a la persona</tspan></text><rect x="94.5" y="708.2" width="29" height="24" rx="4" fill="#ffffff"/><text x="109" y="724.1" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="109" dy="0">no</tspan></text><rect x="257" y="704" width="29" height="24" rx="4" fill="#ffffff"/><text x="271.5" y="719.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="271.5" dy="0">sí</tspan></text></svg>
