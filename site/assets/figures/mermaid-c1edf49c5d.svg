<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 696 206" width="696" height="206" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Fuente» … «Ejecución»</title><desc id="d">Diagrama de flujo con 7 pasos. «Fuente» lleva a «Tokens y AST». «Tokens y AST» lleva a «IR o bytecode». «IR o bytecode» lleva a «Optimización». «Optimización» lleva a «Código destino». «Código destino» lleva a «Enlace y carga». «Enlace y carga» lleva a «Ejecución». «Ejecución» lleva a «Optimización» (perfil JIT).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="696" height="206" fill="#ffffff"/><path d="M103,60 L149,60" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M282,60 L332,60" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M474,60 L532.5,60" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M599,82 L599,140" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M524,162 L478,162" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M328,162 L269,162" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M215.5,140 L215.5,105.0 Q215.5,96 224.5,96.0 L509.5,96.0 Q518.5,96 518.5,87.0 L518.5,33.0 Q518.5,24 527.5,24.0 L592.0,24.0 Q599,24 599.0,31.0 L599,38" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="38" width="81" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="62.5" y="64.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="62.5" dy="0">Fuente</tspan></text><rect x="149" y="38" width="133" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="215.5" y="64.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="215.5" dy="0">Tokens y AST</tspan></text><rect x="332" y="38" width="142" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="403" y="64.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="403" dy="0">IR o bytecode</tspan></text><rect x="532.5" y="38" width="133" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="599" y="64.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="599" dy="0">Optimización</tspan></text><rect x="524" y="140" width="150" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="599" y="166.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="599" dy="0">Código destino</tspan></text><rect x="328" y="140" width="150" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="403" y="166.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="403" dy="0">Enlace y carga</tspan></text><rect x="162" y="140" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="215.5" y="166.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="215.5" dy="0">Ejecución</tspan></text><rect x="320" y="100" width="94" height="24" rx="4" fill="#ffffff"/><text x="367" y="115.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="367" dy="0">perfil JIT</tspan></text></svg>
