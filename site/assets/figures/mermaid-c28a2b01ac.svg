<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 627 818" width="627" height="818" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Hecho o intención del dominio» … «Revisar contenido»</title><desc id="d">Diagrama de flujo con 8 pasos. «Hecho o intención del dominio» lleva a «¿Quién debe actuar?». «¿Quién debe actuar?» lleva a «Comando: imperativo, puede rechazarse» (un destinatario concreto). «¿Quién debe actuar?» lleva a «Evento: pasado, inmutable» (quien le interese). «¿Quién debe actuar?» lleva a «Documento: estado con versión» (se copian datos). «Comando: imperativo, puede rechazarse» lleva a «Sobre: id, tipo, origen, secuencia, correlación». «Evento: pasado, inmutable» lleva a «Sobre: id, tipo, origen, secuencia, correlación». «Documento: estado con versión» lleva a «Sobre: id, tipo, origen, secuencia, correlación». «Sobre: id, tipo, origen, secuencia, correlación» lleva a «Contenido mínimo suficiente». «Contenido mínimo suficiente» lleva a «Revisar contenido» (consumidor llama de vuelta).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="627" height="818" fill="#ffffff"/><path d="M311.5,83 L311.5,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M311.5,227 L311.5,235.0 Q311.5,243 303.5,243.0 L119.0,243.0 Q110,243 110.0,252.0 L110,321" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M311.5,227 L311.5,330.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M311.5,227 L311.5,235.0 Q311.5,243 319.5,243.0 L504.0,243.0 Q513,243 513.0,252.0 L513,330.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M110,401 L110.0,421.0 Q110,430 119.0,430.0 L302.5,430.0 Q311.5,430 311.5,439.0 L311.5,459" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M311.5,391.5 L311.5,459" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M513,391.5 L513.0,416.2 Q513,425.2 504.0,425.2 L320.5,425.2 Q311.5,425.2 311.5,434.2 L311.5,459" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M311.5,539 L311.5,597" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M311.5,658 L311.5,752" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="223.5" y="22" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="311.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="311.5" dy="0">Hecho o intención</tspan><tspan x="311.5" dy="19.2">del dominio</tspan></text><polygon points="311.5,141 407.5,184 311.5,227 215.5,184" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="311.5" y="178.6" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="311.5" dy="0">¿Quién debe</tspan><tspan x="311.5" dy="19.2">actuar?</tspan></text><rect x="22" y="321" width="176" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="110" y="346" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">Comando:</tspan><tspan x="110" dy="19.2">imperativo, puede</tspan><tspan x="110" dy="19.2">rechazarse</tspan></text><rect x="232" y="330.5" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="311.5" y="355.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="311.5" dy="0">Evento: pasado,</tspan><tspan x="311.5" dy="19.2">inmutable</tspan></text><rect x="