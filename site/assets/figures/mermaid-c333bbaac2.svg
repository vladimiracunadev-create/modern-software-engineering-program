<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 302" width="770" height="302" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Mundo físico» … «Actuador, pantalla o radio» y «Prueba en el equipo de desarrollo»</title><desc id="d">Diagrama de flujo con 7 pasos. «Mundo físico» lleva a «Sensor y periférico». «Sensor y periférico» lleva a «Capa de acceso al hardware». «Capa de acceso al hardware» lleva a «Lógica del dispositivo». «Lógica del dispositivo» lleva a «Actuador, pantalla o radio». «Lógica del dispositivo» lleva a «Prueba en el equipo de desarrollo». «Capa de acceso al hardware» lleva a «Prueba con hardware». «Prueba en el equipo de desarrollo» lleva a «Lógica del dispositivo» (defecto de lógica). «Prueba con hardware» lleva a «Capa de acceso al hardware» (defecto de integración).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="770" height="302" fill="#ffffff"/><path d="M103,130.5 L149,130.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M264,130.5 L310,130.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M417,130.5 L431.0,130.5 Q440,130.5 440.0,121.5 L440.0,71.0 Q440,62 449.0,62.0 L463,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M587,62 L633,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M587,62 L601.0,62.0 Q610,62 610.0,71.0 L610.0,180.5 Q610,189.5 619.0,189.5 L633,189.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M417,130.5 L433.2,130.5 Q442.2,130.5 442.2,139.5 L442.2,180.5 Q442.2,189.5 451.2,189.5 L467.5,189.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M690.5,140 L690.5,125.0 Q690.5,116 681.5,116.0 L534.0,116.0 Q525,116 525.0,107.0 L525,92.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><path d="M525,220 L525.0,227.0 Q525,234 518.0,234.0 L372.5,234.0 Q363.5,234 363.5,225.0 L363.5,170.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="100" width="81" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="62.5" y="125.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="62.5" dy="0">Mundo</tspan><tspan x="62.5" dy="19.2">físico</tspan></text><rect x="149" y="100" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="206.5" y="125.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="206.5" dy="0">Sensor y</tspan><tspan x="206.5" dy="19.2">periférico</tspan></text><rect x="310" y="90.5" width="107" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="363.5" y="115.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="363.5" dy="0">Capa de</tspan><tspan x="363.5" dy="19.2">acceso al</tspan><tspan x="363.5" dy="19.2">hardware</tspan></text><rect x="463" y="31.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="525" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="525" dy="0">Lógica del</tspan><tspan x="525" dy="19.2">dispositivo</tspan></text><rect x="633" y="22" width="115" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="690.5" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="690.5" dy="0">Actuador,</tspan><tspan x="690.5" dy="19.2">pantalla o</tspan><tspan x="690.5" dy="19.2">radio</tspan></text><rect x="633" y="140" width="115" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="690.5" y="164.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="690.5" dy="0">Prueba en</tspan><tspan x="690.5" dy="19.2">el equipo</tspan><tspan x="690.5" dy="19.2">de</tspan><tspan x="690.5" dy="19.2">desarrollo</tspan></text><rect x="467.5" y="159" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="525" y="184.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="525" dy="0">Prueba con</tspan><tspan x="525" dy="19.2">hardware</tspan></text><rect x="512.8" y="105" width="94" height="42" rx="4" fill="#ffffff"/><text x="559.8" y="120.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="559.8" dy="0">defecto de</tspan><tspan x="559.8" dy="17.92">lógica</tspan></text><rect x="393.2" y="238" width="102" height="42" rx="4" fill="#ffffff"/><text x="444.2" y="253.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="444.2" dy="0">defecto de</tspan><tspan x="444.2" dy="17.92">integración</tspan></text></svg>
