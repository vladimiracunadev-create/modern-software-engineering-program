<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 775 362" width="775" height="362" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Drivers y escenarios» … «Dossier verificable»</title><desc id="d">Diagrama de flujo con 12 pasos. «Drivers y escenarios» lleva a «Vistas coherentes». «Vistas coherentes» lleva a «Agrupar en modulos o servicios». «Agrupar en modulos o servicios» lleva a «Dependencias hacia adentro». «Dependencias hacia adentro» lleva a «Dominio y contextos». «Dominio y contextos» lleva a «Eventos y consistencia». «Eventos y consistencia» lleva a «Estilos de ejecucion». «Estilos de ejecucion» lleva a «Funciones de aptitud». «Funciones de aptitud» lleva a «ADR y alternativas». «ADR y alternativas» lleva a «Equipos y colas». «Equipos y colas» lleva a «Revision contra escenarios». «Revision contra escenarios» lleva a «Dossier verificable». «Dossier verificable» lleva a «Drivers y escenarios» (un escenario falla).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="775" height="362" fill="#ffffff"/><path d="M146,62 L223,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M338,62 L428,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M543,62 L611,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M682,92.5 L682,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M628.5,190.5 L552,190.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M419,190.5 L338,190.5" fill="none" st