dencias</tspan><tspan x="682" dy="19.2">hacia adentro</tspan></text><rect x="628.5" y="160" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="682" y="185.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="682" dy="0">Dominio y</tspan><tspan x="682" dy="19.2">contextos</tspan></text><rect x="419" y="160" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="485.5" y="185.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="485.5" dy="0">Eventos y</tspan><tspan x="485.5" dy="19.2">consistencia</tspan></text><rect x="223" y="160" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="280.5" y="185.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="280.5" dy="0">Estilos de</tspan><tspan x="280.5" dy="19.2">ejecucion</tspan></text><rect x="22" y="160" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="88.5" y="185.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="88.5" dy="0">Funciones de</tspan><tspan x="88.5" dy="19.2">aptitud</tspan></text><rect x="22" y="279" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="88.5" y="304.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="88.5" dy="0">ADR y</tspan><tspan x="88.5" dy="19.2">alternativas</tspan></text><rect x="201" y="287.5" width="159" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="280.5" y="313.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="280.5" dy="0">Equipos y colas</tspan></text><rect x="406" y="279" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="485.5" y="304.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="485.5" 