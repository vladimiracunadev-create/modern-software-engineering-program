<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 939 643" width="939" height="643" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Cambio propuesto», «Refactorización», «Código» y «Comentario» … «Fatiga: se ignoran» y «Defecto llega»</title><desc id="d">Diagrama de flujo con 17 pasos. «Cambio propuesto» lleva a «Revisor automático». «Cambio propuesto» lleva a «Revisión humana». «Revisor automático» lleva a «Umbral». «Umbral» lleva a «Muchas alarmas falsas» (bajo). «Umbral» lleva a «Defectos omitidos» (alto). «Muchas alarmas falsas» lleva a «Fatiga: se ignoran». «Defectos omitidos» lleva a «Defecto llega». «Refactorización» lleva a «Comparación diferencial». «Comparación diferencial» lleva a «Entradas suficientes». «Entradas suficientes» lleva a «Diferencia rara sin detectar» (no). «Entradas suficientes» lleva a «Equivalencia plausible» (sí). «Código» lleva a «Explicación». «Comentario» lleva a «Explicación». «Explicación» lleva a «Error expresado con aplomo» (hereda comentario).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="939" height="643" fill="#ffffff"/><path d="M337.2,83 L337.2,103.0 Q337.2,112 328.2,112.0 L309.0,112.0 Q300,112 300.0,121.0 L300,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M337.2,83 L337.2,103.0 Q337.2,112 346.2,112.0 L431.5,112.0 Q440.5,112 440.5,121.0 L440.5,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M300,202 L300.0,237.0 Q300,246 309.0,246.0 L313.3,246.0 Q322.3,246 322.3,255.0 L322.3,290" fill="none" stroke="#32505f" stroke-width="1.8"