" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="603.8" dy="0">Defecto llega</tspan></text><rect x="473" y="30.5" width="159" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="552.5" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="552.5" dy="0">Refactorización</tspan></text><rect x="523.5" y="141" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="585.5" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="585.5" dy="0">Comparación</tspan><tspan x="585.5" dy="19.2">diferencial</tspan></text><polygon points="588.3,278 684.3,321 588.3,364 492.3,321" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="588.3" y="315.6" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="588.3" dy="0">Entradas</tspan><tspan x="588.3" dy="19.2">suficientes</tspan></text><rect x="402.6" y="422" width="115" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="460.1" y="447" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="460.1" dy="0">Diferencia</tspan><tspan x="460.1" dy="19.2">rara sin</tspan><tspan x="460.1" dy="19.2">detectar</tspan></text><rect x="683.6" y="431.5" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="750.1" y="456.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="750.1" dy="0">Equivalencia</tspan><tspan x="750.1" dy="19.2">plausible</tspan></text><rect x="686.1" y="30.5" width="81" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="726.6" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="726.6" dy="0">Código</tspan></text><rect x="697.6" y="149.5" width="124" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="759.6" y="175.7" font-size="15" text-a