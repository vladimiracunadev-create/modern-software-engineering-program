<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 493 823" width="493" height="823" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Función que admite un único titular» … «Testigo de cerco en el recurso»</title><desc id="d">Diagrama de flujo con 9 pasos. «Función que admite un único titular» lleva a «Elegir titular». «Elegir titular» lleva a «Regla». «Regla» lleva a «Varios líderes en una partición» (el mayor que veo). «Regla» lleva a «A lo sumo un líder por mandato» (mayoría con mandato). «A lo sumo un líder por mandato» lleva a «Arrendamiento: el titular puede caducar». «Arrendamiento: el titular puede caducar» lleva a «Pausa del titular». «Pausa del titular» lleva a «Testigo de cerco en el recurso». «A lo sumo un líder por mandato» lleva a «Tamaño del grupo: 2f+1 tolera f caídas».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="493" height="823" fill="#ffffff"/><path d="M182.4,83 L182.4,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M182.4,185 L182.4,205.0 Q182.4,214 191.4,214.0 L193.1,214.0 Q202.1,214 202.1,223.0 L202.1,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M202.1,305 L202.1,313.0 Q202.1,321 194.1,321.0 L119.0,321.0 Q110,321 110.0,330.0 L110,381" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M202.1,305 L202.1,313.0 Q202.1,321 210.1,321.0 L315.5,321.0 Q324.5,321 324.5,330.0 L324.5,381" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M324.5,442 L324.5,462.0 Q324.5,471 315.5,471.0 L181.3,471.0 Q172.3,471 172.3,480.0 L172.3,500" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M172.3,580 L172.3,601.9 Q172.3,609 165.2,609.0 L165.2,609.0 Q158.1,609 158.1,616.1 L158.1,638" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M158.1,682 L158.1,706.4 Q158.1,711 153.4,711.0 L153.4,711.0 Q148.8,711 148.8,715.6 L148.8,740" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M324.5,442 L324.5,462.0 Q324.5,471 333.5,471.0 L373.3,471.0 Q382.3,471 382.3,480.0 L382.3,500" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="89.9" y="22" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="182.4" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="182.4" dy="0">Función que admite</tspan><tspan x="182.4" dy="19.2">un único titular</tspan></text><rect x="107.4" y="141" width="150" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="182.4" y="167.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="182.4" dy="0">Elegir titular</tspan></text><polygon points="202.1,243 241.1,274 202.1,305 163.1,274" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="202.1" y="278.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="202.1" dy="0">Regla</tspan></text><rect x="22" y="381" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="110" y="406.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">Varios líderes en</tspan><tspan x="110" dy="19.2">una partición</tspan></text><rect x="232" y="381" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="324.5" y="406.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="324.5" dy="0">A lo sumo un líder</tspan><tspan x="324.5" dy="19.2">por mandato</tspan></text><rect x="84.3" y="500" width="176" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="172.3" y="525" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="172.3" dy="0">Arrendamiento: el</tspan><tspan x="172.3" dy="19.2">titular puede</tspan><tspan x="172.3" dy="19.2">caducar</tspan></text><rect x="70.1" y="638" width="176" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="158.1" y="664.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="158.1" dy="0">Pausa del titular</tspan></text><rect x="64.8" y="740" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="148.8" y="765.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="148.8" dy="0">Testigo de cerco</tspan><tspan x="148.8" dy="19.2">en el recurso</tspan></text><rect x="294.3" y="500" width="176" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="382.3" y="525" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="382.3" dy="0">Tamaño del grupo:</tspan><tspan x="382.3" dy="19.2">2f+1 tolera f</tspan><tspan x="382.3" dy="19.2">caídas</tspan></text><rect x="116" y="330" width="110" height="42" rx="4" fill="#ffffff"/><text x="171" y="345.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="171" dy="0">el mayor que</tspan><tspan x="171" dy="17.92">veo</tspan></text><rect x="330.5" y="330" width="102" height="42" rx="4" fill="#ffffff"/><text x="381.5" y="345.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="381.5" dy="0">mayoría con</tspan><tspan x="381.5" dy="17.92">mandato</tspan></text></svg>
