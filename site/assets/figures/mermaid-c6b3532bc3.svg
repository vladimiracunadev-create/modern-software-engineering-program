<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 754 720" width="754" height="720" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Aplicación», «Escritor versión N+1» y «Lector versión N» … «Reparar desde la fuente de verdad»</title><desc id="d">Diagrama de flujo con 11 pasos. «Aplicación» lleva a «Almacén antiguo». «Aplicación» lleva a «Bandeja de salida en la misma transacción». «Bandeja de salida en la misma transacción» lleva a «Reproductor con orden y reintentos». «Reproductor con orden y reintentos» lleva a «Almacén nuevo». «Almacén antiguo» lleva a «Reconciliación periódica». «Almacén nuevo» lleva a «Reconciliación periódica». «Reconciliación periódica» lleva a «Reparar desde la fuente de verdad» (diferencias). «Reparar desde la fuente de verdad» lleva a «Almacén nuevo». «Escritor versión N+1» lleva a «Contrato de datos». «Lector versión N» lleva a «Contrato de datos». «Contrato de datos» lleva a «Cambio compatible por pasos» (celda que falla).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="754" height="720" fill="#ffffff"/><path d="M143.4,74.5 L143.4,107.8 Q143.4,116.8 152.4,116.8 L302.5,116.8 Q311.5,116.8 311.5,125.8 L311.5,159" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M143.4,74.5 L143.4,98.8 Q143.4,107.8 134.4,107.8 L119.0,107.8 Q110,107.8 110.0,116.8 L110,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M110,221 L110.0,250.0 Q110,259 119.0,259.0 L185.2,259.0 Q194.2,259 194.2,268.0 L194.2,297" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M194.2,358 L194.2,378.0 Q194.2,387 203.2,387.0 L258.0,387.0 Q267,387 267.0,396.0 L267,416" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M391,181 L398.1,181.0 Q405.3,181 405.3,188.2 L405.3,541.5 Q405.3,548.5 398.3,548.5 L391.3,548.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M267,460 L267.0,480.0 Q267,489 276.0,489.0 L307.3,489.0 Q316.3,489 316.3,498.0 L316.3,518" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M316.3,579 L316.3,587.0 Q316.3,595 324.3,595.0 L332.1,595.0 Q341.1,595 341.1,604.0 L341.1,637" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M445.7,83 L445.7,112.0 Q445.7,121 454.7,121.0 L504.0,121.0 Q513,121 513.0,130.0 L513,159" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M647.7,74.5 L647.7,107.8 Q647.7,116.8 638.7,116.8 L522.0,116.8 Q513,116.8 513.0,125.8 L513,159" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M513,203 L513.0,213.3 Q513,219 518.7,219.0 L518.7,219.0 Q524.4,219 524.4,224.7 L524.4,297" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M257.1,667.5 L191.0,667.5 Q182,667.5 182.0,658.5 L182.0,445.0 Q182,438 189.0,438.0 L196,438" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="85.9" y="30.5" width="115" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="143.4" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="143.4" dy="0">Aplicación</tspan></text><rect x="232" y="159" width="159" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="311.5" y="185.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="311.5" dy="0">Almacén antiguo</tspan></text><rect x="22" y="141" width="176" height="80" rx