/text><rect x="563.7" y="30.5" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="647.7" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="647.7" dy="0">Lector versión N</tspan></text><rect x="436.4" y="297" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="524.4" y="322.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="524.4" dy="0">Cambio compatible</tspan><tspan x="524.4" dy="19.2">por pasos</tspan></text><rect x="347.1" y="604" width="102" height="24" rx="4" fill="#ffffff"/><text x="398.1" y="619.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="398.1" dy="0">diferencias</tspan></text><rect x="530.4" y="237" width="86" height="42" rx="4" fill="#ffffff"/><text x="573.4" y="252.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="573.4" dy="0">celda que</tspan><tspan x="573.4" dy="17.92">falla</tspan></text></svg>
