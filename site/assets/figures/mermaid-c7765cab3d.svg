<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 909 659" width="909" height="659" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Petición» … «Plan, tareas, implementación, convergencia»</title><desc id="d">Diagrama de flujo con 10 pasos. «Petición» lleva a «Qué situación es». «Qué situación es» lleva a «Proyecto nuevo: especificación completa» (no existe el sistema). «Qué situación es» lleva a «Cambio sobre código existente: mapa y caracterización» (existe y se cambia). «Qué situación es» lleva a «Corrección: diagnóstico, arreglo, prueba» (comportamiento roto). «Qué situación es» lleva a «Evaluación de idea: evidencia y decisión» (no se sabe si conviene). «Cambio sobre código existente: mapa y caracterización» lleva a «Especificación del cambio». «Proyecto nuevo: especificación completa» lleva a «Especificación del cambio». «Corrección: diagnóstico, arreglo, prueba» lleva a «Veredicto: verificado, parcial o fallido». «Evaluación de idea: evidencia y decisión» lleva a «Especificación del cambio» (seguir). «Evaluación de idea: evidencia y decisión» lleva a «Evaluación de idea: evidencia y decisión» (aclarar). «Evaluación de idea: evidencia y decisión» lleva a «No construir» (parar). «Especificación del cambio» lleva a «Plan, tareas, implementación, convergencia».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="909" height="659" fill="#ffffff"/><path d="M399.7,66 L399.7,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M399.7,186 L399.7,194.0 Q399.7,202 391.7,202.0 L110.5,202.0 Q101.5,202 101.5,211.0 L101.5,271