" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="521.3" y="444" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="521.3" dy="0">Veredicto:</tspan><tspan x="521.3" dy="19.2">verificado,</tspan><tspan x="521.3" dy="19.2">parcial o fallido</tspan></text><rect x="643.3" y="437" width="133" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="709.8" y="463.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="709.8" dy="0">No construir</tspan></text><rect x="225.8" y="557" width="159" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="305.3" y="582" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="305.3" dy="0">Plan, tareas,</tspan><tspan x="305.3" dy="19.2">implementación,</tspan><tspan x="305.3" dy="19.2">convergencia</tspan></text><rect x="107.5" y="215.8" width="110" height="42" rx="4" fill="#ffffff"/><text x="162.5" y="231.7" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="162.5" dy="0">no existe el</tspan><tspan x="162.5" dy="17.92">sistema</tspan></text><rect x="309" y="211" width="102" height="42" rx="4" fill="#ffffff"/><text x="360" y="226.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="360" dy="0">existe y se</tspan><tspan x="360" dy="17.92">cambia</tspan></text><rect x="510.5" y="215.8" width="126" height="42" rx="4" fill="#ffffff"/><text x="573.5" y="231.7" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="573.5" dy="0">comportamiento</tspan><tspan x="573.5" dy="17.92">roto</tspan></text><rect x="712" y="201.8" width="118" height="42" rx="4" fill="#ffffff"/><text x="771" y="217.7" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="771" dy="0">no se sabe si</tspan><tspan x="771" dy="17.92">conviene</tspan></text><rect x="312.8" y="386" width="61" height="24" rx="4" fill="#ffff