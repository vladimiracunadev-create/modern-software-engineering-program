<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 411" width="820" height="411" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Llamada a una dependencia» … «Cerrado»</title><desc id="d">Diagrama de flujo con 9 pasos. «Llamada a una dependencia» lleva a «Timeout: cuánto espera». «Timeout: cuánto espera» lleva a «¿Falla?». «¿Falla?» lleva a «Retry con jitter» (transitoria). «¿Falla?» lleva a «Circuit breaker abierto» (persistente). «Retry con jitter» lleva a «¿Presupuesto de reintentos?». «¿Presupuesto de reintentos?» lleva a «Circuit breaker abierto» (agotado). «¿Presupuesto de reintentos?» lleva a «Llamada a una dependencia» (disponible). «Circuit breaker abierto» lleva a «Falla rápido». «Falla rápido» lleva a «Sondeo semiabierto». «Sondeo semiabierto» lleva a «Cerrado» (éxito). «Sondeo semiabierto» lleva a «Circuit breaker abierto» (falla).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="820" height="411" fill="#ffffff"/><path d="M172.5,95 L322,95" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M481,95 L638.5,95" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M690,126 L690,205" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M690,64 L690.0,57.0 Q690,50 683.0,50.0 L191.0,50.0 Q182,50 182.0,59.0 L182.0,173.5 Q182,182.5 173.0,182.5 L108.5,182.5 Q101.5,182.5 101.5,189.5 L101.5,196.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M606,227 L529,227" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M274,227 L181,227" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M101.5,257.5 L101.5,336.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M168,358.5 L339.5,358.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M463.5,358.5 L645.5,358.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M401.5,184 L401.5,148.5 Q401.5,139.5 392.5,139.5 L108.5,139.5 Q101.5,139.5 101.5,132.5 L101.5,125.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><path d="M401.5,328 L401.5,293.0 Q401.5,284 392.5,284.0 L204.0,284.0 Q195,284 195.0,275.0 L195.0,234.0 Q195,227 188.0,227.0 L181,227" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="30.5" y="64.5" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101.5" y="89.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101.5" dy="0">Llamada a una</tspan><tspan x="101.5" dy="19.2">dependencia</tspan></text><rect x="322" y="64.5" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="401.5" y="89.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="401.5" dy="0">Timeout: cuánto</tspan><tspan x="401.5" dy="19.2">espera</tspan></text><polygon points="690,64 741.5,95 690,126 638.5,95" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="690" y="99.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="690" dy="0">¿Falla?</tspan></text><rect x="606" y="205" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="690" y="231.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="690" dy="0">Retry con jitter</tspan></text><rect x="22" y="196.5" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101.5" y="221.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101.5" dy="0">Circuit breaker</tspan><tspan x="101.5" dy="19.2">abierto</tspan></text><polygon points="401.5,184 529,227 401.5,270 274,227" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="401.5" y="221.6" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="401.5" dy="0">¿Presupuesto de</tspan><tspan x="401.5" dy="19.2">reintentos?</tspan></text><rect x="35" y="336.5" width="133" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101.5" y="362.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101.5" dy="0">Falla rápido</tspan></text><rect x="339.5" y="328" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="401.5" y="353.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="401.5" dy="0">Sondeo</tspan><tspan x="401.5" dy="19.2">semiabierto</tspan></text><rect x="645.5" y="336.5" width="89" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="690" y="362.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="690" dy="0">Cerrado</tspan></text><rect x="696" y="153.5" width="102" height="24" rx="4" fill="#ffffff"/><text x="747" y="169.4" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">transitoria</tspan></text><rect x="385" y="22" width="102" height="24" rx="4" fill="#ffffff"/><text x="436" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="436" dy="0">persistente</tspan></text><rect x="193" y="199" width="69" height="24" rx="4" fill="#ffffff"/><text x="227.5" y="214.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="227.5" dy="0">agotado</tspan></t