<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 166" width="840" height="166" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Dependencia directa / transitiva» … «Integridad / dependency confusion»</title><desc id="d">Diagrama de flujo con 5 pasos. «Dependencia directa / transitiva» lleva a «Restricciones / marcadores». «Restricciones / marcadores» lleva a «Resolución». «Resolución» lleva a «Lockfile». «Lockfile» lleva a «Integridad / dependency confusion». «Integridad / dependency confusion» lleva a «Dependencia directa / transitiva» (fallo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="840" height="166" fill="#ffffff"/><path d="M146,104 L192,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M334,104 L380,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M495,104 L541,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M639,104 L685,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M751.5,64 L751.5,57.0 Q751.5,50 744.5,50.0 L91.0,50.0 Q84,50 84.0,57.0 L84,64" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="64" width="124" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="84" y="89" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="84" dy="0">Dependencia</tspan><tspan x="84" dy="19.2">directa /</tspan><tspan x="84" dy="19.2">transitiva</tspan></text><rect x="192" y="73.5" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="263" y="98.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="263" dy="0">Restricciones</tspan><tspan x="263" dy="19.2">/ marcadores</tspan></text><rect x="380" y="82" width="115" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="437.5" y="108.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="437.5" dy="0">Resolución</tspan></text><rect x="541" y="82" width="98" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="590" y="108.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="590" dy="0">Lockfile</tspan></text><rect x="685" y="64" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="751.5" y="89" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="751.5" dy="0">Integridad /</tspan><tspan x="751.5" dy="19.2">dependency</tspan><tspan x="751.5" dy="19.2">confusion</tspan></text><rect x="354.8" y="22" width="126" height="24" rx="4" fill="#ffffff"/><text x="417.8" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="417.8" dy="0">fallo o cambio</tspan></text></svg>
