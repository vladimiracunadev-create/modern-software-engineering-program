<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 855 88" width="855" height="88" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «🎯 Experiencia» … «📈 Operación»</title><desc id="d">Diagrama de flujo con 5 pasos. «🎯 Experiencia» lleva a «🧠 Contrato». «🧠 Contrato» lleva a «🛠️ Dominio». «🛠️ Dominio» lleva a «🔎 Entrega». «🔎 Entrega» lleva a «📈 Operación».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="855" height="88" fill="#ffffff"/><path d="M170,44 L216,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M338,44 L384,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M497,44 L543,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M656,44 L702,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="22" width="148" height="44" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="96" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="96" dy="0">🎯 Experiencia</tspan></text><rect x="216" y="22" width="122" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="277" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="277" dy="0">🧠 Contrato</tspan></text><rect x="384" y="22" width="113" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="440.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="440.5" dy="0">🛠️ Dominio</tspan></text><re