<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 835 303" width="835" height="303" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Anchos y orientación», «Preferencias del usuario» y «Conexión y dispositivo» … «Defectos y lagunas»</title><desc id="d">Diagrama de flujo con 6 pasos. «Anchos y orientación» lleva a «Maquetación adaptable». «Preferencias del usuario» lleva a «Maquetación adaptable». «Conexión y dispositivo» lleva a «Maquetación adaptable». «Maquetación adaptable» lleva a «Matriz de pruebas». «Matriz de pruebas» lleva a «Defectos y lagunas». «Defectos y lagunas» lleva a «Maquetación adaptable» (cambio de diseño).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="835" height="303" fill="#ffffff"/><path d="M168,52.5 L193.0,52.5 Q202,52.5 202.0,61.5 L202.0,142.5 Q202,151.5 211.0,151.5 L236,151.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M190,151.5 L236,151.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M168,250.5 L193.0,250.5 Q202,250.5 202.0,241.5 L202.0,160.5 Q202,151.5 211.0,151.5 L236,151.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M360,151.5 L406,151.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M582,151.5 L628,151.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M720.5,129.5 L720.5,116.0 Q720.5,107 711.5,107.0 L305.0,107.0 Q298,107 298.0,114.0 L298,121" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="44" y="22" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Anchos y</tspan><tspan x="106" dy="19.2">orientación</tspan></text><rect x="236" y="121" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="298" y="146.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="298" dy="0">Maquetación</tspan><tspan x="298" dy="19.2">adaptable</tspan></text><rect x="22" y="121" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="146.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Preferencias del</tspan><tspan x="106" dy="19.2">usuario</tspan></text><rect x="44" y="220" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="245.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Conexión y</tspan><tspan x="106" dy="19.2">dispositivo</tspan></text><rect x="406" y="129.5" width="176" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="494" y="155.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="494" dy="0">Matriz de pruebas</tspan></text><rect x="628" y="129.5" width="185" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="720.5" y="155.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="720.5" dy="0">Defectos y lagunas</tspan></text><rect x="466.2" y="61" width="86" height="42" rx="4" fill="#ffffff"/><text x="509.2" y="76.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="509.2" dy="0">cambio de</tspan><tspan x="509.2" dy="17.92">diseño</tspan></text></svg>
