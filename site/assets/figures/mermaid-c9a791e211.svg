<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 425 686" width="425" height="686" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Cliente» … «Análisis diferido» y «Error con forma única»</title><desc id="d">Diagrama de flujo con 8 pasos. «Cliente» lleva a «Subida por trozos» (trozo i). «Subida por trozos» lleva a «Almacenamiento temporal». «Almacenamiento temporal» lleva a «Archivo completo» (huella correcta). «Subida por trozos» lleva a «Consultar desplazamiento» (corte). «Consultar desplazamiento» lleva a «Cliente». «Archivo completo» lleva a «Validación: tamaño, tipo, nombre generado». «Validación: tamaño, tipo, nombre generado» lleva a «Análisis diferido». «Validación: tamaño, tipo, nombre generado» lleva a «Error con forma única» (rechazo).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="425" height="686" fill="#ffffff"/><path d="M226.8,66 L226.8,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M226.8,168 L226.8,188.0 Q226.8,197 217.8,197.0 L136.1,197.0 Q127.1,197 127.1,206.0 L127.1,226" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M127.1,287 L127.1,295.0 Q127.1,303 135.1,303.0 L155.9,303.0 Q164.9,303 164.9,312.0 L164.9,363" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M226.8,168 L226.8,176.0 Q226.8,184 234.8,184.0 L302.1,184.0 Q311.1,184 311.1,193.0 L311.1,226" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M164.9,407 L164.9,427.0 Q164.9,436 173.9,436.0 L189.5,436.0 Q198.5,436 198.5,445.0 L198.5,465" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M198.5,545 L198.5,569.2 Q198.5,578.2 189.5,578.2 L119.0,578.2 Q110,578.2 110.0,587.2 L110,611.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M198.5,545 L198.5,553.0 Q198.5,561 206.5,561.0 L302.5,561.0 Q311.5,561 311.5,570.0 L311.5,603" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M386.1,256.5 L393.1,256.5 Q400.1,256.5 400.1,249.5 L400.1,53.0 Q400.1,44 391.1,44.0 L271.3,44" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="182.3" y="22" width="89" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="226.8" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="226.8" dy="0">Cliente</tspan></text><rect x="138.8" y="124" width="176" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="226.8" y="150.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="226.8" dy="0">Subida por trozos</tspan></text><rect x="52.1" y="226" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="127.1" y="251.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="127.1" dy="0">Almacenamiento</tspan><tspan x="127.1" dy="19.2">temporal</tspan></text><rect x="80.9" y="363" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="164.9" y="389.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="164.9" dy="0">Archivo completo</tspan></text><rect x="236.1" y="226" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="311.1" y="251.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="311.1" dy="0">Consultar</tspan><tspan x="311.1" dy="19.2">desplazamiento</tspan