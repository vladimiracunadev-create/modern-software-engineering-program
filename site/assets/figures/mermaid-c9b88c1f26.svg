<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 477 668" width="477" height="668" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Intención» … «Decisión humana»</title><desc id="d">Diagrama de flujo con 7 pasos. «Intención» lleva a «Cláusulas». «Cláusulas» lleva a «Revisor de forma». «Cláusulas» lleva a «Ejemplos por contraejemplo». «Revisor de forma» lleva a «Contrato coherente». «Ejemplos por contraejemplo» lleva a «Contrato coherente». «Contrato coherente» lleva a «Mutación del contrato». «Mutación del contrato» lleva a «Decisión humana» (no detecta cambios de sentido). «Decisión humana» lleva a «Intención» (acuerdo).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="477" height="668" fill="#ffffff"/><path d="M200.6,66 L200.6,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M200.6,168 L200.6,192.2 Q200.6,201.2 191.6,201.2 L115.0,201.2 Q106,201.2 106.0,210.2 L106,234.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M200.6,168 L200.6,188.0 Q200.6,197 209.6,197.0 L286.0,197.0 Q295,197 295.0,206.0 L295,226" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M106,278.5 L106.0,302.8 Q106,311.8 115.0,311.8 L191.5,311.8 Q200.5,311.8 200.5,320.8 L200.5,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M295,287 L295.0,307.0 Q295,316 286.0,316.0 L209.5,316.0 Q200.5,316 200.5,325.0 L200.5,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M200.4,389 L200.4,447" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M200.3,508 L200.3,602" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M279.7,624 L371.0,624.0 Q380,624 380.0,615.0 L380.0,53.0 Q380,44 371.0,44.0 L254.1,44" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="147.1" y="22" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="200.6" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="200.6" dy="0">Intención</tspan></text><rect x="147.1" y="124" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="200.6" y="150.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="200.6" dy="0">Cláusulas</tspan></text><rect x="22" y="234.5" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="260.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Revisor de forma</tspan></text><rect x="224" y="226" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="295" y="251.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="295" dy="0">Ejemplos por</tspan><tspan x="295" dy="19.2">contraejemplo</tspan></text><rect x="108" y="345" width="185" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="200.5" y="371.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="200.5" dy="0">Contrato coherente</tspan></text><rect x="133.8" y="447" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="200.3" y="472.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="200.3" dy="0">Mutación del</tspan><tspan x="200.3" dy="19.2">contrato</tspan></text><rect x="120.7" y="602" width="159" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="200.2" y="628.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="200.2" dy="0">Decisión humana</tspan></text><rect x="206.3" y="525" width="94" height="60" rx="4" fill="#ffffff"/><text x="253.3" y="540.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="253.3" dy="0">no detecta</tspan><tspan x="253.3" dy="17.92">cambios de</tspan><tspan x="253.3" dy="17.92">sentido</tspan></text><rect x="386" y="322" width="69" height="24" rx="4" fill="#ffffff"/><text x="420.5" y="337.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="420.5" dy="0">acuerdo</tspan></text></svg>
