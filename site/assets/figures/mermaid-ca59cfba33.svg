<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 801 400" width="801" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Peligros y riesgo» … «Proyecto: paquete de aseguramiento»</title><desc id="d">Diagrama de flujo con 10 pasos. «Peligros y riesgo» lleva a «Integridad por función». «Integridad por función» lleva a «Automoción, aviación y medicina». «Automoción, aviación y medicina» lleva a «Caso de seguridad y trazabilidad». «Caso de seguridad y trazabilidad» lleva a «Plazos de tiempo real». «Plazos de tiempo real» lleva a «Reglas de codificación». «Reglas de codificación» lleva a «Modelo de estados y contraejemplos». «Modelo de estados y contraejemplos» lleva a «Cobertura MC/DC, SIL y HIL». «Cobertura MC/DC, SIL y HIL» lleva a «Taller: un fallo real». «Taller: un fallo real» lleva a «Proyecto: paquete de aseguramiento». «Proyecto: paquete de aseguramiento» lleva a «Peligros y riesgo» (riesgo cambia o evidencia caduca).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="801" height="400" fill="#ffffff"/><path d="M163.5,62 L236,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M386,62 L436.5,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M560.5,62 L628.5,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M695,102 L695,169.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M611,200 L565,200" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M432,200 L386,200" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M236,200 L190,200" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M106,230.5 L106,307.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M190,338 L240,338" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M311,298 L311.0,263.0 Q311,254 302.0,254.0 L213.0,254.0 Q204,254 204.0,245.0 L204.0,115.5 Q204,106.5 195.0,106.5 L113.0,106.5 Q106,106.5 106.0,99.5 L106,92.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="48.5" y="31.5" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Peligros y</tspan><tspan x="106" dy="19.2">riesgo</tspan></text><rect x="236" y="31.5" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="311" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="311" dy="0">Integridad por</tspan><tspan x="311" dy="19.2">función</tspan></text><rect x="436.5" y="22" width="124" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="498.5" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="498.5" dy="0">Automoción,</tspan><tspan x="498.5" dy="19.2">aviación y</tspan><tspan x="498.5" dy="19.2">medicina</tspan></text><rect x="628.5" y="22" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="695" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="695" dy="0">Caso de</tspan><tspan x="695" dy="19.2">seguridad y</tspan><tspan x="695" dy="19.2">trazabilidad</tspan></text><rect x="611" y="169.5" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="695" y="194.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="695" dy="0">Plazos de tiempo</tspan><tspan x="695" dy="19.2">real</tspan></text><rect x="432" y="169.5" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="498.5" y="194.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="498.5" dy="0">Reglas de</tspan><tspan x="498.5" dy="19.2">codificación</tspan></text><rect x="236" y="160" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="311" y="185" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="311" dy="0">Modelo de</tspan><tspan x="311" dy="19.2">estados y</tspan><tspan x="311" dy="19.2">contraejemplos</tspan></text><rect x="22" y="169.5" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="194.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Cobertura MC/DC,</tspan><tspan x="106" dy="19.2">SIL y HIL</tspan></text><rect x="22" y="307.5" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="332.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Taller: un fallo</tspan><tspan x="106" dy="19.2">real</tspan></text><rect x="240" y="298" width="142" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="311" y="323" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="311" dy="0">Proyecto:</tspan><tspan x="311" dy="19.2">paquete de</tspan><tspan x="311" dy="19.2">aseguramiento</tspan></text><rect x="80" y="106" width="118" height="60" rx="4" fill="#ffffff"/><text x="139" y="121.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="139" dy="0">riesgo cambia</tspan><tspan x="139" dy="17.92">o evidencia</tspan><tspan x="139" dy=