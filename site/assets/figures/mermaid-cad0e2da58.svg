<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 185" width="822" height="185" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Comandos, argumentos / flags» … «Señales, cancelación / atomicidad»</title><desc id="d">Diagrama de flujo con 5 pasos. «Comandos, argumentos / flags» lleva a «Configuración / precedencia». «Configuración / precedencia» lleva a «stdout, stderr / formatos». «stdout, stderr / formatos» lleva a «Códigos de salida». «Códigos de salida» lleva a «Señales, cancelación / atomicidad». «Señales, cancelación / atomicidad» lleva a «Comandos, argumentos / flags» (fallo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="822" height="185" fill="#ffffff"/><path d="M137,113.5 L183,113.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M325,113.5 L371,113.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M469,113.5 L515,113.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M630,113.5 L676,113.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M738,64 L738.0,57.0 Q738,50 731.0,50.0 L88.5,50.0 Q79.5,50 79.5,59.0 L79.5,73.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="73.5" width="115" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="79.5" y="98.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="79.5" dy="0">Comandos,</tspan><tspan x="79.5" dy="19.2">argumentos</tspan><tspan x="79.5" dy="19.2">/ flags</tspan></text><rect x="183" y="73.5" width="142" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="254" y="98.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="254" dy="0">Configuración</tspan><tspan x="254" dy="19.2">/</tspan><tspan x="254" dy="19.2">precedencia</tspan></text><rect x="371" y="73.5" width="98" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="420" y="98.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="420" dy="0">stdout,</tspan><tspan x="420" dy="19.2">stderr /</tspan><tspan x="420" dy="19.2">formatos</tspan></text><rect x="515" y="83" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="572.5" y="108.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="572.5" dy="0">Códigos de</tspan><tspan x="572.5" dy="19.2">salida</tspan></text><rect x="676" y="64" width="124" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="738" y="88.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="738" dy="0">Señales,</tspan><tspan x="738" dy="19.2">cancelación</tspan><tspan x="738" dy="19.2">/</tspan><tspan x="738" dy="19.2">atomicidad</tspan></text><rect x="345.8" y="22" width="126" height="24" rx="4" fill="#ffffff"/><text x="408.8" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="408.8" dy="0">fallo o cambio</tspan></text></svg>
