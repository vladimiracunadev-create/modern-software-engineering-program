<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 992" width="740" height="992" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Intención» … «Prueba de comportamiento» y «Rechazo con motivo»</title><desc id="d">Diagrama de flujo con 13 pasos. «Intención» lleva a «Encargo». «Encargo» lleva a «Objetivo y contexto». «Encargo» lleva a «Restricciones». «Encargo» lleva a «Formato de salida». «Encargo» lleva a «Criterios de aceptación». «Objetivo y contexto» lleva a «Modelo». «Restricciones» lleva a «Modelo». «Formato de salida» lleva a «Modelo». «Modelo» lleva a «Salida». «Salida» lleva a «Capa 1: formato». «Capa 1: formato» lleva a «Capa 2: rango» (pasa). «Capa 2: rango» lleva a «Capa 3: coherencia» (pasa). «Capa 3: coherencia» lleva a «Prueba de comportamiento» (pasa). «Capa 1: formato» lleva a «Rechazo con motivo» (falla). «Capa 2: rango» lleva a «Rechazo con motivo» (falla). «Capa 3: coherencia» lleva a «Rechazo con motivo» (falla). «Criterios de aceptación» lleva a «Capa 1: formato».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="740" height="992" fill="#ffffff"/><path d="M353.8,66 L353.8,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M353.8,168 L353.8,188.0 Q353.8,197 344.8,197.0 L88.5,197.0 Q79.5,197 79.5,206.0 L79.5,226" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M353.8,168 L353.8,192.2 Q353.8,201.2 344.8,201.2 L251.0,201.2 Q242,201.2 242.0,210.2 L242,234.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M353.8,168 L353.8,192.