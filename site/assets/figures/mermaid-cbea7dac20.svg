<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 505 649" width="505" height="649" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Fuente» … «Destino»</title><desc id="d">Diagrama de flujo con 7 pasos. «Fuente» lleva a «Filtro 1: validar». «Filtro 1: validar» lleva a «Filtro 2: seleccionar». «Filtro 2: seleccionar» lleva a «Filtro 3: enriquecer». «Filtro 3: enriquecer» lleva a «Filtro 4: formatear». «Filtro 4: formatear» lleva a «Destino». «Filtro 1: validar» lleva a «Cola de rechazos» (rechazados). «Filtro 3: enriquecer» lleva a «Cola de rechazos» (rechazados). «Destino» lleva a «Fuente» (contrapresión).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="505" height="649" fill="#ffffff"/><path d="M248,66 L248,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M248,168 L248.0,190.2 Q248,197 241.2,197.0 L241.2,197.0 Q234.5,197 234.5,203.8 L234.5,226" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M234.5,287 L234.5,307.0 Q234.5,316 225.5,316.0 L222.5,316.0 Q213.5,316 213.5,325.0 L213.5,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M213.5,406 L213.5,426.0 Q213.5,435 204.5,435.0 L122.0,435.0 Q113,435 113.0,444.0 L113,464" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M115.4,525 L115.4,583" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M336,146 L373.5,146.0 Q382.5,146 382.5,155.0 L382.5,487.5 Q382.5,494.5 375.5,494.5 L368.5,494.5" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M213.5,406 L213.5,414.0 Q213.5,422 221.5,422.0 L275.5,422.0 Q284.5,422 284.5,431.0 L284.5,472.5" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M162.2,605 L169.2,605.0 Q176.2,605 176.2,598.0 L176.2,429.0 Q176.2,420 167.2,420.0 L155.0,420.0 Q146,420 146.0,411.0 L146.0,53.0 Q146,44 155.0,44.0 L207.5,44" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="207.5" y="22" width="81" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="248" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="248" dy="0">Fuente</tspan></text><rect x="160" y="124" width="176" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="248" y="150.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="248" dy="0">Filtro 1: validar</tspan></text><rect x="172.5" y="226" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="234.5" y="251.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="234.5" dy="0">Filtro 2:</tspan><tspan x="234.5" dy="19.2">seleccionar</tspan></text><rect x="156" y="345" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="213.5" y="370.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="213.5" dy="0">Filtro 3:</tspan><tspan x="213.5" dy="19.2">enriquecer</tspan></text><rect x="59.5" y="464" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="113" y="489.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="113" dy="0">Filtro 4:</tspan><tspan x="113" dy="19.2">formatear</tspan></text><rect x="73.2" y="583" width="89" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="117.7" y="609.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="117.7" dy="0">Destino</tspan></text><rect x="200.5" y="472.5" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="284.5" y="498.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="284.5" dy="0">Cola de rechazos</tspan></text><rect x="388.5" y="308.2" width="94" height="24" rx="4" fill="#ffffff"/><text x="435.5" y="324.1" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="435.5" dy="0">rechazados</tspan></text><rect x="184.5" y="440.3" width="94" height="24" rx="4" fill="#ffffff"/><text x="231.5" y="456.2" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="231.5" dy="0">rechazados</tspan></text><rect x="22" y="220" width="118" height="24" rx="4" fill="#ffffff"/><text x="81" y="235.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="81" dy="0">contrapresión</tspan></text></svg>
