<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 471 902" width="471" height="902" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Llamada a herramienta» … «Ejecutar y registrar»</title><desc id="d">Diagrama de flujo con 8 pasos. «Llamada a herramienta» lleva a «¿Herramienta ofrecida?». «¿Herramienta ofrecida?» lleva a «Denegar» (no). «¿Herramienta ofrecida?» lleva a «¿Argumentos permitidos?» (sí). «¿Argumentos permitidos?» lleva a «Denegar» (no). «¿Argumentos permitidos?» lleva a «¿Rutas dentro de la raíz?» (sí). «¿Rutas dentro de la raíz?» lleva a «Denegar» (no). «¿Rutas dentro de la raíz?» lleva a «¿Irreversible o externa?» (sí). «¿Irreversible o externa?» lleva a «Aprobación humana» (sí). «¿Irreversible o externa?» lleva a «Ejecutar y registrar» (no). «Aprobación humana» lleva a «Ejecutar y registrar».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="471" height="902" fill="#ffffff"/><path d="M175,83 L175,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M71,184 L64.0,184.0 Q56.9,184 56.9,191.1 L56.9,609.0 Q56.9,616 63.9,616.0 L70.9,616" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M175,227 L175.0,237.4 Q175,243 180.6,243.0 L180.6,243.0 Q186.1,243 186.1,248.6 L186.1,285" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M90.1,328 L66.0,328.0 Q57,328 57.0,337.0 L57.0,643.0 Q57,652 66.0,652.0 L108.4,652.0 Q115.4,652 115.4,645.0 L115.4,638" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M186.1,371 L186.1,