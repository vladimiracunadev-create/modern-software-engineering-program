text x="225" y="411.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="225" dy="0">sí</tspan></text><rect x="121.4" y="550.5" width="29" height="24" rx="4" fill="#ffffff"/><text x="135.9" y="566.4" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="135.9" dy="0">no</tspan></text><rect x="327.4" y="540" width="29" height="24" rx="4" fill="#ffffff"/><text x="341.9" y="555.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="341.9" dy="0">sí</tspan></text><rect x="308.1" y="684" width="29" height="24" rx="4" fill="#ffffff"/><text x="322.6" y="699.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="322.6" dy="0">sí</tspan></text><rect x="191.2" y="821.5" width="29" height="24" rx="4" fill="#ffffff"/><text x="205.7" y="837.4" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="205.7" dy="0">no</tspan></text></svg>
