<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 641 737" width="641" height="737" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Evento de negocio» … «Investigación de un incidente»</title><desc id="d">Diagrama de flujo con 8 pasos. «Evento de negocio» lleva a «Registro estructurado». «Registro estructurado» lleva a «Campos: tiempo, nivel, servicio, mensaje, contexto». «Campos: tiempo, nivel, servicio, mensaje, contexto» lleva a «Identificador de petición y de traza». «Identificador de petición y de traza» lleva a «Correlación entre servicios». «Registro estructurado» lleva a «Política: nivel, muestreo, retención». «Registro estructurado» lleva a «Redacción de datos sensibles». «Correlación entre servicios» lleva a «Investigación de un incidente». «Política: nivel, muestreo, retención» lleva a «Investigación de un incidente». «Redacción de datos sensibles» lleva a «Investigación de un incidente» (riesgo de privacidad).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="641" height="737" fill="#ffffff"/><path d="M327.2,66 L327.2,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M327.2,185 L327.2,205.0 Q327.2,214 318.2,214.0 L119.0,214.0 Q110,214 110.0,223.0 L110,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M110,323 L110.0,343.0 Q110,352 119.0,352.0 L150.0,352.0 Q159,352 159.0,361.0 L159,381" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M159,461 L159.0,481.0 Q159,490 168.0,490.0 L193.1,490.0 Q202.1,490 202.1,499.0 L202.1,519" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M327.2,185 L327.2,208.4 Q327.2,214 321.6,214.0 L321.6,214.0 Q316,214 316.0,219.6 L316,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M327.2,185 L327.2,209.8 Q327.2,218.8 336.2,218.8 L517.5,218.8 Q526.5,218.8 526.5,227.8 L526.5,252.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M202.1,580 L202.1,600.0 Q202.1,609 211.1,609.0 L215.3,609.0 Q224.3,609 224.3,618.0 L224.3,638" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M316,323 L316.0,620.9 Q316,624 319.1,624.0 L319.1,624.0 Q322.3,624 322.3,627.1 L322.3,661.5 Q322.3,668.5 315.3,668.5 L308.3,668.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M434,283 L423.0,283.0 Q414,283 414.0,292.0 L414.0,704.0 Q414,713 405.0,713.0 L231.3,713.0 Q224.3,713 224.3,706.0 L224.3,699" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="239.2" y="22" width="176" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="327.2" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="327.2" dy="0">Evento de negocio</tspan></text><rect x="260.7" y="124" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="327.2" y="149.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="327.2" dy="0">Registro</tspan><tspan x="327.2" dy="19.2">estructurado</tspan></text><rect x="22" y="243" width="176" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="110" y="268" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">Campos: tiempo,</tspan><tspan x="110" dy="19.2">nivel, servicio,</tspan><tspan x="110" dy="19.2">mensaje, contexto</tspan></text><rect x="75" y="381" width="168" height="80" rx="10" fill="#dff1ee" stroke