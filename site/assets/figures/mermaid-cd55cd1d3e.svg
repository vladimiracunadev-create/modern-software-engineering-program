<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 518 719" width="518" height="719" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Participantes con especialidades distintas» … «Decisiones a reabrir»</title><desc id="d">Diagrama de flujo con 7 pasos. «Escenarios de calidad» lleva a «Modelo ejecutable de la arquitectura». «Modelo ejecutable de la arquitectura» lleva a «Veredicto por escenario». «Veredicto por escenario» lleva a «Riesgos y puntos de sensibilidad». «Sensibilidad por parametro» lleva a «Riesgos y puntos de sensibilidad». «Participantes con especialidades distintas» lleva a «Escenarios de calidad». «Riesgos y puntos de sensibilidad» lleva a «Decisiones a reabrir». «Decisiones a reabrir» lleva a «Modelo ejecutable de la arquitectura» (nuevo modelo).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="518" height="719" fill="#ffffff"/><path d="M283.8,221 L283.8,241.0 Q283.8,250 274.8,250.0 L268.0,250.0 Q259,250 259.0,259.0 L259,279" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M259,340 L259.0,360.0 Q259,369 250.0,369.0 L232.0,369.0 Q223,369 223.0,378.0 L223,398" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M223,459 L223.0,479.0 Q223,488 232.0,488.0 L324.8,488.0 Q333.8,488 333.8,497.0 L333.8,517" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M412,459 L412.0,479.0 Q412,488 403.0,488.0 L342.8,488.0 Q333.8,488 333.8,497.0 L333.8,517" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M283.8,102 L283.8,1