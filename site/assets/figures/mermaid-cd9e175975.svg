<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 828 577" width="828" height="577" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Pregunta frecuente y cambio frecuente» … «Costo de lectura y de cambio medidos»</title><desc id="d">Diagrama de flujo con 8 pasos. «Pregunta frecuente y cambio frecuente» lleva a «Modelo». «Modelo» lleva a «Filas relacionadas: unir al leer». «Modelo» lleva a «Documentos: repetir para leer una vez». «Modelo» lleva a «Clave-valor: una clave, una lectura». «Modelo» lleva a «Grafo: seguir relaciones de profundidad variable». «Modelo» lleva a «Series: ordenar por tiempo». «Filas relacionadas: unir al leer» lleva a «Costo de lectura y de cambio medidos». «Documentos: repetir para leer una vez» lleva a «Costo de lectura y de cambio medidos». «Clave-valor: una clave, una lectura» lleva a «Costo de lectura y de cambio medidos». «Grafo: seguir relaciones de profundidad variable» lleva a «Costo de lectura y de cambio medidos». «Series: ordenar por tiempo» lleva a «Costo de lectura y de cambio medidos». «Costo de lectura y de cambio medidos» lleva a «Pregunta frecuente y cambio frecuente» (la pregunta cambió).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="828" height="577" fill="#ffffff"/><path d="M207,288.5 L253,288.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M344,288.5 L358.0,288.5 Q367,288.5 367.0,279.5 L367.0,71.0 Q367,62 376.0,62.0 L390,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M344,288.5 L360.2,288.5 Q369.2,288.5 369.2,279.5 L369.2,189.0