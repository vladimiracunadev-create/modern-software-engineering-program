<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 442 733" width="442" height="733" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Propiedad: confidencialidad, integridad, autenticidad» … «Radio de la clave y costo de rotación»</title><desc id="d">Diagrama de flujo con 6 pasos. «Propiedad: confidencialidad, integridad, autenticidad» lleva a «Primitiva: cifrado autenticado, MAC, firma, derivación». «Primitiva: cifrado autenticado, MAC, firma, derivación» lleva a «Contrato de uso: nonce único, tamaño de clave, comparación segura». «Contrato de uso: nonce único, tamaño de clave, comparación segura» lleva a «Claves: generación, uso, rotación, destrucción». «Contrato de uso: nonce único, tamaño de clave, comparación segura» lleva a «Fallo de uso: nonce repetido, oráculo de tiempo» (se incumple). «Claves: generación, uso, rotación, destrucción» lleva a «Radio de la clave y costo de rotación» (filtración).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="442" height="733" fill="#ffffff"/><path d="M246.3,121 L246.3,179" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M246.3,259 L246.3,279.0 Q246.3,288 237.3,288.0 L234.2,288.0 Q225.2,288 225.2,297.0 L225.2,317" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M225.2,416 L225.2,436.0 Q225.2,445 216.2,445.0 L115.0,445.0 Q106,445 106.0,454.0 L106,474" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M225.2,416 L225.2,424.0 Q225.2,432 233.2,432.0 L303.0,432.0 Q312,432 312.0,441.0 L312,483.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M109.1,573 L109.1,631" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="158.3" y="22" width="176" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="246.3" y="46.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="246.3" dy="0">Propiedad:</tspan><tspan x="246.3" dy="19.2">confidencialidad,</tspan><tspan x="246.3" dy="19.2">integridad,</tspan><tspan x="246.3" dy="19.2">autenticidad</tspan></text><rect x="153.8" y="179" width="185" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="246.3" y="204" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="246.3" dy="0">Primitiva: cifrado</tspan><tspan x="246.3" dy="19.2">autenticado, MAC,</tspan><tspan x="246.3" dy="19.2">firma, derivación</tspan></text><rect x="132.7" y="317" width="185" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="225.2" y="341.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="225.2" dy="0">Contrato de uso:</tspan><tspan x="225.2" dy="19.2">nonce único,</tspan><tspan x="225.2" dy="19.2">tamaño de clave,</tspan><tspan x="225.2" dy="19.2">comparación segura</tspan></text><rect x="22" y="474" width="168" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="498.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Claves:</tspan><tspan x="106" dy="19.2">generación, uso,</tspan><tspan x="106" dy="19.2">rotación,</tspan><tspan x="106" dy="19.2">destrucción</tspan></text><rect x="224" y="483.5" width="176" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="312" y="508.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="312" dy="0">Fallo de uso:</tspan><tspan x="312" dy="19.2">nonce repetido,</tspan><tspan x="312" dy="19.2">oráculo de tiempo</tspan></text><rect x="24.2" y="631" width="176" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="112.2" y="656" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="112.2" dy="0">Radio de la clave</tspan><tspan x="112.2" dy="19.2">y costo de</tspan><tspan x="112.2" dy="19.2">rotación</tspan></text><rect x="318" y="445.8" width="102" height="24" rx="4" fill="#ffffff"/><text x="369" y="461.7" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="369" dy="0">se incumple</tspan></text><rect x="115.1" y="590" width="94" height="24" rx="4" fill="#ffffff"/><text x="162.1" y="605.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="162.1" dy="0">filtración</tspan></text></svg>
