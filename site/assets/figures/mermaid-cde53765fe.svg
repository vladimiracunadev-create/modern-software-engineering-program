<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 936 105" width="936" height="105" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «🎯 Garantía» … «📈 Reconciliación»</title><desc id="d">Diagrama de flujo con 5 pasos. «🎯 Garantía» lleva a «🧠 Partición». «🧠 Partición» lleva a «🛠️ Coordinación». «🛠️ Coordinación» lleva a «🔎 Degradación». «🔎 Degradación» lleva a «📈 Reconciliación».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="936" height="105" fill="#ffffff"/><path d="M144,52.5 L190,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M321,52.5 L367,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M524,52.5 L570,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M718,52.5 L764,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="30.5" width="122" height="44" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="83" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="83" dy="0">🎯 Garantía</tspan></text><rect x="190" y="30.5" width="131" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="255.5" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="255.5" dy="0">🧠 Partición</tspan></text><rect x="367" y="30.5" width="157" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="445.5" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="445.5" dy="0">🛠️ Coordinación</tspan></text><rect x="570" y="30.5" width="148" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="644" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="644" dy="0">🔎 Degradación</tspan></text><rect x="764" y="22" width="150" height="61" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="839" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="839" dy="0">📈</tspan><tspan x="839" dy="19.2">Reconciliación</tspan></text></svg>
