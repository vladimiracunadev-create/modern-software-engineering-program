<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 477 752" width="477" height="752" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Dato ajeno» … «Navegador»</title><desc id="d">Diagrama de flujo con 10 pasos. «Dato ajeno» lleva a «Contexto de salida». «Contexto de salida» lleva a «Texto». «Contexto de salida» lleva a «Atributo». «Contexto de salida» lleva a «URL». «Contexto de salida» lleva a «Script». «Texto» lleva a «Codificación del contexto». «Atributo» lleva a «Codificación del contexto». «URL» lleva a «Codificación del contexto». «Script» lleva a «Codificación del contexto». «Codificación del contexto» lleva a «Página». «Página» lleva a «Política de contenido». «Política de contenido» lleva a «Navegador».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="477" height="752" fill="#ffffff"/><path d="M239.4,66 L239.4,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M239.4,186 L239.4,206.0 Q239.4,215 230.4,215.0 L69.0,215.0 Q60,215 60.0,224.0 L60,244" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M239.4,186 L239.4,206.0 Q239.4,215 230.4,215.0 L190.0,215.0 Q181,215 181.0,224.0 L181,244" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M239.4,186 L239.4,206.0 Q239.4,215 248.4,215.0 L293.0,215.0 Q302,215 302.0,224.0 L302,244" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M239.4,186 L239.4,206.0 Q239.4,215 248.4,215.0 L405.5,215.0 Q414.5,215 414.5,224.0 L414.5,244" fill="none" stroke="#32505f" stroke-width="