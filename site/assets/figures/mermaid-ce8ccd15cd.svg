<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 564 908" width="564" height="908" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Datos tardíos» … «Recalcular tareas dependientes»</title><desc id="d">Diagrama de flujo con 11 pasos. «Fuente por particiones» lleva a «Tarea de carga». «Tarea de carga» lleva a «Estrategia». «Estrategia» lleva a «No idempotente» (añadir). «Estrategia» lleva a «Idempotente» (reemplazar la partición). «Estrategia» lleva a «Idempotente» (fusionar por clave). «Idempotente» lleva a «Reintento seguro». «Idempotente» lleva a «Reintento seguro». «Reintento seguro» lleva a «Backfill: reescribir particiones». «Backfill: reescribir particiones» lleva a «Recalcular tareas dependientes». «Datos tardíos» lleva a «Ventana de reproceso». «Ventana de reproceso» lleva a «Tarea de carga».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="564" height="908" fill="#ffffff"/><path d="M181,185 L181.0,205.0 Q181,214 190.0,214.0 L233.2,214.0 Q242.2,214 242.2,223.0 L242.2,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M242.2,287 L242.2,309.1 Q242.2,316 249.1,316.0 L249.1,316.0 Q255.9,316 255.9,322.9 L255.9,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M255.9,407 L255.9,415.0 Q255.9,423 247.9,423.0 L106.0,423.0 Q97,423 97.0,432.0 L97,483" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M255.9,407 L255.9,416.9 Q255.9,423 261.9,423.0 L261.9,423.0 Q268,423 268.0,429.1 L268,483" fill="none" stroke="#32505f" stroke-width="1.8" marker-en