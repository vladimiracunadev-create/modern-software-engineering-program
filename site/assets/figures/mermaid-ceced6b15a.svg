th="1.6"/><text x="546" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="546" dy="0">Trabajo por</tspan><tspan x="546" dy="19.2">elemento: ventana</tspan></text><rect x="471" y="121" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="546" y="146" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="546" dy="0">Despertares de</tspan><tspan x="546" dy="19.2">radio: lote o</tspan><tspan x="546" dy="19.2">empuje</tspan></text><rect x="466.5" y="239" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="546" y="264.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="546" dy="0">Caché: tamaño y</tspan><tspan x="546" dy="19.2">aciertos</tspan></text><rect x="680" y="130.5" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="746.5" y="155.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="746.5" dy="0">Medición en</tspan><tspan x="746.5" dy="19.2">dispositivos</tspan></text><rect x="389.1" y="79" width="53" height="24" rx="4" fill="#ffffff"/><text x="415.6" y="94.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="415.6" dy="0">cifra</tspan></text></svg>
