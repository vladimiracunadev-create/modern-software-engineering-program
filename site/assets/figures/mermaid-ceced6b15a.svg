<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 835 322" width="835" height="322" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Presupuesto del producto» … «Medición en dispositivos»</title><desc id="d">Diagrama de flujo con 8 pasos. «Presupuesto del producto» lleva a «Tiempo de respuesta». «Presupuesto del producto» lleva a «Energía en segundo plano». «Presupuesto del producto» lleva a «Memoria». «Tiempo de respuesta» lleva a «Trabajo por elemento: ventana». «Energía en segundo plano» lleva a «Despertares de radio: lote o empuje». «Memoria» lleva a «Caché: tamaño y aciertos». «Trabajo por elemento: ventana» lleva a «Medición en dispositivos». «Despertares de radio: lote o empuje» lleva a «Medición en dispositivos». «Caché: tamaño y aciertos» lleva a «Medición en dispositivos». «Medición en dispositivos» lleva a «Presupuesto del producto» (cifra).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="835" height="322" fill="#ffffff"/><path d="M101.5,130.5 L101.5,61.5 Q101.5,52.5 110.5,52.5 L266,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M181,161 L227,161" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M101.5,191.5 L101.5,260.5 Q101.5,269.5 110.5,269.5 L275,269.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M373,52.5 L458,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M412,161 L471,161" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M364,269.5 L466.5,269.5