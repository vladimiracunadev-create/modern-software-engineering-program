<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 467 1077" width="467" height="1077" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Candidato registrado con huella» … «Modelo anterior retenido para volver»</title><desc id="d">Diagrama de flujo con 10 pasos. «Candidato registrado con huella» lleva a «Sombra: se ejecuta sin servir». «Sombra: se ejecuta sin servir» lleva a «¿Decisiones y tasas por segmento parecidas?». «¿Decisiones y tasas por segmento parecidas?» lleva a «Se detiene y se investiga» (no). «¿Decisiones y tasas por segmento parecidas?» lleva a «Canary: fracción del tráfico» (sí). «Canary: fracción del tráfico» lleva a «¿Guardas con y sin etiqueta dentro de umbral?». «¿Guardas con y sin etiqueta dentro de umbral?» lleva a «Rollback por puntero» (no). «¿Guardas con y sin etiqueta dentro de umbral?» lleva a «Ampliación por etapas» (sí). «Ampliación por etapas» lleva a «100 % del tráfico». «100 % del tráfico» lleva a «Modelo anterior retenido para volver». «Rollback por puntero» lleva a «Modelo anterior retenido para volver».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="467" height="1077" fill="#ffffff"/><path d="M169.7,102 L169.7,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M169.7,221 L169.7,241.5 Q169.7,250 178.2,250.0 L178.2,250.0 Q186.7,250 186.7,258.5 L186.7,279" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M186.7,399 L186.7,407.0 Q186.7,415 178.7,415.0 L110.5,415.0 Q101.5,415 101.5,424.0 L101.5,457" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M186.7,399 L186.7,407.0 Q186.7,415 194.7,415.0 L290.0,415.0 Q299,415 299.0,424.0 L299,457" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M299,518 L299.0,539.9 Q299,547 291.9,547.0 L291.9,547.0 Q284.7,547 284.7,554.1 L284.7,576" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M284.7,696 L284.7,704.0 Q284.7,712 276.7,712.0 L202.6,712.0 Q193.6,712 193.6,721.0 L193.6,754" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M284.7,696 L284.7,704.0 Q284.7,712 292.7,712.0 L360.1,712.0 Q369.1,712 369.1,721.0 L369.1,754" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M369.1,815 L369.1,835.0 Q369.1,844 360.1,844.0 L348.2,844.0 Q339.2,844 339.2,853.0 L339.2,873" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M339.2,917 L339.2,937.0 Q339.2,946 330.2,946.0 L327.8,946.0 Q318.8,946 318.8,955.0 L318.8,975" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M193.6,815 L193.6,1006.0 Q193.6,1015 202.6,1015.0 L239.3,1015" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="94.7" y="22" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="169.7" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="169.7" dy="0">Candidato</tspan><tspan x="169.7" dy="19.2">registrado con</tspan><tspan x="169.7" dy="19.2">huella</tspan></text><rect x="77.2" y="160" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="169.7" y="185.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="169.7" dy="0">Sombra: se ejecuta</tspan><tspan x="169.7" dy="19.2">sin servir</tspan></text><polygon points="186.7,279 304.7,339 186.7,399 68.7,339" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="186.7" y="324