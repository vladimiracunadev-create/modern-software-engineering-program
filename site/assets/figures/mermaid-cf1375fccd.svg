<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 904 417" width="904" height="417" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Falla del sistema de datos» … «Señal de integridad: conteos, sumas de verificación, exactitud»</title><desc id="d">Diagrama de flujo con 10 pasos. «Falla del sistema de datos» lleva a «Réplica atrasada o partición». «Falla del sistema de datos» lleva a «Duplicados y desorden». «Falla del sistema de datos» lleva a «Copia que no restaura». «Falla del sistema de datos» lleva a «Almacén de características degradado». «Réplica atrasada o partición» lleva a «Pérdida de escrituras confirmadas, lecturas viejas». «Duplicados y desorden» lleva a «Efectos repetidos». «Copia que no restaura» lleva a «Recuperación incompleta». «Almacén de características degradado» lleva a «Modelo menos exacto sin errores». «Pérdida de escrituras confirmadas, lecturas viejas» lleva a «Señal de integridad: conteos, sumas de verificación, exactitud». «Efectos repetidos» lleva a «Señal de integridad: conteos, sumas de verificación, exactitud». «Recuperación incompleta» lleva a «Señal de integridad: conteos, sumas de verificación, exactitud». «Modelo menos exacto sin errores» lleva a «Señal de integridad: conteos, sumas de verificación, exactitud».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="904" height="417" fill="#ffffff"/><path d="M198,208.5 L212.0,208.5 Q221,208.5 221.0,199.5 L221.0,80.5 Q221,71.5 230.0,71.5 L244,71.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M198,208.5 L225.0,208.5 Q234,208.5 234.0,199