<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 757 207" width="757" height="207" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Política de la organización» … «Caso de prueba»</title><desc id="d">Diagrama de flujo con 4 pasos. «Política de la organización» lleva a «Regla de negocio». «Regla de negocio» lleva a «Requisito funcional». «Requisito funcional» lleva a «Caso de prueba». «Regla de negocio» lleva a «Política de la organización» (hueco o conflicto). «Caso de prueba» lleva a «Regla de negocio» (mutante vivo).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="757" height="207" fill="#ffffff"/><path d="M172,112.5 L218,112.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M386,112.5 L432,112.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M539,112.5 L585,112.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M302,90.5 L302.0,77.0 Q302,68 293.0,68.0 L104.0,68.0 Q97,68 97.0,75.0 L97,82" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><path d="M660,134.5 L660.0,148.0 Q660,157 651.0,157.0 L311.0,157.0 Q302,157 302.0,148.0 L302,134.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="82" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="97" y="107.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="97" dy="0">Política de la</tspan><tspan x="97" dy="19.2">organización</tspan></text><rect x="218" y="90.5" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="302" y="116.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="302" dy="0">Regla de negocio</tspan></text><rect x="432" y="82" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="485.5" y="107.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="485.5" dy="0">Requisito</tspan><tspan x="485.5" dy="19.2">funcional</tspan></text><rect x="585" y="90.5" width="150" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="660" y="116.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="660" dy="0">Caso de prueba</tspan></text><rect x="156.5" y="22" width="86" height="42" rx="4" fill="#ffffff"/><text x="199.5" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="199.5" dy="0">hueco o</tspan><tspan x="199.5" dy="17.92">conflicto</tspan></text><rect x="426" y="161" width="110" height="24" rx="4" fill="#ffffff"/><text x="481" y="176.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="481" dy="0">mutante vivo</tspan></text></svg>
