<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 563 786" width="563" height="786" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Producto» … «Decisión de alcance»</title><desc id="d">Diagrama de flujo con 9 pasos. «Producto» lleva a «Funciones». «Funciones» lleva a «Cada plataforma». «Cada plataforma» lleva a «Compartir» (igual). «Cada plataforma» lleva a «Adaptar tras un puerto» (distinto). «Cada plataforma» lleva a «Degradar o excluir» (ausente). «Adaptar tras un puerto» lleva a «Contrato del puerto». «Contrato del puerto» lleva a «Adaptador real y falso». «Compartir» lleva a «Decisión de alcance». «Adaptador real y falso» lleva a «Decisión de alcance». «Degradar o excluir» lleva a «Decisión de alcance».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="563" height="786" fill="#ffffff"/><path d="M258.6,66 L258.6,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M257.5,168 L257.5,226" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M256.4,288 L256.4,296.0 Q256.4,304 248.4,304.0 L84.5,304.0 Q75.5,304 75.5,313.0 L75.5,354.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M256.4,288 L256.4,297.1 Q256.4,304 249.4,304.0 L249.4,304.0 Q242.5,304 242.5,310.9 L242.5,346" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M256.4,288 L256.4,296.0 Q256.4,304 264.4,304.0 L439.5,304.0 Q448.5,304 448.5,313.0 L448.5,354.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M244.6,407 L244.6,4