<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 570 262" width="570" height="262" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Valores seguros por defecto» … «Informe con procedencia, secretos redactados»</title><desc id="d">Diagrama de flujo con 6 pasos. «Valores seguros por defecto» lleva a «Archivo de configuración». «Archivo de configuración» lleva a «Variables de entorno». «Variables de entorno» lleva a «Opciones CLI». «Opciones CLI» lleva a «Validación y configuración efectiva». «Validación y configuración efectiva» lleva a «Informe con procedencia, secretos redactados».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="570" height="262" fill="#ffffff"/><path d="M181,52.5 L227,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M369,52.5 L415,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M481.5,83 L481.5,168.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M415,190.5 L369,190.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M227,190.5 L168,190.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="22" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101.5" dy="0">Valores seguros</tspan><tspan x="101.5" dy="19.2">por defecto</tspan></text><rect x="227" y="22" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="298" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="298" dy="0">Archivo de</tspan><tspan x="298" dy="19.2">configuración</tspan></text><rect x="415" y="22" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="481.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="481.5" dy="0">Variables de</tspan><tspan x="481.5" dy="19.2">entorno</tspan></text><rect x="415" y="168.5" width="133" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="481.5" y="194.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="481.5" dy="0">Opciones CLI</tspan></text><rect x="227" y="150.5" width="142" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="298" y="175.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="298" dy="0">Validación y</tspan><tspan x="298" dy="19.2">configuración</tspan><tspan x="298" dy="19.2">efectiva</tspan></text><rect x="35" y="141" width="133" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101.5" y="165.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101.5" dy="0">Informe con</tspan><tspan x="101.5" dy="19.2">procedencia,</tspan><tspan x="101.5" dy="19.2">secretos</tspan><tspan x="101.5" dy="19.2">redactados</tspan></text></svg>
