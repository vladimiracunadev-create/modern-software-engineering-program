<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 190" width="856" height="190" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Salida» … «Lector de pantalla» y «Máquina o registro»</title><desc id="d">Diagrama de flujo con 8 pasos. «Salida» lleva a «¿Terminal?». «¿Terminal?» lleva a «Color y ancho real» (sí). «¿Terminal?» lleva a «Texto plano» (no). «Color y ancho real» lleva a «Alineación por ancho». «Texto plano» lleva a «Alineación estable». «Alineación por ancho» lleva a «Lector de pantalla». «Alineación estable» lleva a «Máquina o registro».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="856" height="190" fill="#ffffff"/><path d="M103,95 L149,95" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M290,95 L298.0,95.0 Q306,95 306.0,87.0 L306.0,61.5 Q306,52.5 315.0,52.5 L343,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M290,95 L298.0,95.0 Q306,95 306.0,103.0 L306.0,128.5 Q306,137.5 315.0,137.5 L352,137.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M485,52.5 L531,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M476,137.5 L548.5,137.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M681,52.5 L727,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M663.5,137.5 L727,137.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="73" width="81" height="44" rx="10" fill="#dff1ee" stroke=