<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 224" width="670" height="224" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Afirmación» … «Límite»</title><desc id="d">Diagrama de flujo con 7 pasos. «Afirmación» lleva a «Pregunta». «Pregunta» lleva a «Fuente candidata». «Fuente candidata» lleva a «Versión y autoridad». «Versión y autoridad» lleva a «Pasaje y contexto». «Pasaje y contexto» lleva a «Interpretación». «Interpretación» lleva a «Límite».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="670" height="224" fill="#ffffff"/><path d="M137,52.5 L183,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M281,52.5 L327,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M495,52.5 L541,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M594.5,83 L594.5,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M545.5,171.5 L486,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M336,171.5 L272.5,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="30.5" width="115" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="79.5" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="79.5" dy="0">Afirmación</tspan></text><rect x="183" y="30.5" width="98" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="232" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="232" dy="0">Pregunta</tspan></text><rect x="327" y="30.5" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="411" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="411" dy="0">Fuente candidata</tspan></text><rect x="541" y="22" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="594.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="594.5" dy="0">Versión y</tspan><tspan x="594.5" dy="19.2">autoridad</tspan></text><rect x="545.5" y="141" width="98" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="594.5" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="594.5" dy="0">Pasaje y</tspan><tspan x="594.5" dy="19.2">contexto</tspan></text><rect x="336" y="149.5" width="150" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="411" y="175.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="411" dy="0">Interpretación</tspan></text><rect x="191.5" y="149.5" width="81" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="232" y="175.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="232" dy="0">Límite</tspan></text></svg>
