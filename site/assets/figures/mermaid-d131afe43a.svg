<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 891 326" width="891" height="326" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Sujeto: proceso e identidad», «Acción solicitada», «Objeto resuelto» y «Permisos, ACL y política» … «Evidencia y corrección mínima»</title><desc id="d">Diagrama de flujo con 7 pasos. «Sujeto: proceso e identidad» lleva a «Evaluación». «Acción solicitada» lleva a «Evaluación». «Objeto resuelto» lleva a «Evaluación». «Permisos, ACL y política» lleva a «Evaluación». «Evaluación» lleva a «Permitir o denegar». «Permitir o denegar» lleva a «Evidencia y corrección mínima».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="891" height="326" fill="#ffffff"/><path d="M198,52.5 L212.0,52.5 Q221,52.5 221.0,61.5 L221.0,154.0 Q221,163 230.0,163.0 L244,163" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M198,129 L212.0,129.0 Q221,129 221.0,138.0 L221.0,154.0 Q221,163 230.0,163.0 L244,163" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M189.5,197 L207.8,197.0 Q216.8,197 216.8,188.0 L216.8,172.0 Q216.8,163 225.8,163.0 L244,163" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M189.5,273.5 L207.8,273.5 Q216.8,273.5 216.8,264.5 L216.8,172.0 Q216.8,163 225.8,163.0 L244,163" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M359,163 L405,163" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M647,163 L693,163" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url