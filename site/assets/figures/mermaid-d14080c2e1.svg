<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 558 600" width="558" height="600" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Artefacto verificado» … «Aumentar exposición», «Retroceso» y «Esperar o ampliar»</title><desc id="d">Diagrama de flujo con 8 pasos. «Artefacto verificado» lleva a «Despliegue: la versión corre». «Despliegue: la versión corre» lleva a «Exposición: quién la usa». «Exposición: quién la usa» lleva a «Señal de calidad». «Señal de calidad» lleva a «Aumentar exposición» (dentro del margen). «Señal de calidad» lleva a «Retroceso» (fuera del margen). «Señal de calidad» lleva a «Esperar o ampliar» (datos insuficientes). «Bandera apagada» lleva a «Exposición: quién la usa».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="558" height="600" fill="#ffffff"/><path d="M97,83 L97,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M97,202 L97.0,222.0 Q97,231 106.0,231.0 L207.2,231.0 Q216.2,231 216.2,240.0 L216.2,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M216.2,321 L216.2,341.0 Q216.2,350 225.2,350.0 L230.5,350.0 Q239.5,350 239.5,359.0 L239.5,379" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M239.5,441 L239.5,449.0 Q239.5,457 231.5,457.0 L99.9,457.0 Q90.9,457 90.9,466.0 L90.9,517" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M237.7,441 L237.7,525.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M239.5,441 L239.5,449.0 Q239.5,457 247.5,457.0 L402.4,457.0 Q411.4,457 411.4,466.0 L411.4,525.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M285.5,193.5 L285.5,217.8 Q285.5,226.8 276.5,226.8 L225.2,226.8 Q216.2,226.8 216.2,235.8 L216.2,260" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="39.5" y="22" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="97" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="97" dy="0">Artefacto</tspan><tspan x="97" dy="19.2">verificado</tspan></text><rect x="22" y="141" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="97" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="97" dy="0">Despliegue: la</tspan><tspan x="97" dy="19.2">versión corre</tspan></text><rect x="128.2" y="260" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="216.2" y="285.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="216.2" dy="0">Exposición: quién</tspan><tspan x="216.2" dy="19.2">la usa</tspan></text><polygon points="239.5,379 348,410 239.5,441 131,410" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="239.5" y="414.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="239.5" dy="0">Señal de calidad</tspan></text><rect x="33.4" y="517" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="90.9" y="542.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="90.9" dy="0">Aumentar</tspan><tspan x="90.9" dy="19.2">exposición</tspan></text><rect x="182.4" y="525.5" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="235.9" y="551.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="235.9" dy="0">Retroceso</tspan></text><rect x="323.4" y="525.5" width="176" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="411.4" y="551.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="411.4" dy="0">Esperar o ampliar</tspan></text><rect x="206" y="149.5" width="159" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="285.5" y="175.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="285.5" dy="0">Bandera apagada</tspan></text><rect x="96.9" y="466" width="94" height="42" rx="4" fill="#ffffff"/><text x="143.9" y="481.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="143.9" dy="0">dentro del</tspan><tspan x="143.9" dy="17.92">margen</tspan></text><rect x="243.7" y="462.2" width="86" height="42" rx="4" fill="#ffffff"/><text x="286.7" y="478.1" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="286.7" dy="0">fuera del</tspan><tspan x="286.7" dy="17.92">margen</tspan></text><rect x="417.4" y="470.2" width="118" height="42" rx="4" fill="#ffffff"/><text x="476.4" y="486.1" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="476.4" dy="0">datos</tspan><tspan x="476.4" dy="17.92">insuficientes</tspan></text></svg>
