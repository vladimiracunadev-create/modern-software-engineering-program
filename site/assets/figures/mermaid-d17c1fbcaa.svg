<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 476 905" width="476" height="905" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Historia de rendimiento» y «Alcance y su crecimiento» … «Señales de vigilancia»</title><desc id="d">Diagrama de flujo con 10 pasos. «Historia de rendimiento» lleva a «Remuestreo». «Alcance y su crecimiento» lleva a «Remuestreo». «Remuestreo» lleva a «Distribución de la fecha». «Distribución de la fecha» lleva a «Percentiles comunicados». «Percentiles comunicados» lleva a «Calibración». «Calibración» lleva a «Corregir el modelo» (descalibrado). «Calibración» lleva a «Plan con supuestos» (calibrado). «Plan con supuestos» lleva a «Sensibilidad de supuestos». «Sensibilidad de supuestos» lleva a «Señales de vigilancia». «Señales de vigilancia» lleva a «Historia de rendimiento» (dato real).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="476" height="905" fill="#ffffff"/><path d="M100,83 L100.0,103.0 Q100,112 109.0,112.0 L172.2,112.0 Q181.2,112 181.2,121.0 L181.2,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M262.5,83 L262.5,103.0 Q262.5,112 253.5,112.0 L190.2,112.0 Q181.2,112 181.2,121.0 L181.2,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M181.2,185 L181.2,207.3 Q181.2,214 187.8,214.0 L187.8,214.0 Q194.5,214 194.5,220.7 L194.5,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M194.5,304 L194.5,324.6 Q194.5,333 202.8,333.0 L202.8,333.0 Q211.2,333 211.2,341.4 L211.2,362" fill="none" stroke="#32505f" strok