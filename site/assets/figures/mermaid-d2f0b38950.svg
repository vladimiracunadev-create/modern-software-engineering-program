<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 604 262" width="604" height="262" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Funciones puras / transparencia referencial» … «Recursión, evaluación / efectos»</title><desc id="d">Diagrama de flujo con 5 pasos. «Funciones puras / transparencia referencial» lleva a «Inmutabilidad / evolución de valores». «Inmutabilidad / evolución de valores» lleva a «Funciones de orden superior». «Funciones de orden superior» lleva a «Composición / tipos de resultado». «Composición / tipos de resultado» lleva a «Recursión, evaluación / efectos». «Recursión, evaluación / efectos» lleva a «Funciones puras / transparencia referencial» (fallo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="604" height="262" fill="#ffffff"/><path d="M181,62 L227,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M386,62 L432,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M507,92.5 L507,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M436,200 L373,200" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M240,200 L110.5,200.0 Q101.5,200 101.5,191.0 L101.5,102" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="22" width="159" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101.5" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101.5" dy="0">Funciones puras</tspan><tspan x="101.5" dy="19.2">/ transparencia</tspan><tspan x="101.5" dy="19.2">referencial</tspan></text><rect x="227" y="22" width="159" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="306.5" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="306.5" dy="0">Inmutabilidad /</tspan><tspan x="306.5" dy="19.2">evolución de</tspan><tspan x="306.5" dy="19.2">valores</tspan></text><rect x="432" y="31.5" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="507" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="507" dy="0">Funciones de</tspan><tspan x="507" dy="19.2">orden superior</tspan></text><rect x="436" y="160" width="142" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="507" y="185" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="507" dy="0">Composición /</tspan><tspan x="507" dy="19.2">tipos de</tspan><tspan x="507" dy="19.2">resultado</tspan></text><rect x="240" y="160" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="306.5" y="185" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="306.5" dy="0">Recursión,</tspan><tspan x="306.5" dy="19.2">evaluación /</tspan><tspan x="306.5" dy="19.2">efectos</tspan></text><rect x="107.8" y="172" width="126" height="24" rx="4" fill="#ffffff"/><text x="170.8" y="187.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="170.8" dy="0">fallo o cambio</tspan></text></svg>
