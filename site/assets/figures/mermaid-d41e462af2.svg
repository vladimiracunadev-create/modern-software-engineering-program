<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 543 224" width="543" height="224" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Punto de extensión» … «Fallo / desactivación»</title><desc id="d">Diagrama de flujo con 5 pasos. «Punto de extensión» lleva a «Descubrimiento». «Descubrimiento» lleva a «Capacidades / aislamiento». «Capacidades / aislamiento» lleva a «Versionado del protocolo». «Versionado del protocolo» lleva a «Fallo / desactivación». «Fallo / desactivación» lleva a «Punto de extensión» (fallo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="543" height="224" fill="#ffffff"/><path d="M129,52.5 L175,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M325,52.5 L375,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M446,83 L446,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M371,171.5 L321,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M179,171.5 L84.5,171.5 Q75.5,171.5 75.5,162.5 L75.5,83" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="22" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="75.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="75.5" dy="0">Punto de</tspan><tspan x="75.5" dy="19.2">extensión</tspan></text><rect x="175" y="30.5" width="150" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="250" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="250" dy="0">Descubrimiento</tspan></text><rect x="375" y="22" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="446" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="446" dy="0">Capacidades /</tspan><tspan x="446" dy="19.2">aislamiento</tspan></text><rect x="371" y="141" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="446" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="446" dy="0">Versionado del</tspan><tspan x="446" dy="19.2">protocolo</tspan></text><rect x="179" y="141" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="250" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="250" dy="0">Fallo /</tspan><tspan x="250" dy="19.2">desactivación</tspan></text><rect x="43.6" y="143.5" width="126" height="24" rx="4" fill="#ffffff"/><text x="106.6" y="159.4" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="106.6" dy="0">fallo o cambio</tspan></text></svg>
