<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 404 923" width="404" height="923" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Síntoma esporádico» … «Regresión: falla antes, pasa después»</title><desc id="d">Diagrama de flujo con 10 pasos. «Síntoma esporádico» lleva a «Modelo con pasos explícitos». «Modelo con pasos explícitos» lleva a «Planificador controlado». «Planificador controlado» lleva a «Calendario que falla siempre». «Calendario que falla siempre» lleva a «Reducción al mínimo». «Reducción al mínimo» lleva a «Causa: pasos y orden». «Causa: pasos y orden» lleva a «Corrección». «Corrección» lleva a «Regresión: falla antes, pasa después». «Modelo con pasos explícitos» lleva a «Flujo con efectos: puntos de fallo». «Flujo con efectos: puntos de fallo» lleva a «Corte frente a respuesta perdida». «Corte frente a respuesta perdida» lleva a «Corrección».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="404" height="923" fill="#ffffff"/><path d="M191,66 L191,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M191,185 L191.0,205.0 Q191,214 182.0,214.0 L104.9,214.0 Q95.9,214 95.9,223.0 L95.9,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M96.4,304 L96.4,362" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M97,423 L97.0,445.3 Q97,452 103.7,452.0 L103.7,452.0 Q110.4,452 110.4,458.7 L110.4,481" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M110.4,542 L110.4,564.6 Q110.4,571 116.8,571.0 L116.8,571.0 Q123.2,571 123.2,577.4 L123.2,600" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M123.2,661 L123.2,685.3 Q123.2,690 127.9,690.0 L127.9,690.0 Q132.6,690 132.6,694.7 L132.6,719" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M135.1,763 L135.1,821" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M191,185 L191.0,205.0 Q191,214 200.0,214.0 L279.9,214.0 Q288.9,214 288.9,223.0 L288.9,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M291.5,304 L291.5,362" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M294,423 L294.0,732.0 Q294,741 285.0,741.0 L190.1,741" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="98.5" y="22" width="185" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="191" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="191" dy="0">Síntoma esporádico</tspan></text><rect x="107" y="124" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="191" y="149.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="191" dy="0">Modelo con pasos</tspan><tspan x="191" dy="19.2">explícitos</tspan></text><rect x="29.4" y="243" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="95.9" y="268.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="95.9" dy="0">Planificador</tspan><tspan x="95.9" dy="19.2">controlado</tspan></text><rect x="22" y="362" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="97" y="387.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="97" dy="0">Calendario que</tspan><tspan x="97" dy="19.2">falla siempre</tspan></text><rect x="43.9" y="481" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="110.4" y="506.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110.4" dy="0">Reducción al</tspan><tspan x="110.4" dy="19.2">mínimo</tspan></text><rect x="48.2" y="600" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="123.2" y="625.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="123.2" dy="0">Causa: pasos y</tspan><tspan x="123.2" dy="19.2">orden</tspan></text><rect x="75.1" y="719" width="115" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="132.6" y="745.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="132.6" dy="0">Corrección</tspan></text><rect x="53.6" y="821" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="137.6" y="846" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="137.6" dy="0">Regresión: falla</tspan><tspan x="137.6" dy="19.2">antes, pasa</tspan><tspan x="137.6" dy="19.2">después</tspan></text><rect x="196.4" y="243" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="288.9" y="268.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="288.9" dy="0">Flujo con efectos:</tspan><tspan x="288.9" dy="19.2">puntos de fallo</tspan></text><rect x="206" y="362" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="294" y="387.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="294" dy="0">Corte frente a</tspan><tspan x="294" dy="19.2">respuesta perdida</tspan></text></svg>
