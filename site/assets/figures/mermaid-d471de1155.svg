<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 763 669" width="763" height="669" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Carga» … «Dueño decide: arreglar, aceptar o ajustar»</title><desc id="d">Diagrama de flujo con 10 pasos. «Carga» lleva a «Comprobaciones». «Comprobaciones» lleva a «¿Pasa?». «¿Pasa?» lleva a «Se publica» (sí). «¿Pasa?» lleva a «Se detiene y avisa al dueño» (no, crítica). «¿Pasa?» lleva a «Se publica con marca» (no, aviso). «Comprobaciones» lleva a «Serie histórica de señales». «Serie histórica de señales» lleva a «Detector con estacionalidad». «Detector con estacionalidad» lleva a «Alerta accionable». «Alerta accionable» lleva a «Dueño decide: arreglar, aceptar o ajustar».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="763" height="669" fill="#ffffff"/><path d="M407.3,66 L407.3,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M407.3,168 L407.3,188.0 Q407.3,197 398.3,197.0 L320.8,197.0 Q311.8,197 311.8,206.0 L311.8,226" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M311.8,288 L311.8,296.0 Q311.8,304 303.8,304.0 L88.5,304.0 Q79.5,304 79.5,313.0 L79.5,354.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M311.8,288 L311.8,296.0 Q311.8,304 303.8,304.0 L272.5,304.0 Q263.5,304 263.5,313.0 L263.5,346" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M311.8,288 L311.8,296.0 Q311.8,304 319.8,304.0 L640.0,304.0 Q649,304 649.0,313.0 L649,346" fill="none" stroke="#32505f" stroke-width="