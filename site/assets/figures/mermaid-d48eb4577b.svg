<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 413 496" width="413" height="496" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Adaptador web» y «Suite de contrato» … «Puerto repositorio»</title><desc id="d">Diagrama de flujo con 7 pasos. «Adaptador web» lleva a «Casos de uso». «Casos de uso» lleva a «Dominio». «Casos de uso» lleva a «Puerto repositorio». «Adaptador SQL» lleva a «Puerto repositorio» (implementa). «Doble en memoria» lleva a «Puerto repositorio» (implementa). «Suite de contrato» lleva a «Adaptador SQL». «Suite de contrato» lleva a «Doble en memoria». «Dominio» lleva a «Adaptador SQL» (no depende de).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="413" height="496" fill="#ffffff"/><path d="M111.7,66 L111.7,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M117,168 L117,226" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M47,146 L33.0,146.0 Q24,146 24.0,155.0 L24.0,445.0 Q24,452 31.0,452.0 L38,452" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M128.6,372 L128.6,430" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M299.5,168 L299.5,443.0 Q299.5,452 290.5,452.0 L223,452" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M215,44 L208.0,44.0 Q201,44 201.0,51.0 L201.0,308.6 Q201,314 206.4,314.0 L206.4,314.0 Q211.8,314 211.8,319.4 L211.8,343.0 Q211.8,350 204.8,350.0 L197.8,350" fill="none" stroke="#32505f" stroke-wi