<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 823 147" width="823" height="147" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Éxito y no éxito» … «Abandonar y conservar»</title><desc id="d">Diagrama de flujo con 5 pasos. «Éxito y no éxito» lleva a «Zona gris». «Zona gris» lleva a «Reglas de parada». «Reglas de parada» lleva a «Coste hundido y compromiso». «Coste hundido y compromiso» lleva a «Abandonar y conservar». «Abandonar y conservar» lleva a «Éxito y no éxito» (fallo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="823" height="147" fill="#ffffff"/><path d="M137,94.5 L183,94.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M290,94.5 L336,94.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M443,94.5 L489,94.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M631,94.5 L677,94.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M739,64 L739.0,57.0 Q739,50 732.0,50.0 L86.5,50.0 Q79.5,50 79.5,57.0 L79.5,64" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="64" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="79.5" y="89.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="79.5" dy="0">Éxito y no</tspan><tspan x="79.5" dy="19.2">éxito</tspan></text><rect x="183" y="72.5" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="236.5" y="98.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="236.5" dy="0">Zona gris</tspan></text><rect x="336" y="64" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="389.5" y="89.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="389.5" dy="0">Reglas de</tspan><tspan x="389.5" dy="19.2">parada</tspan></text><rect x="489" y="64" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="560" y="89.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="560" dy="0">Coste hundido</tspan><tspan x="560" dy="19.2">y compromiso</tspan></text><rect x="677" y="64" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="739" y="89.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="739" dy="0">Abandonar y</tspan><tspan x="739" dy="19.2">conservar</tspan></text><rect x="346.2" y="22" width="126" height="24" rx="4" fill="#ffffff"/><text x="409.2" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="409.2" dy="0">fallo o cambio</tspan></text></svg>
