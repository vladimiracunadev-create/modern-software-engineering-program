<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 280" width="840" height="280" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Cambio en texto» … «Publicación con huella»</title><desc id="d">Diagrama de flujo con 6 pasos. «Cambio en texto» lleva a «Pull request». «Pull request» lleva a «Comprobaciones: enlaces, estilo, ejemplos». «Pull request» lleva a «Revisión humana: exactitud y claridad». «Comprobaciones: enlaces, estilo, ejemplos» lleva a «Construcción reproducible». «Revisión humana: exactitud y claridad» lleva a «Construcción reproducible». «Construcción reproducible» lleva a «Publicación con huella». «Publicación con huella» lleva a «Cambio en texto» (enlace roto o deriva).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="840" height="280" fill="#ffffff"/><path d="M129,140 L175,140" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M264,140 L278.0,140.0 Q287,140 287.0,131.0 L287.0,80.5 Q287,71.5 296.0,71.5 L310,71.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M264,140 L286.8,140.0 Q295.8,140 295.8,149.0 L295.8,199.5 Q295.8,208.5 304.8,208.5 L327.5,208.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M469,71.5 L483.0,71.5 Q492,71.5 492.0,80.5 L492.0,131.0 Q492,140 501.0,140.0 L515,140" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M451.5,208.5 L474.2,208.5 Q483.2,208.5 483.2,199.5 L483.2,149.0 Q483.2,140 492.2,140.0 L515,140" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M648,140 L694,140" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M756,109.5 L756.0,102.5 Q756,95.5 749.0,95.5 L492.0,95.5 Q483,95.5 483.0,104.5 L483.0,126.0 Q483,135 474.0,135.0 L287.0,135.0 Q278,135 278.0,126.0 L278.0,104.5 Q278,95.5 269.0,95.5 L82.5,95.5 Q75.5,95.5 75.5,102.5 L75.5,109.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="109.5" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="75.5" y="134.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="75.5" dy="0">Cambio en</tspan><tspan x="75.5" dy="19.2">texto</tspan></text><rect x="175" y="109.5" width="89" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="219.5" y="134.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="219.5" dy="0">Pull</tspan><tspan x="219.5" dy="19.2">request</tspan></text><rect x="310" y="22" width="159" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="389.5" y="46.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="389.5" dy="0">Comprobaciones:</tspan><tspan x="389.5" dy="19.2">enlaces,</tspan><tspan x="389.5" dy="19.2">estilo,</tspan><tspan x="389.5" dy="19.2">ejemplos</tspan></text><rect x="327.5" y="159" width="124" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="389.5" y="183.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="389.5" dy="0">Revisión</tspan><tspan x="389.5" dy="19.2">humana:</tspan><tspan x="389.5" dy="19.2">exactitud y</tspan><tspan x="389.5" dy="19.2">claridad</tspan></text><rect x="515" y="109.5" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="581.5" y="134.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="581.