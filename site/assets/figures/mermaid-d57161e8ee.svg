<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 641 640" width="641" height="640" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Mismo código y mismos datos» … «Prueba en CI»</title><desc id="d">Diagrama de flujo con 9 pasos. «Mismo código y mismos datos» lleva a «¿Qué cambia?». «¿Qué cambia?» lleva a «Compatibilidad: hacia atrás y hacia adelante» (versión). «¿Qué cambia?» lleva a «Portabilidad: sistema, codificación, rutas» (entorno). «¿Qué cambia?» lleva a «Interoperabilidad: representación en la frontera» (sistema o lenguaje). «Compatibilidad: hacia atrás y hacia adelante» lleva a «Matriz ejecutable». «Portabilidad: sistema, codificación, rutas» lleva a «Sondas por sistema». «Interoperabilidad: representación en la frontera» lleva a «Contrato con representaciones fijadas». «Matriz ejecutable» lleva a «Prueba en CI». «Sondas por sistema» lleva a «Prueba en CI». «Contrato con representaciones fijadas» lleva a «Prueba en CI». «Prueba en CI» lleva a «¿Qué cambia?» (diferencia nueva).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="641" height="640" fill="#ffffff"/><path d="M323,83 L323,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M323,203 L323.0,211.0 Q323,219 315.0,219.0 L143.2,219.0 Q134.2,219 134.2,228.0 L134.2,288.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M320.9,203 L320.9,279" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M323,203 L323.0,211.0 Q323,219 331.0,219.0 L507.2,219.0 Q516.2,219 516.2,228.0 L516.2,288.5" fill="