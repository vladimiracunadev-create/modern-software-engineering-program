<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 809 198" width="809" height="198" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Actor y objetivo» … «Job story del contexto» y «Corte vertical»</title><desc id="d">Diagrama de flujo con 5 pasos. «Actor y objetivo» lleva a «Caso de uso». «Caso de uso» lleva a «Historias cortadas». «Historias cortadas» lleva a «Job story del contexto». «Historias cortadas» lleva a «Corte vertical». «Corte vertical» lleva a «Actor y objetivo» (nadie lo entiende).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="809" height="198" fill="#ffffff"/><path d="M190,93.5 L236,93.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M360,93.5 L406,93.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M591,93.5 L607.0,93.5 Q616,93.5 616.0,84.5 L616.0,61.5 Q616,52.5 625.0,52.5 L641,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M591,93.5 L605.0,93.5 Q614,93.5 614.0,102.5 L614.0,134.0 Q614,143 623.0,143.0 L637,143" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M712,121 L712.0,114.0 Q712,107 705.0,107.0 L614.0,107.0 Q605,107 605.0,116.0 L605.0,120.5 Q605,129.5 596.0,129.5 L113.0,129.5 Q106,129.5 106.0,122.5 L106,115.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="71.5" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="97.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Actor y objetivo</tspan></text><rect x="236" y="71.5" width="124" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="298" y="97.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="298" dy="0">Caso de uso</tspan></text><rect x="406" y="71.5" width="185" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="498.5" y="97.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="498.5" dy="0">Historias cortadas</tspan></text><rect x="641" y="22" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="712" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="712" dy="0">Job story del</tspan><tspan x="712" dy="19.2">contexto</tspan></text><rect x="637" y="121" width="150" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="712" y="147.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="712" dy="0">Corte vertical</tspan></text><rect x="317" y="133.5" width="77" height="42" rx="4" fill="#ffffff"/><text x="355.5" y="149.4" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="355.5" dy="0">nadie lo</tspan><tspan x="355.5" dy="17.92">entiende</tspan></text></svg>
