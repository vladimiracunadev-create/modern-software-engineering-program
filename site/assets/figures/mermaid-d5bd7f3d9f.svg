<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 679 475" width="679" height="475" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Regla de negocio por tramos» … «Sobrevivientes: caso faltante o equivalente»</title><desc id="d">Diagrama de flujo con 7 pasos. «Regla de negocio por tramos» lleva a «Casos típicos y de frontera». «Casos típicos y de frontera» lleva a «Prueba con aserción sobre el valor». «Prueba con aserción sobre el valor» lleva a «¿La función depende de reloj, base o red?». «¿La función depende de reloj, base o red?» lleva a «Separar cálculo de efectos e inyectar» (sí). «¿La función depende de reloj, base o red?» lleva a «Medir con mutantes» (no). «Separar cálculo de efectos e inyectar» lleva a «Medir con mutantes». «Medir con mutantes» lleva a «Sobrevivientes: caso faltante o equivalente». «Sobrevivientes: caso faltante o equivalente» lleva a «Casos típicos y de frontera» (nuevo caso).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="679" height="475" fill="#ffffff"/><path d="M190,62 L236,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M395,62 L477.5,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M552.5,102 L552.5,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M448,237.5 L395,237.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M448,237.5 L441.0,237.5 Q434,237.5 434.0,230.5 L434.0,192.5 Q434,183.5 425.0,183.5 L115.0,183.5 Q106,183.5 106.0,192.5 L106,207" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M236,237.5 L159.5,237.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M106,268 L106,373" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M185.5,413 L213.0,413.0 Q222,413 222.0,404.0 L222.0,115.5 Q222,106.5 231.0,106.5 L308.5,106.5 Q315.5,106.5 315.5,99.5 L315.5,92.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="31.5" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Regla de negocio</tspan><tspan x="106" dy="19.2">por tramos</tspan></text><rect x="236" y="31.5" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="315.5" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="315.5" dy="0">Casos típicos y</tspan><tspan x="315.5" dy="19.2">de frontera</tspan></text><rect x="477.5" y="22" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="552.5" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="552.5" dy="0">Prueba con</tspan><tspan x="552.5" dy="19.2">aserción sobre</tspan><tspan x="552.5" dy="19.2">el valor</tspan></text><polygon points="552.5,160 657,237.5 552.5,315 448,237.5" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="552.5" y="212.9" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="552.5" dy="0">¿La función</tspan><tspan x="552.5" dy="19.2">depende de</tspan><tspan x="552.5" dy="19.2">reloj, base o</tspan><tspan x="552.5" dy="19.2">red?</tspan></text><rect x="236" y="197.5" width="159" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="315.5" y="222.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="315.5" dy="0">Separar cálculo</tspan><tspan x="315.5" dy="19.2">de efectos e</tspan><tspan x="315.5" dy="19.2">inyectar</tspan></text><rect x="52.5" y="207" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="232.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Medir con</tspan><tspan x="106" dy="19.2">mutantes</tspan></text><rect x="26.5" y="373" width="159" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="398" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Sobrevivientes:</tspan><tspan x="106" dy="19.2">caso faltante o</tspan><tspan x="106" dy="19.2">equivalente</tspan></text><rect x="407" y="241.5" width="29" height="24" rx="4" fill="#ffffff"/><text x="421.5" y="257.4" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="421.5" dy="0">sí</tspan></text><rect x="112" y="178.6" width="29" height="24" rx="4" fill="#ffffff"/><text x="126.5" y="194.5" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="126.5" dy="0">no</tspan></text><rect x="122" y="278.4" width="94" height="24" rx="4" fill="#ffffff"/><text x="169" y="294.3" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="169" dy="0">nuevo caso</tspan></text></svg>
