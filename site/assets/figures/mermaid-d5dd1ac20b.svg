<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 728 651" width="728" height="651" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Mensaje» … «Confirmado»</title><desc id="d">Diagrama de flujo con 10 pasos. «Mensaje» lleva a «Garantía». «Garantía» lleva a «Puede perderse» (a lo sumo una vez). «Garantía» lleva a «Puede duplicarse» (al menos una vez). «Garantía» lleva a «Más paquetes» (exactamente una vez). «Mensaje» lleva a «Cola local». «Cola local» lleva a «Acumula» (red caída). «Acumula» lleva a «Reintento con jitter» (reconexión). «Reintento con jitter» lleva a «Servidor». «Servidor» lleva a «Confirmado» (ACK).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="728" height="651" fill="#ffffff"/><path d="M387.9,66 L387.9,86.0 Q387.9,95 378.9,95.0 L322.2,95.0 Q313.2,95 313.2,104.0 L313.2,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M313.2,186 L313.2,194.0 Q313.2,202 305.2,202.0 L106.0,202.0 Q97,202 97.0,211.0 L97,262" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M313.2,186 L313.2,194.0 Q313.2,202 305.2,202.0 L299.0,202.0 Q290,202 290.0,211.0 L290,262" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M313.2,186 L313.2,194.0 Q313.2,202 321.2,202.0 L588.5,202.0 Q597.5,202 597.5,211.0 L597.5,262" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M387.9,66 L387.9,90.5 Q387.9,99.5 396.9,99.5 L453.7,99.5 Q462.7,99.5 462.7,108.5 L462.7,133" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M462.7,177 L462.7,187.9 Q462.7,193 457.6,193.0 L457.6,193.0 Q452.5,193 452.5,198.1 L452.5,262" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M455.4,306 L455.4,364" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M460.7,425 L460.7,483" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M463.8,527 L463.8,585" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="343.4" y="22" width="89" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="387.9" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="387.9" dy="0">Mensaje</tspan></text><polygon points="313.2,124 371.2,155 313.2,186 255.2,155" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="313.2" y="159.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="313.2" dy="0">Garantía</tspan></text><rect x="22" y="262" width="150" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="97" y="288.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="97" dy="0">Puede perderse</tspan></text><rect x="206" y="262" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="290" y="288.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="290" dy="0">Puede duplicarse</tspan></text><rect x="531" y="262" width="133" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="597.5" y="288.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="597.5" dy="0">Más paquetes</tspan></text><rect x="405.2" y="133" width="115" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="462.7" y="159.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="462.7" dy="0">Cola local</tspan></text><