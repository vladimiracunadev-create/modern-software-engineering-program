<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 471 1054" width="471" height="1054" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Cliente consulta el canal» … «Volver al puntero anterior» y «Limpiar versiones antiguas tras un plazo»</title><desc id="d">Diagrama de flujo con 11 pasos. «Cliente consulta el canal» lleva a «¿Hay versión nueva firmada y con secuencia mayor?». «¿Hay versión nueva firmada y con secuencia mayor?» lleva a «Seguir» (no). «¿Hay versión nueva firmada y con secuencia mayor?» lleva a «Descargar a un directorio aparte» (sí). «Descargar a un directorio aparte» lleva a «Verificar huella y firma». «Verificar huella y firma» lleva a «Descartar; la instalación actual no se toca» (falla). «Verificar huella y firma» lleva a «Migrar la configuración de forma reversible» (ok). «Migrar la configuración de forma reversible» lleva a «Activar: cambiar el puntero de forma atómica». «Activar: cambiar el puntero de forma atómica» lleva a «Arrancar y comprobar». «Arrancar y comprobar» lleva a «Volver al puntero anterior» (falla). «Arrancar y comprobar» lleva a «Limpiar versiones antiguas tras un plazo» (ok).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="471" height="1054" fill="#ffffff"/><path d="M182,83 L182,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M182,261 L182.0,269.0 Q182,277 174.0,277.0 L119.5,277.0 Q110.5,277 110.5,286.0 L110.5,327.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M182,261 L182.0,269.0 Q182,277 190.0,277.0 L264.0,277.0 Q273,277 273.0,286.0 L273,319" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M273,380 L273.0,403.6 Q273,409 267.6,409.0 L267.6,409.0 Q262.1,409 262.1,414.4 L262.1,438" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M262.1,499 L262.1,507.0 Q262.1,515 254.1,515.0 L163.5,515.0 Q154.5,515 154.5,524.0 L154.5,557" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M262.1,499 L262.1,507.0 Q262.1,515 270.1,515.0 L356.0,515.0 Q365,515 365.0,524.0 L365,557" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M365,637 L365.0,657.0 Q365,666 356.0,666.0 L315.2,666.0 Q306.2,666 306.2,675.0 L306.2,695" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M306.2,775 L306.2,795.0 Q306.2,804 297.2,804.0 L263.4,804.0 Q254.4,804 254.4,813.0 L254.4,833" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M254.4,894 L254.4,902.0 Q254.4,910 246.4,910.0 L139.5,910.0 Q130.5,910 130.5,919.0 L130.5,961.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M254.4,894 L254.4,902.0 Q254.4,910 262.4,910.0 L331.5,910.0 Q340.5,910 340.5,919.0 L340.5,952" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="98" y="22" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="182" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="182" dy="0">Cliente consulta</tspan><tspan x="182" dy="19.2">el canal</tspan></text><polygon points="182,141 342,201 182,261 22,201" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="182" y="186" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="182" dy="0">¿Hay versión nueva</tspan><tspan x="182" dy="19.2">firmada y con</tspan><tspan x="182" dy="19.2">secuencia mayor?</tspan></text><rect x="70" y="327.5" width="81" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="110.5" y="353.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110.5" dy="0">Seguir</tspan></text><rect x="185" y="319" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="273" y="344.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="273" dy="0">Descargar a un</tspan><tspan x="273" dy="19.2">directorio aparte</tspan></text><rect x="169.6" y="438" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="262.1" y="463.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="262.1" dy="0">Verificar huella y</tspan><tspan x="262.1" dy="19.2">firma</tspan></text><rect x="62" y="557" width="185" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="154.5" y="582" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="154.5" dy="0">Descartar; la</tspan><tspan x="154.5" dy="19.2">instalación actual</tspan><tspan x="154.5" dy="19.2">no se toca</tspan></text><rect x="281" y="557" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="365" y="582" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="365" dy="0">Migrar la</tspan><tspan x="365" dy="19.2">configuración de</tspan><tspan x="365" dy="19.2">forma reversible</tspan></text><rect x="222.2" y="695" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="306.2" y="720" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="306.2" dy="0">Activar: cambiar</tspan><tspan x="306.2" dy="19.2">el puntero de</tspan><tspan x="306.2" dy="19.2">forma atómica</tspan></text><rect x="196.9" y="833" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="254.4" y="858.1" font-size="15" text-anc