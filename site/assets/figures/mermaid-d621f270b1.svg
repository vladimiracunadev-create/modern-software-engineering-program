<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 546 929" width="546" height="929" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Casos y criterio de calidad» … «Monitorear en producción» y «Analizar fallos»</title><desc id="d">Diagrama de flujo con 11 pasos. «Casos y criterio de calidad» lleva a «Línea base medida». «Línea base medida» lleva a «Cambio». «Cambio» lleva a «Evaluación repetida». «Evaluación repetida» lleva a «Puntuación y variación». «Puntuación y variación» lleva a «¿Supera el umbral con margen?». «¿Supera el umbral con margen?» lleva a «Publicar» (sí). «¿Supera el umbral con margen?» lleva a «Retener» (no). «¿Supera el umbral con margen?» lleva a «Más casos o más repeticiones» (dudoso). «Más casos o más repeticiones» lleva a «Evaluación repetida». «Publicar» lleva a «Monitorear en producción». «Retener» lleva a «Analizar fallos». «Analizar fallos» lleva a «Casos y criterio de calidad».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="546" height="929" fill="#ffffff"/><path d="M342.7,83 L342.7,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M342.7,185 L342.7,209.5 Q342.7,214 338.1,214.0 L338.1,214.0 Q333.6,214 333.6,218.5 L333.6,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M333.6,287 L333.6,308.5 Q333.6,316 326.1,316.0 L326.1,316.0 Q318.7,316 318.7,323.5 L318.7,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M318.7,406 L318.7,426.0 Q318.7,435 309.7,435.0 L305.6,435.0 Q296.6,435 296.6,444.0 L296.6,464" fill="non