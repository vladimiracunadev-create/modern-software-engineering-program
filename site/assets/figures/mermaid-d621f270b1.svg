ciones</tspan></text><rect x="22" y="846" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="93" y="871.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="93" dy="0">Monitorear en</tspan><tspan x="93" dy="19.2">producción</tspan></text><rect x="198" y="854.5" width="159" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="277.5" y="880.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="277.5" dy="0">Analizar fallos</tspan></text><rect x="119" y="698.2" width="29" height="24" rx="4" fill="#ffffff"/><text x="133.5" y="714.1" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="133.5" dy="0">sí</tspan></text><rect x="246.5" y="698.2" width="29" height="24" rx="4" fill="#ffffff"/><text x="261" y="714.1" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="261" dy="0">no</tspan></text><rect x="404.5" y="694" width="61" height="24" rx="4" fill="#ffffff"/><text x="435" y="709.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="435" dy="0">dudoso</tspan></text></svg>
