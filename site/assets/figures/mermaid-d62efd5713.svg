2.5" y="224.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="302.5" dy="0">Lista de commits a</tspan><tspan x="302.5" dy="19.2">ignorar</tspan></text><rect x="537" y="207.5" width="133" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="603.5" y="233.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="603.5" dy="0">Autoría real</tspan></text><rect x="391.8" y="22" width="118" height="42" rx="4" fill="#ffffff"/><text x="450.8" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="450.8" dy="0">último patrón</tspan><tspan x="450.8" dy="17.92">gana</tspan></text></svg>
