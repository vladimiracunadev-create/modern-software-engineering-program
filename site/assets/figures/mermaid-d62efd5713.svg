<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 853 282" width="853" height="282" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Ruta cambiada», «Mensaje» y «Reformateo» … «Revisión solicitada»</title><desc id="d">Diagrama de flujo con 10 pasos. «Ruta cambiada» lleva a «CODEOWNERS». «CODEOWNERS» lleva a «Propietario» (último patrón gana). «Propietario» lleva a «Revisión solicitada». «Mensaje» lleva a «Validador». «Validador» lleva a «Registro de cambios». «Reformateo» lleva a «Lista de commits a ignorar». «Lista de commits a ignorar» lleva a «Autoría real».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="853" height="282" fill="#ffffff"/><path d="M164,68 L245,68" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M360,68 L541.5,68" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M665.5,72.2 L716,72.2" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M137.5,144.5 L249,144.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M356,144.5 L541.5,144.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M150.5,229.5 L210,229.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M395,229.5 L537,229.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="46" width="142" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="93" y="72.2" font-size="15" text-anchor="middle" font-weight="400" fill="#