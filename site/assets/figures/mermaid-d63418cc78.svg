<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 491 887" width="491" height="887" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «0. Expandir» y «Verificación de contenido» … «Punto de no retorno»</title><desc id="d">Diagrama de flujo con 9 pasos. «0. Expandir» lleva a «1. Rellenar por lotes». «1. Rellenar por lotes» lleva a «2. Doble escritura». «2. Doble escritura» lleva a «3. Leer del esquema nuevo». «3. Leer del esquema nuevo» lleva a «4. Escribir solo en el nuevo». «4. Escribir solo en el nuevo» lleva a «5. Reposo». «5. Reposo» lleva a «6. Contraer». «3. Leer del esquema nuevo» lleva a «2. Doble escritura» (vuelta: sin pérdida). «4. Escribir solo en el nuevo» lleva a «3. Leer del esquema nuevo» (vuelta: pierde las escrituras nuevas). «5. Reposo» lleva a «4. Escribir solo en el nuevo» (vuelta: costo creciente). «6. Contraer» lleva a «Punto de no retorno» (sin vuelta). «Verificación de contenido» lleva a «1. Rellenar por lotes». «Verificación de contenido» lleva a «2. Doble escritura». «Verificación de contenido» lleva a «3. Leer del esquema nuevo». «Verificación de contenido» lleva a «4. Escribir solo en el nuevo».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="491" height="887" fill="#ffffff"/><path d="M147.9,74.5 L147.9,98.8 Q147.9,107.8 156.9,107.8 L226.7,107.8 Q235.7,107.8 235.7,116.8 L235.7,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M236.1,202 L236.1,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M237,304 L237,362" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M237.8,423 L237.8,481" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M238.6,542 L238.6,600" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M239.1,644 L239.1,702" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M239.4,746 L239.4,804" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M323.4,83 L323.4,103.0 Q323.4,112 314.4,112.0 L244.7,112.0 Q235.7,112 235.7,121.0 L235.7,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M402.9,52.5 L409.9,52.5 Q416.9,52.5 416.9,59.5 L416.9,273.0 Q416.9,282 407.9,282.0 L329,282" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M323.4,83 L323.4,90.0 Q323.4,97 330.4,97.0 L334.0,97.0 Q343,97 343.0,106.0 L343.0,383.5 Q343,392.5 334.0,392.5 L308.4,392.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M243.9,52.5 L232.9,52.5 Q223.9,52.5 223.9,61.5 L223.9,88.0 Q223.9,97 214.9,97.0 L139.0,97.0 Q130,97 130.0,106.0 L130.0,502.5 Q130,511.5 139.0,511.5 L154.2,511.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M166.4,392.5 L149.2,392.5 Q140.2,392.5 140.2,383.5 L140.2,323.1 Q140.2,318 135.1,318.0 L135.1,318.0 Q130,318 130.0,312.9 L130.0,289.0 Q130,282 137.0,282.0 L144,282" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><path d="M322.2,511.5 L329.2,511.5 Q336.2,511.5 336.2,504.5 L336.2,401.5 Q336.2,392.5 327.2,392.5 L308.4,392.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><path d="M292.4,622 L327.2,622.0 Q336.2,622 336.2,613.0 L336.2,518.5 Q336.2,511.5 329.2,511.5 L322.2,511.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x