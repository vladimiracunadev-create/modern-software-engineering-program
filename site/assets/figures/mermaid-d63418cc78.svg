oke-width="1.6"/><text x="239.5" y="829.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="239.5" dy="0">Punto de no</tspan><tspan x="239.5" dy="19.2">retorno</tspan></text><rect x="243.9" y="22" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="323.4" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="323.4" dy="0">Verificación de</tspan><tspan x="323.4" dy="19.2">contenido</tspan></text><rect x="22" y="279" width="102" height="42" rx="4" fill="#ffffff"/><text x="73" y="294.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="73" dy="0">vuelta: sin</tspan><tspan x="73" dy="17.92">pérdida</tspan></text><rect x="342.2" y="422" width="126" height="60" rx="4" fill="#ffffff"/><text x="405.2" y="437.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="405.2" dy="0">vuelta: pierde</tspan><tspan x="405.2" dy="17.92">las escrituras</tspan><tspan x="405.2" dy="17.92">nuevas</tspan></text><rect x="342.2" y="545.8" width="118" height="42" rx="4" fill="#ffffff"/><text x="401.2" y="561.7" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="401.2" dy="0">vuelta: costo</tspan><tspan x="401.2" dy="17.92">creciente</tspan></text><rect x="245.4" y="763" width="94" height="24" rx="4" fill="#ffffff"/><text x="292.4" y="778.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="292.4" dy="0">sin vuelta</tspan></text></svg>
