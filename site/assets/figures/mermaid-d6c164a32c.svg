<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 471 1010" width="471" height="1010" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Problema» … «Producto»</title><desc id="d">Diagrama de flujo con 12 pasos. «Problema» lleva a «Criterios previos». «Criterios previos» lleva a «Generar N alternativas». «Generar N alternativas» lleva a «Evaluar con ruido». «Evaluar con ruido» lleva a «Elegir». «Elegir» lleva a «Alternativa elegida». «Elegir» lleva a «Descartadas con razón». «Alternativa elegida» lleva a «Destino». «Destino» lleva a «Aprender y tirar» (desechable). «Destino» lleva a «Endurecer: pruebas, errores, seguridad» (evolutivo). «Endurecer: pruebas, errores, seguridad» lleva a «Producto». «Descartadas con razón» lleva a «Registro de decisión». «Alternativa elegida» lleva a «Registro de decisión».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="471" height="1010" fill="#ffffff"/><path d="M290.9,66 L290.9,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M290.3,168 L290.3,226" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M288.8,287 L288.8,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M286.2,389 L286.2,447" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M284.5,509 L284.5,529.0 Q284.5,538 275.5,538.0 L202.9,538.0 Q193.9,538 193.9,547.0 L193.9,567" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M284.5,509 L284.5,529.0 Q284.5,538 293.5,538.0 L360.4,538.0 Q369.4,538 369.4,547.0 L369.4,567" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M193.9,628 L193.9,648.0 Q193.9,657 184.9,657.0 L180.6,657.0 Q171.6,657 171.6,666.0 L171.6,686" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M171.6,748 L171.6,756.0 Q171.6,764 163.6,764.0 L115.0,764.0 Q106,764 106.0,773.0 L106,824" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M171.6,748 L171.6,756.0 Q171.6,764 179.6,764.0 L303.0,764.0 Q312,764 312.0,773.0 L312,806" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M313,886 L313,944" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M369.4,628 L369.4,648.2 Q369.4,657.2 360.4,657.2 L328.1,657.2 Q319.1,657.2 319.1,666.2 L319.1,686.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M193.9,628 L193.9,648.2 Q193.9,657.2 202.9,657.2 L310.1,657.2 Q319.1,657.2 319.1,666.2 L319.1,686.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="241.9" y="22" width="98" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="290.9" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="290.9" dy="0">Problema</tspan></text><rect x="202.9" y="124" width="176" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="290.9" y="150.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="290.9" dy="0">Criterios previos</tspan></text><rect x="223.3" y="226" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="289.8" y="251.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="289.8" dy="0">Generar N</tspan><tspan x="289.8" dy="19.2">alternativas</tspan></text><rect x="199.9" y="345" width="176" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="287.9" y="371.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="287.9" dy="0">Evaluar con ruido</tspan></text><polygon points="284.5,447 330,478 284.5,509 239,478" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="284.5" y="482.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="284.5" dy="0">Elegir</tspan></text><rect x="131.9" y="567" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="193.9" y="592.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="193.9" dy="0">Alternativa</tspan><tspan x="193.9" dy="19.2">elegida</tspan></text><rect x="289.9" y="567" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="369.4" y="592.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="369.4" dy="0">Descartadas con</tspan><tspan x="369.4" dy="19.2">razón</tspan></text><polygon points="171.6,686 223.1,717 171.6,748 120.1,717" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="171.6" y="721.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="171.6" dy="0">Destino</tspan></text><rect x="22" y="824" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="850.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Aprender y tirar</tspan></text><rect x="224" y="806" width="176" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="312" y="831" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="312" dy="0">Endurecer:</tspan><tspan x="312" dy="19.2">pruebas, errores,</tspan><tspan x="312" dy="19.2">seguridad</tspan></text><rect x="264.9" y="944" width="98" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="313.9" y="970.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="313.9" dy="0">Producto</tspan></text><rect x="257.1" y="686.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="319.1" y="711.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="319.1" dy="0">Registro de</tspan><tspan x="319.1" dy="19.2">decisión</tspan></text><rect x="112" y="782" width="94" height="24" rx="4" fill="#ffffff"/><text x="159" y="797.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="159" dy="0">desechable</tspan></text><rect x="318" y="773" width="86" height="24" rx="4" fill="#ffffff"/><text x="361" y="788.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="361" dy="0">evolutivo</tspan></text></svg>
