<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 564" width="412" height="564" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Señal de acción» … «Confirmación y deshacer» y «Reintento seguro»</title><desc id="d">Diagrama de flujo con 6 pasos. «Señal de acción» lleva a «Acción de la persona». «Acción de la persona» lleva a «Respuesta inmediata». «Respuesta inmediata» lleva a «Resultado en el servidor». «Resultado en el servidor» lleva a «Confirmación y deshacer» (éxito). «Resultado en el servidor» lleva a «Reintento seguro» (fallo o demora). «Reintento seguro» lleva a «Acción de la persona».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="412" height="564" fill="#ffffff"/><path d="M194,66 L194,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M193.9,185 L193.9,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M193.7,304 L193.7,362" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M193.6,423 L193.6,431.0 Q193.6,439 185.6,439.0 L106.0,439.0 Q97,439 97.0,448.0 L97,481" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M193.6,423 L193.6,431.0 Q193.6,439 201.6,439.0 L281.0,439.0 Q290,439 290.0,448.0 L290,489.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M374,511.5 L381.0,511.5 Q388,511.5 388.0,504.5 L388.0,163.5 Q388,154.5 379.0,154.5 L260.5,154.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="114.5" y="22" width="159" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="194" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="194" dy="0">Señal de acción</tspan></text><rect x="127.5" y="124" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="194" y="149.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="194" dy="0">Acción de la</tspan><tspan x="194" dy="19.2">persona</tspan></text><rect x="140.3" y="243" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="193.8" y="268.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="193.8" dy="0">Respuesta</tspan><tspan x="193.8" dy="19.2">inmediata</tspan></text><rect x="114.1" y="362" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="193.6" y="387.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="193.6" dy="0">Resultado en el</tspan><tspan x="193.6" dy="19.2">servidor</tspan></text><rect x="22" y="481" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="97" y="506.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="97" dy="0">Confirmación y</tspan><tspan x="97" dy="19.2">deshacer</tspan></text><rect x="206" y="489.5" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="290" y="515.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="290" dy="0">Reintento seguro</tspan></text><rect x="103" y="448" width="53" height="24" rx="4" fill="#ffffff"/><text x="129.5" y="463.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="129.5" dy="0">éxito</tspan></text><rect x="158" y="452.2" width="126" height="24" rx="4" fill="#ffffff"/><text x="221" y="468.1" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="221" dy="0">fallo o demora</tspan></text></svg>
