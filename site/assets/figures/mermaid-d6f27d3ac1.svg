<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 793 438" width="793" height="438" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Liderazgo técnico sin autoridad formal» … «Proyecto: dossier profesional defendible»</title><desc id="d">Diagrama de flujo con 12 pasos. «Liderazgo técnico sin autoridad formal» lleva a «Equipos y ownership». «Equipos y ownership» lleva a «Comunicación, facilitación y conflicto». «Comunicación, facilitación y conflicto» lleva a «Mentoría, feedback y crecimiento». «Mentoría, feedback y crecimiento» lleva a «Estimación y compromisos». «Estimación y compromisos» lleva a «Riesgos y decisiones ejecutivas». «Riesgos y decisiones ejecutivas» lleva a «Compras y evaluación de proveedores». «Compras y evaluación de proveedores» lleva a «Propiedad intelectual, contratos y ética». «Propiedad intelectual, contratos y ética» lleva a «Economía y costo total». «Economía y costo total» lleva a «Portafolio, entrevistas y defensa». «Portafolio, entrevistas y defensa» lleva a «Taller: revisión de una decisión difícil». «Taller: revisión de una decisión difícil» lleva a «Proyecto: dossier profesional defendible». «Proyecto: dossier profesional defendible» lleva a «Liderazgo técnico sin autoridad formal» (hallazgo de la revisión).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="793" height="438" fill="#ffffff"/><path d="M190,62 L253.5,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M360.5,62 L433,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M583,62 L642.5,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M704.5,102 L704.5,179" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M638,209.5 L565.5,209.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M450.5,209.5 L378,209.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M236,209.5 L172.5,209.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M106,259 L106,336" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M190,366.5 L236,366.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M378,366.5 L424,366.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M592,366.5 L642.5,366.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M704.5,317 L704.5,272.5 Q704.5,263.5 695.5,263.5 L195.5,263.5 Q186.5,263.5 186.5,254.5 L186.5,125.0 Q186.5,116 177.5,116.0 L113.0,116.0 Q106,116 106.0,109.0 L106,102" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="22" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Liderazgo</tspan><tspan x="106" dy="19.2">técnico sin</tspan><tspan x="106" dy="19.2">autoridad formal</tspan></text><rect x="253.5" y="31.5" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="307" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="307" dy="0">Equipos y</tspan><tspan x="307" dy="19.2">ownership</tspan></text><rect x="433" y="22" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="508" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="508" dy="0">Comunicación,</tspan><tspan x="508" dy="19.2">facilitación y</tspan><tspan x="508" dy="19.2">conflicto</tspan></text><rect x="642.5" y="22" width="124" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="704.5" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="704.5" dy="0">Mentoría,</tspan><tspan x="704.5" dy="19.2">feedback y</tspan><tspan x="704.5" dy="19.2">crecimiento</tspan></text><rect x="638" y="179" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="704.5" y="204.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="704.5" dy="0">Estimación y</tspan><tspan x="704.5" dy="19.2">compromisos</tspan></text><rect x="450.5" y="169.5" width="115" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="508" y="194.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="508" dy="0">Riesgos y</tspan><tspan x="508" dy="19.2">decisiones</tspan><tspan x="508" dy="19.2">ejecutivas</tspan></text><rect x="236" y="169.5" width="142" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="307" y="194.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="307" dy="0">Compras y</tspan><tspan x="307" dy="19.2">evaluación de</tspan><tspan x="307" dy="19.2">proveedores</tspan></text><rect x="39.5" y="160" width="133" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="184.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Propiedad</tspan><tspan x="106" dy="19.2">intelectual,</tspan><tspan x="106" dy="19.2">contratos y</tspan><tspan x="106" dy="19.2">ética</tspan></text><rect x="22" y="336" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="361.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Economía y costo</tspan><tspan x="106" dy="19.2">total</tspan></text><rect x="236" y="326.5" width="142" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="307" y="351.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="307" dy="0">Portafolio,</tspan><tspan x="307" dy="19.2">entrevistas y</tspan><tspan x="307" dy="19.2">defensa</tspan></text><rect x="424" y="326.5" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="508" y="351.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="508" dy="0">Taller: revisión</tspan><tspan x="508" dy="19.2">de una decisión</tspan><tspan x="508" dy="19.2">difícil</tspan></text><rect x="642.5" y="317" width="124" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="704.5" y="341.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="704.5" dy="0">Proyecto:</tspan><tspan x="704.5" dy="19.2">dossier</tspan><tspan x="704.5" dy="19.2">profesional</tspan><tspan x="704.5" dy="19.2">defendible</tspan></text><rect x="382.5" y="267.5" width="126" height="42" rx="4" fill="#ffffff"/><text x="445.5" y="283.4" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="445.5" dy="0">hallazgo de la</tspan><tspan x="445.5" dy="17.92">revisión</tspan></text></svg>
