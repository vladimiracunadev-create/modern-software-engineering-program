<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841 204" width="841" height="204" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Cambio» … «Corrección» y «Aprobación»</title><desc id="d">Diagrama de flujo con 7 pasos. «Cambio» lleva a «PR con contexto». «PR con contexto» lleva a «Comprobaciones automáticas». «PR con contexto» lleva a «Triaje por riesgo». «Triaje por riesgo» lleva a «Lectura humana». «Lectura humana» lleva a «Corrección» (comentarios). «Corrección» lleva a «Lectura humana» (range-diff). «Lectura humana» lleva a «Aprobación».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="841" height="204" fill="#ffffff"/><path d="M103,102 L149,102" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M247,102 L261.0,102.0 Q270,102 270.0,93.0 L270.0,61.5 Q270,52.5 279.0,52.5 L293,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M247,102 L269.8,102.0 Q278.8,102 278.8,111.0 L278.8,142.5 Q278.8,151.5 287.8,151.5 L310.5,151.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M425.5,151.5 L489,151.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M578,151.5 L586.0,151.5 Q594,151.5 594.0,143.5 L594.0,61.5 Q594,52.5 603.0,52.5 L704,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M578,151.5 L704,151.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M761.5,74.5 L761.5,98.0 Q761.5,107 752.5,107.0 L540.5,107.0 Q533.5,107 533.5,114.0 L533.5,121" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="80" width="81" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="62.5" y="106.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="62.5" dy="0">Cambio</tspan></text><rect x="149" y="71.5" width="98" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="198" y="96.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="198" dy="0">PR con</tspan><tspan x="198" dy="19.2">contexto</tspan></text><rect x="293" y="22" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="368" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="368" dy="0">Comprobaciones</tspan><tspan x="368" dy="19.2">automáticas</tspan></text><rect x="310.5" y="121" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="368" y="146.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="368" dy="0">Triaje por</tspan><tspan x="368" dy="19.2">riesgo</tspan></text><rect x="489" y="121" width="89" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="533.5" y="146.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="533.5" dy="0">Lectura</tspan><tspan x="533.5" dy="19.2">humana</tspan></text><rect x="704" y="30.5" width="115" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="761.5" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="761.5" dy="0">Corrección</tspan></text><rect x="704" y="129.5" width="115" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="761.5" y="155.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="761.5" dy="0">Aprobación</tspan></text><rect