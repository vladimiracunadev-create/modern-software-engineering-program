<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 613 381" width="613" height="381" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Especificación el modelo de decisión diagnóstica» … «CLI diagnóstica»</title><desc id="d">Diagrama de flujo con 9 pasos. «Especificación el modelo de decisión diagnóstica» lleva a «Valores y control». «Valores y control» lleva a «Funciones y resultados». «Funciones y resultados» lleva a «Colecciones y transformaciones». «Colecciones y transformaciones» lleva a «I/O y serialización». «I/O y serialización» lleva a «Módulos e interfaces». «Módulos e interfaces» lleva a «Pruebas y legibilidad». «Pruebas y legibilidad» lleva a «Transferencia entre lenguajes». «Transferencia entre lenguajes» lleva a «CLI diagnóstica». «CLI diagnóstica» lleva a «Especificación el modelo de decisión diagnóstica» (regresión o caso nuevo).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="613" height="381" fill="#ffffff"/><path d="M172,71.5 L244,71.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M351,71.5 L445,71.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M507,102 L507,179" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M423,209.5 L368.5,209.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M226.5,209.5 L154.5,209.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M97,240 L97,298" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M159,328.5 L218,328.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M377,328.5 L427.5,328.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M507,306.5 L507.0,263.0 Q507,254 498.0,254.0 L177.5,254.0 Q168.5,254 168.5,245.0 L168.5,144.0 Q168.5,135 159.5,135.0 L104.0,135.0 Q97,135 97.0,128.0 L97,121" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="22" width="150" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="97" y="46.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="97" dy="0">Especificación</tspan><tspan x="97" dy="19.2">el modelo de</tspan><tspan x="97" dy="19.2">decisión</tspan><tspan x="97" dy="19.2">diagnóstica</tspan></text><rect x="244" y="41" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="297.5" y="66.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="297.5" dy="0">Valores y</tspan><tspan x="297.5" dy="19.2">control</tspan></text><rect x="445" y="41" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="507" y="66.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="507" dy="0">Funciones y</tspan><tspan x="507" dy="19.2">resultados</tspan></text><rect x="423" y="179" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="507" y="204.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="507" dy="0">Colecciones y</tspan><tspan x="507" dy="19.2">transformaciones</tspan></text><rect x="226.5" y="179" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="297.5" y="204.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="297.5" dy="0">I/O y</tspan><tspan x="297.5" dy="19.2">serialización</tspan></text><rect x="39.5" y="179" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="97" y="204.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="97" dy="0">Módulos e</tspan><tspan x="97" dy="19.2">interfaces</tspan></text><rect x="35" y="298" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="97" y="323.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="97" dy="0">Pruebas y</tspan><tspan x="97" dy="19.2">legibilidad</tspan></text><rect x="218" y="298" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="297.5" y="323.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="297.5" dy="0">Transferencia</tspan><tspan x="297.5" dy="19.2">entre lenguajes</tspan></text><rect x="427.5" y="306.5" width="159" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="507" y="332.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="507" dy="0">CLI diagnóstica</tspan></text><rect x="388.3" y="258" width="102" height="42" rx="4" fill="#ffffff"/><text x="439.3" y="273.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="439.3" dy="0">regresión o</tspan><tspan x="439.3" dy="17.92">caso nuevo</tspan></text></svg>
