<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 396 859" width="396" height="859" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Secreto: dónde nace y quién lo lee» … «Revocación y destrucción»</title><desc id="d">Diagrama de flujo con 8 pasos. «Secreto: dónde nace y quién lo lee» lleva a «Almacén central con auditoría». «Almacén central con auditoría» lleva a «Entrega al proceso: archivo, variable o API». «Entrega al proceso: archivo, variable o API» lleva a «Uso con mínimo privilegio». «Uso con mínimo privilegio» lleva a «Rotación con doble validez». «Rotación con doble validez» lleva a «Revocación y destrucción». «Entrega al proceso: archivo, variable o API» lleva a «Filtración: repositorio, registro, imagen» (descuido). «Filtración: repositorio, registro, imagen» lleva a «Detección». «Detección» lleva a «Rotación con doble validez».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="396" height="859" fill="#ffffff"/><path d="M167.8,102 L167.8,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M167.8,221 L167.8,242.8 Q167.8,250 175.0,250.0 L175.0,250.0 Q182.2,250 182.2,257.2 L182.2,279" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M182.2,359 L182.2,383.8 Q182.2,392.8 173.2,392.8 L106.0,392.8 Q97,392.8 97.0,401.8 L97,426.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M97,487.5 L97.0,678.5 Q97,687.5 106.0,687.5 L146.4,687.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M238.9,718 L238.9,741.1 Q238.9,747 233.0,747.0 L233.0,747.0 Q227.1,747 227.1,752.9 L227.1,776" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M182.2,359 L182.2,367.0 Q182.2,375 190.2,375.0 L281.0,375.0 Q290,375 290.0,384.0 L290,417" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M290,497 L290.0,517.0 Q290,526 281.0,526.0 L270.9,526.0 Q261.9,526 261.9,535.0 L261.9,555" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M261.9,599 L261.9,619.0 Q261.9,628 252.9,628.0 L247.9,628.0 Q238.9,628 238.9,637.0 L238.9,657" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="88.3" y="22" width="159" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="167.8" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="167.8" dy="0">Secreto: dónde</tspan><tspan x="167.8" dy="19.2">nace y quién lo</tspan><tspan x="167.8" dy="19.2">lee</tspan></text><rect x="88.3" y="160" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="167.8" y="185.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="167.8" dy="0">Almacén central</tspan><tspan x="167.8" dy="19.2">con auditoría</tspan></text><rect x="94.2" y="279" width="176" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="182.2" y="304" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="182.2" dy="0">Entrega al</tspan><tspan x="182.2" dy="19.2">proceso: archivo,</tspan><tspan x="182.2" dy="19.2">variable o API</tspan></text><rect x="22" y="426.5" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="97" y="451.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="97" dy="0">Uso con mínimo</tspan><tspan x="97" dy="19.2">privilegio</tspan></text><rect x="146.4" y="657" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="238.9" y="682.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="238.9" dy="0">Rotación con doble</tspan><tspan x="238.9" dy="19.2">validez</tspan></text><rect x="160.6" y="776" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="227.1" y="801.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="227.1" dy="0">Revocación y</tspan><tspan x="227.1" dy="19.2">destrucción</tspan></text><rect x="206" y="417" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="290" y="442" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="290" dy="0">Filtración:</tspan><tspan x="290" dy="19.2">repositorio,</tspan><tspan x="290" dy="19.2">registro, imagen</tspan></text><rect x="208.4" y="555" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="261.9" y="581.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="261.9" dy="0">Detección</tspan></text><rect x="296" y="384" width="77" height="24" rx="4" fill="#ffffff"/><text x="334.5" y="399.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="334.5" dy="0">descuido</tspan></text></svg>
