<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 321" width="850" height="321" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Hipótesis: estado estable con umbral» … «Aprendizaje: defensa, hallazgo, siguiente experimento»</title><desc id="d">Diagrama de flujo con 8 pasos. «Hipótesis: estado estable con umbral» lleva a «Plan: fallo, alcance, radio, aborto». «Plan: fallo, alcance, radio, aborto» lleva a «Aprobación y comunicación». «Aprobación y comunicación» lleva a «Ejecución: inyección y observación». «Ejecución: inyección y observación» lleva a «¿Se viola el criterio de aborto?». «¿Se viola el criterio de aborto?» lleva a «Abortar y recuperar» (sí). «¿Se viola el criterio de aborto?» lleva a «Resultado: la hipótesis se sostiene o se refuta» (no). «Abortar y recuperar» lleva a «Resultado: la hipótesis se sostiene o se refuta». «Resultado: la hipótesis se sostiene o se refuta» lleva a «Aprendizaje: defensa, hallazgo, siguiente experimento». «Aprendizaje: defensa, hallazgo, siguiente experimento» lleva a «Hipótesis: estado estable con umbral».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="850" height="321" fill="#ffffff"/><path d="M172,62 L218,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M377,62 L423,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M556,62 L656.5,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M718.5,102 L718.5,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M609,220 L543,220" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M718.5,280 L718.5,287.0 Q718.5,294 711.5,294.0 L306.5,294.0 Q297.5,294 297.5,285.0 L297.5,269.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M436,220 L368.5,220" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M226.5,220 L163.5,220" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M97,161 L97,102" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="22" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="97" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="97" dy="0">Hipótesis:</tspan><tspan x="97" dy="19.2">estado estable</tspan><tspan x="97" dy="19.2">con umbral</tspan></text><rect x="218" y="22" width="159" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="297.5" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="297.5" dy="0">Plan: fallo,</tspan><tspan x="297.5" dy="19.2">alcance, radio,</tspan><tspan x="297.5" dy="19.2">aborto</tspan></text><rect x="423" y="31.5" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="489.5" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="489.5" dy="0">Aprobación y</tspan><tspan x="489.5" dy="19.2">comunicación</tspan></text><rect x="656.5" y="22" width="124" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="718.5" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="718.5" dy="0">Ejecución:</tspan><tspan x="718.5" dy="19.2">inyección y</tspan><tspan x="718.5" dy="19.2">observación</tspan></text><polygon points="718.5,160 828,220 718.5,280 609,220" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="718.5" y="205" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="718.5" dy="0">¿Se viola el</tspan><tspan x="718.5" dy="19.2">criterio de</tspan><tspan x="718.5" dy="19.2">aborto?</tspan></text><rect x="436" y="189.5" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="489.5" y="214.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="489.5" dy="0">Abortar y</tspan><tspan x="489.5" dy="19.2">recuperar</tspan></text><rect x="226.5" y="170.5" width="142" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="297.5" y="195.4" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="297.5" dy="0">Resultado: la</tspan><tspan x="297.5" dy="19.2">hipótesis se</tspan><tspan x="297.5" dy="19.2">sostiene o se</tspan><tspan x="297.5" dy="19.2">refuta</tspan></text><rect x="30.5" y="161" width="133" height="118" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="97" y="185.8" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="97" dy="0">Aprendizaje:</tspan><tspan x="97" dy="19.2">defensa,</tspan><tspan x="97" dy="19.2">hallazgo,</tspan><tspan x="97" dy="19.2">siguiente</tspan><tspan x="97" dy="19.2">experimento</tspan></text><rect x="561.5" y="192" width="29" height="24" rx="4" fill="#ffffff"/><text x="576" y="207.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="576" dy="0">sí</tspan></text><rect x="303.5" y="274.6" width="29" height="24" rx="4" fill="#ffffff"/><text x="318" y="290.5" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="318" dy="0">no</tspan></text></svg>
