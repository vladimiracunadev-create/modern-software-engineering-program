<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 684 573" width="684" height="573" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Necesidad del lector» … «Se ejecuta»</title><desc id="d">Diagrama de flujo con 9 pasos. «Necesidad del lector» lleva a «Actúa o piensa». «Actúa o piensa» lleva a «Está aprendiendo o trabajando» (actúa). «Actúa o piensa» lleva a «Está aprendiendo o consultando» (piensa). «Está aprendiendo o trabajando» lleva a «Tutorial» (aprende). «Está aprendiendo o trabajando» lleva a «Guía práctica» (trabaja). «Está aprendiendo o consultando» lleva a «Referencia» (consulta). «Está aprendiendo o consultando» lleva a «Explicación» (aprende). «Tutorial» lleva a «Se ejecuta». «Guía práctica» lleva a «Se ejecuta».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="684" height="573" fill="#ffffff"/><path d="M341.2,83 L341.2,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M341.2,203 L341.2,211.0 Q341.2,219 333.2,219.0 L182.5,219.0 Q173.5,219 173.5,228.0 L173.5,261" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M341.2,203 L341.2,211.0 Q341.2,219 349.2,219.0 L501.5,219.0 Q510.5,219 510.5,228.0 L510.5,261" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M173.5,347 L173.5,355.0 Q173.5,363 165.5,363.0 L107.3,363.0 Q98.3,363 98.3,372.0 L98.3,405" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M173.5,347 L173.5,355.0 Q173.5,363 181.5,363.0 L243.3,363.0 Q252.3,363 252.3,372.0 L252.3,405" fill="none" strok