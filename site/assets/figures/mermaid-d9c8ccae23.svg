<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 848 265" width="848" height="265" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Principio» … «Menos valor perdido» y «Retirar o cambiar la práctica»</title><desc id="d">Diagrama de flujo con 7 pasos. «Principio» lleva a «Práctica». «Práctica» lleva a «Produce información nueva sobre el producto». «Produce información nueva sobre el producto» lleva a «Decisión distinta» (sí). «Produce información nueva sobre el producto» lleva a «Coste sin efecto» (no). «Decisión distinta» lleva a «Menos valor perdido». «Coste sin efecto» lleva a «Retirar o cambiar la práctica». «Menos valor perdido» lleva a «Principio» (nuevas señales).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="848" height="265" fill="#ffffff"/><path d="M129,153.5 L175,153.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M273,153.5 L319,153.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M496,153.5 L504.0,153.5 Q512,153.5 512.0,145.5 L512.0,103.5 Q512,94.5 521.0,94.5 L553.5,94.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M496,153.5 L504.0,153.5 Q512,153.5 512.0,161.5 L512.0,194.0 Q512,203 521.0,203.0 L549,203" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M651.5,94.5 L702,94.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M656,203 L706.5,203" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M764,64 L764.0,57.0 Q764,50 757.0,50.0 L84.5,50.0 Q75.5,50 75.5,59.0 L75.5,131.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="131.5" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="75.5" y="157.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="75.5" dy="0">Principio</tspan></text><rect x="175" y="131.5" width="98" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="224" y="157.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="224" dy="0">Práctica</tspan></text><polygon points="407.5,76 496,153.5 407.5,231 319,153.5" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="407.5" y="128.9" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="407.5" dy="0">Produce</tspan><tspan x="407.5" dy="19.2">información</tspan><tspan x="407.5" dy="19.2">nueva sobre el</tspan><tspan x="407.5" dy="19.2">producto</tspan></text><rect x="553.5" y="64" width="98" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="602.5" y="89.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="602.5" dy="0">Decisión</tspan><tspan x="602.5" dy="19.2">distinta</tspan></text><rect x="549" y="172.5" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="602.5" y="197.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="602.5" dy="0">Coste sin</tspan><tspan x="602.5" dy="19.2">efecto</tspan></text><rect x="702" y="64" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="764" y="89.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="764" dy="0">Menos valor</tspan><tspan x="764" dy="19.2">perdido</tspan></text><rect x="706.5" y="163" width="115" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="764" y="188" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="764" dy="0">Retirar o</tspan><tspan x="764" dy="19.2">cambiar la</tspan><tspan x="764" dy="19.2">práctica</tspan></text><rect x="518.2" y="66.5" width="29" height="24" rx="4" fill="#ffffff"/><text x="532.7" y="82.4" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532.7" dy="0">sí</tspan></text><rect x="516" y="175" width="29" height="24" rx="4" fill="#ffffff"/><text x="530.5" y="190.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="530.5" dy="0">no</tspan></text><rect x="356.8" y="22" width="126" height="24" rx="4" fill="#ffffff"/><text x="419.8" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="419.8" dy="0">nuevas señales</tspan></text></svg>
