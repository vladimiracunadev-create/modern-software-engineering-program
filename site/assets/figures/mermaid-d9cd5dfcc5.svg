<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 1178" width="430" height="1178" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Versión actual» … «Vuelta a la versión anterior»</title><desc id="d">Diagrama de flujo con 11 pasos. «Versión actual» lleva a «Catálogo de diferencias». «Catálogo de diferencias» lleva a «Cómo se manifiesta». «Cómo se manifiesta» lleva a «Ruidoso: se descubre al usarlo» (excepción). «Cómo se manifiesta» lleva a «Silencioso: se mide con datos» (resultado distinto). «Silencioso: se mide con datos» lleva a «Pruebas de caracterización». «Ruidoso: se descubre al usarlo» lleva a «Reescritura con herramienta». «Pruebas de caracterización» lleva a «Reescritura con herramienta». «Reescritura con herramienta» lleva a «Compatible con ambas versiones». «Compatible con ambas versiones» lleva a «Matriz de pruebas en las dos». «Matriz de pruebas en las dos» lleva a «Cambio de versión en producción». «Cambio de versión en producción» lleva a «Vuelta a la versión anterior» (incidencia).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="430" height="1178" fill="#ffffff"/><path d="M191.2,66 L191.2,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M191.2,185 L191.2,207.2 Q191.2,214 198.0,214.0 L198.0,214.0 Q204.8,214 204.8,220.8 L204.8,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M204.8,305 L204.8,313.0 Q204.8,321 196.8,321.0 L123.5,321.0 Q114.5,321 114.5,330.0 L114.5,381" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M204.8,305 L204.8,313.0 Q204.8,321 212.8,321.0 L307.0,321.0 Q316,321 316.0,330.0 L316,381" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M316,442 L316.0,462.0 Q316,471 307.0,471.0 L286.1,471.0 Q277.1,471 277.1,480.0 L277.1,500" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M114.5,442 L114.5,640.5 Q114.5,649.5 123.5,649.5 L162.7,649.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M277.1,561 L277.1,581.0 Q277.1,590 268.1,590.0 L251.2,590.0 Q242.2,590 242.2,599.0 L242.2,619" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M242.2,680 L242.2,700.0 Q242.2,709 233.2,709.0 L224.4,709.0 Q215.4,709 215.4,718.0 L215.4,738" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M215.4,799 L215.4,819.0 Q215.4,828 206.4,828.0 L205.4,828.0 Q196.4,828 196.4,837.0 L196.4,857" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M196.4,918 L196.4,941.0 Q196.4,947 190.4,947.0 L190.4,947.0 Q184.4,947 184.4,953.0 L184.4,976" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M181.5,1037 L181.5,1095" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="116.2" y="22" width="150" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="191.2" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="191.2" dy="0">Versión actual</tspan></text><rect x="129.2" y="124" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="191.2" y="149.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="191.2" dy="0">Catálogo de</tspan><tspan x="191.2" dy="19.2">diferencias</tspan></text><polygon points="204.8,243 325.8,274 204.8,305 83.8,274" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="204.8" y="278.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="204.8" dy="0">Cómo se manifiesta</tspan></text><rect x="22" y="381" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="114.5" y="406.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="114.5" dy="0">Ruidoso: se</tspan><tspan x="114.5" dy="19.2">descubre al usarlo</tspan></text><rect x="241" y="381" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="316" y="406.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="316" dy="0">Silencioso: se</tspan><tspan x="316" dy="19.2">mide con datos</tspan></text><rect x="197.6" y="500" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="277.1" y="525.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="277.1" dy="0">Pruebas de</tspan><tspan x="277.1" dy="19.2">caracterización</tspan></text><rect x="162.7" y="619" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="242.2" y="644.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="242.2" dy="0">Reescritura con</tspan><tspan x="242.2" dy="19.2">herramienta</tspan></text><rect x="135.9" y="738" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="215.4" y="763.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="215.4" dy="0">Compatible con</tspan><tspan x="215.4" dy="19.2">ambas versiones</tspan></text><rect x="108.4" y="857" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="196.4" y="882.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="196.4" dy="0">Matriz de pruebas</tspan><tspan x="196.4" dy="19.2">en las dos</tspan></text><rect x="96.4" y="976" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="184.4" y="1001.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="184.4" dy="0">Cambio de versión</tspan><tspan x="184.4" dy="19.2">en producción</tspan></text><rect x="94.6" y="1095" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="178.6" y="1120.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="178.6" dy="0">Vuelta a la</tspan><tspan x="178.6" dy="19.2">versión anterior</tspan></text><rect x="120.5" y="339" width="86" height="24" rx="4" fill="#ffffff"/><text x="163.5" y="354.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="163.5" dy="0">excepción</tspan></text><rect x="322" y="330" width="86" height="42" rx="4" fill="#ffffff"/><text x="365" y="345.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="365" dy="0">resultado</tspan><tspan x="365" dy="17.92">distinto</tspan></text><rect x="187.5" y="1054" width="94" height="24" rx="4" fill="#ffffff"/><text x="234.5" y="1069.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="234.5" dy="0">incidencia</tspan></text></svg>
