<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 911 276" width="911" height="276" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Paquete del cliente» … «Solo detecta corrupción» y «Prueba procedencia»</title><desc id="d">Diagrama de flujo con 9 pasos. «Paquete del cliente» lleva a «Firma e integridad». «Paquete del cliente» lleva a «Sandbox y rutas». «Paquete del cliente» lleva a «Secretos». «Firma e integridad» lleva a «Quién recalcula?». «Quién recalcula?» lleva a «Solo detecta corrupción» (cualquiera). «Quién recalcula?» lleva a «Prueba procedencia» (solo con la clave privada). «Sandbox y rutas» lleva a «Confinar y normalizar». «Secretos» lleva a «Sacar del cliente».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="911" height="276" fill="#ffffff"/><path d="M146,138 L171.0,138.0 Q180,138 180.0,129.0 L180.0,62.0 Q180,53 189.0,53.0 L214,53" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M146,138.2 L192,138.2" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M146,138 L175.2,138.0 Q184.2,138 184.2,147.0 L184.2,214.5 Q184.2,223.5 193.2,223.5 L222.5,223.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M329,53 L397,53" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M614,53 L622.0,53.0 Q630,53 630.0,61.0 L630.0,86.5 Q630,95.5 639.0,95.5 L756,95.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M614,53 L622.0,53.0 Q630,53 630.0,61.0 L630.0,171.5 Q630,180.5 639.0,180.5 L760.5,1