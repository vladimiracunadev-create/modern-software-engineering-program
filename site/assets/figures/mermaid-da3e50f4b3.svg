<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 329 692" width="329" height="692" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Visitas reales» … «Cambio»</title><desc id="d">Diagrama de flujo con 7 pasos. «Visitas reales» lleva a «Métrica y percentil». «Métrica y percentil» lleva a «Cumple el presupuesto». «Cumple el presupuesto» lleva a «Ruta crítica» (no). «Ruta crítica» lleva a «Bytes, peticiones, cómputo». «Bytes, peticiones, cómputo» lleva a «Cambio». «Cambio» lleva a «Visitas reales». «Cumple el presupuesto» lleva a «Vigilar» (sí con incertidumbre).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="329" height="692" fill="#ffffff"/><path d="M194.9,66 L194.9,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M194.9,185 L194.9,207.9 Q194.9,214 188.9,214.0 L188.9,214.0 Q182.8,214 182.8,220.1 L182.8,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M182.8,329 L182.8,337.0 Q182.8,345 174.8,345.0 L109.7,345.0 Q100.7,345 100.7,354.0 L100.7,405" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M100.7,449 L100.7,471.1 Q100.7,478 107.6,478.0 L107.6,478.0 Q114.5,478 114.5,484.9 L114.5,507" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M114.5,568 L114.5,592.2 Q114.5,597 119.2,597.0 L119.2,597.0 Q124,597 124.0,601.8 L124,626" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M182.8,329 L182.8,337.0 Q182.8,345 190.8,345.0 L236.7,345.0 Q245.7,345 245.7,354.0 L245.7,405" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M164.5,648 L295.2,648.0 Q304.2,648 304.2,639.0 L304.2,53.0 Q304.2,44 295.2,44.0 L269.9,44" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="119.9" y="22" width="150" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="194.9" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="194.9" dy="0">Visitas reales</tspan></text><rect x="141.4" y="124" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="194.9" y="149.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="194.9" dy="0">Métrica y</tspan><tspan x="194.9" dy="19.2">percentil</tspan></text><polygon points="182.8,243 278.8,286 182.8,329 86.8,286" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="182.8" y="280.6" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="182.8" dy="0">Cumple el</tspan><tspan x="182.8" dy="19.2">presupuesto</tspan></text><rect x="34.2" y="405" width="133" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="100.7" y="431.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="100.7" dy="0">Ruta crítica</tspan></text><rect x="22" y="507" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="114.5" y="532.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="114.5" dy="0">Bytes, peticiones,</tspan><tspan x="114.5" dy="19.2">cómputo</tspan></text><rect x="83.5" y="626" width="81" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="124" y="652.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="124" dy="0">Cambio</tspan></text><rect x="201.2" y="405" width="89" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" str