<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 812 179" width="812" height="179" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Árbol de trabajo» … «Blob»</title><desc id="d">Diagrama de flujo con 7 pasos. «Árbol de trabajo» lleva a «Índice» (git add). «Índice» lleva a «Commit» (git commit). «Commit» lleva a «Árbol». «Árbol» lleva a «Blob». «Rama» lleva a «Commit» (apunta a). «Commit» lleva a «Commit anterior» (padre).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="812" height="179" fill="#ffffff"/><path d="M120,92.5 L128.0,92.5 Q136,92.5 136.0,84.5 L136.0,59.0 Q136,50 145.0,50.0 L213,50" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M294,50 L302.0,50.0 Q310,50 310.0,58.0 L310.0,79.2 Q310,88.2 319.0,88.2 L412,88.2" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M493,88.2 L528.0,88.2 Q537,88.2 537.0,79.2 L537.0,59.0 Q537,50 546.0,50.0 L581,50" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M657,50 L714,50" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M291.5,126.5 L299.5,126.5 Q307.5,126.5 307.5,118.5 L307.5,97.2 Q307.5,88.2 316.5,88.2 L412,88.2" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M493,88.2 L501.0,88.2 Q509,88.2 509.0,96.2 L509.0,117.5 Q509,126.5 518.0,126.5 L570,126.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="62" width="98" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="7