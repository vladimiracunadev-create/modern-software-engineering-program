<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 588 281" width="588" height="281" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Intención declarada / estrategia de ejecución» … «Límites de lenguajes declarativos»</title><desc id="d">Diagrama de flujo con 5 pasos. «Intención declarada / estrategia de ejecución» lleva a «Hechos, reglas / condiciones». «Hechos, reglas / condiciones» lleva a «Prioridad / conflictos». «Prioridad / conflictos» lleva a «Evaluación incremental / explicación». «Evaluación incremental / explicación» lleva a «Límites de lenguajes declarativos». «Límites de lenguajes declarativos» lleva a «Intención declarada / estrategia de ejecución» (fallo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="588" height="281" fill="#ffffff"/><path d="M164,71.5 L210,71.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M378,71.5 L433,71.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M495,102 L495,179" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M424,219 L360.5,219" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M227.5,219 L102.0,219.0 Q93,219 93.0,210.0 L93,121" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="22" width="142" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="93" y="46.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="93" dy="0">Intención</tspan><tspan x="93" dy="19.2">declarada /</tspan><tspan x="93" dy="19.2">estrategia de</tspan><tspan x="93" dy="19.2">ejecución</tspan></text><rect x="210" y="41" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="294" y="66.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="294" dy="0">Hechos, reglas /</tspan><tspan x="294" dy="19.2">condiciones</tspan></text><rect x="433" y="41" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="495" y="66.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="495" dy="0">Prioridad /</tspan><tspan x="495" dy="19.2">conflictos</tspan></text><rect x="424" y="179" width="142" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="495" y="204" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="495" dy="0">Evaluación</tspan><tspan x="495" dy="19.2">incremental /</tspan><tspan x="495" dy="19.2">explicación</tspan></text><rect x="227.5" y="179" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="294" y="204" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="294" dy="0">Límites de</tspan><tspan x="294" dy="19.2">lenguajes</tspan><tspan x="294" dy="19.2">declarativos</tspan></text><rect x="97.2" y="191" width="126" height="24" rx="4" fill="#ffffff"/><text x="160.2" y="206.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="160.2" dy="0">fallo o cambio</tspan></text></svg>
