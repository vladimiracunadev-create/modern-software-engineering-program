<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 719 600" width="719" height="600" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Cambio pequeño en una rama corta» … «Se revierte o se corrige primero» y «Artefacto candidato»</title><desc id="d">Diagrama de flujo con 8 pasos. «Cambio pequeño en una rama corta» lleva a «Verificación automática del cambio». «Verificación automática del cambio» lleva a «Integración en la troncal» (verde). «Verificación automática del cambio» lleva a «Quien lo escribió lo corrige» (rojo). «Integración en la troncal» lleva a «Verificación de la troncal». «Verificación de la troncal» lleva a «Se revierte o se corrige primero» (rojo). «Verificación de la troncal» lleva a «Artefacto candidato» (verde). «Integración en la troncal» lleva a «Otras ramas se actualizan». «Otras ramas se actualizan» lleva a «Verificación automática del cambio» (choque semántico).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="719" height="600" fill="#ffffff"/><path d="M423.8,83 L423.8,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M423.8,221 L423.8,229.0 Q423.8,237 415.8,237.0 L301.3,237.0 Q292.3,237 292.3,246.0 L292.3,279" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M423.8,221 L423.8,229.0 Q423.8,237 431.8,237.0 L493.3,237.0 Q502.3,237 502.3,246.0 L502.3,279" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M292.3,340 L292.3,360.0 Q292.3,369 283.3,369.0 L180.0,369.0 Q171,369 171.0,378.0 L171,398" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M171,459 L171.0,467.0 Q171,475 163.0,475.0 L115.0,475.0 Q106,475 106.0,484.0 L106,517" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M171,459 L171.0,467.0 Q171,475 179.0,475.0 L268.5,475.0 Q277.5,475 277.5,484.0 L277.5,517" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M292.3,340 L292.3,360.0 Q292.3,369 301.3,369.0 L363.5,369.0 Q372.5,369 372.5,378.0 L372.5,398" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M447.5,428.5 L595.3,428.5 Q604.3,428.5 604.3,419.5 L604.3,190.0 Q604.3,181 595.3,181.0 L498.8,181" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="335.8" y="22" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="423.8" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="423.8" dy="0">Cambio pequeño en</tspan><tspan x="423.8" dy="19.2">una rama corta</tspan></text><rect x="348.8" y="141" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="423.8" y="166" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="423.8" dy="0">Verificación</tspan><tspan x="423.8" dy="19.2">automática del</tspan><tspan x="423.8" dy="19.2">cambio</tspan></text><rect x="204.3" y="279" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="292.3" y="304.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="292.3" dy="0">Integración en la</tspan><tspan x="292.3" dy="19.2">troncal</tspan></text><rect x="414.3" y="279" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="502.3" y="304.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="502.3" dy="0">Quien lo escribió</tspan><tspan x="502.3" dy="19.2">lo corrige</tspan></text><rect x="78.5" y="398" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="171" y="423.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="171" dy="0">Verificación de la</tspan><tspan x="171" dy="19.2">troncal</tspan></text><rect x="22" y="517" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="542.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Se revierte o se</tspan><tspan x="106" dy="19.2">corrige primero</tspan></text><rect x="224" y="517" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="277.5" y="542.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="277.5" dy="0">Artefacto</tspan><tspan x="277.5" dy="19.2">candidato</tspan></text><rect x="297.5" y="398" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="372.5" y="423.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="372.5" dy="0">Otras ramas se</tspan><tspan x="372.5" dy="19.2">actualizan</tspan></text><rect x="298.3" y="246" width="53" height="24" rx="4" fill="#ffffff"/><text x="324.8" y="261.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324.8" dy="0">verde</tspan></text><rect x="508.3" y="246" width="45" height="24" rx="4" fill="#ffffff"/><text x="530.8" y="261.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="530.8" dy="0">rojo</tspan></text><rect x="112" y="484" width="45" height="24" rx="4" fill="#ffffff"/><text x="134.5" y="499.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="134.5" dy="0">rojo</tspan></text><rect x="283.5" y="484" width="53" height="24" rx="4" fill="#ffffff"/><text x="310" y="499.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231">