<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 771 184" width="771" height="184" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Supuestos con rango» … «Decisión revisable»</title><desc id="d">Diagrama de flujo con 5 pasos. «Supuestos con rango» lleva a «Modelo y valor presente». «Modelo y valor presente» lleva a «Sensibilidad por supuesto». «Sensibilidad por supuesto» lleva a «Regla de abandono». «Regla de abandono» lleva a «Decisión revisable». «Decisión revisable» lleva a «Supuestos con rango» (llega evidencia).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="771" height="184" fill="#ffffff"/><path d="M129,122 L175,122" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M273,122 L319,122" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M452,122 L498,122" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M596,122 L642,122" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M695.5,91.5 L695.5,77.0 Q695.5,68 686.5,68.0 L84.5,68.0 Q75.5,68 75.5,77.0 L75.5,91.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="91.5" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="75.5" y="116.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="75.5" dy="0">Supuestos</tspan><tspan x="75.5" dy="19.2">con rango</tspan></text><rect x="175" y="82" width="98" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="224" y="107" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="224" dy="0">Modelo y</tspan><tspan x="224" dy="19.2">valor</tspan><tspan x="224" dy="19.2">presente</tspan></text><rect x="319" y="82" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="385.5" y="107" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="385.5" dy="0">Sensibilidad</tspan><tspan x="385.5" dy="19.2">por</tspan><tspan x="385.5" dy="19.2">supuesto</tspan></text><rect x="498" y="91.5" width="98" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="547" y="116.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="547" dy="0">Regla de</tspan><tspan x="547" dy="19.2">abandono</tspan></text><rect x="642" y="91.5" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="695.5" y="116.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="695.5" dy="0">Decisión</tspan><tspan x="695.5" dy="19.2">revisable</tspan></text><rect x="342.5" y="22" width="86" height="42" rx="4" fill="#ffffff"/><text x="385.5" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="385.5" dy="0">llega</tspan><tspan x="385.5" dy="17.92">evidencia</tspan></text></svg>
