<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 867 342" width="867" height="342" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Patron de trafico» … «Arranque en frio y limites», «Utilizacion y coste fijo» y «Difusion por rumor»</title><desc id="d">Diagrama de flujo con 9 pasos. «Patron de trafico» lleva a «Donde corre». «Donde corre» lleva a «Funciones bajo demanda» (picos y poco uso). «Donde corre» lleva a «Servidor siempre encendido» (trafico sostenido). «Donde corre» lleva a «Borde de la red» (cerca del usuario). «Donde corre» lleva a «Red de pares» (sin coordinador). «Funciones bajo demanda» lleva a «Arranque en frio y limites». «Servidor siempre encendido» lleva a «Utilizacion y coste fijo». «Red de pares» lleva a «Difusion por rumor».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="867" height="342" fill="#ffffff"/><path d="M129,178.5 L175,178.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M329,178.5 L337.0,178.5 Q345,178.5 345.0,170.5 L345.0,77.0 Q345,68 354.0,68.0 L472,68" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M329,178.5 L337.0,178.5 Q345,178.5 345.0,170.5 L345.0,162.0 Q345,153 354.0,153.0 L463,153" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M329,178.5 L337.0,178.5 Q345,178.5 345.0,186.5 L345.0,220.5 Q345,229.5 354.0,229.5 L467.5,229.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M329,178.5 L337.0,178.5 Q345,178.5 345.0,186.5 L345.0,288.5 Q345,297.5 354.0,297.5 L480.5,297.5" 