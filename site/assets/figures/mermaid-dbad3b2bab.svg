<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 603" width="650" height="603" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Estado compartido» … «¿Qué sigue sin garantía?»</title><desc id="d">Diagrama de flujo con 9 pasos. «Estado compartido» lleva a «Quién es dueño». «Quién es dueño» lleva a «Nadie: funciones puras y datos inmutables». «Quién es dueño» lleva a «Un solo hilo: paso de mensajes». «Quién es dueño» lleva a «Varios: protección con operación atómica». «Nadie: funciones puras y datos inmutables» lleva a «Prueba: repetir, perturbar, comparar». «Un solo hilo: paso de mensajes» lleva a «Prueba: cola acotada y política de desborde». «Varios: protección con operación atómica» lleva a «Prueba: enumerar intercalaciones». «Prueba: repetir, perturbar, comparar» lleva a «¿Qué sigue sin garantía?». «Prueba: cola acotada y política de desborde» lleva a «¿Qué sigue sin garantía?». «Prueba: enumerar intercalaciones» lleva a «¿Qué sigue sin garantía?». «¿Qué sigue sin garantía?» lleva a «Quién es dueño» (cambia la carga).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="650" height="603" fill="#ffffff"/><path d="M319.3,66 L319.3,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M319.3,186 L319.3,206.0 Q319.3,215 310.3,215.0 L115.0,215.0 Q106,215 106.0,224.0 L106,244" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M317.9,186 L317.9,253.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M319.3,186 L319.3,206.0 Q319.3,215 328.3,215.0 L526.5,2