<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 396 857" width="396" height="857" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Riesgo sin protección» … «Verificación y prueba periódica»</title><desc id="d">Diagrama de flujo con 9 pasos. «Riesgo sin protección» lleva a «Reducción de riesgo requerida». «Reducción de riesgo requerida» lleva a «Función de seguridad». «Función de seguridad» lleva a «Nivel de integridad». «Nivel de integridad» lleva a «Arquitectura y diagnóstico». «Nivel de integridad» lleva a «Proceso y evidencia sistemática». «Arquitectura y diagnóstico» lleva a «Probabilidad de fallo bajo demanda». «Proceso y evidencia sistemática» lleva a «Argumento de capacidad sistemática». «Probabilidad de fallo bajo demanda» lleva a «Verificación y prueba periódica». «Argumento de capacidad sistemática» lleva a «Verificación y prueba periódica».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="396" height="857" fill="#ffffff"/><path d="M209.5,83 L209.5,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M209.7,202 L209.7,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M210.2,321 L210.2,379" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M210.5,440 L210.5,464.8 Q210.5,473.8 201.5,473.8 L134.3,473.8 Q125.3,473.8 125.3,482.8 L125.3,507.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M210.5,440 L210.5,460.0 Q210.5,469 219.5,469.0 L287.3,469.0 Q296.3,469 296.3,478.0 L296.3,498" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M125.3,568.5 L125.3,601.6 Q125.3,607 119.9,607.0 L119.9,607.0 Q114.5,607 114.5,612.4 L114.5,645.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M296.3,578 L296.3,601.4 Q296.3,607 301.9,607.0 L301.9,607.0 Q307.5,607 307.5,612.6 L307.5,636" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M114.5,706.5 L114.5,731.2 Q114.5,740.2 123.5,740.2 L202.1,740.2 Q211.1,740.2 211.1,749.2 L211.1,774" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M307.5,716 L307.5,736.0 Q307.5,745 298.5,745.0 L220.1,745.0 Q211.1,745 211.1,754.0 L211.1,774" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="152" y="22" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="209.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="209.5" dy="0">Riesgo sin</tspan><tspan x="209.5" dy="19.2">protección</tspan></text><rect x="125.5" y="141" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="209.5" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="209.5" dy="0">Reducción de</tspan><tspan x="209.5" dy="19.2">riesgo requerida</tspan></text><rect x="152.4" y="260" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="209.9" y="285.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="209.9" dy="0">Función de</tspan><tspan x="209.9" dy="19.2">seguridad</tspan></text><rect x="153" y="379" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="210.5" y="404.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="210.5" dy="0">Nivel de</tspan><tspan x="210.5" dy="19.2">integridad</tspan></text><rect x="50.3" y="507.5" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="125.3" y="532.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="125.3" dy="0">Arquitectura y</tspan><tspan x="125.3" dy="19.2">diagnóstico</tspan></text><rect x="234.3" y="498" width="124" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="296.3" y="523" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="296.3" dy="0">Proceso y</tspan><tspan x="296.3" dy="19.2">evidencia</tspan><tspan x="296.3" dy="19.2">sistemática</tspan></text><rect x="22" y="645.5" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="114.5" y="670.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="114.5" dy="0">Probabilidad de</tspan><tspan x="114.5" dy="19.2">fallo bajo demanda</tspan></text><rect x="241" y="636" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="307.5" y="661" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="307.5" dy="0">Argumento de</tspan><tspan x="307.5" dy="19.2">capacidad</tspan><tspan x="307.5" dy="19.2">sistemática</tspan></text><rect x="127.1" y="774" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="211.1" y="799.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="211.1" dy="0">Verificación y</tspan><tspan x="211.1" dy="19.2">prueba periódica</tspan></text></svg>
