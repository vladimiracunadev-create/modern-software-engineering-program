<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 571 548" width="571" height="548" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Dependencia» y «Archivo propio» … «Aceptar» y «Rechazar»</title><desc id="d">Diagrama de flujo con 10 pasos. «Dependencia» lleva a «Expresión de licencia». «Expresión de licencia» lleva a «Analizador». «Analizador» lleva a «Política» (conocida). «Analizador» lleva a «Revisión humana» (desconocida). «Política» lleva a «Aceptar» (permitida). «Política» lleva a «Rechazar» (no permitida). «Archivo propio» lleva a «Etiqueta de licencia». «Etiqueta de licencia» lleva a «Comprobación de coherencia».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="571" height="548" fill="#ffffff"/><path d="M246.2,66 L246.2,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M246.2,185 L246.2,209.2 Q246.2,218.2 237.2,218.2 L232.6,218.2 Q223.6,218.2 223.6,227.2 L223.6,251.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M223.6,295.5 L223.6,303.5 Q223.6,311.5 215.6,311.5 L128.8,311.5 Q119.8,311.5 119.8,320.5 L119.8,362" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M223.6,295.5 L223.6,303.5 Q223.6,311.5 231.6,311.5 L282.3,311.5 Q291.3,311.5 291.3,320.5 L291.3,371" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M119.8,424 L119.8,432.0 Q119.8,440 111.8,440.0 L75.5,440.0 Q66.5,440 66.5,449.0 L66.5,482" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M119.8,424 L119.8,432.