<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 363 1017" width="363" height="1017" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Evento o petición» … «Fin» y «Efecto repetido»</title><desc id="d">Diagrama de flujo con 9 pasos. «Evento o petición» lleva a «¿Hay una instancia caliente libre?». «¿Hay una instancia caliente libre?» lleva a «Ejecutar el manejador» (sí). «¿Hay una instancia caliente libre?» lleva a «Arranque en frío: crear entorno e importar dependencias» (no). «Arranque en frío: crear entorno e importar dependencias» lleva a «Ejecutar el manejador». «Ejecutar el manejador» lleva a «¿Confirmación recibida?». «¿Confirmación recibida?» lleva a «Fin» (sí). «¿Confirmación recibida?» lleva a «Reentrega del evento» (no). «Reentrega del evento» lleva a «¿El manejador es idempotente?». «¿El manejador es idempotente?» lleva a «Efecto repetido» (no). «¿El manejador es idempotente?» lleva a «Fin» (sí).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="363" height="1017" fill="#ffffff"/><path d="M189.5,66 L189.5,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M38,167 L31.0,167.0 Q24,167 24.0,174.0 L24.0,446.5 Q24,455.5 33.0,455.5 L125.8,455.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M189.1,210 L189.1,268" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M188.3,367 L188.3,425" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M187.1,486 L187.1,544" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M75,587 L42.9,587.0 Q33.9,587 33.9,596.0 L33.9,964.0 Q33.9,973 42.9,973.0 L69,973" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M185.7,630 L185.7,688" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M184.1,749 L184.1,807" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M183.4,893 L183.4,901.0 Q183.4,909 191.4,909.0 L249.5,909.0 Q258.5,909 258.5,918.0 L258.5,951" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M183.4,893 L183.4,901.0 Q183.4,909 175.4,909.0 L116.0,909.0 Q107,909 107.0,918.0 L107,951" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="101.5" y="22" width="176" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="189.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="189.5" dy="0">Evento o petición</tspan></text><polygon points="189.5,124 341,167 189.5,210 38,167" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="189.5" y="161.6" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="189.5" dy="0">¿Hay una instancia</tspan><tspan x="189.5" dy="19.2">caliente libre?</tspan></text><rect x="125.8" y="425" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="187.8" y="450.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="187.8" dy="0">Ejecutar el</tspan><tspan x="187.8" dy="19.2">manejador</tspan></text><rect x="100.8" y="268" width="176" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="188.8" y="292.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="188.8" dy="0">Arranque en frío:</tspan><tspan x="188.8" dy="19.2">crear entorno e</tspan><tspan x="188.8" dy="19.2">importar</tspan><tspan x="188.8" dy="19.2">dependencias</tspan></text><polygon points="186.5,544 298,587 186.5,630 75,587" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="186.5" y="581.6" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="186.5" dy="0">¿Confirmación</tspan><tspan x="186.5" dy="19.2">recibida?</tspan></text><rect x="69" y="951" width="76" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="107" y="977.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="107" dy="0">Fin</tspan></text><rect x="113.9" y="688" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="184.9" y="713.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="184.9" dy="0">Reentrega del</tspan><tspan x="184.9" dy="19.2">evento</tspan></text><polygon points="183.4,807 318.9,850 183.4,893 47.9,850" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="183.4" y="844.6" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="183.4" dy="0">¿El manejador es</tspan><tspan x="183.4" dy="19.2">idempotente?</tspan></text><rect x="179" y="951" width="159" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="258.5" y="977.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="258.5" dy="0">Efecto repetido</tspan></text><rect x="60.4" y="427.5" width="29" height="24" rx="4" fill="#ffffff"/><text x="74.9" y="443.4" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="74.9" dy="0">sí</tspan></text><rect x="195.1" y="227" width="29" height="24" rx="4" fill="#ffffff"/><text x="209.6" y="242.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="209.6" dy="0">no</tspan></text><rect x="36.9" y="945" width="29" height="24" rx="4" fill="#ffffff"/><text x="51.4" y="960.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="51.4" dy="0">s