<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1063" width="520" height="1063" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Petición» … «Registro y revisión»</title><desc id="d">Diagrama de flujo con 10 pasos. «Petición» lleva a «Habilidades: descripción en contexto». «Habilidades: descripción en contexto» lleva a «Cuerpo de la habilidad» (se activa). «Cuerpo de la habilidad» lleva a «Herramienta». «Herramienta» lleva a «Gancho previo». «Gancho previo» lleva a «Bloqueo» (código 2). «Gancho previo» lleva a «Ejecución en entorno aislado» (código 0). «Gancho previo» lleva a «Modo de fallo» (error o tiempo agotado). «Modo de fallo» lleva a «Ejecución en entorno aislado» (abierto). «Modo de fallo» lleva a «Bloqueo» (cerrado). «Ejecución en entorno aislado» lleva a «Gancho posterior». «Gancho posterior» lleva a «Registro y revisión».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="520" height="1063" fill="#ffffff"/><path d="M195.4,66 L195.4,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M197.3,204 L197.3,262" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M202.5,323 L202.5,381" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M205.7,425 L205.7,448.9 Q205.7,454 210.8,454.0 L210.8,454.0 Q216,454 216.0,459.1 L216,483" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M126.5,514 L114.0,514.0 Q105,514 105.0,523.0 L105.0,764.5 Q105,771.5 112.0,771.5 L119,771.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M305.5,514 L406.0,514.0 Q415,514 415.0,523.0 L415.0,764.5 Q415,771.5 408.0,771.5 L401,771.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M216,545 L216.0,553.3 Q216,561 223.7,561.0 L223.7,561.0 Q231.4,561 231.4,568.7 L231.4,621" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M231.4,683 L231.4,691.0 Q231.4,699 239.4,699.0 L312.5,699.0 Q321.5,699 321.5,708.0 L321.5,741" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M231.4,683 L231.4,691.0 Q231.4,699 223.4,699.0 L172.5,699.0 Q163.5,699 163.5,708.0 L163.5,749.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M321.5,802 L321.5,823.8 Q321.5,831 314.2,831.0 L314.2,831.0 Q307,831 307.0,838.2 L307,860" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M307,922 L307.0,946.0 Q307,951 301.9,951.0 L301.9,951.0 Q296.9,951 296.9,956.0 L296.9,980" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="146.4" y="22" width="98" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="195.4" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="195.4" dy="0">Petición</tspan></text><rect x="120.4" y="124" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="195.4" y="149" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="195.4" dy="0">Habilidades:</tspan><tspan x="195.4" dy="19.2">descripción en</tspan><tspan x="195.4" dy="19.2">contexto</tspan></text><rect x="132.7" y="262" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="199.2" y="287.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="199.2" dy="0">Cuerpo de la</tspan><tspan x="199.2" dy="19.2">habilidad</tspan></text><rect x="143.7" y="381" width