<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 492 598" width="492" height="598" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Editando» … «Fallido» y «Enviado»</title><desc id="d">Diagrama de flujo con 8 pasos. «Editando» lleva a «Listo» (validar). «Listo» lleva a «Enviando» (enviar con red). «Listo» lleva a «EnCola» (enviar sin red). «EnCola» lleva a «Enviando» (recuperar red). «Enviando» lleva a «Enviado» (éxito). «Enviando» lleva a «Reintentando» (tiempo agotado). «Reintentando» lleva a «Enviado» (éxito). «Reintentando» lleva a «Fallido» (máximo). «Enviando» lleva a «Conflicto» (conflicto). «Conflicto» lleva a «Listo» (resolver). «Fallido» lleva a «Listo» (reintentar).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="492" height="598" fill="#ffffff"/><path d="M271.5,66 L271.5,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M233.5,146 L176.7,146.0 Q167.7,146 167.7,155.0 L167.7,343.0 Q167.7,350 174.7,350.0 L181.7,350" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M271.5,168 L271.5,176.2 Q271.5,184 263.6,184.0 L263.6,184.0 Q255.8,184 255.8,191.8 L255.8,226" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M255.8,270 L255.8,278.0 Q255.8,286 247.8,286.0 L239.7,286.0 Q230.7,286 230.7,295.0 L230.7,328" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M279.7,350 L348.0,350.0 Q357,350 357.0,359.0 L357.0,545.0 Q357,554 348.0,554.0 L250,554" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arr