<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 487 824" width="487" height="824" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Patrón de acceso: filtro, orden, agrupación» … «Justificar o retirar el índice»</title><desc id="d">Diagrama de flujo con 8 pasos. «Patrón de acceso: filtro, orden, agrupación» lleva a «Plan de ejecución». «Plan de ejecución» lleva a «¿Recorre la tabla?». «¿Recorre la tabla?» lleva a «Medir selectividad» (sí). «Medir selectividad» lleva a «Índice sobre las columnas del filtro» (selectiva). «Medir selectividad» lleva a «Otra forma de consulta o de dato» (poco selectiva). «Índice sobre las columnas del filtro» lleva a «Costo en escritura y espacio». «Costo en escritura y espacio» lleva a «Justificar o retirar el índice». «Justificar o retirar el índice» lleva a «Patrón de acceso: filtro, orden, agrupación» (cambió el patrón).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="487" height="824" fill="#ffffff"/><path d="M276.3,102 L276.3,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M276.3,204 L276.3,226.4 Q276.3,233 269.8,233.0 L269.8,233.0 Q263.2,233 263.2,239.6 L263.2,262" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M263.2,324 L263.2,332.0 Q263.2,340 255.2,340.0 L251.3,340.0 Q242.3,340 242.3,349.0 L242.3,382" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M242.3,426 L242.3,434.0 Q242.3,442 234.3,442.0 L131.0,442.0 Q122,442 122.0,451.0 L122,484" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M242.3,426 L242.3,434.0 Q242.3,442 250.3,442.0 L323.5,442.0 Q332.5,442 332.5,451.0 L332.5,493.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M122,564 L122.0,584.0 Q122,593 131.0,593.0 L132.6,593.0 Q141.6,593 141.6,602.0 L141.6,622" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M141.6,683 L141.6,705.2 Q141.6,712 148.3,712.0 L148.3,712.0 Q155.1,712 155.1,718.8 L155.1,741" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M67.1,771.5 L33.0,771.5 Q24,771.5 24.0,762.5 L24.0,71.0 Q24,62 33.0,62.0 L188.3,62" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="188.3" y="22" width="176" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="276.3" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="276.3" dy="0">Patrón de acceso:</tspan><tspan x="276.3" dy="19.2">filtro, orden,</tspan><tspan x="276.3" dy="19.2">agrupación</tspan></text><rect x="188.3" y="160" width="176" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="276.3" y="186.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="276.3" dy="0">Plan de ejecución</tspan></text><polygon points="263.2,262 384.2,293 263.2,324 142.2,293" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="263.2" y="297.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="263.2" dy="0">¿Recorre la tabla?</tspan></text><rect x="149.8" y="382" width="185" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="242.3" y="408.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="242.3" dy="0">Medir selectividad</tspan></text><rect x="38" y="484" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="122" y="509" font-