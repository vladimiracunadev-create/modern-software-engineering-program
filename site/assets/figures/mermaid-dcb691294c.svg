<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 105" width="856" height="105" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «🎯 Riesgo» … «📈 Aprendizaje»</title><desc id="d">Diagrama de flujo con 5 pasos. «🎯 Riesgo» lleva a «🧠 Oráculo». «🧠 Oráculo» lleva a «🛠️ Diseño de prueba». «🛠️ Diseño de prueba» lleva a «🔎 Ejecución». «🔎 Ejecución» lleva a «📈 Aprendizaje».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="856" height="105" fill="#ffffff"/><path d="M127,52.5 L173,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M286,52.5 L332,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M463,52.5 L509,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M640,52.5 L686,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="30.5" width="105" height="44" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="74.5" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="74.5" dy="0">🎯 Riesgo</tspan></text><rect x="173" y="30.5" width="113" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="229.5" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="229.5" dy="0">🧠 Oráculo</tspan></text><rect x="332" y="22" width="131" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="397.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="397.5" dy="0">🛠️ Diseño de</tspan><tspan x="397.5" dy="19.2">prueba</tspan></text><rect x="509" y="30.5" width="131" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="574.5" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="574.5" dy="0">🔎 Ejecución</tspan></text><rect x="686" y="30.5" width="148" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="760" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="760" dy="0">📈 Aprendizaje</tspan></text></svg>
