<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 827 419" width="827" height="419" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Concurrencia, paralelismo y asincronía» … «Proyecto: servicio distribuido con degradación»</title><desc id="d">Diagrama de flujo con 12 pasos. «Concurrencia, paralelismo y asincronía» lleva a «Memoria compartida y cerrojos». «Memoria compartida y cerrojos» lleva a «Actores, canales y concurrencia estructurada». «Actores, canales y concurrencia estructurada» lleva a «Tiempo, relojes y orden parcial». «Tiempo, relojes y orden parcial» lleva a «Fallos parciales y modelos de red». «Fallos parciales y modelos de red» lleva a «Consistencia, disponibilidad y particiones». «Consistencia, disponibilidad y particiones» lleva a «Consenso, elección y coordinación». «Consenso, elección y coordinación» lleva a «Idempotencia y procesamiento distribuido». «Idempotencia y procesamiento distribuido» lleva a «Replicación, sharding y balanceo». «Replicación, sharding y balanceo» lleva a «Caos controlado y pruebas de distribución». «Caos controlado y pruebas de distribución» lleva a «Taller: reproducir una carrera y un fallo parcial». «Taller: reproducir una carrera y un fallo parcial» lleva a «Proyecto: servicio distribuido con degradación». «Proyecto: servicio distribuido con degradación» lleva a «Concurrencia, paralelismo y asincronía» (incidente o hallazgo).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="827" height="419" fill="#ffffff"/><path d="M168,62 L231,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M364,62 L423,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M591,62 L641.5,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M721,92.5 L721,169.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M637,200 L591,200" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M423,200 L364,200" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M231,200 L172,200" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M97,240 L97,307.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M163.5,347.5 L218,347.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M377,347.5 L432,347.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M582,347.5 L641.5,347.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M721,298 L721.0,263.0 Q721,254 712.0,254.0 L191.0,254.0 Q182,254 182.0,245.0 L182.0,125.0 Q182,116 173.0,116.0 L104.0,116.0 Q97,116 97.0,109.0 L97,102" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="26" y="22" width="142" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="97" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="97" dy="0">Concurrencia,</tspan><tspan x="97" dy="19.2">paralelismo y</tspan><tspan x="97" dy="19.2">asincronía</tspan></text><rect x="231" y="22" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="297.5" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="297.5" dy="0">Memoria</tspan><tspan x="297.5" dy="19.2">compartida y</tspan><tspan x="297.5" dy="19.2">cerrojos</tspan></text><rect x="423" y="22" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="507" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="507" dy="0">Actores, canales</tspan><tspan x="507" dy="19.2">y concurrencia</tspan><tspan x="507" dy="19.2">estructurada</tspan></text><rect x="641.5" y="31.5" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="721" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="721" dy="0">Tiempo, relojes</tspan><tspan x="721" dy="19.2">y orden parcial</tspan></text><rect x="637" y="169.5" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="721" y="194.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="721" dy="0">Fallos parciales</tspan><tspan x="721" dy="19.2">y modelos de red</tspan></text><rect x="423" y="160" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="507" y="185" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="507" dy="0">Consistencia,</tspan><tspan x="507" dy="19.2">disponibilidad y</tspan><tspan x="507" dy="19.2">particiones</tspan></text><rect x="231" y="160" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="297.5" y="185" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="297.5" dy="0">Consenso,</tspan><tspan x="297.5" dy="19.2">elección y</tspan><tspan x="297.5" dy="19.2">coordinación</tspan></text><rect x="22" y="160" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="97" y="185" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="97" dy="0">Idempotencia y</tspan><tspan x="97" dy="19.2">procesamiento</tspan><tspan x="97" dy="19.2">distribuido</tspan></text><rect x="30.5" y="307.5" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="97" y="332.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="97" dy="0">Replicación,</tspan><tspan x="97" dy="19.2">sharding y</tspan><tspan x="97" dy="19.2">balanceo</tspan></text><rect x="218" y="307.5" width="159" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="297.5" y="332.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="297.5" dy="0">Caos controlado</tspan><tspan x="297.5" dy="19.2">y pruebas de</tspan><tspan x="297.5" dy="19.2">distribución</tspan></text><rect x="432" y="298" width="150" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="507" y="322.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="507" dy="0">Taller:</tspan><tspan x="507" dy="19.2">reproducir una</tspan><tspan x="507" dy="19.2">carrera y un</tspan><tspan x="507" dy="19.2">fallo parcial</tspan></text><rect x="641.5" y="298" width="159" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="721" y="322.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="721" dy="0">Proyecto:</tspan><tspan x="721" dy="19.2">servicio</tspan><tspan x="721" dy="19.2">distribuido con</tspan><tspan x="721" dy="19.2">degradación</tspan></text><rect x="292.7" y="258" width="102" height="42" rx="4" fill="#ffffff"/><text x="343.7" y="273.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="343.7" dy="0">incidente o</tspan><tspan x="343.7" dy="17.92">hallazgo</tspan></text></svg>
