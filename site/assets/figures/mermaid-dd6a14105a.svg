<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 364 615" width="364" height="615" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Persona o script» … «Resultado»</title><desc id="d">Diagrama de flujo con 7 pasos. «Persona o script» lleva a «Terminal». «Terminal» lleva a «Shell analiza y expande». «Shell analiza y expande» lleva a «Proceso A». «Proceso A» lleva a «Proceso B» (stdout). «Proceso A» lleva a «Diagnóstico» (stderr). «Proceso B» lleva a «Resultado» (stdout). «Proceso A» lleva a «Shell analiza y expande» (estado). «Proceso B» lleva a «Shell analiza y expande» (estado).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="364" height="615" fill="#ffffff"/><path d="M192.1,66 L192.1,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M192.1,168 L192.1,191.4 Q192.1,197 186.4,197.0 L186.4,197.0 Q180.8,197 180.8,202.6 L180.8,226" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M180.8,287 L180.8,307.1 Q180.8,316 171.9,316.0 L171.9,316.0 Q163,316 163.0,324.9 L163,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M163,389 L163.0,397.0 Q163,405 155.0,405.0 L84.5,405.0 Q75.5,405 75.5,414.0 L75.5,447" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M163,389 L163.0,397.0 Q163,405 171.0,405.0 L216.0,405.0 Q225,405 225.0,414.0 L225,447" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M77.6,491 L77.6,549" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><pat