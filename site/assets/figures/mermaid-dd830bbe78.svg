<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 831 166" width="831" height="166" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Mapa / conjunto» … «Orden e iteración»</title><desc id="d">Diagrama de flujo con 5 pasos. «Mapa / conjunto» lleva a «Función hash / buckets». «Función hash / buckets» lleva a «Igualdad / estabilidad». «Igualdad / estabilidad» lleva a «Factor de carga / crecimiento». «Factor de carga / crecimiento» lleva a «Orden e iteración». «Orden e iteración» lleva a «Mapa / conjunto» (fallo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="831" height="166" fill="#ffffff"/><path d="M120,104 L166,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M316,104 L362,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M486,104 L532,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M656,104 L702,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M755.5,73.5 L755.5,59.0 Q755.5,50 746.5,50.0 L80.0,50.0 Q71,50 71.0,59.0 L71,73.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="73.5" width="98" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="71" y="98.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="71" dy="0">Mapa /</tspan><tspan x="71" dy="19.2">conjunto</tspan></text><rect x="166" y="73.5" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="241" y="98.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="241" dy="0">Función hash /</tspan><tspan x="241" dy="19.2">buckets</tspan></text><rect x="362" y="73.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="424" y="98.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="424" dy="0">Igualdad /</tspan><tspan x="424" dy="19.2">estabilidad</tspan></text><rect x="532" y="64" width="124" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="594" y="89" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="594" dy="0">Factor de</tspan><tspan x="594" dy="19.2">carga /</tspan><tspan x="594" dy="19.2">crecimiento</tspan></text><rect x="702" y="73.5" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="755.5" y="98.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="755.5" dy="0">Orden e</tspan><tspan x="755.5" dy="19.2">iteración</tspan></text><rect x="350.2" y="22" width="126" height="24" rx="4" fill="#ffffff"/><text x="413.2" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="413.2" dy="0">fallo o cambio</tspan></text></svg>
