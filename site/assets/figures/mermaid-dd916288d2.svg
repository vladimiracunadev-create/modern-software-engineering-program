<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 769" width="393" height="769" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Datos del tablero» … «Conservar» y «Seguir midiendo o abandonar»</title><desc id="d">Diagrama de flujo con 8 pasos. «Datos del tablero» lleva a «Hipótesis de causa». «Hipótesis de causa» lleva a «Una o dos acciones». «Una o dos acciones» lleva a «Capacidad de mejora». «Capacidad de mejora» lleva a «Cambio hecho». «Cambio hecho» lleva a «Medición con muestra suficiente». «Medición con muestra suficiente» lleva a «Conservar» (mejoró). «Medición con muestra suficiente» lleva a «Seguir midiendo o abandonar» (no distinguible). «Conservar» lleva a «Datos del tablero». «Seguir midiendo o abandonar» lleva a «Datos del tablero».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="393" height="769" fill="#ffffff"/><path d="M184,66 L184,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M183.6,168 L183.6,226" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M182.7,270 L182.7,328" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M181.6,389 L181.6,447" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M180.4,491 L180.4,549" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M179.7,610 L179.7,618.0 Q179.7,626 171.7,626.0 L100.5,626.0 Q91.5,626 91.5,635.0 L91.5,694.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M179.7,610 L179.7,618.0 Q179.7,626 187.7,626.0 L258.0,626.0 Q267,626 267.0,635.0 L267,686" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M38,716.5 L31.0,716.5 Q24,716.5 24.0,709.5 L24.0,53.0 Q24,44 33.0,44.0 L96,44" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><path d="M355,716.5 L362.0,716.5 Q369,716.5 369.0,709.5 L369.0,53.0 Q369,44 360.0,44.0 L272,44" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="96" y="22" width="176" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="184" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="184" dy="0">Datos del tablero</tspan></text><rect x="91.5" y="124" width="185" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="184" y="150.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="184" dy="0">Hipótesis de causa</tspan></text><rect x="90.7" y="226" width="185" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="183.2" y="252.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="183.2" dy="0">Una o dos acciones</tspan></text><rect x="115.7" y="328" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="182.2" y="353.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="182.2" dy="0">Capacidad de</tspan><tspan x="182.2" dy="19.2">mejora</tspan></text><rect x="114.5" y="447" width="133" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="181" y="473.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="181" dy="0">Cambio hecho</tspan></text><rect x="87.2" y="549" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="179.7" y="574.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="179.7" dy="0">Medición con</tspan><tspan x="179.7" dy="19.2">muestra suficiente</tspan></text><rect x="38" y="694.5" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="91.5" y="720.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="91.5" dy="0">Conservar</tspan></text><rect x="179" y="686" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="267" y="711.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="267" dy="0">Seguir midiendo o</tspan><tspan x="267" dy="19.2">abandonar</tspan></text><rect x="97.5" y="648.2" width="61" height="24" rx="4" fill="#ffffff"/><text x="128" y="664.1" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="128" dy="0">mejoró</tspan></text><rect x="168.4" y="630" width="110" height="42" rx="4" fill="#ffffff"/><text x="223.4" y="645.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="223.4" dy="0">no</tspan><tspan x="223.4" dy="17.92">distinguible</tspan></text></svg>
