<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 454 680" width="454" height="680" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de secuencia: Agente (cliente) → Servidor de herramientas</title><desc id="d">Diagrama de secuencia con 2 participantes y 10 eventos en orden. Agente (cliente) envía a Servidor de herramientas: initialize. Servidor de herramientas envía a Agente (cliente): nombre, versión, capacidades. Agente (cliente) envía a Servidor de herramientas: tools/list. Servidor de herramientas envía a Agente (cliente): herramientas con esquema de entrada. Agente (cliente) envía a Servidor de herramientas: tools/call get_deadline c1. Servidor de herramientas envía a Agente (cliente): resultado con texto. Agente (cliente) envía a Servidor de herramientas: JSON roto. Servidor de herramientas envía a Agente (cliente): error -32700. Agente (cliente) envía a Servidor de herramientas: tools/call con argumentos faltantes. Servidor de herramientas envía a Agente (cliente): resultado con isError verdadero.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="454" height="680" fill="#ffffff"/><rect x="22" y="22" width="166" height="58.4" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="55.4" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Agente (cliente)</tspan></text><line x1="105" y1="80.4" x2="105" y2="657.36" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="300.86" y="22" width="131" height="58.4" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="366.36"