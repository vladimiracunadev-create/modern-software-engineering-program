<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 677 473" width="677" height="473" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Pregunta, hipótesis y umbral fijados antes» … «Paquete publicable»</title><desc id="d">Diagrama de flujo con 9 pasos. «Pregunta, hipótesis y umbral fijados antes» lleva a «Plan con hash». «Plan con hash» lleva a «Ejecución: comando, semillas, entorno». «Ejecución: comando, semillas, entorno» lleva a «Datos crudos con SHA-256». «Datos crudos con SHA-256» lleva a «Resultados recalculados». «Resultados recalculados» lleva a «Veredicto derivado del umbral». «Veredicto derivado del umbral» lleva a «Informe: resultados, veredicto, límites, no medido». «Informe: resultados, veredicto, límites, no medido» lleva a «Validador y ejecución en dos sistemas». «Validador y ejecución en dos sistemas» lleva a «Ejecución: comando, semillas, entorno» (no coincide). «Validador y ejecución en dos sistemas» lleva a «Paquete publicable» (coincide).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="677" height="473" fill="#ffffff"/><path d="M172,87.5 L231,87.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M373,87.5 L513.5,87.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M571,137 L571,204.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M487,235 L368.5,235" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M235.5,235 L163.5,235" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M97,275 L97,333" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M159,392 L218,392" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M386,392 L513.5,392" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M302,352 L302.0,288.5 Q302,279.5 311.0,279.5 L464.0,279.5 Q473,279.5 473.0,270.5 L473.0,33.0 Q473,24 482.0,24.0 L564.0,24.0 Q571,24 571.0,31.0 L571,38" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="38" width="150" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="97" y="62.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="97" dy="0">Pregunta,</tspan><tspan x="97" dy="19.2">hipótesis y</tspan><tspan x="97" dy="19.2">umbral fijados</tspan><tspan x="97" dy="19.2">antes</tspan></text><rect x="231" y="65.5" width="142" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="302" y="91.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="302" dy="0">Plan con hash</tspan></text><rect x="513.5" y="38" width="115" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="571" y="62.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="571" dy="0">Ejecución:</tspan><tspan x="571" dy="19.2">comando,</tspan><tspan x="571" dy="19.2">semillas,</tspan><tspan x="571" dy="19.2">entorno</tspan></text><rect x="487" y="204.5" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="571" y="229.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="571" dy="0">Datos crudos con</tspan><tspan x="571" dy="19.2">SHA-256</tspan></text><rect x="235.5" y="204.5" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="302" y="229.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="302" dy="0">Resultados</tspan><tspan x="302" dy="19.2">recalculados</tspan></text><rect x="30.5" y="195" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="97" y="220" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="97" dy="0">Veredicto</tspan><tspan x="97" dy="19.2">derivado del</tspan><tspan x="97" dy="19.2">umbral</tspan></text><rect x="35" y="333" width="124" height="118" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="97" y="357.8" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="97" dy="0">Informe:</tspan><tspan x="97" dy="19.2">resultados,</tspan><tspan x="97" dy="19.2">veredicto,</tspan><tspan x="97" dy="19.2">límites, no</tspan><tspan x="97" dy="19.2">medido</tspan></text><rect x="218" y="352" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="302" y="377" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="302" dy="0">Validador y</tspan><tspan x="302" dy="19.2">ejecución en dos</tspan><tspan x="302" dy="19.2">sistemas</tspan></text><rect x="513.5" y="361.5" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="571" y="386.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="571" dy="0">Paquete</tspan><tspan x="571" dy="19.2">publicable</tspan></text><rect x="365" y="139.8" width="102" height="24" rx="4" fill="#ffffff"/><text x="416" y="155.7" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="416" dy="0">no coincide</tspan></text><rect x="411.2" y="364" width="77" height="24" rx="4" fill="#ffffff"/><text x="449.7" y="379.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="449.7" dy="0">coincide</tspan></text></svg>
