<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 631 381" width="631" height="381" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Aplicación formula intención» … «Medición explica el resultado»</title><desc id="d">Diagrama de flujo con 9 pasos. «Aplicación formula intención» lleva a «DNS resuelve nombres». «DNS resuelve nombres» lleva a «IP elige ruta». «IP elige ruta» lleva a «Enlace alcanza siguiente salto». «Enlace alcanza siguiente salto» lleva a «Transporte conecta o entrega». «Transporte conecta o entrega» lleva a «TLS autentica y protege». «TLS autentica y protege» lleva a «HTTP expresa semántica». «HTTP expresa semántica» lleva a «Intermediarios y origen responden». «Intermediarios y origen responden» lleva a «Medición explica el resultado». «Medición explica el resultado» lleva a «DNS resuelve nombres» (nueva hipótesis).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="631" height="381" fill="#ffffff"/><path d="M159,62 L244.5,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M377.5,62 L454,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M525,84 L525,169.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M445.5,200 L368.5,200" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M253.5,200 L181,200" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M101.5,230.5 L101.5,298" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M168,328.5 L227,328.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M395,328.5 L441,328.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M525,298 L525.0,253.5 Q525,244.5 516.0,244.5 L391.5,244.5 Q382.5,244.5 382.5,235.5 L382.5,115.5 Q382.5,106.5 373.5,106.5 L318.0,106.5 Q311,106.5 311.0,99.5 L311,92.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="44" y="22" width="115" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101.5" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101.5" dy="0">Aplicación</tspan><tspan x="101.5" dy="19.2">formula</tspan><tspan x="101.5" dy="19.2">intención</tspan></text><rect x="244.5" y="31.5" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="311" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="311" dy="0">DNS resuelve</tspan><tspan x="311" dy="19.2">nombres</tspan></text><rect x="454" y="40" width="142" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="525" y="66.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="525" dy="0">IP elige ruta</tspan></text><rect x="445.5" y="169.5" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="525" y="194.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="525" dy="0">Enlace alcanza</tspan><tspan x="525" dy="19.2">siguiente salto</tspan></text><rect x="253.5" y="160" width="115" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="311" y="185" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="311" dy="0">Transporte</tspan><tspan x="311" dy="19.2">conecta o</tspan><tspan x="311" dy="19.2">entrega</tspan></text><rect x="22" y="169.5" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101.5" y="194.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101.5" dy="0">TLS autentica y</tspan><tspan x="101.5" dy="19.2">protege</tspan></text><rect x="35" y="298" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101.5" y="323.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101.5" dy="0">HTTP expresa</tspan><tspan x="101.5" dy="19.2">semántica</tspan></text><rect x="227" y="298" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="311" y="323.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="311" dy="0">Intermediarios y</tspan><tspan x="311" dy="19.2">origen responden</tspan></text><rect x="441" y="298" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="525" y="323.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="525" dy="0">Medición explica</tspan><tspan x="525" dy="19.2">el resultado</tspan></text><rect x="410.8" y="248.5" width="86" height="42" rx="4" fill="#ffffff"/><text x="453.8" y="264.4" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="453.8" dy="0">nueva</tspan><tspan x="453.8" dy="17.92">hipótesis</tspan></text></svg>
