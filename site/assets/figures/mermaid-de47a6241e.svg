<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 669 705" width="669" height="705" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Función heredada» … «Métricas antes y después», «Escribir la rareza como regla explícita» y «Aviso y cambio de comportamiento deliberado»</title><desc id="d">Diagrama de flujo con 9 pasos. «Función heredada» lleva a «Registrar entradas y salidas: maestro dorado». «Registrar entradas y salidas: maestro dorado» lleva a «Paso de refactor». «Paso de refactor» lleva a «Comparar con el maestro». «Comparar con el maestro» lleva a «Confirmar y seguir» (igual). «Comparar con el maestro» lleva a «¿Rareza usada?» (difiere). «¿Rareza usada?» lleva a «Escribir la rareza como regla explícita» (sí: conservar). «¿Rareza usada?» lleva a «Aviso y cambio de comportamiento deliberado» (no: corregir). «Confirmar y seguir» lleva a «Paso de refactor». «Escribir la rareza como regla explícita» lleva a «Paso de refactor». «Aviso y cambio de comportamiento deliberado» lleva a «Paso de refactor». «Confirmar y seguir» lleva a «Métricas antes y después».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="669" height="705" fill="#ffffff"/><path d="M287.6,66 L287.6,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M288,204 L288,262" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M289.1,306 L289.1,364" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M289.9,425 L289.9,433.0 Q289.9,441 281.9,441.0 L189.2,441.0 Q180.2,441 180.2,450.0 L180.2,492" fil