<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 809 381" width="809" height="381" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Principios y modelos de amenaza» … «Proyecto: producto verificable»</title><desc id="d">Diagrama de flujo con 12 pasos. «Principios y modelos de amenaza» lleva a «Identidad, autenticación y sesiones». «Identidad, autenticación y sesiones» lleva a «Autorización y mínimo privilegio». «Autorización y mínimo privilegio» lleva a «Validación, codificación e inyección». «Validación, codificación e inyección» lleva a «Criptografía y claves». «Criptografía y claves» lleva a «Secretos y ambientes». «Secretos y ambientes» lleva a «Privacidad por diseño». «Privacidad por diseño» lleva a «Secure SDLC y abuso». «Secure SDLC y abuso» lleva a «Vulnerabilidades y divulgación». «Vulnerabilidades y divulgación» lleva a «Cumplimiento y evidencia». «Cumplimiento y evidencia» lleva a «Taller: controles aparentes». «Taller: controles aparentes» lleva a «Proyecto: producto verificable». «Proyecto: producto verificable» lleva a «Principios y modelos de amenaza» (hallazgo).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="809" height="381" fill="#ffffff"/><path d="M172.5,62 L236,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M395,62 L441,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M591,62 L637,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M712,102 L712,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M637,190.5 L573.5,190.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M458.5,190.5 L390.5,190.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M240.5,190.5 L177,190.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M106,221 L106,288.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M190,319 L240.5,319" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M390.5,319 L462.5,319" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M569.5,319 L650,319" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M712,279 L712.0,244.0 Q712,235 703.0,235.0 L195.5,235.0 Q186.5,235 186.5,226.0 L186.5,125.0 Q186.5,116 177.5,116.0 L113.0,116.0 Q106,116 106.0,109.0 L106,102" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="39.5" y="22" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Principios y</tspan><tspan x="106" dy="19.2">modelos de</tspan><tspan x="106" dy="19.2">amenaza</tspan></text><rect x="236" y="22" width="159" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="315.5" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="315.5" dy="0">Identidad,</tspan><tspan x="315.5" dy="19.2">autenticación y</tspan><tspan x="315.5" dy="19.2">sesiones</tspan></text><rect x="441" y="22" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="516" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="516" dy="0">Autorización y</tspan><tspan x="516" dy="19.2">mínimo</tspan><tspan x="516" dy="19.2">privilegio</tspan></text><rect x="637" y="22" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="712" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="712" dy="0">Validación,</tspan><tspan x="712" dy="19.2">codificación e</tspan><tspan x="712" dy="19.2">inyección</tspan></text><rect x="637" y="160" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="712" y="185.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="712" dy="0">Criptografía y</tspan><tspan x="712" dy="19.2">claves</tspan></text><rect x="458.5" y="160" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="516" y="185.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="516" dy="0">Secretos y</tspan><tspan x="516" dy="19.2">ambientes</tspan></text><rect x="240.5" y="160" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="315.5" y="185.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="315.5" dy="0">Privacidad por</tspan><tspan x="315.5" dy="19.2">diseño</tspan></text><rect x="35" y="160" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="185.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Secure SDLC y</tspan><tspan x="106" dy="19.2">abuso</tspan></text><rect x="22" y="288.5" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="313.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Vulnerabilidades</tspan><tspan x="106" dy="19.2">y divulgación</tspan></text><rect x="240.5" y="288.5" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="315.5" y="313.6" font-size="15" text-anchor="middle" font-weight="400" 