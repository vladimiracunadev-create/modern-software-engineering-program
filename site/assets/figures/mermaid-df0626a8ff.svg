<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 484 704" width="484" height="704" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Cambio de contrato» … «Ventana de deprecación»</title><desc id="d">Diagrama de flujo con 7 pasos. «Cambio de contrato» lleva a «Dirección». «Dirección» lleva a «Compatible hacia atrás» (nuevo lee datos viejos). «Dirección» lleva a «Compatible hacia adelante» (viejo lee datos nuevos). «Compatible hacia adelante» lleva a «Consumidor tolerante o estricto». «Compatible hacia atrás» lleva a «Versión y aviso». «Consumidor tolerante o estricto» lleva a «Versión y aviso». «Versión y aviso» lleva a «Ventana de deprecación». «Ventana de deprecación» lleva a «Versión y aviso» (quedan consumidores).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="484" height="704" fill="#ffffff"/><path d="M197.2,66 L197.2,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M197.2,186 L197.2,194.0 Q197.2,202 189.2,202.0 L115.0,202.0 Q106,202 106.0,211.0 L106,262" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M197.2,186 L197.2,194.0 Q197.2,202 205.2,202.0 L299.0,202.0 Q308,202 308.0,211.0 L308,262" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M308,323 L308.0,343.0 Q308,352 299.0,352.0 L286.0,352.0 Q277,352 277.0,361.0 L277,381" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M106,323 L106.0,532.0 Q106,541 115.0,541.0 L172.2,541" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M277,461 L277.0,481.0 Q277,490 268.0,490.0 L260.7,490.0 Q251.7,490 251.7,499.0 L251.7,519" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M251.7,563 L251.7,585.5 Q251.7,592 245.2,592.0 L245.2,592.0 Q238.8,592 238.8,598.5 L238.8,621" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M300.8,651.5 L336.2,651.5 Q345.2,651.5 345.2,642.5 L345.2,548.0 Q345.2,541 338.2,541.0 L331.2,541" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="104.7" y="22" width="185" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="197.2" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="197.2" dy="0">Cambio de contrato</tspan></text><polygon points="197.2,124 261.7,155 197.2,186 132.7,155" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="197.2" y="159.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="197.2" dy="0">Dirección</tspan></text><rect x="22" y="262" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="287.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Compatible hacia</tspan><tspan x="106" dy="19.2">atrás</tspan></text><rect x="224" y="262" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="308" y="287.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="308" dy="0">Compatible hacia</tspan><tspan x="308" dy="19.2">adelante</tspan></text><rect x="215" y="381" width="124" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="277" y="406" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="277" dy="0">Consumidor</tspan><tspan x="277" dy="19.2">tolerante o</tspan><tspan x="277" dy="19.2">estricto</tspan></text><rect x="172.2" y="519" width="159" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="251.7" y="545.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="251.7" dy="0">Versión y aviso</tspan></text><rect x="176.8" y="621" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="238.8" y="646.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="238.8" dy="0">Ventana de</tspan><tspan x="238.8" dy="19.2">deprecación</tspan></text><rect x="112" y="211" width="110" height="42" rx="4" fill="#ffffff"/><text x="167" y="226.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="167" dy="0">nuevo lee</tspan><tspan x="167" dy="17.92">datos viejos</tspan></text><rect x="314" y="211" width="110" height="42" rx="4" fill="#ffffff"/><text x="369" y="226.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="369" dy="0">viejo lee</tspan><tspan x="369" dy="17.92">datos nuevos</tspan></text><rect x="351.2" y="575.2" width="110" height="42" rx="4" fill="#ffffff"/><text x="406.2" y="591.1" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="406.2" dy="0">quedan</tspan><tspan x="406.2" dy="17.92">consumidores</tspan></text></svg>
