<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 467 870" width="467" height="870" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Peligros» … «Decisión de una persona»</title><desc id="d">Diagrama de flujo con 9 pasos. «Peligros» lleva a «Controles». «Controles» lleva a «Requisitos verificables». «Requisitos verificables» lleva a «Pruebas y análisis». «Pruebas y análisis» lleva a «Resultados con versión». «Resultados con versión» lleva a «Comprobador de huecos». «Resultados con versión» lleva a «Manifiesto de resúmenes». «Comprobador de huecos» lleva a «Informe de huecos». «Manifiesto de resúmenes» lleva a «Informe de huecos». «Informe de huecos» lleva a «Decisión de una persona». «Decisión de una persona» lleva a «Peligros» (riesgo residual aceptado).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="467" height="870" fill="#ffffff"/><path d="M186.7,66 L186.7,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M186.8,168 L186.8,226" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M186.8,287 L186.8,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M187,389 L187,447" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M187,508 L187.0,528.0 Q187,537 178.0,537.0 L106.0,537.0 Q97,537 97.0,546.0 L97,566" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M187,508 L187.0,528.0 Q187,537 196.0,537.0 L268.0,537.0 Q277,537 277.0,546.0 L277,566" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M97,627 L97.0,647.0 Q97,656 106.0,656.0 L178.0,656.0 Q187,656 187.0,665.0 L187,685" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M277,627 L277.0,647.0 Q277,656 268.0,656.0 L196.0,656.0 Q187,656 187.0,665.0 L187,685" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M187,729 L187,787" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M266.5,817.5 L353.0,817.5 Q362,817.5 362.0,808.5 L362.0,53.0 Q362,44 353.0,44.0 L235.7,44" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="137.7" y="22" width="98" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="186.7" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="186.7" dy="0">Peligros</tspan></text><rect x="133.2" y="124" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="186.7" y="150.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="186.7" dy="0">Controles</tspan></text><rect x="120.3" y="226" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="186.8" y="251.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="186.8" dy="0">Requisitos</tspan><tspan x="186.8" dy="19.2">verificables</tspan></text><rect x="94.4" y="345" width="185" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="186.9" y="371.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="186.9" dy="0">Pruebas y análisis</tspan></text><rect x="112" y="447" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="187" y="472.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="187" dy="0">Resultados con</tspan><tspan x="187" dy="19.2">versión</tspan></text><rect x="22" y="566" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="97" y="591.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="97" dy="0">Comprobador de</tspan><tspan x="97" dy="19.2">huecos</tspan></text><rect x="206" y="566" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="277" y="591.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="277" dy="0">Manifiesto de</tspan><tspan x="277" dy="19.2">resúmenes</tspan></text><rect x="99" y="685" width="176" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="187" y="711.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="187" dy="0">Informe de huecos</tspan></text><rect x="107.5" y="787" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="187" y="812.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="187" dy="0">Decisión de una</tspan><tspan x="187" dy="19.2">persona</tspan></text><rect x="368" y="400.8" width="77" height="60" rx="4" fill="#ffffff"/><text x="406.5" y="416.7" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="406.5" dy="0">riesgo</tspan><tspan x="406.5" dy="17.92">residual</tspan><tspan x="406.5" dy="17.92">aceptado</tspan></text></svg>
