<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 491 842" width="491" height="842" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Petición» y «Paquete + validador» … «Revisión y reproceso»</title><desc id="d">Diagrama de flujo con 10 pasos. «Petición» lleva a «Entrega + outbox, una transacción». «Entrega + outbox, una transacción» lleva a «Relevo». «Relevo» lleva a «Corredor». «Corredor» lleva a «Consumidor: inbox + efecto + versión». «Consumidor: inbox + efecto + versión» lleva a «Cola de mensajes fallidos» (falla repetida). «Consumidor: inbox + efecto + versión» lleva a «Aviso: reintentos con retroceso y aleatoriedad». «Cola de mensajes fallidos» lleva a «Revisión y reproceso». «Paquete + validador» lleva a «Entrega + outbox, una transacción». «Paquete + validador» lleva a «Consumidor: inbox + efecto + versión». «Observabilidad: correlación, señales, registros seguros» lleva a «Relevo». «Observabilidad: correlación, señales, registros seguros» lleva a «Consumidor: inbox + efecto + versión».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="491" height="842" fill="#ffffff"/><path d="M71,74.5 L71.0,108.2 Q71,117.2 80.0,117.2 L130.2,117.2 Q139.2,117.2 139.2,126.2 L139.2,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M139.2,221 L139.2,250.5 Q139.2,259.5 148.2,259.5 L269.8,259.5 Q278.8,259.5 278.8,268.5 L278.8,298" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M278.8,342 L278.8,365.9 Q278.8,371 283.9,371.0 L283.9,371.0 Q289,371 289.0,376.1 L289,400" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M288,444 L288,502" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M287,563 L287.0,571.0 Q287,579 279.0,579.0 L183.4,579.0 Q174.4,579 174.4,588.0 L174.4,630.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M287,563 L287.0,583.0 Q287,592 296.0,592.0 L371.4,592.0 Q380.4,592 380.4,601.0 L380.4,621" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M178.5,691.5 L178.5,759" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M207.5,83 L207.5,112.5 Q207.5,121.5 198.5,121.5 L148.2,121.5 Q139.2,121.5 139.2,130.5 L139.2,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M261,52.5 L268.0,52.5 Q275,52.5 275.0,59.5 L275.0,118.0 Q275,127 266.0,127.0 L250.2,127.0 Q241.2,127 241.2,136.0 L241.2,275.0 Q241.2,284 232.2,284.0 L189.5,284.0 Q180.5,284 180.5,293.0 L180.5,525.5 Q180.5,532.5 187.5,532.5 L194.5,532.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M353.7,240 L353.7,260.0 Q353.7,269 344.7,269.0 L287.8,269.0 Q278.8,269 278.8,278.0 L278.8,298" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M446.2,190.5 L453.2,190.5 Q460.2,190.5 460.2,197.5 L460.2,523.5 Q460.2,532.5 451.2,532.5 L379.5,532.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="30.5" width="98" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="71" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="71" dy="0">Petición</tspan></text><rect x="51.2" y="160" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="139.2" y="185.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="139.2" dy="0">Entrega + outbox,</tspan><tspan x="139.2" dy="19.2">una transacción</tspan></text><rect x="238.3" y="298" width="81" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="278.8" y="324.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="278.8" dy="0">Relevo</tspan></text><rect x="240" y="400" width="98" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="289" y="426.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="289" dy="0">Corredor</tspan></text><rect x="194.5" y="502" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="287" y="527.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="287" dy="0">Consumidor: inbox</tspan><tspan x="287" dy="19.2">+ efecto + versión</tspan></text><rect x="90.4" y="630.5" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="174.4" y="655.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="174.4" dy="0">Cola de mensajes</tspan><tspan x="174.4" dy="19.2">fallidos</tspan></text><rect x="292.4" y="621" width="176" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="380.4" y="646" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="380.4" dy="0">Aviso: reintentos</tspan><tspan x="380.4" dy="19.2">con retroceso y</tspan><tspan x="380.4" dy="19.2">aleatoriedad</tspan></text><rect x="125.2" y="759" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="182.7" y="784.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="182.7" dy="0">Revisión y</tspan><tspan x="182.7" dy="19.2">reproceso</tspan></text><rect x="154" y="22" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="207.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="207.5" dy="0">Paquete +</tspan><tspan x="207.5" dy="19.2">validador</tspan></text><rect x="261.2" y="141" width="185" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="353.7" y="165.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="353.7" dy="0">Observabilidad:</tspan><tspan x="353.7" dy="19.2">correlación,</tspan><tspan x="353.7" dy="19.2">señales, registros</tspan><tspan x="353.7" dy="19.2">seguros</tspan></text><rect x="42.4" y="592.8" width="126" height="24" rx="4" fill="#ffffff"/><text x="105.4" y="608.7" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="105.4" dy="0">falla repetida</tspan></text></svg>
