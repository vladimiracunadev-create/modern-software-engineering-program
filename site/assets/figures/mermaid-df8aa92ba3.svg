<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 872" width="830" height="872" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Frontera entre componentes» … «Alerta» y «Sin alerta»</title><desc id="d">Diagrama de flujo con 16 pasos. «Frontera entre componentes» lleva a «¿Dentro o entre?». «¿Dentro o entre?» lleva a «Diseño por contrato» (dentro). «¿Dentro o entre?» lleva a «Pruebas de contrato» (entre). «Diseño por contrato» lleva a «Precondición». «Diseño por contrato» lleva a «Poscondición». «Diseño por contrato» lleva a «Invariante». «Pruebas de contrato» lleva a «Contrato del consumidor». «Pruebas de contrato» lleva a «Verificación contra el proveedor». «Precondición» lleva a «¿Se comprueba en producción?». «¿Se comprueba en producción?» lleva a «Desaparece con -O» (con assert). «¿Se comprueba en producción?» lleva a «Se mantiene» (con excepción). «Contrato del consumidor» lleva a «Cambio del proveedor». «Cambio del proveedor» lleva a «¿Rompe al consumidor?». «¿Rompe al consumidor?» lleva a «Alerta» (sí). «¿Rompe al consumidor?» lleva a «Sin alerta» (no).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="830" height="872" fill="#ffffff"/><path d="M462.3,83 L462.3,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M462.3,203 L462.3,211.0 Q462.3,219 454.3,219.0 L319.1,219.0 Q310.1,219 310.1,228.0 L310.1,261" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M462.3,203 L462.3,211.0 Q462.3,219 470.3,219.0 L587.8,219.0 Q596.8,219 596.8,228.0 L596.8,261" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M310.1,322 L310.1,351.0 Q310.1,360 301.1,360.0 L100.1,360.0 Q91.1,360 91.1,369.0 L91.1,398" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M310.1,322 L310.1,351.0 Q310.1,360 301.1,360.0 L267.1,360.0 Q258.1,360 258.1,369.0 L258.1,398" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M310.1,322 L310.1,351.0 Q310.1,360 319.1,360.0 L407.1,360.0 Q416.1,360 416.1,369.0 L416.1,398" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M596.8,322 L596.8,346.8 Q596.8,355.8 587.8,355.8 L583.1,355.8 Q574.1,355.8 574.1,364.8 L574.1,389.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M596.8,322 L596.8,342.0 Q596.8,351 605.8,351.0 L732.1,351.0 Q741.1,351 741.1,360.0 L741.1,380" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M91.1,442 L91.1,471.0 Q91.1,480 100.1,480.0 L157.9,480.0 Q166.9,480 166.9,489.0 L166.9,518" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M166.9,604 L166.9,612.0 Q166.9,620 158.9,620.0 L119.0,620.0 Q110,620 110.0,629.0 L110,683" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M166.9,604 L166.9,612.0 Q166.9,620 174.9,620.0 L285.0,620.0 Q294,620 294.0,629.0 L294,683" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M574.1,450.5 L574.1,481.5 Q574.1,490.5 565.1,490.5 L541.9,490.5 Q532.9,490.5 532.9,499.5 L532.9,530.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M532.9,591.5 L532.9,617.8 Q532.9,626.8 523.9,626.8 L495.0,626.8 Q486,626.8 486.0,635.8 L486,662" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M486,748 L486.0,756.0 Q486,764 478.0,764.0 L436.5,764.0 Q427.5,764 427.5,773.0 L427.5,806" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arr