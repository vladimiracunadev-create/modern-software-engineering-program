ght="400" fill="#4a3209"><tspan x="486" dy="0">¿Rompe al</tspan><tspan x="486" dy="19.2">consumidor?</tspan></text><rect x="387" y="806" width="81" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="427.5" y="832.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="427.5" dy="0">Alerta</tspan></text><rect x="502" y="806" width="115" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="559.5" y="832.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="559.5" dy="0">Sin alerta</tspan></text><rect x="316.1" y="228" width="61" height="24" rx="4" fill="#ffffff"/><text x="346.6" y="243.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="346.6" dy="0">dentro</tspan></text><rect x="602.8" y="228" width="53" height="24" rx="4" fill="#ffffff"/><text x="629.3" y="243.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="629.3" dy="0">entre</tspan></text><rect x="116" y="639.5" width="94" height="24" rx="4" fill="#ffffff"/><text x="163" y="655.4" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="163" dy="0">con assert</tspan></text><rect x="300" y="633.2" width="118" height="24" rx="4" fill="#ffffff"/><text x="359" y="649.1" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="359" dy="0">con excepción</tspan></text><rect x="433.5" y="773" width="29" height="24" rx="4" fill="#ffffff"/><text x="448" y="788.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="448" dy="0">sí</tspan></text><rect x="565.5" y="773" width="29" height="24" rx="4" fill="#ffffff"/><text x="580" y="788.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="580" dy="0">no</tspan></text></svg>
