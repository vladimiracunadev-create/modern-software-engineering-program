<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 792 240" width="792" height="240" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Requisitos» … «Revisión por otra persona»</title><desc id="d">Diagrama de flujo con 8 pasos. «Requisitos» lleva a «Diseño del flujo». «Diseño del flujo» lleva a «Implementación». «Implementación» lleva a «Verificación automática». «Verificación automática» lleva a «Revisión humana». «Revisión humana» lleva a «Paquete de evidencia». «Paquete de evidencia» lleva a «Revisión por otra persona». «Revisión por otra persona» lleva a «Diseño del flujo» (hallazgo). «Verificación automática» lleva a «Lista de lo no verificado». «Revisión humana» lleva a «Lista de lo no verificado». «Lista de lo no verificado» lleva a «Paquete de evidencia».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="792" height="240" fill="#ffffff"/><path d="M146,52.5 L201,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M369,52.5 L415,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M565,52.5 L624,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M690.5,83 L690.5,149.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M690.5,193.5 L690.5,207.0 Q690.5,216 681.5,216.0 L292.0,216.0 Q285,216 285.0,209.0 L285,202" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M227.5,171.5 L155,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M624,52.5 L617.0,52.5 Q610,52.5 610.0,59.5 L610.0,118.0 Q610,127 601.0,127.0 L497.0,127.0 Q490,127 490.0,134.0 L490,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M611,171.5 L565,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M415,171.5 L342.5,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M88.5,141 L88.5,97.5 Q88.5,88.5 97.5,88.5 L278.0,88.5 Q285,88.5 285.0,81.5 L285,74.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="31" y="30.5" width="115" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="88.5" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="88.5" dy="0">Requisitos</tspan></text><rect x="201" y="30.5" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="285" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="285" dy="0">Diseño del flujo</tspan></text><rect x="415" y="30.5" width="150" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="490" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">Implementación</tspan></text><rect x="624" y="22" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="690.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="690.5" dy="0">Verificación</tspan><tspan x="690.5" dy="19.2">automática</tspan></text><rect x="611" y="149.5" width="159" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="690.5" y="175.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="690.5" dy="0">Revisión humana</tspan></text><rect x="227.5" y="141" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="285" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="285" dy="0">Paquete de</tspan><tspan x="285" dy="19.2">evidencia</tspan></text><rect x="22" y="141" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="88.5" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="88.5" dy="0">Revisión por</tspan><tspan x="88.5" dy="19.2">otra persona</tspan></text><rect x="415" y="141" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="490" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">Lista de lo no</tspan><tspan x="490" dy="19.2">verificado</tspan></text><rect x="148.2" y="92.5" width="77" height="24" rx="4" fill="#ffffff"/><text x="186.7" y="108.4" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="186.7" dy="0">hallazgo</tspan></text></svg>
