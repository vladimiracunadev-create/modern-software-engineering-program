<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 885" width="490" height="885" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Arranque» … «Salir»</title><desc id="d">Diagrama de flujo con 9 pasos. «Arranque» lleva a «Sondeo de arranque». «Sondeo de arranque» lleva a «Disponibilidad: dependencias y calentamiento». «Disponibilidad: dependencias y calentamiento» lleva a «Recibe tráfico» (listo). «Recibe tráfico» lleva a «Vida: proceso sano». «Vida: proceso sano» lleva a «Reinicio» (falla). «Recibe tráfico» lleva a «Retirar del reparto» (señal de terminación). «Retirar del reparto» lleva a «Dejar de aceptar y esperar solicitudes en curso». «Dejar de aceptar y esperar solicitudes en curso» lleva a «Salir».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="490" height="885" fill="#ffffff"/><path d="M255.8,66 L255.8,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M255.2,186 L255.2,244" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M253.7,364 L253.7,422" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M252.7,466 L252.7,495.0 Q252.7,504 243.7,504.0 L152.0,504.0 Q143,504 143.0,513.0 L143,542" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M142.8,604 L142.8,689.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M252.7,466 L252.7,474.0 Q252.7,482 260.7,482.0 L351.0,482.0 Q360,482 360.0,491.0 L360,542.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M358.6,603.5 L358.6,662" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M356,761 L356,819" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="206.8" y="22" width="98" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="255.8" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="255.8" dy="0">Arranque</tspan></text><polygon points="255.8,124 376.8,155 255.8,186 134.8,155" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="255.8" y="159.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="255.8" dy="0">Sondeo de arranque</tspan></text><polygon points="254.6,244 389.6,304 254.6,364 119.6,304" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="254.6" y="289" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="254.6" dy="0">Disponibilidad:</tspan><tspan x="254.6" dy="19.2">dependencias y</tspan><tspan x="254.6" dy="19.2">calentamiento</tspan></text><rect x="177.7" y="422" width="150" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="252.7" y="448.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="252.7" dy="0">Recibe tráfico</tspan></text><polygon points="143,542 264,573 143,604 22,573" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="143" y="577.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="143" dy="0">Vida: proceso sano</tspan></text><rect x="93.6" y="689.5" width="98" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="142.6" y="715.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="142.6" dy="0">Reinicio</tspan></text><rect x="298" y="542.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="360" y="567.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="360" dy="0">Retirar del</tspan><tspan x="360" dy="19.2">reparto</tspan></text><rect x="264.7" y="662" width="185" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="357.2" y="686.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="357.2" dy="0">Dejar de aceptar y</tspan><tspan x="357.2" dy="19.2">esperar</tspan><tspan x="357.2" dy="19.2">solicitudes en</tspan><tspan x="357.2" dy="19.2">curso</tspan></text><rect x="316.8" y="819" width="76" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="354.8" y="845.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="354.8" dy="0">Salir</tspan></text><rect x="259.7" y="381" width="53" height="24" rx="4" fill="#ffffff"/><text x="286.2" y="396.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="286.2" dy="0">listo</tspan></text><rect x="148.8" y="634.8" width="53" height="24" rx="4" fill="#ffffff"/><text x="175.3" y="650.7" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="175.3" dy="0">falla</tspan></text><rect x="366" y="491.2" width="102" height="42" rx="4" fill="#ffffff"/><text x="417" y="507.1" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="417" dy="0">señal de</tspan><tspan x="417" dy="17.92">terminación</tspan></text></svg>
