<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 897 190" width="897" height="190" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Cambio pequeño» y «Error de uso» … «Revertir»</title><desc id="d">Diagrama de flujo con 9 pasos. «Cambio pequeño» lleva a «Commit atómico». «Commit atómico» lleva a «Historia localizable». «Historia localizable» lleva a «Commit culpable» (bisect). «Commit culpable» lleva a «Revertir». «Error de uso» lleva a «Reflog y fsck». «Reflog y fsck» lleva a «Recuperación». «Commit publicado» lleva a «Revertir» (no reescribir).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="897" height="190" fill="#ffffff"/><path d="M115.5,52.5 L170.5,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M259.5,52.5 L314.5,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M438.5,52.5 L532.5,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M630.5,52.5 L694.8,52.5 Q703.8,52.5 703.8,61.5 L703.8,86.0 Q703.8,95 712.8,95.0 L777,95" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M120,137.5 L166,137.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M264,137.5 L310,137.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M635,137.5 L643.0,137.5 Q651,137.5 651.0,129.5 L651.0,104.0 Q651,95 660.0,95.0 L777,95" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="26.5" y="22" width="89" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="71" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="71" dy="0">Cambio</tspan><tspan x="71" dy="19.2">pequeño</tspan></text><rect x="170.5" y="22" width="89" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="215" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="215" dy="0">Commit</tspan><tspan x="215" dy="19.2">atómico</tspan></text><rect x="314.5" y="22" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="376.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="376.5" dy="0">Historia</tspan><tspan x="376.5" dy="19.2">localizable</tspan></text><rect x="532.5" y="22" width="98" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="581.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="581.5" dy="0">Commit</tspan><tspan x="581.5" dy="19.2">culpable</tspan></text><rect x="777" y="73" width="98" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="826" y="99.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="826" dy="0">Revertir</tspan></text><rect x="22" y="107" width="98" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="71" y="132.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="71" dy="0">Error de</tspan><tspan x="71" dy="19.2">uso</tspan></text><rect x="166" y="107" width="98" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="215" y="132.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="215" dy="0">Reflog y</tspan><tspan x="215" dy="19.2">fsck</tspan></text><rect x="310" y="115.5" width="133" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="376.5" y="141.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="376.5" dy="0">Recuperación</tspan></text><rect x="528" y="107" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="581.5" y="132.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="581.5" dy="0">Commit</tspan><tspan x="581.5" dy="19.2">publicado</tspan></text><rect x="455" y="24.5" width="61" height="24" rx="4" fill="#ffffff"/><text x="485.5" y="40.4" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="485.5" dy="0">bisect</tspan></text><rect x="655" y="99" width="118" height="24" rx="4" fill="#ffffff"/><text x="714" y="114.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="714" dy="0">no reescribir</tspan></text></svg>
