<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 495 820" width="495" height="820" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Estado deseado: réplicas, peticiones, límites» … «Controlador actúa: crear, reiniciar, mover» y «Estable»</title><desc id="d">Diagrama de flujo con 8 pasos. «Estado deseado: réplicas, peticiones, límites» lleva a «Planificador: filtrar y puntuar nodos». «Planificador: filtrar y puntuar nodos» lleva a «Pod en un nodo». «Pod en un nodo» lleva a «Estado actual observado». «Estado actual observado» lleva a «¿Coincide con el deseado?». «¿Coincide con el deseado?» lleva a «Controlador actúa: crear, reiniciar, mover» (no). «Controlador actúa: crear, reiniciar, mover» lleva a «Planificador: filtrar y puntuar nodos». «¿Coincide con el deseado?» lleva a «Estable» (sí). «Pod en un nodo» lleva a «Saturación o desperdicio» (uso real distinto de lo pedido).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="495" height="820" fill="#ffffff"/><path d="M274.3,121 L274.3,179" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M274.3,259 L274.3,282.7 Q274.3,288 269.0,288.0 L269.0,288.0 Q263.7,288 263.7,293.3 L263.7,317" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M263.7,361 L263.7,399.0 Q263.7,408 254.7,408.0 L178.4,408.0 Q169.4,408 169.4,417.0 L169.4,455" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M169.4,516 L169.4,536.0 Q169.4,545 178.4,545.0 L193.0,545.0 Q202,545 202.0,554.0 L202,574" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M202,660 L202.0,668.0 Q202,676 194.0,676.0 L139.5,676.0 Q130.5,676 130.5,685.0 L130.5,718" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M202,660 L202.0,668.0 Q202,676 210.0,676.0 L292.5,676.0 Q301.5,676 301.5,685.0 L301.5,736" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M263.7,361 L263.7,369.0 Q263.7,377 271.7,377.0 L331.9,377.0 Q340.9,377 340.9,386.0 L340.9,455" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M38,758 L31.0,758.0 Q24,758 24.0,751.0 L24.0,228.0 Q24,219 33.0,219.0 L186.3,219" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="194.8" y="22" width="159" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="274.3" y="46.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="274.3" dy="0">Estado deseado:</tspan><tspan x="274.3" dy="19.2">réplicas,</tspan><tspan x="274.3" dy="19.2">peticiones,</tspan><tspan x="274.3" dy="19.2">límites</tspan></text><rect x="186.3" y="179" width="176" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="274.3" y="204" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="274.3" dy="0">Planificador:</tspan><tspan x="274.3" dy="19.2">filtrar y puntuar</tspan><tspan x="274.3" dy="19.2">nodos</tspan></text><rect x="188.7" y="317" width="150" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="263.7" y="343.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="263.7" dy="0">Pod en un nodo</tspan></text><rect x="98.4" y="455" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="169.4" y="480.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="169.4" dy="0">Estado actual</tspan><tspan x="169.4" dy="19.2">observado</tspan></text><polygon points="202,574 337.5,617 202,660 66.5,617" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="202" y="611.6" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="202" dy="0">¿Coincide con el</tspan><tspan x="202" dy="19.2">deseado?</tspan></text><rect x="38" y="718" width="185" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="130.5" y="743" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="130.5" dy="0">Controlador actúa:</tspan><tspan x="130.5" dy="19.2">crear, reiniciar,</tspan><tspan x="130.5" dy="19.2">mover</tspan></text><rect x="257" y="736" width="89" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="301.5" y="762.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="301.5" dy="0">Estable</tspan></text><rect x="274.4" y="455" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="340.9" y="480.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="340.9" dy="0">Saturación o</tspan><tspan x="340.9" dy="19.2">desperdicio</tspan></text><rect x="136.5" y="685" width="29" height="24" rx="4" fill="#ffffff"/><text x="151" y="700.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="151" dy="0">no</tspan></text><rect x="307.5" y="694" width="29" height="24" rx="4" fill="#ffffff"/><text x="322" y="709.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="322" dy="0">sí</tspan></text><rect x="346.9" y="386" width="126" height="60" rx="4" fill="#ffffff"/><text x="409.9" y="401.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="409.9" dy="0">uso real</tspan><tspan x="409.9" dy="17.92">distinto de lo</tspan><tspan x="409.9" dy="17.92">pedido</tspan></text></svg>
