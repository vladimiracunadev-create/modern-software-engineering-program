<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 613 224" width="613" height="224" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Descomponer la petición» … «Agrupar por necesidad»</title><desc id="d">Diagrama de flujo con 5 pasos. «Descomponer la petición» lleva a «Reformular como problema». «Reformular como problema» lleva a «Preguntas de investigación». «Preguntas de investigación» lleva a «Rúbrica de investigabilidad». «Rúbrica de investigabilidad» lleva a «Agrupar por necesidad». «Agrupar por necesidad» lleva a «Descomponer la petición» (fallo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="613" height="224" fill="#ffffff"/><path d="M172,52.5 L218,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M377,52.5 L436,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M507,83 L507,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M423,171.5 L359.5,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M235.5,171.5 L106.0,171.5 Q97,171.5 97.0,162.5 L97,83" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="22" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="97" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="97" dy="0">Descomponer la</tspan><tspan x="97" dy="19.2">petición</tspan></text><rect x="218" y="22" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="297.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="297.5" dy="0">Reformular como</tspan><tspan x="297.5" dy="19.2">problema</tspan></text><rect x="436" y="22" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="507" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="507" dy="0">Preguntas de</tspan><tspan x="507" dy="19.2">investigación</tspan></text><rect x="423" y="141" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="507" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="507" dy="0">Rúbrica de</tspan><tspan x="507" dy="19.2">investigabilidad</tspan></text><rect x="235.5" y="141" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="297.5" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="297.5" dy="0">Agrupar por</tspan><tspan x="297.5" dy="19.2">necesidad</tspan></text><rect x="103.2" y="143.5" width="126" height="24" rx="4" fill="#ffffff"/><text x="166.2" y="159.4" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="166.2" dy="0">fallo o cambio</tspan></text></svg>
