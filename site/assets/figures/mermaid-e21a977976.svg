<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 399 999" width="399" height="999" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Contexto y organización» … «ADR con disparador de revisión»</title><desc id="d">Diagrama de flujo con 9 pasos. «Contexto y organización» lleva a «Escenarios de calidad con medida». «Escenarios de calidad con medida» lleva a «Tácticas candidatas». «Tácticas candidatas» lleva a «Estilos que las agrupan». «Estilos que las agrupan» lleva a «Matriz y pesos». «Matriz y pesos» lleva a «¿Margen mayor que el error del juicio?». «¿Margen mayor que el error del juicio?» lleva a «Decisión y supuestos» (sí). «¿Margen mayor que el error del juicio?» lleva a «Más evidencia o decisión reversible» (no). «Decisión y supuestos» lleva a «ADR con disparador de revisión». «Más evidencia o decisión reversible» lleva a «Escenarios de calidad con medida».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="399" height="999" fill="#ffffff"/><path d="M265.4,83 L265.4,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M262.2,202 L262.2,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M259,321 L259.0,344.8 Q259,350 253.8,350.0 L253.8,350.0 Q248.5,350 248.5,355.2 L248.5,379" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M248.5,440 L248.5,461.2 Q248.5,469 240.7,469.0 L240.7,469.0 Q232.9,469 232.9,476.8 L232.9,498" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M232.9,542 L232.9,562.0 Q232.9,571 223.9,571.0 