<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 773 705" width="773" height="705" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Artefacto» … «Instalar» y «Rechazar: falla cerrado»</title><desc id="d">Diagrama de flujo con 10 pasos. «Artefacto» lleva a «Huella». «Huella» lleva a «Manifiesto: nombre, versión, secuencia, huellas». «Manifiesto: nombre, versión, secuencia, huellas» lleva a «Firma con clave privada». «Raíz de confianza: clave pública fijada» lleva a «Verificador». «Firma con clave privada» lleva a «Verificador». «Manifiesto: nombre, versión, secuencia, huellas» lleva a «Verificador». «Artefacto» lleva a «Verificador». «Última secuencia vista» lleva a «Verificador». «Lista de revocación» lleva a «Verificador». «Verificador» lleva a «Instalar» (todo coincide). «Verificador» lleva a «Rechazar: falla cerrado» (algo falla).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="773" height="705" fill="#ffffff"/><path d="M362.2,66 L362.2,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M362.2,168 L362.2,188.3 Q362.2,197 353.5,197.0 L353.5,197.0 Q344.8,197 344.8,205.7 L344.8,226" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M344.8,306 L344.8,330.8 Q344.8,339.8 335.8,339.8 L329.5,339.8 Q320.5,339.8 320.5,348.8 L320.5,373.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M114.5,444 L114.5,464.0 Q114.5,473 123.5,473.0 L411.5,473.0 Q420.5,473 420.5,482.0 L420.5,502" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><