<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 431 1053" width="431" height="1053" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Crear: recurso 1..12 en orden de dependencias» … «Prueba de destrucción archivada»</title><desc id="d">Diagrama de flujo con 9 pasos. «Crear: recurso 1..12 en orden de dependencias» lleva a «¿Corte?». «¿Corte?» lleva a «Entorno completo y estado completo» (no). «¿Corte?» lleva a «Estado parcial: ¿hay registro de intención?» (sí). «Estado parcial: ¿hay registro de intención?» lleva a «Reconciliar o destruir lo existente». «Entorno completo y estado completo» lleva a «Destruir en orden inverso». «Reconciliar o destruir lo existente» lleva a «Destruir en orden inverso». «Destruir en orden inverso» lleva a «Barrido por etiqueta de lo que quedó». «Barrido por etiqueta de lo que quedó» lleva a «Comprobación independiente: nada existe». «Comprobación independiente: nada existe» lleva a «Prueba de destrucción archivada».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="431" height="1053" fill="#ffffff"/><path d="M210.6,102 L210.6,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M210.6,222 L210.6,230.0 Q210.6,238 202.6,238.0 L123.5,238.0 Q114.5,238 114.5,247.0 L114.5,289.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M210.6,222 L210.6,230.0 Q210.6,238 218.6,238.0 L316.0,238.0 Q325,238 325.0,247.0 L325,280" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M325,360 L325.0,380.0 Q325,389 316.0,389.0 L293.0,389.0 Q284,389 284.0,398.0 L284,418" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M114.5,350.5 L114.5,577.5 Q114.5,586.5 123.5,586.5 L159.8,586.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M284,498 L284.0,518.0 Q284,527 275.0,527.0 L256.8,527.0 Q247.8,527 247.8,536.0 L247.8,556" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M247.8,617 L247.8,637.0 Q247.8,646 238.8,646.0 L230.3,646.0 Q221.3,646 221.3,655.0 L221.3,675" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M221.3,755 L221.3,775.4 Q221.3,784 212.7,784.0 L212.7,784.0 Q204.1,784 204.1,792.6 L204.1,813" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M199.9,893 L199.9,951" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="122.6" y="22" width="176" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="210.6" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="210.6" dy="0">Crear: recurso</tspan><tspan x="210.6" dy="19.2">1..12 en orden de</tspan><tspan x="210.6" dy="19.2">dependencias</tspan></text><polygon points="210.6,160 262.1,191 210.6,222 159.1,191" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="210.6" y="195.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="210.6" dy="0">¿Corte?</tspan></text><rect x="22" y="289.5" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="114.5" y="314.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="114.5" dy="0">Entorno completo y</tspan><tspan x="114.5" dy="19.2">estado completo</tspan></text><rect x="241" y="280" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="325" y="305" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="325" dy="0">Estado parcial:</tspan><tspan x="325" dy="19.2">¿hay registro de</tspan><tspan x="325" dy="19.2">intención?</tspan></text><rect x="213" y="418" width="142" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="284" y="443" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="284" dy="0">Reconciliar o</tspan><tspan x="284" dy="19.2">destruir lo</tspan><tspan x="284" dy="19.2">existente</tspan></text><rect x="159.8" y="556" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="247.8" y="581.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="247.8" dy="0">Destruir en orden</tspan><tspan x="247.8" dy="19.2">inverso</tspan></text><rect x="128.8" y="675" width="185" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="221.3" y="700" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="221.3" dy="0">Barrido por</tspan><tspan x="221.3" dy="19.2">etiqueta de lo que</tspan><tspan x="221.3" dy="19.2">quedó</tspan></text><rect x="129.1" y="813" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="204.1" y="838" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="204.1" dy="0">Comprobación</tspan><tspan x="204.1" dy="19.2">independiente:</tspan><tspan x="204.1" dy="19.2">nada existe</tspan></text><rect x="133.7" y="951" width="124" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="195.7" y="976" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="195.7" dy="0">Prueba de</tspan><tspan x="195.7" dy="19.2">destrucción</tspan><tspan x="195.7" dy="19.2">archivada</tspan></text><rect x="120.5" y="251.8" width="29" height="24" rx="4" fill="#ffffff"/><text x="135" y="267.7" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="135" dy="0">no</tspan></tex