<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 702 485" width="702" height="485" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Esquema E0 y código v1» … «Punto de no retorno: respaldo»</title><desc id="d">Diagrama de flujo con 7 pasos. «Esquema E0 y código v1» lleva a «Expandir: añadir lo nuevo, mantener lo viejo». «Expandir: añadir lo nuevo, mantener lo viejo» lleva a «Rellenar por lotes y mantener las dos copias». «Rellenar por lotes y mantener las dos copias» lleva a «Migrar los clientes a la versión v2». «Migrar los clientes a la versión v2» lleva a «¿Queda alguna v1?». «¿Queda alguna v1?» lleva a «Contraer: quitar lo viejo» (no). «¿Queda alguna v1?» lleva a «Migrar los clientes a la versión v2» (sí). «Contraer: quitar lo viejo» lleva a «Punto de no retorno: respaldo». «Expandir: añadir lo nuevo, mantener lo viejo» lleva a «Esquema E0 y código v1» (vuelta atrás segura). «Rellenar por lotes y mantener las dos copias» lleva a «Expandir: añadir lo nuevo, mantener lo viejo» (vuelta atrás segura).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="702" height="485" fill="#ffffff"/><path d="M172.5,131.5 L270.5,131.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M438.5,131.5 L512,131.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M596,171.5 L596,242" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M525,282 L466,282" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M243,282 L190,282" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M106,312.5 L106,383" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M354.5,325 L354.5,332.0 Q354.5,339 361.5,339.0 L587.5,339.0 Q596,339 596.0,330.5 L596,322" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><path d="M354.5,82 L354.5,75.0 Q354.5,68 347.5,68.0 L115.0,68.0 Q106,68 106.0,77.0 L106,101" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><path d="M596,91.5 L596.0,84.5 Q596,77.5 589.0,77.5 L461.5,77.5 Q452.5,77.5 452.5,86.5 L452.5,124.5 Q452.5,131.5 445.5,131.5 L438.5,131.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="39.5" y="101" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="126.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Esquema E0 y</tspan><tspan x="106" dy="19.2">código v1</tspan></text><rect x="270.5" y="82" width="168" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="354.5" y="106.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="354.5" dy="0">Expandir: añadir</tspan><tspan x="354.5" dy="19.2">lo nuevo,</tspan><tspan x="354.5" dy="19.2">mantener lo</tspan><tspan x="354.5" dy="19.2">viejo</tspan></text><rect x="512" y="91.5" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="596" y="116.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="596" dy="0">Rellenar por</tspan><tspan x="596" dy="19.2">lotes y mantener</tspan><tspan x="596" dy="19.2">las dos copias</tspan></text><rect x="525" y="242" width="142" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="596" y="267" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="596" dy="0">Migrar los</tspan><tspan x="596" dy="19.2">clientes a la</tspan><tspan x="596" dy="19.2">versión v2</tspan></text><polygon points="354.5,239 466,282 354.5,325 243,282" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="354.5" y="276.6" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="354.5" dy="0">¿Queda alguna</tspan><tspan x="354.5" dy="19.2">v1?</tspan></text><rect x="22" y="251.5" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="276.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Contraer: quitar</tspan><tspan x="106" dy="19.2">lo viejo</tspan></text><rect x="44" y="383" width="124" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="408" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Punto de no</tspan><tspan x="106" dy="19.2">retorno:</tspan><tspan x="106" dy="19.2">respaldo</tspan></text><rect x="202" y="254" width="29" height="24" rx="4" fill="#ffffff"/><text x="216.5" y="269.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="216.5" dy="0">no</tspan></text><rect x="460.8" y="343" width="29" height="24" rx="4" fill="#ffffff"/><text x="475.3" y="358.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475.3" dy="0">sí</tspan></text><rect x="175.2" y="22" width="110" height="42" rx="4" fill="#ffffff"/><text x="230.2" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="230.2" dy="0">vuelta atrás</tspan><tspan x="230.2" dy="17.92">segura</tspan></text><rect x="469.2" y="31.5" width="110" height="42" rx="4" fill="#ffffff"/><text x="524.2" y="47.4" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="524.2" dy="0">vuelta atrás</tspan><tspan x="524.2" dy="17.92">segura</tspan></text></svg>
