<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 313" width="940" height="313" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Contrato de interfaz» … «Comportamiento real»</title><desc id="d">Diagrama de flujo con 8 pasos. «Contrato de interfaz» lleva a «Síncrono: petición y respuesta». «Contrato de interfaz» lleva a «Asíncrono: eventos». «Síncrono: petición y respuesta» lleva a «OpenAPI: rutas y respuestas». «Síncrono: petición y respuesta» lleva a «GraphQL: consulta y tipos». «Asíncrono: eventos» lleva a «AsyncAPI: canales y mensajes». «OpenAPI: rutas y respuestas» lleva a «Linter: forma». «GraphQL: consulta y tipos» lleva a «Linter: forma». «AsyncAPI: canales y mensajes» lleva a «Linter: forma». «Linter: forma» lleva a «Comportamiento real» (no ve).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="313" fill="#ffffff"/><path d="M146,156.5 L160.0,156.5 Q169,156.5 169.0,147.5 L169.0,123.0 Q169,114 178.0,114.0 L192,114" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M146,156.5 L160.0,156.5 Q169,156.5 169.0,165.5 L169.0,199.5 Q169,208.5 178.0,208.5 L192,208.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M307,114 L321.0,114.0 Q330,114 330.0,105.0 L330.0,61.5 Q330,52.5 339.0,52.5 L353,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M307,114 L329.8,114.0 Q338.8,114 338.8,123.0 L338.8,138.0 Q338.8,147 347.8,147.0 L370.5,147" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M307,208.5 L331.