<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 848 185" width="848" height="185" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Objeto, identidad / estado válido» … «Objetos de valor / entidades»</title><desc id="d">Diagrama de flujo con 5 pasos. «Objeto, identidad / estado válido» lleva a «Mensajes / despacho». «Mensajes / despacho» lleva a «Encapsulación como protección». «Encapsulación como protección» lleva a «Composición frente a herencia». «Composición frente a herencia» lleva a «Objetos de valor / entidades». «Objetos de valor / entidades» lleva a «Objeto, identidad / estado válido» (fallo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="848" height="185" fill="#ffffff"/><path d="M146,113.5 L192,113.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M307,113.5 L353,113.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M495,113.5 L541,113.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M665,113.5 L711,113.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M768.5,73.5 L768.5,59.0 Q768.5,50 759.5,50.0 L91.0,50.0 Q84,50 84.0,57.0 L84,64" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="64" width="124" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="84" y="88.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="84" dy="0">Objeto,</tspan><tspan x="84" dy="19.2">identidad /</tspan><tspan x="84" dy="19.2">estado</tspan><tspan x="84" dy="19.2">válido</tspan></text><rect x="192" y="83" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="249.5" y="108.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="249.5" dy="0">Mensajes /</tspan><tspan x="249.5" dy="19.2">despacho</tspan></text><rect x="353" y="73.5" width="142" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="424" y="98.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="424" dy="0">Encapsulación</tspan><tspan x="424" dy="19.2">como</tspan><tspan x="424" dy="19.2">protección</tspan></text><rect x="541" y="73.5" width="124" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="603" y="98.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="603" dy="0">Composición</tspan><tspan x="603" dy="19.2">frente a</tspan><tspan x="603" dy="19.2">herencia</tspan></text><rect x="711" y="73.5" width="115" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="768.5" y="98.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="768.5" dy="0">Objetos de</tspan><tspan x="768.5" dy="19.2">valor /</tspan><tspan x="768.5" dy="19.2">entidades</tspan></text><rect x="363.2" y="22" width="126" height="24" rx="4" fill="#ffffff"/><text x="426.2" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="426.2" dy="0">fallo o cambio</tspan></text></svg>
