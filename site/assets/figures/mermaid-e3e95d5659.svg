<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 641 719" width="641" height="719" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Solicitud de alta con clave» … «Configuración por capas», «Reintento con la misma clave» y «Compensar y cerrar»</title><desc id="d">Diagrama de flujo con 10 pasos. «Solicitud de alta con clave» lleva a «Registro del inquilino: aprovisionando». «Registro del inquilino: aprovisionando» lleva a «Datos y semilla». «Registro del inquilino: aprovisionando» lleva a «Identidad: primer administrador». «Datos y semilla» lleva a «Facturación: cliente y plan». «Identidad: primer administrador» lleva a «Facturación: cliente y plan». «Facturación: cliente y plan» lleva a «Estado: activo» (éxito). «Facturación: cliente y plan» lleva a «Estado: fallido con motivo» (falla). «Estado: fallido con motivo» lleva a «Reintento con la misma clave». «Estado: fallido con motivo» lleva a «Compensar y cerrar». «Reintento con la misma clave» lleva a «Datos y semilla». «Estado: activo» lleva a «Configuración por capas».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="641" height="719" fill="#ffffff"/><path d="M288,83 L288,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M288,221 L288.0,245.2 Q288,254.2 279.0,254.2 L196.0,254.2 Q187,254.2 187.0,263.2 L187,287.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M288,221 L288.0,241.0 Q288,250 297.0,250.0 L379.5,250.0 Q388.5,250 388.5,259.0 L388.5,279" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path