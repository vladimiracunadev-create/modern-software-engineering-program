<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 607 739" width="607" height="739" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Solicitud» … «Medir llamadas, tokens y solicitudes resueltas»</title><desc id="d">Diagrama de flujo con 7 pasos. «Solicitud» lleva a «¿Camino conocido antes de la entrada?». «¿Camino conocido antes de la entrada?» lleva a «Workflow: el código decide el orden» (sí). «¿Camino conocido antes de la entrada?» lleva a «¿Acciones reversibles y acotadas?» (no). «¿Acciones reversibles y acotadas?» lleva a «Agente con presupuesto de pasos y costo» (sí). «¿Acciones reversibles y acotadas?» lleva a «Persona decide o se rediseña el flujo» (no). «Workflow: el código decide el orden» lleva a «Medir llamadas, tokens y solicitudes resueltas». «Agente con presupuesto de pasos y costo» lleva a «Medir llamadas, tokens y solicitudes resueltas». «Medir llamadas, tokens y solicitudes resueltas» lleva a «¿Acciones reversibles y acotadas?» (el workflow no resuelve). «Medir llamadas, tokens y solicitudes resueltas» lleva a «Workflow: el código decide el orden» (el agente cuesta de más).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="607" height="739" fill="#ffffff"/><path d="M332.8,66 L332.8,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M332.8,244 L332.8,252.0 Q332.8,260 324.8,260.0 L253.0,260.0 Q244,260 244.0,269.0 L244,322" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M332.8,244 L332.8,252.0 Q332.8,260 340.8,260.0 L437.5,260.0 Q446.5,260 446.5,269.0 L446.5,302" f