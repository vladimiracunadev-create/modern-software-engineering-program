<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 352 668" width="352" height="668" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Aplicación: kit de diagnóstico multiplataforma» … «Hardware»</title><desc id="d">Diagrama de flujo con 7 pasos. «Aplicación: kit de diagnóstico multiplataforma» lleva a «Biblioteca o runtime». «Biblioteca o runtime» lleva a «API del sistema». «API del sistema» lleva a «Kernel». «Kernel» lleva a «Controlador». «Controlador» lleva a «Hardware». «Kernel» lleva a «Sistema de archivos y red».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="352" height="668" fill="#ffffff"/><path d="M217.6,102 L217.6,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M217.6,221 L217.6,243.5 Q217.6,250 211.1,250.0 L211.1,250.0 Q204.6,250 204.6,256.5 L204.6,279" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M204.6,323 L204.6,343.0 Q204.6,352 195.6,352.0 L193.1,352.0 Q184.1,352 184.1,361.0 L184.1,381" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M184.1,425 L184.1,449.2 Q184.1,458.2 175.1,458.2 L93.0,458.2 Q84,458.2 84.0,467.2 L84,491.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M86.4,535.5 L86.4,602" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M184.1,425 L184.1,445.0 Q184.1,454 193.1,454.0 L246.0,454.0 Q255,454 255.0,463.0 L255,483" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="125.1" y="22" width="185" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="217.6" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="217.6" dy="0">Aplicación: kit de</tspan><tspan x="217.6" dy="19.2">diagnóstico</tspan><tspan x="217.6" dy="19.2">multiplataforma</tspan></text><rect x="151.1" y="160" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="217.6" y="185.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="217.6" dy="0">Biblioteca o</tspan><tspan x="217.6" dy="19.2">runtime</tspan></text><rect x="125.1" y="279" width="159" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="204.6" y="305.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="204.6" dy="0">API del sistema</tspan></text><rect x="143.6" y="381" width="81" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="184.1" y="407.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="184.1" dy="0">Kernel</tspan></text><rect x="22" y="491.5" width="124" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="84" y="517.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="84" dy="0">Controlador</tspan></text><rect x="39.8" y="602" width="98" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="88.8" y="628.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="88.8" dy="0">Hardware</tspan></text><rect x="180" y="483" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="255" y="508.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="255" dy="0">Sistema de</tspan><tspan x="255" dy="19.2">archivos y red</tspan></text></svg>
