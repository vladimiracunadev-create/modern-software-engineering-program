<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 831 360" width="831" height="360" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Decisión que puede cambiar» … «Cambio local o disperso»</title><desc id="d">Diagrama de flujo con 9 pasos. «Decisión que puede cambiar» lleva a «Módulo que la oculta». «Módulo que la oculta» lleva a «Cohesión: lo que agrupa». «Módulo que la oculta» lleva a «Encapsulación: lo que no expone». «Módulo que la oculta» lleva a «Acoplamiento: de qué depende». «Cohesión: lo que agrupa» lleva a «Medida: LCOM4». «Encapsulación: lo que no expone» lleva a «Medida: sitios a editar». «Acoplamiento: de qué depende» lleva a «Medida: ciclos y dependencias». «Medida: LCOM4» lleva a «Cambio local o disperso». «Medida: sitios a editar» lleva a «Cambio local o disperso». «Medida: ciclos y dependencias» lleva a «Cambio local o disperso». «Cambio local o disperso» lleva a «Decisión que puede cambiar» (el cambio real contradice la medida).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="831" height="360" fill="#ffffff"/><path d="M129,180 L175,180" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M290,180 L314.8,180.0 Q323.8,180 323.8,171.0 L323.8,71.0 Q323.8,62 332.8,62.0 L357.5,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M290,180 L336,180" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M290,180 L306.0,180.0 Q315,180 315.0,189.0 L315.0,289.0 Q315,298 324.0,298.0 L340,298" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M464.5,62 L554,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M486,180 L549.5,180" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M482,298 L532,298" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M643,62 L668.0,62.0 Q677,62 677.0,71.0 L677.0,171.0 Q677,180 686.0,180.0 L711,180" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M647.5,180 L711,180" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M665,298 L679.0,298.0 Q688,298 688.0,289.0 L688.0,189.0 Q688,180 697.0,180.0 L711,180" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M760,220 L760.0,227.0 Q760,234 753.0,234.0 L82.5,234.0 Q75.5,234 75.5,227.0 L75.5,220" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="140" width="107" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="75.5" y="165" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="75.5" dy="0">Decisión</tspan><tspan x="75.5" dy="19.2">que puede</tspan><tspan x="75.5" dy="19.2">cambiar</tspan></text><rect x="175" y="149.5" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="232.5" y="174.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="232.5" dy="0">Módulo que</tspan><tspan x="232.5" dy="19.2">la oculta</tspan></text><rect x="357.5" y="22" width="107" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="411" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="411" dy="0">Cohesión:</tspan><tspan x="411" dy="19.2">lo que</tspan><tspan x="411" dy="19.2">agrupa</tspan></text><rect x="336" y="140" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="411" y="165" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="411" dy="0">Encapsulación:</tspan><tspan x="411" dy="19.2">lo que no</tspan><tspan x="411" dy="19.2">expone</tspan></text><rect x="340" y="258" width="142" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="411" y="283" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="411" dy="0">Acoplamiento:</tspan><tspan x="411" dy="19.2">de qué</tspan><tspan x="411" dy="19.2">depende</tspan></text><rect x="554" y="31.5" width="89" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="598.5" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="598.5" dy="0">Medida:</tspan><tspan x="598.5" dy="19.2">LCOM4</tspan></text><rect x="549.5" y="140" width="98" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="598.5" y="165" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="598.5" dy="0">Medida:</tspan><tspan x="598.5" dy="19.2">sitios a</tspan><tspan x="598.5" dy="19.2">editar</tspan></text><rect x="532" y="258" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="598.5" y="283" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="598.5" dy="0">Medida:</tspan><tspan x="598.5" dy="19.2">ciclos y</tspan><tspan x="598.5" dy="19.2">dependencias</tspan></text><rect x="711" y="140" width="98" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="760" y="165" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="760" dy="0">Cambio</tspan><tspan x="760" dy="19.2">local o</tspan><tspan x="760" dy="19.2">disperso</tspan></text><rect x="149.4" y="238" width="126" height="60" rx="4" fill="#ffffff"/><text x="212.4" y="253.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="212.4" dy="0">el cambio real</tspan><tspan x="212.4" dy="17.92">contradice la</tspan><tspan x="212.4" dy="17.92">medida</tspan></text></svg>
