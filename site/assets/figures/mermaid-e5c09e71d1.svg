<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 723" width="375" height="723" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Token» … «Comprobar dueño del objeto»</title><desc id="d">Diagrama de flujo con 8 pasos. «Token» lleva a «Autenticación: firma, emisor, audiencia, vigencia». «Autenticación: firma, emisor, audiencia, vigencia» lleva a «401» (falla). «Autenticación: firma, emisor, audiencia, vigencia» lleva a «Contexto: sujeto, rol, tenant». «Contexto: sujeto, rol, tenant» lleva a «Autorización: política por recurso». «Autorización: política por recurso» lleva a «403 o 404» (no permitido). «Autorización: política por recurso» lleva a «Recurso». «Recurso» lleva a «Comprobar dueño del objeto».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="375" height="723" fill="#ffffff"/><path d="M129.7,66 L129.7,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M129.7,223 L129.7,231.0 Q129.7,239 121.7,239.0 L69.0,239.0 Q60,239 60.0,248.0 L60,289.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M129.7,223 L129.7,243.0 Q129.7,252 138.7,252.0 L211.0,252.0 Q220,252 220.0,261.0 L220,281" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M216.9,342 L216.9,400" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M213.8,480 L213.8,488.0 Q213.8,496 205.8,496.0 L157.1,496.0 Q148.1,496 148.1,505.0 L148.1,538" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M213.8,480 L213.8,500.0 Q213.8,509 