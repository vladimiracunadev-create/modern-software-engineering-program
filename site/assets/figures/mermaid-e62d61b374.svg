<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841 147" width="841" height="147" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Valor y esfuerzo» … «Decisión revisable»</title><desc id="d">Diagrama de flujo con 5 pasos. «Valor y esfuerzo» lleva a «Riesgo y confianza». «Riesgo y confianza» lleva a «Coste del retraso». «Coste del retraso» lleva a «Valor del aprendizaje». «Valor del aprendizaje» lleva a «Decisión revisable». «Decisión revisable» lleva a «Valor y esfuerzo» (fallo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="841" height="147" fill="#ffffff"/><path d="M190,94.5 L236,94.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M343,94.5 L389,94.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M496,94.5 L542,94.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M666,94.5 L712,94.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M765.5,64 L765.5,57.0 Q765.5,50 758.5,50.0 L115.0,50.0 Q106,50 106.0,59.0 L106,72.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="72.5" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="98.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Valor y esfuerzo</tspan></text><rect x="236" y="64" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="289.5" y="89.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="289.5" dy="0">Riesgo y</tspan><tspan x="289.5" dy="19.2">confianza</tspan></text><rect x="389" y="64" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="442.5" y="89.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="442.5" dy="0">Coste del</tspan><tspan x="442.5" dy="19.2">retraso</tspan></text><rect x="542" y="64" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="604" y="89.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="604" dy="0">Valor del</tspan><tspan x="604" dy="19.2">aprendizaje</tspan></text><rect x="712" y="64" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="765.5" y="89.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="765.5" dy="0">Decisión</tspan><tspan x="765.5" dy="19.2">revisable</tspan></text><rect x="372.8" y="22" width="126" height="24" rx="4" fill="#ffffff"/><text x="435.8" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="435.8" dy="0">fallo o cambio</tspan></text></svg>
