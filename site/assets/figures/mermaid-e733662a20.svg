<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 813 166" width="813" height="166" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Pila / disciplina LIFO» … «Starvation / envejecimiento»</title><desc id="d">Diagrama de flujo con 5 pasos. «Pila / disciplina LIFO» lleva a «Cola / disciplina FIFO». «Cola / disciplina FIFO» lleva a «Deque / ventanas». «Deque / ventanas» lleva a «Heap / prioridad parcial». «Heap / prioridad parcial» lleva a «Starvation / envejecimiento». «Starvation / envejecimiento» lleva a «Pila / disciplina LIFO» (fallo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="813" height="166" fill="#ffffff"/><path d="M137,104 L183,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M298,104 L344,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M442,104 L488,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M595,104 L641,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M716,73.5 L716.0,59.0 Q716,50 707.0,50.0 L86.5,50.0 Q79.5,50 79.5,57.0 L79.5,64" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="64" width="115" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="79.5" y="89" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="79.5" dy="0">Pila /</tspan><tspan x="79.5" dy="19.2">disciplina</tspan><tspan x="79.5" dy="19.2">LIFO</tspan></text><rect x="183" y="64" width="115" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="240.5" y="89" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="240.5" dy="0">Cola /</tspan><tspan x="240.5" dy="19.2">disciplina</tspan><tspan x="240.5" dy="19.2">FIFO</tspan></text><rect x="344" y="73.5" width="98" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="393" y="98.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="393" dy="0">Deque /</tspan><tspan x="393" dy="19.2">ventanas</tspan></text><rect x="488" y="64" width="107" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="541.5" y="89" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="541.5" dy="0">Heap /</tspan><tspan x="541.5" dy="19.2">prioridad</tspan><tspan x="541.5" dy="19.2">parcial</tspan></text><rect x="641" y="73.5" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="716" y="98.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="716" dy="0">Starvation /</tspan><tspan x="716" dy="19.2">envejecimiento</tspan></text><rect x="334.8" y="22" width="126" height="24" rx="4" fill="#ffffff"/><text x="397.8" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="397.8" dy="0">fallo o cambio</tspan></text></svg>
