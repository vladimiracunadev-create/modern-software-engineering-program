<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 796 286" width="796" height="286" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Sistema en producción» … «Decisión durante el incidente»</title><desc id="d">Diagrama de flujo con 7 pasos. «Sistema en producción» lleva a «Señales emitidas». «Señales emitidas» lleva a «Eventos y registros». «Señales emitidas» lleva a «Métricas agregadas». «Señales emitidas» lleva a «Trazas». «Eventos y registros» lleva a «Preguntas respondibles». «Métricas agregadas» lleva a «Preguntas respondibles». «Trazas» lleva a «Preguntas respondibles». «Preguntas respondibles» lleva a «Decisión durante el incidente». «Decisión durante el incidente» lleva a «Señales emitidas» (la pregunta no tenía señal).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="796" height="286" fill="#ffffff"/><path d="M137,143 L183,143" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M281,143 L295.0,143.0 Q304,143 304.0,134.0 L304.0,61.5 Q304,52.5 313.0,52.5 L327,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M281,147.2 L327,147.2" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M281,143 L301.5,143.0 Q310.5,143 310.5,152.0 L310.5,233.0 Q310.5,242 319.5,242.0 L340,242" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M434,52.5 L448.0,52.5 Q457,52.5 457.0,61.5 L457.0,139.7 Q457,148.7 466.0,148.7 L480,148.7" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M434,150.1 L480,150.