<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 918 105" width="918" height="105" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «🎯 Plataforma» … «📈 Soporte»</title><desc id="d">Diagrama de flujo con 5 pasos. «🎯 Plataforma» lleva a «🧠 Integración nativa». «🧠 Integración nativa» lleva a «🛠️ Empaquetado». «🛠️ Empaquetado» lleva a «🔎 Actualización». «🔎 Actualización» lleva a «📈 Soporte».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="918" height="105" fill="#ffffff"/><path d="M161,52.5 L207,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M355,52.5 L401,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M549,52.5 L595,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M737,52.5 L783,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="30.5" width="139" height="44" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="91.5" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="91.5" dy="0">🎯 Plataforma</tspan></text><rect x="207" y="22" width="148" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="281" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="281" dy="0">🧠 Integración</tspan><tspan x="281" dy="19.2">nativa</tspan></text><rect x="401" y="30.5" width="148" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="475" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="475" dy="0">🛠️ Empaquetado</tspan></text><rect x="595" y="22" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="666" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="666" dy="0">🔎</tspan><tspan x="666" dy="19.2">Actualización</tspan></text><rect x="783" y="30.5" width="113" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="839.5" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="839.5" dy="0">📈 Soporte</tspan></text></svg>
