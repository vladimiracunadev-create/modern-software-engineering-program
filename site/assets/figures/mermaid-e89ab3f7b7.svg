<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 615 300" width="615" height="300" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Pregunta de capacidad» … «Criterio de parada y de aceptación»</title><desc id="d">Diagrama de flujo con 6 pasos. «Pregunta de capacidad» lleva a «Forma de carga: carga, estrés, pico, resistencia». «Forma de carga: carga, estrés, pico, resistencia» lleva a «Modelo del generador: abierto o cerrado». «Modelo del generador: abierto o cerrado» lleva a «Sistema bajo prueba». «Sistema bajo prueba» lleva a «Medida: latencia por ventana, errores, recursos». «Medida: latencia por ventana, errores, recursos» lleva a «Criterio de parada y de aceptación». «Criterio de parada y de aceptación» lleva a «Modelo del generador: abierto o cerrado» (el generador oculta algo). «Criterio de parada y de aceptación» lleva a «Forma de carga: carga, estrés, pico, resistencia» (la pregunta cambia).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="615" height="300" fill="#ffffff"/><path d="M200,71.5 L250.5,71.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M409.5,71.5 L469,71.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M526.5,121 L526.5,198" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M460,228.5 L414,228.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M246,228.5 L200,228.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M138,188.5 L138.0,144.0 Q138,135 147.0,135.0 L519.5,135.0 Q526.5,135 526.5,128.0 L526.5,121" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><path d="M200,228.5 L207.0,228.5 Q214,228.5 214.0,221.5 L214.0,159.0 Q214,150 223.0,150.0 L321.0,150.0 Q330,150 330.0,141.0 L330,121" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="76" y="41" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="138" y="66.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="138" dy="0">Pregunta de</tspan><tspan x="138" dy="19.2">capacidad</tspan></text><rect x="250.5" y="22" width="159" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="330" y="46.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="330" dy="0">Forma de carga:</tspan><tspan x="330" dy="19.2">carga, estrés,</tspan><tspan x="330" dy="19.2">pico,</tspan><tspan x="330" dy="19.2">resistencia</tspan></text><rect x="469" y="22" width="115" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="526.5" y="46.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="526.5" dy="0">Modelo del</tspan><tspan x="526.5" dy="19.2">generador:</tspan><tspan x="526.5" dy="19.2">abierto o</tspan><tspan x="526.5" dy="19.2">cerrado</tspan></text><rect x="460" y="198" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="526.5" y="223.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="526.5" dy="0">Sistema bajo</tspan><tspan x="526.5" dy="19.2">prueba</tspan></text><rect x="246" y="179" width="168" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="330" y="203.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="330" dy="0">Medida: latencia</tspan><tspan x="330" dy="19.2">por ventana,</tspan><tspan x="330" dy="19.2">errores,</tspan><tspan x="330" dy="19.2">recursos</tspan></text><rect x="76" y="188.5" width="124" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="138" y="213.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="138" dy="0">Criterio de</tspan><tspan x="138" dy="19.2">parada y de</tspan><tspan x="138" dy="19.2">aceptación</tspan></text><rect x="22" y="140.8" width="110" height="42" rx="4" fill="#ffffff"/><text x="77" y="156.7" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="77" dy="0">el generador</tspan><tspan x="77" dy="17.92">oculta algo</tspan></text><rect x="139" y="138.2" width="102" height="42" rx="4" fill="#ffffff"/><text x="190" y="154.1" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="190" dy="0">la pregunta</tspan><tspan x="190" dy="17.92">cambia</tspan></text></svg>
