<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 585 1104" width="585" height="1104" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Riesgos identificados» … «Registro de la decisión y de su revisión»</title><desc id="d">Diagrama de flujo con 10 pasos. «Riesgos identificados» lleva a «Valor esperado y cola». «Valor esperado y cola» lleva a «Decisión posible». «Decisión posible» lleva a «Reversible». «Reversible» lleva a «Decide el equipo y registra» (sí). «Reversible» lleva a «Petición a quien autoriza» (no). «Petición a quien autoriza» lleva a «Vale la pena saber más». «Vale la pena saber más» lleva a «Experimento o prueba» (valor de la información mayor al costo). «Vale la pena saber más» lleva a «Decidir ahora» (menor). «Experimento o prueba» lleva a «Decidir ahora». «Decidir ahora» lleva a «Registro de la decisión y de su revisión». «Registro de la decisión y de su revisión» lleva a «Riesgos identificados» (cambia la información).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="585" height="1104" fill="#ffffff"/><path d="M301.4,83 L301.4,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M301.4,202 L301.4,225.6 Q301.4,231 306.8,231.0 L306.8,231.0 Q312.2,231 312.2,236.4 L312.2,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M312.2,304 L312.2,324.4 Q312.2,333 320.8,333.0 L320.8,333.0 Q329.4,333 329.4,341.6 L329.4,362" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M329.4,424 L329.4,432.0 Q329.4,440 321.4,440.0 L245.5,440.0 Q236.5,440 236.5,449.0 L236.5,482" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M329.4,424 L329.4,432.0 Q329.4,440 337.4,440.0 L438.0,440.0 Q447,440 447.0,449.0 L447,482" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M447,543 L447.0,563.0 Q447,572 438.0,572.0 L419.9,572.0 Q410.9,572 410.9,581.0 L410.9,601" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M410.9,687 L410.9,695.0 Q410.9,703 402.9,703.0 L388.5,703.0 Q379.5,703 379.5,712.0 L379.5,781" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M259.4,644 L252.4,644.0 Q245.4,644 245.4,651.0 L245.4,913.0 Q245.4,922 254.4,922.0 L287.3,922" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M379.5,842 L379.5,862.0 Q379.5,871 370.5,871.0 L367.3,871.0 Q358.3,871 358.3,880.0 L358.3,900" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M358.3,944 L358.3,967.6 Q358.3,973 353.0,973.0 L353.0,973.0 Q347.6,973 347.6,978.4 L347.6,1002" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M263.6,1042 L139.0,1042.0 Q130,1042 130.0,1033.0 L130.0,61.5 Q130,52.5 139.0,52.5 L230.4,52.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="230.4" y="22" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="301.4" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="301.4" dy="0">Riesgos</tspan><tspan x="301.4" dy="19.2">identificados</tspan></text><rect x="217.4" y="141" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="301.4" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="301.4" dy="0">Valor esperado y</tspan><tspan x="301.4" dy="19.2">cola</tspan></text><rect x="228.2" y="260" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="312.2" y="286.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="312.2" dy="0">Decisión posible</tspan></text><polygon points="329.4,362 399.9,393 329.4,424 258.9,393" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="329.4" y="397.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="329.4" dy="0">Reversible</tspan></text><rect x="144" y="482" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="236.5" y="507.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="236.5" dy="0">Decide el equipo y</tspan><tspan x="236.5" dy="19.2">registra</tspan></text><rect x="363" y="482" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="447" y="507.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="447" dy="0">Petición a quien</tspan><tspan x="447" dy="19.2">autoriza</tspan></text><polygon points="410.9,601 562.4,644 410.9,687 259.4,644" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="410.9" y="638.6" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="410.9" dy="0">Vale la pena saber</tspan><tspan x="410.9" dy="19.2">más</tspan></text><rect x="308.5" y="781" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="379.5" y="806.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="379.5" dy="0">Experimento o</tspan><tspan x="379.5" dy="19.2">prueba</tspan></text><rect x="287.3" y="900" width="142" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="358.3" y="926.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="358.3" dy="0">Decidir ahora</tspan></text><rect x="263.6" y="1002" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="347.6" y="1027" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="347.6" dy="0">Registro de la</tspan><tspan x="347.6" dy="19.2">decisión y de su</tspan><tspan x="347.6" dy="19.2">revisión</tspan></text><rect x="242.5" y="449" width="29" height="24" rx="4" fill="#ffffff"/><text x="257" y="464.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="257" dy="0">sí</tspan></text><rect x="453" y="449" width="29" height="24" rx="4" fill="#ffffff"/><text x="467.5" y="464.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467.5" dy="0">no</tspan></text><rect x="385.5" y="712" width="126" height="60" rx="4" fill="#ffffff"/><text x="448.5" y="727.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="448.5" dy="0">valor de la</tspan><tspan x="448.5" dy="17.92">información</tspan><tspan x="448.5" dy="17.92">mayor al costo</tspan></text><rect x="227.3" y="894" width="53" height="24" rx="4" fill="#ffffff"/><text x="253.8" y="909.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="253.8" dy="0">menor</tspan></text><rect x="22" y="526.2" width="102" height="42" rx="4" fill="#ffffff"/><text x="73" y="542.1" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="73" dy="0">cambia la</tspan><tspan x="73" dy="17.92">información</tspan></text></svg>
