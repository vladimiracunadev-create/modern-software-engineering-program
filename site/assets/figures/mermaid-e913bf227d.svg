<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 554 657" width="554" height="657" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Necesidad: ejecutar la plataforma» … «Decisión y riesgo residual»</title><desc id="d">Diagrama de flujo con 7 pasos. «Necesidad: ejecutar la plataforma» lleva a «Modelo de servicio: IaaS, PaaS, SaaS». «Modelo de servicio: IaaS, PaaS, SaaS» lleva a «Capas delegadas al proveedor». «Modelo de servicio: IaaS, PaaS, SaaS» lleva a «Capas que siguen siendo del cliente». «Capas delegadas al proveedor» lleva a «Evidencia: informes, certificaciones, contratos». «Capas que siguen siendo del cliente» lleva a «Evidencia propia: configuración, pruebas, revisión». «Evidencia: informes, certificaciones, contratos» lleva a «Decisión y riesgo residual». «Evidencia propia: configuración, pruebas, revisión» lleva a «Decisión y riesgo residual». «Decisión y riesgo residual» lleva a «Modelo de servicio: IaaS, PaaS, SaaS» (incidente).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="554" height="657" fill="#ffffff"/><path d="M224.1,102 L224.1,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M224.1,240 L224.1,260.0 Q224.1,269 215.1,269.0 L123.5,269.0 Q114.5,269 114.5,278.0 L114.5,298" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M224.1,240 L224.1,260.0 Q224.1,269 233.1,269.0 L324.5,269.0 Q333.5,269 333.5,278.0 L333.5,298" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M117.7,359 L117.7,417" fill="none" stroke="#32505f" stroke-width=