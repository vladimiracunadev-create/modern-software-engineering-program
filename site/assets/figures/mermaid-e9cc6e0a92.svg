<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 893 326" width="893" height="326" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Operación» … «Prueba discriminante»</title><desc id="d">Diagrama de flujo con 8 pasos. «Operación» lleva a «Logs estructurados». «Operación» lleva a «Métricas». «Operación» lleva a «Estado y stderr». «Contexto de plataforma» lleva a «Línea temporal». «Logs estructurados» lleva a «Línea temporal». «Métricas» lleva a «Línea temporal». «Estado y stderr» lleva a «Línea temporal». «Línea temporal» lleva a «Hipótesis rivales». «Hipótesis rivales» lleva a «Prueba discriminante».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="893" height="326" fill="#ffffff"/><path d="M129,163 L147.2,163.0 Q156.2,163 156.2,154.0 L156.2,61.5 Q156.2,52.5 165.2,52.5 L183.5,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M129,163 L158.2,163.0 Q167.2,163 167.2,154.0 L167.2,138.0 Q167.2,129 176.2,129.0 L205.5,129" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M129,163 L143.0,163.0 Q152,163 152.0,172.0 L152.0,188.0 Q152,197 161.0,197.0 L175,197" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M316.5,273.5 L339.2,273.5 Q348.2,273.5 348.2,264.5 L348.2,172.0 Q348.2,163 357.2,163.0 L380,163" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M325.5,52.5 L343.8,52.5 Q352.8,52.5 352.8,61.5 L352.8,154.0 Q352.8,163 361.8,163.0 L380,163" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path