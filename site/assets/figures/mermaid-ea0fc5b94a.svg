<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 844 212" width="844" height="212" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Frase vaga» … «Resultado» y «Objetivo o riesgo»</title><desc id="d">Diagrama de flujo con 5 pasos. «Frase vaga» lleva a «Patrón de reparación». «Patrón de reparación» lleva a «Procedimiento de verificación». «Procedimiento de verificación» lleva a «Resultado». «Procedimiento de verificación» lleva a «Objetivo o riesgo» (no es finito). «Resultado» lleva a «Frase vaga» (ajuste).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="844" height="212" fill="#ffffff"/><path d="M137,127 L183,127" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M298,127 L344,127" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M512,127 L587.2,127.0 Q596.2,127 596.2,118.0 L596.2,95.0 Q596.2,86 605.2,86.0 L680.5,86" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M512,127 L520.0,127.0 Q528,127 528.0,135.0 L528.0,159.0 Q528,168 537.0,168.0 L646,168" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M734,64 L734.0,57.0 Q734,50 727.0,50.0 L88.5,50.0 Q79.5,50 79.5,59.0 L79.5,105" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="105" width="115" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="79.5" y="131.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="79.5" dy="0">Frase vaga</tspan></text><rect x="183" y="96.5" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="240.5" y="121.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="240.5" dy="0">Patrón de</tspan><tspan x="240.5" dy="19.2">reparación</tspan></text><rect x="344" y="96.5" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="428" y="121.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="428" dy="0">Procedimiento de</tspan><tspan x="428" dy="19.2">verificación</tspan></text><rect x="680.5" y="64" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="734" y="90.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="734" dy="0">Resultado</tspan></text><rect x="646" y="146" width="176" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="734" y="172.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="734" dy="0">Objetivo o riesgo</tspan></text><rect x="532" y="140" width="110" height="24" rx="4" fill="#ffffff"/><text x="587" y="155.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587" dy="0">no es finito</tspan></text><rect x="376.2" y="22" width="61" height="24" rx="4" fill="#ffffff"/><text x="406.7" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="406.7" dy="0">ajuste</tspan></text></svg>
