<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 644" width="810" height="644" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Mensaje publicado» … «Carga por consumidor» y «Reconstruir estado»</title><desc id="d">Diagrama de flujo con 11 pasos. «Mensaje publicado» lleva a «¿Qué ocurre tras entregarlo?». «¿Qué ocurre tras entregarlo?» lleva a «Cola de trabajo» (se borra, un consumidor). «¿Qué ocurre tras entregarlo?» lleva a «Tópico» (se copia a cada suscripción). «¿Qué ocurre tras entregarlo?» lleva a «Log por particiones» (se conserva con desplazamiento). «Log por particiones» lleva a «Clave de partición: orden por clave». «Log por particiones» lleva a «Retención o compactación». «Cola de trabajo» lleva a «Consumidores competidores». «Tópico» lleva a «Suscripciones independientes». «Clave de partición: orden por clave» lleva a «Carga por consumidor». «Retención o compactación» lleva a «Reconstruir estado».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="810" height="644" fill="#ffffff"/><path d="M381.1,66 L381.1,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M381.1,210 L381.1,218.0 Q381.1,226 373.1,226.0 L201.6,226.0 Q192.6,226 192.6,235.0 L192.6,312.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M381.1,210 L381.1,218.0 Q381.1,226 389.1,226.0 L402.0,226.0 Q411,226 411.0,235.0 L411,312.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M381.1,210 L381.1,218.0 Q381.1,226 389.1,226.0 L538.5,226.0 Q547.5,226 547.5,235.0 L547.5,304" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M547.5,365 L547.5,385.0 Q547.5,394 538.5,394.0 L341.2,394.0 Q332.2,394 332.2,403.0 L332.2,423" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M547.5,365 L547.5,389.8 Q547.5,398.8 556.5,398.8 L691.7,398.8 Q700.7,398.8 700.7,407.8 L700.7,432.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M192.6,356.5 L192.6,385.5 Q192.6,394.5 183.6,394.5 L97.5,394.5 Q88.5,394.5 88.5,403.5 L88.5,432.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M411,356.5 L411.0,385.5 Q411,394.5 420.0,394.5 L516.2,394.5 Q525.2,394.5 525.2,403.5 L525.2,432.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M329.6,503 L329.6,561" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M698.1,493.5 L698.1,569.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="293.1" y="22" width="176" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="381.1" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="381.1" dy="0">Mensaje publicado</tspan></text><polygon points="381.1,124 516.6,167 381.1,210 245.6,167" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="381.1" y="161.6" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="381.1" dy="0">¿Qué ocurre tras</tspan><tspan x="381.1" dy="19.2">entregarlo?</tspan></text><rect x="113.1" y="312.5" width="159" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="192.6" y="338.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="192.6" dy="0">Cola de trabajo</tspan></text><rect x="370.5" y="312.5" width="81" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="411" y="338.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="411" dy="0">Tópico</tspan></text><rect x="485.5" y="304" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="547.5" y="329.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="547.5" dy="0">Log por</tspan><tspan x="547.5" dy="19.2">particiones</tspan></text><rect x="248.2" y="423" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="332.2" y="448" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="332.2" dy="0">Clave de</tspan><tspan x="332.2" dy="19.2">partición: orden</tspan><tspan x="332.2" dy="19.2">por clave</tspan></text><rect x="634.2" y="432.5" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="700.7" y="457.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="700.7" dy="0">Retención o</tspan><tspan x="700.7" dy="19.2">compactación</tspan></text><rect x="22" y="432.5" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="88.5" y="457.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="88.5" dy="0">Consumidores</tspan><tspan x="88.5" dy="19.2">competidores</tspan></text><rect x="450.2" y="432.5" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="525.2" y="457.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="525.2" dy="0">Suscripciones</tspan><tspan x="525.2" dy="19.2">independientes</tspan></text><rect x="269.5" y="561" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="327" y="586.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="327" dy="0">Carga por</tspan><tspan x="327" dy="19.2">consumidor</tspan></text><rect x="603" y="569.5" width="185" height="44" rx="10" fill="#dff1ee" stroke="#087f