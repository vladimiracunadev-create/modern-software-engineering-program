<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 381" width="670" height="381" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Flujo vulnerable» … «Revisión humana y otras herramientas»</title><desc id="d">Diagrama de flujo con 8 pasos. «Flujo vulnerable» lleva a «Verificador: 8 hallazgos». «Verificador: 8 hallazgos» lleva a «Un cambio por hallazgo». «Un cambio por hallazgo» lleva a «Prueba: el hallazgo desaparece». «Prueba: el hallazgo desaparece» lleva a «Quedan hallazgos». «Quedan hallazgos» lleva a «Un cambio por hallazgo» (sí). «Quedan hallazgos» lleva a «Flujo endurecido» (no). «Flujo endurecido» lleva a «Qué no ve el verificador». «Qué no ve el verificador» lleva a «Revisión humana y otras herramientas».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="670" height="381" fill="#ffffff"/><path d="M190,52.5 L276.5,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M426.5,52.5 L506,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M577,83 L577,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M519.5,181 L460,181" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M243,181 L190,181" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M106,203 L106,288.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M172.5,319 L272,319" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M351.5,150 L351.5,106.0 Q351.5,97 360.5,97.0 L483.0,97.0 Q492,97 492.0,88.0 L492.0,59.5 Q492,52.5 499.0,52.5 L506,52.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="30.5" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Flujo vulnerable</tspan></text><rect x="276.5" y="22" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="351.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="351.5" dy="0">Verificador: 8</tspan><tspan x="351.5" dy="19.2">hallazgos</tspan></text><rect x="506" y="22" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="577" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="577" dy="0">Un cambio por</tspan><tspan x="577" dy="19.2">hallazgo</tspan></text><rect x="519.5" y="141" width="115" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="577" y="166" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="577" dy="0">Prueba: el</tspan><tspan x="577" dy="19.2">hallazgo</tspan><tspan x="577" dy="19.2">desaparece</tspan></text><polygon points="351.5,150 460,181 351.5,212 243,181" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="351.5" y="185.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="351.5" dy="0">Quedan hallazgos</tspan></text><rect x="22" y="159" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="185.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Flujo endurecido</tspan></text><rect x="39.5" y="288.5" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="313.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Qué no ve el</tspan><tspan x="106" dy="19.2">verificador</tspan></text><rect x="272" y="279" width="159" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="351.5" y="304" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="351.5" dy="0">Revisión humana</tspan><tspan x="351.5" dy="19.2">y otras</tspan><tspan x="351.5" dy="19.2">herramientas</tspan></text><rect x="407.2" y="101" width="29" height="24" rx="4" fill="#ffffff"/><text x="421.7" y="116.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="421.7" dy="0">sí</tspan></text><rect x="202" y="153" width="29" height="24" rx="4" fill="#ffffff"/><text x="216.5" y="168.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="216.5" dy="0">no</tspan></text></svg>
