<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 606 632" width="606" height="632" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Cambio» … «Fusión»</title><desc id="d">Diagrama de flujo con 9 pasos. «Cambio» lleva a «Commits atómicos y firmados». «Commits atómicos y firmados» lleva a «Rama de contribución». «Rama de contribución» lleva a «Validador». «Validador» lleva a «Comprobaciones» (forma). «Validador» lleva a «Revisión humana» (sentido). «Licencia y origen» lleva a «Rama de contribución». «Issue y propietarios» lleva a «Rama de contribución». «Comprobaciones» lleva a «Fusión». «Revisión humana» lleva a «Fusión».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="606" height="632" fill="#ffffff"/><path d="M114.5,66 L114.5,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M114.5,185 L114.5,205.0 Q114.5,214 123.5,214.0 L346.8,214.0 Q355.8,214 355.8,223.0 L355.8,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M355.8,304 L355.8,324.0 Q355.8,333 364.8,333.0 L383.9,333.0 Q392.9,333 392.9,342.0 L392.9,362" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M392.9,406 L392.9,414.0 Q392.9,422 384.9,422.0 L323.9,422.0 Q314.9,422 314.9,431.0 L314.9,464" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M392.9,406 L392.9,414.0 Q392.9,422 400.9,422.0 L494.4,422.0 Q503.4,422 503.4,431.0 L503.4,464" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M329,176.5 L329.0,200.8 Q329,209.8 33