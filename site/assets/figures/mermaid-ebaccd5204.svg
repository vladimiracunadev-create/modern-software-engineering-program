<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 243" width="704" height="243" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Alcance del flujo» … «Revisión humana pendiente»</title><desc id="d">Diagrama de flujo con 7 pasos. «Alcance del flujo» lleva a «Auditoría automática y manual». «Auditoría automática y manual» lleva a «Hallazgos y gravedad». «Hallazgos y gravedad» lleva a «Orden de reparación». «Orden de reparación» lleva a «Reparación». «Reparación» lleva a «Regresión automática». «Regresión automática» lleva a «Revisión humana pendiente». «Revisión humana pendiente» lleva a «Alcance del flujo» (cambio del flujo).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="704" height="243" fill="#ffffff"/><path d="M146,62 L205,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M338,62 L397,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M521,62 L567,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M624.5,92.5 L624.5,168.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M567,190.5 L516.5,190.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M401.5,190.5 L351,190.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M192,190.5 L93.0,190.5 Q84,190.5 84.0,181.5 L84,92.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="31.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="84" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="84" dy="0">Alcance del</tspan><tspan x="84" dy="19.2">flujo</tspan></text><rect x="205" y="22" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="271.5" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="271.5" dy="0">Auditoría</tspan><tspan x="271.5" dy="19.2">automática y</tspan><tspan x="271.5" dy="19.2">manual</tspan></text><rect x="397" y="31.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="459" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="459" dy="0">Hallazgos y</tspan><tspan x="459" dy="19.2">gravedad</tspan></text><rect x="567" y="31.5" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="624.5" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="624.5" dy="0">Orden de</tspan><tspan x="624.5" dy="19.2">reparación</tspan></text><rect x="567" y="168.5" width="115" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="624.5" y="194.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="624.5" dy="0">Reparación</tspan></text><rect x="401.5" y="160" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="459" y="185.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="459" dy="0">Regresión</tspan><tspan x="459" dy="19.2">automática</tspan></text><rect x="192" y="160" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="271.5" y="185.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="271.5" dy="0">Revisión humana</tspan><tspan x="271.5" dy="19.2">pendiente</tspan></text><rect x="91" y="144.5" width=