<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 631 243" width="631" height="243" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Modelo de costo / pregunta» … «Comparabilidad / reporte»</title><desc id="d">Diagrama de flujo con 5 pasos. «Modelo de costo / pregunta» lleva a «Reloj, repetición / distribución». «Reloj, repetición / distribución» lleva a «Warm-up, caché / aislamiento». «Warm-up, caché / aislamiento» lleva a «Perfil / atribución». «Perfil / atribución» lleva a «Comparabilidad / reporte». «Comparabilidad / reporte» lleva a «Modelo de costo / pregunta» (fallo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="631" height="243" fill="#ffffff"/><path d="M181,62 L244.5,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M377.5,62 L441,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M525,92.5 L525,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M467.5,190.5 L395,190.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M227,190.5 L110.5,190.5 Q101.5,190.5 101.5,181.5 L101.5,92.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="31.5" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101.5" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101.5" dy="0">Modelo de costo</tspan><tspan x="101.5" dy="19.2">/ pregunta</tspan></text><rect x="244.5" y="22" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="311" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="311" dy="0">Reloj,</tspan><tspan x="311" dy="19.2">repetición /</tspan><tspan x="311" dy="19.2">distribución</tspan></text><rect x="441" y="31.5" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="525" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="525" dy="0">Warm-up, caché /</tspan><tspan x="525" dy="19.2">aislamiento</tspan></text><rect x="467.5" y="160" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="525" y="185.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="525" dy="0">Perfil /</tspan><tspan x="525" dy="19.2">atribución</tspan></text><rect x="227" y="160" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="311" y="185.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="311" dy="0">Comparabilidad /</tspan><tspan x="311" dy="19.2">reporte</tspan></text><rect x="88.7" y="162.5" width="126" height="24" rx="4" fill="#ffffff"/><text x="151.7" y="178.4" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="151.7" dy="0">fallo o cambio</tspan></text></svg>
