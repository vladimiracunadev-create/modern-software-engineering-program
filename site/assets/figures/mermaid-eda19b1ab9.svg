<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 485 1092" width="485" height="1092" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Carrito» … «Asiento de reversión»</title><desc id="d">Diagrama de flujo con 12 pasos. «Carrito» lleva a «Checkout» (sin reserva). «Checkout» lleva a «Reserva atómica con vencimiento». «Reserva atómica con vencimiento» lleva a «Venta confirmada» (pago ok). «Reserva atómica con vencimiento» lleva a «Stock liberado» (vence o abandona). «Venta confirmada» lleva a «Preparación y envío». «Preparación y envío» lleva a «Entrega». «Entrega» lleva a «Devolución pedida». «Devolución pedida» lleva a «Producto recibido». «Producto recibido» lleva a «Reembolso y reposición» (conforme). «Venta confirmada» lleva a «Asiento de ingreso». «Reembolso y reposición» lleva a «Asiento de reversión».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="485" height="1092" fill="#ffffff"/><path d="M335.9,66 L335.9,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M335.9,168 L335.9,188.0 Q335.9,197 326.9,197.0 L315.4,197.0 Q306.4,197 306.4,206.0 L306.4,226" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M306.4,287 L306.4,295.0 Q306.4,303 298.4,303.0 L196.0,303.0 Q187,303 187.0,312.0 L187,363" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M306.4,287 L306.4,295.0 Q306.4,303 314.4,303.0 L371.0,303.0 Q380,303 380.0,312.0 L380,363" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M187,407 L187.0,427.0 Q187,436 1