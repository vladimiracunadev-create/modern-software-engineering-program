<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 784 243" width="784" height="243" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Situación de operación» … «Métricas de arquitectura»</title><desc id="d">Diagrama de flujo con 8 pasos. «Situación de operación» lleva a «Peligro». «Peligro» lleva a «Gravedad, exposición y controlabilidad». «Gravedad, exposición y controlabilidad» lleva a «ASIL del objetivo de seguridad». «ASIL del objetivo de seguridad» lleva a «Requisitos de seguridad». «Requisitos de seguridad» lleva a «Mecanismos de diagnóstico». «Mecanismos de diagnóstico» lleva a «Cobertura medida por inyección». «Cobertura medida por inyección» lleva a «Métricas de arquitectura». «Métricas de arquitectura» lleva a «Mecanismos de diagnóstico» (no alcanza el valor).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="784" height="243" fill="#ffffff"/><path d="M155,62 L240.5,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M329.5,62 L415,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M574,62 L629,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M691,102 L691,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M620,190.5 L565.5,190.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M423.5,190.5 L369,190.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M201,190.5 L155,190.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M88.5,160 L88.5,153.0 Q88.5,146 95.5,146.0 L487.5,146.0 Q494.5,146 494.5,153.0 L494.5,160" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="31.5" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="88.5" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="88.5" dy="0">Situación de</tspan><tspan x="88.5" dy="19.2">operación</tspan></text><rect x="240.5" y="40" width="89" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="285" y="66.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="285" dy="0">Peligro</tspan></text><rect x="415" y="22" width="159" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="494.5" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="494.5" dy="0">Gravedad,</tspan><tspan x="494.5" dy="19.2">exposición y</tspan><tspan x="494.5" dy="19.2">controlabilidad</tspan></text><rect x="629" y="22" width="124" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="691" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="691" dy="0">ASIL del</tspan><tspan x="691" dy="19.2">objetivo de</tspan><tspan x="691" dy="19.2">seguridad</tspan></text><rect x="620" y="160" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="691" y="185.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="691" dy="0">Requisitos de</tspan><tspan x="691" dy="19.2">seguridad</tspan></text><rect x="423.5" y="160" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="494.5" y="185.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="494.5" dy="0">Mecanismos de</tspan><tspan x="494.5" dy="19.2">diagnóstico</tspan></text><rect x="201" y="160" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="285" y="185.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="285" dy="0">Cobertura medida</tspan><tspan x="285" dy="19.2">por inyección</tspan></text><rect x="22" y="160" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="88.5" y="185.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="88.5" dy="0">Métricas de</tspan><tspan x="88.5" dy="19.2">arquitectura</tspan></text><rect x="232.5" y="100" width="118" height="42" rx="4" fill="#ffffff"/><text x="291.5" y="115.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="291.5" dy="0">no alcanza el</tspan><tspan x="291.5" dy="17.92">valor</tspan></text></svg>
