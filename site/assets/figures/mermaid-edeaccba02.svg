<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 676 567" width="676" height="567" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Cliente» … «Tiempo agotado»</title><desc id="d">Diagrama de flujo con 7 pasos. «Cliente» lleva a «Servidor» (POST + clave K). «Servidor» lleva a «Existe K?». «Existe K?» lleva a «Ejecutar y guardar respuesta con K» (no). «Existe K?» lleva a «Devolver respuesta guardada» (sí, misma carga). «Existe K?» lleva a «422: clave reutilizada» (sí, otra carga). «Ejecutar y guardar respuesta con K» lleva a «Tiempo agotado» (respuesta perdida). «Tiempo agotado» lleva a «Cliente» (retroceso con jitter).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="676" height="567" fill="#ffffff"/><path d="M367.9,66 L367.9,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M367.9,168 L367.9,188.0 Q367.9,197 358.9,197.0 L347.6,197.0 Q338.6,197 338.6,206.0 L338.6,226" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M338.6,288 L338.6,296.0 Q338.6,304 330.6,304.0 L123.5,304.0 Q114.5,304 114.5,313.0 L114.5,364" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M336,288 L336,364" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M338.6,288 L338.6,296.0 Q338.6,304 346.6,304.0 L513.0,304.0 Q522,304 522.0,313.0 L522,364" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M117.4,425 L117.4,501" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M195.2,523 L218.0,523.0 Q227,523 227.0,514.0 L227.0,53.0 Q227,44 236.0,44.0 L323.4,44" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="323.4" y="22" width="89" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="367.9" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="367.9" dy="0">Cliente</tspan></text><rect x="318.9" y="124" width="98" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="367.9" y="150.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="367.9" dy="0">Servidor</tspan></text><polygon points="338.6,226 403.1,257 338.6,288 274.1,257" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="338.6" y="261.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="338.6" dy="0">Existe K?</tspan></text><rect x="22" y="364" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="114.5" y="389.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="114.5" dy="0">Ejecutar y guardar</tspan><tspan x="114.5" dy="19.2">respuesta con K</tspan></text><rect x="241" y="364" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="333.5" y="389.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="333.5" dy="0">Devolver respuesta</tspan><tspan x="333.5" dy="19.2">guardada</tspan></text><rect x="460" y="364" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="522" y="389.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="522" dy="0">422: clave</tspan><tspan x="522" dy="19.2">reutilizada</tspan></text><rect x="45.2" y="501" width="150" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="120.2" y="527.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="120.2" dy="0">Tiempo agotado</tspan></text><rect x="373.9" y="83" width="126" height="24" rx="4" fill="#ffffff"/><text x="436.9" y="98.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="436.9" dy="0">POST + clave K</tspan></text><rect x="120.5" y="322" width="29" height="24" rx="4" fill="#ffffff"/><text x="135" y="337.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="135" dy="0">no</tspan></text><rect x="342" y="305" width="86" height="42" rx="4" fill="#ffffff"/><text x="385" y="320.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="385" dy="0">sí, misma</tspan><tspan x="385" dy="17.92">carga</tspan></text><rect x="528" y="322" width="126" height="24" rx="4" fill="#ffffff"/><text x="591" y="337.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="591" dy="0">sí, otra carga</tspan></text><rect x="123.4" y="442" width="86" height="42" rx="4" fill="#ffffff"/><text x="166.4" y="457.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="166.4" dy="0">respuesta</tspan><tspan x="166.4" dy="17.92">perdida</tspan></text><rect x="103" y="214.6" width="118" height="42" rx="4" fill="#ffffff"/><text x="162" y="230.5" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="162" dy="0">retroceso con</tspan><tspan x="162" dy="17.92">jitter</tspan></text></svg>
