<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 524 1003" width="524" height="1003" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Carga de trabajo» … «Matriz de contención y decisión con su condición de revisión»</title><desc id="d">Diagrama de flujo con 8 pasos. «Carga de trabajo» lleva a «¿Se puede compilar a Wasm y no necesita bibliotecas del sistema?». «¿Se puede compilar a Wasm y no necesita bibliotecas del sistema?» lleva a «Módulo Wasm: combustible, memoria, cero importaciones» (sí). «¿Se puede compilar a Wasm y no necesita bibliotecas del sistema?» lleva a «¿Código de varios inquilinos o desconocido?» (no). «¿Código de varios inquilinos o desconocido?» lleva a «Proceso con entorno propio, directorio temporal y tiempo máximo» (no). «¿Código de varios inquilinos o desconocido?» lleva a «Proceso dentro de contenedor reforzado, núcleo de aplicación o microVM» (sí). «Módulo Wasm: combustible, memoria, cero importaciones» lleva a «Batería hostil: mismas seis pruebas». «Proceso con entorno propio, directorio temporal y tiempo máximo» lleva a «Batería hostil: mismas seis pruebas». «Proceso dentro de contenedor reforzado, núcleo de aplicación o microVM» lleva a «Batería hostil: mismas seis pruebas». «Batería hostil: mismas seis pruebas» lleva a «Matriz de contención y decisión con su condición de revisión».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="524" height="1003" fill="#ffffff"/><path d="M202.9,66 L202.9,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M202.9,313 L202.9,321.0 Q202.9,329 194.9,329.