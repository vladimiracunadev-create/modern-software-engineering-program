<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" width="880" height="310" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Canal de mensajes» … «Idempotent Receiver», «Resequencer» y «Dead Letter Channel con alarma»</title><desc id="d">Diagrama de flujo con 10 pasos. «Canal de mensajes» lleva a «¿Qué garantiza?». «¿Qué garantiza?» lleva a «Puede duplicar» (al menos una vez). «¿Qué garantiza?» lleva a «Puede desordenar» (sin orden). «¿Qué garantiza?» lleva a «Nunca se procesa» (mensaje veneno). «Puede duplicar» lleva a «Idempotent Receiver». «Puede desordenar» lleva a «Resequencer». «Nunca se procesa» lleva a «Dead Letter Channel con alarma». «Canal de mensajes» lleva a «Content-Based Router». «Canal de mensajes» lleva a «Correlation Identifier».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="880" height="310" fill="#ffffff"/><path d="M120,162.5 L134.0,162.5 Q143,162.5 143.0,153.5 L143.0,77.0 Q143,68 152.0,68.0 L166,68" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M370,68 L529,68" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M370,68 L378.0,68.0 Q386,68 386.0,76.0 L386.0,144.5 Q386,153.5 395.0,153.5 L520,153.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M370,68 L378.0,68.0 Q386,68 386.0,76.0 L386.0,239.0 Q386,248 395.0,248.0 L520,248" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M679,68 L738.5,68" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M688,153.5 L734,153.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M688,248 L734,248" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M120,162.5 L154.0,162.5 Q158.5,162.5 158.5,158.0 L158.5,158.0 Q158.5,153.5 163.0,153.5 L197,153.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M120,162.5 L154.0,162.5 Q163,162.5 163.0,171.5 L163.0,239.0 Q163,248 172.0,248.0 L206,248" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="132" width="98" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="71" y="157.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="71" dy="0">Canal de</tspan><tspan x="71" dy="19.2">mensajes</tspan></text><polygon points="268,37 370,68 268,99 166,68" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="268" y="72.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="268" dy="0">¿Qué garantiza?</tspan></text><rect x="529" y="46" width="150" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="604" y="72.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="604" dy="0">Puede duplicar</tspan></text><rect x="520" y="131.5" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="604" y="157.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="604" dy="0">Puede desordenar</tspan></text><rect x="520" y="226" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="604" y="252.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="604" dy="0">Nunca se procesa</tspan></text><rect x="738.5" y="37.5" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="796" y="62.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="796" dy="0">Idempotent</tspan><tspan x="796" dy="19.2">Receiver</tspan></text><rect x="734" y="131.5" width="124" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="796" y="157.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="796" dy="0">Resequencer</tspan></text><rect x="734" y="208" width="124" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="796" y="233" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="796" dy="0">Dead Letter</tspan><tspan x="796" dy="19.2">Channel con</tspan><tspan x="796" dy="19.2">alarma</tspan></text><rect x="197" y="123" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="268" y="148.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="268" dy="0">Content-Based</tspan><tspan x="268" dy="19.2">Router</tspan></text><rect x="206" y="217.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="268" y="242.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="268" dy="0">Correlation</tspan><tspan x="268" dy="19.2">Identifier</tspan></text><rect x="394.5" y="22" width="110" height="42" rx="4" fill="#ffffff"/><text x="449.5" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="449.5" dy="0">al menos una</tspan><tspan x="449.5" dy="17.92">vez</tspan></text><rect x="410" y="125.5" width="86" height="24" rx="4" fill="#ffffff"/><text x="453" y="141.4" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="453" dy="0">sin orden</tspan></text><rect x="390" y="220" width="126" height="24" rx="4" fill="#ffffff"/><text x="453" y="235.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="453" dy="0">mensaje veneno</tspan></text></svg>
