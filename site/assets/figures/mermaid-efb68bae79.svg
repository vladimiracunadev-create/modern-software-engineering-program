<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 833 282" width="833" height="282" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «stdin: datos» … «Diagnóstico», «Resultado» y «Decisión del shell»</title><desc id="d">Diagrama de flujo con 6 pasos. «stdin: datos» lleva a «Comando A». «Comando A» lleva a «Comando B» (stdout). «Comando A» lleva a «Diagnóstico» (stderr). «Comando B» lleva a «Resultado» (stdout). «Comando B» lleva a «Diagnóstico» (stderr). «Comando A» lleva a «Decisión del shell» (exit status). «Comando B» lleva a «Decisión del shell» (exit status).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="833" height="282" fill="#ffffff"/><path d="M155,154 L201,154" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M308,154 L393,154" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M254.5,132 L254.5,59.0 Q254.5,50 263.5,50.0 L711.5,50.0 Q718.5,50 718.5,57.0 L718.5,64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M500,154 L665,154" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M500,154 L508.0,154.0 Q516,154 516.0,146.0 L516.0,95.0 Q516,86 525.0,86.0 L656.5,86" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M254.5,176 L254.5,249.0 Q254.5,258 263.5,258.0 L711.5,258.0 Q718.5,258 718.5,251.0 L718.5,244" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M500,154 L508.0,154.0 Q516,154 516.0,162.0 L516.0,213.0 Q516,222 525