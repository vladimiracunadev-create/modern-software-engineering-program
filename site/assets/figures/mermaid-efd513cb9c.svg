<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 862 538" width="862" height="538" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Informe de investigación» … «Integridad por función y defensa en profundidad», «Análisis de peligros que incluye el software», «Modelo de estados y parámetros versionados», «Aritmética, invariantes y pruebas de límites» y «Caso de seguridad y revisión de supuestos»</title><desc id="d">Diagrama de flujo con 12 pasos. «Informe de investigación» lleva a «Factores con su fuente». «Factores con su fuente» lleva a «Software como única barrera». «Factores con su fuente» lleva a «Análisis que excluyó el software». «Factores con su fuente» lleva a «Condición de carrera». «Factores con su fuente» lleva a «Contador de un byte». «Factores con su fuente» lleva a «Cultura de pausas y mensajes crípticos». «Software como única barrera» lleva a «Integridad por función y defensa en profundidad». «Análisis que excluyó el software» lleva a «Análisis de peligros que incluye el software». «Condición de carrera» lleva a «Modelo de estados y parámetros versionados». «Contador de un byte» lleva a «Aritmética, invariantes y pruebas de límites». «Cultura de pausas y mensajes crípticos» lleva a «Caso de seguridad y revisión de supuestos».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="862" height="538" fill="#ffffff"/><path d="M438.8,83 L438.8,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M438.8,202 L438.8,231.5 Q438.8,240.5 429.8,240.5 L106.9,240.5 Q97.9,240.5 97.9,249.5 L97.9,279" fill="none" stroke="#