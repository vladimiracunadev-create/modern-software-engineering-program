<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 898 483" width="898" height="483" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Lectura de la plataforma» y «Escritura» … «Riesgo: valor viejo hasta la expiración», «Riesgo: relleno con un valor viejo», «Se espera a la expiración», «Se borra la clave» y «Se actualiza la clave»</title><desc id="d">Diagrama de flujo con 12 pasos. «Lectura de la plataforma» lleva a «¿Está en la caché y vigente?». «¿Está en la caché y vigente?» lleva a «Acierto: se sirve el valor guardado» (sí). «¿Está en la caché y vigente?» lleva a «Fallo: se lee de la base y se guarda» (no). «Escritura» lleva a «Cambia la base». «Cambia la base» lleva a «Política». «Política» lleva a «Se espera a la expiración» (TTL). «Política» lleva a «Se borra la clave» (invalidar). «Política» lleva a «Se actualiza la clave» (escribir también). «Fallo: se lee de la base y se guarda» lleva a «Riesgo: relleno con un valor viejo». «Acierto: se sirve el valor guardado» lleva a «Riesgo: valor viejo hasta la expiración».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="898" height="483" fill="#ffffff"/><path d="M164,207.5 L210,207.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M413,207.5 L421.0,207.5 Q429,207.5 429.0,199.5 L429.0,155.5 Q429,146.5 438.0,146.5 L466,146.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M413,207.5 L421.0,207.5 Q429,207.5 429.0,215.5 L429.0,241.5 Q429,250.5 438.0,250.5 L470,250.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M146.5,284 L182.5,284.0 Q191.5,284 191.5,293.0 L191.5,304.5 Q191.5,313.5 200.5,313.5 L236.5,313.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M386.5,313.5 L425.8,313.5 Q434.8,313.5 434.8,322.5 L434.8,336.5 Q434.8,345.5 443.8,345.5 L483,345.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M541,314.5 L541.0,307.5 Q541,300.5 548.0,300.5 L703.0,300.5 Q712,300.5 712.0,291.5 L712.0,267.5 Q712,260.5 719.0,260.5 L726,260.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M599,345.5 L739,345.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M599,345.5 L607.0,345.5 Q615,345.5 615.0,353.5 L615.0,421.5 Q615,430.5 624.0,430.5 L734.5,430.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M612,250.5 L660.0,250.5 Q669,250.5 669.0,241.5 L669.0,175.0 Q669,166 678.0,166.0 L726,166" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M616,146.5 L662.0,146.5 Q671,146.5 671.0,137.5 L671.0,71.0 Q671,62 680.0,62.0 L726,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="177" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="93" y="202.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="93" dy="0">Lectura de la</tspan><tspan x="93" dy="19.2">plataforma</tspan></text><polygon points="311.5,147.5 413,207.5 311.5,267.5 210,207.5" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="311.5" y="192.5" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="311.5" dy="0">¿Está en la</tspan><tspan x="311.5" dy="19.2">caché y</tspan><tspan x="311.5" dy="19.2">vigente?</tspan></text><rect x="466" y="106.5" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="541" y="131.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="541" dy="0">Acierto: se</tspan><tspan x="541" dy="19.2">sirve el valor</tspan><tspan x="541" dy="19.2">guardado</tspan></text><rect x="470" y="210.5" width="142" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="541" y="235.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="541" dy="0">Fallo: se lee</tspan><tspan x="541" dy="19.2">de la base y</tspan><tspan x="541" dy="19.2">se guarda</tspan></text><rect x="39.5" y="262" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="93" y="288.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="93" dy="0">Escritura</tspan></text><rect x="236.5" y="291.5" width="150" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="311.5" y="317.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="311.5" dy="0">Cambia la base</tspan></text><polygon points="541,314.5 599,345.5 541,376.5 483,345.5" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="541" y="349.7" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="541" dy="0">Política</tspan></text><rect x="726" y="230" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="801" y="255.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="801" dy="0">Se espera a la</tspan><tspan x="801" dy="19.2">expiración</tspan></text><rect x="739" y="315" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="801" y="340.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="801" dy="0">Se borra la</tspan><tspan x="801" dy="19.2">clave</tspan></text><rect x="734.5" y="400" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="801" y="425.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="801" dy="0">Se actualiza</tspan><tspan x="801" dy="19.2">la clave</tspan></text><rect x="726" y="126" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="801" y="151" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="801" dy="0">Riesgo:</tspan><tspan x="801" dy="19.2">relleno con un</tspan><tspan x="801" dy="19.2">valor viejo</tspan></text><rect x="726" y="22" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="801" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="801" dy="0">Riesgo: valor</tspan><tspan x="801" dy="19.2">viejo hasta la</tspan><tspan x="801" dy="19.2">expiración</tspan></text><rect x="433" y="118.5" width="29" height="24" rx="4" fill="#ffffff"/><text x="447.5" y="134.4" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447.5" dy="0">sí</tspan></text><rect x="435" y="222.5" width="29" height="24" rx="4" fill="#ffffff"/><text x="449.5" y="238.4" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="449.5" dy="0">no</tspan></text><rect x="608" y="304.5" width="37" height="24" rx="4" fill="#ffffff"/><text x="626.5" y="320.4" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="626.5" dy="0">TTL</tspan></text><rect x="626" y="349.5" width="86" height="24" rx="4" fill="#ffffff"/><text x="669" y="365.4" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="669" dy="0">invalidar</tspan></text><rect x="636.2" y="384.5" width="77" height="42" rx="4" fill="#ffffff"/><text x="674.7" y="400.4" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="674.7" dy="0">escribir</tspan><tspan x="674.7" dy="17.92">también</tspan></text></svg>
