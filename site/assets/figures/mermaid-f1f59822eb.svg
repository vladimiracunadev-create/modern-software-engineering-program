<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 317 632" width="317" height="632" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Necesidad» … «Mantenimiento» y «Retiro»</title><desc id="d">Diagrama de flujo con 7 pasos. «Necesidad» lleva a «Requisitos y riesgos». «Requisitos y riesgos» lleva a «Construcción». «Construcción» lleva a «Verificación y validación». «Verificación y validación» lleva a «Operación». «Operación» lleva a «Mantenimiento». «Mantenimiento» lleva a «Requisitos y riesgos». «Operación» lleva a «Retiro».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="317" height="632" fill="#ffffff"/><path d="M178.7,66 L178.7,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M179,185 L179,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M179.8,287 L179.8,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M180.8,406 L180.8,464" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M181.4,508 L181.4,528.0 Q181.4,537 172.4,537.0 L118.0,537.0 Q109,537 109.0,546.0 L109,566" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M181.4,508 L181.4,528.0 Q181.4,537 190.4,537.0 L245.5,537.0 Q254.5,537 254.5,546.0 L254.5,566" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M38,588 L31.0,588.0 Q24,588 24.0,581.0 L24.0,163.5 Q24,154.5 33.0,154.5 L112.2,154.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="125.2" y="22" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="178.7" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="178.7" dy="0">Necesidad</tspan></text><rect x="112.2" y="124" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="178.7" y="149.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="178.7" dy="0">Requisitos y</tspan><tspan x="178.7" dy="19.2">riesgos</tspan></text><rect x="112.9" y="243" width="133" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="179.4" y="269.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="179.4" dy="0">Construcción</tspan></text><rect x="105.3" y="345" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="180.3" y="370.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="180.3" dy="0">Verificación y</tspan><tspan x="180.3" dy="19.2">validación</tspan></text><rect x="127.9" y="464" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="181.4" y="490.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="181.4" dy="0">Operación</tspan></text><rect x="38" y="566" width="142" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="109" y="592.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="109" dy="0">Mantenimiento</tspan></text><rect x="214" y="566" width="81" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="254.5" y="592.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="254.5" dy="0">Retiro</tspan></text></svg>
