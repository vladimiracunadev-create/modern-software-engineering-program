<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 604 726" width="604" height="726" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Módulo y batería de pruebas» … «Caso o aserción que falta» y «Documentar»</title><desc id="d">Diagrama de flujo con 11 pasos. «Módulo y batería de pruebas» lleva a «Mutantes por operador». «Mutantes por operador» lleva a «¿Falla alguna prueba?». «¿Falla alguna prueba?» lleva a «Mutante muerto» (sí). «¿Falla alguna prueba?» lleva a «Superviviente» (no). «Superviviente» lleva a «¿Equivalente?». «¿Equivalente?» lleva a «Caso o aserción que falta» (no). «¿Equivalente?» lleva a «Documentar» (sí). «Módulo y batería de pruebas» lleva a «Generador de entradas». «Generador de entradas» lleva a «Entrada que falla». «Entrada que falla» lleva a «Prueba de regresión mínima». «Caso o aserción que falta» lleva a «Módulo y batería de pruebas». «Prueba de regresión mínima» lleva a «Módulo y batería de pruebas».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="604" height="726" fill="#ffffff"/><path d="M316.6,83 L316.6,103.0 Q316.6,112 307.6,112.0 L242.1,112.0 Q233.1,112 233.1,121.0 L233.1,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M233.1,202 L233.1,222.0 Q233.1,231 224.1,231.0 L217.7,231.0 Q208.7,231 208.7,240.0 L208.7,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M208.7,346 L208.7,354.0 Q208.7,362 200.7,362.0 L122.0,362.0 Q113,362 113.0,371.0 L113,412.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M208.7,346 L20