<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 865 88" width="865" height="88" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «🎯 Hazard» … «📈 Assurance»</title><desc id="d">Diagrama de flujo con 5 pasos. «🎯 Hazard» lleva a «🧠 Requisito». «🧠 Requisito» lleva a «🛠️ Control». «🛠️ Control» lleva a «🔎 Verificación». «🔎 Verificación» lleva a «📈 Assurance».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="865" height="88" fill="#ffffff"/><path d="M127,44 L173,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M304,44 L350,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M463,44 L509,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M666,44 L712,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="22" width="105" height="44" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="74.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="74.5" dy="0">🎯 Hazard</tspan></text><rect x="173" y="22" width="131" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="238.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="238.5" dy="0">🧠 Requisito</tspan></text><rect x="350" y="22" width="113" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="406.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="406.5" dy="0">🛠️ Control</tspan></text><rect x="509" y="22" width="157" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="587.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="587.5" dy="0">🔎 Verificación</tspan></text><rect x="712" y="22" width="131" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="777.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="777.5" dy="0">📈 Assurance</tspan></text></svg>
