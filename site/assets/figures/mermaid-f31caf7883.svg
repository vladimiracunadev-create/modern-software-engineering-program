<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 814 166" width="814" height="166" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Editor e IDE» … «Confianza / extensiones»</title><desc id="d">Diagrama de flujo con 5 pasos. «Editor e IDE» lleva a «Modelo sintáctico / semántico». «Modelo sintáctico / semántico» lleva a «Language Server Protocol». «Language Server Protocol» lleva a «Workspace / configuración». «Workspace / configuración» lleva a «Confianza / extensiones». «Confianza / extensiones» lleva a «Editor e IDE» (fallo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="814" height="166" fill="#ffffff"/><path d="M120,104 L166,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M290,104 L336,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M434,104 L480,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M622,104 L668,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M730,73.5 L730.0,59.0 Q730,50 721.0,50.0 L80.0,50.0 Q71,50 71.0,59.0 L71,73.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="73.5" width="98" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="71" y="98.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="71" dy="0">Editor e</tspan><tspan x="71" dy="19.2">IDE</tspan></text><rect x="166" y="64" width="124" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="228" y="89" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="228" dy="0">Modelo</tspan><tspan x="228" dy="19.2">sintáctico</tspan><tspan x="228" dy="19.2">/ semántico</tspan></text><rect x="336" y="64" width="98" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="385" y="89" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="385" dy="0">Language</tspan><tspan x="385" dy="19.2">Server</tspan><tspan x="385" dy="19.2">Protocol</tspan></text><rect x="480" y="73.5" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="551" y="98.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="551" dy="0">Workspace /</tspan><tspan x="551" dy="19.2">configuración</tspan></text><rect x="668" y="73.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="730" y="98.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="730" dy="0">Confianza /</tspan><tspan x="730" dy="19.2">extensiones</tspan></text><rect x="337.5" y="22" width="126" height="24" rx="4" fill="#ffffff"/><text x="400.5" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="400.5" dy="0">fallo o cambio</tspan></text></svg>
