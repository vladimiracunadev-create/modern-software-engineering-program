<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 859 661" width="859" height="661" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Cliente llama a servicio» … «Efecto duplicado y amplificación» y «Reintento seguro»</title><desc id="d">Diagrama de flujo con 11 pasos. «Cliente llama a servicio» lleva a «Respuesta a tiempo». «Respuesta a tiempo» lleva a «Éxito conocido» (sí). «Respuesta a tiempo» lleva a «Tiempo agotado: tres historias» (no). «Tiempo agotado: tres historias» lleva a «Petición perdida». «Tiempo agotado: tres historias» lleva a «Ejecutada, respuesta perdida». «Tiempo agotado: tres historias» lleva a «Ejecutada, respuesta lenta». «Tiempo agotado: tres historias» lleva a «Reintento». «Reintento» lleva a «Efecto duplicado y amplificación» (sin cuidado). «Reintento» lleva a «Reintento seguro» (con clave, presupuesto y jitter). «Tiempo agotado: tres historias» lleva a «Detector de fallos».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="859" height="661" fill="#ffffff"/><path d="M322.2,83 L322.2,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M322.2,227 L322.2,235.0 Q322.2,243 314.2,243.0 L265.7,243.0 Q256.7,243 256.7,252.0 L256.7,293.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M322.2,227 L322.2,235.0 Q322.2,243 330.2,243.0 L436.2,243.0 Q445.2,243 445.2,252.0 L445.2,285" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M445.2,346 L445.2,375.0 Q445.2,384 436.2,384.0 L115.0,384.0 Q106,384 106.0,393.0 L106,422" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M445.2,346 L445.2,366.0 Q445.2,375 436.2,375.0 L290.5,375.0 Q281.5,375 281.5,384.0 L281.5,404" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M448.8,346 L448.8,413.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M445.2,346 L445.2,375.0 Q445.2,384 454.2,384.0 L610.5,384.0 Q619.5,384 619.5,393.0 L619.5,422" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M619.5,466 L619.5,474.0 Q619.5,482 611.5,482.0 L519.4,482.0 Q510.4,482 510.4,491.0 L510.4,578" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M619.5,466 L619.5,474.0 Q619.5,482 627.5,482.0 L703.4,482.0 Q712.4,482 712.4,491.0 L712.4,586.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M445.2,346 L445.2,370.8 Q445.2,379.8 454.2,379.8 L760.0,379.8 Q769,379.8 769.0,388.8 L769,413.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="242.7" y="22" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="322.2" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="322.2" dy="0">Cliente llama a</tspan><tspan x="322.2" dy="19.2">servicio</tspan></text><polygon points="322.2,141 418.2,184 322.2,227 226.2,184" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="322.2" y="178.6" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="322.2" dy="0">Respuesta a</tspan><tspan x="322.2" dy="19.2">tiempo</tspan></text><rect x="181.7" y="293.5" width="150" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="256.7" y="319.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="256.7" dy="0">Éxito conocido</tspan></text><rect x="365.7" y="285" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="445.2" y="310.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="445.2" dy="0">Tiempo agotado:</tspan><tspan x="445.2" dy="19.2">tres historias</tspan></text><rect x="22" y="422" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="448.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Petición perdida</tspan></text><rect x="224" y="404" width="115" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="281.5" y="429" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="281.5" dy="0">Ejecutada,</tspan><tspan x="281.5" dy="19.2">respuesta</tspan><tspan x="281.5" dy="19.2">perdida</tspan></text><rect x="373" y="413.5" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="452.5" y="438.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="452.5" dy="0">Ejecutada,</tspan><tspan x="452.5" dy="19.2">respuesta lenta</tspan></text><rect x="566" y="422" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="619.5" y="448.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="619.5" dy="0">Reintento</tspan></text><rect x="426.4" y="578" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="510.4" y="603.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="510.4" dy="0">Efecto duplicado</tspan><tspan x="510.4" dy="19.2">y amplificación</tspan></text><rect x="628.4" y="586.5" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="712.4" y="612.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="712.4" dy="0">Reintento seguro</tspan></text><rect x="707" y="413.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="769" y="438.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="769" dy="0">Detector de</tspan><tspan x="769" dy="19.2">fallos</tspan></text><rect x="262.7" y="256.2" width="29" height="24" rx="4" fill="#ffffff"/><text x="277.2" y="272.1" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="277.2" dy="0">sí</tspan></text><rect x="451.2" y="252" width="29" height="24" rx="4" fill="#ffffff"/><text x="465.7" y="267.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="465.7" dy="0">no</tspan></text><rect x="516.4" y="518" width="102" height="24" rx="4" fill="#ffffff"/><text x="567.4" y="533.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="567.4" dy="0">sin cuidado</tspan></text><rect x="718.4" y="504.2" width="118" height="60" rx="4" fill="#ffffff"/><text x="777.4" y="520.1" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777.4" dy="0">con clave,</tspan><tspan x="777.4" dy="17.92">presupuesto y</tspan><tspan x="777.4" dy="17.92">jitter</tspan></text></svg>
