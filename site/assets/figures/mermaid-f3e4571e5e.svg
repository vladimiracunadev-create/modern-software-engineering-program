<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 936 105" width="936" height="105" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «🎯 Modelo de ejecución» … «📈 Recuperación»</title><desc id="d">Diagrama de flujo con 5 pasos. «🎯 Modelo de ejecución» lleva a «🧠 Aislamiento». «🧠 Aislamiento» lleva a «🛠️ Rendimiento». «🛠️ Rendimiento» lleva a «🔎 Observación». «🔎 Observación» lleva a «📈 Recuperación».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="936" height="105" fill="#ffffff"/><path d="M153,52.5 L199,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M347,52.5 L393,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M541,52.5 L587,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M735,52.5 L781,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="22" width="131" height="61" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="87.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="87.5" dy="0">🎯 Modelo de</tspan><tspan x="87.5" dy="19.2">ejecución</tspan></text><rect x="199" y="30.5" width="148" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="273" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="273" dy="0">🧠 Aislamiento</tspan></text><rect x="393" y="30.5" width="148" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="467" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="467" dy="0">🛠️ Rendimiento</tspan></text><rect x="587" y="30.5" width="148" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="661" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="661" dy="0">🔎 Observación</tspan></text><rect x="781" y="22" width="133" height="61" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="847.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="847.5" dy="0">📈</tspan><tspan x="847.5" dy="19.2">Recuperación</tspan></text></svg>
