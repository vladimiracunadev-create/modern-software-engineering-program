<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 359 1003" width="359" height="1003" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Resultado erróneo» … «Repetir la ejecución: ¿idempotente?»</title><desc id="d">Diagrama de flujo con 9 pasos. «Resultado erróneo» lleva a «Reproducir con réplica pequeña». «Reproducir con réplica pequeña» lleva a «Acotar la capa: primera tabla que difiere». «Acotar la capa: primera tabla que difiere» lleva a «Conciliar filas e importes entre capas». «Conciliar filas e importes entre capas» lleva a «¿Una causa o varias?». «¿Una causa o varias?» lleva a «Corregir una y medir» (varias). «Corregir una y medir» lleva a «Conciliar filas e importes entre capas». «¿Una causa o varias?» lleva a «Corregir y verificar» (una). «Corregir y verificar» lleva a «Escribir la comprobación». «Escribir la comprobación» lleva a «Repetir la ejecución: ¿idempotente?».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="359" height="1003" fill="#ffffff"/><path d="M147,66 L147,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M150.7,185 L150.7,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M154.4,323 L154.4,346.1 Q154.4,352 160.4,352.0 L160.4,352.0 Q166.3,352 166.3,357.9 L166.3,381" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M166.3,461 L166.3,481.2 Q166.3,490 175.1,490.0 L175.1,490.0 Q183.9,490 183.9,498.8 L183.9,519" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M183.9,605 L183.9,613.0 Q183.9,621 175.9,621.0 L122.0,621.0 Q113,621 113.0,630.0 L113,663" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M183.9,605 L183.9,613.0 Q183.9,621 191.9,621.0 L270.5,621.0 Q279.5,621 279.5,630.0 L279.5,663" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M279.5,724 L279.5,745.4 Q279.5,753 271.9,753.0 L271.9,753.0 Q264.2,753 264.2,760.6 L264.2,782" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M264.2,843 L264.2,866.8 Q264.2,872 258.9,872.0 L258.9,872.0 Q253.7,872 253.7,877.2 L253.7,901" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M38,693.5 L31.0,693.5 Q24,693.5 24.0,686.5 L24.0,430.0 Q24,421 33.0,421.0 L78.3,421" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="59" y="22" width="176" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="147" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="147" dy="0">Resultado erróneo</tspan></text><rect x="67.5" y="124" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="147" y="149.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="147" dy="0">Reproducir con</tspan><tspan x="147" dy="19.2">réplica pequeña</tspan></text><rect x="66.4" y="243" width="176" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="154.4" y="268" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="154.4" dy="0">Acotar la capa:</tspan><tspan x="154.4" dy="19.2">primera tabla que</tspan><tspan x="154.4" dy="19.2">difiere</tspan></text><rect x="78.3" y="381" width="176" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="166.3" y="406" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="166.3" dy="0">Conciliar filas e</tspan><tspan x="166.3" dy="19.2">importes entre</tspan><tspan x="166.3" dy="19.2">capas</tspan></text><polygon points="183.9,519 287.9,562 183.9,605 79.9,562" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="183.9" y="556.6" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="183.9" dy="0">¿Una causa o</tspan><tspan x="183.9" dy="19.2">varias?</tspan></text><rect x="38" y="663" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="113" y="688.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="113" dy="0">Corregir una y</tspan><tspan x="113" dy="19.2">medir</tspan></text><rect x="222" y="663" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="279.5" y="688.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="279.5" dy="0">Corregir y</tspan><tspan x="279.5" dy="19.2">verificar</tspan></text><rect x="197.7" y="782" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="264.2" y="807.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="264.2" dy="0">Escribir la</tspan><tspan x="264.2" dy="19.2">comprobación</tspan></text><rect x="182.7" y="901" width="142" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="253.7" y="926" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="253.7" dy="0">Repetir la</tspan><tspan x="253.7" dy="19.2">ejecución:</tspan><tspan x="253.7" dy="19.2">¿idempotente?</tspan></text><rect x="119" y="630" width="61" height="24" rx="4" fill="#ffffff"/><text x="149.5" y="645.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="149.5" dy="0">varias</tspan></text><rect x="285.5" y="630" width="37" height="24" rx="4" fill="#ffffff"/><text x="304" y="645.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"