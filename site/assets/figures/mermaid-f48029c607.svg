<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 821 464" width="821" height="464" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Periodo de despertar», «Corriente de reposo», «Ancho y redondeo», «Frecuencia de escritura» y «Política de reparto» … «Presupuesto»</title><desc id="d">Diagrama de flujo con 12 pasos. «Periodo de despertar» lleva a «Carga por ciclo». «Corriente de reposo» lleva a «Carga por ciclo». «Carga por ciclo» lleva a «Corriente media». «Corriente media» lleva a «Vida de la pila». «Frecuencia de escritura» lleva a «Borrados por sector». «Política de reparto» lleva a «Borrados por sector». «Borrados por sector» lleva a «Vida de la flash». «Ancho y redondeo» lleva a «Error del filtro». «Vida de la pila» lleva a «Presupuesto». «Vida de la flash» lleva a «Presupuesto». «Error del filtro» lleva a «Presupuesto».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="821" height="464" fill="#ffffff"/><path d="M141.5,52.5 L159.8,52.5 Q168.8,52.5 168.8,61.5 L168.8,138.0 Q168.8,147 177.8,147.0 L196,147" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M137.5,137.5 L162.1,137.5 Q166.8,137.5 166.8,142.2 L166.8,142.2 Q166.8,147 171.6,147.0 L196,147" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M303,147 L321.0,147.0 Q330,147 330.0,156.0 L330.0,180.5 Q330,189.5 339.0,189.5 L357,189.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M464,189.5 L514,189.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M141.5,317