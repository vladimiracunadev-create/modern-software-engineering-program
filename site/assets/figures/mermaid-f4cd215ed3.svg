<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 562 665" width="562" height="665" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Requisitos del cliente» … «Decisión revisable»</title><desc id="d">Diagrama de flujo con 8 pasos. «Requisitos del cliente» lleva a «Opciones de construcción». «Opciones de construcción» lleva a «Criterios y pesos». «Criterios y pesos» lleva a «Puntuación». «Puntuación» lleva a «Sensibilidad». «Opciones de construcción» lleva a «Frontera entre capas». «Opciones de construcción» lleva a «Capacidades comunes». «Sensibilidad» lleva a «Decisión revisable». «Frontera entre capas» lleva a «Decisión revisable». «Capacidades comunes» lleva a «Decisión revisable». «Decisión revisable» lleva a «Requisitos del cliente» (medición o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="562" height="665" fill="#ffffff"/><path d="M307.2,83 L307.2,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M307.2,202 L307.2,226.2 Q307.2,235.2 298.2,235.2 L119.0,235.2 Q110,235.2 110.0,244.2 L110,268.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M110,312.5 L110.0,336.8 Q110,345.8 119.0,345.8 L144.3,345.8 Q153.3,345.8 153.3,354.8 L153.3,379" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M153.3,423 L153.3,443.0 Q153.3,452 162.3,452.0 L182.3,452.0 Q191.3,452 191.3,461.0 L191.3,481" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M307.1,202 L307.1,260" fill="none" stroke="#32505f" stroke-width="1.8" m