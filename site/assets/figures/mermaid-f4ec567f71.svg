<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 578 262" width="578" height="262" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Cartera y presupuesto» … «Revisión con nueva información»</title><desc id="d">Diagrama de flujo con 5 pasos. «Cartera y presupuesto» lleva a «Retorno esperado y arrepentimiento». «Retorno esperado y arrepentimiento» lleva a «Opciones y etapas». «Opciones y etapas» lleva a «Dependencias y secuencia». «Dependencias y secuencia» lleva a «Revisión con nueva información». «Revisión con nueva información» lleva a «Cartera y presupuesto» (llega evidencia).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="578" height="262" fill="#ffffff"/><path d="M146,62 L192,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M360,62 L423.5,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M481,92.5 L481,169.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M406,200 L342.5,200" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M209.5,200 L93.0,200.0 Q84,200 84.0,191.0 L84,92.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="31.5" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="84" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="84" dy="0">Cartera y</tspan><tspan x="84" dy="19.2">presupuesto</tspan></text><rect x="192" y="22" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="276" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="276" dy="0">Retorno esperado</tspan><tspan x="276" dy="19.2">y</tspan><tspan x="276" dy="19.2">arrepentimiento</tspan></text><rect x="423.5" y="31.5" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="481" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="481" dy="0">Opciones y</tspan><tspan x="481" dy="19.2">etapas</tspan></text><rect x="406" y="169.5" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="481" y="194.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="481" dy="0">Dependencias y</tspan><tspan x="481" dy="19.2">secuencia</tspan></text><rect x="209.5" y="160" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="276" y="185" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="276" dy="0">Revisión con</tspan><tspan x="276" dy="19.2">nueva</tspan><tspan x="276" dy="19.2">información</tspan></text><rect x="103.8" y="154" width="86" height="42" rx="4" fill="#ffffff"/><text x="146.8" y="169.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="146.8" dy="0">llega</tspan><tspan x="146.8" dy="17.92">evidencia</tspan></text></svg>
