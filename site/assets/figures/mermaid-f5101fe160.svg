<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 424 959" width="424" height="959" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Problema observado» … «Retirar o ajustar» y «Costumbre del equipo»</title><desc id="d">Diagrama de flujo con 9 pasos. «Problema observado» lleva a «Propuesta escrita con contexto». «Propuesta escrita con contexto» lleva a «Consulta previa a quienes conocen el límite». «Consulta previa a quienes conocen el límite» lleva a «Siembra en personas con vínculos». «Siembra en personas con vínculos» lleva a «Práctica visible y pequeña». «Práctica visible y pequeña» lleva a «Criterios de decisión delegados». «Criterios de decisión delegados» lleva a «Revisión con evidencia». «Revisión con evidencia» lleva a «Retirar o ajustar» (no funcionó). «Revisión con evidencia» lleva a «Costumbre del equipo» (funcionó). «Retirar o ajustar» lleva a «Problema observado».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="424" height="959" fill="#ffffff"/><path d="M219.7,66 L219.7,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M219.9,185 L219.9,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M220.2,323 L220.2,381" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M220.6,461 L220.6,519" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M221.2,580 L221.2,638" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M221.9,699 L221.9,757" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M222.2,818 L222.2,826.0 Q222.2,834 214.2,834.0 L135.0,834.0 Q126,834 126.0,843.0 L126,884.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M222.2,818 L222.2,826.0 Q222.2,834 230.2,834.0 L310.0,834.0 Q319,834 319.0,843.0 L319,876" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M38,906.5 L31.0,906.5 Q24,906.5 24.0,899.5 L24.0,53.0 Q24,44 33.0,44.0 L127.2,44" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="127.2" y="22" width="185" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="219.7" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="219.7" dy="0">Problema observado</tspan></text><rect x="131.7" y="124" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="219.7" y="149.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="219.7" dy="0">Propuesta escrita</tspan><tspan x="219.7" dy="19.2">con contexto</tspan></text><rect x="127.5" y="243" width="185" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="220" y="268" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="220" dy="0">Consulta previa a</tspan><tspan x="220" dy="19.2">quienes conocen el</tspan><tspan x="220" dy="19.2">límite</tspan></text><rect x="153.9" y="381" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="220.4" y="406" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="220.4" dy="0">Siembra en</tspan><tspan x="220.4" dy="19.2">personas con</tspan><tspan x="220.4" dy="19.2">vínculos</tspan></text><rect x="128.4" y="519" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="220.9" y="544.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="220.9" dy="0">Práctica visible y</tspan><tspan x="220.9" dy="19.2">pequeña</tspan></text><rect x="129.1" y="638" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="221.6" y="663.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="221.6" dy="0">Criterios de</tspan><tspan x="221.6" dy="19.2">decisión delegados</tspan></text><rect x="155.7" y="757" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="222.2" y="782.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="222.2" dy="0">Revisión con</tspan><tspan x="222.2" dy="19.2">evidencia</tspan></text><rect x="38" y="884.5" width="176" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="126" y="910.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="126" dy="0">Retirar o ajustar</tspan></text><rect x="248" y="876" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="319" y="901.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="319" dy="0">Costumbre del</tspan><tspan x="319" dy="19.2">equipo</tspan></text><rect x="132" y="847.2" width="102" height="24" rx="4" fill="#ffffff"/><text x="183" y="863.1" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="183" dy="0">no funcionó</tspan></text><rect x="325" y="843" width="77" height="24" rx="4" fill="#ffffff"/><text x="363.5" y="858.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="363.5" dy="0">funcionó</tspan></text></svg>
