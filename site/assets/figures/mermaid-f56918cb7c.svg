<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 774 300" width="774" height="300" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Versión nueva» … «Retirada de lo viejo»</title><desc id="d">Diagrama de flujo con 7 pasos. «Versión nueva» lleva a «Canal de distribución». «Canal de distribución» lleva a «Adopción en el tiempo». «Adopción en el tiempo» lleva a «Versiones coexistentes». «Versiones coexistentes» lleva a «Compatibilidad del servidor». «Compatibilidad del servidor» lleva a «Retirada de lo viejo». «Retirada de lo viejo» lleva a «Versiones coexistentes» (fracción restante). «Versión nueva» lleva a «Integridad del paquete». «Integridad del paquete» lleva a «Canal de distribución».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="774" height="300" fill="#ffffff"/><path d="M93,46.5 L93.0,33.0 Q93,24 102.0,24.0 L474.0,24.0 Q481,24 481.0,31.0 L481,38" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M547.5,68.5 L602,68.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M677,99 L677,157" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M610.5,187.5 L556,187.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M406,187.5 L360,187.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M164,68.5 L210,68.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M360,68.5 L414.5,68.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M285,218 L285.0,225.0 Q285,232 292.0,232.0 L670.0,232.0 Q677,232 677.0,225.0 L677,218" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="46.5" width="142" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="93" y="72.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="93" dy="0">Versión nueva</tspan></text><rect x="414.5" y="38" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="481" y="63.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="481" dy="0">Canal de</tspan><tspan x="481" dy="19.2">distribución</tspan></text><rect x="602" y="38" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="677" y="63.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="677" dy="0">Adopción en el</tspan><tspan x="677" dy="19.2">tiempo</tspan></text><rect x="610.5" y="157" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="677" y="182.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="677" dy="0">Versiones</tspan><tspan x="677" dy="19.2">coexistentes</tspan></text><rect x="406" y="157" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="481" y="182.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="481" dy="0">Compatibilidad</tspan><tspan x="481" dy="19.2">del servidor</tspan></text><rect x="210" y="157" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="285" y="182.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="285" dy="0">Retirada de lo</tspan><tspan x="285" dy="19.2">viejo</tspan></text><rect x="210" y="38" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="285" y="63.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="285" dy="0">Integridad del</tspan><tspan x="285" dy="19.2">paquete</tspan></text><rect x="442.5" y="236" width="77" height="42" rx="4" fill="#ffffff"/><text x="481" y="251.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="481" dy="0">fracción</tspan><tspan x="481" dy="17.92">restante</tspan></text></svg>
