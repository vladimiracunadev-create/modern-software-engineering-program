<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 457" width="800" height="457" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Mantenimiento correctivo, adaptativo y perfectivo» … «Proyecto: migración incremental reversible»</title><desc id="d">Diagrama de flujo con 12 pasos. «Mantenimiento correctivo, adaptativo y perfectivo» lleva a «Arqueología de código». «Arqueología de código» lleva a «Pruebas de caracterización y seams». «Pruebas de caracterización y seams» lleva a «Dependencias obsoletas». «Dependencias obsoletas» lleva a «Strangler, branch by abstraction y anticorruption». «Strangler, branch by abstraction y anticorruption» lleva a «Migraciones de runtime, lenguaje y framework». «Migraciones de runtime, lenguaje y framework» lleva a «Migraciones de datos sin interrupción». «Migraciones de datos sin interrupción» lleva a «Compatibilidad, coexistencia y doble escritura». «Compatibilidad, coexistencia y doble escritura» lleva a «Retiro, archivado y disposición». «Retiro, archivado y disposición» lleva a «Economía de reescribir frente a evolucionar». «Economía de reescribir frente a evolucionar» lleva a «Taller: estabilizar antes de modernizar». «Taller: estabilizar antes de modernizar» lleva a «Proyecto: migración incremental reversible». «Proyecto: migración incremental reversible» lleva a «Mantenimiento correctivo, adaptativo y perfectivo» (incidente o hallazgo).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="800" height="457" fill="#ffffff"/><path d="M172.5,71.5 L227,71.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M377,71.5 L423,71.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M582,71.5 L636.5,71.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M703,102 L703,179" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M628,228.5 L577.5,228.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M427.5,228.5 L377,228.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M227,228.5 L181,228.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M101.5,268.5 L101.5,345.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M163.5,385.5 L240,385.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M364,385.5 L440.5,385.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M564.5,385.5 L641,385.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M703,336 L703.0,301.0 Q703,292 694.0,292.0 L204.0,292.0 Q195,292 195.0,283.0 L195.0,144.0 Q195,135 186.0,135.0 L108.5,135.0 Q101.5,135 101.5,128.0 L101.5,121" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="30.5" y="22" width="142" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101.5" y="46.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101.5" dy="0">Mantenimiento</tspan><tspan x="101.5" dy="19.2">correctivo,</tspan><tspan x="101.5" dy="19.2">adaptativo y</tspan><tspan x="101.5" dy="19.2">perfectivo</tspan></text><rect x="227" y="41" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="302" y="66.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="302" dy="0">Arqueología de</tspan><tspan x="302" dy="19.2">código</tspan></text><rect x="423" y="31.5" width="159" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="502.5" y="56.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="502.5" dy="0">Pruebas de</tspan><tspan x="502.5" dy="19.2">caracterización</tspan><tspan x="502.5" dy="19.2">y seams</tspan></text><rect x="636.5" y="41" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="703" y="66.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="703" dy="0">Dependencias</tspan><tspan x="703" dy="19.2">obsoletas</tspan></text><rect x="628" y="179" width="150" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="703" y="203.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="703" dy="0">Strangler,</tspan><tspan x="703" dy="19.2">branch by</tspan><tspan x="703" dy="19.2">abstraction y</tspan><tspan x="703" dy="19.2">anticorruption</tspan></text><rect x="427.5" y="179" width="150" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="502.5" y="203.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="502.5" dy="0">Migraciones de</tspan><tspan x="502.5" dy="19.2">runtime,</tspan><tspan x="502.5" dy="19.2">lenguaje y</tspan><tspan x="502.5" dy="19.2">framework</tspan></text><rect x="227" y="188.5" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="302" y="213.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="302" dy="0">Migraciones de</tspan><tspan x="302" dy="19.2">datos sin</tspan><tspan x="302" dy="19.2">interrupción</tspan></text><rect x="22" y="188.5" width="159" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101.5" y="213.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101.5" dy="0">Compatibilidad,</tspan><tspan x="101.5" dy="19.2">coexistencia y</tspan><tspan x="101.5" dy="19.2">doble escritura</tspan></text><rect x="39.5" y="345.5" width="124" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101.5" y="370.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101.5" dy="0">Retiro,</tspan><tspan x="101.5" dy="19.2">archivado y</tspan><tspan x="101.5" dy="19.2">disposición</tspan></text><rect x="240" y="336" width="124" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="302" y="360.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="302" dy="0">Economía de</tspan><tspan x="302" dy="19.2">reescribir</tspan><tspan x="302" dy="19.2">frente a</tspan><tspan x="302" dy="19.2">evolucionar</tspan></text><rect x="440.5" y="336" width="124" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="502.5" y="360.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="502.5" dy="0">Taller:</tspan><tspan x="502.5" dy="19.2">estabilizar</tspan><tspan x="502.5" dy="19.2">antes de</tspan><tspan x="502.5" dy="19.2">modernizar</tspan></text><rect x="641" y="336" width="124" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="703" y="360.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="703" dy="0">Proyecto:</tspan><tspan x="703" dy="19.2">migración</tspan><tspan x="703" dy="19.2">incremental</tspan><tspan x="703" dy="19.2">reversible</tspan></text><rect x="201" y="129.7" width="102" height="42" rx="4" fill="#ffffff"/><text x="252" y="145.6" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="252" dy="0">incidente o</tspan><tspan x="252" dy="17.92">hallazgo</tspan></text></svg>
