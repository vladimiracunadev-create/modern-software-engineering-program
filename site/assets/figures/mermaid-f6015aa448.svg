<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 739 599" width="739" height="599" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Registro de atención» … «Conjunto para estudio»</title><desc id="d">Diagrama de flujo con 11 pasos. «Registro de atención» lleva a «Minimizar campos». «Minimizar campos» lleva a «Separar identificadores». «Separar identificadores» lleva a «Generalizar cuasi-identificadores». «Generalizar cuasi-identificadores» lleva a «Conjunto para estudio». «Registro de atención» lleva a «Identidad del paciente». «Identidad del paciente» lleva a «Revisión humana» (coincidencia dudosa). «Registro de atención» lleva a «Señales vitales». «Señales vitales» lleva a «Umbral de alarma». «Umbral de alarma» lleva a «Persona que atiende». «Registro de atención» lleva a «Registro de accesos».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="739" height="599" fill="#ffffff"/><path d="M383.9,83 L383.9,107.2 Q383.9,116.2 374.9,116.2 L115.0,116.2 Q106,116.2 106.0,125.2 L106,149.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M106,193.5 L106.0,226.8 Q106,235.8 115.0,235.8 L119.0,235.8 Q128,235.8 128.0,244.8 L128,278" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M128,339 L128.0,359.0 Q128,368 137.0,368.0 L159.1,368.0 Q168.1,368 168.1,377.0 L168.1,397" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M168.1,458 L168.1,478.0 Q168.1,487 177.1,487.0 L184.7,487.0 Q193.7,487 193.7,496.0 L193.7,516" fill="none" stroke="#32505f" stroke-width="1.8" mar