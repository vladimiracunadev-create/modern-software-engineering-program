<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 358" width="680" height="358" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Necesidad de la persona usuaria» … «Evidencia: sintética, de laboratorio o de campo»</title><desc id="d">Diagrama de flujo con 6 pasos. «Necesidad de la persona usuaria» lleva a «Atributo de calidad». «Atributo de calidad» lleva a «Escenario: fuente, estímulo, artefacto, entorno, respuesta, medida». «Escenario: fuente, estímulo, artefacto, entorno, respuesta, medida» lleva a «Indicador: estadístico, ventana, alcance». «Indicador: estadístico, ventana, alcance» lleva a «Objetivo: umbral y margen». «Objetivo: umbral y margen» lleva a «Evidencia: sintética, de laboratorio o de campo». «Evidencia: sintética, de laboratorio o de campo» lleva a «Escenario: fuente, estímulo, artefacto, entorno, respuesta, medida» (el resultado contradice la queja). «Evidencia: sintética, de laboratorio o de campo» lleva a «Atributo de calidad» (los atributos chocan).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="680" height="358" fill="#ffffff"/><path d="M225.5,100.5 L298,100.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M422,100.5 L516.5,100.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M574,179 L574,246.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M490,286.5 L444,286.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M276,286.5 L230,286.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M146,237 L146.0,202.0 Q146,193 155.0,193.0 L567.0,193.0 Q574,193 574.0,186.0 L574,179" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><path d="M230,286.5 L237.0,286.5 Q244,286.5 244.0,279.5 L244.0,154.0 Q244,145 253.0,145.0 L353.0,145.0 Q360,145 360.0,138.0 L360,131" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="66.5" y="70" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="146" y="95.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="146" dy="0">Necesidad de la</tspan><tspan x="146" dy="19.2">persona usuaria</tspan></text><rect x="298" y="70" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="360" y="95.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="360" dy="0">Atributo de</tspan><tspan x="360" dy="19.2">calidad</tspan></text><rect x="516.5" y="22" width="115" height="157" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="574" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="574" dy="0">Escenario:</tspan><tspan x="574" dy="19.2">fuente,</tspan><tspan x="574" dy="19.2">estímulo,</tspan><tspan x="574" dy="19.2">artefacto,</tspan><tspan x="574" dy="19.2">entorno,</tspan><tspan x="574" dy="19.2">respuesta,</tspan><tspan x="574" dy="19.2">medida</tspan></text><rect x="490" y="246.5" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="574" y="271.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="574" dy="0">Indicador:</tspan><tspan x="574" dy="19.2">estadístico,</tspan><tspan x="574" dy="19.2">ventana, alcance</tspan></text><rect x="276" y="256" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="360" y="281.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="360" dy="0">Objetivo: umbral</tspan><tspan x="360" dy="19.2">y margen</tspan></text><rect x="62" y="237" width="168" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="146" y="261.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="146" dy="0">Evidencia:</tspan><tspan x="146" dy="19.2">sintética, de</tspan><tspan x="146" dy="19.2">laboratorio o de</tspan><tspan x="146" dy="19.2">campo</tspan></text><rect x="22" y="171.8" width="118" height="60" rx="4" fill="#ffffff"/><text x="81" y="187.7" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="81" dy="0">el resultado</tspan><tspan x="81" dy="17.92">contradice la</tspan><tspan x="81" dy="17.92">queja</tspan></text><rect x="250" y="194.8" width="118" height="42" rx="4" fill="#ffffff"/><text x="309" y="210.7" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="309" dy="0">los atributos</tspan><tspan x="309" dy="17.92">chocan</tspan></text></svg>
