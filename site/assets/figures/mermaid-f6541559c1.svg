<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 668" width="384" height="668" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Entrada del analizador local de eventos» … «Microarquitectura y hardware»</title><desc id="d">Diagrama de flujo con 7 pasos. «Entrada del analizador local de eventos» lleva a «Lenguaje y bibliotecas». «Lenguaje y bibliotecas» lleva a «Runtime». «Runtime» lleva a «Sistema operativo». «Sistema operativo» lleva a «ISA». «ISA» lleva a «Microarquitectura y hardware». «Microarquitectura y hardware» lleva a «Sistema operativo». «Sistema operativo» lleva a «Archivo y salida».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="384" height="668" fill="#ffffff"/><path d="M245.6,102 L245.6,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M245.6,221 L245.6,243.7 Q245.6,250 239.3,250.0 L239.3,250.0 Q233,250 233.0,256.3 L233,279" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M233,323 L233.0,343.0 Q233,352 224.0,352.0 L222.4,352.0 Q213.4,352 213.4,361.0 L213.4,381" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M213.4,425 L213.4,445.0 Q213.4,454 204.4,454.0 L130.7,454.0 Q121.7,454 121.7,463.0 L121.7,483" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M123.8,527 L123.8,585" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M213.4,425 L213.4,445.0 Q213.4,454 222.4,454.0 L268.7,454.0 Q277.7,454 277.7,463.0 L277.7,483" fill="none" stroke="#32505f" stroke-width="1.