<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 849 264" width="849" height="264" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Datos del cliente» … «Decisión revisable»</title><desc id="d">Diagrama de flujo con 7 pasos. «Datos del cliente» lleva a «Dónde vive cada dato». «Dónde vive cada dato» lleva a «Garantía de escritura». «Garantía de escritura» lleva a «Coste por transacción». «Dónde vive cada dato» lleva a «Dos copias». «Dos copias» lleva a «Política de fusión». «Coste por transacción» lleva a «Decisión revisable». «Política de fusión» lleva a «Decisión revisable». «Decisión revisable» lleva a «Datos del cliente» (medición o fallo).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="849" height="264" fill="#ffffff"/><path d="M129,162 L175,162" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M334,162 L348.0,162.0 Q357,162 357.0,153.0 L357.0,121.5 Q357,112.5 366.0,112.5 L380,112.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M504,112.5 L550,112.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M334,162 L350.2,162.0 Q359.2,162 359.2,171.0 L359.2,202.5 Q359.2,211.5 368.2,211.5 L384.5,211.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M499.5,211.5 L550,211.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M674,112.5 L688.0,112.5 Q697,112.5 697.0,121.5 L697.0,153.0 Q697,162 706.0,162.0 L720,162" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M674,211.5 L688.0,211.5 Q697,211.5 697.0,202.5 L697.0,171.0 Q697,162 706.0,162.0 L720,162" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M773.5,131.5 L773.5,77.0 Q773.5,68 764.5,68.0 L84.5,68.0 Q75.5,68 75.5,77.0 L75.5,131.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="131.5" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="75.5" y="156.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="75.5" dy="0">Datos del</tspan><tspan x="75.5" dy="19.2">cliente</tspan></text><rect x="175" y="131.5" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="254.5" y="156.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="254.5" dy="0">Dónde vive cada</tspan><tspan x="254.5" dy="19.2">dato</tspan></text><rect x="380" y="82" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="442" y="107.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="442" dy="0">Garantía de</tspan><tspan x="442" dy="19.2">escritura</tspan></text><rect x="550" y="82" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="612" y="107.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="612" dy="0">Coste por</tspan><tspan x="612" dy="19.2">transacción</tspan></text><rect x="384.5" y="189.5" width="115" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="442" y="215.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="442" dy="0">Dos copias</tspan></text><rect x="550" y="181" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="612" y="206.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="612" dy="0">Política de</tspan><tspan x="612" dy="19.2">fusión</tspan></text><rect x="720" y="131.5" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="773.5" y="156.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="773.5" dy="0">Decisión</tspan><tspan x="773.5" dy="19.2">revisable</tspan></text><rect x="377.5" y="22" width="94" height="42" rx="4" fill="#ffffff"/><text x="424.5" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="424.5" dy="0">medición o</tspan><tspan x="424.5" dy="17.92">fallo</tspan></text></svg>
