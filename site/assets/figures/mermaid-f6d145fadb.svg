<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 617 1267" width="617" height="1267" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Petición» … «Push, PR y merge: decisiones aparte»</title><desc id="d">Diagrama de flujo con 13 pasos. «Petición» lleva a «¿Autoriza un cambio?». «¿Autoriza un cambio?» lleva a «Solo lectura» (no: explicar o investigar). «¿Autoriza un cambio?» lleva a «¿Cambio pequeño y claro?» (sí). «¿Cambio pequeño y claro?» lleva a «Cambio sin documento persistente» (sí). «¿Cambio pequeño y claro?» lleva a «Documento de tarea antes del código» (no: trabajo sustancial). «Documento de tarea antes del código» lleva a «ROJO: una prueba por regla». «ROJO: una prueba por regla» lleva a «VERDE: código mínimo». «VERDE: código mínimo» lleva a «REFACTOR». «REFACTOR» lleva a «Commit de unas 400 líneas». «Commit de unas 400 líneas» lleva a «¿Más tareas?». «¿Más tareas?» lleva a «ROJO: una prueba por regla» (sí). «¿Más tareas?» lleva a «Push, PR y merge: decisiones aparte» (no). «Documento de tarea antes del código» lleva a «Siguiente paso anotado para retomar».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="617" height="1267" fill="#ffffff"/><path d="M251.3,66 L251.3,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M251.3,210 L251.3,218.0 Q251.3,226 243.3,226.0 L163.0,226.0 Q154,226 154.0,235.0 L154,307" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M251.3,210 L251.3,218.0 Q251.3,226 259.3,226.0 L389.0,226.0 Q398,226 398.0,235.0 L398,286" fill="none" stroke="#32505f" 