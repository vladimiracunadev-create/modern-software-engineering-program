<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 765 813" width="765" height="813" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Tarea con atributos» … «Cola para una persona»</title><desc id="d">Diagrama de flujo con 10 pasos. «Tarea con atributos» lleva a «Selector». «Selector» lleva a «Una llamada». «Selector» lleva a «Workflow encadenado o paralelo». «Selector» lleva a «Enrutamiento a workflow». «Selector» lleva a «Agente con presupuesto». «Selector» lleva a «Persona decide». «Agente con presupuesto» lleva a «Workflow con los mismos permisos» (errores o costo altos). «Workflow con los mismos permisos» lleva a «Plantilla o respuesta guardada» (siguen los errores). «Plantilla o respuesta guardada» lleva a «Cola para una persona» (sin cobertura). «Cola para una persona» lleva a «Agente con presupuesto» (sondas correctas).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="765" height="813" fill="#ffffff"/><path d="M391.9,83 L391.9,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M391.9,203 L391.9,232.0 Q391.9,241 382.9,241.0 L93.0,241.0 Q84,241 84.0,250.0 L84,279" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M391.9,203 L391.9,223.0 Q391.9,232 382.9,232.0 L246.5,232.0 Q237.5,232 237.5,241.0 L237.5,261" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M393.7,203 L393.7,270.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M391.9,203 L391.9,227.8 Q391.9,236.8 400.9,236.8 L549.0,236.8 Q558,236.8 558.0,245.8