<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 649 739" width="649" height="739" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Necesidad de reutilizar» … «Decisión por opción»</title><desc id="d">Diagrama de flujo con 12 pasos. «Necesidad de reutilizar» lleva a «Mecanismo». «Mecanismo» lleva a «Herencia: la subclase conoce la base». «Mecanismo» lleva a «Composición: el objeto contiene a otro». «Mecanismo» lleva a «Delegación: reenvía una parte». «Herencia: la subclase conoce la base» lleva a «Riesgo: base frágil, jerarquías cruzadas». «Composición: el objeto contiene a otro» lleva a «Riesgo: orden y configuración». «Delegación: reenvía una parte» lleva a «Riesgo: código de reenvío». «Riesgo: base frágil, jerarquías cruzadas» lleva a «Medida: cuentas erróneas, MRO». «Riesgo: orden y configuración» lleva a «Medida: totales según el orden». «Riesgo: código de reenvío» lleva a «Medida: contrato de la interfaz». «Medida: cuentas erróneas, MRO» lleva a «Decisión por opción». «Medida: totales según el orden» lleva a «Decisión por opción». «Medida: contrato de la interfaz» lleva a «Decisión por opción». «Decisión por opción» lleva a «Mecanismo» (la base cambia).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="649" height="739" fill="#ffffff"/><path d="M327.5,83 L327.5,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M327.5,203 L327.5,223.0 Q327.5,232 318.5,232.0 L123.5,232.0 Q114.5,232 114.5,241.0 L114.5,261" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M328.2,203 L328.2,261" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M327.5,203 L327.5,227.8 Q327.5,236.8 336.5,236.8 L530.0,236.8 Q539,236.8 539.0,245.8 L539,270.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M118.7,341 L118.7,399" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M328.9,341 L328.9,408.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M534.7,331.5 L534.7,408.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M122.9,479 L122.9,503.1 Q122.9,508 127.9,508.0 L127.9,508.0 Q132.8,508 132.8,513.0 L132.8,537" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M327.4,469.5 L327.4,537" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M526.9,469.5 L526.9,537" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M132.8,598 L132.8,618.0 Q132.8,627 141.8,627.0 L318.2,627.0 Q327.2,627 327.2,636.0 L327.2,656" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M326.5,598 L326.5,656" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M523.3,598 L523.3,618.0 Q523.3,627 514.3,627.0 L336.2,627.0 Q327.2,627 327.2,636.0 L327.2,656" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M260.7,686.5 L241.3,686.5 Q232.3,686.5 232.3,677.5 L232.3,181.0 Q232.3,172 241.3,172.0 L263,172" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="261" y="22" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="327.5" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="327.5" dy="0">Necesidad de</tspan><tspan x="327.5" dy="19.2">reutilizar</tspan></text><polygon points="327.5,141 392,172 327.5,203 263,172" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="327.5" y="176.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="327.5" dy="0">Mecanismo</tspan></text><rect x="22" y="261" width="185" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="114.5" y="286" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="114.5" dy="0">Herencia: la</tspan><tspan x="114.5" dy="19.2">subclase conoce la</tspan><tspan x="114.5" dy="19.2">base</tspan></text><rect x="241" y="261" width="176" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="329" y="286" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="329" dy="0">Composición: el</tspan><tspan x="329" dy="19.2">objeto contiene a</tspan><tspan x="329" dy="19.2">otro</tspan></text><rect x="451" y="270.5" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="539" y="295.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="539" dy="0">Delegación:</tspan><tspan x="539" dy="19.2">reenvía una parte</tspan></text><rect x="30.4" y="399" width="185" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="122.9" y="424" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="122.9" dy="0">Riesgo: base</tspan><tspan x="122.9" dy="19.2">frágil, jerarquías</tspan><tspan x="122.9" dy="19.2">cruzadas</tspan></text><rect x="249.4" y="408.5" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="328.9" y="433.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="328.9" dy="0">Riesgo: orden y</tspan><tspan x="328.9" dy="19.2">configuración</tspan></text><rect x="442.4" y="408.5" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="530.4" y="433.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="530.4" dy="0">Riesgo: código de</tspan><tspan x="530.4" dy="19.2">reenvío</tspan></text><rect x="53.3" y="537" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="132.8" y="562.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="132.8" dy="0">Medida: cuentas</tspan><tspan x="132.8" dy="19.2">erróneas, MRO</tspan></text><rect x="246.3" y="537" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="325.8" y="562.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="325.8" dy="0">Medida: totales</tspan><tspan x="325.8" dy="19.2">según el orden</tspan></text><rect x="439.3" y="537" width="168" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="523.3" y="562.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="523.3" dy="0">Medida: contrato</tspan><tspan x="523.3" dy="19.2">de la interfaz</tspan></text><rect x="260.7" y="656" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="327.2" y="681.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="327.2" dy="0">Decisión por</tspan><tspan x="327.2" dy="19.2">opción</tspan></text><rect x="169.3" y="365.8" width="126" height="24" rx="4" fill="#ffffff"/><text x="232.3" y="381.7" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="232.3" dy="0">la base cambia</tspan></text></svg>
