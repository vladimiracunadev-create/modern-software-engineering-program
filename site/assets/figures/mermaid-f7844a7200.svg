<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 823 147" width="823" height="147" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Personas y promedios» … «Agregación y segmentos»</title><desc id="d">Diagrama de flujo con 5 pasos. «Personas y promedios» lleva a «Actores y decisión». «Actores y decisión» lleva a «Trabajos por hacer». «Trabajos por hacer» lleva a «Contextos». «Contextos» lleva a «Agregación y segmentos». «Agregación y segmentos» lleva a «Personas y promedios» (fallo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="823" height="147" fill="#ffffff"/><path d="M137,94.5 L183,94.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M290,94.5 L336,94.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M469,94.5 L515,94.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M622,94.5 L668,94.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M734.5,64 L734.5,57.0 Q734.5,50 727.5,50.0 L86.5,50.0 Q79.5,50 79.5,57.0 L79.5,64" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="64" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="79.5" y="89.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="79.5" dy="0">Personas y</tspan><tspan x="79.5" dy="19.2">promedios</tspan></text><rect x="183" y="64" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="236.5" y="89.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="236.5" dy="0">Actores y</tspan><tspan x="236.5" dy="19.2">decisión</tspan></text><rect x="336" y="64" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="402.5" y="89.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="402.5" dy="0">Trabajos por</tspan><tspan x="402.5" dy="19.2">hacer</tspan></text><rect x="515" y="72.5" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="568.5" y="98.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="568.5" dy="0">Contextos</tspan></text><rect x="668" y="64" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="734.5" y="89.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="734.5" dy="0">Agregación y</tspan><tspan x="734.5" dy="19.2">segmentos</tspan></text><rect x="344" y="22" width="126" height="24" rx="4" fill="#ffffff"/><text x="407" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="407" dy="0">fallo o cambio</tspan></text></svg>
