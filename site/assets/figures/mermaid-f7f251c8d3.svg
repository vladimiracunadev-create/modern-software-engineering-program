<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 684" width="590" height="684" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Modelo de fallos», «Corte de energía» y «Puntuación de riesgos» … «Referencia independiente»</title><desc id="d">Diagrama de flujo con 11 pasos. «Modelo de fallos» lleva a «Inyección». «Inyección» lleva a «Comprobaciones». «Comprobaciones» lleva a «Detecta». «Detecta» lleva a «Estado seguro y registro» (sí). «Detecta» lleva a «Fallo silencioso» (no). «Fallo silencioso» lleva a «Referencia independiente». «Corte de energía» lleva a «Escritura con copias». «Puntuación de riesgos» lleva a «Estabilidad del orden».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="590" height="684" fill="#ffffff"/><path d="M106,74.5 L106.0,103.0 Q106,112 115.0,112.0 L126.1,112.0 Q135.1,112 135.1,121.0 L135.1,149.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M135.1,193.5 L135.1,217.8 Q135.1,226.8 144.1,226.8 L169.8,226.8 Q178.8,226.8 178.8,235.8 L178.8,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M178.8,304 L178.8,324.0 Q178.8,333 187.8,333.0 L218.8,333.0 Q227.8,333 227.8,342.0 L227.8,362" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M227.8,424 L227.8,432.0 Q227.8,440 219.8,440.0 L164.8,440.0 Q155.8,440 155.8,449.0 L155.8,482" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M227.8,424 L227.8,432.0 Q227.8,440 235.8,440.0 L344.3,440.0 Q353.3,440 353.3,449.0 L353.3,490.5" fill="none" stroke="#