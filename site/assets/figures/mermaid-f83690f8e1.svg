<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 309" width="856" height="309" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Jobs con duración» … «Ejecutores: reducen hasta el camino crítico» y «Estrategia: completa, parejas, una a la vez»</title><desc id="d">Diagrama de flujo con 9 pasos. «Jobs con duración» lleva a «Dependencias: grafo sin ciclos». «Dependencias: grafo sin ciclos» lleva a «Camino crítico = duración mínima». «Camino crítico = duración mínima» lleva a «Ejecutores: reducen hasta el camino crítico». «Dependencias: grafo sin ciclos» lleva a «Matriz: un job por combinación». «Matriz: un job por combinación» lleva a «Estrategia: completa, parejas, una a la vez». «Jobs con duración» lleva a «Caché: clave y respaldo». «Caché: clave y respaldo» lleva a «Resultado obsoleto» (clave no refleja la entrada). «Jobs con duración» lleva a «Artefacto entre jobs».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="856" height="309" fill="#ffffff"/><path d="M120,137.5 L134.0,137.5 Q143,137.5 143.0,128.5 L143.0,61.5 Q143,52.5 152.0,52.5 L166,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M334,52.5 L452,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M620,52.5 L634.0,52.5 Q643,52.5 643.0,61.5 L643.0,67.0 Q643,76 652.0,76.0 L666,76" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M334,52.5 L386.2,52.5 Q395.2,52.5 395.2,61.5 L395.2,128.5 Q395.2,137.5 404.2,137.5 L456.5,137.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end=