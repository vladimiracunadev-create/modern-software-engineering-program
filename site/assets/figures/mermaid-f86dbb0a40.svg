<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 441 860" width="441" height="860" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Evento: borrado, corrupción, fallo de disco» … «Pérdida: RPO medido»</title><desc id="d">Diagrama de flujo con 9 pasos. «Evento: borrado, corrupción, fallo de disco» lleva a «¿Qué copias hay?». «¿Qué copias hay?» lleva a «Copia completa periódica». «¿Qué copias hay?» lleva a «Registro de cambios archivado». «Copia completa periódica» lleva a «Restaurar copia». «Registro de cambios archivado» lleva a «Restaurar copia». «Restaurar copia» lleva a «Verificar: estructura y negocio». «Verificar: estructura y negocio» lleva a «Volver al servicio: RTO medido» (sana). «Verificar: estructura y negocio» lleva a «Probar copia anterior» (no sana). «Volver al servicio: RTO medido» lleva a «Pérdida: RPO medido».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="441" height="860" fill="#ffffff"/><path d="M235.6,102 L235.6,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M235.6,222 L235.6,242.0 Q235.6,251 226.6,251.0 L142.4,251.0 Q133.4,251 133.4,260.0 L133.4,280" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M235.6,222 L235.6,242.0 Q235.6,251 244.6,251.0 L321.4,251.0 Q330.4,251 330.4,260.0 L330.4,280" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M133.4,341 L133.4,361.0 Q133.4,370 142.4,370.0 L213.9,370.0 Q222.9,370 222.9,379.0 L222.9,399" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M330