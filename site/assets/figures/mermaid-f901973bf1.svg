<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 907 88" width="907" height="88" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «🎯 Estrategia» … «📈 Renovación»</title><desc id="d">Diagrama de flujo con 5 pasos. «🎯 Estrategia» lleva a «🧠 Portafolio». «🧠 Portafolio» lleva a «🛠️ Organización». «🛠️ Organización» lleva a «🔎 Riesgo». «🔎 Riesgo» lleva a «📈 Renovación».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="907" height="88" fill="#ffffff"/><path d="M161,44 L207,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M346,44 L392,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M549,44 L595,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M700,44 L746,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="22" width="139" height="44" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="91.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="91.5" dy="0">🎯 Estrategia</tspan></text><rect x="207" y="22" width="139" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="276.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="276.5" dy="0">🧠 Portafolio</tspan></text><rect x="392" y="22" width="157" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470.5" dy="0">🛠️ Organización</tspan></text><rect x="595" y="22" width="105" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="647.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="647.5" dy="0">🔎 Riesgo</tspan></text><rect x="746" y="22" width="139" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="815.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="815.5" dy="0">📈 Renovación</tspan></text></svg>
