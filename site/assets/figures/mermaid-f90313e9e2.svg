<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 823 147" width="823" height="147" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Árbol, raíz / subárbol» … «Recorridos / serialización»</title><desc id="d">Diagrama de flujo con 5 pasos. «Árbol, raíz / subárbol» lleva a «Árbol de búsqueda». «Árbol de búsqueda» lleva a «Balance / rotaciones». «Balance / rotaciones» lleva a «Trie / prefijos». «Trie / prefijos» lleva a «Recorridos / serialización». «Recorridos / serialización» lleva a «Árbol, raíz / subárbol» (fallo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="823" height="147" fill="#ffffff"/><path d="M164,94.5 L210,94.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M308,94.5 L354,94.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M469,94.5 L515,94.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M613,94.5 L659,94.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M730,64 L730.0,57.0 Q730,50 723.0,50.0 L100.0,50.0 Q93,50 93.0,57.0 L93,64" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="64" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="93" y="89.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="93" dy="0">Árbol, raíz /</tspan><tspan x="93" dy="19.2">subárbol</tspan></text><rect x="210" y="64" width="98" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="259" y="89.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="259" dy="0">Árbol de</tspan><tspan x="259" dy="19.2">búsqueda</tspan></text><rect x="354" y="64" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="411.5" y="89.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="411.5" dy="0">Balance /</tspan><tspan x="411.5" dy="19.2">rotaciones</tspan></text><rect x="515" y="64" width="98" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="564" y="89.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="564" dy="0">Trie /</tspan><tspan x="564" dy="19.2">prefijos</tspan></text><rect x="659" y="64" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="730" y="89.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="730" dy="0">Recorridos /</tspan><tspan x="730" dy="19.2">serialización</tspan></text><rect x="348.5" y="22" width="126" height="24" rx="4" fill="#ffffff"/><text x="411.5" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="411.5" dy="0">fallo o cambio</tspan></text></svg>
