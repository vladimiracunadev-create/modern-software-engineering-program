<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 501 786" width="501" height="786" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Señal continua» … «Persona»</title><desc id="d">Diagrama de flujo con 8 pasos. «Señal continua» lleva a «Filtro antes de muestrear». «Filtro antes de muestrear» lleva a «Muestreo a tasa fija». «Muestreo a tasa fija» lleva a «Búfer y procesamiento». «Búfer y procesamiento» lleva a «Llega a tiempo?». «Llega a tiempo?» lleva a «Reproducción» (sí). «Llega a tiempo?» lleva a «Subcarga o fotograma perdido» (no). «Reproducción» lleva a «Persona». «Subcarga o fotograma perdido» lleva a «Persona». «Persona» lleva a «Búfer y procesamiento» (molestia o malestar).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="501" height="786" fill="#ffffff"/><path d="M298.5,66 L298.5,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M298.3,185 L298.3,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M297.9,304 L297.9,362" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M297.3,423 L297.3,481" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M297,543 L297.0,551.0 Q297,559 289.0,559.0 L211.5,559.0 Q202.5,559 202.5,568.0 L202.5,609.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M297,543 L297.0,551.0 Q297,559 305.0,559.0 L382.0,559.0 Q391,559 391.0,568.0 L391,601" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M202.5,653.5 L202.5,677.8 Q202.5,686.8 211.5,686.8 L287.7,686.8 Q296.7,686.8 296.7,695.8 L296.7,720" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M391,662 L391.0,682.0 Q391,691 382.0,691.0 L305.7,691.0 Q296.7,691 296.7,700.0 L296.7,720" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M252.2,742 L131.0,742.0 Q122,742 122.0,733.0 L122.0,401.5 Q122,392.5 131.0,392.5 L226.6,392.5" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="223.5" y="22" width="150" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="298.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="298.5" dy="0">Señal continua</tspan></text><rect x="219" y="124" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="298.5" y="149.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="298.5" dy="0">Filtro antes de</tspan><tspan x="298.5" dy="19.2">muestrear</tspan></text><rect x="218.6" y="243" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="298.1" y="268.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="298.1" dy="0">Muestreo a tasa</tspan><tspan x="298.1" dy="19.2">fija</tspan></text><rect x="226.6" y="362" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="297.6" y="387.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="297.6" dy="0">Búfer y</tspan><tspan x="297.6" dy="19.2">procesamiento</tspan></text><polygon points="297,481 399,512 297,543 195,512" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="297" y="516.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="297" dy="0">Llega a tiempo?</tspan></text><rect x="136" y="609.5" width="133" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="202.5" y="635.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="202.5" dy="0">Reproducción</tspan></text><rect x="303" y="601" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="391" y="626.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="391" dy="0">Subcarga o</tspan><tspan x="391" dy="19.2">fotograma perdido</tspan></text><rect x="252.2" y="720" width="89" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="296.7" y="746.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="296.7" dy="0">Persona</tspan></text><rect x="208.5" y="572.2" width="29" height="24" rx="4" fill="#ffffff"/><text x="223" y="588.1" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="223" dy="0">sí</tspan></text><rect x="397" y="568" width="29" height="24" rx="4" fill="#ffffff"/><text x="411.5" y="583.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="411.5" dy="0">no</tspan></text><rect x="22" y="546.2" width="94" height="42" rx="4" fill="#ffffff"/><text x="69" y="562.1" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="69" dy="0">molestia o</tspan><tspan x="69" dy="17.92">malestar</tspan></text></svg>
