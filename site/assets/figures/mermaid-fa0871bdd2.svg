<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 501 776" width="501" height="776" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Job con permiso de pedir identidad» y «Secreto estático» … «Expira sola»</title><desc id="d">Diagrama de flujo con 9 pasos. «Job con permiso de pedir identidad» lleva a «Token firmado: iss, aud, sub, exp». «Token firmado: iss, aud, sub, exp» lleva a «Proveedor valida firma y notificaciones». «Proveedor valida firma y notificaciones» lleva a «Credencial temporal de minutos» (regla de confianza coincide). «Proveedor valida firma y notificaciones» lleva a «Rechazo» (no coincide). «Credencial temporal de minutos» lleva a «Acción acotada por permisos». «Acción acotada por permisos» lleva a «Expira sola». «Secreto estático» lleva a «Exposición hasta que alguien lo rota».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="501" height="776" fill="#ffffff"/><path d="M178.3,83 L178.3,150.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M175.5,211.5 L175.5,279" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M172.6,359 L172.6,367.0 Q172.6,375 164.6,375.0 L105.4,375.0 Q96.4,375 96.4,384.0 L96.4,453" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M172.6,359 L172.6,367.0 Q172.6,375 180.6,375.0 L227.9,375.0 Q236.9,375 236.9,384.0 L236.9,471" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M96.4,533 L96.4,553.0 Q96.4,562 105.4,562.0 L105.5,562.0 Q114.5,562 114.5,571.0 L114.5,591" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M114.5,652 L114.5,674.7 Q114.5,681 120.8,681.0 L120.8,681.0 Q127.1,681 127.1,687.3 L127.1,710" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M394.6,74.5 L394.6,141" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="85.8" y="22" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="178.3" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="178.3" dy="0">Job con permiso de</tspan><tspan x="178.3" dy="19.2">pedir identidad</tspan></text><rect x="85.8" y="150.5" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="178.3" y="175.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="178.3" dy="0">Token firmado:</tspan><tspan x="178.3" dy="19.2">iss, aud, sub, exp</tspan></text><rect x="88.6" y="279" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="172.6" y="304" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="172.6" dy="0">Proveedor valida</tspan><tspan x="172.6" dy="19.2">firma y</tspan><tspan x="172.6" dy="19.2">notificaciones</tspan></text><rect x="34.4" y="453" width="124" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="96.4" y="478" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="96.4" dy="0">Credencial</tspan><tspan x="96.4" dy="19.2">temporal de</tspan><tspan x="96.4" dy="19.2">minutos</tspan></text><rect x="192.4" y="471" width="89" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="236.9" y="497.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="236.9" dy="0">Rechazo</tspan></text><rect x="22" y="591" width="185" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="114.5" y="616.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="114.5" dy="0">Acción acotada por</tspan><tspan x="114.5" dy="19.2">permisos</tspan></text><rect x="65.1" y="710" width="124" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="127.1" y="736.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="127.1" dy="0">Expira sola</tspan></text><rect x="310.6" y="30.5" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="394.6" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="394.6" dy="0">Secreto estático</tspan></text><rect x="310.6" y="141" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="394.6" y="166" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="394.6" dy="0">Exposición hasta</tspan><tspan x="394.6" dy="19.2">que alguien lo</tspan><tspan x="394.6" dy="19.2">rota</tspan></text><rect x="102.4" y="384" width="86" height="60" rx="4" fill="#ffffff"/><text x="145.4" y="399.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="145.4" dy="0">regla de</tspan><tspan x="145.4" dy="17.92">confianza</tspan><tspan x="145.4" dy="17.92">coincide</tspan></text><rect x="242.9" y="411" width="102" height="24" rx="4" fill="#ffffff"/><text x="293.9" y="426.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="293.9" dy="0">no coincide</tspan></text></svg>
