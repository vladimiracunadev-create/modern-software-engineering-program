<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 839 88" width="839" height="88" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «🎯 Tenant» … «📈 Economía»</title><desc id="d">Diagrama de flujo con 5 pasos. «🎯 Tenant» lleva a «🧠 Plan y derecho». «🧠 Plan y derecho» lleva a «🛠️ Uso». «🛠️ Uso» lleva a «🔎 Operación». «🔎 Operación» lleva a «📈 Economía».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="839" height="88" fill="#ffffff"/><path d="M127,44 L173,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M347,44 L393,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M472,44 L518,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M649,44 L695,44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="22" y="22" width="105" height="44" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="74.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="74.5" dy="0">🎯 Tenant</tspan></text><rect x="173" y="22" width="174" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="260" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="260" dy="0">🧠 Plan y derecho</tspan></text><rect x="393" y="22" width="79" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="432.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="432.5" dy="0">🛠️ Uso</tspan></text><rect x="518" y="22" width="131" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="583.5" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="583.5" dy="0">🔎 Operación</tspan></text><rect x="695" y="22" width="122" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="756" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="756" dy="0">📈 Economía</tspan></text></svg>
