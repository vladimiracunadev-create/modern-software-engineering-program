<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 385 994" width="385" height="994" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Dependencias directas» … «Revisar el cambio incompatible»</title><desc id="d">Diagrama de flujo con 10 pasos. «Dependencias directas» lleva a «Dependencias transitivas». «Dependencias transitivas» lleva a «Inventario con versiones y soporte». «Inventario con versiones y soporte» lleva a «Rezago acumulado». «Inventario con versiones y soporte» lleva a «Avisos de seguridad». «Rezago acumulado» lleva a «Costo del próximo salto». «Avisos de seguridad» lleva a «Ventana de exposición». «Costo del próximo salto» lleva a «Política de actualización». «Ventana de exposición» lleva a «Política de actualización». «Política de actualización» lleva a «Actualización en pasos pequeños con pruebas». «Actualización en pasos pequeños con pruebas» lleva a «Revisar el cambio incompatible» (la prueba falla). «Actualización en pasos pequeños con pruebas» lleva a «Inventario con versiones y soporte».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="385" height="994" fill="#ffffff"/><path d="M199.4,83 L199.4,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M199.6,202 L199.6,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M199.7,340 L199.7,364.2 Q199.7,373.2 190.7,373.2 L123.1,373.2 Q114.1,373.2 114.1,382.2 L114.1,406.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M199.7,340 L199.7,360.0 Q199.7,369 208.7,369.0 L276.6,369.0 Q285.6,369 285.6,378.0 L285.6,398" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M112,450.5 L112,517" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M287.6,459 L287.6,517" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M110,578 L110.0,598.0 Q110,607 119.0,607.0 L190.6,607.0 Q199.6,607 199.6,616.0 L199.6,636" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M289.5,578 L289.5,598.0 Q289.5,607 280.5,607.0 L208.6,607.0 Q199.6,607 199.6,616.0 L199.6,636" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M199.4,697 L199.4,755" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M199,835 L199,911" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M291.7,795 L352.0,795.0 Q361,795 361.0,786.0 L361.0,309.0 Q361,300 352.0,300.0 L274.7,300" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="132.9" y="22" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="199.4" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="199.4" dy="0">Dependencias</tspan><tspan x="199.4" dy="19.2">directas</tspan></text><rect x="132.9" y="141" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="199.4" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="199.4" dy="0">Dependencias</tspan><tspan x="199.4" dy="19.2">transitivas</tspan></text><rect x="124.7" y="260" width="150" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="199.7" y="285" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="199.7" dy="0">Inventario con</tspan><tspan x="199.7" dy="19.2">versiones y</tspan><tspan x="199.7" dy="19.2">soporte</tspan></text><rect x="30.1" y="406.5" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="114.1" y="432.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="114.1" dy="0">Rezago acumulado</tspan></text><rect x="232.1" y="398" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="285.6" y="423.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="285.6" dy="0">Avisos de</tspan><tspan x="285.6" dy="19.2">seguridad</tspan></text><rect x="22" y="517" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="110" y="542.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">Costo del próximo</tspan><tspan x="110" dy="19.2">salto</tspan></text><rect x="232" y="517" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="289.5" y="542.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="289.5" dy="0">Ventana de</tspan><tspan x="289.5" dy="19.2">exposición</tspan></text><rect x="128.6" y="636" width="142" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="199.6" y="661.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="199.6" dy="0">Política de</tspan><tspan x="199.6" dy="19.2">actualización</tspan></text><rect x="106.7" y="755" width="185" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="199.2" y="780" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="199.2" dy="0">Actualización en</tspan><tspan x="199.2" dy="19.2">pasos pequeños con</tspan><tspan x="199.2" dy="19.2">pruebas</tspan></text><rect x="110.9" y="911" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="198.9" y="936.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0