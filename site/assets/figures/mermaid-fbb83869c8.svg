<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 822" width="460" height="822" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Binario .wasm» … «Descartar instancia»</title><desc id="d">Diagrama de flujo con 9 pasos. «Binario .wasm» lleva a «Motor: una vez». «Motor: una vez» lleva a «Compilar: una vez por versión». «Compilar: una vez por versión» lleva a «Módulo compilado en caché». «Módulo compilado en caché» lleva a «Instancia por petición». «Instancia por petición» lleva a «Llamada». «Llamada» lleva a «Descartar instancia». «Contrato de capacidades» lleva a «Compilar: una vez por versión» (revisa importaciones). «Límites: combustible y memoria» lleva a «Instancia por petición».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="460" height="822" fill="#ffffff"/><path d="M97,66 L97,132.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M97,176.5 L97.0,209.8 Q97,218.8 106.0,218.8 L189.6,218.8 Q198.6,218.8 198.6,227.8 L198.6,261" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M198.6,322 L198.6,346.8 Q198.6,355.8 189.6,355.8 L187.0,355.8 Q178,355.8 178.0,364.8 L178,389.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M178,450.5 L178.0,475.2 Q178,484.2 187.0,484.2 L285.4,484.2 Q294.4,484.2 294.4,493.2 L294.4,518" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M294.4,579 L294.4,601.2 Q294.4,608 301.1,608.0 L301.1,608.0 Q307.9,608 307.9,614.8 L307.9,637" fill="none" stroke="#32505f" stroke-width="1.8" marker-