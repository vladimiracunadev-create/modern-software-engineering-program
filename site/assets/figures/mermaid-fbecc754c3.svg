<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 537 626" width="537" height="626" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Especificación» … «Aviso antes de desplegar» y «Despliegue»</title><desc id="d">Diagrama de flujo con 9 pasos. «Especificación» lleva a «Contrato de consumidor». «Especificación» lleva a «Propiedad». «Contrato de consumidor» lleva a «Verificación contra el proveedor». «Propiedad» lleva a «Generación y reducción». «Verificación contra el proveedor» lleva a «Cambio del proveedor». «Cambio del proveedor» lleva a «Aviso antes de desplegar» (rompe a un consumidor). «Cambio del proveedor» lleva a «Despliegue» (no rompe a nadie). «Doble de prueba» lleva a «Cambio del proveedor» (no ve).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="537" height="626" fill="#ffffff"/><path d="M199.4,66 L199.4,86.0 Q199.4,95 190.4,95.0 L133.6,95.0 Q124.6,95 124.6,104.0 L124.6,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M199.4,66 L199.4,90.2 Q199.4,99.2 208.4,99.2 L265.1,99.2 Q274.1,99.2 274.1,108.2 L274.1,132.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M124.6,185 L124.6,205.0 Q124.6,214 115.6,214.0 L97.5,214.0 Q88.5,214 88.5,223.0 L88.5,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M274.1,176.5 L274.1,205.5 Q274.1,214.5 265.1,214.5 L264.5,214.5 Q255.5,214.5 255.5,223.5 L255.5,252.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M88.5,323 L88.5,343.0 Q88.5,352 97.5,352.0 L274.1,352.0 Q283.1,352 283.1,361.0 L283.1,381" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M283.1,467 L283.1,475.0 Q283.1,483 275.1,483.0 L219.1,483.0 Q210.1,483 210.1,492.0 L210.1,543" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M283.1,467 L283.1,475.0 Q283.1,483 291.1,483.0 L367.6,483.0 Q376.6,483 376.6,492.0 L376.6,551.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M435.5,305 L435.5,313.0 Q435.5,321 427.5,321.0 L292.1,321.0 Q283.1,321 283.1,330.0 L283.1,381" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="124.4" y="22" width="150" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="199.4" y="48.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="199.4" dy="0">Especificación</tspan></text><rect x="62.6" y="124" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="124.6" y="149.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="124.6" dy="0">Contrato de</tspan><tspan x="124.6" dy="19.2">consumidor</tspan></text><rect x="220.6" y="132.5" width="107" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="274.1" y="158.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="274.1" dy="0">Propiedad</tspan></text><rect x="22" y="243" width="133" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="88.5" y="268" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="88.5" dy="0">Verificación</tspan><tspan x="88.5" dy="19.2">contra el</tspan><tspan x="88.5" dy="19.2">proveedor</tspan></text><rect x="189" y="252.5" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="255.5" y="277.6" font-size="15" text-anchor="middle" font-weight="400" fill=