<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 405 922" width="405" height="922" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Solicitud de fecha» … «Entrega» y «Revisar y comunicar»</title><desc id="d">Diagrama de flujo con 10 pasos. «Solicitud de fecha» lleva a «Tareas con incertidumbre». «Tareas con incertidumbre» lleva a «Combinar con factor común». «Solicitud de fecha» lleva a «Historial de entrega por semana». «Historial de entrega por semana» lleva a «Pronóstico con percentiles». «Combinar con factor común» lleva a «Pronóstico con percentiles». «Pronóstico con percentiles» lleva a «Compromiso con probabilidad». «Compromiso con probabilidad» lleva a «Límite de trabajo en curso». «Límite de trabajo en curso» lleva a «Cumple el ritmo». «Cumple el ritmo» lleva a «Entrega» (sí). «Cumple el ritmo» lleva a «Revisar y comunicar» (no). «Revisar y comunicar» lleva a «Pronóstico con percentiles».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="405" height="922" fill="#ffffff"/><path d="M191.7,66 L191.7,86.0 Q191.7,95 182.7,95.0 L102.0,95.0 Q93,95 93.0,104.0 L93,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M93,185 L93.0,205.0 Q93,214 102.0,214.0 L125.7,214.0 Q134.7,214 134.7,223.0 L134.7,243" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M191.7,66 L191.7,86.0 Q191.7,95 200.7,95.0 L281.5,95.0 Q290.5,95 290.5,104.0 L290.5,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M290.5,185 L290.5,383.5 Q290.5,392.5 281.5,392.5 L246.8,392.5" f