.6" y="839" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="308.1" y="864.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="308.1" dy="0">Revisar y</tspan><tspan x="308.1" dy="19.2">comunicar</tspan></text><rect x="182.1" y="815.3" width="29" height="24" rx="4" fill="#ffffff"/><text x="196.6" y="831.2" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="196.6" dy="0">sí</tspan></text><rect x="314.1" y="806" width="29" height="24" rx="4" fill="#ffffff"/><text x="328.6" y="821.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="328.6" dy="0">no</tspan></text></svg>
