<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 183" width="822" height="183" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Costo de equivocarse» … «Evidencia exigida»</title><desc id="d">Diagrama de flujo con 5 pasos. «Costo de equivocarse» lleva a «Costo de revertir». «Costo de revertir» lleva a «Reversibilidad medida». «Reversibilidad medida» lleva a «Despliegue progresivo». «Despliegue progresivo» lleva a «Evidencia exigida». «Evidencia exigida» lleva a «Costo de equivocarse» (aparece un daño no reversible).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="822" height="183" fill="#ffffff"/><path d="M146,130.5 L192,130.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M290,130.5 L336,130.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M486,130.5 L532,130.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M647,130.5 L693,130.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M746.5,100 L746.5,93.0 Q746.5,86 739.5,86.0 L91.0,86.0 Q84,86 84.0,93.0 L84,100" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="100" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="84" y="125.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="84" dy="0">Costo de</tspan><tspan x="84" dy="19.2">equivocarse</tspan></text><rect x="192" y="100" width="98" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="241" y="125.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="241" dy="0">Costo de</tspan><tspan x="241" dy="19.2">revertir</tspan></text><rect x="336" y="100" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="411" y="125.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="411" dy="0">Reversibilidad</tspan><tspan x="411" dy="19.2">medida</tspan></text><rect x="532" y="100" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="589.5" y="125.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="589.5" dy="0">Despliegue</tspan><tspan x="589.5" dy="19.2">progresivo</tspan></text><rect x="693" y="100" width="107" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="746.5" y="125.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="746.5" dy="0">Evidencia</tspan><tspan x="746.5" dy="19.2">exigida</tspan></text><rect x="368.2" y="22" width="94" height="60" rx="4" fill="#ffffff"/><text x="415.2" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="415.2" dy="0">aparece un</tspan><tspan x="415.2" dy="17.92">daño no</tspan><tspan x="415.2" dy="17.92">reversible</tspan></text></svg>
