<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 814 185" width="814" height="185" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Fuerzas del problema» … «Decisión reversible / experimento»</title><desc id="d">Diagrama de flujo con 5 pasos. «Fuerzas del problema» lleva a «Semántica antes que sintaxis». «Semántica antes que sintaxis» lleva a «Fronteras entre modelos». «Fronteras entre modelos» lleva a «Costo cognitivo / operativo». «Costo cognitivo / operativo» lleva a «Decisión reversible / experimento». «Decisión reversible / experimento» lleva a «Fuerzas del problema» (fallo o cambio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="814" height="185" fill="#ffffff"/><path d="M146,113.5 L192,113.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M299,113.5 L345,113.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M452,113.5 L498,113.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M622,113.5 L668,113.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M730,64 L730.0,57.0 Q730,50 723.0,50.0 L93.0,50.0 Q84,50 84.0,59.0 L84,83" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="83" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="84" y="108.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="84" dy="0">Fuerzas del</tspan><tspan x="84" dy="19.2">problema</tspan></text><rect x="192" y="73.5" width="107" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="245.5" y="98.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="245.5" dy="0">Semántica</tspan><tspan x="245.5" dy="19.2">antes que</tspan><tspan x="245.5" dy="19.2">sintaxis</tspan></text><rect x="345" y="73.5" width="107" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="398.5" y="98.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="398.5" dy="0">Fronteras</tspan><tspan x="398.5" dy="19.2">entre</tspan><tspan x="398.5" dy="19.2">modelos</tspan></text><rect x="498" y="73.5" width="124" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="560" y="98.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="560" dy="0">Costo</tspan><tspan x="560" dy="19.2">cognitivo /</tspan><tspan x="560" dy="19.2">operativo</tspan></text><rect x="668" y="64" width="124" height="99" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="730" y="88.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="730" dy="0">Decisión</tspan><tspan x="730" dy="19.2">reversible</tspan><tspan x="730" dy="19.2">/</tspan><tspan x="730" dy="19.2">experimento</tspan></text><rect x="344" y="22" width="126" height="24" rx="4" fill="#ffffff"/><text x="407" y="37.9" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="407" dy="0">fallo o cambio</tspan></text></svg>
