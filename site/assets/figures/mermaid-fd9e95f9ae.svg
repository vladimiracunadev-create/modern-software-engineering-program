<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 497 1001" width="497" height="1001" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Requisito de tiempo del limitador» … «Evidencia para el caso de seguridad»</title><desc id="d">Diagrama de flujo con 9 pasos. «Requisito de tiempo del limitador» lleva a «Tareas: periodo, cómputo, plazo». «Tareas: periodo, cómputo, plazo» lleva a «Recursos compartidos y secciones críticas». «Recursos compartidos y secciones críticas» lleva a «Protocolo: herencia o techo». «Protocolo: herencia o techo» lleva a «Bloqueo máximo por tarea». «Tareas: periodo, cómputo, plazo» lleva a «WCET de cada tarea». «Bloqueo máximo por tarea» lleva a «Análisis de tiempo de respuesta». «WCET de cada tarea» lleva a «Análisis de tiempo de respuesta». «Análisis de tiempo de respuesta» lleva a «Respuesta menor que el plazo». «Respuesta menor que el plazo» lleva a «Evidencia para el caso de seguridad» (sí). «Respuesta menor que el plazo» lleva a «Tareas: periodo, cómputo, plazo» (no).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="497" height="1001" fill="#ffffff"/><path d="M233.5,102 L233.5,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M233.5,221 L233.5,241.0 Q233.5,250 224.5,250.0 L123.5,250.0 Q114.5,250 114.5,259.0 L114.5,279" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M114.5,359 L114.5,379.0 Q114.5,388 123.5,388.0 L147.8,388.0 Q156.8,388 156.8,397.0 L156.8,417" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M156.8,478 