<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 578 224" width="578" height="224" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Problema situado» … «Evidencia de aceptación»</title><desc id="d">Diagrama de flujo con 6 pasos. «Problema situado» lleva a «Abstracción explícita». «Abstracción explícita» lleva a «Reglas e invariantes». «Reglas e invariantes» lleva a «Solución o estrategia». «Solución o estrategia» lleva a «Casos y contraejemplos». «Casos y contraejemplos» lleva a «Evidencia de aceptación». «Evidencia de aceptación» lleva a «Abstracción explícita» (modelo insuficiente).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="578" height="224" fill="#ffffff"/><path d="M190,52.5 L249,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M373,52.5 L432,52.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M494,83 L494,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M436.5,171.5 L386,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M236,171.5 L172.5,171.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M106,141 L106.0,106.0 Q106,97 115.0,97.0 L304.0,97.0 Q311,97 311.0,90.0 L311,83" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="30.5" width="168" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="56.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Problema situado</tspan></text><rect x="249" y="22" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="311" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="311" dy="0">Abstracción</tspan><tspan x="311" dy="19.2">explícita</tspan></text><rect x="432" y="22" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="494" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="494" dy="0">Reglas e</tspan><tspan x="494" dy="19.2">invariantes</tspan></text><rect x="436.5" y="141" width="115" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="494" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="494" dy="0">Solución o</tspan><tspan x="494" dy="19.2">estrategia</tspan></text><rect x="236" y="141" width="150" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="311" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="311" dy="0">Casos y</tspan><tspan x="311" dy="19.2">contraejemplos</tspan></text><rect x="39.5" y="141" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="166.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Evidencia de</tspan><tspan x="106" dy="19.2">aceptación</tspan></text><rect x="112" y="93.6" width="110" height="42" rx="4" fill="#ffffff"/><text x="167" y="109.5" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="167" dy="0">modelo</tspan><tspan x="167" dy="17.92">insuficiente</tspan></text></svg>
