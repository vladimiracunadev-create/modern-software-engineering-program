<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 784 243" width="784" height="243" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Fuente del analizador local de eventos» … «Medición reproducible»</title><desc id="d">Diagrama de flujo con 7 pasos. «Fuente del analizador local de eventos» lleva a «Representación». «Representación» lleva a «Traducción y runtime». «Traducción y runtime» lleva a «Instrucciones». «Instrucciones» lleva a «Memoria y CPU». «Memoria y CPU» lleva a «Proceso e I/O». «Proceso e I/O» lleva a «Medición reproducible». «Medición reproducible» lleva a «Fuente del analizador local de eventos».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="784" height="243" fill="#ffffff"/><path d="M190,62 L236,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M386,62 L436.5,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M569.5,62 L620,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M691,84 L691,168.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M620,190.5 L574,190.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M432,190.5 L377.5,190.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M244.5,190.5 L115.0,190.5 Q106,190.5 106.0,181.5 L106,102" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><rect x="22" y="22" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="47" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Fuente del</tspan><tspan x="106" dy="19.2">analizador local</tspan><tspan x="106" dy="19.2">de eventos</tspan></text><rect x="236" y="40" width="150" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="311" y="66.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="311" dy="0">Representación</tspan></text><rect x="436.5" y="31.5" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="503" y="56.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="503" dy="0">Traducción y</tspan><tspan x="503" dy="19.2">runtime</tspan></text><rect x="620" y="40" width="142" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="691" y="66.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="691" dy="0">Instrucciones</tspan></text><rect x="620" y="168.5" width="142" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="691" y="194.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="691" dy="0">Memoria y CPU</tspan></text><rect x="432" y="168.5" width="142" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="503" y="194.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="503" dy="0">Proceso e I/O</tspan></text><rect x="244.5" y="160" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="311" y="185.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="311" dy="0">Medición</tspan><tspan x="311" dy="19.2">reproducible</tspan></text></svg>
