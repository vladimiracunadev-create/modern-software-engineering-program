<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 454 763" width="454" height="763" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Estado estable: métricas normales» y «Prueba de concurrencia» … «Hallazgo: defecto o supuesto falso»</title><desc id="d">Diagrama de flujo con 10 pasos. «Estado estable: métricas normales» lleva a «Hipótesis: se mantiene bajo el fallo». «Hipótesis: se mantiene bajo el fallo» lleva a «Inyección acotada de un fallo». «Inyección acotada de un fallo» lleva a «Métrica dentro del umbral». «Métrica dentro del umbral» lleva a «Hipótesis sostenida en ese alcance» (sí). «Métrica dentro del umbral» lleva a «Aborto y reversión» (no). «Aborto y reversión» lleva a «Hallazgo: defecto o supuesto falso». «Prueba de concurrencia» lleva a «Exploración con semillas». «Exploración con semillas» lleva a «Reproducir con la misma semilla».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="454" height="763" fill="#ffffff"/><path d="M123.6,83 L123.6,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M123.6,221 L123.6,244.8 Q123.6,250 128.8,250.0 L128.8,250.0 Q133.9,250 133.9,255.2 L133.9,279" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M133.9,340 L133.9,360.0 Q133.9,369 142.9,369.0 L175.5,369.0 Q184.5,369 184.5,378.0 L184.5,398" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M184.5,484 L184.5,492.0 Q184.5,500 176.5,500.0 L115.0,500.0 Q106,500 106.0,509.0 L106,542" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M184.5,484 L184.5,492.0 Q184.5,500 192.5,500.0 L307.5,500.0 Q316.5,500 316.5,509.0 L316.5,560" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M315.1,604 L315.1,680" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M332.3,83 L332.3,150.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M332.3,211.5 L332.3,239.4 Q332.3,245.2 338.1,245.2 L338.1,245.2 Q343.9,245.2 343.9,251.0 L343.9,279" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="35.6" y="22" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="123.6" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="123.6" dy="0">Estado estable:</tspan><tspan x="123.6" dy="19.2">métricas normales</tspan></text><rect x="39.6" y="141" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="123.6" y="166" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="123.6" dy="0">Hipótesis: se</tspan><tspan x="123.6" dy="19.2">mantiene bajo el</tspan><tspan x="123.6" dy="19.2">fallo</tspan></text><rect x="45.9" y="279" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="133.9" y="304.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="133.9" dy="0">Inyección acotada</tspan><tspan x="133.9" dy="19.2">de un fallo</tspan></text><polygon points="184.5,398 336,441 184.5,484 33,441" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="184.5" y="435.6" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="184.5" dy="0">Métrica dentro del</tspan><tspan x="184.5" dy="19.2">umbral</tspan></text><rect x="22" y="542" width="168" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="106" y="567" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="106" dy="0">Hipótesis</tspan><tspan x="106" dy="19.2">sostenida en ese</tspan><tspan x="106" dy="19.2">alcance</tspan></text><rect x="224" y="560" width="185" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="316.5" y="586.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="316.5" dy="0">Aborto y reversión</tspan></text><rect x="225.6" y="680" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="313.6" y="705.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="313.6" dy="0">Hallazgo: defecto</tspan><tspan x="313.6" dy="19.2">o supuesto falso</tspan></text><rect x="265.8" y="22" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="332.3" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="332.3" dy="0">Prueba de</tspan><tspan x="332.3" dy="19.2">concurrencia</tspan></text><rect x="252.8" y="150.5" width="159" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="332.3" y="175.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="332.3" dy="0">Exploración con</tspan><tspan x="332.3" dy="19.2">semillas</tspan></text><rect x="255.9" y="279" width="176" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="343.9" y="304.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="343.9" dy="0">Reproducir con la</tspan><tspan x="343.9" dy="19.2">misma semilla</tspan></text><rect x="112" y="509" width="29" height="24" rx="4" fill="#ffffff"/><text x="126.5" y="524.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="126.5" dy="0">sí</tspan></text><rect x="322.5" y="518" width="29" height="24" rx="4" fill="#ffffff"/><text x="337" y="533.9" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><t