<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 369 582" width="369" height="582" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagrama de flujo: «Estados y transiciones» … «Traza más corta» y «Modelo sin violaciones»</title><desc id="d">Diagrama de flujo con 7 pasos. «Estados y transiciones» lleva a «Invariante». «Estados y transiciones» lleva a «Búsqueda en anchura». «Invariante» lleva a «Búsqueda en anchura». «Búsqueda en anchura» lleva a «Violación». «Violación» lleva a «Traza más corta» (sí). «Violación» lleva a «Modelo sin violaciones» (no). «Estados y transiciones» lleva a «Concurrencia y simetría». «Concurrencia y simetría» lleva a «Búsqueda en anchura» (explosión).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="369" height="582" fill="#ffffff"/><path d="M187.9,83 L187.9,107.2 Q187.9,116.2 178.9,116.2 L113.6,116.2 Q104.6,116.2 104.6,125.2 L104.6,149.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M121.4,52.5 L42.1,52.5 Q33.1,52.5 33.1,61.5 L33.1,281.5 Q33.1,290.5 42.1,290.5 L126.2,290.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M104.6,193.5 L104.6,217.8 Q104.6,226.8 113.6,226.8 L179.2,226.8 Q188.2,226.8 188.2,235.8 L188.2,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M188.6,321 L188.6,379" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M188.9,441 L188.9,449.0 Q188.9,457 180.9,457.0 L110.5,457.0 Q101.5,457 101.5,466.0 L101.5,507.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M188.9,441 L188.9,449.0 Q188.9,457 196.9,457.0 L268.0,457.0 Q277,457 277.0,466.0 L277,499" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M187.9,83 L187.9,103.0 Q187.9,112 196.9,112.0 L262.1,112.0 Q271.1,112 271.1,121.0 L271.1,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M271.1,202 L271.1,210.0 Q271.1,218 263.1,218.0 L197.2,218.0 Q188.2,218 188.2,227.0 L188.2,260" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="121.4" y="22" width="133" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="187.9" y="47.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="187.9" dy="0">Estados y</tspan><tspan x="187.9" dy="19.2">transiciones</tspan></text><rect x="47.1" y="149.5" width="115" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="104.6" y="175.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="104.6" dy="0">Invariante</tspan></text><rect x="126.2" y="260" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="188.2" y="285.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="188.2" dy="0">Búsqueda en</tspan><tspan x="188.2" dy="19.2">anchura</tspan></text><polygon points="188.9,379 253.4,410 188.9,441 124.4,410" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="188.9" y="414.2" font-size="15" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="188.9" dy="0">Violación</tspan></text><rect x="22" y="507.5" width="159" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="101.5" y="533.7" font-size="15" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="101.5" dy="0">Traza más corta</tspan></text><rect x="215" y="499" width="124" height="61" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x