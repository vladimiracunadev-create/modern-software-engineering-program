<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cómo decidir dónde trazar la frontera</title><desc id="d">Árbol de decisión: según si el equipo controla, puede influir o solo puede observar una dependencia, la frontera incorpora su modelo, su contrato o su monitoreo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="900" height="470" fill="#ffffff"/><rect x="300" y="14" width="300" height="50" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="450" y="33.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="450" dy="0">Quiero explicar un resultado o un</tspan></text><text x="450" y="51.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="450" dy="0">fallo concreto</tspan></text><polyline points="450,64 450,96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="270" y="96" width="360" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="450" y="119.96" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="450" dy="0">¿La causa está en algo que el equipo</tspan></text><text x="450" y="137.88" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="450" dy="0">controla directamente?</tspan></text><polyline points="270,125 150,125 150,190" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="205" y="117" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="205" dy="0">sí</tspan></text><polyline points="630,125 750,125 750,190" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="695" y="117" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="695" dy="0">no</tspan></text><rect x="30" y="190" width="240" height="92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="150" y="214.68" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="150" dy="0">Modela el componente en</tspan></text><text x="150" y="231.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="150" dy="0">detalle: responsabilidades,</tspan></text><text x="150" y="247.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="150" dy="0">interfaces y señales de falla</tspan></text><text x="150" y="264.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="150" dy="0">propias</tspan></text><rect x="630" y="190" width="240" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="750" y="206" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="750" dy="0">¿Se puede influir por</tspan></text><text x="750" y="222.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="750" dy="0">contrato, regulación o</tspan></text><text x="750" y="239.28" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="750" dy="0">colaboración?</tspan></text><polyline points="690,248 690,292 560,292" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="675" y="276" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="675" dy="0">sí</tspan></text><polyline points="810,248 810,292" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="826" y="276" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="826" dy="0">no</tspan></text><rect x="330" y="262" width="230" height="100" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="445" y="290.68" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="445" dy="0">Incluye el contrato: qué se</tspan></text><text x="445" y="307.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="445" dy="0">espera, cómo se detecta la</tspan></text><text x="445" y="323.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="445" dy="0">degradación y a quién se</tspan></text><text x="445" y="340.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="445" dy="0">escala</tspan></text><rect x="690" y="292" width="190" height="84" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="785" y="312.68" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="785" dy="0">Monitorea y comunica:</tspan></text><text x="785" y="329.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="785" dy="0">declara la dependencia</tspan></text><text x="785" y="345.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="785" dy="0">y planifica la</tspan></text><text x="785" y="362.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="785" dy="0">respuesta local</tspan></text><rect x="40" y="392" width="820" height="60" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="450" y="417.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="450" dy="0">Prueba de suficiencia: cada flecha cruzada debe poder responder qué viaja, cuándo, en qué estado, quién</tspan></text><text x="450" y="433.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="450" dy="0">confirma y qué ocurre si no responde. Si no puede, la frontera aún es una caja negra.</tspan></text></svg>
