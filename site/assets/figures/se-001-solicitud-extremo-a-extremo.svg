<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una solicitud de matrícula recorre cinco actores</title><desc id="d">Diagrama de secuencia: el portal responde 200 OK antes de que el cupo esté reservado y el pago confirmado. El pago devuelve una respuesta incierta y el portal debe publicar un estado consultable.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="900" height="560" fill="#ffffff"/><rect x="20" y="14" width="140" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="90" y="39.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="90" dy="0">Estudiante</tspan></text><line x1="90" y1="58" x2="90" y2="540" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="200" y="14" width="140" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="270" y="39.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="270" dy="0">Portal</tspan></text><line x1="270" y1="58" x2="270" y2="540" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="390" y="14" width="140" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="460" y="31.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="460" dy="0">Reglas y</tspan></text><text x="460" y="47.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="460" dy="0">secretaría</tspan></text><line x1="460" y1="58" x2="460" y2="540" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="590" y="14" width="140" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="660" y="39.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="660" dy="0">Cupos (heredado)</tspan></text><line x1="660" y1="58" x2="660" y2="540" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="750" y="14" width="140" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="820" y="39.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="820" dy="0">Pagos</tspan></text><line x1="820" y1="58" x2="820" y2="540" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><polyline points="90,96 270,96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="180" y="90" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="180" dy="0">1 solicitar matrícula</tspan></text><polyline points="270,150 90,150" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="180" y="144" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="180" dy="0">2 «200 OK: recibido»</tspan></text><polyline points="270,204 460,204" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="365" y="198" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="365" dy="0">3 validar elegibilidad</tspan></text><polyline points="460,258 660,258" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="560" y="252" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="560" dy="0">4 reservar cupo (hasta 15 min)</tspan></text><polyline points="270,312 820,312" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="560" y="306" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="560" dy="0">5 cobrar</tspan></text><polyline points="820,366 270,366" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><text x="560" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="560" dy="0">6 sin respuesta (tiempo agotado)</tspan></text><polyline points="270,440 90,440" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="180" y="434" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="180" dy="0">7 «pendiente de conciliación» + código de consulta</tspan></text><rect x="30" y="482" width="840" height="62" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="450" y="508.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">Lectura: el 200 OK del paso 2 es evidencia de una pieza. La matrícula solo existe cuando 3, 4 y 5 concluyen. Si</tspan></text><text x="450" y="524.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">el paso 6 falla, el sistema debe decir la verdad (7), no fingir éxito ni cobrar dos veces.</tspan></text></svg>
