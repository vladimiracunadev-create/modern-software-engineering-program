<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Canales de coordinación frente a capacidad lineal</title><desc id="d">Gráfico de barras: con n personas hay n(n-1)/2 pares posibles de comunicación (1 con 2 personas, 6 con 4, 66 con 12), mientras la capacidad de trabajo separable crece de forma lineal.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="900" height="420" fill="#ffffff"/><line x1="70" y1="340" x2="560" y2="340" stroke="#32505f" stroke-width="1.8"/><line x1="70" y1="40" x2="70" y2="340" stroke="#32505f" stroke-width="1.8"/><text x="60" y="46" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="60" dy="0">pares</tspan></text><rect x="84" y="335.9" width="30" height="4.1" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="99" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="99" dy="0">2</tspan></text><text x="99" y="327.9" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="99" dy="0">1</tspan></text><rect x="127" y="327.7" width="30" height="12.3" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="142" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="142" dy="0">3</tspan></text><rect x="170" y="315.4" width="30" height="24.6" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="185" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="185" dy="0">4</tspan></text><text x="185" y="307.4" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="185" dy="0">6</tspan></text><rect x="213" y="299" width="30" height="41" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="228" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="228" dy="0">5</tspan></text><rect x="256" y="278.5" width="30" height="61.5" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="271" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="271" dy="0">6</tspan></text><rect x="299" y="253.9" width="30" height="86.1" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="314" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="314" dy="0">7</tspan></text><rect x="342" y="225.2" width="30" height="114.8" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="357" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">8</tspan></text><text x="357" y="217.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="357" dy="0">28</tspan></text><rect x="385" y="192.4" width="30" height="147.6" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="400" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="400" dy="0">9</tspan></text><rect x="428" y="155.5" width="30" height="184.5" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="443" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="443" dy="0">10</tspan></text><rect x="471" y="114.5" width="30" height="225.5" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="486" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="486" dy="0">11</tspan></text><rect x="514" y="69.4" width="30" height="270.6" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="529" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="529" dy="0">12</tspan></text><text x="529" y="61.4" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="529" dy="0">66</tspan></text><text x="315" y="384" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="315" dy="0">personas en el equipo (n)</tspan></text><polyline points="99,331.8 142,327.7 185,323.6 228,319.5 271,315.4 314,311.3 357,307.2 400,303.1 443,299 486,294.9 529,290.8" fill="none" stroke="#a8761a" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="96,76 136,76" fill="none" stroke="#a8761a" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="146" y="74" font-size="13" text-anchor="start" font-weight="400" fill="#4a3209"><tspan x="146" dy="0">capacidad si el trabajo fuera totalmente separable</tspan></text><rect x="96" y="100" width="18" height="14" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="122" y="112" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="122" dy="0">pares posibles de comunicación</tspan></text><rect x="600" y="60" width="280" height="130" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="610" y="87.04" font-size="13" text-anchor="start" font-weight="400" fill="#0b3f45"><tspan x="610" dy="0">Lectura: añadir personas aumenta la</tspan></text><text x="610" y="103.68" font-size="13" text-anchor="start" font-weight="400" fill="#0b3f45"><tspan x="610" dy="0">capacidad solo si el trabajo se</tspan></text><text x="610" y="120.32" font-size="13" text-anchor="start" font-weight="400" fill="#0b3f45"><tspan x="610" dy="0">puede dividir. Los pares posibles</tspan></text><text x="610" y="136.96" font-size="13" text-anchor="start" font-weight="400" fill="#0b3f45"><tspan x="610" dy="0">crecen como n(n−1)/2, de modo que</tspan></text><text x="610" y="153.6" font-size="13" text-anchor="start" font-weight="400" fill="#0b3f45"><tspan x="610" dy="0">cada incorporación suma más canales</tspan></text><text x="610" y="170.24" font-size="13" text-anchor="start" font-weight="400" fill="#0b3f45"><tspan x="610" dy="0">que la anterior.</tspan></text><rect x="600" y="210" width="280" height="130" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="610" y="237.04" font-size="13" text-anchor="start" font-weight="400" fill="#4a3209"><tspan x="610" dy="0">Límite: no todos los pares</tspan></text><text x="610" y="253.68" font-size="13" text-anchor="start" font-weight="400" fill="#4a3209"><tspan x="610" dy="0">necesitan hablar. Módulos con</tspan></text><text x="610" y="270.32" font-size="13" text-anchor="start" font-weight="400" fill="#4a3209"><tspan x="610" dy="0">contratos claros reducen los</tspan></text><text x="610" y="286.96" font-size="13" text-anchor="start" font-weight="400" fill="#4a3209"><tspan x="610" dy="0">canales efectivos; por eso la</tspan></text><text x="610" y="303.6" font-size="13" text-anchor="start" font-weight="400" fill="#4a3209"><tspan x="610" dy="0">conclusión es diseñar límites, no</tspan></text><text x="610" y="320.24" font-size="13" text-anchor="start" font-weight="400" fill="#4a3209"><tspan x="610" dy="0">limitar el tamaño del equipo.</tspan></text></svg>
