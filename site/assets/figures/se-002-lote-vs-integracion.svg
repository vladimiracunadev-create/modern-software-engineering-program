<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un lote grande frente a cambios integrados a diario</title><desc id="d">Dos carriles de tiempo. En el carril superior diez cambios se integran al final y un fallo tiene diez sospechosos. En el inferior cada cambio se integra el mismo día y el fallo señala un único cambio.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="900" height="440" fill="#ffffff"/><text x="20" y="40" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">A · Entrega semestral: un lote</tspan></text><line x1="40" y1="130" x2="860" y2="130" stroke="#32505f" stroke-width="1.8"/><rect x="60" y="74" width="44" height="40" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="82" y="97.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="82" dy="0">c1</tspan></text><rect x="112" y="74" width="44" height="40" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="134" y="97.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="134" dy="0">c2</tspan></text><rect x="164" y="74" width="44" height="40" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="186" y="97.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="186" dy="0">c3</tspan></text><rect x="216" y="74" width="44" height="40" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="238" y="97.64" font-size="13" text-anchor="middle" font-w