<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ciclo de vida con bucles de retroalimentación</title><desc id="d">Seis momentos en fila, de concepción a retiro, con tres flechas de retorno: operación informa nuevos requisitos, mantenimiento reabre decisiones de diseño y el retiro devuelve lecciones al inicio.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="500" fill="#ffffff"/><rect x="30" y="150" width="135" height="70" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="97.5" y="188.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="97.5" dy="0">Concepción</tspan></text><rect x="30" y="380" width="135" height="66" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="97.5" y="408.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="97.5" dy="0">¿Debemos</tspan></text><text x="97.5" y="424.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="97.5" dy="0">construir esto?</tspan></text><polyline points="97,220 97,380" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="165,185 180,185" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="180" y="150" width="135" height="70" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="247.5" y="188.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="247.5" dy="0">Realización</tspan></text><rect x="180" y="380" width="135" height="66" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="247.5" y="400" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="247.5" dy="0">¿Es</tspan></text><text x="247.5" y="416.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="247.5" dy="0">reproducible y</tspan></text><text x="247.5" y="433.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="247.5" dy="0">recuperable?</tspan></text><polyline points="247,220 247,380" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="315,185 330,185" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="330" y="150" width="135" height="70" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="397.5" y="188.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="397.5" dy="0">Transición</tspan></text><rect x="330" y="380" width="135" height="66" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="397.5" y="408.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="397.5" dy="0">¿Se puede</tspan></text><text x="397.5" y="424.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="397.5" dy="0">revertir?</tspan></text><polyline points="397,220 397,380" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="465,185 480,185" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="480" y="150" width="135" height="70" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="547.5" y="188.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="547.5" dy="0">Operación</tspan></text><rect x="480" y="380" width="135" height="66" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="547.5" y="400" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="547.5" dy="0">¿Qué señal</tspan></text><text x="547.5" y="416.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="547.5" dy="0">detecta el</tspan></text><text x="547.5" y="433.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="547.5" dy="0">fallo?</tspan></text><polyline points="547,220 547,380" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="615,185 630,185" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="630" y="150" width="135" height="70" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="697.5" y="188.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="697.5" dy="0">Mantenimiento</tspan></text><rect x="630" y="380" width="135" height="66" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="697.5" y="400" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="697.5" dy="0">¿Qué</tspan></text><text x="697.5" y="416.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="697.5" dy="0">compatibilidad</tspan></text><text x="697.5" y="433.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="697.5" dy="0">conservo?</tspan></text><polyline points="697,220 697,380" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="765,185 780,185" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="780" y="150" width="135" height="70" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="847.5" y="188.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="847.5" dy="0">Retiro</tspan></text><rect x="780" y="380" width="135" height="66" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="847.5" y="400" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="847.5" dy="0">¿Qué datos y</tspan></text><text x="847.5" y="416.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="847.5" dy="0">consumidores</tspan></text><text x="847.5" y="433.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="847.5" dy="0">quedan?</tspan></text><polyline points="847,220 847,380" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="547,150 547,108 97,108 97,150" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><text x="322" y="100" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="322" dy="0">señales de operación → nuevos requisitos</tspan></text><polyline points="697,150 697,62 247,62 247,150" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><text x="472" y="54" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">cambios y deuda → decisiones de diseño y pruebas</tspan></text><polyline points="847,150 847,24 97,24 97,150" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><text x="472" y="16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">retiro → criterio de no construir y exportabilidad</tspan></text><text x="480" y="470" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="480" dy="0">Las flechas rojas continuas son bucles: el ciclo no es una cascada de departamentos.</tspan></text><text x="480" y="490" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="480" dy="0">Las flechas punteadas hacia abajo indican la pregunta de control de cada momento.</tspan></text></svg>
