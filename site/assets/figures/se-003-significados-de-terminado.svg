<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" width="940" height="480" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cinco significados de terminado</title><desc id="d">Escalera de cinco peldaños: fusionado, desplegado, liberado, adoptado y resultado logrado. Para cada uno se indica la evidencia que lo demuestra y lo que queda oculto si se declara terminado ahí.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="480" fill="#ffffff"/><text x="40" y="262" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="40" dy="0">Evidencia</tspan></text><text x="40" y="372" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="40" dy="0">Queda oculto si</tspan></text><rect x="40" y="190" width="160" height="50" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="120" y="218.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="120" dy="0">Fusionado</tspan></text><rect x="40" y="270" width="160" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="120" y="305.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="120" dy="0">PR aprobado y</tspan></text><text x="120" y="321.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="120" dy="0">pruebas verdes</tspan></text><rect x="40" y="380" width="160" height="84" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="120" y="400.68" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="120" dy="0">Nadie comprueba que</tspan></text><text x="120" y="417.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="120" dy="0">funciona fuera de</tspan></text><text x="120" y="433.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="120" dy="0">la máquina del</tspan></text><text x="120" y="450.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="120" dy="0">equipo</tspan></text><rect x="216" y="152" width="160" height="88" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="296" y="199.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="296" dy="0">Desplegado</tspan></text><rect x="216" y="270" width="160" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="296" y="297" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="296" dy="0">Versión corriendo</tspan></text><text x="296" y="313.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="296" dy="0">en el entorno</tspan></text><text x="296" y="330.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="296" dy="0">destino</tspan></text><rect x="216" y="380" width="160" height="84" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="296" y="409" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="296" dy="0">Corre, pero tras</tspan></text><text x="296" y="425.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="296" dy="0">una bandera apagada</tspan></text><text x="296" y="442.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="296" dy="0">o sin tráfico</tspan></text><rect x="392" y="114" width="160" height="126" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="472" y="180.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="472" dy="0">Liberado</tspan></text><rect x="392" y="270" width="160" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="472" y="305.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="472" dy="0">Disponible para la</tspan></text><text x="472" y="321.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="472" dy="0">audiencia prevista</tspan></text><rect x="392" y="380" width="160" height="84" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="472" y="400.68" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="472" dy="0">Disponible sin</tspan></text><text x="472" y="417.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="472" dy="0">soporte,</tspan></text><text x="472" y="433.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="472" dy="0">documentación ni</tspan></text><text x="472" y="450.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="472" dy="0">señales</tspan></text><rect x="568" y="76" width="160" height="164" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="648" y="161.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="648" dy="0">Adoptado</tspan></text><rect x="568" y="270" width="160" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="648" y="297" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="648" dy="0">Uso real medido en</tspan></text><text x="648" y="313.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="648" dy="0">las personas</tspan></text><text x="648" y="330.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="648" dy="0">objetivo</tspan></text><rect x="568" y="380" width="160" height="84" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="648" y="409" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="648" dy="0">Se usa, pero no se</tspan></text><text x="648" y="425.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="648" dy="0">logra la tarea o se</tspan></text><text x="648" y="442.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="648" dy="0">abandona</tspan></text><rect x="744" y="38" width="160" height="202" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="824" y="142.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="824" dy="0">Resultado logrado</tspan></text><rect x="744" y="270" width="160" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="824" y="297" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="824" dy="0">El efecto declarado</tspan></text><text x="824" y="313.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="824" dy="0">se mide y se</tspan></text><text x="824" y="330.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="824" dy="0">sostiene</tspan></text><rect x="744" y="380" width="160" height="84" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="824" y="409" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="824" dy="0">Efecto no medido o</tspan></text><text x="824" y="425.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="824" dy="0">con daño en otro</tspan></text><text x="824" y="442.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="824" dy="0">grupo</tspan></text><text x="480" y="30" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="480" dy="0">Cada peldaño exige una evidencia distinta; decir «done» sin elegir uno oculta el trabajo restante.</tspan></text></svg>
