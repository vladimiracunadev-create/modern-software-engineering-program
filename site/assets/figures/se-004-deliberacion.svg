<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="940" height="440" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Secuencia de deliberación y prueba de que cambia el diseño</title><desc id="d">Cinco pasos en secuencia, desde describir la decisión hasta fijar autoridad de parada, seguidos de una compuerta: si ninguna alternativa cambió población, datos, automatización, umbral, supervisión, comunicación o apelación, el análisis fue decoración.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="440" fill="#ffffff"/><rect x="24" y="40" width="170" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="109" y="65.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="109" dy="0">1 Describir</tspan></text><rect x="24" y="96" width="170" height="90" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="109" y="128" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="109" dy="0">Separa observación,</tspan></text><text x="109" y="144.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="109" dy="0">inferencia e</tspan></text><text x="109" y="161.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="109" dy="0">incertidumbre</tspan></text><polyline points="194,62 206,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="206" y="40" width="170" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="291" y="65.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="291" dy="0">2 Afectados</tspan></text><rect x="206" y="96" width="170" height="90" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="291" y="128" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="291" dy="0">Quién gana, quién</tspan></text><text x="291" y="144.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="291" dy="0">carga, quién queda</tspan></text><text x="291" y="161.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="291" dy="0">fuera</tspan></text><polyline points="376,62 388,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="388" y="40" width="170" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="473" y="65.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="473" dy="0">3 Alternativas</tspan></text><rect x="388" y="96" width="170" height="90" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="473" y="136.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="473" dy="0">Incluye la opción de</tspan></text><text x="473" y="152.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="473" dy="0">no proceder</tspan></text><polyline points="558,62 570,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="570" y="40" width="170" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="655" y="65.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="655" dy="0">4 Comparar</tspan></text><rect x="570" y="96" width="170" height="90" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="655" y="111.36" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="655" dy="0">Prevención,</tspan></text><text x="655" y="128" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="655" dy="0">detección,</tspan></text><text x="655" y="144.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="655" dy="0">apelación,</tspan></text><text x="655" y="161.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="655" dy="0">reparación y costo</tspan></text><text x="655" y="177.92" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="655" dy="0">desplazado</tspan></text><polyline points="740,62 752,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="752" y="40" width="170" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="837" y="65.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="837" dy="0">5 Autoridad</tspan></text><rect x="752" y="96" width="170" height="90" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="837" y="128" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="837" dy="0">Quién para, con qué</tspan></text><text x="837" y="144.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="837" dy="0">señal y cuándo se</tspan></text><text x="837" y="161.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="837" dy="0">revisa</tspan></text><rect x="150" y="230" width="640" height="72" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="260.96" font-size="14" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="470" dy="0">Compuerta: ¿cambió población, datos, automatización, umbral, supervisión,</tspan></text><text x="470" y="278.88" font-size="14" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="470" dy="0">comunicación o derecho de apelación?</tspan></text><polyline points="470,186 470,230" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="150,266 60,266 60,340" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="100" y="258" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="100" dy="0">no</tspan></text><polyline points="790,266 880,266 880,340" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="840" y="258" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="840" dy="0">sí</tspan></text><rect x="10" y="340" width="200" height="80" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="110" y="367" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="110" dy="0">Era decoración: lista de</tspan></text><text x="110" y="383.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="110" dy="0">principios sin efecto.</tspan></text><text x="110" y="400.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="110" dy="0">Vuelve al paso 3.</tspan></text><rect x="680" y="340" width="250" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="805" y="367" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="805" dy="0">Decisión gobernada: con</tspan></text><text x="805" y="383.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="805" dy="0">límites, voz, reparación y</tspan></text><text x="805" y="400.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="805" dy="0">condición de parada.</tspan></text><rect x="260" y="340" width="380" height="80" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="450" y="367" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="450" dy="0">Después: monitorear por grupo, revisar casos y</tspan></text><text x="450" y="383.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="450" dy="0">mantener apelación accesible. El caso nunca queda</tspan></text><text x="450" y="400.28" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="450" dy="0">«resuelto éticamente».</tspan></text></svg>
