<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El promedio global oculta a un grupo que empeora</title><desc id="d">Gráfico de barras con datos sintéticos: el tiempo medio de espera baja de 5 a 3,3 días, pero el grupo que estudia y trabaja pasa de 5 a 9 días mientras los otros dos grupos mejoran.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="900" height="440" fill="#ffffff"/><line x1="80" y1="340" x2="600" y2="340" stroke="#32505f" stroke-width="1.8"/><line x1="80" y1="50" x2="80" y2="340" stroke="#32505f" stroke-width="1.8"/><text x="72" y="54" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="72" dy="0">días</tspan></text><rect x="110" y="210" width="52" height="130" rx="3" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><rect x="168" y="288" width="52" height="52" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="136" y="202" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="136" dy="0">5</tspan></text><text x="194" y="280" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="194" dy="0">2</tspan></text><text x="165" y="362" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="165" dy="0">Tiempo completo</tspan><tspan x="165" dy="16.64">(60 %)</tspan></text><rect x="280" y="210" width="52" height="130" rx="3" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><rect x="338" y="262" width="52" height="78" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="306" y="202" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="306" dy="0">5</tspan></text><text x="364" y="254" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="364" dy="0">3</tspan></text><text x="335" y="362" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="335" dy="0">Medio tiempo</tspan><tspan x="335" dy="16.64">(25 %)</tspan></text><rect x="450" y="210" width="52" height="130" rx="3" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><rect x="508" y="106" width="52" height="234" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="476" y="202" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="476" dy="0">5</tspan></text><text x="534" y="98" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="534" dy="0">9</tspan></text><text x="505" y="362" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="505" dy="0">Estudian y trabajan</tspan><tspan x="505" dy="16.64">(15 %)</tspan></text><rect x="630" y="60" width="250" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="755" y="90.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="755" dy="0">Promedio global: de 5 a 3,3</tspan></text><text x="755" y="106.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="755" dy="0">días (0,6·2 + 0,25·3 + 0,15·9)</tspan></text><rect x="630" y="146" width="250" height="96" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="755" y="172.68" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="755" dy="0">Segmento afectado: de 5 a 9</tspan></text><text x="755" y="189.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="755" dy="0">días. Sin apelación ni señal</tspan></text><text x="755" y="205.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="755" dy="0">por grupo, nadie lo ve: el</tspan></text><text x="755" y="222.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="755" dy="0">promedio sí «mejoró».</tspan></text><rect x="630" y="258" width="250" height="78" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="755" y="275.68" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="755" dy="0">Barra gris = antes; barra de</tspan></text><text x="755" y="292.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="755" dy="0">color = después (azul verdoso</tspan></text><text x="755" y="308.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="755" dy="0">mejora, rojo empeora; el número</tspan></text><text x="755" y="325.6" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="755" dy="0">lo confirma).</tspan></text><text x="450" y="410" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">Datos sintéticos de ilustración, no medidos. La regla: decide con la distribución, no solo con el promedio.</tspan></text></svg>
