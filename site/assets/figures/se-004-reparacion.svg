<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Retirar una función no repara el daño ocurrido</title><desc id="d">Línea de tiempo: el daño ocurre en t0. Retirar la función evita daños futuros. La reparación actúa sobre el caso pasado y el aprendizaje rediseña el sistema; son tres acciones distintas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="400" fill="#ffffff"/><line x1="40" y1="150" x2="900" y2="150" stroke="#32505f" stroke-width="2"/><circle cx="120" cy="150" r="12" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="120" y="155" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="120" dy="0">t0</tspan></text><text x="120" y="186" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="120" dy="0">Ocurre el daño</tspan></text><text x="120" y="204" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="120" dy="0">a una persona real</tspan></text><rect x="210" y="40" width="220" height="66" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="320" y="60" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="320" dy="0">Detectar: señal por grupo,</tspan></text><text x="320" y="76.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="320" dy="0">revisión de casos, canal de</tspan></text><text x="320" y="93.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="320" dy="0">queja accesible</tspan></text><polyline points="320,106 320,140" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="450" y="40" width="230" height="66" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="565" y="68.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="565" dy="0">Retirar o suspender la</tspan></text><text x="565" y="84.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="565" dy="0">función: evita casos futuros</tspan></text><rect x="700" y="40" width="210" height="66" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="805" y="76.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="805" dy="0">No repara el caso pasado</tspan></text><polyline points="680,73 700,73" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="210" y="228" width="330" height="100" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="375" y="256.68" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="375" dy="0">Reparar: restaurar la oportunidad,</tspan></text><text x="375" y="273.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="375" dy="0">corregir datos, explicar la decisión,</tspan></text><text x="375" y="289.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="375" dy="0">compensar o permitir revisión humana.</tspan></text><text x="375" y="306.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="375" dy="0">Accesible para quien sufrió el efecto.</tspan></text><rect x="570" y="228" width="340" height="100" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="740" y="265" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="740" dy="0">Aprender: rediseñar población, datos,</tspan></text><text x="740" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="740" dy="0">umbral o supervisión y registrar el cambio</tspan></text><text x="740" y="298.28" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="740" dy="0">para que no se repita.</tspan></text><polyline points="540,278 570,278" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="375,196 375,228" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="470" y="372" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Tres acciones, tres responsables posibles: suspender protege el futuro; reparar atiende el pasado; aprender cambia el sistema.</tspan></text></svg>
