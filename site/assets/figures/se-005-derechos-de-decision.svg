<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Derechos de decisión proporcionales al riesgo</title><desc id="d">Tabla de cuatro decisiones por seis dimensiones: quién propone, decide, revisa de forma independiente, acepta el riesgo, puede detener y cómo se registra el desacuerdo. A mayor impacto e irreversibilidad, más se separan los incentivos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="420" fill="#ffffff"/><rect x="10" y="12" width="190" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="37.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Decisión</tspan></text><rect x="206" y="12" width="118" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="265" y="37.36" font-size="12" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="265" dy="0">Propone</tspan></text><rect x="330" y="12" width="118" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="389" y="37.36" font-size="12" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="389" dy="0">Decide</tspan></text><rect x="454" y="12" width="118" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="513" y="29.68" font-size="12" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="513" dy="0">Revisión</tspan></text><text x="513" y="45.04" font-size="12" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="513" dy