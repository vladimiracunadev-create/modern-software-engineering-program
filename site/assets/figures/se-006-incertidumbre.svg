<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuánta evidencia pedir según reversibilidad e impacto</title><desc id="d">Cuadrícula de dos por dos: reversible o irreversible frente a impacto bajo o alto. Cada cuadrante sugiere una forma de actuar ante la incertidumbre, desde una exposición pequeña observada hasta evidencia fuerte con revisión independiente.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="900" height="470" fill="#ffffff"/><text x="450" y="24" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="450" dy="0">Impacto de equivocarse</tspan></text><text x="285" y="54" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="285" dy="0">Bajo</tspan></text><text x="615" y="54" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="615" dy="0">Alto</tspan></text><text x="40" y="175" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="40" dy="0">Reversible</tspan></text><text x="40" y="335" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="40" dy="0">Irreversible</tspan></text><rect x="110" y="70" width="350" height="150" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="285" y="132" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="285" dy="0">Reversible + bajo: exposición pequeña y</tspan></text><text x="285" y="148.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="285" dy="0">observada. Aprende en producción con una</tspan></text><text x="285" y="165.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="285" dy="0">señal de parada.</tspan></text><rect x="470" y="70" width="350" height="150" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="645" y="132" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="645" dy="0">Reversible + alto: piloto con cohorte</tspan></text><text x="645" y="148.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="645" dy="0">limitada, comparación y parada automática</tspan></text><text x="645" y="165.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="645" dy="0">antes de ampliar.</tspan></text><rect x="110" y="230" width="350" height="150" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="285" y="292" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="285" dy="0">Irreversible + bajo: ensayo previo y revisión</tspan></text><text x="285" y="308.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="285" dy="0">por pares; confirma que de verdad no se puede</tspan></text><text x="285" y="325.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="285" dy="0">revertir.</tspan></text><rect x="470" y="230" width="350" height="150" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="645" y="292" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="645" dy="0">Irreversible + alto: evidencia fuerte,</tspan></text><text x="645" y="308.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="645" dy="0">revisión independiente, umbral alto y</tspan></text><text x="645" y="325.28" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="645" dy="0">autoridad de parada nombrada.</tspan></text><rect x="110" y="396" width="710" height="56" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="465" y="419.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="465" dy="0">Antes de investigar más: ¿cambiar este supuesto cambia la opción preferida? Si no, el dato</tspan></text><text x="465" y="435.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="465" dy="0">adicional no vale su costo.</tspan></text></svg>
