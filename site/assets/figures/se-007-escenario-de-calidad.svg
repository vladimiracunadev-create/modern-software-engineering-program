<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Anatomía de un escenario de calidad con un ejemplo completo</title><desc id="d">Seis elementos del escenario: fuente, estímulo, entorno, artefacto, respuesta y medida, rellenados con el ejemplo de la confirmación repetida durante la apertura de matrícula.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="430" fill="#ffffff"/><rect x="10" y="70" width="940" height="230" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="24" y="92" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="24" dy="0">Entorno: apertura de matrícula, 2.000 sesiones, conectividad móvil inestable</tspan></text><rect x="30" y="130" width="210" height="50" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="135" y="158.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="135" dy="0">1 Fuente</tspan></text><rect x="30" y="186" width="210" height="100" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="135" y="231.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="135" dy="0">Estudiante con conexión</tspan></text><text x="135" y="247.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="135" dy="0">intermitente</tspan></text><rect x="270" y="130" width="210" height="50" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="375" y="158.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="375" dy="0">2 Estímulo</tspan></text><rect x="270" y="186" width="210" height="100" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="375" y="231.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="375" dy="0">Repite la confirmación con</tspan></text><text x="375" y="247.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="375" dy="0">la misma clave</tspan></text><rect x="510" y="130" width="200" height="50" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="610" y="158.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="610" dy="0">4 Artefacto</tspan></text><rect x="510" y="186" width="200" height="100" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="610" y="231.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="610" dy="0">Servicio de confirmación</tspan></text><text x="610" y="247.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="610" dy="0">de matrícula</tspan></text><rect x="735" y="130" width="205" height="50" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="837.5" y="158.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="837.5" dy="0">5 Respuesta</tspan></text><rect x="735" y="186" width="205" height="100" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="837.5" y="214.68" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="837.5" dy="0">Conserva un único cupo;</tspan></text><text x="837.5" y="231.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="837.5" dy="0">muestra estado</tspan></text><text x="837.5" y="247.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="837.5" dy="0">comprensible; permite</tspan></text><text x="837.5" y="264.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="837.5" dy="0">consultarlo después</tspan></text><polyline points="240,155 270,155" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="480,155 510,155" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="710,155 735,155" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="480" y="56" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="480" dy="0">3 Entorno (recuadro)</tspan></text><rect x="30" y="320" width="900" height="90" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="352" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">6 Medida: cero cupos duplicados en reintentos; estado visible en ≤ 10 s para el percentil que se declare; la persona</tspan></text><text x="480" y="368.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">recupera su confirmación sin reiniciar. Los umbrales se justifican por necesidad, historial o prueba con personas, no</tspan></text><text x="480" y="385.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">por copiar un número común.</tspan></text></svg>
