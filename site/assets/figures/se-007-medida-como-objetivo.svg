<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuando una medida se convierte en objetivo</title><desc id="d">Gráfico de líneas con datos sintéticos en índice 100: el tiempo de finalización baja de forma sostenida durante seis sprints mientras el abandono sube. Sin un guardrail, la mejora del indicador oculta el daño.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="900" height="430" fill="#ffffff"/><line x1="80" y1="320" x2="640" y2="320" stroke="#32505f" stroke-width="1.8"/><line x1="80" y1="50" x2="80" y2="320" stroke="#32505f" stroke-width="1.8"/><text x="70" y="54" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="70" dy="0">índice</tspan></text><polyline points="120,223.846 220,239.231 320,252.692 420,266.154 520,281.538 620,293.077" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="120,223.846 220,216.154 320,195 420,164.231 520,127.692 620,85.3846" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-coral)"/><circle cx="120" cy="223.846" r="12" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="120" y="228.846" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="120" dy="0"></tspan></text><circle cx="220" cy="239.231" r="12" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="220" y="244.231" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="220" dy="0"></tspan></text><circle cx="320" cy="252.692" r="12" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="320" y="257.692" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="320" dy="0"></tspan></text><circle cx="420" cy="266.154" r="12" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="420" y="271.154" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="420" dy="0"></tspan></text><circle cx="520" cy="281.538" r="12" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="520" y="286.538" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="520" dy="0"></tspan></text><circle cx="620" cy="293.077" r="12" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="620" y="298.077" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="620" dy="0"></tspan></text><rect x="112" y="215.846" width="16" height="16" rx="2" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><rect x="212" y="208.154" width="16" height="16" rx="2" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><rect x="312" y="187" width="16" height="16" rx="2" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><rect x="412" y="156.231" width="16" height="16" rx="2" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><rect x="512" y="119.692" width="16" height="16" rx="2" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><rect x="612" y="77.3846" width="16" height="16" rx="2" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="120" y="342" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="120" dy="0">S0</tspan></text><text x="220" y="342" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="220" dy="0">S1</tspan></text><text x="320" y="342" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="320" dy="0">S2</tspan></text><text x="420" y="342" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="420" dy="0">S3</tspan></text><text x="520" y="342" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="520" dy="0">S4</tspan></text><text x="620" y="342" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="620" dy="0">S5</tspan></text><text x="646" y="297.077" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="646" dy="0">tiempo 64</tspan></text><text x="646" y="89.3846" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14"><tspan x="646" dy="0">abandono 172</tspan></text><rect x="690" y="60" width="190" height="100" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="785" y="88.68" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="785" dy="0">Línea continua con</tspan></text><text x="785" y="105.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="785" dy="0">círculos: tiempo de</tspan></text><text x="785" y="121.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="785" dy="0">finalización (el</tspan></text><text x="785" y="138.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="785" dy="0">objetivo).</tspan></text><rect x="690" y="176" width="190" height="100" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="785" y="213" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="785" dy="0">Línea discontinua con</tspan></text><text x="785" y="229.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="785" dy="0">cuadrados: abandono (el</tspan></text><text x="785" y="246.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="785" dy="0">guardrail).</tspan></text><rect x="690" y="292" width="190" height="90" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="785" y="332.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="785" dy="0">Sprint 0 = 100. Datos</tspan></text><text x="785" y="348.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="785" dy="0">sintéticos, no medidos.</tspan></text><text x="380" y="400" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="380" dy="0">Si se optimiza una sola señal, las personas y el sistema se adaptan: añade guardrails y revisa distribución.</tspan></text></svg>
