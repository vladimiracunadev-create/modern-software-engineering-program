<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Anatomía de un riesgo y dónde actúa cada tipo de control</title><desc id="d">Línea de tiempo de causa, evento y consecuencia con cuatro tipos de control: la mitigación actúa antes del evento, la detección y la contingencia después, y la transferencia financiera no repara la consecuencia no financiera.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="440" fill="#ffffff"/><rect x="20" y="150" width="230" height="90" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="135" y="182" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="135" dy="0">Causa: reserva y pago se</tspan></text><text x="135" y="198.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="135" dy="0">confirman en sistemas</tspan></text><text x="135" y="215.28" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="135" dy="0">distintos</tspan></text><rect x="365" y="150" width="230" height="90" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="182" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="480" dy="0">Evento: una demora del</tspan></text><text x="480" y="198.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="480" dy="0">proveedor libera un cupo ya</tspan></text><text x="480" y="215.28" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="480" dy="0">cobrado</tspan></text><rect x="710" y="150" width="230" height="90" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="825" y="182" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="825" dy="0">Consecuencia: reparación</tspan></text><text x="825" y="198.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="825" dy="0">manual y una persona sin</tspan></text><text x="825" y="215.28" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="825" dy="0">cupo pagado</tspan></text><polyline points="250,195 365,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="307" y="187" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="307" dy="0">puede producir</tspan></text><polyline points="595,195 710,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="652" y="187" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">provoca</tspan></text><rect x="20" y="30" width="330" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="185" y="52" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="185" dy="0">Mitigación (antes): reduce probabilidad o</tspan></text><text x="185" y="68.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="185" dy="0">impacto. Ej.: reserva con clave</tspan></text><text x="185" y="85.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="185" dy="0">idempotente</tspan></text><polyline points="185,100 185,150" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="380" y="30" width="200" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="60.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Detección: señales del</tspan></text><text x="480" y="76.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">evento (observabilidad)</tspan></text><polyline points="480,100 480,150" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="380" y="290" width="200" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="480" y="317" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">Contingencia (después):</tspan></text><text x="480" y="333.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">conciliar, avisar y</tspan></text><text x="480" y="350.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">reasignar el cupo</tspan></text><polyline points="480,240 480,290" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="710" y="290" width="230" height="80" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="825" y="317" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="825" dy="0">Transferencia: cubre el</tspan></text><text x="825" y="333.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="825" dy="0">costo financiero, no repara</tspan></text><text x="825" y="350.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="825" dy="0">el acceso ni la confianza</tspan></text><polyline points="825,240 825,290" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="480" y="412" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="480" dy="0">Nombrar el tipo de control evita prometer más de lo que hace: observar no reduce la probabilidad.</tspan></text></svg>
