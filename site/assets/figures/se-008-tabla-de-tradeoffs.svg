<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Trade-offs entre tres opciones de reserva de cupos</title><desc id="d">Tabla cualitativa de tres opciones por seis atributos, con símbolos: alto, medio o bajo. La reserva temporal conserva experiencia rápida con estado honesto, a costa de relojes, idempotencia y recuperación.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="440" fill="#ffffff"/><rect x="10" y="12" width="248" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="134" y="38.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="134" dy="0">Atributo</tspan></text><rect x="262" y="12" width="208" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="366" y="30.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="366" dy="0">Confirmación síncrona</tspan></text><text x="366" y="46.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="366" dy="0">central</tspan></text><rect x="474" y="12" width="228" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="588" y="30.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="588" dy="0">Reserva temporal con</tspan></text><text x="588" y="46.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="588" dy="0">expiración</tspan></text><rect x="706" y="12" width="248" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="830" y="30.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="830" dy="0">Aceptación asincrónica y</tspan></text><text x="830" y="46.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="830" dy="0">conciliación</tspan></text><rect x="10" y="64" width="248" height="46" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="134" y="90.64" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="134" dy="0">Verdad visible al instante</tspan></text><rect x="262" y="64" width="208" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="366" y="90.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="366" dy="0">▲ alta</tspan></text><rect x="474" y="64" width="228" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="588" y="90.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="588" dy="0">▬ media</tspan></text><rect x="706" y="64" width="248" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="830" y="90.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">▼ baja</tspan></text><rect x="10" y="116" width="248" height="46" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="134" y="142.64" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="134" dy="0">Latencia percibida</tspan></text><rect x="262" y="116" width="208" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="366" y="142.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="366" dy="0">▼ alta espera</tspan></text><rect x="474" y="116" width="228" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="588" y="142.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="588" dy="0">▬ breve</tspan></text><rect x="706" y="116" width="248" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="830" y="142.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">▲ inmediata</tspan></text><rect x="10" y="168" width="248" height="46" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="134" y="194.64" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="134" dy="0">Dependencia de un solo punto</tspan></text><rect x="262" y="168" width="208" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="366" y="194.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="366" dy="0">▲ concentrada</tspan></text><rect x="474" y="168" width="228" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="588" y="194.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="588" dy="0">▬ moderada</tspan></text><rect x="706" y="168" width="248" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="830" y="194.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">▼ absorbe picos</tspan></text><rect x="10" y="220" width="248" height="46" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="134" y="246.64" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="134" dy="0">Complejidad operativa</tspan></text><rect x="262" y="220" width="208" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="366" y="246.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="366" dy="0">▼ baja</tspan></text><rect x="474" y="220" width="228" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="588" y="246.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="588" dy="0">▲ relojes e idempotencia</tspan></text><rect x="706" y="220" width="248" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="830" y="246.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">▲ conciliación</tspan></text><rect x="10" y="272" width="248" height="46" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="134" y="298.64" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="134" dy="0">Honestidad ante la persona</tspan></text><rect x="262" y="272" width="208" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="366" y="298.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="366" dy="0">▲ clara</tspan></text><rect x="474" y="272" width="228" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="588" y="298.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="588" dy="0">▲ estado consultable</tspan></text><rect x="706" y="272" width="248" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="830" y="290.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">▼ riesgo si se comunica como</tspan></text><text x="830" y="306.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">confirmación</tspan></text><rect x="10" y="324" width="248" height="46" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="134" y="350.64" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="134" dy="0">Reversibilidad</tspan></text><rect x="262" y="324" width="208" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="366" y="350.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="366" dy="0">▬ media</tspan></text><rect x="474" y="324" width="228" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="588" y="350.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="588" dy="0">▲ expira sola</tspan></text><rect x="706" y="324" width="248" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="830" y="350.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">▬ requiere compensación</tspan></text><text x="480" y="400" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="480" dy="0">▲ favorece el atributo · ▬ intermedio · ▼ lo perjudica o exige más. La columna central se eligió: condición dura, no comunicar</tspan></text><text x="480" y="420" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="480" dy="0">matrícula definitiva antes de confirmarla. Reabrir si las compensaciones superan el umbral o cambia el contrato del proveedor.</tspan></text></svg>
