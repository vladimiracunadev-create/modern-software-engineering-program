<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Efecto rebote: más eficiente por transacción, más consumo total</title><desc id="d">Gráfico de barras con datos sintéticos en índice 100. El costo por transacción baja a 60, el número de transacciones sube a 220 y el consumo total sube a 132.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="900" height="420" fill="#ffffff"/><line x1="80" y1="330" x2="600" y2="330" stroke="#32505f" stroke-width="1.8"/><line x1="80" y1="40" x2="80" y2="330" stroke="#32505f" stroke-width="1.8"/><text x="72" y="44" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="72" dy="0">índice</tspan></text><rect x="110" y="210" width="52" height="120" rx="3" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><rect x="168" y="258" width="52" height="72" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="136" y="202" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="136" dy="0">100</tspan></text><text x="194" y="250" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="194" dy="0">60</tspan></text><text x="165" y="352" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="165" dy="0">Costo por transacción</tspan></text><rect x="280" y="210" width="52" height="120" rx="3" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><rect x="338" y="66" width="52" height="264" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="306" y="202" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="306" dy="0">100</tspan></text><text x="364" y="58" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="364" dy="0">220</tspan></text><text x="335" y="352" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="335" dy="0">Número de transacciones</tspan></text><rect x="450" y="210" width="52" height="120" rx="3" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><rect x="508" y="171.6" width="52" height="158.4" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="476" y="202" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="476" dy="0">100</tspan></text><text x="534" y="163.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="534" dy="0">132</tspan></text><text x="505" y="352" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="505" dy="0">Consumo total</tspan></text><rect x="640" y="60" width="240" height="100" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="760" y="97" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="760" dy="0">Cada transacción es 40 % más</tspan></text><text x="760" y="113.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="760" dy="0">barata, pero se hacen 2,2</tspan></text><text x="760" y="130.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="760" dy="0">veces más: 0,6 × 2,2 = 1,32.</tspan></text><rect x="640" y="178" width="240" height="100" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="760" y="206.68" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="760" dy="0">Barra gris = antes (índice</tspan></text><text x="760" y="223.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="760" dy="0">100). Barra de color =</tspan></text><text x="760" y="239.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="760" dy="0">después; el número confirma el</tspan></text><text x="760" y="256.6" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="760" dy="0">sentido.</tspan></text><rect x="640" y="296" width="240" height="90" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="760" y="319.68" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="760" dy="0">La optimización local no</tspan></text><text x="760" y="336.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="760" dy="0">garantiza reducir el total:</tspan></text><text x="760" y="352.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="760" dy="0">mide volumen y conducta dentro</tspan></text><text x="760" y="369.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="760" dy="0">de la frontera.</tspan></text><text x="340" y="398" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="340" dy="0">Datos sintéticos de ilustración; no son mediciones.</tspan></text></svg>
