<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 450" width="940" height="450" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres escalas de impacto de una decisión de software</title><desc id="d">Tres filas: impacto directo, habilitado y sistémico. Para cada una se indican ejemplos, cómo se observa y qué decisión de diseño cambia.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="450" fill="#ffffff"/><text x="20" y="34" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">Escala</tspan></text><text x="160" y="34" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="160" dy="0">Ejemplo</tspan></text><text x="500" y="34" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="500" dy="0">Cómo se observa</tspan></text><text x="730" y="34" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="730" dy="0">Qué cambia en el diseño</tspan></text><rect x="20" y="46" width="130" height="108" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="85" y="103.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="85" dy="0">Directo</tspan></text><rect x="160" y="46" width="330" height="108" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="325" y="87" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="325" dy="0">Construir y operar: cómputo, red,</tspan></text><text x="325" y="103.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="325" dy="0">almacenamiento, dispositivos y trabajo</tspan></text><text x="325" y="120.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="325" dy="0">humano</tspan></text><rect x="500" y="46" width="220" height="108" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="610" y="87" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="610" dy="0">Se mide con consumo y horas</tspan></text><text x="610" y="103.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="610" dy="0">dentro de una frontera</tspan></text><text x="610" y="120.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="610" dy="0">declarada</tspan></text><rect x="730" y="46" width="200" height="108" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="830" y="87" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">Imágenes livianas,</tspan></text><text x="830" y="103.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">retención acotada,</tspan></text><text x="830" y="120.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">guardias rotativas</tspan></text><rect x="20" y="166" width="130" height="108" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="85" y="223.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="85" dy="0">Habilitado</tspan></text><rect x="160" y="166" width="330" height="108" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="325" y="207" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="325" dy="0">Cambios de conducta que el software</tspan></text><text x="325" y="223.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="325" dy="0">facilita: menos viajes, o más consumo</tspan></text><text x="325" y="240.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="325" dy="0">inducido</tspan></text><rect x="500" y="166" width="220" height="108" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="610" y="215.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="610" dy="0">Se hipotetiza y se</tspan></text><text x="610" y="231.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="610" dy="0">monitorea; no se asume</tspan></text><rect x="730" y="166" width="200" height="108" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="830" y="207" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">Medir volumen total, no</tspan></text><text x="830" y="223.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">solo costo por</tspan></text><text x="830" y="240.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">transacción</tspan></text><rect x="20" y="286" width="130" height="108" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="85" y="343.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="85" dy="0">Sistémico</tspan></text><rect x="160" y="286" width="330" height="108" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="325" y="335.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="325" dy="0">Efectos acumulados: el canal digital se</tspan></text><text x="325" y="351.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="325" dy="0">vuelve la única vía y cierra alternativas</tspan></text><rect x="500" y="286" width="220" height="108" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="610" y="327" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="610" dy="0">Se observan señales por</tspan></text><text x="610" y="343.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="610" dy="0">grupo y se consulta a</tspan></text><text x="610" y="360.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="610" dy="0">quienes cargan el cambio</tspan></text><rect x="730" y="286" width="200" height="108" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="830" y="327" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">Mantener una ruta</tspan></text><text x="830" y="343.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">alternativa con el mismo</tspan></text><text x="830" y="360.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">plazo</tspan></text><text x="470" y="430" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Un análisis responsable formula hipótesis sobre lo habilitado y lo sistémico; no inventa certeza.</tspan></text></svg>
