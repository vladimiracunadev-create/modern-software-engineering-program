<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cadena de sustitución: la edición cambia lo que significa citar</title><desc id="d">Dos líneas de tiempo. ISO/IEC 25010 pasó de un solo documento de 2011 con producto y calidad en uso a dos documentos en 2023. RFC 7231, de 2014, fue reemplazado por RFC 9110, de 2022.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="400" fill="#ffffff"/><text x="20" y="34" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">Estándar ISO</tspan></text><line x1="40" y1="90" x2="900" y2="90" stroke="#32505f" stroke-width="2"/><circle cx="160" cy="90" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="160" y="95" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="160" dy="0">A</tspan></text><text x="160" y="124" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="160" dy="0">2011</tspan></text><rect x="40" y="140" width="240" height="78" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="160" y="166" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="160" dy="0">ISO/IEC 25010:2011: modelos de</tspan></text><text x="160" y="182.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="160" dy="0">calidad del producto y de</tspan></text><text x="160" y="199.28" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="160" dy="0">calidad en uso en un documento</tspan></text><circle cx="660" cy="90" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="660" y="95" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="660" dy="0">B</tspan></text><text x="660" y="124" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="660" dy="0">2023</tspan></text><rect x="470" y="140" width="220" height="78" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="580" y="174.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="580" dy="0">ISO/IEC 25010:2023: solo</tspan></text><text x="580" y="190.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="580" dy="0">calidad del producto</tspan></text><rect x="700" y="140" width="220" height="78" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="810" y="174.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="810" dy="0">ISO/IEC 25019:2023: calidad</tspan></text><text x="810" y="190.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="810" dy="0">en uso</tspan></text><polyline points="280,90 630,90" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="455" y="80" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="455" dy="0">se reorganiza</tspan></text><text x="20" y="262" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">Especificación HTTP</tspan></text><line x1="40" y1="292" x2="900" y2="292" stroke="#32505f" stroke-width="2"/><circle cx="160" cy="292" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="160" y="297" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="160" dy="0">C</tspan></text><text x="160" y="326" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="160" dy="0">2014</tspan></text><rect x="40" y="340" width="240" height="50" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="160" y="368.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="160" dy="0">RFC 7231 (HTTP/1.1 semántica)</tspan></text><circle cx="660" cy="292" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="660" y="297" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="660" dy="0">D</tspan></text><text x="660" y="326" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="660" dy="0">2022</tspan></text><rect x="470" y="340" width="330" height="50" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="635" y="360.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="635" dy="0">RFC 9110 (HTTP semántica): obsoleta a RFC</tspan></text><text x="635" y="376.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="635" dy="0">7231</tspan></text><polyline points="280,292 630,292" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="455" y="282" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="455" dy="0">obsoletado por</tspan></text></svg>
