<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La cadena afirmación a límite aplicada a «Campus Abierto cumple ISO 25010»</title><desc id="d">Seis pasos, cada uno con el ejemplo del caso conductor: la afirmación original se divide en preguntas, se localiza la fuente y su edición, se lee el pasaje visible y se declara qué no demuestra.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="520" fill="#ffffff"/><rect x="20" y="20" width="210" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="125" y="56.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="125" dy="0">1 Afirmación</tspan></text><rect x="244" y="20" width="690" height="66" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="589" y="56.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="589" dy="0">«Cumplimos ISO 25010» (sin edición, alcance ni evidencia)</tspan></text><polyline points="125,86 125,102" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="102" width="210" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="125" y="138.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="125" dy="0">2 Pregunta</tspan></text><rect x="244" y="102" width="690" height="66" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="589" y="138.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="589" dy="0">¿Qué modelo, qué características, qué escenarios y medidas, y quién afirma conformidad?</tspan></text><polyline points="125,168 125,184" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="184" width="210" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="125" y="220.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="125" dy="0">3 Fuente candidata</tspan></text><rect x="244" y="184" width="690" height="66" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="589" y="220.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="589" dy="0">Ficha oficial de ISO/IEC 25010:2023; ISO/IEC 25019:2023 para calidad en uso</tspan></text><polyline points="125,250 125,266" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="266" width="210" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="125" y="302.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="125" dy="0">4 Versión y autoridad</tspan></text><rect x="244" y="266" width="690" height="66" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="589" y="302.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="589" dy="0">Edición 2023; ISO tiene autoridad sobre el modelo, no sobre nuestra evaluación</tspan></text><polyline points="125,332 125,348" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="348" width="210" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="125" y="375.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="125" dy="0">5 Pasaje e</tspan></text><text x="125" y="393.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="125" dy="0">interpretación</tspan></text><rect x="244" y="348" width="690" height="66" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="589" y="384.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="589" dy="0">La ficha confirma nombre, edición y alcance general; el equipo eligió escenarios y umbrales</tspan></text><polyline points="125,414 125,430" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="430" width="210" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="125" y="466.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="125" dy="0">6 Límite</tspan></text><rect x="244" y="430" width="690" height="66" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="589" y="458.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="589" dy="0">Revisión interna de fiabilidad, desempeño y compatibilidad; no es certificación ni calidad</tspan></text><text x="589" y="474.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="589" dy="0">en uso</tspan></text><text x="480" y="514" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="480" dy="0">Cada paso omitido convierte la cita en eslogan: otra persona debe poder hallar el soporte sin adivinar.</tspan></text></svg>
