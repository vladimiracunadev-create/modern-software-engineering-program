<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué puede y qué no puede sostener cada tipo de fuente</title><desc id="d">Tabla de cuatro tipos de fuente (estándar, especificación, documentación oficial y artículo o libro) con lo que sostienen bien, lo que no sostienen y su riesgo típico.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="440" fill="#ffffff"/><rect x="10" y="12" width="150" height="40" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><rect x="166" y="12" width="190" height="40" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="261" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="261" dy="0">Estándar</tspan></text><rect x="362" y="12" width="190" height="40" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="457" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="457" dy="0">Especificación</tspan></text><rect x="558" y="12" width="190" height="40" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="653" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="653" dy="0">Documentación oficial</tspan></text><rect x="754" y="12" width="190" height="40" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="849" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="849" dy="0">Artículo o libro</tspan></text><rect x="10" y="60" width="150" height="102" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="85" y="114.64" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="85" dy="0">Sostiene bien</tspan></text><rect x="166" y="60" width="190" height="102" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="261" y="98" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="261" dy="0">Vocabulario, modelos y</tspan></text><text x="261" y="114.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="261" dy="0">requisitos consensuados</tspan></text><text x="261" y="131.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="261" dy="0">en un alcance</tspan></text><rect x="362" y="60" width="190" height="102" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="457" y="106.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="457" dy="0">Contrato preciso e</tspan></text><text x="457" y="122.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="457" dy="0">interoperabilidad</tspan></text><rect x="558" y="60" width="190" height="102" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="653" y="98" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="653" dy="0">Comportamiento</tspan></text><text x="653" y="114.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="653" dy="0">soportado de una</tspan></text><text x="653" y="131.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="653" dy="0">versión</tspan></text><rect x="754" y="60" width="190" height="102" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="849" y="98" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="849" dy="0">Método, datos y</tspan></text><text x="849" y="114.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="849" dy="0">discusión; explicación</tspan></text><text x="849" y="131.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="849" dy="0">conectada</tspan></text><rect x="10" y="170" width="150" height="102" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="85" y="224.64" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="85" dy="0">No sostiene</tspan></text><rect x="166" y="170" width="190" height="102" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="261" y="216.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="261" dy="0">El umbral adecuado para</tspan></text><text x="261" y="232.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="261" dy="0">tu producto</tspan></text><rect x="362" y="170" width="190" height="102" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="457" y="216.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="457" dy="0">Cómo lo implementa tu</tspan></text><text x="457" y="232.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="457" dy="0">sistema</tspan></text><rect x="558" y="170" width="190" height="102" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="653" y="208" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="653" dy="0">Comparaciones</tspan></text><text x="653" y="224.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="653" dy="0">imparciales con</tspan></text><text x="653" y="241.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="653" dy="0">alternativas</tspan></text><rect x="754" y="170" width="190" height="102" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="849" y="216.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="849" dy="0">Que el resultado valga</tspan></text><text x="849" y="232.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="849" dy="0">en tu contexto</tspan></text><rect x="10" y="280" width="150" height="102" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="85" y="334.64" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="85" dy="0">Riesgo típico</tspan></text><rect x="166" y="280" width="190" height="102" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="261" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="261" dy="0">Citar la ficha pública</tspan></text><text x="261" y="334.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="261" dy="0">como si fuera la</tspan></text><text x="261" y="351.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="261" dy="0">cláusula</tspan></text><rect x="362" y="280" width="190" height="102" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="457" y="326.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="457" dy="0">Copiar una frase sin su</tspan></text><text x="457" y="342.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="457" dy="0">condición o excepción</tspan></text><rect x="558" y="280" width="190" height="102" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="653" y="326.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="653" dy="0">Autoridad confundida</tspan></text><text x="653" y="342.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="653" dy="0">con adecuación</tspan></text><rect x="754" y="280" width="190" height="102" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="849" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="849" dy="0">Fuente secundaria usada</tspan></text><text x="849" y="334.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="849" dy="0">para afirmar</tspan></text><text x="849" y="351.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="849" dy="0">conformidad</tspan></text><text x="480" y="410" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="480" dy="0">La selección se basa en aptitud para la afirmación, no en prestigio general: se prefiere la fuente más próxima capaz de sostenerla.</tspan></text><text x="480" y="430" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="480" dy="0">Si el estándar completo es de pago y solo se vio la ficha, se cita la ficha únicamente para metadatos visibles.</tspan></text></svg>
