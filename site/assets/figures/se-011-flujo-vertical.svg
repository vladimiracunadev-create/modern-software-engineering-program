t x="20" y="478" width="330" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="185" y="504.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="185" dy="0">Recuperación tras expirar la reserva</tspan></text><rect x="364" y="478" width="340" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="534" y="504.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="534" dy="0">No se encontró runbook ni prueba</tspan></text><rect x="718" y="478" width="220" height="46" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="828" y="504.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="828" dy="0">? desconocido</tspan></text><text x="534" y="546" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="534" dy="0">Un salto sin evidencia se registra como incógnita; no se rellena por intuición.</tspan></text></svg>
