<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Flujo vertical de una confirmación repetida, con evidencia por salto</title><desc id="d">Cadena de nueve saltos desde la persona hasta la señal operativa, con la fuente que muestra cada uno y su clasificación como observado, inferido o desconocido. Una rama degradada muestra que el comportamiento tras expirar la reserva es desconocido.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="560" fill="#ffffff"/><rect x="20" y="14" width="330" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="185" y="40.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="185" dy="0">Persona repite la confirmación</tspan></text><rect x="364" y="14" width="340" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="534" y="40.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="534" dy="0">Escenario del taller</tspan></text><rect x="718" y="14" width="220" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="828" y="40.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="828" dy="0">✔ observado</tspan></text><polyline points="185,60 185,72" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="72" width="330" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="185" y="98.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="185" dy="0">Interfaz o punto de entrada</tspan></text><rect x="364" y="72" width="340" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="534" y="98.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="534" dy="0">Contrato OpenAPI</tspan></text><rect x="718" y="72" width="220" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="828" y="98.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="828" dy="0">✔ observado</tspan></text><polyline points="185,118 185,130" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="130" width="330" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="185" y="156.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="185" dy="0">Contrato: clave idempotente</tspan></text><rect x="364" y="130" width="340" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="534" y="156.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="534" dy="0">Especificación del endpoint</tspan></text><rect x="718" y="130" width="220" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="828" y="156.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="828" dy="0">✔ observado</tspan></text><polyline points="185,176 185,188" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="188" width="330" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="185" y="214.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="185" dy="0">Validación y autorización</tspan></text><rect x="364" y="188" width="340" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="534" y="214.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="534" dy="0">Código del handler</tspan></text><rect x="718" y="188" width="220" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="828" y="214.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="828" dy="0">✔ observado</tspan></text><polyline points="185,234 185,246" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="246" width="330" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="185" y="272.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="185" dy="0">Lógica y cambio de estado</tspan></text><rect x="364" y="246" width="340" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="534" y="272.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="534" dy="0">Código y prueba de repetición</tspan></text><rect x="718" y="246" width="220" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="828" y="272.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="828" dy="0">✔ observado</tspan></text><polyline points="185,292 185,304" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="304" width="330" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="185" y="330.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="185" dy="0">Persistencia: una escritura</tspan></text><rect x="364" y="304" width="340" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="534" y="330.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="534" dy="0">Prueba: dos solicitudes, una escritura</tspan></text><rect x="718" y="304" width="220" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="828" y="3