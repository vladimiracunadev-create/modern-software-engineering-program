<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" width="940" height="430" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Observado, inferido y desconocido en el hallazgo de la demostración</title><desc id="d">Tres columnas con el hallazgo de Campus Abierto: lo observado es la prueba de dos solicitudes y una escritura; lo inferido es la protección dentro de la ventana; lo desconocido es el comportamiento tras la expiración, que se convierte en un gap.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="430" fill="#ffffff"/><rect x="20" y="20" width="296" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="168" y="45.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="168" dy="0">Observado</tspan></text><rect x="20" y="72" width="296" height="116" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="168" y="108.68" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="168" dy="0">La prueba ejecuta dos solicitudes</tspan></text><text x="168" y="125.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="168" dy="0">iguales y registra una sola</tspan></text><text x="168" y="141.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="168" dy="0">escritura. La configuración define la</tspan></text><text x="168" y="158.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="168" dy="0">expiración.</tspan></text><text x="168" y="214" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="168" dy="0">Qué se hace</tspan></text><rect x="20" y="224" width="296" height="90" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="168" y="264.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="168" dy="0">Cita ruta y versión; cualquiera puede</tspan></text><text x="168" y="280.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="168" dy="0">repetirlo.</tspan></text><rect x="328" y="20" width="296" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="476" y="45.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="476" dy="0">Inferido</tspan></text><rect x="328" y="72" width="296" height="116" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="476" y="125.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="476" dy="0">La ruta probada evita duplicados</tspan></text><text x="476" y="141.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="476" dy="0">dentro de la ventana configurada.</tspan></text><text x="476" y="214" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="476" dy="0">Qué se hace</tspan></text><rect x="328" y="224" width="296" height="90" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="476" y="264.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="476" dy="0">Declara el supuesto: la configuración</tspan></text><text x="476" y="280.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="476" dy="0">probada coincide con la desplegada.</tspan></text><rect x="636" y="20" width="296" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="784" y="45.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="784" dy="0">Desconocido</tspan></text><rect x="636" y="72" width="296" height="116" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="784" y="117" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="784" dy="0">No hay evidencia del comportamiento</tspan></text><text x="784" y="133.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="784" dy="0">después de expirar: ¿se concilia el</tspan></text><text x="784" y="150.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="784" dy="0">cobro?</tspan></text><text x="784" y="214" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="784" dy="0">Qué se hace</tspan></text><rect x="636" y="224" width="296" height="90" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="784" y="256" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="784" dy="0">Se registra como gap con la evidencia</tspan></text><text x="784" y="272.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="784" dy="0">que lo resolvería: runbook o prueba</tspan></text><text x="784" y="289.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="784" dy="0">de conciliación.</tspan></text><rect x="20" y="336" width="900" height="76" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="470" y="369.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="470" dy="0">Hallazgo responsable: «La ruta probada evita duplicado dentro de la ventana configurada. No se encontró evidencia</tspan></text><text x="470" y="385.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="470" dy="0">suficiente sobre el comportamiento tras expirar». No es una vulnerabilidad ni una garantía total.</tspan></text></svg>
