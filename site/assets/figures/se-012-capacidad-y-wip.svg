<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 460" width="940" height="460" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Trabajo en curso limitado frente a diez objetivos simultáneos</title><desc id="d">Dos carriles de seis semanas con datos ilustrativos. En el carril A, diez objetivos empiezan a la vez, superan la capacidad declarada de 8 horas semanales y no producen feedback. En el carril B, tres experimentos encadenados producen una revisión cada dos semanas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="460" fill="#ffffff"/><text x="20" y="34" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">A · Diez objetivos a la vez</tspan></text><line x1="40" y1="130" x2="900" y2="130" stroke="#32505f" stroke-width="1.8"/><rect x="60" y="56" width="76" height="44" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="98" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="98" dy="0">obj. 1</tspan></text><rect x="144" y="56" width="76" height="44" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="182" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="182" dy="0">obj. 2</tspan></text><rect x="228" y="56" width="76" height="44" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="266" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="266" dy="0">obj. 3</tspan></text><rect x="312" y="56" width="76" height="44" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="350" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="350" dy="0">obj. 4</tspan></text><rect x="396" y="56" width="76" height="44" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="434" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="434" dy="0">obj. 5</tspan></text><rect x="480" y="56" width="76" height="44" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="518" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="518" dy="0">obj. 6</tspan></text><rect x="564" y="56" width="76" height="44" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="602" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="602" dy="0">obj. 7</tspan></text><rect x="648" y="56" width="76" height="44" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="686" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="686" dy="0">obj. 8</tspan></text><rect x="732" y="56" width="76" height="44" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="770" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="770" dy="0">obj. 9</tspan></text><rect x="816" y="56" width="76" height="44" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="854" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="854" dy="0">obj. 10</tspan></text><text x="60" y="150" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="60" dy="0">sem. 0</tspan></text><text x="190" y="150" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="190" dy="0">sem. 1</tspan></text><text x="320" y="150" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="320" dy="0">sem. 2</tspan></text><text x="450" y="150" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="450" dy="0">sem. 3</tspan></text><text x="580" y="150" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="580" dy="0">sem. 4</tspan></text><text x="710" y="150" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="710" dy="0">sem. 5</tspan></text><text x="840" y="150" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="840" dy="0">sem. 6</tspan></text><rect x="40" y="164" width="860" height="78" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="198.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Demanda ilustrativa: 10 objetivos × 2 h = 20 h/semana. Capacidad declarada: 8 h/semana. Resultado: ningún artefacto</tspan></text><text x="470" y="214.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">revisable, sin feedback y con riesgo de sobreesfuerzo.</tspan></text><text x="20" y="280" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">B · Tres experimentos encadenados</tspan></text><line x1="40" y1="350" x2="900" y2="350" stroke="#32505f" stroke-width="1.8"/><rect x="60" y="296" width="250" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="185" y="321.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="185" dy="0">Exp. 1 (sem. 1-2)</tspan></text><circle cx="310" cy="350" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="310" y="355" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="310" dy="0">1</tspan></text><text x="310" y="384" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="310" dy="0">revisión</tspan></text><rect x="340" y="296" width="250" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="465" y="321.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="465" dy="0">Exp. 2 (sem. 3-4)</tspan></text><circle cx="590" cy="350" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="590" y="355" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="590" dy="0">2</tspan></text><text x="590" y="384" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="590" dy="0">revisión</tspan></text><rect x="620" y="296" width="250" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="745" y="321.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="745" dy="0">Exp. 3 (sem. 5-6)</tspan></text><circle cx="870" cy="350" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="870" y="355" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="870" dy="0">3</tspan></text><text x="870" y="384" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="870" dy="0">revisión</tspan></text><rect x="40" y="402" width="860" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="427.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Cabe en 8 h/semana, cada paso produce un artefacto y una decisión, y el siguiente experimento usa lo aprendido.</tspan></text></svg>
