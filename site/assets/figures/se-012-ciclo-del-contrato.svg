<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ciclo adaptativo del contrato de aprendizaje</title><desc id="d">Cinco pasos: evidencia actual, dirección, brecha, experimento acotado y revisión. La revisión produce una de cuatro decisiones (avanzar, repetir, dividir o cambiar de estrategia) y reabre la brecha.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="440" fill="#ffffff"/><rect x="20" y="40" width="190" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="115" y="70.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="115" dy="0">Evidencia actual: qué</tspan></text><text x="115" y="86.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="115" dy="0">puedes demostrar hoy</tspan></text><rect x="20" y="140" width="190" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="115" y="162" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="115" dy="0">Dirección: problemas y</tspan></text><text x="115" y="178.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="115" dy="0">responsabilidades que</tspan></text><text x="115" y="195.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="115" dy="0">buscas</tspan></text><rect x="270" y="90" width="190" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="365" y="120.32" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="365" dy="0">Brecha: capacidad que</tspan></text><text x="365" y="136.96" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="365" dy="0">falta, no solo un tema</tspan></text><polyline points="210,75 270,115" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="210,175 270,135" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="520" y="90" width="200" height="70" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="620" y="103.68" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="620" dy="0">Experimento: máximo dos</tspan></text><text x="620" y="120.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="620" dy="0">semanas, con criterio y</tspan></text><text x="620" y="136.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="620" dy="0">resultado que pueda</tspan></text><text x="620" y="153.6" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="620" dy="0">refutarlo</tspan></text><polyline points="460,125 520,125" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="780" y="90" width="160" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="860" y="112" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="860" dy="0">Artefacto +</tspan></text><text x="860" y="128.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="860" dy="0">revisión por otra</tspan></text><text x="860" y="145.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="860" dy="0">persona</tspan></text><polyline points="720,125 780,125" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="250" y="250" width="460" height="56" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="480" y="281.92" font-size="14" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="480" dy="0">Decisión de revisión (con fecha y disparadores)</tspan></text><polyline points="860,160 860,220 710,270" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="100" y="340" width="180" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="190" y="366.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="190" dy="0">Avanzar</tspan></text><polyline points="480,306 190,340" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="300" y="340" width="180" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="390" y="366.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="390" dy="0">Repetir</tspan></text><polyline points="480,306 390,340" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="500" y="340" width="180" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="590" y="366.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="590" dy="0">Dividir</tspan></text><polyline points="480,306 590,340" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="700" y="340" width="180" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="790" y="366.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="790" dy="0">Cambiar estrategia</tspan></text><polyline points="480,306 790,340" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="100,363 50,363 50,210" fill="none" stroke="#a8761a" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="60" y="285" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="60" dy="0">reabre la brecha</tspan></text><text x="480" y="420" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="480" dy="0">Si todo experimento termina «completo» por consumir contenido, no es un experimento: debe existir un resultado que lo refute.</tspan></text></svg>
