<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mapa de competencias con cuatro estados de evidencia</title><desc id="d">Tabla de siete capacidades de la Parte 00 por cuatro estados: aún no tengo evidencia, puedo reconocer y explicar, puedo ejecutar con guía y puedo transferir y defender. Un perfil de ejemplo marca con un punto el estado de cada capacidad; los estados no son rangos personales.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="500" fill="#ffffff"/><rect x="10" y="12" width="300" height="54" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="160" y="42.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="160" dy="0">Capacidad (evidencia previa)</tspan></text><rect x="316" y="12" width="152" height="54" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="392" y="34.68" font-size="12" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="392" dy="0">Aún no tengo</tspan></text><text x="392" y="50.04" font-size="12" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="392" dy="0">evidencia</tspan></text><rect x="474" y="12" width="152" height="54" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="550" y="34.68" font-size="12" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="550" dy="0">Puedo reconocer y</tspan></text><text x="550" y="50.04" font-size="12" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="550" dy="0">explicar</tspan></text><rect x="632" y="12" width="152" height="54" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="708" y="34.68" font-size="12" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="708" dy="0">Puedo ejecutar con</tspan></text><text x="708" y="50.04" font-size="12" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="708" dy="0">guía</tspan></text><rect x="790" y="12" width="152" height="54" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="866" y="34.68" font-size="12" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="866" dy="0">Puedo transferir y</tspan></text><text x="866" y="50.04" font-size="12" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="866" dy="0">defender</tspan></text><rect x="10" y="74" width="300" height="46" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="160" y="92.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="160" dy="0">Delimitar un sistema y su</tspan></text><text x="160" y="108.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="160" dy="0">responsabilidad</tspan></text><rect x="316" y="74" width="152" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><rect x="474" y="74" width="152" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><rect x="632" y="74" width="152" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><rect x="790" y="74" width="152" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><circle cx="866" cy="97" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="866" y="102" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="866" dy="0">●</tspan></text><rect x="10" y="126" width="300" height="46" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="160" y="144.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="160" dy="0">Sostener decisiones en el ciclo de</tspan></text><text x="160" y="160.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="160" dy="0">vida</tspan></text><rect x="316" y="126" width="152" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><rect x="474" y="126" width="152" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><rect x="632" y="126" width="152" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><circle cx="708" cy="149" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="708" y="154" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="708" dy="0">●</tspan></text><rect x="790" y="126" width="152" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><rect x="10" y="178" width="300" height="46" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="160" y="196.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="160" dy="0">Deliberar y coordinar con otras</tspan></text><text x="160" y="212.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="160" dy="0">personas</tspan></text><rect x="316" y="178" width="152" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><rect x="474" y="178" width="152" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><rect x="632" y="178" width="152" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><circle cx="708" cy="201" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="708" y="206" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="708" dy="0">●</tspan></text><rect x="790" y="178" width="152" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><rect x="10" y="230" width="300" height="46" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="160" y="256.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="160" dy="0">Razonar bajo incertidumbre</tspan></text><rect x="316" y="230" width="152" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><rect x="474" y="230" width="152" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><rect x="632" y="230" width="152" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><rect x="790" y="230" width="152" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><circle cx="866" cy="253" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="866" y="258" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="866" dy="0">●</tspan></text><rect x="10" y="282" width="300" height="46" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="160" y="308.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="160" dy="0">Comparar consecuencias y riesgos</tspan></text><rect x="316" y="282" width="152" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><rect x="474" y="282" width="152" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><rect x="632" y="282" width="152" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><circle cx="708" cy="305" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="708" y="310" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="708" dy="0">●</tspan></text><rect x="790" y="282" width="152" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><rect x="10" y="334" width="300" height="46" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="160" y="360.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="160" dy="0">Fundamentar afirmaciones con fuentes</tspan></text><rect x="316" y="334" width="152" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><rect x="474" y="334" width="152" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><circle cx="550" cy="357" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="550" y="362" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="550" dy="0">●</tspan></text><rect x="632" y="334" width="152" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><rect x="790" y="334" width="152" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><rect x="10" y="386" width="300" height="46" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="160" y="404.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="160" dy="0">Integrar las lentes en un producto</tspan></text><text x="160" y="420.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="160" dy="0">real</tspan></text><rect x="316" y="386" width="152" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><circle cx="392" cy="409" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="392" y="414" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="392" dy="0">●</tspan></text><rect x="474" y="386" width="152" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><rect x="632" y="386" width="152" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><rect x="790" y="386" width="152" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="480" y="462" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="480" dy="0">Perfil ficticio de ejemplo orientado a backend: no es una evaluación ni un ranking.</tspan></text><text x="480" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="480" dy="0">Se avanza con evidencia revisable, no con autoestima ni años de experiencia. Cada capacidad puede estar en un estado distinto.</tspan></text></svg>
