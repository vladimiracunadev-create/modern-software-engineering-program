<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué ve cada herramienta y qué no revela, capa por capa</title><desc id="d">Cinco capas, de código Python a microarquitectura. Para cada una: el contrato en su frontera, la herramienta que la observa y lo que esa observación no demuestra.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="470" fill="#ffffff"/><rect x="10" y="12" width="135" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="77.5" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="77.5" dy="0">Capa</tspan></text><rect x="150" y="12" width="245" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="272.5" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="272.5" dy="0">Contrato en su frontera</tspan></text><rect x="400" y="12" width="245" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="522.5" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="522.5" dy="0">Se observa con</tspan></text><rect x="650" y="12" width="300" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="800" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="800" dy="0">No revela</tspan></text><rect x="10" y="58" width="135" height="66" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="77.5" y="94.64" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="77.5" dy="0">Código Python</tspan></text><rect x="150" y="58" width="245" height="66" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="272.5" y="86.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="272.5" dy="0">Semántica del lenguaje:</tspan></text><text x="272.5" y="102.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="272.5" dy="0">valores, control, excepciones</tspan></text><rect x="400" y="58" width="245" height="66" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="522.5" y="94.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="522.5" dy="0">Pruebas, depurador, módulo dis</tspan></text><rect x="650" y="58" width="300" height="66" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="800" y="94.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="800" dy="0">Qué instrucciones nativas se ejecutan</tspan></text><rect x="10" y="132" width="135" height="66" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="77.5" y="168.64" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="77.5" dy="0">Runtime CPython</tspan></text><rect x="150" y="132" width="245" height="66" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="272.5" y="160.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="272.5" dy="0">Objetos, bytecode y gestión de</tspan></text><text x="272.5" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="272.5" dy="0">memoria</tspan></text><rect x="400" y="132" width="245" height="66" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="522.5" y="160.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="522.5" dy="0">sys, platform, dis,</tspan></text><text x="522.5" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="522.5" dy="0">tracemalloc</tspan></text><rect x="650" y="132" width="300" height="66" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="800" y="168.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="800" dy="0">Instrucciones y cachés del procesador</tspan></text><rect x="10" y="206" width="135" height="66" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="77.5" y="234.32" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="77.5" dy="0">Sistema</tspan></text><text x="77.5" y="250.96" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="77.5" dy="0">operativo</tspan></text><rect x="150" y="206" width="245" height="66" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="272.5" y="234.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="272.5" dy="0">Procesos, archivos y memoria</tspan></text><text x="272.5" y="250.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="272.5" dy="0">virtual</tspan></text><rect x="400" y="206" width="245" height="66" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="522.5" y="234.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="522.5" dy="0">os, resource; strace o Process</tspan></text><text x="522.5" y="250.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="522.5" dy="0">Monitor</tspan></text><rect x="650" y="206" width="300" height="66" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="800" y="234.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="800" dy="0">Qué hace el dispositivo tras aceptar</tspan></text><text x="800" y="250.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="800" dy="0">la escritura</tspan></text><rect x="10" y="280" width="135" height="66" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="77.5" y="316.64" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="77.5" dy="0">ISA</tspan></text><rect x="150" y="280" width="245" height="66" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="272.5" y="308.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="272.5" dy="0">Instrucciones y registros</tspan></text><text x="272.5" y="324.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="272.5" dy="0">visibles al software</tspan></text><rect x="400" y="280" width="245" height="66" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="522.5" y="300" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="522.5" dy="0">Documentación de la ISA;</tspan></text><text x="522.5" y="316.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="522.5" dy="0">platform.machine() como</tspan></text><text x="522.5" y="333.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="522.5" dy="0">etiqueta</tspan></text><rect x="650" y="280" width="300" height="66" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="800" y="308.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="800" dy="0">El modelo exacto de CPU ni su</tspan></text><text x="800" y="324.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="800" dy="0">rendimiento</tspan></text><rect x="10" y="354" width="135" height="66" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="77.5" y="390.64" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="77.5" dy="0">Microarquitectura</tspan></text><rect x="150" y="354" width="245" height="66" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="272.5" y="382.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="272.5" dy="0">Pipeline, cachés, predicción:</tspan></text><text x="272.5" y="398.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="272.5" dy="0">implementación de la ISA</tspan></text><rect x="400" y="354" width="245" height="66" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="522.5" y="382.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="522.5" dy="0">Contadores de hardware (perf);</tspan></text><text x="522.5" y="398.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="522.5" dy="0">fuera del alcance de Python</tspan></text><rect x="650" y="354" width="300" height="66" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="800" y="390.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="800" dy="0">Nada más abajo en esta clase</tspan></text><text x="480" y="448" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="480" dy="0">Cada herramienta mira por una ventana. Una observación correcta se acompaña de su fuente y de su límite.</tspan></text></svg>
