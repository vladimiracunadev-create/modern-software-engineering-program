<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 460" width="940" height="460" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un mismo patrón de bits, tres lecturas</title><desc id="d">Arriba, el valor posicional de 1011 en binario: 8+0+2+1 = 11 = 0xB. Abajo, el patrón 01000001 leído como entero sin signo vale 65, como ASCII es la letra A y en hexadecimal se escribe 0x41.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="460" fill="#ffffff"/><text x="20" y="26" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">A · Valor posicional: 1011₂</tspan></text><rect x="60" y="44" width="110" height="34" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="115" y="64.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="115" dy="0">2³ = 8</tspan></text><rect x="60" y="84" width="110" height="50" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="115" y="115.16" font-size="22" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="115" dy="0">1</tspan></text><rect x="60" y="140" width="110" height="34" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="115" y="160.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="115" dy="0">8</tspan></text><rect x="190" y="44" width="110" height="34" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="245" y="64.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="245" dy="0">2² = 4</tspan></text><rect x="190" y="84" width="110" height="50" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="245" y="115.16" font-size="22" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="245" dy="0">0</tspan></text><rect x="190" y="140" width="110" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="245" y="160.92" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="245" dy="0">0</tspan></text><rect x="320" y="44" width="110" height="34" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="375" y="64.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="375" dy="0">2¹ = 2</tspan></text><rect x="320" y="84" width="110" height="50" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="375" y="115.16" font-size="22" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="375" dy="0">1</tspan></text><rect x="320" y="140" width="110" height="34" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="375" y="160.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="375" dy="0">2</tspan></text><rect x="450" y="44" width="110" height="34" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="505" y="64.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="505" dy="0">2⁰ = 1</tspan></text><rect x="450" y="84" width="110" height="50" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="505" y="115.16" font-size="22" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="505" dy="0">1</tspan></text><rect x="450" y="140" width="110" height="34" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="505" y="160.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="505" dy="0">1</tspan></text><text x="610" y="120" font-size="16" text-anchor="start" font-weight="700" fill="#142231"><tspan x="610" dy="0">= 8 + 0 + 2 + 1</tspan></text><text x="610" y="148" font-size="16" text-anchor="start" font-weight="700" fill="#142231"><tspan x="610" dy="0">= 11 = 0x0B</tspan></text><text x="610" y="176" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="610" dy="0">Convertir cambia la notación, no el valor.</tspan></text><text x="20" y="226" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">B · El patrón 01000001 y su significado</tspan></text><rect x="40" y="244" width="480" height="54" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="280" y="277.16" font-size="22" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="280" dy="0">0 1 0 0 0 0 0 1</tspan></text><polyline points="280,298 150,336" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="40" y="336" width="220" height="56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="150" y="367.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="150" dy="0">Entero sin signo: 65</tspan></text><polyline points="280,298 450,336" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="340" y="336" width="220" height="56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="450" y="367.92" font-size="14" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="450" dy="0">Texto ASCII: «A»</tspan></text><polyline points="280,298 750,336" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="640" y="336" width="220" height="56" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="750" y="367.92" font-size="14" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="750" dy="0">Hexadecimal: 0x41</tspan></text><text x="470" y="430" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Los bits aportan estados; el formato aporta significado. Sin formato declarado, el patrón no dice qué es.</tspan></text></svg>
