<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" width="940" height="430" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">De carácter a bytes: puntos de código y dos codificaciones</title><desc id="d">Tabla con cuatro caracteres (A, í, € y el emoji de cara sonriente): su punto de código Unicode, sus bytes en UTF-8 y sus unidades de código en UTF-16. El emoji necesita cuatro bytes en UTF-8 y dos unidades en UTF-16.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="430" fill="#ffffff"/><rect x="10" y="12" width="155" height="40" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="87.5" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="87.5" dy="0">Carácter</tspan></text><rect x="170" y="12" width="205" height="40" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="272.5" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="272.5" dy="0">Punto de código</tspan></text><rect x="380" y="12" width="265" height="40" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="512.5" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="512.5" dy="0">UTF-8 (bytes)</tspan></text><rect x="650" y="12" width="280" height="40" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="790" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="790" dy="0">UTF-16 (unidades)</tspan></text><rect x="10" y="60" width="155" height="58" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="87.5" y="94.04" font-size="18" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="87.5" dy="0">A</tspan></text><rect x="170" y="60" width="205" height="58" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="272.5" y="92.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="272.5" dy="0">U+0041</tspan></text><rect x="380" y="60" width="265" height="58" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="512.5" y="92.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="512.5" dy="0">41 (1 byte)</tspan></text><rect x="650" y="60" width="280" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="790" y="92.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="790" dy="0">0041 (1 unidad)</tspan></text><rect x="10" y="126" width="155" height="58" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="87.5" y="160.04" font-size="18" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="87.5" dy="0">í</tspan></text><rect x="170" y="126" width="205" height="58" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="272.5" y="158.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="272.5" dy="0">U+00ED</tspan></text><rect x="380" y="126" width="265" height="58" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="512.5" y="158.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="512.5" dy="0">C3 AD (2 bytes)</tspan></text><rect x="650" y="126" width="280" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="790" y="158.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="790" dy="0">00ED (1 unidad)</tspan></text><rect x="10" y="192" width="155" height="58" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="87.5" y="226.04" font-size="18" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="87.5" dy="0">€</tspan></text><rect x="170" y="192" width="205" height="58" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="272.5" y="224.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="272.5" dy="0">U+20AC</tspan></text><rect x="380" y="192" width="265" height="58" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="512.5" y="224.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="512.5" dy="0">E2 82 AC (3 bytes)</tspan></text><rect x="650" y="192" width="280" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="790" y="224.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="790" dy="0">20AC (1 unidad)</tspan></text><rect x="10" y="258" width="155" height="58" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="87.5" y="292.04" font-size="18" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="87.5" dy="0">😀</tspan></text><rect x="170" y="258" width="205" height="58" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="272.5" y="290.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="272.5" dy="0">U+1F600</tspan></text><rect x="380" y="258" width="265" height="58" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="512.5" y="290.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="512.5" dy="0">F0 9F 98 80 (4 bytes)</tspan></text><rect x="650" y="258" width="280" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="790" y="282.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="790" dy="0">D83D DE00 (2 unidades: par</tspan></text><text x="790" y="298.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="790" dy="0">sustituto)</tspan></text><rect x="10" y="332" width="920" height="58" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="470" y="356.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="470" dy="0">Unicode asigna números a caracteres abstractos; UTF-8 y UTF-16 son dos formas de convertir esos números en bytes. ASCII</tspan></text><text x="470" y="372.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="470" dy="0">conserva sus bytes en UTF-8.</tspan></text><text x="470" y="414" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Los valores se verificaron con Python (encode); el emoji se muestra con el glifo del sistema del lector.</tspan></text></svg>
