<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una instrucción por dentro: ADD x3, x1, x2 en RISC-V</title><desc id="d">Formato R de RISC-V de 32 bits con sus seis campos: funct7 (0000000), rs2 (00010, registro x2), rs1 (00001, registro x1), funct3 (000), rd (00011, registro x3) y opcode (0110011). Codificada vale 0x002081B3.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="420" fill="#ffffff"/><text x="480" y="28" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="480" dy="0">Los 32 bits, de izquierda (bit 31) a derecha (bit 0)</tspan></text><rect x="20" y="56" width="197.5" height="36" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="118.75" y="77.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="118.75" dy="0">funct7</tspan></text><rect x="20" y="96" width="197.5" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="118.75" y="121.92" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="118.75" dy="0">0000000</tspan></text><rect x="20" y="148" width="197.5" height="74" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="118.75" y="188.36" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="118.75" dy="0">variante de la operación</tspan></text><rect x="219.5" y="56" width="140.5" height="36" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="289.75" y="77.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="289.75" dy="0">rs2</tspan></text><rect x="219.5" y="96" width="140.5" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="289.75" y="121.92" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="289.75" dy="0">00010</tspan></text><rect x="219.5" y="148" width="140.5" height="74" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="289.75" y="180.68" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="289.75" dy="0">registro fuente 2</tspan></text><text x="289.75" y="196.04" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="289.75" dy="0">= x2</tspan></text><rect x="362" y="56" width="140.5" height="36" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="432.25" y="77.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="432.25" dy="0">rs1</tspan></text><rect x="362" y="96" width="140.5" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432.25" y="121.92" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="432.25" dy="0">00001</tspan></text><rect x="362" y="148" width="140.5" height="74" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="432.25" y="180.68" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="432.25" dy="0">registro fuente 1</tspan></text><text x="432.25" y="196.04" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="432.25" dy="0">= x1</tspan></text><rect x="504.5" y="56" width="83.5" height="36" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="546.25" y="77.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="546.25" dy="0">funct3</tspan></text><rect x="504.5" y="96" width="83.5" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="546.25" y="121.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="546.25" dy="0">000</tspan></text><rect x="504.5" y="148" width="83.5" height="74" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="546.25" y="188.36" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="546.25" dy="0">variante</tspan></text><rect x="590" y="56" width="140.5" height="36" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="660.25" y="77.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="660.25" dy="0">rd</tspan></text><rect x="590" y="96" width="140.5" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="660.25" y="121.92" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="660.25" dy="0">00011</tspan></text><rect x="590" y="148" width="140.5" height="74" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="660.25" y="180.68" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="660.25" dy="0">registro destino</tspan></text><text x="660.25" y="196.04" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="660.25" dy="0">= x3</tspan></text><rect x="732.5" y="56" width="197.5" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="831.25" y="77.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="831.25" dy="0">opcode</tspan></text><rect x="732.5" y="96" width="197.5" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="831.25" y="121.92" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="831.25" dy="0">0110011</tspan></text><rect x="732.5" y="148" width="197.5" height="74" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="831.25" y="180.68" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="831.25" dy="0">tipo: operación entre</tspan></text><text x="831.25" y="196.04" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="831.25" dy="0">registros</tspan></text><rect x="20" y="248" width="920" height="54" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="480" y="278.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="480" dy="0">Ensamblador: ADD x3, x1, x2 → código de máquina: 0000000 00010 00001 000 00011 0110011 → hexadecimal 0x002081B3</tspan></text><rect x="20" y="316" width="450" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="245" y="351.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="245" dy="0">Efecto arquitectónico: x3 ← x1 + x2. Cambia un registro y</tspan></text><text x="245" y="367.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="245" dy="0">el contador de programa avanza 4 bytes; no toca la memoria.</tspan></text><rect x="490" y="316" width="450" height="80" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="715" y="351.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="715" dy="0">Lo que no dice: cuántos ciclos tarda, qué unidades usa ni</tspan></text><text x="715" y="367.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="715" dy="0">si el procesador la reordena. Eso es microarquitectura.</tspan></text></svg>
