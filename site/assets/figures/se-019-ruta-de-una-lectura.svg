<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ruta de una lectura bloqueante entre aplicación, núcleo y dispositivo</title><desc id="d">Tres carriles y siete pasos: la aplicación llama a read; el núcleo valida y programa la operación y bloquea el hilo; el dispositivo transfiere los datos a memoria y avisa con una interrupción; el núcleo marca el hilo como listo y el planificador le devuelve la CPU.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="540" fill="#ffffff"/><rect x="30" y="12" width="260" height="40" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="160" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="160" dy="0">Hilo de la aplicación</tspan></text><line x1="160" y1="52" x2="160" y2="520" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="350" y="12" width="260" height="40" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="480" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="480" dy="0">Núcleo del sistema operativo</tspan></text><line x1="480" y1="52" x2="480" y2="520" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="670" y="12" width="260" height="40" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="800" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="800" dy="0">Dispositivo</tspan></text><line x1="800" y1="52" x2="800" y2="520" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="30" y="76" width="260" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="160" y="105.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">1 read(): pide datos del archivo</tspan></text><polyline points="290,102 350,102" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="320" y="94" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="320" dy="0">syscall</tspan></text><rect x="350" y="76" width="260" height="52" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="480" y="97.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">2 Entra en modo núcleo: valida y</tspan></text><text x="480" y="113.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">programa la E/S</tspan></text><polyline points="610,102 670,102" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="640" y="94" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="640" dy="0">orden</tspan></text><rect x="30" y="152" width="260" height="52" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="160" y="173.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="160" dy="0">3 El hilo queda bloqueado; la</tspan></text><text x="160" y="189.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="160" dy="0">CPU atiende a otro</tspan></text><polyline points="350,178 290,178" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="670" y="152" width="260" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="800" y="173.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="800" dy="0">4 Transfiere los datos a memoria</tspan></text><text x="800" y="189.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="800" dy="0">(DMA)</tspan></text><rect x="670" y="228" width="260" height="52" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="800" y="249.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="800" dy="0">5 Señala el fin con una</tspan></text><text x="800" y="265.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="800" dy="0">interrupción</tspan></text><polyline points="670,254 610,254" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="640" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="640" dy="0">interrupción</tspan></text><rect x="350" y="228" width="260" height="64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="480" y="247" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">6 El manejador marca el hilo</tspan></text><text x="480" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">como listo; el planificador</tspan></text><text x="480" y="280.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">decide cuándo</tspan></text><rect x="30" y="320" width="260" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="160" y="337" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">7 El hilo vuelve al modo</tspan></text><text x="160" y="353.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">usuario: read() devuelve los</tspan></text><text x="160" y="370.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">bytes</tspan></text><polyline points="350,350 290,350" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="30" y="420" width="900" height="90" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="480" y="452" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="480" dy="0">La CPU no esperó ocupada: mientras el dispositivo trabajaba, atendía a otros hilos. Por eso una lectura puede tardar</tspan></text><text x="480" y="468.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="480" dy="0">mucho en tiempo de pared y casi nada en tiempo de CPU. El sistema real puede usar sondeo, búferes o E/S asíncrona; la</tspan></text><text x="480" y="485.28" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="480" dy="0">secuencia muestra responsabilidades, no cada señal.</tspan></text></svg>
