<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Compilar el fuente frente a cargar el bytecode ya compilado</title><desc id="d">Dos barras con una medición real: compilar 8 999 líneas de Python tardó 55,9 milisegundos y cargar el mismo código ya compilado con marshal tardó 1,8 milisegundos, unas 31 veces menos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="900" height="360" fill="#ffffff"/><text x="20" y="28" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">Mismo programa (9 000 líneas, 3 000 funciones), CPython 3.12.9, una medición</tspan></text><text x="250" y="84" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">compile(fuente)</tspan></text><rect x="260" y="62" width="503.1" height="34" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="771.1" y="85" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="771.1" dy="0">55.9 ms</tspan></text><text x="250" y="164" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">marshal.loads(bytecode)</tspan></text><rect x="260" y="142" width="16.2" height="34" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="284.2" y="165" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="284.2" dy="0">1.8 ms</tspan></text><rect x="20" y="232" width="860" height="100" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="450" y="269" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="450" dy="0">Por eso existen los archivos .pyc: guardan el bytecode para no recompilar en cada arranque. Incluyen un número</tspan></text><text x="450" y="285.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="450" dy="0">mágico y la fecha o el hash del fuente; si no coinciden con la versión del intérprete, se regeneran. No son un</tspan></text><text x="450" y="302.28" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="450" dy="0">artefacto portable entre versiones.</tspan></text></svg>
