<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Estrategias de traducción: no es «compilado» frente a «interpretado»</title><desc id="d">Tabla de cuatro estrategias (compilación anticipada, intérprete simple, intérprete con especialización y compilación en ejecución) frente a arranque, rendimiento sostenido, portabilidad y qué observar al medir.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="440" fill="#ffffff"/><rect x="10" y="12" width="195" height="40" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="107.5" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="107.5" dy="0">Estrategia</tspan></text><rect x="210" y="12" width="185" height="40" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="302.5" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="302.5" dy="0">Arranque</tspan></text><rect x="400" y="12" width="235" height="40" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="517.5" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="517.5" dy="0">Rendimiento sostenido</tspan></text><rect x="640" y="12" width="305" height="40" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="792.5" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="792.5" dy="0">Qué decide la elección</tspan></text><rect x="10" y="60" width="195" height="76" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="107.5" y="93.32" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="107.5" dy="0">AOT (anticipada): C,</tspan></text><text x="107.5" y="109.96" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="107.5" dy="0">Rust, Go</tspan></text><rect x="210" y="60" width="185" height="76" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="302.5" y="93.68" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="302.5" dy="0">Rápido: el código ya</tspan></text><text x="302.5" y="109.04" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="302.5" dy="0">está generado</tspan></text><rect x="400" y="60" width="235" height="76" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="517.5" y="93.68" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="517.5" dy="0">Fijado al compilar; sin</tspan></text><text x="517.5" y="109.04" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="517.5" dy="0">información de la ejecución</tspan></text><rect x="640" y="60" width="305" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792.5" y="93.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792.5" dy="0">Distribución por plataforma, tiempo de</tspan></text><text x="792.5" y="109.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792.5" dy="0">compilación, enlace</tspan></text><rect x="10" y="144" width="195" height="76" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="107.5" y="177.32" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="107.5" dy="0">Intérprete simple de</tspan></text><text x="107.5" y="193.96" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="107.5" dy="0">bytecode</tspan></text><rect x="210" y="144" width="185" height="76" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="302.5" y="177.68" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="302.5" dy="0">Rápido: poco que</tspan></text><text x="302.5" y="193.04" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="302.5" dy="0">preparar</tspan></text><rect x="400" y="144" width="235" height="76" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="517.5" y="177.68" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="517.5" dy="0">Bajo: cada operación pasa por</tspan></text><text x="517.5" y="193.04" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="517.5" dy="0">el intérprete</tspan></text><rect x="640" y="144" width="305" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792.5" y="185.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792.5" dy="0">Portabilidad y facilidad de depuración</tspan></text><rect x="10" y="228" width="195" height="76" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="107.5" y="253" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="107.5" dy="0">Intérprete con</tspan></text><text x="107.5" y="269.64" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="107.5" dy="0">especialización (CPython</tspan></text><text x="107.5" y="286.28" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="107.5" dy="0">3.11+)</tspan></text><rect x="210" y="228" width="185" height="76" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="302.5" y="269.36" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="302.5" dy="0">Rápido</tspan></text><rect x="400" y="228" width="235" height="76" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="517.5" y="254" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="517.5" dy="0">Mejora con el calentamiento:</tspan></text><text x="517.5" y="269.36" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="517.5" dy="0">BINARY_OP_ADD_INT tras repetir</tspan></text><text x="517.5" y="284.72" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="517.5" dy="0">sumas de enteros</tspan></text><rect x="640" y="228" width="305" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792.5" y="261.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792.5" dy="0">Mide fases por separado: arranque y estado</tspan></text><text x="792.5" y="277.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792.5" dy="0">estable</tspan></text><rect x="10" y="312" width="195" height="76" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="107.5" y="345.32" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="107.5" dy="0">JIT: JVM, motores de</tspan></text><text x="107.5" y="361.96" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="107.5" dy="0">JavaScript</tspan></text><rect x="210" y="312" width="185" height="76" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="302.5" y="345.68" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="302.5" dy="0">Más lento: interpreta y</tspan></text><text x="302.5" y="361.04" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="302.5" dy="0">compila rutas calientes</tspan></text><rect x="400" y="312" width="235" height="76" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="517.5" y="345.68" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="517.5" dy="0">Alto si hay perfil</tspan></text><text x="517.5" y="361.04" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="517.5" dy="0">representativo y tiempo de vida</tspan></text><rect x="640" y="312" width="305" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792.5" y="345.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792.5" dy="0">Memoria, calentamiento y benchmarks que</tspan></text><text x="792.5" y="361.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792.5" dy="0">descarten el arranque</tspan></text><text x="480" y="410" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="480" dy="0">Un mismo lenguaje puede admitir varias estrategias; la clasificación es de la implementación y del momento, no del lenguaje.</tspan></text><text x="480" y="430" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">CPython 3.13 incluye un JIT experimental desactivado por defecto (PEP 744); verifica el estado en la versión que uses.</tspan></text></svg>
