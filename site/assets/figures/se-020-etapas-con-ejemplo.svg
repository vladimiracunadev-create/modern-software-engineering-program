<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Las etapas reales para la línea total = price * 3 + tax en CPython 3.12</title><desc id="d">Cuatro representaciones de la misma línea: tokens, árbol sintáctico, bytecode y ejecución. Cada una responde una pregunta distinta.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="470" fill="#ffffff"/><rect x="14" y="20" width="220" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="124" y="46.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="124" dy="0">1 Tokens</tspan></text><rect x="14" y="74" width="220" height="160" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="124" y="141" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="124" dy="0">NAME total · OP = · NAME</tspan></text><text x="124" y="157.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="124" dy="0">price · OP * · NUMBER 3 ·</tspan></text><text x="124" y="174.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="124" dy="0">OP + · NAME tax</tspan></text><rect x="14" y="242" width="220" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="124" y="280.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="124" dy="0">¿Qué unidades hay?</tspan></text><polyline points="234,154 250,154" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="250" y="20" width="220" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="360" y="46.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="360" dy="0">2 AST</tspan></text><rect x="250" y="74" width="220" height="160" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="360" y="141" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="360" dy="0">Assign(total,</tspan></text><text x="360" y="157.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="360" dy="0">BinOp(BinOp(price * 3) +</tspan></text><text x="360" y="174.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="360" dy="0">tax))</tspan></text><rect x="250" y="242" width="220" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="360" y="264" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="360" dy="0">¿Cómo se agrupan? El</tspan></text><text x="360" y="280.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="360" dy="0">producto se evalúa antes</tspan></text><text x="360" y="297.28" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="360" dy="0">que la suma</tspan></text><polyline points="470,154 486,154" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="486" y="20" width="220" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="596" y="46.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="596" dy="0">3 Bytecode</tspan></text><rect x="486" y="74" width="220" height="160" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="596" y="132.68" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="596" dy="0">LOAD_NAME price ·</tspan></text><text x="596" y="149.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="596" dy="0">LOAD_CONST 3 · BINARY_OP *</tspan></text><text x="596" y="165.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="596" dy="0">· LOAD_NAME tax · BINARY_OP</tspan></text><text x="596" y="182.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="596" dy="0">+ · STORE_NAME total</tspan></text><rect x="486" y="242" width="220" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="596" y="272.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="596" dy="0">¿Qué hace la máquina</tspan></text><text x="596" y="288.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="596" dy="0">virtual de CPython?</tspan></text><polyline points="706,154 722,154" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="722" y="20" width="220" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="832" y="46.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="832" dy="0">4 Ejecución</tspan></text><rect x="722" y="74" width="220" height="160" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="832" y="141" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="832" dy="0">price y tax se buscan por</tspan></text><text x="832" y="157.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="832" dy="0">nombre al ejecutar; si no</tspan></text><text x="832" y="174.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="832" dy="0">existen, NameError</tspan></text><rect x="722" y="242" width="220" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="280.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="832" dy="0">¿Qué valores hay ahora?</tspan></text><rect x="14" y="332" width="930" height="56" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="479" y="355.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="479" dy="0">Con 2 * 3 + 4 el compilador pliega la constante: el bytecode contiene LOAD_CONST 10 y no hay multiplicación en tiempo de</tspan></text><text x="479" y="371.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="479" dy="0">ejecución. Es una optimización que conserva la semántica.</tspan></text><rect x="14" y="398" width="930" height="56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="479" y="429.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="479" dy="0">Nada de esto es código nativo: el bytecode lo ejecuta el intérprete de CPython, y su forma cambia entre versiones menores.</tspan></text></svg>
