<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="940" height="440" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Conservar todos los eventos frente a procesarlos en flujo</title><desc id="d">Dos paneles con una medición real: la memoria máxima de Python crece con el tamaño si se conservan los eventos (2,7, 27,3 y 274,3 megabytes con diez mil, cien mil y un millón) y es despreciable al procesarlos en flujo; el tiempo también es menor en flujo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="440" fill="#ffffff"/><text x="20" y="28" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">Memoria máxima de Python (tracemalloc)</tspan></text><text x="110" y="70" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="110" dy="0">10 000</tspan></text><rect x="120" y="48" width="4.59" height="22" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="132.59" y="65" font-size="12" text-anchor="start" font-weight="700" fill="#142231"><tspan x="132.59" dy="0">2.7 MB (lista de eventos)</tspan></text><rect x="120" y="74" width="4" height="22" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="132" y="91" font-size="12" text-anchor="start" font-weight="700" fill="#142231"><tspan x="132" dy="0">&lt; 0,1 MB (en flujo)</tspan></text><text x="110" y="132" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="110" dy="0">100 000</tspan></text><rect x="120" y="110" width="46.41" height="22" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="174.41" y="127" font-size="12" text-anchor="start" font-weight="700" fill="#142231"><tspan x="174.41" dy="0">27.3 MB (lista de eventos)</tspan></text><rect x="120" y="136" width="4" height="22" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="132" y="153" font-size="12" text-anchor="start" font-weight="700" fill="#142231"><tspan x="132" dy="0">&lt; 0,1 MB (en flujo)</tspan></text><text x="110" y="194" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="110" dy="0">1 000 000</tspan></text><rect x="120" y="172" width="466.31" height="22" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="594.31" y="189" font-size="12" text-anchor="start" font-weight="700" fill="#142231"><tspan x="594.31" dy="0">274.3 MB (lista de eventos)</tspan></text><rect x="120" y="198" width="4" height="22" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="132" y="215" font-size="12" text-anchor="start" font-weight="700" fill="#142231"><tspan x="132" dy="0">&lt; 0,1 MB (en flujo)</tspan></text><text x="20" y="270" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">Tiempo de pared, mediana (s)</tspan></text><text x="110" y="306" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="110" dy="0">10 000</tspan></text><rect x="120" y="286" width="6.25" height="18" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="134.25" y="300" font-size="12" text-anchor="start" font-weight="700" fill="#142231"><tspan x="134.25" dy="0">0.015 s</tspan></text><rect x="120" y="306" width="6.1" height="18" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="134.1" y="320" font-size="12" text-anchor="start" font-weight="700" fill="#142231"><tspan x="134.1" dy="0">0.014 s</tspan></text><text x="110" y="350" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="110" dy="0">100 000</tspan></text><rect x="120" y="330" width="29.2" height="18" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="157.2" y="344" font-size="12" text-anchor="start" font-weight="700" fill="#142231"><tspan x="157.2" dy="0">0.168 s</tspan></text><rect x="120" y="350" width="21.25" height="18" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="149.25" y="364" font-size="12" text-anchor="start" font-weight="700" fill="#142231"><tspan x="149.25" dy="0">0.115 s</tspan></text><text x="110" y="394" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="110" dy="0">1 000 000</tspan></text><rect x="120" y="374" width="270.4" height="18" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="398.4" y="388" font-size="12" text-anchor="start" font-weight="700" fill="#142231"><tspan x="398.4" dy="0">1.776 s</tspan></text><rect x="120" y="394" width="204.55" height="18" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="332.55" y="408" font-size="12" text-anchor="start" font-weight="700" fill="#142231"><tspan x="332.55" dy="0">1.337 s</tspan></text><rect x="640" y="48" width="290" height="140" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="785" y="88.36" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="785" dy="0">Rojo = conservar todos los eventos en</tspan></text><text x="785" y="105" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="785" dy="0">una lista. Verde azulado = procesar</tspan></text><text x="785" y="121.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="785" dy="0">uno por vez. Mismo resultado: la</tspan></text><text x="785" y="138.28" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="785" dy="0">misma suma y el mismo conteo en</tspan></text><text x="785" y="154.92" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="785" dy="0">ambos.</tspan></text><rect x="640" y="204" width="290" height="150" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="785" y="249.36" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="785" dy="0">Con un millón de eventos la versión</tspan></text><text x="785" y="266" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="785" dy="0">que conserva tuvo una ejecución de</tspan></text><text x="785" y="282.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="785" dy="0">3,1 s frente a una mediana de 1,8 s:</tspan></text><text x="785" y="299.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="785" dy="0">la presión de memoria añade</tspan></text><text x="785" y="315.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="785" dy="0">variación.</tspan></text><text x="470" y="430" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">CPython 3.12.9 en Windows; 3 a 7 repeticiones. tracemalloc mide solo la memoria que gestiona Python.</tspan></text></svg>
