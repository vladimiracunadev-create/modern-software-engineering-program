<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Promedio, mediana y cola de una distribución de latencias (datos sintéticos)</title><desc id="d">Cien peticiones sintéticas: 95 tardan 10 ms y 5 tardan 500 ms. La mediana es 10 ms, el promedio 34,5 ms y el percentil 99 es 500 ms. Ningún valor único describe la experiencia de todas las personas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="900" height="440" fill="#ffffff"/><text x="20" y="28" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">Cien peticiones: cuántas tardan cada tiempo</tspan></text><line x1="80" y1="330" x2="700" y2="330" stroke="#32505f" stroke-width="1.8"/><line x1="80" y1="60" x2="80" y2="330" stroke="#32505f" stroke-width="1.8"/><rect x="140" y="92.5" width="90" height="237.5" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="185" y="84.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="185" dy="0">95 peticiones</tspan></text><text x="185" y="350" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="185" dy="0">10 ms</tspan></text><rect x="560" y="317.5" width="90" height="12.5" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="605" y="309.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="605" dy="0">5 peticiones</tspan></text><text x="605" y="350" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="605" dy="0">500 ms</tspan></text><line x1="185" y1="70" x2="185" y2="330" stroke="#087f8c" stroke-width="1.6" stroke-dasharray="5 4"/><line x1="230" y1="70" x2="230" y2="330" stroke="#a8761a" stroke-width="1.6" stroke-dasharray="5 4"/><line x1="605" y1="70" x2="605" y2="330" stroke="#c0432f" stroke-width="1.6" stroke-dasharray="5 4"/><text x="190" y="86" font-size="13" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="190" dy="0">mediana 10 ms</tspan></text><text x="236" y="108" font-size="13" text-anchor="start" font-weight="700" fill="#4a3209"><tspan x="236" dy="0">promedio 34,5 ms</tspan></text><text x="596" y="86" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="596" dy="0">p99 500 ms</tspan></text><rect x="20" y="372" width="860" height="56" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="450" y="395.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="450" dy="0">El promedio no coincide con ninguna petición real. Una de cada veinte personas espera 50 veces más: la cola, no la</tspan></text><text x="450" y="411.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="450" dy="0">media, define la experiencia.</tspan></text></svg>
