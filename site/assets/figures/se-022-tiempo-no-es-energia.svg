<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Más rápido no implica menos energía: un ejemplo hipotético</title><desc id="d">Dos versiones hipotéticas: A tarda 10 segundos con 25 vatios (250 julios) y B tarda 14 segundos con 15 vatios (210 julios). B es más lenta y consume menos energía en este supuesto; la energía es potencia por tiempo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="900" height="400" fill="#ffffff"/><text x="20" y="28" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">Energía = potencia media × tiempo (valores supuestos, no medidos)</tspan></text><text x="250" y="86" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">Versión A: 10 s × 25 W</tspan></text><rect x="260" y="62" width="600" height="40" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="868" y="88" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="868" dy="0">250 J</tspan></text><text x="250" y="176" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">Versión B: 14 s × 15 W</tspan></text><rect x="260" y="152" width="504" height="40" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="772" y="178" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="772" dy="0">210 J</tspan></text><rect x="20" y="240" width="860" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="450" y="270.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="450" dy="0">Medir solo el tiempo no entrega julios. Para energía hace falta un medidor de potencia o un contador fiable; sin él</tspan></text><text x="450" y="286.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="450" dy="0">se reporta tiempo y recursos observados y se declara «energía no medida».</tspan></text><rect x="20" y="322" width="860" height="60" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="450" y="347.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="450" dy="0">Intensidad de software (SCI): ((E × I) + M) por unidad funcional R, con E energía, I intensidad de carbono de la</tspan></text><text x="450" y="363.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="450" dy="0">red y M carbono incorporado del hardware.</tspan></text></svg>
