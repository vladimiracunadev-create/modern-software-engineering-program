<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mapa de evidencia: ocho afirmaciones clasificadas</title><desc id="d">Tabla de ocho afirmaciones del dossier con su clasificación como observado, inferido o desconocido y la fuente o el motivo. El consumo de energía, las instrucciones nativas y el comportamiento en producción quedan como desconocidos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="520" fill="#ffffff"/><rect x="10" y="10" width="440" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="230" y="32.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="230" dy="0">Afirmación</tspan></text><rect x="460" y="10" width="170" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="545" y="32.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="545" dy="0">Clasificación</tspan></text><rect x="640" y="10" width="300" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="790" y="32.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="790" dy="0">Evidencia o motivo</tspan></text><rect x="10" y="56" width="440" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="230" y="84.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="230" dy="0">El texto tiene 16 puntos de código y 20 bytes UTF-8</tspan></text><rect x="460" y="56" width="170" height="50" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="545" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="545" dy="0">Observado</tspan></text><rect x="640" y="56" width="300" height="50" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="790" y="84.36" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="790" dy="0">len() y encode() sobre la entrada</tspan></text><rect x="10" y="112" width="440" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="230" y="140.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="230" dy="0">La entrada canónica tiene el hash 7e24a88c96bab208</tspan></text><rect x="460" y="112" width="170" height="50" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="545" y="140.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="545" dy="0">Observado</tspan></text><rect x="640" y="112" width="300" height="50" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="790" y="140.36" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="790" dy="0">hashlib sobre el JSON ordenado</tspan></text><rect x="10" y="168" width="440" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="230" y="196.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="230" dy="0">resumir compila a 15 instrucciones de bytecode</tspan></text><rect x="460" y="168" width="170" height="50" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="545" y="196.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="545" dy="0">Observado (3.12.9)</tspan></text><rect x="640" y="168" width="300" height="50" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="790" y="196.36" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="790" dy="0">dis; cambia con la versión</tspan></text><rect x="10" y="224" width="440" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="230" y="252.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="230" dy="0">La función ejecuta unas 15 instrucciones nativas</tspan></text><rect x="460" y="224" width="170" height="50" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="545" y="252.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="545" dy="0">Desconocido</tspan></text><rect x="640" y="224" width="300" height="50" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="790" y="252.36" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="790" dy="0">Bytecode no es la ISA</tspan></text><rect x="10" y="280" width="440" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="230" y="308.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="230" dy="0">El tiempo es de cómputo, no de espera</tspan></text><rect x="460" y="280" width="170" height="50" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="545" y="308.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="545" dy="0">Inferido</tspan></text><rect x="640" y="280" width="300" height="50" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="790" y="300.68" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="790" dy="0">CPU ≈ pared; la CPU supera a la pared por</tspan></text><text x="790" y="316.04" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="790" dy="0">la resolución del reloj</tspan></text><rect x="10" y="336" width="440" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="230" y="364.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="230" dy="0">El pico de Python es 216 bytes</tspan></text><rect x="460" y="336" width="170" height="50" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="545" y="364.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="545" dy="0">Observado</tspan></text><rect x="640" y="336" width="300" height="50" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="790" y="356.68" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="790" dy="0">tracemalloc; solo memoria gestionada por</tspan></text><text x="790" y="372.04" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="790" dy="0">Python</tspan></text><rect x="10" y="392" width="440" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="230" y="420.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="230" dy="0">La versión consume poca energía</tspan></text><rect x="460" y="392" width="170" height="50" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="545" y="420.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="545" dy="0">Desconocido</tspan></text><rect x="640" y="392" width="300" height="50" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="790" y="420.36" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="790" dy="0">No se midió energía</tspan></text><rect x="10" y="448" width="440" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="230" y="476.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="230" dy="0">Se comporta igual en producción</tspan></text><rect x="460" y="448" width="170" height="50" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="545" y="476.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="545" dy="0">Desconocido</tspan></text><rect x="640" y="448" width="300" height="50" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="790" y="476.36" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="790" dy="0">Entorno, carga y datos distintos</tspan></text><text x="480" y="510" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="480" dy="0">Cada afirmación se enlaza a un comando y un archivo. Si no puede enlazarse, es una inferencia o un desconocido.</tspan></text></svg>
