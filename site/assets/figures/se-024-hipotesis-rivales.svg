<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Hipótesis rivales: qué observación debilita a cada una</title><desc id="d">Tabla con una hipótesis principal y dos rivales: qué predice cada una y qué resultado la debilitaría. Las observaciones que la debilitan se escriben antes de ejecutar.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="400" fill="#ffffff"/><rect x="10" y="10" width="285" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="152.5" y="32.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="152.5" dy="0">Hipótesis</tspan></text><rect x="300" y="10" width="325" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="462.5" y="32.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="462.5" dy="0">Predice</tspan></text><rect x="630" y="10" width="300" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="780" y="32.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="780" dy="0">Se debilita si</tspan></text><rect x="10" y="56" width="285" height="96" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="152.5" y="91" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="152.5" dy="0">H1 (principal): el flujo reduce la</tspan></text><text x="152.5" y="107.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="152.5" dy="0">memoria y no sube la latencia más</tspan></text><text x="152.5" y="124.28" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="152.5" dy="0">del 10 %</tspan></text><rect x="300" y="56" width="325" height="96" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462.5" y="99.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462.5" dy="0">Pico mucho menor; razón de latencias ≤</tspan></text><text x="462.5" y="115.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462.5" dy="0">1,10</tspan></text><rect x="630" y="56" width="300" height="96" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="780" y="99.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="780" dy="0">La razón de latencias supera 1,10 con</tspan></text><text x="780" y="115.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="780" dy="0">rangos separados</tspan></text><rect x="10" y="160" width="285" height="96" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="152.5" y="195" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="152.5" dy="0">H2 (rival): la lectura y el análisis</tspan></text><text x="152.5" y="211.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="152.5" dy="0">dominan; materializar o no apenas</tspan></text><text x="152.5" y="228.28" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="152.5" dy="0">cambia el tiempo</tspan></text><rect x="300" y="160" width="325" height="96" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462.5" y="203.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462.5" dy="0">Latencias casi iguales; la memoria sí</tspan></text><text x="462.5" y="219.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462.5" dy="0">baja</tspan></text><rect x="630" y="160" width="300" height="96" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="780" y="203.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="780" dy="0">El flujo es claramente más rápido o</tspan></text><text x="780" y="219.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="780" dy="0">más lento con rangos separados</tspan></text><rect x="10" y="264" width="285" height="96" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="152.5" y="307.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="152.5" dy="0">H3 (rival): con pocos datos el costo</tspan></text><text x="152.5" y="323.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="152.5" dy="0">fijo domina y no hay diferencia útil</tspan></text><rect x="300" y="264" width="325" height="96" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462.5" y="307.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462.5" dy="0">Diferencias dentro del ruido en 10 000</tspan></text><text x="462.5" y="323.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462.5" dy="0">líneas</tspan></text><rect x="630" y="264" width="300" height="96" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="780" y="307.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="780" dy="0">Diferencia estable y repetible incluso</tspan></text><text x="780" y="323.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="780" dy="0">con pocos datos</tspan></text><text x="470" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Escribir antes qué resultado cuenta contra cada hipótesis evita diseñar el experimento solo para confirmar.</tspan></text></svg>
