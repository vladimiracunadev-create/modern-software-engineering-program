<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 460" width="940" height="460" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Resultados del estudio de ejemplo: latencia y memoria</title><desc id="d">Gráfico con la razón de latencias flujo sobre materializa para tres tamaños y la reducción de memoria. La razón es 1,23 con 10 000 líneas, 0,83 con 100 000 y 0,98 con 400 000; la memoria baja de 1,4, 15,2 y 61,4 megabytes a unos 3,5 kilobytes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="460" fill="#ffffff"/><line x1="90" y1="320" x2="560" y2="320" stroke="#32505f" stroke-width="1.8"/><line x1="90" y1="70" x2="90" y2="320" stroke="#32505f" stroke-width="1.8"/><text x="98" y="62" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="98" dy="0">razón de latencias (flujo / materializa)</tspan></text><line x1="90" y1="139.286" x2="560" y2="139.286" stroke="#c0432f" stroke-width="1.6" stroke-dasharray="5 4"/><text x="566" y="144.286" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14"><tspan x="566" dy="0">umbral 1,10</tspan></text><line x1="90" y1="155.714" x2="560" y2="155.714" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><text x="566" y="160.714" font-size="12" text-anchor="start" font-weight="400" fill="#142231"><tspan x="566" dy="0">igual (1,00)</tspan></text><circle cx="180" cy="117.929" r="12" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="180" y="122.929" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="180" dy="0"></tspan></text><text x="180" y="97.9286" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="180" dy="0">1,23</tspan></text><text x="180" y="340" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="180" dy="0">10 000 líneas</tspan></text><circle cx="330" cy="183.643" r="12" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="330" y="188.643" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="330" dy="0"></tspan></text><text x="330" y="163.643" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="330" dy="0">0,83</tspan></text><text x="330" y="340" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="330" dy="0">100 000 líneas</tspan></text><circle cx="480" cy="159" r="12" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="480" y="164" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="480" dy="0"></tspan></text><text x="480" y="139" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="480" dy="0">0,98</tspan></text><text x="480" y="340" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="480" dy="0">400 000 líneas</tspan></text><rect x="660" y="100" width="270" height="110" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="795" y="133.68" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="795" dy="0">En 10 000 líneas la razón supera</tspan></text><text x="795" y="150.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="795" dy="0">1,10, pero los rangos de las</tspan></text><text x="795" y="166.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="795" dy="0">repeticiones se solapan (13–19</tspan></text><text x="795" y="183.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="795" dy="0">ms): es inconcluso, no un fallo.</tspan></text><rect x="660" y="226" width="270" height="100" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="795" y="254.68" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="795" dy="0">Memoria de Python: 1,4 MB → 3,5</tspan></text><text x="795" y="271.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="795" dy="0">kB; 15,2 MB → 3,5 kB; 61,4 MB →</tspan></text><text x="795" y="287.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="795" dy="0">3,5 kB. Una reducción clara y</tspan></text><text x="795" y="304.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="795" dy="0">repetible.</tspan></text><rect x="660" y="342" width="270" height="90" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="795" y="382.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="795" dy="0">No se mide energía ni producción:</tspan></text><text x="795" y="398.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="795" dy="0">queda fuera de la conclusión.</tspan></text><text x="330" y="440" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="330" dy="0">5 repeticiones por tamaño y versión, orden alternado, semilla 7, CPython 3.12.9 en Windows.</tspan></text></svg>
