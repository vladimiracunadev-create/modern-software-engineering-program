<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 607" width="960" height="607" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dos sistemas, mismo programa: lo que informa cada uno</title><desc id="d">Cada dato que consulta el mismo script de Python sale por dos caminos, uno hacia Windows 11 y otro hacia Ubuntu 24.04 bajo WSL2; en los siete datos observados el valor difiere: sistema, versión, arquitectura, separadores, fin de línea, nombre del sistema de módulos y proceso de inicio.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="607" fill="#ffffff"/><rect x="300" y="12" width="321" height="28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="460.5" y="29.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="460.5" dy="0">Windows 11 (CPython 3.12.9)</tspan></text><rect x="629" y="12" width="321" height="28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="789.5" y="29.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="789.5" dy="0">Linux en WSL2 (CPython 3.12.3)</tspan></text><rect x="10" y="48" width="250" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="135" y="77.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="135" dy="0">platform.system()</tspan></text><rect x="295" y="43" width="660" height="62" rx="12" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><polyline points="260,74 295,74" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="300" y="48" width="321" height="52" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="460.5" y="77.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="460.5" dy="0">Windows</tspan></text><rect x="629" y="48" width="321" height="52" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="789.5" y="77.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="789.5" dy="0">Linux</tspan></text><rect x="10" y="118" width="250" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="135" y="147.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="135" dy="0">Versión informada</tspan></text><rect x="295" y="113" width="660" height="62" rx="12" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><polyline points="260,144 295,144" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="300" y="118" width="321" height="52" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="460.5" y="147.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="460.5" dy="0">release 11; 10.0.26300</tspan></text><rect x="629" y="118" width="321" height="52" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="789.5" y="147.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="789.5" dy="0">kernel 6.18.58.1-microsoft-standard-WSL2</tspan></text><rect x="10" y="188" width="250" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="135" y="217.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="135" dy="0">platform.machine()</tspan></text><rect x="295" y="183" width="660" height="62" rx="12" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><polyline points="260,214 295,214" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="300" y="188" width="321" height="52" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="460.5" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="460.5" dy="0">AMD64</tspan></text><rect x="629" y="188" width="321" height="52" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="789.5" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="789.5" dy="0">x86_64</tspan></text><rect x="10" y="258" width="250" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="135" y="287.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="135" dy="0">Separador de rutas / de PATH</tspan></text><rect x="295" y="253" width="660" height="62" rx="12" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><polyline points="260,284 295,284" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="300" y="258" width="321" height="52" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="460.5" y="287.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="460.5" dy="0">«\» y «;»</tspan></text><rect x="629" y="258" width="321" height="52" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="789.5" y="287.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="789.5" dy="0">«/» y «:»</tspan></text><rect x="10" y="328" width="250" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="135" y="357.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="135" dy="0">Fin de línea (os.linesep)</tspan></text><rect x="295" y="323" width="660" height="62" rx="12" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><polyline points="260,354 295,354" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="300" y="328" width="321" height="52" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="460.5" y="357.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="460.5" dy="0">\r\n</tspan></text><rect x="629" y="328" width="321" height="52" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="789.5" y="357.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="789.5" dy="0">\n</tspan></text><rect x="10" y="398" width="250" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="135" y="427.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="135" dy="0">os.name</tspan></text><rect x="295" y="393" width="660" height="62" rx="12" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><polyline points="260,424 295,424" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="300" y="398" width="321" height="52" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="460.5" y="427.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="460.5" dy="0">nt</tspan></text><rect x="629" y="398" width="321" height="52" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="789.5" y="427.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="789.5" dy="0">posix</tspan></text><rect x="10" y="468" width="250" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="135" y="497.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="135" dy="0">Proceso 1 / virtualización</tspan></text><rect x="295" y="463" width="660" height="62" rx="12" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><polyline points="260,494 295,494" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="300" y="468" width="321" height="52" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="460.5" y="497.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="460.5" dy="0">No aplicable</tspan></text><rect x="629" y="468" width="321" height="52" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="789.5" y="497.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="789.5" dy="0">systemd; systemd-detect-virt = wsl</tspan></text><rect x="10" y="534" width="940" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="558.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Mismo hardware, distinta plataforma efectiva: «AMD64» y «x86_64» nombran la misma ISA, y «Linux» aquí corre dentro de una</tspan></text><text x="480" y="575.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">máquina virtual ligera.</tspan></text></svg>
