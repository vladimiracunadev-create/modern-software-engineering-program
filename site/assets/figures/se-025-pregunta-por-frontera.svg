<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una pregunta diagnóstica por frontera</title><desc id="d">Cinco capas de la aplicación al hardware. Para cada frontera se indica la pregunta que permite ubicar un fallo y la evidencia que la discrimina.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="470" fill="#ffffff"/><rect x="10" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="102" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="102" dy="0">Capa</tspan></text><rect x="200" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="347" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="347" dy="0">Pregunta</tspan></text><rect x="500" y="12" width="444" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="722" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="722" dy="0">Evidencia que la discrimina</tspan></text><rect x="10" y="56" width="184" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="89.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">Aplicación</tspan></text><rect x="200" y="56" width="294" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="347" y="89.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="347" dy="0">¿Construyó bien la petición?</tspan></text><rect x="500" y="56" width="444" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="89.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">Argumentos, excepción y traza del propio programa</tspan></text><rect x="10" y="122" width="184" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="155.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">Biblioteca o runtime</tspan></text><rect x="200" y="122" width="294" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="347" y="155.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="347" dy="0">¿Existe la función en esta versión?</tspan></text><rect x="500" y="122" width="444" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="155.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">Versión del runtime; ImportError o AttributeError</tspan></text><rect x="10" y="188" width="184" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="221.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">API del sistema</tspan></text><rect x="200" y="188" width="294" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="347" y="221.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="347" dy="0">¿Existe en esta plataforma?</tspan></text><rect x="500" y="188" width="444" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="221.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">Código de error del sistema (por ejemplo, WinError 1314)</tspan></text><rect x="10" y="254" width="184" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="287.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">Kernel</tspan></text><rect x="200" y="254" width="294" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="347" y="287.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="347" dy="0">¿Lo autorizó y pudo cumplirlo?</tspan></text><rect x="500" y="254" width="444" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="287.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">Permission denied, política, registro del sistema</tspan></text><rect x="10" y="320" width="184" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="353.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">Controlador y recurso</tspan></text><rect x="200" y="320" width="294" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="347" y="353.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="347" dy="0">¿El dispositivo pudo atenderlo?</tspan></text><rect x="500" y="320" width="444" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="353.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">Errores de E/S, estado del dispositivo, registros</tspan></text><text x="480" y="452" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="480" dy="0">Versión, arquitectura y política pueden alterar varias fronteras: se registra el contexto antes de culpar una capa.</tspan></text></svg>
