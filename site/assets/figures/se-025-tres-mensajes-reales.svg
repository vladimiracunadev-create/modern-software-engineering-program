<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 449" width="960" height="449" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres mensajes de error reales y la capa que señalan</title><desc id="d">Tres errores observados, cada uno con su capa y la prueba que lo discrimina: un script con finales de línea de Windows en Linux, un script sin bit de ejecución y la creación de un enlace simbólico sin privilegio en Windows.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="449" fill="#ffffff"/><text x="160" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="160" dy="0">Mensaje observado</tspan></text><text x="471" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="471" dy="0">Capa que señala</tspan></text><text x="791" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="791" dy="0">Prueba que lo discrimina</tspan></text><rect x="10" y="38" width="300" height="96" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="160" y="81.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">/usr/bin/env: ‘bash\r’: No such file</tspan></text><text x="160" y="97.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">or directory</tspan></text><rect x="346" y="38" width="250" height="96" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="471" y="81.32" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="471" dy="0">Formato del script e intérprete</tspan></text><text x="471" y="97.96" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="471" dy="0">(shebang)</tspan></text><rect x="632" y="38" width="318" height="96" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="791" y="73" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="791" dy="0">`file script.sh` informa «with CRLF line</tspan></text><text x="791" y="89.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="791" dy="0">terminators»; al convertir los finales,</tspan></text><text x="791" y="106.28" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="791" dy="0">funciona</tspan></text><polyline points="310,86 346,86" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="596,86 632,86" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="152" width="300" height="96" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="160" y="195.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">Permission denied al ejecutar</tspan></text><text x="160" y="211.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">./script.sh</tspan></text><rect x="346" y="152" width="250" height="96" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="471" y="195.32" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="471" dy="0">Política del sistema de</tspan></text><text x="471" y="211.96" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="471" dy="0">archivos (bit de ejecución)</tspan></text><rect x="632" y="152" width="318" height="96" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="791" y="195.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="791" dy="0">`bash script.sh` funciona: el contenido</tspan></text><text x="791" y="211.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="791" dy="0">es válido y falta el permiso</tspan></text><polyline points="310,200 346,200" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="596,200 632,200" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="266" width="300" height="96" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="160" y="301" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">OSError: [WinError 1314] Un privilegio</tspan></text><text x="160" y="317.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">requerido no es retenido por el</tspan></text><text x="160" y="334.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">cliente</tspan></text><rect x="346" y="266" width="250" height="96" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="471" y="301" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="471" dy="0">API y política de Windows</tspan></text><text x="471" y="317.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="471" dy="0">(privilegio de enlaces</tspan></text><text x="471" y="334.28" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="471" dy="0">simbólicos)</tspan></text><rect x="632" y="266" width="318" height="96" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="791" y="301" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="791" dy="0">El mismo código funciona en ext4 de WSL;</tspan></text><text x="791" y="317.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="791" dy="0">el fallo depende del privilegio, no del</tspan></text><text x="791" y="334.28" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="791" dy="0">código</tspan></text><polyline points="310,314 346,314" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="596,314 632,314" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="376" width="940" height="59.28" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="480" y="400.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="480" dy="0">Cada mensaje nombra un síntoma, no un sistema operativo entero. «Es un problema de Windows» o «en Linux sí funciona» no</tspan></text><text x="480" y="417.6" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="480" dy="0">explica nada: la prueba de la tercera columna sí separa las hipótesis.</tspan></text></svg>
