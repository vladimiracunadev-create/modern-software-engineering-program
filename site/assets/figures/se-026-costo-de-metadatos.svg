<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El costo de cruzar la frontera de sistema de archivos</title><desc id="d">Barras con una medición real: crear 2000 archivos pequeños tarda 0,33 s en ext4, 1,32 s en NTFS desde Windows y 12,79 s en el montaje 9p de WSL; hacer stat de 2000 archivos tarda 0,007 s, 0,116 s y 4,886 s respectivamente.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="440" fill="#ffffff"/><text x="20" y="28" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">Crear 2000 archivos de un byte (segundos)</tspan></text><text x="220" y="65" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="220" dy="0">ext4 (WSL2)</tspan></text><rect x="230" y="44" width="13.28" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="251.28" y="65" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="251.28" dy="0">0,33 s</tspan></text><text x="220" y="107" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="220" dy="0">NTFS (Windows)</tspan></text><rect x="230" y="86" width="52.64" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="290.64" y="107" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="290.64" dy="0">1,32 s</tspan></text><text x="220" y="149" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="220" dy="0">9p sobre C: (WSL2)</tspan></text><rect x="230" y="128" width="511.68" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="749.68" y="149" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="749.68" dy="0">12,79 s</tspan></text><text x="20" y="214" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">Hacer stat de 2000 archivos (segundos)</tspan></text><text x="220" y="251" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="220" dy="0">ext4 (WSL2)</tspan></text><rect x="230" y="230" width="4" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="242" y="251" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="242" dy="0">0,007 s</tspan></text><text x="220" y="293" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="220" dy="0">NTFS (Windows)</tspan></text><rect x="230" y="272" width="9.28" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="247.28" y="293" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="247.28" dy="0">0,12 s</tspan></text><text x="220" y="335" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="220" dy="0">9p sobre C: (WSL2)</tspan></text><rect x="230" y="314" width="390.88" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="628.88" y="335" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="628.88" dy="0">4,89 s</tspan></text><rect x="20" y="372" width="920" height="56" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="480" y="395.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="480" dy="0">Mantener un proyecto con muchos archivos pequeños en /mnt/c es unas 38 veces más lento al crear y unas 700 veces más lento</tspan></text><text x="480" y="411.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="480" dy="0">al consultar metadatos que en ext4 de WSL.</tspan></text><text x="480" y="436" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Una ejecución por celda, Python 3.12 en cada entorno. Los valores dependen del equipo y de las políticas de seguridad; el patrón es el resultado.</tspan></text></svg>
