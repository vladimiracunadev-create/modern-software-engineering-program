<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 573" width="960" height="573" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres sistemas de archivos, tres comportamientos medidos</title><desc id="d">Seis propiedades de una misma prueba ejecutada en NTFS bajo Windows, ext4 bajo WSL2 y el montaje 9p de la unidad de Windows. Cuando los tres dan el mismo resultado las cajas se unen en una; en las demás propiedades se separan: sensibilidad a mayúsculas, enlaces simbólicos, efecto de chmod 600 y nombres con dos puntos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="573" fill="#ffffff"/><rect x="300" y="12" width="211.333" height="28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="405.667" y="29.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="405.667" dy="0">NTFS (Windows)</tspan></text><rect x="519.333" y="12" width="211.333" height="28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="625" y="29.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="625" dy="0">ext4 (WSL2)</tspan></text><rect x="738.667" y="12" width="211.333" height="28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="844.333" y="29.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="844.333" dy="0">9p sobre C: (WSL2)</tspan></text><rect x="10" y="48" width="250" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="135" y="80.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="135" dy="0">Distingue Aa.txt de aA.txt</tspan></text><rect x="295" y="43" width="660" height="68" rx="12" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><polyline points="260,77 295,77" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="300" y="48" width="211.333" height="58" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="405.667" y="80.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="405.667" dy="0">No (conserva el caso)</tspan></text><rect x="519.333" y="48" width="211.333" height="58" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="625" y="80.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="625" dy="0">Sí</tspan></text><rect x="738.667" y="48" width="211.333" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="844.333" y="80.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="844.333" dy="0">No</tspan></text><rect x="10" y="124" width="250" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="135" y="148.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="135" dy="0">Enlace simbólico sin</tspan></text><text x="135" y="164.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="135" dy="0">privilegios</tspan></text><rect x="295" y="119" width="660" height="68" rx="12" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><polyline points="260,153 295,153" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="300" y="124" width="211.333" height="58" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="405.667" y="156.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="405.667" dy="0">No: WinError 1314</tspan></text><rect x="519.333" y="124" width="211.333" height="58" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="625" y="156.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="625" dy="0">Sí</tspan></text><rect x="738.667" y="124" width="211.333" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="844.333" y="148.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="844.333" dy="0">Sí (con el privilegio de</tspan></text><text x="844.333" y="164.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="844.333" dy="0">la interoperabilidad)</tspan></text><rect x="10" y="200" width="250" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="135" y="232.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="135" dy="0">Enlace físico (nlink)</tspan></text><rect x="295" y="195" width="660" height="68" rx="12" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><polyline points="260,229 295,229" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="300" y="200" width="650" height="58" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="625" y="232.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="625" dy="0">Sí; nlink = 2</tspan></text><rect x="10" y="276" width="250" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="135" y="308.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="135" dy="0">Modo tras chmod 600</tspan></text><rect x="295" y="271" width="660" height="68" rx="12" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><polyline points="260,305 295,305" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="300" y="276" width="211.333" height="58" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="405.667" y="308.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="405.667" dy="0">0o666 (solo solo-lectura)</tspan></text><rect x="519.333" y="276" width="211.333" height="58" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="625" y="308.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="625" dy="0">0o600</tspan></text><rect x="738.667" y="276" width="211.333" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="844.333" y="308.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="844.333" dy="0">0o777 (emulado)</tspan></text><rect x="10" y="352" width="250" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="135" y="384.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="135" dy="0">Nombre «a:b.txt»</tspan></text><rect x="295" y="347" width="660" height="68" rx="12" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><polyline points="260,381 295,381" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="300" y="352" width="211.333" height="58" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="405.667" y="376.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="405.667" dy="0">Error (el «:» tiene</tspan></text><text x="405.667" y="392.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="405.667" dy="0">significado)</tspan></text><rect x="519.333" y="352" width="211.333" height="58" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="625" y="384.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="625" dy="0">Permitido</tspan></text><rect x="738.667" y="352" width="211.333" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="844.333" y="376.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="844.333" dy="0">Permitido (pero no</tspan></text><text x="844.333" y="392.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="844.333" dy="0">sobrevive en NTFS)</tspan></text><rect x="10" y="428" width="250" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="135" y="460.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="135" dy="0">é compuesta y descompuesta</tspan></text><rect x="295" y="423" width="660" height="68" rx="12" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><polyline points="260,457 295,457" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="300" y="428" width="650" height="58" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="625" y="460.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="625" dy="0">Dos entradas distintas</tspan></text><rect x="10" y="500" width="940" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="524.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Una operación correcta en un sistema de archivos puede fallar o cambiar de significado en otro. El mismo código y el mismo</tspan></text><text x="480" y="541.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">nombre de archivo no son suficientes: se declara qué sistema de archivos se usa.</tspan></text></svg>
