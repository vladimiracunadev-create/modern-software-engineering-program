<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres sistemas de archivos, tres comportamientos medidos</title><desc id="d">Tabla con los resultados de una misma prueba en NTFS bajo Windows, ext4 bajo WSL2 y el montaje 9p de la unidad de Windows visto desde WSL: sensibilidad a mayúsculas, enlaces simbólicos y físicos, efecto de chmod 600 y coexistencia de nombres equivalentes en Unicode.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="500" fill="#ffffff"/><rect x="10" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="132" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="132" dy="0">Propiedad</tspan></text><rect x="260" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="372" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="372" dy="0">NTFS (Windows)</tspan></text><rect x="490" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="592" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="592" dy="0">ext4 (WSL2)</tspan></text><rect x="700" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="822" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="822" dy="0">9p sobre C: (WSL2)</tspan></text><rect x="10" y="56" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="85.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Distingue Aa.txt de aA.txt</tspan></text><rect x="260" y="56" width="224" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="372" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372" dy="0">No (conserva el caso)</tspan></text><rect x="490" y="56" width="204" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">Sí</tspan></text><rect x="700" y="56" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">No</tspan></text><rect x="10" y="114" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="143.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Enlace simbólico sin privilegios</tspan></text><rect x="260" y="114" width="224" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="372" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372" dy="0">No: WinError 1314</tspan></text><rect x="490" y="114" width="204" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">Sí</tspan></text><rect x="700" y="114" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="135.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">Sí (con el privilegio de la</tspan></text><text x="822" y="151.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">interoperabilidad)</tspan></text><rect x="10" y="172" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="201.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Enlace físico (nlink)</tspan></text><rect x="260" y="172" width="224" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="372" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372" dy="0">Sí; nlink = 2</tspan></text><rect x="490" y="172" width="204" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">Sí; nlink = 2</tspan></text><rect x="700" y="172" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">Sí; nlink = 2</tspan></text><rect x="10" y="230" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="259.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Modo tras chmod 600</tspan></text><rect x="260" y="230" width="224" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="372" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372" dy="0">0o666 (solo solo-lectura)</tspan></text><rect x="490" y="230" width="204" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">0o600</tspan></text><rect x="700" y="230" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">0o777 (emulado)</tspan></text><rect x="10" y="288" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="317.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Nombre «a:b.txt»</tspan></text><rect x="260" y="288" width="224" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="372" y="309.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372" dy="0">Error (el «:» tiene</tspan></text><text x="372" y="325.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372" dy="0">significado)</tspan></text><rect x="490" y="288" width="204" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="317.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">Permitido</tspan></text><rect x="700" y="288" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="309.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">Permitido (pero no sobrevive en</tspan></text><text x="822" y="325.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">NTFS)</tspan></text><rect x="10" y="346" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="375.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">é compuesta y descompuesta</tspan></text><rect x="260" y="346" width="224" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="372" y="375.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372" dy="0">Dos entradas distintas</tspan></text><rect x="490" y="346" width="204" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="375.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">Dos entradas distintas</tspan></text><rect x="700" y="346" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="375.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">Dos entradas distintas</tspan></text><rect x="10" y="420" width="940" height="62" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="446.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Una operación correcta en un sistema de archivos puede fallar o cambiar de significado en otro. El mismo código y el mismo</tspan></text><text x="480" y="462.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">nombre de archivo no son suficientes: se declara qué sistema de archivos se usa.</tspan></text></svg>
