<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué hace chmod en Linux y en Windows: resultados reales</title><desc id="d">Tabla de cuatro modos aplicados a un archivo propio, con lo observado en Linux (ext4, usuario sin privilegios) y en Windows: el modo que se ve, si se puede leer y si se puede escribir.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="470" fill="#ffffff"/><rect x="10" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="107" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="107" dy="0">Modo pedido</tspan></text><rect x="210" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="397" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="397" dy="0">Linux: ve / lee / escribe</tspan></text><rect x="590" y="12" width="354" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="767" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="767" dy="0">Windows: ve / lee / escribe</tspan></text><rect x="10" y="56" width="194" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="86.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">0o644</tspan></text><rect x="210" y="56" width="374" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="86.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">0o644 · lee · escribe</tspan></text><rect x="590" y="56" width="354" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="86.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">0o666 · lee · escribe</tspan></text><rect x="10" y="116" width="194" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="146.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">0o600</tspan></text><rect x="210" y="116" width="374" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="146.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">0o600 · lee · escribe</tspan></text><rect x="590" y="116" width="354" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="146.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">0o666 · lee · escribe</tspan></text><rect x="10" y="176" width="194" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="206.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">0o000</tspan></text><rect x="210" y="176" width="374" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="206.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">0o000 · PermissionError · PermissionError</tspan></text><rect x="590" y="176" width="354" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="206.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">0o444 · lee · PermissionError</tspan></text><rect x="10" y="236" width="194" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="266.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">0o444</tspan></text><rect x="210" y="236" width="374" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="266.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">0o444 · lee · PermissionError</tspan></text><rect x="590" y="236" width="354" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="266.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">0o444 · lee · PermissionError</tspan></text><rect x="10" y="310" width="940" height="74" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="342.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">En Windows, chmod solo activa o quita el atributo de solo lectura: 0o000 no impide leer. Los permisos reales de Windows viven</tspan></text><text x="480" y="358.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">en listas de control de acceso (ACL) y tokens, no en bits de modo.</tspan></text><rect x="10" y="394" width="940" height="56" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="480" y="425.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="480" dy="0">Linux comprobó como usuario sin privilegios (uid 1000); como administrador el resultado de 0o000 sería otro.</tspan></text></svg>
