<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 429" width="960" height="429" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué hace chmod en Linux y en Windows: resultados reales</title><desc id="d">Cuatro modos aplicados a un archivo propio. Cada modo pedido produce un resultado en Linux (ext4, usuario sin privilegios) y otro en Windows, expresado como el modo que se ve, si se puede leer y si se puede escribir; solo el modo 0o444 da lo mismo en ambos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="429" fill="#ffffff"/><rect x="270" y="12" width="336" height="28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="438" y="29.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="438" dy="0">Linux: ve · lee · escribe</tspan></text><rect x="614" y="12" width="336" height="28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="782" y="29.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="782" dy="0">Windows: ve · lee · escribe</tspan></text><rect x="10" y="48" width="220" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="120" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="120" dy="0">Se pide 0o644</tspan></text><rect x="265" y="43" width="690" height="66" rx="12" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><polyline points="230,76 265,76" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="270" y="48" width="336" height="56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="438" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="438" dy="0">0o644 · lee · escribe</tspan></text><rect x="614" y="48" width="336" height="56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="782" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="782" dy="0">0o666 · lee · escribe</tspan></text><rect x="10" y="122" width="220" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="120" y="153.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="120" dy="0">Se pide 0o600</tspan></text><rect x="265" y="117" width="690" height="66" rx="12" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><polyline points="230,150 265,150" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="270" y="122" width="336" height="56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="438" y="153.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="438" dy="0">0o600 · lee · escribe</tspan></text><rect x="614" y="122" width="336" height="56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="782" y="153.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="782" dy="0">0o666 · lee · escribe</tspan></text><rect x="10" y="196" width="220" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="120" y="227.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="120" dy="0">Se pide 0o000</tspan></text><rect x="265" y="191" width="690" height="66" rx="12" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><polyline points="230,224 265,224" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="270" y="196" width="336" height="56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="438" y="227.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="438" dy="0">0o000 · PermissionError · PermissionError</tspan></text><rect x="614" y="196" width="336" height="56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="782" y="227.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="782" dy="0">0o444 · lee · PermissionError</tspan></text><rect x="10" y="270" width="220" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="120" y="301.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="120" dy="0">Se pide 0o444</tspan></text><rect x="265" y="265" width="690" height="66" rx="12" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><polyline points="230,298 265,298" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="270" y="270" width="680" height="56" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="610" y="301.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="610" dy="0">0o444 · lee · PermissionError</tspan></text><rect x="10" y="340" width="940" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="364.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">En Windows, chmod solo activa o quita el atributo de solo lectura: 0o000 no impide leer. Los permisos reales de Windows viven</tspan></text><text x="480" y="381.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">en listas de control de acceso (ACL) y tokens, no en bits de modo. Linux se comprobó como usuario sin privilegios (uid 1000);</tspan></text><text x="480" y="398.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">como administrador el resultado de 0o000 sería otro.</tspan></text></svg>
