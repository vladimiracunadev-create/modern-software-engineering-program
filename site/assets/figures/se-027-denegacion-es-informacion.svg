<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 389" width="960" height="389" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una denegación es información: dos intentos observados</title><desc id="d">Tres comandos como usuario sin privilegios, cada uno con su resultado y su lectura: leer /etc/shadow (modo 640, propietario root) produce Permission denied; sudo sin contraseña interactiva informa que se requiere una contraseña; id muestra que la identidad no equivale a autoridad.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="389" fill="#ffffff"/><text x="110" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="110" dy="0">Intento</tspan></text><text x="411" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="411" dy="0">Resultado observado</tspan></text><text x="781" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="781" dy="0">Lectura correcta</tspan></text><rect x="10" y="38" width="200" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="110" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="110" dy="0">cat /etc/shadow</tspan></text><rect x="246" y="38" width="330" height="76" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="411" y="71.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="411" dy="0">cat: /etc/shadow: Permission denied (modo</tspan></text><text x="411" y="87.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="411" dy="0">640, propietario root)</tspan></text><rect x="612" y="38" width="338" height="76" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="781" y="63" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="781" dy="0">El kernel aplicó el control de acceso: el</tspan></text><text x="781" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="781" dy="0">archivo existe y la identidad no tiene el</tspan></text><text x="781" y="96.28" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="781" dy="0">permiso</tspan></text><polyline points="210,76 246,76" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="576,76 612,76" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="132" width="200" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="110" y="173.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="110" dy="0">sudo -n true</tspan></text><rect x="246" y="132" width="330" height="76" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="411" y="173.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="411" dy="0">sudo: a password is required</tspan></text><rect x="612" y="132" width="338" height="76" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="781" y="157" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="781" dy="0">La elevación requiere una autenticación que</tspan></text><text x="781" y="173.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="781" dy="0">este contexto no ofrece; no es una falla</tspan></text><text x="781" y="190.28" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="781" dy="0">del comando</tspan></text><polyline points="210,170 246,170" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="576,170 612,170" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="226" width="200" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="110" y="267.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="110" dy="0">id (uid 1000)</tspan></text><rect x="246" y="226" width="330" height="76" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="411" y="259.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="411" dy="0">El usuario pertenece a varios grupos y no</tspan></text><text x="411" y="275.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="411" dy="0">a root</tspan></text><rect x="612" y="226" width="338" height="76" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="781" y="251" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="781" dy="0">Identidad no equivale a autoridad: los</tspan></text><text x="781" y="267.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="781" dy="0">grupos y la política deciden qué puede</tspan></text><text x="781" y="284.28" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="781" dy="0">hacerse</tspan></text><polyline points="210,264 246,264" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="576,264 612,264" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="316" width="940" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="340.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Elevar privilegios para «ver si funciona» es una intervención con riesgo y no una prueba. La respuesta correcta empieza por</tspan></text><text x="480" y="357.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">identificar sujeto, acción, objeto y política.</tspan></text></svg>
