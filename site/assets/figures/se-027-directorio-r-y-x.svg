<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">En un directorio, r lista y x atraviesa</title><desc id="d">Un directorio con modo 600 (solo lectura y escritura del propietario, sin permiso de ejecución): listar sus nombres funciona, pero consultar un archivo hijo falla con PermissionError.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="400" fill="#ffffff"/><rect x="20" y="40" width="280" height="100" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="160" y="84.96" font-size="14" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="160" dy="0">directorio con modo 600</tspan></text><text x="160" y="102.88" font-size="14" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="160" dy="0">(rw-, sin x)</tspan></text><rect x="380" y="40" width="260" height="56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="510" y="71.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="510" dy="0">os.listdir(dir) → funciona</tspan></text><rect x="380" y="104" width="260" height="56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="510" y="135.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="510" dy="0">os.stat(dir/a) → PermissionError</tspan></text><polyline points="300,80 380,68" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="300,100 380,132" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="680" y="40" width="240" height="120" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="800" y="78.68" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="800" dy="0">r permite leer los nombres. x</tspan></text><text x="800" y="95.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="800" dy="0">permite atravesar el</tspan></text><text x="800" y="111.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="800" dy="0">directorio para llegar a lo</tspan></text><text x="800" y="128.6" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="800" dy="0">que contiene.</tspan></text><rect x="20" y="190" width="900" height="90" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="230.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Para atravesar /a/b/c se necesita x en cada directorio del camino y los permisos del archivo final. Un archivo con</tspan></text><text x="470" y="246.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">permisos correctos puede ser inalcanzable si un directorio superior no concede x.</tspan></text><rect x="20" y="292" width="900" height="70" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="470" y="322.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="470" dy="0">En Windows el modelo es distinto: la lista de control de acceso del objeto y el token del proceso se evalúan juntos, y</tspan></text><text x="470" y="338.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="470" dy="0">existe un privilegio de «omitir comprobación de recorrido».</tspan></text></svg>
