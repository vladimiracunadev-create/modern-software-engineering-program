<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cómo termina un proceso: códigos de salida observados en Windows y Linux</title><desc id="d">Tabla con el código de retorno observado desde Python: salir con 3 da 3 en ambos; una excepción sin tratar da 1 en ambos; terminar un proceso con terminate() da 1 en Windows y -15 en Linux; SIGKILL da -9 en Linux; con un manejador de SIGTERM el proceso limpia y sale con 0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="470" fill="#ffffff"/><rect x="10" y="12" width="414" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="217" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="217" dy="0">Cómo termina</tspan></text><rect x="430" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="562" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="562" dy="0">Windows</tspan></text><rect x="700" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="822" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="822" dy="0">Linux (WSL2)</tspan></text><rect x="10" y="56" width="414" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">sys.exit(3)</tspan></text><rect x="430" y="56" width="264" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="84.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">3</tspan></text><rect x="700" y="56" width="244" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="84.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">3</tspan></text><rect x="10" y="112" width="414" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="140.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Excepción sin tratar</tspan></text><rect x="430" y="112" width="264" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="140.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">1</tspan></text><rect x="700" y="112" width="244" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="140.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">1</tspan></text><rect x="10" y="168" width="414" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="196.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">terminate() sin manejador</tspan></text><rect x="430" y="168" width="264" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="196.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">1 (TerminateProcess)</tspan></text><rect x="700" y="168" width="244" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="196.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">-15 (señal SIGTERM)</tspan></text><rect x="10" y="224" width="414" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="252.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">kill / SIGKILL</tspan></text><rect x="430" y="224" width="264" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="252.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">No aplicable como señal</tspan></text><rect x="700" y="224" width="244" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="252.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">-9 (no se puede interceptar)</tspan></text><rect x="10" y="280" width="414" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="308.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">SIGTERM con manejador que limpia</tspan></text><rect x="430" y="280" width="264" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="308.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">No aplicable</tspan></text><rect x="700" y="280" width="244" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="308.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">0 y escribe «limpiando»</tspan></text><rect x="10" y="336" width="414" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="364.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">subprocess.run(timeout=1) sobre un proceso de 10 s</tspan></text><rect x="430" y="336" width="264" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="364.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">TimeoutExpired</tspan></text><rect x="700" y="336" width="244" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="364.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">TimeoutExpired</tspan></text><rect x="10" y="408" width="940" height="50" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="428.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">En POSIX un código negativo en Python significa «terminado por la señal N»; en Windows no existe ese canal y todo es un</tspan></text><text x="480" y="444.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">entero.</tspan></text></svg>
