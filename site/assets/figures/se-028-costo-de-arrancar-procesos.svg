<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Crear un proceso cuesta más en Windows que en Linux</title><desc id="d">Barras con una medición real: arrancar un intérprete de Python vacío tarda en promedio 140,2 milisegundos en Windows y 25,8 milisegundos en Linux (WSL2).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="900" height="340" fill="#ffffff"/><text x="20" y="28" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">Arrancar `python -c pass` (milisegundos, promedio de 10)</tspan></text><text x="180" y="77" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="180" dy="0">Linux (WSL2)</tspan></text><rect x="190" y="56" width="103.2" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="301.2" y="77" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="301.2" dy="0">25,8 ms</tspan></text><text x="180" y="127" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="180" dy="0">Windows</tspan></text><rect x="190" y="106" width="560.8" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="758.8" y="127" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="758.8" dy="0">140,2 ms</tspan></text><rect x="20" y="170" width="860" height="90" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="450" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="450" dy="0">Un diseño que lanza un proceso por tarea paga ese costo cada vez. Por eso se reutilizan procesos (agrupaciones), se</tspan></text><text x="450" y="218.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="450" dy="0">agrupan tareas o se usan hilos para esperas. El valor incluye el arranque del intérprete, no solo la llamada al</tspan></text><text x="450" y="235.28" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="450" dy="0">sistema.</tspan></text><text x="450" y="300" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">Una máquina, un día; el cociente (5,4 veces) es la lectura, no los milisegundos.</tspan></text></svg>
