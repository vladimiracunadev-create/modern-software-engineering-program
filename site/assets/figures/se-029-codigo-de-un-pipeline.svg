<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 482" width="960" height="482" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El código de salida de un pipeline</title><desc id="d">Cinco situaciones de Bash con su resultado: false | true da código 0 por defecto y 1 con pipefail; un cd fallido sin set -e deja al script operando en el directorio anterior y con set -e detiene el subshell con código 1; ls de un directorio inexistente da 2.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="482" fill="#ffffff"/><text x="145" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="145" dy="0">Situación</tspan></text><text x="441" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="441" dy="0">Resultado observado</tspan></text><text x="776" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="776" dy="0">Lectura</tspan></text><rect x="10" y="38" width="270" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="145" y="70.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="145" dy="0">false | true</tspan></text><rect x="316" y="38" width="250" height="58" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="441" y="70.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="441" dy="0">código 0</tspan></text><rect x="602" y="38" width="348" height="58" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="776" y="62.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="776" dy="0">Solo cuenta el último comando: el fallo</tspan></text><text x="776" y="78.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="776" dy="0">inicial se oculta</tspan></text><polyline points="280,67 316,67" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="566,67 602,67" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="114" width="270" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="145" y="146.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="145" dy="0">set -o pipefail; false | true</tspan></text><rect x="316" y="114" width="250" height="58" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="441" y="146.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="441" dy="0">código 1</tspan></text><rect x="602" y="114" width="348" height="58" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="776" y="138.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="776" dy="0">Cualquier comando que falle hace fallar el</tspan></text><text x="776" y="154.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="776" dy="0">pipeline</tspan></text><polyline points="280,143 316,143" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="566,143 602,143" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="190" width="270" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="145" y="222.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="145" dy="0">cd /noexiste (sin set -e)</tspan></text><rect x="316" y="190" width="250" height="58" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="441" y="214.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="441" dy="0">el script sigue en el</tspan></text><text x="441" y="230.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="441" dy="0">directorio anterior</tspan></text><rect x="602" y="190" width="348" height="58" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="776" y="214.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="776" dy="0">Un fallo ignorado deja el script operando en</tspan></text><text x="776" y="230.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="776" dy="0">otro lugar</tspan></text><polyline points="280,219 316,219" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="566,219 602,219" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="266" width="270" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="145" y="298.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="145" dy="0">set -e; cd /noexiste</tspan></text><rect x="316" y="266" width="250" height="58" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="441" y="290.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="441" dy="0">el subshell termina con código</tspan></text><text x="441" y="306.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="441" dy="0">1</tspan></text><rect x="602" y="266" width="348" height="58" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="776" y="298.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="776" dy="0">El fallo detiene la ejecución</tspan></text><polyline points="280,295 316,295" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="566,295 602,295" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="342" width="270" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="145" y="374.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="145" dy="0">ls /noexiste</tspan></text><rect x="316" y="342" width="250" height="58" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="441" y="374.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="441" dy="0">código 2</tspan></text><rect x="602" y="342" width="348" height="58" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="776" y="366.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="776" dy="0">Los códigos son una interfaz: cada</tspan></text><text x="776" y="382.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="776" dy="0">herramienta documenta los suyos</tspan></text><polyline points="280,371 316,371" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="566,371 602,371" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="414" width="940" height="54" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="444.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Un script robusto declara cómo trata los fallos y comprueba los códigos que le importan.</tspan></text></svg>
