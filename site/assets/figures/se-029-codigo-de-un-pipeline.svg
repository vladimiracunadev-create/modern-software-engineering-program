<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="940" height="440" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El código de salida de un pipeline</title><desc id="d">Con el pipeline «false | true», Bash informa código 0 por defecto, y con pipefail activado informa 1; dentro de un subshell con set -e un cd fallido detiene el script con código 1, mientras que sin set -e el script continúa en el directorio anterior.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="440" fill="#ffffff"/><rect x="10" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="142" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="142" dy="0">Situación</tspan></text><rect x="280" y="12" width="284" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="422" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="422" dy="0">Resultado observado</tspan></text><rect x="570" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="757" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="757" dy="0">Lectura</tspan></text><rect x="10" y="56" width="264" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="88.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">false | true</tspan></text><rect x="280" y="56" width="284" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="88.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">código 0</tspan></text><rect x="570" y="56" width="374" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="80.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">Solo cuenta el último comando: el fallo inicial</tspan></text><text x="757" y="96.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">se oculta</tspan></text><rect x="10" y="120" width="264" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="152.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">set -o pipefail; false | true</tspan></text><rect x="280" y="120" width="284" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="152.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">código 1</tspan></text><rect x="570" y="120" width="374" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="144.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">Cualquier comando que falle hace fallar el</tspan></text><text x="757" y="160.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">pipeline</tspan></text><rect x="10" y="184" width="264" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="216.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">cd /noexiste (sin set -e)</tspan></text><rect x="280" y="184" width="284" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="208.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">el script sigue en el directorio</tspan></text><text x="422" y="224.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">anterior</tspan></text><rect x="570" y="184" width="374" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="208.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">Un fallo ignorado deja el script operando en</tspan></text><text x="757" y="224.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">otro lugar</tspan></text><rect x="10" y="248" width="264" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="280.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">set -e; cd /noexiste</tspan></text><rect x="280" y="248" width="284" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="280.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">el subshell termina con código 1</tspan></text><rect x="570" y="248" width="374" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="280.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">El fallo detiene la ejecución</tspan></text><rect x="10" y="312" width="264" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="344.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">ls /noexiste</tspan></text><rect x="280" y="312" width="284" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="344.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">código 2</tspan></text><rect x="570" y="312" width="374" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="336.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">Los códigos son una interfaz: cada herramienta</tspan></text><text x="757" y="352.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">documenta los suyos</tspan></text><rect x="10" y="380" width="920" height="46" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="406.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Un script robusto declara cómo trata los fallos y comprueba los códigos que le importan.</tspan></text></svg>
