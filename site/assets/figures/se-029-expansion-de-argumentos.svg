<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Quién interpreta los argumentos antes de que el programa los reciba</title><desc id="d">Tabla con resultados reales: en Bash, un comodín sin comillas se expande a dos archivos y entre comillas llega literal; una variable con espacio sin comillas se divide en dos argumentos y entre comillas es uno; en PowerShell un comodín sin coincidencias llega literal al programa nativo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="470" fill="#ffffff"/><rect x="10" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="157" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="157" dy="0">Orden escrita</tspan></text><rect x="310" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="377" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="377" dy="0">Shell</tspan></text><rect x="450" y="12" width="394" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="647" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="647" dy="0">Argumentos que recibe el programa</tspan></text><rect x="850" y="12" width="94" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="897" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="897" dy="0">Número</tspan></text><rect x="10" y="56" width="294" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="84.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">prog /tmp/p02*.txt</tspan></text><rect x="310" y="56" width="134" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="377" y="84.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="377" dy="0">Bash</tspan></text><rect x="450" y="56" width="394" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="84.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">[&#x27;/tmp/p02a.txt&#x27;, &#x27;/tmp/p02b.txt&#x27;]</tspan></text><rect x="850" y="56" width="94" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="897" y="84.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="897" dy="0">2</tspan></text><rect x="10" y="112" width="294" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="140.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">prog &quot;/tmp/p02*.txt&quot;</tspan></text><rect x="310" y="112" width="134" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="377" y="140.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="377" dy="0">Bash</tspan></text><rect x="450" y="112" width="394" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="140.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">[&#x27;/tmp/p02*.txt&#x27;]</tspan></text><rect x="850" y="112" width="94" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="897" y="140.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="897" dy="0">1</tspan></text><rect x="10" y="168" width="294" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="196.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">x=&quot;un archivo.txt&quot;; prog $x</tspan></text><rect x="310" y="168" width="134" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="377" y="196.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="377" dy="0">Bash</tspan></text><rect x="450" y="168" width="394" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="196.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">&#x27;un&#x27; y &#x27;archivo.txt&#x27;</tspan></text><rect x="850" y="168" width="94" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="897" y="196.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="897" dy="0">2</tspan></text><rect x="10" y="224" width="294" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="252.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">x=&quot;un archivo.txt&quot;; prog &quot;$x&quot;</tspan></text><rect x="310" y="224" width="134" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="377" y="252.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="377" dy="0">Bash</tspan></text><rect x="450" y="224" width="394" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="252.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">&#x27;un archivo.txt&#x27;</tspan></text><rect x="850" y="224" width="94" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="897" y="252.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="897" dy="0">1</tspan></text><rect x="10" y="280" width="294" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="308.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">prog *.nada</tspan></text><rect x="310" y="280" width="134" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="377" y="308.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="377" dy="0">PowerShell 5.1</tspan></text><rect x="450" y="280" width="394" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="308.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">[&#x27;*.nada&#x27;]: no expande para programas nativos</tspan></text><rect x="850" y="280" width="94" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="897" y="308.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="897" dy="0">1</tspan></text><rect x="10" y="336" width="294" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="364.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">prog $x (con espacio)</tspan></text><rect x="310" y="336" width="134" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="377" y="364.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="377" dy="0">PowerShell 5.1</tspan></text><rect x="450" y="336" width="394" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="364.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">Un solo argumento</tspan></text><rect x="850" y="336" width="94" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="897" y="364.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="897" dy="0">1</tspan></text><rect x="10" y="408" width="940" height="50" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="436.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">El programa nunca ve las comillas ni el comodín: ve la lista final. Un shell distinto produce otra lista con el mismo texto.</tspan></text></svg>
