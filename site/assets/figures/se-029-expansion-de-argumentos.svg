<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" width="960" height="550" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Quién interpreta los argumentos antes de que el programa los reciba</title><desc id="d">Seis órdenes con su shell y la lista de argumentos que recibe el programa, dibujada como fichas: en Bash, un comodín sin comillas se expande a dos archivos y entre comillas llega literal; una variable con espacio sin comillas se divide en dos argumentos y entre comillas es uno; en PowerShell un comodín sin coincidencias llega literal.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="550" fill="#ffffff"/><text x="155" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="155" dy="0">Orden escrita</tspan></text><text x="391" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="391" dy="0">Shell</tspan></text><text x="490" y="24" font-size="13" text-anchor="start" font-weight="700" fill="#32505f"><tspan x="490" dy="0">Argumentos que recibe el programa</tspan></text><rect x="10" y="38" width="290" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="155" y="69.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="155" dy="0">prog /tmp/p02*.txt</tspan></text><rect x="326" y="38" width="130" height="56" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="391" y="69.36" font-size="12" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="391" dy="0">Bash</tspan></text><polyline points="300,66 326,66" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="456,66 482,66" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="482" y="42" width="116.72" height="32" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="540.36" y="61.36" font-size="12" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="540.36" dy="0">/tmp/p02a.txt</tspan></text><rect x="604.72" y="42" width="116.72" height="32" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="663.08" y="61.36" font-size="12" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="663.08" dy="0">/tmp/p02b.txt</tspan></text><text x="482" y="90" font-size="11" text-anchor="start" font-weight="400" fill="#32505f"><tspan x="482" dy="0">2 argumentos: el comodín se expande antes de llegar al programa</tspan></text><rect x="10" y="112" width="290" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="155" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="155" dy="0">prog &quot;/tmp/p02*.txt&quot;</tspan></text><rect x="326" y="112" width="130" height="56" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="391" y="143.36" font-size="12" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="391" dy="0">Bash</tspan></text><polyline points="300,140 326,140" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="456,140 482,140" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="482" y="116" width="116.72" height="32" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="540.36" y="135.36" font-size="12" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="540.36" dy="0">/tmp/p02*.txt</tspan></text><text x="482" y="164" font-size="11" text-anchor="start" font-weight="400" fill="#32505f"><tspan x="482" dy="0">1 argumento: las comillas impiden la expansión: llega literal</tspan></text><rect x="10" y="186" width="290" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="155" y="217.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="155" dy="0">x=&quot;un archivo.txt&quot;; prog $x</tspan></text><rect x="326" y="186" width="130" height="56" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="391" y="217.36" font-size="12" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="391" dy="0">Bash</tspan></text><polyline points="300,214 326,214" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="456,214 482,214" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="482" y="190" width="34.88" height="32" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="499.44" y="209.36" font-size="12" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="499.44" dy="0">un</tspan></text><rect x="522.88" y="190" width="101.84" height="32" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="573.8" y="209.36" font-size="12" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="573.8" dy="0">archivo.txt</tspan></text><text x="482" y="238" font-size="11" text-anchor="start" font-weight="400" fill="#32505f"><tspan x="482" dy="0">2 argumentos: la variable sin comillas se divide por los espacios</tspan></text><rect x="10" y="260" width="290" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="155" y="291.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="155" dy="0">x=&quot;un archivo.txt&quot;; prog &quot;$x&quot;</tspan></text><rect x="326" y="260" width="130" height="56" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="391" y="291.36" font-size="12" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="391" dy="0">Bash</tspan></text><polyline points="300,288 326,288" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="456,288 482,288" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="482" y="264" width="124.16" height="32" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="544.08" y="283.36" font-size="12" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="544.08" dy="0">un archivo.txt</tspan></text><text x="482" y="312" font-size="11" text-anchor="start" font-weight="400" fill="#32505f"><tspan x="482" dy="0">1 argumento: con comillas el valor es un solo argumento</tspan></text><rect x="10" y="334" width="290" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="155" y="365.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="155" dy="0">prog *.nada</tspan></text><rect x="326" y="334" width="130" height="56" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="391" y="365.36" font-size="12" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="391" dy="0">PowerShell 5.1</tspan></text><polyline points="300,362 326,362" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="456,362 482,362" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="482" y="338" width="64.64" height="32" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="514.32" y="357.36" font-size="12" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="514.32" dy="0">*.nada</tspan></text><text x="482" y="386" font-size="11" text-anchor="start" font-weight="400" fill="#32505f"><tspan x="482" dy="0">1 argumento: no expande el comodín para programas nativos</tspan></text><rect x="10" y="408" width="290" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="155" y="439.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="155" dy="0">prog $x (con espacio)</tspan></text><rect x="326" y="408" width="130" height="56" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="391" y="439.36" font-size="12" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="391" dy="0">PowerShell 5.1</tspan></text><polyline points="300,436 326,436" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="456,436 482,436" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="482" y="412" width="124.16" height="32" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="544.08" y="431.36" font-size="12" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="544.08" dy="0">un archivo.txt</tspan></text><text x="482" y="460" font-size="11" text-anchor="start" font-weight="400" fill="#32505f"><tspan x="482" dy="0">1 argumento: no divide el valor: un solo argumento</tspan></text><rect x="10" y="488" width="940" height="50" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="516.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">El programa nunca ve las comillas ni el comodín: ve la lista final. Un shell distinto produce otra lista con el mismo texto.</tspan></text></svg>
