<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 453" width="960" height="453" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Errores en dos shells: lo que se observó</title><desc id="d">Cuatro situaciones con la respuesta de PowerShell 5.1 y de Bash: un error no terminante deja $? en falso y sigue; con -ErrorAction Stop se lanza ItemNotFoundException que se captura; un programa nativo deja su código en $LASTEXITCODE; con Set-StrictMode una variable no definida es un error. En Bash, $? guarda el código del último comando y set -e detiene el script.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="453" fill="#ffffff"/><rect x="270" y="12" width="336" height="28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="438" y="29.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="438" dy="0">PowerShell 5.1</tspan></text><rect x="614" y="12" width="336" height="28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="782" y="29.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="782" dy="0">Bash</tspan></text><rect x="10" y="48" width="220" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="120" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="120" dy="0">Falla un comando</tspan></text><rect x="265" y="43" width="690" height="76" rx="12" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><polyline points="230,81 265,81" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="270" y="48" width="336" height="66" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="438" y="76.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="438" dy="0">Error no terminante: $? = False y el script</tspan></text><text x="438" y="92.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="438" dy="0">continúa</tspan></text><rect x="614" y="48" width="336" height="66" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="782" y="76.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="782" dy="0">$? = código distinto de 0 y el script</tspan></text><text x="782" y="92.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="782" dy="0">continúa</tspan></text><rect x="10" y="132" width="220" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="120" y="168.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="120" dy="0">Hacer que el fallo detenga</tspan></text><rect x="265" y="127" width="690" height="76" rx="12" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><polyline points="230,165 265,165" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="270" y="132" width="336" height="66" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="438" y="160.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="438" dy="0">-ErrorAction Stop → excepción</tspan></text><text x="438" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="438" dy="0">ItemNotFoundException que try/catch captura</tspan></text><rect x="614" y="132" width="336" height="66" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="782" y="168.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="782" dy="0">set -e (con sus excepciones documentadas)</tspan></text><rect x="10" y="216" width="220" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="120" y="244.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="120" dy="0">Programa nativo con código</tspan></text><text x="120" y="260.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="120" dy="0">5</tspan></text><rect x="265" y="211" width="690" height="76" rx="12" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><polyline points="230,249 265,249" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="270" y="216" width="336" height="66" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="438" y="252.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="438" dy="0">$LASTEXITCODE = 5 y $? = False</tspan></text><rect x="614" y="216" width="336" height="66" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="782" y="252.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="782" dy="0">$? = 5</tspan></text><rect x="10" y="300" width="220" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="120" y="336.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="120" dy="0">Variable no definida</tspan></text><rect x="265" y="295" width="690" height="76" rx="12" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><polyline points="230,333 265,333" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="270" y="300" width="336" height="66" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="438" y="328.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="438" dy="0">Set-StrictMode: error «no se puede</tspan></text><text x="438" y="344.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="438" dy="0">recuperar porque no se ha establecido»</tspan></text><rect x="614" y="300" width="336" height="66" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="782" y="336.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="782" dy="0">Expande a vacío salvo set -u</tspan></text><rect x="10" y="380" width="940" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="404.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Cada shell tiene varios canales de error. Un contrato común define qué es un fallo (código de salida y mensaje estructurado) y</tspan></text><text x="480" y="421.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">cada adaptador lo traduce.</tspan></text></svg>
