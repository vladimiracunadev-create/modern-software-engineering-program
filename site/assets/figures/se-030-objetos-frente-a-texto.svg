<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 437" width="960" height="437" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">PowerShell pasa objetos; Bash pasa texto</title><desc id="d">Cuatro aspectos con la respuesta de cada shell: en PowerShell 5.1 el pipeline lleva objetos System.Diagnostics.Process con propiedades como BasePriority y una lista de cadenas es un arreglo de objetos String; en Bash los comandos intercambian bytes de texto que cada programa debe analizar.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="437" fill="#ffffff"/><rect x="270" y="12" width="336" height="28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="438" y="29.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="438" dy="0">PowerShell 5.1</tspan></text><rect x="614" y="12" width="336" height="28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="782" y="29.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="782" dy="0">Bash</tspan></text><rect x="10" y="48" width="220" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="120" y="74.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="120" dy="0">Lo que viaja por el</tspan></text><text x="120" y="90.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="120" dy="0">pipeline</tspan></text><rect x="265" y="43" width="690" height="72" rx="12" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><polyline points="230,79 265,79" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="270" y="48" width="336" height="62" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="438" y="82.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="438" dy="0">Objetos .NET: System.Diagnostics.Process</tspan></text><rect x="614" y="48" width="336" height="62" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="782" y="82.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="782" dy="0">Bytes de texto por stdout</tspan></text><rect x="10" y="128" width="220" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="120" y="162.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="120" dy="0">Acceso a un dato</tspan></text><rect x="265" y="123" width="690" height="72" rx="12" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><polyline points="230,159 265,159" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="270" y="128" width="336" height="62" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="438" y="154.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="438" dy="0">Propiedad: (Get-Process -Id</tspan></text><text x="438" y="170.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="438" dy="0">$PID).BasePriority</tspan></text><rect x="614" y="128" width="336" height="62" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="782" y="154.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="782" dy="0">Analizar columnas con otro programa (awk,</tspan></text><text x="782" y="170.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="782" dy="0">cut)</tspan></text><rect x="10" y="208" width="220" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="120" y="242.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="120" dy="0">Tipo de una lista</tspan></text><rect x="265" y="203" width="690" height="72" rx="12" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><polyline points="230,239 265,239" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="270" y="208" width="336" height="62" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="438" y="242.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="438" dy="0">Object[] de String</tspan></text><rect x="614" y="208" width="336" height="62" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="782" y="242.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="782" dy="0">Texto separado por saltos de línea</tspan></text><rect x="10" y="288" width="220" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="120" y="322.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="120" dy="0">Conversión de tipos</tspan></text><rect x="265" y="283" width="690" height="72" rx="12" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><polyline points="230,319 265,319" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="270" y="288" width="336" height="62" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="438" y="314.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="438" dy="0">1 + &#x27;2&#x27; = 3; &#x27;1&#x27; + 2 = 12 (manda el tipo</tspan></text><text x="438" y="330.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="438" dy="0">del lado izquierdo)</tspan></text><rect x="614" y="288" width="336" height="62" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="782" y="314.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="782" dy="0">Todo es texto hasta que un programa lo</tspan></text><text x="782" y="330.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="782" dy="0">interpreta</tspan></text><rect x="10" y="364" width="940" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="388.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Ninguno es «mejor»: los objetos evitan analizar texto, y el texto es la interfaz común de las herramientas POSIX. Un adaptador</tspan></text><text x="480" y="405.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">debe traducir entre ambos modelos, no suponer que son iguales.</tspan></text></svg>
