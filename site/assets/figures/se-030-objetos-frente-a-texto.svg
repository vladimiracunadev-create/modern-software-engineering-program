<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">PowerShell pasa objetos; Bash pasa texto</title><desc id="d">Comparación con resultados reales: en PowerShell 5.1 Get-Process devuelve objetos System.Diagnostics.Process con propiedades como BasePriority y Container, y una lista de cadenas es un Object[] de String; en Bash los comandos intercambian bytes de texto que cada programa debe analizar.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="460" fill="#ffffff"/><rect x="10" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="112" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="112" dy="0">Aspecto</tspan></text><rect x="220" y="12" width="394" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="417" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="417" dy="0">PowerShell 5.1</tspan></text><rect x="620" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="782" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="782" dy="0">Bash</tspan></text><rect x="10" y="56" width="204" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="86.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">Lo que viaja por el</tspan></text><text x="112" y="102.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">pipeline</tspan></text><rect x="220" y="56" width="394" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="417" y="94.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="417" dy="0">Objetos .NET: System.Diagnostics.Process</tspan></text><rect x="620" y="56" width="324" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="94.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">Bytes de texto por stdout</tspan></text><rect x="10" y="132" width="204" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="170.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">Acceso a un dato</tspan></text><rect x="220" y="132" width="394" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="417" y="170.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="417" dy="0">Propiedad: (Get-Process -Id $PID).BasePriority</tspan></text><rect x="620" y="132" width="324" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="162.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">Analizar columnas con otro programa (awk,</tspan></text><text x="782" y="178.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">cut)</tspan></text><rect x="10" y="208" width="204" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="246.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">Tipo de una lista</tspan></text><rect x="220" y="208" width="394" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="417" y="246.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="417" dy="0">Object[] de String</tspan></text><rect x="620" y="208" width="324" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="246.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">Texto separado por saltos de línea</tspan></text><rect x="10" y="284" width="204" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="322.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">Conversión de tipos</tspan></text><rect x="220" y="284" width="394" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="417" y="314.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="417" dy="0">1 + &#x27;2&#x27; = 3; &#x27;1&#x27; + 2 = 12 (manda el tipo del lado</tspan></text><text x="417" y="330.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="417" dy="0">izquierdo)</tspan></text><rect x="620" y="284" width="324" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="314.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">Todo es texto hasta que un programa lo</tspan></text><text x="782" y="330.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">interpreta</tspan></text><rect x="10" y="372" width="940" height="80" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="407.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Ninguno es «mejor»: los objetos evitan analizar texto, y el texto es la interfaz común de las herramientas POSIX. Un adaptador</tspan></text><text x="480" y="423.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">debe traducir entre ambos modelos, no suponer que son iguales.</tspan></text></svg>
