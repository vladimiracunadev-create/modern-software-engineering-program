<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dónde puede verse un secreto ficticio en Linux y cómo lo trata el laboratorio</title><desc id="d">Tabla: un secreto pasado como argumento es visible en /proc/PID/cmdline y en ps; el mismo secreto en una variable de entorno es legible en /proc/PID/environ por el propietario, cuyo modo es 0o400; el laboratorio informa solo presencia, longitud 23 y el texto redactado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="470" fill="#ffffff"/><rect x="10" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="157" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="157" dy="0">Dónde viaja el secreto</tspan></text><rect x="310" y="12" width="354" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="487" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="487" dy="0">Resultado observado</tspan></text><rect x="670" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="807" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="807" dy="0">Lectura</tspan></text><rect x="10" y="56" width="294" height="100" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="101.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Argumento de línea de comandos</tspan></text><text x="157" y="117.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">(--token=...)</tspan></text><rect x="310" y="56" width="354" height="100" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="101.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">Visible en /proc/PID/cmdline y en la salida de</tspan></text><text x="487" y="117.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">ps: «ps muestra el secreto: True»</tspan></text><rect x="670" y="56" width="274" height="100" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="94" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">Cualquier usuario que pueda listar</tspan></text><text x="807" y="109.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">procesos lo ve; evitar secretos en</tspan></text><text x="807" y="124.72" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">argumentos</tspan></text><rect x="10" y="162" width="294" height="100" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="215.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Variable de entorno (API_KEY=...)</tspan></text><rect x="310" y="162" width="354" height="100" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="207.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">Legible en /proc/PID/environ; archivo con modo</tspan></text><text x="487" y="223.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">0o400</tspan></text><rect x="670" y="162" width="274" height="100" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="200" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">Protegido de otros usuarios, no del</tspan></text><text x="807" y="215.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">propietario ni de procesos hijos que</tspan></text><text x="807" y="230.72" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">lo heredan</tspan></text><rect x="10" y="268" width="294" height="100" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="313.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Reporte del laboratorio</tspan></text><text x="157" y="329.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">(DIAG_DEMO_TOKEN)</tspan></text><rect x="310" y="268" width="354" height="100" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="313.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">present: true; length: 23; value: [REDACTED]; el</tspan></text><text x="487" y="329.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">texto no aparece</tspan></text><rect x="670" y="268" width="274" height="100" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="313.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">Se conserva presencia y longitud, no</tspan></text><text x="807" y="329.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">el valor</tspan></text><rect x="10" y="390" width="940" height="64" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="417.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">El valor era una cadena ficticia. Un secreto real se lee de un almacén dedicado, se pasa por un canal restringido y se redacta</tspan></text><text x="480" y="433.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">en cualquier registro o informe.</tspan></text></svg>
