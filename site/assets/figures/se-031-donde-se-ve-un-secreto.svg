<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 425" width="960" height="425" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dónde puede verse un secreto ficticio en Linux y cómo lo trata el laboratorio</title><desc id="d">Tres lugares por los que viaja un secreto ficticio, con lo que se observó en cada uno: como argumento es visible en /proc/PID/cmdline y en ps; como variable de entorno es legible en /proc/PID/environ por el propietario, con modo 0o400; el laboratorio informa solo presencia, longitud 23 y el texto redactado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="425" fill="#ffffff"/><text x="140" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="140" dy="0">Dónde viaja el secreto</tspan></text><text x="476" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="476" dy="0">Resultado observado</tspan></text><text x="816" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="816" dy="0">Lectura</tspan></text><rect x="10" y="38" width="260" height="88" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="140" y="77.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="140" dy="0">Argumento de línea de comandos</tspan></text><text x="140" y="93.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="140" dy="0">(--token=...)</tspan></text><rect x="306" y="38" width="340" height="88" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="476" y="77.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="476" dy="0">Visible en /proc/PID/cmdline y en la salida</tspan></text><text x="476" y="93.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="476" dy="0">de ps: «ps muestra el secreto: True»</tspan></text><rect x="682" y="38" width="268" height="88" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="816" y="69" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="816" dy="0">Cualquier usuario que pueda listar</tspan></text><text x="816" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="816" dy="0">procesos lo ve; evitar secretos en</tspan></text><text x="816" y="102.28" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="816" dy="0">argumentos</tspan></text><polyline points="270,82 306,82" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="646,82 682,82" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="144" width="260" height="88" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="140" y="183.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="140" dy="0">Variable de entorno</tspan></text><text x="140" y="199.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="140" dy="0">(API_KEY=...)</tspan></text><rect x="306" y="144" width="340" height="88" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="476" y="183.32" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="476" dy="0">Legible en /proc/PID/environ; archivo con</tspan></text><text x="476" y="199.96" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="476" dy="0">modo 0o400</tspan></text><rect x="682" y="144" width="268" height="88" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="816" y="175" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="816" dy="0">Protegido de otros usuarios, no</tspan></text><text x="816" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="816" dy="0">del propietario ni de procesos</tspan></text><text x="816" y="208.28" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="816" dy="0">hijos que lo heredan</tspan></text><polyline points="270,188 306,188" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="646,188 682,188" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="250" width="260" height="88" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="140" y="289.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="140" dy="0">Reporte del laboratorio</tspan></text><text x="140" y="305.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="140" dy="0">(DIAG_DEMO_TOKEN)</tspan></text><rect x="306" y="250" width="340" height="88" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="476" y="289.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="476" dy="0">present: true; length: 23; value:</tspan></text><text x="476" y="305.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="476" dy="0">[REDACTED]; el texto no aparece</tspan></text><rect x="682" y="250" width="268" height="88" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="816" y="289.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="816" dy="0">Se conserva presencia y longitud,</tspan></text><text x="816" y="305.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="816" dy="0">no el valor</tspan></text><polyline points="270,294 306,294" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="646,294 682,294" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="352" width="940" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="376.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">El valor era una cadena ficticia. Un secreto real se lee de un almacén dedicado, se pasa por un canal restringido y se redacta</tspan></text><text x="480" y="393.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">en cualquier registro o informe.</tspan></text></svg>
