<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 429" width="960" height="429" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Variables de entorno en Windows y en Linux</title><desc id="d">Cuatro pruebas con el resultado de cada sistema: buscar una variable con distinto uso de mayúsculas la encuentra en Windows y no en Linux; un proceso hijo hereda la variable, el valor es siempre texto y asignar un entero lanza TypeError en ambos, por eso esas tres pruebas aparecen como un único resultado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="429" fill="#ffffff"/><rect x="350" y="12" width="296" height="28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="498" y="29.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="498" dy="0">Windows</tspan></text><rect x="654" y="12" width="296" height="28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="802" y="29.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="802" dy="0">Linux (WSL2)</tspan></text><rect x="10" y="48" width="300" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="160" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="160" dy="0">Buscar «mi_var» tras fijar «MI_VAR»</tspan></text><rect x="345" y="43" width="610" height="66" rx="12" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><polyline points="310,76 345,76" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="350" y="48" width="296" height="56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="498" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="498" dy="0">&#x27;valor&#x27; (no distingue mayúsculas)</tspan></text><rect x="654" y="48" width="296" height="56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="802" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="802" dy="0">None (distingue mayúsculas)</tspan></text><rect x="10" y="122" width="300" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="160" y="153.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="160" dy="0">Un proceso hijo lee la variable</tspan></text><rect x="345" y="117" width="610" height="66" rx="12" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><polyline points="310,150 345,150" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="350" y="122" width="600" height="56" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="650" y="153.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="650" dy="0">&#x27;valor&#x27; (la hereda)</tspan></text><rect x="10" y="196" width="300" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="160" y="227.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="160" dy="0">Tipo de «PUERTO» = 8080</tspan></text><rect x="345" y="191" width="610" height="66" rx="12" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><polyline points="310,224 345,224" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="350" y="196" width="600" height="56" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="650" y="227.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="650" dy="0">str</tspan></text><rect x="10" y="270" width="300" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="160" y="301.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="160" dy="0">os.environ[&#x27;N&#x27;] = 5</tspan></text><rect x="345" y="265" width="610" height="66" rx="12" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><polyline points="310,298 345,298" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="350" y="270" width="600" height="56" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="650" y="301.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="650" dy="0">TypeError</tspan></text><rect x="10" y="340" width="940" height="75.92" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="480" y="364.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="480" dy="0">El entorno es una lista de pares texto-texto que se hereda; no tiene tipos ni esquema. Un programa que lo usa convierte y</tspan></text><text x="480" y="381.6" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="480" dy="0">valida explícitamente (por ejemplo, un puerto debe ser un entero entre 1 y 65535) y no depende de mayúsculas para distinguir</tspan></text><text x="480" y="398.24" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="480" dy="0">variables si debe funcionar en ambos sistemas.</tspan></text></svg>
