<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Precedencia de configuración: tres resoluciones reales</title><desc id="d">Tres casos de la función de precedencia argumento, entorno, archivo y valor por omisión. En cada uno la fuente más prioritaria que tiene valor gana y las demás quedan tapadas: sin argumento gana el entorno (8081), con argumento gana el argumento (9000) y sin nada gana el valor por omisión (8080).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="440" fill="#ffffff"/><text x="402" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="402" dy="0">Fuentes, de mayor a menor prioridad</tspan></text><text x="825" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="825" dy="0">Resultado (fuente, valor)</tspan></text><rect x="10" y="38" width="120" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="70" y="67.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="70" dy="0">Sin argumento</tspan></text><rect x="146" y="38" width="120" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><text x="206" y="67.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="206" dy="0">Argumento: —</tspan></text><rect x="274" y="38" width="120" height="52" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="334" y="67.36" font-size="12" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="334" dy="0">Entorno: 8081</tspan></text><rect x="402" y="38" width="120" height="52" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="6 4"/><text x="462" y="67.36" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="462" dy="0">Archivo: 8082</tspan></text><rect x="530" y="38" width="120" height="52" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="6 4"/><text x="590" y="59.68" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="590" dy="0">Por omisión:</tspan></text><text x="590" y="75.04" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="590" dy="0">8080</tspan></text><polyline points="658,64 700,64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="700" y="38" width="250" height="52" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="825" y="67.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="825" dy="0">entorno, 8081</tspan></text><rect x="10" y="108" width="120" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="70" y="137.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="70" dy="0">Con argumento</tspan></text><rect x="146" y="108" width="120" height="52" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="206" y="129.68" font-size="12" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="206" dy="0">Argumento:</tspan></text><text x="206" y="145.04" font-size="12" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="206" dy="0">9000</tspan></text><rect x="274" y="108" width="120" height="52" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="6 4"/><text x="334" y="137.36" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="334" dy="0">Entorno: 8081</tspan></text><rect x="402" y="108" width="120" height="52" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="6 4"/><text x="462" y="137.36" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="462" dy="0">Archivo: 8082</tspan></text><rect x="530" y="108" width="120" height="52" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="6 4"/><text x="590" y="129.68" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="590" dy="0">Por omisión:</tspan></text><text x="590" y="145.04" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="590" dy="0">8080</tspan></text><polyline points="658,134 700,134" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="700" y="108" width="250" height="52" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="825" y="137.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="825" dy="0">argumento, 9000</tspan></text><rect x="10" y="178" width="120" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="70" y="207.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="70" dy="0">Sin nada</tspan></text><rect x="146" y="178" width="120" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><text x="206" y="207.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="206" dy="0">Argumento: —</tspan></text><rect x="274" y="178" width="120" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><text x="334" y="207.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="334" dy="0">Entorno: —</tspan></text><rect x="402" y="178" width="120" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><text x="462" y="207.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">Archivo: —</tspan></text><rect x="530" y="178" width="120" height="52" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="590" y="199.68" font-size="12" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="590" dy="0">Por omisión:</tspan></text><text x="590" y="215.04" font-size="12" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="590" dy="0">8080</tspan></text><polyline points="658,204 700,204" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="700" y="178" width="250" height="52" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="825" y="207.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="825" dy="0">default, 8080</tspan></text><rect x="10" y="252" width="940" height="76" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="285.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">El orden es determinista y se registra: la ficha de configuración efectiva dice de dónde viene cada valor. Cambiar el orden</tspan></text><text x="480" y="301.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">entre ejecuciones (o entre adaptadores) cambia el comportamiento sin cambiar el código.</tspan></text><rect x="10" y="340" width="940" height="76" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="480" y="373.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="480" dy="0">En el laboratorio, `profile` se resuelve con argumento, DIAG_PROFILE, settings.json y valor predeterminado, y el reporte</tspan></text><text x="480" y="389.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="480" dy="0">conserva la fuente elegida.</tspan></text></svg>
