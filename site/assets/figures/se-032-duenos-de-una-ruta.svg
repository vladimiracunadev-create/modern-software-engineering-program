<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" width="940" height="420" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué paquete es dueño de /bin/ls: una respuesta que depende de la ruta</title><desc id="d">Preguntar a dpkg por /bin/ls no encuentra ninguna ruta, mientras /usr/bin/ls pertenece al paquete coreutils, porque /bin es un enlace simbólico a usr/bin en Ubuntu 24.04.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="420" fill="#ffffff"/><rect x="20" y="30" width="360" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="200" y="60.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="200" dy="0">dpkg -S /bin/ls</tspan></text><text x="200" y="76.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="200" dy="0">→ no path found matching pattern /bin/ls</tspan></text><rect x="20" y="130" width="360" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="200" y="160.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="200" dy="0">dpkg -S /usr/bin/ls</tspan></text><text x="200" y="176.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="200" dy="0">→ coreutils: /usr/bin/ls</tspan></text><rect x="430" y="30" width="490" height="70" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="675" y="68.64" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="675" dy="0">ls -ld /bin → lrwxrwxrwx ... /bin -&gt; usr/bin</tspan></text><polyline points="380,65 430,65" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="430" y="130" width="490" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="675" y="160.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="675" dy="0">El gestor registra rutas reales (/usr/bin/ls); un enlace</tspan></text><text x="675" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="675" dy="0">simbólico no es dueño de nada</tspan></text><rect x="20" y="230" width="900" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="260.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Una consulta correcta del gestor exige la ruta canónica (por ejemplo, con `readlink -f`). La misma pregunta con una ruta</tspan></text><text x="470" y="276.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">equivalente da respuestas distintas: la evidencia depende de cómo se formula.</tspan></text><rect x="20" y="316" width="900" height="70" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="470" y="346.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="470" dy="0">Qué paquete es dueño de un archivo es una afirmación del gestor del sistema, no una propiedad del archivo. Los programas</tspan></text><text x="470" y="362.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="470" dy="0">instalados por otras vías (pip, descargas) no aparecen en dpkg.</tspan></text></svg>
