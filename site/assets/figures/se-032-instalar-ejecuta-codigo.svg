<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="940" height="440" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Instalar puede ejecutar código: lo que se observa y lo que se documenta</title><desc id="d">Tabla con una observación real (hay 624 archivos de scripts de mantenedor preinst, postinst, prerm o postrm en /var/lib/dpkg/info de este Ubuntu) y dos afirmaciones documentadas: las fuentes de Python pueden ejecutar código al construirse, y las ruedas no ejecutan código de instalación.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="440" fill="#ffffff"/><rect x="10" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="137" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="137" dy="0">Mecanismo</tspan></text><rect x="270" y="12" width="354" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="447" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="447" dy="0">Evidencia</tspan></text><rect x="630" y="12" width="314" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="787" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="787" dy="0">Consecuencia</tspan></text><rect x="10" y="56" width="254" height="88" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="95.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">Scripts de mantenedor de paquetes</tspan></text><text x="137" y="111.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">.deb</tspan></text><rect x="270" y="56" width="354" height="88" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="447" y="88" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">Observado: 624 archivos</tspan></text><text x="447" y="103.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">preinst/postinst/prerm/postrm en el sistema de</tspan></text><text x="447" y="118.72" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">prueba</tspan></text><rect x="630" y="56" width="314" height="88" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="95.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">Instalar un paquete del sistema ejecuta</tspan></text><text x="787" y="111.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">código con privilegios de administrador</tspan></text><rect x="10" y="150" width="254" height="88" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="189.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">Distribución fuente de Python</tspan></text><text x="137" y="205.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">(sdist)</tspan></text><rect x="270" y="150" width="354" height="88" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="447" y="189.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">Documentado: la construcción puede ejecutar</tspan></text><text x="447" y="205.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">código del paquete</tspan></text><rect x="630" y="150" width="314" height="88" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="189.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">Instalar desde una fuente es ejecutar</tspan></text><text x="787" y="205.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">código de un tercero en tu equipo</tspan></text><rect x="10" y="244" width="254" height="88" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="291.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">Rueda de Python (wheel)</tspan></text><rect x="270" y="244" width="354" height="88" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="447" y="283.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">Documentado: formato de archivos ya construidos,</tspan></text><text x="447" y="299.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">sin paso de ejecución de instalación</tspan></text><rect x="630" y="244" width="314" height="88" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="283.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">Reduce la superficie, pero el código del</tspan></text><text x="787" y="299.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">paquete sigue ejecutándose al importarlo</tspan></text><rect x="10" y="350" width="920" height="72" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="381.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">La confianza se decide antes de instalar: procedencia del repositorio, firma, alcance (sistema o usuario) y un plan de</tspan></text><text x="470" y="397.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">reversión.</tspan></text></svg>
