<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un paquete visto desde el gestor del sistema: coreutils en Ubuntu 24.04</title><desc id="d">Tabla con campos reales de dpkg y apt para el paquete coreutils: versión instalada 9.4-3ubuntu6, arquitectura amd64, mantenedor Ubuntu Developers, versión candidata 9.4-3ubuntu6.3 del repositorio noble-updates, dependencias previas como libacl1, libattr1, libc6, libgmp10 y libselinux1, y verificación de archivos sin diferencias.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="480" fill="#ffffff"/><rect x="10" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="122" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="122" dy="0">Campo</tspan></text><rect x="240" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="402" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="402" dy="0">Valor observado</tspan></text><rect x="570" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="757" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="757" dy="0">Qué informa</tspan></text><rect x="10" y="56" width="224" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="122" y="91.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">Package / Maintainer</tspan></text><rect x="240" y="56" width="324" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="91.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">coreutils / Ubuntu Developers</tspan></text><rect x="570" y="56" width="374" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="83.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">Quién empaqueta y se responsabiliza del paquete en</tspan></text><text x="757" y="99.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">esta distribución</tspan></text><rect x="10" y="126" width="224" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="122" y="161.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">Version / Architecture</tspan></text><rect x="240" y="126" width="324" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="161.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">9.4-3ubuntu6 / amd64</tspan></text><rect x="570" y="126" width="374" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="153.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">La versión del paquete (no solo del programa) y el</tspan></text><text x="757" y="169.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">contrato binario</tspan></text><rect x="10" y="196" width="224" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="122" y="231.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">Candidate (apt policy)</tspan></text><rect x="240" y="196" width="324" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">9.4-3ubuntu6.3 desde noble-updates</tspan></text><rect x="570" y="196" width="374" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="223.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">Hay una actualización disponible; instalada no es lo</tspan></text><text x="757" y="239.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">mismo que candidata</tspan></text><rect x="10" y="266" width="224" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="122" y="301.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">PreDepends</tspan></text><rect x="240" y="266" width="324" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="293.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">libacl1, libattr1, libc6, libgmp10,</tspan></text><text x="402" y="309.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">libselinux1</tspan></text><rect x="570" y="266" width="374" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="293.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">Lo que debe estar presente antes de instalar: el</tspan></text><text x="757" y="309.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">árbol de dependencias</tspan></text><rect x="10" y="336" width="224" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="122" y="371.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">dpkg --verify coreutils</tspan></text><rect x="240" y="336" width="324" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="371.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">Sin salida; código 0</tspan></text><rect x="570" y="336" width="374" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="363.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">Los archivos coinciden con las sumas de verificación</tspan></text><text x="757" y="379.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">registradas</tspan></text><rect x="10" y="414" width="940" height="52" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="435.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Un gestor de paquetes es una base de datos de versiones, relaciones y sumas de verificación; instalar es modificarla de forma</tspan></text><text x="480" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">controlada.</tspan></text></svg>
