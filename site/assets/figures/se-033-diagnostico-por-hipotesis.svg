<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagnosticar es iterar hipótesis: un servicio que falla con 200/CHDIR</title><desc id="d">Cuatro pasos: observar el registro del servicio, formular hipótesis, probar la más barata y verificar la corrección. Ejemplo genérico: el código de salida 200/CHDIR indica que el servicio no pudo cambiar al directorio de trabajo configurado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="460" fill="#ffffff"/><rect x="14" y="20" width="222" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="125" y="46.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="125" dy="0">1 Observar</tspan></text><rect x="14" y="74" width="222" height="130" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="125" y="127" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="125" dy="0">journalctl: «Main process</tspan></text><text x="125" y="142.36" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="125" dy="0">exited, code=exited,</tspan></text><text x="125" y="157.72" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="125" dy="0">status=200/CHDIR»</tspan></text><polyline points="236,43 250,43" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="250" y="20" width="222" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="361" y="46.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="361" dy="0">2 Hipótesis</tspan></text><rect x="250" y="74" width="222" height="130" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="361" y="127" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="361" dy="0">El directorio de trabajo no</tspan></text><text x="361" y="142.36" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="361" dy="0">existe, no es accesible o la</tspan></text><text x="361" y="157.72" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="361" dy="0">ruta está mal escrita</tspan></text><polyline points="472,43 486,43" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="486" y="20" width="222" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="597" y="46.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="597" dy="0">3 Prueba barata</tspan></text><rect x="486" y="74" width="222" height="130" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="597" y="127" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="597" dy="0">Comprobar la ruta de</tspan></text><text x="597" y="142.36" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="597" dy="0">WorkingDirectory con ls -ld y</tspan></text><text x="597" y="157.72" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="597" dy="0">los permisos con namei -l</tspan></text><polyline points="708,43 722,43" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="722" y="20" width="222" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="833" y="46.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="833" dy="0">4 Corregir y verificar</tspan></text><rect x="722" y="74" width="222" height="130" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="833" y="127" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="833" dy="0">Crear el directorio o corregir</tspan></text><text x="833" y="142.36" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="833" dy="0">la ruta; reiniciar y comprobar</tspan></text><text x="833" y="157.72" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="833" dy="0">que el servicio queda activo</tspan></text><rect x="14" y="232" width="930" height="70" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="479" y="262.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="479" dy="0">El código nombra la causa de preparación (no pudo entrar al directorio) y excluye hipótesis sobre el programa: el servicio</tspan></text><text x="479" y="278.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="479" dy="0">ni siquiera llegó a ejecutarse. Un buen diagnóstico usa lo que el registro dice, no lo que sugiere.</tspan></text><rect x="14" y="316" width="930" height="60" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="479" y="341.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="479" dy="0">La línea roja anterior no siempre es la causa: se busca el primer evento anómalo y se comprueba que la corrección cambia el</tspan></text><text x="479" y="357.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="479" dy="0">resultado.</tspan></text><text x="480" y="410" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">El ejemplo es genérico: el nombre de la unidad y la ruta se omiten a propósito.</tspan></text></svg>
