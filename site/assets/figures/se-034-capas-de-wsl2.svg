<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Capas de WSL2 con la evidencia que cada una deja</title><desc id="d">Pila de capas: Windows como anfitrión, una máquina virtual ligera, un kernel de Linux con cadena microsoft-standard-WSL2, systemd como proceso 1 y el usuario; y el montaje 9p que conecta la unidad de Windows. Cada capa tiene un dato observable.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="470" fill="#ffffff"/><rect x="14" y="20" width="420" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="224" y="53.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="224" dy="0">Usuario de Linux (uid 1000)</tspan></text><rect x="444" y="20" width="500" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="694" y="53.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="694" dy="0">id; cat /etc/os-release → Ubuntu 24.04</tspan></text><polyline points="224,80 224,92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="14" y="92" width="420" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="224" y="125.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="224" dy="0">systemd como PID 1</tspan></text><rect x="444" y="92" width="500" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="694" y="125.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="694" dy="0">ps -p 1 → systemd; systemd-detect-virt → wsl</tspan></text><polyline points="224,152 224,164" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="14" y="164" width="420" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="224" y="197.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="224" dy="0">Kernel de Linux 6.18.58.1-microsoft-standard-WSL2</tspan></text><rect x="444" y="164" width="500" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="694" y="197.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="694" dy="0">uname -r; /proc/version</tspan></text><polyline points="224,224 224,236" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="14" y="236" width="420" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="224" y="269.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="224" dy="0">Máquina virtual ligera gestionada por Windows</tspan></text><rect x="444" y="236" width="500" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="694" y="261.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="694" dy="0">No se ve desde dentro: se infiere por detect-virt y la cadena del</tspan></text><text x="694" y="277.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="694" dy="0">kernel</tspan></text><polyline points="224,296 224,308" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="14" y="308" width="420" height="60" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="224" y="341.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="224" dy="0">Windows 11 (anfitrión)</tspan></text><rect x="444" y="308" width="500" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="694" y="333.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="694" dy="0">platform.system() = Windows; los mismos archivos aparecen en /mnt/c vía</tspan></text><text x="694" y="349.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="694" dy="0">9p</tspan></text><rect x="14" y="392" width="930" height="62" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="479" y="418.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="479" dy="0">Montajes observados: la raíz de Linux es ext4 y /mnt/c es 9p. Cruzar de una a otra cuesta rendimiento y cambia la semántica</tspan></text><text x="479" y="434.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="479" dy="0">de permisos y de nombres (SE-026 y SE-027).</tspan></text></svg>
