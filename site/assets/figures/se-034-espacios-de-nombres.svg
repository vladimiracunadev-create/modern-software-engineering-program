<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Aislar sin una máquina virtual: espacios de nombres observados</title><desc id="d">Un proceso de Linux pertenece a diez espacios de nombres. Con unshare se crean uno de usuario y uno de PIDs sin privilegios: dentro, el shell tiene PID 1 y uid 0; fuera, el mismo usuario es uid 1000.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="450" fill="#ffffff"/><rect x="14" y="20" width="440" height="60" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="234" y="53.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="234" dy="0">Espacios de nombres del proceso (ls /proc/self/ns)</tspan></text><rect x="14" y="88" width="440" height="130" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="234" y="148.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="234" dy="0">cgroup · ipc · mnt · net · pid · pid_for_children · time</tspan></text><text x="234" y="164.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="234" dy="0">· time_for_children · user · uts</tspan></text><rect x="484" y="20" width="460" height="60" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="714" y="53.36" font-size="12" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="714" dy="0">unshare --user --map-root-user --pid --fork --mount-proc</tspan></text><rect x="484" y="88" width="220" height="130" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="594" y="131.68" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="594" dy="0">Dentro:</tspan></text><text x="594" y="148.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="594" dy="0">shell con PID 1</tspan></text><text x="594" y="164.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="594" dy="0">uid = 0</tspan></text><text x="594" y="181.6" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="594" dy="0">ps solo ve 3 procesos</tspan></text><rect x="724" y="88" width="220" height="130" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="834" y="131.68" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="834" dy="0">Fuera:</tspan></text><text x="834" y="148.32" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="834" dy="0">el mismo usuario</tspan></text><text x="834" y="164.96" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="834" dy="0">uid = 1000</tspan></text><text x="834" y="181.6" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="834" dy="0">ve todo su sistema</tspan></text><rect x="14" y="244" width="930" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="479" y="274.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="479" dy="0">Un contenedor es un proceso con un conjunto de espacios de nombres (qué ve) y de cgroups (cuánto consume) sobre el kernel</tspan></text><text x="479" y="290.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="479" dy="0">del anfitrión. El «root» de adentro es un mapeo, no autoridad sobre el equipo.</tspan></text><rect x="14" y="328" width="930" height="62" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="479" y="362.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="479" dy="0">cgroups v2 observado: el sistema de archivos de /sys/fs/cgroup es cgroup2fs.</tspan></text><text x="480" y="424" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Docker Desktop estaba instalado pero su motor no estaba en ejecución; no se ejecutó ningún contenedor. Lo observado usa unshare, el mecanismo del kernel.</tspan></text></svg>
