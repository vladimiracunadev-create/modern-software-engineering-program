<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Máquina virtual, contenedor y proceso aislado: qué comparten</title><desc id="d">Tabla comparativa de tres mecanismos: máquina virtual completa, contenedor y proceso con espacios de nombres. Se indica qué kernel usan, qué aísla y qué costo tiene.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="440" fill="#ffffff"/><rect x="10" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="132" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="132" dy="0">Mecanismo</tspan></text><rect x="260" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="352" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="352" dy="0">Kernel</tspan></text><rect x="450" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="572" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="572" dy="0">Qué aísla</tspan></text><rect x="700" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="822" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="822" dy="0">Costo y riesgo</tspan></text><rect x="10" y="56" width="244" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="101.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Máquina virtual (WSL2, Hyper-V)</tspan></text><rect x="260" y="56" width="184" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="352" y="101.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352" dy="0">Uno propio por máquina</tspan></text><rect x="450" y="56" width="244" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="101.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">Hardware virtual completo</tspan></text><rect x="700" y="56" width="244" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="86" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">Arranque y memoria mayores;</tspan></text><text x="822" y="101.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">frontera fuerte mediada por el</tspan></text><text x="822" y="116.72" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">hipervisor</tspan></text><rect x="10" y="146" width="244" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="191.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Contenedor (Docker, Podman)</tspan></text><rect x="260" y="146" width="184" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="352" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352" dy="0">El del anfitrión</tspan></text><rect x="450" y="146" width="244" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="183.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">Procesos, red, sistema de</tspan></text><text x="572" y="199.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">archivos y recursos</tspan></text><rect x="700" y="146" width="244" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="183.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">Arranque rápido; una falla del</tspan></text><text x="822" y="199.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">kernel afecta a todos</tspan></text><rect x="10" y="236" width="244" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="281.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Proceso con unshare</tspan></text><rect x="260" y="236" width="184" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="352" y="281.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352" dy="0">El del anfitrión</tspan></text><rect x="450" y="236" width="244" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="281.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">Los espacios de nombres elegidos</tspan></text><rect x="700" y="236" width="244" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="266" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">Sin imagen ni red de forma</tspan></text><text x="822" y="281.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">automática: un bloque de</tspan></text><text x="822" y="296.72" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">construcción</tspan></text><rect x="10" y="350" width="940" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="380.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">«Un contenedor es una VM pequeña» es falso: no tiene kernel propio. Aislar no elimina la confianza: el anfitrión y el kernel</tspan></text><text x="480" y="396.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">siguen siendo parte del límite.</tspan></text></svg>
