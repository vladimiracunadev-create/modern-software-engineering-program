<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reducir incertidumbre por capas: hipótesis, prueba y resultado esperado</title><desc id="d">Tabla con cuatro hipótesis para el script que falla, la prueba barata para cada una y qué resultado la descarta o la confirma.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="450" fill="#ffffff"/><rect x="10" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="122" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="122" dy="0">Hipótesis</tspan></text><rect x="240" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="367" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="367" dy="0">Prueba barata</tspan></text><rect x="500" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="612" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="612" dy="0">La confirma si</tspan></text><rect x="730" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="837" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="837" dy="0">La descarta si</tspan></text><rect x="10" y="56" width="224" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="122" y="97.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">El intérprete no existe</tspan></text><rect x="240" y="56" width="254" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="367" y="97.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="367" dy="0">command -v bash</tspan></text><rect x="500" y="56" width="224" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="612" y="97.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612" dy="0">No imprime una ruta</tspan></text><rect x="730" y="56" width="214" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="97.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">Imprime /usr/bin/bash</tspan></text><rect x="10" y="138" width="224" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="122" y="179.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">El shebang está mal escrito</tspan></text><rect x="240" y="138" width="254" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="367" y="179.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="367" dy="0">head -1 script.sh | cat -A</tspan></text><rect x="500" y="138" width="224" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="612" y="171.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612" dy="0">Muestra un nombre distinto de</tspan></text><text x="612" y="187.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612" dy="0">bash</tspan></text><rect x="730" y="138" width="214" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="171.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">Muestra bash seguido de ^M</tspan></text><text x="837" y="187.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">(el nombre es correcto)</tspan></text><rect x="10" y="220" width="224" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="122" y="261.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">Finales de línea de Windows</tspan></text><rect x="240" y="220" width="254" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="367" y="261.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="367" dy="0">file script.sh</tspan></text><rect x="500" y="220" width="224" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="612" y="261.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612" dy="0">Informa CRLF line terminators</tspan></text><rect x="730" y="220" width="214" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="261.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">Informa solo ASCII text</tspan></text><rect x="10" y="302" width="224" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="122" y="343.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">Falta el bit de ejecución</tspan></text><rect x="240" y="302" width="254" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="367" y="343.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="367" dy="0">ls -l script.sh; bash script.sh</tspan></text><rect x="500" y="302" width="224" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="612" y="335.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612" dy="0">bash script.sh funciona y</tspan></text><text x="612" y="351.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612" dy="0">./script.sh falla</tspan></text><rect x="730" y="302" width="214" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="335.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">Ambos fallan de la misma</tspan></text><text x="837" y="351.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">forma</tspan></text><rect x="10" y="396" width="940" height="44" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="421.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Se prueba primero lo más barato y lo que más discrimina; cada prueba debe poder refutar una hipótesis.</tspan></text></svg>
