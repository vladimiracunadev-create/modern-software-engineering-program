<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Incidente reproducido: un script falla al pasar de Windows a Linux</title><desc id="d">Seis pasos: estabilizar el escenario, formular el síntoma, reducir hipótesis por capas, aplicar el cambio mínimo, verificar el caso original y el vecino, y documentar. Datos reales: el error de bash\r, la prueba con file y la corrección.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="480" fill="#ffffff"/><rect x="14" y="20" width="300" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="164" y="45.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="164" dy="0">1 Estabilizar</tspan></text><rect x="14" y="70" width="300" height="110" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="164" y="120.68" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="164" dy="0">Copia del script en un directorio de</tspan></text><text x="164" y="136.04" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="164" dy="0">práctica; sin tocar el original</tspan></text><rect x="330" y="20" width="300" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="480" y="45.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="480" dy="0">2 Síntoma</tspan></text><rect x="330" y="70" width="300" height="110" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="120.68" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">«/usr/bin/env: ‘bash\r’: No such file or</tspan></text><text x="480" y="136.04" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">directory»</tspan></text><rect x="646" y="20" width="300" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="796" y="45.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="796" dy="0">3 Hipótesis</tspan></text><rect x="646" y="70" width="300" height="110" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="796" y="120.68" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="796" dy="0">¿Falta bash? ¿Shebang mal escrito?</tspan></text><text x="796" y="136.04" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="796" dy="0">¿Finales de línea ajenos?</tspan></text><rect x="14" y="210" width="300" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="164" y="235.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="164" dy="0">4 Prueba</tspan></text><rect x="14" y="260" width="300" height="110" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="164" y="310.68" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="164" dy="0">`file` informa «with CRLF line</tspan></text><text x="164" y="326.04" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="164" dy="0">terminators»: finales de Windows</tspan></text><rect x="330" y="210" width="300" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="480" y="235.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="480" dy="0">5 Cambio mínimo</tspan></text><rect x="330" y="260" width="300" height="110" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="480" y="310.68" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">Quitar \r (sed -i) y fijar .gitattributes</tspan></text><text x="480" y="326.04" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">con eol=lf</tspan></text><rect x="646" y="210" width="300" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="796" y="235.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="796" dy="0">6 Verificar</tspan></text><rect x="646" y="260" width="300" height="110" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="796" y="310.68" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="796" dy="0">Funciona; el caso vecino (sin bit de</tspan></text><text x="796" y="326.04" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="796" dy="0">ejecución) responde Permission denied</tspan></text><rect x="14" y="408" width="930" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="479" y="431.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="479" dy="0">El cambio mínimo se aplica a la causa (finales de línea) y se registra su radio de efecto: el contenido no cambió, solo los</tspan></text><text x="479" y="447.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="479" dy="0">finales de cada línea.</tspan></text></svg>
