<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reparar con límites: la secuencia real del laboratorio</title><desc id="d">Seis pasos observados en Linux con el laboratorio de la Parte 02, cada uno con su código de salida: prepare cambia y repite sin cambios (0); inspect informa healthy (0); con settings.json corrupto inspect informa degraded (2); repair restaura (0); clean con un archivo ajeno se niega (3) y, tras retirarlo, termina (0) dejando el workspace vacío.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="440" fill="#ffffff"/><rect x="14" y="20" width="262" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="145" y="45.36" font-size="12" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="145" dy="0">1 prepare (1.ª y 2.ª vez)</tspan></text><circle cx="295" cy="42" r="12" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="295" y="47" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="295" dy="0">0</tspan></text><rect x="14" y="72" width="300" height="110" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="164" y="122.68" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="164" dy="0">changed / unchanged.</tspan></text><text x="164" y="138.04" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="164" dy="0">Idempotente: repetirlo no cambia nada</tspan></text><polyline points="309,42 330,42" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="330" y="20" width="262" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="461" y="45.36" font-size="12" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="461" dy="0">2 inspect</tspan></text><circle cx="611" cy="42" r="12" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="611" y="47" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="611" dy="0">0</tspan></text><rect x="330" y="72" width="300" height="110" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="480" y="122.68" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">healthy · Linux x86_64.</tspan></text><text x="480" y="138.04" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">Diagnóstico de solo lectura</tspan></text><polyline points="625,42 646,42" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="646" y="20" width="262" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="777" y="45.36" font-size="12" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="777" dy="0">3 settings.json = «{broken»; inspect</tspan></text><circle cx="927" cy="42" r="12" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="927" y="47" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="927" dy="0">2</tspan></text><rect x="646" y="72" width="300" height="110" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="796" y="115" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="796" dy="0">degraded · integrity: invalid</tspan></text><text x="796" y="130.36" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="796" dy="0">settings.json.</tspan></text><text x="796" y="145.72" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="796" dy="0">Fallo estructurado, no una excepción</tspan></text><rect x="14" y="216" width="262" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="145" y="241.36" font-size="12" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="145" dy="0">4 repair; inspect</tspan></text><circle cx="295" cy="238" r="12" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="295" y="243" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="295" dy="0">0</tspan></text><rect x="14" y="268" width="300" height="110" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="164" y="318.68" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="164" dy="0">changed; healthy.</tspan></text><text x="164" y="334.04" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="164" dy="0">Restaura solo lo conocido</tspan></text><polyline points="309,238 330,238" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="330" y="216" width="262" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="461" y="241.36" font-size="12" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="461" dy="0">5 clean con student-notes.txt dentro</tspan></text><circle cx="611" cy="238" r="12" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="611" y="243" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="611" dy="0">3</tspan></text><rect x="330" y="268" width="300" height="110" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="311" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Se niega; el directorio queda con 4</tspan></text><text x="480" y="326.36" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">archivos.</tspan></text><text x="480" y="341.72" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">No borra lo que no reconoce</tspan></text><polyline points="625,238 646,238" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="646" y="216" width="262" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="777" y="241.36" font-size="12" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="777" dy="0">6 clean tras retirar el archivo</tspan></text><circle cx="927" cy="238" r="12" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="927" y="243" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="927" dy="0">0</tspan></text><rect x="646" y="268" width="300" height="110" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="796" y="311" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="796" dy="0">Elimina el directorio del kit; el</tspan></text><text x="796" y="326.36" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="796" dy="0">workspace queda vacío (0 entradas).</tspan></text><text x="796" y="341.72" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="796" dy="0">Limpieza acotada</tspan></text><polyline points="796,182 796,200 164,200 164,216" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="480" y="424" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">El número en el círculo es el código de salida. Ejecución real en Ubuntu 24.04 (WSL2) con diagnostic-kit.sh sobre un workspace desechable.</tspan></text></svg>
