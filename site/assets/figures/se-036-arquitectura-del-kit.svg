<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Arquitectura del kit: un núcleo y dos adaptadores</title><desc id="d">Un núcleo en Python (diagnostic_kit.py) con tres comandos, prepare, inspect, repair y clean, y dos adaptadores finos: diagnostic-kit.sh para Bash y diagnostic-kit.ps1 para PowerShell. El núcleo gobierna el contrato, los códigos de salida y la limpieza.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="450" fill="#ffffff"/><rect x="330" y="20" width="300" height="60" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="480" y="53.92" font-size="14" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="480" dy="0">Persona o automatización</tspan></text><rect x="40" y="130" width="340" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="210" y="163.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="210" dy="0">diagnostic-kit.sh (Bash)</tspan></text><rect x="580" y="130" width="340" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="750" y="163.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="750" dy="0">diagnostic-kit.ps1 (PowerShell)</tspan></text><polyline points="480,80 210,130" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="480,80 750,130" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="230" y="240" width="500" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="480" y="270.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="480" dy="0">diagnostic_kit.py: contrato, esquema 1, códigos 0/2/3, limpieza</tspan></text><text x="480" y="286.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="480" dy="0">acotada</tspan></text><polyline points="210,190 400,240" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="750,190 560,240" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="40" y="350" width="880" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="480" y="385.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="480" dy="0">Solo modifica .diagnostic-kit dentro de un workspace explícito; no enumera el entorno completo ni el usuario; no</tspan></text><text x="480" y="401.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="480" dy="0">instala paquetes ni eleva privilegios. Los adaptadores traducen argumentos y códigos, no deciden.</tspan></text></svg>
