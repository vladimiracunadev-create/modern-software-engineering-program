<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 389" width="960" height="389" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Estados y códigos de salida del kit</title><desc id="d">Tres estados del kit con su código de salida y la acción que corresponde: healthy o completado con código 0, degraded por precondición inválida con código 2 y refused por seguridad con código 3.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="389" fill="#ffffff"/><text x="210" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="210" dy="0">Estado y cuándo ocurre</tspan></text><text x="506" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="506" dy="0">Código</tspan></text><text x="776" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="776" dy="0">Acción</tspan></text><rect x="10" y="38" width="400" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="210" y="71.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="210" dy="0">healthy / completado. El workspace es válido o la</tspan></text><text x="210" y="87.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="210" dy="0">operación terminó</tspan></text><rect x="446" y="38" width="120" height="76" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="506" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="506" dy="0">código 0</tspan></text><rect x="602" y="38" width="348" height="76" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="776" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="776" dy="0">Conservar la evidencia</tspan></text><polyline points="410,76 446,76" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="566,76 602,76" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="132" width="400" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="210" y="165.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="210" dy="0">degraded / precondición inválida. settings.json</tspan></text><text x="210" y="181.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="210" dy="0">corrupto, workspace ausente o configuración inválida</tspan></text><rect x="446" y="132" width="120" height="76" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="506" y="173.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="506" dy="0">código 2</tspan></text><rect x="602" y="132" width="348" height="76" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="776" y="165.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="776" dy="0">Corregir el fixture y repetir; repair</tspan></text><text x="776" y="181.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="776" dy="0">restaura lo conocido</tspan></text><polyline points="410,170 446,170" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="566,170 602,170" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="226" width="400" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="210" y="259.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="210" dy="0">refused / rechazado por seguridad. Archivos ajenos o</tspan></text><text x="210" y="275.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="210" dy="0">marker de otro dueño</tspan></text><rect x="446" y="226" width="120" height="76" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="506" y="267.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="506" dy="0">código 3</tspan></text><rect x="602" y="226" width="348" height="76" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="776" y="259.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="776" dy="0">Revisar la propiedad; el kit no borra lo que</tspan></text><text x="776" y="275.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="776" dy="0">no reconoce</tspan></text><polyline points="410,264 446,264" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="566,264 602,264" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="316" width="940" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="340.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Los códigos son parte del contrato y están probados. Un script que consume el kit decide con ellos y no analizando el texto de</tspan></text><text x="480" y="357.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">los mensajes.</tspan></text></svg>
