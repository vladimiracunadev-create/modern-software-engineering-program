<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" width="940" height="420" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Estados y códigos de salida del kit</title><desc id="d">Tres estados con su código: healthy con código 0, degraded por integridad con código 2 y refused por seguridad con código 3. Cada uno indica una acción distinta.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="420" fill="#ffffff"/><rect x="10" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="122" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="122" dy="0">Estado</tspan></text><rect x="240" y="12" width="84" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="282" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="282" dy="0">Código</tspan></text><rect x="330" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="492" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="492" dy="0">Cuándo ocurre</tspan></text><rect x="660" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="797" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="797" dy="0">Acción</tspan></text><rect x="10" y="56" width="224" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="122" y="99.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">healthy / completado</tspan></text><rect x="240" y="56" width="84" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="282" y="99.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="282" dy="0">0</tspan></text><rect x="330" y="56" width="324" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="492" y="99.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">El workspace es válido o la operación terminó</tspan></text><rect x="660" y="56" width="274" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="99.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">Conservar la evidencia</tspan></text><rect x="10" y="142" width="224" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="122" y="177.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">degraded / precondición</tspan></text><text x="122" y="193.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">inválida</tspan></text><rect x="240" y="142" width="84" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="282" y="185.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="282" dy="0">2</tspan></text><rect x="330" y="142" width="324" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="492" y="177.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">settings.json corrupto, workspace ausente o</tspan></text><text x="492" y="193.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">configuración inválida</tspan></text><rect x="660" y="142" width="274" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="177.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">Corregir el fixture y repetir; repair</tspan></text><text x="797" y="193.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">restaura lo conocido</tspan></text><rect x="10" y="228" width="224" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="122" y="263.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">refused / rechazado por</tspan></text><text x="122" y="279.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">seguridad</tspan></text><rect x="240" y="228" width="84" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="282" y="271.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="282" dy="0">3</tspan></text><rect x="330" y="228" width="324" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="492" y="271.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">Archivos ajenos o marker de otro dueño</tspan></text><rect x="660" y="228" width="274" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="263.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">Revisar la propiedad; el kit no borra</tspan></text><text x="797" y="279.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">lo que no reconoce</tspan></text><rect x="10" y="330" width="920" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="360.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los códigos son parte del contrato y están probados. Un script que consume el kit decide con ellos y no analizando el texto</tspan></text><text x="470" y="376.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de los mensajes.</tspan></text></svg>
