<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Matriz de verificación: diez pruebas en dos plataformas</title><desc id="d">Tabla con las diez pruebas del laboratorio y su resultado: todas pasaron en Windows 11 con Python 3.12.9 en 0,257 segundos y en Ubuntu 24.04 bajo WSL2 con Python 3.12.3 en 1,710 segundos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="520" fill="#ffffff"/><rect x="10" y="12" width="464" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="242" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="242" dy="0">Contrato que prueba</tspan></text><rect x="480" y="12" width="229" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="594.5" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="594.5" dy="0">Windows 11 · Python 3.12.9</tspan></text><rect x="715" y="12" width="229" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="829.5" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="829.5" dy="0">Linux (WSL2) · Python 3.12.3</tspan></text><rect x="10" y="56" width="464" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="85.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Idempotencia de prepare; esquema y minimización de inspect</tspan></text><rect x="480" y="56" width="229" height