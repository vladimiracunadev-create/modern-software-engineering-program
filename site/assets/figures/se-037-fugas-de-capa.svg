<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuando las capas «filtran»: tres observaciones reales</title><desc id="d">Tabla con tres fugas de capa observadas: el servidor responde como cloudflare con Age 3521 (un intermediario sirve desde caché), alt-svc anuncia h3 (otro transporte) y la pregunta de si ping demuestra el servicio.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="450" fill="#ffffff"/><rect x="10" y="12" width="284" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="152" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="152" dy="0">Observación</tspan></text><rect x="300" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="422" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="422" dy="0">Qué capa parece responder</tspan></text><rect x="550" y="12" width="394" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="747" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="747" dy="0">Qué ocurre en realidad</tspan></text><rect x="10" y="56" width="284" height="90" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="104.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="152" dy="0">Server: cloudflare; Age: 3521</tspan></text><rect x="300" y="56" width="244" height="90" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="104.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">El origen del sitio</tspan></text><rect x="550" y="56" width="394" height="90" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="96.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">Un intermediario (CDN) termina TLS y sirve una</tspan></text><text x="747" y="112.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">copia con 3521 s de antigüedad</tspan></text><rect x="10" y="152" width="284" height="90" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="200.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="152" dy="0">alt-svc: h3=&quot;:443&quot;</tspan></text><rect x="300" y="152" width="244" height="90" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="200.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">HTTP/1.1 sobre TCP</tspan></text><rect x="550" y="152" width="394" height="90" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="192.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">El servidor ofrece HTTP/3 sobre QUIC (UDP) para</tspan></text><text x="747" y="208.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">próximas conexiones</tspan></text><rect x="10" y="248" width="284" height="90" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="296.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="152" dy="0">ping responde (TTL 56, 146 ms)</tspan></text><rect x="300" y="248" width="244" height="90" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="296.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">El servicio funciona</tspan></text><rect x="550" y="248" width="394" height="90" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="288.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">Solo hay respuesta ICMP bajo esa ruta y política;</tspan></text><text x="747" y="304.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">DNS, puerto, TLS y HTTP no se probaron</tspan></text><rect x="10" y="366" width="940" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="396.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Una conclusión sobre una capa necesita evidencia de esa capa: el contenido de la respuesta no prueba quién la generó, ni el</tspan></text><text x="480" y="412.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">éxito de una capa inferior prueba las superiores.</tspan></text></svg>
