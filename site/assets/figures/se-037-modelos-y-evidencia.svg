<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Los modelos OSI y TCP/IP aplicados a una petición observada</title><desc id="d">Tabla que asigna a cada capa un dato real observado en una petición a example.com: estado HTTP 200, handshake TLS 1.3, conexión TCP, TTL 56 de IP y MTU 1500 del enlace.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="470" fill="#ffffff"/><rect x="10" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="92" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="92" dy="0">OSI</tspan></text><rect x="180" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="242" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="242" dy="0">TCP/IP</tspan></text><rect x="310" y="12" width="394" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="507" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="507" dy="0">Evidencia observada</tspan></text><rect x="710" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="827" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="827" dy="0">No demuestra</tspan></text><rect x="10" y="56" width="164" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="92" y="92.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="92" dy="0">7 Aplicación</tspan></text><rect x="180" y="56" width="124" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="92.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="242" dy="0">Aplicación</tspan></text><rect x="310" y="56" width="394" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="507" y="92.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">HTTP/1.1 200 OK; Content-Type text/html; 577 bytes</tspan></text><rect x="710" y="56" width="234" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="84.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">Que el contenido sea el</tspan></text><text x="827" y="100.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">correcto para la persona</tspan></text><rect x="10" y="128" width="164" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="92" y="156.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="92" dy="0">6 Presentación / 5</tspan></text><text x="92" y="172.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="92" dy="0">Sesión</tspan></text><rect x="180" y="128" width="124" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="164.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="242" dy="0">Aplicación</tspan></text><rect x="310" y="128" width="394" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="507" y="156.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">TLS 1.3 con TLS_AES_256_GCM_SHA384; certificado para</tspan></text><text x="507" y="172.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">example.com</tspan></text><rect x="710" y="128" width="234" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="156.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">Que el servidor sea quien dice</tspan></text><text x="827" y="172.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">más allá del nombre</tspan></text><rect x="10" y="200" width="164" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="92" y="236.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="92" dy="0">4 Transporte</tspan></text><rect x="180" y="200" width="124" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="236.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="242" dy="0">Transporte</tspan></text><rect x="310" y="200" width="394" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="507" y="236.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">Conexión TCP al puerto 443 establecida en ≈131 ms</tspan></text><rect x="710" y="200" width="234" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="228.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">Que la aplicación esté sana</tspan></text><text x="827" y="244.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">(solo que el puerto escucha)</tspan></text><rect x="10" y="272" width="164" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="92" y="308.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="92" dy="0">3 Red</tspan></text><rect x="180" y="272" width="124" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="308.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="242" dy="0">Internet</tspan></text><rect x="310" y="272" width="394" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="507" y="308.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">ping: TTL = 56 y RTT medio de 146 ms</tspan></text><rect x="710" y="272" width="234" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="300.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">El número exacto de saltos: el</tspan></text><text x="827" y="316.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">TTL inicial es desconocido</tspan></text><rect x="10" y="344" width="164" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="92" y="380.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="92" dy="0">2 Enlace / 1 Física</tspan></text><rect x="180" y="344" width="124" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="380.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="242" dy="0">Acceso a red</tspan></text><rect x="310" y="344" width="394" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="507" y="372.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">MTU de 1500 en la interfaz; el límite de 1472 bytes de</tspan></text><text x="507" y="388.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">datos con DF activado</tspan></text><rect x="710" y="344" width="234" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="372.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">Qué medio (cable, Wi-Fi) usa</tspan></text><text x="827" y="388.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">cada tramo</tspan></text><rect x="10" y="400" width="940" height="54" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="422.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Los modelos son herramientas para ubicar una observación; una capa «ve» solo lo que su contrato le muestra, y varias capas</tspan></text><text x="480" y="438.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">pueden estar a cargo de componentes distintos.</tspan></text></svg>
