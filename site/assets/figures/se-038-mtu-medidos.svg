<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">MTU medidos: la interfaz local, el enlace y la ruta</title><desc id="d">Tabla con los MTU observados dentro de WSL2: 65536 en loopback y 1500 en eth0, más el límite de ruta de 1500 comprobado con ping y DF desde Windows.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="400" fill="#ffffff"/><rect x="10" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="117" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="117" dy="0">Dónde</tspan></text><rect x="230" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="302" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="302" dy="0">MTU observado</tspan></text><rect x="380" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="507" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="507" dy="0">Cómo se obtuvo</tspan></text><rect x="640" y="12" width="304" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="792" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="792" dy="0">Lectura</tspan></text><rect x="10" y="56" width="214" height="72" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="117" y="95.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="117" dy="0">Loopback (lo)</tspan></text><rect x="230" y="56" width="144" height="72" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="302" y="95.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="302" dy="0">65536</tspan></text><rect x="380" y="56" width="254" height="72" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="507" y="95.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">ip -o link en Linux (WSL2)</tspan></text><rect x="640" y="56" width="304" height="72" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="87.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">No sale a ningún medio: el límite es de</tspan></text><text x="792" y="103.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">software</tspan></text><rect x="10" y="134" width="214" height="72" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="117" y="173.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="117" dy="0">Interfaz eth0 de WSL2</tspan></text><rect x="230" y="134" width="144" height="72" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="302" y="173.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="302" dy="0">1500</tspan></text><rect x="380" y="134" width="254" height="72" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="507" y="173.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">ip -o link</tspan></text><rect x="640" y="134" width="304" height="72" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="173.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">Valor típico de Ethernet</tspan></text><rect x="10" y="212" width="214" height="72" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="117" y="251.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="117" dy="0">Ruta hasta example.com</tspan></text><rect x="230" y="212" width="144" height="72" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="302" y="251.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="302" dy="0">1500</tspan></text><rect x="380" y="212" width="254" height="72" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="507" y="251.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">ping -f -l 1472 funciona y 1473 no</tspan></text><rect x="640" y="212" width="304" height="72" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="243.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">Ningún tramo reduce el MTU por debajo de</tspan></text><text x="792" y="259.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">1500</tspan></text><rect x="10" y="310" width="920" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="340.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El MTU efectivo de una ruta es el mínimo de todos sus tramos. Se descubre con una prueba (PMTU) y no se deduce de la</tspan></text><text x="470" y="356.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">interfaz local.</tspan></text></svg>
