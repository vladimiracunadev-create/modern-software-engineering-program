<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Siguiente salto en una red local: misma subred o gateway (modelo con direcciones de documentación)</title><desc id="d">Dos casos: si el destino está en el mismo prefijo, el emisor resuelve con ARP la dirección de enlace del destino; si está en otro prefijo, resuelve la del gateway y le entrega la trama.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="460" fill="#ffffff"/><rect x="20" y="30" width="250" height="70" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="145" y="60.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="145" dy="0">Equipo 192.0.2.10/24</tspan></text><text x="145" y="76.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="145" dy="0">tabla de rutas local</tspan></text><rect x="380" y="20" width="270" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="515" y="50.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="515" dy="0">¿192.0.2.77 está en 192.0.2.0/24?</tspan></text><text x="515" y="66.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="515" dy="0">Sí → ARP de 192.0.2.77</tspan></text><rect x="380" y="120" width="270" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="515" y="142" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="515" dy="0">¿198.51.100.5 está en</tspan></text><text x="515" y="158.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="515" dy="0">192.0.2.0/24? No → ARP del gateway</tspan></text><text x="515" y="175.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="515" dy="0">192.0.2.1</tspan></text><polyline points="270,55 380,55" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="270,75 380,150" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="710" y="20" width="230" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="825" y="58.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="825" dy="0">Trama a la MAC del destino</tspan></text><rect x="710" y="120" width="230" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="825" y="142" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="825" dy="0">Trama a la MAC del gateway;</tspan></text><text x="825" y="158.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="825" dy="0">el paquete IP conserva el</tspan></text><text x="825" y="175.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="825" dy="0">destino final</tspan></text><polyline points="650,55 710,55" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="650,155 710,155" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="230" width="920" height="76" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="480" y="263.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="480" dy="0">La dirección de enlace (MAC) cambia en cada salto; la dirección IP de destino se mantiene hasta el final (salvo NAT). Por</tspan></text><text x="480" y="279.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="480" dy="0">eso un fallo de ARP afecta solo a la red local.</tspan></text><rect x="20" y="318" width="920" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="348.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Modelo con direcciones del rango de documentación (RFC 5737): no se midió una red real. Los dispositivos con Wi-Fi añaden</tspan></text><text x="480" y="364.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">asociación y reintentos de capa 2 que ocultan pérdidas.</tspan></text></svg>
