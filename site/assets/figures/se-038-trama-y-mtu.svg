<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" width="960" height="490" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una trama Ethernet y de dónde sale el límite de 1472 bytes</title><desc id="d">Una trama Ethernet de 1518 bytes: 14 de cabecera, 1500 de carga útil (MTU) y 4 de verificación. Dentro de la carga, 20 bytes de IPv4, 8 de ICMP y 1472 de datos. Con la bandera de no fragmentar, 1472 bytes de datos pasan y 1473 no.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="490" fill="#ffffff"/><text x="20" y="28" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">Trama Ethernet (bytes)</tspan></text><rect x="20" y="44" width="90" height="60" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="65" y="69.68" font-size="12" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="65" dy="0">Cabecera</tspan></text><text x="65" y="85.04" font-size="12" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="65" dy="0">14 B</tspan></text><rect x="110" y="44" width="700" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="460" y="77.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="460" dy="0">Carga útil (MTU) = 1500 B</tspan></text><rect x="810" y="44" width="90" height="60" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="855" y="69.68" font-size="12" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="855" dy="0">FCS</tspan></text><text x="855" y="85.04" font-size="12" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="855" dy="0">4 B</tspan></text><text x="20" y="140" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">Dentro de la carga útil de un ping</tspan></text><rect x="110" y="156" width="90" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="155" y="181.68" font-size="12" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="155" dy="0">IPv4</tspan></text><text x="155" y="197.04" font-size="12" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="155" dy="0">20 B</tspan></text><rect x="200" y="156" width="70" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="235" y="181.68" font-size="12" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="235" dy="0">ICMP</tspan></text><text x="235" y="197.04" font-size="12" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="235" dy="0">8 B</tspan></text><rect x="270" y="156" width="540" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="540" y="189.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="540" dy="0">Datos del ping: 1472 B</tspan></text><rect x="20" y="240" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="207" y="262.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="207" dy="0">Prueba (ping -f, no fragmentar)</tspan></text><rect x="400" y="240" width="514" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="657" y="262.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="657" dy="0">Resultado observado</tspan></text><rect x="20" y="284" width="374" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="309.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">datos de 1372 B</tspan></text><rect x="400" y="284" width="514" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="657" y="309.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="657" dy="0">Respuesta: bytes=1372, 143 ms</tspan></text><rect x="20" y="334" width="374" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="359.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">datos de 1472 B (20 + 8 + 1472 = 1500)</tspan></text><rect x="400" y="334" width="514" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="657" y="359.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="657" dy="0">Respuesta: bytes=1472, 164 ms</tspan></text><rect x="20" y="384" width="374" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="409.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">datos de 1473 B</tspan></text><rect x="400" y="384" width="514" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="657" y="409.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="657" dy="0">«Es necesario fragmentar el paquete pero se especificó DF»</tspan></text><rect x="20" y="446" width="880" height="36" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="460" y="459.68" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="460" dy="0">El MTU de la ruta hasta ese destino es de 1500 bytes. Los túneles y las VPN lo reducen y la fragmentación o los agujeros negros</tspan></text><text x="460" y="475.04" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="460" dy="0">de PMTU aparecen como fallos intermitentes.</tspan></text></svg>
