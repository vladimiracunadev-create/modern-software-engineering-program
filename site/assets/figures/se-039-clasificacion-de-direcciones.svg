<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Clasificar direcciones: lo que informa el módulo ipaddress</title><desc id="d">Seis direcciones agrupadas en cuatro cajones según lo que son realmente, cada una con el valor que devuelve is_private: 10.1.2.3, 172.20.0.1 y 192.168.1.1 son privadas de la RFC 1918; 192.0.2.5 es de documentación y se informa como privada; 100.64.0.1 es espacio compartido de CGNAT y se informa como no privada, igual que la pública 8.8.8.8.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="430" fill="#ffffff"/><rect x="10" y="14" width="226" height="78" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="123" y="56.36" font-size="12" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="123" dy="0">Espacio privado de la RFC 1918</tspan></text><rect x="10" y="104" width="226" height="188" rx="12" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><rect x="22" y="116" width="202" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="123" y="133.68" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="123" dy="0">10.1.2.3</tspan></text><text x="123" y="149.04" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="123" dy="0">is_private = Sí</tspan></text><rect x="22" y="170" width="202" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="123" y="187.68" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="123" dy="0">172.20.0.1</tspan></text><text x="123" y="203.04" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="123" dy="0">is_private = Sí</tspan></text><rect x="22" y="224" width="202" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="123" y="241.68" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="123" dy="0">192.168.1.1</tspan></text><text x="123" y="257.04" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="123" dy="0">is_private = Sí</tspan></text><polyline points="123,92 123,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="248" y="14" width="226" height="78" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="361" y="48.68" font-size="12" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="361" dy="0">Documentación (RFC 5737): no</tspan></text><text x="361" y="64.04" font-size="12" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="361" dy="0">es una red real</tspan></text><rect x="248" y="104" width="226" height="188" rx="12" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><rect x="260" y="116" width="202" height="44" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="361" y="133.68" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="361" dy="0">192.0.2.5</tspan></text><text x="361" y="149.04" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="361" dy="0">is_private = Sí</tspan></text><polyline points="361,92 361,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="486" y="14" width="226" height="78" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="599" y="41" font-size="12" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="599" dy="0">Espacio compartido de CGNAT</tspan></text><text x="599" y="56.36" font-size="12" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="599" dy="0">(100.64.0.0/10): ni privado ni</tspan></text><text x="599" y="71.72" font-size="12" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="599" dy="0">público</tspan></text><rect x="486" y="104" width="226" height="188" rx="12" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><rect x="498" y="116" width="202" height="44" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="599" y="133.68" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="599" dy="0">100.64.0.1</tspan></text><text x="599" y="149.04" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="599" dy="0">is_private = No</tspan></text><polyline points="599,92 599,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="724" y="14" width="226" height="78" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="837" y="56.36" font-size="12" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="837" dy="0">Dirección pública</tspan></text><rect x="724" y="104" width="226" height="188" rx="12" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><rect x="736" y="116" width="202" height="44" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="837" y="133.68" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="837" dy="0">8.8.8.8</tspan></text><text x="837" y="149.04" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="837" dy="0">is_private = No</tspan></text><polyline points="837,92 837,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="312" width="940" height="56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="335.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">«Privada» no significa «de mi red»: una misma dirección privada existe en millones de redes, y CGNAT rompe la suposición de</tspan></text><text x="480" y="351.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">que «no privada» es pública y única.</tspan></text></svg>
