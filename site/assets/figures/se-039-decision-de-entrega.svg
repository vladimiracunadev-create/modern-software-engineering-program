<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Decisión de entrega, NAT y retorno</title><desc id="d">Cuatro preguntas en orden: el prefijo del destino, el gateway, la traducción de direcciones del NAT y el MTU de la ruta. El NAT cambia direcciones y puertos y mantiene una tabla para el retorno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="460" fill="#ffffff"/><rect x="14" y="20" width="222" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="125" y="45.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="125" dy="0">1 Prefijo</tspan></text><rect x="14" y="72" width="222" height="150" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="125" y="127.32" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="125" dy="0">¿El destino está en una red</tspan></text><text x="125" y="142.68" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="125" dy="0">conectada? Se entrega</tspan></text><text x="125" y="158.04" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="125" dy="0">directamente; si no, se usa la</tspan></text><text x="125" y="173.4" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="125" dy="0">ruta más específica</tspan></text><polyline points="236,42 250,42" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="250" y="20" width="222" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="361" y="45.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="361" dy="0">2 Gateway</tspan></text><rect x="250" y="72" width="222" height="150" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="361" y="135" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="361" dy="0">La trama va a la MAC del</tspan></text><text x="361" y="150.36" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="361" dy="0">siguiente salto; el TTL</tspan></text><text x="361" y="165.72" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="361" dy="0">disminuye en cada router</tspan></text><polyline points="472,42 486,42" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="486" y="20" width="222" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="597" y="45.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="597" dy="0">3 NAT</tspan></text><rect x="486" y="72" width="222" height="150" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="597" y="127.32" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="597" dy="0">El router sustituye la</tspan></text><text x="597" y="142.68" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="597" dy="0">dirección privada por una</tspan></text><text x="597" y="158.04" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="597" dy="0">pública y el puerto de origen,</tspan></text><text x="597" y="173.4" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="597" dy="0">y recuerda la correspondencia</tspan></text><polyline points="708,42 722,42" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="722" y="20" width="222" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="833" y="45.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="833" dy="0">4 Retorno y MTU</tspan></text><rect x="722" y="72" width="222" height="150" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="833" y="127.32" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="833" dy="0">La respuesta vuelve por la</tspan></text><text x="833" y="142.68" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="833" dy="0">tabla del NAT; un paquete</tspan></text><text x="833" y="158.04" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="833" dy="0">mayor que el MTU con DF se</tspan></text><text x="833" y="173.4" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="833" dy="0">descarta y avisa por ICMP</tspan></text><rect x="14" y="246" width="930" height="70" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="479" y="276.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="479" dy="0">Observado: TTL = 56 en la respuesta a ping y MTU de ruta de 1500. La mayoría de los equipos domésticos están tras un NAT: su</tspan></text><text x="479" y="292.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="479" dy="0">dirección privada no es visible desde Internet.</tspan></text><rect x="14" y="330" width="930" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="479" y="366.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="479" dy="0">NAT dificulta las conexiones entrantes y obliga a mantener estado; IPv6 reduce la necesidad de NAT pero no de cortafuegos.</tspan></text></svg>
