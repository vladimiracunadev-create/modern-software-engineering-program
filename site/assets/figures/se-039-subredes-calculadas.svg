<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 331" width="940" height="331" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Aritmética de subredes calculada con ipaddress</title><desc id="d">Barras horizontales en escala logarítmica con el número de direcciones calculado con ipaddress: 254 hosts en 192.0.2.0/24, 62 en 192.0.2.64/26 y 18 446 744 073 709 551 616 direcciones en un /64 de IPv6.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="331" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Aritmética de subredes calculada con ipaddress</tspan></text><line x1="250.66" y1="49" x2="250.66" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="250.66" y1="163" x2="250.66" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="250.66" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="250.66" dy="0">10</tspan></text><line x1="384.713" y1="49" x2="384.713" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="384.713" y1="163" x2="384.713" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="384.713" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="384.713" dy="0">1 000 000</tspan></text><line x1="545.576" y1="49" x2="545.576" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="545.576" y1="163" x2="545.576" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="545.576" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="545.576" dy="0">1 000 000 000 000</tspan></text><line x1="706.44" y1="49" x2="706.44" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="706.44" y1="163" x2="706.44" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="706.44" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="706.44" dy="0">1 000 000 000 000 000 000</tspan></text><line x1="250.66" y1="163" x2="706.44" y2="163" stroke="#5b7280" stroke-width="1.6"/><text x="240.66" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="240.66" dy="0">Hosts de 192.0.2.0/24</tspan></text><text x="240.66" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="240.66" dy="0">Hosts de 192.0.2.64/26</tspan></text><text x="240.66" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="240.66" dy="0">Direcciones de un /64 de IPv6</tspan></text><rect x="250.66" y="55" width="37.6644" height="26" rx="3" fill="#087f8c"/><text x="295.324" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="295.324" dy="0">254</tspan></text><rect x="250.66" y="93" width="21.2445" height="26" rx="3" fill="#087f8c"/><text x="278.904" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="278.904" dy="0">62</tspan></text><rect x="250.66" y="131" width="489.72" height="26" rx="3" fill="#087f8c"/><text x="747.38" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="747.38" dy="0">18 446 744 073 709 551 616</tspan></text><text x="478.55" y="207" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="478.55" dy="0">direcciones (escala logarítmica)</tspan></text><rect x="10" y="221" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="245.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cada cuenta es una potencia: 2^(32-24) = 256 direcciones menos red y difusión da 254; 2^(32-26) = 64 menos 2 da 62 (de .64</tspan></text><text x="470" y="262.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">a .127); 2^(128-64) da el /64. 192.0.2.70 pertenece a la /26 y 192.0.2.200 no (se compara el prefijo de 26 bits), y</tspan></text><text x="470" y="279.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">2001:0db8:0000:...:0001 se comprime como 2001:db8::1. La máscara decide qué es «local»: un error de un bit en el prefijo</tspan></text><text x="470" y="295.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cambia el conjunto de direcciones alcanzables sin pasar por el gateway.</tspan></text></svg>
