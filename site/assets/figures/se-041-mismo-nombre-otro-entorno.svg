<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 363" width="960" height="363" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El mismo nombre, dos entornos, respuestas distintas</title><desc id="d">Tres consultas con el resultado real de getaddrinfo en cada entorno: example.com devolvió 2 direcciones IPv4 en Windows y 4 direcciones (IPv4 e IPv6) en Linux; localhost devolvió 2 direcciones en Windows y 1 en Linux; un nombre inexistente produjo el código 11001 en Windows y -2 en Linux.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="363" fill="#ffffff"/><rect x="350" y="12" width="296" height="28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="498" y="29.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="498" dy="0">Windows</tspan></text><rect x="654" y="12" width="296" height="28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="802" y="29.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="802" dy="0">Linux (WSL2)</tspan></text><rect x="10" y="48" width="300" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="160" y="83.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="160" dy="0">example.com (puerto 443)</tspan></text><rect x="345" y="43" width="610" height="74" rx="12" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><polyline points="310,80 345,80" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="350" y="48" width="296" height="64" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="498" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="498" dy="0">2 direcciones, solo IPv4</tspan></text><rect x="654" y="48" width="296" height="64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="802" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="802" dy="0">4 direcciones: IPv4 e IPv6</tspan></text><rect x="10" y="130" width="300" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="160" y="165.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="160" dy="0">localhost</tspan></text><rect x="345" y="125" width="610" height="74" rx="12" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><polyline points="310,162 345,162" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="350" y="130" width="296" height="64" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="498" y="165.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="498" dy="0">2 direcciones: IPv4 e IPv6</tspan></text><rect x="654" y="130" width="296" height="64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="802" y="165.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="802" dy="0">1 dirección: IPv4</tspan></text><rect x="10" y="212" width="300" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="160" y="247.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="160" dy="0">no-existe.invalid</tspan></text><rect x="345" y="207" width="610" height="74" rx="12" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><polyline points="310,244 345,244" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="350" y="212" width="296" height="64" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="498" y="247.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="498" dy="0">Errno 11001: getaddrinfo failed</tspan></text><rect x="654" y="212" width="296" height="64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="802" y="247.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="802" dy="0">Errno -2: Name or service not known</tspan></text><rect x="10" y="290" width="940" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="314.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">La resolución es una función del entorno: familias de direcciones, caché, resolvedor y códigos de error difieren. Un</tspan></text><text x="480" y="331.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">diagnóstico declara dónde se resolvió y con qué herramienta.</tspan></text></svg>
