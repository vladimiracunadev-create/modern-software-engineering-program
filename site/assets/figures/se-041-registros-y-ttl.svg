<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 428" width="940" height="428" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Registros de example.com consultados al resolvedor 1.1.1.1</title><desc id="d">Barras horizontales en escala logarítmica con el TTL restante de cada tipo de registro: A (2 respuestas) 179 s, AAAA (2) 46 s, NS (2) 68 664 s, MX (1) 300 s, TXT (2) 300 s, y la respuesta negativa de un nombre inexistente con un SOA de TTL 1800 s.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="428" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Registros de example.com consultados al resolvedor 1.1.1.1</tspan></text><line x1="220.5" y1="49" x2="220.5" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="220.5" y1="277" x2="220.5" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="220.5" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="220.5" dy="0">10</tspan></text><line x1="382.285" y1="49" x2="382.285" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="382.285" y1="277" x2="382.285" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="382.285" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382.285" dy="0">100</tspan></text><line x1="544.07" y1="49" x2="544.07" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="544.07" y1="277" x2="544.07" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="544.07" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="544.07" dy="0">1 000</tspan></text><line x1="705.855" y1="49" x2="705.855" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="705.855" y1="277" x2="705.855" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="705.855" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705.855" dy="0">10 000</tspan></text><line x1="867.64" y1="49" x2="867.64" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="867.64" y1="277" x2="867.64" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="867.64" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867.64" dy="0">100 000</tspan></text><line x1="220.5" y1="277" x2="867.64" y2="277" stroke="#5b7280" stroke-width="1.6"/><text x="210.5" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="210.5" dy="0">A (2 respuestas)</tspan></text><text x="210.5" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="210.5" dy="0">AAAA (2 respuestas)</tspan></text><text x="210.5" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="210.5" dy="0">NS (2 respuestas)</tspan></text><text x="210.5" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="210.5" dy="0">MX (1 respuesta)</tspan></text><text x="210.5" y="224.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="210.5" dy="0">TXT (2 respuestas)</tspan></text><text x="210.5" y="262.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="210.5" dy="0">NXDOMAIN (SOA de la zona)</tspan></text><rect x="220.5" y="55" width="202.693" height="26" rx="3" fill="#087f8c"/><text x="430.193" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="430.193" dy="0">179</tspan></text><rect x="220.5" y="93" width="107.224" height="26" rx="3" fill="#087f8c"/><text x="334.724" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="334.724" dy="0">46</tspan></text><rect x="220.5" y="131" width="620.725" height="26" rx="3" fill="#087f8c"/><text x="848.225" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="848.225" dy="0">68 664</tspan></text><rect x="220.5" y="169" width="238.976" height="26" rx="3" fill="#087f8c"/><text x="466.476" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="466.476" dy="0">300</tspan></text><rect x="220.5" y="207" width="238.976" height="26" rx="3" fill="#087f8c"/><text x="466.476" y="224.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="466.476" dy="0">300</tspan></text><rect x="220.5" y="245" width="364.869" height="26" rx="3" fill="#087f8c"/><text x="592.369" y="262.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="592.369" dy="0">1 800</tspan></text><text x="544.07" y="321" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="544.07" dy="0">segundos (escala logarítmica)</tspan></text><rect x="10" y="335" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="359.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">A y AAAA guardan las direcciones IPv4 e IPv6; NS, los servidores autoritativos de la zona (TTL largo); MX es aquí un</tspan></text><text x="470" y="376.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">registro de MX nulo; TXT, texto libre (verificaciones, políticas); y NXDOMAIN muestra que la ausencia también se guarda en</tspan></text><text x="470" y="393.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">caché (RFC 2308). El TTL que ves es el tiempo restante en la caché del resolvedor, no el TTL configurado en la zona.</tspan></text></svg>
