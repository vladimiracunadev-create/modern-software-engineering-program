<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="940" height="440" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuánto tarda resolver un nombre: primera consulta, caché y fallo</title><desc id="d">Barras con una medición real de getaddrinfo: example.com tarda 35,9 ms en la primera consulta y 0,5 ms en la segunda en Windows, y 14,3 ms y 8,2 ms en Linux (WSL2); un nombre inexistente tarda 11,7 y 9,4 ms.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="440" fill="#ffffff"/><text x="20" y="28" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">getaddrinfo (milisegundos)</tspan></text><text x="270" y="65" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="270" dy="0">Windows, 1.ª consulta</tspan></text><rect x="280" y="44" width="394.9" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="682.9" y="65" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="682.9" dy="0">35,9 ms</tspan></text><text x="270" y="109" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="270" dy="0">Windows, 2.ª consulta</tspan></text><rect x="280" y="88" width="5.5" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="293.5" y="109" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="293.5" dy="0">0,5 ms</tspan></text><text x="270" y="153" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="270" dy="0">Linux, 1.ª consulta</tspan></text><rect x="280" y="132" width="157.3" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="445.3" y="153" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="445.3" dy="0">14,3 ms</tspan></text><text x="270" y="197" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="270" dy="0">Linux, 2.ª consulta</tspan></text><rect x="280" y="176" width="90.2" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="378.2" y="197" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="378.2" dy="0">8,2 ms</tspan></text><text x="270" y="241" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="270" dy="0">Nombre inexistente (Windows)</tspan></text><rect x="280" y="220" width="128.7" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="416.7" y="241" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="416.7" dy="0">11,7 ms</tspan></text><text x="270" y="285" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="270" dy="0">Nombre inexistente (Linux)</tspan></text><rect x="280" y="264" width="103.4" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="391.4" y="285" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="391.4" dy="0">9,4 ms</tspan></text><rect x="20" y="320" width="900" height="70" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="470" y="350.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="470" dy="0">La segunda consulta es mucho más rápida en Windows (caché del cliente); en WSL2 la caché local es menor o inexistente y</tspan></text><text x="470" y="366.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="470" dy="0">cada consulta cruza hacia el resolvedor. Un fallo también cuesta tiempo.</tspan></text><text x="470" y="420" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con curl, Python y ping desde un equipo concreto; los valores cambian con la red y la hora.</tspan></text></svg>
