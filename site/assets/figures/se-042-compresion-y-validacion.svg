<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" width="940" height="430" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Negociar y reutilizar: compresión y validación</title><desc id="d">Barras con una medición real: el cuerpo de 577 bytes viaja en 400 bytes con Content-Encoding gzip, y una petición condicional devuelve 304 sin cuerpo. La respuesta tenía 3521 segundos de antigüedad en la caché.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="430" fill="#ffffff"/><text x="20" y="28" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">Bytes transferidos por el cuerpo</tspan></text><text x="280" y="65" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="280" dy="0">Sin compresión (identity)</tspan></text><rect x="290" y="44" width="461.6" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="759.6" y="65" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="759.6" dy="0">577 B</tspan></text><text x="280" y="111" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="280" dy="0">Con Accept-Encoding: gzip</tspan></text><rect x="290" y="90" width="320" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="618" y="111" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="618" dy="0">400 B</tspan></text><text x="280" y="157" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="280" dy="0">304 con If-Modified-Since</tspan></text><rect x="290" y="136" width="4" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="302" y="157" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="302" dy="0">0 B</tspan></text><rect x="20" y="200" width="900" height="74" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="470" y="232.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="470" dy="0">Accept-Encoding es una preferencia del cliente y Content-Encoding la decisión del servidor; si la respuesta varía según</tspan></text><text x="470" y="248.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="470" dy="0">esa cabecera, el intermediario debe saberlo (Vary) para no mezclar copias.</tspan></text><rect x="20" y="288" width="900" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="313.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Age = 3521 s: la copia que recibió el cliente tenía casi una hora. La frescura la decide Cache-Control; sin validador</tspan></text><text x="470" y="329.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">fuerte, la revalidación usa la fecha.</tspan></text><text x="470" y="380" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con curl contra https://example.com; los tamaños dependen del sitio y del momento.</tspan></text></svg>
