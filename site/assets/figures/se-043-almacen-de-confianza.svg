<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El almacén de confianza también es parte del sistema</title><desc id="d">Tabla con tres observaciones reales: Python en Windows falló con unable to get local issuer certificate al conectar a example.com y funcionó después de que curl con Schannel construyera la cadena, Python en Linux funcionó de inmediato, y un nombre desconocido recibió un alert de handshake failure.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="450" fill="#ffffff"/><rect x="10" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="137" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="137" dy="0">Observación</tspan></text><rect x="270" y="12" width="354" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="447" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="447" dy="0">Resultado</tspan></text><rect x="630" y="12" width="314" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="787" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="787" dy="0">Lectura</tspan></text><rect x="10" y="56" width="254" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="97.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">Python en Windows, primer intento</tspan></text><rect x="270" y="56" width="354" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="447" y="89.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">CERTIFICATE_VERIFY_FAILED: unable to get local</tspan></text><text x="447" y="105.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">issuer certificate (110 raíces cargadas)</tspan></text><rect x="630" y="56" width="314" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="89.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">La raíz de la cadena no estaba aún en el</tspan></text><text x="787" y="105.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">almacén que Python leyó</tspan></text><rect x="10" y="138" width="254" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="171.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">Tras una petición con curl</tspan></text><text x="137" y="187.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">(Schannel)</tspan></text><rect x="270" y="138" width="354" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="447" y="171.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">Python funciona; la raíz «SSL.com TLS ECC Root CA</tspan></text><text x="447" y="187.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">2022» ya aparece</tspan></text><rect x="630" y="138" width="314" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="171.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">Windows incorpora raíces bajo demanda</tspan></text><text x="787" y="187.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">cuando construye una cadena</tspan></text><rect x="10" y="220" width="254" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="261.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">Python en Linux (WSL2)</tspan></text><rect x="270" y="220" width="354" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="447" y="261.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">Funciona a la primera</tspan></text><rect x="630" y="220" width="314" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="253.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">El paquete de certificados de la</tspan></text><text x="787" y="269.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">distribución ya contenía la raíz</tspan></text><rect x="10" y="302" width="254" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="335.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">SNI con un nombre desconocido</tspan></text><text x="137" y="351.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">(example.com)</tspan></text><rect x="270" y="302" width="354" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="447" y="343.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">sslv3 alert handshake failure</tspan></text><rect x="630" y="302" width="314" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="335.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">El servidor rechaza un nombre que no sirve:</tspan></text><text x="787" y="351.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">no es un error de certificado</tspan></text><rect x="10" y="396" width="940" height="44" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="421.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Una misma conexión puede validarse o no según el almacén de cada cliente. Se declara qué almacén usa cada herramienta.</tspan></text></svg>
