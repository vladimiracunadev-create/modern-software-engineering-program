<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 478" width="960" height="478" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El almacén de confianza también es parte del sistema</title><desc id="d">Cuatro observaciones reales con su resultado y su lectura: Python en Windows falló con unable to get local issuer certificate al conectar a example.com y funcionó después de que curl con Schannel construyera la cadena, Python en Linux funcionó de inmediato, y un nombre desconocido recibió un alert de handshake failure.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="478" fill="#ffffff"/><text x="140" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="140" dy="0">Observación</tspan></text><text x="471" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="471" dy="0">Resultado</tspan></text><text x="811" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="811" dy="0">Lectura</tspan></text><rect x="10" y="38" width="260" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="140" y="79.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="140" dy="0">Python en Windows, primer intento</tspan></text><rect x="306" y="38" width="330" height="76" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="471" y="71.68" font-size="12" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="471" dy="0">CERTIFICATE_VERIFY_FAILED: unable to get local</tspan></text><text x="471" y="87.04" font-size="12" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="471" dy="0">issuer certificate (110 raíces cargadas)</tspan></text><rect x="672" y="38" width="278" height="76" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="811" y="71.68" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="811" dy="0">La raíz de la cadena no estaba aún en</tspan></text><text x="811" y="87.04" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="811" dy="0">el almacén que Python leyó</tspan></text><polyline points="270,76 306,76" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="636,76 672,76" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="132" width="260" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="140" y="165.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="140" dy="0">Tras una petición con curl</tspan></text><text x="140" y="181.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="140" dy="0">(Schannel)</tspan></text><rect x="306" y="132" width="330" height="76" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="471" y="165.68" font-size="12" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="471" dy="0">Python funciona; la raíz «SSL.com TLS ECC Root</tspan></text><text x="471" y="181.04" font-size="12" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="471" dy="0">CA 2022» ya aparece</tspan></text><rect x="672" y="132" width="278" height="76" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="811" y="165.68" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="811" dy="0">Windows incorpora raíces bajo demanda</tspan></text><text x="811" y="181.04" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="811" dy="0">cuando construye una cadena</tspan></text><polyline points="270,170 306,170" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="636,170 672,170" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="226" width="260" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="140" y="267.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="140" dy="0">Python en Linux (WSL2)</tspan></text><rect x="306" y="226" width="330" height="76" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="471" y="267.36" font-size="12" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="471" dy="0">Funciona a la primera</tspan></text><rect x="672" y="226" width="278" height="76" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="811" y="259.68" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="811" dy="0">El paquete de certificados de la</tspan></text><text x="811" y="275.04" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="811" dy="0">distribución ya contenía la raíz</tspan></text><polyline points="270,264 306,264" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="636,264 672,264" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="320" width="260" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="140" y="353.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="140" dy="0">SNI con un nombre desconocido</tspan></text><text x="140" y="369.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="140" dy="0">(example.com)</tspan></text><rect x="306" y="320" width="330" height="76" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="471" y="361.36" font-size="12" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="471" dy="0">sslv3 alert handshake failure</tspan></text><rect x="672" y="320" width="278" height="76" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="811" y="353.68" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="811" dy="0">El servidor rechaza un nombre que no</tspan></text><text x="811" y="369.04" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="811" dy="0">sirve: no es un error de certificado</tspan></text><polyline points="270,358 306,358" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="636,358 672,358" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="410" width="940" height="54" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="440.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Una misma conexión puede validarse o no según el almacén de cada cliente. Se declara qué almacén usa cada herramienta.</tspan></text></svg>
