<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" width="960" height="370" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Lo que muestra una conexión TLS real a example.com</title><desc id="d">Cadena de confianza observada en una conexión a example.com: un certificado hoja (CN example.com, nombres alternativos example.com y *.example.com, válido del 26 de septiembre al 25 de diciembre de 2026, 90 días) firmado por dos intermedios y una raíz de SSL.com, con la sesión TLS 1.3 y TLS_AES_256_GCM_SHA384 y un handshake de unos 145 ms.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="370" fill="#ffffff"/><text x="480" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="480" dy="0">Cadena presentada: cada certificado está firmado por el siguiente y la confianza llega hasta una raíz que el cliente ya tiene</tspan></text><rect x="10" y="40" width="212" height="120" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="116" y="64.96" font-size="12" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="116" dy="0">Certificado hoja</tspan></text><text x="116" y="80.32" font-size="12" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="116" dy="0">CN = example.com</tspan></text><text x="116" y="95.68" font-size="12" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="116" dy="0">SAN: example.com,</tspan></text><text x="116" y="111.04" font-size="12" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="116" dy="0">*.example.com</tspan></text><text x="116" y="126.4" font-size="12" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="116" dy="0">Válido 26 sep → 25 dic 2026</tspan></text><text x="116" y="141.76" font-size="12" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="116" dy="0">(90 días)</tspan></text><polyline points="222,100 252,100" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="252" y="40" width="212" height="120" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="358" y="88" font-size="12" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="358" dy="0">Intermedio</tspan></text><text x="358" y="103.36" font-size="12" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="358" dy="0">Cloudflare TLS Issuing ECC</tspan></text><text x="358" y="118.72" font-size="12" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="358" dy="0">CA 3</tspan></text><polyline points="464,100 494,100" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="494" y="40" width="212" height="120" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="600" y="88" font-size="12" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="600" dy="0">Intermedio</tspan></text><text x="600" y="103.36" font-size="12" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="600" dy="0">SSL.com TLS Transit ECC CA</tspan></text><text x="600" y="118.72" font-size="12" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="600" dy="0">R2</tspan></text><polyline points="706,100 736,100" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="736" y="40" width="212" height="120" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="842" y="80.32" font-size="12" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="842" dy="0">Raíz</tspan></text><text x="842" y="95.68" font-size="12" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="842" dy="0">SSL.com TLS ECC Root CA 2022</tspan></text><text x="842" y="111.04" font-size="12" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="842" dy="0">(ya está en el almacén del</tspan></text><text x="842" y="126.4" font-size="12" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="842" dy="0">cliente)</tspan></text><rect x="10" y="190" width="224" height="86" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="122" y="213.32" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="122" dy="0">Sesión: TLS 1.3 con</tspan></text><text x="122" y="228.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="122" dy="0">TLS_AES_256_GCM_SHA384.</tspan></text><text x="122" y="244.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="122" dy="0">Cifrado autenticado y claves</tspan></text><text x="122" y="259.4" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="122" dy="0">efímeras</tspan></text><rect x="248" y="190" width="224" height="86" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="360" y="221" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="360" dy="0">Nombre: el cliente verifica el</tspan></text><text x="360" y="236.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="360" dy="0">nombre contra la SAN, no solo</tspan></text><text x="360" y="251.72" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="360" dy="0">contra el CN</tspan></text><rect x="486" y="190" width="224" height="86" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="598" y="221" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="598" dy="0">Vida corta: 90 días de</tspan></text><text x="598" y="236.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="598" dy="0">validez; los certificados</tspan></text><text x="598" y="251.72" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="598" dy="0">modernos se renuevan a menudo</tspan></text><rect x="724" y="190" width="224" height="86" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="836" y="213.32" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="836" dy="0">Handshake: ≈145 ms, un viaje</tspan></text><text x="836" y="228.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="836" dy="0">de ida y vuelta; TLS 1.3</tspan></text><text x="836" y="244.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="836" dy="0">completa la negociación en un</tspan></text><text x="836" y="259.4" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="836" dy="0">RTT</tspan></text><rect x="10" y="296" width="940" height="56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="327.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">El certificado prueba que el servidor controla el nombre, no que sea digno de confianza ni que su contenido sea correcto.</tspan></text></svg>
