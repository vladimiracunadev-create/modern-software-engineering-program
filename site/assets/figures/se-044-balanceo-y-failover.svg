<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 306" width="940" height="306" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Balanceo y conmutación por falla: lo que se observó</title><desc id="d">Barras horizontales en escala logarítmica con el tiempo en que se detectó el primer fallo al detener el origen A: 0,35 ms en Linux (rechazo inmediato) y 499,9 ms en Windows (espera hasta el timeout de conexión); el reparto de 20 peticiones fue idéntico en ambos sistemas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="306" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Balanceo y conmutación por falla: lo que se observó</tspan></text><line x1="273.28" y1="49" x2="273.28" y2="125" stroke="#d5dde1" stroke-width="1"/><line x1="273.28" y1="125" x2="273.28" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="273.28" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="273.28" dy="0">0,1</tspan></text><line x1="423.885" y1="49" x2="423.885" y2="125" stroke="#d5dde1" stroke-width="1"/><line x1="423.885" y1="125" x2="423.885" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="423.885" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="423.885" dy="0">1</tspan></text><line x1="574.49" y1="49" x2="574.49" y2="125" stroke="#d5dde1" stroke-width="1"/><line x1="574.49" y1="125" x2="574.49" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="574.49" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="574.49" dy="0">10</tspan></text><line x1="725.095" y1="49" x2="725.095" y2="125" stroke="#d5dde1" stroke-width="1"/><line x1="725.095" y1="125" x2="725.095" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="725.095" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="725.095" dy="0">100</tspan></text><line x1="875.7" y1="49" x2="875.7" y2="125" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="125" x2="875.7" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">1 000</tspan></text><line x1="273.28" y1="125" x2="875.7" y2="125" stroke="#5b7280" stroke-width="1.6"/><text x="263.28" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="263.28" dy="0">Linux (WSL2): rechazo inmediato</tspan></text><text x="263.28" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="263.28" dy="0">Windows: espera hasta el timeout</tspan></text><rect x="273.28" y="55" width="81.9394" height="26" rx="3" fill="#c0432f"/><text x="362.219" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="362.219" dy="0">0,35</tspan></text><rect x="273.28" y="93" width="557.07" height="26" rx="3" fill="#c0432f"/><text x="837.35" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="837.35" dy="0">499,9</tspan></text><text x="574.49" y="169" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="574.49" dy="0">ms (escala logarítmica)</tspan></text><rect x="10" y="183" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="207.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">En ambos sistemas, 20 peticiones en turno rotatorio con A y B sanos se repartieron 10 y 10; con A detenido, las 20</tspan></text><text x="470" y="224.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">terminaron en B y se detectaron 10 fallos al conectar. Un balanceador sin comprobaciones de salud sigue enviando tráfico al</tspan></text><text x="470" y="241.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">origen caído, y el costo de descubrir la caída depende de cómo falla la conexión y del timeout elegido.</tspan></text><text x="470" y="288.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Orígenes y balanceo simulados en loopback; no se midió un balanceador real.</tspan></text></svg>
