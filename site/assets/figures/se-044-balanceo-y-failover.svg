<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="940" height="440" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Balanceo y conmutación por falla: lo que se observó</title><desc id="d">Tabla con una prueba local: 20 peticiones en turno rotatorio se reparten 10 y 10; tras detener el origen A, las 20 peticiones acabaron en B con reintento; detectar el fallo tardó 0,35 ms en Linux y 499,9 ms en Windows (la espera hasta el timeout de conexión).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="440" fill="#ffffff"/><rect x="10" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Situación</tspan></text><rect x="390" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="527" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="527" dy="0">Linux (WSL2)</tspan></text><rect x="670" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="807" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="807" dy="0">Windows</tspan></text><rect x="10" y="56" width="374" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="94.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">20 peticiones en turno rotatorio (A y B sanos)</tspan></text><rect x="390" y="56" width="274" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="94.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">A = 10, B = 10</tspan></text><rect x="670" y="56" width="274" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="94.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">A = 10, B = 10</tspan></text><rect x="10" y="132" width="374" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="170.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">A detenido; las 20 peticiones terminan en B</tspan></text><rect x="390" y="132" width="274" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="162.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">20 en B; 10 fallos detectados al</tspan></text><text x="527" y="178.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">conectar</tspan></text><rect x="670" y="132" width="274" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="162.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">20 en B; 10 fallos detectados al</tspan></text><text x="807" y="178.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">conectar</tspan></text><rect x="10" y="208" width="374" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="246.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Tiempo del primer fallo detectado</tspan></text><rect x="390" y="208" width="274" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="246.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">0,35 ms (rechazo inmediato)</tspan></text><rect x="670" y="208" width="274" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="246.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">499,9 ms (espera hasta el timeout)</tspan></text><rect x="10" y="320" width="920" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="350.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Un balanceador sin comprobaciones de salud sigue enviando tráfico al origen caído. El costo de descubrir la caída depende</tspan></text><text x="470" y="366.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de cómo falla la conexión y del timeout elegido.</tspan></text><text x="470" y="416" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Orígenes y balanceo simulados en loopback; no se midió un balanceador real.</tspan></text></svg>
