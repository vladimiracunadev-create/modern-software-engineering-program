<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué se observa y qué queda oculto detrás de una CDN</title><desc id="d">Tabla con las observaciones desde el cliente: Server cloudflare, Age 3521, alt-svc h3 y un certificado emitido por una CA intermedia de Cloudflare; no se ve el origen, su certificado ni el número de nodos de borde.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="440" fill="#ffffff"/><rect x="10" y="12" width="484" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="252" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="252" dy="0">Observable desde el cliente</tspan></text><rect x="500" y="12" width="444" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="722" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="722" dy="0">No observable</tspan></text><rect x="10" y="56" width="484" height="68" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="252" y="93.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="252" dy="0">Server: cloudflare · Age: 3521 s · alt-svc: h3</tspan></text><rect x="500" y="56" width="444" height="68" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="93.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">Qué servidor de origen existe y en qué región</tspan></text><rect x="10" y="130" width="484" height="68" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="252" y="159.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="252" dy="0">Un certificado de 90 días para example.com emitido por una CA</tspan></text><text x="252" y="175.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="252" dy="0">intermedia</tspan></text><rect x="500" y="130" width="444" height="68" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="167.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">Si el tráfico hacia el origen también va cifrado</tspan></text><rect x="10" y="204" width="484" height="68" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="252" y="241.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="252" dy="0">RTT medio de 146 ms hasta el nodo que responde</tspan></text><rect x="500" y="204" width="444" height="68" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="241.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">En qué nodo de borde cayó la petición</tspan></text><rect x="10" y="278" width="484" height="68" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="252" y="315.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="252" dy="0">La respuesta tenía 3521 s de antigüedad</tspan></text><rect x="500" y="278" width="444" height="68" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="315.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">Cuándo fue la última validación con el origen</tspan></text><rect x="10" y="360" width="940" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="385.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Una CDN es un intermediario: reduce latencia y carga, pero añade capas en las que pueden fallar la caché, el certificado o las</tspan></text><text x="480" y="401.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">cabeceras. Diagnosticar exige conocer cuál respondió.</tspan></text></svg>
