<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Quién puede afirmar la IP del cliente: origen directo frente a proxy</title><desc id="d">Dos caminos de una misma petición con un X-Forwarded-For falso 203.0.113.99: enviada directamente al origen, este la acepta tal cual; enviada a través del proxy, el proxy sustituye la cabecera por la IP real 127.0.0.1, conserva el identificador de petición abc-123 y añade Via.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="460" fill="#ffffff"/><text x="480" y="22" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="480" dy="0">Camino directo: el origen confía en lo que dice el cliente</tspan></text><rect x="10" y="36" width="130" height="84" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="75" y="81.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="75" dy="0">Cliente</tspan></text><polyline points="140,78 580,78" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="360" y="68" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="360" dy="0">X-Forwarded-For: 203.0.113.99 (falso)</tspan></text><rect x="580" y="36" width="130" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="645" y="81.92" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="645" dy="0">Origen</tspan></text><polyline points="710,78 740,78" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="740" y="36" width="210" height="84" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="845" y="66" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="845" dy="0">Acepta 203.0.113.99,</tspan></text><text x="845" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="845" dy="0">falsificado por el cliente;</tspan></text><text x="845" y="96.72" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="845" dy="0">sin X-Request-Id ni Via</tspan></text><text x="480" y="156" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="480" dy="0">A través del proxy: la cabecera la fija un componente de confianza</tspan></text><rect x="10" y="170" width="130" height="84" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="75" y="215.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="75" dy="0">Cliente</tspan></text><polyline points="140,212 270,212" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="205" y="188" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="205" dy="0">XFF falso</tspan><tspan x="205" dy="16.64">203.0.113.99</tspan></text><rect x="270" y="170" width="150" height="84" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="345" y="207.32" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="345" dy="0">Proxy de</tspan></text><text x="345" y="223.96" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="345" dy="0">confianza</tspan></text><polyline points="420,212 580,212" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="500" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="500" dy="0">XFF: 127.0.0.1</tspan><tspan x="500" dy="16.64">X-Request-Id: abc-123</tspan></text><rect x="580" y="170" width="130" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="645" y="215.92" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="645" dy="0">Origen</tspan></text><polyline points="710,212 740,212" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="740" y="170" width="210" height="84" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="845" y="192.32" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="845" dy="0">Ve 127.0.0.1 (IP real vista</tspan></text><text x="845" y="207.68" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="845" dy="0">por el proxy), X-Request-Id</tspan></text><text x="845" y="223.04" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="845" dy="0">abc-123 y Via 1.1</tspan></text><text x="845" y="238.4" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="845" dy="0">proxy-local</tspan></text><rect x="10" y="276" width="940" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="306.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Una cabecera reenviada solo es confiable si la fija un componente de confianza y el origen rechaza o sobrescribe lo que llega</tspan></text><text x="480" y="322.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">de fuera de esa frontera.</tspan></text><rect x="10" y="358" width="940" height="66" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="386.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">La política: el borde descarta las cabeceras entrantes de identidad, fija las suyas y el origen solo acepta conexiones del</tspan></text><text x="480" y="402.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">proxy.</tspan></text></svg>
