<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Contrapresión: cuánto acepta el sistema antes de bloquear al emisor</title><desc id="d">Barras con una medición real: un emisor que envía a un receptor que no lee pudo escribir 327 680 bytes en Windows y 2 621 440 bytes en Linux antes de que el envío se bloqueara.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="900" height="400" fill="#ffffff"/><text x="20" y="28" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">Bytes aceptados por los búferes antes de bloquear</tspan></text><text x="180" y="73" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="180" dy="0">Windows</tspan></text><rect x="190" y="52" width="62.2592" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="260.259" y="73" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="260.259" dy="0">327 680 B (320 KiB)</tspan></text><text x="180" y="129" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="180" dy="0">Linux (WSL2)</tspan></text><rect x="190" y="108" width="498.074" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="696.074" y="129" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="696.074" dy="0">2 621 440 B (2,5 MiB)</tspan></text><rect x="20" y="190" width="860" height="90" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="450" y="230.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="450" dy="0">Si el receptor no lee, los búferes se llenan y el emisor se bloquea (o recibe un error en modo no bloqueante): esa</tspan></text><text x="450" y="246.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="450" dy="0">es la señal de contrapresión. Un diseño sin límites acumula memoria o pierde datos.</tspan></text><rect x="20" y="292" width="860" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="450" y="317.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="450" dy="0">El tamaño de los búferes depende del sistema y de su ajuste: no es un contrato. La aplicación define su propio</tspan></text><text x="450" y="333.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="450" dy="0">límite y su política (descartar, esperar, rechazar).</tspan></text></svg>
