<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dónde se observa: cada punto de vista ve algo distinto</title><desc id="d">Tabla de cuatro puntos de observación: el cliente (curl -w), el servidor (registros), el sistema operativo (ss) y la red (captura de paquetes, no ejecutada aquí), con lo que cada uno ve y lo que no.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="450" fill="#ffffff"/><rect x="10" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="132" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="132" dy="0">Punto</tspan></text><rect x="260" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="392" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="392" dy="0">Qué ve</tspan></text><rect x="530" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="667" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="667" dy="0">Qué no ve</tspan></text><rect x="810" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="877" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="877" dy="0">Estado aquí</tspan></text><rect x="10" y="56" width="244" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="97.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Cliente (curl -w, temporizadores)</tspan></text><rect x="260" y="56" width="264" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="392" y="97.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="392" dy="0">Fases: DNS, TCP, TLS, espera</tspan></text><rect x="530" y="56" width="274" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="667" y="97.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667" dy="0">Qué ocurrió en el servidor</tspan></text><rect x="810" y="56" width="134" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="877" y="97.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="877" dy="0">Medido</tspan></text><rect x="10" y="138" width="244" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="171.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Servidor (registros con request</tspan></text><text x="132" y="187.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">ID)</tspan></text><rect x="260" y="138" width="264" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="392" y="171.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="392" dy="0">Cuándo llegó y cuánto tardó el</tspan></text><text x="392" y="187.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="392" dy="0">procesamiento</tspan></text><rect x="530" y="138" width="274" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="667" y="179.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667" dy="0">Lo que pasó antes de llegar</tspan></text><rect x="810" y="138" width="134" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="877" y="179.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="877" dy="0">Lab local</tspan></text><rect x="10" y="220" width="244" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="261.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Sistema operativo (ss -tan)</tspan></text><rect x="260" y="220" width="264" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="392" y="253.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="392" dy="0">Estados de conexión: ESTAB,</tspan></text><text x="392" y="269.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="392" dy="0">CLOSE-WAIT, TIME-WAIT</tspan></text><rect x="530" y="220" width="274" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="667" y="261.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667" dy="0">El contenido ni los tiempos de red</tspan></text><rect x="810" y="220" width="134" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="877" y="261.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="877" dy="0">Medido</tspan></text><rect x="10" y="302" width="244" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="343.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Red (captura de paquetes)</tspan></text><rect x="260" y="302" width="264" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="392" y="335.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="392" dy="0">Segmentos, retransmisiones y</tspan></text><text x="392" y="351.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="392" dy="0">ventanas</tspan></text><rect x="530" y="302" width="274" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="667" y="335.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667" dy="0">El resultado de negocio; exige</tspan></text><text x="667" y="351.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667" dy="0">permisos y cuida la privacidad</tspan></text><rect x="810" y="302" width="134" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="877" y="343.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="877" dy="0">No ejecutado</tspan></text><rect x="10" y="410" width="940" height="36" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="431.36" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Una captura no era necesaria para este diagnóstico; cuando lo es, se limita interfaz, destino, tiempo y campos.</tspan></text></svg>
