<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 407" width="940" height="407" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ida y vuelta y pérdida: ping y pruebas dirigidas</title><desc id="d">Barras horizontales con diez pings reales a example.com, sin pérdida, de RTT mínimo 129 ms, medio 146 ms y máximo 176 ms, y dos pings con la bandera DF cuyos paquetes de 1372 y 1472 bytes pasaron en 143 y 164 ms.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="407" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Ida y vuelta y pérdida: ping y pruebas dirigidas</tspan></text><line x1="175.26" y1="49" x2="175.26" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="175.26" y1="239" x2="175.26" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="175.26" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="175.26" dy="0">0</tspan></text><line x1="354.4" y1="49" x2="354.4" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="354.4" y1="239" x2="354.4" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="354.4" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354.4" dy="0">50</tspan></text><line x1="533.54" y1="49" x2="533.54" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="533.54" y1="239" x2="533.54" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="533.54" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="533.54" dy="0">100</tspan></text><line x1="712.68" y1="49" x2="712.68" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="712.68" y1="239" x2="712.68" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="712.68" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="712.68" dy="0">150</tspan></text><line x1="891.82" y1="49" x2="891.82" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="891.82" y1="239" x2="891.82" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="891.82" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="891.82" dy="0">200</tspan></text><line x1="175.26" y1="239" x2="891.82" y2="239" stroke="#5b7280" stroke-width="1.6"/><text x="165.26" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="165.26" dy="0">ping × 10: mínimo</tspan></text><text x="165.26" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="165.26" dy="0">ping × 10: medio</tspan></text><text x="165.26" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="165.26" dy="0">ping × 10: máximo</tspan></text><text x="165.26" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="165.26" dy="0">ping con DF, 1372 B</tspan></text><text x="165.26" y="224.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="165.26" dy="0">ping con DF, 1472 B</tspan></text><rect x="175.26" y="55" width="462.181" height="26" rx="3" fill="#087f8c"/><text x="644.441" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="644.441" dy="0">129</tspan></text><rect x="175.26" y="93" width="523.089" height="26" rx="3" fill="#087f8c"/><text x="705.349" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="705.349" dy="0">146</tspan></text><rect x="175.26" y="131" width="630.573" height="26" rx="3" fill="#087f8c"/><text x="812.833" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="812.833" dy="0">176</tspan></text><rect x="175.26" y="169" width="512.34" height="26" rx="3" fill="#087f8c"/><text x="694.6" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="694.6" dy="0">143</tspan></text><rect x="175.26" y="207" width="587.579" height="26" rx="3" fill="#087f8c"/><text x="769.839" y="224.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="769.839" dy="0">164</tspan></text><text x="533.54" y="283" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="533.54" dy="0">ms</tspan></text><rect x="10" y="297" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="321.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los diez pings no perdieron ningún paquete y el RTT varía unos 47 ms entre mínimo y máximo; el tamaño no cambia la latencia</tspan></text><text x="470" y="338.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de forma notable en este rango. Una ruta sin respuesta (modelo del laboratorio) termina en un timeout de conexión, que no</tspan></text><text x="470" y="355.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">distingue pérdida, filtrado o ruta rota. ICMP puede recibir un trato distinto del tráfico de aplicación: el RTT de ping</tspan></text><text x="470" y="371.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">orienta, pero la latencia de la aplicación se mide con la aplicación.</tspan></text></svg>
