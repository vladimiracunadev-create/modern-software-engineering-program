<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Línea temporal multicapa con un identificador de correlación</title><desc id="d">Cuatro fases del caso sano (dns, connect, http, correlation) y cómo un identificador único de petición une los eventos de cliente, intermediario y servidor.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="440" fill="#ffffff"/><rect x="14" y="20" width="222" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="125" y="45.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="125" dy="0">dns</tspan></text><rect x="14" y="72" width="222" height="100" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="125" y="117.68" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="125" dy="0">Resolución: desplazamiento ≈ 0</tspan></text><text x="125" y="133.04" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="125" dy="0">ms</tspan></text><polyline points="236,42 250,42" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="250" y="20" width="222" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="361" y="45.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="361" dy="0">connect</tspan></text><rect x="250" y="72" width="222" height="100" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="361" y="125.36" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="361" dy="0">Conexión TCP local establecida</tspan></text><polyline points="472,42 486,42" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="486" y="20" width="222" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="597" y="45.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="597" dy="0">http</tspan></text><rect x="486" y="72" width="222" height="100" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="597" y="117.68" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="597" dy="0">Solicitud y respuesta con el</tspan></text><text x="597" y="133.04" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="597" dy="0">mismo request ID</tspan></text><polyline points="708,42 722,42" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="722" y="20" width="222" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="833" y="45.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="833" dy="0">correlation</tspan></text><rect x="722" y="72" width="222" height="100" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="833" y="117.68" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="833" dy="0">El ID aparece en cliente y</tspan></text><text x="833" y="133.04" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="833" dy="0">servidor</tspan></text><rect x="14" y="196" width="930" height="70" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="479" y="226.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="479" dy="0">El identificador se genera en el borde, se propaga por cada salto y se registra en cada capa. Sin él, unir eventos depende</tspan></text><text x="479" y="242.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="479" dy="0">de la hora, que no basta (SE-033).</tspan></text><rect x="14" y="280" width="930" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="479" y="310.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="479" dy="0">Cada evento declara fase, resultado, desplazamiento y evidencia; la «primera divergencia» respecto del caso sano delimita la</tspan></text><text x="479" y="326.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="479" dy="0">hipótesis.</tspan></text><rect x="14" y="362" width="930" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="479" y="393.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="479" dy="0">El laboratorio redacta cabeceras sensibles y no guarda cuerpos: la correlación no exige datos personales.</tspan></text></svg>
