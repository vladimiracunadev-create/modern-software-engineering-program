<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Las once pruebas del laboratorio en dos plataformas</title><desc id="d">Tabla: las once pruebas del laboratorio de la Parte 03 pasaron en Windows 11 con Python 3.12.9 en 7,56 segundos y en Ubuntu 24.04 bajo WSL2 con Python 3.12.3 en 6,38 segundos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="400" fill="#ffffff"/><rect x="10" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="107" y="35.2" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="107" dy="0">Plataforma</tspan></text><rect x="210" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="277" y="35.2" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="277" dy="0">Python</tspan></text><rect x="350" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="417" y="35.2" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="417" dy="0">Pruebas</tspan></text><rect x="490" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="597" y="35.2" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="597" dy="0">Resultado</tspan></text><rect x="710" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="817" y="35.2" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="817" dy="0">Duración</tspan></text><rect x="10" y="56" width="194" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="91.92" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">Windows 11</tspan></text><rect x="210" y="56" width="134" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="277" y="91.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="277" dy="0">3.12.9</tspan></text><rect x="350" y="56" width="134" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="417" y="91.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="417" dy="0">11</tspan></text><rect x="490" y="56" width="214" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="91.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">todas pasan</tspan></text><rect x="710" y="56" width="214" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="91.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">7,56 s</tspan></text><rect x="10" y="126" width="194" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="161.92" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">Linux (WSL2)</tspan></text><rect x="210" y="126" width="134" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="277" y="161.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="277" dy="0">3.12.3</tspan></text><rect x="350" y="126" width="134" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="417" y="161.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="417" dy="0">11</tspan></text><rect x="490" y="126" width="214" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="161.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">todas pasan</tspan></text><rect x="710" y="126" width="214" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="161.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">6,38 s</tspan></text><rect x="10" y="220" width="920" height="90" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="260.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las pruebas ejercitan los siete escenarios con un servidor HTTP efímero en 127.0.0.1; DNS, validación TLS y pérdida son</tspan></text><text x="470" y="276.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">modelos deterministas, y el tráfico HTTP es real y local.</tspan></text><rect x="10" y="322" width="920" height="56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="353.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Pasar en dos plataformas no prueba el comportamiento en una red real: el laboratorio lo declara como límite.</tspan></text></svg>
