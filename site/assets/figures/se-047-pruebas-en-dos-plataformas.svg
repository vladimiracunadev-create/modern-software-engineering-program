<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 276" width="940" height="276" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Las once pruebas del laboratorio en dos plataformas</title><desc id="d">Barras horizontales con la duración de las once pruebas del laboratorio de la Parte 03, todas aprobadas: 7,56 segundos en Windows 11 con Python 3.12.9 y 6,38 segundos en Ubuntu 24.04 bajo WSL2 con Python 3.12.3.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="276" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Las once pruebas del laboratorio en dos plataformas</tspan></text><line x1="243.12" y1="49" x2="243.12" y2="125" stroke="#d5dde1" stroke-width="1"/><line x1="243.12" y1="125" x2="243.12" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="243.12" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="243.12" dy="0">0</tspan></text><line x1="403.28" y1="49" x2="403.28" y2="125" stroke="#d5dde1" stroke-width="1"/><line x1="403.28" y1="125" x2="403.28" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="403.28" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="403.28" dy="0">2</tspan></text><line x1="563.44" y1="49" x2="563.44" y2="125" stroke="#d5dde1" stroke-width="1"/><line x1="563.44" y1="125" x2="563.44" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="563.44" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="563.44" dy="0">4</tspan></text><line x1="723.6" y1="49" x2="723.6" y2="125" stroke="#d5dde1" stroke-width="1"/><line x1="723.6" y1="125" x2="723.6" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="723.6" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="723.6" dy="0">6</tspan></text><line x1="883.76" y1="49" x2="883.76" y2="125" stroke="#d5dde1" stroke-width="1"/><line x1="883.76" y1="125" x2="883.76" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="883.76" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="883.76" dy="0">8</tspan></text><line x1="243.12" y1="125" x2="883.76" y2="125" stroke="#5b7280" stroke-width="1.6"/><text x="233.12" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="233.12" dy="0">Windows 11 · Python 3.12.9</tspan></text><text x="233.12" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="233.12" dy="0">Linux (WSL2) · Python 3.12.3</tspan></text><rect x="243.12" y="55" width="605.405" height="26" rx="3" fill="#087f8c"/><text x="855.525" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="855.525" dy="0">7,56</tspan></text><rect x="243.12" y="93" width="510.91" height="26" rx="3" fill="#087f8c"/><text x="761.03" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="761.03" dy="0">6,38</tspan></text><text x="563.44" y="169" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="563.44" dy="0">segundos</tspan></text><rect x="10" y="183" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="207.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las pruebas ejercitan los siete escenarios con un servidor HTTP efímero en 127.0.0.1; DNS, validación TLS y pérdida son</tspan></text><text x="470" y="224.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">modelos deterministas, y el tráfico HTTP es real y local. Pasar en dos plataformas no prueba el comportamiento en una red</tspan></text><text x="470" y="241.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">real: el laboratorio lo declara como límite.</tspan></text></svg>
