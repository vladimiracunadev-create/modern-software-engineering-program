<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Los siete escenarios del laboratorio y su primera divergencia</title><desc id="d">Tabla con la suite real: healthy es ok; dns_failure falla en dns (name_not_found); connection_refused en connect (refused); tls_name_mismatch en tls (name_mismatch); latency_timeout en http_wait (deadline_exceeded); transient_loss y http_503 se recuperan en el segundo intento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="480" fill="#ffffff"/><rect x="10" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="127" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="127" dy="0">Escenario</tspan></text><rect x="250" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="327" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="327" dy="0">Resultado</tspan></text><rect x="410" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="467" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="467" dy="0">Intentos</tspan></text><rect x="530" y="12" width="394" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="727" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="727" dy="0">Primera divergencia</tspan></text><rect x="10" y="56" width="234" heig