<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 578" width="960" height="578" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Los siete escenarios del laboratorio y su primera divergencia</title><desc id="d">Siete escenarios de la suite real, cada uno con la primera fase en que se aparta del caso sano y su resultado: healthy es ok; dns_failure falla en dns (name_not_found); connection_refused en connect (refused); tls_name_mismatch en tls (name_mismatch); latency_timeout en http_wait (deadline_exceeded); transient_loss y http_503 se recuperan en el segundo intento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="578" fill="#ffffff"/><text x="125" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="125" dy="0">Escenario</tspan></text><text x="456" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="456" dy="0">Primera divergencia</tspan></text><text x="811" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="811" dy="0">Resultado</tspan></text><rect x="10" y="38" width="230" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="125" y="66.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="125" dy="0">healthy</tspan></text><rect x="276" y="38" width="360" height="50" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="456" y="58.68" font-size="12" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="456" dy="0">Sin divergencia (dns → connect → http →</tspan></text><text x="456" y="74.04" font-size="12" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="456" dy="0">correlation)</tspan></text><rect x="672" y="38" width="278" height="50" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="811" y="66.36" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="811" dy="0">ok · 1 intento</tspan></text><polyline points="240,63 276,63" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="636,63 672,63" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="106" width="230" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="125" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="125" dy="0">dns_failure</tspan></text><rect x="276" y="106" width="360" height="50" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="456" y="134.36" font-size="12" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="456" dy="0">dns · name_not_found</tspan></text><rect x="672" y="106" width="278" height="50" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="811" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="811" dy="0">failed · 0 intentos</tspan></text><polyline points="240,131 276,131" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="636,131 672,131" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="174" width="230" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="125" y="202.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="125" dy="0">connection_refused</tspan></text><rect x="276" y="174" width="360" height="50" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="456" y="202.36" font-size="12" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="456" dy="0">connect · refused</tspan></text><rect x="672" y="174" width="278" height="50" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="811" y="202.36" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="811" dy="0">failed · 1 intento</tspan></text><polyline points="240,199 276,199" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="636,199 672,199" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="242" width="230" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="125" y="270.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="125" dy="0">tls_name_mismatch</tspan></text><rect x="276" y="242" width="360" height="50" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="456" y="270.36" font-size="12" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="456" dy="0">tls · name_mismatch</tspan></text><rect x="672" y="242" width="278" height="50" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="811" y="270.36" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="811" dy="0">failed · 0 intentos</tspan></text><polyline points="240,267 276,267" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="636,267 672,267" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="310" width="230" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="125" y="338.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="125" dy="0">latency_timeout</tspan></text><rect x="276" y="310" width="360" height="50" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="456" y="338.36" font-size="12" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="456" dy="0">http_wait · deadline_exceeded</tspan></text><rect x="672" y="310" width="278" height="50" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="811" y="338.36" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="811" dy="0">failed · 1 intento</tspan></text><polyline points="240,335 276,335" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="636,335 672,335" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="378" width="230" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="125" y="406.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="125" dy="0">transient_loss</tspan></text><rect x="276" y="378" width="360" height="50" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="456" y="406.36" font-size="12" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="456" dy="0">transport (pérdida) → reintento → http</tspan></text><rect x="672" y="378" width="278" height="50" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="811" y="406.36" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="811" dy="0">recovered · 2 intentos</tspan></text><polyline points="240,403 276,403" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="636,403 672,403" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="446" width="230" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="125" y="474.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="125" dy="0">http_503</tspan></text><rect x="276" y="446" width="360" height="50" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="456" y="474.36" font-size="12" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="456" dy="0">http 503 → reintento → http 200</tspan></text><rect x="672" y="446" width="278" height="50" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="811" y="474.36" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="811" dy="0">recovered · 2 intentos</tspan></text><polyline points="240,471 276,471" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="636,471 672,471" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="510" width="940" height="54" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="540.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Se compara por la primera fase que difiere del caso sano, no por el número de errores posteriores.</tspan></text></svg>
