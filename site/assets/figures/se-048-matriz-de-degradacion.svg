<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Matriz sana, degradada y recuperada</title><desc id="d">Tabla de tres estados del servicio con su señal, su respuesta del cliente y la evidencia: sano, degradado con reintento que se recupera y fallido con mensaje por fase.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="440" fill="#ffffff"/><rect x="10" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="102" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="102" dy="0">Estado</tspan></text><rect x="200" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="312" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="312" dy="0">Señal</tspan></text><rect x="430" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="547" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="547" dy="0">Respuesta del cliente</tspan></text><rect x="670" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="807" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="807" dy="0">Evidencia</tspan></text><rect x="10" y="56" width="184" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="101.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">Sano</tspan></text><rect x="200" y="56" width="224" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="312" y="101.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="312" dy="0">200 en el primer intento</tspan></text><rect x="430" y="56" width="234" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="547" y="101.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547" dy="0">Sin reintento</tspan></text><rect x="670" y="56" width="274" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="101.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">healthy: dns → connect → http</tspan></text><rect x="10" y="146" width="184" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="191.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">Degradado y recuperado</tspan></text><rect x="200" y="146" width="224" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="312" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="312" dy="0">503 o pérdida transitoria</tspan></text><rect x="430" y="146" width="234" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="547" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547" dy="0">Reintento acotado con retroceso</tspan></text><rect x="670" y="146" width="274" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="183.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">http_503 y transient_loss: 2</tspan></text><text x="807" y="199.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">intentos, recovered</tspan></text><rect x="10" y="236" width="184" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="281.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">Fallido por fase</tspan></text><rect x="200" y="236" width="224" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="312" y="273.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="312" dy="0">DNS, rechazo, nombre TLS o</tspan></text><text x="312" y="289.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="312" dy="0">plazo</tspan></text><rect x="430" y="236" width="234" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="547" y="273.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547" dy="0">Sin reintento ciego; mensaje</tspan></text><text x="547" y="289.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547" dy="0">con fase y código</tspan></text><rect x="670" y="236" width="274" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="273.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">dns_failure, connection_refused,</tspan></text><text x="807" y="289.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">tls_name_mismatch, latency_timeout</tspan></text><rect x="10" y="336" width="940" height="76" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="369.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Cada estado tiene una señal medible y una respuesta definida: sin esa matriz, el comportamiento ante fallos se decide en</tspan></text><text x="480" y="385.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">producción y a las 3 de la madrugada.</tspan></text></svg>
