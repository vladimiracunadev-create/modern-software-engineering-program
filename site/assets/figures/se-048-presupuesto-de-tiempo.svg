<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" width="940" height="430" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Presupuesto de tiempo: del plazo total a los límites por fase</title><desc id="d">Barras con las fases medidas de una petición HTTPS (DNS 9, TCP 131, TLS 146 y espera 144 ms, total 430 ms) frente a un plazo total de 2000 ms: sobran unos 1570 ms para reintentos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="430" fill="#ffffff"/><text x="20" y="28" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">Fases medidas frente al plazo total de 2000 ms</tspan></text><text x="260" y="65" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="260" dy="0">DNS</tspan></text><rect x="270" y="44" width="4" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="282" y="65" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="282" dy="0">9 ms</tspan></text><text x="260" y="111" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="260" dy="0">TCP</tspan></text><rect x="270" y="90" width="39.3" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="317.3" y="111" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="317.3" dy="0">131 ms</tspan></text><text x="260" y="157" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="260" dy="0">TLS</tspan></text><rect x="270" y="136" width="43.8" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="321.8" y="157" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="321.8" dy="0">146 ms</tspan></text><text x="260" y="203" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="260" dy="0">Espera de la respuesta</tspan></text><rect x="270" y="182" width="43.2" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="321.2" y="203" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="321.2" dy="0">144 ms</tspan></text><text x="260" y="249" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="260" dy="0">Plazo total</tspan></text><rect x="270" y="228" width="600" height="30" rx="3" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="878" y="249" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="878" dy="0">2000 ms</tspan></text><rect x="20" y="290" width="900" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="315.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Un plazo total acota la experiencia; los límites por fase (conexión, lectura) evitan que una fase consuma todo el</tspan></text><text x="470" y="331.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">presupuesto y permiten diagnosticar cuál se agotó.</tspan></text><rect x="20" y="360" width="900" height="50" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="470" y="380.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="470" dy="0">Con una petición de ≈430 ms, un plazo de 2 s permite como máximo unos 4 intentos sin espera, y mucho menos con</tspan></text><text x="470" y="396.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="470" dy="0">retroceso.</tspan></text></svg>
