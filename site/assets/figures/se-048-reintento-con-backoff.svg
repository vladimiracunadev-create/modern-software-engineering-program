<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" width="940" height="430" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reintento con retroceso exponencial y jitter contra un servicio que falla dos veces</title><desc id="d">Tabla con una prueba local: el servidor responde 503 dos veces y luego 200; el cliente reintentó con espera aleatoria creciente y terminó en 99,7 ms en Windows y 70,7 ms en Linux.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="430" fill="#ffffff"/><rect x="10" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="82" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="82" dy="0">Intento</tspan></text><rect x="160" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="322" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="322" dy="0">Respuesta</tspan></text><rect x="490" y="12" width="454" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="717" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="717" dy="0">Espera antes del siguiente (jitter completo)</tspan></text><rect x="10" y="56" width="144" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="87.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">1</tspan></text><rect x="160" y="56" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="322" y="87.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="322" dy="0">503 Service Unavailable</tspan></text><rect x="490" y="56" width="454" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="87.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">aleatoria entre 0 y 0,05 s</tspan></text><rect x="10" y="118" width="144" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="149.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">2</tspan></text><rect x="160" y="118" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="322" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="322" dy="0">503 Service Unavailable</tspan></text><rect x="490" y="118" width="454" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">aleatoria entre 0 y 0,10 s</tspan></text><rect x="10" y="180" width="144" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="211.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">3</tspan></text><rect x="160" y="180" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="322" y="211.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="322" dy="0">200 OK</tspan></text><rect x="490" y="180" width="454" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="211.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">—</tspan></text><rect x="10" y="244" width="920" height="56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="267.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Tiempo total: 99,7 ms (Windows) y 70,7 ms (Linux). La espera máxima crece como 0,05 · 2^k y el azar evita que muchos</tspan></text><text x="470" y="283.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">clientes reintenten a la vez.</tspan></text><rect x="10" y="312" width="920" height="66" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="340.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Reintentar es seguro solo para operaciones idempotentes y con un tope de intentos y un plazo total; de lo contrario,</tspan></text><text x="470" y="356.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">multiplica la carga que causó el fallo.</tspan></text></svg>
