<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 376" width="940" height="376" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reintento con retroceso exponencial y jitter contra un servicio que falla dos veces</title><desc id="d">Dos rangos de espera aleatoria con jitter completo en una prueba local: el servidor responde 503 dos veces y luego 200; tras el primer intento la espera es aleatoria entre 0 y 0,05 s y tras el segundo entre 0 y 0,10 s; el cliente terminó en 99,7 ms en Windows y 70,7 ms en Linux.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="376" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Reintento con retroceso exponencial y jitter contra un servicio que falla dos veces</tspan></text><rect x="16" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">mínimo</tspan></text><polygon points="115.24,44.1 121.84,56.4 108.64,56.4" fill="#946512" stroke="#946512" stroke-width="2"/><text x="129.24" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="129.24" dy="0">máximo</tspan></text><line x1="293.8" y1="77" x2="293.8" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="293.8" y1="225" x2="293.8" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="293.8" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="293.8" dy="0">0</tspan></text><line x1="413.04" y1="77" x2="413.04" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="413.04" y1="225" x2="413.04" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="413.04" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="413.04" dy="0">0,02</tspan></text><line x1="532.28" y1="77" x2="532.28" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="532.28" y1="225" x2="532.28" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="532.28" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532.28" dy="0">0,04</tspan></text><line x1="651.52" y1="77" x2="651.52" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="651.52" y1="225" x2="651.52" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="651.52" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="651.52" dy="0">0,06</tspan></text><line x1="770.76" y1="77" x2="770.76" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="770.76" y1="225" x2="770.76" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="770.76" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="770.76" dy="0">0,08</tspan></text><line x1="890" y1="77" x2="890" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="890" y1="225" x2="890" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="890" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="890" dy="0">0,1</tspan></text><line x1="293.8" y1="225" x2="890" y2="225" stroke="#5b7280" stroke-width="1.6"/><text x="263.8" y="118.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="263.8" dy="0">Espera tras el intento 1 (503)</tspan></text><text x="263.8" y="192.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="263.8" dy="0">Espera tras el intento 2 (503)</tspan></text><line x1="293.8" y1="114" x2="591.9" y2="114" stroke="#8a9aa3" stroke-width="5"/><rect x="286.8" y="107" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="293.8" y="98" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="293.8" dy="0">0,00</tspan></text><polygon points="591.9,105.95 599.6,120.3 584.2,120.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="591.9" y="143" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="591.9" dy="0">0,05</tspan></text><line x1="293.8" y1="188" x2="890" y2="188" stroke="#8a9aa3" stroke-width="5"/><rect x="286.8" y="181" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="293.8" y="172" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="293.8" dy="0">0,00</tspan></text><polygon points="890,179.95 897.7,194.3 882.3,194.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="890" y="217" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="890" dy="0">0,10</tspan></text><text x="591.9" y="269" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="591.9" dy="0">segundos</tspan></text><rect x="10" y="283" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="307.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El tercer intento recibe 200 OK y no espera. Tiempo total: 99,7 ms (Windows) y 70,7 ms (Linux). La espera máxima crece como</tspan></text><text x="470" y="324.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">0,05 · 2^k y el azar evita que muchos clientes reintenten a la vez. Reintentar es seguro solo para operaciones idempotentes</tspan></text><text x="470" y="341.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">y con un tope de intentos y un plazo total; de lo contrario, multiplica la carga que causó el fallo.</tspan></text></svg>
