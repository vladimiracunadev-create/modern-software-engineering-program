<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" width="940" height="430" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué conserva y qué descarta el modelo</title><desc id="d">Tabla de lo que el modelo conserva (hipótesis, pruebas, costos, autorización, presupuesto) y lo que descarta (distribución de latencias, fallos parciales, causas simultáneas), con los límites declarados por el laboratorio.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="430" fill="#ffffff"/><rect x="10" y="12" width="314" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="167" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="167" dy="0">Conserva</tspan></text><rect x="330" y="12" width="284" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="472" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="472" dy="0">Descarta</tspan></text><rect x="620" y="12" width="304" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="772" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="772" dy="0">Límite declarado</tspan></text><rect x="10" y="56" width="314" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="93.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">Un conjunto cerrado de hipótesis (dns, tls,</tspan></text><text x="167" y="109.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">http)</tspan></text><rect x="330" y="56" width="284" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="93.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">Causas simultáneas o que no están en la</tspan></text><text x="472" y="109.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">lista</tspan></text><rect x="620" y="56" width="304" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="93.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">El resultado solo es correcto respecto de</tspan></text><text x="772" y="109.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">las hipótesis declaradas</tspan></text><rect x="10" y="146" width="314" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="191.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">Costos y presupuesto de cada prueba</tspan></text><rect x="330" y="146" width="284" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="183.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">Costo variable según el momento o la</tspan></text><text x="472" y="199.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">carga</tspan></text><rect x="620" y="146" width="304" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="183.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">La puntuación codiciosa no garantiza una</tspan></text><text x="772" y="199.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">secuencia global óptima</tspan></text><rect x="10" y="236" width="314" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="281.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">Resultados deterministas por prueba</tspan></text><rect x="330" y="236" width="284" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="281.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">Ruido, variación y fallos intermitentes</tspan></text><rect x="620" y="236" width="304" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="273.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">Una medición de tiempo no sustituye el</tspan></text><text x="772" y="289.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">análisis de crecimiento</tspan></text><rect x="10" y="330" width="920" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="360.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Toda abstracción es una decisión de qué ignorar. La pregunta útil es qué descarte puede invalidar la conclusión y cómo se</tspan></text><text x="470" y="376.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">detectaría.</tspan></text></svg>
