<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 402" width="940" height="402" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué conserva y qué descarta el modelo, y qué límite declara cada descarte</title><desc id="d">Diagrama de tres filas del laboratorio: el modelo conserva un conjunto cerrado de hipótesis, los costos y los resultados deterministas; descarta las causas simultáneas, el costo variable y el ruido; y de cada descarte nace un límite declarado, por ejemplo que la selección codiciosa no garantiza una secuencia global óptima.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="402" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué conserva y qué descarta el modelo, y qué límite declara cada descarte</tspan></text><text x="154" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="154" dy="0">Lo que conserva</tspan></text><text x="460" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="460" dy="0">Lo que descarta</tspan></text><text x="766" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="766" dy="0">Límite declarado</tspan></text><rect x="14" y="71" width="280" height="55.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="154" y="93.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="154" dy="0">Un conjunto cerrado de hipótesis</tspan></text><text x="154" y="110.6" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="154" dy="0">(dns, tls, http)</tspan></text><polyline points="298,98.64 316,98.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="320" y="71" width="280" height="55.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="460" y="93.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">Causas simultáneas o fuera de la</tspan></text><text x="460" y="110.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">lista</tspan></text><polyline points="604,98.64 622,98.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="626" y="71" width="280" height="55.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="766" y="93.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="766" dy="0">Solo es correcto respecto de las</tspan></text><text x="766" y="110.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="766" dy="0">hipótesis declaradas</tspan></text><rect x="14" y="138.28" width="280" height="71.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="154" y="177.88" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="154" dy="0">Costos y presupuesto de cada prueba</tspan></text><polyline points="298,174.24 316,174.24" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="320" y="138.28" width="280" height="71.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="460" y="169.56" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">Costo variable según el momento o</tspan></text><text x="460" y="186.2" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">la carga</tspan></text><polyline points="604,174.24 622,174.24" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="626" y="138.28" width="280" height="71.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="766" y="161.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="766" dy="0">La puntuación codiciosa no</tspan></text><text x="766" y="177.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="766" dy="0">garantiza una secuencia global</tspan></text><text x="766" y="194.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="766" dy="0">óptima</tspan></text><rect x="14" y="222.2" width="280" height="55.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="154" y="253.48" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="154" dy="0">Resultados deterministas por prueba</tspan></text><polyline points="298,249.84 316,249.84" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="320" y="222.2" width="280" height="55.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="460" y="245.16" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">Ruido, variación y fallos</tspan></text><text x="460" y="261.8" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">intermitentes</tspan></text><polyline points="604,249.84 622,249.84" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="626" y="222.2" width="280" height="55.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="766" y="245.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="766" dy="0">Una medición de tiempo no sustituye</tspan></text><text x="766" y="261.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="766" dy="0">el análisis de crecimiento</tspan></text><rect x="10" y="295.48" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="320.44" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Toda abstracción es una decisión de qué ignorar. La pregunta útil es qué descarte puede invalidar la conclusión y cómo se</tspan></text><text x="470" y="337.08" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">detectaría.</tspan></text><text x="470" y="384.76" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Resultados calculados con Python 3.12.9; las mediciones de tiempo dependen del equipo.</tspan></text></svg>
