<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Descomposición del incidente en decisión, hipótesis, pruebas y restricciones</title><desc id="d">Árbol del modelo del laboratorio: la decisión es elegir la próxima prueba segura; las hipótesis son dns, tls y http; las pruebas son resolve, handshake, request y production-capture (esta última no autorizada); las restricciones son solo pruebas autorizadas y un presupuesto de cinco unidades.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="450" fill="#ffffff"/><rect x="300" y="14" width="360" height="56" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="480" y="37.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="480" dy="0">Decisión: elegir la próxima prueba segura para</tspan></text><text x="480" y="53.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="480" dy="0">explicar una petición fallida</tspan></text><polyline points="480,70 160,110" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="30" y="110" width="260" height="40" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="160" y="133.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="160" dy="0">Hipótesis</tspan></text><rect x="30" y="158" width="260" height="48" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="160" y="185.36" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="160" dy="0">dns</tspan></text><rect x="30" y="212" width="260" height="48" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="160" y="239.36" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="160" dy="0">tls</tspan></text><rect x="30" y="266" width="260" height="48" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="160" y="293.36" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="160" dy="0">http</tspan></text><polyline points="480,70 480,110" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="350" y="110" width="260" height="40" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="480" y="133.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="480" dy="0">Pruebas (costo)</tspan></text><rect x="350" y="158" width="260" height="48" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="185.36" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">resolve (1)</tspan></text><rect x="350" y="212" width="260" height="48" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="239.36" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">handshake (2)</tspan></text><rect x="350" y="266" width="260" height="48" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="293.36" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">request (3)</tspan></text><rect x="350" y="320" width="260" height="48" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="339.68" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">production-capture (1): NO</tspan></text><text x="480" y="355.04" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">autorizada</tspan></text><polyline points="480,70 800,110" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="670" y="110" width="260" height="40" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="800" y="133.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="800" dy="0">Restricciones</tspan></text><rect x="670" y="158" width="260" height="48" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="800" y="177.68" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="800" dy="0">authorized_only: solo pruebas</tspan></text><text x="800" y="193.04" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="800" dy="0">autorizadas</tspan></text><rect x="670" y="212" width="260" height="48" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="800" y="231.68" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="800" dy="0">bounded_cost: presupuesto de 5</tspan></text><text x="800" y="247.04" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="800" dy="0">unidades</tspan></text><rect x="30" y="380" width="900" height="56" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="480" y="403.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="480" dy="0">Descomponer es separar lo que se decide de lo que se supone y de lo que se limita; cada nodo puede revisarse por</tspan></text><text x="480" y="419.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="480" dy="0">separado.</tspan></text></svg>
