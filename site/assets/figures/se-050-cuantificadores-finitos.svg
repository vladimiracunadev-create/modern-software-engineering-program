<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuantificadores sobre dominios finitos y la verdad vacía</title><desc id="d">En un dominio finito, todos se comprueba con all y existe con any: all sobre una lista vacía es verdadero y any sobre una lista vacía es falso; las leyes de De Morgan se verificaron en las cuatro filas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="400" fill="#ffffff"/><rect x="10" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="107" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="107" dy="0">Expresión</tspan></text><rect x="210" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="302" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="302" dy="0">Resultado</tspan></text><rect x="400" y="12" width="524" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="662" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="662" dy="0">Lectura</tspan></text><rect x="10" y="56" width="194" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="91.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">all([])</tspan></text><rect x="210" y="56" width="184" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="302" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="302" dy="0">True</tspan></text><rect x="400" y="56" width="524" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">Verdad vacía: «todo elemento cumple» es verdadero si no hay elementos</tspan></text><rect x="10" y="126" width="194" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="161.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">any([])</tspan></text><rect x="210" y="126" width="184" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="302" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="302" dy="0">False</tspan></text><rect x="400" y="126" width="524" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">No existe ningún elemento que cumpla</tspan></text><rect x="10" y="196" width="194" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">¬(a ∧ b) ≡ ¬a ∨ ¬b</tspan></text><rect x="210" y="196" width="184" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="302" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="302" dy="0">True en las 4 filas</tspan></text><rect x="400" y="196" width="524" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">Ley de De Morgan verificada</tspan></text><rect x="10" y="296" width="920" height="80" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="331.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Una regla «todas las pruebas autorizadas pasan» se cumple si no hay ninguna prueba: la verdad vacía puede ocultar un</tspan></text><text x="470" y="347.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">conjunto vacío. Se comprueba además que el conjunto no sea vacío.</tspan></text></svg>
