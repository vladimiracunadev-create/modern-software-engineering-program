<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 526" width="940" height="526" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Filas de una tabla de verdad según el número de variables</title><desc id="d">Línea con las filas de una tabla de verdad, 2 elevado a n, en escala logarítmica: 1 024 con 10 variables, 1 048 576 con 20 y unos 1 073 millones con 30; enumerar las 1 048 576 filas tomó 0,102 segundos en Python.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="526" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Filas de una tabla de verdad según el número de variables</tspan></text><line x1="161.56" y1="359" x2="910" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="156.56" y1="359" x2="161.56" y2="359" stroke="#5b7280" stroke-width="1.4"/><text x="152.56" y="363.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="152.56" dy="0">1 000</tspan></text><line x1="161.56" y1="316.143" x2="910" y2="316.143" stroke="#d5dde1" stroke-width="1"/><line x1="156.56" y1="316.143" x2="161.56" y2="316.143" stroke="#5b7280" stroke-width="1.4"/><text x="152.56" y="320.643" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="152.56" dy="0">10 000</tspan></text><line x1="161.56" y1="273.286" x2="910" y2="273.286" stroke="#d5dde1" stroke-width="1"/><line x1="156.56" y1="273.286" x2="161.56" y2="273.286" stroke="#5b7280" stroke-width="1.4"/><text x="152.56" y="277.786" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="152.56" dy="0">100 000</tspan></text><line x1="161.56" y1="230.429" x2="910" y2="230.429" stroke="#d5dde1" stroke-width="1"/><line x1="156.56" y1="230.429" x2="161.56" y2="230.429" stroke="#5b7280" stroke-width="1.4"/><text x="152.56" y="234.929" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="152.56" dy="0">1 000 000</tspan></text><line x1="161.56" y1="187.571" x2="910" y2="187.571" stroke="#d5dde1" stroke-width="1"/><line x1="156.56" y1="187.571" x2="161.56" y2="187.571" stroke="#5b7280" stroke-width="1.4"/><text x="152.56" y="192.071" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="152.56" dy="0">10 000 000</tspan></text><line x1="161.56" y1="144.714" x2="910" y2="144.714" stroke="#d5dde1" stroke-width="1"/><line x1="156.56" y1="144.714" x2="161.56" y2="144.714" stroke="#5b7280" stroke-width="1.4"/><text x="152.56" y="149.214" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="152.56" dy="0">100 000 000</tspan></text><line x1="161.56" y1="101.857" x2="910" y2="101.857" stroke="#d5dde1" stroke-width="1"/><line x1="156.56" y1="101.857" x2="161.56" y2="101.857" stroke="#5b7280" stroke-width="1.4"/><text x="152.56" y="106.357" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="152.56" dy="0">1 000 000 000</tspan></text><line x1="161.56" y1="59" x2="910" y2="59" stroke="#d5dde1" stroke-width="1"/><line x1="156.56" y1="59" x2="161.56" y2="59" stroke="#5b7280" stroke-width="1.4"/><text x="152.56" y="63.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="152.56" dy="0">10 000 000 000</tspan></text><line x1="161.56" y1="59" x2="161.56" y2="359" stroke="#5b7280" stroke-width="1.6"/><line x1="179.56" y1="59" x2="179.56" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="179.56" y1="359" x2="179.56" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="179.56" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="179.56" dy="0">10</tspan></text><line x1="535.78" y1="59" x2="535.78" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="535.78" y1="359" x2="535.78" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="535.78" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="535.78" dy="0">20</tspan></text><line x1="892" y1="59" x2="892" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="359" x2="892" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">30</tspan></text><line x1="161.56" y1="359" x2="910" y2="359" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="209" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 209)">Filas de la tabla (escala logarítmica)</text><text x="535.78" y="405" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="535.78" dy="0">Variables n</tspan></text><polyline points="179.56,358.559 535.78,229.546 892,100.533" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="179.56" cy="358.559" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="179.56" y="347.559" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="179.56" dy="0">1 024</tspan></text><circle cx="535.78" cy="229.546" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="535.78" y="218.546" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="535.78" dy="0">1 048 576</tspan></text><circle cx="892" cy="100.533" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="89.5329" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">1 073 741 824</tspan></text><rect x="10" y="419" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="443.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Con 20 variables la enumeración tomó 0,102 s; con 30 sería inviable. Un ciclo de implicaciones entre n variables tiene solo</tspan></text><text x="470" y="460.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">2 modelos para n = 3, 5 y 10. Para muchas variables se usan solucionadores SAT.</tspan></text><text x="470" y="508.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Resultados calculados con Python 3.12.9; las mediciones de tiempo dependen del equipo.</tspan></text></svg>
