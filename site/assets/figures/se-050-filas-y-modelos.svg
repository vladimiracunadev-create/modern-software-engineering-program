<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" width="940" height="430" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuántas filas tiene una tabla de verdad y cuántos modelos tiene una fórmula</title><desc id="d">Una fórmula con n variables tiene 2 elevado a n filas; enumerar 1 048 576 filas con 20 variables tomó 0,102 segundos en Python. Un ciclo de implicaciones entre n variables tiene solo 2 modelos para n igual a 3, 5 y 10.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="430" fill="#ffffff"/><rect x="10" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="102" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="102" dy="0">Variables n</tspan></text><rect x="200" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="327" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="327" dy="0">Filas (2^n)</tspan></text><rect x="460" y="12" width="464" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="692" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="692" dy="0">Observación</tspan></text><rect x="10" y="56" width="184" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="86.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">10</tspan></text><rect x="200" y="56" width="254" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="86.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="327" dy="0">1 024</tspan></text><rect x="460" y="56" width="464" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="86.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">Se enumera al instante</tspan></text><rect x="10" y="116" width="184" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="146.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">20</tspan></text><rect x="200" y="116" width="254" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="146.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="327" dy="0">1 048 576</tspan></text><rect x="460" y="116" width="464" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="146.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">0,102 s enumerando en Python</tspan></text><rect x="10" y="176" width="184" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="206.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">30</tspan></text><rect x="200" y="176" width="254" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="206.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="327" dy="0">≈ 1 073 millones</tspan></text><rect x="460" y="176" width="464" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="206.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">Inviable por enumeración simple</tspan></text><rect x="10" y="250" width="920" height="76" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="283.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">(p1 → p2) ∧ (p2 → p3) ∧ … ∧ (pn → p1) tiene exactamente 2 modelos para n = 3, 5 y 10: todas verdaderas o todas falsas. Las</tspan></text><text x="470" y="299.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">variables de un ciclo de implicaciones son equivalentes.</tspan></text><rect x="10" y="338" width="920" height="60" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="470" y="363.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="470" dy="0">La enumeración sirve para comprobar fórmulas pequeñas; para muchas variables se usan solucionadores SAT y razonamiento</tspan></text><text x="470" y="379.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="470" dy="0">simbólico.</tspan></text></svg>
