<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" width="940" height="430" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tabla de la implicación y dos razonamientos comparados</title><desc id="d">La implicación p entonces q es falsa solo cuando p es verdadera y q falsa; su contrapositiva es equivalente y su recíproca no lo es, comprobado sobre las cuatro filas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="430" fill="#ffffff"/><rect x="10" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="87" y="35.2" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="87" dy="0">p</tspan></text><rect x="170" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="247" y="35.2" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="247" dy="0">q</tspan></text><rect x="330" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="427" y="35.2" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="427" dy="0">p → q</tspan></text><rect x="10" y="56" width="154" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="87" y="82.92" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="87" dy="0">falso</tspan></text><rect x="170" y="56" width="154" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="82.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="247" dy="0">falso</tspan></text><rect x="330" y="56" width="194" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="427" y="82.92" font-size="14" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="427" dy="0">verdadero</tspan></text><rect x="10" y="108" width="154" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="87" y="134.92" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="87" dy="0">falso</tspan></text><rect x="170" y="108" width="154" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="134.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="247" dy="0">verdadero</tspan></text><rect x="330" y="108" width="194" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="427" y="134.92" font-size="14" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="427" dy="0">verdadero</tspan></text><rect x="10" y="160" width="154" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="87" y="186.92" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="87" dy="0">verdadero</tspan></text><rect x="170" y="160" width="154" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="186.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="247" dy="0">falso</tspan></text><rect x="330" y="160" width="194" height="46" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="427" y="186.92" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="427" dy="0">FALSO</tspan></text><rect x="10" y="212" width="154" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="87" y="238.92" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="87" dy="0">verdadero</tspan></text><rect x="170" y="212" width="154" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="238.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="247" dy="0">verdadero</tspan></text><rect x="330" y="212" width="194" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="427" y="238.92" font-size="14" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="427" dy="0">verdadero</tspan></text><rect x="560" y="12" width="370" height="120" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="745" y="67.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="745" dy="0">Contrapositiva (¬q → ¬p): equivalente a p → q en</tspan></text><text x="745" y="83.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="745" dy="0">las 4 filas (verificado).</tspan></text><rect x="560" y="140" width="370" height="120" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="745" y="187" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="745" dy="0">Recíproca (q → p): NO equivalente: difiere en</tspan></text><text x="745" y="203.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="745" dy="0">las filas «falso, verdadero» y «verdadero,</tspan></text><text x="745" y="220.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="745" dy="0">falso».</tspan></text><rect x="10" y="300" width="920" height="90" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="340.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Falacia frecuente: «si hay un fallo de DNS, no resuelve» no permite concluir que «si no resuelve, hay un fallo de DNS»: el</tspan></text><text x="470" y="356.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">recíproco necesita otras evidencias.</tspan></text></svg>
