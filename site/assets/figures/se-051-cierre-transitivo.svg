<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cierre transitivo: una cadena de 20 nodos tiene 190 pares alcanzables</title><desc id="d">El cierre transitivo de una cadena de 20 nodos contiene 190 pares, que es 20 por 19 dividido entre 2; crece de forma cuadrática con la longitud de la cadena.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="400" fill="#ffffff"/><rect x="10" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="157" y="35.2" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="157" dy="0">Nodos n en cadena</tspan></text><rect x="310" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="497" y="35.2" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="497" dy="0">Pares alcanzables n(n−1)/2</tspan></text><rect x="10" y="56" width="294" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="85.92" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">10</tspan></text><rect x="310" y="56" width="374" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="497" y="85.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="497" dy="0">45</tspan></text><rect x="10" y="114" width="294" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="143.92" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">20</tspan></text><rect x="310" y="114" width="374" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="497" y="143.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="497" dy="0">190 (calculado)</tspan></text><rect x="10" y="172" width="294" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="201.92" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">100</tspan></text><rect x="310" y="172" width="374" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="497" y="201.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="497" dy="0">4 950</tspan></text><rect x="10" y="230" width="294" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="259.92" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">1 000</tspan></text><rect x="310" y="230" width="374" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="497" y="259.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="497" dy="0">499 500</tspan></text><rect x="10" y="270" width="920" height="80" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="305.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La información derivable (quién depende de quién, directa o indirectamente) puede ser mucho mayor que la declarada: para</tspan></text><text x="470" y="321.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">consultas frecuentes se calcula una vez y se guarda.</tspan></text></svg>
