<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 410" width="940" height="410" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Recorrer un grafo con ciclo sin repetir ni colgarse</title><desc id="d">Un grafo A conecta con B y C, B y C con D, y D vuelve a A. Un recorrido en anchura con un conjunto de visitados produce A, B, C, D y termina; sin el conjunto de visitados recorrería el ciclo indefinidamente.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="410" fill="#ffffff"/><rect x="20" y="40" width="200" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="120" y="71.92" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="120" dy="0">A → B, C</tspan></text><rect x="240" y="40" width="200" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="340" y="71.92" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="340" dy="0">B → D · C → D</tspan></text><rect x="460" y="40" width="200" height="56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="560" y="71.92" font-size="14" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="560" dy="0">D → A (ciclo)</tspan></text><rect x="680" y="40" width="240" height="56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="800" y="71.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="800" dy="0">Orden en anchura: A, B, C, D</tspan></text><rect x="20" y="130" width="900" height="80" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="470" y="165.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="470" dy="0">El conjunto de visitados es el invariante de terminación: cada nodo entra una vez, así que el número de pasos está</tspan></text><text x="470" y="181.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="470" dy="0">acotado por el de nodos más aristas.</tspan></text><rect x="20" y="222" width="900" height="80" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="257.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Sin visitados, el recorrido de un grafo con ciclo no termina: la terminación se demuestra con una medida que decrece</tspan></text><text x="470" y="273.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">(nodos aún no visitados).</tspan></text></svg>
