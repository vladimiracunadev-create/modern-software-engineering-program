<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una aserción no es un control de entrada</title><desc id="d">Ejecutando python con la opción -O, la sentencia assert False se ignora y el programa continúa e imprime «las aserciones se ignoraron». Un contrato que debe cumplirse siempre se valida con excepciones, no con assert.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="400" fill="#ffffff"/><rect x="20" y="40" width="420" height="100" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="230" y="85.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="230" dy="0">python -c &quot;assert False; print(&#x27;sigue&#x27;)&quot;</tspan></text><text x="230" y="101.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="230" dy="0">→ AssertionError</tspan></text><rect x="500" y="40" width="420" height="100" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="710" y="85.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="710" dy="0">python -O -c &quot;assert False; print(&#x27;sigue&#x27;)&quot;</tspan></text><text x="710" y="101.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="710" dy="0">→ imprime: las aserciones se ignoraron</tspan></text><rect x="20" y="170" width="900" height="80" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="205.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las aserciones documentan invariantes internos y ayudan a depurar; se eliminan con -O. Validar entradas de usuarios,</tspan></text><text x="470" y="221.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">permisos o presupuestos con assert crea una brecha que solo aparece en producción.</tspan></text><rect x="20" y="262" width="900" height="60" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="470" y="295.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="470" dy="0">Precondiciones de una API pública: excepciones (ValueError). Invariantes internos: assert. Seguridad: nunca assert.</tspan></text></svg>
