<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 322" width="940" height="322" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Búsqueda binaria sobre 3 234 casos exhaustivos: la versión correcta y la que usa hi = mid</title><desc id="d">Barras apiladas horizontales con los 3 234 casos de arreglos ordenados de longitud hasta 6: la versión con hi = mid − 1 comete 0 fallos y la versión con hi = mid comete 1 181, incluidos casos en que no termina.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="322" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Búsqueda binaria sobre 3 234 casos exhaustivos: la versión correcta y la que usa hi = mid</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Sin fallo</tspan></text><rect x="131.86" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="151.86" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="151.86" dy="0">Fallos</tspan></text><line x1="214" y1="77" x2="214" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="214" y1="157" x2="214" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="214" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="214" dy="0">0</tspan></text><line x1="379.425" y1="77" x2="379.425" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="379.425" y1="157" x2="379.425" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="379.425" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="379.425" dy="0">1 000</tspan></text><line x1="544.85" y1="77" x2="544.85" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="544.85" y1="157" x2="544.85" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="544.85" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="544.85" dy="0">2 000</tspan></text><line x1="710.275" y1="77" x2="710.275" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="710.275" y1="157" x2="710.275" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="710.275" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="710.275" dy="0">3 000</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="157" x2="875.7" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">4 000</tspan></text><line x1="214" y1="157" x2="875.7" y2="157" stroke="#5b7280" stroke-width="1.6"/><text x="204" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="204" dy="0">hi = mid − 1 (correcta)</tspan></text><text x="204" y="141.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="204" dy="0">hi = mid (error)</tspan></text><rect x="214" y="84" width="534.984" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="481.492" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="481.492" dy="0">3 234</tspan></text><rect x="748.984" y="84" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="755.984" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="755.984" dy="0">3 234</tspan></text><rect x="214" y="124" width="339.618" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="383.809" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="383.809" dy="0">2 053</tspan></text><rect x="553.618" y="124" width="195.367" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="651.301" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="651.301" dy="0">1 181</tspan></text><text x="755.984" y="141.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="755.984" dy="0">3 234</tspan></text><text x="544.85" y="201" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="544.85" dy="0">Casos de 3 234</tspan></text><rect x="10" y="215" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="239.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">En un dominio pequeño se prueba todo: pocos valores bastan para exponer el error de borde. Un invariante (0 ≤ lo ≤ hi + 1 ≤</tspan></text><text x="470" y="256.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">n) más una medida que decrece (hi − lo) explican por qué la versión correcta termina.</tspan></text><text x="470" y="304.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Resultados calculados con Python 3.12.9; las mediciones de tiempo dependen del equipo.</tspan></text></svg>
