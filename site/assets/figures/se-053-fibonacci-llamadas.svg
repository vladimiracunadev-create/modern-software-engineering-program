ght="400" fill="#5b7280"><tspan x="576.79" dy="0">Llamadas o cálculos (escala logarítmica)</tspan></text><rect x="10" y="195" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="219.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las llamadas se solapan: los mismos subproblemas se recalculan exponencialmente. La memoización los resuelve una vez cada</tspan></text><text x="470" y="236.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">uno: la estructura de la recursión es la misma, la complejidad cambia de exponencial a lineal.</tspan></text><text x="470" y="284.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Resultados calculados con Python 3.12.9; las mediciones de tiempo dependen del equipo.</tspan></text></svg>
