<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 318" width="940" height="318" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La recursión tiene profundidad finita: límite del intérprete y profundidad alcanzada</title><desc id="d">Barras horizontales con el límite de recursión por defecto, 1 000, y la profundidad que alcanzó una recursión simple antes de lanzar RecursionError, 999; json.loads sobre una estructura anidada 100 000 veces también lanzó RecursionError.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="318" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">La recursión tiene profundidad finita: límite del intérprete y profundidad alcanzada</tspan></text><line x1="274" y1="49" x2="274" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="137" x2="274" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0</tspan></text><line x1="424.425" y1="49" x2="424.425" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="424.425" y1="137" x2="424.425" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="424.425" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="424.425" dy="0">250</tspan></text><line x1="574.85" y1="49" x2="574.85" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="574.85" y1="137" x2="574.85" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="574.85" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="574.85" dy="0">500</tspan></text><line x1="725.275" y1="49" x2="725.275" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="725.275" y1="137" x2="725.275" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="725.275" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="725.275" dy="0">750</tspan></text><line x1="875.7" y1="49" x2="875.7" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="137" x2="875.7" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">1 000</tspan></text><line x1="274" y1="137" x2="875.7" y2="137" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="75.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">sys.getrecursionlimit()</tspan></text><text x="264" y="111" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Profundidad alcanzada por una</tspan></text><text x="264" y="128" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">recursión simple</tspan></text><rect x="274" y="55" width="601.7" height="32" rx="3" fill="#102a43"/><text x="882.7" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">1 000</tspan></text><rect x="274" y="99" width="601.098" height="32" rx="3" fill="#102a43"/><text x="882.098" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.098" dy="0">999</tspan></text><text x="574.85" y="181" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="574.85" dy="0">Niveles de recursión</tspan></text><rect x="10" y="195" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="219.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Quedan marcos para el propio manejo del error. Con 100 000 niveles de anidación, json.loads lanzó RecursionError: una</tspan></text><text x="470" y="236.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">entrada hostil puede agotar la pila. Entradas de tamaño no acotado exigen límites de profundidad o una versión iterativa</tspan></text><text x="470" y="253.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">con pila explícita.</tspan></text><text x="470" y="300.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Resultados calculados con Python 3.12.9; las mediciones de tiempo dependen del equipo.</tspan></text></svg>
