<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuando la terminación no se sabe demostrar: la conjetura de Collatz</title><desc id="d">Para los números hasta 100 000, el que más pasos necesita es 77 031 con 350 pasos hasta llegar a 1. Que todos terminen no está demostrado en general.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="400" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="35.2" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Rango probado</tspan></text><rect x="340" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="502" y="35.2" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="502" dy="0">Número más largo</tspan></text><rect x="670" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="797" y="35.2" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="797" dy="0">Pasos</tspan></text><rect x="10" y="56" width="324" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="89.92" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">1 … 99 999</tspan></text><rect x="340" y="56" width="324" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="89.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">77 031</tspan></text><rect x="670" y="56" width="254" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="89.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">350</tspan></text><rect x="10" y="130" width="920" height="90" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="170.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El procedimiento (si es par, dividir entre 2; si no, multiplicar por 3 y sumar 1) termina para todo n probado, pero no hay</tspan></text><text x="470" y="186.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">demostración general. Sin una medida que decrezca, la terminación es una conjetura.</tspan></text><rect x="10" y="232" width="920" height="76" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="265.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Un programa cuya terminación depende de un problema abierto necesita un límite de pasos o un plazo, como el que protege</tspan></text><text x="470" y="281.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cualquier ciclo en producción.</tspan></text></svg>
