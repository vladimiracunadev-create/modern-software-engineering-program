<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 243" width="940" height="243" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuando la terminación no se sabe demostrar: la conjetura de Collatz</title><desc id="d">Diagrama de cuatro pasos: en el rango de 1 a 99 999 el número que más pasos necesita es 77 031 con 350 pasos hasta llegar a 1; que todos terminen no está demostrado en general, así que la terminación es una conjetura.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="243" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuando la terminación no se sabe demostrar: la conjetura de Collatz</tspan></text><text x="115.25" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="115.25" dy="0">Rango probado</tspan></text><rect x="14" y="67" width="202.5" height="57.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="115.25" y="99.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="115.25" dy="0">1 … 99 999</tspan></text><polyline points="220.5,95.64 246.5,95.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="351.75" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="351.75" dy="0">Número más largo</tspan></text><rect x="250.5" y="67" width="202.5" height="57.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="351.75" y="99.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="351.75" dy="0">77 031</tspan></text><polyline points="457,95.64 483,95.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="588.25" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="588.25" dy="0">Pasos hasta llegar a 1</tspan></text><rect x="487" y="67" width="202.5" height="57.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="588.25" y="99.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="588.25" dy="0">350</tspan></text><polyline points="693.5,95.64 719.5,95.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="824.75" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="824.75" dy="0">¿Termina siempre?</tspan></text><rect x="723.5" y="67" width="202.5" height="57.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="824.75" y="90.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="824.75" dy="0">Sin demostración general:</tspan></text><text x="824.75" y="107.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="824.75" dy="0">es una conjetura</tspan></text><rect x="10" y="136.28" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="161.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El procedimiento (si es par, dividir entre 2; si no, multiplicar por 3 y sumar 1) termina para todo n probado. Un programa</tspan></text><text x="470" y="177.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">cuya terminación depende de un problema abierto necesita un límite de pasos o un plazo.</tspan></text><text x="470" y="225.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Resultados calculados con Python 3.12.9; las mediciones de tiempo dependen del equipo.</tspan></text></svg>
