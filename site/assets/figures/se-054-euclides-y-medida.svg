<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 302" width="940" height="302" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Pasos del algoritmo de Euclides en un caso común y en el peor caso</title><desc id="d">Barras horizontales con los pasos de dos ejecuciones: gcd de 1071 y 462 da 21 en 3 pasos; gcd de 987 y 610, Fibonacci consecutivos, da 1 en 14 pasos, el peor caso. La medida b decrece estrictamente en cada paso.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="302" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Pasos del algoritmo de Euclides en un caso común y en el peor caso</tspan></text><line x1="294" y1="49" x2="294" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="137" x2="294" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">0</tspan></text><line x1="445.47" y1="49" x2="445.47" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="445.47" y1="137" x2="445.47" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="445.47" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="445.47" dy="0">4</tspan></text><line x1="596.94" y1="49" x2="596.94" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="596.94" y1="137" x2="596.94" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="596.94" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="596.94" dy="0">8</tspan></text><line x1="748.41" y1="49" x2="748.41" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="748.41" y1="137" x2="748.41" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="748.41" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="748.41" dy="0">12</tspan></text><line x1="899.88" y1="49" x2="899.88" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="899.88" y1="137" x2="899.88" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="899.88" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="899.88" dy="0">16</tspan></text><line x1="294" y1="137" x2="899.88" y2="137" stroke="#5b7280" stroke-width="1.6"/><text x="284" y="75.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">gcd(1071, 462) = 21</tspan></text><text x="284" y="111" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">gcd(987, 610) = 1 (Fibonacci</tspan></text><text x="284" y="128" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">consecutivos)</tspan></text><rect x="294" y="55" width="113.602" height="32" rx="3" fill="#087f8c"/><text x="414.602" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="414.602" dy="0">3</tspan></text><rect x="294" y="99" width="530.145" height="32" rx="3" fill="#087f8c"/><text x="831.145" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="831.145" dy="0">14</tspan></text><text x="596.94" y="181" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="596.94" dy="0">Pasos</tspan></text><rect x="10" y="195" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="219.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Correctitud: gcd(a, b) = gcd(b, a mod b). Terminación: b disminuye en cada paso y no puede bajar de 0. Costo: proporcional</tspan></text><text x="470" y="236.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">al logaritmo de la entrada; el peor caso son números de Fibonacci consecutivos.</tspan></text><text x="470" y="284.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Resultados calculados con Python 3.12.9; las mediciones de tiempo dependen del equipo.</tspan></text></svg>
