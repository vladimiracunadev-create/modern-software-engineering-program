<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Probar contra un oráculo y lo que no demuestra</title><desc id="d">Un ordenamiento de burbuja coincidió con sorted en 2000 casos aleatorios de longitud hasta 30; eso aporta evidencia, no una demostración de corrección.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="400" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Evidencia</tspan></text><rect x="340" y="12" width="284" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="482" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="482" dy="0">Qué aporta</tspan></text><rect x="630" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="777" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="777" dy="0">Qué no aporta</tspan></text><rect x="10" y="56" width="324" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="101.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">2000 casos aleatorios: burbuja = sorted</tspan></text><rect x="340" y="56" width="284" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="93.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">Confianza en esos casos y en su</tspan></text><text x="482" y="109.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">distribución</tspan></text><rect x="630" y="56" width="294" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="93.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">Garantía para todos los arreglos ni para</tspan></text><text x="777" y="109.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">tamaños grandes</tspan></text><rect x="10" y="146" width="324" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="191.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Argumento de invariante (cola ordenada)</tspan></text><rect x="340" y="146" width="284" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">Prueba para toda entrada si es correcto</tspan></text><rect x="630" y="146" width="294" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">Que el código implemente el argumento</tspan></text><rect x="10" y="270" width="920" height="90" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="310.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Pruebas y demostraciones se complementan: una exhibe fallos concretos y la otra cubre todos los casos. Un contraejemplo</tspan></text><text x="470" y="326.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">invalida el algoritmo; la ausencia de contraejemplos no lo valida.</tspan></text></svg>
