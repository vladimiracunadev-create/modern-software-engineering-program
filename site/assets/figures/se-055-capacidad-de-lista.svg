text><rect x="10" y="340" width="920" height="50" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="360.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cada reserva es costosa y rara: el costo promedio por inserción es constante (amortizado), aunque una inserción concreta</tspan></text><text x="470" y="376.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">pueda ser lenta.</tspan></text></svg>
