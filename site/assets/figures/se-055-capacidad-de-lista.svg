<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 526" width="940" height="526" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tamaño en bytes de una lista de Python en los puntos en que reserva memoria</title><desc id="d">Línea con el tamaño en bytes de una lista al añadir elementos uno por uno: 88 con 1 elemento, 120 con 5, 184 con 9, 248 con 17, 312 con 25 y 376 con 33; el tamaño cambia solo en algunos puntos y la mayoría de las inserciones no reservan memoria.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="526" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Tamaño en bytes de una lista de Python en los puntos en que reserva memoria</tspan></text><line x1="78.62" y1="359" x2="910" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="359" x2="78.62" y2="359" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="363.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="284" x2="910" y2="284" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="284" x2="78.62" y2="284" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="288.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="209" x2="910" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="209" x2="78.62" y2="209" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="213.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">200</tspan></text><line x1="78.62" y1="134" x2="910" y2="134" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="134" x2="78.62" y2="134" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="138.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">300</tspan></text><line x1="78.62" y1="59" x2="910" y2="59" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="59" x2="78.62" y2="59" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="63.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">400</tspan></text><line x1="78.62" y1="59" x2="78.62" y2="359" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="59" x2="96.62" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="359" x2="96.62" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">1</tspan></text><line x1="196.043" y1="59" x2="196.043" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="196.043" y1="359" x2="196.043" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="196.043" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="196.043" dy="0">5</tspan></text><line x1="295.465" y1="59" x2="295.465" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="295.465" y1="359" x2="295.465" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="295.465" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="295.465" dy="0">9</tspan></text><line x1="494.31" y1="59" x2="494.31" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="494.31" y1="359" x2="494.31" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="494.31" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="494.31" dy="0">17</tspan></text><line x1="693.155" y1="59" x2="693.155" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="693.155" y1="359" x2="693.155" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="693.155" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="693.155" dy="0">25</tspan></text><line x1="892" y1="59" x2="892" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="359" x2="892" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">33</tspan></text><line x1="78.62" y1="359" x2="910" y2="359" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="209" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 209)">Bytes de la lista</text><text x="494.31" y="405" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Elementos al reservar</tspan></text><polyline points="96.62,293 196.043,269 295.465,221 494.31,173 693.155,125 892,77" fill="none" stroke="#946512" stroke-width="2.4"/><circle cx="96.62" cy="293" r="5.5" fill="#946512" stroke="#946512" stroke-width="2"/><text x="96.62" y="282" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">88</tspan></text><circle cx="196.043" cy="269" r="5.5" fill="#946512" stroke="#946512" stroke-width="2"/><text x="196.043" y="258" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="196.043" dy="0">120</tspan></text><circle cx="295.465" cy="221" r="5.5" fill="#946512" stroke="#946512" stroke-width="2"/><text x="295.465" y="210" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="295.465" dy="0">184</tspan></text><circle cx="494.31" cy="173" r="5.5" fill="#9