<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 504" width="940" height="504" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Razón teórica y razón medida al duplicar n en cuatro operaciones</title><desc id="d">Barras agrupadas con la razón de tiempos al duplicar n: lineal, teórica 2 y medida 1,99; hash, teórica 1 y medida 0,99; n log n, teórica un poco más de 2 (≈2,1) y medida 2,10; cuadrática, teórica 4 y medida 4,30.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="504" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Razón teórica y razón medida al duplicar n en cuatro operaciones</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Razón teórica</tspan></text><rect x="162.02" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="182.02" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="182.02" dy="0">Razón medida</tspan></text><line x1="63.54" y1="345" x2="920" y2="345" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="345" x2="63.54" y2="345" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="349.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">0</tspan></text><line x1="63.54" y1="295" x2="920" y2="295" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="295" x2="63.54" y2="295" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="299.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">1</tspan></text><line x1="63.54" y1="245" x2="920" y2="245" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="245" x2="63.54" y2="245" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="249.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">2</tspan></text><line x1="63.54" y1="195" x2="920" y2="195" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="195" x2="63.54" y2="195" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="199.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">3</tspan></text><line x1="63.54" y1="145" x2="920" y2="145" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="145" x2="63.54" y2="145" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="149.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">4</tspan></text><line x1="63.54" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="95" x2="63.54" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">5</tspan></text><line x1="63.54" y1="95" x2="63.54" y2="345" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="220" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 220)">Razón al duplicar n</text><rect x="84.9515" y="245" width="83.646" height="100" rx="3" fill="#102a43"/><text x="126.774" y="239" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="126.774" dy="0">2,00</tspan></text><rect x="172.597" y="245.5" width="83.646" height="99.5" rx="3" fill="#087f8c"/><text x="214.421" y="239.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="214.421" dy="0">1,99</tspan></text><text x="170.597" y="366" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="170.597" dy="0">Lineal</tspan></text><rect x="299.067" y="295" width="83.646" height="50" rx="3" fill="#102a43"/><text x="340.889" y="289" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="340.889" dy="0">1,00</tspan></text><rect x="386.713" y="295.5" width="83.646" height="49.5" rx="3" fill="#087f8c"/><text x="428.536" y="289.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="428.536" dy="0">0,99</tspan></text><text x="384.713" y="366" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="384.713" dy="0">Hash</tspan></text><rect x="513.182" y="240" width="83.646" height="105" rx="3" fill="#102a43"/><text x="555.005" y="234" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="555.005" dy="0">2,10</tspan></text><rect x="600.828" y="240" width="83.646" height="105" rx="3" fill="#087f8c"/><text x="642.651" y="234" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="642.651" dy="0">2,10</tspan></text><text x="598.828" y="366" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="598.828" dy="0">n log n</tspan></text><rect x="727.296" y="145" width="83.646" height="200" rx="3" fill="#102a43"/><text x="769.119" y="139" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="769.119" dy="0">4,00</tspan></text><rect x="814.942" y="130" width="83.646" height="215" rx="3" fill="#087f8c"/><text x="856.765" y="124" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="856.765" dy="0">4,30</tspan></text><text x="812.942" y="366" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812.942" dy="0">Cuadrática</tspan></text><rect x="10" y="397" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="421.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cuando la medición discrepa mucho de la teoría hay un error de análisis, de medición o un efecto de caché o del intérprete;</tspan></text><text x="470" y="438.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ninguna de las dos fuentes sustituye a la otra.</tspan></text><text x="470" y="486.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Resultados calculados con Python 3.12.9; las mediciones de tiempo dependen del equipo.</tspan></text></svg>
