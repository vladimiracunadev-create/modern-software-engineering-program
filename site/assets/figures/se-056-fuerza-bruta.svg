<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 554" width="940" height="554" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Fuerza bruta del viajante: permutaciones y tiempo medido, relativos a n = 7</title><desc id="d">Líneas en escala logarítmica con el crecimiento respecto de 7 ciudades: las permutaciones (n−1)! pasan de 720 a 5 040 y 40 320, es decir 1, 7 y 56 veces; el tiempo medido pasa de 0,002 s a 0,012 s y 0,110 s, es decir 1, 6 y 55 veces. Con 12 ciudades habría 39 916 800 permutaciones.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="554" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Fuerza bruta del viajante: permutaciones y tiempo medido, relativos a n = 7</tspan></text><circle cx="22" cy="51" r="6" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Permutaciones (n−1)!</tspan></text><rect x="214.8" y="45" width="12" height="12" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="234.8" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="234.8" dy="0">Tiempo medido</tspan></text><line x1="78.62" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="387" x2="78.62" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,1</tspan></text><line x1="78.62" y1="287" x2="910" y2="287" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="287" x2="78.62" y2="287" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="291.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">1</tspan></text><line x1="78.62" y1="187" x2="910" y2="187" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="187" x2="78.62" y2="187" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="191.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">10</tspan></text><line x1="78.62" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="87" x2="78.62" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="87" x2="78.62" y2="387" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="87" x2="96.62" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="387" x2="96.62" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">7</tspan></text><line x1="494.31" y1="87" x2="494.31" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="494.31" y1="387" x2="494.31" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="494.31" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="494.31" dy="0">8</tspan></text><line x1="892" y1="87" x2="892" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="387" x2="892" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">9</tspan></text><line x1="78.62" y1="387" x2="910" y2="387" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 237)">Veces respecto de n = 7 (escala logarítmica)</text><text x="494.31" y="433" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Ciudades n</tspan></text><polyline points="96.62,287 494.31,202.49 892,112.181" fill="none" stroke="#102a43" stroke-width="2.4"/><circle cx="96.62" cy="287" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="96.62" y="276" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">1</tspan></text><circle cx="494.31" cy="202.49" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="494.31" y="191.49" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="494.31" dy="0">7</tspan></text><circle cx="892" cy="112.181" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="892" y="101.181" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">56</tspan></text><polyline points="96.62,287 494.31,209.185 892,112.964" fill="none" stroke="#c0432f" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="91.12" y="281.5" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="96.62" y="276" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">1</tspan></text><rect x="488.81" y="203.685" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="494.31" y="198.185" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="494.31" dy="0">6</tspan></text><rect x="886.5" y="107.464" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="101.964" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">55</tspan></text><rect x="10" y="447" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cada ciudad adicional multiplica el tiempo por 6 a 9, coherente con las permutaciones. Un algoritmo exacto de crecimiento</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">factorial se vuelve inviable muy pronto: con 12 ciudades serían horas; por eso existen heurísticas y aproximaciones.</tspan></text><text x="470" y="536.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Resultados calculados con Python 3.12.9; las mediciones de tiempo dependen del equipo.</tspan></text></svg>
