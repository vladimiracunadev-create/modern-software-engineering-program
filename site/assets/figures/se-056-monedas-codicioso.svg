<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 318" width="940" height="318" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Monedas para devolver 6 con monedas de 1, 3 y 4: algoritmo codicioso y óptimo</title><desc id="d">Barras horizontales con las monedas necesarias para devolver 6: el algoritmo codicioso usa 4, 1 y 1, tres monedas; la programación dinámica usa 3 y 3, dos monedas. En el rango hasta 60 el mayor exceso del codicioso ocurre en el monto 6.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="318" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Monedas para devolver 6 con monedas de 1, 3 y 4: algoritmo codicioso y óptimo</tspan></text><line x1="324" y1="49" x2="324" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="137" x2="324" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="518.647" y1="49" x2="518.647" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="518.647" y1="137" x2="518.647" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="518.647" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="518.647" dy="0">1</tspan></text><line x1="713.293" y1="49" x2="713.293" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="713.293" y1="137" x2="713.293" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="713.293" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="713.293" dy="0">2</tspan></text><line x1="907.94" y1="49" x2="907.94" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="907.94" y1="137" x2="907.94" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="907.94" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907.94" dy="0">3</tspan></text><line x1="324" y1="137" x2="907.94" y2="137" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="67" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Codiciosa: la mayor posible primero (4 +</tspan></text><text x="314" y="84" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">1 + 1)</tspan></text><text x="314" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Programación dinámica, óptima (3 + 3)</tspan></text><rect x="324" y="55" width="583.94" height="32" rx="3" fill="#c0432f"/><text x="914.94" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="914.94" dy="0">3</tspan></text><rect x="324" y="99" width="389.293" height="32" rx="3" fill="#c0432f"/><text x="720.293" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="720.293" dy="0">2</tspan></text><text x="615.97" y="181" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="615.97" dy="0">Monedas para devolver 6</tspan></text><rect x="10" y="195" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="219.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La heurística es correcta con monedas de un sistema canónico (1, 5, 10, 25) y falla con otros conjuntos: un solo</tspan></text><text x="470" y="236.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">contraejemplo basta para refutar que sea óptima en general. Una heurística se acompaña de su contraejemplo y de la</tspan></text><text x="470" y="253.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">condición en que funciona.</tspan></text><text x="470" y="300.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Resultados calculados con Python 3.12.9; las mediciones de tiempo dependen del equipo.</tspan></text></svg>
