<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El algoritmo codicioso falla con monedas 1, 3 y 4</title><desc id="d">Para devolver 6 con monedas de 1, 3 y 4, el algoritmo codicioso usa 4, 1 y 1 (3 monedas) y la solución óptima usa 3 y 3 (2 monedas). En el rango hasta 60, el mayor exceso del codicioso ocurre en el monto 6.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="400" fill="#ffffff"/><rect x="10" y="12" width="414" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="217" y="35.2" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="217" dy="0">Estrategia</tspan></text><rect x="430" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="557" y="35.2" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="557" dy="0">Monedas para 6</tspan></text><rect x="690" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="807" y="35.2" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="807" dy="0">Cantidad</tspan></text><rect x="10" y="56" width="414" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="89.92" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Codiciosa: la mayor posible primero</tspan></text><rect x="430" y="56" width="254" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="89.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">4 + 1 + 1</tspan></text><rect x="690" y="56" width="234" height="60" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="807" y="89.92" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="807" dy="0">3</tspan></text><rect x="10" y="122" width="414" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="155.92" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Programación dinámica (óptima)</tspan></text><rect x="430" y="122" width="254" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="155.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">3 + 3</tspan></text><rect x="690" y="122" width="234" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="807" y="155.92" font-size="14" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="807" dy="0">2</tspan></text><rect x="10" y="220" width="920" height="90" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="260.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La heurística es correcta con monedas de un sistema canónico (1, 5, 10, 25) y falla con otros conjuntos: un solo</tspan></text><text x="470" y="276.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">contraejemplo basta para refutar que sea óptima en general.</tspan></text><rect x="10" y="322" width="920" height="50" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="470" y="350.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="470" dy="0">Una heurística se acompaña de su contraejemplo y de la condición en que funciona.</tspan></text></svg>
