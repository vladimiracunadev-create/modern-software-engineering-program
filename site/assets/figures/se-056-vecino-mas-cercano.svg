<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Vecino más cercano frente al óptimo: 100 instancias de 8 ciudades</title><desc id="d">En 100 instancias aleatorias de 8 ciudades, la heurística del vecino más cercano produjo un recorrido de media 1,086 veces el óptimo, en el peor caso 1,318 veces y en el mejor 1,0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="400" fill="#ffffff"/><rect x="10" y="12" width="554" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="287" y="35.2" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="287" dy="0">Medida (recorrido heurístico / óptimo)</tspan></text><rect x="570" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="717" y="35.2" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="717" dy="0">Valor</tspan></text><rect x="10" y="56" width="554" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="88.92" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Razón media</tspan></text><rect x="570" y="56" width="294" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="88.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">1,086</tspan></text><rect x="10" y="120" width="554" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="152.92" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Peor caso observado</tspan></text><rect x="570" y="120" width="294" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="152.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">1,318</tspan></text><rect x="10" y="184" width="554" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="216.92" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Mejor caso</tspan></text><rect x="570" y="184" width="294" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="216.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">1,000</tspan></text><rect x="10" y="220" width="920" height="80" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="255.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La heurística es rápida y, en promedio, razonable; en el peor caso observado un 32 % peor. No hay garantía general: se</tspan></text><text x="470" y="271.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">conoce la razón en la muestra, no el máximo en todos los casos.</tspan></text><text x="470" y="340" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">100 instancias con semilla 5; el óptimo se calculó por fuerza bruta (7! permutaciones por instancia).</tspan></text></svg>
