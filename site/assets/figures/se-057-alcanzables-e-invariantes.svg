<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Estados alcanzables e invariantes del pedido</title><desc id="d">Una exploración desde el estado nuevo alcanza los 6 estados del pedido; los invariantes se comprueban sobre los estados alcanzables, no sobre todas las combinaciones posibles.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="400" fill="#ffffff"/><rect x="10" y="12" width="554" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="287" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="287" dy="0">Pregunta</tspan></text><rect x="570" y="12" width="334" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="737" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="737" dy="0">Resultado</tspan></text><rect x="10" y="56" width="554" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="90.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">¿Cuántos estados son alcanzables desde «nuevo»?</tspan></text><rect x="570" y="56" width="334" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="90.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">6 de 6</tspan></text><rect x="10" y="124" width="554" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="158.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">¿Se puede llegar a «entregado» sin pasar por «pagado»?</tspan></text><rect x="570" y="124" width="334" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="158.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">No: hay que pasar por pagado y enviado</tspan></text><rect x="10" y="192" width="554" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="226.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">¿Se puede devolver un pedido cancelado?</tspan></text><rect x="570" y="192" width="334" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="226.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">No: no hay transición desde cancelado</tspan></text><rect x="10" y="290" width="920" height="76" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="323.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Un invariante como «entregado implica pagado» se verifica recorriendo los estados alcanzables; si algún estado lo viola, el</tspan></text><text x="470" y="339.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">modelo (o la regla) está mal.</tspan></text></svg>
