<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 328" width="940" height="328" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Explosión de estados al combinar máquinas independientes</title><desc id="d">Barras horizontales con los estados del producto de máquinas independientes: 6 por 5 son 30, 6 por 5 por 4 son 120 y 6 por 5 por 4 por 4 por 3 son 1 440; un sistema de cinco componentes pequeños ya tiene más de mil estados.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="328" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Explosión de estados al combinar máquinas independientes</tspan></text><line x1="214" y1="49" x2="214" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="214" y1="163" x2="214" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="214" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="214" dy="0">0</tspan></text><line x1="379.425" y1="49" x2="379.425" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="379.425" y1="163" x2="379.425" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="379.425" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="379.425" dy="0">400</tspan></text><line x1="544.85" y1="49" x2="544.85" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="544.85" y1="163" x2="544.85" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="544.85" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="544.85" dy="0">800</tspan></text><line x1="710.275" y1="49" x2="710.275" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="710.275" y1="163" x2="710.275" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="710.275" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="710.275" dy="0">1 200</tspan></text><line x1="875.7" y1="49" x2="875.7" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="163" x2="875.7" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">1 600</tspan></text><line x1="214" y1="163" x2="875.7" y2="163" stroke="#5b7280" stroke-width="1.6"/><text x="204" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="204" dy="0">6 × 5</tspan></text><text x="204" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="204" dy="0">6 × 5 × 4</tspan></text><text x="204" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="204" dy="0">6 × 5 × 4 × 4 × 3</tspan></text><rect x="214" y="55" width="12.4069" height="26" rx="3" fill="#c0432f"/><text x="233.407" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="233.407" dy="0">30</tspan></text><rect x="214" y="93" width="49.6275" height="26" rx="3" fill="#c0432f"/><text x="270.627" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="270.627" dy="0">120</tspan></text><rect x="214" y="131" width="595.53" height="26" rx="3" fill="#c0432f"/><text x="816.53" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="816.53" dy="0">1 440</tspan></text><text x="544.85" y="207" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="544.85" dy="0">Estados del producto</tspan></text><rect x="10" y="221" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="245.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Razonar sobre el producto a mano es inviable: se modelan los componentes por separado, se declaran las interacciones y se</tspan></text><text x="470" y="262.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">explora el espacio de estados con una herramienta (verificación de modelos).</tspan></text><text x="470" y="310.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Resultados calculados con Python 3.12.9; las mediciones de tiempo dependen del equipo.</tspan></text></svg>
