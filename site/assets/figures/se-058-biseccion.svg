<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Búsqueda binaria de una causa: pasos necesarios</title><desc id="d">Localizar una modificación defectuosa entre 1024 cambios ordenados requiere 10 pruebas y entre un millón requiere 20; cada prueba descarta la mitad de los candidatos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="400" fill="#ffffff"/><rect x="10" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="137" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="137" dy="0">Cambios candidatos</tspan></text><rect x="270" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="387" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="387" dy="0">Pruebas (≈ log2 n)</tspan></text><rect x="510" y="12" width="414" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="717" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="717" dy="0">Ejemplo observado</tspan></text><rect x="10" y="56" width="254" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="91.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">1 024</tspan></text><rect x="270" y="56" width="234" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="387" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387" dy="0">10</tspan></text><rect x="510" y="56" width="414" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">defecto en el cambio 700 hallado en 10 pasos</tspan></text><rect x="10" y="126" width="254" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="161.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">1 000 000</tspan></text><rect x="270" y="126" width="234" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="387" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387" dy="0">20</tspan></text><rect x="510" y="126" width="414" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">defecto en el cambio 123 456 hallado en 20 pasos</tspan></text><rect x="10" y="220" width="920" height="90" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="260.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La biseccion (git bisect) exige una prueba determinista y la suposición de monotonía: todo cambio anterior al defecto es</tspan></text><text x="470" y="276.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">sano y todo cambio posterior lo contiene. Si la prueba es intermitente, el resultado no es fiable.</tspan></text></svg>
