<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Falsa confianza: pasar cinco veces no descarta un fallo intermitente</title><desc id="d">Si un fallo ocurre en el 10 % de las corridas, la probabilidad de que cinco corridas seguidas pasen aunque el defecto exista es 0,9 elevado a 5, es decir 0,59.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="400" fill="#ffffff"/><rect x="10" y="12" width="594" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="307" y="35.2" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="307" dy="0">Situación</tspan></text><rect x="610" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="757" y="35.2" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="757" dy="0">Probabilidad</tspan></text><rect x="10" y="56" width="594" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="90.92" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="307" dy="0">Defecto presente (p = 0,1) y cinco corridas pasan</tspan></text><rect x="610" y="56" width="294" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="90.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">0,9^5 = 0,59</tspan></text><rect x="10" y="124" width="594" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="158.92" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="307" dy="0">Defecto presente y se observa al menos una falla en cinco corridas</tspan></text><rect x="610" y="124" width="294" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="158.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">1 − 0,59 = 0,41</tspan></text><rect x="10" y="220" width="920" height="90" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="260.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Con un 59 % de probabilidad, «lo corregí porque ahora pasa cinco veces» es una conclusión que falla más de la mitad de las</tspan></text><text x="470" y="276.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">veces. Se registra la hipótesis, la predicción y el número de corridas planificado antes de concluir.</tspan></text></svg>
