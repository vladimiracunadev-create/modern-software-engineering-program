<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 276" width="940" height="276" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Preguntas abiertas y registro de la decisión ante una contradicción</title><desc id="d">Diagrama de cuatro elementos del registro de una contradicción: la contradicción de los tres requisitos sin solución conjunta, las opciones, quién decide y las preguntas abiertas; no se escoge en silencio.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="276" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Preguntas abiertas y registro de la decisión ante una contradicción</tspan></text><text x="115.25" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="115.25" dy="0">1 · Contradicción</tspan></text><rect x="14" y="67" width="202.5" height="90.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="115.25" y="99.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="115.25" dy="0">Los tres requisitos no</tspan></text><text x="115.25" y="115.92" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="115.25" dy="0">tienen solución conjunta</tspan></text><text x="115.25" y="132.56" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="115.25" dy="0">(0 de 4 configuraciones)</tspan></text><polyline points="220.5,112.28 246.5,112.28" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="351.75" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="351.75" dy="0">2 · Opciones</tspan></text><rect x="250.5" y="67" width="202.5" height="90.56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="351.75" y="99.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="351.75" dy="0">Relajar la búsqueda en</tspan></text><text x="351.75" y="115.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="351.75" dy="0">servidor, relajar e2e o</tspan></text><text x="351.75" y="132.56" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="351.75" dy="0">cambiar el alcance</tspan></text><polyline points="457,112.28 483,112.28" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="588.25" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="588.25" dy="0">3 · Quién decide</tspan></text><rect x="487" y="67" width="202.5" height="90.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="588.25" y="90.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="588.25" dy="0">Propietario del producto</tspan></text><text x="588.25" y="107.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="588.25" dy="0">con asesoría de</tspan></text><text x="588.25" y="124.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="588.25" dy="0">seguridad; las personas</tspan></text><text x="588.25" y="140.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="588.25" dy="0">afectadas se consultan</tspan></text><polyline points="693.5,112.28 719.5,112.28" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="824.75" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="824.75" dy="0">4 · Preguntas abiertas</tspan></text><rect x="723.5" y="67" width="202.5" height="90.56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="824.75" y="90.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="824.75" dy="0">¿Qué dato necesita</tspan></text><text x="824.75" y="107.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="824.75" dy="0">realmente buscarse? ¿Con</tspan></text><text x="824.75" y="124.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="824.75" dy="0">qué latencia? ¿Qué riesgo</tspan></text><text x="824.75" y="140.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="824.75" dy="0">se acepta?</tspan></text><rect x="10" y="169.56" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="194.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Una contradicción no resuelta que se oculta reaparece como un defecto en producción; una que se registra es una decisión</tspan></text><text x="470" y="211.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">revisable.</tspan></text><text x="470" y="258.84" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Resultados calculados con Python 3.12.9; las mediciones de tiempo dependen del equipo.</tspan></text></svg>
