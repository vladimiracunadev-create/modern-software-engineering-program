<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Relajar un requisito: lo que cambia y lo que cuesta</title><desc id="d">Al relajar el requisito de búsqueda en el servidor queda una única configuración válida: cifrado extremo a extremo con el índice en el cliente. La decisión de qué requisito relajar es de negocio, con consecuencias para quienes lo usan.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="400" fill="#ffffff"/><rect x="10" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="137" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="137" dy="0">Requisito relajado</tspan></text><rect x="270" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="417" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="417" dy="0">Configuraciones válidas</tspan></text><rect x="570" y="12" width="354" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="747" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="747" dy="0">Costo para la persona usuaria</tspan></text><rect x="10" y="56" width="254" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="101.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">Búsqueda en el servidor</tspan></text><rect x="270" y="56" width="294" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="417" y="101.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="417" dy="0">1: e2e + índice en el cliente</tspan></text><rect x="570" y="56" width="354" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="93.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">La búsqueda ocurre en el dispositivo: más datos</tspan></text><text x="747" y="109.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">locales, más tiempo</tspan></text><rect x="10" y="146" width="254" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="191.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">Cifrado extremo a extremo</tspan></text><rect x="270" y="146" width="294" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="417" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="417" dy="0">Más de una</tspan></text><rect x="570" y="146" width="354" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">El servidor puede leer los datos</tspan></text><rect x="10" y="280" width="920" height="80" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="315.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El análisis no decide por la persona: muestra qué se gana y qué se pierde con cada relajación, y deja la decisión a quien</tspan></text><text x="470" y="331.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">tenga autoridad y a quienes resultan afectados.</tspan></text></svg>
