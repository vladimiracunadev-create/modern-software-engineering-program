<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Las trece pruebas del laboratorio y el contrato que cada una protege</title><desc id="d">Tabla con las trece pruebas del laboratorio de la Parte 04: especificación completa, resultado ausente rechazado, conflicto visible, implicación con una fila falsa, grafo con ciclo, máquina de estados, selector, invariante de subconjunto, observación contradictoria, presupuesto, caso de referencia, conteos y salida legible. Pasaron en Windows (0,167 s) y en Linux (0,245 s).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="470" fill="#ffffff"/><rect x="10" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="102" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="102" dy="0">Grupo</tspan></text><rect x="200" y="12" width="474" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="437" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="437" dy="0">Pruebas</tspan></text><rect x="680" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="812" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="812" dy="0">Contrato</tspan></text><rect x="10" y="56" width="184" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="101.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">Especificación</tspan></text><rect x="200" y="56" width="474" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="93.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">completa · resultado ausente rechazado · conflicto sin resolver</tspan></text><text x="437" y="109.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">visible</tspan></text><rect x="680" y="56" width="264" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="93.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">Datos de entrada válidos y</tspan></text><text x="812" y="109.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">conflictos explícitos</tspan></text><rect x="10" y="146" width="184" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="191.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">Razonamiento</tspan></text><rect x="200" y="146" width="474" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="183.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">implicación con una fila falsa · grafo con ciclo termina · máquina</tspan></text><text x="437" y="199.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">de estados rechaza lo imposible</tspan></text><rect x="680" y="146" width="264" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">Lógica, terminación y estados</tspan></text><rect x="10" y="236" width="184" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="281.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">Selección y observación</tspan></text><rect x="200" y="236" width="474" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="273.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">excluye pruebas no autorizadas · el subconjunto se preserva ·</tspan></text><text x="437" y="289.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">observación contradictoria falla · presupuesto como precondición</tspan></text><rect x="680" y="236" width="264" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="281.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">Invariantes y precondiciones</tspan></text><rect x="10" y="326" width="184" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="371.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">Evidencia</tspan></text><rect x="200" y="326" width="474" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="363.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">caso de referencia se resuelve con traza · conteos separan teoría</tspan></text><text x="437" y="379.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">de tiempo · salida legible por máquina</tspan></text><rect x="680" y="326" width="264" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="371.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">Trazabilidad y límites</tspan></text><rect x="10" y="420" width="940" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y=