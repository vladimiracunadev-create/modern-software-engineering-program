<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 525" width="960" height="525" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Expresiones cuyo resultado el tipo decide</title><desc id="d">Tabla con siete expresiones de Python ejecutadas: 0.1+0.2 da 0.30000000000000004, bool(&#x27;false&#x27;) es True, 3/2 es 1.5 y 3//2 es 1, -7//2 es -4 y -7%2 es 1, &#x27;3&#x27;*2 es &#x27;33&#x27; y 2**53+1 convertido a float no se distingue de 2**53.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="525" fill="#ffffff"/><rect x="10" y="14" width="284" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="152" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="152" dy="0">Expresión</tspan></text><rect x="300" y="14" width="244" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="422" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="422" dy="0">Resultado observado</tspan></text><rect x="550" y="14" width="394" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="747" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="747" dy="0">Qué enseña</tspan></text><rect x="10" y="56" width="284" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="86.28" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="152" dy="0">0.1 + 0.2 == 0.3</tspan></text><rect x="300" y="56" width="244" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="86.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">False (0.30000000000000004)</tspan></text><rect x="550" y="56" width="394" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="77.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">float binario aproxima decimales; comparar con</tspan></text><text x="747" y="94.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">tolerancia o usar enteros/Decimal</tspan></text><rect x="10" y="115.28" width="284" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="145.56" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="152" dy="0">bool(&#x27;false&#x27;)</tspan></text><rect x="300" y="115.28" width="244" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="145.56" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">True</tspan></text><rect x="550" y="115.28" width="394" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="137.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">cualquier cadena no vacía es verdadera; la</tspan></text><text x="747" y="153.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">conversión necesita un parser explícito</tspan></text><rect x="10" y="174.56" width="284" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="204.84" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="152" dy="0">3 / 2 y 3 // 2</tspan></text><rect x="300" y="174.56" width="244" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="204.84" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">1.5 y 1</tspan></text><rect x="550" y="174.56" width="394" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="196.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">/ siempre devuelve float; // trunca hacia menos</tspan></text><text x="747" y="213.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">infinito</tspan></text><rect x="10" y="233.84" width="284" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="264.12" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="152" dy="0">-7 // 2 y -7 % 2</tspan></text><rect x="300" y="233.84" width="244" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="264.12" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">-4 y 1</tspan></text><rect x="550" y="233.84" width="394" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="255.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">el módulo toma el signo del divisor; otros</tspan></text><text x="747" y="272.44" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">lenguajes devuelven -3 y -1</tspan></text><rect x="10" y="293.12" width="284" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="323.4" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="152" dy="0">&#x27;3&#x27; * 2</tspan></text><rect x="300" y="293.12" width="244" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="323.4" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">&#x27;33&#x27;</tspan></text><rect x="550" y="293.12" width="394" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="315.08" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">el mismo operador repite una secuencia: la</tspan></text><text x="747" y="331.72" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">semántica depende del tipo del operando</tspan></text><rect x="10" y="352.4" width="284" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="382.68" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="152" dy="0">float(2**53 + 1) == float(2**53)</tspan></text><rect x="300" y="352.4" width="244" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="382.68" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">True</tspan></text><rect x="550" y="352.4" width="394" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="374.36" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">a partir de 2**53 un float no distingue enteros</tspan></text><text x="747" y="391" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">consecutivos; int sí (9007199254740993)</tspan></text><rect x="10" y="411.68" width="284" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="433.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="152" dy="0">round(2.5), round(3.5), round(2.675,</tspan></text><text x="152" y="450.28" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="152" dy="0">2)</tspan></text><rect x="300" y="411.68" width="244" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="441.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">2, 4, 2.67</tspan></text><rect x="550" y="411.68" width="394" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="433.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">redondeo al par y representación binaria: no es</tspan></text><text x="747" y="450.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">«medio hacia arriba»</tspan></text><rect x="10" y="474.96" width="940" height="36.64" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="496.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Mismo resultado en Python 3.12.9 (Windows) y 3.12.3 (Linux): la semántica la define el lenguaje, no el sistema operativo.</tspan></text></svg>
