<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 446" width="960" height="446" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El presupuesto del laboratorio ante seis valores externos</title><desc id="d">Tabla del parser del laboratorio: el presupuesto 5 se acepta; True, 5.0, &#x27;5&#x27;, -1 y null se rechazan con invalid_budget. Además int(&#x27; 42 &#x27;) vale 42, int(&#x27;4_2&#x27;) vale 42, int(&#x27;٣&#x27;) vale 3 y int(&#x27;²&#x27;) falla.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="446" fill="#ffffff"/><rect x="10" y="14" width="194" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="107" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="107" dy="0">budget en el JSON</tspan></text><rect x="210" y="14" width="324" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="372" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="372" dy="0">Tipo / situación</tspan></text><rect x="540" y="14" width="404" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="742" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="742" dy="0">Resultado del parser</tspan></text><rect x="10" y="56" width="194" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="107" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="107" dy="0">5</tspan></text><rect x="210" y="56" width="324" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="372" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372" dy="0">int válido</tspan></text><rect x="540" y="56" width="404" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">aceptado</tspan></text><rect x="10" y="102" width="194" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="107" y="125.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="107" dy="0">true</tspan></text><rect x="210" y="102" width="324" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="372" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372" dy="0">bool, subtipo de int en Python</tspan></text><rect x="540" y="102" width="404" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">invalid_budget (type(value) is int)</tspan></text><rect x="10" y="148" width="194" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="107" y="171.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="107" dy="0">5.0</tspan></text><rect x="210" y="148" width="324" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="372" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372" dy="0">float con valor entero</tspan></text><rect x="540" y="148" width="404" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">invalid_budget: no se redondea en silencio</tspan></text><rect x="10" y="194" width="194" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="107" y="217.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="107" dy="0">&quot;5&quot;</tspan></text><rect x="210" y="194" width="324" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="372" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372" dy="0">texto numérico</tspan></text><rect x="540" y="194" width="404" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">invalid_budget: no se convierte en la frontera JSON</tspan></text><rect x="10" y="240" width="194" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="107" y="263.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="107" dy="0">-1</tspan></text><rect x="210" y="240" width="324" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="372" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372" dy="0">int fuera de dominio</tspan></text><rect x="540" y="240" width="404" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">invalid_budget (budget &lt; 0)</tspan></text><rect x="10" y="286" width="194" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="107" y="309.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="107" dy="0">null</tspan></text><rect x="210" y="286" width="324" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="372" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372" dy="0">ausencia</tspan></text><rect x="540" y="286" width="404" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">invalid_budget: ausencia no es cero</tspan></text><rect x="10" y="336" width="940" height="53.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="357.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">int() es más permisivo que el contrato: int(&#x27; 42 &#x27;) = 42, int(&#x27;4_2&#x27;) = 42, int(&#x27;٣&#x27;) = 3 (dígito arábigo-índico); int(&#x27;²&#x27;)</tspan></text><text x="480" y="374.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">falla aunque &#x27;²&#x27;.isdigit() sea True. Por eso el contrato fija qué formatos acepta en lugar de heredar los de int().</tspan></text><rect x="10" y="397.28" width="940" height="35.36" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="480" y="418.32" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="480" dy="0">Medido con el parser real de labs/part-05-diagnostic-cli en ambas plataformas. Otros lenguajes tendrán otra jerarquía bool/int.</tspan></text></svg>
