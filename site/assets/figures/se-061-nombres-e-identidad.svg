<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 461" width="960" height="461" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Nombres, objetos e identidad: lo que se midió</title><desc id="d">Dos nombres a y b apuntan a la misma lista, por lo que añadir por b cambia a. Un entero pequeño ocupa 28 bytes, 2**100 ocupa 40 y 2**1000 ocupa 160. Un dataclass congelado impide asignar atributos y bool es subtipo de int.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="461" fill="#ffffff"/><text x="20" y="28" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">Aliasing: dos nombres, un objeto</tspan></text><rect x="20" y="44" width="90" height="40" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="65" y="67.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="65" dy="0">a</tspan></text><rect x="20" y="100" width="90" height="40" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="65" y="123.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="65" dy="0">b</tspan></text><rect x="300" y="60" width="300" height="64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="450" y="95.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="450" dy="0">objeto list [1, 2] → [1, 2, 3]</tspan></text><polyline points="110,64 300,84" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="110,120 300,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="640" y="44" width="300" height="96" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="790" y="87.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="790" dy="0">b.append(3) cambió lo que ve a.</tspan></text><text x="790" y="103.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="790" dy="0">Medido: a is b → True; a == [1, 2, 3].</tspan></text><rect x="10" y="170" width="294" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="157" y="191.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="157" dy="0">Observación</tspan></text><rect x="310" y="170" width="184" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="402" y="191.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="402" dy="0">Valor medido</tspan></text><rect x="500" y="170" width="444" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="722" y="191.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="722" dy="0">Consecuencia</tspan></text><rect x="10" y="212" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="235.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">tamaño de 1 / 2**30</tspan></text><rect x="310" y="212" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="235.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">28 B / 32 B</tspan></text><rect x="500" y="212" width="444" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="235.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">un int de Python es un objeto, no una palabra de máquina</tspan></text><rect x="10" y="258" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">tamaño de 2**100 / 2**1000</tspan></text><rect x="310" y="258" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">40 B / 160 B</tspan></text><rect x="500" y="258" width="444" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">el entero crece con su valor: precisión arbitraria</tspan></text><rect x="10" y="304" width="294" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="334.28" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">isinstance(True, int) y True + True</tspan></text><rect x="310" y="304" width="184" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="334.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">True y 2</tspan></text><rect x="500" y="304" width="444" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="325.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">bool es subtipo de int: el JSON true pasaría como 1 si no</tspan></text><text x="722" y="342.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">se comprueba type()</tspan></text><rect x="10" y="363.28" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="386.92" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">probe.cost = 3 (dataclass congelado)</tspan></text><rect x="310" y="363.28" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="386.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">FrozenInstanceError</tspan></text><rect x="500" y="363.28" width="444" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="386.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">el laboratorio impide mutar un Probe ya validado</tspan></text><rect x="10" y="411.28" width="940" height="36.64" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="433.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Identidad de enteros pequeños (256 sí, 257 no) es un detalle de CPython: no se usa nunca para comparar valores.</tspan></text></svg>
