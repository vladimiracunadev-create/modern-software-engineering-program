<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 357" width="960" height="357" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cortocircuito y comparaciones encadenadas: qué se evalúa</title><desc id="d">Se registraron las llamadas a una función con efecto: f(0) and f(1) evalúa solo f(0); f(1) or f(2) evalúa solo f(1); 5 &lt; 3 &lt; f(9) no llama a f. Además 3 &gt; 2 &gt; 2 es False y 0 == False es True.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="357" fill="#ffffff"/><rect x="10" y="14" width="284" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="152" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="152" dy="0">Expresión</tspan></text><rect x="300" y="14" width="204" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="402" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="402" dy="0">Efecto observado</tspan></text><rect x="510" y="14" width="434" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="727" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="727" dy="0">Por qué</tspan></text><rect x="10" y="56" width="284" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="152" dy="0">f(0) and f(1)</tspan></text><rect x="300" y="56" width="204" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">solo f(0)</tspan></text><rect x="510" y="56" width="434" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">0 es falso: el resultado ya está decidido</tspan></text><rect x="10" y="102" width="284" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="125.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="152" dy="0">f(1) or f(2)</tspan></text><rect x="300" y="102" width="204" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">solo f(1)</tspan></text><rect x="510" y="102" width="434" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">1 es verdadero: la segunda operando no se evalúa</tspan></text><rect x="10" y="148" width="284" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="171.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="152" dy="0">5 &lt; 3 &lt; f(9)</tspan></text><rect x="300" y="148" width="204" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">f no se llama</tspan></text><rect x="510" y="148" width="434" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">equivale a (5 &lt; 3) and (3 &lt; f(9)): la primera falla</tspan></text><rect x="10" y="194" width="284" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="217.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="152" dy="0">3 &gt; 2 &gt; 2</tspan></text><rect x="300" y="194" width="204" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">False</tspan></text><rect x="510" y="194" width="434" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">se evalúa como (3 &gt; 2) and (2 &gt; 2), no como (3 &gt; 2) &gt; 2</tspan></text><rect x="10" y="240" width="284" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="263.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="152" dy="0">0 == False y &#x27;&#x27; == None</tspan></text><rect x="300" y="240" width="204" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">True y False</tspan></text><rect x="510" y="240" width="434" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">== iguala 0 y False; None solo es igual a None</tspan></text><rect x="10" y="290" width="940" height="53.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="311.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Una guarda como if x is not None and x.ok depende del cortocircuito para no fallar. Invertir el orden convierte una condición</tspan></text><text x="480" y="328.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">segura en AttributeError.</tspan></text></svg>
