<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 341" width="960" height="341" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué valores son falsos en Python (trece medidos)</title><desc id="d">Tabla de truthiness: 0, 0.0, cadena vacía, lista vacía, diccionario vacío, None, tupla vacía y set vacío son falsos; espacio, [0], &#x27;false&#x27;, &#x27;0&#x27; y nan son verdaderos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="341" fill="#ffffff"/><rect x="10" y="14" width="414" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="217" y="35.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="217" dy="0">Valores</tspan></text><rect x="430" y="14" width="124" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="492" y="35.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="492" dy="0">bool(valor)</tspan></text><rect x="560" y="14" width="384" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="752" y="35.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="752" dy="0">Lectura</tspan></text><rect x="10" y="56" width="414" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="79.92" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">0 0.0 &#x27;&#x27; [] {} () set() None</tspan></text><rect x="430" y="56" width="124" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="492" y="79.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">False</tspan></text><rect x="560" y="56" width="384" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="79.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">vacío o cero: la ausencia de contenido</tspan></text><rect x="10" y="102" width="414" height="55.84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="133.84" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">&#x27; &#x27; [0] &#x27;false&#x27; &#x27;0&#x27; float(&#x27;nan&#x27;)</tspan></text><rect x="430" y="102" width="124" height="55.84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="492" y="133.84" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">True</tspan></text><rect x="560" y="102" width="384" height="55.84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="124.88" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">no vacío: el contenido no se interpreta, solo</tspan></text><text x="752" y="142.8" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">se cuenta</tspan></text><rect x="10" y="169.84" width="940" height="53.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="191.8" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">if budget: trata 0, None y [] igual. Si 0 es un presupuesto válido y None significa «no informado», la condición necesita</tspan></text><text x="480" y="208.44" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">comparar explícitamente: if budget is None / if budget == 0.</tspan></text><rect x="10" y="231.12" width="940" height="53.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="253.08" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Operadores lógicos devuelven operandos, no booleanos: None or 5 → 5; 0 or &#x27;&#x27; → &#x27;&#x27;; [] and 3 → []; 1 and 2 → 2. Útil para</tspan></text><text x="480" y="269.72" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">valores por defecto, peligroso si el operando puede ser 0.</tspan></text><rect x="10" y="292.4" width="940" height="35.36" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="480" y="313.44" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="480" dy="0">Resultados idénticos en Windows y Linux (Python 3.12). Otros lenguajes tienen otra tabla: en JavaScript [] es verdadero.</tspan></text></svg>
