<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 476" width="960" height="476" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Iterar sin materializar: memoria medida y trampas de los iteradores</title><desc id="d">range(10**9) ocupa 48 bytes, una lista de 10**5 enteros 800056 bytes y una expresión generadora 192 bytes. Los cierres de un bucle devuelven [2, 2, 2] por enlace tardío y un iterador agotado devuelve una lista vacía.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="476" fill="#ffffff"/><text x="20" y="28" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">sys.getsizeof (bytes, escala logarítmica por tramos)</tspan></text><text x="280" y="63" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="280" dy="0">range(10**9)</tspan></text><rect x="290" y="42" width="57.6" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="355.6" y="63" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="355.6" dy="0">48 B</tspan></text><text x="280" y="107" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="280" dy="0">generador sobre range(10**9)</tspan></text><rect x="290" y="86" width="230.4" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="528.4" y="107" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="528.4" dy="0">192 B</tspan></text><text x="280" y="151" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="280" dy="0">list(range(10**5)) · 800 056 B</tspan></text><rect x="290" y="130" width="480" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="778" y="151" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="778" dy="0">≈ 800 KB</tspan></text><rect x="10" y="190" width="324" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="211.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Fragmento</tspan></text><rect x="340" y="190" width="164" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="422" y="211.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="422" dy="0">Resultado medido</tspan></text><rect x="510" y="190" width="434" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="727" y="211.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="727" dy="0">Lectura</tspan></text><rect x="10" y="232" width="324" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="262.28" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">[lambda: i for i in range(3)]</tspan></text><rect x="340" y="232" width="164" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="262.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">[2, 2, 2]</tspan></text><rect x="510" y="232" width="434" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="253.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">el cierre captura el nombre i, no su valor en cada</tspan></text><text x="727" y="270.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">vuelta</tspan></text><rect x="10" y="291.28" width="324" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="321.56" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">it = iter([1,2,3]); list(it); list(it)</tspan></text><rect x="340" y="291.28" width="164" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="321.56" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">[]</tspan></text><rect x="510" y="291.28" width="434" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="313.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">un iterador se consume una vez; repetirlo exige</tspan></text><text x="727" y="329.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">recrearlo</tspan></text><rect x="10" y="350.56" width="324" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="380.84" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">while v != 1.0: v += 0.1</tspan></text><rect x="340" y="350.56" width="164" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="372.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">no termina por</tspan></text><text x="422" y="389.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">igualdad</tspan></text><rect x="510" y="350.56" width="434" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="372.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">v llega a 2.0000000000000004; el contador de seguridad</tspan></text><text x="727" y="389.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">cortó a 20 vueltas</tspan></text><rect x="10" y="411.84" width="940" height="50.72" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="480" y="432.88" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="480" dy="0">La barra de 800 KB está truncada en la escala: la lista es unas 4 000 veces mayor que el generador (y 16 000 que el range). Pero el</tspan></text><text x="480" y="448.24" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="480" dy="0">generador no permite volver atrás ni conocer su longitud.</tspan></text></svg>
