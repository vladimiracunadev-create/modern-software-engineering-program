<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 351" width="960" height="351" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Modificar una colección mientras se recorre</title><desc id="d">Quitar los pares de [1..6] mientras se itera parece funcionar, pero con [2, 4, 6, 8] deja [4, 8]. Añadir una clave a un diccionario durante el recorrido lanza RuntimeError. Filtrar con una comprensión da el resultado correcto.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="351" fill="#ffffff"/><rect x="10" y="14" width="324" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Operación</tspan></text><rect x="340" y="14" width="174" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="427" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="427" dy="0">Resultado medido</tspan></text><rect x="520" y="14" width="424" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="732" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="732" dy="0">Por qué</tspan></text><rect x="10" y="56" width="324" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="77.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">quitar pares de [1, 2, 3, 4, 5, 6]</tspan></text><text x="172" y="94.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">iterando</tspan></text><rect x="340" y="56" width="174" height="53.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="427" y="86.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="427" dy="0">[1, 3, 5]</tspan></text><rect x="520" y="56" width="424" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="732" y="77.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="732" dy="0">correcto por casualidad: los elementos saltados eran</tspan></text><text x="732" y="94.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="732" dy="0">impares</tspan></text><rect x="10" y="115.28" width="324" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="145.56" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">quitar pares de [2, 4, 6, 8] iterando</tspan></text><rect x="340" y="115.28" width="174" height="53.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="427" y="145.56" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="427" dy="0">[4, 8]</tspan></text><rect x="520" y="115.28" width="424" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="732" y="137.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="732" dy="0">al borrar el índice 0 el iterador salta el siguiente: 4</tspan></text><text x="732" y="153.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="732" dy="0">y 8 sobreviven</tspan></text><rect x="10" y="174.56" width="324" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="204.84" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">d[&#x27;c&#x27;] = 3 dentro de for k in d</tspan></text><rect x="340" y="174.56" width="174" height="53.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="427" y="204.84" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="427" dy="0">RuntimeError</tspan></text><rect x="520" y="174.56" width="424" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="732" y="196.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="732" dy="0">dictionary changed size during iteration: el lenguaje</tspan></text><text x="732" y="213.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="732" dy="0">avisa</tspan></text><rect x="10" y="233.84" width="324" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="257.48" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">[v for v in xs if v % 2]</tspan></text><rect x="340" y="233.84" width="174" height="40" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="427" y="257.48" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="427" dy="0">nueva lista correcta</tspan></text><rect x="520" y="233.84" width="424" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="732" y="257.48" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="732" dy="0">construir un resultado nuevo evita el estado compartido</tspan></text><rect x="10" y="283.84" width="940" height="53.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="305.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Una prueba con una sola entrada que «pasa» no demuestra que el bucle sea correcto: [1..6] lo ocultaba. El invariante del bucle</tspan></text><text x="480" y="322.44" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">(«los elementos vistos ya están decididos») es lo que se comprueba.</tspan></text></svg>
