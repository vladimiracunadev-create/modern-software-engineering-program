<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 542" width="960" height="542" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Costo de llamar funciones y de memoizar</title><desc id="d">Llamar una función vacía cuesta 41.7 ns en Windows y 29.7 en Linux; con tres argumentos posicionales 54.2 y 35.5; con tres por nombre 73.1 y 61.8. fib(25) sin caché tarda 22.6 ms en Windows y 14.1 en Linux; con lru_cache, 0.123 y 0.084 microsegundos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="542" fill="#ffffff"/><text x="20" y="28" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">Nanosegundos por llamada</tspan></text><text x="260" y="63" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="260" dy="0">vacía · Windows</tspan></text><rect x="270" y="42" width="250.2" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="528.2" y="63" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="528.2" dy="0">41.7</tspan></text><text x="260" y="101" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="260" dy="0">3 posicionales · Windows</tspan></text><rect x="270" y="80" width="325.2" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="603.2" y="101" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="603.2" dy="0">54.2</tspan></text><text x="260" y="139" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="260" dy="0">3 por nombre · Windows</tspan></text><rect x="270" y="118" width="438.6" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="716.6" y="139" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="716.6" dy="0">73.1</tspan></text><text x="260" y="177" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="260" dy="0">vacía · Linux</tspan></text><rect x="270" y="156" width="178.2" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="456.2" y="177" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="456.2" dy="0">29.7</tspan></text><text x="260" y="215" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="260" dy="0">3 posicionales · Linux</tspan></text><rect x="270" y="194" width="213" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="491" y="215" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="491" dy="0">35.5</tspan></text><text x="260" y="253" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="260" dy="0">3 por nombre · Linux</tspan></text><rect x="270" y="232" width="370.8" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="648.8" y="253" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="648.8" dy="0">61.8</tspan></text><rect x="10" y="280" width="324" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="301.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Caso</tspan></text><rect x="340" y="280" width="124" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="402" y="301.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="402" dy="0">Windows</tspan></text><rect x="470" y="280" width="124" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="532" y="301.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="532" dy="0">Linux</tspan></text><rect x="600" y="280" width="344" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="772" y="301.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="772" dy="0">Nota</tspan></text><rect x="10" y="322" width="324" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="345.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">fib(25) sin caché</tspan></text><rect x="340" y="322" width="124" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="345.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">22.6 ms</tspan></text><rect x="470" y="322" width="124" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="345.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">14.1 ms</tspan></text><rect x="600" y="322" width="344" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="345.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">≈ 242 785 llamadas recursivas</tspan></text><rect x="10" y="368" width="324" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="391.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">fib(25) con lru_cache (ya calentada)</tspan></text><rect x="340" y="368" width="124" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="391.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">0.123 µs</tspan></text><rect x="470" y="368" width="124" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="391.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">0.084 µs</tspan></text><rect x="600" y="368" width="344" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="391.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">una búsqueda en diccionario</tspan></text><rect x="10" y="416" width="940" height="53.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="437.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Memoizar solo es correcto si la función es pura: mismos argumentos, mismo resultado, sin efectos. Con una función que lee el</tspan></text><text x="480" y="454.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">reloj o un archivo, la caché devuelve datos viejos.</tspan></text><rect x="10" y="477.28" width="940" height="50.72" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="480" y="498.32" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="480" dy="0">Las diferencias entre posicional y por nombre son decenas de nanosegundos: elige por claridad (los parámetros por nombre documentan</tspan></text><text x="480" y="513.68" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="480" dy="0">unidades) y mide solo si un perfilador lo señala.</tspan></text></svg>
