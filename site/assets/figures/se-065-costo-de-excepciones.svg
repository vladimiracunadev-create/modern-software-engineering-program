<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 422" width="960" height="422" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Costo de lanzar una excepción frente a preguntar antes</title><desc id="d">Lanzar y capturar una excepción cuesta 192.1 ns en Windows y 183.7 en Linux; leer una clave ausente con try/except KeyError 196.1 y 174.6 ns; d.get 32.8 y 35.0 ns; la pregunta &#x27;k&#x27; in d 23.3 y 20.8 ns. Un try sin lanzar no se distingue del ruido.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="422" fill="#ffffff"/><text x="20" y="28" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">Nanosegundos por operación (clave ausente en un diccionario vacío)</tspan></text><text x="290" y="63" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">try/except KeyError · Win</tspan></text><rect x="300" y="42" width="451.03" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="759.03" y="63" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="759.03" dy="0">196.1</tspan></text><text x="290" y="101" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">try/except KeyError · Linux</tspan></text><rect x="300" y="80" width="401.58" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="709.58" y="101" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="709.58" dy="0">174.6</tspan></text><text x="290" y="139" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">d.get(k) · Windows</tspan></text><rect x="300" y="118" width="75.44" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="383.44" y="139" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="383.44" dy="0">32.8</tspan></text><text x="290" y="177" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">d.get(k) · Linux</tspan></text><rect x="300" y="156" width="80.5" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="388.5" y="177" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="388.5" dy="0">35.0</tspan></text><text x="290" y="215" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">k in d · Windows</tspan></text><rect x="300" y="194" width="53.59" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="361.59" y="215" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="361.59" dy="0">23.3</tspan></text><text x="290" y="253" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">k in d · Linux</tspan></text><rect x="300" y="232" width="47.84" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="355.84" y="253" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="355.84" dy="0">20.8</tspan></text><rect x="10" y="280" width="940" height="69.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="301.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Un try que no lanza costó 15.5 ns frente a 36.8 ns de la línea de control en Windows y 9.1 frente a 8.5 en Linux: la</tspan></text><text x="480" y="318.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">diferencia cambia de signo, es ruido. No se puede afirmar que try «sea gratis» ni «cueste»: a esta escala el reloj y la carga</tspan></text><text x="480" y="335.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">dominan.</tspan></text><rect x="10" y="357.92" width="940" height="50.72" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="480" y="378.96" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="480" dy="0">Conclusión útil: una excepción cuesta de seis a ocho veces más que preguntar, pero en nanosegundos. Elige por claridad y por si el fallo</tspan></text><text x="480" y="394.32" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="480" dy="0">es excepcional o esperado. Si el caso «ausente» es normal, un resultado explícito expresa mejor la intención.</tspan></text></svg>
