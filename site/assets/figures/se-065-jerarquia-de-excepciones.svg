<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 387" width="960" height="387" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Jerarquía de excepciones: qué captura cada except</title><desc id="d">KeyError desciende de LookupError, Exception y BaseException; FileNotFoundError de OSError; KeyboardInterrupt desciende directamente de BaseException. except Exception no captura KeyboardInterrupt ni SystemExit.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="387" fill="#ffffff"/><rect x="20" y="20" width="200" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="120" y="45.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="120" dy="0">BaseException</tspan></text><rect x="40" y="100" width="180" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="130" y="125.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="130" dy="0">Exception</tspan></text><rect x="300" y="20" width="200" height="44" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="400" y="45.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="400" dy="0">KeyboardInterrupt</tspan></text><rect x="520" y="20" width="140" height="44" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="590" y="45.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="590" dy="0">SystemExit</tspan></text><rect x="40" y="180" width="170" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="125" y="205.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="125" dy="0">LookupError</tspan></text><rect x="40" y="250" width="170" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="125" y="275.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="125" dy="0">KeyError</tspan></text><rect x="260" y="180" width="150" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="335" y="205.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="335" dy="0">OSError</tspan></text><rect x="260" y="250" width="200" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="360" y="275.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="360" dy="0">FileNotFoundError</tspan></text><polyline points="120,100 120,64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="220,42 300,42" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="125,180 125,144" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="125,250 125,224" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="335,180 215,128" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="360,250 350,224" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="560" y="110" width="380" height="150" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="750" y="155.36" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="750" dy="0">Medido: issubclass(KeyboardInterrupt, Exception)</tspan></text><text x="750" y="172" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="750" dy="0">→ False; issubclass(SystemExit, Exception) →</tspan></text><text x="750" y="188.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="750" dy="0">False. Un except Exception: deja pasar Ctrl+C y</tspan></text><text x="750" y="205.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="750" dy="0">sys.exit(); un except: sin tipo o except</tspan></text><text x="750" y="221.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="750" dy="0">BaseException: los traga.</tspan></text><rect x="10" y="320" width="940" height="53.28" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="480" y="341.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="480" dy="0">Capturar la clase concreta (KeyError, FileNotFoundError) documenta qué fallo se espera y deja pasar los demás. El laboratorio</tspan></text><text x="480" y="358.6" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="480" dy="0">captura solo (FileNotFoundError, OSError, UnicodeDecodeError) alrededor de la lectura.</tspan></text></svg>
