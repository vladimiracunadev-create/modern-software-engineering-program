<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 417" width="960" height="417" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Orden de ejecución, encadenamiento y lo que anula un finally</title><desc id="d">En try/except con raise y finally el orden observado fue try, except, finally y luego el llamador. return dentro de finally reemplaza el valor devuelto. raise ... from conserva la causa; una excepción lanzada dentro de un except conserva el contexto implícito. assert desaparece con python -O.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="417" fill="#ffffff"/><rect x="10" y="14" width="314" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="167" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="167" dy="0">Fragmento</tspan></text><rect x="330" y="14" width="284" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="472" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="472" dy="0">Resultado observado</tspan></text><rect x="620" y="14" width="324" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="782" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="782" dy="0">Lectura</tspan></text><rect x="10" y="56" width="314" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="77.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">try → except → raise → finally →</tspan></text><text x="167" y="94.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">llamador</tspan></text><rect x="330" y="56" width="284" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="77.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">orden medido: try, except, finally,</tspan></text><text x="472" y="94.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">caller</tspan></text><rect x="620" y="56" width="324" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="77.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">finally corre aunque la excepción siga</tspan></text><text x="782" y="94.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">viajando</tspan></text><rect x="10" y="115.28" width="314" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="137.24" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">try: return &#x27;try&#x27; finally: return</tspan></text><text x="167" y="153.88" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">&#x27;finally&#x27;</tspan></text><rect x="330" y="115.28" width="284" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="145.56" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">&#x27;finally&#x27;</tspan></text><rect x="620" y="115.28" width="324" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="137.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">return en finally anula el valor y</tspan></text><text x="782" y="153.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">silencia excepciones: no lo uses</tspan></text><rect x="10" y="174.56" width="314" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="204.84" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">raise RuntimeError(...) from e</tspan></text><rect x="330" y="174.56" width="284" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="196.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">__cause__ = ValueError, contexto</tspan></text><text x="472" y="213.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">suprimido</tspan></text><rect x="620" y="174.56" width="324" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="196.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">se conserva la causa original para el</tspan></text><text x="782" y="213.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">diagnóstico</tspan></text><rect x="10" y="233.84" width="314" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="264.12" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">1/0 dentro de un except ValueError</tspan></text><rect x="330" y="233.84" width="284" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="255.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">__context__ = ValueError, __cause__</tspan></text><text x="472" y="272.44" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">= None</tspan></text><rect x="620" y="233.84" width="324" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="255.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">Python encadena automáticamente lo que</tspan></text><text x="782" y="272.44" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">ocurrió mientras se manejaba otro error</tspan></text><rect x="10" y="293.12" width="314" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="323.4" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">python -O con assert False</tspan></text><rect x="330" y="293.12" width="284" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="323.4" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">el assert no se ejecuta</tspan></text><rect x="620" y="293.12" width="324" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="315.08" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">assert verifica supuestos de programador;</tspan></text><text x="782" y="331.72" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">nunca valida datos externos</tspan></text><rect x="10" y="352.4" width="314" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="382.68" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">except* ValueError / except* KeyError</tspan></text><rect x="330" y="352.4" width="284" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="382.68" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">cada grupo recibe su subconjunto</tspan></text><rect x="620" y="352.4" width="324" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="374.36" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">ExceptionGroup agrupa varios fallos</tspan></text><text x="782" y="391" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">simultáneos (Python 3.11 o posterior)</tspan></text></svg>
