<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 472" width="960" height="472" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Buscar un elemento: lista frente a conjunto y diccionario</title><desc id="d">Preguntar si el último elemento está en una lista cuesta 8.41 microsegundos con 1000 elementos, 94.28 con 10000 y 997.55 con 100000 en Windows; en un conjunto o diccionario de 100000 elementos cuesta 77.1 y 78.5 nanosegundos. En Linux la lista de 100000 cuesta 1221.18 µs y el conjunto 69.0 ns.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="472" fill="#ffffff"/><text x="20" y="28" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">Microsegundos por consulta en lista (Windows)</tspan></text><text x="220" y="63" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="220" dy="0">lista, n = 1 000</tspan></text><rect x="230" y="42" width="4.205" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="242.205" y="63" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="242.205" dy="0">8.41 µs</tspan></text><text x="220" y="105" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="220" dy="0">lista, n = 10 000</tspan></text><rect x="230" y="84" width="47.14" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="285.14" y="105" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="285.14" dy="0">94.28 µs</tspan></text><text x="220" y="147" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="220" dy="0">lista, n = 100 000</tspan></text><rect x="230" y="126" width="498.775" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="736.775" y="147" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="736.775" dy="0">997.55 µs</tspan></text><rect x="10" y="180" width="374" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="201.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Estructura (último elemento)</tspan></text><rect x="390" y="180" width="194" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="487" y="201.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="487" dy="0">Windows</tspan></text><rect x="590" y="180" width="194" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="687" y="201.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="687" dy="0">Linux</tspan></text><rect x="10" y="222" width="374" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="245.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">conjunto, n = 100 000</tspan></text><rect x="390" y="222" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">77.1 ns</tspan></text><rect x="590" y="222" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="687" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="687" dy="0">69.0 ns</tspan></text><rect x="10" y="268" width="374" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="291.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">diccionario, n = 100 000</tspan></text><rect x="390" y="268" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="291.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">78.5 ns</tspan></text><rect x="590" y="268" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="687" y="291.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="687" dy="0">67.7 ns</tspan></text><rect x="10" y="314" width="374" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="337.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">lista, n = 100 000</tspan></text><rect x="390" y="314" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="337.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">997 550 ns</tspan></text><rect x="590" y="314" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="687" y="337.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="687" dy="0">1 221 180 ns</tspan></text><rect x="10" y="362" width="940" height="53.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="383.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">La lista crece linealmente (10× elementos ≈ 10× tiempo); el conjunto es casi constante porque busca por hash. Usarlo exige que</tspan></text><text x="480" y="400.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">los elementos sean hashables y paga memoria (siguiente figura).</tspan></text><rect x="10" y="423.28" width="940" height="35.36" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="480" y="444.32" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="480" dy="0">Es el peor caso de la lista (elemento al final). Para n pequeño la lista gana en simplicidad; mide con tus datos antes de optimizar.</tspan></text></svg>
