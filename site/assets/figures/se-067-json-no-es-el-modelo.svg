<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 561" width="960" height="561" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">JSON no es el modelo: ocho comportamientos de json medidos</title><desc id="d">json.dumps escribe NaN salvo que se pida allow_nan=False; json.loads(&#x27;1e999&#x27;) devuelve inf; las claves duplicadas se resuelven con la última; True como clave se convierte en &#x27;true&#x27;; un set o un datetime no son serializables; una tupla vuelve como lista; 100000 corchetes anidados provocan RecursionError.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="561" fill="#ffffff"/><rect x="10" y="14" width="324" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Operación</tspan></text><rect x="340" y="14" width="184" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="432" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="432" dy="0">Resultado medido</tspan></text><rect x="530" y="14" width="414" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="737" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="737" dy="0">Lectura</tspan></text><rect x="10" y="56" width="324" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="86.28" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">json.dumps(float(&#x27;nan&#x27;))</tspan></text><rect x="340" y="56" width="184" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="86.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">NaN</tspan></text><rect x="530" y="56" width="414" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="77.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">no es JSON válido (RFC 8259); allow_nan=False lanza</tspan></text><text x="737" y="94.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">ValueError</tspan></text><rect x="10" y="115.28" width="324" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="138.92" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">json.loads(&#x27;1e999&#x27;)</tspan></text><rect x="340" y="115.28" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="138.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">inf</tspan></text><rect x="530" y="115.28" width="414" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="138.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">un número fuera de rango se vuelve infinito sin avisar</tspan></text><rect x="10" y="161.28" width="324" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="184.92" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">json.loads(&#x27;{&quot;a&quot;:1,&quot;a&quot;:2}&#x27;)</tspan></text><rect x="340" y="161.28" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="184.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">{&#x27;a&#x27;: 2}</tspan></text><rect x="530" y="161.28" width="414" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="184.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">la última clave gana: dos lectores pueden discrepar</tspan></text><rect x="10" y="207.28" width="324" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="237.56" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">json.dumps({True: 1, None: 3})</tspan></text><rect x="340" y="207.28" width="184" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="237.56" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">{&quot;true&quot;: 1, &quot;null&quot;: 3}</tspan></text><rect x="530" y="207.28" width="414" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="229.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">las claves siempre son texto: el tipo original se</tspan></text><text x="737" y="245.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">pierde</tspan></text><rect x="10" y="266.56" width="324" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="290.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">json.dumps((1, 2)) y json.loads</tspan></text><rect x="340" y="266.56" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="290.2" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">[1, 2] → lista</tspan></text><rect x="530" y="266.56" width="414" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="290.2" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">tupla y lista son indistinguibles al volver</tspan></text><rect x="10" y="312.56" width="324" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="342.84" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">json.dumps({1, 2}) / datetime</tspan></text><rect x="340" y="312.56" width="184" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="342.84" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">TypeError</tspan></text><rect x="530" y="312.56" width="414" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="334.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">el formato no tiene tipos para conjuntos ni fechas:</tspan></text><text x="737" y="351.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">hay que decidir una representación</tspan></text><rect x="10" y="371.84" width="324" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="402.12" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">json.dumps(2**70) ida y vuelta</tspan></text><rect x="340" y="371.84" width="184" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="402.12" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">igual</tspan></text><rect x="530" y="371.84" width="414" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="393.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">Python conserva el entero, pero otros lectores lo</tspan></text><text x="737" y="410.44" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">redondean a double</tspan></text><rect x="10" y="431.12" width="324" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="461.4" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">json.loads(&#x27;[&#x27; * 100000 + &#x27;]&#x27; * 100000)</tspan></text><rect x="340" y="431.12" width="184" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="461.4" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">RecursionError</tspan></text><rect x="530" y="431.12" width="414" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="453.08" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">la profundidad es una superficie de ataque: limitar</tspan></text><text x="737" y="469.72" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">tamaño y estructura</tspan></text><rect x="10" y="494.4" width="940" height="53.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="516.36" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">ensure_ascii=True (por defecto) escribe señal como se\u00f1al: el mismo JSON sale idéntico en consolas con codificaciones</tspan></text><text x="480" y="533" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">distintas, y por eso el laboratorio lo usa.</tspan></text></svg>
