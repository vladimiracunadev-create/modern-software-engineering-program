<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 462" width="960" height="462" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un mismo texto de nueve caracteres en cuatro codificaciones</title><desc id="d">El texto &#x27;señal-ñ-✓&#x27; tiene 9 caracteres y ocupa 13 bytes en UTF-8 y 20 en UTF-16; latin-1 y cp1252 no pueden codificar la marca de verificación y fallan en la posición 8. Leer UTF-8 como latin-1 o cp1252 produce &#x27;seÃ±al&#x27;.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="462" fill="#ffffff"/><rect x="10" y="14" width="324" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Operación</tspan></text><rect x="340" y="14" width="194" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="437" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="437" dy="0">Resultado medido</tspan></text><rect x="540" y="14" width="404" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="742" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="742" dy="0">Lectura</tspan></text><rect x="10" y="56" width="324" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">utf-8</tspan></text><rect x="340" y="56" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">13 bytes</tspan></text><rect x="540" y="56" width="404" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">7365c3b1616c… (la ñ ocupa c3 b1)</tspan></text><rect x="10" y="102" width="324" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="125.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">utf-16</tspan></text><rect x="340" y="102" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">20 bytes</tspan></text><rect x="540" y="102" width="404" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">incluye la marca de orden de bytes fffe</tspan></text><rect x="10" y="148" width="324" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="171.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">latin-1</tspan></text><rect x="340" y="148" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">UnicodeEncodeError</tspan></text><rect x="540" y="148" width="404" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">falla en la posición 8: ✓ no existe en latin-1</tspan></text><rect x="10" y="194" width="324" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="217.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">cp1252</tspan></text><rect x="340" y="194" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">UnicodeEncodeError</tspan></text><rect x="540" y="194" width="404" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">falla igual: ✓ no existe en cp1252</tspan></text><rect x="10" y="240" width="324" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="263.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">UTF-8 leído como latin-1 o cp1252</tspan></text><rect x="340" y="240" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">&#x27;seÃ±al&#x27;</tspan></text><rect x="540" y="240" width="404" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">mojibake: dos bytes se leen como dos caracteres</tspan></text><rect x="10" y="286" width="324" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="309.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">b&#x27;\xff&#x27;.decode(&#x27;utf-8&#x27;)</tspan></text><rect x="340" y="286" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">UnicodeDecodeError</tspan></text><rect x="540" y="286" width="404" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">invalid start byte: el dato no es UTF-8</tspan></text><rect x="10" y="332" width="324" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="362.28" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">decode(errors=&#x27;replace&#x27;)</tspan></text><rect x="340" y="332" width="194" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="362.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">&#x27;se�al&#x27;</tspan></text><rect x="540" y="332" width="404" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="353.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">pierde información; surrogateescape sí permite ida y</tspan></text><text x="742" y="370.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">vuelta</tspan></text><rect x="10" y="395.28" width="940" height="53.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="417.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Bytes y texto son tipos distintos: str tiene 9 caracteres, no 13. Toda frontera que lee o escribe debe nombrar la</tspan></text><text x="480" y="433.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">codificación.</tspan></text></svg>
