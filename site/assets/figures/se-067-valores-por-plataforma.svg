<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 475" width="960" height="475" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Valores por defecto que cambian con el sistema operativo</title><desc id="d">En Windows la codificación preferida fue cp1252 y el salto de línea &#x27;\r\n&#x27;; en Linux fue UTF-8 y &#x27;\n&#x27;. open() sin encoding leyó &#x27;seÃ±al&#x27; en Windows y &#x27;señal&#x27; en Linux; write_text escribió b&#x27;a\r\nb\r\n&#x27; en Windows y b&#x27;a\nb\n&#x27; en Linux.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="475" fill="#ffffff"/><rect x="10" y="14" width="444" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="232" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="232" dy="0">Medición</tspan></text><rect x="460" y="14" width="239" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="579.5" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="579.5" dy="0">Windows 11 · Python 3.12.9</tspan></text><rect x="705" y="14" width="239" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="824.5" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="824.5" dy="0">Ubuntu 24.04 (WSL2) · 3.12.3</tspan></text><rect x="10" y="56" width="444" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">locale.getpreferredencoding(False)</tspan></text><rect x="460" y="56" width="239" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="579.5" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="579.5" dy="0">cp1252</tspan></text><rect x="705" y="56" width="239" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="824.5" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="824.5" dy="0">UTF-8</tspan></text><rect x="10" y="102" width="444" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="125.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">os.linesep</tspan></text><rect x="460" y="102" width="239" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="579.5" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="579.5" dy="0">&#x27;\r\n&#x27;</tspan></text><rect x="705" y="102" width="239" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="824.5" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="824.5" dy="0">&#x27;\n&#x27;</tspan></text><rect x="10" y="148" width="444" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="169.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">open(archivo).read() sin encoding de «señal» guardado en</tspan></text><text x="232" y="186.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">UTF-8</tspan></text><rect x="460" y="148" width="239" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="579.5" y="178.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="579.5" dy="0">&#x27;seÃ±al&#x27;</tspan></text><rect x="705" y="148" width="239" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="824.5" y="178.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="824.5" dy="0">&#x27;señal&#x27;</tspan></text><rect x="10" y="207.28" width="444" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="230.92" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Path.write_text(&#x27;a\nb\n&#x27;, encoding=&#x27;utf-8&#x27;)</tspan></text><rect x="460" y="207.28" width="239" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="579.5" y="230.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="579.5" dy="0">b&#x27;a\r\nb\r\n&#x27;</tspan></text><rect x="705" y="207.28" width="239" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="824.5" y="230.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="824.5" dy="0">b&#x27;a\nb\n&#x27;</tspan></text><rect x="10" y="253.28" width="444" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="276.92" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">open(..., newline=&#x27;\n&#x27;) al escribir</tspan></text><rect x="460" y="253.28" width="239" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="579.5" y="276.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="579.5" dy="0">b&#x27;a\nb\n&#x27;</tspan></text><rect x="705" y="253.28" width="239" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="824.5" y="276.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="824.5" dy="0">b&#x27;a\nb\n&#x27;</tspan></text><rect x="10" y="299.28" width="444" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="322.92" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">sys.stdout.encoding (con PYTHONIOENCODING=utf-8)</tspan></text><rect x="460" y="299.28" width="239" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="579.5" y="322.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="579.5" dy="0">utf-8</tspan></text><rect x="705" y="299.28" width="239" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="824.5" y="322.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="824.5" dy="0">utf-8</tspan></text><rect x="10" y="349.28" width="940" height="53.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="371.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Un programa sin encoding explícito funciona en Linux y corrompe datos en Windows: el mismo código, otro resultado. La PEP 686</tspan></text><text x="480" y="387.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">hace UTF-8 el valor por defecto a partir de Python 3.15; hasta entonces hay que declararlo.</tspan></text><rect x="10" y="410.56" width="940" height="50.72" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="480" y="431.6" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="480" dy="0">Sin PYTHONIOENCODING=utf-8 la consola de Windows (cp1252) no pudo imprimir un dígito arábigo-índico durante esta misma práctica:</tspan></text><text x="480" y="446.96" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="480" dy="0">UnicodeEncodeError al escribir, no al calcular.</tspan></text></svg>
