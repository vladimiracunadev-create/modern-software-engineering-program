<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 423" width="960" height="423" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Importaciones: caché, ciclos y sombras, medidos</title><desc id="d">Importar dos veces un módulo ejecuta su cuerpo una sola vez. En un ciclo ma ↔ mb, mb se ejecuta con ma incompleto (hasattr es False); con from-import el ciclo produce ImportError por módulo parcialmente inicializado. Un archivo json.py en el directorio actual oculta al json de la biblioteca estándar; python -I lo evita.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="423" fill="#ffffff"/><rect x="10" y="14" width="274" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="147" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="147" dy="0">Experimento</tspan></text><rect x="290" y="14" width="274" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="427" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="427" dy="0">Resultado medido</tspan></text><rect x="570" y="14" width="374" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="757" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="757" dy="0">Mecanismo</tspan></text><rect x="10" y="56" width="274" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="147" y="86.28" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="147" dy="0">import side, side</tspan></text><rect x="290" y="56" width="274" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="427" y="86.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="427" dy="0">«efecto al importar» una vez</tspan></text><rect x="570" y="56" width="374" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="77.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">sys.modules cachea el módulo: el segundo import</tspan></text><text x="757" y="94.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">no re-ejecuta</tspan></text><rect x="10" y="115.28" width="274" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="147" y="145.56" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="147" dy="0">ma importa mb, mb importa ma</tspan></text><rect x="290" y="115.28" width="274" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="427" y="145.56" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="427" dy="0">mb ve ma sin X (hasattr → False)</tspan></text><rect x="570" y="115.28" width="374" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="137.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">ejecución interrumpida: ma aún no terminó su</tspan></text><text x="757" y="153.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">cuerpo</tspan></text><rect x="10" y="174.56" width="274" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="147" y="196.52" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="147" dy="0">from md import Y / from mc import</tspan></text><text x="147" y="213.16" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="147" dy="0">Z</tspan></text><rect x="290" y="174.56" width="274" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="427" y="196.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="427" dy="0">ImportError: partially initialized</tspan></text><text x="427" y="213.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="427" dy="0">module</tspan></text><rect x="570" y="174.56" width="374" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="196.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">from-import exige el nombre ya definido: el</tspan></text><text x="757" y="213.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">ciclo se vuelve error</tspan></text><rect x="10" y="233.84" width="274" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="147" y="264.12" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="147" dy="0">json.py local + import json</tspan></text><rect x="290" y="233.84" width="274" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="427" y="264.12" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="427" dy="0">se ejecutó «SOMBRA»</tspan></text><rect x="570" y="233.84" width="374" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="255.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">el directorio actual precede a la biblioteca</tspan></text><text x="757" y="272.44" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">estándar en sys.path</tspan></text><rect x="10" y="293.12" width="274" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="147" y="323.4" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="147" dy="0">python -I -c &#x27;import json&#x27;</tspan></text><rect x="290" y="293.12" width="274" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="427" y="323.4" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="427" dy="0">json ok</tspan></text><rect x="570" y="293.12" width="374" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="315.08" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">el modo aislado ignora directorio actual y</tspan></text><text x="757" y="331.72" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">variables PYTHON*</tspan></text><rect x="10" y="356.4" width="940" height="53.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="378.36" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Un efecto al importar (leer un archivo, abrir red) ocurre en el momento y orden menos esperados. El laboratorio importa sin</tspan></text><text x="480" y="395" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">hacer nada y deja los efectos a main().</tspan></text></svg>
