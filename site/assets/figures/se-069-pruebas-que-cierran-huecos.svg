<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 433" width="960" height="433" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cinco pruebas nuevas cierran cinco de los seis mutantes</title><desc id="d">En una copia del laboratorio se añadieron cinco pruebas: frontera exacta del presupuesto, códigos de salida numéricos, hipótesis duplicadas, límite de tamaño con líneas en blanco y elección por información por costo. Con ellas se detectaron cinco de los seis mutantes supervivientes; el sexto, la cota de pasos, es equivalente.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="433" fill="#ffffff"/><rect x="10" y="14" width="614" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="317" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="317" dy="0">Prueba añadida (en una copia, no en el repositorio)</tspan></text><rect x="630" y="14" width="314" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="787" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="787" dy="0">Efecto medido</tspan></text><rect x="10" y="56" width="614" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="317" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="317" dy="0">frontera: 1 + 2 = 3 se acepta y 2 + 2 &gt; 3 se rechaza</tspan></text><rect x="630" y="56" width="314" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="787" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="787" dy="0">mata «&gt; → &gt;=»</tspan></text><rect x="10" y="102" width="614" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="317" y="125.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="317" dy="0">códigos literales 0, 3 y 4 (no constantes)</tspan></text><rect x="630" y="102" width="314" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="787" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="787" dy="0">mata «códigos iguales»</tspan></text><rect x="10" y="148" width="614" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="317" y="171.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="317" dy="0">hipótesis [dns, dns, tls] → duplicate_hypothesis</tspan></text><rect x="630" y="148" width="314" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="787" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="787" dy="0">mata «duplicadas aceptadas»</tspan></text><rect x="10" y="194" width="614" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="317" y="217.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="317" dy="0">1 000 001 líneas en blanco → input_too_large</tspan></text><rect x="630" y="194" width="314" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="787" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="787" dy="0">mata «límite ×10»</tspan></text><rect x="10" y="240" width="614" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="317" y="261.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="317" dy="0">una prueba barata (elimina 1, costo 1) y una cara (elimina 2, costo 10) → se</tspan></text><text x="317" y="278.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="317" dy="0">elige «barato»</tspan></text><rect x="630" y="240" width="314" height="53.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="787" y="270.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="787" dy="0">mata «ignora el costo»</tspan></text><rect x="10" y="299.28" width="614" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="317" y="322.92" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="317" dy="0">cota de pasos + 99</tspan></text><rect x="630" y="299.28" width="314" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="787" y="322.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="787" dy="0">sobrevive: equivalente</tspan></text><rect x="10" y="349.28" width="940" height="69.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="371.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">El último mutante nunca puede ser detectado: la cota es len(probes) y la regla de duplicados falla antes, así que ninguna</tspan></text><text x="480" y="387.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">entrada llega al paso 5. Un mutante equivalente no es un hueco de la suite, y reconocerlo es parte del análisis. Con las cinco</tspan></text><text x="480" y="404.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">pruebas: 20 pruebas, OK (skipped=1).</tspan></text></svg>
