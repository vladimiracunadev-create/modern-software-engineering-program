<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 396" width="960" height="396" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Refactor protegido: extraer _parse_probe de parse_spec</title><desc id="d">Se extrajo el análisis de cada prueba a una función _parse_probe en una copia del laboratorio. parse_spec bajó de 48 líneas y complejidad 26 a 30 líneas y 16; _parse_probe tiene 22 líneas y complejidad 12. La suite pasó antes y después y la salida de la CLI fue idéntica.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="396" fill="#ffffff"/><rect x="10" y="14" width="294" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="157" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="157" dy="0">Medida</tspan></text><rect x="310" y="14" width="294" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="457" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="457" dy="0">Antes</tspan></text><rect x="610" y="14" width="334" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="777" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="777" dy="0">Después</tspan></text><rect x="10" y="56" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">parse_spec</tspan></text><rect x="310" y="56" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">48 líneas · complejidad 26</tspan></text><rect x="610" y="56" width="334" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">30 líneas · complejidad 16</tspan></text><rect x="10" y="102" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="125.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">_parse_probe (nueva)</tspan></text><rect x="310" y="102" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">—</tspan></text><rect x="610" y="102" width="334" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">22 líneas · complejidad 12</tspan></text><rect x="10" y="148" width="294" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="178.28" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">suite del laboratorio</tspan></text><rect x="310" y="148" width="294" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="178.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">15 pruebas · OK (1 omitida)</tspan></text><rect x="610" y="148" width="334" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="169.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">15 pruebas · OK (1 omitida); con las 5</tspan></text><text x="777" y="186.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">añadidas: 20 · OK</tspan></text><rect x="10" y="207.28" width="294" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="229.24" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">salida de la CLI con el caso del</tspan></text><text x="157" y="245.88" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">laboratorio</tspan></text><rect x="310" y="207.28" width="294" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="237.56" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">referencia</tspan></text><rect x="610" y="207.28" width="334" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="237.56" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">idéntica byte a byte</tspan></text><rect x="10" y="270.56" width="940" height="53.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="292.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">El refactor conserva el comportamiento observable: mismos códigos de error, mismo orden de comprobaciones. La complejidad</tspan></text><text x="480" y="309.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">total no desaparece (16 + 12 = 28 frente a 26): se reparte en dos unidades que se leen y se prueban por separado.</tspan></text><rect x="10" y="331.84" width="940" height="50.72" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="352.88" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">La red de seguridad es tan buena como las pruebas: con la suite original, un cambio que alterara la frontera del presupuesto habría</tspan></text><text x="480" y="368.24" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">pasado inadvertido (figura 2 de SE-069).</tspan></text></svg>
