<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" width="960" height="370" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El contrato común: cuatro casos TSV reproducidos con una referencia en Python</title><desc id="d">El archivo contract-cases.tsv tiene cuatro casos. Reimplementados en Python, los cuatro aceptan el costo dentro del presupuesto y conservan las hipótesis esperadas: dns; tls y http; tls; http. El puerto Rust tiene 42 líneas, usa enum, no usa Option ni Result, no declara mut ni unsafe; no se compiló porque rustc no estaba instalado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="370" fill="#ffffff"/><rect x="10" y="14" width="194" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="107" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="107" dy="0">Caso</tspan></text><rect x="210" y="14" width="464" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="442" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="442" dy="0">Entrada</tspan></text><rect x="680" y="14" width="264" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="812" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="812" dy="0">Candidatos conservados</tspan></text><rect x="10" y="56" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">resolve_dns</tspan></text><rect x="210" y="56" width="464" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">presupuesto 5, gastado 0, costo 1, resultado fail</tspan></text><rect x="680" y="56" width="264" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">[dns]</tspan></text><rect x="10" y="102" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="125.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">resolve_not_dns</tspan></text><rect x="210" y="102" width="464" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">presupuesto 5, gastado 0, costo 1, resultado ok</tspan></text><rect x="680" y="102" width="264" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">[tls, http]</tspan></text><rect x="10" y="148" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="171.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">handshake_tls</tspan></text><rect x="210" y="148" width="464" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">presupuesto 5, gastado 1, costo 2, resultado fail</tspan></text><rect x="680" y="148" width="264" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">[tls]</tspan></text><rect x="10" y="194" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="217.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">request_http</tspan></text><rect x="210" y="194" width="464" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">presupuesto 5, gastado 2, costo 3, resultado fail</tspan></text><rect x="680" y="194" width="264" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">[http]</tspan></text><rect x="10" y="244" width="940" height="53.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="265.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Lo que comparten ambos lenguajes es el contrato observable de un núcleo mínimo (filtrar hipótesis), no su arquitectura: el</tspan></text><text x="480" y="282.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">puerto no tiene el parser JSON ni los códigos de salida del paquete Python.</tspan></text><rect x="10" y="305.28" width="940" height="50.72" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="326.32" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Estado de la evidencia: Python ejecutado en Windows y Linux; Rust sin compilar localmente. La prueba</tspan></text><text x="480" y="341.68" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">test_rust_port_compiles_and_matches_shared_contract_cases quedó omitida y la CI de Ubuntu la exige.</tspan></text></svg>
