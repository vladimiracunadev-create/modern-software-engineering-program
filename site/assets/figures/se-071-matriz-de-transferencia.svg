<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 397" width="960" height="397" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué transferir de Python a otro lenguaje: concepto, mecanismo y evidencia común</title><desc id="d">Matriz de cinco conceptos del laboratorio: ausencia, errores esperados, inmutabilidad, iteración perezosa y pruebas. Para cada uno se indica cómo lo resuelve Python en el laboratorio, la construcción equivalente en Rust según su documentación y la evidencia que debe ser la misma en ambos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="397" fill="#ffffff"/><rect x="10" y="14" width="144" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="82" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="82" dy="0">Concepto</tspan></text><rect x="160" y="14" width="254" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="287" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="287" dy="0">Python (laboratorio)</tspan></text><rect x="420" y="14" width="264" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="552" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="552" dy="0">Rust (documentación)</tspan></text><rect x="690" y="14" width="254" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="817" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="817" dy="0">Evidencia común</tspan></text><rect x="10" y="56" width="144" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="86.28" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">ausencia</tspan></text><rect x="160" y="56" width="254" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="86.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="287" dy="0">None; Optional en anotaciones</tspan></text><rect x="420" y="56" width="264" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="86.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">Option&lt;T&gt;</tspan></text><rect x="690" y="56" width="254" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="77.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">mismo caso: observación</tspan></text><text x="817" y="94.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">desconocida</tspan></text><rect x="10" y="115.28" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="138.92" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">fallo esperado</tspan></text><rect x="160" y="115.28" width="254" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="138.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="287" dy="0">Result propio con DomainError</tspan></text><rect x="420" y="115.28" width="264" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="138.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">Result&lt;T, E&gt; estándar</tspan></text><rect x="690" y="115.28" width="254" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="138.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">mismos códigos de rechazo</tspan></text><rect x="10" y="161.28" width="144" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="191.56" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">inmutabilidad</tspan></text><rect x="160" y="161.28" width="254" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="183.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="287" dy="0">dataclass(frozen=True),</tspan></text><text x="287" y="199.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="287" dy="0">frozenset</tspan></text><rect x="420" y="161.28" width="264" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="183.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">bindings inmutables por defecto,</tspan></text><text x="552" y="199.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">mut explícito</tspan></text><rect x="690" y="161.28" width="254" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="191.56" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">ningún caso modifica la entrada</tspan></text><rect x="10" y="220.56" width="144" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="250.84" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">iteración</tspan></text><rect x="160" y="220.56" width="254" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="250.84" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="287" dy="0">generador de líneas JSONL</tspan></text><rect x="420" y="220.56" width="264" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="250.84" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">iteradores perezosos</tspan></text><rect x="690" y="220.56" width="254" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="242.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">misma salida con 0 y N</tspan></text><text x="817" y="259.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">observaciones</tspan></text><rect x="10" y="279.84" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="303.48" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">pruebas</tspan></text><rect x="160" y="279.84" width="254" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="303.48" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="287" dy="0">unittest + casos TSV</tspan></text><rect x="420" y="279.84" width="264" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="303.48" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">cargo test + los mismos TSV</tspan></text><rect x="690" y="279.84" width="254" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="303.48" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">los cuatro casos del contrato</tspan></text><rect x="10" y="329.84" width="940" height="53.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="351.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Se transfiere el modelo (estados representables, errores como valores, contrato observable), no la sintaxis. Si un caso del</tspan></text><text x="480" y="368.44" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">contrato falla en un puerto, hay que decidir si cambió la regla o solo el puerto.</tspan></text></svg>
