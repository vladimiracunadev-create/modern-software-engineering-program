<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 459" width="960" height="459" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Misma expresión, distinta semántica: lo medido en Python y lo documentado en Rust</title><desc id="d">Python midió -7 // 2 = -4, -7 % 2 = 1, enteros de precisión arbitraria (2**63 existe), len(&#x27;señal✓&#x27;) = 6 y round(0.5), round(1.5), round(2.5) = 0, 2, 2. Según la documentación de Rust (no ejecutada aquí) la división entera trunca, el resto toma el signo del dividendo, i32 e i64 tienen rango fijo, str::len cuenta bytes y f64::round redondea alejándose de cero.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="459" fill="#ffffff"/><rect x="10" y="14" width="214" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="117" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="117" dy="0">Pregunta</tspan></text><rect x="230" y="14" width="334" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="397" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="397" dy="0">Python 3.12 (ejecutado)</tspan></text><rect x="570" y="14" width="374" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="757" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="757" dy="0">Rust (solo documentación)</tspan></text><rect x="10" y="56" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="117" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="117" dy="0">-7 // 2 · -7 % 2</tspan></text><rect x="230" y="56" width="334" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">-4 · 1 (medido)</tspan></text><rect x="570" y="56" width="374" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">-7 / 2 = -3 · -7 % 2 = -1 (documentado)</tspan></text><rect x="10" y="102" width="214" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="117" y="132.28" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="117" dy="0">entero grande</tspan></text><rect x="230" y="102" width="334" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="132.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">2**63 = 9223372036854775808 (medido)</tspan></text><rect x="570" y="102" width="374" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="123.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">i64 desborda: pánico en depuración, envoltura en</tspan></text><text x="757" y="140.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">release (documentado)</tspan></text><rect x="10" y="161.28" width="214" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="117" y="191.56" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="117" dy="0">longitud de &#x27;señal✓&#x27;</tspan></text><rect x="230" y="161.28" width="334" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="183.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">len = 6 caracteres; 9 bytes en UTF-8</tspan></text><text x="397" y="199.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">(medido)</tspan></text><rect x="570" y="161.28" width="374" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="183.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">s.len() = 9 bytes; s.chars().count() = 6</tspan></text><text x="757" y="199.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">(documentado)</tspan></text><rect x="10" y="220.56" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="117" y="244.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="117" dy="0">redondeo de 0.5, 1.5, 2.5</tspan></text><rect x="230" y="220.56" width="334" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="244.2" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">0, 2, 2: al par (medido)</tspan></text><rect x="570" y="220.56" width="374" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="244.2" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">1, 2, 3: lejos de cero (documentado)</tspan></text><rect x="10" y="266.56" width="214" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="117" y="296.84" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="117" dy="0">ausencia</tspan></text><rect x="230" y="266.56" width="334" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="296.84" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">None (dict.get devuelve None)</tspan></text><rect x="570" y="266.56" width="374" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="288.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">Option&lt;T&gt;: el compilador obliga a tratar el caso</tspan></text><text x="757" y="305.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">(documentado)</tspan></text><rect x="10" y="325.84" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="117" y="349.48" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="117" dy="0">inf − inf</tspan></text><rect x="230" y="325.84" width="334" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="349.48" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">nan (medido)</tspan></text><rect x="570" y="325.84" width="374" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="349.48" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">NaN en f64 (IEEE 754, documentado)</tspan></text><rect x="10" y="375.84" width="940" height="69.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="397.8" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">rustc y cargo no estaban instalados en Windows ni en WSL2: nada de Rust se compiló ni se ejecutó en esta práctica. La columna</tspan></text><text x="480" y="414.44" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">derecha es una lectura de la documentación oficial y debe verificarse con el compilador (la integración continua del</tspan></text><text x="480" y="431.08" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">repositorio sí lo hace).</tspan></text></svg>
