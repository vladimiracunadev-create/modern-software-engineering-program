<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 551" width="960" height="551" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Catorce invocaciones de la CLI y su contrato de salida (idéntico en Windows y Linux)</title><desc id="d">Se invocó python -m diagnostic_cli con catorce entradas: la ruta feliz y el archivo vacío terminan con 0; la falta de argumentos con 2; JSON roto, NaN, presupuesto true y JSONL roto con 3; prueba no autorizada, repetida y contradictoria con 4; archivo ausente o con bytes no UTF-8 con 5. El código de salida y el flujo coincidieron en ambas plataformas; stdout solo tiene datos en el caso con 0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="551" fill="#ffffff"/><rect x="10" y="14" width="364" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="192" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="192" dy="0">Entrada</tspan></text><rect x="380" y="14" width="84" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="422" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="422" dy="0">Código</tspan></text><rect x="470" y="14" width="474" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="707" y="35.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="707" dy="0">stderr (stdout vacío salvo en 0)</tspan></text><rect x="10" y="56" width="364" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">caso del laboratorio</tspan></text><rect x="380" y="56" width="84" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="422" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="422" dy="0">0</tspan></text><rect x="470" y="56" width="474" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="707" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">JSON de 616 bytes · resolved · [tls]</tspan></text><rect x="10" y="102" width="364" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="125.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">observaciones vacías</tspan></text><rect x="380" y="102" width="84" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="422" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="422" dy="0">0</tspan></text><rect x="470" y="102" width="474" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="707" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">JSON inconcluso · candidatos dns, tls, http</tspan></text><rect x="10" y="148" width="364" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="171.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">sin argumentos / un argumento</tspan></text><rect x="380" y="148" width="84" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="422" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="422" dy="0">2</tspan></text><rect x="470" y="148" width="474" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="707" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">argparse: «required: spec, observations»</tspan></text><rect x="10" y="194" width="364" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="217.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">spec JSON roto · NaN · budget true</tspan></text><rect x="380" y="194" width="84" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="422" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="422" dy="0">3</tspan></text><rect x="470" y="194" width="474" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="707" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">invalid_json · invalid_json · invalid_budget</tspan></text><rect x="10" y="240" width="364" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="263.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">JSONL con la línea 2 rota</tspan></text><rect x="380" y="240" width="84" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="422" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="422" dy="0">3</tspan></text><rect x="470" y="240" width="474" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="707" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">«línea 2: Expecting property name…»</tspan></text><rect x="10" y="286" width="364" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="307.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">prueba no autorizada · repetida ·</tspan></text><text x="192" y="324.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">contradictoria</tspan></text><rect x="380" y="286" width="84" height="53.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="422" y="316.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="422" dy="0">4</tspan></text><rect x="470" y="286" width="474" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="707" y="307.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">unauthorized_test · duplicate_observation ·</tspan></text><text x="707" y="324.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">contradictory_observation</tspan></text><rect x="10" y="345.28" width="364" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="367.24" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">spec ausente · observaciones ausentes · bytes</tspan></text><text x="192" y="383.88" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">no UTF-8</tspan></text><rect x="380" y="345.28" width="84" height="53.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="422" y="375.56" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="422" dy="0">5</tspan></text><rect x="470" y="345.28" width="474" height="53.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="707" y="375.56" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">not_found · observation_io · observation_io</tspan></text><rect x="10" y="408.56" width="940" height="69.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="430.52" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Hallazgo de privacidad: en los casos de archivo ausente o JSON roto, stderr incluía la ruta absoluta del archivo, y en este</tspan></text><text x="480" y="447.16" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">equipo esa ruta contenía el nombre de usuario del sistema. Un mensaje de error no debería filtrar rutas locales si el</tspan></text><text x="480" y="463.8" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">resultado se pega en un informe público; aquí se omitió de la figura.</tspan></text><rect x="10" y="486.48" width="940" height="50.72" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="480" y="507.52" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="480" dy="0">El caso «más de 1 MB de observaciones válidas» terminó con 4 (duplicate_observation), no con el límite de tamaño: la regla del dominio</tspan></text><text x="480" y="522.88" font-size="12" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="480" dy="0">actúa antes de llegar a 1 MB.</tspan></text></svg>
