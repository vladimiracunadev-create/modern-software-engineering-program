<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 386" width="940" height="386" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Costo de aislar estado: copia superficial frente a copia profunda de un diccionario de mil claves con listas</title><desc id="d">Barras agrupadas en escala logarítmica con el costo de copiar un diccionario de mil claves con listas: la copia superficial tarda unos 9,7 microsegundos en Windows y 9,6 en Linux; deepcopy tarda unos 4 900 en Windows y 4 100 en Linux; la asignación b igual a a no cuesta nada porque solo crea un nombre nuevo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="386" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Costo de aislar estado: copia superficial frente a copia profunda de un diccionario de mil claves con listas</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Windows</tspan></text><rect x="116.78" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="136.78" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="136.78" dy="0">Linux</tspan></text><line x1="354" y1="77" x2="354" y2="205" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="205" x2="354" y2="210" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="226" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">1</tspan></text><line x1="484.425" y1="77" x2="484.425" y2="205" stroke="#d5dde1" stroke-width="1"/><line x1="484.425" y1="205" x2="484.425" y2="210" stroke="#5b7280" stroke-width="1.4"/><text x="484.425" y="226" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="484.425" dy="0">10</tspan></text><line x1="614.85" y1="77" x2="614.85" y2="205" stroke="#d5dde1" stroke-width="1"/><line x1="614.85" y1="205" x2="614.85" y2="210" stroke="#5b7280" stroke-width="1.4"/><text x="614.85" y="226" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="614.85" dy="0">100</tspan></text><line x1="745.275" y1="77" x2="745.275" y2="205" stroke="#d5dde1" stroke-width="1"/><line x1="745.275" y1="205" x2="745.275" y2="210" stroke="#5b7280" stroke-width="1.4"/><text x="745.275" y="226" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="745.275" dy="0">1 000</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="205" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="205" x2="875.7" y2="210" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="226" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">10 000</tspan></text><line x1="354" y1="205" x2="875.7" y2="205" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="105" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">dict(a) o copy.copy(a): otro contenedor,</tspan></text><text x="344" y="122" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">mismas listas internas</tspan></text><text x="344" y="169" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">copy.deepcopy(a): copia recursiva, todo</tspan></text><text x="344" y="186" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">aislado</tspan></text><rect x="354" y="83" width="128.7" height="24.5" rx="3" fill="#946512"/><text x="489.7" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="489.7" dy="0">9,7</tspan></text><rect x="354" y="110.5" width="128.113" height="24.5" rx="3" fill="#087f8c"/><text x="489.113" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="489.113" dy="0">9,6</tspan></text><rect x="354" y="147" width="481.294" height="24.5" rx="3" fill="#946512"/><text x="842.294" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="842.294" dy="0">4 900</tspan></text><rect x="354" y="174.5" width="471.197" height="24.5" rx="3" fill="#087f8c"/><text x="832.197" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="832.197" dy="0">4 100</tspan></text><text x="614.85" y="249" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="614.85" dy="0">Microsegundos por copia (escala logarítmica)</tspan></text><rect x="10" y="263" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="287.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">b = a no copia nada: comparte todo. La copia superficial comparte las listas internas; deepcopy las aísla y cuesta unas 500</tspan></text><text x="470" y="304.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">veces más. Una función que devuelve estado nuevo cuesta según lo que copie. Aislar estado es una decisión de costo, no un</tspan></text><text x="470" y="321.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">hábito gratuito.</tspan></text><text x="470" y="368.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12 en un equipo concreto; las magnitudes cambian con la máquina, el orden relativo es lo que importa.</tspan></text></svg>
