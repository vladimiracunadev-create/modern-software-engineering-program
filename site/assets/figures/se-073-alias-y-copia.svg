<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Alias, copia superficial y copia profunda sobre el mismo diccionario</title><desc id="d">Tabla de cuatro operaciones sobre un diccionario con listas internas: la asignación comparte todo; copy.copy crea otro contenedor pero comparte las listas internas; deepcopy aísla todo y cuesta unos 4,9 ms frente a unos 9,7 microsegundos de la copia superficial en mil claves.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="430" fill="#ffffff"/><rect x="10" y="12" width="234" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="127" y="38.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="127" dy="0">Operación</tspan></text><rect x="250" y="12" width="154" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="327" y="38.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="327" dy="0">¿Mismo objeto?</tspan></text><rect x="410" y="12" width="294" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="557" y="38.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="557" dy="0">¿Comparte lo interno?</tspan></text><rect x="710" y="12" width="234" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="827" y="30.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="827" dy="0">Costo (1000 claves con</tspan></text><text x="827" y="46.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="827" dy="0">listas)</tspan></text><rect x="10" y="64" width="234" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="127" y="98.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="127" dy="0">b = a</tspan></text><rect x="250" y="64" width="154" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="98.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="327" dy="0">Sí (a is b)</tspan></text><rect x="410" y="64" width="294" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="98.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">Sí, todo</tspan></text><rect x="710" y="64" width="234" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="98.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">Ninguno: solo un nombre nuevo</tspan></text><rect x="10" y="132" width="234" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="127" y="166.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="127" dy="0">dict(a) / copy.copy(a)</tspan></text><rect x="250" y="132" width="154" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="166.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="327" dy="0">No</tspan></text><rect x="410" y="132" width="294" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="166.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">Sí: las listas internas son las mismas</tspan></text><rect x="710" y="132" width="234" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="158.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">≈ 9,7 µs (Windows) y 9,6 µs</tspan></text><text x="827" y="174.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">(Linux)</tspan></text><rect x="10" y="200" width="234" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="127" y="234.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="127" dy="0">copy.deepcopy(a)</tspan></text><rect x="250" y="200" width="154" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="234.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="327" dy="0">No</tspan></text><rect x="410" y="200" width="294" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="234.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">No: copia recursiva</tspan></text><rect x="710" y="200" width="234" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="226.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">≈ 4,9 ms (Windows) y 4,1 ms</tspan></text><text x="827" y="242.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">(Linux)</tspan></text><rect x="10" y="268" width="234" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="127" y="294.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="127" dy="0">Función que devuelve estado</tspan></text><text x="127" y="310.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="127" dy="0">nuevo</tspan></text><rect x="250" y="268" width="154" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="302.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="327" dy="0">No</tspan></text><rect x="410" y="268" width="294" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="302.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">Solo lo que se copie a propósito</tspan></text><rect x="710" y="268" width="234" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="302.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">Depende de qué se copie</tspan></text><rect x="10" y="332" width="940" height="52" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="353.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Copiar en profundidad cuesta unas 500 veces más que copiar en superficie. Aislar estado es una decisión de costo, no un hábito</tspan></text><text x="480" y="369.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">gratuito.</tspan></text><text x="480" y="412" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Medido con CPython 3.12 en un equipo concreto; las magnitudes cambian con la máquina, el orden relativo es lo que importa.</tspan></text></svg>
