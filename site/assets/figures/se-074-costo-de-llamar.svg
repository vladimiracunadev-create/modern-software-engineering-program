<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 350" width="940" height="350" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Costo de extraer una función: el mismo bucle en línea y llamando a una función</title><desc id="d">Barras por iteración: en Windows el bucle en línea tarda unos 105 ns y con una llamada a función unos 161 ns; en Linux unos 96 ns y 134 ns. La llamada añade entre 40 % y 54 %, que es costo fijo por llamada, no por línea.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="350" fill="#ffffff"/><text x="20" y="28" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">Nanosegundos por iteración (mediana de siete repeticiones)</tspan></text><text x="220" y="65" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="220" dy="0">Windows, en línea</tspan></text><rect x="230" y="44" width="355.64" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="593.64" y="65" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="593.64" dy="0">105 ns</tspan></text><text x="220" y="111" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="220" dy="0">Windows, con función</tspan></text><rect x="230" y="90" width="546.72" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="784.72" y="111" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="784.72" dy="0">161 ns</tspan></text><text x="220" y="157" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="220" dy="0">Linux, en línea</tspan></text><rect x="230" y="136" width="325.72" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="563.72" y="157" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="563.72" dy="0">96 ns</tspan></text><text x="220" y="203" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="220" dy="0">Linux, con función</tspan></text><rect x="230" y="182" width="455.26" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="693.26" y="203" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="693.26" dy="0">134 ns</tspan></text><rect x="20" y="238" width="900" height="64" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="265.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La extracción cuesta decenas de nanosegundos por llamada. Solo domina si la función hace muy poco trabajo y se invoca</tspan></text><text x="470" y="281.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">millones de veces; en el resto de los casos la claridad de un contrato estrecho pesa más.</tspan></text><text x="470" y="336" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12 en un equipo concreto; las magnitudes cambian con la máquina, el orden relativo es lo que importa.</tspan></text></svg>
