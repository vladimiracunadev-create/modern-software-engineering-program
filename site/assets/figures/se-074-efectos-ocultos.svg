<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 414" width="940" height="414" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Efectos ocultos en funciones: caché de una función con efecto y paso de objetos</title><desc id="d">Diagrama de tres experimentos: al envolver con lru_cache una función que registra un efecto, tres llamadas producen un solo efecto; una función que añade a la lista recibida modifica la lista del llamador mientras reasignar el parámetro no; y una función pura se puede memoizar sin cambiar su significado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="414" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Efectos ocultos en funciones: caché de una función con efecto y paso de objetos</tspan></text><text x="159" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="159" dy="0">Experimento</tspan></text><text x="455" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="455" dy="0">Resultado ejecutado</tspan></text><text x="751" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="751" dy="0">Consecuencia para el diseño</tspan></text><rect x="14" y="71" width="290" height="71.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="159" y="93.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="159" dy="0">impure(x) agrega a una lista y</tspan></text><text x="159" y="110.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="159" dy="0">devuelve x + 1; con lru_cache; tres</tspan></text><text x="159" y="127.24" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="159" dy="0">llamadas con 1</tspan></text><polyline points="308,106.96 326,106.96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="330" y="71" width="250" height="71.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="455" y="102.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="455" dy="0">1 efecto registrado en 3</tspan></text><text x="455" y="118.92" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="455" dy="0">llamadas</tspan></text><polyline points="584,106.96 602,106.96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="606" y="71" width="290" height="71.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="751" y="93.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="751" dy="0">Memoizar una función con efecto</tspan></text><text x="751" y="110.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="751" dy="0">cambia el comportamiento; solo es</tspan></text><text x="751" y="127.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="751" dy="0">válido si es pura</tspan></text><rect x="14" y="154.92" width="290" height="71.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="159" y="186.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="159" dy="0">mut(l): l.append(1) y rebind(l): l =</tspan></text><text x="159" y="202.84" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="159" dy="0">[9]</tspan></text><polyline points="308,190.88 326,190.88" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="330" y="154.92" width="250" height="71.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="455" y="186.2" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455" dy="0">Tras ambas, la lista del</tspan></text><text x="455" y="202.84" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455" dy="0">llamador es [1]</tspan></text><polyline points="584,190.88 602,190.88" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="606" y="154.92" width="290" height="71.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="751" y="177.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="751" dy="0">Los argumentos pasan por referencia</tspan></text><text x="751" y="194.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="751" dy="0">al objeto: mutar se ve, reasignar el</tspan></text><text x="751" y="211.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="751" dy="0">nombre local no</tspan></text><rect x="14" y="238.84" width="290" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="159" y="261.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="159" dy="0">pure(x) = x + 1 con la misma</tspan></text><text x="159" y="278.44" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="159" dy="0">envoltura</tspan></text><polyline points="308,266.48 326,266.48" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="330" y="238.84" width="250" height="55.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="455" y="270.12" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="455" dy="0">Mismo resultado con y sin caché</tspan></text><polyline points="584,266.48 602,266.48" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="606" y="238.84" width="290" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="751" y="261.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="751" dy="0">La pureza es lo que permite sustituir</tspan></text><text x="751" y="278.44" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="751" dy="0">una llamada por su resultado</tspan></text><rect x="10" y="312.12" width="920" height="54" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="342.76" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Un contrato de procedimiento debe declarar si lee, escribe o solo calcula.</tspan></text><text x="470" y="396.12" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12 en un equipo concreto; las magnitudes cambian con la máquina, el orden relativo es lo que importa.</tspan></text></svg>
