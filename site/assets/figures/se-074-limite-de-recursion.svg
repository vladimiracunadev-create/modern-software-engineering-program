<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El límite de recursión de CPython frente a una descomposición recursiva</title><desc id="d">Tabla: con el límite por defecto de 1000 la recursión se detiene en profundidad 998 con RecursionError; elevando el límite a 100000 una recursión de 50000 niveles funciona en ambos sistemas; una iteración con pila explícita no depende del límite.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="400" fill="#ffffff"/><rect x="10" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="132" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="132" dy="0">Situación</tspan></text><rect x="260" y="12" width="354" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="437" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="437" dy="0">Resultado observado</tspan></text><rect x="620" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="782" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="782" dy="0">Lectura</tspan></text><rect x="10" y="56" width="244" height="86" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="102.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Límite por defecto</tspan></text><rect x="260" y="56" width="354" height="86" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="94.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">sys.getrecursionlimit() = 1000; se alcanzó</tspan></text><text x="437" y="110.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">profundidad 998</tspan></text><rect x="620" y="56" width="324" height="86" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="94.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">La pila de llamadas es un recurso finito</tspan></text><text x="782" y="110.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">con tope configurable</tspan></text><rect x="10" y="148" width="244" height="86" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="186.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Límite elevado a 100000,</tspan></text><text x="132" y="202.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">recursión de 50000</tspan></text><rect x="260" y="148" width="354" height="86" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="194.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">Devolvió 50000 en Windows y en Linux</tspan></text><rect x="620" y="148" width="324" height="86" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">Funciona, pero el tope existe para</tspan></text><text x="782" y="194.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">proteger el proceso de agotar la pila de</tspan></text><text x="782" y="211.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">C</tspan></text><rect x="10" y="240" width="244" height="86" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="278.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Cuenta atrás con bucle y</tspan></text><text x="132" y="294.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">acumulador</tspan></text><rect x="260" y="240" width="354" height="86" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="286.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">Sin límite de profundidad</tspan></text><rect x="620" y="240" width="324" height="86" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="278.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">Cuando la descomposición es lineal, un</tspan></text><text x="782" y="294.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">bucle es más seguro</tspan></text><rect x="10" y="328" width="940" height="52" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="349.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">El límite se eleva con sys.setrecursionlimit, pero un valor excesivo puede cerrar el intérprete en vez de lanzar</tspan></text><text x="480" y="365.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">RecursionError.</tspan></text></svg>
