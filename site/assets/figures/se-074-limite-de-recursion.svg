<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 402" width="940" height="402" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El límite de recursión de CPython frente a una descomposición recursiva</title><desc id="d">Diagrama de tres situaciones: con el límite por defecto de 1000 la recursión se detiene en profundidad 998 con RecursionError; elevando el límite a 100000 una recursión de 50000 niveles funciona en ambos sistemas; una iteración con pila explícita no depende del límite.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="402" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">El límite de recursión de CPython frente a una descomposición recursiva</tspan></text><text x="144" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="144" dy="0">Situación</tspan></text><text x="450" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="450" dy="0">Resultado observado</tspan></text><text x="771" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="771" dy="0">Lectura</tspan></text><rect x="14" y="71" width="260" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="144" y="102.28" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="144" dy="0">Límite por defecto</tspan></text><polyline points="278,98.64 296,98.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="300" y="71" width="300" height="55.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="450" y="93.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">sys.getrecursionlimit() = 1000; se</tspan></text><text x="450" y="110.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">alcanzó profundidad 998</tspan></text><polyline points="604,98.64 622,98.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="626" y="71" width="290" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="771" y="93.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="771" dy="0">La pila de llamadas es un recurso</tspan></text><text x="771" y="110.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="771" dy="0">finito con tope configurable</tspan></text><rect x="14" y="138.28" width="260" height="71.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="144" y="169.56" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="144" dy="0">Límite elevado a 100000,</tspan></text><text x="144" y="186.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="144" dy="0">recursión de 50000</tspan></text><polyline points="278,174.24 296,174.24" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="300" y="138.28" width="300" height="71.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="450" y="177.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="450" dy="0">Devolvió 50000 en Windows y en Linux</tspan></text><polyline points="604,174.24 622,174.24" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="626" y="138.28" width="290" height="71.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="771" y="161.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="771" dy="0">Funciona, pero el tope existe para</tspan></text><text x="771" y="177.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="771" dy="0">proteger el proceso de agotar la pila</tspan></text><text x="771" y="194.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="771" dy="0">de C</tspan></text><rect x="14" y="222.2" width="260" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="144" y="245.16" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="144" dy="0">Cuenta atrás con bucle y</tspan></text><text x="144" y="261.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="144" dy="0">acumulador</tspan></text><polyline points="278,249.84 296,249.84" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="300" y="222.2" width="300" height="55.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="450" y="253.48" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="450" dy="0">Sin límite de profundidad</tspan></text><polyline points="604,249.84 622,249.84" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="626" y="222.2" width="290" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="771" y="245.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="771" dy="0">Cuando la descomposición es lineal,</tspan></text><text x="771" y="261.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="771" dy="0">un bucle es más seguro</tspan></text><rect x="10" y="295.48" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="320.44" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El límite se eleva con sys.setrecursionlimit, pero un valor excesivo puede cerrar el intérprete en vez de lanzar</tspan></text><text x="470" y="337.08" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">RecursionError.</tspan></text><text x="470" y="384.76" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12 en un equipo concreto; las magnitudes cambian con la máquina, el orden relativo es lo que importa.</tspan></text></svg>
