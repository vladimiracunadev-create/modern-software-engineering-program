<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Herencia en diamante y encapsulación: lo que garantiza el lenguaje y lo que es convención</title><desc id="d">Diagrama: la clase D hereda de B y C que heredan de A; el orden de resolución observado es D, B, C, A, object y D().m() devuelve «DBCA». Debajo, tres mecanismos de encapsulación y su resultado: property sin setter falla, el guion bajo es convención y el prefijo doble guion bajo cambia el nombre a _M__x.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="440" fill="#ffffff"/><rect x="400" y="14" width="160" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="480" y="37.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="480" dy="0">A: m() → «A»</tspan></text><rect x="260" y="84" width="160" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="340" y="107.36" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="340" dy="0">B(A): «B» + super()</tspan></text><rect x="540" y="84" width="160" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="620" y="107.36" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="620" dy="0">C(A): «C» + super()</tspan></text><rect x="400" y="154" width="160" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="169.68" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">D(B, C): «D» +</tspan></text><text x="480" y="185.04" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">super()</tspan></text><polyline points="340,84 440,54" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="620,84 520,54" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="440,154 340,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="520,154 620,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="780" y="112" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="780" dy="0">MRO observado:</tspan></text><text x="780" y="132" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="780" dy="0">D, B, C, A, object</tspan></text><text x="780" y="152" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="780" dy="0">D().m() = «DBCA»</tspan></text><text x="140" y="232" font-size="13" text-anchor="middle" font-weight="700" fill="#5c6b73"><tspan x="140" dy="0">Mecanismo</tspan></text><text x="460" y="232" font-size="13" text-anchor="middle" font-weight="700" fill="#5c6b73"><tspan x="460" dy="0">Resultado ejecutado</tspan></text><text x="795" y="232" font-size="13" text-anchor="middle" font-weight="700" fill="#5c6b73"><tspan x="795" dy="0">Garantía real</tspan></text><rect x="15" y="244" width="250" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="140" y="270.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="140" dy="0">property sin setter</tspan></text><polyline points="268,267 287,267" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="290" y="244" width="340" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="460" y="270.36" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="460" dy="0">a.bal = 99 → AttributeError</tspan></text><polyline points="633,267 652,267" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="655" y="244" width="280" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="795" y="270.36" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="795" dy="0">Impide la asignación por ese nombre</tspan></text><rect x="15" y="302" width="250" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="140" y="328.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="140" dy="0">_bal con guion bajo</tspan></text><polyline points="268,325 287,325" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="290" y="302" width="340" height="46" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="460" y="328.36" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">a._bal = -100 acepta el valor</tspan></text><polyline points="633,325 652,325" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="655" y="302" width="280" height="46" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="795" y="328.36" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="795" dy="0">Ninguna: es una convención</tspan></text><rect x="15" y="360" width="250" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="140" y="386.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="140" dy="0">__x con doble guion bajo</tspan></text><polyline points="268,383 287,383" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="290" y="360" width="340" height="46" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="460" y="386.36" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="460" dy="0">El atributo se guarda como _M__x</tspan></text><polyline points="633,383 652,383" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="655" y="360" width="280" height="46" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="795" y="386.36" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="795" dy="0">Evita colisiones, no es seguridad</tspan></text></svg>
