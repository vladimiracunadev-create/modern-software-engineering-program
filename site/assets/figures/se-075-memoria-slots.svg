<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 340" width="940" height="340" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Memoria por objeto: instancia con diccionario frente a __slots__</title><desc id="d">Barras con 100000 objetos de tres atributos: unos 96 bytes por objeto con diccionario de atributos y unos 64 bytes con __slots__, es decir 9378 KiB frente a 6250 KiB, igual en Windows y en Linux.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="340" fill="#ffffff"/><text x="20" y="28" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">Bytes por objeto (tracemalloc, 100000 objetos con tres atributos)</tspan></text><text x="230" y="71" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="230" dy="0">Clase normal (dict)</tspan></text><rect x="240" y="50" width="422.4" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="670.4" y="71" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="670.4" dy="0">96 B (9378 KiB)</tspan></text><text x="230" y="123" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="230" dy="0">Clase con __slots__</tspan></text><rect x="240" y="102" width="281.6" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="529.6" y="123" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="529.6" dy="0">64 B (6250 KiB)</tspan></text><rect x="20" y="178" width="900" height="78" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="212.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">__slots__ ahorra un tercio de la memoria, pero impide crear atributos nuevos en la instancia y complica la herencia</tspan></text><text x="470" y="228.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">múltiple. Es una optimización medida, no una regla de diseño.</tspan></text><text x="470" y="306" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12 en un equipo concreto; las magnitudes cambian con la máquina, el orden relativo es lo que importa.</tspan></text></svg>
