<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 320" width="940" height="320" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres formas de codificar la misma decisión y su costo por evaluación</title><desc id="d">Barras en nanosegundos: en Windows una cadena de condiciones tarda unos 363 ns, una tabla de decisión 585 ns y un motor con reglas como datos unos 2817 ns; en Linux 259, 450 y 1490 ns. El motor cuesta 5 a 8 veces más y a cambio las reglas se pueden listar, probar y cambiar sin editar código.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="320" fill="#ffffff"/><text x="20" y="28" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">Nanosegundos por decisión (mediana)</tspan></text><text x="230" y="65" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="230" dy="0">Win · cadena if</tspan></text><rect x="240" y="44" width="43.56" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="291.56" y="65" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="291.56" dy="0">363 ns</tspan></text><text x="230" y="109" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="230" dy="0">Win · tabla</tspan></text><rect x="240" y="88" width="70.2" height="30" rx="3" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="318.2" y="109" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="318.2" dy="0">585 ns</tspan></text><text x="230" y="153" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="230" dy="0">Win · motor de reglas</tspan></text><rect x="240" y="132" width="338.04" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="586.04" y="153" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="586.04" dy="0">2817 ns</tspan></text><text x="230" y="197" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="230" dy="0">Linux · cadena if</tspan></text><rect x="240" y="176" width="31.08" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="279.08" y="197" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="279.08" dy="0">259 ns</tspan></text><text x="230" y="241" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="230" dy="0">Linux · tabla</tspan></text><rect x="240" y="220" width="54" height="30" rx="3" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="302" y="241" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="302" dy="0">450 ns</tspan></text><text x="230" y="285" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="230" dy="0">Linux · motor de reglas</tspan></text><rect x="240" y="264" width="178.8" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="426.8" y="285" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="426.8" dy="0">1490 ns</tspan></text></svg>
