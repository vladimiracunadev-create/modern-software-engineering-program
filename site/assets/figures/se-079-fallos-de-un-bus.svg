<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 453" width="940" height="453" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro fallos típicos de un bus de eventos ejecutados, de la causa a la lectura</title><desc id="d">Diagrama de cuatro experimentos: si el segundo de tres manejadores lanza una excepción el tercero nunca corre; un manejador que emite el mismo evento llega a profundidad 5; sin identificador de evento una entrega duplicada suma 13 en vez de 8; y una excepción dentro de una tarea no esperada queda guardada en la tarea sin interrumpir al resto.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="453" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuatro fallos típicos de un bus de eventos ejecutados, de la causa a la lectura</tspan></text><text x="159" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="159" dy="0">Experimento</tspan></text><text x="460" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="460" dy="0">Resultado ejecutado</tspan></text><text x="766" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="766" dy="0">Lectura</tspan></text><rect x="14" y="71" width="290" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="159" y="93.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="159" dy="0">Tres manejadores; el segundo lanza</tspan></text><text x="159" y="110.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="159" dy="0">RuntimeError</tspan></text><polyline points="308,98.64 326,98.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="330" y="71" width="260" height="55.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="460" y="93.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">El registro quedó [h1]; h3 nunca</tspan></text><text x="460" y="110.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">corrió</tspan></text><polyline points="594,98.64 612,98.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="616" y="71" width="300" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="766" y="93.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="766" dy="0">Un despachador síncrono ligado a sus</tspan></text><text x="766" y="110.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="766" dy="0">manejadores propaga el fallo al emisor</tspan></text><rect x="14" y="138.28" width="290" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="159" y="161.24" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="159" dy="0">Un manejador de «y» vuelve a emitir</tspan></text><text x="159" y="177.88" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="159" dy="0">«y»</tspan></text><polyline points="308,165.92 326,165.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="330" y="138.28" width="260" height="55.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="460" y="169.56" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">Profundidad máxima de 5</tspan></text><polyline points="594,165.92 612,165.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="616" y="138.28" width="300" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="766" y="161.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="766" dy="0">Sin límite ni cola, la reentrada es</tspan></text><text x="766" y="177.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="766" dy="0">recursión disfrazada</tspan></text><rect x="14" y="205.56" width="290" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="159" y="228.52" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="159" dy="0">Eventos e1 (5), e1 (5), e2 (3): el</tspan></text><text x="159" y="245.16" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="159" dy="0">primero entregado dos veces</tspan></text><polyline points="308,233.2 326,233.2" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="330" y="205.56" width="260" height="55.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="460" y="228.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="460" dy="0">Suma 13 sin id; 8 con id de</tspan></text><text x="460" y="245.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="460" dy="0">evento</tspan></text><polyline points="594,233.2 612,233.2" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="616" y="205.56" width="300" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="766" y="228.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="766" dy="0">Con entrega «al menos una vez» el</tspan></text><text x="766" y="245.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="766" dy="0">consumidor debe ser idempotente</tspan></text><rect x="14" y="272.84" width="290" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="159" y="295.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="159" dy="0">Tarea creada con create_task que</tspan></text><text x="159" y="312.44" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="159" dy="0">lanza ValueError y nadie la espera</tspan></text><polyline points="308,300.48 326,300.48" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="330" y="272.84" width="260" height="55.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="460" y="295.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="460" dy="0">La tarea terminó con la</tspan></text><text x="460" y="312.44" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="460" dy="0">excepción guardada</tspan></text><polyline points="594,300.48 612,300.48" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="616" y="272.84" width="300" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="766" y="295.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="766" dy="0">Si nadie la consulta, el error aparece</tspan></text><text x="766" y="312.44" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="766" dy="0">tarde o nunca como un aviso</tspan></text><rect x="10" y="346.12" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="371.08" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los cuatro fallos pasan en silencio o tarde: la propagación de la excepción, la reentrada, la entrega duplicada y la tarea</tspan></text><text x="470" y="387.72" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">sin esperar no avisan en el momento en que ocurren.</tspan></text><text x="470" y="435.4" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12 en un equipo concreto; las magnitudes cambian con la máquina, el orden relativo es lo que importa.</tspan></text></svg>
