<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" width="940" height="380" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Costo de ejecutar la misma decisión según el paradigma</title><desc id="d">Barras en nanosegundos por decisión en Windows: imperativo unos 700, funcional 2035, objetos 2255, declarativo 4820 y lógico 17818; en Linux 1333, 1617, 1856, 2898 y 8375. El orden relativo se mantiene en lo grueso pero las magnitudes varían entre ejecuciones.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="380" fill="#ffffff"/><text x="20" y="28" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">Nanosegundos por decisión en Windows (caso 900 ms, autorizado, mediana)</tspan></text><text x="200" y="65" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="200" dy="0">Imperativo</tspan></text><rect x="210" y="44" width="21" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="239" y="65" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="239" dy="0">700</tspan></text><text x="200" y="111" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="200" dy="0">Funcional</tspan></text><rect x="210" y="90" width="61.05" height="30" rx="3" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="279.05" y="111" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="279.05" dy="0">2035</tspan></text><text x="200" y="157" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="200" dy="0">Objetos</tspan></text><rect x="210" y="136" width="67.65" height="30" rx="3" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="285.65" y="157" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="285.65" dy="0">2255</tspan></text><text x="200" y="203" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="200" dy="0">Declarativo</tspan></text><rect x="210" y="182" width="144.6" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="362.6" y="203" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="362.6" dy="0">4820</tspan></text><text x="200" y="249" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="200" dy="0">Lógico (cláusulas)</tspan></text><rect x="210" y="228" width="534.54" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="752.54" y="249" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="752.54" dy="0">17 818</tspan></text><rect x="20" y="288" width="900" height="64" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="315.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">En Linux el orden fue el mismo, con 1333, 1617, 1856, 2898 y 8375 ns. La interpretación de reglas o cláusulas paga una</tspan></text><text x="470" y="331.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">capa de indirección por decisión.</tspan></text><text x="470" y="370" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medición ruidosa: el imperativo varió de 700 a 1333 ns entre sistemas. Solo se interpreta el orden de magnitud.</tspan></text></svg>
