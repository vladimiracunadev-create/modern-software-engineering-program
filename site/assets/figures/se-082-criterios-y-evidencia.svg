<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué evidencia respalda cada criterio de selección de paradigma</title><desc id="d">Tabla de criterios con su evidencia: tamaño y cambio medidos por diferencia de líneas, costo de ejecución medido, legibilidad y modelo del dominio como juicio sin medir, y acoplamiento declarado como inferencia.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="450" fill="#ffffff"/><rect x="10" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="137" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="137" dy="0">Criterio</tspan></text><rect x="270" y="12" width="494" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="517" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="517" dy="0">Cómo se obtuvo aquí</tspan></text><rect x="770" y="12" width="174" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="857" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="857" dy="0">Estado</tspan></text><rect x="10" y="56" width="254" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="87.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">Costo de ejecutar</tspan></text><rect x="270" y="56" width="494" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="517" y="87.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517" dy="0">timeit, mediana de cinco repeticiones, dos sistemas</tspan></text><rect x="770" y="56" width="174" height="56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="857" y="87.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="857" dy="0">Medido</tspan></text><rect x="10" y="118" width="254" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="149.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">Superficie de cambio</tspan></text><rect x="270" y="118" width="494" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="517" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517" dy="0">difflib entre la versión 1 y la 2 de cada implementación</tspan></text><rect x="770" y="118" width="174" height="56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="857" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="857" dy="0">Medido</tspan></text><rect x="10" y="180" width="254" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="211.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">Equivalencia de comportamiento</tspan></text><rect x="270" y="180" width="494" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="517" y="211.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517" dy="0">14 casos fijos más 20 000 entradas aleatorias, 0 desacuerdos</tspan></text><rect x="770" y="180" width="174" height="56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="857" y="211.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="857" dy="0">Medido</tspan></text><rect x="10" y="242" width="254" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="273.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">Legibilidad para un equipo</tspan></text><rect x="270" y="242" width="494" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="517" y="273.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517" dy="0">Juicio sobre el equipo y su formación</tspan></text><rect x="770" y="242" width="174" height="56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="857" y="273.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="857" dy="0">No medido</tspan></text><rect x="10" y="304" width="254" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="335.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">Ajuste al modelo del dominio</tspan></text><rect x="270" y="304" width="494" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="517" y="327.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517" dy="0">Depende de si el problema se expresa mejor como reglas, flujo o</tspan></text><text x="517" y="343.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517" dy="0">estado</tspan></text><rect x="770" y="304" width="174" height="56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="857" y="335.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="857" dy="0">Inferencia</tspan></text><rect x="10" y="392" width="940" height="44" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="480" y="417.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="480" dy="0">Una selección responsable separa lo medido de lo supuesto y deja los supuestos visibles para revisarlos.</tspan></text></svg>
