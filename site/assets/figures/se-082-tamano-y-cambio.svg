<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 578" width="940" height="578" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cinco implementaciones de la misma regla: tamaño y líneas que cambian al añadir la regla R4</title><desc id="d">Barras agrupadas con las líneas de código no vacías y las líneas modificadas al añadir la regla R4: imperativo 12 y 2, funcional 12 y 1, objetos 24 y 5, declarativo 17 y 1, lógico 26 y 3.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="578" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cinco implementaciones de la misma regla: tamaño y líneas que cambian al añadir la regla R4</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Líneas de código</tspan></text><rect x="184.64" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="204.64" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="204.64" dy="0">Líneas cambiadas al añadir R4</tspan></text><line x1="284" y1="77" x2="284" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="284" y1="397" x2="284" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="284" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="284" dy="0">0</tspan></text><line x1="407.176" y1="77" x2="407.176" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="407.176" y1="397" x2="407.176" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="407.176" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="407.176" dy="0">5</tspan></text><line x1="530.352" y1="77" x2="530.352" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="530.352" y1="397" x2="530.352" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="530.352" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="530.352" dy="0">10</tspan></text><line x1="653.528" y1="77" x2="653.528" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="653.528" y1="397" x2="653.528" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="653.528" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="653.528" dy="0">15</tspan></text><line x1="776.704" y1="77" x2="776.704" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="776.704" y1="397" x2="776.704" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="776.704" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="776.704" dy="0">20</tspan></text><line x1="899.88" y1="77" x2="899.88" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="899.88" y1="397" x2="899.88" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="899.88" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="899.88" dy="0">25</tspan></text><line x1="284" y1="397" x2="899.88" y2="397" stroke="#5b7280" stroke-width="1.6"/><text x="274" y="113.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Imperativo (if/elif)</tspan></text><text x="274" y="177.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Funcional (predicados y next)</tspan></text><text x="274" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Objetos (una clase por regla)</tspan></text><text x="274" y="297" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Declarativo (condiciones como</tspan></text><text x="274" y="314" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">datos)</tspan></text><text x="274" y="369.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Lógico (hechos y cláusulas)</tspan></text><rect x="284" y="83" width="295.622" height="24.5" rx="3" fill="#102a43"/><text x="586.622" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="586.622" dy="0">12</tspan></text><rect x="284" y="110.5" width="49.2704" height="24.5" rx="3" fill="#c0432f"/><text x="340.27" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="340.27" dy="0">2</tspan></text><rect x="284" y="147" width="295.622" height="24.5" rx="3" fill="#102a43"/><text x="586.622" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="586.622" dy="0">12</tspan></text><rect x="284" y="174.5" width="24.6352" height="24.5" rx="3" fill="#c0432f"/><text x="315.635" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="315.635" dy="0">1</tspan></text><rect x="284" y="211" width="591.245" height="24.5" rx="3" fill="#102a43"/><text x="882.245" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.245" dy="0">24</tspan></text><rect x="284" y="238.5" width="123.176" height="24.5" rx="3" fill="#c0432f"/><text x="414.176" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="414.176" dy="0">5</tspan></text><rect x="284" y="275" width="418.798" height="24.5" rx="3" fill="#102a43"/><text x="709.798" y="291.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="709.798" dy="0">17</tspan></text><rect x="284" y="302.5" width="24.6352" height="24.5" rx="3" fill="#c0432f"/><text x="315.635" y="319.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="315.635" dy="0">1</tspan></text><rect x="284" y="339" width="640.515" height="24.5" rx="3" fill="#102a43"/><text x="931.515" y="355.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="931.515" dy="0">26</tspan></text><rect x="284" y="366.5" width="73.9056" height="24.5" rx="3" fill="#c0432f"/><text x="364.906" y="383.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="364.906" dy="0">3</tspan></text><text x="591.94" y="441" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="591.94" dy="0">Líneas</tspan></text><rect x="10" y="455" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="479.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Dónde vive la regla nueva: una rama en la cadena (imperativo), una fila en la tupla de reglas (funcional), una clase y su</tspan></text><text x="470" y="496.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">registro (objetos), una fila de datos (declarativo), una cláusula y un ajuste (lógico). Menos líneas no significa mejor:</tspan></text><text x="470" y="513.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cambian el lugar donde viven y cuánto del resto hay que tocar.</tspan></text><text x="470" y="560.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12 en un equipo concreto; las magnitudes cambian con la máquina, el orden relativo es lo que importa.</tspan></text></svg>
