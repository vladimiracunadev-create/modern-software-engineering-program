<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cinco implementaciones de la misma regla: tamaño y costo de añadir una regla</title><desc id="d">Tabla con el tamaño en líneas no vacías y las líneas modificadas al añadir la regla R4: imperativo 12 y 2, funcional 12 y 1, objetos 24 y 5, declarativo 17 y 1, lógico 26 y 3.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="430" fill="#ffffff"/><rect x="10" y="12" width="264" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="142" y="38.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="142" dy="0">Paradigma</tspan></text><rect x="280" y="12" width="134" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="347" y="30.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="347" dy="0">Líneas de</tspan></text><text x="347" y="46.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="347" dy="0">código</tspan></text><rect x="420" y="12" width="224" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="532" y="30.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="532" dy="0">Líneas cambiadas al añadir</tspan></text><text x="532" y="46.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="532" dy="0">R4</tspan></text><rect x="650" y="12" width="294" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="797" y="38.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="797" dy="0">Dónde está la regla nueva</tspan></text><rect x="10" y="64" width="264" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="92.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">Imperativo (if/elif)</tspan></text><rect x="280" y="64" width="134" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="347" y="92.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="347" dy="0">12</tspan></text><rect x="420" y="64" width="224" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="92.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">2</tspan></text><rect x="650" y="64" width="294" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="84.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">Una rama en la cadena, en el sitio</tspan></text><text x="797" y="100.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">correcto</tspan></text><rect x="10" y="120" width="264" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="148.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">Funcional (predicados y next)</tspan></text><rect x="280" y="120" width="134" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="347" y="148.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="347" dy="0">12</tspan></text><rect x="420" y="120" width="224" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="148.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">1</tspan></text><rect x="650" y="120" width="294" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="148.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">Una fila en la tupla de reglas</tspan></text><rect x="10" y="176" width="264" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="204.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">Objetos (una clase por regla)</tspan></text><rect x="280" y="176" width="134" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="347" y="204.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="347" dy="0">24</tspan></text><rect x="420" y="176" width="224" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="204.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">5</tspan></text><rect x="650" y="176" width="294" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="196.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">Una clase nueva y su registro en la</tspan></text><text x="797" y="212.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">lista</tspan></text><rect x="10" y="232" width="264" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="260.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">Declarativo (condiciones como datos)</tspan></text><rect x="280" y="232" width="134" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="347" y="260.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="347" dy="0">17</tspan></text><rect x="420" y="232" widt