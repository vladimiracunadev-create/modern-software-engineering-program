<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una regla, cinco implementaciones y un contrato común</title><desc id="d">Diagrama: una observación con latencia y autorización entra a cinco implementaciones (imperativa, funcional, objetos, declarativa y lógica) que devuelven la misma estructura de acción y regla. Resultado: 14 de 14 casos fijos en cada una y 0 desacuerdos en 20000 entradas aleatorias.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="400" fill="#ffffff"/><rect x="20" y="150" width="150" height="80" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="95" y="177" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="95" dy="0">Observación</tspan></text><text x="95" y="193.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="95" dy="0">{latencia,</tspan></text><text x="95" y="210.28" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="95" dy="0">autorizada}</tspan></text><rect x="300" y="24" width="190" height="50" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="395" y="52.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="395" dy="0">Imperativa</tspan></text><polyline points="170,190 300,49" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="490,49 620,190" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="300" y="90" width="190" height="50" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="395" y="118.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="395" dy="0">Funcional</tspan></text><polyline points="170,190 300,115" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="490,115 620,190" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="300" y="156" width="190" height="50" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="395" y="184.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="395" dy="0">Objetos</tspan></text><polyline points="170,190 300,181" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="490,181 620,190" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="300" y="222" width="190" height="50" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="395" y="250.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="395" dy="0">Declarativa</tspan></text><polyline points="170,190 300,247" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="490,247 620,190" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="300" y="288" width="190" height="50" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="395" y="316.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="395" dy="0">Lógica</tspan></text><polyline points="170,190 300,313" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="490,313 620,190" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="620" y="150" width="190" height="80" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="715" y="185.32" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="715" dy="0">Respuesta</tspan></text><text x="715" y="201.96" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="715" dy="0">{acción, regla}</tspan></text><rect x="830" y="140" width="120" height="100" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="890" y="170.32" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="890" dy="0">14 / 14</tspan></text><text x="890" y="185.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="890" dy="0">casos</tspan></text><text x="890" y="201.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="890" dy="0">0 desacuerdos</tspan></text><text x="890" y="216.4" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="890" dy="0">en 20 000</tspan></text><rect x="20" y="350" width="920" height="38" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="372.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">La comparación solo es válida porque entrada y salida son las mismas; cambiar el contrato invalida la comparación.</tspan></text></svg>
