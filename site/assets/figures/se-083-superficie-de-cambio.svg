<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 340" width="940" height="340" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Superficie de cambio: líneas modificadas al añadir la regla R4</title><desc id="d">Barras de líneas cambiadas: funcional 1, declarativo 1, imperativo 2, lógico 3 y objetos 5. Los cinco pasaron 16 de 16 casos tras el cambio.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="340" fill="#ffffff"/><text x="20" y="28" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">Líneas modificadas al pasar de la versión 1 a la 2 (difflib)</tspan></text><text x="180" y="65" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="180" dy="0">Funcional</tspan></text><rect x="190" y="44" width="90" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="288" y="65" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="288" dy="0">1</tspan></text><text x="180" y="109" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="180" dy="0">Declarativo</tspan></text><rect x="190" y="88" width="90" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="288" y="109" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="288" dy="0">1</tspan></text><text x="180" y="153" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="180" dy="0">Imperativo</tspan></text><rect x="190" y="132" width="180" height="30" rx="3" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="378" y="153" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="378" dy="0">2</tspan></text><text x="180" y="197" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="180" dy="0">Lógico</tspan></text><rect x="190" y="176" width="270" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="468" y="197" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="468" dy="0">3</tspan></text><text x="180" y="241" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="180" dy="0">Objetos</tspan></text><rect x="190" y="220" width="450" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="648" y="241" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="648" dy="0">5</tspan></text><rect x="20" y="270" width="900" height="52" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="291.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las cinco versiones aprobaron 16 de 16 casos tras el cambio. Pocas líneas no implican menos riesgo: el orden de las</tspan></text><text x="470" y="307.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">reglas sigue siendo significado.</tspan></text></svg>
