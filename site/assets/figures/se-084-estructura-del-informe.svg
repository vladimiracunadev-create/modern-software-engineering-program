<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Estructura del informe de comparación: afirmación, evidencia y límite</title><desc id="d">Tabla de tres afirmaciones con su evidencia y lo que no prueban: equivalencia en los casos probados, costo de cambio medido por diferencia de líneas y costo de ejecución medido en un microbenchmark.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="430" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Afirmación del informe</tspan></text><rect x="340" y="12" width="314" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="497" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="497" dy="0">Evidencia que la sostiene</tspan></text><rect x="660" y="12" width="284" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="802" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="802" dy="0">Lo que no prueba</tspan></text><rect x="10" y="56" width="324" height="96" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="99.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Las cinco versiones son equivalentes</tspan></text><text x="172" y="115.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">sobre el dominio probado</tspan></text><rect x="340" y="56" width="314" height="96" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="497" y="99.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="497" dy="0">14 casos fijos y 20 000 entradas</tspan></text><text x="497" y="115.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="497" dy="0">aleatorias, 0 desacuerdos</tspan></text><rect x="660" y="56" width="284" height="96" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="91" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">Equivalencia sobre entradas fuera</tspan></text><text x="802" y="107.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">del generador, incluidos tipos</tspan></text><text x="802" y="124.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">exóticos</tspan></text><rect x="10" y="158" width="324" height="96" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="201.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">La regla nueva cuesta menos líneas en el</tspan></text><text x="172" y="217.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">funcional y el declarativo</tspan></text><rect x="340" y="158" width="314" height="96" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="497" y="209.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="497" dy="0">Diferencia de líneas entre versión 1 y 2</tspan></text><rect x="660" y="158" width="284" height="96" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="201.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">Que el equipo entienda mejor esas</tspan></text><text x="802" y="217.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">formas</tspan></text><rect x="10" y="260" width="324" height="96" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="303.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">El imperativo es el más rápido y el</tspan></text><text x="172" y="319.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">lógico el más lento</tspan></text><rect x="340" y="260" width="314" height="96" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="497" y="311.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="497" dy="0">timeit en dos sistemas, mismo orden</tspan></text><rect x="660" y="260" width="284" height="96" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="303.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">Que la diferencia importe para la</tspan></text><text x="802" y="319.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">carga real</tspan></text><rect x="10" y="366" width="940" height="44" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="391.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Cada afirmación del informe enlaza un artefacto reproducible; las que no lo tienen se marcan como juicio.</tspan></text></svg>
