<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" width="940" height="380" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mutantes detectados según el tamaño de la suite de pruebas</title><desc id="d">Barras del número de mutantes detectados de seis: solo el camino feliz detecta 1, camino feliz más no autorizado detecta 3, camino feliz más el límite 800 y 801 detecta 2, y los catorce casos detectan los 6.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="380" fill="#ffffff"/><text x="20" y="28" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="20" dy="0">Mutantes detectados de 6 por cada suite</tspan></text><text x="280" y="65" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="280" dy="0">Solo camino feliz (1 caso)</tspan></text><rect x="290" y="44" width="100" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="398" y="65" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="398" dy="0">1 de 6</tspan></text><text x="280" y="111" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="280" dy="0">Feliz + no autorizado (2)</tspan></text><rect x="290" y="90" width="300" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="598" y="111" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="598" dy="0">3 de 6</tspan></text><text x="280" y="157" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="280" dy="0">Feliz + límites 800 y 801 (3)</tspan></text><rect x="290" y="136" width="200" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="498" y="157" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="498" dy="0">2 de 6</tspan></text><text x="280" y="203" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="280" dy="0">Los 14 casos</tspan></text><rect x="290" y="182" width="600" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="898" y="203" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="898" dy="0">6 de 6</tspan></text><rect x="20" y="252" width="900" height="74" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="284.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Dos suites de tamaño parecido detectan mutantes distintos. El valor de una prueba depende de qué regla ejercita, no de</tspan></text><text x="470" y="300.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cuántas hay.</tspan></text><text x="470" y="360" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Seis mutantes escritos a mano sobre la versión imperativa; no es una medición de mutación sistemática.</tspan></text></svg>
