<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 551" width="940" height="551" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Copias, vistas y recorridos: lo que cuesta cada decisión</title><desc id="d">Barras agrupadas en escala logarítmica con el tiempo de cuatro operaciones en Windows y Linux: copiar una rebanada de 50 MB tarda 15,8 y 36,1 milisegundos, una vista de memoria menos de un microsegundo, sumar un millón de enteros 9,8 y 9,5 milisegundos y recorrer un millón de nodos enlazados 91,0 y 58,1; la vista es la única que no copia.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="551" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Copias, vistas y recorridos: lo que cuesta cada decisión</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Windows</tspan></text><rect x="116.78" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="136.78" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="136.78" dy="0">Linux (WSL2)</tspan></text><line x1="101.24" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="375" x2="101.24" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">0,0001</tspan></text><line x1="101.24" y1="328.333" x2="920" y2="328.333" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="328.333" x2="101.24" y2="328.333" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="332.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">0,001</tspan></text><line x1="101.24" y1="281.667" x2="920" y2="281.667" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="281.667" x2="101.24" y2="281.667" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="286.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">0,01</tspan></text><line x1="101.24" y1="235" x2="920" y2="235" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="235" x2="101.24" y2="235" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="239.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">0,1</tspan></text><line x1="101.24" y1="188.333" x2="920" y2="188.333" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="188.333" x2="101.24" y2="188.333" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="192.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">1</tspan></text><line x1="101.24" y1="141.667" x2="920" y2="141.667" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="141.667" x2="101.24" y2="141.667" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="146.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">10</tspan></text><line x1="101.24" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="95" x2="101.24" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">100</tspan></text><line x1="101.24" y1="95" x2="101.24" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">ms (escala logarítmica)</text><rect x="121.709" y="132.396" width="79.876" height="242.604" rx="3" fill="#087f8c"/><text x="161.647" y="126.396" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="161.647" dy="0">15,8</tspan></text><rect x="205.585" y="115.65" width="79.876" height="259.35" rx="3" fill="#c0432f"/><text x="245.523" y="109.65" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="245.523" dy="0">36,1</tspan></text><text x="203.585" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="203.585" dy="0">Rebanada de 50 MB (copia)</tspan></text><rect x="326.399" y="338.686" width="79.876" height="36.3137" rx="3" fill="#087f8c"/><text x="366.337" y="332.686" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="366.337" dy="0">0,0006</tspan></text><rect x="410.275" y="335.562" width="79.876" height="39.4379" rx="3" fill="#c0432f"/><text x="450.213" y="329.562" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="450.213" dy="0">0,0007</tspan></text><text x="408.275" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="408.275" dy="0">memoryview del mismo</tspan></text><text x="408.275" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="408.275" dy="0">bytearray (vista)</tspan></text><rect x="531.089" y="142.076" width="79.876" height="232.924" rx="3" fill="#087f8c"/><text x="571.027" y="136.076" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="571.027" dy="0">9,8</tspan></text><rect x="614.965" y="142.706" width="79.876" height="232.294" rx="3" fill="#c0432f"/><text x="654.903" y="136.706" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="654.903" dy="0">9,5</tspan></text><text x="612.965" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612.965" dy="0">sum() de 1 M de enteros</tspan></text><rect x="735.779" y="96.9114" width="79.876" height="278.089" rx="3" fill="#087f8c"/><text x="775.717" y="90.9114" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="775.717" dy="0">91,0</tspan></text><rect x="819.655" y="106.005" width="79.876" height="268.995" rx="3" fill="#c0432f"/><text x="859.593" y="100.005" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="859.593" dy="0">58,1</tspan></text><text x="817.655" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817.655" dy="0">Recorrer 1 M de nodos</tspan></text><text x="817.655" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817.655" dy="0">enlazados</tspan></text><rect x="10" y="444" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="468.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Tras escribir en el bytearray original, la vista muestra el cambio (aliasing: «Z» frente a «b») y la copia no. Con una</tspan></text><text x="470" y="485.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">vista viva, bytearray.extend falla con BufferError: «Existing exports of data».</tspan></text><text x="470" y="533.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
