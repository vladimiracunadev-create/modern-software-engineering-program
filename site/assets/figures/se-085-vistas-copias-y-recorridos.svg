<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 427" width="950" height="427" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Copias, vistas y recorridos: lo que cuesta cada decisión</title><desc id="d">Cuatro filas con tiempos en Windows y Linux: copiar una rebanada de 50 MB tarda 15,8 y 36,1 milisegundos, una vista de memoria menos de un microsegundo, sumar un millón de enteros en una lista 9,8 y 9,5 milisegundos y recorrer una lista enlazada de un millón de nodos 91,0 y 58,1.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="427" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Operación</tspan></text><rect x="340" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="402" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="402" dy="0">Windows</tspan></text><rect x="470" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="537" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="537" dy="0">Linux (WSL2)</tspan></text><rect x="610" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="772" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="772" dy="0">Lectura</tspan></text><rect x="10" y="56" width="324" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="90.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">bytearray de 50 MB: rebanada que copia</tspan></text><rect x="340" y="56" width="124" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="90.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">15,8 ms</tspan></text><rect x="470" y="56" width="134" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="90.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">36,1 ms</tspan></text><rect x="610" y="56" width="324" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="90.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">Copia 50 MB cada vez</tspan></text><rect x="10" y="124" width="324" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="158.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">memoryview del mismo bytearray</tspan></text><rect x="340" y="124" width="124" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="158.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">0,0006 ms</tspan></text><rect x="470" y="124" width="134" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="158.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">0,0007 ms</tspan></text><rect x="610" y="124" width="324" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="150.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">Vista: no copia, pero bloquea el</tspan></text><text x="772" y="166.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">redimensionado</tspan></text><rect x="10" y="192" width="324" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="226.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">sum() de una lista de 1 M de enteros</tspan></text><rect x="340" y="192" width="124" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="226.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">9,8 ms</tspan></text><rect x="470" y="192" width="134" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="226.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">9,5 ms</tspan></text><rect x="610" y="192" width="324" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="226.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">Bucle en C sobre referencias contiguas</tspan></text><rect x="10" y="260" width="324" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="294.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Recorrer 1 M de nodos enlazados en Python</tspan></text><rect x="340" y="260" width="124" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="294.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">91,0 ms</tspan></text><rect x="470" y="260" width="134" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="294.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">58,1 ms</tspan></text><rect x="610" y="260" width="324" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="294.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">Un salto de puntero por nodo</tspan></text><rect x="10" y="332" width="930" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="475" y="356.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Tras escribir en el bytearray original, la vista muestra el cambio (aliasing: «Z» frente a «b») y la copia no. Con una vista</tspan></text><text x="475" y="373.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">viva, bytearray.extend falla con BufferError: «Existing exports of data».</tspan></text><text x="475" y="413.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Medido con CPython 3.12.9 en Windows 11; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
