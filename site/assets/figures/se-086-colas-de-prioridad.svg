<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 363" width="930" height="363" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres maneras de implementar una cola de prioridad</title><desc id="d">Tabla de tiempos para insertar y extraer n elementos: el montículo binario tarda 0,6 a 11,2 milisegundos, la lista ordenada con bisect.insort 2,9 a 59,4 y buscar el mínimo con min y remove 43,6 a 3746 milisegundos entre 2000 y 16000 elementos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="363" fill="#ffffff"/><rect x="10" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="102" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="102" dy="0">n elementos</tspan></text><rect x="200" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="312" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="312" dy="0">heapq (montículo)</tspan></text><rect x="430" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="552" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="552" dy="0">bisect.insort + pop</tspan></text><rect x="680" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="797" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="797" dy="0">min() + remove()</tspan></text><rect x="10" y="56" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="82.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">2 000</tspan></text><rect x="200" y="56" width="224" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="312" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="312" dy="0">0,6 ms</tspan></text><rect x="430" y="56" width="244" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">2,9 ms</tspan></text><rect x="680" y="56" width="234" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">43,6 ms</tspan></text><rect x="10" y="108" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="134.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">4 000</tspan></text><rect x="200" y="108" width="224" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="312" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="312" dy="0">1,4 ms</tspan></text><rect x="430" y="108" width="244" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">4,3 ms</tspan></text><rect x="680" y="108" width="234" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">194,4 ms</tspan></text><rect x="10" y="160" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="186.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">8 000</tspan></text><rect x="200" y="160" width="224" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="312" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="312" dy="0">3,2 ms</tspan></text><rect x="430" y="160" width="244" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">16,9 ms</tspan></text><rect x="680" y="160" width="234" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">833,3 ms</tspan></text><rect x="10" y="212" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="238.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">16 000</tspan></text><rect x="200" y="212" width="224" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="312" y="238.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="312" dy="0">11,2 ms</tspan></text><rect x="430" y="212" width="244" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="238.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">59,4 ms</tspan></text><rect x="680" y="212" width="234" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="238.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">3 746,4 ms</tspan></text><rect x="10" y="268" width="910" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="292.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">Al duplicar n, min()+remove() multiplica su tiempo por 4,5, 4,3 y 4,5 (cuadrático). El montículo no mantiene orden total:</tspan></text><text x="465" y="309.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">solo garantiza el mínimo en la raíz, y por eso es más barato que ordenar en cada inserción.</tspan></text><text x="465" y="349.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Medido con CPython 3.12.9 en Windows 11; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
