<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 371" width="940" height="371" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Comparaciones del montículo: n inserciones y n extracciones</title><desc id="d">Tabla con el número de comparaciones contadas: n inserciones cuestan unas 2,2 n comparaciones (2212 a 18 300) y n extracciones cuestan 8703 a 93 390, entre 0,87 y 0,90 veces n por el logaritmo de n.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="371" fill="#ffffff"/><rect x="10" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="77" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="77" dy="0">n</tspan></text><rect x="150" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="282" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="282" dy="0">Comparaciones al insertar n</tspan></text><rect x="420" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="552" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="552" dy="0">Comparaciones al extraer n</tspan></text><rect x="690" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="807" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="807" dy="0">Extraer / (n·log₂ n)</tspan></text><rect x="10" y="56" width="134" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="77" y="81.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="77" dy="0">1 000</tspan></text><rect x="150" y="56" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="282" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="282" dy="0">2 212</tspan></text><rect x="420" y="56" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">8 703</tspan></text><rect x="690" y="56" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">0,87</tspan></text><rect x="10" y="106" width="134" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="77" y="131.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="77" dy="0">2 000</tspan></text><rect x="150" y="106" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="282" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="282" dy="0">4 485</tspan></text><rect x="420" y="106" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">19 342</tspan></text><rect x="690" y="106" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">0,88</tspan></text><rect x="10" y="156" width="134" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="77" y="181.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="77" dy="0">4 000</tspan></text><rect x="150" y="156" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="282" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="282" dy="0">9 018</tspan></text><rect x="420" y="156" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">42 666</tspan></text><rect x="690" y="156" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">0,89</tspan></text><rect x="10" y="206" width="134" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="77" y="231.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="77" dy="0">8 000</tspan></text><rect x="150" y="206" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="282" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="282" dy="0">18 300</tspan></text><rect x="420" y="206" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">93 390</tspan></text><rect x="690" y="206" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">0,90</tspan></text><rect x="10" y="260" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="284.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Insertar es casi lineal (cada elemento sube pocos niveles en promedio); extraer es n·log n porque cada elemento nuevo en la</tspan></text><text x="470" y="301.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">raíz baja por la altura del árbol. La recursión de 5 000 niveles falla con RecursionError (límite 1 000), mientras que una</tspan></text><text x="470" y="318.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">pila explícita procesó 1 000 000 de pasos sin problema.</tspan></text><text x="470" y="357.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Comparaciones contadas con __lt__ sobre datos aleatorios con semilla fija; no dependen del equipo.</tspan></text></svg>
