<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Empates en una cola de prioridad: el orden de salida depende de la clave de desempate</title><desc id="d">Se insertaron cinco tareas E, D, C, B, A con la misma prioridad. Con tuplas (prioridad, nombre) salen A B C D E, orden alfabético y no de llegada; con un contador intermedio (prioridad, contador, nombre) salen E D C B A, orden de llegada. Dos diccionarios como carga útil lanzan TypeError.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="400" fill="#ffffff"/><rect x="10" y="14" width="910" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="465" y="39.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="465" dy="0">Entrada con prioridad igual, en este orden de llegada: E, D, C, B, A</tspan></text><rect x="10" y="80" width="440" height="100" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="230" y="116" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="230" dy="0">heappush((1, nombre))</tspan></text><text x="230" y="133.92" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="230" dy="0">Sale: A B C D E</tspan></text><text x="230" y="151.84" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="230" dy="0">Desempata por el texto, no por la llegada</tspan></text><rect x="480" y="80" width="440" height="100" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="700" y="116" font-size="14" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="700" dy="0">heappush((1, contador, nombre))</tspan></text><text x="700" y="133.92" font-size="14" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="700" dy="0">Sale: E D C B A</tspan></text><text x="700" y="151.84" font-size="14" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="700" dy="0">Desempata por llegada: FIFO estable</tspan></text><rect x="10" y="200" width="910" height="74" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="232.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">heappush((1, {&#x27;a&#x27;: 1})) y luego heappush((1, {&#x27;b&#x27;: 2})) lanza TypeError: &#x27;&lt;&#x27; not supported between instances of &#x27;dict&#x27; and</tspan></text><text x="465" y="248.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">&#x27;dict&#x27;. La prioridad empata y Python intenta comparar la carga útil.</tspan></text><rect x="10" y="292" width="910" height="70" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="465" y="322.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="465" dy="0">Un contador monótono como segundo elemento hace el orden total, estable y determinista, y evita comparar cargas útiles que</tspan></text><text x="465" y="338.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="465" dy="0">no se pueden ordenar.</tspan></text><text x="470" y="386" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
