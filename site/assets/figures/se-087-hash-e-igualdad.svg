<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 495" width="950" height="495" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Hash e igualdad: cinco sorpresas medidas</title><desc id="d">Tabla de cinco comprobaciones: un set de cadenas cambia de orden con cinco de seis semillas, uno de enteros no cambia, hash de menos uno y menos dos coinciden, uno, uno punto cero y True son la misma clave, y NaN solo se encuentra con el mismo objeto.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="495" fill="#ffffff"/><rect x="10" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Comprobación</tspan></text><rect x="390" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="512" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="512" dy="0">Resultado</tspan></text><rect x="640" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="787" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="787" dy="0">Causa</tspan></text><rect x="10" y="56" width="374" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="82.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Orden de un set de 5 cadenas, 6 valores de</tspan></text><text x="197" y="98.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">PYTHONHASHSEED</tspan></text><rect x="390" y="56" width="244" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="90.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">5 órdenes distintos</tspan></text><rect x="640" y="56" width="294" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="90.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">El hash de str se aleatoriza por proceso</tspan></text><rect x="10" y="124" width="374" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="150.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Orden de un set de enteros, 3 valores de</tspan></text><text x="197" y="166.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">PYTHONHASHSEED</tspan></text><rect x="390" y="124" width="244" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="158.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">1 solo orden</tspan></text><rect x="640" y="124" width="294" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="158.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">El hash de int no se aleatoriza</tspan></text><rect x="10" y="192" width="374" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="226.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">hash(-1) y hash(-2)</tspan></text><rect x="390" y="192" width="244" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="226.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">ambos −2</tspan></text><rect x="640" y="192" width="294" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="218.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">−1 está reservado como error en C: hay</tspan></text><text x="787" y="234.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">colisión</tspan></text><rect x="10" y="260" width="374" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="294.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">{1: &#x27;a&#x27;, 1.0: &#x27;b&#x27;, True: &#x27;c&#x27;}</tspan></text><rect x="390" y="260" width="244" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="294.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">1 clave</tspan></text><rect x="640" y="260" width="294" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="294.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">1 == 1.0 == True y tienen el mismo hash</tspan></text><rect x="10" y="328" width="374" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="362.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">float(&#x27;nan&#x27;) in {nan: 1}</tspan></text><rect x="390" y="328" width="244" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="354.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">True con el mismo objeto; False</tspan></text><text x="512" y="370.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">con otro nan</tspan></text><rect x="640" y="328" width="294" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="354.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">NaN no es igual a sí mismo: la identidad</tspan></text><text x="787" y="370.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">rescata la búsqueda</tspan></text><rect x="10" y="400" width="930" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="475" y="424.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Ordenar por iteración de un set de cadenas no es reproducible entre procesos. Los diccionarios, en cambio, conservan el</tspan></text><text x="475" y="441.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">orden de inserción desde Python 3.7: tras borrar «b» y reinsertarla queda al final («acdeb»).</tspan></text><text x="475" y="481.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Medido con CPython 3.12.9 en Windows 11; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
