<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 550" width="940" height="550" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Altura de un árbol según el orden de inserción</title><desc id="d">Barras agrupadas en escala logarítmica con la altura de un árbol binario de búsqueda para 255, 1000 y 4000 claves: con claves ordenadas la altura es n, con claves aleatorias 17, 26 y 30 y con un árbol AVL 8, 10 y 12, igual a log2 n.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="550" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Altura de un árbol según el orden de inserción</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">BST, claves ordenadas</tspan></text><rect x="222.34" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="242.34" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="242.34" dy="0">BST, claves aleatorias</tspan></text><rect x="436.22" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="456.22" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="456.22" dy="0">AVL, claves ordenadas</tspan></text><line x1="101.24" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="375" x2="101.24" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">1</tspan></text><line x1="101.24" y1="305" x2="920" y2="305" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="305" x2="101.24" y2="305" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="309.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">10</tspan></text><line x1="101.24" y1="235" x2="920" y2="235" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="235" x2="101.24" y2="235" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="239.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">100</tspan></text><line x1="101.24" y1="165" x2="920" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="165" x2="101.24" y2="165" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="169.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">1 000</tspan></text><line x1="101.24" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="95" x2="101.24" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">10 000</tspan></text><line x1="101.24" y1="95" x2="101.24" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">altura (niveles) (escala logarítmica)</text><rect x="128.532" y="206.542" width="70.112" height="168.458" rx="3" fill="#c0432f"/><text x="163.588" y="200.542" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="163.588" dy="0">255</tspan></text><rect x="202.644" y="288.869" width="70.112" height="86.1314" rx="3" fill="#946512"/><text x="237.7" y="282.869" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="237.7" dy="0">17</tspan></text><rect x="276.756" y="311.784" width="70.112" height="63.2163" rx="3" fill="#087f8c"/><text x="311.812" y="305.784" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="311.812" dy="0">8</tspan></text><text x="237.7" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="237.7" dy="0">n = 255</tspan></text><rect x="401.452" y="165" width="70.112" height="210" rx="3" fill="#c0432f"/><text x="436.508" y="159" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="436.508" dy="0">1 000</tspan></text><rect x="475.564" y="275.952" width="70.112" height="99.0481" rx="3" fill="#946512"/><text x="510.62" y="269.952" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="510.62" dy="0">26</tspan></text><rect x="549.676" y="305" width="70.112" height="70" rx="3" fill="#087f8c"/><text x="584.732" y="299" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="584.732" dy="0">10</tspan></text><text x="510.62" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="510.62" dy="0">n = 1 000</tspan></text><rect x="674.372" y="122.856" width="70.112" height="252.144" rx="3" fill="#c0432f"/><text x="709.428" y="116.856" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="709.428" dy="0">4 000</tspan></text><rect x="748.484" y="271.602" width="70.112" height="103.398" rx="3" fill="#946512"/><text x="783.54" y="265.602" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="783.54" dy="0">30</tspan></text><rect x="822.596" y="299.457" width="70.112" height="75.5427" rx="3" fill="#087f8c"/><text x="857.652" y="293.457" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="857.652" dy="0">12</tspan></text><text x="783.54" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="783.54" dy="0">n = 4 000</tspan></text><rect x="10" y="427" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Comparaciones acumuladas: ordenado 32 385, 499 500 y 7 998 000; aleatorio 2 104, 11 562 y 56 801. Un BST es una lista</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">enlazada cuando se alimenta en orden. Un AVL con 100 000 claves ordenadas llegó a altura 17 (cota teórica 23,9) a cambio de</tspan></text><text x="470" y="485.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">99 983 rotaciones.</tspan></text><text x="470" y="532.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Alturas y comparaciones calculadas con semilla fija; no dependen del equipo.</tspan></text></svg>
