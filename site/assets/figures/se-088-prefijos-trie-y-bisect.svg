<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 345" width="950" height="345" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Contar palabras con un prefijo: tres estructuras</title><desc id="d">Tabla de tiempos para contar 39 palabras con el prefijo abc entre 28 785: el recorrido tarda 6374 microsegundos en Windows y 3370 en Linux, el trie 30,9 y 28,9, y la lista ordenada con bisect 1,1 y 0,9. El trie ocupa 15,3 MB frente a 1,6 MB de la lista.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="345" fill="#ffffff"/><rect x="10" y="12" width="354" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="187" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="187" dy="0">Estructura</tspan></text><rect x="370" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="432" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="432" dy="0">Windows</tspan></text><rect x="500" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="567" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="567" dy="0">Linux (WSL2)</tspan></text><rect x="640" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="787" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="787" dy="0">Lectura</tspan></text><rect x="10" y="56" width="354" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="187" y="85.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="187" dy="0">Recorrer los 28 785 textos (startswith)</tspan></text><rect x="370" y="56" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">6 374 µs</tspan></text><rect x="500" y="56" width="134" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="567" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="567" dy="0">3 370 µs</tspan></text><rect x="640" y="56" width="294" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">Lineal en el número de textos</tspan></text><rect x="10" y="114" width="354" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="187" y="143.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="187" dy="0">Trie de diccionarios anidados</tspan></text><rect x="370" y="114" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">30,9 µs</tspan></text><rect x="500" y="114" width="134" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="567" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="567" dy="0">28,9 µs</tspan></text><rect x="640" y="114" width="294" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="135.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">Proporcional al prefijo y a las</tspan></text><text x="787" y="151.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">coincidencias</tspan></text><rect x="10" y="172" width="354" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="187" y="201.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="187" dy="0">Lista ordenada + bisect</tspan></text><rect x="370" y="172" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">1,1 µs</tspan></text><rect x="500" y="172" width="134" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="567" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="567" dy="0">0,9 µs</tspan></text><rect x="640" y="172" width="294" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">Dos búsquedas binarias, sin recorrer</tspan></text><rect x="10" y="234" width="930" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="475" y="258.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">El trie tuvo 82 553 nodos para 190 043 caracteres (43 %) y ocupó 9,6 veces más memoria que la lista de textos. En CPython,</tspan></text><text x="475" y="275.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">bisect sobre una lista ordenada ganó al trie para contar prefijos; el trie conserva su valor cuando hace falta recorrer o</tspan></text><text x="475" y="292.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">completar por carácter.</tspan></text><text x="475" y="331.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Medido con CPython 3.12.9 en Windows 11; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
