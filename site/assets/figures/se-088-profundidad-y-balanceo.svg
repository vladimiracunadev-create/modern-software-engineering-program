<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 542" width="940" height="542" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La altura manda: recursión, balanceo e invariante</title><desc id="d">Cuatro casos como tarjetas con su resultado: la inserción recursiva en un árbol de claves ordenadas falla con RecursionError, la iterativa funciona pero es cuadrática, un árbol AVL de 100 000 claves ordenadas tiene altura 17 y un montículo satisface el invariante padre menor o igual que hijo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="542" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">La altura manda: recursión, balanceo e invariante</tspan></text><rect x="14" y="47" width="14" height="14" rx="3" fill="#c0432f"/><text x="36" y="59" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">falla o sorprende</tspan></text><rect x="183.2" y="47" width="14" height="14" rx="3" fill="#087f8c"/><text x="205.2" y="59" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="205.2" dy="0">se sostiene</tspan></text><rect x="306.8" y="47" width="14" height="14" rx="3" fill="#946512"/><text x="328.8" y="59" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="328.8" dy="0">depende</tspan></text><rect x="20" y="77" width="378" height="57.28" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="100.96" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">Inserción recursiva en BST, 1 500 claves</tspan></text><text x="30" y="117.6" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">ordenadas, límite 1 000</tspan></text><polyline points="402,105.64 438,105.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="442" y="77" width="478" height="57.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="452" y="109.28" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14"><tspan x="452" dy="0">RecursionError</tspan></text><text x="24" y="151.28" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">La altura del árbol consume la pila de llamadas.</tspan></text><rect x="20" y="172.92" width="378" height="57.28" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="196.88" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">Misma inserción con bucle iterativo, 4 000 claves</tspan></text><text x="30" y="213.52" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">ordenadas</tspan></text><polyline points="402,201.56 438,201.56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="442" y="172.92" width="478" height="57.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="452" y="205.2" font-size="13" text-anchor="start" font-weight="700" fill="#4a3209"><tspan x="452" dy="0">Funciona (altura 4 000)</tspan></text><text x="24" y="247.2" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">Correcta pero cuadrática: 7 998 000 comparaciones.</tspan></text><rect x="20" y="268.84" width="378" height="40.64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="292.8" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">AVL, 100 000 claves ordenadas</tspan></text><polyline points="402,289.16 438,289.16" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="442" y="268.84" width="478" height="40.64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="452" y="292.8" font-size="13" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="452" dy="0">Altura 17</tspan></text><text x="24" y="326.48" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">Cota 1,44·log₂(n+2) = 23,9; 99 983 rotaciones.</tspan></text><rect x="20" y="348.12" width="378" height="40.64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="372.08" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">Montículo de 31 elementos tras heapify</tspan></text><polyline points="402,368.44 438,368.44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="442" y="348.12" width="478" height="40.64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="452" y="372.08" font-size="13" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="452" dy="0">Invariante cumplido</tspan></text><text x="24" y="405.76" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">padre ≤ hijo en los 30 pares; índices (i−1)//2.</tspan></text><rect x="10" y="429.4" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="454.36" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La altura no es un detalle de implementación: determina el costo de cada operación y el riesgo de agotar la pila. Un árbol</tspan></text><text x="470" y="471" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">correcto en pruebas con datos aleatorios puede romperse con datos ordenados.</tspan></text><text x="470" y="514.68" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
