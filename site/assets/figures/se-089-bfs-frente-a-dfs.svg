<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 550" width="940" height="550" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Rejilla: BFS encuentra el camino más corto, DFS encuentra uno cualquiera</title><desc id="d">Barras agrupadas en escala logarítmica con el largo del camino hallado en rejillas de 20, 40 y 80 de lado: la búsqueda en anchura devuelve 38, 78 y 158 pasos, que son los óptimos, y la búsqueda en profundidad 190, 780 y 3160, cinco, diez y veinte veces más largos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="550" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Rejilla: BFS encuentra el camino más corto, DFS encuentra uno cualquiera</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">BFS = óptimo</tspan></text><rect x="154.48" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="174.48" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="174.48" dy="0">DFS</tspan></text><line x1="101.24" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="375" x2="101.24" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">10</tspan></text><line x1="101.24" y1="281.667" x2="920" y2="281.667" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="281.667" x2="101.24" y2="281.667" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="286.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">100</tspan></text><line x1="101.24" y1="188.333" x2="920" y2="188.333" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="188.333" x2="101.24" y2="188.333" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="192.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">1 000</tspan></text><line x1="101.24" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="95" x2="101.24" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">10 000</tspan></text><line x1="101.24" y1="95" x2="101.24" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">pasos del camino (escala logarítmica)</text><rect x="128.532" y="320.887" width="107.168" height="54.1131" rx="3" fill="#087f8c"/><text x="182.116" y="314.887" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182.116" dy="0">38</tspan></text><rect x="239.7" y="255.65" width="107.168" height="119.35" rx="3" fill="#c0432f"/><text x="293.284" y="249.65" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="293.284" dy="0">190</tspan></text><text x="237.7" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="237.7" dy="0">20 × 20</tspan></text><rect x="401.452" y="291.738" width="107.168" height="83.2622" rx="3" fill="#087f8c"/><text x="455.036" y="285.738" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="455.036" dy="0">78</tspan></text><rect x="512.62" y="198.405" width="107.168" height="176.595" rx="3" fill="#c0432f"/><text x="566.204" y="192.405" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="566.204" dy="0">780</tspan></text><text x="510.62" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="510.62" dy="0">40 × 40</tspan></text><rect x="674.372" y="263.125" width="107.168" height="111.875" rx="3" fill="#087f8c"/><text x="727.956" y="257.125" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="727.956" dy="0">158</tspan></text><rect x="785.54" y="141.696" width="107.168" height="233.304" rx="3" fill="#c0432f"/><text x="839.124" y="135.696" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="839.124" dy="0">3 160</tspan></text><text x="783.54" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="783.54" dy="0">80 × 80</tspan></text><rect x="10" y="427" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Nodos y aristas: 400 y 760, 1 600 y 3 120, 6 400 y 12 640; BFS visita todos los nodos y DFS 229, 859 y 3 319. El camino de</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">DFS es 5, 10 y 20 veces más largo que el óptimo. Elegir entre ambos es elegir qué propiedad se necesita: mínima cantidad de</tspan></text><text x="470" y="485.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">aristas o simple alcanzabilidad.</tspan></text><text x="470" y="532.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Cuentas deterministas sobre rejillas sin obstáculos; no dependen del equipo.</tspan></text></svg>
