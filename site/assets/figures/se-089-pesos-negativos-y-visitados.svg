<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 495" width="950" height="495" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuando el recorrido correcto deja de serlo</title><desc id="d">Tabla de cinco casos: BFS minimiza saltos pero no costo, Dijkstra falla con aristas negativas y Bellman-Ford no, un recorrido sin conjunto de visitados no termina, una pared parte la rejilla en dos componentes y el DFS recursivo agota la pila.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="495" fill="#ffffff"/><rect x="10" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Caso</tspan></text><rect x="390" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="537" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="537" dy="0">Resultado</tspan></text><rect x="690" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="812" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="812" dy="0">Alternativa</tspan></text><rect x="10" y="56" width="374" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="90.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Aristas con costos 10 (A→B) o 1+1+1 (A→C→D→B)</tspan></text><rect x="390" y="56" width="294" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="90.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">BFS: 1 salto, costo real 10</tspan></text><rect x="690" y="56" width="244" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="90.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">Dijkstra: costo 3</tspan></text><rect x="10" y="124" width="374" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="158.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Arista negativa (C→B = −2) y B→D = 3</tspan></text><rect x="390" y="124" width="294" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="158.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">Dijkstra con nodos cerrados: D = 5</tspan></text><rect x="690" y="124" width="244" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="158.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">Bellman-Ford: D = 4</tspan></text><rect x="10" y="192" width="374" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="218.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Recorrido sin conjunto de visitados en una rejilla</tspan></text><text x="197" y="234.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">de 25 nodos</tspan></text><rect x="390" y="192" width="294" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="226.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">100 000 expansiones (corté por tope)</tspan></text><rect x="690" y="192" width="244" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="226.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">Con visitados: 25 expansiones</tspan></text><rect x="10" y="260" width="374" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="294.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Rejilla de 6×6 con una pared completa</tspan></text><rect x="390" y="260" width="294" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="294.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">2 componentes conexas</tspan></text><rect x="690" y="260" width="244" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="294.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">Sin pared: 1 componente</tspan></text><rect x="10" y="328" width="374" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="362.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">DFS recursivo sobre una cadena de 5 001 nodos</tspan></text><rect x="390" y="328" width="294" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="362.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">RecursionError</tspan></text><rect x="690" y="328" width="244" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="362.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">Pila explícita: funciona</tspan></text><rect x="10" y="400" width="930" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="475" y="424.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Cada algoritmo trae una precondición sobre el grafo: pesos no negativos para Dijkstra, ausencia de ciclos negativos para</tspan></text><text x="475" y="441.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Bellman-Ford. Un resultado «razonable» con la precondición violada es el peor fallo porque no avisa.</tspan></text><text x="475" y="481.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Cuentas deterministas; no dependen del equipo.</tspan></text></svg>
