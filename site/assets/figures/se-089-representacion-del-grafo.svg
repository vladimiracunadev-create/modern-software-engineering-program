<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 435" width="950" height="435" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Representación del grafo y costo del recorrido</title><desc id="d">Tabla: para 2000 nodos y 7993 aristas la lista de adyacencia ocupa unos 360 kilobytes y obtener los vecinos tarda 0,3 microsegundos, mientras que la matriz ocupa 4,1 megabytes y tarda 135,9 microsegundos; un BFS completo tarda 3,6, 12,4 y 39,2 milisegundos al cuadruplicar las aristas aproximadamente.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="435" fill="#ffffff"/><rect x="10" y="12" width="424" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="222" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="222" dy="0">Representación o recorrido</tspan></text><rect x="440" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="562" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="562" dy="0">Memoria</tspan></text><rect x="690" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="812" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="812" dy="0">Tiempo</tspan></text><rect x="10" y="56" width="424" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="84.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Lista de adyacencia (2 000 nodos, 7 993 aristas)</tspan></text><rect x="440" y="56" width="244" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="84.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">≈ 360 KB</tspan></text><rect x="690" y="56" width="244" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="84.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">Vecinos de un nodo: 0,3 µs</tspan></text><rect x="10" y="112" width="424" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="140.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Matriz de adyacencia (bytearray por fila)</tspan></text><rect x="440" y="112" width="244" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="140.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">≈ 4,1 MB (4 000 000 celdas)</tspan></text><rect x="690" y="112" width="244" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="140.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">Vecinos de un nodo: 135,9 µs</tspan></text><rect x="10" y="168" width="424" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="196.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">BFS completo, rejilla de 50 × 50 (4 900 aristas)</tspan></text><rect x="440" y="168" width="244" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="196.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">—</tspan></text><rect x="690" y="168" width="244" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="196.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">3,6 ms</tspan></text><rect x="10" y="224" width="424" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="252.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">BFS completo, rejilla de 100 × 100 (19 800 aristas)</tspan></text><rect x="440" y="224" width="244" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="252.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">—</tspan></text><rect x="690" y="224" width="244" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="252.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">12,4 ms</tspan></text><rect x="10" y="280" width="424" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="308.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">BFS completo, rejilla de 200 × 200 (79 600 aristas)</tspan></text><rect x="440" y="280" width="244" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="308.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">—</tspan></text><rect x="690" y="280" width="244" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="308.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">39,2 ms</tspan></text><rect x="10" y="340" width="930" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="475" y="364.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">La matriz paga V² celdas aunque el grafo sea disperso (0,4 % de ocupación). Al multiplicar V+E por 4, el BFS tardó 3,5 y 3,2</tspan></text><text x="475" y="381.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">veces más: consistente con O(V+E).</tspan></text><text x="475" y="421.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Medido con CPython 3.12.9 en Windows 11; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
