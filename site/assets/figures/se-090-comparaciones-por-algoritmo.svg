<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 317" width="950" height="317" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Comparaciones contadas con 800 elementos</title><desc id="d">Tabla de comparaciones para 800 elementos: sorted (Timsort) usa 6655 con datos aleatorios y 799 con datos ordenados o invertidos; inserción usa 157 960, 799 y 319 600; mezcla usa 6695, 3728 y 4048; quicksort con el primer elemento como pivote usa 16 284, 639 200 y 639 200.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="317" fill="#ffffff"/><rect x="10" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="82" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="82" dy="0">Entrada</tspan></text><rect x="160" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="252" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="252" dy="0">sorted (Timsort)</tspan></text><rect x="350" y="12" width="174" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="437" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="437" dy="0">Inserción</tspan></text><rect x="530" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="622" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="622" dy="0">Mezcla (merge)</tspan></text><rect x="720" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="827" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="827" dy="0">Quicksort, pivote =</tspan></text><text x="827" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="827" dy="0">primero</tspan></text><rect x="10" y="56" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="83.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">aleatoria</tspan></text><rect x="160" y="56" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="252" y="83.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="252" dy="0">6 655</tspan></text><rect x="350" y="56" width="174" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="83.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">157 960</tspan></text><rect x="530" y="56" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="83.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">6 695</tspan></text><rect x="720" y="56" width="214" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="83.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">16 284</tspan></text><rect x="10" y="110" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="137.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">ya ordenada</tspan></text><rect x="160" y="110" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="252" y="137.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="252" dy="0">799</tspan></text><rect x="350" y="110" width="174" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="137.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">799</tspan></text><rect x="530" y="110" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="137.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">3 728</tspan></text><rect x="720" y="110" width="214" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="137.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">639 200</tspan></text><rect x="10" y="164" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="191.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">invertida</tspan></text><rect x="160" y="164" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="252" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="252" dy="0">799</tspan></text><rect x="350" y="164" width="174" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">319 600</tspan></text><rect x="530" y="164" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">4 048</tspan></text><rect x="720" y="164" width="214" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">639 200</tspan></text><rect x="10" y="222" width="930" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="475" y="246.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Referencia: n·log₂ n = 7 715 y n(n−1)/2 = 319 600. El quicksort con pivote ingenuo se vuelve cuadrático justo con la entrada</tspan></text><text x="475" y="263.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">«ya ordenada», la más común en la práctica; Timsort aprovecha el orden existente y usa n−1 comparaciones.</tspan></text><text x="475" y="303.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Comparaciones contadas con __lt__ y semilla fija; no dependen del equipo.</tspan></text></svg>
