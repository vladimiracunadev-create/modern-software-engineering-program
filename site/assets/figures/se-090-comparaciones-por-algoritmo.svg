<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 413" width="940" height="413" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Comparaciones contadas con 800 elementos</title><desc id="d">Mapa de calor con las comparaciones de cuatro algoritmos de ordenación con 800 elementos según la entrada: sorted usa 6655 con datos aleatorios y 799 con ordenados o invertidos; inserción 157 960, 799 y 319 600; mezcla 6695, 3728 y 4048; quicksort con el primer elemento como pivote 16 284, 639 200 y 639 200; las celdas oscuras son las cuadráticas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="413" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Comparaciones contadas con 800 elementos</tspan></text><text x="361.35" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="361.35" dy="0">Aleatoria</tspan></text><text x="584.81" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="584.81" dy="0">Ya ordenada</tspan></text><text x="808.27" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="808.27" dy="0">Invertida</tspan></text><text x="239.62" y="98.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="239.62" dy="0">sorted (Timsort)</tspan></text><text x="239.62" y="142.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="239.62" dy="0">Inserción</tspan></text><text x="239.62" y="186.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="239.62" dy="0">Mezcla (merge)</tspan></text><text x="239.62" y="230.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="239.62" dy="0">Quicksort, pivote = primero</tspan></text><rect x="251.12" y="73.5" width="220.46" height="41" rx="4" fill="#fae3dc" stroke="#ffffff" stroke-width="1"/><text x="361.35" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="361.35" dy="0">6 655</tspan></text><rect x="474.58" y="73.5" width="220.46" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="584.81" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="584.81" dy="0">799</tspan></text><rect x="698.04" y="73.5" width="220.46" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="808.27" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="808.27" dy="0">799</tspan></text><rect x="251.12" y="117.5" width="220.46" height="41" rx="4" fill="#ecbcb3" stroke="#102a43" stroke-width="3"/><text x="361.35" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="361.35" dy="0">157 960</tspan></text><rect x="474.58" y="117.5" width="220.46" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="584.81" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="584.81" dy="0">799</tspan></text><rect x="698.04" y="117.5" width="220.46" height="41" rx="4" fill="#de9487" stroke="#102a43" stroke-width="3"/><text x="808.27" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="808.27" dy="0">319 600</tspan></text><rect x="251.12" y="161.5" width="220.46" height="41" rx="4" fill="#fae3dc" stroke="#ffffff" stroke-width="1"/><text x="361.35" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="361.35" dy="0">6 695</tspan></text><rect x="474.58" y="161.5" width="220.46" height="41" rx="4" fill="#fbe3dd" stroke="#ffffff" stroke-width="1"/><text x="584.81" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="584.81" dy="0">3 728</tspan></text><rect x="698.04" y="161.5" width="220.46" height="41" rx="4" fill="#fbe3dd" stroke="#ffffff" stroke-width="1"/><text x="808.27" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="808.27" dy="0">4 048</tspan></text><rect x="251.12" y="205.5" width="220.46" height="41" rx="4" fill="#fae0da" stroke="#ffffff" stroke-width="1"/><text x="361.35" y="230.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="361.35" dy="0">16 284</tspan></text><rect x="474.58" y="205.5" width="220.46" height="41" rx="4" fill="#c0432f" stroke="#102a43" stroke-width="3"/><text x="584.81" y="230.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="584.81" dy="0">639 200</tspan></text><rect x="698.04" y="205.5" width="220.46" height="41" rx="4" fill="#c0432f" stroke="#102a43" stroke-width="3"/><text x="808.27" y="230.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="808.27" dy="0">639 200</tspan></text><text x="249.62" y="274" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="249.62" dy="0">799</tspan></text><rect x="280.24" y="262" width="30.5" height="14" fill="#fbe4de"/><rect x="310.24" y="262" width="30.5" height="14" fill="#f3cdc5"/><rect x="340.24" y="262" width="30.5" height="14" fill="#eab6ac"/><rect x="370.24" y="262" width="30.5" height="14" fill="#e29f93"/><rect x="400.24" y="262" width="30.5" height="14" fill="#d9887a"/><rect x="430.24" y="262" width="30.5" height="14" fill="#d17161"/><rect x="460.24" y="262" width="30.5" height="14" fill="#c85a48"/><rect x="490.24" y="262" width="30.5" height="14" fill="#c0432f"/><text x="528.24" y="274" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="528.24" dy="0">639 200</tspan></text><text x="589.02" y="274" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="589.02" dy="0">más oscuro = mayor (comparaciones)</tspan></text><rect x="10" y="290" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="314.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Referencia: n·log₂ n = 7 715 y n(n−1)/2 = 319 600. El quicksort con pivote ingenuo se vuelve cuadrático justo con la</tspan></text><text x="470" y="331.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">entrada «ya ordenada», la más común en la práctica; Timsort aprovecha el orden existente y usa n−1 comparaciones. Contorno:</tspan></text><text x="470" y="348.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">casos cuadráticos.</tspan></text><text x="470" y="395.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Comparaciones contadas con __lt__ y semilla fija; no dependen del equipo.</tspan></text></svg>
