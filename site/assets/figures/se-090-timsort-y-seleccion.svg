<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 292" width="960" height="292" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">sorted() sobre datos aleatorios, ordenados e invertidos</title><desc id="d">Tabla de tiempos de sorted con 100 000 y 200 000 flotantes: aleatorios 22,9 y 55,5 milisegundos; ya ordenados 1,87 y 5,19; invertidos 2,31 y 5,91.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="292" fill="#ffffff"/><rect x="10" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="102" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="102" dy="0">n</tspan></text><rect x="200" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="322" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="322" dy="0">Aleatoria</tspan></text><rect x="450" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="572" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="572" dy="0">Ya ordenada</tspan></text><rect x="700" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="822" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="822" dy="0">Invertida</tspan></text><rect x="10" y="56" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="82.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">100 000</tspan></text><rect x="200" y="56" width="244" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="322" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="322" dy="0">22,9 ms</tspan></text><rect x="450" y="56" width="244" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">1,87 ms</tspan></text><rect x="700" y="56" width="244" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">2,31 ms</tspan></text><rect x="10" y="108" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="134.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">200 000</tspan></text><rect x="200" y="108" width="244" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="322" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="322" dy="0">55,5 ms</tspan></text><rect x="450" y="108" width="244" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">5,19 ms</tspan></text><rect x="700" y="108" width="244" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">5,91 ms</tspan></text><rect x="10" y="164" width="940" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="188.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Timsort detecta tramos ya ordenados («runs») y los mezcla: los datos ordenados o invertidos fueron 12 y 10 veces más rápidos.</tspan></text><text x="480" y="205.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">La búsqueda binaria necesitó 10, 20 y 30 pasos para 10³, 10⁶ y 10⁹ elementos. Mediana de 100 000 números: sorted()[n//2] tardó</tspan></text><text x="480" y="222.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">22,3 ms, un quickselect en Python puro 40,8 ms (promedio 2,3 pasadas por elemento) y heapq.nsmallest(1) 1,32 ms para el</tspan></text><text x="480" y="238.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">mínimo.</tspan></text><text x="480" y="278.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Medido con CPython 3.12.9 en Windows 11; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
