<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 311" width="950" height="311" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Subsecuencia común más larga: celdas, tiempo y memoria</title><desc id="d">Tabla: la tabla de programación dinámica tiene 63 001, 251 001 y 1 002 001 celdas para cadenas de 250, 500 y 1000 caracteres y tarda 22, 92 y 506 milisegundos; con 1000 caracteres el pico de memoria fue 11,97 MB con la tabla completa y 44 KB con dos filas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="311" fill="#ffffff"/><rect x="10" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="137" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="137" dy="0">Cadenas</tspan></text><rect x="270" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="432" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="432" dy="0">Celdas de la tabla</tspan></text><rect x="600" y="12" width="334" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="767" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="767" dy="0">Tiempo en Windows</tspan></text><rect x="10" y="56" width="254" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="82.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">250 × 250</tspan></text><rect x="270" y="56" width="324" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">63 001</tspan></text><rect x="600" y="56" width="334" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">22,0 ms</tspan></text><rect x="10" y="108" width="254" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="134.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">500 × 500</tspan></text><rect x="270" y="108" width="324" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">251 001</tspan></text><rect x="600" y="108" width="334" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">92,1 ms</tspan></text><rect x="10" y="160" width="254" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="186.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">1 000 × 1 000</tspan></text><rect x="270" y="160" width="324" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">1 002 001</tspan></text><rect x="600" y="160" width="334" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">506 ms</tspan></text><rect x="10" y="216" width="930" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="475" y="240.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="475" dy="0">Duplicar la longitud cuadruplica las celdas (y el tiempo ×4,2 y ×5,5). Guardar solo dos filas dio el mismo resultado con 44</tspan></text><text x="475" y="257.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="475" dy="0">192 bytes en vez de 11 972 832: 271 veces menos memoria, pero sin poder reconstruir la subsecuencia.</tspan></text><text x="475" y="297.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Medido con CPython 3.12.9 en Windows 11; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
