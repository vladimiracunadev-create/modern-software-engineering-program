<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 542" width="940" height="542" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Subsecuencia común más larga: celdas, tiempo y memoria</title><desc id="d">Línea en doble escala logarítmica con el tiempo de la tabla de programación dinámica para cadenas de 250, 500 y 1000 caracteres: 22, 92 y 506 milisegundos con 63 001, 251 001 y 1 002 001 celdas; duplicar la longitud cuadruplica las celdas y multiplica el tiempo por 4,2 y 5,5.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="542" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Subsecuencia común más larga: celdas, tiempo y memoria</tspan></text><line x1="93.7" y1="359" x2="910" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="359" x2="93.7" y2="359" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="363.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">10</tspan></text><line x1="93.7" y1="209" x2="910" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="209" x2="93.7" y2="209" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="213.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">100</tspan></text><line x1="93.7" y1="59" x2="910" y2="59" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="59" x2="93.7" y2="59" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="63.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1 000</tspan></text><line x1="93.7" y1="59" x2="93.7" y2="359" stroke="#5b7280" stroke-width="1.6"/><line x1="111.7" y1="59" x2="111.7" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="111.7" y1="359" x2="111.7" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="111.7" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="111.7" dy="0">250 (63 001 celdas)</tspan></text><line x1="501.85" y1="59" x2="501.85" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="501.85" y1="359" x2="501.85" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="501.85" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="501.85" dy="0">500 (251 001 celdas)</tspan></text><line x1="892" y1="59" x2="892" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="359" x2="892" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">1 000 (1 002 001 celdas)</tspan></text><line x1="93.7" y1="359" x2="910" y2="359" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="209" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 209)">Tiempo (ms) (escala logarítmica)</text><text x="501.85" y="405" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="501.85" dy="0">Longitud de cada cadena (caracteres) (escala logarítmica)</tspan></text><polyline points="111.7,307.637 501.85,214.361 892,103.377" fill="none" stroke="#087f8c" stroke-width="2.4"/><circle cx="111.7" cy="307.637" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="111.7" y="296.637" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="111.7" dy="0">22,0 ms</tspan></text><circle cx="501.85" cy="214.361" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="501.85" y="203.361" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="501.85" dy="0">92,1 ms</tspan></text><circle cx="892" cy="103.377" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="92.3774" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">506 ms</tspan></text><rect x="10" y="419" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="443.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Con cadenas de 1 000 caracteres el pico de memoria fue 11,97 MB con la tabla completa y 44 KB con dos filas: 271 veces</tspan></text><text x="470" y="460.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">menos memoria, pero sin poder reconstruir la subsecuencia. Guardar solo dos filas dio el mismo resultado con 44 192 bytes</tspan></text><text x="470" y="477.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">en vez de 11 972 832.</tspan></text><text x="470" y="524.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
