<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 550" width="940" height="550" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Divide y vencerás: mezcla, subarreglo máximo y particiones desiguales</title><desc id="d">Barras agrupadas con las comparaciones de la ordenación por mezcla para 1000, 10 000 y 100 000 elementos frente a n log2 n: 8678, 120 398 y 1 536 147 contra 9966, 132 877 y 1 660 964, con profundidad de recursión 10, 14 y 17; la mezcla se queda justo bajo la predicción teórica.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="550" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Divide y vencerás: mezcla, subarreglo máximo y particiones desiguales</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Comparaciones de mezcla</tspan></text><rect x="237.42" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="257.42" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="257.42" dy="0">n·log₂ n</tspan></text><line x1="131.4" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="126.4" y1="375" x2="131.4" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="122.4" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="122.4" dy="0">1 000</tspan></text><line x1="131.4" y1="305" x2="920" y2="305" stroke="#d5dde1" stroke-width="1"/><line x1="126.4" y1="305" x2="131.4" y2="305" stroke="#5b7280" stroke-width="1.4"/><text x="122.4" y="309.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="122.4" dy="0">10 000</tspan></text><line x1="131.4" y1="235" x2="920" y2="235" stroke="#d5dde1" stroke-width="1"/><line x1="126.4" y1="235" x2="131.4" y2="235" stroke="#5b7280" stroke-width="1.4"/><text x="122.4" y="239.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="122.4" dy="0">100 000</tspan></text><line x1="131.4" y1="165" x2="920" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="126.4" y1="165" x2="131.4" y2="165" stroke="#5b7280" stroke-width="1.4"/><text x="122.4" y="169.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="122.4" dy="0">1 000 000</tspan></text><line x1="131.4" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="126.4" y1="95" x2="131.4" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="122.4" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="122.4" dy="0">10 000 000</tspan></text><line x1="131.4" y1="95" x2="131.4" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">comparaciones (escala logarítmica)</text><rect x="157.687" y="309.311" width="103.147" height="65.6894" rx="3" fill="#087f8c"/><text x="209.26" y="303.311" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="209.26" dy="0">8 678</tspan></text><rect x="264.833" y="305.104" width="103.147" height="69.8965" rx="3" fill="#6b7c86"/><text x="316.407" y="299.104" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="316.407" dy="0">9 966</tspan></text><text x="262.833" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="262.833" dy="0">n = 1 000 · profundidad 10</tspan></text><rect x="420.553" y="229.357" width="103.147" height="145.643" rx="3" fill="#087f8c"/><text x="472.127" y="223.357" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="472.127" dy="0">120 398</tspan></text><rect x="527.7" y="226.359" width="103.147" height="148.641" rx="3" fill="#6b7c86"/><text x="579.273" y="220.359" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="579.273" dy="0">132 877</tspan></text><text x="525.7" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="525.7" dy="0">n = 10 000 · profundidad 14</tspan></text><rect x="683.42" y="151.95" width="103.147" height="223.05" rx="3" fill="#087f8c"/><text x="734.993" y="145.95" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="734.993" dy="0">1 536 147</tspan></text><rect x="790.567" y="149.575" width="103.147" height="225.425" rx="3" fill="#6b7c86"/><text x="842.14" y="143.575" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="842.14" dy="0">1 660 964</tspan></text><text x="788.567" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="788.567" dy="0">n = 100 000 · profundidad 17</tspan></text><rect x="10" y="427" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Dividir en mitades da profundidad log n; dividir quitando un elemento da profundidad n (RecursionError con 2 000). Para el</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">subarreglo máximo, 500 de 500 casos coincidieron entre divide y vencerás, Kadane y fuerza bruta (6,22 ms frente a 0,62 ms</tspan></text><text x="470" y="485.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de Kadane): el esquema no siempre es el mejor algoritmo.</tspan></text><text x="470" y="532.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
