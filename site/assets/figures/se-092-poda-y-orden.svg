<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 501" width="950" height="501" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Podar y ordenar las decisiones</title><desc id="d">Tabla: con poda la suma de subconjunto visita 4441 nodos frente a 450 869 sin poda y 524 287 en el árbol completo, con las mismas 277 soluciones; en 16 reinas la primera solución exige 10 053 nodos con orden ascendente y 26 empezando por el centro.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="501" fill="#ffffff"/><rect x="10" y="12" width="424" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="222" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="222" dy="0">Búsqueda</tspan></text><rect x="440" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="572" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="572" dy="0">Nodos visitados</tspan></text><rect x="710" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="822" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="822" dy="0">Lectura</tspan></text><rect x="10" y="56" width="424" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="89.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Suma de subconjunto, 18 números, objetivo 100</tspan></text><rect x="440" y="56" width="264" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="89.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">4 441 nodos</tspan></text><rect x="710" y="56" width="224" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="89.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">277 soluciones</tspan></text><rect x="10" y="122" width="424" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="155.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">La misma búsqueda sin poda</tspan></text><rect x="440" y="122" width="264" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="155.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">450 869 nodos</tspan></text><rect x="710" y="122" width="224" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="155.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">277 soluciones</tspan></text><rect x="10" y="188" width="424" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="221.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Máximo del árbol completo (2¹⁹ − 1)</tspan></text><rect x="440" y="188" width="264" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="221.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">524 287 nodos</tspan></text><rect x="710" y="188" width="224" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="221.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">—</tspan></text><rect x="10" y="254" width="424" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="279.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">8 reinas: primera solución con columnas 0..7, 7..0 o desde</tspan></text><text x="222" y="295.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">el centro</tspan></text><rect x="440" y="254" width="264" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="287.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">114 / 114 / 15 nodos</tspan></text><rect x="710" y="254" width="224" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="287.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">El orden importa</tspan></text><rect x="10" y="320" width="424" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="353.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">16 reinas: las mismas tres órdenes</tspan></text><rect x="440" y="320" width="264" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="353.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">10 053 / 10 053 / 26 nodos</tspan></text><rect x="710" y="320" width="224" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="353.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">387 veces menos</tspan></text><rect x="10" y="390" width="930" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="475" y="414.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">La poda válida elimina solo ramas que no pueden contener soluciones; el orden de las decisiones no cambia qué existe, cambia</tspan></text><text x="475" y="431.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">qué se encuentra primero. Si una poda elimina una solución real, el conteo de soluciones difiere del de la fuerza bruta: esa</tspan></text><text x="475" y="448.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">comparación es la prueba.</tspan></text><text x="475" y="487.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Cuentas deterministas con semilla fija; no dependen del equipo.</tspan></text></svg>
