<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 431" width="950" height="431" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">N reinas: nodos visitados con poda frente a permutaciones</title><desc id="d">Tabla: el número de soluciones es 2, 10, 4, 40, 92 y 352 para 4 a 9 reinas; el retroceso con poda visita 17, 54, 153, 552, 2057 y 8394 nodos, muy por debajo de las n factorial permutaciones (24 a 362 880).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="431" fill="#ffffff"/><rect x="10" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="77" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="77" dy="0">n</tspan></text><rect x="150" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="262" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="262" dy="0">Soluciones</tspan></text><rect x="380" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="512" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="512" dy="0">Nodos con poda</tspan></text><rect x="650" y="12" width="284" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="792" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="792" dy="0">Permutaciones (n!)</tspan></text><rect x="10" y="56" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="77"