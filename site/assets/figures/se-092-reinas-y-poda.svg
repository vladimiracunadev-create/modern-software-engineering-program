<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 554" width="940" height="554" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">N reinas: nodos visitados con poda frente a permutaciones</title><desc id="d">Líneas en escala logarítmica vertical con los nodos que visita el retroceso con poda (17, 54, 153, 552, 2057 y 8394) frente a las n factorial permutaciones (24 a 362 880) para 4 a 9 reinas: la brecha crece con n, de 1,4 veces a 43 veces.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="554" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">N reinas: nodos visitados con poda frente a permutaciones</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Permutaciones (n!)</tspan></text><rect x="199.72" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="219.72" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="219.72" dy="0">Nodos con poda</tspan></text><line x1="123.86" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="118.86" y1="387" x2="123.86" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="114.86" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="114.86" dy="0">10</tspan></text><line x1="123.86" y1="327" x2="910" y2="327" stroke="#d5dde1" stroke-width="1"/><line x1="118.86" y1="327" x2="123.86"