-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="475" dy="0">las 92 soluciones: la poda cambia el costo, no el resultado.</tspan></text><text x="475" y="417.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Medido con CPython 3.12.9 en Windows 11; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
