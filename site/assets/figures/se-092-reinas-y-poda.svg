oke="#087f8c" stroke-width="2"/><text x="151.86" y="377.673" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="151.86" dy="0">17</tspan></text><rect x="286.388" y="337.556" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="291.888" y="367.056" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="291.888" dy="0">54</tspan></text><rect x="436.416" y="310.419" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="441.916" y="339.919" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="441.916" dy="0">153</tspan></text><rect x="586.444" y="276.984" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="591.944" y="306.484" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="591.944" dy="0">552</tspan></text><rect x="736.472" y="242.706" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="741.972" y="272.206" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="741.972" dy="0">2 057</tspan></text><rect x="886.5" y="206.062" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="235.562" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">8 394</tspan></text><rect x="10" y="447" width="920" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Soluciones halladas: 2, 10, 4, 40, 92 y 352 para n = 4 a 9. Con n = 8 el retroceso tardó 3,9 ms y generar y filtrar las 40</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">320 permutaciones 38,2 ms (Linux: 4,0 y 42,7). Ambos hallaron las 92 soluciones: la poda cambia el costo, no el resultado.</tspan></text><text x="470" y="536.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
