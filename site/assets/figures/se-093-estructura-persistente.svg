<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" width="940" height="420" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Estructura persistente: la versión nueva comparte casi todos los nodos</title><desc id="d">Un árbol binario balanceado de 4095 nodos se actualiza insertando una clave copiando el camino: se crean 13 nodos y 4083 nodos quedan compartidos entre las versiones; en total existen 4108 nodos distintos en lugar de 8190. Copiar la lista completa de 4095 elementos tardó entre 14 y 19 microsegundos y copiar el camino entre 7 y 16: el tiempo es comparable, la ganancia es de memoria.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="420" fill="#ffffff"/><rect x="10" y="14" width="440" height="54" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="230" y="44.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="230" dy="0">Versión 1: 4 095 nodos</tspan></text><rect x="490" y="14" width="440" height="54" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="710" y="44.92" font-size="14" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="710" dy="0">Versión 2: copia 13 nodos del camino</tspan></text><rect x="10" y="92" width="270" height="90" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="145" y="131.96" font-size="14" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="145" dy="0">Nodos compartidos por ambas</tspan></text><text x="145" y="149.88" font-size="14" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="145" dy="0">versiones: 4 083</tspan></text><rect x="300" y="92" width="270" height="90" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="435" y="131.96" font-size="14" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="435" dy="0">Nodos que existen solo en la</tspan></text><text x="435" y="149.88" font-size="14" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="435" dy="0">versión 2: 13</tspan></text><rect x="590" y="92" width="340" height="90" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="760" y="131.96" font-size="14" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="760" dy="0">Nodos distintos en memoria: 4 108 (no 8</tspan></text><text x="760" y="149.88" font-size="14" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="760" dy="0">190)</tspan></text><rect x="10" y="206" width="440" height="74" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="230" y="238.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="230" dy="0">Copiar la lista de 4 095 referencias (memcpy): 13,6–19,0</tspan></text><text x="230" y="254.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="230" dy="0">µs. Crea 4 095 ranuras nuevas</tspan></text><rect x="490" y="206" width="440" height="74" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="710" y="238.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="710" dy="0">Copiar el camino de 13 nodos: 6,6–16,0 µs. Crea 13 nodos</tspan></text><text x="710" y="254.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="710" dy="0">nuevos; el tiempo es parecido, la memoria no</tspan></text><rect x="10" y="300" width="920" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="330.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Una referencia mutable compartida rompe la promesa: con b = a; b.append(4), la lista a pasó a [1, 2, 3, 4]. La persistencia</tspan></text><text x="470" y="346.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">exige no modificar nodos ya publicados.</tspan></text><text x="470" y="402" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
