<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 501" width="950" height="501" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Estructuras probabilísticas: el error es un parámetro que se elige</title><desc id="d">Tabla: un filtro de Bloom con 8 bits por elemento dio 2,12 por ciento de falsos positivos frente a 2,16 teórico y ningún falso negativo; Count-Min nunca subestimó y su error medio pasó de 187,8 con una fila a 0,02 con cuatro; HyperLogLog con 1024 registros estimó 103 020 para 100 000 con 3,02 por ciento de error.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="501" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Estructura y configuración</tspan></text><rect x="340" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="487" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="487" dy="0">Error medido</tspan></text><rect x="640" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="787" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="787" dy="0">Referencia</tspan></text><rect x="10" y="56" width="324" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="89.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Bloom, 8 bits por elemento (k = 6)</tspan></text><rect x="340" y="56" width="294" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="89.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">falsos positivos 2,12 %</tspan></text><rect x="640" y="56" width="294" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="89.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">teoría 2,16 %; 0 falsos negativos</tspan></text><rect x="10" y="122" width="324" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="155.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Bloom, 16 bits por elemento (k = 11)</tspan></text><rect x="340" y="122" width="294" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="155.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">falsos positivos 0,04 %</tspan></text><rect x="640" y="122" width="294" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="147.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">teoría 0,05 %; 20 000 B frente a 1 003</tspan></text><text x="787" y="163.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">394 B de un set</tspan></text><rect x="10" y="188" width="324" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="221.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Count-Min 1 000 × 4 sobre 100 000 eventos</tspan></text><rect x="340" y="188" width="294" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="221.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">sobreestima 0,02 en promedio, máx. 2</tspan></text><rect x="640" y="188" width="294" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="221.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">Nunca subestima</tspan></text><rect x="10" y="254" width="324" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="287.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Count-Min de una sola fila de 1 000</tspan></text><rect x="340" y="254" width="294" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="279.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">sobreestima 187,8 en promedio, máx. 53</tspan></text><text x="487" y="295.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">591</tspan></text><rect x="640" y="254" width="294" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="287.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">Las filas extra reducen el error</tspan></text><rect x="10" y="320" width="324" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="345.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">HyperLogLog, 1 024 registros, 100 000</tspan></text><text x="172" y="361.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">distintos</tspan></text><rect x="340" y="320" width="294" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="353.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">estima 103 020 (error 3,02 %)</tspan></text><rect x="640" y="320" width="294" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="353.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">Error teórico ≈ 3,25 %</tspan></text><rect x="10" y="390" width="930" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="475" y="414.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">Cada una renuncia a algo declarado: Bloom a decir «sí» con certeza, Count-Min a la exactitud (sobreestima) y HyperLogLog a</tspan></text><text x="475" y="431.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">la identidad de los elementos. Con 10 000 distintos HyperLogLog acertó casi exacto (error 0,01 %): el error es una</tspan></text><text x="475" y="448.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">distribución, no un valor fijo.</tspan></text><text x="475" y="487.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Cuentas deterministas con semilla fija; no dependen del equipo.</tspan></text></svg>
