<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 550" width="940" height="550" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Estructuras probabilísticas: el error es un parámetro que se elige</title><desc id="d">Barras agrupadas con el error medido frente al teórico: un filtro de Bloom con 8 bits por elemento dio 2,12 por ciento de falsos positivos frente a 2,16 teórico, con 16 bits 0,04 frente a 0,05, y HyperLogLog con 1024 registros estimó con 3,02 por ciento de error frente a 3,25 teórico, sin falsos negativos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="550" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Estructuras probabilísticas: el error es un parámetro que se elige</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Error medido</tspan></text><rect x="154.48" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="174.48" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="174.48" dy="0">Error teórico</tspan></text><line x1="63.54" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="375" x2="63.54" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">0</tspan></text><line x1="63.54" y1="305" x2="920" y2="305" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="305" x2="63.54" y2="305" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="309.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">1</tspan></text><line x1="63.54" y1="235" x2="920" y2="235" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="235" x2="63.54" y2="235" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="239.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">2</tspan></text><line x1="63.54" y1="165" x2="920" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="165" x2="63.54" y2="165" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="169.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">3</tspan></text><line x1="63.54" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="95" x2="63.54" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">4</tspan></text><line x1="63.54" y1="95" x2="63.54" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">% de error</text><rect x="92.0887" y="226.6" width="112.195" height="148.4" rx="3" fill="#087f8c"/><text x="148.186" y="220.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="148.186" dy="0">2,12</tspan></text><rect x="208.283" y="223.8" width="112.195" height="151.2" rx="3" fill="#6b7c86"/><text x="264.381" y="217.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="264.381" dy="0">2,16</tspan></text><text x="206.283" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="206.283" dy="0">Bloom, 8 bits por elemento (k = 6)</tspan></text><rect x="377.575" y="372.2" width="112.195" height="2.8" rx="3" fill="#087f8c"/><text x="433.673" y="366.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="433.673" dy="0">0,04</tspan></text><rect x="493.77" y="371.5" width="112.195" height="3.5" rx="3" fill="#6b7c86"/><text x="549.867" y="365.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="549.867" dy="0">0,05</tspan></text><text x="491.77" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="491.77" dy="0">Bloom, 16 bits por elemento (k = 11)</tspan></text><rect x="663.062" y="163.6" width="112.195" height="211.4" rx="3" fill="#087f8c"/><text x="719.159" y="157.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="719.159" dy="0">3,02</tspan></text><rect x="779.257" y="147.5" width="112.195" height="227.5" rx="3" fill="#6b7c86"/><text x="835.354" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="835.354" dy="0">3,25</tspan></text><text x="777.257" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777.257" dy="0">HyperLogLog, 1 024 registros</tspan></text><rect x="10" y="427" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Count-Min 1 000 × 4 sobre 100 000 eventos sobreestima 0,02 en promedio (máx. 2) y nunca subestima; con una sola fila de 1</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">000 sobreestima 187,8 en promedio (máx. 53 591). Con 16 bits por elemento el filtro ocupa 20 000 B frente a 1 003 394 B de</tspan></text><text x="470" y="485.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">un set. Cada una renuncia a algo declarado; con 10 000 distintos HyperLogLog acertó casi exacto (error 0,01 %).</tspan></text><text x="470" y="532.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Cuentas deterministas con semilla fija; no dependen del equipo.</tspan></text></svg>
