<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 525" width="950" height="525" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un índice ayuda según cuántas filas selecciona la consulta</title><desc id="d">Tabla: en SQLite con 300 000 filas buscar un correo exacto tardó 21,6 milisegundos con recorrido completo y 0,0059 con índice; una condición que selecciona 1511 filas pasó de 21 a 1 milisegundo y una que selecciona el 90 por ciento apenas cambió de 207 a 197.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="525" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Consulta</tspan></text><rect x="340" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="502" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="502" dy="0">Plan o tiempos</tspan></text><rect x="670" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="802" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="802" dy="0">Lectura</tspan></text><rect x="10" y="56" width="324" height="68" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="93.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">email = ? en 300 000 filas, sin índice</tspan></text><rect x="340" y="56" width="324" height="68" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="93.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">SCAN t</tspan></text><rect x="670" y="56" width="264" height="68" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="93.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">21,6 ms</tspan></text><rect x="10" y="130" width="324" height="68" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="167.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">email = ? con índice</tspan></text><rect x="340" y="130" width="324" height="68" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="159.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">SEARCH t USING COVERING INDEX ix_email</tspan></text><text x="502" y="175.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">(email=?)</tspan></text><rect x="670" y="130" width="264" height="68" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="167.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">0,0059 ms (≈ 3 700 veces menos)</tspan></text><rect x="10" y="204" width="324" height="68" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="241.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">score &lt; 5 (1 511 filas) con y sin índice</tspan></text><rect x="340" y="204" width="324" height="68" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="241.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">índice: 1,02 ms; sin índice: 21,04 ms</tspan></text><rect x="670" y="204" width="264" height="68" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="241.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">20 veces menos</tspan></text><rect x="10" y="278" width="324" height="68" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="307.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">score &lt; 900 (269 990 filas, 90 %) con y sin</tspan></text><text x="172" y="323.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">índice</tspan></text><rect x="340" y="278" width="324" height="68" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="315.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">índice: 196,9 ms; sin índice: 207,1 ms</tspan></text><rect x="670" y="278" width="264" height="68" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="315.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">Casi igual: poca selectividad</tspan></text><rect x="10" y="352" width="324" height="68" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="381.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Conjunción de dos palabras: recorrer 20 000</tspan></text><text x="172" y="397.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">documentos o intersectar listas invertidas</tspan></text><rect x="340" y="352" width="324" height="68" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="389.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">9,55 ms frente a 0,008 ms</tspan></text><rect x="670" y="352" width="264" height="68" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="381.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">8 coincidencias; índice invertido de</tspan></text><text x="802" y="397.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">595 725 entradas</tspan></text><rect x="10" y="430" width="930" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="475" y="454.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">EXPLAIN QUERY PLAN muestra la decisión del planificador: SCAN o SEARCH. El índice cuesta espacio y trabajo en cada</tspan></text><text x="475" y="471.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">escritura; sin selectividad no compensa la lectura.</tspan></text><text x="475" y="511.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Medido con CPython 3.12.9 en Windows 11; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
