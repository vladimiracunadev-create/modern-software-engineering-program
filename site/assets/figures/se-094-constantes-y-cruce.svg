<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Complejidad asintótica y constantes: dónde se cruzan</title><desc id="d">Líneas en doble escala logarítmica con el tiempo de buscar todas las claves: con 4 claves el diccionario tarda 0,5 microsegundos y la búsqueda lineal en pares 0,9; con 16, 1,1 y 5,8; con 64, 3,2 y 73,0; con 256, 12,8 y 1113,5, y la brecha crece de 1,8 a 87 veces.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Complejidad asintótica y constantes: dónde se cruzan</tspan></text><circle cx="22" cy="51" r="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Diccionario</tspan></text><rect x="146.94" y="45" width="12" height="12" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="166.94" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="166.94" dy="0">Recorrido lineal de pares</tspan></text><line x1="101.24" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="387" x2="101.24" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">0,1</tspan></text><line x1="101.24" y1="327" x2="910" y2="327" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="327" x2="101.24" y2="327" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="331.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">1</tspan></text><line x1="101.24" y1="267" x2="910" y2="267" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="267" x2="101.24" y2="267" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="271.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">10</tspan></text><line x1="101.24" y1="207" x2="910" y2="207" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="207" x2="101.24" y2="207" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="211.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">100</tspan></text><line x1="101.24" y1="147" x2="910" y2="147" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="147" x2="101.24" y2="147" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="151.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">1 000</tspan></text><line x1="101.24" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="87" x2="101.24" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">10 000</tspan></text><line x1="101.24" y1="87" x2="101.24" y2="387" stroke="#5b7280" stroke-width="1.6"/><line x1="119.24" y1="87" x2="119.24" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="119.24" y1="387" x2="119.24" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="119.24" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="119.24" dy="0">4</tspan></text><line x1="376.827" y1="87" x2="376.827" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="376.827" y1="387" x2="376.827" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="376.827" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="376.827" dy="0">16</tspan></text><line x1="634.413" y1="87" x2="634.413" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="634.413" y1="387" x2="634.413" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="634.413" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="634.413" dy="0">64</tspan></text><line x1="892" y1="87" x2="892" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="387" x2="892" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">256</tspan></text><line x1="101.24" y1="387" x2="910" y2="387" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 237)">Tiempo (µs) (escala logarítmica)</text><text x="505.62" y="433" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="505.62" dy="0">n claves (escala logarítmica)</tspan></text><polyline points="119.24,345.062 376.827,324.516 634.413,296.691 892,260.567" fill="none" stroke="#087f8c" stroke-width="2.4"/><circle cx="119.24" cy="345.062" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="119.24" y="369.062" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="119.24" dy="0">0,5</tspan></text><circle cx="376.827" cy="324.516" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="376.827" y="348.516" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="376.827" dy="0">1,1</tspan></text><circle cx="634.413" cy="296.691" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="634.413" y="320.691" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="634.413" dy="0">3,2</tspan></text><circle cx="892" cy="260.567" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="284.567" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">12,8</tspan></text><polyline points="119.24,329.745 376.827,281.194 634.413,215.201 892,144.199" fill="none" stroke="#c0432f" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="113.74" y="324.245" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="119.24" y="318.745" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="119.24" dy="0">0,9</tspan></text><rect x="371.327" y="275.694" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="376.827" y="270.194" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="376.827" dy="0">5,8</tspan></text><rect x="628.913" y="209.701" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="634.413" y="204.201" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="634.413" dy="0">73,0</tspan></text><rect x="886.5" y="138.699" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="133.199" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">1 113,5</tspan></text><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Razón entre ambas: 1,8×, 5,3×, 23× y 87×. Con n pequeño las constantes importan y las diferencias son de microsegundos; con</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">n = 256 la razón ya es de 87. Un generador que suma 100 000 enteros tuvo un pico de 520 B frente a 3,99 MB de la lista</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">equivalente: la memoria también se mide.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
