<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 419" width="950" height="419" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Pendiente de la recta log-log: estimar el exponente en vez de adivinarlo</title><desc id="d">Tabla de pendientes log-log del tiempo frente a n: x en lista da 1,02 en Windows y 1,01 en Linux, sorted 1,10 y 1,24, un bucle de insert en cero 2,10 y 2,11 y la pertenencia en un set 0,01 y menos de 0,01.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="419" fill="#ffffff"/><rect x="10" y="12" width="304" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="162" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="162" dy="0">Operación (rango de n)</tspan></text><rect x="320" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="382" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="382" dy="0">Teoría</tspan></text><rect x="450" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="572" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="572" dy="0">Medido: Windows · Linux</tspan></text><rect x="700" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="817" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="817" dy="0">Observación</tspan></text><rect x="10" y="56" width="304" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="89.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">x in lista (n de 1 000 a 16 000)</tspan></text><rect x="320" y="56" width="124" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="382" y="89.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382" dy="0">≈ 1</tspan></text><rect x="450" y="56" width="244" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="89.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">1,02 (Windows) · 1,01 (Linux)</tspan></text><rect x="700" y="56" width="234" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="81.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">La primera pasada en Windows</tspan></text><text x="817" y="97.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">dio 1,21</tspan></text><rect x="10" y="122" width="304" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="155.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">sorted(lista aleatoria) (20 000 a 160 000)</tspan></text><rect x="320" y="122" width="124" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="382" y="155.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382" dy="0">≈ 1 (n log n)</tspan></text><rect x="450" y="122" width="244" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="155.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">1,10 · 1,24</tspan></text><rect x="700" y="122" width="234" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="155.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">log n añade pendiente aparente</tspan></text><rect x="10" y="188" width="304" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="213.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">Bucle de list.insert(0, x) (5 000 a 40</tspan></text><text x="162" y="229.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">000)</tspan></text><rect x="320" y="188" width="124" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="382" y="221.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382" dy="0">2</tspan></text><rect x="450" y="188" width="244" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="221.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">2,10 · 2,11</tspan></text><rect x="700" y="188" width="234" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="221.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">Cuadrático confirmado</tspan></text><rect x="10" y="254" width="304" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="287.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">x in set (1 000 a 1 000 000)</tspan></text><rect x="320" y="254" width="124" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="382" y="287.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382" dy="0">0</tspan></text><rect x="450" y="254" width="244" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="287.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">0,01 · −0,00</tspan></text><rect x="700" y="254" width="234" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="287.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">Constante</tspan></text><rect x="10" y="324" width="930" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="475" y="348.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">Una pendiente de 1,10 no distingue n de n·log n, y una sola pasada puede dar 1,21 o 1,02 para el mismo código. Se reporta el</tspan></text><text x="475" y="365.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">rango de n, la cantidad de repeticiones y varias pasadas; el exponente es una estimación con incertidumbre.</tspan></text><text x="475" y="405.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Medido con CPython 3.12.9 (Windows 11) y 3.12.3 (Ubuntu 24.04, WSL2).</tspan></text></svg>
