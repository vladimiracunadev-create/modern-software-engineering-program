<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 584" width="940" height="584" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Pendiente de la recta log-log: estimar el exponente en vez de adivinarlo</title><desc id="d">Barras agrupadas con la pendiente log-log del tiempo frente a n: x en lista da 1,02 en Windows y 1,01 en Linux frente a la teoría de 1, sorted 1,10 y 1,24 frente a 1 de n log n, un bucle de insert en cero 2,10 y 2,11 frente a 2, y la pertenencia en un set 0,01 y 0 frente a 0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="584" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Pendiente de la recta log-log: estimar el exponente en vez de adivinarlo</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Teoría</tspan></text><rect x="109.24" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="129.24" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="129.24" dy="0">Windows</tspan></text><rect x="210.02" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="230.02" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="230.02" dy="0">Linux (WSL2)</tspan></text><line x1="78.62" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="375" x2="78.62" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="319" x2="920" y2="319" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="319" x2="78.62" y2="319" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="323.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,5</tspan></text><line x1="78.62" y1="263" x2="920" y2="263" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="263" x2="78.62" y2="263" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="267.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">1</tspan></text><line x1="78.62" y1="207" x2="920" y2="207" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="207" x2="78.62" y2="207" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="211.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">1,5</tspan></text><line x1="78.62" y1="151" x2="920" y2="151" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="151" x2="78.62" y2="151" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="155.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">2</tspan></text><line x1="78.62" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="95" x2="78.62" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">2,5</tspan></text><line x1="78.62" y1="95" x2="78.62" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">pendiente log-log</text><rect x="99.6545" y="263" width="53.4253" height="112" rx="3" fill="#6b7c86"/><text x="126.367" y="257" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="126.367" dy="0">1,00</tspan></text><rect x="157.08" y="260.76" width="53.4253" height="114.24" rx="3" fill="#087f8c"/><text x="183.793" y="254.76" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="183.793" dy="0">1,02</tspan></text><rect x="214.505" y="261.88" width="53.4253" height="113.12" rx="3" fill="#c0432f"/><text x="241.218" y="255.88" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="241.218" dy="0">1,01</tspan></text><text x="183.793" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="183.793" dy="0">x in lista (n de 1 000 a 16</tspan></text><text x="183.793" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="183.793" dy="0">000)</tspan></text><rect x="310" y="263" width="53.4253" height="112" rx="3" fill="#6b7c86"/><text x="336.712" y="257" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="336.712" dy="0">1,00</tspan></text><rect x="367.425" y="251.8" width="53.4253" height="123.2" rx="3" fill="#087f8c"/><text x="394.138" y="245.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="394.138" dy="0">1,10</tspan></text><rect x="424.85" y="236.12" width="53.4253" height="138.88" rx="3" fill="#c0432f"/><text x="451.563" y="230.12" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="451.563" dy="0">1,24</tspan></text><text x="394.138" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="394.138" dy="0">sorted(lista aleatoria) (20</tspan></text><text x="394.138" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="394.138" dy="0">000 a 160 000)</tspan></text><rect x="520.345" y="151" width="53.4253" height="224" rx="3" fill="#6b7c86"/><text x="547.057" y="145" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="547.057" dy="0">2,00</tspan></text><rect x="577.77" y="139.8" width="53.4253" height="235.2" rx="3" fill="#087f8c"/><text x="604.483" y="133.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="604.483" dy="0">2,10</tspan></text><rect x="635.195" y="138.68" width="53.4253" height="236.32" rx="3" fill="#c0432f"/><text x="661.908" y="132.68" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="661.908" dy="0">2,11</tspan></text><text x="604.482" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="604.482" dy="0">Bucle de list.insert(0, x)</tspan></text><text x="604.482" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="604.482" dy="0">(5 000 a 40 000)</tspan></text><rect x="730.689" y="373" width="53.4253" height="2" rx="3" fill="#6b7c86"/><text x="757.402" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="757.402" dy="0">0,00</tspan></text><rect x="788.115" y="373" width="53.4253" height="2" rx="3" fill="#087f8c"/><text x="814.827" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="814.827" dy="0">0,01</tspan></text><rect x="845.54" y="373" width="53.4253" height="2" rx="3" fill="#c0432f"/><text x="872.253" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="872.253" dy="0">0,00</tspan></text><text x="814.827" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="814.827" dy="0">x in set (1 000 a 1 000</tspan></text><text x="814.827" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="814.827" dy="0">000)</tspan></text><rect x="10" y="444" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="468.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La primera pasada en Windows de x in lista dio 1,21; la teoría de sorted es n log n y su «≈ 1» lleva una pendiente aparente</tspan></text><text x="470" y="485.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">por el log n. Una pendiente de 1,10 no distingue n de n·log n, y una sola pasada puede dar 1,21 o 1,02 para el mismo</tspan></text><text x="470" y="502.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">código. Se reporta el rango de n, la cantidad de repeticiones y varias pasadas; el exponente es una estimación con</tspan></text><text x="470" y="518.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">incertidumbre.</tspan></text><text x="470" y="566.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 (Windows 11) y 3.12.3 (Ubuntu 24.04, WSL2).</tspan></text></svg>
