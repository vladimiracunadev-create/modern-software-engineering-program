<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 419" width="950" height="419" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Matriz de compromisos medida: operación dominante frente a estructura</title><desc id="d">Tabla: cola de prioridad con montículo 11,2 milisegundos, lista ordenada 50,0 y buscar el mínimo 310,9 para cinco mil elementos; 2000 pertenencias con set 1,64 milisegundos y con lista 315,2; conteo por rango 1,6 microsegundos con bisect y 1036 con recorrido; memoria de 100 000 enteros 0,80 MB en lista, 4,19 en set y 5,24 en dict.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="419" fill="#ffffff"/><rect x="10" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="157" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="157" dy="0">Carga</tspan></text><rect x="310" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="407" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="407" dy="0">Mejor candidato</tspan></text><rect x="510" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="617" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="617" dy="0">Alternativa</tspan></text><rect x="730" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="832" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="832" dy="0">Peor</tspan></text><rect x="10" y="56" width="294" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="89.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Cola de prioridad, 20 000 elementos</tspan></text><rect x="310" y="56" width="194" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="407" y="89.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="407" dy="0">montículo 11,2 ms</tspan></text><rect x="510" y="56" width="214" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="617" y="89.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">lista ordenada 50,0 ms</tspan></text><rect x="730" y="56" width="204" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="81.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">min+remove (5 000): 310,9</tspan></text><text x="832" y="97.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">ms</tspan></text><rect x="10" y="122" width="294" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="155.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">2 000 pertenencias sobre 20 000 claves</tspan></text><rect x="310" y="122" width="194" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="407" y="155.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="407" dy="0">set 1,64 ms</tspan></text><rect x="510" y="122" width="214" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="617" y="155.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">lista 315,2 ms</tspan></text><rect x="730" y="122" width="204" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="155.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">—</tspan></text><rect x="10" y="188" width="294" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="213.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Conteo en un rango de 20 000 claves</tspan></text><text x="157" y="229.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">ordenadas</tspan></text><rect x="310" y="188" width="194" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="407" y="221.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="407" dy="0">bisect 1,6 µs</tspan></text><rect x="510" y="188" width="214" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="617" y="221.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">recorrido 1 036 µs</tspan></text><rect x="730" y="188" width="204" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="221.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">—</tspan></text><rect x="10" y="254" width="294" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="287.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Memoria por 100 000 enteros</tspan></text><rect x="310" y="254" width="194" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="407" y="287.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="407" dy="0">lista 0,80 MB</tspan></text><rect x="510" y="254" width="214" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="617" y="287.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">set 4,19 MB</tspan></text><rect x="730" y="254" width="204" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="287.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">dict 5,24 MB</tspan></text><rect x="10" y="324" width="930" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="475" y="348.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">Cada fila tiene un ganador distinto, y el que gana en tiempo suele perder en memoria. Una recomendación única sin la</tspan></text><text x="475" y="365.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">operación dominante no es defendible; con ella se escribe en una línea.</tspan></text><text x="475" y="405.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Medido con CPython 3.12.9 en Windows 11; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
