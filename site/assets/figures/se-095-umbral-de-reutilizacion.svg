<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 355" width="950" height="355" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">¿Cuántas consultas justifican construir un set?</title><desc id="d">Tabla con n igual a 10 000: con 1 consulta la lista tarda 92,8 microsegundos y construir un set y consultar 173,9; con 3 consultas, 282,9 contra 174,7; con 10, 905,3 contra 272,8; con 100, 8497 contra 188,4.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="355" fill="#ffffff"/><rect x="10" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="127" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="127" dy="0">Consultas sobre 10 000</tspan></text><text x="127" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="127" dy="0">elementos</tspan></text><rect x="250" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="347" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="347" dy="0">Recorrer la lista</tspan></text><rect x="450" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="577" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="577" dy="0">Construir set y consultar</tspan></text><rect x="710" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="822" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="822" dy="0">Lectura</tspan></text><rect x="10" y="56" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="127" y="81.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="127" dy="0">1</tspan></text><rect x="250" y="56" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="347" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="347" dy="0">92,8 µs</tspan></text><rect x="450" y="56" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">173,9 µs</tspan></text><rect x="710" y="56" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">La lista gana</tspan></text><rect x="10" y="106" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="127" y="131.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="127" dy="0">3</tspan></text><rect x="250" y="106" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="347" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="347" dy="0">282,9 µs</tspan></text><rect x="450" y="106" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">174,7 µs</tspan></text><rect x="710" y="106" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">El set ya gana</tspan></text><rect x="10" y="156" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="127" y="181.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="127" dy="0">10</tspan></text><rect x="250" y="156" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="347" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="347" dy="0">905,3 µs</tspan></text><rect x="450" y="156" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">272,8 µs</tspan></text><rect x="710" y="156" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">Set 3,3× más rápido</tspan></text><rect x="10" y="206" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="127" y="231.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="127" dy="0">100</tspan></text><rect x="250" y="206" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="347" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="347" dy="0">8 497 µs</tspan></text><rect x="450" y="206" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">188,4 µs</tspan></text><rect x="710" y="206" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">Set 45× más rápido</tspan></text><rect x="10" y="260" width="930" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="475" y="284.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="475" dy="0">El punto de cruce está en 2 o 3 consultas por construcción. Construir el set solo compensa si se reutiliza: esa frase</tspan></text><text x="475" y="301.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="475" dy="0">(«cuántas veces se consulta») es parte de la recomendación.</tspan></text><text x="475" y="341.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Medido con CPython 3.12.9 en Windows 11; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
