<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">¿Cuántas consultas justifican construir un set?</title><desc id="d">Líneas en doble escala logarítmica con el tiempo de n igual a 10 000 según el número de consultas: recorrer la lista tarda 92,8, 282,9, 905,3 y 8497 microsegundos con 1, 3, 10 y 100 consultas y construir un set y consultar 173,9, 174,7, 272,8 y 188,4; las líneas se cruzan entre 1 y 3 consultas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">¿Cuántas consultas justifican construir un set?</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Recorrer la lista</tspan></text><rect x="192.18" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="212.18" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="212.18" dy="0">Construir el set y consultar</tspan></text><line x1="101.24" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="387" x2="101.24" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">10</tspan></text><line x1="101.24" y1="287" x2="910" y2="287" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="287" x2="101.24" y2="287" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="291.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">100</tspan></text><line x1="101.24" y1="187" x2="910" y2="187" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="187" x2="101.24" y2="187" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="191.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">1 000</tspan></text><line x1="101.24" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="87" x2="101.24" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">10 000</tspan></text><line x1="101.24" y1="87" x2="101.24" y2="387" stroke="#5b7280" stroke-width="1.6"/><line x1="119.24" y1="87" x2="119.24" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="119.24" y1="387" x2="119.24" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="119.24" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="119.24" dy="0">1</tspan></text><line x1="303.59" y1="87" x2="303.59" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="303.59" y1="387" x2="303.59" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="303.59" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="303.59" dy="0">3</tspan></text><line x1="505.62" y1="87" x2="505.62" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="505.62" y1="387" x2="505.62" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="505.62" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="505.62" dy="0">10</tspan></text><line x1="892" y1="87" x2="892" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="387" x2="892" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">100</tspan></text><line x1="101.24" y1="387" x2="910" y2="387" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 237)">Tiempo (µs) (escala logarítmica)</text><text x="505.62" y="433" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="505.62" dy="0">Consultas sobre 10 000 elementos (escala logarítmica)</tspan></text><polyline points="119.24,290.245 303.59,241.837 505.62,191.321 892,94.0734" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="119.24" cy="290.245" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="119.24" y="314.245" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="119.24" dy="0">92,8</tspan></text><circle cx="303.59" cy="241.837" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="303.59" y="230.837" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="303.59" dy="0">282,9</tspan></text><circle cx="505.62" cy="191.321" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="505.62" y="180.321" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="505.62" dy="0">905,3</tspan></text><circle cx="892" cy="94.0734" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="83.0734" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">8 497</tspan></text><polyline points="119.24,262.97 303.59,262.771 505.62,243.416 892,259.492" fill="none" stroke="#087f8c" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="113.74" y="257.47" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="119.24" y="251.97" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="119.24" dy="0">173,9</tspan></text><rect x="298.09" y="257.271" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="303.59" y="286.771" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="303.59" dy="0">174,7</tspan></text><rect x="500.12" y="237.916" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="505.62" y="267.416" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="505.62" dy="0">272,8</tspan></text><rect x="886.5" y="253.992" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="283.492" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">188,4</tspan></text><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">El set ya gana con 3 consultas (3,3 veces más rápido con 10 y 45 veces con 100). El punto de cruce está en 2 o 3 consultas</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">por construcción. Construir el set solo compensa si se reutiliza: esa frase («cuántas veces se consulta») es parte de la</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">recomendación.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
