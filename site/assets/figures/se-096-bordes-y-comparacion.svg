<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 551" width="950" height="551" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Casos límite entre bibliotecas y una comparación con cruce</title><desc id="d">Tabla: sacar de una estructura vacía lanza IndexError en list, heappop y deque, ValueError en min y KeyError en dict y set; bisect sobre una lista desordenada devuelve 2 sin error; una variante que elimina duplicados coincide con la de referencia en 1419 de 2000 casos; y heapq.nsmallest gana para k pequeño y pierde para k grande.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="551" fill="#ffffff"/><rect x="10" y="12" width="364" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="192" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="192" dy="0">Caso</tspan></text><rect x="380" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="487" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="487" dy="0">Resultado</tspan></text><rect x="600" y="12" width="334" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="767" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="767" dy="0">Lectura</tspan></text><rect x="10" y="56" width="364" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="89.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">list.pop() en una lista vacía</tspan></text><rect x="380" y="56" width="214" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="89.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">IndexError</tspan></text><rect x="600" y="56" width="334" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="89.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">heappop([]) y deque().popleft(): IndexError</tspan></text><rect x="10" y="122" width="364" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="155.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">min([])</tspan></text><rect x="380" y="122" width="214" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="155.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">ValueError</tspan></text><rect x="600" y="122" width="334" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="155.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">Distinto tipo de error para «vacío»</tspan></text><rect x="10" y="188" width="364" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="221.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">{}[1] y set().remove(1)</tspan></text><rect x="380" y="188" width="214" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="221.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">KeyError</tspan></text><rect x="600" y="188" width="334" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="221.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">dict.get y set.discard no lanzan</tspan></text><rect x="10" y="254" width="364" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="287.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">bisect_left([3, 1, 2], 2)</tspan></text><rect x="380" y="254" width="214" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="287.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">2 (sin error)</tspan></text><rect x="600" y="254" width="334" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="279.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">Precondición de orden violada: respuesta</tspan></text><text x="767" y="295.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">silenciosa</tspan></text><rect x="10" y="320" width="364" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="345.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">k menores: sorted(set(xs))[:k] frente a</tspan></text><text x="192" y="361.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">sorted(xs)[:k]</tspan></text><rect x="380" y="320" width="214" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="353.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">coincide en 1 419 de 2 000</tspan></text><rect x="600" y="320" width="334" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="353.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">Descarta duplicados: 581 discrepancias</tspan></text><rect x="10" y="386" width="364" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="411.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">k = 10 sobre 100 000: sorted frente a</tspan></text><text x="192" y="427.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">heapq.nsmallest</tspan></text><rect x="380" y="386" width="214" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="419.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">22,8 ms frente a 2,35 ms</tspan></text><rect x="600" y="386" width="334" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="419.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">k = 30 000: 24,1 ms frente a 74,2 ms</tspan></text><rect x="10" y="456" width="930" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="475" y="480.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">Una biblioteca comparada declara, para cada estructura, qué ocurre en vacío, con duplicados y con precondiciones violadas.</tspan></text><text x="475" y="497.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">La elección de la mejor implementación puede invertirse al cambiar el parámetro k, así que la recomendación lo menciona.</tspan></text><text x="475" y="537.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Medido con CPython 3.12.9 en Windows 11; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
