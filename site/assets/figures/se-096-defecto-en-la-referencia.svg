<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" width="940" height="420" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El oráculo encontró un defecto en la propia implementación de referencia</title><desc id="d">La primera versión de count_range devolvía un número negativo cuando el límite inferior era mayor que el superior, mientras que el oráculo devolvía cero. El test diferencial falló antes de inyectar mutantes; tras acotar el resultado con max(0, …) la línea base pasó 300 semillas de 200 pasos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="420" fill="#ffffff"/><rect x="10" y="14" width="440" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="230" y="43.96" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="230" dy="0">Versión 1: count_range(lo, hi) = bisect_left(hi) −</tspan></text><text x="230" y="61.88" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="230" dy="0">bisect_left(lo)</tspan></text><rect x="490" y="14" width="440" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="710" y="52.92" font-size="14" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="710" dy="0">Oráculo: sum(1 for v in datos if lo &lt;= v &lt; hi)</tspan></text><polyline points="230,84 230,130" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="710,84 710,130" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="130" width="920" height="62" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="155.96" font-size="14" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Con lo &gt; hi y tres valores entre ambos límites, la versión 1 devuelve −3 y el oráculo 0: contradicción hallada por</tspan></text><text x="470" y="173.88" font-size="14" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">una ejecución aleatoria</tspan></text><polyline points="470,192 470,224" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="224" width="920" height="62" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="258.92" font-size="14" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Corrección: max(0, resultado). Línea base: 300 semillas × 200 pasos sin discrepancias.</tspan></text><rect x="10" y="306" width="920" height="70" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="470" y="336.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="470" dy="0">Un contrato que no dice qué pasa con lo &gt; hi deja que cada implementación decida. El caso límite se escribió en el contrato</tspan></text><text x="470" y="352.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="470" dy="0">y en una prueba de regresión nombrada.</tspan></text><text x="470" y="404" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Cuentas deterministas con semilla fija; no dependen del equipo.</tspan></text></svg>
