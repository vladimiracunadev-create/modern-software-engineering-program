<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 465" width="930" height="465" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Protocolo no es capacidad</title><desc id="d">Tabla de las diez capacidades que declaró ruff server en la respuesta initialize: sincronización de texto, diagnósticos, acciones de código, formato y hover están declaradas; completado y definición no aparecen.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="465" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Capacidad</tspan></text><rect x="340" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="397" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="397" dy="0">¿Declarada?</tspan></text><rect x="460" y="12" width="454" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="687" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="687" dy="0">Consecuencia</tspan></text><rect x="10" y="56" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="87.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">textDocumentSync</tspan></text><rect x="340" y="56" width="114" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">Sí</tspan></text><rect x="460" y="56" width="454" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="687" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="687" dy="0">El editor envía el texto con didOpen y didChange</tspan></text><rect x="10" y="118" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="149.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">diagnosticProvider</tspan></text><rect x="340" y="118" width="114" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">Sí</tspan></text><rect x="460" y="118" width="454" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="687" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="687" dy="0">Calcula diagnósticos y los publica</tspan></text><rect x="10" y="180" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="203.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">codeActionProvider ·</tspan></text><text x="172" y="219.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">documentFormattingProvider</tspan></text><rect x="340" y="180" width="114" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">Sí</tspan></text><rect x="460" y="180" width="454" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="687" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="687" dy="0">Ofrece correcciones y formato</tspan></text><rect x="10" y="242" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="273.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">hoverProvider</tspan></text><rect x="340" y="242" width="114" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="273.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">Sí</tspan></text><rect x="460" y="242" width="454" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="687" y="273.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="687" dy="0">Información al pasar el cursor</tspan></text><rect x="10" y="304" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="335.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">completionProvider · definitionProvider</tspan></text><rect x="340" y="304" width="114" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="335.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">No</tspan></text><rect x="460" y="304" width="454" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="687" y="327.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="687" dy="0">No aparecen entre las 10 capacidades declaradas: este servidor</tspan></text><text x="687" y="343.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="687" dy="0">no completa ni navega</tspan></text><rect x="10" y="370" width="910" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="394.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">Hablar LSP no equivale a ofrecer todas las funciones. Si el editor muestra completado, lo ofrece otro servidor; si no lo</tspan></text><text x="465" y="411.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">muestra, no es un fallo del protocolo sino una capacidad ausente.</tspan></text><text x="465" y="451.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Medido con CPython 3.12.9 en Windows 11 (ruff 0.15.20, mypy 2.1.0); los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
