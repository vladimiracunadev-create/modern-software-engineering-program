<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 403" width="930" height="403" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un intercambio LSP real con ruff server</title><desc id="d">Tabla de mediciones de un intercambio con un servidor de lenguaje real: initialize tardó 240 ms, el primer análisis tras didOpen 351 ms y la actualización tras didChange 5 ms; el mensaje initialized ocupa 79 bytes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="403" fill="#ffffff"/><rect x="10" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="142" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="142" dy="0">Mensaje</tspan></text><rect x="280" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="357" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="357" dy="0">Tiempo o tamaño</tspan></text><rect x="440" y="12" width="474" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="677" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="677" dy="0">Qué ocurrió</tspan></text><rect x="10" y="56" width="264" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="87.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">initialize → respuesta</tspan></text><rect x="280" y="56" width="154" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="357" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">240 ms</tspan></text><rect x="440" y="56" width="474" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="677" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="677" dy="0">El servidor arranca y declara sus capacidades</tspan></text><rect x="10" y="118" width="264" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="149.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">didOpen → publishDiagnostics</tspan></text><rect x="280" y="118" width="154" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="357" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">351 ms</tspan></text><rect x="440" y="118" width="474" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="677" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="677" dy="0">Tres diagnósticos: F401 (línea 1), F401 (línea 2) y F841 (línea 5)</tspan></text><rect x="10" y="180" width="264" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="211.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">didChange → publishDiagnostics</tspan></text><rect x="280" y="180" width="154" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="357" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">5 ms</tspan></text><rect x="440" y="180" width="474" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="677" y="203.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="677" dy="0">Dos diagnósticos: F401 (línea 1) y F841 (línea 4); `os` ya no se</tspan></text><text x="677" y="219.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="677" dy="0">importa</tspan></text><rect x="10" y="242" width="264" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="273.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">Mensaje `initialized`</tspan></text><rect x="280" y="242" width="154" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="357" y="273.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">79 bytes</tspan></text><rect x="440" y="242" width="474" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="677" y="273.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="677" dy="0">Cabecera Content-Length más cuerpo JSON-RPC</tspan></text><rect x="10" y="308" width="910" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="332.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">El primer análisis es mucho más lento que las ediciones siguientes (351 ms frente a 5 ms): el editor no recibe</tspan></text><text x="465" y="349.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">diagnósticos con la misma latencia en el arranque que durante la edición.</tspan></text><text x="465" y="389.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Medido con CPython 3.12.9 en Windows 11 (ruff 0.15.20, mypy 2.1.0); los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
