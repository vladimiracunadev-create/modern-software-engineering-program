<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 341" width="930" height="341" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Controlar los puntos de interrupción</title><desc id="d">Tabla que compara tres formas de entrar en el depurador: breakpoint con PYTHONBREAKPOINT igual a cero continúa y la ejecución imprime siguio 1, sin la variable detiene el proceso y python -m pdb arranca en la primera línea.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="341" fill="#ffffff"/><rect x="10" y="12" width="304" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="162" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="162" dy="0">Forma de entrar</tspan></text><rect x="320" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="457" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="457" dy="0">Resultado medido</tspan></text><rect x="600" y="12" width="314" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="757" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="757" dy="0">Riesgo o ventaja</tspan></text><rect x="10" y="56" width="304" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="87.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">`breakpoint()` con PYTHONBREAKPOINT=0</tspan></text><rect x="320" y="56" width="274" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">Imprime «siguio 1»</tspan></text><rect x="600" y="56" width="314" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="79.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">La llamada no hace nada: se puede dejar sin</tspan></text><text x="757" y="95.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">querer</tspan></text><rect x="10" y="118" width="304" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="149.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">`breakpoint()` sin la variable</tspan></text><rect x="320" y="118" width="274" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">Detiene el proceso y espera entrada</tspan></text><rect x="600" y="118" width="314" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">En un servicio sin terminal queda colgado</tspan></text><rect x="10" y="180" width="304" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="211.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">`python -m pdb script.py`</tspan></text><rect x="320" y="180" width="274" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">Arranca en la primera línea</tspan></text><rect x="600" y="180" width="314" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">No requiere modificar el código</tspan></text><rect x="10" y="246" width="910" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="270.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">Un breakpoint() olvidado en el código es un defecto: puede colgar un proceso sin terminal. La política es una regla de</tspan></text><text x="465" y="287.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">revisión y una variable de entorno de entornos no interactivos.</tspan></text><text x="465" y="327.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Medido con CPython 3.12.9 en Windows 11; Linux (WSL2, CPython 3.12.3) donde se indica.</tspan></text></svg>
