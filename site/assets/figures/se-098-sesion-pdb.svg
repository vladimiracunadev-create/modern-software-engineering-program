<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 240" width="940" height="240" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una sesión de pdb guionada</title><desc id="d">Cadena de cinco comandos de una sesión real de pdb: b 3 fija el punto en la línea 3, c continúa y se detiene allí, p b y p a muestran 10 y 5, bt muestra la pila y n más p c imprime 11, el resultado esperado de 5 por 2 más 1.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="240" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Una sesión de pdb guionada</tspan></text><rect x="14" y="49" width="153.6" height="69.92" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="90.8" y="70.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="90.8" dy="0">b 3</tspan></text><text x="90.8" y="87.6" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="90.8" dy="0">Breakpoint 1 en la</tspan></text><text x="90.8" y="104.24" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="90.8" dy="0">línea 3</tspan></text><polyline points="167.6,83.96 203.6,83.96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="203.6" y="49" width="153.6" height="69.92" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="280.4" y="70.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="280.4" dy="0">c</tspan></text><text x="280.4" y="87.6" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="280.4" dy="0">se detiene en la</tspan></text><text x="280.4" y="104.24" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="280.4" dy="0">línea 3: c = b + 1</tspan></text><polyline points="357.2,83.96 393.2,83.96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="393.2" y="49" width="153.6" height="69.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="79.28" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="470" dy="0">p b · p a</tspan></text><text x="470" y="95.92" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">10 · 5</tspan></text><polyline points="546.8,83.96 582.8,83.96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="582.8" y="49" width="153.6" height="69.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="659.6" y="70.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="659.6" dy="0">bt</tspan></text><text x="659.6" y="87.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="659.6" dy="0">run() → &lt;module&gt; →</tspan></text><text x="659.6" y="104.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="659.6" dy="0">f()</tspan></text><polyline points="736.4,83.96 772.4,83.96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="772.4" y="49" width="153.6" height="69.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="849.2" y="70.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="849.2" dy="0">n · p c</tspan></text><text x="849.2" y="87.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="849.2" dy="0">11 (esperado:</tspan></text><text x="849.2" y="104.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="849.2" dy="0">5·2+1)</tspan></text><rect x="10" y="132.92" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="157.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Un depurador no «arregla»: muestra el estado en un instante. La hipótesis (¿b vale 10?) se formula antes del comando y el</tspan></text><text x="470" y="174.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">resultado la confirma o la refuta.</tspan></text><text x="470" y="222.2" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11; Linux (WSL2, CPython 3.12.3) donde se indica.</tspan></text></svg>
