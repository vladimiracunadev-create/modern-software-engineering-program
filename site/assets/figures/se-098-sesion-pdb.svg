<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 445" width="930" height="445" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una sesión de pdb guionada</title><desc id="d">Tabla de una sesión real de pdb ejecutada con comandos por entrada estándar: un breakpoint en la línea 3, continuar, imprimir b igual a 10 y a igual a 5, mostrar la pila y avanzar un paso.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="445" fill="#ffffff"/><rect x="10" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="77" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="77" dy="0">Comando</tspan></text><rect x="150" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="312" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="312" dy="0">Salida</tspan></text><rect x="480" y="12" width="434" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="697" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="697" dy="0">Qué se aprende</tspan></text><rect x="10" y="56" width="134" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="77" y="85.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="77" dy="0">b 3</tspan></text><rect x="150" y="56" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="312" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="312" dy="0">Breakpoint 1 at …t.py:3</tspan></text><rect x="480" y="56" width="434" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">Se fija el punto en la línea de `c = b + 1`</tspan></text><rect x="10" y="114" width="134" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="77" y="143.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="77" dy="0">c</tspan></text><rect x="150" y="114" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="312" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="312" dy="0">&gt; …(3)f() → c = b + 1</tspan></text><rect x="480" y="114" width="434" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">La ejecución continúa y se detiene en la línea 3</tspan></text><rect x="10" y="172" width="134" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="77" y="201.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="77" dy="0">p b · p a</tspan></text><rect x="150" y="172" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="312" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="312" dy="0">10 · 5</tspan></text><rect x="480" y="172" width="434" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">Estado observado: a = 5 y b = 10</tspan></text><rect x="10" y="230" width="134" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="77" y="259.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="77" dy="0">bt</tspan></text><rect x="150" y="230" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="312" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="312" dy="0">run() → &lt;module&gt; → f()</tspan></text><rect x="480" y="230" width="434" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">La pila muestra el llamador y la función</tspan></text><rect x="10" y="288" width="134" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="77" y="317.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="77" dy="0">n · p c</tspan></text><rect x="150" y="288" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="312" y="317.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="312" dy="0">11 (esperado: 5·2+1)</tspan></text><rect x="480" y="288" width="434" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="317.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">Un paso y se imprime el resultado</tspan></text><rect x="10" y="350" width="910" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="374.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">Un depurador no «arregla»: muestra el estado en un instante. La hipótesis (¿b vale 10?) se formula antes del comando y el</tspan></text><text x="465" y="391.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">resultado la confirma o la refuta.</tspan></text><text x="465" y="431.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Medido con CPython 3.12.9 en Windows 11; Linux (WSL2, CPython 3.12.3) donde se indica.</tspan></text></svg>
