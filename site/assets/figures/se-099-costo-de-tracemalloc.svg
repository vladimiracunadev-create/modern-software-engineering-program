<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 203" width="940" height="203" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Medir memoria también cuesta</title><desc id="d">Barras con el tiempo de crear 200 000 cadenas: 44 milisegundos sin tracemalloc y 2 719 milisegundos con tracemalloc, unas 62 veces más; el pico medido fue de 14 910 KiB.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="203" fill="#ffffff"/><text x="330" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Asignar 200 000 cadenas, sin tracemalloc</tspan></text><rect x="340" y="16" width="13.2" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="361.2" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="361.2" dy="0">44 ms</tspan></text><text x="330" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Con tracemalloc activo</tspan></text><rect x="340" y="60" width="815.7" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="1163.7" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="1163.7" dy="0">2 719 ms · ≈62×</tspan></text><rect x="10" y="108" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="132.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">tracemalloc midió un pico de 14 910 KiB para 200 000 cadenas, pero multiplicó el tiempo por unas 62. La memoria se perfila</tspan></text><text x="470" y="149.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">en una ejecución dedicada, no en la medición de tiempos.</tspan></text><text x="470" y="189.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11 (ruff 0.15.20, mypy 2.1.0); los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
