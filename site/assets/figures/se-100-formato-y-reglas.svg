<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 403" width="930" height="403" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Formato, reglas y configuración</title><desc id="d">Tabla con tres comprobaciones: black es idempotente, ruff integra 59 familias de reglas y el argumento mutable por defecto no genera aviso con el conjunto por defecto.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="403" fill="#ffffff"/><rect x="10" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="147" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="147" dy="0">Comprobación</tspan></text><rect x="290" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="367" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="367" dy="0">Resultado</tspan></text><rect x="450" y="12" width="464" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="682" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="682" dy="0">Lectura</tspan></text><rect x="10" y="56" width="274" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="147" y="87.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="147" dy="0">Aplicar black dos veces</tspan></text><rect x="290" y="56" width="154" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="367" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="367" dy="0">Misma salida</tspan></text><rect x="450" y="56" width="464" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">El formateo es idempotente: aplicarlo de nuevo no cambia nada</tspan></text><rect x="10" y="118" width="274" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="147" y="149.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="147" dy="0">Linters integrados en ruff</tspan></text><rect x="290" y="118" width="154" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="367" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="367" dy="0">59</tspan></text><rect x="450" y="118" width="464" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">Familias de reglas; cada una se activa o desactiva por separado</tspan></text><rect x="10" y="180" width="274" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="147" y="211.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="147" dy="0">Reglas activas por defecto</tspan></text><rect x="290" y="180" width="154" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="367" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="367" dy="0">E y F</tspan></text><rect x="450" y="180" width="464" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">Estilo básico y errores de nombres; el resto se elige</tspan></text><rect x="10" y="242" width="274" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="147" y="273.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="147" dy="0">Argumento mutable por defecto</tspan></text><rect x="290" y="242" width="154" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="367" y="273.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="367" dy="0">Sin aviso</tspan></text><rect x="450" y="242" width="464" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="273.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">La regla B006 existe pero no está activa por defecto</tspan></text><rect x="10" y="308" width="910" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="332.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">La configuración es parte del resultado: el mismo código pasa o falla según las reglas activas. Por eso el conjunto de</tspan></text><text x="465" y="349.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">reglas se versiona junto con el código.</tspan></text><text x="465" y="389.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Medido con CPython 3.12.9 en Windows 11 (ruff 0.15.20, mypy 2.1.0); los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
