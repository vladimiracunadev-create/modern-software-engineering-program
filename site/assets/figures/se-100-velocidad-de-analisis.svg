<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 263" width="940" height="263" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuánto tardan en un archivo de 6000 líneas</title><desc id="d">Barras con el tiempo de analizar un archivo con 3000 funciones: ruff 199 milisegundos, py_compile 217 y mypy sin caché 2031, unas diez veces más.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="263" fill="#ffffff"/><text x="270" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="270" dy="0">ruff check (3000 funciones)</tspan></text><rect x="280" y="16" width="19.9" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="307.9" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="307.9" dy="0">199 ms</tspan></text><text x="270" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="270" dy="0">py_compile</tspan></text><rect x="280" y="60" width="21.7" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="309.7" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="309.7" dy="0">217 ms</tspan></text><text x="270" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="270" dy="0">mypy (sin caché)</tspan></text><rect x="280" y="104" width="203.1" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="491.1" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="491.1" dy="0">2 031 ms · ≈10×</tspan></text><rect x="10" y="152" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La velocidad cambia dónde se puede ejecutar: un linter de 0,2 s corre en cada guardado; un verificador de tipos de 2 s sin</tspan></text><text x="470" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">caché se ejecuta al guardar con caché incremental o en integración continua. La medición incluye el arranque del</tspan></text><text x="470" y="210.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">intérprete.</tspan></text><text x="470" y="249.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11 (ruff 0.15.20, mypy 2.1.0); los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
