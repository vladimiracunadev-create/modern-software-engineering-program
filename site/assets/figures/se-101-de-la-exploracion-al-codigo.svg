<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 403" width="930" height="403" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">De la exploración al código reproducible</title><desc id="d">Tabla con cuatro propiedades de los cuadernos y del REPL: identificadores de celda presentes, salidas guardadas, ejecución completa desde un kernel nuevo con resultado 11 y 22 y el REPL sin archivo asociado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="403" fill="#ffffff"/><rect x="10" y="12" width="334" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="177" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="177" dy="0">Propiedad</tspan></text><rect x="350" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="422" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="422" dy="0">Valor medido</tspan></text><rect x="500" y="12" width="414" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="707" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="707" dy="0">Consecuencia</tspan></text><rect x="10" y="56" width="334" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="177" y="87.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177" dy="0">Identificador de celda en el JSON</tspan></text><rect x="350" y="56" width="144" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">Presente</tspan></text><rect x="500" y="56" width="414" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="707" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">Permite referirse a una celda concreta entre versiones</tspan></text><rect x="10" y="118" width="334" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="177" y="149.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177" dy="0">Salidas guardadas en el archivo</tspan></text><rect x="350" y="118" width="144" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">Sí</tspan></text><rect x="500" y="118" width="414" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="707" y="141.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">Pueden contener datos o secretos que se confirman sin</tspan></text><text x="707" y="157.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">querer</tspan></text><rect x="10" y="180" width="334" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="177" y="211.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177" dy="0">Ejecución completa desde un kernel nuevo</tspan></text><rect x="350" y="180" width="144" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">11 → 22</tspan></text><rect x="500" y="180" width="414" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="707" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">Es la comprobación de reproducibilidad</tspan></text><rect x="10" y="242" width="334" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="177" y="273.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177" dy="0">REPL de Python (`python -i`)</tspan></text><rect x="350" y="242" width="144" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="273.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">Sin archivo</tspan></text><rect x="500" y="242" width="414" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="707" y="273.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">El estado vive en la sesión y no queda registrado</tspan></text><rect x="10" y="308" width="910" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="332.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">La exploración es valiosa si termina en un artefacto que otra persona pueda ejecutar de arriba abajo. Lo explorado en una</tspan></text><text x="465" y="349.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">sesión sin registro es una conjetura, no evidencia.</tspan></text><text x="465" y="389.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Medido con CPython 3.12.9 en Windows 11; Linux (WSL2, CPython 3.12.3) donde se indica.</tspan></text></svg>
