<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 256" width="940" height="256" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">De la exploración al código reproducible</title><desc id="d">Cadena de tres etapas de la exploración al código reproducible: el REPL no deja archivo, el cuaderno guarda identificadores de celda y salidas que pueden contener datos o secretos, y la ejecución completa desde un kernel nuevo da 11 y 22 y es la comprobación de reproducibilidad.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="256" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">De la exploración al código reproducible</tspan></text><rect x="14" y="49" width="264" height="86.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="146" y="79.28" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="146" dy="0">REPL de Python (python -i)</tspan></text><text x="146" y="95.92" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="146" dy="0">sin archivo: el estado vive en la</tspan></text><text x="146" y="112.56" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="146" dy="0">sesión y no queda registrado</tspan></text><polyline points="278,92.28 338,92.28" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="338" y="49" width="264" height="86.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="70.96" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="470" dy="0">Cuaderno .ipynb</tspan></text><text x="470" y="87.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">id de cada celda presente;</tspan></text><text x="470" y="104.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">salidas guardadas que pueden</tspan></text><text x="470" y="120.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">contener datos o secretos</tspan></text><polyline points="602,92.28 662,92.28" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="662" y="49" width="264" height="86.56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="794" y="70.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="794" dy="0">Ejecución completa desde un</tspan></text><text x="794" y="87.6" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="794" dy="0">kernel nuevo</tspan></text><text x="794" y="104.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="794" dy="0">11 → 22: es la comprobación de</tspan></text><text x="794" y="120.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="794" dy="0">reproducibilidad</tspan></text><rect x="10" y="149.56" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="174.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La exploración es valiosa si termina en un artefacto que otra persona pueda ejecutar de arriba abajo. Lo explorado en una</tspan></text><text x="470" y="191.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">sesión sin registro es una conjetura, no evidencia.</tspan></text><text x="470" y="238.84" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11; Linux (WSL2, CPython 3.12.3) donde se indica.</tspan></text></svg>
