<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 332" width="940" height="332" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El estado oculto de un cuaderno</title><desc id="d">Líneas de ejecución de las mismas celdas de un cuaderno: en orden 1, 2, 3 la celda 2 da 11 y la 3 da 22; si se ejecuta la celda 2 dos veces antes de la 3, la celda 2 da 11 y luego 21 y la 3 da 42, con el mismo texto en el cuaderno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="332" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">El estado oculto de un cuaderno</tspan></text><line x1="274" y1="51" x2="274" y2="167" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="167" x2="274" y2="172" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="188" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0</tspan></text><line x1="433.5" y1="51" x2="433.5" y2="167" stroke="#d5dde1" stroke-width="1"/><line x1="433.5" y1="167" x2="433.5" y2="172" stroke="#5b7280" stroke-width="1.4"/><text x="433.5" y="188" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="433.5" dy="0">1</tspan></text><line x1="593" y1="51" x2="593" y2="167" stroke="#d5dde1" stroke-width="1"/><line x1="593" y1="167" x2="593" y2="172" stroke="#5b7280" stroke-width="1.4"/><text x="593" y="188" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="593" dy="0">2</tspan></text><line x1="752.5" y1="51" x2="752.5" y2="167" stroke="#d5dde1" stroke-width="1"/><line x1="752.5" y1="167" x2="752.5" y2="172" stroke="#5b7280" stroke-width="1.4"/><text x="752.5" y="188" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752.5" dy="0">3</tspan></text><line x1="912" y1="51" x2="912" y2="167" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="167" x2="912" y2="172" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="188" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">4</tspan></text><line x1="274" y1="167" x2="912" y2="167" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="84.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Orden 1, 2, 3 (de arriba abajo)</tspan></text><text x="264" y="142.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Celda 2 dos veces, luego la 3</tspan></text><rect x="274" y="60" width="159.5" height="40" rx="4" fill="#6b7c86" stroke="#ffffff" stroke-width="1"/><text x="353.75" y="84.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="353.75" dy="0">celda 1</tspan></text><rect x="433.5" y="60" width="159.5" height="40" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="513.25" y="84.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="513.25" dy="0">celda 2 → 11</tspan></text><rect x="593" y="60" width="159.5" height="40" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="672.75" y="84.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="672.75" dy="0">celda 3 → 22</tspan></text><line x1="14" y1="109" x2="912" y2="109" stroke="#d5dde1" stroke-width="1"/><rect x="274" y="118" width="159.5" height="40" rx="4" fill="#6b7c86" stroke="#ffffff" stroke-width="1"/><text x="353.75" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="353.75" dy="0">celda 1</tspan></text><rect x="433.5" y="118" width="159.5" height="40" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="513.25" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="513.25" dy="0">celda 2 → 11</tspan></text><rect x="593" y="118" width="159.5" height="40" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="672.75" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="672.75" dy="0">celda 2 → 21</tspan></text><rect x="752.5" y="118" width="159.5" height="40" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="832.25" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="832.25" dy="0">celda 3 → 42</tspan></text><text x="593" y="211" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="593" dy="0">Orden de ejecución (número de celda ejecutada)</tspan></text><rect x="10" y="225" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="249.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El kernel conserva variables entre celdas. Ejecutar la celda 2 dos veces cambió el valor de x y el resultado final pasó de</tspan></text><text x="470" y="266.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">22 a 42 sin que el texto del cuaderno cambiara. Un cuaderno reproducible se ejecuta completo desde un kernel nuevo.</tspan></text><text x="470" y="314.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11; Linux (WSL2, CPython 3.12.3) donde se indica.</tspan></text></svg>
