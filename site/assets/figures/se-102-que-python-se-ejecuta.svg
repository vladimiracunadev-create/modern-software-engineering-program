<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 366" width="940" height="366" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué Python se ejecuta</title><desc id="d">Barras horizontales con cuántos intérpretes lista cada consulta en la misma máquina: where python encuentra 3 candidatos, py -0 lista 3 versiones, uv python list lista 4 y sys.executable identifica uno solo, el que ejecutó el script.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="366" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué Python se ejecuta</tspan></text><line x1="274" y1="49" x2="274" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="201" x2="274" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0</tspan></text><line x1="400.788" y1="49" x2="400.788" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="400.788" y1="201" x2="400.788" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="400.788" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="400.788" dy="0">1</tspan></text><line x1="527.576" y1="49" x2="527.576" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="527.576" y1="201" x2="527.576" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="527.576" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527.576" dy="0">2</tspan></text><line x1="654.364" y1="49" x2="654.364" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="654.364" y1="201" x2="654.364" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="654.364" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="654.364" dy="0">3</tspan></text><line x1="781.152" y1="49" x2="781.152" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="781.152" y1="201" x2="781.152" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="781.152" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="781.152" dy="0">4</tspan></text><line x1="907.94" y1="49" x2="907.94" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="907.94" y1="201" x2="907.94" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="907.94" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907.94" dy="0">5</tspan></text><line x1="274" y1="201" x2="907.94" y2="201" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">where python</tspan></text><text x="264" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">py -0</tspan></text><text x="264" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">uv python list --only-installed</tspan></text><text x="264" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">sys.executable</tspan></text><rect x="274" y="55" width="380.364" height="26" rx="3" fill="#946512"/><text x="661.364" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="661.364" dy="0">3</tspan></text><rect x="274" y="93" width="380.364" height="26" rx="3" fill="#946512"/><text x="661.364" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="661.364" dy="0">3</tspan></text><rect x="274" y="131" width="507.152" height="26" rx="3" fill="#946512"/><text x="788.152" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="788.152" dy="0">4</tspan></text><rect x="274" y="169" width="126.788" height="26" rx="3" fill="#946512"/><text x="407.788" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="407.788" dy="0">1</tspan></text><text x="590.97" y="245" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="590.97" dy="0">Intérpretes que lista la consulta</tspan></text><rect x="10" y="259" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="283.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">«python» no identifica un intérprete: depende de PATH, del lanzador y de la herramienta. La evidencia es `sys.executable` y</tspan></text><text x="470" y="300.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">`sys.version` dentro del propio proceso.</tspan></text><text x="470" y="348.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11; Linux (WSL2, CPython 3.12.3) donde se indica.</tspan></text></svg>
