<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 382" width="940" height="382" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una misma serie, dos compilaciones</title><desc id="d">Diagrama de las versiones medidas dentro de la serie 3.12: Windows ejecutó CPython 3.12.9 y Linux 3.12.3; el repositorio no tiene un archivo de versión, así que ninguna de las dos queda fijada.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="382" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Una misma serie, dos compilaciones</tspan></text><rect x="14" y="49" width="912" height="120" rx="16" fill="#dff1ee" fill-opacity="0.45" stroke="#087f8c" stroke-width="1.6" stroke-dasharray="8 5"/><text x="28" y="71" font-size="14" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="28" dy="0">Serie 3.12 de CPython</tspan></text><rect x="34" y="85" width="430" height="72" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="249" y="116.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="249" dy="0">Windows: 3.12.9</tspan></text><text x="249" y="132.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="249" dy="0">64 bits en PATH; también hay 3.14 de 32 bits y otros</tspan></text><rect x="484" y="85" width="422" height="72" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="695" y="116.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="695" dy="0">Linux (WSL2): 3.12.3</tspan></text><text x="695" y="132.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="695" dy="0">versión menor distinta de la de Windows</tspan></text><polyline points="470,169 470,193" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><rect x="14" y="193" width="912" height="62" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6" stroke-dasharray="6 4"/><text x="470" y="219.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="470" dy="0">Archivo de versión del proyecto: falta</tspan></text><text x="470" y="235.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">ni una ni otra quedan fijadas por el repositorio</tspan></text><rect x="10" y="275" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="299.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Un resultado medido en 3.12.9 puede no repetirse en 3.12.3 o en 3.14. Fijar la versión exacta (en un archivo de versión del</tspan></text><text x="470" y="316.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">gestor o en la configuración del contenedor) convierte la suposición en un requisito comprobable.</tspan></text><text x="470" y="364.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11; Linux (WSL2, CPython 3.12.3) donde se indica.</tspan></text></svg>
