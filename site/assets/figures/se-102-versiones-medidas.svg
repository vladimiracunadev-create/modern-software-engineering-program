<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 341" width="930" height="341" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una misma serie, dos compilaciones</title><desc id="d">Tabla que compara las versiones medidas: Windows ejecutó CPython 3.12.9 y Linux 3.12.3, ambas de la serie 3.12, y el repositorio no fija una versión exacta.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="341" fill="#ffffff"/><rect x="10" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="117" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="117" dy="0">Entorno</tspan></text><rect x="230" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="307" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="307" dy="0">Versión</tspan></text><rect x="390" y="12" width="524" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="652" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="652" dy="0">Lectura</tspan></text><rect x="10" y="56" width="214" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="117" y="87.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="117" dy="0">Windows</tspan></text><rect x="230" y="56" width="154" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="307" dy="0">3.12.9</tspan></text><rect x="390" y="56" width="524" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">3.12.9 (64 bits) en PATH; también 3.14 de 32 bits y otros</tspan></text><rect x="10" y="118" width="214" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="117" y="149.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="117" dy="0">Linux (WSL2)</tspan></text><rect x="230" y="118" width="154" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="307" dy="0">3.12.3</tspan></text><rect x="390" y="118" width="524" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">Versión menor distinta de la de Windows con la misma serie 3.12</tspan></text><rect x="10" y="180" width="214" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="117" y="203.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="117" dy="0">Archivo de versión del</tspan></text><text x="117" y="219.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="117" dy="0">proyecto</tspan></text><rect x="230" y="180" width="154" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="307" dy="0">Falta</tspan></text><rect x="390" y="180" width="524" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">Ni una ni otra quedan fijadas por el repositorio</tspan></text><rect x="10" y="246" width="910" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="270.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">Un resultado medido en 3.12.9 puede no repetirse en 3.12.3 o en 3.14. Fijar la versión exacta (en un archivo de versión</tspan></text><text x="465" y="287.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">del gestor o en la configuración del contenedor) convierte la suposición en un requisito comprobable.</tspan></text><text x="465" y="327.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Medido con CPython 3.12.9 en Windows 11; Linux (WSL2, CPython 3.12.3) donde se indica.</tspan></text></svg>
