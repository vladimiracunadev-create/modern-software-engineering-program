<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 353" width="930" height="353" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cómo se aísla un entorno</title><desc id="d">Tabla de lo medido en un entorno virtual: pyvenv.cfg tiene cinco claves, sys.prefix difiere de sys.base_prefix y sys.path tiene 7 entradas dentro del entorno frente a 16 en el intérprete del sistema.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="353" fill="#ffffff"/><rect x="10" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="132" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="132" dy="0">Elemento</tspan></text><rect x="260" y="12" width="334" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="427" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="427" dy="0">Valor medido</tspan></text><rect x="600" y="12" width="314" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="757" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="757" dy="0">Lectura</tspan></text><rect x="10" y="56" width="244" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="89.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">`pyvenv.cfg`</tspan></text><rect x="260" y="56" width="334" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="427" y="81.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="427" dy="0">home · include-system-site-packages · version</tspan></text><text x="427" y="97.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="427" dy="0">· executable · command</tspan></text><rect x="600" y="56" width="314" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="81.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">Cinco claves que enlazan el entorno con su</tspan></text><text x="757" y="97.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">intérprete</tspan></text><rect x="10" y="122" width="244" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="155.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">`sys.prefix == sys.base_prefix`</tspan></text><rect x="260" y="122" width="334" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="427" y="155.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="427" dy="0">False dentro del entorno</tspan></text><rect x="600" y="122" width="314" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="147.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">Así se detecta que se ejecuta dentro de un</tspan></text><text x="757" y="163.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">venv</tspan></text><rect x="10" y="188" width="244" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="221.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Longitud de `sys.path`</tspan></text><rect x="260" y="188" width="334" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="427" y="221.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="427" dy="0">7 (entorno) · 16 (sistema)</tspan></text><rect x="600" y="188" width="314" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="213.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">El entorno ve menos rutas que el intérprete</tspan></text><text x="757" y="229.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">global</tspan></text><rect x="10" y="258" width="910" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="282.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">El aislamiento no es un contenedor: es una configuración de rutas. El entorno comparte el intérprete base y el sistema</tspan></text><text x="465" y="299.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">operativo; solo cambia dónde se buscan e instalan los paquetes.</tspan></text><text x="465" y="339.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Medido con CPython 3.12.9 en Windows 11; Linux (WSL2, CPython 3.12.3) donde se indica.</tspan></text></svg>
