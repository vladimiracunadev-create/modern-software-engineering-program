<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 445" width="930" height="445" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Crear un entorno virtual cuesta lo que se instala</title><desc id="d">Tabla de la creación de entornos virtuales: con pip en Windows 11 344 ms, 860 archivos y 11 550 KiB; sin pip 180 ms, 7 archivos y 557 KiB; con uv 278 ms; en Linux sin pip 118 ms y con pip 6376 ms.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="445" fill="#ffffff"/><rect x="10" y="12" width="304" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="162" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="162" dy="0">Creación</tspan></text><rect x="320" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="392" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="392" dy="0">Tiempo</tspan></text><rect x="470" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="532" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="532" dy="0">Archivos</tspan></text><rect x="600" y="12" width="314" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="757" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="757" dy="0">Tamaño o nota</tspan></text><rect x="10" y="56" width="304" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="85.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">venv con pip (Windows)</tspan></text><rect x="320" y="56" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="392" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="392" dy="0">11 344 ms</tspan></text><rect x="470" y="56" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">860</tspan></text><rect x="600" y="56" width="314" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">11 550 KiB</tspan></text><rect x="10" y="114" width="304" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="143.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">venv --without-pip (Windows)</tspan></text><rect x="320" y="114" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="392" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="392" dy="0">180 ms</tspan></text><rect x="470" y="114" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">7</tspan></text><rect x="600" y="114" width="314" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">557 KiB</tspan></text><rect x="10" y="172" width="304" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="201.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">uv venv (Windows)</tspan></text><rect x="320" y="172" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="392" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="392" dy="0">278 ms</tspan></text><rect x="470" y="172" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">16</tspan></text><rect x="600" y="172" width="314" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">555 KiB</tspan></text><rect x="10" y="230" width="304" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="259.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">venv --without-pip (Linux)</tspan></text><rect x="320" y="230" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="392" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="392" dy="0">118 ms</tspan></text><rect x="470" y="230" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">8</tspan></text><rect x="600" y="230" width="314" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">enlace simbólico a python</tspan></text><rect x="10" y="288" width="304" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="317.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">venv con pip (Linux)</tspan></text><rect x="320" y="288" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="392" y="317.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="392" dy="0">6 376 ms</tspan></text><rect x="470" y="288" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="317.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">—</tspan></text><rect x="600" y="288" width="314" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="317.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">pip y setuptools incluidos</tspan></text><rect x="10" y="350" width="910" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="374.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">Casi todo el costo del entorno es pip: 860 archivos frente a 7. En Linux el intérprete del entorno es un enlace simbólico;</tspan></text><text x="465" y="391.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">en Windows se copia un ejecutable lanzador.</tspan></text><text x="465" y="431.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Medido con CPython 3.12.9 en Windows 11; Linux (WSL2, CPython 3.12.3) donde se indica.</tspan></text></svg>
