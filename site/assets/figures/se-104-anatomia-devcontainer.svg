<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 422" width="940" height="422" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Anatomía de un dev container</title><desc id="d">Diagrama de las cuatro claves de un devcontainer.json de ejemplo que definen el contenedor de desarrollo: image fija la imagen base, features añade piezas instalables, postCreateCommand instala dependencias después de crear y customizations deja la extensión de ruff en la configuración.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="422" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Anatomía de un dev container</tspan></text><rect x="14" y="49" width="592" height="54" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="310" y="71.32" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="310" dy="0">image</tspan></text><text x="310" y="87.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="310" dy="0">imagen base: una etiqueta cambia, un digest fija el contenido</tspan></text><polyline points="606,76 641,76 641,175 676,175" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="14" y="115" width="592" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="310" y="137.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="310" dy="0">features</tspan></text><text x="310" y="153.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="310" dy="0">piezas instalables: añaden herramientas sin editar la imagen</tspan></text><polyline points="606,142 641,142 641,175 676,175" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="14" y="181" width="592" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="310" y="203.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="310" dy="0">postCreateCommand: pip install -r requirements.txt</tspan></text><text x="310" y="219.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="310" dy="0">se ejecuta después de crear el contenedor, con red</tspan></text><polyline points="606,208 641,208 641,175 676,175" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="14" y="247" width="592" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="310" y="269.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="310" dy="0">customizations</tspan></text><text x="310" y="285.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="310" dy="0">extensiones del editor: la de ruff queda en la configuración</tspan></text><polyline points="606,274 641,274 641,175 676,175" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="676" y="140" width="250" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="801" y="162" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="801" dy="0">Contenedor de desarrollo</tspan></text><text x="801" y="178.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="801" dy="0">el entorno declarado como</tspan></text><text x="801" y="195.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="801" dy="0">código</tspan></text><rect x="10" y="315" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="339.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Un dev container declara el entorno como código. La garantía depende de lo que se fije: una etiqueta de imagen puede</tspan></text><text x="470" y="356.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">apuntar a otro contenido mañana; un digest no.</tspan></text><text x="470" y="404.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Estructura de una configuración de ejemplo; no se ejecutó.</tspan></text></svg>
