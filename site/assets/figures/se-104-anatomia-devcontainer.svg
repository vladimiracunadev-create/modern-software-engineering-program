<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 403" width="930" height="403" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Anatomía de un dev container</title><desc id="d">Tabla de las cinco claves de un devcontainer.json de ejemplo y su efecto: image, features, postCreateCommand y customizations con una extensión de ruff.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="403" fill="#ffffff"/><rect x="10" y="12" width="174" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="97" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="97" dy="0">Clave</tspan></text><rect x="190" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="327" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="327" dy="0">Contenido de ejemplo</tspan></text><rect x="470" y="12" width="444" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="692" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="692" dy="0">Efecto</tspan></text><rect x="10" y="56" width="174" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="97" y="87.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="97" dy="0">image</tspan></text><rect x="190" y="56" width="274" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="327" dy="0">Imagen base</tspan></text><rect x="470" y="56" width="444" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">Una etiqueta cambia; un digest fija el contenido</tspan></text><rect x="10" y="118" width="174" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="97" y="149.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="97" dy="0">features</tspan></text><rect x="190" y="118" width="274" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="327" dy="0">Piezas instalables</tspan></text><rect x="470" y="118" width="444" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">Añaden herramientas sin editar la imagen</tspan></text><rect x="10" y="180" width="174" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="97" y="211.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="97" dy="0">postCreateCommand</tspan></text><rect x="190" y="180" width="274" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="327" dy="0">pip install -r requirements.txt</tspan></text><rect x="470" y="180" width="444" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">Se ejecuta después de crear el contenedor, con red</tspan></text><rect x="10" y="242" width="174" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="97" y="273.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="97" dy="0">customizations</tspan></text><rect x="190" y="242" width="274" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="273.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="327" dy="0">Extensiones del editor</tspan></text><rect x="470" y="242" width="444" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="265.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">La extensión de ruff queda en la configuración, no en la</tspan></text><text x="692" y="281.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">memoria de alguien</tspan></text><rect x="10" y="308" width="910" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="332.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">Un dev container declara el entorno como código. La garantía depende de lo que se fije: una etiqueta de imagen puede</tspan></text><text x="465" y="349.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">apuntar a otro contenido mañana; un digest no.</tspan></text><text x="465" y="389.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Estructura de una configuración de ejemplo; no se ejecutó.</tspan></text></svg>
