<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 350" width="940" height="350" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Niveles de aislamiento</title><desc id="d">Niveles de aislamiento anidados: el entorno virtual aísla paquetes y se crea en 180 a 278 ms; el contenedor aísla además el sistema de archivos y las herramientas y crearlo tomó 314 ms; la máquina virtual aísla el kernel y su costo no se midió.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="350" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Niveles de aislamiento</tspan></text><rect x="14" y="49" width="912" height="182" rx="14" fill="#eef1f2" fill-opacity="0.55" stroke="#8a9aa3" stroke-width="1.8" stroke-dasharray="8 5"/><text x="28" y="73" font-size="13" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="28" dy="0">Máquina virtual</tspan></text><text x="156.9" y="73" font-size="13" text-anchor="start" font-weight="400" fill="#2b3a44"><tspan x="156.9" dy="0">aísla el kernel; más pesada · costo no medido</tspan></text><rect x="36" y="95" width="868" height="126" rx="14" fill="#f7ebc8" fill-opacity="0.55" stroke="#a8761a" stroke-width="1.8"/><text x="50" y="119" font-size="13" text-anchor="start" font-weight="700" fill="#4a3209"><tspan x="50" dy="0">Contenedor</tspan></text><text x="138.6" y="119" font-size="13" text-anchor="start" font-weight="400" fill="#4a3209"><tspan x="138.6" dy="0">aísla también el sistema de archivos y las herramientas · crear: 314 ms</tspan></text><rect x="58" y="141" width="824" height="70" rx="14" fill="#dff1ee" fill-opacity="0.55" stroke="#087f8c" stroke-width="1.8"/><text x="72" y="165" font-size="13" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="72" dy="0">Entorno virtual</tspan></text><text x="200.9" y="165" font-size="13" text-anchor="start" font-weight="400" fill="#0b3f45"><tspan x="200.9" dy="0">aísla paquetes; comparte intérprete y sistema · 180 a 278 ms</tspan></text><rect x="10" y="243" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="267.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Más aislamiento no es mejor por defecto: cuesta tiempo y recursos. Se elige el nivel que cubre el riesgo (dependencias,</tspan></text><text x="470" y="284.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">herramientas o sistema operativo) y se declara el resto.</tspan></text><text x="470" y="332.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El costo de la máquina virtual no se midió; 314 ms es crear, no arrancar, un contenedor.</tspan></text></svg>
