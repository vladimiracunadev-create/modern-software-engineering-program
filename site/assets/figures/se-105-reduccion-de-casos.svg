<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 223" width="940" height="223" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reducir un caso hasta lo esencial</title><desc id="d">Cadena de una reducción automática: una entrada de 403 caracteres que falla se reduce con 24 pruebas al caso mínimo de 3 caracteres (ab y un corchete abierto), una reducción del 99,3 por ciento; probar un carácter cada vez habría exigido 403 pruebas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="223" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Reducir un caso hasta lo esencial</tspan></text><rect x="14" y="49" width="426" height="53.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="227" y="70.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="227" dy="0">Entrada que falla</tspan></text><text x="227" y="87.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="227" dy="0">403 caracteres: contiene un «[» sin cerrar tras «ab»</tspan></text><polyline points="440,75.64 500,75.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="470" y="50.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">24</tspan></text><text x="470" y="65.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">pruebas</tspan></text><rect x="500" y="49" width="426" height="53.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="713" y="70.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="713" dy="0">Caso mínimo</tspan></text><text x="713" y="87.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="713" dy="0">ab[ (3 caracteres): reducción del 99,3 %</tspan></text><rect x="10" y="116.28" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="141.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La reducción no entiende el defecto: solo elimina trozos mientras el fallo persista. Funciona si la prueba es determinista;</tspan></text><text x="470" y="157.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">con una prueba intermitente puede quedarse con un caso que no es mínimo.</tspan></text><text x="470" y="205.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11; Linux (WSL2, CPython 3.12.3) donde se indica.</tspan></text></svg>
