<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 404" width="940" height="404" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Contraste calculado con la fórmula de WCAG</title><desc id="d">Barras horizontales con la razón de contraste WCAG de cinco combinaciones: negro sobre blanco 21,00, gris 767676 4,54 que cumple AA, gris 777777 4,48 que queda bajo el umbral de 4,5, verde 00aa00 3,11 y azul sobre fondo oscuro 1,94.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="404" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Contraste calculado con la fórmula de WCAG</tspan></text><line x1="274" y1="49" x2="274" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="239" x2="274" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0</tspan></text><line x1="394.34" y1="49" x2="394.34" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="394.34" y1="239" x2="394.34" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="394.34" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="394.34" dy="0">5</tspan></text><line x1="514.68" y1="49" x2="514.68" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="514.68" y1="239" x2="514.68" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="514.68" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="514.68" dy="0">10</tspan></text><line x1="635.02" y1="49" x2=