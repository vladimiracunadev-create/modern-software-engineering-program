<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 405" width="930" height="405" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Contraste calculado con la fórmula de WCAG</title><desc id="d">Tabla de razones de contraste calculadas: negro sobre blanco 21,00, gris 767676 sobre blanco 4,54 que cumple AA, gris 777777 sobre blanco 4,48 que no cumple, verde 00aa00 sobre blanco 3,11 y azul 0000ff sobre fondo 1e1e1e 1,94.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="405" fill="#ffffff"/><rect x="10" y="12" width="394" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="207" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="207" dy="0">Combinación</tspan></text><rect x="410" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="482" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="482" dy="0">Razón</tspan></text><rect x="560" y="12" width="354" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="737" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="737" dy="0">Veredicto</tspan></text><rect x="10" y="56" width="394" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="81.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Negro sobre blanco</tspan></text><rect x="410" y="56" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">21,00</tspan></text><rect x="560" y="56" width="354" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">Cumple</tspan></text><rect x="10" y="106" width="394" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="131.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Gris #767676 sobre blanco</tspan></text><rect x="410" y="106" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">4,54</tspan></text><rect x="560" y="106" width="354" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">Cumple AA (≥ 4,5)</tspan></text><rect x="10" y="156" width="394" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="181.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Gris #777777 sobre blanco</tspan></text><rect x="410" y="156" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">4,48</tspan></text><rect x="560" y="156" width="354" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">No cumple AA</tspan></text><rect x="10" y="206" width="394" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="231.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Verde #00aa00 sobre blanco</tspan></text><rect x="410" y="206" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">3,11</tspan></text><rect x="560" y="206" width="354" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">No cumple para texto normal</tspan></text><rect x="10" y="256" width="394" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="281.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Azul #0000ff sobre fondo #1e1e1e</tspan></text><rect x="410" y="256" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="281.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">1,94</tspan></text><rect x="560" y="256" width="354" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="281.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">Prácticamente ilegible</tspan></text><rect x="10" y="310" width="910" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="334.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">Una diferencia imperceptible en el color (#767676 frente a #777777) cruza el umbral de 4,5. El contraste se calcula, no se</tspan></text><text x="465" y="351.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">juzga a ojo, y vale para el texto normal; el grande admite 3.</tspan></text><text x="465" y="391.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Calculado con la fórmula de luminancia relativa de WCAG 2.2.</tspan></text></svg>
