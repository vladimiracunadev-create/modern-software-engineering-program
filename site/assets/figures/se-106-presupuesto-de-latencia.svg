<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 247" width="940" height="247" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Presupuesto de latencia de una herramienta interactiva</title><desc id="d">Barras con tres latencias medidas: 5 ms para actualizar diagnósticos, 351 ms para el primer análisis y 432 ms para reanalizar 60 000 líneas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="247" fill="#ffffff"/><text x="330" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Actualización de diagnósticos (didChange)</tspan></text><rect x="340" y="16" width="4.5" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="352.5" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="352.5" dy="0">5 ms</tspan></text><text x="330" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Primer análisis (didOpen)</tspan></text><rect x="340" y="60" width="315.9" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="663.9" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="663.9" dy="0">351 ms</tspan></text><text x="330" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Reanalizar 60 000 líneas con ast.parse</tspan></text><rect x="340" y="104" width="388.8" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="736.8" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="736.8" dy="0">432 ms</tspan></text><rect x="10" y="152" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La herramienta debe responder dentro del ritmo de la persona. Con 5 ms la ayuda es continua; con 351 ms es perceptible; con</tspan></text><text x="470" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">432 ms por pulsación, inutilizable. Una herramienta lenta se vuelve una herramienta que se desactiva.</tspan></text><text x="470" y="233.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11 (ruff 0.15.20, mypy 2.1.0); los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
