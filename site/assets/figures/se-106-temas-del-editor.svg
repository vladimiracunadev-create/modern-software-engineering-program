<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 329" width="930" height="329" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Temas del editor y accesibilidad</title><desc id="d">Tabla de contraste de colores de comentarios en temas del editor: 5,00 en el tema oscuro, 5,14 en el claro y 5,25 el rojo sobre negro.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="329" fill="#ffffff"/><rect x="10" y="12" width="434" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="227" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="227" dy="0">Combinación</tspan></text><rect x="450" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="512" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="512" dy="0">Razón</tspan></text><rect x="580" y="12" width="334" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="747" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="747" dy="0">Veredicto</tspan></text><rect x="10" y="56" width="434" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="85.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">Comentario #6a9955 sobre #1e1e1e (tema oscuro)</tspan></text><rect x="450" y="56" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">5,00</tspan></text><rect x="580" y="56" width="334" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">Cumple AA</tspan></text><rect x="10" y="114" width="434" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="143.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">Comentario #008000 sobre blanco (tema claro)</tspan></text><rect x="450" y="114" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">5,14</tspan></text><rect x="580" y="114" width="334" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">Cumple AA</tspan></text><rect x="10" y="172" width="434" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="201.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">Rojo #ff0000 sobre negro</tspan></text><rect x="450" y="172" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">5,25</tspan></text><rect x="580" y="172" width="334" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">Cumple, pero el color no es el único canal</tspan></text><rect x="10" y="234" width="910" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="258.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">Cumplir el contraste no basta: el color no debe ser el único modo de distinguir un error. El editor debe ofrecer también</tspan></text><text x="465" y="275.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">un símbolo o un texto.</tspan></text><text x="465" y="315.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Calculado con la fórmula de luminancia relativa de WCAG 2.2.</tspan></text></svg>
