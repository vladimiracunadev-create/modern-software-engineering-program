<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 336" width="930" height="336" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cada técnica tiene su condición</title><desc id="d">Tabla de las condiciones de cada técnica de diagnóstico: la reducción requiere pruebas deterministas, la bisección un único cambio culpable y el depurador perturba los tiempos hasta 9,7 veces.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="336" fill="#ffffff"/><rect x="10" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="102" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="102" dy="0">Técnica</tspan></text><rect x="200" y="12" width="354" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="377" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="377" dy="0">Cuándo funciona</tspan></text><rect x="560" y="12" width="354" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="737" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="737" dy="0">Cuándo falla</tspan></text><rect x="10" y="56" width="184" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="87.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">Reducción</tspan></text><rect x="200" y="56" width="354" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="377" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="377" dy="0">Funciona con pruebas deterministas</tspan></text><rect x="560" y="56" width="354" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">Falla con fallos intermitentes</tspan></text><rect x="10" y="118" width="184" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="149.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">Bisección</tspan></text><rect x="200" y="118" width="354" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="377" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="377" dy="0">Funciona con un solo cambio culpable</tspan></text><rect x="560" y="118" width="354" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">Dos defectos o interacciones la confunden</tspan></text><rect x="10" y="180" width="184" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="211.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">Depurador</tspan></text><rect x="200" y="180" width="354" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="377" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="377" dy="0">Muestra el estado en un instante</tspan></text><rect x="560" y="180" width="354" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">Perturba tiempos (hasta 9,7× de costo)</tspan></text><rect x="10" y="246" width="910" height="54" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="276.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">Elegir mal la técnica produce conclusiones falsas con aspecto de evidencia. Antes de aplicarla se comprueba su condición.</tspan></text><text x="465" y="322" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Medido con CPython 3.12.9 en Windows 11; Linux (WSL2, CPython 3.12.3) donde se indica.</tspan></text></svg>
