<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 336" width="930" height="336" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Registro de hipótesis</title><desc id="d">Tabla de un registro de tres hipótesis: el analizador, el commit 41 y el valor de b; las dos primeras se confirman con la reducción y la bisección, y la tercera se descarta con la observación en pdb.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="336" fill="#ffffff"/><rect x="10" y="12" width="334" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="177" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="177" dy="0">Hipótesis</tspan></text><rect x="350" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="467" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="467" dy="0">Prueba</tspan></text><rect x="590" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="752" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="752" dy="0">Resultado</tspan></text><rect x="10" y="56" width="334" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="177" y="87.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177" dy="0">H1: el defecto está en el analizador</tspan></text><rect x="350" y="56" width="234" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="467" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">Se reduce a `ab[`</tspan></text><rect x="590" y="56" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">Se confirma: el caso mínimo lo fuerza</tspan></text><rect x="10" y="118" width="334" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="177" y="149.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177" dy="0">H2: el defecto lo introdujo el commit 41</tspan></text><rect x="350" y="118" width="234" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="467" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">Bisect señala c41</tspan></text><rect x="590" y="118" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">Se confirma con la prueba automática</tspan></text><rect x="10" y="180" width="334" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="177" y="211.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177" dy="0">H3: depende del estado de `b`</tspan></text><rect x="350" y="180" width="234" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="467" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">pdb muestra b = 10</tspan></text><rect x="590" y="180" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">Se descarta: el valor es el esperado</tspan></text><rect x="10" y="246" width="910" height="54" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="276.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">Descartar es información. Una hipótesis descartada con su prueba evita volver a investigarla y muestra qué se comprobó.</tspan></text><text x="465" y="322" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Medido con CPython 3.12.9 en Windows 11; Linux (WSL2, CPython 3.12.3) donde se indica.</tspan></text></svg>
