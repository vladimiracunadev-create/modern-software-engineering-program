<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 351" width="940" height="351" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Registro de hipótesis</title><desc id="d">Diagrama de tres hipótesis ante un fallo: el analizador y el commit 41 se confirman con la reducción a un caso mínimo y con la bisección que señala c41; que dependa del estado de b se descarta porque pdb muestra b igual a 10, el valor esperado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="351" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Registro de hipótesis</tspan></text><rect x="14" y="107" width="250" height="70" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="139" y="137.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="139" dy="0">Fallo observado</tspan></text><text x="139" y="153.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="139" dy="0">tres hipótesis con su prueba</tspan></text><rect x="334" y="49" width="592" height="54" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="630" y="71.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="630" dy="0">H1: el defecto está en el analizador</tspan></text><text x="630" y="87.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">se reduce a ab[: el caso mínimo lo fuerza → confirmada</tspan></text><polyline points="264,142 299,142 299,76 334,76" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="334" y="115" width="592" height="54" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="630" y="137.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="630" dy="0">H2: lo introdujo el commit 41</tspan></text><text x="630" y="153.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">bisect señala c41 y la prueba automática lo confirma → confirmada</tspan></text><polyline points="264,142 299,142 299,142 334,142" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="334" y="181" width="592" height="54" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6" stroke-dasharray="6 4"/><text x="630" y="203.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="630" dy="0">H3: depende del estado de b</tspan></text><text x="630" y="219.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="630" dy="0">pdb muestra b = 10, el valor esperado → descartada</tspan></text><polyline points="264,142 299,142 299,208 334,208" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-coral)"/><rect x="10" y="249" width="920" height="54" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="279.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Descartar es información. Una hipótesis descartada con su prueba evita volver a investigarla y muestra qué se comprobó.</tspan></text><text x="470" y="333" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11; Linux (WSL2, CPython 3.12.3) donde se indica.</tspan></text></svg>
