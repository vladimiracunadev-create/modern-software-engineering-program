<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 256" width="940" height="256" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diagnosticar un fallo desconocido: la secuencia</title><desc id="d">Cadena de cinco pasos de diagnóstico con su dato medido: reproducir con una prueba determinista, reducir de 403 a 3 caracteres en 24 pruebas, localizar el commit en 6 pasos para 64, observar con pdb que b vale 10 y a vale 5, y verificar con una prueba nueva.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="256" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Diagnosticar un fallo desconocido: la secuencia</tspan></text><rect x="14" y="49" width="153.6" height="86.56" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="90.8" y="70.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="90.8" dy="0">1. Reproducir</tspan></text><text x="90.8" y="87.6" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="90.8" dy="0">prueba</tspan></text><text x="90.8" y="104.24" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="90.8" dy="0">determinista que</tspan></text><text x="90.8" y="120.88" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="90.8" dy="0">falla</tspan></text><polyline points="167.6,92.28 203.6,92.28" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="203.6" y="49" width="153.6" height="86.56" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="280.4" y="79.28" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="280.4" dy="0">2. Reducir</tspan></text><text x="280.4" y="95.92" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="280.4" dy="0">403 → 3 caracteres</tspan></text><text x="280.4" y="112.56" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="280.4" dy="0">en 24 pruebas</tspan></text><polyline points="357.2,92.28 393.2,92.28" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="393.2" y="49" width="153.6" height="86.56" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="79.28" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">3. Localizar</tspan></text><text x="470" y="95.92" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="470" dy="0">6 pasos para 64</tspan></text><text x="470" y="112.56" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="470" dy="0">commits</tspan></text><polyline points="546.8,92.28 582.8,92.28" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="582.8" y="49" width="153.6" height="86.56" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="659.6" y="79.28" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="659.6" dy="0">4. Observar</tspan></text><text x="659.6" y="95.92" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="659.6" dy="0">pdb: b = 10 y a =</tspan></text><text x="659.6" y="112.56" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="659.6" dy="0">5 en la línea 3</tspan></text><polyline points="736.4,92.28 772.4,92.28" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="772.4" y="49" width="153.6" height="86.56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="849.2" y="70.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="849.2" dy="0">5. Verificar</tspan></text><text x="849.2" y="87.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="849.2" dy="0">nueva prueba:</tspan></text><text x="849.2" y="104.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="849.2" dy="0">falla antes y pasa</tspan></text><text x="849.2" y="120.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="849.2" dy="0">después</tspan></text><rect x="10" y="149.56" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="174.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cada paso reduce el espacio de búsqueda y deja un registro. El orden no es rígido, pero saltarse la reproducción deja el</tspan></text><text x="470" y="191.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">resto sin base.</tspan></text><text x="470" y="238.84" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11; Linux (WSL2, CPython 3.12.3) donde se indica.</tspan></text></svg>
