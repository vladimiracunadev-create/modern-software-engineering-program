<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 422" width="940" height="422" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Criterios de aceptación del proyecto</title><desc id="d">Diagrama de cuatro criterios que deben cumplirse para aceptar el proyecto: reconstruir el entorno desde cero con un comando, aislamiento comprobado, versiones fijadas por hash y límites declarados como el arranque en contenedor no medido.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="422" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Criterios de aceptación del proyecto</tspan></text><rect x="14" y="49" width="592" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="310" y="71.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="310" dy="0">Reconstruir el entorno desde cero</tspan></text><text x="310" y="87.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="310" dy="0">un comando; sin pasos manuales ni conocimiento oral</tspan></text><polyline points="606,76 641,76 641,175 676,175" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="14" y="115" width="592" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="310" y="137.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="310" dy="0">Aislamiento comprobado</tspan></text><text x="310" y="153.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="310" dy="0">import demo_pkg falla fuera y devuelve 1.0.0 dentro</tspan></text><polyline points="606,142 641,142 641,175 676,175" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="14" y="181" width="592" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="310" y="203.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="310" dy="0">Versiones fijadas</tspan></text><text x="310" y="219.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="310" dy="0">intérprete y rueda por hash; no se aceptan etiquetas flotantes</tspan></text><polyline points="606,208 641,208 641,175 676,175" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="14" y="247" width="592" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="310" y="269.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="310" dy="0">Límites declarados</tspan></text><text x="310" y="285.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="310" dy="0">arranque en contenedor no medido: no se descargó ninguna imagen base</tspan></text><polyline points="606,274 641,274 641,175 676,175" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="676" y="140" width="250" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="801" y="170.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="801" dy="0">Proyecto aceptado</tspan></text><text x="801" y="186.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="801" dy="0">por lo que se puede comprobar</tspan></text><rect x="10" y="315" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="339.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El proyecto se acepta por lo que se puede comprobar, incluidos los límites declarados. Un entorno que «funciona en mi</tspan></text><text x="470" y="356.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">máquina» no cumple ninguno de los cuatro.</tspan></text><text x="470" y="404.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11; Linux (WSL2, CPython 3.12.3) donde se indica.</tspan></text></svg>
