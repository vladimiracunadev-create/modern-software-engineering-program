<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 403" width="930" height="403" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Criterios de aceptación del proyecto</title><desc id="d">Tabla de cuatro criterios de aceptación: reconstrucción desde cero con un comando, aislamiento comprobado, versiones fijadas por hash y límites declarados como el arranque en contenedor no medido.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="403" fill="#ffffff"/><rect x="10" y="12" width="304" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="162" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="162" dy="0">Criterio</tspan></text><rect x="320" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="442" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="442" dy="0">Evidencia</tspan></text><rect x="570" y="12" width="344" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="742" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="742" dy="0">Lectura</tspan></text><rect x="10" y="56" width="304" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="87.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">Reconstruir el entorno desde cero</tspan></text><rect x="320" y="56" width="244" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">Un comando</tspan></text><rect x="570" y="56" width="344" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">Sin pasos manuales ni conocimiento oral</tspan></text><rect x="10" y="118" width="304" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="149.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">Aislamiento comprobado</tspan></text><rect x="320" y="118" width="244" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">Importa solo dentro del entorno</tspan></text><rect x="570" y="118" width="344" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="141.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">`import demo_pkg` falla fuera y devuelve 1.0.0</tspan></text><text x="742" y="157.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">dentro</tspan></text><rect x="10" y="180" width="304" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="211.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">Versiones fijadas</tspan></text><rect x="320" y="180" width="244" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">Intérprete y rueda por hash</tspan></text><rect x="570" y="180" width="344" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">No se aceptan etiquetas flotantes</tspan></text><rect x="10" y="242" width="304" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="273.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">Límites declarados</tspan></text><rect x="320" y="242" width="244" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="273.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">Arranque en contenedor no medido</tspan></text><rect x="570" y="242" width="344" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="273.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">No se descargó ninguna imagen base</tspan></text><rect x="10" y="308" width="910" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="332.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">El proyecto se acepta por lo que se puede comprobar, incluidos los límites declarados. Un entorno que «funciona en mi</tspan></text><text x="465" y="349.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">máquina» no cumple ninguno de los cuatro.</tspan></text><text x="465" y="389.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Medido con CPython 3.12.9 en Windows 11; Linux (WSL2, CPython 3.12.3) donde se indica.</tspan></text></svg>
