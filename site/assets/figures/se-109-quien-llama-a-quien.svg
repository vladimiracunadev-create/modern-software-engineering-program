<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" width="940" height="420" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Quién llama a quién: biblioteca frente a framework</title><desc id="d">Dos pilas de llamadas medidas con traceback.extract_stack. En la biblioteca la pila es módulo, main_library, lib_func, user_cb: el consumidor llama a la biblioteca y esta le devuelve el control. En el framework la pila es módulo, main_fw, run, handler: el consumidor entrega el control a run, que decide cuántas veces y en qué orden llama a sus handlers.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="420" fill="#ffffff"/><rect x="10" y="14" width="440" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="230" y="37.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="230" dy="0">Biblioteca: el consumidor conserva el flujo</tspan></text><rect x="480" y="14" width="440" height="40" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="700" y="37.92" font-size="14" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="700" dy="0">Framework: el framework posee el flujo</tspan></text><rect x="10" y="70" width="440" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="230" y="95.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="230" dy="0">&lt;module&gt;</tspan></text><rect x="480" y="70" width="440" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="700" y="95.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">&lt;module&gt;</tspan></text><rect x="10" y="124" width="440" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="230" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="230" dy="0">main_library() (código del consumidor)</tspan></text><rect x="480" y="124" width="440" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="700" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">main_fw() (código del consumidor)</tspan></text><polyline points="230,114 230,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="700,114 700,124" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="178" width="440" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="230" y="203.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="230" dy="0">lib_func(cb) (biblioteca)</tspan></text><rect x="480" y="178" width="440" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="700" y="203.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">Framework.run() (framework)</tspan></text><polyline points="230,168 230,178" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="700,168 700,178" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="232" width="440" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="230" y="257.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="230" dy="0">user_cb(3) (callback del consumidor)</tspan></text><rect x="480" y="232" width="440" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="700" y="257.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">handler() (registrado con @fw.route)</tspan></text><polyline points="230,222 230,232" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="700,222 700,232" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="296" width="440" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="230" y="326.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="230" dy="0">Al terminar lib_func, el control vuelve a main_library.</tspan></text><text x="230" y="342.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="230" dy="0">El consumidor decide si llama de nuevo, cuándo y con qué.</tspan></text><rect x="480" y="296" width="440" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="700" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="700" dy="0">run() recorre los handlers registrados. El consumidor</tspan></text><text x="700" y="334.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="700" dy="0">registró; ya no decide el orden ni la cantidad de</tspan></text><text x="700" y="351.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="700" dy="0">llamadas.</tspan></text><text x="470" y="392" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Pila idéntica en Windows (3.12.9) y Linux (3.12.3); lo que cambia es quién ocupa el fondo de la pila.</tspan></text></svg>
