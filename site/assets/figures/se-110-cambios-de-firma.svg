<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 574" width="940" height="574" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué llamadas rompe cada cambio de firma</title><desc id="d">Mapa de calor de ocho cambios sobre f(a, b, *, timeout=10) frente a cuatro formas de llamar: oscuro es TypeError y claro es que la llamada funciona. Añadir un parámetro obligatorio rompe las cuatro llamadas; renombrar b rompe las dos que lo nombran; reordenar y cambiar el valor por defecto no rompen ninguna pero cambian el resultado de f(1, 2), señalado con contorno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="574" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué llamadas rompe cada cambio de firma</tspan></text><text x="398.5" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="398.5" dy="0">f(1, 2)</tspan></text><text x="547.5" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="547.5" dy="0">f(1, b=2)</tspan></text><text x="696.5" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="696.5" dy="0">f(a=1, b=2,</tspan></text><text x="696.5" y="77" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="696.5" dy="0">timeout=5)</tspan></text><text x="845.5" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="845.5" dy="0">f(1, 2, timeout=3)</tspan></text><text x="314" y="113.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Añadir parámetro opcional con nombre</tspan></text><text x="314" y="153.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Añadir parámetro obligatorio</tspan></text><text x="314" y="193.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Renombrar b a second</tspan></text><text x="314" y="233.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Reordenar a, b a b, a</tspan></text><text x="314" y="273.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Quitar el parámetro timeout</tspan></text><text x="314" y="313.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Cambiar el valor por defecto de timeout</tspan></text><text x="314" y="353.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Hacer b solo por nombre</tspan></text><text x="314" y="393.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Hacer a solo posicional</tspan></text><rect x="325.5" y="90.5" width="146" height="37" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="398.5" y="113.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="398.5" dy="0">ok</tspan></text><rect x="474.5" y="90.5" width="146" height="37" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="547.5" y="113.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="547.5" dy="0">ok</tspan></text><rect x="623.5" y="90.5" width="146" height="37" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="696.5" y="113.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="696.5" dy="0">ok</tspan></text><rect x="772.5" y="90.5" width="146" height="37" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="845