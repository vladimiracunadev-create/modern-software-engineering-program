eight="700" fill="#ffffff"><tspan x="845.5" dy="0">TypeError</tspan></text><rect x="325.5" y="290.5" width="146" height="37" rx="4" fill="#fbe4de" stroke="#102a43" stroke-width="3"/><text x="398.5" y="313.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="398.5" dy="0">ok</tspan></text><rect x="474.5" y="290.5" width="146" height="37" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="547.5" y="313.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="547.5" dy="0">ok</tspan></text><rect x="623.5" y="290.5" width="146" height="37" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="696.5" y="313.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="696.5" dy="0">ok</tspan></text><rect x="772.5" y="290.5" width="146" height="37" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="845.5" y="313.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="845.5" dy="0">ok</tspan></text><rect x="325.5" y="330.5" width="146" height="37" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="398.5" y="353.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="398.5" dy="0">TypeError</tspan></text><rect x="474.5" y="330.5" width="146" height="37" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="547.5" y="353.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="547.5" dy="0">ok</tspan></text><rect x="623.5" y="330.5" width="146" height="37" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="696.5" y="353.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="696.5" dy="0">ok</tspan></text><rect x="772.5" y="330.5" width="146" height="37" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="845.5" y="353.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="845.5" dy="0">TypeError</tspan></text><rect x="325.5" y="370.5" width="146" height="37" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="398.5" y="393.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="398.5" dy="0">ok</tspan></text><rect x="474.5" y="370.5" width="146" height="37" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="547.5" y="393.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="547.5" dy="0">ok</tspan></text><rect x="623.5" y="370.5" width="146" height="37" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="696.5" y="393.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="696.5" dy="0">TypeError</tspan></text><rect x="772.5" y="370.5" width="146" height="37" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="845.5" y="393.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="845.5" dy="0">ok</tspan></text><text x="324" y="435" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="324" dy="0">ok</tspan></text><rect x="347.08" y="423" width="30.5" height="14" fill="#fbe4de"/><rect x="377.08" y="423" width="30.5" height="14" fill="#f3cdc5"/><rect x="407.08" y="423" width="30.5" height="14" fill="#eab6ac"/><rect x="437.08" y="423" width="30.5" height="14" fill="#e29f93"/><rect x="467.08" y="423" width="30.5" height="14" fill="#d9887a"/><rect x="497.08" y="423" width="30.5" height="14" fill="#d17161"/><rect x="527.08" y="423" width="30.5" height="14" fill="#c85a48"/><rect x="557.08" y="423" width="30.5" height="14" fill="#c0432f"/><text x="595.08" y="435" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="595.08" dy="0">TypeError</tspan></text><text x="670.94" y="435" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="670.94" dy="0">más oscuro = mayor (TypeError)</tspan></text><rect x="10" y="451" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="475.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Dos de los ocho cambios (reordenar y cambiar el valor por defecto) no producen ningún error y cambian el resultado de f(1,</tspan></text><text x="470" y="492.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">2) (celdas con contorno): son los que una revisión de firmas no detecta y una prueba de contrato sí. También hacer b solo</tspan></text><text x="470" y="509.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">por nombre rompe f(1, 2) y f(1, 2, timeout=3), y hacer a solo posicional rompe la llamada con a=1.</tspan></text><text x="470" y="556.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9; «ok» = la llamada funciona; contorno = funciona pero devuelve otro valor.</tspan></text></svg>
