<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 432" width="940" height="432" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cómo ordena packaging las versiones: PEP 440 de menor a mayor</title><desc id="d">Diagrama del orden de PEP 440 medido con packaging 26.2: 1.0.0a2 es menor que 1.0.0a10, que es menor que 1.0.0rc1, que es menor que 1.0.0, igual a 1.0; por encima de 1.0.0 quedan 1.0.0+build5 y 1.0.post1. Aparte, 1.0.0-alpha.beta es inválida y 1.0.0-01 se lee como post-release.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="432" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cómo ordena packaging las versiones: PEP 440 de menor a mayor</tspan></text><text x="14" y="59" font-size="13" text-anchor="start" font-weight="700" fill="#32505f"><tspan x="14" dy="0">orden ascendente (de menor a mayor)</tspan></text><rect x="10" y="73" width="120" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="70" y="98.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="70" dy="0">1.0.0a2</tspan></text><rect x="160" y="73" width="120" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="220" y="98.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="220" dy="0">1.0.0a10</tspan></text><rect x="310" y="73" width="120" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="370" y="98.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="370" dy="0">1.0.0rc1</tspan></text><rect x="470" y="73" width="140" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="540" y="98.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="540" dy="0">1.0.0 = 1.0</tspan></text><polyline points="130,95 160,95" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="145" y="85" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="145" dy="0">&lt;</tspan></text><polyline points="280,95 310,95" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="295" y="85" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="295" dy="0">&lt;</tspan></text><polyline points="430,95 470,95" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="450" y="85" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="450" dy="0">&lt;</tspan></text><text x="250" y="135" font-size="13" text-anchor="middle" font-weight="400" fill="#32505f"><tspan x="250" dy="0">prerrelease</tspan></text><rect x="10" y="145" width="270" height="62" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="145" y="171.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="145" dy="0">a10 &gt; a2: los números se comparan</tspan></text><text x="145" y="187.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="145" dy="0">como números, no como texto</tspan></text><rect x="290" y="145" width="160" height="62" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="370" y="163" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="370" dy="0">1.0.0-rc.1 se</tspan></text><text x="370" y="179.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="370" dy="0">normaliza a</tspan></text><text x="370" y="196.28" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="370" dy="0">1.0.0rc1</tspan></text><rect x="470" y="145" width="140" height="62" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="540" y="163" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="540" dy="0">los ceros</tspan></text><text x="540" y="179.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="540" dy="0">finales no</tspan></text><text x="540" y="196.28" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="540" dy="0">cuentan</tspan></text><rect x="690" y="69" width="240" height="44" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="810" y="86.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="810" dy="0">1.0.0+build5 (metadatos</tspan></text><text x="810" y="102.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="810" dy="0">locales)</tspan></text><rect x="690" y="125" width="240" height="44" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="810" y="150.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="810" dy="0">1.0.post1 (post-release)</tspan></text><polyline points="610,95 690,91" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="650" y="81" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="650" dy="0">&gt;</tspan></text><polyline points="610,95 690,147" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="634" y="129" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="634" dy="0">&gt;</tspan></text><text x="810" y="191" font-size="13" text-anchor="middle" font-weight="400" fill="#32505f"><tspan x="810" dy="0">mayores que 1.0.0</tspan></text><text x="14" y="235" font-size="13" text-anchor="start" font-weight="700" fill="#32505f"><tspan x="14" dy="0">no entran en el orden</tspan></text><rect x="10" y="245" width="300" height="62" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="160" y="271.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="160" dy="0">1.0.0-alpha.beta y 1.0.0.x →</tspan></text><text x="160" y="287.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="160" dy="0">InvalidVersion</tspan></text><rect x="330" y="245" width="300" height="62" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="271.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">1.0.0-01 → se lee como 1.0.0.post1: un</tspan></text><text x="480" y="287.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">guion puede ser post-release</tspan></text><rect x="650" y="245" width="280" height="62" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="790" y="263" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="790" dy="0">Como texto: 1.10.0, 1.2.0, 1.9.0.</tspan></text><text x="790" y="279.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="790" dy="0">Como versiones: 1.2.0, 1.9.0,</tspan></text><text x="790" y="296.28" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="790" dy="0">1.10.0</tspan></text><rect x="10" y="325" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="349.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">SemVer escribe el guion de 1.0.0-rc.1 y PEP 440 lo reescribe; SemVer ignora «+metadata» al ordenar y PEP 440 no; SemVer no</tspan></text><text x="470" y="366.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">define post-releases. No todo SemVer válido es PEP 440 válido. Si un SDK expone versiones, debe declarar qué esquema usa.</tspan></text><text x="470" y="414.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 y packaging 26.2 en Windows 11; las comparaciones no dependen del sistema operativo.</tspan></text></svg>
