<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 519" width="970" height="519" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cómo ordena Python las versiones: PEP 440 frente a SemVer</title><desc id="d">Tabla con siete comparaciones hechas con la biblioteca packaging: 1.0.0-rc.1 se normaliza a 1.0.0rc1 y es menor que 1.0.0; 1.0 es igual a 1.0.0; 1.0.post1 es mayor que 1.0.0; a10 es mayor que a2; 1.0.0+build5 es mayor que 1.0.0; 1.0.0-alpha.beta es inválida; 1.0.0-01 se lee como post-release.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="519" fill="#ffffff"/><rect x="10" y="12" width="284" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="152" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="152" dy="0">Comparación</tspan></text><rect x="300" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="462" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="462" dy="0">Resultado con packaging 26.2</tspan></text><rect x="630" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="792" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="792" dy="0">Diferencia con SemVer 2.0.0</tspan></text><rect x="10" y="56" width="284" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="82.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="152" dy="0">1.0.0-rc.1 frente a 1.0.0</tspan></text><rect x="300" y="56" width="324" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">Se normaliza a 1.0.0rc1; 1.0.0rc1 &lt; 1.0.0</tspan></text><rect x="630" y="56" width="324" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">SemVer escribe el guion; PEP 440 lo reescribe</tspan></text><rect x="10" y="108" width="284" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="134.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="152" dy="0">1.0 frente a 1.0.0</tspan></text><rect x="300" y="108" width="324" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">Iguales</tspan></text><rect x="630" y="108" width="324" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">Los ceros finales no cuentan</tspan></text><rect x="10" y="160" width="284" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="186.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="152" dy="0">1.0.post1 frente a 1.0.0</tspan></text><rect x="300" y="160" width="324" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">1.0.post1 &gt; 1.0.0</tspan></text><rect x="630" y="160" width="324" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">SemVer no define post-releases</tspan></text><rect x="10" y="212" width="284" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="238.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="152" dy="0">1.0.0a10 frente a 1.0.0a2</tspan></text><rect x="300" y="212" width="324" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="238.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">a10 &gt; a2</tspan></text><rect x="630" y="212" width="324" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="238.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">Compara como números, no como texto</tspan></text><rect x="10" y="264" width="284" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="290.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="152" dy="0">1.0.0+build5 frente a 1.0.0</tspan></text><rect x="300" y="264" width="324" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="290.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">1.0.0+build5 &gt; 1.0.0</tspan></text><rect x="630" y="264" width="324" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="282.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">SemVer ignora «+metadata» al ordenar; PEP 440</tspan></text><text x="792" y="298.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">no</tspan></text><rect x="10" y="316" width="284" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="342.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="152" dy="0">1.0.0-alpha.beta y 1.0.0.x</tspan></text><rect x="300" y="316" width="324" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="342.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">InvalidVersion</tspan></text><rect x="630" y="316" width="324" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="342.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">No todo SemVer válido es PEP 440 válido</tspan></text><rect x="10" y="368" width="284" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="394.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="152" dy="0">1.0.0-01</tspan></text><rect x="300" y="368" width="324" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="394.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">Se interpreta como 1.0.0.post1</tspan></text><rect x="630" y="368" width="324" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="394.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">Un guion puede significar post-release</tspan></text><rect x="10" y="424" width="950" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="485" y="448.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">Además, ordenar los textos 1.10.0, 1.2.0 y 1.9.0 como cadenas da 1.10.0, 1.2.0, 1.9.0; ordenarlos como versiones da 1.2.0,</tspan></text><text x="485" y="465.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">1.9.0, 1.10.0. Si un SDK expone versiones, debe declarar qué esquema usa.</tspan></text><text x="485" y="505.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Medido con CPython 3.12.9 y packaging 26.2 en Windows 11; las comparaciones no dependen del sistema operativo.</tspan></text></svg>
