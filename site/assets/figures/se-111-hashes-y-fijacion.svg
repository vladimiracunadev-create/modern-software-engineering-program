<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 427" width="970" height="427" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un lockfile con hashes: aceptar el artefacto, no el nombre</title><desc id="d">Tabla de cuatro casos de pip con la opción require-hashes: la versión fijada con el hash correcto se acepta; la misma rueda con un byte alterado se rechaza con salida 1 y los dos SHA-256; un requisito sin versión fijada se rechaza; sin fijar y con una versión nueva en el índice se instala la nueva.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="427" fill="#ffffff"/><rect x="10" y="12" width="304" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="162" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="162" dy="0">Caso</tspan></text><rect x="320" y="12" width="334" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="487" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="487" dy="0">Resultado</tspan></text><rect x="660" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="807" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="807" dy="0">Lectura</tspan></text><rect x="10" y="56" width="304" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="90.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">Requisito fijado con == y el hash correcto</tspan></text><rect x="320" y="56" width="334" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="90.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">Salida 0: «Would install coreX-3.0»</tspan></text><rect x="660" y="56" width="294" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="90.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">Se acepta el artefacto exacto</tspan></text><rect x="10" y="124" width="304" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="158.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">La misma rueda con un byte alterado</tspan></text><rect x="320" y="124" width="334" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="150.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">Salida 1: «THESE PACKAGES DO NOT MATCH THE</tspan></text><text x="487" y="166.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">HASHES»</tspan></text><rect x="660" y="124" width="294" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="150.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">Muestra Expected y Got con dos SHA-256</tspan></text><text x="807" y="166.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">distintos</tspan></text><rect x="10" y="192" width="304" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="226.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">Requisito sin versión fijada (coreX)</tspan></text><rect x="320" y="192" width="334" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="218.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">Salida 1: «all requirements must have their</tspan></text><text x="487" y="234.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">versions pinned with ==»</tspan></text><rect x="660" y="192" width="294" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="226.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">El modo con hashes exige fijar todo</tspan></text><rect x="10" y="260" width="304" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="286.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">Sin fijar y con una versión nueva en el</tspan></text><text x="162" y="302.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">índice</tspan></text><rect x="320" y="260" width="334" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="294.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">Instala coreX 3.1</tspan></text><rect x="660" y="260" width="294" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="286.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">La reproducibilidad no está en la orden</tspan></text><text x="807" y="302.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">sino en el archivo de fijación</tspan></text><rect x="10" y="332" width="950" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="485" y="356.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">El hash vincula la instalación a unos bytes concretos, no a un nombre y una versión. No prueba que esos bytes sean seguros:</tspan></text><text x="485" y="373.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">solo que son los mismos que alguien revisó. Resultados idénticos en Windows y Linux.</tspan></text><text x="485" y="413.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Medido con CPython 3.12.9 en Windows 11 y 3.12.3 en Ubuntu bajo WSL2; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
