<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 465" width="970" height="465" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">pip resuelve sobre un directorio de ruedas locales</title><desc id="d">Tabla de cinco órdenes de pip install con la opción dry-run sobre ruedas locales sin índice: libaX instala coreX 3.0 y libaX 2.0; libbX instala coreX 1.0; ambos juntos retroceden a libaX 1.0 y coreX 1.0; libbX con coreX mayor o igual que 3 falla con ResolutionImpossible; tras publicar coreX 3.1 la misma orden elige 3.1.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="465" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Orden</tspan></text><rect x="340" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="487" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="487" dy="0">Qué habría instalado</tspan></text><rect x="640" y="12" width="314" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="797" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="797" dy="0">Lectura</tspan></text><rect x="10" y="56" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="87.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">pip install libaX</tspan></text><rect x="340" y="56" width="294" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">coreX 3.0 y libaX 2.0</tspan></text><rect x="640" y="56" width="314" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">Elige lo más nuevo que cumple</tspan></text><rect x="10" y="118" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="149.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">pip install libbX (pide coreX &lt; 2)</tspan></text><rect x="340" y="118" width="294" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">coreX 1.0 y libbX 1.0</tspan></text><rect x="640" y="118" width="314" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">La restricción excluye 2.0 y 3.0</tspan></text><rect x="10" y="180" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="211.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">pip install libaX libbX</tspan></text><rect x="340" y="180" width="294" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">libaX 1.0, coreX 1.0 y libbX 1.0</tspan></text><rect x="640" y="180" width="314" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="203.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">Retrocede a libaX 1.0 para que ambos</tspan></text><text x="797" y="219.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">convivan</tspan></text><rect x="10" y="242" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="273.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">pip install libbX «coreX&gt;=3»</tspan></text><rect x="340" y="242" width="294" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="273.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">ResolutionImpossible, salida 1</tspan></text><rect x="640" y="242" width="314" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="265.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">Las dos peticiones se contradicen: pip lo</tspan></text><text x="797" y="281.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">dice y no instala nada</tspan></text><rect x="10" y="304" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="335.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">libaX tras publicarse coreX 3.1</tspan></text><rect x="340" y="304" width="294" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="335.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">coreX 3.1 y libaX 2.0</tspan></text><rect x="640" y="304" width="314" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="335.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">Sin fijar, la misma orden instala otra cosa</tspan></text><rect x="10" y="370" width="950" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="485" y="394.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="485" dy="0">Mismo resultado en Windows (pip 24.3.1) y Linux (pip 24.0). En Linux fue necesario aceptar el modo «gestionado externamente» de</tspan></text><text x="485" y="411.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="485" dy="0">PEP 668 porque se usó el intérprete del sistema con la opción dry-run, sin instalar nada.</tspan></text><text x="485" y="451.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Medido con CPython 3.12.9 en Windows 11 y 3.12.3 en Ubuntu bajo WSL2; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
