<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 496" width="940" height="496" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">pip resuelve coreX: versiones permitidas y versión elegida</title><desc id="d">Líneas de tiempo de versiones de coreX para cinco órdenes de pip install con la opción dry-run: la barra es el rango permitido y la marca oscura la versión elegida. libaX solo instala coreX 3.0; libbX o libaX con libbX bajan a coreX 1.0 porque libbX pide menos de 2; libbX con coreX mayor o igual que 3 deja dos rangos que no se tocan y falla con ResolutionImpossible; tras publicarse coreX 3.1 la misma orden de libaX elige 3.1.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="496" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">pip resuelve coreX: versiones permitidas y versión elegida</tspan></text><line x1="264" y1="51" x2="264" y2="281" stroke="#d5dde1" stroke-width="1"/><line x1="264" y1="281" x2="264" y2="286" stroke="#5b7280" stroke-width="1.4"/><text x="264" y="302" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="264" dy="0">1</tspan></text><line x1="418.286" y1="51" x2="418.286" y2="281" stroke="#d5dde1" stroke-width="1"/><line x1="418.286" y1="281" x2="418.286" y2="286" stroke="#5b7280" stroke-width="1.4"/><text x="418.286" y="302" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="418.286" dy="0">1,5</tspan></text><line x1="572.571" y1="51" x2="572.571" y2="281" stroke="#d5dde1" stroke-width="1"/><line x1="572.571" y1="281" x2="572.571" y2="286" stroke="#5b7280" stroke-width="1.4"/><text x="572.571" y="302" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572.571" dy="0">2</tspan></text><line x1="726.857" y1="51" x2="726.857" y2="281" stroke="#d5dde1" stroke-width="1"/><line x1="726.857" y1="281" x2="726.857" y2="286" stroke="#5b7280" stroke-width="1.4"/><text x="726.857" y="302" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="726.857" dy="0">2,5</tspan></text><line x1="881.143" y1="51" x2="881.143" y2="281" stroke="#d5dde1" stroke-width="1"/><line x1="881.143" y1="281" x2="881.143" y2="286" stroke="#5b7280" stroke-width="1.4"/><text x="881.143" y="302" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="881.143" dy="0">3</tspan></text><line x1="912" y1="51" x2="912" y2="281" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="281" x2="912" y2="286" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="302" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">3,1</tspan></text><line x1="264" y1="281" x2="912" y2="281" stroke="#5b7280" stroke-width="1.6"/><text x="254" y="78.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="254" dy="0">pip install libaX</tspan></text><text x="254" y="124.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="254" dy="0">pip install libbX</tspan></text><text x="254" y="170.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="254" dy="0">pip install libaX libbX</tspan></text><text x="254" y="216.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="254" dy="0">libbX con «coreX&gt;=3»</tspan></text><text x="254" y="262.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="254" dy="0">libaX tras publicarse coreX 3.1</tspan></text><rect x="264" y="60" width="617.143" height="28" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="572.571" y="78.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="572.571" dy="0">permitido: cualquier coreX</tspan></text><rect x="865.714" y="60" width="15.4286" height="28" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><line x1="14" y1="97" x2="912" y2="97" stroke="#d5dde1" stroke-width="1"/><rect x="264" y="106" width="308.571" height="28" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="418.286" y="124.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="418.286" dy="0">permitido: coreX &lt; 2</tspan></text><rect x="264" y="106" width="15.4286" height="28" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><line x1="14" y1="143" x2="912" y2="143" stroke="#d5dde1" stroke-width="1"/><rect x="264" y="152" width="308.571" height="28" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="418.286" y="170.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="418.286" dy="0">permitido: coreX &lt; 2</tspan></text><rect x="264" y="152" width="15.4286" height="28" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><line x1="14" y1="189" x2="912" y2="189" stroke="#d5dde1" stroke-width="1"/><rect x="264" y="198" width="308.571" height="28" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="418.286" y="216.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="418.286" dy="0">libbX: &lt; 2</tspan></text><rect x="881.143" y="198" width="30.8571" height="28" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="896.571" y="216.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="896.571" dy="0">≥3</tspan></text><line x1="14" y1="235" x2="912" y2="235" stroke="#d5dde1" stroke-width="1"/><rect x="264" y="244" width="648" height="28" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="588" y="262.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="588" dy="0">permitido: cualquier coreX</tspan></text><rect x="896.571" y="244" width="15.4286" height="28" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="588" y="325" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="588" dy="0">versión de coreX (barra: rango permitido; marca oscura: versión elegida)</tspan></text><rect x="10" y="339" width="920" height="109.2" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="363.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Elecciones: libaX 2.0 con coreX 3.0; libbX 1.0 con coreX 1.0; libaX 1.0 con libbX 1.0 y coreX 1.0 (libaX retrocede para</tspan></text><text x="470" y="380.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">convivir); en la cuarta orden los rangos &lt; 2 y ≥ 3 no se tocan: ResolutionImpossible, salida 1, y pip no instala nada; en</tspan></text><text x="470" y="397.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">la quinta, sin fijar, la misma orden instala coreX 3.1 y libaX 2.0. Mismo resultado en Windows (pip 24.3.1) y Linux (pip</tspan></text><text x="470" y="413.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">24.0); en Linux se aceptó el modo «gestionado externamente» de PEP 668 porque se usó el intérprete del sistema con dry-run,</tspan></text><text x="470" y="430.52" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">sin instalar nada.</tspan></text><text x="470" y="478.2" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11 y 3.12.3 en Ubuntu bajo WSL2; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
