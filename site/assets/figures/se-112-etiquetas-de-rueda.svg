<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 518" width="940" height="518" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Etiquetas de compatibilidad: una escalera de la más específica a py30-none-any</title><desc id="d">Diagrama de dos escaleras de etiquetas de rueda ordenadas de la más específica a la menos específica: el intérprete de Windows acepta 42 etiquetas, de cp312-cp312-win_amd64 a py30-none-any, y el de Linux bajo WSL2 acepta 1067, de cp312-cp312-manylinux_2_39_x86_64 a py30-none-any. La rueda de Python puro py3-none-any aparece en las dos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="518" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Etiquetas de compatibilidad: una escalera de la más específica a py30-none-any</tspan></text><text x="10" y="59" font-size="13" text-anchor="start" font-weight="700" fill="#32505f"><tspan x="10" dy="0">más específica</tspan></text><text x="930" y="59" font-size="13" text-anchor="end" font-weight="700" fill="#32505f"><tspan x="930" dy="0">menos específica</tspan></text><text x="10" y="85" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="10" dy="0">Windows (3.12.9): 42 etiquetas</tspan></text><rect x="10" y="97" width="340" height="46" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="180" y="123.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="180" dy="0">cp312-cp312-win_amd64</tspan></text><rect x="790" y="97" width="140" height="46" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="860" y="123.64" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="860" dy="0">py30-none-any</tspan></text><polyline points="350,120 790,120" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="570" y="111" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="570" dy="0">… 40 etiquetas intermedias</tspan></text><text x="10" y="203" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="10" dy="0">Linux bajo WSL2 (3.12.3): 1 067 etiquetas</tspan></text><rect x="10" y="215" width="380" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="200" y="241.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="200" dy="0">cp312-cp312-manylinux_2_39_x86_64</tspan></text><rect x="790" y="215" width="140" height="46" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="860" y="241.64" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="860" dy="0">py30-none-any</tspan></text><polyline points="390,238 790,238" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="570" y="229" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="570" dy="0">… 1 065 etiquetas intermedias</tspan></text><rect x="290" y="307" width="360" height="44" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="332.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="470" dy="0">capkit-1.0.0-py3-none-any.whl</tspan></text><text x="470" y="375" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">La rueda de Python puro cuadra con py3-none-any: sirve en las dos plataformas</tspan></text><rect x="10" y="395" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="419.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Una rueda py3-none-any sirve en las dos plataformas; una rueda con extensión compilada necesita una etiqueta de la lista.</tspan></text><text x="470" y="436.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Linux acepta tantas etiquetas porque cuenta cada versión de la biblioteca C compatible (manylinux_2_39 hacia abajo). Una</tspan></text><text x="470" y="453.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">rueda con etiqueta win_amd64 no se instala en Linux ni a la inversa.</tspan></text><text x="470" y="500.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11 y 3.12.3 en Ubuntu bajo WSL2; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
