<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 323" width="970" height="323" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Funciona en el repositorio, falla instalado: el archivo de datos que no viajó</title><desc id="d">Tabla con dos ruedas del mismo proyecto: sin package-data la rueda mide 1353 bytes en Windows y 1351 en Linux, no contiene data/rules.json, y load_rules funciona desde el árbol de fuentes pero lanza FileNotFoundError una vez instalada; con package-data la rueda incluye el archivo y funciona en ambos lugares.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="323" fill="#ffffff"/><rect x="10" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="102" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="102" dy="0">Configuración</tspan></text><rect x="200" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="327" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="327" dy="0">Contenido de la rueda</tspan></text><rect x="460" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="542" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="542" dy="0">Tamaño Windows /</tspan></text><text x="542" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="542" dy="0">Linux</tspan></text><rect x="630" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="707" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="707" dy="0">Desde el árbol de</tspan></text><text x="707" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="707" dy="0">fuentes</tspan></text><rect x="790" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="872" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="872" dy="0">Tras instalar la</tspan></text><text x="872" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="872" dy="0">rueda</tspan></text><rect x="10" y="56" width="184" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="94.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">Sin package-data</tspan></text><rect x="200" y="56" width="254" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="94.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="327" dy="0">__init__.py, sub/mod.py, METADATA</tspan></text><rect x="460" y="56" width="164" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="94.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">1 353 B / 1 351 B</tspan></text><rect x="630" y="56" width="154" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="707" y="94.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">{&#x27;v&#x27;: 1}</tspan></text><rect x="790" y="56" width="164" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="94.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">FileNotFoundError</tspan></text><rect x="10" y="132" width="184" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="162.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">Con package-data =</tspan></text><text x="102" y="178.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">data/*.json</tspan></text><rect x="200" y="132" width="254" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="162.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="327" dy="0">__init__.py, data/rules.json,</tspan></text><text x="327" y="178.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="327" dy="0">sub/mod.py, METADATA</tspan></text><rect x="460" y="132" width="164" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="170.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">1 536 B / 1 533 B</tspan></text><rect x="630" y="132" width="154" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="707" y="170.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">{&#x27;v&#x27;: 1}</tspan></text><rect x="790" y="132" width="164" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="170.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">{&#x27;v&#x27;: 1}</tspan></text><rect x="10" y="212" width="950" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="485" y="236.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">El código no cambió entre las dos filas: cambió qué archivos empaquetó el constructor. Las pruebas que se ejecutan desde el</tspan></text><text x="485" y="253.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">repositorio no pueden verlo; solo una instalación limpia lo muestra. El paquete sub/ no tiene __init__.py y aun así se</tspan></text><text x="485" y="270.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">empaquetó, porque la configuración de pyproject.toml permite paquetes de espacio de nombres por defecto.</tspan></text><text x="485" y="309.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Medido con CPython 3.12.9 en Windows 11 y 3.12.3 en Ubuntu bajo WSL2; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
