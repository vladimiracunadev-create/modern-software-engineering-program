<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 512" width="940" height="512" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Quién gana en sys.path: la carpeta propia va primero</title><desc id="d">Diagrama de dos listas sys.path: con python main.py la carpeta del script va primero, de modo que un json.py local tapa a la biblioteca estándar y json.dumps({}) devuelve FAKE; con la opción -I esa carpeta se quita y gana la biblioteca estándar, que devuelve {}. Con -c el directorio actual va primero y se ejecuta el random.py local; python -m json.tool falla porque el json.py local no es un paquete; y un directorio sin __init__.py se importa como paquete de espacio de nombres.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="512" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Quién gana en sys.path: la carpeta propia va primero</tspan></text><text x="235" y="61" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="235" dy="0">python main.py</tspan></text><text x="705" y="61" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="705" dy="0">python -I main.py</tspan></text><rect x="10" y="73" width="450" height="44" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="235" y="98.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="235" dy="0">1.º carpeta del script: json.py local</tspan></text><rect x="10" y="125" width="450" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="148.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">2.º biblioteca estándar (json/__init__.py)</tspan></text><rect x="10" y="173" width="450" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="194.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">3.º site-packages</tspan></text><rect x="10" y="225" width="450" height="40" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="235" y="248.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="235" dy="0">json.dumps({}) devuelve «FAKE»</tspan></text><polyline points="235,209 235,225" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="480" y="73" width="450" height="44" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="705" y="98.64" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="705" dy="0">carpeta del script y del usuario: quitadas</tspan></text><rect x="480" y="125" width="450" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="705" y="148.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="705" dy="0">2.º biblioteca estándar (json/__init__.py)</tspan></text><rect x="480" y="173" width="450" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="194.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">3.º site-packages</tspan></text><rect x="480" y="225" width="450" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="705" y="248.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="705" dy="0">json.dumps({}) devuelve «{}»</tspan></text><polyline points="705,209 705,225" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="470" y="289" font-size="13" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="470" dy="0">Otros casos medidos con la misma regla</tspan></text><rect x="10" y="301" width="300" height="84" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="160" y="321.68" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="160" dy="0">python -c «import random» con</tspan></text><text x="160" y="338.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="160" dy="0">random.py en la carpeta: con -c, el</tspan></text><text x="160" y="354.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="160" dy="0">directorio actual va primero y se</tspan></text><text x="160" y="371.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="160" dy="0">ejecuta el local</tspan></text><rect x="320" y="301" width="300" height="84" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="330" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">python -m json.tool con un json.py</tspan></text><text x="470" y="346.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">local: error, no se puede encontrar</tspan></text><text x="470" y="363.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">json.tool (el local no es un paquete)</tspan></text><rect x="630" y="301" width="300" height="84" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="780" y="321.68" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="780" dy="0">import capkit.sub.mod sin</tspan></text><text x="780" y="338.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="780" dy="0">sub/__init__.py: funciona;</tspan></text><text x="780" y="354.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="780" dy="0">sub.__file__ es None y __path__ es un</tspan></text><text x="780" y="371.6" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="780" dy="0">_NamespacePath</tspan></text><rect x="10" y="405" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="429.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Mismo resultado en Windows y Linux. Nombrar un módulo como uno de la biblioteca estándar (json, random, email, test) rompe</tspan></text><text x="470" y="446.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">programas ajenos al proyecto sin dar un error de nombre; el fallo aparece lejos del archivo mal nombrado.</tspan></text><text x="470" y="494.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11 y 3.12.3 en Ubuntu bajo WSL2; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
