<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 515" width="970" height="515" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Códigos de salida observados con subprocess</title><desc id="d">Tabla de nueve escenarios: terminar sin error da 0; sys.exit(3) da 3; sys.exit con texto da 1; una excepción da 1; argparse con una opción desconocida da 2 y con --help da 0; Ctrl+C da 3221225786 en Windows y menos 2 en Linux; sys.exit(256) da 256 en Windows y 0 en Linux; sys.exit(-1) da 4294967295 en Windows y 255 en Linux.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="515" fill="#ffffff"/><rect x="10" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Escenario</tspan></text><rect x="390" y="12" width="284" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="532" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="532" dy="0">Windows</tspan></text><rect x="680" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="817" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="817" dy="0">Linux (WSL2)</tspan></text><rect x="10" y="56" width="374" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="76.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Terminar sin error</tspan></text><rect x="390" y="56" width="284" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="76.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">0</tspan></text><rect x="680" y="56" width="274" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="76.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">0</tspan></text><rect x="10" y="96" width="374" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="116.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">sys.exit(3)</tspan></text><rect x="390" y="96" width="284" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="116.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">3</tspan></text><rect x="680" y="96" width="274" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="116.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">3</tspan></text><rect x="10" y="136" width="374" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="156.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">sys.exit(&#x27;mensaje&#x27;)</tspan></text><rect x="390" y="136" width="284" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="156.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">1 (y el mensaje va a stderr)</tspan></text><rect x="680" y="136" width="274" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="156.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">1 (y el mensaje va a stderr)</tspan></text><rect x="10" y="176" width="374" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="196.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Excepción sin capturar</tspan></text><rect x="390" y="176" width="284" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="196.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">1</tspan></text><rect x="680" y="176" width="274" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="196.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">1</tspan></text><rect x="10" y="216" width="374" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="236.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">argparse: opción desconocida</tspan></text><rect x="390" y="216" width="284" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="236.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">2</tspan></text><rect x="680" y="216" width="274" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="236.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">2</tspan></text><rect x="10" y="256" width="374" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="276.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">argparse: --help</tspan></text><rect x="390" y="256" width="284" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="276.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">0</tspan></text><rect x="680" y="256" width="274" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="276.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">0</tspan></text><rect x="10" y="296" width="374" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="316.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Ctrl+C sin capturar (KeyboardInterrupt)</tspan></text><rect x="390" y="296" width="284" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="316.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">3221225786 (0xC000013A)</tspan></text><rect x="680" y="296" width="274" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="316.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">−2 (terminado por SIGINT)</tspan></text><rect x="10" y="336" width="374" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="356.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">sys.exit(256)</tspan></text><rect x="390" y="336" width="284" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="356.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">256</tspan></text><rect x="680" y="336" width="274" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="356.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">0</tspan></text><rect x="10" y="376" width="374" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="396.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">sys.exit(-1)</tspan></text><rect x="390" y="376" width="284" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="396.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">4294967295</tspan></text><rect x="680" y="376" width="274" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="396.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">255</tspan></text><rect x="10" y="420" width="950" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="485" y="444.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">Los códigos 0 a 3 y 7 coinciden; los valores fuera de 0–255 y la interrupción no. Un contrato de CLI que quiera ser portable</tspan></text><text x="485" y="461.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">debe usar solo 0–125 y documentar cada valor.</tspan></text><text x="485" y="501.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Medido con CPython 3.12.9 y 3.12.3; la interrupción se envió con CTRL_BREAK_EVENT en Windows y SIGINT en Linux.</tspan></text></svg>
