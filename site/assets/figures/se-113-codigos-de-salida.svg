<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 504" width="940" height="504" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Códigos de salida: seis coinciden y tres dependen del sistema</title><desc id="d">Diagrama de nueve escenarios de salida de un programa en Python observados con subprocess: terminar sin error, sys.exit(3), sys.exit con texto, una excepción, opción desconocida y --help dan el mismo código en Windows y Linux; Ctrl+C da 3221225786 en Windows y menos 2 en Linux, sys.exit(256) da 256 y 0, y sys.exit(-1) da 4294967295 y 255, porque Windows conserva 32 bits sin signo y Linux solo el byte bajo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="504" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Códigos de salida: seis coinciden y tres dependen del sistema</tspan></text><rect x="10" y="53" width="920" height="30" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="71.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="470" dy="0">Coinciden en ambos sistemas</tspan></text><rect x="10" y="91" width="146.667" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="83.3333" y="113" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="83.3333" dy="0">terminar sin</tspan></text><text x="83.3333" y="129.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="83.3333" dy="0">error</tspan></text><text x="83.3333" y="146.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="83.3333" dy="0">→ 0</tspan></text><rect x="164.667" y="91" width="146.667" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="238" y="121.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="238" dy="0">sys.exit(3)</tspan></text><text x="238" y="137.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="238" dy="0">→ 3</tspan></text><rect x="319.333" y="91" width="146.667" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="392.667" y="113" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="392.667" dy="0">sys.exit(&#x27;mensaje&#x27;)</tspan></text><text x="392.667" y="129.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="392.667" dy="0">→ 1, mensaje a</tspan></text><text x="392.667" y="146.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="392.667" dy="0">stderr</tspan></text><rect x="474" y="91" width="146.667" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="547.333" y="113" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547.333" dy="0">excepción sin</tspan></text><text x="547.333" y="129.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547.333" dy="0">capturar</tspan></text><text x="547.333" y="146.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547.333" dy="0">→ 1</tspan></text><rect x="628.667" y="91" width="146.667" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="702" y="113" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">argparse: opción</tspan></text><text x="702" y="129.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">desconocida</tspan></text><text x="702" y="146.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">→ 2</tspan></text><rect x="783.333" y="91" width="146.667" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="856.667" y="121.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="856.667" dy="0">argparse: --help</tspan></text><text x="856.667" y="137.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="856.667" dy="0">→ 0</tspan></text><rect x="10" y="185" width="920" height="30" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="203.92" font-size="14" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="470" dy="0">Difieren: Windows conserva 32 bits sin signo; Linux entrega el byte bajo</tspan></text><rect x="10" y="225" width="293.333" height="34" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="156.667" y="245.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="156.667" dy="0">sys.exit(256)</tspan></text><rect x="10" y="265" width="293.333" height="52" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="156.667" y="294.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="156.667" dy="0">Windows: 256</tspan></text><rect x="10" y="325" width="293.333" height="52" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="156.667" y="354.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="156.667" dy="0">Linux: 0 (256 mod 256)</tspan></text><rect x="323.333" y="225" width="293.333" height="34" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="245.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">sys.exit(-1)</tspan></text><rect x="323.333" y="265" width="293.333" height="52" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="294.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Windows: 4294967295</tspan></text><rect x="323.333" y="325" width="293.333" height="52" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="354.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Linux: 255 (−1 mod 256)</tspan></text><rect x="636.667" y="225" width="293.333" height="34" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="783.333" y="245.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="783.333" dy="0">Ctrl+C sin capturar</tspan></text><rect x="636.667" y="265" width="293.333" height="52" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="783.333" y="294.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="783.333" dy="0">Windows: 3221225786 (0xC000013A)</tspan></text><rect x="636.667" y="325" width="293.333" height="52" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="783.333" y="354.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="783.333" dy="0">Linux: −2 (terminado por SIGINT)</tspan></text><rect x="10" y="397" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="421.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los códigos 0 a 3 coinciden; los valores fuera de 0–255 y la interrupción no. Un contrato de CLI que quiera ser portable</tspan></text><text x="470" y="438.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">debe usar solo 0–125 y documentar cada valor.</tspan></text><text x="470" y="486.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 y 3.12.3; la interrupción se envió con CTRL_BREAK_EVENT en Windows y SIGINT en Linux.</tspan></text></svg>
