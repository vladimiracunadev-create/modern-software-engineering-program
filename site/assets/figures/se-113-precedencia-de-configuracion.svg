="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">flag = 9</tspan></text><rect x="10" y="380" width="950" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="485" y="404.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">El error clásico es declarar default=1 en argparse: el parser siempre devuelve un valor y ya no se puede saber si el usuario lo</tspan></text><text x="485" y="421.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">escribió. Con default=None se distingue «ausente» y se aplican entorno y archivo. Fallaron 3 de 8 combinaciones.</tspan></text><text x="485" y="461.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Cuentas deterministas sobre una función de ejemplo; idénticas en Windows y Linux.</tspan></text></svg>
