<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 574" width="860" height="574" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Precedencia de configuración: el valor por defecto aplicado antes borra el entorno y el archivo</title><desc id="d">Mapa de calor del valor efectivo de level en las ocho combinaciones de flag, entorno y archivo: con el orden correcto gana el flag, luego el entorno, luego el archivo y por último el valor por defecto; si el valor por defecto se aplica antes, tres combinaciones (solo archivo, solo entorno y entorno con archivo) dan 1 en vez de 3, 5 y 5, señaladas con contorno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="860" height="574" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Precedencia de configuración: el valor por defecto aplicado antes borra el entorno y el archivo</tspan></text><text x="408" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="408" dy="0">Orden correcto: flag, entorno,</tspan></text><text x="408" y="77" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="408" dy="0">archivo, por defecto</tspan></text><text x="696" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="696" dy="0">Por defecto aplicado antes (default=1</tspan></text><text x="696" y="77" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="696" dy="0">en argparse)</tspan></text><text x="254" y="113.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="254" dy="0">Nada</tspan></text><text x="254" y="153.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="254" dy="0">Solo archivo (3)</tspan></text><text x="254" y="193.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="254" dy="0">Solo entorno (5)</tspan></text><text x="254" y="233.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="254" dy="0">Entorno (5) y archivo (3)</tspan></text><text x="254" y="273.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="254" dy="0">Solo flag (9)</tspan></text><text x="254" y="313.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="254" dy="0">Flag (9) y archivo (3)</tspan></text><text x="254" y="353.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="254" dy="0">Flag (9) y entorno (5)</tspan></text><text x="254" y="393.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="254" dy="0">Flag, entorno y archivo</tspan></text><rect x="265.5" y="90.5" width="285" height="37" rx="4" fill="#d9e2ec" stroke="#ffffff" stroke-width="1"/><text x="408" y="113.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="408" dy="0">1</tspan></text><rect x="553.5" y="90.5" width="285" height="37" rx="4" fill="#d9e2ec" stroke="#ffffff" stroke-width="1"/><text x="696" y="113.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="696" dy="0">1</tspan></text><rect x="265.5" y="130.5" width="285" height="37" rx="4" fill="#a7b4c2" stroke="#ffffff" stroke-width="1"/><text x="408" y="153.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="408" dy="0">3</tspan></text><rect x="553.5" y="130.5" width="285" height="37" rx="4" fill="#d9e2ec" stroke="#102a43" stroke-width="3"/><text x="696" y="153.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="696" dy="0">1</tspan></text><rect x="265.5" y="170.5" width="285" height="37" rx="4" fill="#748698" stroke="#ffffff" stroke-width="1"/><text x="408" y="193.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="408" dy="0">5</tspan></text><rect x="553.5" y="170.5" width="285" height="37" rx="4" fill="#d9e2ec" stroke="#102a43" stroke-width="3"/><text x="696" y="193.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="696" dy="0">1</tspan></text><rect x="265.5" y="210.5" width="285" height="37" rx="4" fill="#748698" stroke="#ffffff" stroke-width="1"/><text x="408" y="233.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="408" dy="0">5</tspan></text><rect x="553.5" y="210.5" width="285" height="37" rx="4" fill="#d9e2ec" stroke="#102a43" stroke-width="3"/><text x="696" y="233.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="696" dy="0">1</tspan></text><rect x="265.5" y="250.5" width="285" height="37" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="408" y="273.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="408" dy="0">9</tspan></text><rect x="553.5" y="250.5" width="285" height="37" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="696" y="273.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="696" dy="0">9</tspan></text><rect x="265.5" y="290.5" width="285" height="37" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="408" y="313.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="408" dy="0">9</tspan></text><rect x="553.5" y="290.5" width="285" height="37" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="696" y="313.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="696" dy="0">9</tspan></text><rect x="265.5" y="330.5" width="285" height="37" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="408" y="353.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="408" dy="0">9</tspan></text><rect x="553.5" y="330.5" width="285" height="37" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="696" y="353.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="696" dy="0">9</tspan></text><rect x="265.5" y="370.5" width="285" height="37" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="408" y="393.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="408" dy="0">9</tspan></text><rect x="553.5" y="370.5" width="285" height="37" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="696" y="393.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="696" dy="0">9</tspan></text><text x="264" y="435" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="264" dy="0">1</tspan></text><rect x="279.54" y="423" width="30.5" height="14" fill="#d9e2ec"/><rect x="309.54" y="423" width="30.5" height="14" fill="#bcc8d4"/><rect x="339.54" y="423" width="30.5" height="14" fill="#a0adbc"/><rect x="369.54" y="423" width="30.5" height="14" fill="#8393a4"/><rect x="399.54" y="423" width="30.5" height="14" fill="#66798b"/><rect x="429.54" y="423" width="30.5" height="14" fill="#495f73"/><rect x="459.54" y="423" width="30.5" height="14" fill="#2d445b"/><rect x="489.54" y="423" width="30.5" height="14" fill="#102a43"/><text x="527.54" y="435" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="527.54" dy="0">9</tspan></text><text x="543.08" y="435" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="543.08" dy="0">más oscuro = mayor (valor efectivo de level)</tspan></text><rect x="10" y="451" width="840" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="430" y="475.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="430" dy="0">El error clásico es declarar default=1 en argparse: el parser siempre devuelve un valor y ya no se puede saber</tspan></text><text x="430" y="492.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="430" dy="0">si el usuario lo escribió. Con default=None se distingue «ausente» y se aplican entorno y archivo. Fallaron 3 de</tspan></text><text x="430" y="509.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="430" dy="0">8 combinaciones (con contorno).</tspan></text><text x="430" y="556.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="430" dy="0">Cuentas deterministas sobre una función de ejemplo; idénticas en Windows y Linux.</tspan></text></svg>
