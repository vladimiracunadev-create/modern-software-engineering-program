<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 439" width="1000" height="439" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dos procesos incrementan 300 veces un contador compartido</title><desc id="d">Barras con el valor final de un contador al que dos procesos suman 300 veces cada uno, esperado 600: sin bloqueo quedó en 148 y 20 en Windows y en 12 y 46 en Linux; con un bloqueo O_EXCL el primer intento en Windows dio 310 porque un proceso murió con PermissionError; corregido dio 600 en Windows y 600 en Linux.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="439" fill="#ffffff"/><text x="330" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Windows, sin bloqueo</tspan></text><rect x="340" y="16" width="133.2" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="481.2" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="481.2" dy="0">148 de 600</tspan></text><text x="330" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Windows, sin bloqueo (otra pasada)</tspan></text><rect x="340" y="60" width="18" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="366" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="366" dy="0">20 de 600</tspan></text><text x="330" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Linux, sin bloqueo</tspan></text><rect x="340" y="104" width="10.8" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="358.8" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="358.8" dy="0">12 de 600</tspan></text><text x="330" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Linux, sin bloqueo (otra pasada)</tspan></text><rect x="340" y="148" width="41.4" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="389.4" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="389.4" dy="0">46 de 600</tspan></text><text x="330" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Windows, bloqueo O_EXCL (un proceso murió)</tspan></text><rect x="340" y="192" width="279" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="627" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="627" dy="0">310 de 600</tspan></text><text x="330" y="255.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Windows, bloqueo O_EXCL corregido</tspan></text><rect x="340" y="236" width="540" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="888" y="255.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="888" dy="0">600 de 600</tspan></text><text x="330" y="299.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Linux, bloqueo O_EXCL</tspan></text><rect x="340" y="280" width="540" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="888" y="299.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="888" dy="0">600 de 600</tspan></text><rect x="10" y="328" width="980" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="500" y="352.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Leer, sumar y escribir no es atómico: los dos procesos leen el mismo valor y uno pisa al otro (actualización perdida). El bloqueo</tspan></text><text x="500" y="369.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">con O_EXCL lo evita, pero en Windows crear el archivo de bloqueo mientras otro lo borra lanzó PermissionError y mató a un proceso:</tspan></text><text x="500" y="386.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">hay que tratarlo como «ocupado». Con bloqueo, 600 incrementos tardaron 1,4–1,7 s en Windows y 0,4 s en Linux.</tspan></text><text x="500" y="425.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Medido con CPython 3.12.9 en Windows 11 y 3.12.3 en Ubuntu bajo WSL2; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
