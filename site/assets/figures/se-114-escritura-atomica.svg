<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 502" width="940" height="502" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Escritura atómica: el reemplazo nunca deja un archivo a medias</title><desc id="d">Diagrama de dos estrategias de escritura con una muerte a mitad: reescribir con open en modo w trunca el archivo de 60 bytes, escribe 2000 bytes de «NUEVO» y al morir deja un archivo de 2000 bytes con contenido a medias y sin el original; escribir en un temporal y morir antes de os.replace deja el original de 60 bytes intacto y un temporal huérfano. En Windows, os.replace y borrar con el destino abierto fallan con PermissionError.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="502" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Escritura atómica: el reemplazo nunca deja un archivo a medias</tspan></text><text x="10" y="59" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="10" dy="0">Reescritura directa</tspan></text><rect x="10" y="69" width="206" height="76" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="113" y="94" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="113" dy="0">open(destino, &#x27;w&#x27;) trunca</tspan></text><text x="113" y="110.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="113" dy="0">el archivo de 60 B</tspan></text><text x="113" y="127.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="113" dy="0">«VIEJO»</tspan></text><rect x="248" y="69" width="206" height="76" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="351" y="102.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="351" dy="0">escribe 2 000 B de</tspan></text><text x="351" y="118.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="351" dy="0">«NUEVO»…</tspan></text><polyline points="216,107 248,107" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="486" y="69" width="206" height="76" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="589" y="110.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="589" dy="0">✖ el proceso muere</tspan></text><polyline points="454,107 486,107" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="724" y="69" width="206" height="76" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="827" y="94" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="827" dy="0">Destino: 2 000 B con</tspan></text><text x="827" y="110.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="827" dy="0">«NUEVO» a medias; el</tspan></text><text x="827" y="127.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="827" dy="0">original se perdió</tspan></text><polyline points="692,107 724,107" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="10" y="179" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="10" dy="0">Temporal en el mismo directorio y os.replace</tspan></text><rect x="10" y="193" width="206" height="76" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="113" y="226.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="113" dy="0">escribe un temporal con</tspan></text><text x="113" y="242.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="113" dy="0">el contenido nuevo</tspan></text><rect x="248" y="193" width="206" height="76" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="351" y="234.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="351" dy="0">vacía a disco</tspan></text><polyline points="216,231 248,231" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="486" y="193" width="206" height="76" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="589" y="226.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="589" dy="0">✖ el proceso muere antes</tspan></text><text x="589" y="242.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="589" dy="0">de os.replace</tspan></text><polyline points="454,231 486,231" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="724" y="193" width="206" height="76" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="827" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="827" dy="0">Destino: 60 B «VIEJO»</tspan></text><text x="827" y="234.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="827" dy="0">intacto; queda un .tmp</tspan></text><text x="827" y="251.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="827" dy="0">huérfano</tspan></text><polyline points="692,231 724,231" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="295" width="450" height="64" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="235" y="322.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="235" dy="0">Solo en Windows: os.replace con el destino abierto por otro</tspan></text><text x="235" y="338.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="235" dy="0">lector falla con PermissionError (WinError 5)</tspan></text><rect x="480" y="295" width="450" height="64" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="705" y="322.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="705" dy="0">Solo en Windows: borrar un archivo que sigue abierto falla</tspan></text><text x="705" y="338.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="705" dy="0">con PermissionError; en Linux reemplaza y borra sin error</tspan></text><rect x="10" y="379" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="403.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El patrón seguro es: escribir un temporal en el mismo directorio, vaciar a disco y reemplazar con os.replace. En Windows el</tspan></text><text x="470" y="420.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">reemplazo puede fallar si otro proceso tiene el destino abierto, así que hay que reintentar con espera acotada y limpiar</tspan></text><text x="470" y="437.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">los temporales huérfanos al empezar. Los dos cortes dieron el mismo resultado en Linux.</tspan></text><text x="470" y="484.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11 y 3.12.3 en Ubuntu bajo WSL2; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
