<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 443" width="970" height="443" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Escritura atómica: el reemplazo nunca deja un archivo a medias</title><desc id="d">Tabla de cuatro casos: reescribir con open en modo w y morir deja el archivo truncado y sin el contenido antiguo; escribir en un temporal y morir antes de os.replace deja el original intacto y un temporal huérfano; os.replace y el borrado con el archivo abierto fallan con PermissionError en Windows y funcionan en Linux.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="443" fill="#ffffff"/><rect x="10" y="12" width="344" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="182" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="182" dy="0">Caso</tspan></text><rect x="360" y="12" width="334" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="527" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="527" dy="0">Windows</tspan></text><rect x="700" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="827" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="827" dy="0">Linux (WSL2)</tspan></text><rect x="10" y="56" width="344" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="182" y="82.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">Reescribir con open(&#x27;w&#x27;) y morir tras 2 000</tspan></text><text x="182" y="98.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">bytes</tspan></text><rect x="360" y="56" width="334" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="82.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">Archivo de 2 000 B con «NUEVO»: el contenido</tspan></text><text x="527" y="98.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">antiguo (60 B) se perdió</tspan></text><rect x="700" y="56" width="254" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="90.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">Igual</tspan></text><rect x="10" y="124" width="344" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="182" y="150.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">Escribir en un temporal y morir antes de</tspan></text><text x="182" y="166.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">os.replace</tspan></text><rect x="360" y="124" width="334" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="150.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">Original intacto (60 B, «VIEJO»); queda un</tspan></text><text x="527" y="166.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">.tmp huérfano</tspan></text><rect x="700" y="124" width="254" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="158.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">Igual</tspan></text><rect x="10" y="192" width="344" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="182" y="218.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">os.replace con el destino abierto por otro</tspan></text><text x="182" y="234.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">lector</tspan></text><rect x="360" y="192" width="334" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="226.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">PermissionError (WinError 5)</tspan></text><rect x="700" y="192" width="254" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="226.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">Reemplaza sin error</tspan></text><rect x="10" y="260" width="344" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="182" y="294.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">Borrar un archivo que sigue abierto</tspan></text><rect x="360" y="260" width="334" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="294.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">PermissionError</tspan></text><rect x="700" y="260" width="254" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="294.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">Borra sin error</tspan></text><rect x="10" y="332" width="950" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="485" y="356.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">El patrón seguro es: escribir un temporal en el mismo directorio, vaciar a disco y reemplazar con os.replace. En Windows el</tspan></text><text x="485" y="373.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">reemplazo puede fallar si otro proceso tiene el destino abierto, así que hay que reintentar con espera acotada y limpiar los</tspan></text><text x="485" y="390.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">temporales huérfanos al empezar.</tspan></text><text x="485" y="429.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Medido con CPython 3.12.9 en Windows 11 y 3.12.3 en Ubuntu bajo WSL2; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
