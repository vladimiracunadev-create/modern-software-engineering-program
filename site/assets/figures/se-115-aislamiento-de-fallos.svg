<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 444" width="940" height="444" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cinco formas de fallar de un plugin: qué capa de aislamiento corta cada una</title><desc id="d">Diagrama de capas: un subproceso con timeout=1,0 segundos envuelve a un bloque try/except con validación del resultado, que envuelve al plugin. ImportError y RuntimeError los corta el try/except; el texto en vez de entero lo corta la validación como TypeError; el cuelgue de 30 s lo corta el timeout a los 1,0 s; sin aislamiento los tres primeros hacen caer la aplicación o propagan el valor y el cuelgue la bloquea. Los plugins sanos plug0 y plug5 siguen devolviendo 2 y 11.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="444" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cinco formas de fallar de un plugin: qué capa de aislamiento corta cada una</tspan></text><rect x="10" y="49" width="600" height="270" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="24" y="71" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="24" dy="0">Subproceso con timeout = 1,0 s</tspan></text><rect x="30" y="85" width="560" height="190" rx="16" fill="#dff1ee" fill-opacity="0.45" stroke="#087f8c" stroke-width="1.6" stroke-dasharray="8 5"/><text x="44" y="107" font-size="14" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="44" dy="0">try/except y validación del tipo del resultado</tspan></text><rect x="60" y="125" width="500" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="310" y="156.92" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="310" dy="0">plugin: se importa, se ejecuta y devuelve un resultado</tspan></text><rect x="60" y="191" width="240" height="66" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="180" y="211" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="180" dy="0">ImportError al importarse ·</tspan></text><text x="180" y="227.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="180" dy="0">RuntimeError al ejecutarse →</tspan></text><text x="180" y="244.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="180" dy="0">aislados, los demás siguen</tspan></text><rect x="320" y="191" width="240" height="66" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="440" y="211" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="440" dy="0">Devuelve texto en vez de</tspan></text><text x="440" y="227.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="440" dy="0">entero → TypeError por validar</tspan></text><text x="440" y="244.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="440" dy="0">el resultado</tspan></text><rect x="30" y="277" width="560" height="34" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="310" y="297.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="310" dy="0">Se cuelga (espera 30 s) → TimeoutExpired a los 1,0 s</tspan></text><rect x="640" y="65" width="290" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="785" y="87" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="785" dy="0">Sin aislamiento: ImportError y</tspan></text><text x="785" y="103.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="785" dy="0">RuntimeError hacen caer toda la</tspan></text><text x="785" y="120.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="785" dy="0">aplicación</tspan></text><rect x="640" y="145" width="290" height="56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="785" y="168.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="785" dy="0">Sin aislamiento: el tipo equivocado</tspan></text><text x="785" y="184.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="785" dy="0">se propaga como valor</tspan></text><rect x="640" y="211" width="290" height="56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="785" y="234.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="785" dy="0">Sin aislamiento: el cuelgue bloquea a</tspan></text><text x="785" y="250.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="785" dy="0">la aplicación entera</tspan></text><rect x="640" y="277" width="290" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="785" y="293.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="785" dy="0">Plugins sanos plug0 y plug5: 2 y 11,</tspan></text><text x="785" y="309.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="785" dy="0">sin cambio</tspan></text><rect x="10" y="337" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="361.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">try/except aísla los errores pero no el cuelgue ni el consumo de memoria: para eso hace falta otro proceso con límite de</tspan></text><text x="470" y="378.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">tiempo. Cuanto más aislado el plugin, más costosa la comunicación; es una decisión de confianza, no una regla.</tspan></text><text x="470" y="426.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Mismos resultados en Windows (3.12.9) y Linux (3.12.3).</tspan></text></svg>
