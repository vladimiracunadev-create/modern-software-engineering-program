<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 495" width="970" height="495" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cinco formas de fallar de un plugin, con y sin aislamiento</title><desc id="d">Tabla de cinco fallos de plugin: un error de importación, una excepción en ejecución, un tipo de resultado equivocado y un cuelgue; sin aislamiento los tres primeros hacen caer la aplicación o propagan el valor, y el cuelgue la bloquea; con try/except, validación del resultado y un subproceso con timeout, cada fallo queda aislado y los plugins sanos devuelven 2 y 11.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="495" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Fallo del plugin</tspan></text><rect x="340" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="472" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="472" dy="0">Sin aislamiento</tspan></text><rect x="610" y="12" width="344" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="782" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="782" dy="0">Con aislamiento</tspan></text><rect x="10" y="56" width="324" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="90.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">El plugin falla al importarse (ImportError)</tspan></text><rect x="340" y="56" width="264" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="90.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">Cae toda la aplicación</tspan></text><rect x="610" y="56" width="344" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="90.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">aislado: ImportError; los demás plugins siguen</tspan></text><rect x="10" y="124" width="324" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="158.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">El plugin lanza una excepción al ejecutarse</tspan></text><rect x="340" y="124" width="264" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="158.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">Cae toda la aplicación</tspan></text><rect x="610" y="124" width="344" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="158.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">aislado: RuntimeError; los demás siguen</tspan></text><rect x="10" y="192" width="324" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="218.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">El plugin devuelve un tipo equivocado (texto</tspan></text><text x="172" y="234.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">en vez de entero)</tspan></text><rect x="340" y="192" width="264" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="226.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">Se propaga el valor equivocado</tspan></text><rect x="610" y="192" width="344" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="226.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">aislado: TypeError por validar el resultado</tspan></text><rect x="10" y="260" width="324" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="294.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">El plugin se cuelga (espera 30 s)</tspan></text><rect x="340" y="260" width="264" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="294.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">Bloquea a la aplicación entera</tspan></text><rect x="610" y="260" width="344" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="286.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">subprocess con timeout=1,0: TimeoutExpired a los</tspan></text><text x="782" y="302.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">1,0 s</tspan></text><rect x="10" y="328" width="324" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="362.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Plugins sanos (plug0 y plug5)</tspan></text><rect x="340" y="328" width="264" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="362.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">2 y 11</tspan></text><rect x="610" y="328" width="344" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="362.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">2 y 11: el aislamiento no los afecta</tspan></text><rect x="10" y="400" width="950" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="485" y="424.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">try/except aísla los errores pero no el cuelgue ni el consumo de memoria: para eso hace falta otro proceso con límite de</tspan></text><text x="485" y="441.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">tiempo. Cuanto más aislado el plugin, más costosa la comunicación; es una decisión de confianza, no una regla.</tspan></text><text x="485" y="481.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Mismos resultados en Windows (3.12.9) y Linux (3.12.3).</tspan></text></svg>
