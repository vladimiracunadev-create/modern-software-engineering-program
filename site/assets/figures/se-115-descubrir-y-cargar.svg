<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 427" width="970" height="427" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Descubrir plugins cuesta poco; cargarlos todos puede costar mucho</title><desc id="d">Tabla de arranque con entry points: descubrir 0, 10 y 50 plugins tarda entre 102 y 125 milisegundos en Windows y entre 5,9 y 10,9 en Linux, casi sin depender del número; cargar los 50 plugins ligeros cuesta 27,9 y 4,6 milisegundos y cargar los 50 que importan módulos pesados cuesta 277,4 y 51,0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="427" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Escenario</tspan></text><rect x="340" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="412" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="412" dy="0">Descubrir:</tspan></text><text x="412" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="412" dy="0">Windows</tspan></text><rect x="490" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="562" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="562" dy="0">Descubrir: Linux</tspan></text><rect x="640" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="717" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="717" dy="0">Cargar todos:</tspan></text><text x="717" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="717" dy="0">Windows</tspan></text><rect x="800" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="877" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="877" dy="0">Cargar todos:</tspan></text><text x="877" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="877" dy="0">Linux</tspan></text><rect x="10" y="56" width="324" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="88.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">0 plugins</tspan></text><rect x="340" y="56" width="144" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="412" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412" dy="0">125,3 ms</tspan></text><rect x="490" y="56" width="144" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">5,9 ms</tspan></text><rect x="640" y="56" width="154" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">—</tspan></text><rect x="800" y="56" width="154" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="877" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="877" dy="0">—</tspan></text><rect x="10" y="120" width="324" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="152.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">10 plugins ligeros</tspan></text><rect x="340" y="120" width="144" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="412" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412" dy="0">102,6 ms</tspan></text><rect x="490" y="120" width="144" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">7,9 ms</tspan></text><rect x="640" y="120" width="154" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">5,4 ms</tspan></text><rect x="800" y="120" width="154" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="877" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="877" dy="0">1,1 ms</tspan></text><rect x="10" y="184" width="324" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="216.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">50 plugins ligeros</tspan></text><rect x="340" y="184" width="144" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="412" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412" dy="0">116,5 ms</tspan></text><rect x="490" y="184" width="144" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">10,9 ms</tspan></text><rect x="640" y="184" width="154" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">27,9 ms</tspan></text><rect x="800" y="184" width="154" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="877" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="877" dy="0">4,6 ms</tspan></text><rect x="10" y="248" width="324" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="272.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">50 plugins que importan 7 módulos de la</tspan></text><text x="172" y="288.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">biblioteca estándar</tspan></text><rect x="340" y="248" width="144" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="412" y="280.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412" dy="0">111,3 ms</tspan></text><rect x="490" y="248" width="144" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="280.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">10,8 ms</tspan></text><rect x="640" y="248" width="154" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="280.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">277,4 ms</tspan></text><rect x="800" y="248" width="154" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="877" y="280.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="877" dy="0">51,0 ms</tspan></text><rect x="10" y="316" width="950" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="485" y="340.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">Con cero plugins el descubrimiento ya costó 125 ms en Windows: lo domina el recorrido de las distribuciones instaladas, no los</tspan></text><text x="485" y="357.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">plugins. Lo que escala con la cantidad es la carga ansiosa (eager); con carga perezosa el costo se paga solo por el plugin que</tspan></text><text x="485" y="374.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">se usa. Mejor de 3 intérpretes nuevos por celda.</tspan></text><text x="485" y="413.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Medido con CPython 3.12.9 en Windows 11 y 3.12.3 en Ubuntu bajo WSL2; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
