<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 722" width="940" height="722" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Descubrir plugins cuesta poco; cargarlos todos puede costar mucho</title><desc id="d">Barras horizontales con el tiempo de descubrir y de cargar 0, 10 y 50 plugins ligeros y 50 que importan siete módulos: descubrir ronda 102 a 125 ms en Windows y 5,9 a 10,9 ms en Linux casi sin depender del número de plugins; cargar los 50 ligeros cuesta 27,9 y 4,6 ms y cargar los 50 pesados cuesta 277,4 y 51,0 ms.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="722" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Descubrir plugins cuesta poco; cargarlos todos puede costar mucho</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Descubrir: Windows</tspan></text><rect x="199.72" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="219.72" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="219.72" dy="0">Descubrir: Linux</tspan></text><rect x="368.36" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="388.36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="388.36" dy="0">Cargar todos: Windows</tspan></text><rect x="574.7" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="594.7" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="594.7" dy="0">Cargar todos: Linux</tspan></text><line x1="234" y1="77" x2="234" y2="541" stroke="#d5dde1" stroke-width="1"/><line x1="234" y1="541" x2="234" y2="546" stroke="#5b7280" stroke-width="1.4"/><text x="234" y="562" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="234" dy="0">0</tspan></text><line x1="447.9" y1="77" x2="447.9" y2="541" stroke="#d5dde1" stroke-width="1"/><line x1="447.9" y1="541" x2="447.9" y2="546" stroke="#5b7280" stroke-width="1.4"/><text x="447.9" y="562" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447.9" dy="0">100</tspan></text><line x1="661.8" y1="77" x2="661.8" y2="541" stroke="#d5dde1" stroke-width="1"/><line x1="661.8" y1="541" x2="661.8" y2="546" stroke="#5b7280" stroke-width="1.4"/><text x="661.8" y="562" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="661.8" dy="0">200</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="541" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="541" x2="875.7" y2="546" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="562" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">300</tspan></text><line x1="234" y1="541" x2="875.7" y2="541" stroke="#5b7280" stroke-width="1.6"/><text x="224" y="139.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="224" dy="0">0 plugins</tspan></text><text x="224" y="255.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="224" dy="0">10 plugins ligeros</tspan></text><text x="224" y="371.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="224" dy="0">50 plugins ligeros</tspan></text><text x="224" y="479" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="224" dy="0">50 plugins que importan 7</tspan></text><text x="224" y="496" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="224" dy="0">módulos</tspan></text><rect x="234" y="83" width="268.017" height="23.75" rx="3" fill="#c0432f"/><text x="509.017" y="99.375" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="509.017" dy="0">125,3</tspan></text><rect x="234" y="109.75" width="12.6201" height="23.75" rx="3" fill="#087f8c"/><text x="253.62" y="126.125" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="253.62" dy="0">5,9</tspan></text><rect x="234" y="136.5" width="2" height="23.75" rx="3" fill="#946512"/><text x="243" y="152.875" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="243" dy="0">—</tspan></text><rect x="234" y="163.25" width="2" height="23.75" rx="3" fill="#102a43"/><text x="243" y="179.625" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="243" dy="0">—</tspan></text><rect x="234" y="199" width="219.461" height="23.75" rx="3" fill="#c0432f"/><text x="460.461" y="215.375" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="460.461" dy="0">102,6</tspan></text><rect x="234" y="225.75" width="16.8981" height="23.75" rx="3" fill="#087f8c"/><text x="257.898" y="242.125" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="257.898" dy="0">7,9</tspan></text><rect x="234" y="252.5" width="11.5506" height="23.75" rx="3" fill="#946512"/><text x="252.551" y="268.875" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="252.551" dy="0">5,4</tspan></text><rect x="234" y="279.25" width="2.3529" height="23.75" rx="3" fill="#102a43"/><text x="243.353" y="295.625" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="243.353" dy="0">1,1</tspan></text><rect x="234" y="315" width="249.193" height="23.75" rx="3" fill="#c0432f"/><text x="490.193" y="331.375" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="490.193" dy="0">116,5</tspan></text><rect x="234" y="341.75" width="23.3151" height="23.75" rx="3" fill="#087f8c"/><text x="264.315" y="358.125" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="264.315" dy="0">10,9</tspan></text><rect x="234" y="368.5" width="59.6781" height="23.75" rx="3" fill="#946512"/><text x="300.678" y="384.875" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="300.678" dy="0">27,9</tspan></text><rect x="234" y="395.25" width="9.8394" height="23.75" rx="3" fill="#102a43"/><text x="250.839" y="411.625" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="250.839" dy="0">4,6</tspan></text><rect x="234" y="431" width="238.071" height="23.75" rx="3" fill="#c0432f"/><text x="479.071" y="447.375" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="479.071" dy="0">111,3</tspan></text><rect x="234" y="457.75" width="23.1012" height="23.75" rx="3" fill="#087f8c"/><text x="264.101" y="474.125" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="264.101" dy="0">10,8</tspan></text><rect x="234" y="484.5" width="593.359" height="23.75" rx="3" fill="#946512"/><text x="834.359" y="500.875" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="834.359" dy="0">277,4</tspan></text><rect x="234" y="511.25" width="109.089" height="23.75" rx="3" fill="#102a43"/><text x="350.089" y="527.625" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="350.089" dy="0">51,0</tspan></text><text x="554.85" y="585" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="554.85" dy="0">ms, mejor de 3 intérpretes nuevos</tspan></text><rect x="10" y="599" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="623.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Con cero plugins el descubrimiento ya costó 125 ms en Windows: lo domina el recorrido de las distribuciones instaladas, no</tspan></text><text x="470" y="640.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">los plugins. Lo que escala con la cantidad es la carga ansiosa (eager); con carga perezosa el costo se paga solo por el</tspan></text><text x="470" y="657.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">plugin que se usa. «—» = no aplica con cero plugins.</tspan></text><text x="470" y="704.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11 y 3.12.3 en Ubuntu bajo WSL2; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
