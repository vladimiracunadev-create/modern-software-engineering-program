<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 448" width="940" height="448" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Orden de carga y versión de la API: lo que el contrato no garantiza</title><desc id="d">Diagrama de tres comprobaciones: entry_points devuelve plug0 a plug5 en orden alfabético en Windows y plug5, plug3, plug4, plug0, plug1, plug2 en Linux; componer por 2 y luego sumar 3 con x = 5 da 13, mientras que sumar 3 y luego por 2 da 16; con la API del anfitrión en la versión 2, un plugin que declara 2 o 2.5 se acepta y uno que declara 1 o 3 se rechaza.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="448" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Orden de carga y versión de la API: lo que el contrato no garantiza</tspan></text><text x="10" y="59" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="10" dy="0">1. El mismo código devuelve otro orden</tspan></text><rect x="10" y="69" width="80" height="34" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="50" y="89.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="50" dy="0">Windows</tspan></text><rect x="100" y="69" width="830" height="34" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="515" y="89.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="515" dy="0">plug0, plug1, plug2, plug3, plug4, plug5</tspan></text><rect x="10" y="111" width="80" height="34" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="50" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="50" dy="0">Linux</tspan></text><rect x="100" y="111" width="830" height="34" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="515" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="515" dy="0">plug5, plug3, plug4, plug0, plug1, plug2</tspan></text><text x="10" y="179" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="10" dy="0">2. El orden cambia el resultado (x = 5; igual en Windows y Linux)</tspan></text><rect x="10" y="191" width="70" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="45" y="212.92" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="45" dy="0">x = 5</tspan></text><rect x="130" y="191" width="100" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="180" y="212.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="180" dy="0">por 2 → 10</tspan></text><rect x="280" y="191" width="100" height="36" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="330" y="212.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="330" dy="0">+ 3 → 13</tspan></text><rect x="130" y="237" width="100" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="180" y="258.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="180" dy="0">+ 3 → 8</tspan></text><rect x="280" y="237" width="100" height="36" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="330" y="258.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="330" dy="0">por 2 → 16</tspan></text><polyline points="80,209 130,209" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="230,209 280,209" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="80,215 105,255 130,255" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="230,255 280,255" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="10" y="297" font-size="13" text-anchor="start" font-weight="400" fill="#32505f"><tspan x="10" dy="0">Nada en el contrato de entry_points fija</tspan><tspan x="10" dy="16.64">el orden: si importa, ordena el anfitrión.</tspan></text><text x="480" y="179" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="480" dy="0">3. Versión de la API (anfitrión = 2)</tspan></text><line x1="500" y1="235" x2="920" y2="235" stroke="#32505f" stroke-width="2"/><circle cx="520" cy="235" r="12" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="520" y="240" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="520" dy="0"></tspan></text><text x="520" y="267" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="520" dy="0">declara 1</tspan></text><text x="520" y="211" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="520" dy="0">rechaza</tspan></text><circle cx="640" cy="235" r="12" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="640" y="240" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="640" dy="0"></tspan></text><text x="640" y="267" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="640" dy="0">declara 2</tspan></text><text x="640" y="211" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="640" dy="0">acepta</tspan></text><circle cx="740" cy="235" r="12" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="740" y="240" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="740" dy="0"></tspan></text><text x="740" y="267" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="740" dy="0">declara 2,5</tspan></text><text x="740" y="211" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="740" dy="0">acepta</tspan></text><circle cx="860" cy="235" r="12" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="860" y="240" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="860" dy="0"></tspan></text><text x="860" y="267" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="860" dy="0">declara 3</tspan></text><text x="860" y="211" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="860" dy="0">rechaza</tspan></text><text x="500" y="297" font-size="13" text-anchor="start" font-weight="400" fill="#32505f"><tspan x="500" dy="0">Se acepta la misma versión mayor</tspan><tspan x="500" dy="16.64">(2 y 2.5); se rechazan 1 y 3.</tspan></text><rect x="10" y="341" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="365.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Si el resultado depende del orden, el anfitrión debe ordenar explícitamente (por prioridad y nombre) y rechazar plugins</tspan></text><text x="470" y="382.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cuya versión mayor de API no conozca.</tspan></text><text x="470" y="430.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 y 3.12.3; plugins creados como distribuciones sintéticas en un directorio temporal.</tspan></text></svg>
