<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 534" width="940" height="534" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Generación determinista: qué cambia el SHA-256 de la salida y qué no</title><desc id="d">Diagrama de cuatro variaciones de un generador de clases frente al SHA-256 de la salida: generar dos veces con el mismo esquema y cambiar el orden de las claves dan el mismo SHA-256 (729294cd8c…), idéntico en Windows y Linux; añadir una marca de tiempo da uno distinto cada vez y editar a mano la clase generada da uno distinto del regenerado, y regenerar y comparar detecta la deriva. ast.parse valida la sintaxis sin ejecutar: 43 nodos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="534" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Generación determinista: qué cambia el SHA-256 de la salida y qué no</tspan></text><rect x="10" y="53" width="360" height="62" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="190" y="87.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="190" dy="0">Generar dos veces con el mismo esquema</tspan></text><polyline points="370,84 470,84" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="127" width="360" height="62" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="190" y="153.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="190" dy="0">Cambiar el orden de las claves del esquema (el</tspan></text><text x="190" y="169.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="190" dy="0">generador ordena antes de escribir)</tspan></text><polyline points="370,158 470,158" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="201" width="360" height="62" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="190" y="235.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="190" dy="0">Añadir una marca de tiempo al encabezado</tspan></text><polyline points="370,232 470,232" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="275" width="360" height="62" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="190" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="190" dy="0">Editar a mano la clase generada</tspan></text><polyline points="370,306 470,306" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="470" y="53" width="220" height="62" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="580" y="87.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="580" dy="0">SHA-256 igual: 729294cd8c…</tspan></text><rect x="470" y="127" width="220" height="62" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="580" y="153.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="580" dy="0">SHA-256 igual (el orden no</tspan></text><text x="580" y="169.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="580" dy="0">importa)</tspan></text><rect x="470" y="201" width="220" height="62" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="580" y="235.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="580" dy="0">SHA-256 distinto cada vez</tspan></text><rect x="470" y="275" width="220" height="62" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="580" y="301.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="580" dy="0">SHA-256 distinto del</tspan></text><text x="580" y="317.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="580" dy="0">regenerado</tspan></text><rect x="730" y="53" width="200" height="136" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="830" y="116.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="830" dy="0">Reproducible: idéntico</tspan></text><text x="830" y="132.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="830" dy="0">en Windows y Linux</tspan></text><rect x="730" y="201" width="200" height="62" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="830" y="227.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="830" dy="0">Un generador con reloj</tspan></text><text x="830" y="243.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="830" dy="0">no es reproducible</tspan></text><rect x="730" y="275" width="200" height="62" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="830" y="301.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="830" dy="0">Regenerar y comparar</tspan></text><text x="830" y="317.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="830" dy="0">detecta la deriva</tspan></text><polyline points="690,84 730,84" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="690,158 730,158" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="690,232 730,232" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="690,306 730,306" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="353" width="920" height="38" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="470" y="375.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="470" dy="0">ast.parse sobre la salida: válido, 43 nodos; la sintaxis se valida sin ejecutar nada.</tspan></text><rect x="10" y="411" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="435.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">La verificación en CI es regenerar y comparar con git diff: si difiere, alguien editó lo generado o cambió el esquema sin</tspan></text><text x="470" y="452.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">regenerar. Un generador que depende del reloj, del orden de un diccionario sin ordenar o de la ruta absoluta rompe esa</tspan></text><text x="470" y="469.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">verificación.</tspan></text><text x="470" y="516.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11 y 3.12.3 en Ubuntu bajo WSL2; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
