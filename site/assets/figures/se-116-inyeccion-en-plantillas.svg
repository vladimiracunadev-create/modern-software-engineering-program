<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 443" width="970" height="443" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Generar código desde datos: cuando el dato se convierte en código</title><desc id="d">Tabla de cuatro comprobaciones: una plantilla con un valor hostil que cierra la cadena produce un árbol sintáctico con un Import y un Call; con repr el árbol no tiene ninguno y literal_eval devuelve el valor idéntico; los identificadores class, 2x, a b y a;b se rechazan con isidentifier y la lista de palabras clave.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="443" fill="#ffffff"/><rect x="10" y="12" width="344" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="182" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="182" dy="0">Caso</tspan></text><rect x="360" y="12" width="314" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="517" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="517" dy="0">Resultado</tspan></text><rect x="680" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="817" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="817" dy="0">Lectura</tspan></text><rect x="10" y="56" width="344" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="182" y="84.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">Plantilla NAME = «{v}» con un valor que cierra</tspan></text><text x="182" y="100.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">la cadena e importa os</tspan></text><rect x="360" y="56" width="314" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="517" y="92.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517" dy="0">ast encuentra 1 Import y 1 Call</tspan></text><rect x="680" y="56" width="274" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="92.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">El dato se convirtió en código</tspan></text><rect x="10" y="128" width="344" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="182" y="164.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">La misma plantilla con repr(valor)</tspan></text><rect x="360" y="128" width="314" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="517" y="156.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517" dy="0">0 Import y 0 Call; literal_eval devuelve el</tspan></text><text x="517" y="172.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517" dy="0">valor idéntico</tspan></text><rect x="680" y="128" width="274" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="164.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">El dato sigue siendo dato</tspan></text><rect x="10" y="200" width="344" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="182" y="236.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">Identificador «valido» o «ok_1»</tspan></text><rect x="360" y="200" width="314" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="517" y="228.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517" dy="0">Aceptado por isidentifier y no es palabra</tspan></text><text x="517" y="244.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517" dy="0">clave</tspan></text><rect x="680" y="200" width="274" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="236.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">Se puede usar como nombre</tspan></text><rect x="10" y="272" width="344" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="182" y="308.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">Identificadores «class», «2x», «a b», «a;b»</tspan></text><rect x="360" y="272" width="314" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="517" y="308.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517" dy="0">Rechazados</tspan></text><rect x="680" y="272" width="274" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="300.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">Nombres de campo del esquema se</tspan></text><text x="817" y="316.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">validan antes de generar</tspan></text><rect x="10" y="348" width="950" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="485" y="372.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Se analizó con ast sin ejecutar nada. Escapar con repr (o serializar con json.dumps) y validar nombres antes de interpolarlos</tspan></text><text x="485" y="389.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">convierte el problema en una propiedad comprobable. exec y eval sobre texto no confiable no tienen arreglo posible: se evitan.</tspan></text><text x="485" y="429.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Medido con CPython 3.12.9 sobre una cadena sintética inocua; idéntico en Linux.</tspan></text></svg>
