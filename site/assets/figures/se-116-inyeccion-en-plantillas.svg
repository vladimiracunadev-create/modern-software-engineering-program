<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 518" width="940" height="518" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Generar código desde datos: cuando el dato se convierte en código</title><desc id="d">Diagrama de dos canalizaciones con un valor hostil que cierra la cadena e importa os: en la plantilla NAME = «{v}» el análisis con ast encuentra 1 Import y 1 Call, así que el dato se convirtió en código; con repr(valor) encuentra 0 Import y 0 Call y literal_eval devuelve el valor idéntico. Los identificadores valido y ok_1 pasan isidentifier y los nombres class, 2x, a b y a;b se rechazan antes de generar.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="518" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Generar código desde datos: cuando el dato se convierte en código</tspan></text><text x="10" y="65" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="10" dy="0">Plantilla NAME = «{v}»</tspan></text><rect x="10" y="77" width="215" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="117.5" y="109.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="117.5" dy="0">valor que cierra la cadena</tspan></text><text x="117.5" y="125.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="117.5" dy="0">e importa os</tspan></text><rect x="253" y="77" width="215" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="360.5" y="109.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="360.5" dy="0">se interpola tal cual en</tspan></text><text x="360.5" y="125.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="360.5" dy="0">el texto de la plantilla</tspan></text><polyline points="225,114 253,114" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="496" y="77" width="215" height="74" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="603.5" y="109.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="603.5" dy="0">ast.parse: 1 Import y 1</tspan></text><text x="603.5" y="125.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="603.5" dy="0">Call</tspan></text><polyline points="468,114 496,114" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="711,114 733,114" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="739" y="77" width="181" height="74" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="829.5" y="109.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="829.5" dy="0">El dato se convirtió</tspan></text><text x="829.5" y="125.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="829.5" dy="0">en código</tspan></text><text x="10" y="189" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="10" dy="0">Plantilla con repr(valor)</tspan></text><rect x="10" y="201" width="215" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="117.5" y="241.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="117.5" dy="0">el mismo valor hostil</tspan></text><rect x="253" y="201" width="215" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="360.5" y="233.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="360.5" dy="0">repr lo escapa como</tspan></text><text x="360.5" y="249.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="360.5" dy="0">literal de texto</tspan></text><polyline points="225,238 253,238" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="496" y="201" width="215" height="74" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="603.5" y="225" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="603.5" dy="0">ast.parse: 0 Import y 0</tspan></text><text x="603.5" y="241.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="603.5" dy="0">Call; literal_eval</tspan></text><text x="603.5" y="258.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="603.5" dy="0">devuelve el valor idéntico</tspan></text><polyline points="468,238 496,238" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="711,238 733,238" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="739" y="201" width="181" height="74" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="829.5" y="233.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="829.5" dy="0">El dato sigue siendo</tspan></text><text x="829.5" y="249.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="829.5" dy="0">dato</tspan></text><text x="10" y="321" font-size="14" text-anchor="start" font-weight="700" fill="#142231"><tspan x="10" dy="0">Antes de generar: se validan los nombres de campo del esquema</tspan></text><rect x="10" y="333" width="300" height="56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="160" y="356.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="160" dy="0">«valido» y «ok_1»: isidentifier y no</tspan></text><text x="160" y="372.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="160" dy="0">son palabra clave → aceptados</tspan></text><rect x="330" y="333" width="300" height="56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="356.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">«class», «2x», «a b» y «a;b» →</tspan></text><text x="480" y="372.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">rechazados</tspan></text><rect x="650" y="333" width="280" height="56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="790" y="348" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="790" dy="0">exec y eval sobre texto no</tspan></text><text x="790" y="364.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="790" dy="0">confiable no tienen arreglo: se</tspan></text><text x="790" y="381.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="790" dy="0">evitan</tspan></text><rect x="10" y="411" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="435.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Se analizó con ast sin ejecutar nada. Escapar con repr (o serializar con json.dumps) y validar nombres antes de</tspan></text><text x="470" y="452.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">interpolarlos convierte el problema en una propiedad comprobable.</tspan></text><text x="470" y="500.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 sobre una cadena sintética inocua; idéntico en Linux.</tspan></text></svg>
