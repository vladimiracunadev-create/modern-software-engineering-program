<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 532" width="940" height="532" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Expresiones de licencia SPDX: la gramática y dónde falla cada rechazo</title><desc id="d">Diagrama de la gramática que aplica un validador mínimo: operandos que son identificadores conocidos o LicenseRef, un sufijo opcional más o WITH, operadores AND y OR y paréntesis balanceados. Las seis expresiones válidas son MIT, MIT OR Apache-2.0, GPL-2.0-only WITH Classpath-exception-2.0, MIT AND (BSD-3-Clause OR Apache-2.0), Apache-2.0+ y LicenseRef-propietaria; las seis inválidas fallan cada una en una regla: barra, identificador desconocido, ambigüedad, operando ausente, paréntesis sin cerrar y espacio.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="532" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Expresiones de licencia SPDX: la gramática y dónde falla cada rechazo</tspan></text><rect x="10" y="53" width="920" height="34" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="73.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="470" dy="0">Válidas (6 de 12): se acepta lo que cumple la gramática</tspan></text><rect x="10" y="93" width="146.667" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="83.3333" y="133.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="83.3333" dy="0">MIT</tspan></text><rect x="164.667" y="93" width="146.667" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="238" y="133.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="238" dy="0">MIT OR Apache-2.0</tspan></text><rect x="319.333" y="93" width="146.667" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="392.667" y="125.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="392.667" dy="0">GPL-2.0-only WITH</tspan></text><text x="392.667" y="141.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="392.667" dy="0">Classpath-exception-2.0</tspan></text><rect x="474" y="93" width="146.667" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="547.333" y="117" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547.333" dy="0">MIT AND</tspan></text><text x="547.333" y="133.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547.333" dy="0">(BSD-3-Clause OR</tspan></text><text x="547.333" y="150.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547.333" dy="0">Apache-2.0)</tspan></text><rect x="628.667" y="93" width="146.667" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="702" y="133.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">Apache-2.0+</tspan></text><rect x="783.333" y="93" width="146.667" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="856.667" y="133.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="856.667" dy="0">LicenseRef-propietaria</tspan></text><rect x="10" y="187" width="920" height="34" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="207.92" font-size="14" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="470" dy="0">Inválidas (6 de 12): cada una rompe una regla distinta</tspan></text><rect x="10" y="227" width="146.667" height="30" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="83.3333" y="245.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="83.3333" dy="0">Operador</tspan></text><rect x="10" y="261" width="146.667" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="83.3333" y="284.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="83.3333" dy="0">MIT/Apache-2.0</tspan></text><polyline points="83.3333,301 83.3333,315" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="315" width="146.667" height="74" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="83.3333" y="347.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="83.3333" dy="0">la barra no es</tspan></text><text x="83.3333" y="363.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="83.3333" dy="0">operador</tspan></text><rect x="164.667" y="227" width="146.667" height="30" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="238" y="245.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="238" dy="0">Identificador</tspan></text><rect x="164.667" y="261" width="146.667" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="238" y="284.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="238" dy="0">GPLv2</tspan></text><polyline points="238,301 238,315" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="164.667" y="315" width="146.667" height="74" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="238" y="339" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="238" dy="0">no es un</tspan></text><text x="238" y="355.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="238" dy="0">identificador de</tspan></text><text x="238" y="372.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="238" dy="0">la lista</tspan></text><rect x="319.333" y="227" width="146.667" height="30" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="392.667" y="245.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="392.667" dy="0">Ambigüedad</tspan></text><rect x="319.333" y="261" width="146.667" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="392.667" y="284.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="392.667" dy="0">BSD</tspan></text><polyline points="392.667,301 392.667,315" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="319.333" y="315" width="146.667" height="74" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="392.667" y="339" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="392.667" dy="0">hay licencias de</tspan></text><text x="392.667" y="355.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="392.667" dy="0">2, 3 y 4</tspan></text><text x="392.667" y="372.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="392.667" dy="0">cláusulas</tspan></text><rect x="474" y="227" width="146.667" height="30" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="547.333" y="245.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="547.333" dy="0">Operando</tspan></text><rect x="474" y="261" width="146.667" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="547.333" y="284.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="547.333" dy="0">MIT OR</tspan></text><polyline points="547.333,301 547.333,315" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="474" y="315" width="146.667" height="74" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="547.333" y="355.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="547.333" dy="0">falta un operando</tspan></text><rect x="628.667" y="227" width="146.667" height="30" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="702" y="245.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="702" dy="0">Paréntesis</tspan></text><rect x="628.667" y="261" width="146.667" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="702" y="284.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="702" dy="0">(MIT</tspan></text><polyline points="702,301 702,315" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="628.667" y="315" width="146.667" height="74" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="702" y="347.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="702" dy="0">paréntesis sin</tspan></text><text x="702" y="363.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="702" dy="0">cerrar</tspan></text><rect x="783.333" y="227" width="146.667" height="30" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="856.667" y="245.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="856.667" dy="0">Espacio</tspan></text><rect x="783.333" y="261" width="146.667" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="856.667" y="284.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="856.667" dy="0">Apache 2.0</tspan></text><polyline points="856.667,301 856.667,315" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="783.333" y="315" width="146.667" height="74" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="856.667" y="347.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="856.667" dy="0">espacio: no es un</tspan></text><text x="856.667" y="363.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="856.667" dy="0">identificador</tspan></text><rect x="10" y="409" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="433.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Un validador de gramática (operadores, paréntesis, identificadores conocidos) rechaza lo ambiguo sin interpretar derecho.</tspan></text><text x="470" y="450.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Que una expresión sea válida no dice si las licencias son compatibles entre sí ni si se puede redistribuir: eso es una</tspan></text><text x="470" y="467.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">decisión legal que esta clase no resuelve.</tspan></text><text x="470" y="514.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Validador escrito para la clase (24 identificadores); resultados deterministas, idénticos en Windows y Linux. No es asesoría legal.</tspan></text></svg>
