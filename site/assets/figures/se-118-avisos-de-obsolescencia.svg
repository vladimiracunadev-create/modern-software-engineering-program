<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 510" width="940" height="510" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Quién ve el aviso de obsolescencia</title><desc id="d">Diagrama del filtro de avisos de Python para una función obsoleta: con la configuración por defecto el DeprecationWarning se muestra si la llamada viene del script principal y se silencia si viene de un módulo de la aplicación; con -W default se ve desde cualquier módulo y con -W error::DeprecationWarning se convierte en excepción y la salida es 1.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="510" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Quién ve el aviso de obsolescencia</tspan></text><rect x="350" y="53" width="240" height="50" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="73.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Función obsoleta emite</tspan></text><text x="470" y="89.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">DeprecationWarning</tspan></text><rect x="10" y="145" width="420" height="46" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="220" y="171.92" font-size="14" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="220" dy="0">Filtro por defecto de Python</tspan></text><rect x="510" y="145" width="420" height="46" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="720" y="171.92" font-size="14" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="720" dy="0">Filtros que elige el consumidor</tspan></text><polyline points="440,103 220,145" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="500,103 720,145" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="235" width="200" height="130" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="110" y="278.68" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">Llamada desde el script</tspan></text><text x="110" y="295.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">principal (__main__):</tspan></text><text x="110" y="311.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">aviso visible, sin</tspan></text><text x="110" y="328.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">configurar nada</tspan></text><rect x="230" y="235" width="200" height="130" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="330" y="278.68" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="330" dy="0">Llamada desde un módulo</tspan></text><text x="330" y="295.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="330" dy="0">de la aplicación:</tspan></text><text x="330" y="311.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="330" dy="0">silencio; el filtro solo</tspan></text><text x="330" y="328.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="330" dy="0">muestra __main__</tspan></text><rect x="510" y="235" width="200" height="130" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="610" y="287" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="610" dy="0">-W default: aviso</tspan></text><text x="610" y="303.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="610" dy="0">visible; el consumidor</tspan></text><text x="610" y="320.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="610" dy="0">lo activa</tspan></text><rect x="730" y="235" width="200" height="130" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="830" y="262.04" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="830" dy="0">-W</tspan></text><text x="830" y="278.68" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="830" dy="0">error::DeprecationWarning:</tspan></text><text x="830" y="295.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="830" dy="0">se vuelve error, salida</tspan></text><text x="830" y="311.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="830" dy="0">1; la integración</tspan></text><text x="830" y="328.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="830" dy="0">continua puede exigir</tspan></text><text x="830" y="345.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="830" dy="0">cero avisos</tspan></text><polyline points="110,191 110,235" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="330,191 330,235" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="610,191 610,235" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="830,191 830,235" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="387" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="411.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Con stacklevel=2 el aviso apunta al código del consumidor, no al interior del SDK. Un aviso que nadie ve no cumple la</tspan></text><text x="470" y="428.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">función de avisar: el SDK debe documentar el plazo y la alternativa y verificar con -W error en su propia integración</tspan></text><text x="470" y="445.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">continua. Idéntico en Windows y Linux.</tspan></text><text x="470" y="492.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11 y 3.12.3 en Ubuntu bajo WSL2; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
