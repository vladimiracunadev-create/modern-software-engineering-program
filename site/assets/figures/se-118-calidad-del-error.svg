<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 451" width="940" height="451" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Calidad del error: líneas de traceback y si dicen cómo arreglarlo</title><desc id="d">Barras horizontales con las líneas de traceback de cuatro errores, en coral los que no dicen cómo arreglarlo y en verde azulado los que sí: un KeyError crudo da 8 líneas sin acción posible; una excepción propia con causa y solución da 8 líneas con la solución; una pila de tres funciones sin envolver da 20 líneas y el mismo KeyError; la misma pila envuelta con raise from None vuelve a 8 líneas con causa y solución.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="451" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Calidad del error: líneas de traceback y si dicen cómo arreglarlo</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">No dice cómo arreglarlo</tspan></text><rect x="237.42" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="257.42" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="257.42" dy="0">Dice cómo arreglarlo</tspan></text><line x1="254" y1="77" x2="254" y2="253" stroke="#d5dde1" stroke-width="1"/><line x1="254" y1="253" x2="254" y2="258" stroke="#5b7280" stroke-width="1.4"/><text x="254" y="274" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="254" dy="0">0</tspan></text><line x1="409.425" y1="77" x2="409.425" y2="253" stroke="#d5dde1" stroke-width="1"/><line x1="409.425" y1="253" x2="409.425" y2="258" stroke="#5b7280" stroke-width="1.4"/><text x="409.425" y="274" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="409.425" dy="0">5</tspan></text><line x1="564.85" y1="77" x2="564.85" y2="253" stroke="#d5dde1" stroke-width="1"/><line x1="564.85" y1="253" x2="564.85" y2="258" stroke="#5b7280" stroke-width="1.4"/><text x="564.85" y="274" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="564.85" dy="0">10</tspan></text><line x1="720.275" y1="77" x2="720.275" y2="253" stroke="#d5dde1" stroke-width="1"/><line x1="720.275" y1="253" x2="720.275" y2="258" stroke="#5b7280" stroke-width="1.4"/><text x="720.275" y="274" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="720.275" dy="0">15</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="253" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="253" x2="875.7" y2="258" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="274" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">20</tspan></text><line x1="254" y1="253" x2="875.7" y2="253" stroke="#5b7280" stroke-width="1.6"/><text x="244" y="103.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">KeyError crudo</tspan></text><text x="244" y="139" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">Excepción propia con causa y</tspan></text><text x="244" y="156" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">arreglo</tspan></text><text x="244" y="183" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">Pila de 3 funciones sin</tspan></text><text x="244" y="200" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">envolver</tspan></text><text x="244" y="227" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">La misma pila con raise … from</tspan></text><text x="244" y="244" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">None</tspan></text><rect x="254" y="84" width="248.68" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="378.34" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="378.34" dy="0">8</tspan></text><rect x="502.68" y="84" width="0" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="509.68" y="103.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="509.68" dy="0">8</tspan></text><rect x="254" y="128" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><rect x="254" y="128" width="248.68" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="378.34" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="378.34" dy="0">8</tspan></text><text x="509.68" y="147.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="509.68" dy="0">8</tspan></text><rect x="254" y="172" width="621.7" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="564.85" y="191.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="564.85" dy="0">20</tspan></text><rect x="875.7" y="172" width="0" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="191.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">20</tspan></text><rect x="254" y="216" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><rect x="254" y="216" width="248.68" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="378.34" y="235.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="378.34" dy="0">8</tspan></text><text x="509.68" y="235.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="509.68" dy="0">8</tspan></text><text x="564.85" y="297" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="564.85" dy="0">líneas de traceback</tspan></text><rect x="10" y="311" width="920" height="92.56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="335.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Envolver el error en la frontera del SDK redujo la pila de 20 a 8 líneas y añadió la acción. El último renglón de los</tspan></text><text x="470" y="352.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">crudos es «KeyError: &#x27;endpoint&#x27;»; el de los envueltos, «Falta &#x27;endpoint&#x27;. Causa… Solución…». El costo: from None oculta la</tspan></text><text x="470" y="369.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">causa original, útil para el usuario final pero molesta al depurar el SDK; se decide con un modo de depuración que conserve</tspan></text><text x="470" y="385.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">la cadena.</tspan></text><text x="470" y="433.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9; las líneas de traceback incluyen rutas del equipo y no se reproducen aquí.</tspan></text></svg>
