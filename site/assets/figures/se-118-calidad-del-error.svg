<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 395" width="970" height="395" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Calidad del error: líneas de traceback y qué dice la última</title><desc id="d">Tabla de cuatro errores: un KeyError crudo da 8 líneas de traceback sin acción posible; una excepción propia con causa y solución da 8 líneas y la solución; una pila de tres funciones sin envolver da 20 líneas y el mismo KeyError; envuelta con raise from None vuelve a 8 líneas con causa y solución.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="395" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Caso</tspan></text><rect x="340" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="412" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="412" dy="0">Líneas de</tspan></text><text x="412" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="412" dy="0">traceback</tspan></text><rect x="490" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="652" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="652" dy="0">Última línea (recortada)</tspan></text><rect x="820" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="887" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="887" dy="0">Dice cómo</tspan></text><text x="887" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="887" dy="0">arreglarlo</tspan></text><rect x="10" y="56" width="324" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="84.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">KeyError crudo</tspan></text><rect x="340" y="56" width="144" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="412" y="84.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412" dy="0">8</tspan></text><rect x="490" y="56" width="324" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="84.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">KeyError: &#x27;endpoint&#x27;</tspan></text><rect x="820" y="56" width="134" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="887" y="84.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="887" dy="0">No</tspan></text><rect x="10" y="112" width="324" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="140.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Excepción propia con causa y arreglo</tspan></text><rect x="340" y="112" width="144" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="412" y="140.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412" dy="0">8</tspan></text><rect x="490" y="112" width="324" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="140.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">Falta &#x27;endpoint&#x27;… Causa… Solución…</tspan></text><rect x="820" y="112" width="134" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="887" y="140.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="887" dy="0">Sí</tspan></text><rect x="10" y="168" width="324" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="196.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Pila de 3 funciones sin envolver</tspan></text><rect x="340" y="168" width="144" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="412" y="196.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412" dy="0">20</tspan></text><rect x="490" y="168" width="324" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="196.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">KeyError: &#x27;endpoint&#x27;</tspan></text><rect x="820" y="168" width="134" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="887" y="196.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="887" dy="0">No</tspan></text><rect x="10" y="224" width="324" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="252.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">La misma pila envuelta con raise … from None</tspan></text><rect x="340" y="224" width="144" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="412" y="252.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412" dy="0">8</tspan></text><rect x="490" y="224" width="324" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="252.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">Falta &#x27;endpoint&#x27;. Causa… Solución…</tspan></text><rect x="820" y="224" width="134" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="887" y="252.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="887" dy="0">Sí</tspan></text><rect x="10" y="284" width="950" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="485" y="308.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="485" dy="0">Envolver el error en la frontera del SDK redujo la pila de 20 a 8 líneas y añadió la acción. El costo: `from None` oculta la</tspan></text><text x="485" y="325.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="485" dy="0">causa original, útil para el usuario final pero molesta al depurar el SDK; se decide con un modo de depuración que conserve la</tspan></text><text x="485" y="342.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="485" dy="0">cadena.</tspan></text><text x="485" y="381.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Medido con CPython 3.12.9; las líneas de traceback incluyen rutas del equipo y no se reproducen aquí.</tspan></text></svg>
