<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 395" width="940" height="395" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tiempo hasta el primer éxito de un SDK nuevo</title><desc id="d">Barras con tres pasos hasta el primer éxito: crear un entorno virtual tarda 11,5 segundos en Windows y 4,8 en Linux, instalar la rueda sin red 3,3 y 0,7, y la primera llamada 0,08 y 0,02; son tres comandos y se instala también un script de consola.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="395" fill="#ffffff"/><text x="290" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">Windows: crear el entorno virtual</tspan></text><rect x="300" y="16" width="517.5" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="825.5" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="825.5" dy="0">11,5 s</tspan></text><text x="290" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">Windows: instalar la rueda (sin red)</tspan></text><rect x="300" y="60" width="148.5" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="456.5" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="456.5" dy="0">3,3 s</tspan></text><text x="290" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">Windows: primera llamada</tspan></text><rect x="300" y="104" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="312" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="312" dy="0">0,08 s</tspan></text><text x="290" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">Linux: crear el entorno virtual</tspan></text><rect x="300" y="148" width="216" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="524" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="524" dy="0">4,8 s</tspan></text><text x="290" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">Linux: instalar la rueda (sin red)</tspan></text><rect x="300" y="192" width="31.5" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="339.5" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="339.5" dy="0">0,7 s</tspan></text><text x="290" y="255.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">Linux: primera llamada</tspan></text><rect x="300" y="236" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="312" y="255.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="312" dy="0">0,02 s</tspan></text><rect x="10" y="284" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="308.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Tres comandos separan la descarga del primer resultado, y entre el 77 % y el 87 % del tiempo se va en crear el entorno, no</tspan></text><text x="470" y="325.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">en el SDK. Un SDK no controla ese costo, pero sí el número de pasos y que el primer ejemplo funcione sin configuración.</tspan></text><text x="470" y="342.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Esta medición excluye la descarga de red.</tspan></text><text x="470" y="381.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con python -m venv y pip install --no-index sobre una rueda local; una sola pasada por plataforma.</tspan></text></svg>
