lo ve</tspan></text><rect x="878.833" y="330.5" width="99.6667" height="37" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="928.667" y="353.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="928.667" dy="0">lo ve</tspan></text><text x="364" y="395" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="364" dy="0">pasa</tspan></text><rect x="402.16" y="383" width="30.5" height="14" fill="#dff1ee"/><rect x="432.16" y="383" width="30.5" height="14" fill="#c0e1e0"/><rect x="462.16" y="383" width="30.5" height="14" fill="#a2d0d2"/><rect x="492.16" y="383" width="30.5" height="14" fill="#83c0c4"/><rect x="522.16" y="383" width="30.5" height="14" fill="#64b0b6"/><rect x="552.16" y="383" width="30.5" height="14" fill="#45a0a8"/><rect x="582.16" y="383" width="30.5" height="14" fill="#278f9a"/><rect x="612.16" y="383" width="30.5" height="14" fill="#087f8c"/><text x="650.16" y="395" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="650.16" dy="0">lo ve</tspan></text><text x="695.86" y="395" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="695.86" dy="0">más oscuro = mayor (1 = lo ve)</tspan></text><rect x="10" y="411" width="980" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="500" y="435.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Las pruebas unitarias casi nunca ven un defecto de empaquetado, porque se ejecutan contra el árbol de fuentes. D4 pasó en Windows</tspan></text><text x="500" y="452.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">porque la dependencia estaba instalada en el sistema: el entorno ambiente ocultó el defecto. D3 depende del constructor: setuptools</tspan></text><text x="500" y="469.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">84.0.0 incluyó py.typed por sí solo y 68.1.2 no. Ningún detector solo cubre los siete casos.</tspan></text><text x="500" y="516.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Medido en Windows (setuptools 84.0.0, pip 24.3.1) y Linux (setuptools 68.1.2, pip 24.0).</tspan></text></svg>
