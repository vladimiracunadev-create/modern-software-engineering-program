<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 534" width="1000" height="534" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Siete defectos de empaquetado frente a tres detectores</title><desc id="d">Mapa de calor de siete defectos inyectados frente a tres detectores en dos plataformas: oscuro es que el detector lo ve. Las pruebas unitarias sobre el árbol de fuentes ven solo D4 en Linux; la inspección de la rueda ve cinco en Windows y seis en Linux (D3 solo en Linux); el humo en entorno limpio ve cinco en ambos; D3 y D6 son invisibles al humo. Contorno: celdas donde Windows y Linux difieren.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="534" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Siete defectos de empaquetado frente a tres detectores</tspan></text><text x="415.333" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="415.333" dy="0">Árbol:</tspan></text><text x="415.333" y="77" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="415.333" dy="0">Windows</tspan></text><text x="518" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="518" dy="0">Árbol: Linux</tspan></text><text x="620.667" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="620.667" dy="0">Rueda:</tspan></text><text x="620.667" y="77" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="620.667" dy="0">Windows</tspan></text><text x="723.333" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="723.333" dy="0">Rueda: Linux</tspan></text><text x="826" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="826" dy="0">Humo: Windows</tspan></text><text x="928.667" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="928.667" dy="0">Humo: Linux</tspan></text><text x="354" y="113.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="354" dy="0">D1: faltan los datos en package-data</tspan></text><text x="354" y="153.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="354" dy="0">D2: entry point con el nombre mal escrito</tspan></text><text x="354" y="193.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="354" dy="0">D3: falta py.typed</tspan></text><text x="354" y="233.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="354" dy="0">D4: dependencia usada pero no declarada</tspan></text><text x="354" y="273.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="354" dy="0">D5: requires-python mayor que el intérprete</tspan></text><text x="354" y="313.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="354" dy="0">D6: la carpeta tests/ entra en la rueda</tspan></text><text x="354" y="345" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="354" dy="0">D7: __version__ distinto de la versión del</tspan></text><text x="354" y="362" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="354" dy="0">paquete</tspan></text><rect x="365.5" y="90.5" width="99.6667" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="415.333" y="113.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="415.333" dy="0">pasa</tspan></text><rect x="468.167" y="90.5" width="99.6667" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="518" y="113.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="518" dy="0">pasa</tspan></text><rect x="570.833" y="90.5" width="99.6667" height="37" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="620.667" y="113.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="620.667" dy="0">lo ve</tspan></text><rect x="673.5" y="90.5" width="99.6667" height="37" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="723.333" y="113.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="723.333" dy="0">lo ve</tspan></text><rect x="776.167" y="90.5" width="99.6667" height="37" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="826" y="113.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="826" dy="0">lo ve</tspan></text><rect x="878.833" y="90.5" width="99.6667" height="37" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="928.667" y="113.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="928.667" dy="0">lo ve</tspan></text><rect x="365.5" y="130.5" width="99.6667" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="415.333" y="153.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="415.333" dy="0">pasa</tspan></text><rect x="468.167" y="130.5" width="99.6667" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="518" y="153.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="518" dy="0">pasa</tspan></text><rect x="570.833" y="130.5" width="99.6667" height="37" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="620.667" y="153.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="620.667" dy="0">lo ve</tspan></text><rect x="673.5" y="130.5" width="99.6667" heig