<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 619" width="970" height="619" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Siete defectos de empaquetado frente a tres detectores</title><desc id="d">Matriz de siete defectos inyectados en un paquete: las pruebas unitarias desde el árbol de fuentes pasan en todos salvo en uno en Linux; la inspección de la rueda detecta datos ausentes, entry point roto, py.typed ausente en Linux, requires-python, tests incluidos y versión distinta; la prueba de humo en un entorno limpio detecta datos, entry point, dependencia, requires-python y versión.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="619" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Defecto inyectado</tspan></text><rect x="340" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="437" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="437" dy="0">Pruebas unitarias en el</tspan></text><text x="437" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="437" dy="0">árbol</tspan></text><rect x="540" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="647" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="647" dy="0">Inspección de la rueda</tspan></text><rect x="760" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="857" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="857" dy="0">Humo en entorno limpio</tspan></text><rect x="10" y="56" width="324" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="88.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">D1: faltan los datos en package-data</tspan></text><rect x="340" y="56" width="194" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">pasan</tspan></text><rect x="540" y="56" width="214" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">falta data/rules.json</tspan></text><rect x="760" y="56" width="194" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="857" y="80.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">FileNotFoundError al</tspan></text><text x="857" y="96.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">ejecutar la CLI</tspan></text><rect x="10" y="120" width="324" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="144.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">D2: entry point con el nombre mal escrito</tspan></text><text x="172" y="160.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">(mian)</tspan></text><rect x="340" y="120" width="194" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">pasan</tspan></text><rect x="540" y="120" width="214" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">función no encontrada</tspan></text><rect x="760" y="120" width="194" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="857" y="144.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">ImportError al ejecutar</tspan></text><text x="857" y="160.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">la CLI</tspan></text><rect x="10" y="184" width="324" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="216.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">D3: falta py.typed</tspan></text><rect x="340" y="184" width="194" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">pasan</tspan></text><rect x="540" y="184" width="214" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="208.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">Linux: falta; Windows: ya</tspan></text><text x="647" y="224.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">incluido</tspan></text><rect x="760" y="184" width="194" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="857" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">ok (no se detecta)</tspan></text><rect x="10" y="248" width="324" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="280.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">D4: dependencia usada pero no declarada</tspan></text><rect x="340" y="248" width="194" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="272.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">Linux: fallan; Windows:</tspan></text><text x="437" y="288.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">pasan</tspan></text><rect x="540" y="248" width="214" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="280.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">limpia</tspan></text><rect x="760" y="248" width="194" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="857" y="280.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">ModuleNotFoundError</tspan></text><rect x="10" y="312" width="324" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="344.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">D5: requires-python mayor que el intérprete</tspan></text><rect x="340" y="312" width="194" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="344.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">pasan</tspan></text><rect x="540" y="312" width="214" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="344.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">pip rechaza construir</tspan></text><rect x="760" y="312" width="194" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="857" y="344.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">pip rechaza construir</tspan></text><rect x="10" y="376" width="324" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="408.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">D6: la carpeta tests/ entra en la rueda</tspan></text><rect x="340" y="376" width="194" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="408.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">pasan</tspan></text><rect x="540" y="376" width="214" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="408.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">tests/ en la rueda</tspan></text><rect x="760" y="376" width="194" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="857" y="408.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">ok (no se detecta)</tspan></text><rect x="10" y="440" width="324" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="464.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">D7: __version__ distinto de la versión del</tspan></text><text x="172" y="480.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">paquete</tspan></text><rect x="340" y="440" width="194" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="472.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">pasan</tspan></text><rect x="540" y="440" width="214" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="472.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">versión distinta</tspan></text><rect x="760" y="440" width="194" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="857" y="464.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">AssertionError al</tspan></text><text x="857" y="480.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">comparar</tspan></text><rect x="10" y="508" width="950" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="485" y="532.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Las pruebas unitarias casi nunca ven un defecto de empaquetado, porque se ejecutan contra el árbol de fuentes. D4 pasó en</tspan></text><text x="485" y="549.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Windows porque la dependencia estaba instalada en el sistema: el entorno ambiente ocultó el defecto. Ningún detector solo cubre</tspan></text><text x="485" y="566.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">los siete casos.</tspan></text><text x="485" y="605.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Medido en Windows (setuptools 84.0.0, pip 24.3.1) y Linux (setuptools 68.1.2, pip 24.0).</tspan></text></svg>
