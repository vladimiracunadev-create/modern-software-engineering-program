<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 498" width="940" height="498" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Compilaciones reproducibles: mismo código, mismo hash solo con las entradas fijadas</title><desc id="d">Diagrama de los SHA-256 abreviados de una rueda en Windows y en Linux: sin SOURCE_DATE_EPOCH dos construcciones con fechas de archivo distintas dan hashes distintos en ambos sistemas (d7602c9bdc1d y 61f7d211f57b en Windows; 4ea2ed489fad y 77b4ed888892 en Linux); con SOURCE_DATE_EPOCH=1700000000 cada sistema da el mismo hash dos veces (5748444b389c y 87fd805e4a0c); entre sistemas difieren porque los permisos guardados en la rueda son 0o100666 en Windows y 0o100644 en Linux.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="498" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Compilaciones reproducibles: mismo código, mismo hash solo con las entradas fijadas</tspan></text><rect x="200" y="51" width="340" height="34" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="370" y="71.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="370" dy="0">Windows (3.12.9)</tspan></text><rect x="590" y="51" width="340" height="34" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="760" y="71.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="760" dy="0">Linux (3.12.3)</tspan></text><rect x="10" y="97" width="180" height="76" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="100" y="122" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="100" dy="0">Sin</tspan></text><text x="100" y="138.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="100" dy="0">SOURCE_DATE_EPOCH,</tspan></text><text x="100" y="155.28" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="100" dy="0">fechas distintas</tspan></text><rect x="200" y="97" width="340" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="370" y="135.92" font-size="14" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="370" dy="0">d7602c9bdc1d ≠ 61f7d211f57b</tspan></text><rect x="590" y="97" width="340" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="760" y="135.92" font-size="14" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="760" dy="0">4ea2ed489fad ≠ 77b4ed888892</tspan></text><rect x="10" y="181" width="180" height="76" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="100" y="214.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="100" dy="0">Con SOURCE_DATE_EPOCH</tspan></text><text x="100" y="230.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="100" dy="0">fijada, dos veces</tspan></text><rect x="200" y="181" width="340" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="370" y="219.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="370" dy="0">5748444b389c = 5748444b389c</tspan></text><rect x="590" y="181" width="340" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="760" y="219.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="760" dy="0">87fd805e4a0c = 87fd805e4a0c</tspan></text><rect x="10" y="269" width="180" height="86" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="100" y="299" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="100" dy="0">Entre sistemas, con</tspan></text><text x="100" y="315.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="100" dy="0">la variable: la rueda</tspan></text><text x="100" y="332.28" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="100" dy="0">difiere</tspan></text><rect x="200" y="269" width="340" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="370" y="292.92" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="370" dy="0">hash 5748444b389c</tspan></text><rect x="590" y="269" width="340" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="760" y="292.92" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="760" dy="0">hash 87fd805e4a0c</tspan></text><polyline points="540,289 590,289" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="565" y="281" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="565" dy="0">≠</tspan></text><rect x="200" y="315" width="340" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="370" y="338.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="370" dy="0">permisos guardados: 0o100666</tspan></text><rect x="590" y="315" width="340" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="760" y="338.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="760" dy="0">permisos guardados: 0o100644</tspan></text><rect x="10" y="375" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="399.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La reproducibilidad exige entradas fijadas: fecha (SOURCE_DATE_EPOCH), herramientas y plataforma. La variable valía</tspan></text><text x="470" y="416.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">1700000000. Esta medición no la logró entre sistemas operativos; la evidencia de un release debe registrar dónde se</tspan></text><text x="470" y="433.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">construyó y declarar que el hash es válido para ese entorno. El hash prueba integridad, no ausencia de defectos.</tspan></text><text x="470" y="480.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11 y 3.12.3 en Ubuntu bajo WSL2; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
