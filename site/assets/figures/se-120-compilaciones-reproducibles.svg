<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 443" width="970" height="443" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Compilaciones reproducibles: mismo código, mismo hash</title><desc id="d">Tabla de cuatro comprobaciones con SHA-256 abreviados: sin SOURCE_DATE_EPOCH dos construcciones con distinta fecha de archivos dan hashes distintos en Windows y en Linux; con la variable fijada cada plataforma da el mismo hash dos veces; entre plataformas difieren, porque los permisos guardados en la rueda son 0o100666 en Windows y 0o100644 en Linux.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="443" fill="#ffffff"/><rect x="10" y="12" width="424" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="222" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="222" dy="0">Comprobación</tspan></text><rect x="440" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="572" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="572" dy="0">Windows (3.12.9)</tspan></text><rect x="710" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="832" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="832" dy="0">Linux (3.12.3)</tspan></text><rect x="10" y="56" width="424" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="82.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Construir dos veces con fechas de archivo distintas, sin</tspan></text><text x="222" y="98.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">SOURCE_DATE_EPOCH</tspan></text><rect x="440" y="56" width="264" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="90.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">d7602c9bdc1d ≠ 61f7d211f57b</tspan></text><rect x="710" y="56" width="244" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="90.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">4ea2ed489fad ≠ 77b4ed888892</tspan></text><rect x="10" y="124" width="424" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="158.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Construir dos veces con SOURCE_DATE_EPOCH=1700000000</tspan></text><rect x="440" y="124" width="264" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="158.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">5748444b389c = 5748444b389c</tspan></text><rect x="710" y="124" width="244" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="158.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">87fd805e4a0c = 87fd805e4a0c</tspan></text><rect x="10" y="192" width="424" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="218.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Comparar la rueda de Windows con la de Linux (con la</tspan></text><text x="222" y="234.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">variable)</tspan></text><rect x="440" y="192" width="264" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="226.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">5748444b389c</tspan></text><rect x="710" y="192" width="244" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="226.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">87fd805e4a0c (distinta)</tspan></text><rect x="10" y="260" width="424" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="294.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Permisos guardados en la rueda (external_attr)</tspan></text><rect x="440" y="260" width="264" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="294.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">0o100666</tspan></text><rect x="710" y="260" width="244" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="294.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">0o100644</tspan></text><rect x="10" y="332" width="950" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="485" y="356.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">La reproducibilidad exige entradas fijadas: fecha (SOURCE_DATE_EPOCH), herramientas y plataforma. Esta medición no la logró</tspan></text><text x="485" y="373.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">entre sistemas operativos; la evidencia de un release debe registrar dónde se construyó y declarar que el hash es válido para</tspan></text><text x="485" y="390.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">ese entorno. El hash prueba integridad, no ausencia de defectos.</tspan></text><text x="485" y="429.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Medido con CPython 3.12.9 en Windows 11 y 3.12.3 en Ubuntu bajo WSL2; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
