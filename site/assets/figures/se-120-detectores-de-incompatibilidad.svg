<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 550" width="940" height="550" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Doce cambios a un SDK: qué ve la comparación de API y qué ven las pruebas de contrato</title><desc id="d">Diagrama de conjuntos de doce mutantes: la comparación de superficie de API y las pruebas de contrato ven cinco a la vez (M2, M6, M9, M10 y M12); solo la comparación ve M3, M7 y el control M1; solo las pruebas ven M4 y M8; M5 solo lo ve una prueba con fixtures frescas y M11, un cambio de texto de error, no lo ve ninguno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="550" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Doce cambios a un SDK: qué ve la comparación de API y qué ven las pruebas de contrato</tspan></text><rect x="10" y="53" width="300" height="40" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="160" y="76.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="160" dy="0">Solo la comparación de API</tspan></text><rect x="10" y="101" width="300" height="216" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><rect x="20" y="107" width="280" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="160" y="128.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">M3 renombrar policy: 0 pruebas</tspan></text><rect x="20" y="149" width="280" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="160" y="170.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">M7 quitar DEFAULT_LIMIT: 0 pruebas</tspan></text><rect x="20" y="191" width="280" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="160" y="212.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">M1 opcional nuevo (control): 0</tspan></text><rect x="320" y="53" width="300" height="40" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="76.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Las dos: cinco mutantes</tspan></text><rect x="320" y="101" width="300" height="216" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><rect x="330" y="107" width="280" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="128.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">M2 renombrar limit: 1 prueba</tspan></text><rect x="330" y="149" width="280" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="170.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">M6 ParseError sin ValueError: 1</tspan></text><rect x="330" y="191" width="280" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="212.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">M9 limit None a 2 (REVISAR): 2</tspan></text><rect x="330" y="233" width="280" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="254.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">M10 policy obligatorio: 5</tspan></text><rect x="330" y="275" width="280" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="296.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">M12 choose_next privado: 1</tspan></text><rect x="630" y="53" width="300" height="40" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="780" y="76.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="780" dy="0">Solo las pruebas de contrato</tspan></text><rect x="630" y="101" width="300" height="216" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><rect x="640" y="107" width="280" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="780" y="128.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="780" dy="0">M4 desempate por id descendente: 4</tspan></text><rect x="640" y="149" width="280" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="780" y="170.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="780" dy="0">M8 tupla en vez de lista: 5</tspan></text><rect x="10" y="333" width="450" height="74" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="235" y="357" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="235" dy="0">M5 ordenar la entrada en sitio: solo lo ven las pruebas con</tspan></text><text x="235" y="373.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="235" dy="0">fixtures frescas (1 prueba); con fixtures compartidas la</tspan></text><text x="235" y="390.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="235" dy="0">lista ya estaba ordenada y falla 0</tspan></text><rect x="480" y="333" width="450" height="74" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="705" y="365.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="705" dy="0">M11 cambiar el texto del error: no lo ve ninguno (0</tspan></text><text x="705" y="381.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="705" dy="0">pruebas, sin cambio de superficie)</tspan></text><rect x="10" y="427" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Solo la comparación vio M3, M7 y el control M1; solo las pruebas vieron M4 y M8; ambas vieron cinco; ninguna vio M11 y, con</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">fixtures compartidas, tampoco M5: la primera prueba ordenó la lista y la prueba de no mutación leyó la lista ya ordenada.</tspan></text><text x="470" y="485.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">La cifra de cada mutante es cuántas pruebas de contrato fallan.</tspan></text><text x="470" y="532.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Cuentas deterministas sobre un SDK de 12 líneas; idénticas en Windows (3.12.9) y Linux (3.12.3).</tspan></text></svg>
