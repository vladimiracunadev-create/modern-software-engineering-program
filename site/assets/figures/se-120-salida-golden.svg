<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 424" width="940" height="424" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Salida de la CLI como archivo de referencia: los bytes, no el texto</title><desc id="d">Diagrama de cómo la salida de dos líneas, una con JSON con ñ, pasa de 42 a 43 bytes en Windows por defecto: base de 42 bytes con LF y UTF-8 y SHA-256 526a8c1a6a2b, más 2 bytes por dos saltos CRLF, menos 1 byte porque la ñ ocupa 1 byte en cp1252, da 43 bytes y SHA-256 86ca59242a63. Windows con reconfigure y Linux, con o sin reconfigure, dan los 42 bytes y 526a8c1a6a2b.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="424" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Salida de la CLI como archivo de referencia: los bytes, no el texto</tspan></text><rect x="10" y="55" width="190" height="96" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="105" y="98.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="105" dy="0">42 B: LF y UTF-8</tspan></text><text x="105" y="114.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="105" dy="0">SHA-256 526a8c1a6a2b</tspan></text><rect x="240" y="55" width="190" height="96" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="335" y="98.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="335" dy="0">+2 B: dos saltos CRLF</tspan></text><text x="335" y="114.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="335" dy="0">(Windows por defecto)</tspan></text><polyline points="200,103 240,103" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="470" y="55" width="190" height="96" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="565" y="90" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="565" dy="0">−1 B: la ñ ocupa 1 byte</tspan></text><text x="565" y="106.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="565" dy="0">(cp1252 en vez de</tspan></text><text x="565" y="123.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="565" dy="0">UTF-8)</tspan></text><polyline points="430,103 470,103" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="700" y="55" width="190" height="96" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="795" y="98.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="795" dy="0">43 B, 2 CRLF</tspan></text><text x="795" y="114.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="795" dy="0">SHA-256 86ca59242a63</tspan></text><polyline points="660,103 700,103" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="470" y="177" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="470" dy="0">Windows, salida por defecto: de 42 a 43 bytes</tspan></text><rect x="10" y="199" width="450" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="235" y="234.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="235" dy="0">Windows con reconfigure(newline=&#x27;\n&#x27;, encoding=&#x27;utf-8&#x27;): 42</tspan></text><text x="235" y="250.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="235" dy="0">B, 0 CRLF, SHA-256 526a8c1a6a2b; igual que Linux</tspan></text><rect x="480" y="199" width="450" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="705" y="234.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="705" dy="0">Linux, por defecto o con reconfigure: 42 B, 0 CRLF, SHA-256</tspan></text><text x="705" y="250.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="705" dy="0">526a8c1a6a2b; LF y UTF-8, sin cambios</tspan></text><rect x="10" y="301" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="325.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Comparar con un archivo de referencia (golden) sin fijar codificación y salto de línea hace que la misma prueba pase en</tspan></text><text x="470" y="342.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Linux y falle en Windows. Para la CLI de un SDK, el contrato incluye los bytes de la salida --json: se fijan en el</tspan></text><text x="470" y="359.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">programa, no en la prueba.</tspan></text><text x="470" y="406.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con CPython 3.12.9 en Windows 11 y 3.12.3 en Ubuntu bajo WSL2; los tiempos dependen del equipo y se leen como razones.</tspan></text></svg>
