<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 579" width="960" height="579" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Linter de enunciados de problema: 8 de 8 en los ejemplos, fallo en el caso nuevo</title><desc id="d">Tabla con seis enunciados: la regla detecta solución embebida, actor y consecuencia; acierta los ocho enunciados con los que se escribió y falla con vendedoras pierden pedidos, que no está en su lista de actores.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="579" fill="#ffffff"/><rect x="10" y="12" width="434" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="227" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="227" dy="0">Enunciado</tspan></text><rect x="450" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="507" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="507" dy="0">Solución</tspan></text><text x="507" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="507" dy="0">embebida</tspan></text><rect x="570" y="12" width="74" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="607" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="607" dy="0">Actor</tspan></text><rect x="650" y="12" width="104" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="702" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="702" dy="0">Consecuencia</tspan></text><rect x="760" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="852" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="852" dy="0">Resultado</tspan></text><rect x="10" y="56" width="434" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="90.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">Necesitamos un dashboard para los docentes.</tspan></text><rect x="450" y="56" width="114" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="507" y="90.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">sí</tspan></text><rect x="570" y="56" width="74" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="607" y="90.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607" dy="0">sí</tspan></text><rect x="650" y="56" width="104" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="702" y="90.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">no</tspan></text><rect x="760" y="56" width="184" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="90.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">Rechaza ✔</tspan></text><rect x="10" y="124" width="434" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="150.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">Los docentes tardan 40 minutos en corregir porque abren cada</tspan></text><text x="227" y="166.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">archivo por separado.</tspan></text><rect x="450" y="124" width="114" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="507" y="158.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">no</tspan></text><rect x="570" y="124" width="74" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="607" y="158.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607" dy="0">sí</tspan></text><rect x="650" y="124" width="104" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="702" y="158.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">sí</tspan></text><rect x="760" y="124" width="184" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="158.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">Acepta ✔</tspan></text><rect x="10" y="192" width="434" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="226.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">Los usuarios están insatisfechos.</tspan></text><rect x="450" y="192" width="114" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="507" y="226.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">no</tspan></text><rect x="570" y="192" width="74" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="607" y="226.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607" dy="0">no</tspan></text><rect x="650" y="192" width="104" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="702" y="226.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">no</tspan></text><rect x="760" y="192" width="184" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="226.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">Rechaza ✔</tspan></text><rect x="10" y="260" width="434" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="286.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">Las familias abandonan el registro en la verificación y no</tspan></text><text x="227" y="302.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">logran compartir fotos.</tspan></text><rect x="450" y="260" width="114" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="507" y="294.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">no</tspan></text><rect x="570" y="260" width="74" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="607" y="294.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607" dy="0">sí</tspan></text><rect x="650" y="260" width="104" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="702" y="294.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">sí</tspan></text><rect x="760" y="260" width="184" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="294.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">Acepta ✔</tspan></text><rect x="10" y="328" width="434" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="354.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">Los estudiantes pierden su avance si la sesión expira, sin</tspan></text><text x="227" y="370.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">poder recuperarlo. (caso nuevo)</tspan></text><rect x="450" y="328" width="114" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="507" y="362.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">no</tspan></text><rect x="570" y="328" width="74" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="607" y="362.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607" dy="0">sí</tspan></text><rect x="650" y="328" width="104" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="702" y="362.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">sí</tspan></text><rect x="760" y="328" width="184" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="362.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">Acepta ✔</tspan></text><rect x="10" y="396" width="434" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="422.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">Las vendedoras pierden pedidos cuando el teléfono se queda</tspan></text><text x="227" y="438.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">sin red. (caso nuevo)</tspan></text><rect x="450" y="396" width="114" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="507" y="430.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">no</tspan></text><rect x="570" y="396" width="74" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="607" y="430.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607" dy="0">no</tspan></text><rect x="650" y="396" width="104" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="702" y="430.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">sí</tspan></text><rect x="760" y="396" width="184" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="422.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">Rechaza ✘ (falso</tspan></text><text x="852" y="438.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">negativo)</tspan></text><rect x="10" y="468" width="940" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="492.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Las expresiones regulares se escribieron mirando los ocho primeros enunciados, por eso aciertan 8/8. Con un actor que no</tspan></text><text x="480" y="509.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">figuraba en la lista («vendedoras») la regla rechaza un buen enunciado. Un linter detecta síntomas de enunciado vago; no</tspan></text><text x="480" y="526.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">demuestra que el problema sea real.</tspan></text><text x="480" y="565.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
