<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 249" width="940" height="249" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dimensionar una oportunidad: un número frente a un rango</title><desc id="d">Gráfico de intervalos: la estimación puntual es 400 horas al mes; con rangos triangulares para usuarios, frecuencia y minutos el intervalo del 5 al 95 por ciento va de 188 a 1679 horas, mediana 628, razón 9 a 1.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="249" fill="#ffffff"/><text x="300" y="40" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Punto (12 000 × 8 % × 25 min)</tspan></text><rect x="436.667" y="24" width="4" height="24" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><line x1="436.667" y1="18" x2="436.667" y2="54" stroke="#142231" stroke-width="3"/><text x="436.667" y="68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="436.667" dy="0">400 h/mes</tspan></text><text x="432.667" y="41" font-size="12" text-anchor="end" font-weight="400" fill="#142231"><tspan x="432.667" dy="0">400</tspan></text><text x="440.667" y="41" font-size="12" text-anchor="start" font-weight="400" fill="#142231"><tspan x="440.667" dy="0">400</tspan></text><text x="300" y="94" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Intervalo p5–p95 (20 000 sorteos)</tspan></text><rect x="369.533" y="78" width="472.15" height="24" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><line x1="508.867" y1="72" x2="508.867" y2="108" stroke="#142231" stroke-width="3"/><text x="508.867" y="122" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="508.867" dy="0">mediana 628 h/mes</tspan></text><text x="365.533" y="95" font-size="12" text-anchor="end" font-weight="400" fill="#142231"><tspan x="365.533" dy="0">188</tspan></text><text x="845.683" y="95" font-size="12" text-anchor="start" font-weight="400" fill="#142231"><tspan x="845.683" dy="0">1679</tspan></text><line x1="310" y1="126" x2="880" y2="126" stroke="#8a9aa3" stroke-width="1.4"/><text x="880" y="144" font-size="12" text-anchor="end" font-weight="400" fill="#142231"><tspan x="880" dy="0">0 … 1800 horas al mes</tspan></text><rect x="10" y="154" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="178.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El mismo modelo da 400 h/mes con valores centrales y entre 188 y 1 679 h/mes al admitir que usuarios (6 000–20 000),</tspan></text><text x="470" y="195.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">frecuencia (2–25 %) y minutos (5–60) son inciertos. La razón p95/p5 es 9: la decisión no debe apoyarse en el punto.</tspan></text><text x="470" y="235.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
