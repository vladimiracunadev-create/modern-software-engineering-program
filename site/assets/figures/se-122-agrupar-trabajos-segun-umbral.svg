<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 359" width="940" height="359" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Agrupar enunciados de trabajo por similitud léxica: el umbral decide cuántos trabajos hay</title><desc id="d">Tabla con nueve enunciados de trabajo agrupados por solapamiento de palabras: con umbral Jaccard 0,20 salen cinco grupos y con 0,34 o 0,50 nueve grupos, de modo que el número de trabajos depende del umbral y no de las personas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="359" fill="#ffffff"/><rect x="10" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="82" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="82" dy="0">Umbral Jaccard</tspan></text><rect x="160" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="222" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="222" dy="0">Resultado</tspan></text><rect x="290" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="382" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="382" dy="0">Tamaños</tspan></text><rect x="480" y="12" width="444" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="702" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="702" dy="0">Lectura</tspan></text><rect x="10" y="56" width="144" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="90.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">0,20</tspan></text><rect x="160" y="56" width="124" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="90.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="222" dy="0">5 grupos</tspan></text><rect x="290" y="56" width="184" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="382" y="90.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382" dy="0">4 + 2 + 1 + 1 + 1</tspan></text><rect x="480" y="56" width="444" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="702" y="82.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">Agrupa «enviar/subir/entregar la tarea»; separa «saber si</tspan></text><text x="702" y="98.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">llegó»</tspan></text><rect x="10" y="124" width="144" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="158.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">0,34</tspan></text><rect x="160" y="124" width="124" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="158.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="222" dy="0">9 grupos</tspan></text><rect x="290" y="124" width="184" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="382" y="158.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382" dy="0">9 × 1</tspan></text><rect x="480" y="124" width="444" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="702" y="158.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">Ningún par supera el umbral: nueve «trabajos»</tspan></text><rect x="10" y="192" width="144" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="226.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">0,50</tspan></text><rect x="160" y="192" width="124" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="226.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="222" dy="0">9 grupos</tspan></text><rect x="290" y="192" width="184" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="382" y="226.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382" dy="0">9 × 1</tspan></text><rect x="480" y="192" width="444" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="702" y="218.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">Igual: la similitud léxica no ve que «entregar» y «enviar» son</tspan></text><text x="702" y="234.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">lo mismo</tspan></text><rect x="10" y="264" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="288.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Los nueve enunciados describen cuatro trabajos para una persona que los lee. La máquina entrega entre 5 y 9 según un</tspan></text><text x="470" y="305.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">parámetro arbitrario: agrupar trabajos es una decisión de investigación, no un cálculo.</tspan></text><text x="470" y="345.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
