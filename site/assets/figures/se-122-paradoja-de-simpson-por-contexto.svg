<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 351" width="920" height="351" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Paradoja de Simpson: la mejor opción cambia al separar por contexto</title><desc id="d">Tabla de tasas de tarea completada: en oficina A completa 86,7 por ciento y B 93,1; en móvil con conexión débil A 68,8 y B 73,0; agregando los dos contextos A obtiene 82,6 y B 78,0, y la conclusión se invierte.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="920" height="351" fill="#ffffff"/><rect x="10" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="132" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="132" dy="0">Contexto</tspan></text><rect x="260" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="387" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="387" dy="0">Plan A</tspan></text><rect x="520" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="647" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="647" dy="0">Plan B</tspan></text><rect x="780" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="842" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="842" dy="0">Mejor</tspan></text><rect x="10" y="56" width="244" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="86.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Oficina</tspan></text><rect x="260" y="56" width="254" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="387" y="86.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387" dy="0">234 de 270 = 86,7 %</tspan></text><rect x="520" y="56" width="254" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="86.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">81 de 87 = 93,1 %</tspan></text><rect x="780" y="56" width="124" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="86.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">B gana</tspan></text><rect x="10" y="116" width="244" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="146.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Móvil con conexión débil</tspan></text><rect x="260" y="116" width="254" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="387" y="146.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387" dy="0">55 de 80 = 68,8 %</tspan></text><rect x="520" y="116" width="254" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="146.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">192 de 263 = 73,0 %</tspan></text><rect x="780" y="116" width="124" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="146.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">B gana</tspan></text><rect x="10" y="176" width="244" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="206.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Todos juntos</tspan></text><rect x="260" y="176" width="254" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="387" y="206.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387" dy="0">289 de 350 = 82,6 %</tspan></text><rect x="520" y="176" width="254" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="206.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">273 de 350 = 78,0 %</tspan></text><rect x="780" y="176" width="124" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="206.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">A gana</tspan></text><rect x="10" y="240" width="900" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="460" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="460" dy="0">B es mejor en cada contexto y peor en el total porque cada plan se probó sobre mezclas distintas de contextos (A se usó</tspan></text><text x="460" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="460" dy="0">sobre todo en oficina, B en móvil). Cifras recicladas de un ejemplo clásico de la literatura: es un cálculo, no una</tspan></text><text x="460" y="298.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="460" dy="0">medición.</tspan></text><text x="460" y="337.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
