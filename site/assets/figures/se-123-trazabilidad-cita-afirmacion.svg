<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 530" width="940" height="530" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Verificar que cada afirmación del informe tenga citas reales y de personas distintas</title><desc id="d">Barras agrupadas con cuatro afirmaciones: A1 tiene dos citas declaradas, dos halladas y dos participantes distintos; A2 una, una y uno; A3 y A4 declaran dos citas y solo se hallan una, de un solo participante; se exigen dos participantes distintos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="530" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Verificar que cada afirmación del informe tenga citas reales y de personas distintas</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Citas declaradas</tspan></text><rect x="184.64" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="204.64" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="204.64" dy="0">Citas halladas en la transcripción</tspan></text><rect x="489" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="509" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="509" dy="0">Participantes distintos</tspan></text><line x1="63.54" y1="355" x2="920" y2="355" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="355" x2="63.54" y2="355" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="359.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">0</tspan></text><line x1="63.54" y1="225" x2="920" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="225" x2="63.54" y2="225" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="229.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">1</tspan></text><line x1="63.54" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="95" x2="63.54" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">2</tspan></text><line x1="63.54" y1="95" x2="63.54" y2="355" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="225" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 225)">Cantidad</text><rect x="84.9515" y="95" width="54.4307" height="260" rx="3" fill="#6b7c86"/><text x="112.167" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112.167" dy="0">2</tspan></text><rect x="143.382" y="95" width="54.4307" height="260" rx="3" fill="#087f8c"/><text x="170.597" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="170.597" dy="0">2</tspan></text><rect x="201.813" y="95" width="54.4307" height="260" rx="3" fill="#102a43"/><text x="229.028" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="229.028" dy="0">2</tspan></text><text x="170.597" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="170.597" dy="0">A1 Guardado automático</tspan></text><rect x="299.067" y="225" width="54.4307" height="130" rx="3" fill="#6b7c86"/><text x="326.282" y="219" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="326.282" dy="0">1</tspan></text><rect x="357.497" y="225" width="54.4307" height="130" rx="3" fill="#087f8c"/><text x="384.713" y="219" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="384.713" dy="0">1</tspan></text><rect x="415.928" y="225" width="54.4307" height="130" rx="3" fill="#102a43"/><text x="443.143" y="219" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="443.143" dy="0">1</tspan></text><text x="384.713" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="384.713" dy="0">A2 Plazos por correo</tspan></text><rect x="513.182" y="95" width="54.4307" height="260" rx="3" fill="#6b7c86"/><text x="540.397" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="540.397" dy="0">2</tspan></text><rect x="571.612" y="225" width="54.4307" height="130" rx="3" fill="#087f8c"/><text x="598.827" y="219" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="598.827" dy="0">1</tspan></text><rect x="630.043" y="225" width="54.4307" height="130" rx="3" fill="#102a43"/><text x="657.258" y="219" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="657.258" dy="0">1</tspan></text><text x="598.828" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="598.828" dy="0">A3 Plazos por compañeros</tspan></text><rect x="727.296" y="95" width="54.4307" height="260" rx="3" fill="#6b7c86"/><text x="754.512" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="754.512" dy="0">2</tspan></text><rect x="785.727" y="225" width="54.4307" height="130" rx="3" fill="#087f8c"/><text x="812.942" y="219" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="812.942" dy="0">1</tspan></text><rect x="844.158" y="225" width="54.4307" height="130" rx="3" fill="#102a43"/><text x="871.373" y="219" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="871.373" dy="0">1</tspan></text><text x="812.942" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812.942" dy="0">A4 Perdieron trabajo</tspan></text><line x1="63.54" y1="95" x2="920" y2="95" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="916" y="89" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="916" dy="0">mínimo exigido: 2 participantes</tspan></text><rect x="10" y="407" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="431.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Veredictos: A1 sostenida; A2 débil (un solo participante); A3 débil (la cita de P5 no existe en las transcripciones); A4</tspan></text><text x="470" y="448.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">débil (la cita de P3 no coincide). El script comprueba que cada cita aparezca literalmente y que haya dos participantes</tspan></text><text x="470" y="465.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">distintos; no comprueba que la cita signifique lo que la afirmación dice: eso exige leer.</tspan></text><text x="470" y="512.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
