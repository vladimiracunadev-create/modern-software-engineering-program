<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 395" width="950" height="395" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Verificar que cada afirmación del informe tenga citas reales y de personas distintas</title><desc id="d">Tabla con cuatro afirmaciones: A1 tiene dos citas verificadas de dos participantes; A2 depende de un participante; A3 cita a un participante que no existe en las transcripciones y A4 una frase que no aparece literalmente.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="395" fill="#ffffff"/><rect x="10" y="12" width="334" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="177" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="177" dy="0">Afirmación</tspan></text><rect x="350" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="412" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="412" dy="0">Citas halladas</tspan></text><rect x="480" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="572" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="572" dy="0">Participantes</tspan></text><text x="572" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="572" dy="0">distintos</tspan></text><rect x="670" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="802" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="802" dy="0">Veredicto</tspan></text><rect x="10" y="56" width="334" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="177" y="86.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177" dy="0">A1 «No confían en el guardado automático»</tspan></text><rect x="350" y="56" width="124" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="412" y="86.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412" dy="0">2 de 2</tspan></text><rect x="480" y="56" width="184" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="86.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">2 (P1, P3)</tspan></text><rect x="670" y="56" width="264" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="86.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">Sostenida</tspan></text><rect x="10" y="116" width="334" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="177" y="146.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177" dy="0">A2 «Los plazos se conocen por el correo»</tspan></text><rect x="350" y="116" width="124" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="412" y="146.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412" dy="0">1 de 1</tspan></text><rect x="480" y="116" width="184" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="146.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">1 (P2)</tspan></text><rect x="670" y="116" width="264" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="146.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">Débil: un solo participante</tspan></text><rect x="10" y="176" width="334" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="177" y="206.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177" dy="0">A3 «Los plazos llegan por compañeros»</tspan></text><rect x="350" y="176" width="124" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="412" y="206.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412" dy="0">1 de 2</tspan></text><rect x="480" y="176" width="184" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="206.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">1 (P4)</tspan></text><rect x="670" y="176" width="264" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="206.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">Débil: la cita de P5 no existe</tspan></text><rect x="10" y="236" width="334" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="177" y="266.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177" dy="0">A4 «Perdieron trabajo»</tspan></text><rect x="350" y="236" width="124" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="412" y="266.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412" dy="0">1 de 2</tspan></text><rect x="480" y="236" width="184" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="266.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">1 (P1)</tspan></text><rect x="670" y="236" width="264" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="266.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">Débil: la cita de P3 no coincide</tspan></text><rect x="10" y="300" width="930" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="475" y="324.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="475" dy="0">El script comprueba que cada cita aparezca literalmente en la transcripción y exige dos participantes distintos. No</tspan></text><text x="475" y="341.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="475" dy="0">comprueba que la cita signifique lo que la afirmación dice: eso exige leer.</tspan></text><text x="475" y="381.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
