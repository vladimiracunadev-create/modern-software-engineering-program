<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 458" width="940" height="458" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué trabajos cubre cada alternativa existente (incluida no hacer nada)</title><desc id="d">Barras horizontales con los trabajos que cubre cada alternativa de siete: la plataforma actual y el editor local cubren tres cada una, correo, hoja de cálculo y mensajería dos, y no hacer nada ninguno; el mínimo conjunto que cubre todo es correo, hoja de cálculo y editor local.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="458" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué trabajos cubre cada alternativa existente (incluida no hacer nada)</tspan></text><line x1="274" y1="49" x2="274" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="277" x2="274" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0</tspan></text><line x1="432.485" y1="49" x2="432.485" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="432.485" y1="277" x2="432.485" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="432.485" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432.485" dy="0">2</tspan></text><line x1="590.97" y1="49" x2="590.97" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="590.97" y1="277" x2="590.97" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="590.97" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="590.97" dy="0">4</tspan></text><line x1="749.455" y1="49" x2="749.455" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="749.455" y1="277" x2="749.455" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="749.455" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="749.455" dy="0">6</tspan></text><line x1="907.94" y1="49" x2="907.94" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="907.94" y1="277" x2="907.94" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="907.94" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907.94" dy="0">8</tspan></text><line x1="274" y1="277" x2="907.94" y2="277" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Plataforma actual (J1, J4, J5)</tspan></text><text x="264" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Editor local (J2, J6, J7)</tspan></text><text x="264" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Correo (J1, J5)</tspan></text><text x="264" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Hoja de cálculo (J3, J4)</tspan></text><text x="264" y="224.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Mensajería (J1, J3)</tspan></text><text x="264" y="262.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">No hacer nada</tspan></text><rect x="274" y="55" width="237.728" height="26" rx="3" fill="#087f8c"/><text x="518.727" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="518.727" dy="0">3</tspan></text><rect x="274" y="93" width="237.728" height="26" rx="3" fill="#087f8c"/><text x="518.727" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="518.727" dy="0">3</tspan></text><rect x="274" y="131" width="158.485" height="26" rx="3" fill="#087f8c"/><text x="439.485" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="439.485" dy="0">2</tspan></text><rect x="274" y="169" width="158.485" height="26" rx="3" fill="#087f8c"/><text x="439.485" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="439.485" dy="0">2</tspan></text><rect x="274" y="207" width="158.485" height="26" rx="3" fill="#087f8c"/><text x="439.485" y="224.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="439.485" dy="0">2</tspan></text><rect x="274" y="245" width="2" height="26" rx="3" fill="#087f8c"/><text x="283" y="262.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="283" dy="0">0</tspan></text><line x1="828.697" y1="49" x2="828.697" y2="277" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="833.697" y="62" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="833.697" dy="0">7 trabajos</tspan></text><text x="590.97" y="321" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="590.97" dy="0">Trabajos cubiertos de 7</tspan></text><rect x="10" y="335" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="359.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Ninguna alternativa cubre todo; el mínimo conjunto que lo hace es correo + hoja de cálculo + editor local: la persona</tspan></text><text x="470" y="376.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">usuaria ya cose tres herramientas. Esa costura, y no una lista de funciones, es el espacio donde una propuesta puede</tspan></text><text x="470" y="393.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">competir.</tspan></text><text x="470" y="440.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
