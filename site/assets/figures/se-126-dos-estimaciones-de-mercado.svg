<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 311" width="900" height="311" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dos estimaciones del mercado con rangos triangulares y 20 000 sorteos</title><desc id="d">Tabla con percentiles 5, 50 y 95 de dos estimaciones: arriba-abajo da entre 6223 y 45102 personas y abajo-arriba entre 11354 y 189593 dólares al año, con razones p95 sobre p5 de 7,2 y 16,7.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="900" height="311" fill="#ffffff"/><rect x="10" y="12" width="354" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="187" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="187" dy="0">Método</tspan></text><rect x="370" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="447" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="447" dy="0">p5</tspan></text><rect x="530" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="587" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="587" dy="0">p50</tspan></text><rect x="650" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="707" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="707" dy="0">p95</tspan></text><rect x="770" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="827" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="827" dy="0">p95 / p5</tspan></text><rect x="10" y="56" width="354" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="187" y="91.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="187" dy="0">Arriba-abajo: mercado × cuota</tspan></text><rect x="370" y="56" width="154" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="447" y="91.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">6 223 personas</tspan></text><rect x="530" y="56" width="114" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587" y="91.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587" dy="0">18 399</tspan></text><rect x="650" y="56" width="114" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="707" y="91.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">45 102</tspan></text><rect x="770" y="56" width="114" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="91.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">7,2</tspan></text><rect x="10" y="126" width="354" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="187" y="161.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="187" dy="0">Abajo-arriba: contactables × conversión × precio</tspan></text><rect x="370" y="126" width="154" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="447" y="161.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">11 354 USD/año</tspan></text><rect x="530" y="126" width="114" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587" y="161.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587" dy="0">50 773</tspan></text><rect x="650" y="126" width="114" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="707" y="161.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">189 593</tspan></text><rect x="770" y="126" width="114" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="161.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">16,7</tspan></text><rect x="10" y="200" width="880" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="450" y="224.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="450" dy="0">Las unidades son distintas (personas, dinero) y no deben compararse entre filas. Lo comparable es la anchura: el</tspan></text><text x="450" y="241.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="450" dy="0">método abajo-arriba multiplica tres incertidumbres y su rango es más ancho. El «1 % de un mercado grande» oculta justo</tspan></text><text x="450" y="258.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="450" dy="0">esa anchura.</tspan></text><text x="450" y="297.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">Rangos asumidos por el autor para ilustrar el método; no provienen de ningún mercado real.</tspan></text></svg>
