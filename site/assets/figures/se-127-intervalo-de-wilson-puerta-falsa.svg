<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 357" width="940" height="357" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Intervalo de Wilson al 95 % para una puerta falsa con 8 % de clics</title><desc id="d">Gráfico de intervalos: con 20 personas el 10 por ciento observado admite entre 2,8 y 30,1 por ciento; con 50 entre 3,2 y 18,8; con 200 entre 5,0 y 12,6 y con 1000 entre 6,5 y 9,8.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="357" fill="#ffffff"/><text x="240" y="40" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="240" dy="0">n = 20 (2 éxitos)</tspan></text><rect x="305.125" y="24" width="537.469" height="24" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><line x1="446.875" y1="18" x2="446.875" y2="54" stroke="#142231" stroke-width="3"/><text x="446.875" y="68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="446.875" dy="0">10,0 %</tspan></text><text x="301.125" y="41" font-size="12" text-anchor="end" font-weight="400" fill="#142231"><tspan x="301.125" dy="0">2.8</tspan></text><text x="846.594" y="41" font-size="12" text-anchor="start" font-weight="400" fill="#142231"><tspan x="846.594" dy="0">30.1</tspan></text><text x="240" y="94" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="240" dy="0">n = 50 (4)</tspan></text><rect x="313" y="78" width="307.125" height="24" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><line x1="407.5" y1="72" x2="407.5" y2="108" stroke="#142231" stroke-width="3"/><text x="407.5" y="122" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="407.5" dy="0">8,0 %</tspan></text><text x="309" y="95" font-size="12" text-anchor="end" font-weight="400" fill="#142231"><tspan x="309" dy="0">3.2</tspan></text><text x="624.125" y="95" font-size="12" text-anchor="start" font-weight="400" fill="#142231"><tspan x="624.125" dy="0">18.8</tspan></text><text x="240" y="148" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="240" dy="0">n = 200 (16)</tspan></text><rect x="348.438" y="132" width="149.625" height="24" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><line x1="407.5" y1="126" x2="407.5" y2="162" stroke="#142231" stroke-width="3"/><text x="407.5" y="176" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="407.5" dy="0">8,0 %</tspan></text><text x="344.438" y="149" font-size="12" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344.438" dy="0">5</tspan></text><text x="502.062" y="149" font-size="12" text-anchor="start" font-weight="400" fill="#142231"><tspan x="502.062" dy="0">12.6</tspan></text><text x="240" y="202" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="240" dy="0">n = 1 000 (80)</tspan></text><rect x="377.969" y="186" width="64.9688" height="24" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><line x1="407.5" y1="180" x2="407.5" y2="216" stroke="#142231" stroke-width="3"/><text x="407.5" y="230" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="407.5" dy="0">8,0 %</tspan></text><text x="373.969" y="203" font-size="12" text-anchor="end" font-weight="400" fill="#142231"><tspan x="373.969" dy="0">6.5</tspan></text><text x="446.938" y="203" font-size="12" text-anchor="start" font-weight="400" fill="#142231"><tspan x="446.938" dy="0">9.8</tspan></text><line x1="250" y1="234" x2="880" y2="234" stroke="#8a9aa3" stroke-width="1.4"/><text x="880" y="252" font-size="12" text-anchor="end" font-weight="400" fill="#142231"><tspan x="880" dy="0">0 … 32 % de clics</tspan></text><rect x="10" y="262" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="286.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Con 20 personas un 10 % observado es compatible con casi cualquier valor entre 3 % y 30 %: sirve para descubrir problemas,</tspan></text><text x="470" y="303.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">no para estimar demanda. El ancho se reduce con la raíz de n, no con n.</tspan></text><text x="470" y="343.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
