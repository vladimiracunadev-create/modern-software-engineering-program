<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 371" width="840" height="371" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Coste total del retraso de cuatro trabajos según el criterio de orden</title><desc id="d">Tabla con el coste de retraso acumulado de cuatro trabajos A, B, C y D: el orden WSJF D, C, A, B cuesta 119 y es el óptimo de las 24 permutaciones; más corto primero cuesta 122, mayor valor primero 126 y el peor orden 238.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="840" height="371" fill="#ffffff"/><rect x="10" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Criterio</tspan></text><rect x="390" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="487" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="487" dy="0">Orden</tspan></text><rect x="590" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="707" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="707" dy="0">Coste total de retraso</tspan></text><rect x="10" y="56" width="374" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">WSJF: coste de retraso / duración</tspan></text><rect x="390" y="56" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">D, C, A, B</tspan></text><rect x="590" y="56" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="707" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">119</tspan></text><rect x="10" y="106" width="374" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Más corto primero</tspan></text><rect x="390" y="106" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">C, D, A, B</tspan></text><rect x="590" y="106" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="707" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">122</tspan></text><rect x="10" y="156" width="374" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Mayor valor primero</tspan></text><rect x="390" y="156" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">D, A, C, B</tspan></text><rect x="590" y="156" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="707" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">126</tspan></text><rect x="10" y="206" width="374" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Peor de las 24 permutaciones</tspan></text><rect x="390" y="206" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">B, A, C, D</tspan></text><rect x="590" y="206" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="707" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">238</tspan></text><rect x="10" y="260" width="820" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="420" y="284.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="420" dy="0">Trabajos (coste de retraso por semana, duración): A (8, 3), B (3, 4), C (5, 1), D (13, 2). Priorizar por</tspan></text><text x="420" y="301.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="420" dy="0">valor solo, sin mirar duración, cuesta 6 % más que el óptimo; el peor orden cuesta el doble. Con duraciones</tspan></text><text x="420" y="318.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="420" dy="0">inciertas el óptimo también lo es.</tspan></text><text x="420" y="357.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="420" dy="0">Cálculo exacto sobre las 24 permutaciones; no depende del equipo.</tspan></text></svg>
