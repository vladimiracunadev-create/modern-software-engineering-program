<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 325" width="940" height="325" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Detector de datos personales con expresiones regulares: precisión 0,75, exhaustividad 0,50</title><desc id="d">Mapa de calor de la matriz de confusión de doce notas sintéticas: tres datos personales detectados, tres no detectados (un correo ofuscado y dos identificaciones indirectas), un código de pedido marcado como teléfono y cinco rechazos correctos; precisión 0,75 y exhaustividad 0,50.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="325" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Detector de datos personales con expresiones regulares: precisión 0,75, exhaustividad 0,50</tspan></text><text x="413" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="413" dy="0">Detectado</tspan></text><text x="751" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="751" dy="0">No detectado</tspan></text><text x="234" y="98.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="234" dy="0">Hay dato personal (6)</tspan></text><text x="234" y="142.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="234" dy="0">No hay dato personal (6)</tspan></text><rect x="245.5" y="73.5" width="335" height="41" rx="4" fill="#748698" stroke="#ffffff" stroke-width="1"/><text x="413" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="413" dy="0">3</tspan></text><rect x="583.5" y="73.5" width="335" height="41" rx="4" fill="#748698" stroke="#102a43" stroke-width="3"/><text x="751" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="751" dy="0">3</tspan></text><rect x="245.5" y="117.5" width="335" height="41" rx="4" fill="#b8c3d0" stroke="#102a43" stroke-width="3"/><text x="413" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="413" dy="0">1</tspan></text><rect x="583.5" y="117.5" width="335" height="41" rx="4" fill="#32495f" stroke="#ffffff" stroke-width="1"/><text x="751" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="751" dy="0">5</tspan></text><text x="244" y="186" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="244" dy="0">0</tspan></text><rect x="259.54" y="174" width="30.5" height="14" fill="#d9e2ec"/><rect x="289.54" y="174" width="30.5" height="14" fill="#bcc8d4"/><rect x="319.54" y="174" width="30.5" height="14" fill="#a0adbc"/><rect x="349.54" y="174" width="30.5" height="14" fill="#8393a4"/><rect x="379.54" y="174" width="30.5" height="14" fill="#66798b"/><rect x="409.54" y="174" width="30.5" height="14" fill="#495f73"/><rect x="439.54" y="174" width="30.5" height="14" fill="#2d445b"/><rect x="469.54" y="174" width="30.5" height="14" fill="#102a43"/><text x="507.54" y="186" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="507.54" dy="0">6</tspan></text><text x="523.08" y="186" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="523.08" dy="0">más oscuro = mayor (Notas)</tspan></text><rect x="10" y="202" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="226.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Aciertos 3, falso positivo 1, omisiones 3 y rechazos correctos 5 (TP 3, FP 1, FN 3, TN 5; las celdas resaltadas son los</tspan></text><text x="470" y="243.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">errores). Una revisión automática reduce el esfuerzo pero no sustituye la minimización ni la revisión humana: los</tspan></text><text x="470" y="260.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">identificadores indirectos y los textos libres escapan al patrón.</tspan></text><text x="470" y="307.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
