<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 461" width="900" height="461" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Detector de datos personales con expresiones regulares: precisión 0,75, exhaustividad 0,50</title><desc id="d">Tabla de doce notas sintéticas: el detector acierta tres de los seis datos personales, deja pasar un correo ofuscado y dos identificaciones indirectas, y marca un código de pedido como teléfono; precisión 0,75 y exhaustividad 0,50.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="900" height="461" fill="#ffffff"/><rect x="10" y="12" width="424" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="222" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="222" dy="0">Caso</tspan></text><rect x="440" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="512" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="512" dy="0">Cantidad</tspan></text><rect x="590" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="737" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="737" dy="0">Resultado</tspan></text><rect x="10" y="56" width="424" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="85.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Correo y teléfonos escritos de forma normal</tspan></text><rect x="440" y="56" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">3 de 3</tspan></text><rect x="590" y="56" width="294" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">Detectados</tspan></text><rect x="10" y="114" width="424" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="143.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">«ana punto prueba arroba ejemplo punto org»</tspan></text><rect x="440" y="114" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">0 de 1</tspan></text><rect x="590" y="114" width="294" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">No detectado</tspan></text><rect x="10" y="172" width="424" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="201.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">«trabaja en la única farmacia del pueblo»</tspan></text><rect x="440" y="172" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">0 de 1</tspan></text><rect x="590" y="172" width="294" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="193.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">No detectado (identifica sin ser un</tspan></text><text x="737" y="209.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">dato)</tspan></text><rect x="10" y="230" width="424" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="259.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">«el correo del trabajo de su cuñada»</tspan></text><rect x="440" y="230" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">0 de 1</tspan></text><rect x="590" y="230" width="294" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">No detectado</tspan></text><rect x="10" y="288" width="424" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="317.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Código de pedido «20260312-0042»</tspan></text><rect x="440" y="288" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="317.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">1 falso positivo</tspan></text><rect x="590" y="288" width="294" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="317.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">Marcado como teléfono</tspan></text><rect x="10" y="350" width="880" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="450" y="374.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="450" dy="0">Tres aciertos, un falso positivo, tres omisiones y cinco rechazos correctos (TP 3, FP 1, FN 3, TN 5). Una revisión</tspan></text><text x="450" y="391.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="450" dy="0">automática reduce el esfuerzo pero no sustituye la minimización ni la revisión humana: los identificadores indirectos</tspan></text><text x="450" y="408.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="450" dy="0">y los textos libres escapan al patrón.</tspan></text><text x="450" y="447.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
