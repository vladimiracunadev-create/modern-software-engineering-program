<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 530" width="940" height="530" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Seudonimizar con un hash sin clave no protege un espacio pequeño</title><desc id="d">Barras agrupadas con los segundos que tarda recorrer candidatos para recuperar identificadores seudonimizados con SHA-256 sin clave: 19,6 en Windows y 16,2 en Ubuntu para los diez millones de números, 1,70 y 1,31 para el primer millón; contra HMAC con clave, dos millones de candidatos no recuperan ninguno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="530" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Seudonimizar con un hash sin clave no protege un espacio pequeño</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Windows</tspan></text><rect x="116.78" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="136.78" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="136.78" dy="0">Ubuntu (WSL2)</tspan></text><line x1="71.08" y1="355" x2="920" y2="355" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="355" x2="71.08" y2="355" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="359.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="290" x2="920" y2="290" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="290" x2="71.08" y2="290" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="294.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">5</tspan></text><line x1="71.08" y1="225" x2="920" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="225" x2="71.08" y2="225" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="229.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="160" x2="920" y2="160" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="160" x2="71.08" y2="160" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="164.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">15</tspan></text><line x1="71.08" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="95" x2="71.08" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="95" x2="71.08" y2="355" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="225" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 225)">Segundos</text><rect x="113.526" y="100.2" width="167.784" height="254.8" rx="3" fill="#102a43"/><text x="197.418" y="94.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197.418" dy="0">19,60</tspan></text><rect x="285.31" y="144.4" width="167.784" height="210.6" rx="3" fill="#087f8c"/><text x="369.202" y="138.4" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="369.202" dy="0">16,20</tspan></text><text x="283.31" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="283.31" dy="0">10 M de candidatos (5 de 5 recuperados)</tspan></text><rect x="537.986" y="332.9" width="167.784" height="22.1" rx="3" fill="#102a43"/><text x="621.878" y="326.9" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="621.878" dy="0">1,70</tspan></text><rect x="709.77" y="337.97" width="167.784" height="17.03" rx="3" fill="#087f8c"/><text x="793.662" y="331.97" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="793.662" dy="0">1,31</tspan></text><text x="707.77" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707.77" dy="0">Primer millón (2 de 5 recuperados)</tspan></text><rect x="10" y="407" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="431.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Contra HMAC-SHA-256 con clave secreta, un atacante sin clave y con 2 M de candidatos recupera 0 de 5. Los tiempos cambian</tspan></text><text x="470" y="448.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">de equipo en equipo (solo un núcleo, un bucle de Python); lo que importa es el orden de magnitud: segundos. El hash simple</tspan></text><text x="470" y="465.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">solo oculta el valor si el espacio de entradas es enorme.</tspan></text><text x="470" y="512.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Tiempos medidos con CPython 3.12.9 en Windows 11 y 3.12.3 en Ubuntu (WSL2); dependen del equipo y se leen como razones.</tspan></text></svg>
