<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 357" width="900" height="357" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Seudonimizar con un hash sin clave no protege un espacio pequeño</title><desc id="d">Tabla: recorrer los diez millones de números de siete dígitos recupera los cinco identificadores seudonimizados con SHA-256 sin clave en 19,6 segundos en Windows y 16,2 en Ubuntu; contra HMAC con clave secreta, dos millones de candidatos no recuperan ninguno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="900" height="357" fill="#ffffff"/><rect x="10" y="12" width="424" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="222" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="222" dy="0">Procedimiento</tspan></text><rect x="440" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="532" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="532" dy="0">Resultado</tspan></text><rect x="630" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="687" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="687" dy="0">Windows</tspan></text><rect x="750" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="817" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="817" dy="0">Ubuntu (WSL2)</tspan></text><rect x="10" y="56" width="424" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="87.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">SHA-256 sin clave de números de 7 dígitos</tspan></text><rect x="440" y="56" width="184" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">5 de 5 recuperados</tspan></text><rect x="630" y="56" width="114" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="687" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="687" dy="0">19,6 s</tspan></text><rect x="750" y="56" width="134" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">16,2 s</tspan></text><rect x="10" y="118" width="424" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="149.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Primer millón de candidatos</tspan></text><rect x="440" y="118" width="184" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">2 de 5 recuperados</tspan></text><rect x="630" y="118" width="114" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="687" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="687" dy="0">1,70 s</tspan></text><rect x="750" y="118" width="134" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">1,31 s</tspan></text><rect x="10" y="180" width="424" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="203.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">HMAC-SHA-256 con clave secreta (atacante sin clave, 2 M de</tspan></text><text x="222" y="219.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">candidatos)</tspan></text><rect x="440" y="180" width="184" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">0 de 5</tspan></text><rect x="630" y="180" width="114" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="687" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="687" dy="0">—</tspan></text><rect x="750" y="180" width="134" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">—</tspan></text><rect x="10" y="246" width="880" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="450" y="270.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">Los tiempos cambian de equipo en equipo (solo un núcleo, un bucle de Python); lo que importa es el orden de magnitud:</tspan></text><text x="450" y="287.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">segundos. El hash simple solo oculta el valor si el espacio de entradas es enorme. Con clave, el atacante debe</tspan></text><text x="450" y="304.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">obtenerla además de adivinar el valor.</tspan></text><text x="450" y="343.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">Tiempos medidos con CPython 3.12.9 en Windows 11 y 3.12.3 en Ubuntu (WSL2); dependen del equipo y se leen como razones.</tspan></text></svg>
