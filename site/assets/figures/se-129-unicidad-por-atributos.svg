<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 379" width="1000" height="379" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Participantes únicos entre 500 al combinar atributos aparentemente inocuos</title><desc id="d">Barras con el porcentaje de 500 participantes sintéticos que son únicos según los atributos combinados: región 0 por ciento, más edad 1, más rol 19,4, más dispositivo 51,4, más idioma 64,2; con los cinco atributos generalizados en cuatro zonas y dos edades, 17,2.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="379" fill="#ffffff"/><text x="250" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">Región</tspan></text><rect x="260" y="16" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="272" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="272" dy="0">0,0 %</tspan></text><text x="250" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">+ edad</tspan></text><rect x="260" y="60" width="9" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="277" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="277" dy="0">1,0 %</tspan></text><text x="250" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">+ rol</tspan></text><rect x="260" y="104" width="174.6" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="442.6" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="442.6" dy="0">19,4 %</tspan></text><text x="250" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">+ dispositivo</tspan></text><rect x="260" y="148" width="462.6" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="730.6" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="730.6" dy="0">51,4 %</tspan></text><text x="250" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">+ idioma</tspan></text><rect x="260" y="192" width="577.8" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="845.8" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="845.8" dy="0">64,2 % únicas</tspan></text><text x="250" y="255.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">5 atributos, generalizados</tspan></text><rect x="260" y="236" width="154.8" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="422.8" y="255.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="422.8" dy="0">17,2 %</tspan></text><rect x="10" y="284" width="980" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="500" y="308.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Ningún atributo identifica a nadie por separado; cinco juntos aíslan a casi dos de cada tres personas. Generalizar (12 regiones → 4</tspan></text><text x="500" y="325.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">zonas, 6 edades → 2) baja la unicidad a 17,2 %, aún con grupos menores de cinco en el 53,8 % de los casos.</tspan></text><text x="500" y="365.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
