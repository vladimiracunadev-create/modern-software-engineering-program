<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 342" width="940" height="342" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Criterios de abandono: umbral, comparador, ventana y responsable</title><desc id="d">Mapa de calor con ocho criterios de abandono según si son medibles y si la regla los acepta: tres medibles aceptados, cinco no medibles rechazados y ninguno mal clasificado; acierta los ocho ejemplos con los que se escribió.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="342" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Criterios de abandono: umbral, comparador, ventana y responsable</tspan></text><text x="375.5" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="375.5" dy="0">La regla acepta</tspan></text><text x="738.5" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="738.5" dy="0">La regla rechaza</tspan></text><text x="184" y="98.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="184" dy="0">Medible (3)</tspan></text><text x="184" y="142.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="184" dy="0">No medible (5)</tspan></text><rect x="195.5" y="73.5" width="360" height="41" rx="4" fill="#607487" stroke="#ffffff" stroke-width="1"/><text x="375.5" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="375.5" dy="0">3</tspan></text><rect x="558.5" y="73.5" width="360" height="41" rx="4" fill="#d9e2ec" stroke="#ffffff" stroke-width="1"/><text x="738.5" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="738.5" dy="0">0</tspan></text><rect x="195.5" y="117.5" width="360" height="41" rx="4" fill="#d9e2ec" stroke="#ffffff" stroke-width="1"/><text x="375.5" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="375.5" dy="0">0</tspan></text><rect x="558.5" y="117.5" width="360" height="41" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="738.5" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="738.5" dy="0">5</tspan></text><text x="194" y="186" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="194" dy="0">0</tspan></text><rect x="209.54" y="174" width="30.5" height="14" fill="#d9e2ec"/><rect x="239.54" y="174" width="30.5" height="14" fill="#bcc8d4"/><rect x="269.54" y="174" width="30.5" height="14" fill="#a0adbc"/><rect x="299.54" y="174" width="30.5" height="14" fill="#8393a4"/><rect x="329.54" y="174" width="30.5" height="14" fill="#66798b"/><rect x="359.54" y="174" width="30.5" height="14" fill="#495f73"/><rect x="389.54" y="174" width="30.5" height="14" fill="#2d445b"/><rect x="419.54" y="174" width="30.5" height="14" fill="#102a43"/><text x="457.54" y="186" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="457.54" dy="0">5</tspan></text><text x="473.08" y="186" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="473.08" dy="0">más oscuro = mayor (Criterios)</tspan></text><rect x="10" y="202" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="226.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">3 de 3 aceptados correctamente y 5 de 5 rechazados. Un criterio medible tiene número, comparador, ventana de tiempo y</tspan></text><text x="470" y="243.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">responsable; «Si no funciona, lo dejamos» no tiene ninguno. La regla se escribió viendo estos ocho; un criterio bien</tspan></text><text x="470" y="260.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">formado puede ser absurdo («menos de 2 de 1 000 en 10 años») y la regla no lo notaría. Medible no es lo mismo que</tspan></text><text x="470" y="276.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">razonable.</tspan></text><text x="470" y="324.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
