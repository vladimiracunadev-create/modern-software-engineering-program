<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 475" width="900" height="475" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Criterios de abandono: umbral, comparador, ventana y responsable</title><desc id="d">Tabla de cinco de ocho criterios de abandono evaluados por una regla: acepta los que tienen número, comparador, ventana de tiempo y responsable y rechaza los vagos; acierta los ocho ejemplos con los que se escribió.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="900" height="475" fill="#ffffff"/><rect x="10" y="12" width="554" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="287" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="287" dy="0">Criterio</tspan></text><rect x="570" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="652" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="652" dy="0">Medible</tspan></text><rect x="740" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="812" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="812" dy="0">Resultado</tspan></text><rect x="10" y="56" width="554" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="88.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Si menos de 6 de 30 completan la tarea en 4 semanas, producto decide detener.</tspan></text><rect x="570" y="56" width="164" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">sí</tspan></text><rect x="740" y="56" width="144" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">Acepta ✔</tspan></text><rect x="10" y="120" width="554" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="152.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Si no funciona, lo dejamos.</tspan></text><rect x="570" y="120" width="164" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">no</tspan></text><rect x="740" y="120" width="144" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">Rechaza ✔</tspan></text><rect x="10" y="184" width="554" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="216.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Cancelar si la adopción es baja.</tspan></text><rect x="570" y="184" width="164" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">no</tspan></text><rect x="740" y="184" width="144" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">Rechaza ✔</tspan></text><rect x="10" y="248" width="554" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="272.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Detener si menos de 3 de 12 entrevistas confirman el problema; responsable:</tspan></text><text x="287" y="288.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">producto.</tspan></text><rect x="570" y="248" width="164" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="280.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">no (falta el plazo)</tspan></text><rect x="740" y="248" width="144" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="280.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">Rechaza ✔</tspan></text><rect x="10" y="312" width="554" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="336.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Si al cabo de 2 semanas menos del 10 % de 80 invitados agenda una demo, la</tspan></text><text x="287" y="352.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">dirección cancela.</tspan></text><rect x="570" y="312" width="164" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="344.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">sí</tspan></text><rect x="740" y="312" width="144" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="344.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">Acepta ✔</tspan></text><rect x="10" y="380" width="880" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="450" y="404.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="450" dy="0">3 de 3 aceptados correctamente y 5 de 5 rechazados. La regla se escribió viendo estos ocho; un criterio bien formado</tspan></text><text x="450" y="421.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="450" dy="0">puede ser absurdo («menos de 2 de 1 000 en 10 años») y la regla no lo notaría. Medible no es lo mismo que razonable.</tspan></text><text x="450" y="461.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
