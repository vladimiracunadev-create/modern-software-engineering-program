<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 355" width="850" height="355" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Regla de abandono definida de antemano frente a consumir todo el presupuesto</title><desc id="d">Tabla de 300 simulaciones por fila: con presupuesto fijo se consumen 300 personas siempre; con una regla que abandona si la probabilidad de superar el 10 por ciento cae bajo 5 por ciento se consumen 103 personas cuando la idea es mala y 296 cuando es buena, y se abandona una idea buena el 2 por ciento de las veces.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="850" height="355" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Política</tspan></text><rect x="340" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="412" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="412" dy="0">Realidad</tspan></text><rect x="490" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="592" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="592" dy="0">Personas consumidas</tspan></text><text x="592" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="592" dy="0">(media)</tspan></text><rect x="700" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="767" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="767" dy="0">Abandona</tspan></text><rect x="10" y="56" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="81.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Presupuesto fijo de 300</tspan></text><rect x="340" y="56" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="412" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412" dy="0">Mala (5 %)</tspan></text><rect x="490" y="56" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">300</tspan></text><rect x="700" y="56" width="134" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">100 %</tspan></text><rect x="10" y="106" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="131.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Presupuesto fijo de 300</tspan></text><rect x="340" y="106" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="412" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412" dy="0">Buena (15 %)</tspan></text><rect x="490" y="106" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">300</tspan></text><rect x="700" y="106" width="134" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">0 %</tspan></text><rect x="10" y="156" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="181.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Regla: abandonar si P(tasa &gt; 10 %) &lt; 5 %</tspan></text><rect x="340" y="156" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="412" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412" dy="0">Mala (5 %)</tspan></text><rect x="490" y="156" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">103</tspan></text><rect x="700" y="156" width="134" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">100 %</tspan></text><rect x="10" y="206" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="231.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Regla: abandonar si P(tasa &gt; 10 %) &lt; 5 %</tspan></text><rect x="340" y="206" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="412" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412" dy="0">Buena (15 %)</tspan></text><rect x="490" y="206" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">296</tspan></text><rect x="700" y="206" width="134" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">2 %</tspan></text><rect x="10" y="260" width="830" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="425" y="284.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="425" dy="0">La regla ahorra dos tercios del esfuerzo cuando la idea es mala y casi nada cuando es buena, a cambio de un 2 %</tspan></text><text x="425" y="301.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="425" dy="0">de abandonos erróneos. Ese 2 % es una decisión consciente, no un descuido: debe escribirse antes de empezar.</tspan></text><text x="425" y="341.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="425" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
