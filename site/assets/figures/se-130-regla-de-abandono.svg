<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 530" width="940" height="530" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Regla de abandono definida de antemano frente a consumir todo el presupuesto</title><desc id="d">Barras agrupadas con las personas consumidas de media en 300 simulaciones: con presupuesto fijo se consumen 300 siempre; con la regla de abandono se consumen 103 si la idea es mala y 296 si es buena, y se abandona una idea buena el 2 por ciento de las veces.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="530" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Regla de abandono definida de antemano frente a consumir todo el presupuesto</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Presupuesto fijo de 300</tspan></text><rect x="237.42" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="257.42" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="257.42" dy="0">Regla: abandonar si P(tasa &gt; 10 %) &lt; 5 %</tspan></text><line x1="78.62" y1="355" x2="920" y2="355" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="355" x2="78.62" y2="355" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="359.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="268.333" x2="920" y2="268.333" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="268.333" x2="78.62" y2="268.333" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="272.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="181.667" x2="920" y2="181.667" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="181.667" x2="78.62" y2="181.667" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="186.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">200</tspan></text><line x1="78.62" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="95" x2="78.62" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">300</tspan></text><line x1="78.62" y1="95" x2="78.62" y2="355" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="225" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 225)">Personas consumidas (media)</text><rect x="120.689" y="95" width="166.276" height="260" rx="3" fill="#6b7c86"/><text x="203.827" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="203.827" dy="0">300</tspan></text><rect x="290.965" y="265.733" width="166.276" height="89.2667" rx="3" fill="#087f8c"/><text x="374.103" y="259.733" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="374.103" dy="0">103</tspan></text><text x="288.965" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="288.965" dy="0">Idea mala (tasa real 5 %)</tspan></text><rect x="541.379" y="95" width="166.276" height="260" rx="3" fill="#6b7c86"/><text x="624.517" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="624.517" dy="0">300</tspan></text><rect x="711.655" y="98.4667" width="166.276" height="256.533" rx="3" fill="#087f8c"/><text x="794.793" y="92.4667" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="794.793" dy="0">296</tspan></text><text x="709.655" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="709.655" dy="0">Idea buena (tasa real 15 %)</tspan></text><rect x="10" y="407" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="431.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">El presupuesto fijo abandona el 100 % de las ideas malas y el 0 % de las buenas; la regla abandona el 100 % de las malas y</tspan></text><text x="470" y="448.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">el 2 % de las buenas. Ahorra dos tercios del esfuerzo cuando la idea es mala y casi nada cuando es buena, a cambio de ese 2</tspan></text><text x="470" y="465.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">% de abandonos erróneos, que debe escribirse antes de empezar.</tspan></text><text x="470" y="512.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
