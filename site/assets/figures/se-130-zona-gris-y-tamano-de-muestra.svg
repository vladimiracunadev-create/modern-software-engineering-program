<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuántas personas hacen falta para decidir entre «no éxito» (5 %) y «viable» (15 %)</title><desc id="d">Líneas en escala logarítmica horizontal con el porcentaje de 2000 simulaciones que llega a la conclusión correcta: con 30 personas se concluye no éxito el 21,4 por ciento de las veces si la tasa real es 5 y viable el 68,2 si es 15; con 120, 84,3 y 95,3; con 240, 99,2 y 99,8.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuántas personas hacen falta para decidir entre «no éxito» (5 %) y «viable» (15 %)</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Concluye «no éxito» (tasa real 5 %)</tspan></text><rect x="327.9" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="347.9" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="347.9" dy="0">Concluye «viable» (tasa real 15 %)</tspan></text><line x1="78.62" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="387" x2="78.62" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><l