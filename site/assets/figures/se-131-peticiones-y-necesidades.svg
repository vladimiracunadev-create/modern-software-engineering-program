<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 379" width="1000" height="379" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dieciséis peticiones, seis necesidades de fondo</title><desc id="d">Barras con el número de peticiones por necesidad de fondo: exportar, seguimiento docente, accesibilidad visual, recordar fechas y no perder el trabajo tienen tres peticiones cada una y ayuda humana una; en total 16 peticiones, 6 necesidades.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="379" fill="#ffffff"/><text x="280" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="280" dy="0">Exportar (3 peticiones)</tspan></text><rect x="290" y="16" width="360" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="658" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="658" dy="0">N1 · 3</tspan></text><text x="280" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="280" dy="0">Seguimiento docente (3)</tspan></text><rect x="290" y="60" width="360" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="658" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="658" dy="0">N2 · 3</tspan></text><text x="280" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="280" dy="0">Accesibilidad visual (3)</tspan></text><rect x="290" y="104" width="360" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="658" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="658" dy="0">N3 · 3</tspan></text><text x="280" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="280" dy="0">Recordar fechas (3)</tspan></text><rect x="290" y="148" width="360" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="658" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="658" dy="0">N4 · 3</tspan></text><text x="280" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="280" dy="0">Ayuda humana (1)</tspan></text><rect x="290" y="192" width="120" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="418" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="418" dy="0">N5 · 1</tspan></text><text x="280" y="255.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="280" dy="0">No perder el trabajo (3)</tspan></text><rect x="290" y="236" width="360" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="658" y="255.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="658" dy="0">N6 · 3</tspan></text><rect x="10" y="284" width="980" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="500" y="308.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">Razón 2,67 peticiones por necesidad. La entropía baja de 4,00 bits (16 peticiones distintas) a 2,51 bits (6 necesidades). Agrupar</tspan></text><text x="500" y="325.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">peticiones en necesidades es juicio del investigador, hecho aquí por una persona; otra persona podría separar N2 en dos.</tspan></text><text x="500" y="365.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Peticiones sintéticas agrupadas a mano; el cálculo de razón y entropía es determinista.</tspan></text></svg>
