<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 530" width="940" height="530" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Clasificar preguntas de entrevista (guiada / pasado / otra) con reglas léxicas</title><desc id="d">Barras agrupadas con las preguntas clasificadas: la regla léxica acierta las 18 preguntas con las que se escribió y solo 3 de 6 preguntas nuevas; por ejemplo no reconoce «¿Recomendarías esta herramienta a un colega?» como guiada.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="530" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Clasificar preguntas de entrevista (guiada / pasado / otra) con reglas léxicas</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Preguntas</tspan></text><rect x="131.86" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="151.86" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="151.86" dy="0">Acertadas</tspan></text><line x1="71.08" y1="355" x2="920" y2="355" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="355" x2="71.08" y2="355" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="359.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="290" x2="920" y2="290" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="290" x2="71.08" y2="290" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="294.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">5</tspan></text><line x1="71.08" y1="225" x2="920" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="225" x2="71.08" y2="225" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="229.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="160" x2="920" y2="160" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="160" x2="71.08" y2="160" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="164.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">15</tspan></text><line x1="71.08" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="95" x2="71.08" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="95" x2="71.08" y2="355" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="225" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 225)">Preguntas</text><rect x="113.526" y="121" width="167.784" height="234" rx="3" fill="#6b7c86"/><text x="197.418" y="115" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197.418" dy="0">18</tspan></text><rect x="285.31" y="121" width="167.784" height="234" rx="3" fill="#087f8c"/><text x="369.202" y="115" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="369.202" dy="0">18</tspan></text><text x="283.31" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="283.31" dy="0">Preguntas con las que se escribió la regla</tspan></text><rect x="537.986" y="277" width="167.784" height="78" rx="3" fill="#6b7c86"/><text x="621.878" y="271" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="621.878" dy="0">6</tspan></text><rect x="709.77" y="316" width="167.784" height="39" rx="3" fill="#087f8c"/><text x="793.662" y="310" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="793.662" dy="0">3</tspan></text><text x="707.77" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707.77" dy="0">Preguntas nuevas</tspan></text><rect x="10" y="407" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="431.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Exactitud 100 % con las 18 preguntas de ajuste y 50 % con las 6 nuevas. Con 18 ejemplos el 100 % no significa nada: la</tspan></text><text x="470" y="448.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">regla se ajustó a ellos. Tampoco reconoce «Mostrame cómo entregas una tarea» como pregunta sobre comportamiento pasado. Una</tspan></text><text x="470" y="465.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">lista de palabras no sustituye el juicio; sirve como revisión previa, no como árbitro.</tspan></text><text x="470" y="512.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
