<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 279" width="900" height="279" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Clasificar preguntas de entrevista (guiada / pasado / otra) con reglas léxicas</title><desc id="d">Tabla: la regla léxica clasifica bien las 18 preguntas con las que se escribió y solo 3 de 6 preguntas nuevas; por ejemplo no reconoce «¿Recomendarías esta herramienta a un colega?» como guiada ni «Mostrame cómo entregas una tarea» como pregunta sobre comportamiento pasado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="900" height="279" fill="#ffffff"/><rect x="10" y="12" width="434" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="227" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="227" dy="0">Conjunto</tspan></text><rect x="450" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="517" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="517" dy="0">Preguntas</tspan></text><rect x="590" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="657" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="657" dy="0">Acertadas</tspan></text><rect x="730" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="807" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="807" dy="0">Exactitud</tspan></text><rect x="10" y="56" width="434" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="83.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">Preguntas con las que se escribió la regla</tspan></text><rect x="450" y="56" width="134" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="517" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517" dy="0">18</tspan></text><rect x="590" y="56" width="134" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="657" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="657" dy="0">18</tspan></text><rect x="730" y="56" width="154" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">100 %</tspan></text><rect x="10" y="110" width="434" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="137.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">Preguntas nuevas (6)</tspan></text><rect x="450" y="110" width="134" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="517" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517" dy="0">6</tspan></text><rect x="590" y="110" width="134" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="657" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="657" dy="0">3</tspan></text><rect x="730" y="110" width="154" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">50 %</tspan></text><rect x="10" y="168" width="880" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="450" y="192.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">Con 18 ejemplos el 100 % no significa nada: la regla se ajustó a ellos. Con seis preguntas nuevas baja al 50 %. Una</tspan></text><text x="450" y="209.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">lista de palabras no sustituye el juicio sobre qué pregunta evita sugerir la respuesta; sirve como revisión previa, no</tspan></text><text x="450" y="226.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">como árbitro.</tspan></text><text x="450" y="265.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
