<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 585" width="920" height="585" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Validador de brief: 10 de 12 mutaciones detectadas</title><desc id="d">Tabla de mutaciones aplicadas a un brief válido: el validador detecta diez de doce, entre ellas evidencia ausente, cita inexistente, un solo participante, decisión sin responsable y dato personal, pero no detecta un número alterado ni una afirmación exagerada.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="920" height="585" fill="#ffffff"/><rect x="10" y="12" width="614" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="317" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="317" dy="0">Mutación del brief</tspan></text><rect x="630" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="767" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="767" dy="0">Resultado del validador</tspan></text><rect x="10" y="56" width="614" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="317" y="79.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="317" dy="0">Quitar toda la evidencia de una afirmación</tspan></text><rect x="630" y="56" width="274" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="79.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">Detectada</tspan></text><rect x="10" y="102" width="614" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="317" y="125.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="317" dy="0">Citar una evidencia que no existe</tspan></text><rect x="630" y="102" width="274" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="125.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">Detectada</tspan></text><rect x="10" y="148" width="614" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="317" y="171.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="317" dy="0">Afirmación respaldada por un solo participante</tspan></text><rect x="630" y="148" width="274" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="171.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">Detectada</tspan></text><rect x="10" y="194" width="614" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="317" y="217.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="317" dy="0">Afirmación respaldada solo por lo que dijeron</tspan></text><rect x="630" y="194" width="274" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="217.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">Detectada</tspan></text><rect x="10" y="240" width="614" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="317" y="263.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="317" dy="0">Decisión sin responsable / sin fecha</tspan></text><rect x="630" y="240" width="274" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="263.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">Detectadas (2)</tspan></text><rect x="10" y="286" width="614" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="317" y="309.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="317" dy="0">Criterio de abandono vago</tspan></text><rect x="630" y="286" width="274" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="309.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">Detectada</tspan></text><rect x="10" y="332" width="614" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="317" y="355.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="317" dy="0">Sin límites declarados · correo en la evidencia · problema como solución</tspan></text><rect x="630" y="332" width="274" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="355.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">Detectadas (3)</tspan></text><rect x="10" y="378" width="614" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="317" y="401.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="317" dy="0">Cambiar «42 tickets» por «420» sin tocar la afirmación</tspan></text><rect x="630" y="378" width="274" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="401.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">NO detectada</tspan></text><rect x="10" y="424" width="614" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="317" y="447.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="317" dy="0">Cambiar «una vez por semana» por «siempre»</tspan></text><rect x="630" y="424" width="274" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="447.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">NO detectada</tspan></text><rect x="10" y="474" width="900" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="460" y="498.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">Lo que el validador no ve es semántico: que los números coincidan con la fuente y que la afirmación no exagere. Esas dos</tspan></text><text x="460" y="515.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">comprobaciones requieren revisión humana o una comparación explícita de cifras. Un brief que pasa el validador no es,</tspan></text><text x="460" y="532.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">por eso, verdadero.</tspan></text><text x="460" y="571.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
