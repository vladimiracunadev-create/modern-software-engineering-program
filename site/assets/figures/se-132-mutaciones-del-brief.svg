"400" fill="#142231"><tspan x="314" dy="0">solución</tspan></text><text x="314" y="411.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Cambiar «42 tickets» por «420»</tspan></text><text x="314" y="447" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Cambiar «una vez por semana» por</tspan></text><text x="314" y="464" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">«siempre»</tspan></text><rect x="324" y="84" width="183.9" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="415.95" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="415.95" dy="0">1</tspan></text><rect x="507.9" y="84" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="514.9" y="103.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="514.9" dy="0">1</tspan></text><rect x="324" y="128" width="183.9" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="415.95" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="415.95" dy="0">1</tspan></text><rect x="507.9" y="128" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="514.9" y="147.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="514.9" dy="0">1</tspan></text><rect x="324" y="172" width="183.9" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="415.95" y="191.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="415.95" dy="0">1</tspan></text><rect x="507.9" y="172" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="514.9" y="191.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="514.9" dy="0">1</tspan></text><rect x="324" y="216" width="183.9" height="30" fill="#087f8c" stroke="#ffffff" s