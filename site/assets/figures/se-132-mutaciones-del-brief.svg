5.95" y="411.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="415.95" dy="0">1</tspan></text><text x="514.9" y="411.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="514.9" dy="0">1</tspan></text><rect x="324" y="436" width="0" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="324" y="436" width="183.9" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="415.95" y="455.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="415.95" dy="0">1</tspan></text><text x="514.9" y="455.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="514.9" dy="0">1</tspan></text><text x="599.85" y="517" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="599.85" dy="0">Mutaciones</tspan></text><rect x="10" y="531" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="555.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Lo que el validador no ve es semántico: que los números coincidan con la fuente y que la afirmación no exagere. Esas dos</tspan></text><text x="470" y="572.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">comprobaciones requieren revisión humana o una comparación explícita de cifras. Un brief que pasa el validador no es, por</tspan></text><text x="470" y="589.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">eso, verdadero.</tspan></text><text x="470" y="636.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
