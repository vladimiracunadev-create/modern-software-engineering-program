<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 395" width="940" height="395" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuánto del ingreso concentran los mayores clientes entre 120 centros</title><desc id="d">Barras con la parte del ingreso mensual de los mayores clientes: con dispersión baja el mayor cliente aporta 3,1 por ciento y los diez mayores 19,2; con dispersión alta el mayor aporta 13,1 por ciento y los diez mayores 45,8.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="395" fill="#ffffff"/><text x="300" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Dispersión baja: mayor cliente</tspan></text><rect x="310" y="16" width="20.15" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="338.15" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="338.15" dy="0">3,1 %</tspan></text><text x="300" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Dispersión baja: 5 mayores</tspan></text><rect x="310" y="60" width="74.75" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="392.75" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="392.75" dy="0">11,5 %</tspan></text><text x="300" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Dispersión baja: 10 mayores</tspan></text><rect x="310" y="104" width="124.8" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="442.8" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="442.8" dy="0">19,2 %</tspan></text><text x="300" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Dispersión alta: mayor cliente</tspan></text><rect x="310" y="148" width="85.15" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="403.15" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="403.15" dy="0">13,1 %</tspan></text><text x="300" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Dispersión alta: 5 mayores</tspan></text><rect x="310" y="192" width="217.75" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="535.75" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="535.75" dy="0">33,5 %</tspan></text><text x="300" y="255.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Dispersión alta: 10 mayores</tspan></text><rect x="310" y="236" width="297.7" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="615.7" y="255.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="615.7" dy="0">45,8 %</tspan></text><rect x="10" y="284" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="308.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Índice de concentración (HHI): 105 con dispersión baja y 352 con alta. Perder al mayor cliente baja el margen mensual 4,3 %</tspan></text><text x="470" y="325.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">en el primer caso (31 541 a 30 190) y 15,6 % en el segundo (62 380 a 52 656). Con ingreso total casi el doble, el negocio</tspan></text><text x="470" y="342.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">es más frágil.</tspan></text><text x="470" y="381.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
