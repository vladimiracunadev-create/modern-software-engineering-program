<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 495" width="880" height="495" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres modelos de precio sobre los mismos centros: cuándo se equilibra la caja</title><desc id="d">Tabla de seis simulaciones de 36 meses con seis centros nuevos por mes: el precio por alumno equilibra la operación en el mes 4 o 5 y acumula más de 750 000 unidades; el precio plano equilibra en el mes 15 o 22 y con abandono de 5 por ciento no recupera la caja en 36 meses; el gratuito con 10 por ciento de conversión nunca la equilibra y con 52 por ciento tarda 14 meses.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="880" height="495" fill="#ffffff"/><rect x="10" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="157" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="157" dy="0">Modelo de precio</tspan></text><rect x="310" y="12" width="104" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="362" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="362" dy="0">Abandono</tspan></text><text x="362" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="362" dy="0">mensual</tspan></text><rect x="420" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="502" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="502" dy="0">Mes en que el flujo</tspan></text><text x="502" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="502" dy="0">mensual es positivo</tspan></text><rect x="590" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="652" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="652" dy="0">Caja mínima</tspan></text><rect x="720" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="792" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="792" dy="0">Caja al mes 36</tspan></text><rect x="10" y="56" width="294" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="83.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Por alumno (1,5 por alumno y mes)</tspan></text><rect x="310" y="56" width="104" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="83.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">2 %</tspan></text><rect x="420" y="56" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="83.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">4</tspan></text><rect x="590" y="56" width="124" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="83.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">−17 516</tspan></text><rect x="720" y="56" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="83.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">+1 287 537</tspan></text><rect x="10" y="110" width="294" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="137.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Por alumno (1,5 por alumno y mes)</tspan></text><rect x="310" y="110" width="104" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="137.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">5 %</tspan></text><rect x="420" y="110" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="137.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">5</tspan></text><rect x="590" y="110" width="124" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="137.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">−21 094</tspan></text><rect x="720" y="110" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="137.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">+755 245</tspan></text><rect x="10" y="164" width="294" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="191.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Plano por centro (600 al mes)</tspan></text><rect x="310" y="164" width="104" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">2 %</tspan></text><rect x="420" y="164" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">15</tspan></text><rect x="590" y="164" width="124" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">−70 760</tspan></text><rect x="720" y="164" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">+21 759</tspan></text><rect x="10" y="218" width="294" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="245.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Plano por centro (600 al mes)</tspan></text><rect x="310" y="218" width="104" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="245.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">5 %</tspan></text><rect x="420" y="218" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="245.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">22</tspan></text><rect x="590" y="218" width="124" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="245.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">−102 685</tspan></text><rect x="720" y="218" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="245.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">−61 514</tspan></text><rect x="10" y="272" width="294" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="299.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Gratuito con 10 % de conversión (900)</tspan></text><rect x="310" y="272" width="104" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="299.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">3 %</tspan></text><rect x="420" y="272" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="299.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">nunca</tspan></text><rect x="590" y="272" width="124" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="299.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">−657 924</tspan></text><rect x="720" y="272" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="299.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">−657 924</tspan></text><rect x="10" y="326" width="294" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="353.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Gratuito con 52 % de conversión (900)</tspan></text><rect x="310" y="326" width="104" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="353.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">3 %</tspan></text><rect x="420" y="326" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="353.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">14</tspan></text><rect x="590" y="326" width="124" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="353.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">−79 085</tspan></text><rect x="720" y="326" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="353.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">+30 208</tspan></text><rect x="10" y="384" width="860" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="440" y="408.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="440" dy="0">Mismos centros (150–1 500 alumnos, moda 400), mismos costos (0,6 por alumno, 50 por centro, 12 000 fijos al mes).</tspan></text><text x="440" y="425.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="440" dy="0">Cambia solo cómo se cobra: el precio plano deja de cubrir a los centros grandes y el gratuito paga el servicio de</tspan></text><text x="440" y="442.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="440" dy="0">todos con la conversión de unos pocos. Unidades monetarias ficticias.</tspan></text><text x="440" y="481.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="440" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
