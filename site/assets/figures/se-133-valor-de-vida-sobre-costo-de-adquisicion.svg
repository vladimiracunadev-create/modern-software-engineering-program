<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 265" width="940" height="265" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Valor de vida del centro sobre costo de adquirirlo: un punto o un rango</title><desc id="d">Gráfico de intervalos: con valores centrales la razón entre valor de vida y costo de adquisición es 11,5; con rangos triangulares para tamaño, precio, costos, abandono y adquisición el intervalo del 5 al 95 por ciento va de 1,15 a 50,3 y la mediana es 11,0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="265" fill="#ffffff"/><text x="345" y="40" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="345" dy="0">Punto (valores centrales)</tspan></text><rect x="464.582" y="24" width="4" height="24" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><line x1="464.582" y1="18" x2="464.582" y2="54" stroke="#142231" stroke-width="3"/><text x="464.582" y="68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="464.582" dy="0">11,5 veces</tspan></text><text x="460.582" y="41" font-size="12" text-anchor="end" font-weight="400" fill="#142231"><tspan x="460.582" dy="0">11.48</tspan></text><text x="468.582" y="41" font-size="12" text-anchor="start" font-weight="400" fill="#142231"><tspan x="468.582" dy="0">11.48</tspan></text><text x="345" y="94" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="345" dy="0">Intervalo p5–p95 (20 000 sorteos)</tspan></text><rect x="365.977" y="78" width="468.777" height="24" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><line x1="459.618" y1="72" x2="459.618" y2="108" stroke="#142231" stroke-width="3"/><text x="459.618" y="122" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="459.618" dy="0">mediana 11,0 veces</tspan></text><text x="361.977" y="95" font-size="12" text-anchor="end" font-weight="400" fill="#142231"><tspan x="361.977" dy="0">1.15</tspan></text><text x="838.755" y="95" font-size="12" text-anchor="start" font-weight="400" fill="#142231"><tspan x="838.755" dy="0">50.26</tspan></text><line x1="355" y1="126" x2="880" y2="126" stroke="#8a9aa3" stroke-width="1.4"/><text x="880" y="144" font-size="12" text-anchor="end" font-weight="400" fill="#142231"><tspan x="880" dy="0">0 … 55 veces</tspan></text><rect x="10" y="154" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="178.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La probabilidad de que un centro no recupere su costo de adquisición (razón menor que 1) es 4,4 %; de que no llegue a 3</tspan></text><text x="470" y="195.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">veces, 12,8 %; y en 1,9 % de los sorteos el margen mensual del centro ya es negativo. Una razón de 11,5 «sobra» solo si los</tspan></text><text x="470" y="212.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">rangos son correctos.</tspan></text><text x="470" y="251.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
