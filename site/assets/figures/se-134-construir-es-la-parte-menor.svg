<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" width="900" height="395" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Costo a cinco años: construir es la parte menor</title><desc id="d">Tabla: con valores centrales el costo de cinco años es 655 mil unidades y construir pesa 30,5 por ciento; en 20 000 sorteos la mediana del total es 845 mil, el intervalo del 5 al 95 por ciento va de 609 a 1136 y construir pesa entre 20,7 y 36,2 por ciento; nunca pesa más de la mitad.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="900" height="395" fill="#ffffff"/><rect x="10" y="12" width="414" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="217" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="217" dy="0">Estimación</tspan></text><rect x="430" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="542" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="542" dy="0">Costo total a 5 años</tspan></text><text x="542" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="542" dy="0">(miles)</tspan></text><rect x="660" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="772" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="772" dy="0">Construcción sobre el</tspan></text><text x="772" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="772" dy="0">total</tspan></text><rect x="10" y="56" width="414" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Punto (valores centrales)</tspan></text><rect x="430" y="56" width="224" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="84.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">655</tspan></text><rect x="660" y="56" width="224" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="84.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">30,5 %</tspan></text><rect x="10" y="112" width="414" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="140.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Mediana de 20 000 sorteos</tspan></text><rect x="430" y="112" width="224" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="140.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">845</tspan></text><rect x="660" y="112" width="224" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="140.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">28,0 %</tspan></text><rect x="10" y="168" width="414" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="196.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Intervalo p5–p95</tspan></text><rect x="430" y="168" width="224" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="196.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">609 a 1 136</tspan></text><rect x="660" y="168" width="224" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="196.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">20,7 % a 36,2 %</tspan></text><rect x="10" y="224" width="414" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="252.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Sorteos en que construir pesa más de la mitad</tspan></text><rect x="430" y="224" width="224" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="252.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">0 de 20 000</tspan></text><rect x="660" y="224" width="224" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="252.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">—</tspan></text><rect x="10" y="284" width="880" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="450" y="308.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="450" dy="0">Construcción 120–400 (moda 200), mantenimiento 10–30 % de la construcción al año, infraestructura 10–60 y soporte</tspan></text><text x="450" y="325.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="450" dy="0">15–90 al año. El punto subestima la mediana en 190 mil porque los rangos de operación son asimétricos hacia arriba: el</tspan></text><text x="450" y="342.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="450" dy="0">costo que más se omite en la propuesta es el que más pesa.</tspan></text><text x="450" y="381.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
