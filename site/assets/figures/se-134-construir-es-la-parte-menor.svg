<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 406" width="940" height="406" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Costo total a cinco años: el valor central frente a 20 000 sorteos (miles)</title><desc id="d">Intervalos con el costo total a cinco años: el valor central da 655 mil; en 20 000 sorteos el percentil 5 es 609 mil, la mediana 845 mil y el percentil 95 1 136 mil. Construir pesa 30,5 por ciento en el punto y entre 20,7 y 36,2 en el intervalo, y en ningún sorteo supera la mitad.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="406" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Costo total a cinco años: el valor central frente a 20 000 sorteos (miles)</tspan></text><rect x="16" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">p5</tspan></text><polygon points="85.08,44.1 91.68,56.4 78.48,56.4" fill="#946512" stroke="#946512" stroke-width="2"/><text x="99.08" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="99.08" dy="0">mediana</tspan></text><polygon points="185.86,43.5 193.36,51 185.86,58.5 178.36,51" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="199.86" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="199.86" dy="0">p95</tspan></text><line x1="294" y1="77" x2="294" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="225" x