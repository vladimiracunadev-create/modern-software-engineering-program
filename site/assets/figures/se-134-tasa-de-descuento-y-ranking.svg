5" y="332.55" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="693.155" dy="0">2,3</tspan></text><rect x="886.5" y="339.35" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="368.85" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">−21,9</tspan></text><text x="415.119" y="173.8" font-size="13" text-anchor="start" font-weight="400" fill="#5c1f14" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="415.119" dy="0">Cruce en 12,97 %: empatan</tspan></text><line x1="359.279" y1="219.4" x2="407.119" y2="168.8" stroke="#5c1f14" stroke-width="1.2"/><rect x="10" y="447" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El cruce está en 12,97 % anual. Quien descuenta alto (capital escaso, incertidumbre) prefiere lo que rinde antes. La tasa</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">es un juicio sobre el costo de oportunidad, no un dato: se declara y se prueba el cruce.</tspan></text><text x="470" y="536.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Cálculo determinista; cifras en unidades monetarias ficticias.</tspan></text></svg>
