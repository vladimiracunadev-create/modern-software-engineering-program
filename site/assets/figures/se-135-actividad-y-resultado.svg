<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 219" width="940" height="219" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Correlación de rango con el resultado en 300 equipos sintéticos</title><desc id="d">Barras con la correlación de Spearman: la actividad medida como producción se asocia con el resultado en 0,20; la calidad subyacente, en 0,90.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="219" fill="#ffffff"/><text x="330" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Actividad (producción) con resultado</tspan></text><rect x="340" y="16" width="80" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="428" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="428" dy="0">0,20</tspan></text><text x="330" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Calidad con resultado</tspan></text><rect x="340" y="60" width="360" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="708" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="708" dy="0">0,90</tspan></text><rect x="10" y="108" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="132.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El decil de equipos con más producción tiene resultado medio 1,32 frente a 0,23 de la población: hay algo de señal, pero se</tspan></text><text x="470" y="149.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">fabrica con la parte de la producción que sí depende de la calidad (peso 2 de 12 en el generador). Premiar la producción</tspan></text><text x="470" y="166.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">mueve sobre todo la actividad pura, que no aporta resultado.</tspan></text><text x="470" y="205.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
