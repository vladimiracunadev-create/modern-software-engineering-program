2" dy="0">10</tspan></text><rect x="100" y="152" width="214" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="176.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="207" dy="0">2 955</tspan></text><rect x="320" y="152" width="194" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="417" y="176.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="417" dy="0">1 405</tspan></text><rect x="520" y="152" width="394" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="176.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">pico de activos</tspan></text><rect x="10" y="200" width="84" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="52" y="224.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="52" dy="0">12</tspan></text><rect x="100" y="200" width="214" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="224.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="207" dy="0">3 330</tspan></text><rect x="320" y="200" width="194" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="417" y="224.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="417" dy="0">1 324</tspan></text><rect x="520" y="200" width="394" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="224.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">los activos ya caen</tspan></text><rect x="10" y="248" width="84" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="52" y="272.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="52" dy="0">15</tspan></text><rect x="100" y="248" width