 fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="368.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="207" dy="0">3 555</tspan></text><rect x="320" y="344" width="194" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="417" y="368.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="417" dy="0">226</tspan></text><rect x="520" y="344" width="394" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="368.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">dos años: 3 555 registros, 226 activos</tspan></text><rect x="10" y="396" width="910" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="420.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">Altas de 300 al mes hasta el mes 9 y luego decrecientes; 85 % de los activos permanece cada mes. Una métrica acumulada</tspan></text><text x="465" y="437.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">solo puede subir: no puede avisar de que el producto se vacía.</tspan></text><text x="465" y="477.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
