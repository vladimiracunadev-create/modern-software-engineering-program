<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 386" width="940" height="386" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Premiar lo cerrado: el número sube y lo resuelto baja (diez agentes, doce semanas)</title><desc id="d">Barras agrupadas con los tickets cerrados y los resueltos sin reabrir según la meta: con la meta de tickets cerrados se cierran 760 y se resuelven 512 y se reabre el 41,2 por ciento; con la meta de resueltos sin reabrir se cierran 600 y se resuelven 560 y se reabre el 5,7 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="386" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Premiar lo cerrado: el número sube y lo resuelto baja (diez agentes, doce semanas)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Cerrados</tspan></text><rect x="124.32" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="144.32" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="144.32" dy="0">Resueltos (no reabiertos)</tspan></text><line x1="324" y1="77" x2="324" y2="205" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="205" x2="324" y2="210" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="226" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="465.955" y1="77" x2="465.955" y2="205" stroke="#d5dde1" stroke-width="1"/><line x1="465.955" y1="205" x2="465.955" y2="210" stroke="#5b7280" stroke-width="1.4"/><text x="465.955" y="226" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="465.955" dy="0">200</tspan></text><line x1="607.91" y1="77" x2="607.91" y2="205" stroke="#d5dde1" stroke-width="1"/><line x1="607.91" y1="205" x2="607.91" y2="210" stroke="#5b7280" stroke-width="1.4"/><text x="607.91" y="226" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607.91" dy="0">400</tspan></text><line x1="749.865" y1="77" x2="749.865" y2="205" stroke="#d5dde1" stroke-width="1"/><line x1="749.865" y1="205" x2="749.865" y2="210" stroke="#5b7280" stroke-width="1.4"/><text x="749.865" y="226" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="749.865" dy="0">600</tspan></text><line x1="891.82" y1="77" x2="891.82" y2="205" stroke="#d5dde1" stroke-width="1"/><line x1="891.82" y1="205" x2="891.82" y2="210" stroke="#5b7280" stroke-width="1.4"/><text x="891.82" y="226" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="891.82" dy="0">800</tspan></text><line x1="324" y1="205" x2="891.82" y2="205" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="105" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Meta «tickets cerrados» (41,2 %</tspan></text><text x="314" y="122" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">reabiertos)</tspan></text><text x="314" y="169" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Meta «resueltos sin reabrir» (5,7 %</tspan></text><text x="314" y="186" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">reabiertos)</tspan></text><rect x="324" y="83" width="539.429" height="24.5" rx="3" fill="#946512"/><text x="870.429" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="870.429" dy="0">760</tspan></text><rect x="324" y="110.5" width="363.405" height="24.5" rx="3" fill="#087f8c"/><text x="694.405" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="694.405" dy="0">512</tspan></text><rect x="324" y="147" width="425.865" height="24.5" rx="3" fill="#946512"/><text x="756.865" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="756.865" dy="0">600</tspan></text><rect x="324" y="174.5" width="397.474" height="24.5" rx="3" fill="#087f8c"/><text x="728.474" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="728.474" dy="0">560</tspan></text><text x="607.91" y="249" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="607.91" dy="0">Tickets en doce semanas</tspan></text><rect x="10" y="263" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="287.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">La métrica premiada subió 26,7 % (600 a 760) y el resultado que importa bajó 8,6 % (560 a 512). Es un modelo con supuestos</tspan></text><text x="470" y="304.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">del autor (cerrar rápido eleva de 5 a 7 los cierres por agente y la reapertura de 8 % a 45 %): muestra el mecanismo, no</tspan></text><text x="470" y="321.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">mide a ningún equipo.</tspan></text><text x="470" y="368.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
