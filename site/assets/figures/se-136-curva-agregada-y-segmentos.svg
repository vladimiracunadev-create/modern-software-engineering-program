<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 401" width="890" height="401" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una curva de retención agregada aplana mientras cada segmento decae por igual</title><desc id="d">Tabla de retención por semana: la curva agregada cae de 81,6 a 13,6 por ciento en 26 semanas; el segmento de hábito baja de 97,0 a 45,3 por ciento y el de visitas ocasionales de 75,0 a casi 0. Una tasa constante ajustada a las primeras cuatro semanas predice 0,9 por ciento en la semana 26 y el valor real es 13,6.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="890" height="401" fill="#ffffff"/><rect x="10" y="12" width="104" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="62" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="62" dy="0">Semana</tspan></text><rect x="120" y="12" width="334" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="287" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="287" dy="0">Agregada (30 % hábito, 70 % ocasional)</tspan></text><rect x="460" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="557" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="557" dy="0">Segmento hábito</tspan></text><rect x="660" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="767" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="767" dy="0">Segmento ocasional</tspan></text><rect x="10" y="56" width="104" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="62" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="62" dy="0">1</tspan></text><rect x="120" y="56" width="334" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="287" dy="0">81,6 %</tspan></text><rect x="460" y="56" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">97,0 %</tspan></text><rect x="660" y="56" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">75,0 %</tspan></text><rect x="10" y="102" width="104" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="62" y="125.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="62" dy="0">4</tspan></text><rect x="120" y="102" width="334" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="287" dy="0">48,7 %</tspan></text><rect x="460" y="102" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">88,5 %</tspan></text><rect x="660" y="102" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">31,6 %</tspan></text><rect x="10" y="148" width="104" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="62" y="171.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="62" dy="0">8</tspan></text><rect x="120" y="148" width="334" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="287" dy="0">30,5 %</tspan></text><rect x="460" y="148" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">78,4 %</tspan></text><rect x="660" y="148" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">10,0 %</tspan></text><rect x="10" y="194" width="104" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="62" y="217.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="62" dy="0">12</tspan></text><rect x="120" y="194" width="334" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="287" dy="0">23,0 %</tspan></text><rect x="460" y="194" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">69,4 %</tspan></text><rect x="660" y="194" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">3,2 %</tspan></text><rect x="10" y="240" width="104" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="62" y="263.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="62" dy="0">26</tspan></text><rect x="120" y="240" width="334" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="287" dy="0">13,6 %</tspan></text><rect x="460" y="240" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">45,3 %</tspan></text><rect x="660" y="240" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">0,06 %</tspan></text><rect x="10" y="290" width="870" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="445" y="314.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="445" dy="0">Cada segmento pierde una fracción constante por semana (3 % y 25 %); la mezcla produce una curva que decae cada vez</tspan></text><text x="445" y="331.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="445" dy="0">más despacio. Extrapolar con la tasa de las primeras semanas subestima la retención a 26 semanas por 15 veces. Una</tspan></text><text x="445" y="348.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="445" dy="0">simulación de 2 000 personas da 47,3 %, 22,2 % y 13,8 % en las semanas 4, 12 y 26.</tspan></text><text x="445" y="387.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="445" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
