"3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="192.066" dy="0">88,5</tspan></text><rect x="313.826" y="146.3" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="319.326" y="140.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="319.326" dy="0">78,4</tspan></text><rect x="441.087" y="173.3" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="446.587" y="167.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="446.587" dy="0">69,4</tspan></text><rect x="886.5" y="245.6" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="240.1" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">45,3</tspan></text><polyline points="96.62,162 192.066,292.2 319.326,357 446.587,377.4 892,386.82" fill="none" stroke="#c0432f" stroke-width="2.4"/><polygon points="96.62,155.675 102.67,166.95 90.57,166.95" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="96.62" y="186" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">75,0</tspan></text><polygon points="192.066,285.875 198.116,297.15 186.016,297.15" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="192.066" y="281.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="192.066" dy="0">31,6</tspan></text><polygon points="319.326,350.675 325.376,361.95 313.276,361.95" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="319.326" y="346" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="319.326" dy="0">10,0</tspan></text><polygon points="446.587,371.075 452.637,382.35 440.537,382.35" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="446.587" y="366.4" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="446.587" dy="0">3,2</tspan></text><polygon points="892,380.495 898.05,391.77 885.95,391.77" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="375.82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">0,06</tspan></text><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cada segmento pierde una fracción constante por semana (3 % y 25 %); la mezcla produce una curva que decae cada vez más</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">despacio. Extrapolar con la tasa de las primeras semanas subestima la retención a 26 semanas por 15 veces. Una simulación</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de 2 000 personas da 47,3 %, 22,2 % y 13,8 % en las semanas 4, 12 y 26.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
