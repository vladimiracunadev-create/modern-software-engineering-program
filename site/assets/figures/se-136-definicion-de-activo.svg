<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 247" width="980" height="247" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">DAU/MAU de las mismas 2 000 personas según qué cuenta como activo</title><desc id="d">Barras del cociente entre activos diarios y mensuales con la misma población: 28,2 por ciento si basta un acceso, 23,2 si se vio una entrega y 8,1 si se envió una entrega.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="247" fill="#ffffff"/><text x="360" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Cualquier evento o acceso (1 737 al mes)</tspan></text><rect x="370" y="16" width="338.4" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="716.4" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="716.4" dy="0">28,2 %</tspan></text><text x="360" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Vio una entrega (1 688 al mes)</tspan></text><rect x="370" y="60" width="278.4" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="656.4" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="656.4" dy="0">23,2 %</tspan></text><text x="360" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Envió una entrega (1 215 al mes)</tspan></text><rect x="370" y="104" width="97.2" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="475.2" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="475.2" dy="0">8,1 %</tspan></text><rect x="10" y="152" width="960" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="490" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">Ningún valor es el verdadero: responden a preguntas distintas. 28,2 % mide hábito de abrir la aplicación; 8,1 % mide hábito de</tspan></text><text x="490" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">hacer la tarea útil. Compararse con «un DAU/MAU de 25 %» publicado por otro equipo exige saber qué evento cuenta.</tspan></text><text x="490" y="233.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
