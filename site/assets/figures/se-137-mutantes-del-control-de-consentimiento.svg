<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 338" width="940" height="338" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Control de consentimiento: mutantes que matan 3 pruebas del camino feliz frente a 9 dirigidas</title><desc id="d">Barras apiladas de los once mutantes del rastreador con consentimiento: las tres pruebas del camino feliz matan 2 y dejan 9 vivos; las nueve pruebas completas matan 10 y solo sobrevive el equivalente.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="338" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Control de consentimiento: mutantes que matan 3 pruebas del camino feliz frente a 9 dirigidas</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Muertos</tspan></text><rect x="116.78" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="136.78" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="136.78" dy="0">Sobreviven</tspan></text><line x1="254" y1="77" x2="254" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="254" y1="157" x2="254" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="254" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="254" dy="0">0</tspan></text><line x1="378.34" y1="77" x2="378.34" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="378.34" y1="157" x2="378.34" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="378.34" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="378.34" dy="0">2,5</tspan></text><line x1="502.68" y1="77" x2="502.68" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="502.68" y1="157" x2="502.68" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="502.68" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502.68" dy="0">5</tspan></text><line x1="627.02" y1="77" x2="627.02" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="627.02" y1="157" x2="627.02" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="627.02" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="627.02" dy="0">7,5</tspan></text><line x1="751.36" y1="77" x2="751.36" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="751.36" y1="157" x2="751.36" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="751.36" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="751.36" dy="0">10</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="157" x2="875.7" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">12,5</tspan></text><line x1="254" y1="157" x2="875.7" y2="157" stroke="#5b7280" stroke-width="1.6"/><text x="244" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">3 pruebas del camino feliz</tspan></text><text x="244" y="141.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">9 pruebas dirigidas</tspan></text><rect x="254" y="84" width="99.472" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="303.736" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="303.736" dy="0">2</tspan></text><rect x="353.472" y="84" width="447.624" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="577.284" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="577.284" dy="0">9</tspan></text><text x="808.096" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="808.096" dy="0">11</tspan></text><rect x="254" y="124" width="497.36" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="502.68" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="502.68" dy="0">10</tspan></text><rect x="751.36" y="124" width="49.736" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="776.228" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="776.228" dy="0">1</tspan></text><text x="808.096" y="141.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="808.096" dy="0">11</tspan></text><text x="564.85" y="201" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="564.85" dy="0">Mutantes</tspan></text><rect x="10" y="215" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="239.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Puntaje de mutación: 2 de 11 con las pruebas del camino feliz y 10 de 11 con las completas. El mutante equivalente</tspan></text><text x="470" y="256.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">sobrevive con razón: el código resultante se comporta igual. Un 100 % no se espera; hay que revisar cada superviviente y</tspan></text><text x="470" y="273.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">decidir.</tspan></text><text x="470" y="320.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código y pruebas reales ejecutados; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
