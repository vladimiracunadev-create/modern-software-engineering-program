<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 263" width="940" height="263" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mejora de los centros peores sin ninguna intervención</title><desc id="d">Barras con la mejora media del 10 por ciento de centros con peor primera medición al medirlos de nuevo sin intervención: 0,91 puntos con fiabilidad 0,94, 4,00 con 0,72 y 12,64 con 0,50.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="263" fill="#ffffff"/><text x="300" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Ruido 2 (fiabilidad 0,94)</tspan></text><rect x="310" y="16" width="27.3" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="345.3" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="345.3" dy="0">+0,91 puntos</tspan></text><text x="300" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Ruido 5 (fiabilidad 0,72)</tspan></text><rect x="310" y="60" width="120" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="438" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="438" dy="0">+4,00 puntos</tspan></text><text x="300" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Ruido 8 (fiabilidad 0,50)</tspan></text><rect x="310" y="104" width="379.2" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="697.2" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="697.2" dy="0">+12,64 puntos</tspan></text><rect x="10" y="152" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">500 centros con valor verdadero de media 60 y desviación 8; se elige el 10 % peor en la primera medición. Con ruido 5, el</tspan></text><text x="470" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">80 % de ellos «mejora» solo por azar. Un programa dirigido al peor decil que mide antes y después atribuiría esa mejora al</tspan></text><text x="470" y="210.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">programa.</tspan></text><text x="470" y="249.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
