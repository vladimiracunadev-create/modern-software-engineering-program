<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 291" width="980" height="291" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Efecto estimado de una función: observar frente a asignar al azar</title><desc id="d">Barras del efecto estimado en entregas por semana: el efecto verdadero es 0,50; la asignación al azar estima 0,48; estratificar por un indicador ruidoso del compromiso estima 1,80; comparar a quienes adoptan con quienes no estima 2,62.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="291" fill="#ffffff"/><text x="360" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Efecto verdadero</tspan></text><rect x="370" y="16" width="65" height="28" rx="3" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="443" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="443" dy="0">0,50</tspan></text><text x="360" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Aleatorizado</tspan></text><rect x="370" y="60" width="62.4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="440.4" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="440.4" dy="0">0,48</tspan></text><text x="360" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Estratificado con un indicador ruidoso</tspan></text><rect x="370" y="104" width="234" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="612" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="612" dy="0">1,80</tspan></text><text x="360" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Comparación ingenua de quienes adoptan</tspan></text><rect x="370" y="148" width="340.6" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="718.6" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="718.6" dy="0">2,62</tspan></text><rect x="10" y="196" width="960" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="490" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Quienes adoptan la función ya eran más comprometidos (adopción 41 % con 20 000 personas). Controlar por un indicador ruidoso</tspan></text><text x="490" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">reduce el sesgo pero deja 3,6 veces el efecto real. Solo la asignación al azar rompe el vínculo entre compromiso y adopción.</tspan></text><text x="490" y="277.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
