11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="469.411" y="391.875" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="469.411" dy="0">5,1</tspan></text><rect x="886.5" y="361.625" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="391.125" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">5,3</tspan></text><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La corrección tiene un precio: con 800 personas por brazo y un daño real de 0,15 desviaciones, la potencia baja de 85,4 %</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">(α = 0,05) a 59,0 % (α = 0,005). Vigilar mucho sin corregir produce alarmas inútiles; corregir sin aumentar la muestra deja</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">pasar daños reales.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
