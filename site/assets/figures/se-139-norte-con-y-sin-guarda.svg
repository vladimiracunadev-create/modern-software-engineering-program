<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 459" width="960" height="459" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Optimizar solo la métrica norte frente a optimizarla con guarda</title><desc id="d">Tabla de recordatorios por semana: las entregas a tiempo suben de 61,5 a 95,4 por ciento con ocho recordatorios y las quejas de 0,9 a 26,2; con una guarda de quejas de a lo sumo 3 por ciento el mejor punto es de dos recordatorios, con 70,0 por ciento de entregas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="459" fill="#ffffff"/><rect x="10" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="102" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="102" dy="0">Recordatorios por</tspan></text><text x="102" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="102" dy="0">semana</tspan></text><rect x="200" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="327" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="327" dy="0">Entregas a tiempo (métrica</tspan></text><text x="327" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="327" dy="0">norte)</tspan></text><rect x="460" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="572" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="572" dy="0">Quejas (métrica contraria)</tspan></text><rect x="690" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="817" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="817" dy="0">Decisión</tspan></text><rect x="10" y="56" width="184" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="80.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">0</tspan></text><rect x="200" y="56" width="254" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="80.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="327" dy="0">61,5 %</tspan></text><rect x="460" y="56" width="224" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="80.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">0,9 %</tspan></text><rect x="690" y="56" width="254" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><rect x="10" y="104" width="184" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="128.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">2</tspan></text><rect x="200" y="104" width="254" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="128.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="327" dy="0">70,0 %</tspan></text><rect x="460" y="104" width="224" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="128.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">2,4 %</tspan></text><rect x="690" y="104" width="254" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="120.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">óptimo con guarda de quejas ≤ 3</tspan></text><text x="817" y="136.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">%</tspan></text><rect x="10" y="152" width="184" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="176.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">4</tspan></text><rect x="200" y="152" width="254" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="176.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="327" dy="0">80,2 %</tspan></text><rect x="460" y="152" width="224" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="176.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">7,5 %</tspan></text><rect x="690" y="152" width="254" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><rect x="10" y="200" width="184" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="224.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">6</tspan></text><rect x="200" y="200" width="254" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="224.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="327" dy="0">89,5 %</tspan></text><rect x="460" y="200" width="224" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="224.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">15,4 %</tspan></text><rect x="690" y="200" width="254" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><rect x="10" y="248" width="184" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="272.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">8</tspan></text><rect x="200" y="248" width="254" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="272.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="327" dy="0">95,4 %</tspan></text><rect x="460" y="248" width="224" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="272.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">26,2 %</tspan></text><rect x="690" y="248" width="254" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="272.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">óptimo si solo se mira el norte</tspan></text><rect x="10" y="296" width="184" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="320.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">10</tspan></text><rect x="200" y="296" width="254" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="320.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="327" dy="0">95,1 %</tspan></text><rect x="460" y="296" width="224" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="320.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">39,8 %</tspan></text><rect x="690" y="296" width="254" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="320.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">el norte ya no sube</tspan></text><rect x="10" y="348" width="940" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="372.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">5 000 personas por nivel. Quien optimiza el norte pasa de 2 a 8 recordatorios: gana 25 puntos de entregas y suma 24 puntos de</tspan></text><text x="480" y="389.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">quejas. La relación entre recordatorios, entregas y quejas es una suposición del autor; lo que se mide es que, sin la guarda,</tspan></text><text x="480" y="406.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">el optimizador la cruza.</tspan></text><text x="480" y="445.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
