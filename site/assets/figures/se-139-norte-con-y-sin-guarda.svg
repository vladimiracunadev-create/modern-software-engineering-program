" y="191.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">61,5</tspan></text><circle cx="255.696" cy="177" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="255.696" y="166" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="255.696" dy="0">70,0</tspan></text><circle cx="414.772" cy="146.4" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="414.772" y="135.4" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="414.772" dy="0">80,2</tspan></text><circle cx="573.848" cy="118.5" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="573.848" y="107.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="573.848" dy="0">89,5</tspan></text><circle cx="732.924" cy="100.8" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="732.924" y="89.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="732.924" dy="0">95,4</tspan></text><circle cx="892" cy="101.7" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="125.7" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">95,1</tspan></text><polyline points="96.62,384.3 255.696,379.8 414.772,364.5 573.848,340.8 732.924,308.4 892,267.6" fill="none" stroke="#c0432f" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="91.12" y="378.8" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="96.62" y="373.3" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">0,9</tspan></text><rect x="250.196" y="374.3" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="255.696" y="368.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="255.696" dy="0">2,4</tspan></text><rect x="409.272" y="359" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="414.772" y="353.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="414.772" dy="0">7,5</tspan></text><rect x="568.348" y="335.3" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="573.848" y="329.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="573.848" dy="0">15,4</tspan></text><rect x="727.424" y="302.9" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="732.924" y="297.4" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="732.924" dy="0">26,2</tspan></text><rect x="886.5" y="262.1" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="256.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">39,8</tspan></text><text x="315.696" y="272" font-size="13" text-anchor="start" font-weight="400" fill="#5c1f14" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="315.696" dy="0">Óptimo con guarda de</tspan></text><text x="315.696" y="289" font-size="13" text-anchor="start" font-weight="400" fill="#5c1f14" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="315.696" dy="0">quejas ≤ 3 %</tspan></text><line x1="259.856" y1="184.2" x2="307.696" y2="267" stroke="#5c1f14" stroke-width="1.2"/><text x="642.924" y="162.8" font-size="13" text-anchor="end" font-weight="400" fill="#5c1f14" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="642.924" dy="0">Óptimo si solo se mira el</tspan></text><text x="642.924" y="179.8" font-size="13" text-anchor="end" font-weight="400" fill="#5c1f14" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="642.924" dy="0">norte</tspan></text><line x1="726.364" y1="105.36" x2="650.924" y2="157.8" stroke="#5c1f14" stroke-width="1.2"/><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">5 000 personas por nivel. Quien optimiza el norte pasa de 2 a 8 recordatorios: gana 25 puntos de entregas y suma 24 puntos</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">de quejas. La relación entre recordatorios, entregas y quejas es una suposición del autor; lo que se mide es que, sin la</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">guarda, el optimizador la cruza.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
