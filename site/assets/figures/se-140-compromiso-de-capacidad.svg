13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="669.057" dy="0">1 441</tspan></text><rect x="886.5" y="208.3" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="892" y="202.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">1 366</tspan></text><polyline points="111.7,336.2 446.114,372.4 669.057,328.8" fill="none" stroke="#c0432f" stroke-width="2.4"/><polygon points="111.7,329.875 117.75,341.15 105.65,341.15" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="111.7" y="325.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="111.7" dy="0">754</tspan></text><polygon points="446.114,366.075 452.164,377.35 440.064,377.35" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="446.114" y="361.4" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="446.114" dy="0">573</tspan></text><polygon points="669.057,322.475 675.107,333.75 663.007,333.75" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="669.057" y="317.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="669.057" dy="0">791</tspan></text><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Precio a demanda 1,0 y comprometido 0,65 por unidad pagado siempre (utilización de equilibrio 65 %). Comprometer cerca de</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">la demanda esperada ahorra 25 %; comprometer de más sube el costo medio, y una caída persistente anula el ahorro. Es un</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">modelo con trayectoria aleatoria simple; no representa a ningún proveedor.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">10 000 trayectorias con semilla fija; precios ficticios.</tspan></text></svg>
