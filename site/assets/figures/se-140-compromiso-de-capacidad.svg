 fill="#142231"><tspan x="613.321" dy="0">90</tspan></text><line x1="669.057" y1="87" x2="669.057" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="669.057" y1="387" x2="669.057" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="669.057" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="669.057" dy="0">100</tspan></text><line x1="892" y1="87" x2="892" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="387" x2="892" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">140</tspan></text><line x1="93.7" y1="387" x2="910" y2="387" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 237)">Costo anual (unidades ficticias)</text><text x="501.85" y="433" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="501.85" dy="0">Capacidad comprometida (unidades)</tspan></text><polyline points="111.7,235.6 446.114,284.8 613.321,297.8 669.057,296 892,259.8" fill="none" stroke="#087f8c" stroke-width="2.4"/><circle cx="111.7" cy="235.6" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="111.7" y="224.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="111.7" dy="0">1 257</tspan></text><circle cx="446.114" cy="284.8" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="446.114" y="273.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="446.114" dy="0">1 011</tspan></text><circle cx="613.321" cy="297.8" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="613.321" y="286.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"