<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Comprometer capacidad: costo medio, riesgo y caída de la demanda</title><desc id="d">Líneas con el costo anual según la capacidad comprometida: el costo medio baja de 1 257 sin compromiso a 946 con 90 y sube a 1 136 con 140; el percentil 95 baja de 1 859 a 1 366; si la demanda cae 40 por ciento, con compromiso de 100 el costo es 791, más que sin compromiso (754).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Comprometer capacidad: costo medio, riesgo y caída de la demanda</tspan></text><circle cx="22" cy="51" r="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Costo medio</tspan></text><rect x="146.94" y="45" width="12" height="12" fill="#946512" stroke="#946512" stroke-width="2"/><text x="166.94" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="166.94" dy="0">Percentil 95</tspan></text><polygon points="291.42,44.1 298.02,56.4 284.82,56.4" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="305.42" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="305.42" dy="0">Costo medio si la demanda cae 40 %</tspan></text><line x1="93.7" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="38