<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 307" width="940" height="307" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Costo por cada 1 000 resultados según el volumen mensual</title><desc id="d">Barras del costo por mil entregas aceptadas con costo fijo de 3 000 y 0,002 por intento: 32,0 con cien mil resultados al mes, 8,0 con quinientos mil, 5,0 con un millón y 2,6 con cinco millones.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="307" fill="#ffffff"/><text x="310" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="310" dy="0">100 000 resultados al mes</tspan></text><rect x="320" y="16" width="352" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="680" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="680" dy="0">32,0</tspan></text><text x="310" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="310" dy="0">500 000</tspan></text><rect x="320" y="60" width="88" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="416" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="416" dy="0">8,0</tspan></text><text x="310" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="310" dy="0">1 000 000</tspan></text><rect x="320" y="104" width="55" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="383" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="383" dy="0">5,0</tspan></text><text x="310" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="310" dy="0">5 000 000</tspan></text><rect x="320" y="148" width="28.6" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="356.6" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="356.6" dy="0">2,6</tspan></text><rect x="10" y="196" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Con un millón de solicitudes al mes, subir de 0 % a 30 % de fallas con hasta tres intentos eleva el costo por mil</tspan></text><text x="470" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">resultados de 5,00 a 5,94 (+18,8 %) y deja 2,8 % sin resultado. El costo por resultado se mueve por el volumen y por las</tspan></text><text x="470" y="254.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">fallas: un costo por solicitud oculta ambos.</tspan></text><text x="470" y="293.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Cálculo determinista y simulación con semilla fija; precios ficticios.</tspan></text></svg>
