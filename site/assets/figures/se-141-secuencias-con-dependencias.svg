<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 421" width="960" height="421" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Secuenciar con dependencias: 63 órdenes válidos de 5 040 posibles</title><desc id="d">Tabla de siete iniciativas con dependencias: el mejor orden vale 551,5, el voraz que elige por valor sobre duración vale 539,5 (2,2 por ciento menos) y el peor 514,3 (6,7 por ciento menos); solo 63 de 5040 órdenes respetan las dependencias y 73 por ciento están a menos de 5 por ciento del mejor.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="421" fill="#ffffff"/><rect x="10" y="12" width="464" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="242" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="242" dy="0">Orden o medida</tspan></text><rect x="480" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="602" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="602" dy="0">Valor presente (24 meses)</tspan></text><rect x="730" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="837" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="837" dy="0">Diferencia con el mejor</tspan></text><rect x="10" y="56" width="464" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">A B C D G E F (mejor)</tspan></text><rect x="480" y="56" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">551,5</tspan></text><rect x="730" y="56" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">0,0 %</tspan></text><rect x="10" y="106" width="464" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">E F A B C D G (voraz por valor/duración)</tspan></text><rect x="480" y="106" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">539,5</tspan></text><rect x="730" y="106" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">−2,2 %</tspan></text><rect x="10" y="156" width="464" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">C A E F B D G (peor)</tspan></text><rect x="480" y="156" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">514,3</tspan></text><rect x="730" y="156" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">−6,7 %</tspan></text><rect x="10" y="206" width="464" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Órdenes válidos / posibles</tspan></text><rect x="480" y="206" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">63 / 5 040</tspan></text><rect x="730" y="206" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">—</tspan></text><rect x="10" y="256" width="464" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Órdenes a menos de 5 % del mejor / a menos de 1 %</tspan></text><rect x="480" y="256" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">73 % / 4,8 %</tspan></text><rect x="730" y="256" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">—</tspan></text><rect x="10" y="310" width="940" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="334.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">El voraz empieza por E y F (valor por mes alto) y retrasa A, B y D, que desbloquean la iniciativa más valiosa. Elegir por</tspan></text><text x="480" y="351.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">valor propio ignora lo que una iniciativa habilita; con pocas dependencias el error es pequeño, y con muchas puede ser mayor.</tspan></text><text x="480" y="368.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Tasa de descuento 1 % al mes.</tspan></text><text x="480" y="407.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Enumeración exhaustiva con valores ficticios.</tspan></text></svg>
