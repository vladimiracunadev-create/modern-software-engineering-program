<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 395" width="940" height="395" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Valor esperado de invertir por etapas según la exactitud del piloto</title><desc id="d">Barras del valor esperado: invertir todo de una vez pierde 24,0; con un piloto de exactitud 0,5 pierde 21,9, con 0,7 pierde 8,3, con 0,8 pierde 1,6, con 0,9 gana 5,3 y con un piloto perfecto gana 12,0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="395" fill="#ffffff"/><text x="320" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="320" dy="0">Todo de una vez (exacto)</tspan></text><rect x="330" y="16" width="360" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="698" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="698" dy="0">−24,0</tspan></text><text x="320" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="320" dy="0">Con piloto de exactitud 0,5</tspan></text><rect x="330" y="60" width="328.5" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="666.5" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="666.5" dy="0">−21,9</tspan></text><text x="320" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="320" dy="0">Piloto de exactitud 0,7</tspan></text><rect x="330" y="104" width="124.5" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="462.5" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="462.5" dy="0">−8,3</tspan></text><text x="320" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="320" dy="0">Piloto de exactitud 0,8</tspan></text><rect x="330" y="148" width="24" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="362" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="362" dy="0">−1,6</tspan></text><text x="320" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="320" dy="0">Piloto de exactitud 0,9</tspan></text><rect x="330" y="192" width="79.5" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="417.5" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="417.5" dy="0">+5,3</tspan></text><text x="320" y="255.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="320" dy="0">Piloto perfecto</tspan></text><rect x="330" y="236" width="180" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="518" y="255.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="518" dy="0">+12,0</tspan></text><rect x="10" y="284" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="308.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Mercado bueno con probabilidad 0,4: rinde 180 si es bueno y 40 si no; todo cuesta 120; el piloto cuesta 20 y el resto 100.</tspan></text><text x="470" y="325.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La opción de esperar convierte una apuesta perdedora en ganadora solo si el piloto distingue bien (equilibrio cerca de</tspan></text><text x="470" y="342.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">0,82). Un piloto de azar pierde el costo del piloto sin ganar información.</tspan></text><text x="470" y="381.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Esperanza exacta y simulación de 100 000 casos con semilla fija; cifras ficticias.</tspan></text></svg>
