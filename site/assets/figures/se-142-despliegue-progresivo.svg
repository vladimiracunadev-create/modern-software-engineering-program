<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 339" width="960" height="339" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Personas afectadas por un defecto: todo de golpe o por etapas</title><desc id="d">Tabla: con 200 000 personas, un defecto que afecta a 5 por ciento daña a 9952 si se despliega de golpe y a 87 si se detecta en la primera etapa de 1 por ciento; un defecto de 0,2 por ciento daña a 392 de golpe y a 98 si se detecta en la etapa de 25 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="339" fill="#ffffff"/><rect x="10" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="102" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="102" dy="0">Tasa del defecto</tspan></text><rect x="200" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="327" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="327" dy="0">Afectadas, todo de golpe</tspan></text><rect x="460" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="582" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="582" dy="0">Afectadas, por etapas</tspan></text><rect x="710" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="827" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="827" dy="0">Etapa en que se detecta</tspan></text><rect x="10" y="56" width="184" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">5 %</tspan></text><rect x="200" y="56" width="254" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="84.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="327" dy="0">9 952</tspan></text><rect x="460" y="56" width="244" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="84.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">87</tspan></text><rect x="710" y="56" width="234" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="84.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">etapa 1 (1 %)</tspan></text><rect x="10" y="112" width="184" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="140.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">1 %</tspan></text><rect x="200" y="112" width="254" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="140.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="327" dy="0">1 995</tspan></text><rect x="460" y="112" width="244" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="140.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">102</tspan></text><rect x="710" y="112" width="234" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="140.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">etapa 2 (5 %)</tspan></text><rect x="10" y="168" width="184" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="196.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">0,2 %</tspan></text><rect x="200" y="168" width="254" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="196.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="327" dy="0">392</tspan></text><rect x="460" y="168" width="244" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="196.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">98</tspan></text><rect x="710" y="168" width="234" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="196.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">etapa 3 (25 %)</tspan></text><rect x="10" y="228" width="940" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="252.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Etapas de 1, 5, 25 y 100 %; se detecta al reunir al menos 10 reportes, y 15 % de las personas afectadas reporta. Cuanto más</tspan></text><text x="480" y="269.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">raro es el defecto, más tarde se ve y más importa la última etapa; con 0,05 % se esperan unos 4 reportes en la etapa de 25 % y</tspan></text><text x="480" y="286.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">el umbral de 10 no se alcanza hasta el 100 % (cuenta esperada, no simulada).</tspan></text><text x="480" y="325.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
