<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuándo conviene probar con vuelta atrás en lugar de comprometerse</title><desc id="d">Líneas con la pérdida esperada de la decisión irreversible y de la reversible según la probabilidad de equivocarse: con 2 por ciento conviene la irreversible (2,0 frente a 4,4), con 5 por ciento empatan en cerca de 5, y con 10 y 30 por ciento conviene la reversible (6,0 frente a 9,9 y 9,9 frente a 30,3).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuándo conviene probar con vuelta atrás en lugar de comprometerse</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Irreversible</tspan></text><rect x="154.48" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="174.48" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="174.48" dy="0">Reversible (4 + 20·p)</tspan></text><line x1="71.08" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="387" x2="71.08" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="312" x2="910" y2="312" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="312" x2="71.08" y2="312" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="316.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="237" x2="910" y2="237" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="237" x2="71.08" y2="237" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="162" x2="910" y2="162" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="162" x2="71.08" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="166.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">30</tspan></text><line x1="71.08" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="87" x2="71.08" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">40</tspan></text><line x1="71.08" y1="87" x2="71.08" y2="387" stroke="#5b7280" stroke-width="1.6"/><line x1="89.08" y1="87" x2="89.08" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="89.08" y1="387" x2="89.08" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="89.08" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="89.08" dy="0">2</tspan></text><line x1="175.107" y1="87" x2="175.107" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="175.107" y1="387" x2="175.107" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="175.107" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="175.107" dy="0">5</tspan></text><line x1="318.486" y1="87" x2="318.486" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="318.486" y1="387" x2="318.486" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="318.486" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="318.486" dy="0">10</tspan></text><line x1="892" y1="87" x2="892" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="387" x2="892" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">30</tspan></text><line x1="71.08" y1="387" x2="910" y2="387" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 237)">Pérdida esperada (unidades ficticias)</text><text x="490.54" y="433" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="490.54" dy="0">Probabilidad de equivocarse (%)</tspan></text><polyline points="89.08,372 175.107,349.5 318.486,312.75 892,159.75" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="89.08" cy="372" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="99.08" y="376.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="99.08" dy="0">2,0</tspan></text><circle cx="175.107" cy="349.5" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="175.107" y="338.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="175.107" dy="0">5,0</tspan></text><circle cx="318.486" cy="312.75" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="318.486" y="301.75" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="318.486" dy="0">9,9</tspan></text><circle cx="892" cy="159.75" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="148.75" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">30,3</tspan></text><polyline points="89.08,354 175.107,350.25 318.486,342 892,312.75" fill="none" stroke="#087f8c" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="83.58" y="348.5" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="89.08" y="343" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="89.08" dy="0">4,4</tspan></text><rect x="169.607" y="344.75" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="175.107" y="374.25" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="175.107" dy="0">4,9</tspan></text><rect x="312.986" y="336.5" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="318.486" y="366" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="318.486" dy="0">6,0</tspan></text><rect x="886.5" y="307.25" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="336.75" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">9,9</tspan></text><text x="235.107" y="289.5" font-size="13" text-anchor="start" font-weight="400" fill="#5c1f14" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="235.107" dy="0">Umbral p* = 5,0 %</tspan></text><line x1="179.267" y1="344.3" x2="227.107" y2="284.5" stroke="#5c1f14" stroke-width="1.2"/><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Umbral p* = costo de probar / (pérdida irreversible − costo de revertir) = 4 / (100 − 20) = 5,0 %. Con costo de revertir 5</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">es 4,2 % y con 50 es 8,0 %. Los tres números son supuestos; la lección es que la probabilidad de equivocarse decide, y casi</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">nunca se conoce con precisión.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación de 40 000 casos por fila, semilla fija.</tspan></text></svg>
