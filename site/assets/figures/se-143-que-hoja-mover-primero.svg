<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 351" width="940" height="351" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué hoja conviene mover primero, según el costo, con baselines inciertos</title><desc id="d">Barras con la proporción de 10 000 sorteos de baselines en que cada hoja queda primera en efecto por costo: la tasa de entregas aceptadas 87,1 por ciento, entregas por API 6,9, estudiantes por centro 6,0, y entregas por estudiante y centros activos ninguna.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="351" fill="#ffffff"/><text x="300" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Tasa de entregas aceptadas</tspan></text><rect x="310" y="16" width="383.24" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="701.24" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="701.24" dy="0">87,1 %</tspan></text><text x="300" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Entregas por API</tspan></text><rect x="310" y="60" width="30.36" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="348.36" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="348.36" dy="0">6,9 %</tspan></text><text x="300" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Estudiantes por centro</tspan></text><rect x="310" y="104" width="26.4" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="344.4" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="344.4" dy="0">6,0 %</tspan></text><text x="300" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Entregas por estudiante</tspan></text><rect x="310" y="148" width="4" height="28" rx="3" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="322" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="322" dy="0">0 %</tspan></text><text x="300" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Centros activos</tspan></text><rect x="310" y="192" width="4" height="28" rx="3" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="322" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="322" dy="0">0 %</tspan></text><rect x="10" y="240" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Raíz = centros × estudiantes × entregas × tasa + entregas por API; subir cualquier hoja multiplicativa 10 % mueve la raíz</tspan></text><text x="470" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">lo mismo, y el orden lo decide el costo de lograrlo (30, 10, 15, 8 y 5 semanas-persona, supuestos). La tasa es primera</tspan></text><text x="470" y="298.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">porque su costo es bajo y su techo no es 10 %: se limita a (1 − tasa).</tspan></text><text x="470" y="337.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
