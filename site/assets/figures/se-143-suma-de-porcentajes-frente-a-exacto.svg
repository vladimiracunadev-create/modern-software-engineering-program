<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 411" width="960" height="411" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres factores que suben lo mismo: cambio exacto frente a suma de porcentajes</title><desc id="d">Tabla: si los tres factores de una métrica multiplicativa suben 2 por ciento el cambio exacto es 6,12 y la suma da 6; si suben 50 por ciento el cambio exacto es 237,5 y la suma da 150, 63 por ciento de lo real.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="411" fill="#ffffff"/><rect x="10" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="107" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="107" dy="0">Cada factor sube</tspan></text><rect x="210" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="337" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="337" dy="0">Cambio exacto del padre</tspan></text><rect x="470" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="597" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="597" dy="0">Suma de los porcentajes</tspan></text><rect x="730" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="837" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="837" dy="0">Suma sobre exacto</tspan></text><rect x="10" y="56" width="194" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="80.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">+2 %</tspan></text><rect x="210" y="56" width="254" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="337" y="80.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="337" dy="0">+6,12 %</tspan></text><rect x="470" y="56" width="254" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="80.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">+6 %</tspan></text><rect x="730" y="56" width="214" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="80.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">98,0 %</tspan></text><rect x="10" y="104" width="194" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="128.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">+5 %</tspan></text><rect x="210" y="104" width="254" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="337" y="128.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="337" dy="0">+15,76 %</tspan></text><rect x="470" y="104" width="254" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="128.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">+15 %</tspan></text><rect x="730" y="104" width="214" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="128.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">95,2 %</tspan></text><rect x="10" y="152" width="194" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="176.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">+10 %</tspan></text><rect x="210" y="152" width="254" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="337" y="176.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="337" dy="0">+33,10 %</tspan></text><rect x="470" y="152" width="254" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="176.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">+30 %</tspan></text><rect x="730" y="152" width="214" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="176.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">90,6 %</tspan></text><rect x="10" y="200" width="194" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="224.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">+20 %</tspan></text><rect x="210" y="200" width="254" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="337" y="224.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="337" dy="0">+72,80 %</tspan></text><rect x="470" y="200" width="254" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="224.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">+60 %</tspan></text><rect x="730" y="200" width="214" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="224.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">82,4 %</tspan></text><rect x="10" y="248" width="194" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="272.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">+50 %</tspan></text><rect x="210" y="248" width="254" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="337" y="272.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="337" dy="0">+237,50 %</tspan></text><rect x="470" y="248" width="254" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="272.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">+150 %</tspan></text><rect x="730" y="248" width="214" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="272.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">63,2 %</tspan></text><rect x="10" y="300" width="940" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="324.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Con signos mezclados la suma engaña más: +50 % y −30 % dan +5 % exacto y +20 % por suma. Y cuando el cambio total es casi</tspan></text><text x="480" y="341.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">cero, las participaciones logarítmicas explotan (+831 % y −731 %): no se informan participaciones de un cambio de 5 %. Una</tspan></text><text x="480" y="358.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">atribución sin orden ni aviso de límites se convierte en relato.</tspan></text><text x="480" y="397.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Cálculo determinista.</tspan></text></svg>
