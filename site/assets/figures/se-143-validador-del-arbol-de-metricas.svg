 stroke-width="1.5"/><text x="322.962" y="381.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="322.962" dy="0">1</tspan></text><text x="408.925" y="381.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="408.925" dy="0">1</tspan></text><rect x="244" y="404" width="0" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="244" y="404" width="157.925" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="322.962" y="421.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="322.962" dy="0">1</tspan></text><text x="408.925" y="421.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="408.925" dy="0">1</tspan></text><text x="559.85" y="481" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="559.85" dy="0">Mutaciones</tspan></text><rect x="10" y="495" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="519.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Con casos nuevos: un árbol aditivo y uno con cociente pasan; un cociente con divisor cero se rechaza como fórmula inválida;</tspan></text><text x="470" y="536.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">una fórmula con constante que no cuadra se rechaza. El validador comprueba forma y aritmética; no sabe si «entregas por</tspan></text><text x="470" y="553.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">estudiante» está medida con la misma unidad que el padre.</tspan></text><text x="470" y="600.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código real ejecutado; idéntico en Windows y Ubuntu (WSL2).</tspan></text></svg>
