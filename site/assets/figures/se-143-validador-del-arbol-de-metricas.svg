<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 618" width="940" height="618" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Validador del árbol de métricas: 12 de 16 mutaciones detectadas</title><desc id="d">Barras apiladas de las 16 mutaciones por tipo de defecto: el validador detecta 4 de 4 de estructura, 1 de 1 de referencias, 4 de 4 de completitud, 2 de 2 de aritmética y 1 de 1 de nombre de vanidad, y deja pasar las 4 semánticas: unidad cambiada, fuente irrelevante, responsable colectivo y valores coherentes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="618" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Validador del árbol de métricas: 12 de 16 mutaciones detectadas</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Detectadas</tspan></text><rect x="139.4" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="159.4" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="159.4" dy="0">Sobreviven</tspan></text><line x1="244" y1="77" x2="244" y2="437" stroke="#d5dde1" stroke-width="1"/><line x1="244" y1="437" x2="244" y2="442" stroke="#5b7280" stroke-width="1.4"/><text x="244" y="458" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="244" dy="0">0</tspan></text><line x1="401.925" y1="77" x2="401.925" y2="437" stroke="#d5dde1" stroke-width="1"/><line x1="401.925" y1