n x="312" dy="0">31,1 %</tspan></text><rect x="410" y="256" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="517" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517" dy="0">18,7 %</tspan></text><rect x="630" y="256" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">15,1 %</tspan></text><rect x="820" y="256" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="912" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">563,1</tspan></text><rect x="10" y="306" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="331.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">30 centros</tspan></text><rect x="220" y="306" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="312" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="312" dy="0">50,1 %</tspan></text><rect x="410" y="306" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="517" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517" dy="0">32,4 %</tspan></text><rect x="630" y="306" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">9,7 %</tspan></text><rect x="820" y="306" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="912" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">397,0</tspan></text><rect x="10" y="360" width="1000" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="510" y="384.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="510" dy="0">En este modelo ninguna compuerta aumentó el valor esperado: lo que compra es reducir los proyectos malos que siguen (27,5 % a 9,7 %) a</tspan></text><text x="510" y="401.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="510" dy="0">cambio de detener algunos buenos. Con 30 % de la construcción antes de la compuerta el resultado es parecido. Fijar el umbral exige</tspan></text><text x="510" y="418.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="510" dy="0">decidir cuánto riesgo vale esa pérdida esperada.</tspan></text><text x="510" y="457.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="510" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
