<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 471" width="1020" height="471" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Compuerta de abandono al mes 6: riesgo evitado frente a valor esperado perdido</title><desc id="d">Tabla de 20 000 sorteos: sin compuerta, 27,5 por ciento de los proyectos tienen valor presente neto negativo y el valor esperado es 746 mil; con umbral de 20 centros activos al mes 6 se detiene el 14,6 por ciento, se detienen por error 8,0 por ciento de proyectos buenos y el valor esperado baja a 679 mil.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1020" height="471" fill="#ffffff"/><rect x="10" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="112" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="112" dy="0">Umbral de centros</tspan></text><text x="112" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="112" dy="0">activos</tspan></text><rect x="220" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="312" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="312" dy="0">Proyectos detenidos</tspan></text><rect x="410" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="517" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="517" dy="0">Buenos detenidos por</tspan></text><text x="517" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="517" dy="0">error</tspan></text><rect x="630" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="722" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="722" dy="0">Malos que continúan</tspan></text><rect x="820" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="912" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="912" dy="0">Valor esperado</tspan></text><text x="912" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="912" dy="0">(miles)</tspan></text><rect x="10" y="56" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">sin compuerta</tspan></text><rect x="220" y="56" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="312" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="312" dy="0">0 %</tspan></text><rect x="410" y="56" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="517" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517" dy="0">—</tspan></text><rect x="630" y="56" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">27,5 %</tspan></text><rect x="820" y="56" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="912" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">746,4</tspan></text><rect x="10" y="106" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width