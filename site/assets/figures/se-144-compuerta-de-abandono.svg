<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Compuerta de abandono al mes 6: proyectos malos que continúan frente a buenos detenidos por error</title><desc id="d">Líneas según el umbral de centros activos al mes 6: los proyectos malos que continúan bajan de 27,5 por ciento sin compuerta a 9,7 con 30 centros, mientras los buenos detenidos por error suben de 0,0 con 10 a 32,4; con 20 centros son 20,8 y 8,0. El valor esperado cae de 746,4 a 397,0 miles.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Compuerta de abandono al mes 6: proyectos malos que continúan frente a buenos detenidos por error</tspan></text><circle cx="22" cy="51" r="6" fill="#946512" stroke="#946512" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Malos que continúan</tspan></text><rect x="207.26" y="45" width="12" height="12" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="227.26" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="227.26" dy="0">Buenos detenidos por error</tspan></text><line x1="71.08" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="387" x2="71.08" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" 