2f" stroke="#c0432f" stroke-width="2"/><text x="490.54" y="363.25" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="490.54" dy="0">1,7</tspan></text><rect x="618.86" y="321.5" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="624.36" y="316" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="624.36" dy="0">8,0</tspan></text><rect x="752.68" y="241.25" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="758.18" y="235.75" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="758.18" dy="0">18,7</tspan></text><rect x="886.5" y="138.5" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="133" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">32,4</tspan></text><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">En este modelo ninguna compuerta aumentó el valor esperado: lo que compra es reducir los proyectos malos que siguen (27,5 %</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">a 9,7 %) a cambio de detener algunos buenos. Con 30 % de la construcción antes de la compuerta el resultado es parecido.</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fijar el umbral exige decidir cuánto riesgo vale esa pérdida esperada.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
