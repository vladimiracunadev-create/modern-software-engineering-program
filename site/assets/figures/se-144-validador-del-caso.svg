<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 605" width="930" height="605" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Validador del caso de viabilidad: 12 de 16 mutaciones</title><desc id="d">Tabla de 16 mutaciones de un caso de viabilidad: el validador detecta las doce que rompen estructura, coherencia o trazabilidad y deja pasar cuatro: un número alterado de forma coherente, una exageración sin palabras prohibidas, una evidencia irrelevante y una probabilidad inflada.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="605" fill="#ffffff"/><rect x="10" y="12" width="644" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="332" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="332" dy="0">Tipo de defecto</tspan></text><rect x="660" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="722" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="722" dy="0">Detectadas</tspan></text><rect x="790" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="852" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="852" dy="0">Resultado</tspan></text><rect x="10" y="56" width="644" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="332" y="79.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="332" dy="0">Estructura y completitud: sin abandono, sin moneda, sin límites, sin ventana del umbral, sin</tspan></text><text x="332" y="95.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="332" dy="0">costos de operación</tspan></text><rect x="660" y="56" width="124" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">5 de 5</tspan></text><rect x="790" y="56" width="124" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">detecta</tspan></text><rect x="10" y="118" width="644" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="332" y="149.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="332" dy="0">Coherencia: rango invertido, percentiles desordenados, total que no cuadra</tspan></text><rect x="660" y="118" width="124" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">3 de 3</tspan></text><rect x="790" y="118" width="124" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">detecta</tspan></text><rect x="10" y="180" width="644" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="332" y="203.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="332" dy="0">Trazabilidad: evidencia inexistente, decisión sin responsable o sin fecha, lenguaje de</tspan></text><text x="332" y="219.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="332" dy="0">garantía</tspan></text><rect x="660" y="180" width="124" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">4 de 4</tspan></text><rect x="790" y="180" width="124" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">detecta</tspan></text><rect x="10" y="242" width="644" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="332" y="273.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="332" dy="0">Número alterado de forma coherente (construcción ×2)</tspan></text><rect x="660" y="242" width="124" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="273.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">0 de 1</tspan></text><rect x="790" y="242" width="124" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="273.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">sobrevive</tspan></text><rect x="10" y="304" width="644" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="332" y="335.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="332" dy="0">Exageración sin palabras prohibidas</tspan></text><rect x="660" y="304" width="124" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="335.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">0 de 1</tspan></text><rect x="790" y="304" width="124" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="335.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">sobrevive</tspan></text><rect x="10" y="366" width="644" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="332" y="397.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="332" dy="0">Evidencia existente pero irrelevante</tspan></text><rect x="660" y="366" width="124" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="397.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">0 de 1</tspan></text><rect x="790" y="366" width="124" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="397.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">sobrevive</tspan></text><rect x="10" y="428" width="644" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="332" y="459.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="332" dy="0">Probabilidad inflada pero coherente (0,82 a 0,99)</tspan></text><rect x="660" y="428" width="124" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="459.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">0 de 1</tspan></text><rect x="790" y="428" width="124" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="459.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">sobrevive</tspan></text><rect x="10" y="494" width="910" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="465" y="518.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Es el mismo reparto que el de un brief: la forma se comprueba, la verdad no. Para los cuatro supervivientes hace falta una</tspan></text><text x="465" y="535.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">segunda persona que recalcule el modelo y compare cada afirmación con su evidencia. El validador es una puerta de entrada</tspan></text><text x="465" y="552.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">a esa revisión, no su sustituto.</tspan></text><text x="465" y="591.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Código real ejecutado; idéntico en Windows y Ubuntu (WSL2).</tspan></text></svg>
