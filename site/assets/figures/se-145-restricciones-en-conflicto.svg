<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 405" width="970" height="405" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Restricciones de cinco interesados sobre cinco parámetros: intersección de intervalos</title><desc id="d">Tabla de cinco parámetros con cotas inferior y superior de distintos interesados: retención, cupo e intentos de acceso tienen intersección vacía; tiempo de respuesta admite 800 a 1500 milisegundos y la ventana de edición exactamente 48 horas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="405" fill="#ffffff"/><rect x="10" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="132" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="132" dy="0">Parámetro</tspan></text><rect x="260" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="382" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="382" dy="0">Cota inferior más alta</tspan></text><rect x="510" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="637" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="637" dy="0">Cota superior más baja</tspan></text><rect x="770" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="862" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="862" dy="0">Resultado</tspan></text><rect x="10" y="56" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Retención (días)</tspan></text><rect x="260" y="56" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="382" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382" dy="0">≥ 730 (Auditoría)</tspan></text><rect x="510" y="56" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="637" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="637" dy="0">≤ 365 (Privacidad)</tspan></text><rect x="770" y="56" width="184" height="44" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="862" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="862" dy="0">Conflicto</tspan></text><rect x="10" y="106" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Cupo por entrega (MB)</tspan></text><rect x="260" y="106" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="382" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382" dy="0">≥ 50 (Docencia)</tspan></text><rect x="510" y="106" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="637" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="637" dy="0">≤ 25 (Operaciones)</tspan></text><rect x="770" y="106" width="184" height="44" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="862" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="862" dy="0">Conflicto</tspan></text><rect x="10" y="156" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Intentos de acceso</tspan></text><rect x="260" y="156" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="382" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382" dy="0">≥ 8 (Estudiantes)</tspan></text><rect x="510" y="156" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="637" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="637" dy="0">≤ 5 (Seguridad)</tspan></text><rect x="770" y="156" width="184" height="44" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="862" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="862" dy="0">Conflicto</tspan></text><rect x="10" y="206" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Tiempo de respuesta (ms)</tspan></text><rect x="260" y="206" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="382" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382" dy="0">≥ 800 (Seguridad)</tspan></text><rect x="510" y="206" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="637" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="637" dy="0">≤ 1 500 (Estudiantes)</tspan></text><rect x="770" y="206" width="184" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="862" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="862" dy="0">Factible: 800–1 500</tspan></text><rect x="10" y="256" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Ventana de edición (h)</tspan></text><rect x="260" y="256" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="382" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382" dy="0">≥ 48 (Estudiantes)</tspan></text><rect x="510" y="256" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="637" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="637" dy="0">≤ 48 (Auditoría)</tspan></text><rect x="770" y="256" width="184" height="44" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="862" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="862" dy="0">Factible: solo 48</tspan></text><rect x="10" y="310" width="950" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="485" y="334.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Tres de cinco parámetros no tienen valor posible: ninguna negociación de redacción los arregla, hay que cambiar una de las dos</tspan></text><text x="485" y="351.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">cotas o separar casos (por ejemplo, archivo legal frente a datos de operación). El caso «solo 48 h» es factible pero frágil.</tspan></text><text x="485" y="391.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
