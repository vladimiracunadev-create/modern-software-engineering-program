<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 431" width="940" height="431" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Revisar con más personas: modelo independiente frente a defectos de dificultad desigual</title><desc id="d">Tabla de la fracción de 30 defectos hallada por 1 a 6 revisores: el modelo de independencia predice 39,1, 62,9, 77,4, 86,2, 91,6 y 94,9 por ciento; la simulación con dificultad desigual da 39,2, 55,8, 64,7, 70,4, 74,1 y 77,1.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="431" fill="#ffffff"/><rect x="10" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="77" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="77" dy="0">Revisores</tspan></text><rect x="150" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="287" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="287" dy="0">Predicción 1−(1−p)^k</tspan></text><rect x="430" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="577" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="577" dy="0">Simulación (5 000 corridas)</tspan></text><rect x="730" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="827" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="827" dy="0">Diferencia (puntos)</tspan></text><rect x="10" y="56" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="77" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="77" dy="0">1</tspan></text><rect x="150" y="56" width="274" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="287" dy="0">39,1 %</tspan></text><rect x="430" y="56" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">39,2 %</tspan></text><rect x="730" y="56" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">0,1</tspan></text><rect x="10" y="102" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="77" y="125.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="77" dy="0">2</tspan></text><rect x="150" y="102" width="274" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="287" dy="0">62,9 %</tspan></text><rect x="430" y="102" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">55,8 %</tspan></text><rect x="730" y="102" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">−7,1</tspan></text><rect x="10" y="148" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="77" y