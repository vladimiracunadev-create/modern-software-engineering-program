.385" y2="412" stroke="#5b7280" stroke-width="1.4"/><text x="689.385" y="428" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="689.385" dy="0">1 oct</tspan></text><line x1="892" y1="87" x2="892" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="407" x2="892" y2="412" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="428" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">31 dic</tspan></text><line x1="63.54" y1="407" x2="910" y2="407" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="247" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 247)">Veces que ocurre la hora ese día</text><text x="486.77" y="453" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="486.77" dy="0">Día de 2026</tspan></text><line x1="63.54" y1="247" x2="910" y2="247" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="69.54" y="241" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="69.54" dy="0">día normal: existe una vez</tspan></text><circle cx="633.722" cy="407" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="643.722" y="411.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="643.722" dy="0">6 sep</tspan></text><rect x="283.108" y="81.5" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="298.608" y="91.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="298.608" dy="0">4 abr</tspan></text><polygon points="228.492,400.675 234.542,411.95 222.442,411.95" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="238.492" y="411.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="238.492" dy="0">8 mar</tspan></text><rect x="10" y="467" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="491.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los otros 364 días la hora ocurre una vez. En UTC y a las 00:00 de Nueva York (365 días normales) no hay excepciones. El</tspan></text><text x="470" y="508.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">día calendario local de Santiago midió 24 h en 363 días, 25 h en uno y 23 h en otro. «Hasta la medianoche» y «dentro de 24</tspan></text><text x="470" y="525.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">horas» no son el mismo plazo esos dos días; el requisito debe fijar zona y regla.</tspan></text><text x="470" y="572.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Calculado con zoneinfo (CPython 3.12.9 en Windows y 3.12.3 en Ubuntu); el resultado depende de la versión de la base de zonas.</tspan></text></svg>
