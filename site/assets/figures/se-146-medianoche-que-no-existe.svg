<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 590" width="940" height="590" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una hora local de plazo en 2026: cuántos días existe, se repite o no existe</title><desc id="d">Puntos con los días de 2026 en que una hora local no ocurre exactamente una vez: la medianoche de Santiago no existe el 6 de septiembre, las 23:59 de Santiago se repiten el 4 de abril y las 02:30 de Nueva York no existen el 8 de marzo; los otros 364 días la hora ocurre una vez y en UTC o a la medianoche de Nueva York siempre.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="590" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Una hora local de plazo en 2026: cuántos días existe, se repite o no existe</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">00:00 en Santiago: no existe</tspan></text><rect x="275.12" y="45" width="12" height="12" fill="#946512" stroke="#946512" stroke-width="2"/><text x="295.12" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="295.12" dy="0">23:59 en Santiago: se repite</tspan></text><polygon points="540.24,44.1 546.84,56.4 533.64,56.4" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="554.24" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="554.24" dy="0">02:30 en Nueva York: no existe</tspan></text><l