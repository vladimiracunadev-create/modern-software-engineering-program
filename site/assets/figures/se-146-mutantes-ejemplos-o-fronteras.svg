<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 247" width="980" height="247" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mutantes de la regla de penalización detectados según la suite de pruebas</title><desc id="d">Barras con 12 mutantes de una regla de penalización por tardanza: tres ejemplos típicos detectan 4, diez casos en las fronteras detectan 10 y recorrer todo el dominio detecta 11; el mutante restante es equivalente.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="247" fill="#ffffff"/><text x="330" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">3 ejemplos típicos</tspan></text><rect x="340" y="16" width="160" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="508" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="508" dy="0">4 de 12</tspan></text><text x="330" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">10 casos en las fronteras</tspan></text><rect x="340" y="60" width="400" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="748" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="748" dy="0">10 de 12</tspan></text><text x="330" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Todo el dominio (12 800 casos)</tspan></text><rect x="340" y="104" width="440" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="788" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="788" dy="0">11 de 12</tspan></text><rect x="10" y="152" width="960" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="490" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">Los 6 mutantes que sobreviven a los ejemplos típicos son cambios de un minuto en los límites (60 → 59, 1440 → 1441) o la omisión</tspan></text><text x="490" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">de la prórroga. El único que sobrevive a todo el dominio, quitar max(0, …), es equivalente: no cambia ningún resultado.</tspan></text><text x="490" y="233.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
