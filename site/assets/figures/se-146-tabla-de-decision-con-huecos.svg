<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 425" width="970" height="425" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tabla de decisión de la penalización por entrega tardía: 24 combinaciones, 4 defectuosas</title><desc id="d">Tabla con cinco de las 24 combinaciones de estado, prórroga, reentrega y adaptación: dos no tienen regla aplicable y dos activan a la vez R2 y R5 con resultados distintos; las otras 20 combinaciones se resuelven con una sola regla.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="425" fill="#ffffff"/><rect x="10" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Combinación</tspan></text><rect x="390" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="462" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="462" dy="0">Reglas</tspan></text><text x="462" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="462" dy="0">aplicables</tspan></text><rect x="540" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="642" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="642" dy="0">Resultado</tspan></text><rect x="750" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="852" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="852" dy="0">Diagnóstico</tspan></text><rect x="10" y="56" width="374" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="83.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">En gracia, sin prórroga, sin adaptación</tspan></text><rect x="390" y="56" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">R2</tspan></text><rect x="540" y="56" width="204" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">−10 % de nota</tspan></text><rect x="750" y="56" width="204" height="48" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="852" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="852" dy="0">Una regla: correcto</tspan></text><rect x="10" y="110" width="374" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="129.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">En gracia, con prórroga, sin reentrega ni</tspan></text><text x="197" y="145.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">adaptación</tspan></text><rect x="390" y="110" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">ninguna</tspan></text><rect x="540" y="110" width="204" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">—</tspan></text><rect x="750" y="110" width="204" height="48" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="852" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="852" dy="0">Hueco: ¿qué pasa?</tspan></text><rect x="10" y="164" width="374" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="183.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">En gracia, con prórroga, con reentrega, sin</tspan></text><text x="197" y="199.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">adaptación</tspan></text><rect x="390" y="164" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">ninguna</tspan></text><rect x="540" y="164" width="204" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">—</tspan></text><rect x="750" y="164" width="204" height="48" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="852" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="852" dy="0">Hueco: ¿qué pasa?</tspan></text><rect x="10" y="218" width="374" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="245.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">En gracia, sin prórroga, con adaptación</tspan></text><rect x="390" y="218" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">R2 y R5</tspan></text><rect x="540" y="218" width="204" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">−10 % y sin penalización</tspan></text><rect x="750" y="218" width="204" height="48" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="852" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="852" dy="0">Conflicto de resultado</tspan></text><rect x="10" y="272" width="374" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="291.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">En gracia, sin prórroga, con reentrega y</tspan></text><text x="197" y="307.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">adaptación</tspan></text><rect x="390" y="272" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="299.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">R2 y R5</tspan></text><rect x="540" y="272" width="204" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="299.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">−10 % y sin penalización</tspan></text><rect x="750" y="272" width="204" height="48" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="852" y="299.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="852" dy="0">Conflicto de resultado</tspan></text><rect x="10" y="330" width="950" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="485" y="354.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Cinco reglas redactadas con sentido común dejan 2 de 24 combinaciones sin respuesta y 2 con respuestas contradictorias. Ninguna</tspan></text><text x="485" y="371.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">regla es incorrecta por separado: el defecto está en la combinación, y solo la enumeración lo muestra.</tspan></text><text x="485" y="411.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
