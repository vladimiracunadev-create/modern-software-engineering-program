<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 335" width="940" height="335" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cien mil latencias sintéticas: cada resumen cuenta una historia distinta</title><desc id="d">Barras con mediana 406, media 535, percentil 95 1023, percentil 99 4490 y máximo 7576 milisegundos de cien mil latencias sintéticas con una cola lenta del 2 por ciento; el umbral de 2000 ms lo cumplen la media y el p95 pero no el p99.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="335" fill="#ffffff"/><text x="250" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">Mediana (p50)</tspan></text><rect x="260" y="16" width="30.45" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="298.45" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="298.45" dy="0">406 ms</tspan></text><text x="250" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">Media</tspan></text><rect x="260" y="60" width="40.125" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="308.125" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="308.125" dy="0">535 ms</tspan></text><text x="250" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">Percentil 95</tspan></text><rect x="260" y="104" width="76.725" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="344.725" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="344.725" dy="0">1 023 ms</tspan></text><text x="250" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">Percentil 99</tspan></text><rect x="260" y="148" width="336.75" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="604.75" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="604.75" dy="0">4 490 ms</tspan></text><text x="250" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="250" dy="0">Máximo observado</tspan></text><rect x="260" y="192" width="568.2" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="836.2" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="836.2" dy="0">7 576 ms</tspan></text><rect x="10" y="240" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">«Responde en menos de 2 s» se cumple con la media y con p95 y se incumple con p99; el 2,1 % de las peticiones supera los 2</tspan></text><text x="470" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">s. Con muestras de 200 peticiones el p99 observado varió entre 1 303 y 5 711 ms (p5–p95 de 1 000 muestras).</tspan></text><text x="470" y="321.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
