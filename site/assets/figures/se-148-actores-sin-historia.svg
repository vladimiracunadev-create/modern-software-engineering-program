<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 467" width="980" height="467" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Historias por actor en un backlog sintético de 24 historias</title><desc id="d">Barras de historias por actor: Estudiante 7, Docente 6, Soporte 4, Administrador 3 aunque no figura en el catálogo, Coordinación 2, Sistema de correo 2, y Auditoría y Familia sin ninguna.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="467" fill="#ffffff"/><text x="370" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="370" dy="0">Estudiante</tspan></text><rect x="380" y="16" width="280" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="668" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="668" dy="0">7</tspan></text><text x="370" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="370" dy="0">Docente</tspan></text><rect x="380" y="60" width="240" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="628" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="628" dy="0">6</tspan></text><text x="370" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="370" dy="0">Soporte</tspan></text><rect x="380" y="104" width="160" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="548" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="548" dy="0">4</tspan></text><text x="370" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="370" dy="0">Administrador (no está en el catálogo)</tspan></text><rect x="380" y="148" width="120" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="508" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="508" dy="0">3</tspan></text><text x="370" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="370" dy="0">Coordinación</tspan></text><rect x="380" y="192" width="80" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="468" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="468" dy="0">2</tspan></text><text x="370" y="255.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="370" dy="0">Sistema de correo</tspan></text><rect x="380" y="236" width="80" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="468" y="255.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="468" dy="0">2</tspan></text><text x="370" y="299.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="370" dy="0">Auditoría (sin historias)</tspan></text><rect x="380" y="280" width="4" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="392" y="299.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="392" dy="0">0</tspan></text><text x="370" y="343.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="370" dy="0">Familia (sin historias)</tspan></text><rect x="380" y="324" width="4" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="392" y="343.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="392" dy="0">0</tspan></text><rect x="10" y="372" width="960" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="490" y="396.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">Tres historias nombran a un actor que no existe en el catálogo y dos actores del catálogo no tienen historia. Ambos defectos se</tspan></text><text x="490" y="413.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">ven al cruzar la lista de actores con el backlog; ninguno se ve leyendo las historias de una en una.</tspan></text><text x="490" y="453.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
