<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 271" width="920" height="271" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Historias completas disponibles al final de cada iteración (5 historias, 3 capas, 5 unidades por iteración)</title><desc id="d">Tabla de historias entregadas con valor visible tras cada una de tres iteraciones: cortar por capas da 0, 0 y 5; cortar por rebanadas verticales da 1, 3 y 5.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="920" height="271" fill="#ffffff"/><rect x="10" y="12" width="444" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="232" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="232" dy="0">Estrategia de corte</tspan></text><rect x="460" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="532" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="532" dy="0">Iteración 1</tspan></text><rect x="610" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="682" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="682" dy="0">Iteración 2</tspan></text><rect x="760" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="832" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="832" dy="0">Iteración 3</tspan></text><rect x="10" y="56" width="444" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Por capas (datos, reglas, interfaz)</tspan></text><rect x="460" y="56" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">0</tspan></text><rect x="610" y="56" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">0</tspan></text><rect x="760" y="56" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">5</tspan></text><rect x="10" y="114" width="444" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="143.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Por rebanadas verticales (una historia completa)</tspan></text><rect x="460" y="114" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">1</tspan></text><rect x="610" y="114" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">3</tspan></text><rect x="760" y="114" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">5</tspan></text><rect x="10" y="176" width="900" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="460" y="200.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="460" dy="0">Las dos estrategias cuestan lo mismo y terminan igual. La diferencia es cuándo se puede mostrar algo a quien lo usará y,</tspan></text><text x="460" y="217.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="460" dy="0">por tanto, cuándo se puede descubrir un error de requisito. Es un modelo aritmético, no una medición de equipos reales.</tspan></text><text x="460" y="257.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
