<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 534" width="940" height="534" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Historias completas disponibles al final de cada iteración (5 historias, 3 capas, 5 unidades por iteración)</title><desc id="d">Barras agrupadas con las historias entregadas con valor visible tras cada una de tres iteraciones: cortar por capas da 0, 0 y 5, y cortar por rebanadas verticales da 1, 3 y 5; las dos terminan igual pero solo la vertical muestra algo antes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="534" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Historias completas disponibles al final de cada iteración (5 historias, 3 capas, 5 unidades por iteración)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Por capas (datos, reglas, interfaz)</tspan></text><rect x="327.9" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="347.9" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="347.9" dy="0">Por rebanadas verticales (una historia completa)</tspan></text><line x1="63.54" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="375" x2="63.54" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">0</tspan></text><line x1="63.54" y1="319" x2="920" y2="319" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="319" x2="63.54" y2="319" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="323.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">1</tspan></text><line x1="63.54" y1="263" x2="920" y2="263" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="263" x2="63.54" y2="263" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="267.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">2</tspan></text><line x1="63.54" y1="207" x2="920" y2="207" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="207" x2="63.54" y2="207" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="211.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">3</tspan></text><line x1="63.54" y1="151" x2="920" y2="151" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="151" x2="63.54" y2="151" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="155.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">4</tspan></text><line x1="63.54" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="95" x2="63.54" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">5</tspan></text><line x1="63.54" y1="95" x2="63.54" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">historias completas</text><rect x="92.0887" y="373" width="112.195" height="2" rx="3" fill="#c0432f"/><text x="148.186" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="148.186" dy="0">0</tspan></text><rect x="208.283" y="319" width="112.195" height="56" rx="3" fill="#087f8c"/><text x="264.381" y="313" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="264.381" dy="0">1</tspan></text><text x="206.283" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="206.283" dy="0">Iteración 1</tspan></text><rect x="377.575" y="373" width="112.195" height="2" rx="3" fill="#c0432f"/><text x="433.673" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="433.673" dy="0">0</tspan></text><rect x="493.77" y="207" width="112.195" height="168" rx="3" fill="#087f8c"/><text x="549.867" y="201" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="549.867" dy="0">3</tspan></text><text x="491.77" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="491.77" dy="0">Iteración 2</tspan></text><rect x="663.062" y="95" width="112.195" height="280" rx="3" fill="#c0432f"/><text x="719.159" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="719.159" dy="0">5</tspan></text><rect x="779.257" y="95" width="112.195" height="280" rx="3" fill="#087f8c"/><text x="835.354" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="835.354" dy="0">5</tspan></text><text x="777.257" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777.257" dy="0">Iteración 3</tspan></text><rect x="10" y="427" width="920" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Las dos estrategias cuestan lo mismo y terminan igual. La diferencia es cuándo se puede mostrar algo a quien lo usará y,</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">por tanto, cuándo se puede descubrir un error de requisito. Es un modelo aritmético, no una medición de equipos reales.</tspan></text><text x="470" y="516.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
