<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 419" width="920" height="419" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Redondear una nota a entero: dos implementaciones razonables, tres notas de 61 que difieren</title><desc id="d">Tabla de redondeo de notas a entero: con 2,5, 4,5 y 6,5 la función round de Python da 2, 4 y 6 y la regla de mitad hacia arriba da 3, 5 y 7; con 1,5, 3,5 y 5,5 coinciden; de las 61 notas de 1,0 a 7,0 con un decimal difieren 3.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="920" height="419" fill="#ffffff"/><rect x="10" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="72" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="72" dy="0">Nota</tspan></text><rect x="140" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="277" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="277" dy="0">Implementación A</tspan></text><rect x="420" y="12" width="284" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="562" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="562" dy="0">Implementación B</tspan></text><rect x="710" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="807" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="807" dy="0">Resultado</tspan></text><rect x="10" y="56" width="124" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="72" y="78.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="72" dy="0">2,5</tspan></text><rect x="140" y="56" width="274" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="277" y="78.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="277" dy="0">2 (round de Python)</tspan></text><rect x="420" y="56" width="284" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="78.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">3 (mitad hacia arriba)</tspan></text><rect x="710" y="56" width="194" height="38" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="807" y="78.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="807" dy="0">Difiere</tspan></text><rect x="10" y="100" width="124" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="72" y="122.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="72" dy="0">4,5</tspan></text><rect x="140" y="100" width="274" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="277" y="122.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="277" dy="0">4</tspan></text><rect x="420" y="100" width="284" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="122.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">5</tspan></text><rect x="710" y="100" width="194" height="38" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="807" y="122.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="807" dy="0">Difiere</tspan></text><rect x="10" y="144" width="124" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="72" y="166.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="72" dy="0">6,5</tspan></text><rect x="140" y="144" width="274" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="277" y="166.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="277" dy="0">6</tspan></text><rect x="420" y="144" width="284" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="166.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">7</tspan></text><rect x="710" y="144" width="194" height="38" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="807" y="166.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="807" dy="0">Difiere</tspan></text><rect x="10" y="188" width="124" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="72" y="210.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="72" dy="0">3,5</tspan></text><rect x="140" y="188" width="274" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="277" y="210.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="277" dy="0">4</tspan></text><rect x="420" y="188" width="284" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="210.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">4</tspan></text><rect x="710" y="188" width="194" height="38" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="807" y="210.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="807" dy="0">Igual</tspan></text><rect x="10" y="232" width="124" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="72" y="254.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="72" dy="0">5,5</tspan></text><rect x="140" y="232" width="274" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="277" y="254.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="277" dy="0">6</tspan></text><rect x="420" y="232" width="284" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="254.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">6</tspan></text><rect x="710" y="232" width="194" height="38" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="807" y="254.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="807" dy="0">Igual</tspan></text><rect x="10" y="276" width="124" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="72" y="298.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="72" dy="0">1,5</tspan></text><rect x="140" y="276" width="274" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="277" y="298.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="277" dy="0">2</tspan></text><rect x="420" y="276" width="284" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="298.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">2</tspan></text><rect x="710" y="276" width="194" height="38" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="807" y="298.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="807" dy="0">Igual</tspan></text><rect x="10" y="324" width="900" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="460" y="348.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">Un criterio de aceptación con ejemplos como 6,4 → 6 y 6,6 → 7 lo cumplen ambas implementaciones. Solo un ejemplo en el</tspan></text><text x="460" y="365.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">empate (6,5) distingue la regla. Entre 61 notas, 3 dependen de ese ejemplo.</tspan></text><text x="460" y="405.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">Calculado con round y decimal.ROUND_HALF_UP; idéntico en Windows y Ubuntu.</tspan></text></svg>
