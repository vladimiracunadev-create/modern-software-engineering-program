<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 371" width="930" height="371" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Decidir por mayoría entre alternativas: ciclos y reglas que discrepan</title><desc id="d">Tabla de frecuencia de ciclos de mayoría: con 3 votantes y 3 alternativas ocurren en 12 de 216 perfiles, 5,56 por ciento; pluralidad y Borda discrepan en 25 por ciento; con 5 votantes sube a 6,87 por ciento y con 4 alternativas el 13,99 por ciento no tiene ganador de Condorcet.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="371" fill="#ffffff"/><rect x="10" y="12" width="604" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="312" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="312" dy="0">Situación</tspan></text><rect x="620" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="692" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="692" dy="0">Casos</tspan></text><rect x="770" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="842" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="842" dy="0">Frecuencia</tspan></text><rect x="10" y="56" width="604" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="312" y="83.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="312" dy="0">3 votantes, 3 alternativas: perfiles con ciclo de mayoría</tspan></text><rect x="620" y="56" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">12 de 216</tspan></text><rect x="770" y="56" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">5,56 %</tspan></text><rect x="10" y="110" width="604" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="312" y="137.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="312" dy="0">3 votantes, 3 alternativas: pluralidad y Borda eligen distinto</tspan></text><rect x="620" y="110" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">54 de 216</tspan></text><rect x="770" y="110" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">25,0 %</tspan></text><rect x="10" y="164" width="604" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="312" y="191.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="312" dy="0">5 votantes, 3 alternativas (100 000 perfiles al azar): ciclo</tspan></text><rect x="620" y="164" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">—</tspan></text><rect x="770" y="164" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">6,87 %</tspan></text><rect x="10" y="218" width="604" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="312" y="245.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="312" dy="0">5 votantes, 4 alternativas (100 000 perfiles): sin ganador de Condorcet</tspan></text><rect x="620" y="218" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">—</tspan></text><rect x="770" y="218" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">13,99 %</tspan></text><rect x="10" y="276" width="910" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="465" y="300.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Que A venza a B, B a C y C a A no es un error de cómputo: es una propiedad de las preferencias agregadas. Una negociación</tspan></text><text x="465" y="317.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">que pide «lo que apoye la mayoría» puede no tener respuesta, o tener una distinta según el método.</tspan></text><text x="465" y="357.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Perfiles de preferencias sintéticos con todas las permutaciones equiprobables (semillas 1502 y 1503); supuesto de cultura imparcial.</tspan></text></svg>
