"465" y="268.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">De 3 628 800 ordenaciones de 10 requisitos solo 1 000 respetan las dependencias. Con presupuesto 12, el voraz ignora el</tspan></text><text x="465" y="285.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">grafo y promete valor 33 (A, C, E, F, H) que no puede entregarse; el mejor conjunto cerrado vale 27 (A, B, C, J).</tspan></text><text x="465" y="325.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
