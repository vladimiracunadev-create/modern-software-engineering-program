álisis de impacto. La trazabilidad útil es la mínima que responde preguntas concretas.</tspan></text><text x="490" y="279.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
