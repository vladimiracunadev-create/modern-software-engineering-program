<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 293" width="980" height="293" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Matriz de trazabilidad sintética (40 requisitos, 60 pruebas, 30 módulos): densidad de enlaces e impacto</title><desc id="d">Tabla con tres densidades de enlaces entre requisitos, pruebas y módulos: con 123 enlaces hay 11 requisitos sin prueba y 27 pruebas sin requisito y el impacto medio de un cambio es 2,8 elementos; con 382 enlaces no hay huérfanos pero el impacto medio es 17,1 y el máximo 31.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="293" fill="#ffffff"/><rect x="10" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="157" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="157" dy="0">Probabilidad de enlace (req–prueba</tspan></text><text x="157" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="157" dy="0">/ prueba–módulo)</tspan></text><rect x="310" y="12" width="104" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="362" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="362" dy="0">Enlaces</tspan></text><rect x="420" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="492" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="492" dy="0">Requisitos sin</tspan></text><text x="492" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="492" dy="0">prueba</tspan></text><rect x="570" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="642" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="642" dy="0">Pruebas sin</tspan></text><text x="642" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="642" dy="0">requisito</tspan></text><rect x="720" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="777" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="777" dy="0">Impacto</tspan></text><text x="777" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="777" dy="0">medio</tspan></text><rect x="840" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="902" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="902" dy="0">Impacto</tspan></text><text x="902" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="902" dy="0">máximo</tspan></text><rect x="10" y="56" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">2 % / 4 %</tspan></text><rect x="310" y="56" width="104" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">123</tspan></text><rect x="420" y="56" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="492" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">11</tspan></text><rect x="570" y="56" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b728