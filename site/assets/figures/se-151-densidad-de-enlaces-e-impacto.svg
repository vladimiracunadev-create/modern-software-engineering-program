<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 550" width="940" height="550" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Matriz de trazabilidad sintética (40 requisitos, 60 pruebas, 30 módulos): densidad de enlaces e impacto</title><desc id="d">Barras agrupadas con tres densidades de enlaces entre requisitos, pruebas y módulos: al pasar de 123 a 382 enlaces los requisitos sin prueba bajan de 11 a 0 y las pruebas sin requisito de 27 a 0, pero el impacto medio de un cambio sube de 2,8 a 17,1 elementos y el máximo de 9 a 31.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="550" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Matriz de trazabilidad sintética (40 requisitos, 60 pruebas, 30 módulos): densidad de enlaces e impacto</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Requisitos sin prueba</tspan></text><rect x="222.34" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="242.34" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="242.34" dy="0">Pruebas sin requisito</tspan></text><rect x="428.68" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="448.68" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="448.68" dy="0">Impacto medio de un cambio</tspan></text><rect x="672.72" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="692.72" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="692.72" dy="0">Impacto máximo</tspan></text><line x1="71.08" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="375" x2="71.08" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="305" x2="920" y2="305" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="305" x2="71.08" y2="305" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="309.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="235" x2="920" y2="235" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="235" x2="71.08" y2="235" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="239.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="165" x2="920" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="165" x2="71.08" y2="165" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="169.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">30</tspan></text><line x1="71.08" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="95" x2="71.08" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">40</tspan></text><line x1="71.08" y1="95" x2="71.08" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">requisitos, pruebas o elementos afectados</text><rect x="99.3773" y="298" width="53.5947" height="77" rx="3" fill="#c0432f"/><text x="126.175" y="292" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="126.175" dy="0">11</tspan></text><rect x="156.972" y="186" width="53.5947" height="189" rx="3" fill="#946512"/><text x="183.769" y="180" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="183.769" dy="0">27</tspan></text><rect x="214.567" y="355.4" width="53.5947" height="19.6" rx="3" fill="#087f8c"/><text x="241.364" y="349.4" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="241.364" dy="0">2,8</tspan></text><rect x="272.161" y="312" width="53.5947" height="63" rx="3" fill="#102a43"/><text x="298.959" y="306" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="298.959" dy="0">9</tspan></text><text x="212.567" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="212.567" dy="0">123 enlaces (2 % / 4 %)</tspan></text><rect x="382.351" y="347" width="53.5947" height="28" rx="3" fill="#c0432f"/><text x="409.148" y="341" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="409.148" dy="0">4</tspan></text><rect x="439.945" y="277" width="53.5947" height="98" rx="3" fill="#946512"/><text x="466.743" y="271" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="466.743" dy="0">14</tspan></text><rect x="497.54" y="336.5" width="53.5947" height="38.5" rx="3" fill="#087f8c"/><text x="524.337" y="330.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="524.337" dy="0">5,5</tspan></text><rect x="555.135" y="270" width="53.5947" height="105" rx="3" fill="#102a43"/><text x="581.932" y="264" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="581.932" dy="0">15</tspan></text><text x="495.54" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="495.54" dy="0">193 enlaces (4 % / 6 %)</tspan></text><rect x="665.324" y="373" width="53.5947" height="2" rx="3" fill="#c0432f"/><text x="692.121" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="692.121" dy="0">0</tspan></text><rect x="722.919" y="373" width="53.5947" height="2" rx="3" fill="#946512"/><text x="749.716" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="749.716" dy="0">0</tspan></text><rect x="780.513" y="255.3" width="53.5947" height="119.7" rx="3" fill="#087f8c"/><text x="807.311" y="249.3" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="807.311" dy="0">17,1</tspan></text><rect x="838.108" y="158" width="53.5947" height="217" rx="3" fill="#102a43"/><text x="864.905" y="152" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="864.905" dy="0">31</tspan></text><text x="778.513" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="778.513" dy="0">382 enlaces (8 % / 10 %)</tspan></text><rect x="10" y="427" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La probabilidad de enlace es requisito–prueba / prueba–módulo. Más enlaces eliminan huérfanos pero también hacen que casi</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cualquier cambio toque casi todo: un enlace por si acaso vuelve inútil el análisis de impacto. La trazabilidad útil es la</tspan></text><text x="470" y="485.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">mínima que responde preguntas concretas.</tspan></text><text x="470" y="532.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
