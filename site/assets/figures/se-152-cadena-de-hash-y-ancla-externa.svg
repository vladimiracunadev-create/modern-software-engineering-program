<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 385" width="940" height="385" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Registro encadenado con SHA-256: qué manipulaciones detecta la verificación</title><desc id="d">Tabla de cinco manipulaciones de un registro de auditoría de 100 entradas encadenadas por hash: modificar y borrar una entrada se detectan; truncar el final y reconstruir toda la cadena no; con un hash final guardado fuera de la cadena la reconstrucción se detecta.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="385" fill="#ffffff"/><rect x="10" y="12" width="514" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="267" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="267" dy="0">Manipulación</tspan></text><rect x="530" y="12" width="394" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="727" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="727" dy="0">¿La verificación la detecta?</tspan></text><rect x="10" y="56" width="514" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="267" dy="0">Modificar la entrada 40</tspan></text><rect x="530" y="56" width="394" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="727" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="727" dy="0">Sí, en la 40</tspan></text><rect x="10" y="102" width="514" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="125.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="267" dy="0">Borrar la entrada 40</tspan></text><rect x="530" y="102" width="394" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="727" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="727" dy="0">Sí, en la 40</tspan></text><rect x="10" y="148" width="514" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="171.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="267" dy="0">Truncar el final (quedan 70 de 100)</tspan></text><rect x="530" y="148" width="394" height="40" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="727" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="727" dy="0">No</tspan></text><rect x="10" y="194" width="514" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="217.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="267" dy="0">Reconstruir toda la cadena sin la entrada 40</tspan></text><rect x="530" y="194" width="394" height="40" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="727" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="727" dy="0">No</tspan></text><rect x="10" y="240" width="514" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="263.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="267" dy="0">Reconstruir y comparar con el último hash guardado fuera</tspan></text><rect x="530" y="240" width="394" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="727" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="727" dy="0">Sí: el hash final no coincide</tspan></text><rect x="10" y="290" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="314.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">La cadena prueba continuidad, no autoría ni totalidad. «Registro inalterable» como requisito debe decir qué ancla externa</tspan></text><text x="470" y="331.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">(almacén de solo anexar, sello de tiempo, copia en otro dominio) hace detectables el truncado y la reconstrucción.</tspan></text><text x="470" y="371.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
