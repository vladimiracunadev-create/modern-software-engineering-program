<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 554" width="940" height="554" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Alcance transitivo de un cambio en 30 requisitos sintéticos según la densidad de dependencias</title><desc id="d">Líneas con el alcance de un cambio según las aristas de dependencia entre 30 requisitos: de 18 a 76 aristas los dependientes medios suben de 0,7 a 4,9, el máximo de 4 a 17 y los cambios sin dependientes bajan de 17 a 6 de 30.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="554" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Alcance transitivo de un cambio en 30 requisitos sintéticos según la densidad de dependencias</tspan></text><circle cx="22" cy="51" r="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Dependientes medios</tspan></text><rect x="207.26" y="45" width="12" height="12" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="227.26" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="227.26" dy="0">Máximo de dependientes</tspan></text><polygon points="427.14,44.1 433.74,56.4 420.54,56.4" fill="#946512" stroke="#946512" stroke-width="2"/><text x="441.14" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="441.14" dy="0">Cambios sin dependientes (de 30)</tspan></text><line x1="71.08" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><l