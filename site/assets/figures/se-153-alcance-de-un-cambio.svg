<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 293" width="940" height="293" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Alcance transitivo de un cambio en 30 requisitos sintéticos según la densidad de dependencias</title><desc id="d">Tabla de tres densidades de dependencias entre 30 requisitos: con 18 aristas un cambio afecta en media a 0,7 requisitos dependientes y como máximo a 4; con 76 aristas, a 4,9 y como máximo a 17; los cambios sin dependientes bajan de 17 a 6.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="293" fill="#ffffff"/><rect x="10" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="132" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="132" dy="0">Probabilidad de dependencia</tspan></text><rect x="260" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="317" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="317" dy="0">Aristas</tspan></text><rect x="380" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="477" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="477" dy="0">Dependientes medios</tspan></text><rect x="580" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="642" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="642" dy="0">Máximo</tspan></text><rect x="710" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="817" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="817" dy="0">Cambios sin dependientes</tspan></text><rect x="10" y="56" width="244" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">4 %</tspan></text><rect x="260" y="56" width="114" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="317" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="317" dy="0">18</tspan></text><rect x="380" y="56" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">0,7</tspan></text><rect x="580" y="56" width="124" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">4</tspan></text><rect x="710" y="56" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">17 de 30</tspan></text><rect x="10" y="102" width="244" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="125.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">8 %</tspan></text><rect x="260" y="102" width="114" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="317" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="317" dy="0">38</tspan></text><rect x="380" y="102" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">3,2</tspan></text><rect x="580" y="102" width="124" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">13</tspan></text><rect x="710" y="102" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">8 de 30</tspan></text><rect x="10" y="148" width="244" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="171.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">15 %</tspan></text><rect x="260" y="148" width="114" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="317" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="317" dy="0">76</tspan></text><rect x="380" y="148" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">4,9</tspan></text><rect x="580" y="148" width="124" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">17</tspan></text><rect x="710" y="148" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">6 de 30</tspan></text><rect x="10" y="198" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="222.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El coste de un cambio depende más de su posición en el grafo que de su tamaño textual: un requisito raíz con 17</tspan></text><text x="470" y="239.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">dependientes transitivos es una decisión de línea base; uno sin dependientes es un ajuste local.</tspan></text><text x="470" y="279.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
