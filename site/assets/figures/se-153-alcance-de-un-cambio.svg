text x="89.08" y="316" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="89.08" dy="0">4</tspan></text><rect x="360.449" y="186.5" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="365.949" y="181" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="365.949" dy="0">13</tspan></text><rect x="886.5" y="126.5" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="121" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">17</tspan></text><polyline points="89.08,132 365.949,267 892,297" fill="none" stroke="#946512" stroke-width="2.4"/><polygon points="89.08,125.675 95.13,136.95 83.03,136.95" fill="#946512" stroke="#946512" stroke-width="2"/><text x="89.08" y="121" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="89.08" dy="0">17</tspan></text><polygon points="365.949,260.675 371.999,271.95 359.899,271.95" fill="#946512" stroke="#946512" stroke-width="2"/><text x="365.949" y="256" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="365.949" dy="0">8</tspan></text><polygon points="892,290.675 898.05,301.95 885.95,301.95" fill="#946512" stroke="#946512" stroke-width="2"/><text x="892" y="286" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">6</tspan></text><rect x="10" y="447" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El coste de un cambio depende más de su posición en el grafo que de su tamaño textual: un requisito raíz con 17</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">dependientes transitivos es una decisión de línea base; uno sin dependientes es un ajuste local.</tspan></text><text x="470" y="536.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
