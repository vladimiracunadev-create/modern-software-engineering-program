<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 339" width="950" height="339" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Comité de cambios: espera de una solicitud según la cadencia (6 solicitudes por semana)</title><desc id="d">Tabla de la espera de solicitudes de cambio con llegadas de 6 por semana: reunirse cada 0,2 semanas da espera media 0,10 y p95 0,19; cada semana 0,50 y 0,95; cada 2 semanas 0,99 y 1,90; cada 4 semanas 1,97 y 3,79, con 23,9 solicitudes por reunión.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="339" fill="#ffffff"/><rect x="10" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="132" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="132" dy="0">Cadencia</tspan></text><rect x="260" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="382" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="382" dy="0">Espera media (semanas)</tspan></text><rect x="510" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="622" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="622" dy="0">Espera p95 (semanas)</tspan></text><rect x="740" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="837" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="837" dy="0">Solicitudes por</tspan></text><text x="837" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="837" dy="0">reunión</tspan></text><rect x="10" y="56" width="244" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Cada 0,2 semanas</tspan></text><rect x="260" y="56" width="244" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="382" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382" dy="0">0,10</tspan></text><rect x="510" y="56" width="224" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">0,19</tspan></text><rect x="740" y="56" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">1,2</tspan></text><rect x="10" y="102" width="244" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="125.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Cada semana</tspan></text><rect x="260" y="102" width="244" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="382" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382" dy="0">0,50</tspan></text><rect x="510" y="102" width="224" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">0,95</tspan></text><rect x="740" y="102" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">6,0</tspan></text><rect x="10" y="148" width="244" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="171.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Cada 2 semanas</tspan></text><rect x="260" y="148" width="244" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="382" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382" dy="0">0,99</tspan></text><rect x="510" y="148" width="224" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">1,90</tspan></text><rect x="740" y="148" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">12,0</tspan></text><rect x="10" y="194" width="244" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="217.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Cada 4 semanas</tspan></text><rect x="260" y="194" width="244" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="382" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382" dy="0">1,97</tspan></text><rect x="510" y="194" width="224" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">3,79</tspan></text><rect x="740" y="194" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">23,9</tspan></text><rect x="10" y="244" width="930" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="475" y="268.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">La espera media es la mitad del periodo, y la carga por reunión crece con él: a las cuatro semanas el comité revisa 24</tspan></text><text x="475" y="285.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">solicitudes de una vez. La cadencia es una decisión de costo y estabilidad, no una convención de calendario.</tspan></text><text x="475" y="325.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Llegadas de Poisson sintéticas con semilla 1530; la tasa de 6 por semana es un supuesto del autor.</tspan></text></svg>
