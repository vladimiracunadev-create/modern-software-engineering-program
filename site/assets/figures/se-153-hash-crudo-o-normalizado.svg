<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 501" width="940" height="501" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Hash de una línea base: texto crudo frente a texto normalizado (6 ediciones)</title><desc id="d">Mapa de calor con seis ediciones de una tabla de requisitos y si cambian el hash: cuatro ediciones de formato (espacios, CRLF, columnas, tabulador) cambian el hash del texto crudo pero no el normalizado, y cambiar 30 s por 60 s o el estado cambian ambos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="501" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Hash de una línea base: texto crudo frente a texto normalizado (6 ediciones)</tspan></text><text x="458" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="458" dy="0">Hash del texto crudo</tspan></text><text x="766" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="766" dy="0">Hash normalizado</tspan></text><text x="294" y="98.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="294" dy="0">Espacio al final de cada fila</tspan></text><text x="294" y="142.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="294" dy="0">Saltos de línea CRLF</tspan></text><text x="294" y="186.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="294" dy="0">Columnas realineadas</tspan></text><text x="294" y="230.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="294" dy="0">Tabulador en lugar de espacio</tspan></text><text x="294" y="274.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="294" dy="0">30 s → 60 s</tspan></text><text x="294" y="318.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="294" dy="0">Estado aprobado → borrador</tspan></text><rect x="305.5" y="73.5" width="305" height="41" rx="4" fill="#c0432f" stroke="#102a43" stroke-width="3"/><text x="458" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="458" dy="0">cambia</tspan></text><rect x="613.5" y="73.5" width="305" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="766" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="766" dy="0">no cambia</tspan></text><rect x="305.5" y="117.5" width="305" height="41" rx="4" fill="#c0432f" stroke="#102a43" stroke-width="3"/><text x="458" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="458" dy="0">cambia</tspan></text><rect x="613.5" y="117.5" width="305" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="766" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="766" dy="0">no cambia</tspan></text><rect x="305.5" y="161.5" width="305" height="41" rx="4" fill="#c0432f" stroke="#102a43" stroke-width="3"/><text x="458" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="458" dy="0">cambia</tspan></text><rect x="613.5" y="161.5" width="305" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="766" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="766" dy="0">no cambia</tspan></text><rect x="305.5" y="205.5" width="305" height="41" rx="4" fill="#c0432f" stroke="#102a43" stroke-width="3"/><text x="458" y="230.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="458" dy="0">cambia</tspan></text><rect x="613.5" y="205.5" width="305" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="766" y="230.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="766" dy="0">no cambia</tspan></text><rect x="305.5" y="249.5" width="305" height="41" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="458" y="274.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="458" dy="0">cambia</tspan></text><rect x="613.5" y="249.5" width="305" height="41" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="766" y="274.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="766" dy="0">cambia</tspan></text><rect x="305.5" y="293.5" width="305" height="41" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="458" y="318.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="458" dy="0">cambia</tspan></text><rect x="613.5" y="293.5" width="305" height="41" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="766" y="318.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="766" dy="0">cambia</tspan></text><text x="304" y="362" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="304" dy="0">no cambia</tspan></text><rect x="379.86" y="350" width="30.5" height="14" fill="#fbe4de"/><rect x="409.86" y="350" width="30.5" height="14" fill="#f3cdc5"/><rect x="439.86" y="350" width="30.5" height="14" fill="#eab6ac"/><rect x="469.86" y="350" width="30.5" height="14" fill="#e29f93"/><rect x="499.86" y="350" width="30.5" height="14" fill="#d9887a"/><rect x="529.86" y="350" width="30.5" height="14" fill="#d17161"/><rect x="559.86" y="350" width="30.5" height="14" fill="#c85a48"/><rect x="589.86" y="350" width="30.5" height="14" fill="#c0432f"/><text x="627.86" y="362" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="627.86" dy="0">cambia</tspan></text><text x="681.1" y="362" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="681.1" dy="0">más oscuro = mayor (cambia el hash)</tspan></text><rect x="10" y="378" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="402.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El contorno marca las falsas alarmas del hash crudo: cuatro cambios de formato. Un hash crudo da falsas alarmas de cambio;</tspan></text><text x="470" y="419.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">uno normalizado detecta cambios de contenido, pero también puede ocultar uno que importe (un espacio dentro de un</tspan></text><text x="470" y="436.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">identificador). La normalización es parte del contrato de la línea base y debe escribirse.</tspan></text><text x="470" y="483.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
