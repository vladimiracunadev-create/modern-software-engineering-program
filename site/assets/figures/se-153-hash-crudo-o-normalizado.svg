<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 435" width="930" height="435" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Hash de una línea base: texto crudo frente a texto normalizado (6 ediciones)</title><desc id="d">Tabla con seis ediciones de una tabla de requisitos: cuatro de formato cambian el hash del texto crudo pero no el normalizado; cambiar 30 s por 60 s y cambiar el estado cambian ambos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="435" fill="#ffffff"/><rect x="10" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Edición</tspan></text><rect x="390" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="522" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="522" dy="0">Hash del texto crudo</tspan></text><rect x="660" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="787" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="787" dy="0">Hash normalizado</tspan></text><rect x="10" y="56" width="374" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="78.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Espacio al final de cada fila</tspan></text><rect x="390" y="56" width="264" height="38" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="522" y="78.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="522" dy="0">Cambia</tspan></text><rect x="660" y="56" width="254" height="38" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="787" y="78.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="787" dy="0">No cambia</tspan></text><rect x="10" y="100" width="374" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="122.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Saltos de línea CRLF</tspan></text><rect x="390" y="100" width="264" height="38" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="522" y="122.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="522" dy="0">Cambia</tspan></text><rect x="660" y="100" width="254" height="38" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="787" y="122.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="787" dy="0">No cambia</tspan></text><rect x="10" y="144" width="374" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="166.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Columnas realineadas</tspan></text><rect x="390" y="144" width="264" height="38" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="522" y="166.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="522" dy="0">Cambia</tspan></text><rect x="660" y="144" width="254" height="38" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="787" y="166.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="787" dy="0">No cambia</tspan></text><rect x="10" y="188" width="374" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="210.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Tabulador en lugar de espacio</tspan></text><rect x="390" y="188" width="264" height="38" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="522" y="210.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="522" dy="0">Cambia</tspan></text><rect x="660" y="188" width="254" height="38" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="787" y="210.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="787" dy="0">No cambia</tspan></text><rect x="10" y="232" width="374" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="254.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">30 s → 60 s</tspan></text><rect x="390" y="232" width="264" height="38" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="522" y="254.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="522" dy="0">Cambia</tspan></text><rect x="660" y="232" width="254" height="38" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="787" y="254.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="787" dy="0">Cambia</tspan></text><rect x="10" y="276" width="374" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="298.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Estado aprobado → borrador</tspan></text><rect x="390" y="276" width="264" height="38" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="522" y="298.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="522" dy="0">Cambia</tspan></text><rect x="660" y="276" width="254" height="38" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="787" y="298.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="787" dy="0">Cambia</tspan></text><rect x="10" y="324" width="910" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="348.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">Un hash crudo da falsas alarmas de cambio; uno normalizado detecta cambios de contenido, pero también puede ocultar uno</tspan></text><text x="465" y="365.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">que importe (un espacio dentro de un identificador). La normalización es parte del contrato de la línea base y debe</tspan></text><text x="465" y="382.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">escribirse.</tspan></text><text x="465" y="421.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
