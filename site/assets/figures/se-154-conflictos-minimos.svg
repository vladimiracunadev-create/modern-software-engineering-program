<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 495" width="940" height="495" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Doce requisitos y seis conflictos mínimos: ninguno es un par de contradicciones evidentes</title><desc id="d">Tabla de los seis subconjuntos mínimos insatisfacibles de doce requisitos sobre seis variables: dos de tres requisitos, dos de cuatro y dos de cinco; el máximo subconjunto compatible tiene diez.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="495" fill="#ffffff"/><rect x="10" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="107" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="107" dy="0">Subconjunto mínimo</tspan></text><rect x="210" y="12" width="94" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="257" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="257" dy="0">Tamaño</tspan></text><rect x="310" y="12" width="614" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="617" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="617" dy="0">Por qué no pueden cumplirse a la vez</tspan></text><rect x="10" y="56" width="194" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="83.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">Q4, Q8, Q9</tspan></text><rect x="210" y="56" width="94" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="257" dy="0">3</tspan></text><rect x="310" y="56" width="614" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="617" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">Sin conexión no sincroniza; sincroniza siempre; opera sin conexión</tspan></text><rect x="10" y="110" width="194" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="137.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">Q5, Q6, Q7</tspan></text><rect x="210" y="110" width="94" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="257" dy="0">3</tspan></text><rect x="310" y="110" width="614" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="617" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">Retiene 30 días; borra al salir; borrar al salir impide retener</tspan></text><rect x="10" y="164" width="194" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="191.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">Q1, Q6, Q7, Q12</tspan></text><rect x="210" y="164" width="94" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="257" dy="0">4</tspan></text><rect x="310" y="164" width="614" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="617" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">Guarda automático; borra al salir; borrar impide retener; guardar implica retener</tspan></text><rect x="10" y="218" width="194" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="245.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">Q2, Q4, Q9, Q10</tspan></text><rect x="210" y="218" width="94" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="257" dy="0">4</tspan></text><rect x="310" y="218" width="614" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="617" y="237.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">Cifrado; sin conexión no sincroniza; opera sin conexión; cifrado implica</tspan></text><text x="617" y="253.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">sincronizar</tspan></text><rect x="10" y="272" width="194" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="299.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">Q3, Q6, Q7, Q9, Q12</tspan></text><rect x="210" y="272" width="94" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="299.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="257" dy="0">5</tspan></text><rect x="310" y="272" width="614" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="617" y="291.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">Opera sin conexión; sin conexión guarda; guardar implica retener; borra al salir;</tspan></text><text x="617" y="307.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">borrar impide retener</tspan></text><rect x="10" y="326" width="194" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="353.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">Q4, Q5, Q9, Q10, Q11</tspan></text><rect x="210" y="326" width="94" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="353.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="257" dy="0">5</tspan></text><rect x="310" y="326" width="614" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="617" y="345.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">Opera sin conexión y no sincroniza; retiene; retener implica cifrar; cifrar</tspan></text><text x="617" y="361.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">implica sincronizar</tspan></text><rect x="10" y="384" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="408.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Quitar los requisitos Q9 y Q7 resuelve los seis conflictos, y el máximo compatible es 10 de 12. Pero ningún par de ellos se</tspan></text><text x="470" y="425.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">contradice por sí solo: una revisión que compare requisitos de dos en dos no los verá. Es lógica proposicional exhaustiva,</tspan></text><text x="470" y="442.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">no una herramienta de producción.</tspan></text><text x="470" y="481.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
