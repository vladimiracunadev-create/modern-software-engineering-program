<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 335" width="940" height="335" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Lecturas posibles de una frase con y/o sin paréntesis (números de Catalan)</title><desc id="d">Barras con el número de formas de agrupar una frase con conectores y y o: 2 con tres operandos, 5 con cuatro, 14 con cinco, 42 con seis y 132 con siete; la frase A y B o C se lee de dos maneras que difieren en 2 de 8 estados.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="335" fill="#ffffff"/><text x="300" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">3 operandos (A y B o C)</tspan></text><rect x="310" y="16" width="8" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="326" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="326" dy="0">2 lecturas</tspan></text><text x="300" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">4 operandos</tspan></text><rect x="310" y="60" width="20" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="338" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="338" dy="0">5</tspan></text><text x="300" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">5 operandos</tspan></text><rect x="310" y="104" width="56" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="374" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="374" dy="0">14</tspan></text><text x="300" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">6 operandos</tspan></text><rect x="310" y="148" width="168" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="486" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="486" dy="0">42</tspan></text><text x="300" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">7 operandos</tspan></text><rect x="310" y="192" width="528" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="846" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="846" dy="0">132</tspan></text><rect x="10" y="240" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">«A y B o C» tiene dos lecturas que dan resultados distintos en 2 de los 8 estados. Con cinco operandos mezclados (A y B o C</tspan></text><text x="470" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">y D o E) hay 14 lecturas y 10 funciones lógicas distintas: la ambigüedad estructural no se resuelve «leyendo con cuidado».</tspan></text><text x="470" y="321.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Cálculo exacto; idéntico en Windows y Ubuntu.</tspan></text></svg>
