<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 271" width="940" height="271" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Percentil 95 de 400 peticiones a un servidor local: tres corridas por escenario</title><desc id="d">Tabla de tiempos de respuesta de un servidor HTTP en el mismo equipo: con un cliente el percentil 95 fue de 1,88 a 2,02 ms en Windows y de 1,47 a 1,71 ms en Ubuntu; con ocho clientes, de 5,56 a 6,04 y de 9,69 a 10,89.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="271" fill="#ffffff"/><rect x="10" y="12" width="414" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="217" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="217" dy="0">Escenario (3 corridas de 400 peticiones)</tspan></text><rect x="430" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="547" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="547" dy="0">p95 en Windows 11</tspan></text><rect x="670" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="797" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="797" dy="0">p95 en Ubuntu (WSL2)</tspan></text><rect x="10" y="56" width="414" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">1 cliente secuencial</tspan></text><rect x="430" y="56" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="547" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547" dy="0">1,88–2,02 ms</tspan></text><rect x="670" y="56" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">1,47–1,71 ms</tspan></text><rect x="10" y="106" width="414" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">8 clientes concurrentes</tspan></text><rect x="430" y="106" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="547" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547" dy="0">5,56–6,04 ms</tspan></text><rect x="670" y="106" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">9,69–10,89 ms</tspan></text><rect x="10" y="160" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="184.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Un requisito reparado («p95 ≤ 800 ms con 8 clientes») se verifica con un procedimiento, no con un adjetivo. Estas cifras</tspan></text><text x="470" y="201.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">son del bucle local de un solo equipo con un servidor trivial: ilustran el procedimiento, no el rendimiento de ningún</tspan></text><text x="470" y="218.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">sistema, y la variación entre corridas es parte del resultado.</tspan></text><text x="470" y="257.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con http.server y http.client en CPython 3.12.9 (Windows 11) y 3.12.3 (Ubuntu/WSL2); un solo equipo, red de bucle local.</tspan></text></svg>
