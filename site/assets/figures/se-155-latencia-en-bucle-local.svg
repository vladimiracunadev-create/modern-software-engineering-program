<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 554" width="940" height="554" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Percentil 95 de 400 peticiones a un servidor local: tres corridas por escenario</title><desc id="d">Rangos del percentil 95 de tres corridas de 400 peticiones a un servidor HTTP local: con un cliente de 1,88 a 2,02 ms en Windows y de 1,47 a 1,71 en Ubuntu; con ocho clientes de 5,56 a 6,04 y de 9,69 a 10,89.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="554" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Percentil 95 de 400 peticiones a un servidor local: tres corridas por escenario</tspan></text><rect x="16" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">mínimo</tspan></text><polygon points="115.24,44.1 121.84,56.4 108.64,56.4" fill="#946512" stroke="#946512" stroke-width="2"/><text x="129.24" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="129.24" dy="0">máximo</tspan></text><line x1="261.56" y1="77" x2="261.56" y2="373" stroke="#d5dde1" stroke-width="1"/><line x1="261.56" y1="373" x2="261.56" y2="378" stroke="#5b7280" stroke-width="1.4"/><text x="261.56" y="394" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="261.56" dy="0">0</tspan></text><line x1="387.248" y1="77" x2="387.248" y2="373" stroke="#d5dde1" stroke-width="1"/><line x1="387.248" y1="373" x2="387.248" y2="378" stroke="#5b7280" stroke-width="1.4"/><text x="387.248" y="394" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387.248" dy="0">2,5</tspan></text><line x1="512.936" y1="77" x2="512.936" y2="373" stroke="#d5dde1" stroke-width="1"/><line x1="512.936" y1="373" x2="512.936" y2="378" stroke="#5b7280" stroke-width="1.4"/><text x="512.936" y="394" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512.936" dy="0">5</tspan></text><line x1="638.624" y1="77" x2="638.624" y2="373" stroke="#d5dde1" stroke-width="1"/><line x1="638.624" y1="373" x2="638.624" y2="378" stroke="#5b7280" stroke-width="1.4"/><text x="638.624" y="394" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="638.624" dy="0">7,5</tspan></text><line x1="764.312" y1="77" x2="764.312" y2="373" stroke="#d5dde1" stroke-width="1"/><line x1="764.312" y1="373" x2="764.312" y2="378" stroke="#5b7280" stroke-width="1.4"/><text x="764.312" y="394" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="764.312" dy="0">10</tspan></text><line x1="890" y1="77" x2="890" y2="373" stroke="#d5dde1" stroke-width="1"/><line x1="890" y1="373" x2="890" y2="378" stroke="#5b7280" stroke-width="1.4"/><text x="890" y="394" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="890" dy="0">12,5</tspan></text><line x1="261.56" y1="373" x2="890" y2="373" stroke="#5b7280" stroke-width="1.6"/><text x="231.56" y="118.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="231.56" dy="0">1 cliente · Windows 11</tspan></text><text x="231.56" y="192.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="231.56" dy="0">1 cliente · Ubuntu (WSL2)</tspan></text><text x="231.56" y="266.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="231.56" dy="0">8 clientes · Windows 11</tspan></text><text x="231.56" y="340.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="231.56" dy="0">8 clientes · Ubuntu (WSL2)</tspan></text><line x1="356.077" y1="114" x2="363.116" y2="114" stroke="#8a9aa3" stroke-width="5"/><rect x="349.077" y="107" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="356.077" y="98" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="356.077" dy="0">1,88</tspan></text><polygon points="363.116,105.95 370.816,120.3 355.416,120.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="363.116" y="143" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="363.116" dy="0">2,02</tspan></text><line x1="335.465" y1="188" x2="347.531" y2="188" stroke="#8a9aa3" stroke-width="5"/><rect x="328.465" y="181" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="335.465" y="172" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="335.465" dy="0">1,47</tspan></text><polygon points="347.531,179.95 355.231,194.3 339.831,194.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="347.531" y="217" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="347.531" dy="0">1,71</tspan></text><line x1="541.09" y1="262" x2="565.222" y2="262" stroke="#8a9aa3" stroke-width="5"/><rect x="534.09" y="255" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="541.09" y="246" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="541.09" dy="0">5,56</tspan></text><polygon points="565.222,253.95 572.922,268.3 557.522,268.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="565.222" y="291" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="565.222" dy="0">6,04</tspan></text><line x1="748.727" y1="336" x2="809.057" y2="336" stroke="#8a9aa3" stroke-width="5"/><rect x="741.727" y="329" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="748.727" y="320" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="748.727" dy="0">9,69</tspan></text><polygon points="809.057,327.95 816.757,342.3 801.357,342.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="809.057" y="365" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="809.057" dy="0">10,89</tspan></text><text x="575.78" y="417" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="575.78" dy="0">ms (p95)</tspan></text><rect x="10" y="431" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="455.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Un requisito reparado («p95 ≤ 800 ms con 8 clientes») se verifica con un procedimiento, no con un adjetivo. Estas cifras</tspan></text><text x="470" y="472.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">son del bucle local de un solo equipo con un servidor trivial: ilustran el procedimiento, no el rendimiento de ningún</tspan></text><text x="470" y="489.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">sistema, y la variación entre corridas es parte del resultado.</tspan></text><text x="470" y="536.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con http.server y http.client en CPython 3.12.9 (Windows 11) y 3.12.3 (Ubuntu/WSL2); un solo equipo, red de bucle local.</tspan></text></svg>
