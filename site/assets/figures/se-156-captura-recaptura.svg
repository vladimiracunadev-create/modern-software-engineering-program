<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 265" width="940" height="265" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Estimar cuántos defectos quedan por captura-recaptura: dos revisores, 40 defectos reales</title><desc id="d">Gráfico de intervalos del estimador de Lincoln-Petersen sobre 40 defectos sembrados: con revisores independientes e igual dificultad la media es 41,9 con rango p5 a p95 de 30 a 60; con dificultad desigual, 30,5 con rango de 23,1 a 39,6, siempre por debajo de 40.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="265" fill="#ffffff"/><text x="330" y="40" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Revisores independientes y defectos iguales</tspan></text><rect x="589.231" y="24" width="249.231" height="24" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><line x1="688.092" y1="18" x2="688.092" y2="54" stroke="#142231" stroke-width="3"/><text x="688.092" y="68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="688.092" dy="0">media 41,9</tspan></text><text x="585.231" y="41" font-size="12" text-anchor="end" font-weight="400" fill="#142231"><tspan x="585.231" dy="0">30</tspan></text><text x="842.462" y="41" font-size="12" text-anchor="start" font-weight="400" fill="#142231"><tspan x="842.462" dy="0">60</tspan></text><text x="330" y="94" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Defectos de dificultad desigual</tspan></text><rect x="531.908" y="78" width="137.077" height="24" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><line x1="593.385" y1="72" x2="593.385" y2="108" stroke="#142231" stroke-width="3"/><text x="593.385" y="122" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="593.385" dy="0">media 30,5</tspan></text><text x="527.908" y="95" font-size="12" text-anchor="end" font-weight="400" fill="#142231"><tspan x="527.908" dy="0">23.1</tspan></text><text x="672.985" y="95" font-size="12" text-anchor="start" font-weight="400" fill="#142231"><tspan x="672.985" dy="0">39.6</tspan></text><line x1="340" y1="126" x2="880" y2="126" stroke="#8a9aa3" stroke-width="1.4"/><text x="880" y="144" font-size="12" text-anchor="end" font-weight="400" fill="#142231"><tspan x="880" dy="0">0 … 65 defectos estimados</tspan></text><rect x="10" y="154" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="178.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Juntos, los dos revisores hallaron en media 28,0 y 25,4 defectos distintos de 40. Con dificultad igual el estimador es</tspan></text><text x="470" y="195.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">correcto en media pero impreciso (30 a 60). Con defectos difíciles para ambos, subestima: 30,5 frente a 40. Un número bajo</tspan></text><text x="470" y="212.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de defectos restantes no es una garantía.</tspan></text><text x="470" y="251.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">3 000 simulaciones por escenario, semilla 156; probabilidades de detección 0,5 y 0,4 (supuestos del autor).</tspan></text></svg>
