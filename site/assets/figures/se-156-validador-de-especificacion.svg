<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 435" width="940" height="435" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Validador de una especificación sintética con 16 defectos inyectados: 11 de 16 detectados</title><desc id="d">Tabla de 16 mutaciones aplicadas a una especificación válida: el validador detecta las estructurales y de completitud (ocho y tres), pero no una palabra vaga flexionada ni las cuatro semánticas (umbral absurdo, contradicción entre dos requisitos, criterio ajeno y ambigüedad).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="435" fill="#ffffff"/><rect x="10" y="12" width="674" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="347" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="347" dy="0">Tipo de defecto</tspan></text><rect x="690" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="807" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="807" dy="0">Resultado</tspan></text><rect x="10" y="56" width="674" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="347" y="81.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="347" dy="0">Estructurales: id duplicado, criterio inexistente o ajeno, origen inexistente, sin dueño,</tspan></text><text x="347" y="97.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="347" dy="0">prioridad inválida, dependencia inexistente, ciclo</tspan></text><rect x="690" y="56" width="234" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="807" y="89.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="807" dy="0">Detectadas (8 de 8)</tspan></text><rect x="10" y="122" width="674" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="347" y="155.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="347" dy="0">De completitud: sin supuestos, sin fuera de alcance, texto «por definir»</tspan></text><rect x="690" y="122" width="234" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="807" y="155.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="807" dy="0">Detectadas (3 de 3)</tspan></text><rect x="10" y="188" width="674" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="347" y="221.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="347" dy="0">Vocabulario: «adecuada» (la lista tiene «adecuado»)</tspan></text><rect x="690" y="188" width="234" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="807" y="221.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="807" dy="0">No detectada</tspan></text><rect x="10" y="254" width="674" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="347" y="279.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="347" dy="0">Semánticas: umbral 30 → 3 000 días; dos requisitos con plazos contradictorios; criterio</tspan></text><text x="347" y="295.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="347" dy="0">que no prueba el requisito; ambigüedad sin palabras vagas</tspan></text><rect x="690" y="254" width="234" height="60" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="807" y="287.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="807" dy="0">No detectadas (0 de 4)</tspan></text><rect x="10" y="324" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="348.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">La especificación base no produce errores. El validador comprueba forma y referencias; no compara 30 con 3 000 días, no</tspan></text><text x="470" y="365.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">sabe que dos plazos se excluyen y no distingue un criterio ajeno. Esa parte la cubre la revisión humana. Detectar 11 de 16</tspan></text><text x="470" y="382.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">no es una probabilidad de que una especificación real esté bien.</tspan></text><text x="470" y="421.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
