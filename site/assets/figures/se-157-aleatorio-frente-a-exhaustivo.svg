<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 335" width="1100" height="335" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Probabilidad de encontrar un defecto de frontera (4,16 % de las entradas)</title><desc id="d">Barras: un defecto en 30 de 721 entradas se detecta con 10 casos aleatorios en 32,4 por ciento de 500 semillas, con 50 en 88,6, con 100 en 98,8 y con 300 en 100; el recorrido exhaustivo lo halla siempre en el caso 25.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1100" height="335" fill="#ffffff"/><text x="430" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="430" dy="0">10 casos aleatorios</tspan></text><rect x="440" y="16" width="149.04" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="597.04" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="597.04" dy="0">32,4 %</tspan></text><text x="430" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="430" dy="0">50 casos aleatorios</tspan></text><rect x="440" y="60" width="407.56" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="855.56" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="855.56" dy="0">88,6 %</tspan></text><text x="430" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="430" dy="0">100 casos aleatorios</tspan></text><rect x="440" y="104" width="454.48" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="902.48" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="902.48" dy="0">98,8 %</tspan></text><text x="430" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="430" dy="0">300 casos aleatorios</tspan></text><rect x="440" y="148" width="460" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="908" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="908" dy="0">100 %</tspan></text><text x="430" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="430" dy="0">Recorrido exhaustivo (721 casos): falla en el caso 25</tspan></text><rect x="440" y="192" width="460" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="908" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="908" dy="0">100 %</tspan></text><rect x="10" y="240" width="1080" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="550" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="550" dy="0">Un dominio acotado y una especificación ejecutable permiten comprobar todo; con dominios grandes solo queda el muestreo, y un defecto que ocupa</tspan></text><text x="550" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="550" dy="0">una fracción pequeña del dominio puede escapar a decenas de casos.</tspan></text><text x="550" y="321.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="550" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
