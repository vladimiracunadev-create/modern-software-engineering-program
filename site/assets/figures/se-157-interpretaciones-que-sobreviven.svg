<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 379" width="1000" height="379" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Interpretaciones del enunciado informal que sobreviven a k ejemplos</title><desc id="d">Barras: de 16 lecturas posibles de una regla de penalización por retraso, el ejemplo típico de 48 horas y nota 80 deja vivas 8; uno al azar deja 3,63 en media; seis dejan 1,02; un ejemplo elegido con conocimiento de todas las lecturas deja 1.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="379" fill="#ffffff"/><text x="330" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">1 ejemplo típico: 48 h tarde, nota 80</tspan></text><rect x="340" y="16" width="496" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="844" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="844" dy="0">8 de 16</tspan></text><text x="330" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">1 ejemplo al azar (media de 200 semillas)</tspan></text><rect x="340" y="60" width="225.06" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="573.06" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="573.06" dy="0">3,63</tspan></text><text x="330" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">2 ejemplos al azar</tspan></text><rect x="340" y="104" width="110.98" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="458.98" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="458.98" dy="0">1,79</tspan></text><text x="330" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">3 ejemplos al azar</tspan></text><rect x="340" y="148" width="81.84" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="429.84" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="429.84" dy="0">1,32</tspan></text><text x="330" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">6 ejemplos al azar</tspan></text><rect x="340" y="192" width="63.24" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="411.24" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="411.24" dy="0">1,02</tspan></text><text x="330" y="255.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">1 ejemplo elegido sabiendo las 16 lecturas</tspan></text><rect x="340" y="236" width="62" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="410" y="255.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="410" dy="0">1</tspan></text><rect x="10" y="284" width="980" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="500" y="308.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">El ejemplo que cualquiera escribiría primero elimina solo la mitad de las lecturas. Los ejemplos aleatorios convergen despacio; el</tspan></text><text x="500" y="325.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">que discrimina se elige mirando dónde difieren las lecturas, no repitiendo el caso típico.</tspan></text><text x="500" y="365.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
