<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 291" width="1000" height="291" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">200 mutaciones de una tabla de decisión de 18 combinaciones</title><desc id="d">Barras: de 200 mutaciones de una tabla de ocho reglas sobre 18 combinaciones, 83 dejan al menos un hueco, 51 un solape, 32 ambos y 34 no cambian el comportamiento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="291" fill="#ffffff"/><text x="330" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Con hueco (algún caso sin regla)</tspan></text><rect x="340" y="16" width="448.2" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="796.2" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="796.2" dy="0">83</tspan></text><text x="330" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Con solape (dos reglas aplican)</tspan></text><rect x="340" y="60" width="275.4" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="623.4" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="623.4" dy="0">51</tspan></text><text x="330" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Con hueco y solape a la vez</tspan></text><rect x="340" y="104" width="172.8" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="520.8" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="520.8" dy="0">32</tspan></text><text x="330" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Sin hueco ni solape (mutante equivalente)</tspan></text><rect x="340" y="148" width="183.6" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="531.6" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="531.6" dy="0">34</tspan></text><rect x="10" y="196" width="980" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="500" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">Enumerar las 18 combinaciones encuentra todos los huecos y solapes. El coste crece al doble por cada condición binaria: 2^22 = 4</tspan></text><text x="500" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">194 304 combinaciones tardaron 0,53 s en Windows y 0,62 s en Ubuntu, y con 40 condiciones la enumeración deja de ser posible.</tspan></text><text x="500" y="277.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
