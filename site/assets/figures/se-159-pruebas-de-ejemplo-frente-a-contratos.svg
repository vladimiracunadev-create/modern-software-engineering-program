<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 491" width="1030" height="491" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Nueve mutantes de una clase con contratos: pruebas de ejemplo frente a contratos</title><desc id="d">Tabla de nueve mutantes de una clase de calificación: cinco pruebas de ejemplo no matan ninguno; los contratos con un conductor aleatorio de 200 ejecuciones saltan en cinco familias de defecto y no detectan el mutante 5, donde la prórroga queda duplicada pero dentro del tope.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1030" height="491" fill="#ffffff"/><rect x="10" y="12" width="104" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="62" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="62" dy="0">Mutante</tspan></text><rect x="120" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="307" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="307" dy="0">Defecto</tspan></text><rect x="500" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="622" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="622" dy="0">Cinco pruebas de ejemplo</tspan></text><rect x="750" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="882" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="882" dy="0">Ejecuciones en que salta un</tspan></text><text x="882" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="882" dy="0">contrato</tspan></text><rect x="10" y="56" width="104" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="62" y="76.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="62" dy="0">1</tspan></text><rect x="120" y="56" width="374" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="76.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="307" dy="0">Nota sin acotar</tspan></text><rect x="500" y="56" width="244" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="76.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">No</tspan></text><rect x="750" y="56" width="264" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="882" y="76.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">117 de 200</tspan></text><rect x="10" y="96" width="104" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="62" y="116.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="62" dy="0">2</tspan></text><rect x="120" y="96" width="374" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="116.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="307" dy="0">Salta a «publicada» al calificar</tspan></text><rect x="500" y="96" width="244" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="116.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">No</tspan></text><rect x="750" y="96" width="264" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="882" y="116.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">200 de 200</tspan></text><rect x="10" y="136" width="104" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="62" y="156.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="62" dy="0">3</tspan></text><rect x="120" y="136" width="374" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="156.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="307" dy="0">Nota sin cota inferior</tspan></text><rect x="500" y="136" width="244" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="156.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">No</tspan></text><rect x="750" y="136" width="264" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="882" y="156.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">62 de 200</tspan></text><rect x="10" y="176" width="104" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="62" y="196.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="62" dy="0">4</tspan></text><rect x="120" y="176" width="374" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="196.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="307" dy="0">Estado redundante</tspan></text><rect x="500" y="176" width="244" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="196.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">No (equivalente)</tspan></text><rect x="750" y="176" width="264" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="882" y="196.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">0 de 200</tspan></text><rect x="10" y="216" width="104" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="62" y="236.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="62" dy="0">5</tspan></text><rect x="120" y="216" width="374" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="236.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="307" dy="0">Prórroga duplicada, tope intacto</tspan></text><rect x="500" y="216" width="244" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="236.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">No</tspan></text><rect x="750" y="216" width="264" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="882" y="236.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">0 de 200</tspan></text><rect x="10" y="256" width="104" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="62" y="276.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="62" dy="0">6, 7</tspan></text><rect x="120" y="256" width="374" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="276.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="307" dy="0">Prórroga sin tope</tspan></text><rect x="500" y="256" width="244" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="276.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">No</tspan></text><rect x="750" y="256" width="264" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="882" y="276.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">198 de 200</tspan></text><rect x="10" y="296" width="104" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="62" y="316.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="62" dy="0">8</tspan></text><rect x="120" y="296" width="374" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="316.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="307" dy="0">Publicar conserva la nota (equivalente)</tspan></text><rect x="500" y="296" width="244" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="316.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">No (equivalente)</tspan></text><rect x="750" y="296" width="264" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="882" y="316.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">0 de 200</tspan></text><rect x="10" y="336" width="104" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="62" y="356.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="62" dy="0">9</tspan></text><rect x="120" y="336" width="374" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="356.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="307" dy="0">Publicar borra la nota</tspan></text><rect x="500" y="336" width="244" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="356.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">No</tspan></text><rect x="750" y="336" width="264" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="882" y="356.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">200 de 200</tspan></text><rect x="10" y="380" width="1010" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="515" y="404.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="515" dy="0">Los contratos detectan lo que afirman: nota acotada, estado válido, prórroga ≤ 72. El mutante 5 duplica la prórroga sin pasar el tope y</tspan></text><text x="515" y="421.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="515" dy="0">nadie declaró cuánto debía valer: lo no escrito no se comprueba. Sobrecoste de comprobar: 1,44 veces en Windows y 1,47 en Ubuntu (100</tspan></text><text x="515" y="438.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="515" dy="0">000 llamadas).</tspan></text><text x="515" y="477.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="515" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
