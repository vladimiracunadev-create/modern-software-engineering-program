<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 374" width="940" height="374" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">SQLite 3.45: la misma información desnormalizada y normalizada</title><desc id="d">Puntos unidos por una línea con cuánto queda al normalizar, tomando lo desnormalizado como 100: el archivo pasa de 245 760 a 73 728 bytes (30 por ciento), las filas que toca el cambio de nombre de un curso de 54 a 1 (1,9 por ciento) y los nombres distintos para el curso 7 tras interrumpir de 2 a 0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="374" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">SQLite 3.45: la misma información desnormalizada y normalizada</tspan></text><circle cx="22" cy="51" r="6" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Desnormalizado (100 %)</tspan></text><circle cx="235.88" cy="51" r="6" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="249.88" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="249.88" dy="0">Normalizado</tspan></text><line x1="382.3" y1="77" x2="382.3" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="382.3" y1="209" x2="382.3" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="382.3" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382.3" dy="0">0</tspan></text><line x1="461.684" y1="77" x2="461.684" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="461.684" y1="209" x2="461.684" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="461.684" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="461.684" dy="0">20</tspan></text><line x1="541.068" y1="77" x2="541.068" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="541.068" y1="209" x2="541.068" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="541.068" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="541.068" dy="0">40</tspan></text><line x1="620.452" y1="77" x2="620.452" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="620.452" y1="209" x2="620.452" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="620.452" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="620.452" dy="0">60</tspan></text><line x1="699.836" y1="77" x2="699.836" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="699.836" y1="209" x2="699.836" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="699.836" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="699.836" dy="0">80</tspan></text><line x1="779.22" y1="77" x2="779.22" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="779.22" y1="209" x2="779.22" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="779.22" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="779.22" dy="0">100</tspan></text><line x1="382.3" y1="209" x2="779.22" y2="209" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="95" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Tamaño del archivo (245 760 → 73 728</tspan></text><text x="314" y="112" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">bytes)</tspan></text><text x="314" y="139" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Filas que toca el cambio de nombre (54 →</tspan></text><text x="314" y="156" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">1)</tspan></text><text x="314" y="183" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Nombres distintos para el curso 7 tras</tspan></text><text x="314" y="200" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">interrumpir (2 → 0)</tspan></text><line x1="779.22" y1="99" x2="501.376" y2="99" stroke="#087f8c" stroke-width="4"/><circle cx="779.22" cy="99" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="501.376" cy="99" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="791.22" y="103.5" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="791.22" dy="0">100,0</tspan></text><text x="489.376" y="103.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="489.376" dy="0">30,0</tspan></text><text x="926" y="103.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">−70,0 %</tspan></text><line x1="779.22" y1="143" x2="389.841" y2="143" stroke="#087f8c" stroke-width="4"/><circle cx="779.22" cy="143" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="389.841" cy="143" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="791.22" y="147.5" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="791.22" dy="0">100,0</tspan></text><text x="377.841" y="147.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="377.841" dy="0">1,9</tspan></text><text x="926" y="147.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">−98,1 %</tspan></text><line x1="779.22" y1="187" x2="382.3" y2="187" stroke="#087f8c" stroke-width="4"/><circle cx="779.22" cy="187" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="382.3" cy="187" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="791.22" y="191.5" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="791.22" dy="0">100,0</tspan></text><text x="370.3" y="191.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="370.3" dy="0">0,0</tspan></text><text x="926" y="191.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">−100,0 %</tspan></text><text x="580.76" y="253" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="580.76" dy="0">Valor normalizado, % de lo desnormalizado</tspan></text><rect x="10" y="267" width="920" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="291.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">La normalización elimina una clase de inconsistencia a cambio de uniones al leer. Los tamaños son de este generador</tspan></text><text x="470" y="308.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">sintético (SQLite 3.45.3 en Windows y 3.45.1 en Ubuntu, mismas cifras) y no se extrapolan a un sistema real.</tspan></text><text x="470" y="356.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
