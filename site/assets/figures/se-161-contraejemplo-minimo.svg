<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Contraejemplo mínimo hallado por búsqueda en anchura</title><desc id="d">Diagrama de una traza de cuatro pasos: pendiente, enviada, calificada, publicada y, tras apelar, enviada con la nota todavía puesta, lo que viola el invariante de que una entrega enviada no tiene nota.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="330" fill="#ffffff"/><rect x="20" y="40" width="170" height="70" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="105" y="69.6" font-size="15" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="105" dy="0">pendiente</tspan></text><text x="105" y="88.8" font-size="15" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="105" dy="0">sin nota</tspan></text><rect x="215" y="40" width="170" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="300" y="69.6" font-size="15" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="300" dy="0">enviada</tspan></text><text x="300" y="88.8" font-size="15" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="300" dy="0">sin nota</tspan></text><rect x="410" y="40" width="170" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="495" y="69.6" font-size="15" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="495" dy="0">calificada</tspan></text><text x="495" y="88.8" font-size="15" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="495" dy="0">con nota</tspan></text><rect x="605" y="40" width="170" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="690" y="69.6" font-size="15" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="690" dy="0">publicada</tspan></text><text x="690" y="88.8" font-size="15" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="690" dy="0">con nota</tspan></text><polyline points="190,75 215,75" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="202" y="28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="202" dy="0">enviar</tspan></text><polyline points="385,75 410,75" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="397" y="28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">calificar</tspan></text><polyline points="580,75 605,75" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="592" y="28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">publicar</tspan></text><rect x="800" y="40" width="180" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="890" y="69.6" font-size="15" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="890" dy="0">enviada</tspan></text><text x="890" y="88.8" font-size="15" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="890" dy="0">CON nota</tspan></text><polyline points="775,75 800,75" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><text x="787" y="28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">apelar</tspan></text><rect x="20" y="150" width="960" height="56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="500" y="172.96" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Invariante: si hay nota, el estado es «calificada» o «publicada». La búsqueda en anchura devuelve la traza más corta</tspan></text><text x="500" y="190.88" font-size="14" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">que lo viola: enviar → calificar → publicar → apelar (4 pasos, 6 estados explorados).</tspan></text><rect x="20" y="220" width="960" height="56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="500" y="242.96" font-size="14" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">La máquina correcta tiene 13 estados alcanzables y ninguna violación. El defecto es una sola transición (la apelación</tspan></text><text x="500" y="260.88" font-size="14" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">vuelve a «enviada» sin borrar la nota).</tspan></text><text x="500" y="312" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
