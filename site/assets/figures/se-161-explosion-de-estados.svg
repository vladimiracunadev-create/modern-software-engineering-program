<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 395" width="980" height="395" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Estados alcanzables con N estudiantes que envían a la vez</title><desc id="d">Barras: con cuatro estudiantes hay 144 estados sin simetría y 24 con simetría; con ocho 6 144 y 48; con once 82 944, que tardan 0,34 s, y 66; el crecimiento es exponencial sin simetría y lineal con ella.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="395" fill="#ffffff"/><text x="300" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">N = 4 estudiantes, sin simetría</tspan></text><rect x="310" y="16" width="4" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="322" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="322" dy="0">144</tspan></text><text x="300" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">N = 4, con simetría</tspan></text><rect x="310" y="60" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="322" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="322" dy="0">24</tspan></text><text x="300" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">N = 8, sin simetría</tspan></text><rect x="310" y="104" width="35.6352" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="353.635" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="353.635" dy="0">6 144</tspan></text><text x="300" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">N = 8, con simetría</tspan></text><rect x="310" y="148" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="322" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="322" dy="0">48</tspan></text><text x="300" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">N = 11, sin simetría</tspan></text><rect x="310" y="192" width="481.075" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="799.075" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="799.075" dy="0">82 944 (0,34 s)</tspan></text><text x="300" y="255.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">N = 11, con simetría</tspan></text><rect x="310" y="236" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="322" y="255.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="322" dy="0">66</tspan></text><rect x="10" y="284" width="960" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="490" y="308.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">Cada estudiante adicional multiplica los estados por 2,4 aproximadamente; tratar a los estudiantes como intercambiables (ordenar</tspan></text><text x="490" y="325.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">el estado) los reduce a 6N. La reducción solo es válida si de verdad lo son: una cola con prioridad distinta por persona la</tspan></text><text x="490" y="342.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">destruiría.</tspan></text><text x="490" y="381.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
