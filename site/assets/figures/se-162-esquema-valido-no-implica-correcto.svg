<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 219" width="1030" height="219" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Lo que un esquema acepta y la regla de negocio rechaza</title><desc id="d">Barras: de 5 000 documentos generados que cumplen el esquema, 2 410 tienen una fecha de fin anterior a la de inicio, una regla entre campos que el esquema de tipos y formatos no expresa.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1030" height="219" fill="#ffffff"/><text x="400" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Documentos válidos según el esquema</tspan></text><rect x="410" y="16" width="500" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="918" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="918" dy="0">5 000 de 5 000</tspan></text><text x="400" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Con fin anterior a inicio (regla entre campos)</tspan></text><rect x="410" y="60" width="241" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="659" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="659" dy="0">2 410 (48,2 %)</tspan></text><rect x="10" y="108" width="1010" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="515" y="132.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="515" dy="0">Un validador ingenuo aceptó además nota=true como entero porque en Python bool es subclase de int; con la exclusión explícita lo</tspan></text><text x="515" y="149.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="515" dy="0">rechazó. La nota 100.0 (flotante) y &#x27;100&#x27; (texto) se rechazaron. Validar forma no garantiza sentido: la regla entre campos exige código</tspan></text><text x="515" y="166.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="515" dy="0">aparte.</tspan></text><text x="515" y="205.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="515" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
