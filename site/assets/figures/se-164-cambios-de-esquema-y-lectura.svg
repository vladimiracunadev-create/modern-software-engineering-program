an x="197" dy="0">Quitar valor de enum</tspan></text><rect x="390" y="368" width="184" height="33" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="387.86" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">1016</tspan></text><rect x="580" y="368" width="234" height="33" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="387.86" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">2000</tspan></text><rect x="820" y="368" width="234" height="33" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="937" y="387.86" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="937" dy="0">2000</tspan></text><rect x="10" y="407" width="374" height="33" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="426.86" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Renombrar un campo</tspan></text><rect x="390" y="407" width="184" height="33" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="426.86" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">0</tspan></text><rect x="580" y="407" width="234" height="33" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="426.86" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">0</tspan></text><rect x="820" y="407" width="234" height="33" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="937" y="426.86" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="937" dy="0">0</tspan></text><rect x="10" y="450" width="1050" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="535" y="474.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="535" dy="0">Un cambio es compatible solo si