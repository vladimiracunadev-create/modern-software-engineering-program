<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 247" width="1000" height="247" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Pruebas basadas en propiedades: hallar y reducir un contraejemplo (300 semillas)</title><desc id="d">Barras de 300 semillas: una propiedad de deduplicación falla en media al 8,3 intento y el contraejemplo hallado tiene 22,7 elementos; tras reducirlo siempre quedan 3, la forma mínima a, b, a.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="247" fill="#ffffff"/><text x="420" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Intentos hasta el primer contraejemplo (media)</tspan></text><rect x="430" y="16" width="149.4" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="587.4" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="587.4" dy="0">8,3 (máximo 48)</tspan></text><text x="420" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Tamaño medio del contraejemplo hallado</tspan></text><rect x="430" y="60" width="408.6" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="846.6" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="846.6" dy="0">22,7 elementos</tspan></text><text x="420" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Tamaño tras reducirlo</tspan></text><rect x="430" y="104" width="54" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="492" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="492" dy="0">3,0 (siempre 3)</tspan></text><rect x="10" y="152" width="980" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="500" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="500" dy="0">La reducción lleva un caso difícil de leer a [3, 0, 3]: dos valores iguales no adyacentes. Esa forma mínima revela el defecto (el</tspan></text><text x="500" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="500" dy="0">algoritmo solo compara con el elemento anterior) sin examinar 22 números.</tspan></text><text x="500" y="233.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo lo indicado.</tspan></text></svg>
