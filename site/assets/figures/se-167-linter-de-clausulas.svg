<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 347" width="940" height="347" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Linter de cláusulas de contrato con seis cláusulas que no vio al escribirse</title><desc id="d">Mapa de calor de seis cláusulas nuevas según el juicio del autor y la decisión de la regla: dos completas aceptadas, una completa rechazada (el falso negativo con «excepto» y «estudiante») y tres incompletas rechazadas; ninguna incompleta aceptada.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="347" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Linter de cláusulas de contrato con seis cláusulas que no vio al escribirse</tspan></text><text x="623" y="59" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="623" dy="0">Decisión de la regla</tspan></text><text x="474.5" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="474.5" dy="0">La regla acepta</tspan></text><text x="771.5" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="771.5" dy="0">La regla rechaza</tspan></text><text x="316" y="124.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="316" dy="0">Cláusula completa (juicio del autor)</tspan></text><text x="316" y="176.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="316" dy="0">Cláusula incompleta (juicio del autor)</tspan></text><rect x="327.5" y="95.5" width="294" height="49" rx="4" fill="#b5924f" stroke="#ffffff" stroke-width="1"/><text x="474.5" y="124.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="474.5" dy="0">2</tspan></text><rect x="624.5" y="95.5" width="294" height="49" rx="4" fill="#d6be8b" stroke="#102a43" stroke-width="3"/><text x="771.5" y="124.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="771.5" dy="0">1</tspan></text><rect x="327.5" y="147.5" width="294" height="49" rx="4" fill="#f7ebc8" stroke="#ffffff" stroke-width="1"/><text x="474.5" y="176.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="474.5" dy="0">0</tspan></text><rect x="624.5" y="147.5" width="294" height="49" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="771.5" y="176.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="771.5" dy="0">3</tspan></text><text x="20" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 146)">Juicio</text><text x="326" y="224" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="326" dy="0">0</tspan></text><rect x="341.54" y="212" width="30.5" height="14" fill="#f7ebc8"/><rect x="371.54" y="212" width="30.5" height="14" fill="#e9d8ae"/><rect x="401.54" y="212" width="30.5" height="14" fill="#dbc594"/><rect x="431.54" y="212" width="30.5" height="14" fill="#cdb27a"/><rect x="461.54" y="212" width="30.5" height="14" fill="#be9e60"/><rect x="491.54" y="212" width="30.5" height="14" fill="#b08b46"/><rect x="521.54" y="212" width="30.5" height="14" fill="#a2782c"/><rect x="551.54" y="212" width="30.5" height="14" fill="#946512"/><text x="589.54" y="224" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="589.54" dy="0">3</tspan></text><text x="605.08" y="224" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="605.08" dy="0">más oscuro = mayor (cláusulas, de 6)</tspan></text><rect x="10" y="240" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Ajuste: 4 aceptadas y 4 rechazadas correctas (8 de 8). Casos nuevos: 5 de 6. La regla mide forma (actor, modal, observable,</tspan></text><text x="470" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">límite) y no verdad; una cláusula completa puede ser falsa y una incompleta, intencionalmente abierta.</tspan></text><text x="470" y="329.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo lo indicado.</tspan></text></svg>
