<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 463" width="840" height="463" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Revisor del propio contrato: 210 mutaciones</title><desc id="d">Tabla de siete mutaciones de un contrato con ejemplos, errores e invariantes: el revisor detecta las 118 que dejan ejemplos fuera del rango, errores sin ejemplo o invariantes sin prueba, y no detecta las 92 que cambian el sentido sin romper la coherencia interna.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="840" height="463" fill="#ffffff"/><rect x="10" y="12" width="494" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="257" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="257" dy="0">Mutación del contrato</tspan></text><rect x="510" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="587" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="587" dy="0">Inyectadas</tspan></text><rect x="670" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="747" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="747" dy="0">Detectadas</tspan></text><rect x="10" y="56" width="494" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="78.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Estrechar el rango de horas</tspan></text><rect x="510" y="56" width="154" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587" y="78.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587" dy="0">33</tspan></text><rect x="670" y="56" width="154" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="78.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">33</tspan></text><rect x="10" y="100" width="494" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="122.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Quitar el ejemplo de un código de error</tspan></text><rect x="510" y="100" width="154" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587" y="122.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587" dy="0">29</tspan></text><rect x="670" y="100" width="154" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="122.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">29</tspan></text><rect x="10" y="144" width="494" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="166.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Agregar un error sin ejemplo</tspan></text><rect x="510" y="144" width="154" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587" y="166.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587" dy="0">27</tspan></text><rect x="670" y="144" width="154" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="166.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">27</tspan></text><rect x="10" y="188" width="494" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="210.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Agregar un invariante sin prueba</tspan></text><rect x="510" y="188" width="154" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587" y="210.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587" dy="0">29</tspan></text><rect x="670" y="188" width="154" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="210.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">29</tspan></text><rect x="10" y="232" width="494" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="254.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Cambiar el texto de un invariante</tspan></text><rect x="510" y="232" width="154" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587" y="254.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587" dy="0">21</tspan></text><rect x="670" y="232" width="154" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="254.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">0</tspan></text><rect x="10" y="276" width="494" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="298.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Cambiar el mensaje de un error</tspan></text><rect x="510" y="276" width="154" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587" y="298.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587" dy="0">38</tspan></text><rect x="670" y="276" width="154" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="298.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">0</tspan></text><rect x="10" y="320" width="494" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="342.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Ensanchar el rango de horas</tspan></text><rect x="510" y="320" width="154" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587" y="342.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587" dy="0">33</tspan></text><rect x="670" y="320" width="154" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="342.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">0</tspan></text><rect x="10" y="368" width="820" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="420" y="392.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="420" dy="0">El revisor garantiza que el contrato sea coherente consigo mismo. Un contrato más permisivo, un mensaje que</tspan></text><text x="420" y="409.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="420" dy="0">miente o un invariante con el sentido contrario pasan: esa revisión es de una persona con el dominio.</tspan></text><text x="420" y="449.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="420" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo lo indicado.</tspan></text></svg>
