<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 690" width="940" height="690" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Revisor del propio contrato: 210 mutaciones</title><desc id="d">Barras horizontales con las mutaciones inyectadas y detectadas por un revisor del propio contrato: detecta las cuatro familias de coherencia interna (118 de 118) y ninguna de las 92 que cambian el texto de un invariante, el mensaje de un error o ensanchan el rango de horas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="690" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Revisor del propio contrato: 210 mutaciones</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Inyectadas</tspan></text><rect x="139.4" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="159.4" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="159.4" dy="0">Detectadas</tspan></text><line x1="294" y1="77" x2="294" y2="525" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="525" x2="294" y2="530" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="546" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">0</tspan></text><line x1="445.47" y1="77" x2="445.47" y2="525" stroke="#d5dde1" stroke-width="1"/><line x1="445.47" y1="525" x2="445.47" y2="530" stroke="#5b7280" stroke-width="1.4"/><text x="445.4