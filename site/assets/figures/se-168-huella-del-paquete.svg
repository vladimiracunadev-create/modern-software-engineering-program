<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 438" width="940" height="438" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Huella de un paquete de 200 archivos en dos sistemas</title><desc id="d">Diagrama de la huella de un paquete de 200 archivos en dos sistemas: con el modo de texto por defecto Windows da 480485af12cf44f9 y Ubuntu 55f841e9f3d4b56f; con el salto de línea fijo los dos dan 55f841e9f3d4b56f; alterar 3 bytes cambia la huella en ambos y calcularla tarda 0,033 s en Windows y 0,004 s en Ubuntu.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="438" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Huella de un paquete de 200 archivos en dos sistemas</tspan></text><rect x="14" y="140" width="250" height="70" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="139" y="162" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="139" dy="0">Mismo contenido, 200 archivos</tspan></text><text x="139" y="178.64" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="139" dy="0">huella calculada en Windows y</tspan></text><text x="139" y="195.28" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="139" dy="0">en Ubuntu (WSL2)</tspan></text><rect x="334" y="49" width="592" height="54" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="630" y="71.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="630" dy="0">Modo de texto por defecto: dos huellas</tspan></text><text x="630" y="87.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="630" dy="0">Windows 480485af12cf44f9 · Ubuntu 55f841e9f3d4b56f</tspan></text><polyline points="264,175 299,175 299,76 334,76" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><rect x="334" y="115" width="592" height="54" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="630" y="137.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="630" dy="0">Salto de línea fijo (newline=&quot;\n&quot;): una huella</tspan></text><text x="630" y="153.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">55f841e9f3d4b56f en los dos sistemas</tspan></text><polyline points="264,175 299,175 299,142 334,142" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="334" y="181" width="592" height="54" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="630" y="203.32" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="630" dy="0">Alterar 3 bytes de un archivo</tspan></text><text x="630" y="219.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="630" dy="0">la huella cambia en los dos sistemas: se detecta la manipulación</tspan></text><polyline points="264,175 299,175 299,208 334,208" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="334" y="247" width="592" height="54" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="630" y="269.32" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="630" dy="0">Calcular la huella de 200 archivos</tspan></text><text x="630" y="285.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="630" dy="0">0,033 s en Windows · 0,004 s en Ubuntu, de un equipo</tspan></text><polyline points="264,175 299,175 299,274 334,274" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="315" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="339.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Sin fijar el salto de línea, el mismo contenido tiene dos huellas: un manifiesto firmado en un sistema no verifica en el</tspan></text><text x="470" y="356.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">otro. La huella detecta cambios en los bytes, no su autoría ni su sentido. Los tiempos son de un equipo y no son</tspan></text><text x="470" y="373.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">comparables entre sistemas.</tspan></text><text x="470" y="420.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos; las huellas son deterministas, los tiempos no.</tspan></text></svg>
