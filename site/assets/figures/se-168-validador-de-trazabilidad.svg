<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 754" width="940" height="754" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Validador de un paquete trazable de 41 artefactos: 240 mutaciones</title><desc id="d">Barras horizontales con las mutaciones inyectadas y detectadas por un validador de un paquete trazable: detecta las siete familias mecánicas (216 de 216) y ninguna de las 24 en que el texto cambia de sentido con el rastro intacto.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="754" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Validador de un paquete trazable de 41 artefactos: 240 mutaciones</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Inyectadas</tspan></text><rect x="139.4" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="159.4" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="159.4" dy="0">Detectadas</tspan></text><line x1="324" y1="77" x2="324" y2="589" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="589" x2="324" y2="594" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="610" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="467.97" y1="77" x2="467.97" y2="589" stroke="#d5dde1" stroke-width="1"/><line x1="467.97" y1="589" x2="467.97" y2="594" stroke="#5b7280" stroke-width="1.4"/><text x="467.97" y="610" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467.97" dy="0">10</tspan></text><line x1="611.94" y1="77" x2="611.94" y2="589" stroke="#d5dde1" stroke-width="1"/><line x1="611.94" y1="589" x2="611.94" y2="594" stroke="#5b7280" stroke-width="1.4"/><text x="611.94" y="610" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="611.94" dy="0">20</tspan></text><line x1="755.91" y1="77" x2="755.91" y2="589" stroke="#d5dde1" stroke-width="1"/><line x1="755.91" y1="589" x2="755.91" y2="594" stroke="#5b7280" stroke-width="1.4"/><text x="755.91" y="610" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="755.91" dy="0">30</tspan></text><line x1="899.88" y1="77" x2="899.88" y2="589" stroke="#d5dde1" stroke-width="1"/><line x1="899.88" y1="589" x2="899.88" y2="594" stroke="#5b7280" stroke-width="1.4"/><text x="899.88" y="610" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="899.88" dy="0">40</tspan></text><line x1="324" y1="589" x2="899.88" y2="589" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="113.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Enlace a un identificador inexistente</tspan></text><text x="314" y="177.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Requisito sin contrato (huérfano)</tspan></text><text x="314" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Contrato sin ejemplo ni prueba</tspan></text><text x="314" y="305.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Ciclo entre artefactos</tspan></text><text x="314" y="361" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Prueba enlazada a una intención (tipo no</tspan></text><text x="314" y="378" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">permitido)</tspan></text><text x="314" y="425" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Contenido cambiado sin actualizar el</tspan></text><text x="314" y="442" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">rastro</tspan></text><text x="314" y="489" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Renombrar un identificador sin actualizar</tspan></text><text x="314" y="506" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">enlaces</tspan></text><text x="314" y="553" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Texto cambiado de sentido, con el rastro</tspan></text><text x="314" y="570" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">intacto</tspan></text><rect x="324" y="83" width="475.101" height="24.5" rx="3" fill="#6b7c86"/><text x="806.101" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="806.101" dy="0">33</tspan></text><rect x="324" y="110.5" width="475.101" height="24.5" rx="3" fill="#087f8c"/><text x="806.101" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="806.101" dy="0">33</tspan></text><rect x="324" y="147" width="460.704" height="24.5" rx="3" fill="#6b7c86"/><text x="791.704" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="791.704" dy="0">32</tspan></text><rect x="324" y="174.5" width="460.704" height="24.5" rx="3" fill="#087f8c"/><text x="791.704" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="791.704" dy="0">32</tspan></text><rect x="324" y="211" width="489.498" height="24.5" rx="3" fill="#6b7c86"/><text x="820.498" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="820.498" dy="0">34</tspan></text><rect x="324" y="238.5" width="489.498" height="24.5" rx="3" fill="#087f8c"/><text x="820.498" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="820.498" dy="0">34</tspan></text><rect x="324" y="275" width="503.895" height="24.5" rx="3" fill="#6b7c86"/><text x="834.895" y="291.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="834.895" dy="0">35</tspan></text><rect x="324" y="302.5" width="503.895" height="24.5" rx="3" fill="#087f8c"/><text x="834.895" y="319.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="834.895" dy="0">35</tspan></text><rect x="324" y="339" width="374.322" height="24.5" rx="3" fill="#6b7c86"/><text x="705.322" y="355.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="705.322" dy="0">26</tspan></text><rect x="324" y="366.5" width="374.322" height="24.5" rx="3" fill="#087f8c"/><text x="705.322" y="383.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="705.322" dy="0">26</tspan></text><rect x="324" y="403" width="417.513" height="24.5" rx="3" fill="#6b7c86"/><text x="748.513" y="419.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="748.513" dy="0">29</tspan></text><rect x="324" y="430.5" width="417.513" height="24.5" rx="3" fill="#087f8c"/><text x="748.513" y="447.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="748.513" dy="0">29</tspan></text><rect x="324" y="467" width="388.719" height="24.5" rx="3" fill="#6b7c86"/><text x="719.719" y="483.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="719.719" dy="0">27</tspan></text><rect x="324" y="494.5" width="388.719" height="24.5" rx="3" fill="#087f8c"/><text x="719.719" y="511.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="719.719" dy="0">27</tspan></text><rect x="324" y="531" width="345.528" height="24.5" rx="3" fill="#6b7c86"/><text x="676.528" y="547.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="676.528" dy="0">24</tspan></text><rect x="324" y="558.5" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="333" y="575.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">0</tspan></text><text x="611.94" y="633" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="611.94" dy="0">Mutaciones</tspan></text><rect x="10" y="647" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="671.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">La trazabilidad mecánica prueba que los eslabones existen y no se han movido, no que digan lo mismo. Si el texto de un</tspan></text><text x="470" y="688.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">requisito cambia de sentido y su rastro queda intacto, el validador lo da por bueno.</tspan></text><text x="470" y="736.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo lo indicado.</tspan></text></svg>
