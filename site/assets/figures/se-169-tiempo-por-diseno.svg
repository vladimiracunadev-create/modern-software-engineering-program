<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 291" width="1080" height="291" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tiempo estimado de entregar una tarea con tres diseños (modelo de nivel de teclado)</title><desc id="d">Barras: con los tiempos estándar de Card, Moran y Newell, un formulario de nueve campos tarda 50,7 segundos, uno de tres campos con ratón 18,6, el mismo con tres pausas mentales de más 22,7 y uno de tres campos solo con teclado 13,4.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1080" height="291" fill="#ffffff"/><text x="440" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="440" dy="0">A: formulario de nueve campos, ratón y teclado</tspan></text><rect x="450" y="16" width="410" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="868" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="868" dy="0">50,7 s</tspan></text><text x="440" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="440" dy="0">B: tres campos, ratón y teclado</tspan></text><rect x="450" y="60" width="150.414" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="608.414" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="608.414" dy="0">18,6 s</tspan></text><text x="440" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="440" dy="0">B con tres pausas mentales de más</tspan></text><rect x="450" y="104" width="183.57" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="641.57" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="641.57" dy="0">22,7 s</tspan></text><text x="440" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="440" dy="0">C: tres campos, solo teclado con Tab</tspan></text><rect x="450" y="148" width="108.363" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="566.363" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="566.363" dy="0">13,4 s</tspan></text><rect x="10" y="196" width="1060" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="540" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="540" dy="0">Quitar seis campos ahorra 32 s; tres dudas sobre qué escribir cuestan 4 s. El modelo supone una persona experta que no se equivoca: no mide</tspan></text><text x="540" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="540" dy="0">aprendizaje, error ni lectura, y los tiempos de cada operador son valores medios de la literatura.</tspan></text><text x="540" y="277.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="540" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
