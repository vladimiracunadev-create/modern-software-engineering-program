<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 423" width="940" height="423" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Grafo sintético de 120 páginas: qué cambia un menú global y un enlace a la portada</title><desc id="d">Barras horizontales con los clics máximos para recorrer un sitio sintético de 120 páginas: con menú global 4, sin él 9, desde una página interna con enlace a la portada 5 y sin ese enlace 6, pero solo se alcanzan 16 de 120 páginas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="423" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Grafo sintético de 120 páginas: qué cambia un menú global y un enlace a la portada</tspan></text><line x1="354" y1="49" x2="354" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="225" x2="354" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="464.788" y1="49" x2="464.788" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="464.788" y1="225" x2="464.788" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="464.788" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="464.788" dy="0">2</tspan></text><line x1="575.576" y1="49" x2="575.576" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="575.576" y1="225" x2="575.576" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="575.576" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="575.576" dy="0">4</tspan></text><line x1="686.364" y1="49" x2="686.364" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="686.364" y1="225" x2="686.364" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="686.364" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="686.364" dy="0">6</tspan></text><line x1="797.152" y1="49" x2="797.152" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="797.152" y1="225" x2="797.152" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="797.152" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797.152" dy="0">8</tspan></text><line x1="907.94" y1="49" x2="907.94" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="907.94" y1="225" x2="907.94" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="907.94" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907.94" dy="0">10</tspan></text><line x1="354" y1="225" x2="907.94" y2="225" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="67" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Con menú global, desde la portada (120 de</tspan></text><text x="344" y="84" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">120)</tspan></text><text x="344" y="111" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Sin menú global, desde la portada (120 de</tspan></text><text x="344" y="128" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">120)</tspan></text><text x="344" y="155" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Desde una página interna, con enlace a la</tspan></text><text x="344" y="172" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">portada (120 de 120)</tspan></text><text x="344" y="199" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Desde la misma página, sin enlace a la</tspan></text><text x="344" y="216" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">portada (16 de 120)</tspan></text><rect x="354" y="55" width="221.576" height="32" rx="3" fill="#102a43"/><text x="582.576" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="582.576" dy="0">4</tspan></text><rect x="354" y="99" width="498.546" height="32" rx="3" fill="#102a43"/><text x="859.546" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="859.546" dy="0">9</tspan></text><rect x="354" y="143" width="276.97" height="32" rx="3" fill="#102a43"/><text x="637.97" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="637.97" dy="0">5</tspan></text><rect x="354" y="187" width="332.364" height="32" rx="3" fill="#102a43"/><text x="693.364" y="207.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="693.364" dy="0">6</tspan></text><text x="630.97" y="269" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="630.97" dy="0">Clics máximos hasta la página más profunda alcanzable</tspan></text><rect x="10" y="283" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="307.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Con menú global, 17 / 47 / 41 / 14 páginas están a 1 / 2 / 3 / 4 clics; sin él, 9 / 23 / 20 / 20 / 16 / 10 / 7 / 9 / 5</tspan></text><text x="470" y="324.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">páginas a 1 a 9 clics. Sin enlace a la portada solo se alcanza el 13 % del sitio. Un recorrido en anchura sobre un grafo de</tspan></text><text x="470" y="341.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">enlaces mide alcance y profundidad, no si la gente entiende las etiquetas. El grafo se generó con una semilla y 30 % de</tspan></text><text x="470" y="357.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">enlaces cruzados.</tspan></text><text x="470" y="405.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
