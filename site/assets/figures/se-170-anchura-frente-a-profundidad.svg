="2"/><text x="162.073" y="274.75" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="162.073" dy="0">13,5</tspan></text><rect x="229.565" y="317" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="235.065" y="311.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="235.065" dy="0">8,6</tspan></text><rect x="302.558" y="332" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="308.058" y="326.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="308.058" dy="0">6,6</tspan></text><rect x="448.544" y="344" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="454.044" y="338.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="454.044" dy="0">5</tspan></text><rect x="886.5" y="354.5" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="349" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">3,6</tspan></text><rect x="10" y="447" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Niveles según las opciones: 12, 6, 4, 3, 2 y 1. Probabilidad de éxito del modelo: 0,368, 0,606, 0,716, 0,779, 0,846 y</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">0,920. Modelo: cada nivel cuesta un clic más 0,2·log2(opciones+1) s y se acierta con probabilidad 0,92; ambos valores son</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">supuestos. El modelo ignora que 4 096 opciones en una lista no se pueden leer: el error por nivel sube con la anchura, y</tspan></text><text x="470" y="521.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ese es el dato que habría que medir con árboles reales.</tspan></text><text x="470" y="569.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
