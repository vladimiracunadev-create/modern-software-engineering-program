" dy="0">16</tspan></text><rect x="230" y="182" width="144" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="302" y="203.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="302" dy="0">3</tspan></text><rect x="380" y="182" width="184" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="203.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">5,2 s</tspan></text><rect x="570" y="182" width="164" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="203.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">0,779</tspan></text><rect x="740" y="182" width="284" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="882" y="203.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">6,6 s</tspan></text><rect x="10" y="224" width="214" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="117" y="245.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="117" dy="0">64</tspan></text><rect x="230" y="224" width="144" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="302" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="302" dy="0">2</tspan></text><rect x="380" y="224" width="184" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">4,2 s</tspan></text><rect x="570" y="224" width="164" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">0,846</tspan></text><rect x="740" y="224" width="284" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="882" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">5,0 s</tspan></text><rect x="10" y="266" width="214" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="117" y="287.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="117" dy="0">4 096</tspan></text><rect x="230" y="266" width="144" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="302" y="287.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="302" dy="0">1</tspan></text><rect x="380" y="266" width="184" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="287.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">3,3 s</tspan></text><rect x="570" y="266" width="164" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="287.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">0,920</tspan></text><rect x="740" y="266" width="284" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="882" y="287.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">3,6 s</tspan></text><rect x="10" y="312" width="1020" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="520" y="336.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="520" dy="0">Modelo: cada nivel cuesta un clic más 0,2·log2(opciones+1) s y se acierta con probabilidad 0,92; ambos valores son supuestos. El modelo</tspan></text><text x="520" y="353.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="520" dy="0">ignora que 4 096 opciones en una lista no se pueden leer: el error por nivel sube con la anchura, y ese es el dato que habría que medir</tspan></text><text x="520" y="370.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="520" dy="0">con árboles reales.</tspan></text><text x="520" y="409.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="520" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
