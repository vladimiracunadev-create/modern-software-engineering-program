<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 423" width="1040" height="423" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Menú de 4 096 destinos: anchura frente a profundidad</title><desc id="d">Tabla con seis anchuras de menú: con 2 opciones por nivel hay 12 niveles, 14,6 s y 0,368 de éxito; con 8, cuatro niveles, 6,1 s y 0,716; con 64, dos niveles, 4,2 s y 0,846; una sola lista de 4 096 llega a 3,3 s y 0,92 bajo el supuesto de error constante por nivel.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1040" height="423" fill="#ffffff"/><rect x="10" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="117" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="117" dy="0">Opciones por nivel</tspan></text><rect x="230" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="302" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="302" dy="0">Niveles</tspan></text><rect x="380" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="472" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="472" dy="0">Tiempo</tspan></text><rect x="570" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="652" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="652" dy="0">Éxito</tspan></text><rect x="740" y="12" width="284" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="882" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="882" dy="0">Tiempo esperado por éxito</tspan></text><rect x="10" y="56" width="214" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="117" y="77.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="117" dy="0">2</tspan></text><rect x="230" y="56" width="144" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="302" y="77.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="302" dy="0">12</tspan></text><rect x="380" y="56" width="184" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="77.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">14,6 s</tspan></text><rect x="570" y="56" width="164" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="77.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">0,368</tspan></text><rect x="740" y="56" width="284" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="882" y="77.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">39,7 s</tspan></text><rect x="10" y="98" width="214" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="117" y="119.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="117" dy="0">4</tspan></text><rect x="230" y="98" width="144" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="302" y="119.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="302" dy="0">6</tspan></text><rect x="380" y="98" width="184" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="119.64" font-si