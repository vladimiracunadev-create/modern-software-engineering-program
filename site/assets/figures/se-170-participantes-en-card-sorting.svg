<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 351" width="960" height="351" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Correlación entre dos grupos independientes que ordenan 24 tarjetas en 4 categorías</title><desc id="d">Barras: la correlación entre las matrices de agrupación de dos grupos independientes es 0,67 con 5 participantes por grupo, 0,81 con 10, 0,86 con 15, 0,90 con 20 y 0,93 con 30; con 5 el peor caso de 100 repeticiones fue 0,47.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="351" fill="#ffffff"/><text x="260" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="260" dy="0">5 participantes</tspan></text><rect x="270" y="16" width="289.343" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="567.343" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="567.343" dy="0">0,67 (mínimo 0,47)</tspan></text><text x="260" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="260" dy="0">10 participantes</tspan></text><rect x="270" y="60" width="347.04" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="625.04" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="625.04" dy="0">0,81 (mínimo 0,70)</tspan></text><text x="260" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="260" dy="0">15 participantes</tspan></text><rect x="270" y="104" width="371.582" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="649.582" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="649.582" dy="0">0,86 (mínimo 0,77)</tspan></text><text x="260" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="260" dy="0">20 participantes</tspan></text><rect x="270" y="148" width="385.361" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="663.361" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="663.361" dy="0">0,90 (mínimo 0,84)</tspan></text><text x="260" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="260" dy="0">30 participantes</tspan></text><rect x="270" y="192" width="400" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="678" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="678" dy="0">0,93 (mínimo 0,90)</tspan></text><rect x="10" y="240" width="940" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">El acuerdo mejora con rendimientos decrecientes, y con pocas personas dos grupos pueden dar estructuras bastante distintas.</tspan></text><text x="480" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Los participantes simulados agrupan según una estructura verdadera con 25 % de ruido: ese ruido y esa estructura única son</tspan></text><text x="480" y="298.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">supuestos.</tspan></text><text x="480" y="337.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
