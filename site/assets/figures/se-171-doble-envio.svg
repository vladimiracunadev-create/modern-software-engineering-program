<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 247" width="1090" height="247" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Registros duplicados de 5 000 envíos con latencia lognormal y paciencia variable</title><desc id="d">Barras: de 5 000 envíos, sin protección se crean 1 411 registros duplicados; con el botón desactivado 156, de quienes recargan la página; con una clave de idempotencia ninguno, aunque el servidor recibe las mismas 6 411 peticiones.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1090" height="247" fill="#ffffff"/><text x="420" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Sin protección: registros duplicados</tspan></text><rect x="430" y="16" width="370" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="808" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="808" dy="0">1 411 (6 411 peticiones)</tspan></text><text x="420" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Botón desactivado (10 % recarga y reenvía)</tspan></text><rect x="430" y="60" width="40.9072" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="478.907" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="478.907" dy="0">156 (5 156 peticiones)</tspan></text><text x="420" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Clave de idempotencia en el servidor</tspan></text><rect x="430" y="104" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="442" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="442" dy="0">0 (6 411 peticiones)</tspan></text><rect x="10" y="152" width="1070" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="545" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="545" dy="0">Desactivar el botón evita el reenvío de quien no sale de la página, no de quien recarga ni de un reintento de red. Una clave de idempotencia no</tspan></text><text x="545" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="545" dy="0">reduce las peticiones, hace inocuo repetirlas. Latencia (mediana 0,9 s) y paciencia (mediana 1,5 s) son supuestos.</tspan></text><text x="545" y="233.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="545" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
