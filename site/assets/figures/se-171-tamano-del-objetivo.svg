<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 381" width="1000" height="381" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tamaño del objetivo: tiempo de apuntar y toques que caen fuera</title><desc id="d">Tabla con cinco tamaños de botón: el tiempo de la ley de Fitts baja de 0,89 a 0,66 segundos de 16 a 48 píxeles, y los toques que fallan con dispersión de 6, 10 y 14 píxeles pasan, con 24 píxeles, de 4,5 a 39,3 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="381" fill="#ffffff"/><rect x="10" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="102" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="102" dy="0">Ancho del objetivo</tspan></text><rect x="200" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="307" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="307" dy="0">Tiempo (D = 600 px)</tspan></text><rect x="420" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="512" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="512" dy="0">Fuera, σ = 6 px</tspan></text><rect x="610" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="702" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="702" dy="0">Fuera, σ = 10 px</tspan></text><rect x="800" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="892" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="892" dy="0">Fuera, σ = 14 px</tspan></text><rect x="10" y="56" width="184" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="77.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">16 px</tspan></text><rect x="200" y="56" width="214" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="77.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="307" dy="0">0,890 s</tspan></text><rect x="420" y="56" width="184" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="77.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">18,3 %</tspan></text><rect x="610" y="56" width="184" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="702" y="77.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">42,5 %</tspan></text><rect x="800" y="56" width="184" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="892" y="77.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">56,9 %</tspan></text><rect x="10" y="98" width="184" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="119.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">24 px</tspan></text><rect x="200" y="98" width="214" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="119.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="307" dy="0">0,805 s</tspan></text><rect x="420" y="98" width="184" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="119.6