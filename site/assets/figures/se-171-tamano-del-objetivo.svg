"800" y="224" width="184" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="892" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">8,7 %</tspan></text><rect x="10" y="270" width="980" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="500" y="294.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">Tiempo: 0,1 + 0,15·log2(D/W + 1), con constantes supuestas; fallo: probabilidad de que un toque con dispersión gaussiana caiga a</tspan></text><text x="500" y="311.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">más de W/2 del centro, en una dimensión. La dispersión de una persona con temblor, un dedo grande o un autobús en marcha no se</tspan></text><text x="500" y="328.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">midió: los tres σ son escenarios.</tspan></text><text x="500" y="367.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
