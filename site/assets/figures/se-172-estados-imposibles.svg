<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 387" width="1110" height="387" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Banderas independientes frente a un estado explícito</title><desc id="d">Tabla: tres banderas dan 8 combinaciones de las que solo 4 tienen sentido, y 198 de 200 eventos aleatorios terminan en una combinación imposible; un estado explícito con transiciones declaradas no llega a ninguna, y cuatro fuentes con cuatro estados crean 256 combinaciones.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1110" height="387" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Modelo del estado de la lista</tspan></text><rect x="340" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="432" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="432" dy="0">Combinaciones posibles</tspan></text><rect x="530" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="612" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="612" dy="0">Con significado</tspan></text><rect x="700" y="12" width="394" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="897" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="897" dy="0">Resultado en 200 eventos aleatorios</tspan></text><rect x="10" y="56" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="83.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Tres banderas booleanas</tspan></text><rect x="340" y="56" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="83.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">8</tspan></text><rect x="530" y="56" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="612" y="83.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612" dy="0">4</tspan></text><rect x="700" y="56" width="394" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="897" y="75.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="897" dy="0">198 de 200 eventos terminan en una combinación</tspan></text><text x="897" y="91.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="897" dy="0">imposible</tspan></text><rect x="10" y="110" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="137.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Un único estado con cuatro valores</tspan></text><rect x="340" y="110" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="137.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">4</tspan></text><rect x="530" y="110" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="612" y="137.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612" dy="0">4</tspan></text><rect x="700" y="110" width="394" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="897" y="137.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="897" dy="0">0 de 200: solo las transiciones declaradas</tspan></text><rect x="10" y="164" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="191.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Dos fuentes con cuatro estados cada una</tspan></text><rect x="340" y="164" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">16</tspan></text><rect x="530" y="164" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="612" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612" dy="0">16</tspan></text><rect x="700" y="164" width="394" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="897" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="897" dy="0">Cada combinación necesita un diseño</tspan></text><rect x="10" y="218" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="245.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Cuatro fuentes</tspan></text><rect x="340" y="218" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="245.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">256</tspan></text><rect x="530" y="218" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="612" y="245.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612" dy="0">256</tspan></text><rect x="700" y="218" width="394" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="897" y="245.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="897" dy="0">Un diseño por combinación ya no es viable</tspan></text><rect x="10" y="276" width="1090" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="555" y="300.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="555" dy="0">El manejador con banderas olvida apagar la carga y el error al llegar los datos: cada actualización es correcta por separado y el conjunto no. Los</tspan></text><text x="555" y="317.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="555" dy="0">eventos son aleatorios con semilla fija; en una aplicación real los eventos no son equiprobables, pero la combinación imposible sigue siendo</tspan></text><text x="555" y="334.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="555" dy="0">alcanzable.</tspan></text><text x="555" y="373.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="555" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
