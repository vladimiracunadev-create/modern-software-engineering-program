<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 461" width="1000" height="461" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Auditor de reglas sobre 12 defectos inyectados en un formulario de entrega</title><desc id="d">Tabla: un auditor de reglas sobre atributos detecta 7 de 12 defectos inyectados; detecta toda ausencia de atributo y ningún atributo presente pero incorrecto, como un texto alternativo que no describe, una etiqueta falsa, un título genérico o un idioma equivocado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="461" fill="#ffffff"/><rect x="10" y="12" width="494" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="257" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="257" dy="0">Defecto inyectado</tspan></text><rect x="510" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="582" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="582" dy="0">Detectados</tspan></text><rect x="660" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="822" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="822" dy="0">Por qué</tspan></text><rect x="10" y="56" width="494" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="85.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Falta lang, título, etiqueta, alt, nombre del botón o id duplicado</tspan></text><rect x="510" y="56" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">6 de 6</tspan></text><rect x="660" y="56" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">Regla mecánica sobre atributos</tspan></text><rect x="10" y="114" width="494" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="143.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Campo cuya única etiqueta es un placeholder</tspan></text><rect x="510" y="114" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">1 de 1</tspan></text><rect x="660" y="114" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">Se detecta como ausencia de etiqueta</tspan></text><rect x="10" y="172" width="494" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="201.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Texto alternativo «imagen1.png»</tspan></text><rect x="510" y="172" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">0 de 1</tspan></text><rect x="660" y="172" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">Hay alt, pero no describe</tspan></text><rect x="10" y="230" width="494" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="259.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Etiqueta que dice «Archivo» sobre el campo del nombre</tspan></text><rect x="510" y="230" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">0 de 1</tspan></text><rect x="660" y="230" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">Hay etiqueta, pero es falsa</tspan></text><rect x="10" y="288" width="494" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="317.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Título genérico, botón «Clic aquí», lang incorrecto</tspan></text><rect x="510" y="288" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="317.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">0 de 3</tspan></text><rect x="660" y="288" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="317.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">Están presentes y son incorrectos</tspan></text><rect x="10" y="350" width="980" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="500" y="374.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Siete de doce: las reglas ven presencia, no verdad. El auditor es un programa de 60 líneas con el analizador de HTML de la</tspan></text><text x="500" y="391.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">biblioteca estándar; una herramienta de producción tiene más reglas, pero la frontera es la misma, que algo presente puede ser</tspan></text><text x="500" y="408.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">incorrecto.</tspan></text><text x="500" y="447.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
