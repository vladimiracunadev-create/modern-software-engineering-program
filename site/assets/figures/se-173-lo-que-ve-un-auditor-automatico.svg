<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 478" width="940" height="478" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Auditor de reglas sobre 12 defectos inyectados en un formulario de entrega</title><desc id="d">Barras apiladas horizontales con los defectos inyectados que detecta un auditor de reglas, 7 de 12: detecta toda ausencia de atributo, 6 de 6 y 1 de 1, y ningún atributo presente pero incorrecto, como un texto alternativo que no describe, una etiqueta falsa, un título genérico o un idioma equivocado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="478" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Auditor de reglas sobre 12 defectos inyectados en un formulario de entrega</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Detectados</tspan></text><rect x="139.4" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="159.4" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="159.4" dy="0">No detectados</tspan></text><line x1="354" y1="77" x2="354" y2="297" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="297" x2="354" y2="302" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="527.9" y1="77" x2="527.9" y2="297" stroke="#d5dde1" stroke-width="1"/><line x1="527.9" y1="297" x2="527.9" y2="302" stroke="#5b7280" stroke-width="1.4"/><text x="527.9" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527.9" dy="0">2</tspan></text><line x1="701.8" y1="77" x2="701.8" y2="297" stroke="#d5dde1" stroke-width="1"/><line x1="701.8" y1="297" x2="701.8" y2="302" stroke="#5b7280" stroke-width="1.4"/><text x="701.8" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="701.8" dy="0">4</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="297" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="297" x2="875.7" y2="302" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">6</tspan></text><line x1="354" y1="297" x2="875.7" y2="297" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="95" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Falta lang, título, etiqueta, alt, nombre del</tspan></text><text x="344" y="112" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">botón o id duplicado</tspan></text><text x="344" y="147.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Campo cuya única etiqueta es un placeholder</tspan></text><text x="344" y="191.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Texto alternativo «imagen1.png»</tspan></text><text x="344" y="235.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Etiqueta «Archivo» sobre el campo del nombre</tspan></text><text x="344" y="279.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Título genérico, «Clic aquí», lang incorrecto</tspan></text><rect x="354" y="84" width="521.7" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="614.85" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="614.85" dy="0">6</tspan></text><rect x="875.7" y="84" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="103.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">6</tspan></text><rect x="354" y="128" width="86.95" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="397.475" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="397.475" dy="0">1</tspan></text><rect x="440.95" y="128" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="447.95" y="147.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="447.95" dy="0">1</tspan></text><rect x="354" y="172" width="0" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="354" y="172" width="86.95" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="397.475" y="191.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="397.475" dy="0">1</tspan></text><text x="447.95" y="191.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="447.95" dy="0">1</tspan></text><rect x="354" y="216" width="0" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="354" y="216" width="86.95" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="397.475" y="235.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="397.475" dy="0">1</tspan></text><text x="447.95" y="235.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="447.95" dy="0">1</tspan></text><rect x="354" y="260" width="0" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="354" y="260" width="260.85" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="484.425" y="279.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="484.425" dy="0">3</tspan></text><text x="621.85" y="279.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="621.85" dy="0">3</tspan></text><text x="614.85" y="341" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="614.85" dy="0">Defectos inyectados</tspan></text><rect x="10" y="355" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="379.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Siete de doce: las reglas ven presencia, no verdad. El auditor es un programa de 60 líneas con el analizador de HTML de la</tspan></text><text x="470" y="396.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">biblioteca estándar; una herramienta de producción tiene más reglas, pero la frontera es la misma, que algo presente puede</tspan></text><text x="470" y="413.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">ser incorrecto.</tspan></text><text x="470" y="460.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
