ext-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">#a8761a sobre #f7ebc8</tspan></text><rect x="340" y="224" width="134" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="407" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="407" dy="0">3,35</tspan></text><rect x="480" y="224" width="214" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587" dy="0">No</tspan></text><rect x="700" y="224" width="224" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">Sí</tspan></text><rect x="10" y="266" width="324" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="287.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">#ff0000 sobre #ffffff</tspan></text><rect x="340" y="266" width="134" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="407" y="287.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="407" dy="0">4,00</tspan></text><rect x="480" y="266" width="214" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587" y="287.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587" dy="0">No</tspan></text><rect x="700" y="266" width="224" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="287.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">Sí</tspan></text><rect x="10" y="312" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="336.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">De 20 000 pares de colores sRGB al azar, 12,0 % alcanza 4,5:1 y 26,5 % alcanza 3:1: elegir sin calcular suele fallar. El</tspan></text><text x="470" y="353.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">gris más claro que pasa 4,5:1 sobre blanco es #767676. La razón se calcula con la fórmula de luminancia relativa de WCAG;</tspan></text><text x="470" y="370.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">no sustituye mirar el texto con su tamaño y grosor reales.</tspan></text><text x="470" y="409.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
