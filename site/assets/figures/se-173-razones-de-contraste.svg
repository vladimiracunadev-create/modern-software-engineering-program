<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 539" width="940" height="539" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Razón de contraste de pares de colores de las figuras del programa y límites de WCAG</title><desc id="d">Barras horizontales con la razón de contraste de seis pares de colores y dos líneas en 3 y 4,5: 4,54, 4,48, 4,75, 4,22, 3,35 y 4,00; solo el gris 767676 y el verde azulado superan 4,5 para texto normal, y los seis superan 3 para texto grande y componentes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="539" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Razón de contraste de pares de colores de las figuras del programa y límites de WCAG</tspan></text><line x1="63.54" y1="347" x2="920" y2="347" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="347" x2="63.54" y2="347" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="351.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">0</tspan></text><line x1="63.54" y1="291" x2="920" y2="291" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="291" x2="63.54" y2="291" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="295.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">1</tspan></text><line x1="63.54" y1="235" x2="920" y2="235" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="235" x2="63.54" y2="235" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="239.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">2</tspan></text><line x1="63.54" y1="179" x2="920" y2="179" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="179" x2="63.54" y2="179" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="183.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">3</tspan></text><line x1="63.54" y1="123" x2="920" y2="123" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="123" x2="63.54" y2="123" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="127.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">4</tspan></text><line x1="63.54" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="67" x2="63.54" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">5</tspan></text><line x1="63.54" y1="67" x2="63.54" y2="347" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="207" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 207)">Razón de contraste (n : 1)</text><rect x="77.8143" y="92.76" width="114.195" height="254.24" rx="3" fill="#102a43"/><text x="134.912" y="86.76" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="134.912" dy="0">4,54</tspan></text><text x="134.912" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="134.912" dy="0">#767676 sobre</tspan></text><text x="134.912" y="385" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="134.912" dy="0">#ffffff</tspan></text><rect x="220.558" y="96.12" width="114.195" height="250.88" rx="3" fill="#102a43"/><text x="277.655" y="90.12" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="277.655" dy="0">4,48</tspan></text><text x="277.655" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="277.655" dy="0">#777777 sobre</tspan></text><text x="277.655" y="385" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="277.655" dy="0">#ffffff</tspan></text><rect x="363.301" y="81" width="114.195" height="266" rx="3" fill="#102a43"/><text x="420.398" y="75" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="420.398" dy="0">4,75</tspan></text><text x="420.398" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="420.398" dy="0">#087f8c sobre</tspan></text><text x="420.398" y="385" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="420.398" dy="0">#ffffff</tspan></text><rect x="506.044" y="110.68" width="114.195" height="236.32" rx="3" fill="#102a43"/><text x="563.142" y="104.68" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="563.142" dy="0">4,22</tspan></text><text x="563.142" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="563.142" dy="0">#c0432f sobre</tspan></text><text x="563.142" y="385" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="563.142" dy="0">#fbe4de</tspan></text><rect x="648.788" y="159.4" width="114.195" height="187.6" rx="3" fill="#102a43"/><text x="705.885" y="153.4" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="705.885" dy="0">3,35</tspan></text><text x="705.885" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705.885" dy="0">#a8761a sobre</tspan></text><text x="705.885" y="385" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705.885" dy="0">#f7ebc8</tspan></text><rect x="791.531" y="123" width="114.195" height="224" rx="3" fill="#102a43"/><text x="848.628" y="117" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="848.628" dy="0">4,00</tspan></text><text x="848.628" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="848.628" dy="0">#ff0000 sobre</tspan></text><text x="848.628" y="385" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="848.628" dy="0">#ffffff</tspan></text><line x1="63.54" y1="179" x2="920" y2="179" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="916" y="173" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="916" dy="0">3 : 1 grande y UI</tspan></text><line x1="63.54" y1="95" x2="920" y2="95" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="916" y="89" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="916" dy="0">4,5 : 1 texto</tspan></text><rect x="10" y="416" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="440.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">De 20 000 pares de colores sRGB al azar, 12,0 % alcanza 4,5:1 y 26,5 % alcanza 3:1: elegir sin calcular suele fallar. El</tspan></text><text x="470" y="457.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">gris más claro que pasa 4,5:1 sobre blanco es #767676. La razón se calcula con la fórmula de luminancia relativa de WCAG;</tspan></text><text x="470" y="474.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">no sustituye mirar el texto con su tamaño y grosor reales.</tspan></text><text x="470" y="521.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
