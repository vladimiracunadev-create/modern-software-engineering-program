<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 423" width="940" height="423" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Razón de contraste de pares de colores de las figuras del programa y límites de WCAG</title><desc id="d">Tabla de seis pares de colores con su razón de contraste: 4,54, 4,48, 4,75, 4,22, 3,35 y 4,00; solo el gris 767676 y el verde azulado pasan el mínimo de 4,5 para texto normal, y los seis pasan el mínimo de 3 para texto grande y componentes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="423" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Par de colores</tspan></text><rect x="340" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="407" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="407" dy="0">Razón</tspan></text><rect x="480" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="587" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="587" dy="0">Pasa 4,5:1 (texto)</tspan></text><rect x="700" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="812" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="812" dy="0">Pasa 3:1 (grande/UI)</tspan></text><rect x="10" y="56" width="324" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="77.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">#767676 sobre #ffffff</tspan></text><rect x="340" y="56" width="134" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="407" y="77.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="407" dy="0">4,54</tspan></text><rect x="480" y="56" width="214" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587" y="77.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587" dy="0">Sí</tspan></text><rect x="700" y="56" width="224" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="77.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">Sí</tspan></text><rect x="10" y="98" width="324" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="119.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">#777777 sobre #ffffff</tspan></text><rect x="340" y="98" width="134" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="407" y="119.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="407" dy="0">4,48</tspan></text><rect x="480" y="98" width="214" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587" y="119.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587" dy="0">No</tspan></text><rect x="700" y="98" width="224" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="119.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">Sí</tspan></text><rect x="10" y="140" width="324" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width=