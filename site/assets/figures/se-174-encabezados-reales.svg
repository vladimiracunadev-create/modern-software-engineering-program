<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 346" width="940" height="346" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Estructura navegable: encabezados reales frente a texto con aspecto de título</title><desc id="d">Barras horizontales con los encabezados disponibles para navegar en tres páginas: 12 con h2 reales, que permiten llegar a la sección 9 con 9 saltos en lugar de leer 201 nodos; ninguno con div estilizados; y 9 en una secuencia de niveles con un salto del 2 al 4.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="346" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Estructura navegable: encabezados reales frente a texto con aspecto de título</tspan></text><line x1="354" y1="49" x2="354" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="181" x2="354" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="463.176" y1="49" x2="463.176" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="463.176" y1="181" x2="463.176" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="463.176" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="463.176" dy="0">2,5</tspan></text><line x1="572.352" y1="49" x2="572.352" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="572.352" y1="181" x2="572.352" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="572.352" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572.352" dy="0">5</tspan></text><line x1="681.528" y1="49" x2="681.528" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="681.528" y1="181" x2="681.528" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="681.528" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="681.528" dy="0">7,5</tspan></text><line x1="790.704" y1="49" x2="790.704" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="790.704" y1="181" x2="790.704" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="790.704" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="790.704" dy="0">10</tspan></text><line x1="899.88" y1="49" x2="899.88" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="899.88" y1="181" x2="899.88" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="899.88" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="899.88" dy="0">12,5</tspan></text><line x1="354" y1="181" x2="899.88" y2="181" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="67" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Secciones con h2 reales (9 saltos en vez de</tspan></text><text x="344" y="84" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">201 nodos)</tspan></text><text x="344" y="111" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Secciones con div de clase «titulo» (201</tspan></text><text x="344" y="128" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">nodos, sin saltos)</tspan></text><text x="344" y="155" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Niveles 1, 2, 2, 3, 3, 2, 4, 2, 3 (un salto</tspan></text><text x="344" y="172" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">del 2 al 4)</tspan></text><rect x="354" y="55" width="524.045" height="32" rx="3" fill="#087f8c"/><text x="885.045" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="885.045" dy="0">12</tspan></text><rect x="354" y="99" width="2" height="32" rx="3" fill="#087f8c"/><text x="363" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="143" width="393.034" height="32" rx="3" fill="#087f8c"/><text x="754.034" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="754.034" dy="0">9</tspan></text><text x="626.94" y="225" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="626.94" dy="0">Encabezados disponibles para saltar</tspan></text><rect x="10" y="239" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="263.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El analizador cuenta nodos y encabezados de una página generada; no mide cómo navega una persona con un lector de pantalla,</tspan></text><text x="470" y="280.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">que combina atajos, listas de enlaces y regiones. El número de nodos lo fija la página sintética (12 × 24 + 12 + 1).</tspan></text><text x="470" y="328.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
