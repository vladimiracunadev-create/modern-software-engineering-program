<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 315" width="940" height="315" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Nombre accesible de ocho controles con un cálculo simplificado de la norma</title><desc id="d">Barra apilada con el nombre accesible de ocho fragmentos de HTML: dos controles tienen un nombre fiable, un campo tiene el del placeholder, que desaparece al escribir, y cinco quedan sin nombre, entre ellos tres botones o enlaces sin contenido y un campo cuya etiqueta apunta a otro id.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="315" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Nombre accesible de ocho controles con un cálculo simplificado de la norma</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Nombre por contenido o aria-label</tspan></text><rect x="312.82" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="332.82" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="332.82" dy="0">Nombre frágil (placeholder)</tspan></text><rect x="564.4" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="584.4" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="584.4" dy="0">Sin nombre</tspan></text><line x1="164" y1="77" x2="164" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="164" y1="117" x2="164" y2="122" stroke="#5b7280" stroke-width="1.4"/><text x="164" y="138" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="164" dy="0">0</tspan></text><line x1="341.925" y1="77" x2="341.925" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="341.925" y1="117" x2="341.925" y2="122" stroke="#5b7280" stroke-width="1.4"/><text x="341.925" y="138" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="341.925" dy="0">2</tspan></text><line x1="519.85" y1="77" x2="519.85" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="519.85" y1="117" x2="519.85" y2="122" stroke="#5b7280" stroke-width="1.4"/><text x="519.85" y="138" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="519.85" dy="0">4</tspan></text><line x1="697.775" y1="77" x2="697.775" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="697.775" y1="117" x2="697.775" y2="122" stroke="#5b7280" stroke-width="1.4"/><text x="697.775" y="138" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697.775" dy="0">6</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="117" x2="875.7" y2="122" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="138" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">8</tspan></text><line x1="164" y1="117" x2="875.7" y2="117" stroke="#5b7280" stroke-width="1.6"/><text x="154" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="154" dy="0">Ocho fragmentos</tspan></text><rect x="164" y="84" width="177.925" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="252.963" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="252.963" dy="0">2</tspan></text><rect x="341.925" y="84" width="88.9625" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="386.406" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="386.406" dy="0">1</tspan></text><rect x="430.888" y="84" width="444.812" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="653.294" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="653.294" dy="0">5</tspan></text><text x="882.7" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">8</tspan></text><text x="519.85" y="161" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="519.85" dy="0">Controles</tspan></text><rect x="10" y="175" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="199.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Sin nombre: &lt;button&gt;&lt;/button&gt;, &lt;button&gt;&lt;img&gt;&lt;/button&gt;, el enlace con un span de icono, el campo con label que apunta a otro</tspan></text><text x="470" y="216.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">id y &lt;input aria-label=&quot;&quot;&gt;. Con nombre: &lt;button&gt;Enviar&lt;/button&gt; y &lt;button aria-label=&quot;Cerrar&quot;&gt;. En 12 fragmentos de prueba,</tspan></text><text x="470" y="233.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">5 controles quedaron sin nombre. El cálculo implementa solo un subconjunto de la norma; no cubre imágenes dentro de botones</tspan></text><text x="470" y="249.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">con alt, listas, ni la salida real de un lector de pantalla.</tspan></text><text x="470" y="297.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
