6"/><text x="500" y="404.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">En 12 fragmentos de prueba, 5 controles quedaron sin nombre. El cálculo implementa solo un subconjunto de la norma</tspan></text><text x="500" y="421.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">(aria-labelledby, aria-label, label, contenido, title, placeholder); no cubre imágenes dentro de botones con alt, listas, ni la</tspan></text><text x="500" y="438.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">salida real de un lector de pantalla.</tspan></text><text x="500" y="477.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
