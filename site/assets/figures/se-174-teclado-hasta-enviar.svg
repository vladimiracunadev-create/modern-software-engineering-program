<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 307" width="1100" height="307" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Teclado en una página con 40 enlaces de navegación y un formulario</title><desc id="d">Barras: sin enlace de salto, llegar al botón Enviar exige 43 pulsaciones de Tab; con él, 5; de 44 controles interactivos, 42 se alcanzan por teclado porque los dos que son un div con clic quedan fuera.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1100" height="307" fill="#ffffff"/><text x="520" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="520" dy="0">Sin enlace de salto: pulsaciones de Tab hasta «Enviar»</tspan></text><rect x="530" y="16" width="410.455" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="948.455" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="948.455" dy="0">43</tspan></text><text x="520" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="520" dy="0">Con enlace de salto: Tab, Intro y 3 Tab</tspan></text><rect x="530" y="60" width="47.7273" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="585.727" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="585.727" dy="0">5</tspan></text><text x="520" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="520" dy="0">Controles interactivos de la página</tspan></text><rect x="530" y="104" width="420" height="28" rx="3" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="958" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="958" dy="0">44</tspan></text><text x="520" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="520" dy="0">De ellos, alcanzables por teclado</tspan></text><rect x="530" y="148" width="400.909" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="938.909" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="938.909" dy="0">42</tspan></text><rect x="10" y="196" width="1080" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="550" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="550" dy="0">Un div con un controlador de clic parece un botón y no recibe foco, ni responde a Intro ni a Espacio. Un tabindex positivo cambia el orden (C, B,</tspan></text><text x="550" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="550" dy="0">A, D en lugar de A, B, C, D) y se rompe con cada elemento nuevo. Un modal sin salida con Escape atrapó el foco durante las 30 pulsaciones</tspan></text><text x="550" y="254.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="550" dy="0">simuladas.</tspan></text><text x="550" y="293.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="550" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
