<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 457" width="940" height="457" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Distancia de color entre dos estados con visión normal y tres simulaciones de daltonismo</title><desc id="d">Mapa de calor con la diferencia de color en CIELAB de cinco pares de colores con visión normal y con simulaciones de protanopía, deuteranopía y tritanopía: el par rojo y verde pasa de 119,8 a 7,3 en deuteranopía; azul y naranja se mantiene por encima de 96.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="457" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Distancia de color entre dos estados con visión normal y tres simulaciones de daltonismo</tspan></text><text x="372.25" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="372.25" dy="0">Normal</tspan></text><text x="528.75" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="528.75" dy="0">Protanopía</tspan></text><text x="685.25" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="685.25" dy="0">Deuteranopía</tspan></text><text x="841.75" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="841.75" dy="0">Tritanopía</tspan></text><text x="284" y="98.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="284" dy="0">Rojo #d62728 / verde #2ca02c</tspan></text><text x="284" y="142.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="284" dy="0">Rojo claro / verde claro</tspan></text><text x="284" y="186.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="284" dy="0">Coral / verde azulado de las figuras</tspan></text><text x="284" y="230.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="284" dy="0">Azul / naranja</tspan></text><text x="284" y="274.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="284" dy="0">Ámbar / verde azulado</tspan></text><rect x="295.5" y="73.5" width="153.5" height="41" rx="4" fill="#18324a" stroke="#ffffff" stroke-width="1"/><text x="372.25" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="372.25" dy="0">119,8</tspan></text><rect x="452" y="73.5" width="153.5" height="41" rx="4" fill="#9dabb9" stroke="#ffffff" stroke-width="1"/><text x="528.75" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="528.75" dy="0">37,6</tspan></text><rect x="608.5" y="73.5" width="153.5" height="41" rx="4" fill="#cdd7e2" stroke="#102a43" stroke-width="3"/><text x="685.25" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="685.25" dy="0">7,3</tspan></text><rect x="765" y="73.5" width="153.5" height="41" rx="4" fill="#112b44" stroke="#ffffff" stroke-width="1"/><text x="841.75" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="841.75" dy="0">124,4</tspan></text><rect x="295.5" y="117.5" width="153.5" height="41" rx="4" fill="#2e455c" stroke="#ffffff" stroke-width="1"/><text x="372.25" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="372.25" dy="0">106,6</tspan></text><rect x="452" y="117.5" width="153.5" height="41" rx="4" fill="#b2becb" stroke="#ffffff" stroke-width="1"/><text x="528.75" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="528.75" dy="0">24,2</tspan></text><rect x="608.5" y="117.5" width="153.5" height="41" rx="4" fill="#c3ced9" stroke="#ffffff" stroke-width="1"/><text x="685.25" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="685.25" dy="0">13,9</tspan></text><rect x="765" y="117.5" width="153.5" height="41" rx="4" fill="#19334b" stroke="#ffffff" stroke-width="1"/><text x="841.75" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="841.75" dy="0">119,1</tspan></text><rect x="295.5" y="161.5" width="153.5" height="41" rx="4" fill="#475c71" stroke="#ffffff" stroke-width="1"/><text x="372.25" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="372.25" dy="0">90,8</tspan></text><rect x="452" y="161.5" width="153.5" height="41" rx="4" fill="#95a4b3" stroke="#ffffff" stroke-width="1"/><text x="528.75" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="528.75" dy="0">42,2</tspan></text><rect x="608.5" y="161.5" width="153.5" height="41" rx="4" fill="#768899" stroke="#ffffff" stroke-width="1"/><text x="685.25" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="685.25" dy="0">61,3</tspan></text><rect x="765" y="161.5" width="153.5" height="41" rx="4" fill="#31495f" stroke="#ffffff" stroke-width="1"/><text x="841.75" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="841.75" dy="0">104,2</tspan></text><rect x="295.5" y="205.5" width="153.5" height="41" rx="4" fill="#152e47" stroke="#ffffff" stroke-width="1"/><text x="372.25" y="230.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="372.25" dy="0">122,0</tspan></text><rect x="452" y="205.5" width="153.5" height="41" rx="4" fill="#374d63" stroke="#ffffff" stroke-width="1"/><text x="528.75" y="230.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="528.75" dy="0">101,0</tspan></text><rec