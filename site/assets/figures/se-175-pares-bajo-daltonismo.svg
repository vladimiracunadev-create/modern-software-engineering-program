"#495f73"/><rect x="504.62" y="306" width="30.5" height="14" fill="#2d445b"/><rect x="534.62" y="306" width="30.5" height="14" fill="#102a43"/><text x="572.62" y="318" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="572.62" dy="0">125,0</tspan></text><text x="618.32" y="318" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="618.32" dy="0">más oscuro = mayor (ΔE en CIELAB)</tspan></text><rect x="10" y="334" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="358.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Con ΔE menor que 10 el par se confunde (celda resaltada: rojo y verde para deuteranopía, 7,3, con un contraste de</tspan></text><text x="470" y="375.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">luminancia de 1,48:1). Contraste de luminancia de cada par: 1,48, 1,34, 1,08, 1,90 y 1,19. Aplicar las matrices de Machado</tspan></text><text x="470" y="392.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">en RGB lineal es una aproximación; ninguna simulación reemplaza a personas con esa visión ni abarca los casos parciales.</tspan></text><text x="470" y="439.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
