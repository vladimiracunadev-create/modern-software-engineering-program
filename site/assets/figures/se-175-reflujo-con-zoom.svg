<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 293" width="1110" height="293" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reflujo: la misma página ampliada en una ventana de 1 280 px</title><desc id="d">Tabla de tres maquetaciones a ampliación del 100, 200 y 400 por ciento en una ventana de 1 280 píxeles: el contenedor fluido nunca desborda, el de 600 píxeles desborda a 400 por ciento y la tabla de 700 píxeles ya desborda a 200 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1110" height="293" fill="#ffffff"/><rect x="10" y="12" width="354" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="187" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="187" dy="0">Maquetación</tspan></text><rect x="370" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="467" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="467" dy="0">100 % (1 280 px CSS)</tspan></text><rect x="570" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="682" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="682" dy="0">200 % (640 px CSS)</tspan></text><rect x="800" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="947" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="947" dy="0">400 % (320 px CSS)</tspan></text><rect x="10" y="56" width="354" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="187" y="79.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="187" dy="0">Contenedor fluido con texto de 16 px</tspan></text><rect x="370" y="56" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="467" y="79.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">No desborda</tspan></text><rect x="570" y="56" width="224" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="79.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">No desborda</tspan></text><rect x="800" y="56" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="947" y="79.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="947" dy="0">No desborda (14 líneas, 36 car.)</tspan></text><rect x="10" y="102" width="354" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="187" y="125.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="187" dy="0">Contenedor fijo de 600 px</tspan></text><rect x="370" y="102" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="467" y="125.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">No desborda</tspan></text><rect x="570" y="102" width="224" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="125.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">No desborda</tspan></text><rect x="800" y="102" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="947" y="125.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="947" dy="0">Desborda: 600 px en 320 px</tspan></text><rect x="10" y="148" width="354" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="187" y="171.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="187" dy="0">Tabla de cinco columnas de 140 px</tspan></text><rect x="370" y="148" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="467" y="171.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">No desborda</tspan></text><rect x="570" y="148" width="224" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="171.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">Desborda (700 px en 640)</tspan></text><rect x="800" y="148" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="947" y="171.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="947" dy="0">Desborda: 700 px en 320 px</tspan></text><rect x="10" y="198" width="1090" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="555" y="222.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="555" dy="0">Ampliar el texto al 400 % equivale a un ancho de 320 px CSS en una ventana de 1 280 px; el criterio de reflujo pide no exigir desplazamiento en</tspan></text><text x="555" y="239.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="555" dy="0">dos dimensiones. El cálculo compara anchos fijos con el ancho disponible y supone 0,5 em por carácter: no sustituye abrir la página y ampliarla.</tspan></text><text x="555" y="279.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="555" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
