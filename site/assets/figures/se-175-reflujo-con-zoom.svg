<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 386" width="940" height="386" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reflujo: la misma página ampliada en una ventana de 1 280 px</title><desc id="d">Mapa de calor binario con el desborde de tres maquetaciones a ampliación del 100, 200 y 400 por ciento en una ventana de 1 280 píxeles: el contenedor fluido nunca desborda, el de 600 píxeles desborda a 400 por ciento y la tabla de 700 píxeles ya desborda a 200 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="386" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Reflujo: la misma página ampliada en una ventana de 1 280 px</tspan></text><text x="398.333" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="398.333" dy="0">100 % (1 280 px CSS)</tspan></text><text x="607" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="607" dy="0">200 % (640 px CSS)</tspan></text><text x="815.667" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="815.667" dy="0">400 % (320 px CSS)</tspan></text><text x="284" y="98.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="284" dy="0">Contenedor fluido con texto de 16 px</tspan></text><text x="284" y="142.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="284" dy="0">Contenedor fijo de 600 px</tspan></text><text x="284" y="186.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="284" dy="0">Tabla de cinco columnas de 140 px</tspan></text><rect x="295.5" y="73.5" width="205.667" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="398.333" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="398.333" dy="0">no desborda</tspan></text><rect x="504.167" y="73.5" width="205.667" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="607" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="607" dy="0">no desborda</tspan></text><rect x="712.833" y="73.5" width="205.667" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="815.667" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="815.667" dy="0">no desborda</tspan></text><rect x="295.5" y="117.5" width="205.667" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="398.333" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="398.333" dy="0">no desborda</tspan></text><rect x="504.167" y="117.5" width="205.667" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="607" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="607" dy="0">no desborda</tspan></text><rect x="712.833" y="117.5" width="205.667" height="41" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="815.667" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="815.667" dy="0">desborda</tspan></text><rect x="295.5" y="161.5" width="205.667" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="398.333" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="398.333" dy="0">no desborda</tspan></text><rect x="504.167" y="161.5" width="205.667" height="41" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="607" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="607" dy="0">desborda</tspan></text><rect x="712.833" y="161.5" width="205.667" height="41" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="815.667" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="815.667" dy="0">desborda</tspan></text><text x="294" y="230" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="294" dy="0">no desborda</tspan></text><rect x="384.94" y="218" width="30.5" height="14" fill="#fbe4de"/><rect x="414.94" y="218" width="30.5" height="14" fill="#f3cdc5"/><rect x="444.94" y="218" width="30.5" height="14" fill="#eab6ac"/><rect x="474.94" y="218" width="30.5" height="14" fill="#e29f93"/><rect x="504.94" y="218" width="30.5" height="14" fill="#d9887a"/><rect x="534.94" y="218" width="30.5" height="14" fill="#d17161"/><rect x="564.94" y="218" width="30.5" height="14" fill="#c85a48"/><rect x="594.94" y="218" width="30.5" height="14" fill="#c0432f"/><text x="632.94" y="230" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="632.94" dy="0">desborda</tspan></text><text x="701.26" y="230" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="701.26" dy="0">más oscuro = mayor (desborde)</tspan></text><rect x="10" y="246" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="270.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">A 200 % la tabla ocupa 700 px en 640 y a 400 % 700 px en 320; el contenedor de 600 px desborda 600 px en 320 px. Ampliar el</tspan></text><text x="470" y="287.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">texto al 400 % equivale a un ancho de 320 px CSS en una ventana de 1 280 px; el criterio de reflujo pide no exigir</tspan></text><text x="470" y="304.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">desplazamiento en dos dimensiones. El cálculo compara anchos fijos con el ancho disponible y supone 0,5 em por carácter: no</tspan></text><text x="470" y="320.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">sustituye abrir la página y ampliarla.</tspan></text><text x="470" y="368.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
