<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 247" width="1080" height="247" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Anchos de pantalla de un conjunto sintético de 10 000 con tres maquetaciones</title><desc id="d">Barras: sobre 10 000 anchos de pantalla sintéticos, una maquetación con puntos de corte en 768 y 1 024 píxeles deja 212 tarjetas más estrechas que 280 píxeles y ningún desborde; una rejilla fluida con mínimo de 280 píxeles falla en 81.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1080" height="247" fill="#ffffff"/><text x="440" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="440" dy="0">Dos puntos de corte: tarjetas de menos de 280 px</tspan></text><rect x="450" y="16" width="440" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="898" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="898" dy="0">212 de 10 000</tspan></text><text x="440" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="440" dy="0">Dos puntos de corte: desborde horizontal</tspan></text><rect x="450" y="60" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="462" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="462" dy="0">0</tspan></text><text x="440" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="440" dy="0">Rejilla fluida con mínimo de 280 px: fallos</tspan></text><rect x="450" y="104" width="168.113" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="626.113" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="626.113" dy="0">81</tspan></text><rect x="10" y="152" width="1060" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="540" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="540" dy="0">Los 212 fallos de la maquetación fija son anchos de 280 a 311 px (una columna con márgenes queda bajo 280 px); los 81 de la rejilla fluida,</tspan></text><text x="540" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="540" dy="0">anchos de 280 a 291 px. La mezcla de anchos de pantalla es una asignación del autor y no refleja a ninguna población real de usuarios.</tspan></text><text x="540" y="233.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="540" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
