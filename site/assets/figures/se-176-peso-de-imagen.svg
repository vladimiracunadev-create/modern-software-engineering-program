<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 339" width="950" height="339" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una imagen de 2 400 px frente a cuatro anchos con srcset en una conexión supuesta de 1,6 Mbit/s</title><desc id="d">Tabla de cuatro dispositivos: una única imagen de 2 400 píxeles pesa 810 kilobytes y tarda 4,2 segundos a 1,6 megabits por segundo; con cuatro anchos disponibles, los teléfonos descargan 202 kilobytes en 1,2 segundos y los equipos que necesitan el ancho máximo no ganan nada.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="339" fill="#ffffff"/><rect x="10" y="12" width="334" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="177" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="177" dy="0">Dispositivo</tspan></text><rect x="350" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="457" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="457" dy="0">Una imagen</tspan></text><rect x="570" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="677" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="677" dy="0">Con cuatro anchos</tspan></text><rect x="790" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="862" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="862" dy="0">Variación</tspan></text><rect x="10" y="56" width="334" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="177" y="77.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177" dy="0">Teléfono de 360 px, densidad 3</tspan></text><rect x="350" y="56" width="214" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="77.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">810 kB · 4,2 s</tspan></text><rect x="570" y="56" width="214" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="677" y="77.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="677" dy="0">202 kB · 1,2 s</tspan></text><rect x="790" y="56" width="144" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="77.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">−75 %</tspan></text><rect x="10" y="98" width="334" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="177" y="119.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177" dy="0">Teléfono de 390 px, densidad 3</tspan></text><rect x="350" y="98" width="214" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="119.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">810 kB · 4,2 s</tspan></text><rect x="570" y="98" width="214" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="677" y="119.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="677" dy="0">202 kB · 1,2 s</tspan></text><rect x="790" y="98" width="144" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="119.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">−75 %</tspan></text><rect x="10" y="140" width="334" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="177" y="161.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177" dy="0">Tableta de 800 px, densidad 2</tspan></text><rect x="350" y="140" width="214" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">810 kB · 4,2 s</tspan></text><rect x="570" y="140" width="214" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="677" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="677" dy="0">810 kB · 4,2 s</tspan></text><rect x="790" y="140" width="144" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">0 %</tspan></text><rect x="10" y="182" width="334" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="177" y="203.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177" dy="0">Portátil de 1 280 px, densidad 1</tspan></text><rect x="350" y="182" width="214" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="203.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">810 kB · 4,2 s</tspan></text><rect x="570" y="182" width="214" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="677" y="203.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="677" dy="0">810 kB · 4,2 s</tspan></text><rect x="790" y="182" width="144" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="203.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">0 %</tspan></text><rect x="10" y="228" width="930" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="475" y="252.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">Peso estimado como píxeles × 0,5625 × 0,25 bytes por píxel (supuesto del autor) y tiempo como bytes ÷ ancho de banda + 0,15</tspan></text><text x="475" y="269.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">s de latencia. La compresión real depende del contenido y del formato; el ahorro de un teléfono se debe a que una imagen más</tspan></text><text x="475" y="286.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">pequeña basta y no a una mejor compresión.</tspan></text><text x="475" y="325.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
