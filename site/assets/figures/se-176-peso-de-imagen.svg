<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 547" width="940" height="547" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una imagen de 2 400 px frente a cuatro anchos con srcset en una conexión supuesta de 1,6 Mbit/s</title><desc id="d">Barras agrupadas con los kilobytes que descarga cada dispositivo: una única imagen de 2400 píxeles pesa 810 en todos y tarda 4,2 segundos; con cuatro anchos, los teléfonos de 360 y 390 píxeles descargan 202 kilobytes en 1,2 segundos y la tableta y el portátil siguen en 810.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="547" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Una imagen de 2 400 px frente a cuatro anchos con srcset en una conexión supuesta de 1,6 Mbit/s</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Una imagen</tspan></text><rect x="139.4" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="159.4" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="159.4" dy="0">Con cuatro anchos</tspan></text><line x1="93.7" y1="355" x2="920" y2="355" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="355" x2="93.7" y2="355" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="359.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">0</tspan></text><line x1="93.7" y1="303" x2="920" y2="303" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="303" x2="93.7" y2="303" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="307.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">200</tspan></text><line x1="93.7" y1="251" x2="920" y2="251" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="251" x2="93.7" y2="251" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="255.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">400</tspan></text><line x1="93.7" y1="199" x2="920" y2="199" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="199" x2="93.7" y2="199" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="203.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">600</tspan></text><line x1="93.7" y1="147" x2="920" y2="147" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="147" x2="93.7" y2="147" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="151.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">800</tspan></text><line x1="93.7" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="95" x2="93.7" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1 000</tspan></text><line x1="93.7" y1="95" x2="93.7" y2="355" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="225" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 225)">Kilobytes descargados</text><rect x="114.357" y="144.4" width="80.63" height="210.6" rx="3" fill="#6b7c86"/><text x="154.672" y="138.4" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="154.672" dy="0">810</tspan></text><rect x="198.987" y="302.48" width="80.63" height="52.52" rx="3" fill="#087f8c"/><text x="239.302" y="296.48" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="239.302" dy="0">202</tspan></text><text x="196.987" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="196.987" dy="0">Teléfono 360 px ×3</tspan></text><rect x="320.933" y="144.4" width="80.63" height="210.6" rx="3" fill="#6b7c86"/><text x="361.248" y="138.4" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="361.248" dy="0">810</tspan></text><rect x="405.562" y="302.48" width="80.63" height="52.52" rx="3" fill="#087f8c"/><text x="445.877" y="296.48" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="445.877" dy="0">202</tspan></text><text x="403.562" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="403.562" dy="0">Teléfono 390 px ×3</tspan></text><rect x="527.507" y="144.4" width="80.63" height="210.6" rx="3" fill="#6b7c86"/><text x="567.822" y="138.4" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="567.822" dy="0">810</tspan></text><rect x="612.137" y="144.4" width="80.63" height="210.6" rx="3" fill="#087f8c"/><text x="652.452" y="138.4" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="652.452" dy="0">810</tspan></text><text x="610.137" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="610.137" dy="0">Tableta 800 px ×2</tspan></text><rect x="734.082" y="144.4" width="80.63" height="210.6" rx="3" fill="#6b7c86"/><text x="774.398" y="138.4" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="774.398" dy="0">810</tspan></text><rect x="818.712" y="144.4" width="80.63" height="210.6" rx="3" fill="#087f8c"/><text x="859.027" y="138.4" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="859.027" dy="0">810</tspan></text><text x="816.712" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="816.712" dy="0">Portátil 1 280 px ×1</tspan></text><rect x="10" y="407" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="431.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Tiempos: 4,2 s con la imagen única en los cuatro y 1,2 s con cuatro anchos en los teléfonos (−75 %); la tableta y el</tspan></text><text x="470" y="448.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">portátil no ganan nada. Peso estimado como píxeles × 0,5625 × 0,25 bytes por píxel (supuesto del autor) y tiempo como bytes</tspan></text><text x="470" y="465.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">÷ ancho de banda + 0,15 s de latencia. La compresión real depende del contenido y del formato; el ahorro de un teléfono se</tspan></text><text x="470" y="481.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">debe a que una imagen más pequeña basta y no a una mejor compresión.</tspan></text><text x="470" y="529.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
