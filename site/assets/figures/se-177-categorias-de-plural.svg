<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 263" width="1090" height="263" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Formas de plural que necesita una cadena para los números de 0 a 120</title><desc id="d">Barras: para los números de 0 a 120, inglés y español necesitan 2 formas de plural, ruso y polaco 3 y árabe 6; una regla que solo distingue el 1 del resto se equivoca en 120 de 121 números en ruso y polaco y en 117 en árabe.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1090" height="263" fill="#ffffff"/><text x="260" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="260" dy="0">Inglés, español</tspan></text><rect x="270" y="16" width="146.667" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="424.667" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="424.667" dy="0">2 formas (one, other)</tspan></text><text x="260" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="260" dy="0">Ruso, polaco</tspan></text><rect x="270" y="60" width="220" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="498" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="498" dy="0">3 formas (one, few, many)</tspan></text><text x="260" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="260" dy="0">Árabe</tspan></text><rect x="270" y="104" width="440" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="718" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="718" dy="0">6 formas (zero, one, two, few, many, other)</tspan></text><rect x="10" y="152" width="1070" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="545" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="545" dy="0">Las categorías vienen de las reglas de CLDR para enteros. Una regla «si n es 1, singular, si no, plural» sirve en inglés y español, y en ruso o</tspan></text><text x="545" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="545" dy="0">polaco se equivoca incluso con 21 (que es «one»). Se contó de 0 a 120: con números mayores y decimales hay más casos, y español añade una</tspan></text><text x="545" y="210.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="545" dy="0">categoría para millones.</tspan></text><text x="545" y="249.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="545" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
