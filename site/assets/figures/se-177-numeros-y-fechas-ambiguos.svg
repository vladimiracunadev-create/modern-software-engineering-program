<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 411" width="1040" height="411" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cadenas numéricas y fechas que dos configuraciones leen de forma distinta</title><desc id="d">Tabla: la cadena 1.234 vale 1,234 en inglés de EE. UU. y mil doscientos treinta y cuatro en español de Chile; 0,5 se lee 5 si se ignora la coma; y 132 de las 365 fechas de 2026 son ambiguas entre día y mes primero, el 36,2 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1040" height="411" fill="#ffffff"/><rect x="10" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="142" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="142" dy="0">Texto</tspan></text><rect x="280" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="412" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="412" dy="0">Lectura A</tspan></text><rect x="550" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="672" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="672" dy="0">Lectura B</tspan></text><rect x="800" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="912" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="912" dy="0">Consecuencia</tspan></text><rect x="10" y="56" width="264" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="80.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">1.234</tspan></text><rect x="280" y="56" width="264" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="412" y="80.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412" dy="0">1,234 (inglés de EE. UU.)</tspan></text><rect x="550" y="56" width="244" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="80.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">1 234 (español de Chile)</tspan></text><rect x="800" y="56" width="224" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="912" y="80.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">Mil veces de diferencia</tspan></text><rect x="10" y="104" width="264" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="128.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">1,234</tspan></text><rect x="280" y="104" width="264" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="412" y="128.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412" dy="0">1 234</tspan></text><rect x="550" y="104" width="244" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="128.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">1,234</tspan></text><rect x="800" y="104" width="224" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="912" y="128.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">Mil veces de diferencia</tspan></text><rect x="10" y="152" width="264" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="176.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">0,5</tspan></text><rect x="280" y="152" width="264" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="412" y="176.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412" dy="0">5 (se ignora la coma)</tspan></text><rect x="550" y="152" width="244" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="176.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">0,5</tspan></text><rect x="800" y="152" width="224" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="912" y="176.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">Diez veces de diferencia</tspan></text><rect x="10" y="200" width="264" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="224.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">1.5</tspan></text><rect x="280" y="200" width="264" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="412" y="224.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412" dy="0">1,5</tspan></text><rect x="550" y="200" width="244" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="224.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">15</tspan></text><rect x="800" y="200" width="224" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="912" y="224.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">Diez veces de diferencia</tspan></text><rect x="10" y="248" width="264" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="272.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">Fechas de 2026 como DD/MM o MM/DD</tspan></text><rect x="280" y="248" width="264" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="412" y="272.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412" dy="0">132 de 365</tspan></text><rect x="550" y="248" width="244" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="272.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">36,2 % ambiguas</tspan></text><rect x="800" y="248" width="224" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="912" y="272.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">Día ≤ 12 y distinto del mes</tspan></text><rect x="10" y="300" width="1020" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="520" y="324.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="520" dy="0">Las lecturas aplican a mano las convenciones de dos configuraciones (coma o punto decimal); no consultan ninguna biblioteca de</tspan></text><text x="520" y="341.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="520" dy="0">localización. El 36,2 % cuenta los días con día entre 1 y 12 y distinto del mes; guardar fechas como ISO 8601 y presentar el mes con su</tspan></text><text x="520" y="358.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="520" dy="0">nombre elimina la ambigüedad.</tspan></text><text x="520" y="397.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="520" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
