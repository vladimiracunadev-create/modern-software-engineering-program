<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 423" width="1020" height="423" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una misma «letra» que se cuenta de maneras distintas</title><desc id="d">Tabla de cadenas con su longitud en puntos de código, en bytes UTF-8 y en unidades UTF-16: José tiene 4 o 5 puntos según se componga el acento, un emoji de tres símbolos unidos tiene 3 puntos, 11 bytes y 5 unidades, y las mayúsculas de «straße» son «STRASSE».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1020" height="423" fill="#ffffff"/><rect x="10" y="12" width="394" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="207" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="207" dy="0">Cadena</tspan></text><rect x="410" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="517" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="517" dy="0">Puntos de código</tspan></text><rect x="630" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="722" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="722" dy="0">Bytes UTF-8</tspan></text><rect x="820" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="912" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="912" dy="0">Unidades UTF-16</tspan></text><rect x="10" y="56" width="394" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="77.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">José (composición precompuesta)</tspan></text><rect x="410" y="56" width="214" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="517" y="77.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517" dy="0">4</tspan></text><rect x="630" y="56" width="184" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="77.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">5</tspan></text><rect x="820" y="56" width="184" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="912" y="77.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">4</tspan></text><rect x="10" y="98" width="394" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="119.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">José con acento combinado</tspan></text><rect x="410" y="98" width="214" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="517" y="119.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517" dy="0">5</tspan></text><rect x="630" y="98" width="184" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="119.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">6</tspan></text><rect x="820" y="98" width="184" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="912" y="119.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">5</tspan></text><rect x="10" y="140" width="394" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="161.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Zoë y Zoë con diéresis combinada</tspan></text><rect x="410" y="140" width="214" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="517" y="161.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517" dy="0">3 y 4</tspan></text><rect x="630" y="140" width="184" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="161.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">4 y 5</tspan></text><rect x="820" y="140" width="184" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="912" y="161.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">—</tspan></text><rect x="10" y="182" width="394" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="203.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Mujer tecnóloga: tres símbolos unidos</tspan></text><rect x="410" y="182" width="214" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="517" y="203.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517" dy="0">3</tspan></text><rect x="630" y="182" width="184" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="203.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">11</tspan></text><rect x="820" y="182" width="184" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="912" y="203.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">5</tspan></text><rect x="10" y="224" width="394" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="245.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">straße en mayúsculas</tspan></text><rect x="410" y="224" width="214" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="517" y="245.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517" dy="0">STRASSE</tspan></text><rect x="630" y="224" width="184" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="245.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">—</tspan></text><rect x="820" y="224" width="184" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="912" y="245.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">—</tspan></text><rect x="10" y="266" width="394" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="287.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">«İ».lower()</tspan></text><rect x="410" y="266" width="214" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="517" y="287.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517" dy="0">2 puntos de código</tspan></text><rect x="630" y="266" width="184" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="287.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">—</tspan></text><rect x="820" y="266" width="184" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="912" y="287.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">—</tspan></text><rect x="10" y="312" width="1000" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="510" y="336.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="510" dy="0">De 7 nombres con variantes de composición, 7 son distintos como bytes y 4 tras normalizar a NFC. Cortar «x👩‍💻» tras 2 puntos deja un</tspan></text><text x="510" y="353.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="510" dy="0">emoji partido; ordenar por punto de código coloca «Ángel» y «Ñandú» detrás de «Zoë». Sin biblioteca de CLDR el orden es solo una</tspan></text><text x="510" y="370.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="510" dy="0">aproximación.</tspan></text><text x="510" y="409.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="510" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
