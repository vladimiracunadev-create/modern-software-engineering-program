<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 439" width="1090" height="439" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Problemas de usabilidad hallados: fórmula con probabilidad media y simulación heterogénea</title><desc id="d">Barras: con 40 problemas cuya probabilidad de hallazgo varía entre 0 y 1 (media 0,25), la fórmula con la probabilidad media predice 76,6 por ciento con cinco participantes, pero la simulación halla 62,0; con 15 la fórmula dice 98,7 y la simulación 79,8.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1090" height="439" fill="#ffffff"/><text x="420" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">5 participantes: fórmula con p medio</tspan></text><rect x="430" y="16" width="325.957" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="763.957" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="763.957" dy="0">76,6 %</tspan></text><text x="420" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">5 participantes: simulación con p heterogéneo</tspan></text><rect x="430" y="60" width="263.83" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="701.83" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="701.83" dy="0">62,0 % (mín. 48)</tspan></text><text x="420" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">8 participantes: fórmula</tspan></text><rect x="430" y="104" width="383.83" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="821.83" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="821.83" dy="0">90,2 %</tspan></text><text x="420" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">8 participantes: simulación</tspan></text><rect x="430" y="148" width="299.149" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="737.149" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="737.149" dy="0">70,3 % (mín. 57)</tspan></text><text x="420" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">15 participantes: fórmula</tspan></text><rect x="430" y="192" width="420" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="858" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="858" dy="0">98,7 %</tspan></text><text x="420" y="255.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">15 participantes: simulación</tspan></text><rect x="430" y="236" width="339.574" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="777.574" y="255.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="777.574" dy="0">79,8 % (mín. 65)</tspan></text><text x="420" y="299.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">20 participantes: simulación</tspan></text><rect x="430" y="280" width="354.043" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="792.043" y="299.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="792.043" dy="0">83,2 % (mín. 70)</tspan></text><rect x="10" y="328" width="1070" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="545" y="352.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="545" dy="0">La fórmula 1−(1−p)^n supone que todos los problemas tienen la misma probabilidad; con probabilidades heterogéneas (beta 0,7 y 2), los problemas</tspan></text><text x="545" y="369.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="545" dy="0">raros siguen sin verse. Ocho de los 40 problemas tienen p menor que 0,05. La distribución es un supuesto del autor, no una medición de ningún</tspan></text><text x="545" y="386.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="545" dy="0">producto.</tspan></text><text x="545" y="425.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="545" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
