lson 93,2 %, Clopper-Pearson 98,9</tspan></text><text x="470" y="1286.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">%. Con 5 de 5, el intervalo de Wald dice que fallar es imposible. Con pocas personas, el intervalo importa más que el</tspan></text><text x="470" y="1303.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">porcentaje, y ancho no significa error de cálculo: es la información que hay.</tspan></text><text x="470" y="1350.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
