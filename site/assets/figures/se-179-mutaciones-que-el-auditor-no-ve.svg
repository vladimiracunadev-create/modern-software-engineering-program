<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 385" width="1000" height="385" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mutaciones del formulario reparado que el auditor automático detecta</title><desc id="d">Tabla: de 13 mutaciones del formulario reparado, el auditor detecta 8, las que quitan un elemento o atributo exigido o dejan un contenido vacío, y no detecta una etiqueta falsa, un texto de botón poco informativo ni la pérdida de tres atributos de apoyo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="385" fill="#ffffff"/><rect x="10" y="12" width="474" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="247" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="247" dy="0">Mutación</tspan></text><rect x="490" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="562" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="562" dy="0">Detectadas</tspan></text><rect x="640" y="12" width="344" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="812" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="812" dy="0">Naturaleza</tspan></text><rect x="10" y="56" width="474" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="79.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">Quitar etiqueta, alt, lang, encabezado o región principal</tspan></text><rect x="490" y="56" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="79.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">5 de 5</tspan></text><rect x="640" y="56" width="344" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="79.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">Presencia de un atributo o elemento</tspan></text><rect x="10" y="102" width="474" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="125.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">Título genérico, enlace vacío, botón convertido en div</tspan></text><rect x="490" y="102" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="125.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">3 de 3</tspan></text><rect x="640" y="102" width="344" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="125.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">Regla de contenido o de rol</tspan></text><rect x="10" y="148" width="474" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="171.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">Etiqueta que dice otra cosa</tspan></text><rect x="490" y="148" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="171.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">0 de 1</tspan></text><rect x="640" y="148" width="344" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="171.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">Texto presente pero falso</tspan></text><rect x="10" y="194" width="474" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="217.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">Botón con texto «Clic»</tspan></text><rect x="490" y="194" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="217.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">0 de 1</tspan></text><rect x="640" y="194" width="344" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="217.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">Nombre presente pero poco informativo</tspan></text><rect x="10" y="240" width="474" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="263.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">Quitar describedby, accept o autocomplete</tspan></text><rect x="490" y="240" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="263.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">0 de 3</tspan></text><rect x="640" y="240" width="344" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="263.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">Atributos útiles que ninguna regla exige</tspan></text><rect x="10" y="290" width="980" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="500" y="314.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">Una prueba de regresión automática protege lo que sus reglas ven: 8 de 13. Lo demás exige una lista manual con responsable y fecha.</tspan></text><text x="500" y="331.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">La suite de regresión no sustituye la reevaluación con personas cuando el flujo cambia.</tspan></text><text x="500" y="371.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
