<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 462" width="940" height="462" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mutaciones del formulario reparado que el auditor automático detecta</title><desc id="d">Barras apiladas horizontales con las 13 mutaciones del formulario reparado que detecta el auditor, 8 de 13: las que quitan un elemento o atributo exigido o dejan un contenido vacío, y no detecta una etiqueta falsa, un texto de botón poco informativo ni la pérdida de tres atributos de apoyo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="462" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Mutaciones del formulario reparado que el auditor automático detecta</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Detectadas</tspan></text><rect x="139.4" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="159.4" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="159.4" dy="0">No detectadas</tspan></text><line x1="354" y1="77" x2="354" y2="297" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="297" x2="354" y2="302" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="458.34" y1="77" x2="458.34" y2="297" stroke="#d5dde1" stroke-width="1"/><line x1="458.34" y1="297" x2="458.34" y2="302" stroke="#5b7280" stroke-width="1.4"/><text x="458.34" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="458.34" dy="0">1</tspan></text><line x1="562.68" y1="77" x2="562.68" y2="297" stroke="#d5dde1" stroke-width="1"/><line x1="562.68" y1="297" x2="562.68" y2="302" stroke="#5b7280" stroke-width="1.4"/><text x="562.68" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562.68" dy="0">2</tspan></text><line x1="667.02" y1="77" x2="667.02" y2="297" stroke="#d5dde1" stroke-width="1"/><line x1="667.02" y1="297" x2="667.02" y2="302" stroke="#5b7280" stroke-width="1.4"/><text x="667.02" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667.02" dy="0">3</tspan></text><line x1="771.36" y1="77" x2="771.36" y2="297" stroke="#d5dde1" stroke-width="1"/><line x1="771.36" y1="297" x2="771.36" y2="302" stroke="#5b7280" stroke-width="1.4"/><text x="771.36" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="771.36" dy="0">4</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="297" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="297" x2="875.7" y2="302" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">5</tspan></text><line x1="354" y1="297" x2="875.7" y2="297" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="95" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Quitar etiqueta, alt, lang, encabezado o</tspan></text><text x="344" y="112" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">región principal</tspan></text><text x="344" y="139" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Título genérico, enlace vacío, botón</tspan></text><text x="344" y="156" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">convertido en div</tspan></text><text x="344" y="191.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Etiqueta que dice otra cosa</tspan></text><text x="344" y="235.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Botón con texto «Clic»</tspan></text><text x="344" y="279.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Quitar describedby, accept o autocomplete</tspan></text><rect x="354" y="84" width="521.7" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="614.85" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="614.85" dy="0">5</tspan></text><rect x="875.7" y="84" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="103.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">5</tspan></text><rect x="354" y="128" width="313.02" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="510.51" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="510.51" dy="0">3</tspan></text><rect x="667.02" y="128" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="674.02" y="147.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="674.02" dy="0">3</tspan></text><rect x="354" y="172" width="0" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="354" y="172" width="104.34" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="406.17" y="191.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="406.17" dy="0">1</tspan></text><text x="465.34" y="191.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="465.34" dy="0">1</tspan></text><rect x="354" y="216" width="0" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="354" y="216" width="104.34" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="406.17" y="235.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="406.17" dy="0">1</tspan></text><text x="465.34" y="235.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="465.34" dy="0">1</tspan></text><rect x="354" y="260" width="0" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="354" y="260" width="313.02" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="510.51" y="279.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="510.51" dy="0">3</tspan></text><text x="674.02" y="279.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="674.02" dy="0">3</tspan></text><text x="614.85" y="341" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="614.85" dy="0">Mutaciones</tspan></text><rect x="10" y="355" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="379.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Una prueba de regresión automática protege lo que sus reglas ven: 8 de 13. Lo demás exige una lista manual con responsable</tspan></text><text x="470" y="396.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">y fecha. La suite de regresión no sustituye la reevaluación con personas cuando el flujo cambia.</tspan></text><text x="470" y="444.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
