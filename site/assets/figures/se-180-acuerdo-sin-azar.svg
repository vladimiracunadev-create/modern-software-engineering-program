<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 263" width="1060" height="263" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dos evaluadores que se equivocan el 8 % de las veces: acuerdo y kappa según la prevalencia</title><desc id="d">Barras: dos evaluadores con 8 por ciento de error independiente tienen un acuerdo medio de 85,3 por ciento en los tres casos, pero kappa baja de 0,70 con prevalencia del 50 por ciento a 0,46 con 90 y 0,21 con 97.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1060" height="263" fill="#ffffff"/><text x="330" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Prevalencia de «cumple» del 50 %</tspan></text><rect x="340" y="16" width="390" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="738" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="738" dy="0">kappa 0,70 · acuerdo 85,3 %</tspan></text><text x="330" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Prevalencia del 90 %</tspan></text><rect x="340" y="60" width="256.286" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="604.286" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="604.286" dy="0">kappa 0,46 · acuerdo 85,3 %</tspan></text><text x="330" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Prevalencia del 97 %</tspan></text><rect x="340" y="104" width="117" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="465" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="465" dy="0">kappa 0,21 · acuerdo 85,3 %</tspan></text><rect x="10" y="152" width="1040" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="530" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="530" dy="0">Un criterio que casi siempre se cumple produce acuerdos altos aunque los evaluadores no distingan nada: el acuerdo por azar sube con la</tspan></text><text x="530" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="530" dy="0">prevalencia. Informar solo el porcentaje de acuerdo oculta eso. El 8 % de error y la independencia entre evaluadores son supuestos; 300</tspan></text><text x="530" y="210.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="530" dy="0">simulaciones de 100 criterios por fila.</tspan></text><text x="530" y="249.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="530" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
