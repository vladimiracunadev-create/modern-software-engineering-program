<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 335" width="1050" height="335" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Probabilidad de ver al menos una vez una barrera según cuántas personas participan</title><desc id="d">Barras: una barrera que afecta al 10 por ciento de la población se ve al menos una vez con probabilidad 41,0 por ciento con cinco participantes y 71,8 con doce; una que afecta al 20 por ciento, 67,2 y 93,1; una del 33 por ciento con cinco, 86,5.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1050" height="335" fill="#ffffff"/><text x="430" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="430" dy="0">Barrera que afecta al 10 %, 5 participantes</tspan></text><rect x="440" y="16" width="180.559" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="628.559" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="628.559" dy="0">41,0 %</tspan></text><text x="430" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="430" dy="0">Barrera del 10 %, 12 participantes</tspan></text><rect x="440" y="60" width="316.198" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="764.198" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="764.198" dy="0">71,8 %</tspan></text><text x="430" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="430" dy="0">Barrera del 20 %, 5 participantes</tspan></text><rect x="440" y="104" width="295.94" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="743.94" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="743.94" dy="0">67,2 %</tspan></text><text x="430" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="430" dy="0">Barrera del 20 %, 12 participantes</tspan></text><rect x="440" y="148" width="410" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="858" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="858" dy="0">93,1 %</tspan></text><text x="430" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="430" dy="0">Barrera del 33 %, 5 participantes</tspan></text><rect x="440" y="192" width="380.934" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="828.934" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="828.934" dy="0">86,5 %</tspan></text><rect x="10" y="240" width="1030" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="525" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="525" dy="0">La probabilidad es 1−(1−p)^n y supone participantes independientes y representativos. Cinco personas pueden no ver una barrera que afecta</tspan></text><text x="525" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="525" dy="0">a una de cada diez, y eso no la hace inexistente: el plan debe declarar qué prevalencia se podría ver y cuál no.</tspan></text><text x="525" y="321.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="525" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
