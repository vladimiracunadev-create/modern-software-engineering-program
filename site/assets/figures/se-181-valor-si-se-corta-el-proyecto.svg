<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 247" width="930" height="247" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Valor entregado cuando el proyecto se corta en un momento al azar</title><desc id="d">Barras: de 200 conjuntos de 20 funciones cortados en 100 momentos al azar cada uno, liberar todo al final entrega 0 por ciento del valor, liberar incrementos en orden arbitrario 47,1 y ordenar los incrementos por valor sobre coste 73,6.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="247" fill="#ffffff"/><text x="360" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Todo se libera al final del plan</tspan></text><rect x="370" y="16" width="4" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="382" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="382" dy="0">0 %</tspan></text><text x="360" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Incrementos en orden arbitrario</tspan></text><rect x="370" y="60" width="282.6" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="660.6" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="660.6" dy="0">47,1 %</tspan></text><text x="360" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Incrementos por valor sobre coste</tspan></text><rect x="370" y="104" width="441.6" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="819.6" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="819.6" dy="0">73,6 %</tspan></text><rect x="10" y="152" width="910" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="465" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="465" dy="0">Un incremento solo vale si se libera y si el orden respeta el valor. El modelo supone funciones independientes entre sí;</tspan></text><text x="465" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="465" dy="0">con dependencias fuertes el orden por valor no siempre es posible.</tspan></text><text x="465" y="233.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
