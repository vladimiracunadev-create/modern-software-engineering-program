<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 554" width="940" height="554" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Esfuerzo total de 40 piezas según la volatilidad de los requisitos y el ciclo</title><desc id="d">Líneas con el esfuerzo medio de 40 piezas según el porcentaje de piezas malentendidas: el plan predictivo cuesta 40 sin cambios y 134,1 con 60 por ciento, los ciclos de cuatro piezas van de 43,0 a 72,4 y los ciclos de una pieza de 52,0 a 76,0; con 5 por ciento de piezas malentendidas los ciclos de cuatro ya ganan.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="554" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Esfuerzo total de 40 piezas según la volatilidad de los requisitos y el ciclo</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Predictivo (un ciclo)</tspan></text><rect x="222.34" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="242.34" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="242.34" dy="0">Ciclos de 4 piezas</tspan></text><polygon points="412.06,44.1 418.66,56.4 405.46,56.4" fill="#946512" stroke="#946512" stroke-width="2"/><text x="426.06" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="426.06" dy="0">Ciclos de 1 pieza</tspan></text><line x1="78.62" y1="387" x2="910" y2="3