<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 526" width="940" height="526" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Longitud del ciclo: el valor entregado respecto del mejor conjunto en un trimestre de 12 semanas</title><desc id="d">Línea con el valor entregado respecto del mejor conjunto según la longitud del ciclo, con 10,5 horas de ceremonias por ciclo: 91,1 por ciento con una semana (sobrecoste de 5,25), el máximo de 91,6 con dos semanas (2,62), 90,8 con tres, 90,6 con cuatro y 90,0 con seis (0,88).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="526" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Longitud del ciclo: el valor entregado respecto del mejor conjunto en un trimestre de 12 semanas</tspan></text><line x1="86.16" y1="359" x2="910" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="359" x2="86.16" y2="359" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="363.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">90</tspan></text><line x1="86.16" y1="284" x2="910" y2="284" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="284" x2="86.16" y2="284" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="288.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">90,5</tspan></text><line x1="86.16" y1="209" x2="910" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="209" x2="86.16" y2="209" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="213.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">91</tspan></text><line x1="86.16" y1="134" x2="910" y2="134" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="134" x2="86.16" y2="134" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="138.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">91,5</tspan></text><line x1="86.16" y1="59" x2="910" y2="59" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="59" x2="86.16" y2="59" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="63.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">92</tspan></text><line x1="86.16" y1="59" x2="86.16" y2="359" stroke="#5b7280" stroke-width="1.6"/><line x1="104.16" y1="59" x2="104.16" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="104.16" y1="359" x2="104.16" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="104.16" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="104.16" dy="0">1 (5,25 %)</tspan></text><line x1="261.728" y1="59" x2="261.728" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="261.728" y1="359" x2="261.728" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="261.728" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="261.728" dy="0">2 (2,62 %)</tspan></text><line x1="419.296" y1="59" x2="419.296" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="419.296" y1="359" x2="419.296" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="419.296" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="419.296" dy="0">3 (1,75 %)</tspan></text><line x1="576.864" y1="59" x2="576.864" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="576.864" y1="359" x2="576.864" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="576.864" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="576.864" dy="0">4 (1,31 %)</tspan></text><line x1="892" y1="59" x2="892" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="359" x2="892" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">6 (0,88 %)</tspan></text><line x1="86.16" y1="359" x2="910" y2="359" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="209" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 209)">Valor entregado respecto del mejor conjunto (%)</text><text x="498.08" y="405" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="498.08" dy="0">Longitud del ciclo (semanas); entre paréntesis, sobrecoste de las ceremonias</tspan></text><polyline points="104.16,194 261.728,119 419.296,239 576.864,269 892,359" fill="none" stroke="#087f8c" stroke-width="2.4"/><circle cx="104.16" cy="194" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="104.16" y="218" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="104.16" dy="0">91,1</tspan></text><circle cx="261.728" cy="119" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="261.728" y="108" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="261.728" dy="0">91,6</tspan></text><circle cx="419.296" cy="239" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="419.296" y="263" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="419.296" dy="0">90,8</tspan></text><circle cx="576.864" cy="269" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="576.864" y="293" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="576.864" dy="0">90,6</tspan></text><circle cx="892" cy="359" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="348" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">90,0</tspan></text><text x="351.728" y="159" font-size="13" text-anchor="start" font-weight="400" fill="#5c1f14" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="351.728" dy="0">Máximo con ciclos de 2</tspan></text><text x="351.728" y="176" font-size="13" text-anchor="start" font-weight="400" fill="#5c1f14" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="351.728" dy="0">semanas</tspan></text><line x1="268.288" y1="121.8" x2="343.728" y2="154" stroke="#5c1f14" stroke-width="1.2"/><rect x="10" y="419" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="443.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El óptimo aparece en el ciclo de 2 semanas con una diferencia de 1,6 puntos entre el mejor y el peor: es una curva plana.</tspan></text><text x="470" y="460.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las 10,5 horas de ceremonias y el equipo de cinco personas son supuestos; con otros valores el óptimo se mueve.</tspan></text><text x="470" y="508.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
