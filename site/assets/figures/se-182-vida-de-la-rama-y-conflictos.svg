<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 307" width="960" height="307" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Probabilidad de algún conflicto de fusión entre seis ramas según su vida</title><desc id="d">Barras: con seis desarrolladores que tocan 2 bloques de 8 líneas por día en un archivo de 2000 líneas, la probabilidad de algún conflicto es 36,2 por ciento con ramas de un día, 83,9 con dos días y 100 con cinco o más.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="307" fill="#ffffff"/><text x="360" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Rama de 1 día</tspan></text><rect x="370" y="16" width="181" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="559" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="559" dy="0">36,2 %</tspan></text><text x="360" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Rama de 2 días</tspan></text><rect x="370" y="60" width="419.5" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="797.5" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="797.5" dy="0">83,9 %</tspan></text><text x="360" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Rama de 5 días</tspan></text><rect x="370" y="104" width="500" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="878" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="878" dy="0">100 %</tspan></text><text x="360" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Rama de 10 días</tspan></text><rect x="370" y="148" width="500" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="878" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="878" dy="0">100 %</tspan></text><rect x="10" y="196" width="940" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">La probabilidad crece como el número de pares de cambios que pueden solaparse, que aumenta con el cuadrado de la vida de la</tspan></text><text x="480" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">rama. Todos los cambios caen al azar en un archivo: en un código real se concentran en pocas zonas y el conflicto es aún más</tspan></text><text x="480" y="254.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">probable.</tspan></text><text x="480" y="293.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
