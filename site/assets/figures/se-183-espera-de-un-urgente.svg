<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 247" width="1130" height="247" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Plazo de un trabajo urgente de 2 días que llega en un momento cualquiera</title><desc id="d">Barras: un trabajo urgente de dos días de esfuerzo tarda 7,04 días de media si debe esperar al siguiente sprint, 2,57 si se extrae cuando alguien se libera y 2,00 con un carril exprés que reserva una ranura.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1130" height="247" fill="#ffffff"/><text x="530" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="530" dy="0">Scrum sin cambiar el alcance del sprint (P85: 10,5)</tspan></text><rect x="540" y="16" width="387.2" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="935.2" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="935.2" dy="0">7,04 días</tspan></text><text x="530" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="530" dy="0">Kanban con extracción (P85: 3,06)</tspan></text><rect x="540" y="60" width="141.35" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="689.35" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="689.35" dy="0">2,57 días</tspan></text><text x="530" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="530" dy="0">Kanban con carril exprés (P85: 2,0)</tspan></text><rect x="540" y="104" width="110" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="658" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="658" dy="0">2,00 días</tspan></text><rect x="10" y="152" width="1110" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="565" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="565" dy="0">El plazo de Scrum aparece porque el alcance del sprint está comprometido, no porque Scrum lo exija: un equipo puede reservar capacidad para</tspan></text><text x="565" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="565" dy="0">urgencias. La comparación mide la política, no el marco.</tspan></text><text x="565" y="233.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="565" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
