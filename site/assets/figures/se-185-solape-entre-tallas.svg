<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 442" width="940" height="442" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Probabilidad de que un elemento de talla menor tarde más que uno de talla mayor</title><desc id="d">Barras horizontales con la probabilidad de que el elemento menor tarde más: 0,7 por ciento con 1 contra 8, 12,4 con 3 contra 8, 27,8 con 2 contra 3, 27,1 con 3 contra 5, 29,1 con 5 contra 8 y 4,2 con diez de talla 3 contra diez de talla 5; la línea de 50 por ciento sería la indistinción total.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="442" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Probabilidad de que un elemento de talla menor tarde más que uno de talla mayor</tspan></text><line x1="294" y1="49" x2="294" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="277" x2="294" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">0</tspan></text><line x1="411.952" y1="49" x2="411.952" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="411.952" y1="277" x2="411.952" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="411.952" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="411.952" dy="0">10</tspan></text><line x1="529.904" y1="49" x2="529.904" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="529.904" y1="277" x2="529.904" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="529.904" 