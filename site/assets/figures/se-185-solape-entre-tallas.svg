a talla ordena en media pero no predice cada elemento. Sumadas, las incertidumbres</tspan></text><text x="470" y="376.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">individuales se compensan y las tallas sirven para planificar un conjunto, no para prometer un elemento.</tspan></text><text x="470" y="424.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
