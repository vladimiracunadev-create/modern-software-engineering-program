oke="#087f8c" stroke-width="2"/><text x="535.147" y="184.75" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="535.147" dy="0">15,1</tspan></text><circle cx="892" cy="166.875" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="155.875" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">15,9</tspan></text><polyline points="89.08,282 267.507,162.375 535.147,126.75 892,99.375" fill="none" stroke="#c0432f" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="83.58" y="276.5" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="89.08" y="271" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="89.08" dy="0">12,8</tspan></text><rect x="262.007" y="156.875" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="267.507" y="151.375" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="267.507" dy="0">16,0</tspan></text><rect x="529.647" y="121.25" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="535.147" y="115.75" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="535.147" dy="0">16,9</tspan></text><rect x="886.5" y="93.875" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="88.375" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">17,7</tspan></text><rect x="10" y="447" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Cuando varios caminos convergen, el máximo de duraciones aleatorias es mayor que cada una: el plan que usa solo medianas es</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">optimista en proporción a la anchura de la red. Las duraciones lognormales de σ = 0,4 son un supuesto.</tspan></text><text x="470" y="536.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
