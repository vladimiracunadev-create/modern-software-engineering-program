="#4a3209"><tspan x="470" dy="0">deja 10,8 % de plazos sin sorpresa. Se supone independencia; dependencias del mismo proveedor se retrasan juntas.</tspan></text><text x="470" y="536.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
