<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 594" width="940" height="594" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Linter de registros de decisión sobre 200 mutaciones de un registro correcto</title><desc id="d">Barras apiladas con las mutaciones detectadas y no detectadas por un linter de forma: detecta 28 de 28 campos ausentes, 22 de 22 fechas sin formato, 15 de 15 responsables colectivos, 22 de 22 con una sola opción, 21 de 21 disparadores vagos y 34 de 34 decisiones sin opción, y 0 de 38 cambios de sentido del contexto y 0 de 20 actas que contradicen la decisión; en total 142 de 200.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="594" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Linter de registros de decisión sobre 200 mutaciones de un registro correcto</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Detectadas</tspan></text><rect x="139.4" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="159.4" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="159.4" dy="0">No detectadas</tspan></text><line x1="324" y1="77" x2="324" y2="429" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="429" x2="324" y2="434" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="450" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="461.925" y1="77" x2="461.925" y2="429" stroke="#d5dde1" stroke-width="1"/><line x1="461.925" y1="429" x2="461.925" y2="434" stroke="#5b7280" stroke-width="1.4"/><text x="461.925" y="450" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="461.925" dy="0">10</tspan></text><line x1="599.85" y1="77" x2="599.85" y2="429" stroke="#d5dde1" stroke-width="1"/><line x1="599.85" y1="429" x2="599.85" y2="434" stroke="#5b7280" stroke-width="1.4"/><text x="599.85" y="450" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="599.85" dy="0">20</tspan></text><line x1="737.775" y1="77" x2="737.775" y2="429" stroke="#d5dde1" stroke-width="1"/><line x1="737.775" y1="429" x2="737.775" y2="434" stroke="#5b7280" stroke-width="1.4"/><text x="737.775" y="450" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737.775" dy="0">30</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="429" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="429" x2="875.7" y2="434" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="450" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">40</tspan></text><line x1="324" y1="429" x2="875.7" y2="429" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="103.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Campo ausente</tspan></text><text x="314" y="147.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Fecha sin formato</tspan></text><text x="314" y="191.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Responsable colectivo</tspan></text><text x="314" y="235.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Una sola opción</tspan></text><text x="314" y="279.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Disparador de revisión vago</tspan></text><text x="314" y="315" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Decisión que no corresponde a ninguna</tspan></text><text x="314" y="332" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">opción</tspan></text><text x="314" y="367.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Cambio del sentido del contexto</tspan></text><text x="314" y="411.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Decisión y acta que se contradicen</tspan></text><rect x="324" y="84" width="386.19" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="517.095" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="517.095" dy="0">28</tspan></text><rect x="710.19" y="84" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="717.19" y="103.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="717.19" dy="0">28</tspan></text><rect x="324" y="128" width="303.435" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="475.718" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="475.718" dy="0">22</tspan></text><rect x="627.435" y="128" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="634.435" y="147.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="634.435" dy="0">22</tspan></text><rect x="324" y="172" width="206.888" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="427.444" y="191.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="427.444" dy="0">15</tspan></text><rect x="530.888" y="172" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="537.888" y="191.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="537.888" dy="0">15</tspan></text><rect x="324" y="216" width="303.435" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="475.718" y="235.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="475.718" dy="0">22</tspan></text><rect x="627.435" y="216" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="634.435" y="235.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="634.435" dy="0">22</tspan></text><rect x="324" y="260" width="289.643" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="468.821" y="279.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="468.821" dy="0">21</tspan></text><rect x="613.643" y="260" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="620.643" y="279.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="620.643" dy="0">21</tspan></text><rect x="324" y="304" width="468.945" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="558.473" y="323.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="558.473" dy="0">34</tspan></text><rect x="792.945" y="304" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="799.945" y="323.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="799.945" dy="0">34</tspan></text><rect x="324" y="348" width="0" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="324" y="348" width="524.115" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="586.058" y="367.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="586.058" dy="0">38</tspan></text><text x="855.115" y="367.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="855.115" dy="0">38</tspan></text><rect x="324" y="392" width="0" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="324" y="392" width="275.85" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="461.925" y="411.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="461.925" dy="0">20</tspan></text><text x="606.85" y="411.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="606.85" dy="0">20</tspan></text><text x="599.85" y="473" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="599.85" dy="0">Mutaciones</tspan></text><rect x="10" y="487" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="511.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El linter acierta 142 de 200 y falla exactamente donde importa el criterio humano: el sentido de lo escrito. Las reglas se</tspan></text><text x="470" y="528.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">escribieron conociendo las mutaciones, así que el 100 % por tipo es optimista.</tspan></text><text x="470" y="576.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
