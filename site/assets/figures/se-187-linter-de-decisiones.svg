<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 491" width="840" height="491" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Linter de registros de decisión sobre 200 mutaciones de un registro correcto</title><desc id="d">Tabla: un linter de forma detecta 142 de 200 mutaciones de un registro de decisión; atrapa campos ausentes, fechas, responsables colectivos, opción única, disparadores vagos y decisiones sin opción, y no ve ni un cambio de sentido en el contexto ni un acta que contradice la decisión.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="840" height="491" fill="#ffffff"/><rect x="10" y="12" width="554" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="287" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="287" dy="0">Mutación</tspan></text><rect x="570" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="697" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="697" dy="0">Detectadas</tspan></text><rect x="10" y="56" width="554" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="77.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Campo ausente</tspan></text><rect x="570" y="56" width="254" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="77.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">28 de 28</tspan></text><rect x="10" y="98" width="554" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="119.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Fecha sin formato</tspan></text><rect x="570" y="98" width="254" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="119.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">22 de 22</tspan></text><rect x="10" y="140" width="554" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="161.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Responsable colectivo</tspan></text><rect x="570" y="140" width="254" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">15 de 15</tspan></text><rect x="10" y="182" width="554" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="203.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Una sola opción</tspan></text><rect x="570" y="182" width="254" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="203.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">22 de 22</tspan></text><rect x="10" y="224" width="554" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="245.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Disparador de revisión vago</tspan></text><rect x="570" y="224" width="254" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">21 de 21</tspan></text><rect x="10" y="266" width="554" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="287.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Decisión que no corresponde a ninguna opción</tspan></text><rect x="570" y="266" width="254" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="287.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">34 de 34</tspan></text><rect x="10" y="308" width="554" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="329.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Cambio del sentido del contexto</tspan></text><rect x="570" y="308" width="254" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="329.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">0 de 38</tspan></text><rect x="10" y="350" width="554" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="371.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Decisión que dice una opción y el acta otra</tspan></text><rect x="570" y="350" width="254" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="371.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">0 de 20</tspan></text><rect x="10" y="396" width="820" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="420" y="420.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="420" dy="0">El linter acierta 142 de 200 y falla exactamente donde importa el criterio humano: el sentido de lo escrito.</tspan></text><text x="420" y="437.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="420" dy="0">Las reglas se escribieron conociendo las mutaciones, así que el 100 % por tipo es optimista.</tspan></text><text x="420" y="477.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="420" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
