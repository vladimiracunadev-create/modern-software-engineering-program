<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 405" width="910" height="405" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diez riesgos: retraso en días con riesgos independientes y con una causa común</title><desc id="d">Tabla: la exposición esperada de diez riesgos es 21,6 días; con riesgos independientes la mediana es 21 y el percentil 85 vale 35; con una causa común que arrastra a la mayoría la media casi no cambia, 22,2, pero la mediana baja a 10 y el percentil 85 sube a 66.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="910" height="405" fill="#ffffff"/><rect x="10" y="12" width="464" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="242" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="242" dy="0">Medida (días de retraso)</tspan></text><rect x="480" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="582" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="582" dy="0">Independientes</tspan></text><rect x="690" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="792" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="792" dy="0">Causa común</tspan></text><rect x="10" y="56" width="464" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Exposición esperada (suma de probabilidad × impacto)</tspan></text><rect x="480" y="56" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">21,6</tspan></text><rect x="690" y="56" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">21,6</tspan></text><rect x="10" y="106" width="464" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Media simulada</tspan></text><rect x="480" y="106" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">21,7</tspan></text><rect x="690" y="106" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">22,2</tspan></text><rect x="10" y="156" width="464" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Mediana</tspan></text><rect x="480" y="156" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">21</tspan></text><rect x="690" y="156" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">10</tspan></text><rect x="10" y="206" width="464" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Percentil 85</tspan></text><rect x="480" y="206" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">35</tspan></text><rect x="690" y="206" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">66</tspan></text><rect x="10" y="256" width="464" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Percentil 95</tspan></text><rect x="480" y="256" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">44</tspan></text><rect x="690" y="256" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">81</tspan></text><rect x="10" y="310" width="890" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="455" y="334.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="455" dy="0">La exposición esperada es la misma y el riesgo no: la causa común reparte el retraso entre muchos proyectos buenos y</tspan></text><text x="455" y="351.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="455" dy="0">unos pocos desastrosos. El 25 % de probabilidad del evento común y el 70 % de arrastre son supuestos.</tspan></text><text x="455" y="391.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="455" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
