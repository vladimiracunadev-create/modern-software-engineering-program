<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 467" width="900" height="467" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Velocidad en puntos frente a elementos terminados cuando la velocidad se premia</title><desc id="d">Barras: con un rendimiento real constante de unos 10 elementos por sprint y una inflación de estimaciones de 4 por ciento por sprint, la velocidad en puntos va de 33,0 en el sprint 1 a 60,0 en el 12, 1,82 veces, mientras los elementos terminados pasan de 11 a 13, 1,18 veces.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="900" height="467" fill="#ffffff"/><text x="290" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">Sprint 1: 11 elementos</tspan></text><rect x="300" y="16" width="247.5" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="555.5" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="555.5" dy="0">33 pt</tspan></text><text x="290" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">Sprint 2: 10 elementos</tspan></text><rect x="300" y="60" width="234" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="542" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="542" dy="0">31,2 pt</tspan></text><text x="290" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">Sprint 4: 8 elementos</tspan></text><rect x="300" y="104" width="202.5" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="510.5" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="510.5" dy="0">27 pt</tspan></text><text x="290" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">Sprint 6: 12 elementos</tspan></text><rect x="300" y="148" width="328.5" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="636.5" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="636.5" dy="0">43,8 pt</tspan></text><text x="290" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">Sprint 8: 10 elementos</tspan></text><rect x="300" y="192" width="296.25" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="604.25" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="604.25" dy="0">39,5 pt</tspan></text><text x="290" y="255.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">Sprint 10: 8 elementos</tspan></text><rect x="300" y="236" width="256.5" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="564.5" y="255.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="564.5" dy="0">34,2 pt</tspan></text><text x="290" y="299.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">Sprint 11: 10 elementos</tspan></text><rect x="300" y="280" width="333" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="641" y="299.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="641" dy="0">44,4 pt</tspan></text><text x="290" y="343.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">Sprint 12: 13 elementos</tspan></text><rect x="300" y="324" width="450" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="758" y="343.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="758" dy="0">60 pt</tspan></text><rect x="10" y="372" width="880" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="450" y="396.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">La velocidad de sprint 12 es 1,82 veces la del sprint 1; los elementos terminados, 1,18 veces. Partir cada historia en</tspan></text><text x="450" y="413.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">dos duplicaría el conteo sin cambiar el alcance. Toda métrica premiada se puede inflar; por eso se miran juntas.</tspan></text><text x="450" y="453.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
