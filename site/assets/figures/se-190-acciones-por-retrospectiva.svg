87f8c" stroke="#087f8c" stroke-width="2"/><text x="323.871" y="382.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="323.871" dy="0">9,4</tspan></text><rect x="545.623" y="353.3" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="551.123" y="382.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="551.123" dy="0">9,4</tspan></text><rect x="886.5" y="353.3" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="382.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">9,4</tspan></text><rect x="10" y="447" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">La capacidad limita lo que se termina, no lo que se acuerda: ocho acciones por retrospectiva no mejoran más que dos y dejan</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">87 abiertas. Los costes de 1 a 4 días y el 3 % de mejora por acción son supuestos.</tspan></text><text x="470" y="536.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
