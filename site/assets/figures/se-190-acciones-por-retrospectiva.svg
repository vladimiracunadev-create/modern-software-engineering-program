ont-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="677" dy="0">86,6</tspan></text><rect x="780" y="256" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="877" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="877" dy="0">12,7</tspan></text><rect x="10" y="310" width="970" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="495" y="334.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">La capacidad limita lo que se termina, no lo que se acuerda: ocho acciones por retrospectiva no mejoran más que dos y dejan 87</tspan></text><text x="495" y="351.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">abiertas. Los costes de 1 a 4 días y el 3 % de mejora por acción son supuestos.</tspan></text><text x="495" y="391.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
