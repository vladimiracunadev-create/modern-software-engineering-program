<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 379" width="1010" height="379" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Espera media en una cola al 90 % de utilización según la intervención</title><desc id="d">Barras: en una cola con 90 por ciento de utilización, lotes de cinco y alta variabilidad la espera es 41,2 servicios; trabajar más horas la deja en 41,6, añadir 10 por ciento de capacidad en 22,6, enviar de una en una en 23,1, reducir la variabilidad en 28,9 y combinar lotes pequeños y baja variabilidad en 9,4.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1010" height="379" fill="#ffffff"/><text x="470" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">Situación actual: lotes de 5 y variabilidad alta</tspan></text><rect x="480" y="16" width="412" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="900" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="900" dy="0">41,2</tspan></text><text x="470" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">Trabajar más horas sin cambiar nada</tspan></text><rect x="480" y="60" width="416" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="904" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="904" dy="0">41,6</tspan></text><text x="470" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">Reducir la variabilidad del servicio</tspan></text><rect x="480" y="104" width="289" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="777" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="777" dy="0">28,9</tspan></text><text x="470" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">Llegadas de una en una</tspan></text><rect x="480" y="148" width="231" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="719" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="719" dy="0">23,1</tspan></text><text x="470" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">Añadir 10 % de capacidad</tspan></text><rect x="480" y="192" width="226" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="714" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="714" dy="0">22,6</tspan></text><text x="470" y="255.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">Llegadas de una en una y menos variabilidad</tspan></text><rect x="480" y="236" width="94" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="582" y="255.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="582" dy="0">9,4</tspan></text><rect x="10" y="284" width="990" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="505" y="308.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="505" dy="0">Una retrospectiva que concluye trabajar más no mueve la espera. Las intervenciones sobre el sistema (lotes, variabilidad, capacidad)</tspan></text><text x="505" y="325.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="505" dy="0">sí, y se combinan. El modelo es una sola cola: un sistema real tiene muchas.</tspan></text><text x="505" y="365.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="505" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
