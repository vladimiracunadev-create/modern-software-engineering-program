<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 293" width="990" height="293" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Calibración de pronósticos de «cuándo termina» con alcance que crece de 0 a 20 %</title><desc id="d">Tabla: un pronóstico de percentil 85 construido con 8 semanas de historia que ignora el crecimiento del alcance se cumple en 64,7 por ciento de los casos; si incluye ese crecimiento, en 80,1; una estimación puntual con el rendimiento medio se cumple en 40,2 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="990" height="293" fill="#ffffff"/><rect x="10" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="92" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="92" dy="0">Historia</tspan></text><rect x="180" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="247" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="247" dy="0">P50</tspan></text><rect x="320" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="387" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="387" dy="0">P85</tspan></text><rect x="460" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="527" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="527" dy="0">P95</tspan></text><rect x="600" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="692" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="692" dy="0">Estimación puntual</tspan></text><rect x="790" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="882" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="882" dy="0">P85 con alcance</tspan></text><rect x="10" y="56" width="164" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="92" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="92" dy="0">4 semanas</tspan></text><rect x="180" y="56" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="247" dy="0">46,3 %</tspan></text><rect x="320" y="56" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="387" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387" dy="0">65,2 %</tspan></text><rect x="460" y="56" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">74,4 %</tspan></text><rect x="600" y="56" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">45,8 %</tspan></text><rect x="790" y="56" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="882" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">77,7 %</tspan></text><rect x="10" y="102" width="164" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="92" y="125.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="92" dy="0">8 semanas</tspan></text><rect x="180" y="102" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="247" dy="0">40,8 %</tspan></text><rect x="320" y="102" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="387" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387" dy="0">64,7 %</tspan></text><rect x="460" y="102" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">76,5 %</tspan></text><rect x="600" y="102" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">40,2 %</tspan></text><rect x="790" y="102" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="882" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">80,1 %</tspan></text><rect x="10" y="148" width="164" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="92" y="171.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="92" dy="0">16 semanas</tspan></text><rect x="180" y="148" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="247" dy="0">42,7 %</tspan></text><rect x="320" y="148" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="387" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387" dy="0">69,2 %</tspan></text><rect x="460" y="148" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">82,1 %</tspan></text><rect x="600" y="148" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">42,2 %</tspan></text><rect x="790" y="148" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="882" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">85,2 %</tspan></text><rect x="10" y="198" width="970" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="495" y="222.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">El percentil 85 que ignora el crecimiento del alcance se cumple en 65 % a 69 %, no en 85 %. Un pronóstico está calibrado solo si</tspan></text><text x="495" y="239.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">incluye las fuentes de incertidumbre que existirán. La estimación puntual se cumple menos que la mediana.</tspan></text><text x="495" y="279.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
