<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 291" width="1010" height="291" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuánto mueve el plazo P85 cada supuesto al variarlo ±30 % (base: 17 semanas)</title><desc id="d">Barras: variar cada supuesto un 30 por ciento mueve el plazo P85 de 17 semanas en 13 semanas para el rendimiento semanal, 9 para el tamaño del backlog, 3 para el crecimiento del alcance y 1 para el factor de partición de elementos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1010" height="291" fill="#ffffff"/><text x="470" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">Rendimiento semanal (de 26 a 13 semanas)</tspan></text><rect x="480" y="16" width="390" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="878" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="878" dy="0">13 semanas</tspan></text><text x="470" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">Tamaño del backlog (de 13 a 22)</tspan></text><rect x="480" y="60" width="270" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="758" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="758" dy="0">9 semanas</tspan></text><text x="470" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">Crecimiento semanal del alcance (de 16 a 19)</tspan></text><rect x="480" y="104" width="90" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="578" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="578" dy="0">3 semanas</tspan></text><text x="470" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">Factor de partición de elementos (de 17 a 18)</tspan></text><rect x="480" y="148" width="30" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="518" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="518" dy="0">1 semana</tspan></text><rect x="10" y="196" width="990" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="505" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="505" dy="0">El rendimiento domina el plan: es el supuesto que conviene medir y vigilar. El orden depende de los valores base (60 elementos, 6 por</tspan></text><text x="505" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="505" dy="0">semana, 1 de crecimiento, factor 1,2) que son supuestos del autor.</tspan></text><text x="505" y="277.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="505" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
