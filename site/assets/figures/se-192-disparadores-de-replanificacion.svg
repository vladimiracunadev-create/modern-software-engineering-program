<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 431" width="960" height="431" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Disparador de replanificación por pronóstico P85: falsas alarmas frente a retraso de detección</title><desc id="d">Tabla: un disparador basado en el percentil 85 pronosticado con 4 semanas de historia da falsa alarma en 68,0 por ciento de los proyectos sin deriva y detecta una caída real con 3 semanas de retraso mediano; con 8 semanas y 3 avisos seguidos la falsa alarma baja a 26,2 y el retraso sube a 6 semanas, con 10,5 por ciento de caídas sin aviso.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="431" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Regla</tspan></text><rect x="340" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="442" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="442" dy="0">Falsa alarma sin deriva</tspan></text><rect x="550" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="657" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="657" dy="0">Retraso mediano</tspan></text><text x="657" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="657" dy="0">(semanas)</tspan></text><rect x="770" y="12" width="174" heig