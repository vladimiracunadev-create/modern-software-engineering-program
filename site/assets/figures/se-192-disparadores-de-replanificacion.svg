ext x="857" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">5,8 %</tspan></text><rect x="10" y="240" width="324" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="263.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">8 semanas, 2 avisos seguidos</tspan></text><rect x="340" y="240" width="204" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">34,2 %</tspan></text><rect x="550" y="240" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="657" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="657" dy="0">5</tspan></text><rect x="770" y="240" width="174" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="857" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">9,5 %</tspan></text><rect x="10" y="286" width="324" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="309.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">8 semanas, 3 avisos seguidos</tspan></text><rect x="340" y="286" width="204" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">26,2 %</tspan></text><rect x="550" y="286" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="657" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="657" dy="0">6</tspan></text><rect x="770" y="286" width="174" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="857" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">10,5 %</tspan></text><rect x="10" y="336" width="940" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="360.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Endurecer la regla reduce las falsas alarmas y retrasa la detección: no existe una regla sin costo. Con un plazo de 22 semanas</tspan></text><text x="480" y="377.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">y 100 elementos, el 83 % de los proyectos con caída no terminaría a tiempo. Todos los parámetros son supuestos.</tspan></text><text x="480" y="417.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
