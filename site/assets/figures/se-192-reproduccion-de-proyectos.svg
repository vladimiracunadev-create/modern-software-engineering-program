46512"/><text x="275.942" y="108.88" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="275.942" dy="0">92,9</tspan></text><text x="218.85" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="218.85" dy="0">Plan fijo de 60 elementos</tspan></text><rect x="387.126" y="229.12" width="110.184" height="145.88" rx="3" fill="#087f8c"/><text x="442.218" y="223.12" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="442.218" dy="0">52,1</tspan></text><rect x="501.31" y="98.36" width="110.184" height="276.64" rx="3" fill="#946512"/><text x="556.402" y="92.36" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="556.402" dy="0">98,8</tspan></text><text x="499.31" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="499.31" dy="0">Plan fijo ordenado por valor</tspan></text><rect x="667.586" y="96.68" width="110.184" height="278.32" rx="3" fill="#087f8c"/><text x="722.678" y="90.68" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="722.678" dy="0">99,4</tspan></text><rect x="781.77" y="98.36" width="110.184" height="276.64" rx="3" fill="#946512"/><text x="836.862" y="92.36" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="836.862" dy="0">98,8</tspan></text><text x="779.77" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="779.77" dy="0">Plan adaptativo (promete 42,8 de</tspan></text><text x="779.77" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="779.77" dy="0">media)</tspan></text><rect x="10" y="444" width="920" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="468.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">La mejora de valor viene de ordenar por valor; la de cumplimiento, de prometer menos con un pronóstico prudente. Son dos</tspan></text><text x="470" y="485.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">efectos separables. Los valores lognormales y la caída de rendimiento son supuestos.</tspan></text><text x="470" y="533.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
