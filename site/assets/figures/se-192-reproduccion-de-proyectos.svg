<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 329" width="1020" height="329" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mil proyectos sintéticos: 60 elementos, 11 semanas, caída de 30 % en 40 % de ellos</title><desc id="d">Tabla: un plan fijo de 60 elementos cumple lo prometido en 52,1 por ciento de 1000 proyectos y entrega 92,9 por ciento del valor; ordenarlo por valor sube el valor a 98,8 sin mejorar el cumplimiento; el plan adaptativo promete 42,8 elementos de media, cumple en 99,4 por ciento y entrega 98,8.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1020" height="329" fill="#ffffff"/><rect x="10" y="12" width="434" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="227" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="227" dy="0">Estrategia</tspan></text><rect x="450" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="542" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="542" dy="0">Elementos prometidos</tspan></text><rect x="640" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="737" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="737" dy="0">Cumple lo prometido</tspan></text><rect x="840" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="922" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="922" dy="0">Valor entregado</tspan></text><rect x="10" y="56" width="434" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">Plan fijo de 60 elementos</tspan></text><rect x="450" y="56" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">60</tspan></text><rect x="640" y="56" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">52,1 %</tspan></text><rect x="840" y="56" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="922" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="922" dy="0">92,9 %</tspan></text><rect x="10" y="114" width="434" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="143.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">Plan fijo ordenado por valor</tspan></text><rect x="450" y="114" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">60</tspan></text><rect x="640" y="114" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">52,1 %</tspan></text><rect x="840" y="114" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="922" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="922" dy="0">98,8 %</tspan></text><rect x="10" y="172" width="434" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="201.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">Plan adaptativo (alcance según rendimiento reciente)</tspan></text><rect x="450" y="172" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">42,8</tspan></text><rect x="640" y="172" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">99,4 %</tspan></text><rect x="840" y="172" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="922" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="922" dy="0">98,8 %</tspan></text><rect x="10" y="234" width="1000" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="510" y="258.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="510" dy="0">La mejora de valor viene de ordenar por valor; la de cumplimiento, de prometer menos con un pronóstico prudente. Son dos efectos</tspan></text><text x="510" y="275.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="510" dy="0">separables. Los valores lognormales y la caída de rendimiento son supuestos.</tspan></text><text x="510" y="315.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="510" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
