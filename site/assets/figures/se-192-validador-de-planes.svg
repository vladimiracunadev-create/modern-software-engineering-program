nt-weight="700" fill="#ffffff"><tspan x="498.705" dy="0">19</tspan></text><rect x="673.41" y="364" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="680.41" y="381.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="680.41" dy="0">19</tspan></text><rect x="324" y="404" width="0" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="324" y="404" width="367.8" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="507.9" y="421.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="507.9" dy="0">20</tspan></text><text x="698.8" y="421.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="698.8" dy="0">20</tspan></text><rect x="324" y="444" width="0" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="324" y="444" width="422.97" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="535.485" y="461.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="535.485" dy="0">23</tspan></text><text x="753.97" y="461.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="753.97" dy="0">23</tspan></text><text x="599.85" y="521" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="599.85" dy="0">Mutaciones</tspan></text><rect x="10" y="535" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="559.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Detecta 157 de 200 y no ve ninguna de las 43 mutaciones de sentido. Un plan que pasa el validador está completo en forma;</tspan></text><text x="470" y="576.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">no se sabe si es razonable.</tspan></text><text x="470" y="624.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
