<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 642" width="940" height="642" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Validador de planes sobre 200 mutaciones de un plan correcto</title><desc id="d">Barras apiladas con las mutaciones detectadas y no detectadas por un validador de forma: detecta todas las de campo ausente (28), rango ausente (15), confianza ausente (18), disparador sin umbral (17), supuesto sin responsable ni fecha (21), fecha sin formato (17), responsable colectivo (22) y métrica sin definición (19), y ninguna de las 20 de rango invertido ni de las 23 de salvaguarda que contradice el objetivo; en total 157 de 200.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="642" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Validador de planes sobre 200 mutaciones de un plan correcto</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Detectadas</tspan></text><rect x="139.4" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="159.4" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="159.4" dy="0">No detectadas</tspan></text><line x1="324" y1="77" x2="324" y2="477" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="477" x2="324" y2="482" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="498" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="507.9" y1="77" x2="507.9" y2="477" stroke="#d5dde1" stroke-width="1"/><line x1="507.9" y1="477" x2="507.9" y2="482" stroke="#5b7280" stroke-width="1.4"/><text x="507.9" y="498" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507.9" dy="0">10</tspan></text><line x1="691.8" y1="77" x2="691.8" y2="477" stroke="#d5dde1" stroke-width="1"/><line x1="691.8" y1="477" x2="691.8" y2="482" stroke="#5b7280" stroke-width="1.4"/><text x="691.8" y="498" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="691.8" dy="0">20</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="477" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="477" x2="875.7" y2="482" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="498" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">30</tspan></text><line x1="324" y1="477" x2="875.7" y2="477" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Campo ausente</tspan></text><text x="314" y="141.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Rango ausente</tspan></text><text x="314" y="181.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Confianza ausente</tspan></text><text x="314" y="221.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Disparador sin umbral</tspan></text><text x="314" y="261.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Supuesto sin responsable ni fecha</tspan></text><text x="314" y="301.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Fecha de revisión sin formato</tspan></text><text x="314" y="341.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Responsable colectivo</tspan></text><text x="314" y="381.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Métrica sin definición</tspan></text><text x="314" y="421.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Rango invertido (14 a 9 semanas)</tspan></text><text x="314" y="461.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Salvaguarda que contradice el objetivo</tspan></text><rect x="324" y="84" width="514.92" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="581.46" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="581.46" dy="0">28</tspan></text><rect x="838.92" y="84" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="845.92" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="845.92" dy="0">28</tspan></text><rect x="324" y="124" width="275.85" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="461.925" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="461.925" dy="0">15</tspan></text><rect x="599.85" y="124" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="606.85" y="141.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="606.85" dy="0">15</tspan></text><rect x="324" y="164" width="331.02" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="489.51" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="489.51" dy="0">18</tspan></text><rect x="655.02" y="164" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="662.02" y="181.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="662.02" dy="0">18</tspan></text><rect x="324" y="204" width="312.63" height="26" fill="#087f8c" stroke="#