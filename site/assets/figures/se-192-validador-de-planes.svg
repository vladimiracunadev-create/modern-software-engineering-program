x="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="276.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Fecha de revisión sin formato</tspan></text><rect x="570" y="256" width="254" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="276.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">17 de 17</tspan></text><rect x="10" y="296" width="554" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="316.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Responsable colectivo</tspan></text><rect x="570" y="296" width="254" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="316.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">22 de 22</tspan></text><rect x="10" y="336" width="554" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="356.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Métrica sin definición</tspan></text><rect x="570" y="336" width="254" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="356.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">19 de 19</tspan></text><rect x="10" y="376" width="554" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="396.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Rango invertido (14 a 9 semanas)</tspan></text><rect x="570" y="376" width="254" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="396.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">0 de 20</tspan></text><rect x="10" y="416" width="554" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="436.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Salvaguarda que contradice el objetivo</tspan></text><rect x="570" y="416" width="254" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="436.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">0 de 23</tspan></text><rect x="10" y="460" width="820" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="420" y="484.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="420" dy="0">Detecta 157 de 200 y no ve ninguna de las 43 mutaciones de sentido. Un plan que pasa el validador está</tspan></text><text x="420" y="501.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="420" dy="0">completo en forma; no se sabe si es razonable.</tspan></text><text x="420" y="541.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="420" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
