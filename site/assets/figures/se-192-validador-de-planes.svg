<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 555" width="840" height="555" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Validador de planes sobre 200 mutaciones de un plan correcto</title><desc id="d">Tabla: un validador de forma detecta 157 de 200 mutaciones de un plan adaptativo; atrapa campos ausentes, rangos o confianzas faltantes, disparadores sin umbral y responsables colectivos, y no detecta ni un rango invertido ni una salvaguarda que contradice el objetivo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="840" height="555" fill="#ffffff"/><rect x="10" y="12" width="554" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="287" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="287" dy="0">Mutación</tspan></text><rect x="570" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="697" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="697" dy="0">Detectadas</tspan></text><rect x="10" y="56" width="554" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="76.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Campo ausente</tspan></text><rect x="570" y="56" width="254" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="76.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">28 de 28</tspan></text><rect x="10" y="96" width="554" height="34" rx="10" 