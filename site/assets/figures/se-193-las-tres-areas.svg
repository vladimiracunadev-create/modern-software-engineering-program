<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 436" width="940" height="436" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Las tres áreas de Git y lo que cuenta cada diff (a.py: 3 líneas en HEAD, 1 agregada y 2 más sin agregar)</title><desc id="d">Diagrama de las tres áreas de Git, HEAD, índice y árbol de trabajo, con los comandos que mueven el contenido entre ellas y las líneas que cuenta cada diff: git diff cuenta 2 entre el índice y el árbol de trabajo, git diff --cached cuenta 1 entre HEAD y el índice y git diff HEAD cuenta 3.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="436" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Las tres áreas de Git y lo que cuenta cada diff (a.py: 3 líneas en HEAD, 1 agregada y 2 más sin agregar)</tspan></text><rect x="40" y="53" width="200" height="84" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="140" y="89.96" font-size="14" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="140" dy="0">HEAD</tspan></text><text x="140" y="107.88" font-size="14" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="140" dy="0">3 líneas</tspan></text><rect x="370" y="53" width="200" height="84" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="89.96" font-size="14" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="470" dy="0">Índice</tspan></text><text x="470" y="107.88" font-size="14" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="470" dy="0">+1 línea agregada</tspan></text><rect x="700" y="53" width="200" height="84" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="800" y="89.96" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="800" dy="0">Árbol de trabajo</tspan></text><text x="800" y="107.88" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="800" dy="0">+2 líneas sin agregar</tspan></text><polyline points="700,83 572,83" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="636" y="73" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="636" dy="0">git add</tspan></text><polyline points="370,83 242,83" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="306" y="73" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="306" dy="0">git commit</tspan></text><polyline points="242,115 370,115" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="306" y="131" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="306" dy="0">restore --staged</tspan></text><polyline points="572,115 700,115" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="636" y="131" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="636" dy="0">restore</tspan></text><line x1="470" y1="165" x2="800" y2="165" stroke="#32505f" stroke-width="1.6"/><line x1="470" y1="158" x2="470" y2="165" stroke="#32505f" stroke-width="1.6"/><line x1="800" y1="158" x2="800" y2="165" stroke="#32505f" stroke-width="1.6"/><text x="635" y="185" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="635" dy="0">git diff: 2 líneas (índice frente a árbol de trabajo)</tspan></text><line x1="140" y1="215" x2="470" y2="215" stroke="#32505f" stroke-width="1.6"/><line x1="140" y1="208" x2="140" y2="215" stroke="#32505f" stroke-width="1.6"/><line x1="470" y1="208" x2="470" y2="215" stroke="#32505f" stroke-width="1.6"/><text x="305" y="235" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="305" dy="0">git diff --cached: 1 línea (HEAD frente a índice)</tspan></text><line x1="140" y1="265" x2="800" y2="265" stroke="#32505f" stroke-width="1.6"/><line x1="140" y1="258" x2="140" y2="265" stroke="#32505f" stroke-width="1.6"/><line x1="800" y1="258" x2="800" y2="265" stroke="#32505f" stroke-width="1.6"/><text x="470" y="285" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="470" dy="0">git diff HEAD: 3 líneas (HEAD frente a árbol de trabajo)</tspan></text><text x="14" y="309" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="14" dy="0">git status --porcelain: la primera letra compara el índice con HEAD; la segunda, el árbol de trabajo con el índice.</tspan></text><rect x="10" y="329" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="353.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Un restore posterior borra las 2 líneas sin agregar y conserva la agregada. Un archivo nuevo sin agregar (??) no está en</tspan></text><text x="470" y="370.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ninguna de las tres áreas: Git no lo rastrea y no aparece en ningún diff.</tspan></text><text x="470" y="418.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Git real en repositorios temporales con identidad y fechas fijas; salidas idénticas con Git 2.55 (Windows) y 2.43 (Ubuntu, WSL2).</tspan></text></svg>
