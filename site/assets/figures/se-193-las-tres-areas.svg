<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 467" width="990" height="467" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Estados de git status --porcelain en cada paso</title><desc id="d">Tabla de seis operaciones con el código de dos letras que muestra git status y qué significa respecto del árbol de trabajo, el índice y HEAD.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="990" height="467" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Situación</tspan></text><rect x="340" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="397" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="397" dy="0">Código</tspan></text><rect x="460" y="12" width="514" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="717" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="717" dy="0">Qué significa</tspan></text><rect x="10" y="56" width="324" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="82.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Archivo nuevo sin agregar</tspan></text><rect x="340" y="56" width="114" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">??</tspan></text><rect x="460" y="56" width="514" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">Git no lo rastrea; no aparece en ningún diff</tspan></text><rect x="10" y="108" width="324" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="134.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Archivo nuevo, agregado</tspan></text><rect x="340" y="108" width="114" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">A·</tspan></text><rect x="460" y="108" width="514" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">Está en el índice; git diff --cached lo muestra</tspan></text><rect x="10" y="160" width="324" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="186.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Agregado y editado después</tspan></text><rect x="340" y="160" width="114" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">AM</tspan></text><rect x="460" y="160" width="514" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">El índice tiene la versión vieja y el árbol de trabajo la nueva</tspan></text><rect x="10" y="212" width="324" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="238.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Editado sin agregar</tspan></text><rect x="340" y="212" width="114" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="238.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">·M</tspan></text><rect x="460" y="212" width="514" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="238.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">Solo cambia el árbol de trabajo</tspan></text><rect x="10" y="264" width="324" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="290.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Editado y agregado</tspan></text><rect x="340" y="264" width="114" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="290.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">M·</tspan></text><rect x="460" y="264" width="514" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="290.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">El índice y el árbol de trabajo coinciden; difiere de HEAD</tspan></text><rect x="10" y="316" width="324" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="342.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Quitado solo del índice</tspan></text><rect x="340" y="316" width="114" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="342.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">D· y ??</tspan></text><rect x="460" y="316" width="514" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="342.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">El archivo sigue en disco pero deja de estar rastreado</tspan></text><rect x="10" y="372" width="970" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="495" y="396.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">En a.py con 3 líneas en HEAD, 1 agregada y 2 más sin agregar: git diff cuenta 2, git diff --cached cuenta 1 y git diff HEAD cuenta</tspan></text><text x="495" y="413.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">3. Un restore posterior borra las 2 sin agregar y conserva la agregada.</tspan></text><text x="495" y="453.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">Git real en repositorios temporales con identidad y fechas fijas; salidas idénticas con Git 2.55 (Windows) y 2.43 (Ubuntu, WSL2).</tspan></text></svg>
