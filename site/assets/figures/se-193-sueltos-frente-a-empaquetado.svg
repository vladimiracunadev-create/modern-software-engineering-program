<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 247" width="1040" height="247" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Espacio de 301 versiones de un archivo con 300 ediciones de una línea</title><desc id="d">Barras: 301 versiones de un archivo de 35 830 bytes ocupan 10,78 millones de bytes sin comprimir, 5,59 millones como objetos sueltos y 96 000 bytes empaquetados con deltas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1040" height="247" fill="#ffffff"/><text x="380" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="380" dy="0">301 versiones sin comprimir (35 830 B cada una)</tspan></text><rect x="390" y="16" width="862.4" height="28" rx="3" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="1260.4" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="1260.4" dy="0">10,78 MB</tspan></text><text x="380" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="380" dy="0">903 objetos sueltos, comprimidos uno a uno</tspan></text><rect x="390" y="60" width="447.2" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="845.2" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="845.2" dy="0">5,59 MB</tspan></text><text x="380" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="380" dy="0">Los mismos 903 objetos tras gc --aggressive</tspan></text><rect x="390" y="104" width="7.68" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="405.68" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="405.68" dy="0">96 000 B</tspan></text><rect x="10" y="152" width="1020" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="520" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="520" dy="0">Los objetos sueltos solo comprimen cada versión por separado; el paquete guarda diferencias entre versiones y es unas 58 veces menor. Con</tspan></text><text x="520" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="520" dy="0">--object-format=sha256 el identificador mide 64 caracteres en lugar de 40.</tspan></text><text x="520" y="233.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="520" dy="0">Git real en repositorios temporales con identidad y fechas fijas; salidas idénticas con Git 2.55 (Windows) y 2.43 (Ubuntu, WSL2).</tspan></text></svg>
