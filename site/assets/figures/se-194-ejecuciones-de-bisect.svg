<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 411" width="1000" height="411" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">git bisect run sobre la misma pérdida de puntos con cuatro historias</title><desc id="d">Tabla de cuatro historias con el mismo defecto en el cambio 41: ejecuciones de la prueba, si Git encuentra un culpable único y cuánto hay que leer después.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="411" fill="#ffffff"/><rect x="10" y="12" width="334" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="177" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="177" dy="0">Historia</tspan></text><rect x="350" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="422" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="422" dy="0">Ejecuciones de la</tspan></text><text x="422" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="422" dy="0">prueba</tspan></text><rect x="500" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="612" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="612" dy="0">¿Culpable único?</tspan></text><rect x="730" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="857" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="857" dy="0">Qué hay que leer después</tspan></text><rect x="10" y="56" width="334" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="177" y="88.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177" dy="0">64 commits atómicos</tspan></text><rect x="350" y="56" width="144" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">6</tspan></text><rect x="500" y="56" width="224" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="612" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612" dy="0">Sí</tspan></text><rect x="730" y="56" width="254" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="857" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">4 líneas en 2 archivos</tspan></text><rect x="10" y="120" width="334" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="177" y="152.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177" dy="0">16 commits de 4 cambios cada uno</tspan></text><rect x="350" y="120" width="144" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">4</tspan></text><rect x="500" y="120" width="224" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="612" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612" dy="0">Sí</tspan></text><rect x="730" y="120" width="254" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="857" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">10 líneas en 5 archivos</tspan></text><rect x="10" y="184" width="334" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="177" y="208.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177" dy="0">64 atómicos con 3 intermedios rotos lejos del</tspan></text><text x="177" y="224.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177" dy="0">defecto</tspan></text><rect x="350" y="184" width="144" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">6</tspan></text><rect x="500" y="184" width="224" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="612" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612" dy="0">Sí</tspan></text><rect x="730" y="184" width="254" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="857" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">4 líneas en 2 archivos</tspan></text><rect x="10" y="248" width="334" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="177" y="272.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177" dy="0">64 atómicos con un intermedio roto junto al</tspan></text><text x="177" y="288.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177" dy="0">defecto</tspan></text><rect x="350" y="248" width="144" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="280.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">6</tspan></text><rect x="500" y="248" width="224" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="612" y="272.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612" dy="0">No: solo quedan commits</tspan></text><text x="612" y="288.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612" dy="0">omitidos</tspan></text><rect x="730" y="248" width="254" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="857" y="280.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">Hay que leer los candidatos a mano</tspan></text><rect x="10" y="316" width="980" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="500" y="340.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Agrupar cambios ahorra dos ejecuciones pero multiplica por 2,5 lo que se lee. Un commit intermedio que no compila junto al defecto</tspan></text><text x="500" y="357.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">impide que Git señale un solo commit.</tspan></text><text x="500" y="397.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Git real en repositorios temporales con identidad y fechas fijas; salidas idénticas con Git 2.55 (Windows) y 2.43 (Ubuntu, WSL2).</tspan></text></svg>
