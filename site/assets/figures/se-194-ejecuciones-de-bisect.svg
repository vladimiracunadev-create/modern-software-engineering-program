<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 390" width="940" height="390" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ejecuciones de la prueba de git bisect run sobre la misma pérdida de puntos con cuatro historias</title><desc id="d">Barras horizontales con las ejecuciones de la prueba que necesita git bisect run en cuatro historias con el mismo defecto: 6 con 64 commits atómicos, 4 con 16 commits de cuatro cambios, 6 con tres intermedios rotos lejos del defecto y 6 con un intermedio roto junto al defecto, donde Git ya no encuentra un culpable único.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="390" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Ejecuciones de la prueba de git bisect run sobre la misma pérdida de puntos con cuatro historias</tspan></text><line x1="424" y1="49" x2="424" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="424" y1="225" x2="424" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="424" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="424" dy="0">0</tspan></text><line x1="544.985" y1="49" x2="544.985" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="544.985" y1="225" x2="544.985" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="544.985" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="544.985" dy="0">2</tspan></text><line x1="665.97" y1="49" x2="665.97" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="665.97" y1="225" x2="665.97" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="665.97" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="665.97" dy="0">4</tspan></text><line x1="786.955" y1="49" x2="786.955" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="786.955" y1="225" x2="786.955" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="786.955" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="786.955" dy="0">6</tspan></text><line x1="907.94" y1="49" x2="907.94" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="907.94" y1="225" x2="907.94" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="907.94" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907.94" dy="0">8</tspan></text><line x1="424" y1="225" x2="907.94" y2="225" stroke="#5b7280" stroke-width="1.6"/><text x="414" y="67" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="414" dy="0">64 commits atómicos: culpable único, 4 líneas en 2</tspan></text><text x="414" y="84" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="414" dy="0">archivos</tspan></text><text x="414" y="111" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="414" dy="0">16 commits de 4 cambios: culpable único, 10 líneas en</tspan></text><text x="414" y="128" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="414" dy="0">5 archivos</tspan></text><text x="414" y="155" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="414" dy="0">64 atómicos con 3 intermedios rotos lejos: culpable</tspan></text><text x="414" y="172" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="414" dy="0">único, 4 líneas</tspan></text><text x="414" y="199" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="414" dy="0">64 atómicos con un intermedio roto junto al defecto:</tspan></text><text x="414" y="216" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="414" dy="0">sin culpable único</tspan></text><rect x="424" y="55" width="362.955" height="32" rx="3" fill="#087f8c"/><text x="793.955" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="793.955" dy="0">6</tspan></text><rect x="424" y="99" width="241.97" height="32" rx="3" fill="#087f8c"/><text x="672.97" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="672.97" dy="0">4</tspan></text><rect x="424" y="143" width="362.955" height="32" rx="3" fill="#087f8c"/><text x="793.955" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="793.955" dy="0">6</tspan></text><rect x="424" y="187" width="362.955" height="32" rx="3" fill="#087f8c"/><text x="793.955" y="207.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="793.955" dy="0">6</tspan></text><text x="665.97" y="269" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="665.97" dy="0">Ejecuciones de la prueba</tspan></text><rect x="10" y="283" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="307.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Agrupar cambios ahorra dos ejecuciones pero multiplica por 2,5 lo que se lee. Un commit intermedio que no compila junto al</tspan></text><text x="470" y="324.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">defecto impide que Git señale un solo commit: solo quedan commits omitidos y hay que leer los candidatos a mano.</tspan></text><text x="470" y="372.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Git real en repositorios temporales con identidad y fechas fijas; salidas idénticas con Git 2.55 (Windows) y 2.43 (Ubuntu, WSL2).</tspan></text></svg>
