<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 423" width="1000" height="423" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Probabilidad de conflicto de texto al fusionar dos ramas</title><desc id="d">Barras: dos ediciones en la misma línea o en líneas contiguas siempre entran en conflicto; con una línea de separación nunca; con ediciones al azar la probabilidad pasa de 0,3 por ciento con una edición a 98,7 con dieciséis.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="423" fill="#ffffff"/><text x="330" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Dos ediciones en la misma línea</tspan></text><rect x="340" y="16" width="620" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="968" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="968" dy="0">100 %</tspan></text><text x="330" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Dos ediciones en líneas contiguas</tspan></text><rect x="340" y="60" width="620" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="968" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="968" dy="0">100 %</tspan></text><text x="330" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Con una línea de separación</tspan></text><rect x="340" y="104" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="352" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="352" dy="0">0 %</tspan></text><text x="330" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">1 edición por rama, 200 líneas</tspan></text><rect x="340" y="148" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="352" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="352" dy="0">0,3 %</tspan></text><text x="330" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">4 ediciones por rama</tspan></text><rect x="340" y="192" width="130.2" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="478.2" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="478.2" dy="0">21 %</tspan></text><text x="330" y="255.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">8 ediciones por rama</tspan></text><rect x="340" y="236" width="376.34" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="724.34" y="255.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="724.34" dy="0">60,7 %</tspan></text><text x="330" y="299.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">16 ediciones por rama</tspan></text><rect x="340" y="280" width="611.94" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="959.94" y="299.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="959.94" dy="0">98,7 %</tspan></text><rect x="10" y="328" width="980" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="500" y="352.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">Git señala conflicto cuando dos cambios tocan líneas contiguas, no solo la misma. Con ediciones al azar la probabilidad crece como</tspan></text><text x="500" y="369.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">una colisión: cuadruplicar las ediciones de 4 a 16 la lleva de 21 % a casi 99 %.</tspan></text><text x="500" y="409.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2). Los parámetros son supuestos del autor.</tspan></text></svg>
