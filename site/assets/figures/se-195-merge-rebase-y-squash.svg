<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 347" width="990" height="347" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres formas de integrar una rama de 4 commits cuando main avanzó 3</title><desc id="d">Tabla de merge, rebase y squash con el número de commits en main, fusiones y cuántos commits de la rama conservan su identificador.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="990" height="347" fill="#ffffff"/><rect x="10" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="117" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="117" dy="0">Estrategia</tspan></text><rect x="230" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="292" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="292" dy="0">Commits en</tspan></text><text x="292" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="292" dy="0">main</tspan></text><rect x="360" y="12" width="104" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="412" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="412" dy="0">Fusiones</tspan></text><rect x="470" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="542" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="542" dy="0">Hashes</tspan></text><text x="542" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="542" dy="0">conservados</tspan></text><rect x="620" y="12" width="354" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="797" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="797" dy="0">Lectura</tspan></text><rect x="10" y="56" width="214" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="117" y="88.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="117" dy="0">Merge sin avance rápido</tspan></text><rect x="230" y="56" width="124" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="292" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="292" dy="0">10</tspan></text><rect x="360" y="56" width="104" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="412" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412" dy="0">1</tspan></text><rect x="470" y="56" width="144" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">4 de 4</tspan></text><rect x="620" y="56" width="354" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">Conserva la forma de la bifurcación</tspan></text><rect x="10" y="120" width="214" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="117" y="152.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="117" dy="0">Rebase y avance rápido</tspan></text><rect x="230" y="120" width="124" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="292" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="292" dy="0">9</tspan></text><rect x="360" y="120" width="104" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="412" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412" dy="0">0</tspan></text><rect x="470" y="120" width="144" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">0 de 4</tspan></text><rect x="620" y="120" width="354" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">Reescribe los 4 commits: cambian de identificador</tspan></text><rect x="10" y="184" width="214" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="117" y="216.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="117" dy="0">Squash</tspan></text><rect x="230" y="184" width="124" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="292" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="292" dy="0">6</tspan></text><rect x="360" y="184" width="104" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="412" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412" dy="0">0</tspan></text><rect x="470" y="184" width="144" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">0 de 4</tspan></text><rect x="620" y="184" width="354" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">Un commit nuevo; los 4 originales no entran</tspan></text><rect x="10" y="252" width="970" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="495" y="276.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="495" dy="0">El árbol final fue idéntico en las tres. Cambia la historia, no el contenido; por eso la elección es de trazabilidad y de quién ya</tspan></text><text x="495" y="293.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="495" dy="0">tiene esos commits.</tspan></text><text x="495" y="333.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">Git real en repositorios temporales con identidad y fechas fijas; salidas idénticas con Git 2.55 (Windows) y 2.43 (Ubuntu, WSL2).</tspan></text></svg>
