<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 283" width="990" height="283" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Repetir la misma fusión con rerere inactivo y activo</title><desc id="d">Tabla con las marcas de conflicto en la primera y la segunda fusión de las mismas ramas, con rerere desactivado y activado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="990" height="283" fill="#ffffff"/><rect x="10" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="77" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="77" dy="0">rerere</tspan></text><rect x="150" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="257" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="257" dy="0">Marcas en la 1.ª fusión</tspan></text><rect x="370" y="12" width="284" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="512" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="512" dy="0">Marcas en la 2.ª fusión</tspan></text><rect x="660" y="12" width="314" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="817" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="817" dy="0">Contenido de la 2.ª</tspan></text><rect x="10" y="56" width="134" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="77" y="88.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="77" dy="0">Inactivo</tspan></text><rect x="150" y="56" width="214" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="257" dy="0">1</tspan></text><rect x="370" y="56" width="284" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">1 (hay que resolver otra vez)</tspan></text><rect x="660" y="56" width="314" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">Con marcas</tspan></text><rect x="10" y="120" width="134" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="77" y="152.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="77" dy="0">Activo</tspan></text><rect x="150" y="120" width="214" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="257" dy="0">1</tspan></text><rect x="370" y="120" width="284" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">0</tspan></text><rect x="660" y="120" width="314" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">tope=60 (la resolución previa se reaplica)</tspan></text><rect x="10" y="188" width="970" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="495" y="212.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">Con rerere el código de salida de la segunda fusión sigue siendo 1: Git avisa de que había conflicto y aun así deja resuelto el</tspan></text><text x="495" y="229.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">archivo. Hay que revisarlo y agregarlo; la reutilización no valida que la resolución siga siendo correcta.</tspan></text><text x="495" y="269.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">Git real en repositorios temporales con identidad y fechas fijas; salidas idénticas con Git 2.55 (Windows) y 2.43 (Ubuntu, WSL2).</tspan></text></svg>
