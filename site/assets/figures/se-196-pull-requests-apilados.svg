<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" width="940" height="330" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Corregir el primer PR de una pila de cuatro y reapilar con rebase --update-refs</title><desc id="d">Barras apiladas horizontales con las tres ramas de la pila que quedan actualizadas tras corregir el primer pull request: con una corrección lejana se actualizan 3 de 3; con una corrección contigua a la línea que edita el segundo PR hay conflicto y 0 de 3, porque Git se detiene en el primero.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="330" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Corregir el primer PR de una pila de cuatro y reapilar con rebase --update-refs</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Ramas actualizadas</tspan></text><rect x="199.72" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="219.72" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="219.72" dy="0">Ramas sin actualizar</tspan></text><line x1="294" y1="77" x2="294" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="165" x2="294" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">0</tspan></text><line x1="487.9" y1="77" x2="487.9" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="487.9" y1="165" x2="487.9" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="487.9" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487.9" dy="0">1</tspan></text><line x1="681.8" y1="77" x2="681.8" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="681.8" y1="165" x2="681.8" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="681.8" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="681.8" dy="0">2</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="165" x2="875.7" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">3</tspan></text><line x1="294" y1="165" x2="875.7" y2="165" stroke="#5b7280" stroke-width="1.6"/><text x="284" y="95" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Corrección en una zona lejana de los</tspan></text><text x="284" y="112" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">demás PR</tspan></text><text x="284" y="139" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Corrección junto a la línea que edita</tspan></text><text x="284" y="156" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">el PR 2</tspan></text><rect x="294" y="84" width="581.7" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="584.85" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="584.85" dy="0">3</tspan></text><rect x="875.7" y="84" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="103.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">3</tspan></text><rect x="294" y="128" width="0" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="294" y="128" width="581.7" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="584.85" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="584.85" dy="0">3</tspan></text><text x="882.7" y="147.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">3</tspan></text><text x="584.85" y="209" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="584.85" dy="0">Ramas de la pila que se actualizan (de 3)</tspan></text><rect x="10" y="223" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="247.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Una pila de PR pequeños reduce lo que se lee, pero cada corrección del primero se paga en reapilados. Cuando hay conflicto</tspan></text><text x="470" y="264.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Git detiene todo y hay que resolverlo para continuar.</tspan></text><text x="470" y="312.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Git real en repositorios temporales con identidad y fechas fijas; salidas idénticas con Git 2.55 (Windows) y 2.43 (Ubuntu, WSL2).</tspan></text></svg>
