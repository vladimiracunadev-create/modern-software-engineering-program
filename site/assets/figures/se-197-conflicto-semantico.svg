<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 371" width="940" height="371" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Veces que main queda roto por 500 PR si no se prueba la fusión (media de 20 semillas)</title><desc id="d">Mapa de calor con la media de veces que main se rompe por 500 pull requests verdes por separado pero incompatibles: con el 10 por ciento de solapamientos, 0,9, 2,4 y 5,1 según rompan con probabilidad 2, 5 y 10 por ciento; con el 30 por ciento, 3,0, 7,0 y 14,8.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="371" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Veces que main queda roto por 500 PR si no se prueba la fusión (media de 20 semillas)</tspan></text><text x="608" y="59" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="608" dy="0">Probabilidad de que dos PR solapados sean incompatibles</tspan></text><text x="400" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="400" dy="0">Incompatibles el 2 %</tspan></text><text x="608" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="608" dy="0">Incompatibles el 5 %</tspan></text><text x="816" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="816" dy="0">Incompatibles el 10 %</tspan></text><text x="286" y="118" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="286" dy="0">10 % de los PR toca lo mismo que</tspan></text><text x="286" y="135" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="286" dy="0">otro abierto</tspan></text><text x="286" y="174" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="286" dy="0">30 % de los PR toca lo mismo que</tspan></text><text x="286" y="191" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="286" dy="0">otro abierto</tspan></text><rect x="297.5" y="95.5" width="205" height="53" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="400" y="126.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="400" dy="0">0,9</tspan></text><rect x="505.5" y="95.5" width="205" height="53" rx="4" fill="#f5d3cb" stroke="#ffffff" stroke-width="1"/><text x="608" y="126.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="608" dy="0">2,4</tspan></text><rect x="713.5" y="95.5" width="205" height="53" rx="4" fill="#e9b3a9" stroke="#ffffff" stroke-width="1"/><text x="816" y="126.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="816" dy="0">5,1</tspan></text><rect x="297.5" y="151.5" width="205" height="53" rx="4" fill="#f2ccc4" stroke="#ffffff" stroke-width="1"/><text x="400" y="182.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="400" dy="0">3,0</tspan></text><rect x="505.5" y="151.5" width="205" height="53" rx="4" fill="#e19d91" stroke="#ffffff" stroke-width="1"/><text x="608" y="182.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="608" dy="0">7,0</tspan></text><rect x="713.5" y="151.5" width="205" height="53" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="816" y="182.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="816" dy="0">14,8</tspan></text><text x="20" y="150" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 150)">Solapamiento</text><text x="296" y="232" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="296" dy="0">0,9</tspan></text><rect x="326.62" y="220" width="30.5" height="14" fill="#fbe4de"/><rect x="356.62" y="220" width="30.5" height="14" fill="#f3cdc5"/><rect x="386.62" y="220" width="30.5" height="14" fill="#eab6ac"/><rect x="416.62" y="220" width="30.5" height="14" fill="#e29f93"/><rect x="446.62" y="220" width="30.5" height="14" fill="#d9887a"/><rect x="476.62" y="220" width="30.5" height="14" fill="#d17161"/><rect x="506.62" y="220" width="30.5" height="14" fill="#c85a48"/><rect x="536.62" y="220" width="30.5" height="14" fill="#c0432f"/><text x="574.62" y="232" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="574.62" dy="0">14,8</tspan></text><text x="612.78" y="232" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="612.78" dy="0">más oscuro = mayor (veces que main queda roto)</tspan></text><rect x="10" y="248" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="272.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">En Git real, dos ramas fusionaron sin conflicto de texto y el panel imprimió 42 en lugar de 60 porque una cambió el orden</tspan></text><text x="470" y="289.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">de los parámetros y la otra seguía llamando con el orden antiguo. Una cola de fusión prueba el resultado combinado y lleva</tspan></text><text x="470" y="306.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">esta cifra a 0 a costa de espera.</tspan></text><text x="470" y="353.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2). Los parámetros son supuestos del autor.</tspan></text></svg>
