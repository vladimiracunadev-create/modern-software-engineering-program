<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 299" width="930" height="299" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Veces que main queda roto por 500 PR si no se prueba la fusión (media de 20 semillas)</title><desc id="d">Tabla con la media de veces que main se rompe por 500 pull requests cuando dos PR verdes por separado son incompatibles, según la proporción de solapamientos y la probabilidad de incompatibilidad.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="299" fill="#ffffff"/><rect x="10" y="12" width="424" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="222" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="222" dy="0">Solapamiento</tspan></text><rect x="440" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="517" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="517" dy="0">Rompe 2 %</tspan></text><rect x="600" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="677" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="677" dy="0">Rompe 5 %</tspan></text><rect x="760" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="837" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="837" dy="0">Rompe 10 %</tspan></text><rect x="10" y="56" width="424" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="88.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">10 % de los PR toca lo mismo que otro abierto</tspan></text><rect x="440" y="56" width="154" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="517" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517" dy="0">0,9</tspan></text><rect x="600" y="56" width="154" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="677" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="677" dy="0">2,4</tspan></text><rect x="760" y="56" width="154" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">5,1</tspan></text><rect x="10" y="120" width="424" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="152.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">30 % de los PR toca lo mismo que otro abierto</tspan></text><rect x="440" y="120" width="154" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="517" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517" dy="0">3,0</tspan></text><rect x="600" y="120" width="154" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="677" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="677" dy="0">7,0</tspan></text><rect x="760" y="120" width="154" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">14,8</tspan></text><rect x="10" y="188" width="910" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="465" y="212.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">En Git real, dos ramas fusionaron sin conflicto de texto y el panel imprimió 42 en lugar de 60 porque una cambió el orden</tspan></text><text x="465" y="229.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">de los parámetros y la otra seguía llamando con el orden antiguo. Una cola de fusión prueba el resultado combinado y lleva</tspan></text><text x="465" y="246.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">esta cifra a 0 a costa de espera.</tspan></text><text x="465" y="285.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2). Los parámetros son supuestos del autor.</tspan></text></svg>
