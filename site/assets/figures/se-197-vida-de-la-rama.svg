<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 335" width="1020" height="335" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Integraciones con conflicto según los días que vive la rama</title><desc id="d">Barras: con cinco personas editando un archivo de 400 líneas con una zona caliente, 45,3 por ciento de las integraciones de ramas de un día tienen conflicto y más de 84 por ciento cuando duran dos o más días.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1020" height="335" fill="#ffffff"/><text x="360" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Ramas de 1 día (1 200 integraciones)</tspan></text><rect x="370" y="16" width="371.46" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="749.46" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="749.46" dy="0">45,3 %</tspan></text><text x="360" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Ramas de 2 días (600)</tspan></text><rect x="370" y="60" width="688.8" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="1066.8" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="1066.8" dy="0">84,0 %</tspan></text><text x="360" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Ramas de 5 días (240)</tspan></text><rect x="370" y="104" width="799.5" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="1177.5" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="1177.5" dy="0">97,5 %</tspan></text><text x="360" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Ramas de 10 días (120)</tspan></text><rect x="370" y="148" width="779" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="1157" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="1157" dy="0">95,0 %</tspan></text><text x="360" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Ramas de 20 días (60)</tspan></text><rect x="370" y="192" width="738" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="1116" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="1116" dy="0">90,0 %</tspan></text><rect x="10" y="240" width="1000" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="510" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="510" dy="0">Aun con ramas de un día casi la mitad tiene conflicto en este modelo, porque el archivo concentra las ediciones. Desde los 5 días el</tspan></text><text x="510" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="510" dy="0">porcentaje deja de crecer y las integraciones se vuelven raras pero casi siempre dolorosas.</tspan></text><text x="510" y="321.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="510" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2). Los parámetros son supuestos del autor.</tspan></text></svg>
