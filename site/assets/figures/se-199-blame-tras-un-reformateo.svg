<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 347" width="990" height="347" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Autoría de 300 líneas tras un commit que solo cambia la sangría de 150</title><desc id="d">Tabla de líneas atribuidas a la autora, a otra persona y a un bot según se ignore o no el commit de reformateo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="990" height="347" fill="#ffffff"/><rect x="10" y="12" width="304" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="162" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="162" dy="0">Comando</tspan></text><rect x="320" y="12" width="84" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="362" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="362" dy="0">Autora</tspan></text><rect x="410" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="467" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="467" dy="0">Otra persona</tspan></text><rect x="530" y="12" width="64" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="562" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="562" dy="0">Bot</tspan></text><rect x="600" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="787" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="787" dy="0">Lectura</tspan></text><rect x="10" y="56" width="304" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="88.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">git blame sin ignorar</tspan></text><rect x="320" y="56" width="84" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">120</tspan></text><rect x="410" y="56" width="114" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="467" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">30</tspan></text><rect x="530" y="56" width="64" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">150</tspan></text><rect x="600" y="56" width="374" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="80.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">El bot que reformateó figura como autor de 150</tspan></text><text x="787" y="96.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">líneas</tspan></text><rect x="10" y="120" width="304" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="152.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">git blame --ignore-rev del reformateo</tspan></text><rect x="320" y="120" width="84" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">270</tspan></text><rect x="410" y="120" width="114" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="467" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">30</tspan></text><rect x="530" y="120" width="64" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">0</tspan></text><rect x="600" y="120" width="374" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">Cada línea vuelve a su autoría real</tspan></text><rect x="10" y="184" width="304" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="216.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">git blame --ignore-revs-file</tspan></text><rect x="320" y="184" width="84" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">270</tspan></text><rect x="410" y="184" width="114" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="467" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">30</tspan></text><rect x="530" y="184" width="64" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">0</tspan></text><rect x="600" y="184" width="374" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">Mismo resultado con un archivo versionado</tspan></text><rect x="10" y="252" width="970" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="495" y="276.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="495" dy="0">Ignorar el reformateo recupera la autoría solo porque cada línea cambió de forma pero no de sentido. Un commit que mezcla</tspan></text><text x="495" y="293.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="495" dy="0">reformateo y lógica no puede ignorarse sin ocultar la lógica.</tspan></text><text x="495" y="333.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">Git real en repositorios temporales con identidad y fechas fijas; salidas idénticas con Git 2.55 (Windows) y 2.43 (Ubuntu, WSL2).</tspan></text></svg>
