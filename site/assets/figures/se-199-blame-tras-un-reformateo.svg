<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 374" width="940" height="374" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Autoría de 300 líneas tras un commit que solo cambia la sangría de 150</title><desc id="d">Barras apiladas horizontales con las líneas atribuidas a la autora, a otra persona y a un bot: git blame sin ignorar atribuye 150 líneas al bot que reformateó; con --ignore-rev o --ignore-revs-file el bot no figura y la autora recupera 270 líneas y la otra persona 30.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="374" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Autoría de 300 líneas tras un commit que solo cambia la sangría de 150</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Autora</tspan></text><rect x="109.24" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="129.24" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="129.24" dy="0">Otra persona</tspan></text><rect x="247.72" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="267.72" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="267.72" dy="0">Bot que reformateó</tspan></text><line x1="274" y1="77" x2="274" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="209" x2="274" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0</tspan></text><line x1="474.567" y1="77" x2="474.567" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="474.567" y1="209" x2="474.567" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="474.567" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="474.567" dy="0">100</tspan></text><line x1="675.133" y1="77" x2="675.133" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="675.133" y1="209" x2="675.133" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="675.133" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="675.133" dy="0">200</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="209" x2="875.7" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">300</tspan></text><line x1="274" y1="209" x2="875.7" y2="209" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="103.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">git blame sin ignorar</tspan></text><text x="264" y="139" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">git blame --ignore-rev del</tspan></text><text x="264" y="156" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">reformateo</tspan></text><text x="264" y="191.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">git blame --ignore-revs-file</tspan></text><rect x="274" y="84" width="240.68" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="394.34" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="394.34" dy="0">120</tspan></text><rect x="514.68" y="84" width="60.17" height="30" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="544.765" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="544.765" dy="0">30</tspan></text><rect x="574.85" y="84" width="300.85" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="725.275" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="725.275" dy="0">150</tspan></text><text x="882.7" y="103.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">300</tspan></text><rect x="274" y="128" width="541.53" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="544.765" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="544.765" dy="0">270</tspan></text><rect x="815.53" y="128" width="60.17" height="30" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="845.615" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="845.615" dy="0">30</tspan></text><rect x="875.7" y="128" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="147.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">300</tspan></text><rect x="274" y="172" width="541.53" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="544.765" y="191.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="544.765" dy="0">270</tspan></text><rect x="815.53" y="172" width="60.17" height="30" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="845.615" y="191.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="845.615" dy="0">30</tspan></text><rect x="875.7" y="172" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="191.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">300</tspan></text><text x="574.85" y="253" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="574.85" dy="0">Líneas atribuidas (de 300)</tspan></text><rect x="10" y="267" width="920" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="291.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Ignorar el reformateo recupera la autoría solo porque cada línea cambió de forma pero no de sentido. Un commit que mezcla</tspan></text><text x="470" y="308.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">reformateo y lógica no puede ignorarse sin ocultar la lógica.</tspan></text><text x="470" y="356.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Git real en repositorios temporales con identidad y fechas fijas; salidas idénticas con Git 2.55 (Windows) y 2.43 (Ubuntu, WSL2).</tspan></text></svg>
