<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 450" width="940" height="450" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un CODEOWNERS sintético de 24 reglas evaluado sobre 600 rutas</title><desc id="d">Barras horizontales con rutas de 600: ninguna sin propietario con la regla «*» y 31 sin ella; 520 cambian de propietario al invertir el orden de las reglas; el equipo más cargado recibe 108 rutas y el menos cargado 25.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="450" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un CODEOWNERS sintético de 24 reglas evaluado sobre 600 rutas</tspan></text><line x1="354" y1="49" x2="354" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="269" x2="354" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="488.455" y1="49" x2="488.455" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="488.455" y1="269" x2="488.455" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="488.455" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="488.455" dy="0">150</tspan></text><line x1="622.91" y1="49" x2="622.91" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="622.91" y1="269" x2="622.91" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="622.91" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622.91" dy="0">300</tspan></text><line x1="757.365" y1="49" x2="757.365" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="757.365" y1="269" x2="757.365" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="757.365" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757.365" dy="0">450</tspan></text><line x1="891.82" y1="49" x2="891.82" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="891.82" y1="269" x2="891.82" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="891.82" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="891.82" dy="0">600</tspan></text><line x1="354" y1="269" x2="891.82" y2="269" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="67" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Sin propietario, con la regla «*» al</tspan></text><text x="344" y="84" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">principio</tspan></text><text x="344" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Sin propietario si se quita «*»</tspan></text><text x="344" y="163.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Cambian de propietario al invertir el orden</tspan></text><text x="344" y="207.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Carga del equipo más cargado</tspan></text><text x="344" y="251.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Carga del equipo menos cargado</tspan></text><rect x="354" y="55" width="2" height="32" rx="3" fill="#087f8c"/><text x="363" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="99" width="27.7874" height="32" rx="3" fill="#087f8c"/><text x="388.787" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="388.787" dy="0">31</tspan></text><rect x="354" y="143" width="466.111" height="32" rx="3" fill="#087f8c"/><text x="827.111" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="827.111" dy="0">520</tspan></text><rect x="354" y="187" width="96.8076" height="32" rx="3" fill="#087f8c"/><text x="457.808" y="207.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="457.808" dy="0">108</tspan></text><rect x="354" y="231" width="22.4092" height="32" rx="3" fill="#087f8c"/><text x="383.409" y="251.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="383.409" dy="0">25</tspan></text><text x="622.91" y="313" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="622.91" dy="0">Rutas de 600</tspan></text><rect x="10" y="327" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="351.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El último patrón que coincide gana, así que el orden es la semántica; 1 regla de 24 («/CODEOWNERS») nunca gana. El modelo</tspan></text><text x="470" y="368.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de coincidencia es una simplificación de lo que describe la documentación, no el motor de una plataforma: sirve para</tspan></text><text x="470" y="385.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">auditar reglas, no para sustituir la comprobación en el alojamiento real.</tspan></text><text x="470" y="432.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2). Los parámetros son supuestos del autor.</tspan></text></svg>
