<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 363" width="1000" height="363" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Concentración de commits entre 30 contribuyentes sintéticos (400 commits, 300 archivos)</title><desc id="d">Tabla con cuatro exponentes de concentración: cuántos autores cubren la mitad de los commits y qué porcentaje de archivos solo tocó la persona más activa.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="363" fill="#ffffff"/><rect x="10" y="12" width="314" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="167" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="167" dy="0">Exponente de la distribución</tspan></text><rect x="330" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="492" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="492" dy="0">Autores que cubren el 50 % de los commits</tspan></text><rect x="660" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="822" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="822" dy="0">Archivos que solo tocó la persona más</tspan></text><text x="822" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="822" dy="0">activa</tspan></text><rect x="10" y="56" width="314" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="82.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">0,5 (reparto casi uniforme)</tspan></text><rect x="330" y="56" width="324" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="492" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">9,1</tspan></text><rect x="660" y="56" width="324" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">2,6 %</tspan></text><rect x="10" y="108" width="314" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="134.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">1,0</tspan></text><rect x="330" y="108" width="324" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="492" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">4,1</tspan></text><rect x="660" y="108" width="324" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">7,6 %</tspan></text><rect x="10" y="160" width="314" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="186.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">1,5</tspan></text><rect x="330" y="160" width="324" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="492" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">2,0</tspan></text><rect x="660" y="160" width="324" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">17,1 %</tspan></text><rect x="10" y="212" width="314" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="238.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">2,0 (muy concentrado)</tspan></text><rect x="330" y="212" width="324" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="492" y="238.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">1,0</tspan></text><rect x="660" y="212" width="324" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="238.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">31,6 %</tspan></text><rect x="10" y="268" width="980" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="500" y="292.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Con un exponente de 2 una sola persona produce la mitad de los commits y 3 de cada 10 archivos pierden a la única persona que los</tspan></text><text x="500" y="309.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">conocía si se va. Los exponentes son supuestos; sirven para ver la sensibilidad, no para describir un proyecto real.</tspan></text><text x="500" y="349.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2). Los parámetros son supuestos del autor.</tspan></text></svg>
