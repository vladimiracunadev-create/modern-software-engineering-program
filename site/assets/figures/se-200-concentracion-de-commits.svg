rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="462.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Con un exponente de 2 una sola persona produce la mitad de los commits y 3 de cada 10 archivos pierden a la única persona</tspan></text><text x="470" y="479.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">que los conocía si se va. Los exponentes son supuestos; sirven para ver la sensibilidad, no para describir un proyecto</tspan></text><text x="470" y="496.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">real.</tspan></text><text x="470" y="543.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2). Los parámetros son supuestos del autor.</tspan></text></svg>
