y="0">1,9</tspan></text><polyline points="111.7,263.609 291.769,327 531.862,351.082 651.908,358.835 771.954,368.83 892,382.918" fill="none" stroke="#087f8c" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="106.2" y="258.109" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="111.7" y="252.609" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="111.7" dy="0">6,2</tspan></text><rect x="286.269" y="321.5" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="291.769" y="316" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="291.769" dy="0">1</tspan></text><rect x="526.362" y="345.582" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="531.862" y="340.082" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="531.862" dy="0">0,5</tspan></text><rect x="646.408" y="353.335" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="651.908" y="347.835" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="651.908" dy="0">0,4</tspan></text><rect x="766.454" y="363.33" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="771.954" y="357.83" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="771.954" dy="0">0,3</tspan></text><rect x="886.5" y="377.418" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="371.918" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">0,2</tspan></text><rect x="10" y="467" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="491.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La línea punteada marca la carga que cada modelo pide al anfitrión: 27 horas semanales sin guía y 13,5 con ella. A la</tspan></text><text x="470" y="508.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">izquierda de esa carga la cola crece sin tope (las cifras de 14 y 20 horas son del horizonte simulado de 1 000 aportes, no</tspan></text><text x="470" y="525.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">un valor de equilibrio); a la derecha el tiempo cae pero la guía sigue ahorrando semanas de espera. InnerSource no falla</tspan></text><text x="470" y="541.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">por falta de apertura sino por una capacidad de revisión menor que la carga que genera cada aporte.</tspan></text><text x="470" y="589.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo sintético de cola con semilla fija (scripts/experiments_part16_ext.py); los parámetros son supuestos del autor.</tspan></text></svg>
