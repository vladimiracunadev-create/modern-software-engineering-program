<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 607" width="940" height="607" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Días laborables hasta fusionar un aporte ajeno según las horas semanales de revisión del equipo anfitrión</title><desc id="d">Líneas en escala logarítmica con la mediana de días hasta fusionar un aporte según las horas semanales que el equipo anfitrión dedica a revisar. Sin guía de contribución (3 rondas, 27 horas semanales de carga) la mediana es de 255,4 días con 14 horas, 85,5 con 20, 8,6 con 28, 3 con 32, 2,3 con 36 y 1,9 con 40. Con guía, plantilla y CI previo (1,5 rondas, 13,5 horas de carga) es de 6,2 días con 14 horas, 1 con 20, 0,5 con 28 y 0,2 con 40.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="607" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Días laborables hasta fusionar un aporte ajeno según las horas semanales de revisión del equipo anfitrión</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Sin guía: 3 rondas por aporte</tspan></text><rect x="282.66" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="302.66" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="302.66" dy="0">Con guía, plantilla y CI previo: 1,5 rondas</tspan></text><line x1="93.7" y1="407" x2="910" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="407" x2="93.7" y2="407" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="411.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">0,1</tspan></text><line x1="93.7" y1="327" x2="910" y2="327" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="327" x2="93.7" y2="327" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="331.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1</tspan></text><line x1="93.7" y1="247" x2="910" y2="247" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="247" x2="93.7" y2="247" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="251.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">10</tspan></text><line x1="93.7" y1="167" x2="910" y2="167" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="167" x2="93.7" y2="167" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="171.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">100</tspan></text><line x1="93.7" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="87" x2="93.7" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1 000</tspan></text><line x1="93.7" y1="87" x2="93.7" y2="407" stroke="#5b7280" stroke-width="1.6"/><line x1="111.7" y1="87" x2="111.7" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="111.7" y1="407" x2="111.7" y2="412" stroke="#5b7280" stroke-width="1.4"/><text x="111.7" y="428" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="111.7" dy="0">14</tspan></text><line x1="291.769" y1="87" x2="291.769" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="291.769" y1="407" x2="291.769" y2="412" stroke="#5b7280" stroke-width="1.4"/><text x="291.769" y="428" font-size="13" text-anchor="middle" font-weight="400" f