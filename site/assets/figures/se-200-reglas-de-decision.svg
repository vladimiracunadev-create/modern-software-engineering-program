<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 311" width="990" height="311" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reglas de decisión cuando solo el 30 % de las personas mantenedoras lee la propuesta</title><desc id="d">Tabla de tres reglas de decisión con 30 por ciento de disponibilidad: propuestas dañinas aceptadas, propuestas buenas rechazadas y propuestas sin decisión.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="990" height="311" fill="#ffffff"/><rect x="10" y="12" width="394" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="207" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="207" dy="0">Regla</tspan></text><rect x="410" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="502" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="502" dy="0">Dañinas aceptadas</tspan></text><rect x="600" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="692" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="692" dy="0">Buenas rechazadas</tspan></text><rect x="790" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="882" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="882" dy="0">Sin decisión</tspan></text><rect x="10" y="56" width="394" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="82.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Consenso perezoso (72 h sin objeción)</tspan></text><rect x="410" y="56" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">40,5 %</tspan></text><rect x="600" y="56" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">12,3 %</tspan></text><rect x="790" y="56" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="882" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">0 %</tspan></text><rect x="10" y="108" width="394" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="134.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Mayoría de 3 de 5</tspan></text><rect x="410" y="108" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">1,0 %</tspan></text><rect x="600" y="108" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">3,1 %</tspan></text><rect x="790" y="108" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="882" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">83,5 %</tspan></text><rect x="10" y="160" width="394" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="186.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Unanimidad de quienes votan, mínimo 3</tspan></text><rect x="410" y="160" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">0,5 %</tspan></text><rect x="600" y="160" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">4,1 %</tspan></text><rect x="790" y="160" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="882" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">83,5 %</tspan></text><rect x="10" y="216" width="970" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="495" y="240.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">Con 90 % de disponibilidad el consenso perezoso acepta 2,6 % de las dañinas pero rechaza 30,3 % de las buenas, y la mayoría de 3</tspan></text><text x="495" y="257.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">de 5 acepta 29,7 % de las dañinas. Ninguna regla es mejor en general: cada una cambia qué error se tolera.</tspan></text><text x="495" y="297.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2). Los parámetros son supuestos del autor.</tspan></text></svg>
