<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 709" width="940" height="709" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Política de licencias sobre 300 expresiones: decisiones erróneas de la comparación literal y avisos del analizador (el analizador no se equivoca sin avisar en ninguna)</title><desc id="d">Barras horizontales por tipo de expresión con las decisiones erróneas de la comparación literal y los avisos del analizador: la literal falla en 39 disyunciones, 28 de 50 conjunciones, 15 con paréntesis, 26 en minúsculas y 18 con barra; el analizador no se equivoca sin avisar nunca y avisa en 26 minúsculas, 18 con barra, 16 identificadores obsoletos y 22 remisiones a un archivo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="709" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Política de licencias sobre 300 expresiones: decisiones erróneas de la comparación literal y avisos del</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">analizador (el analizador no se equivoca sin avisar en ninguna)</tspan></text><rect x="16" y="64" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">La comparación literal se equivoca</tspan></text><rect x="320.36" y="64" width="12" height="12" rx="2" fill="#087f8c"/><text x="340.36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="340.36" dy="0">El analizador emite un aviso</tspan></text><line x1="294" y1="96" x2="294" y2="544" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="544" x2="294" y2="549" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="565" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">0</tspan></text><line x1="445.47" y1="96" x2="445.47" y2="544" stroke="#d5dde1" stroke-width="1"/><line x1="445.47" y1="544" x2="445.47" y2="549" stroke="#5b7280" stroke-width="1.4"/><text x="445.47" y="565" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="445.47" dy="0">10</tspan></text><line x1="596.94" y1="96" x2="596.94" y2="544" stroke="#d5dde1" stroke-width="1"/><line x1="596.94" y1="544" x2="596.94" y2="549" stroke="#5b7280" stroke-width="1.4"/><text x="596.94" y="565" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="596.94" dy="0">20</tspan></text><line x1="748.41" y1="96" x2="748.41" y2="544" stroke="#d5dde1" stroke-width="1"/><line x1="748.41" y1="544" x2="748.41" y2="549" stroke="#5b7280" stroke-width="1.4"/><text x="748.41" y="565" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="748.41" dy="0">30</tspan></text><line x1="899.88" y1="96" x2="899.88" y2="544" stroke="#d5dde1" stroke-width="1"/><line x1="899.88" y1="544" x2="899.88" y2="549" stroke="#5b7280" stroke-width="1.4"/><text x="899.88" y="565" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="899.88" dy="0">40</tspan></text><line x1="294" y1="544" x2="899.88" y2="544" stroke="#5b7280" stroke-width="1.6"/><text x="284" y="132.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Disyunción «A OR B» (39 casos)</tspan></text><text x="284" y="196.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Conjunción «A AND B» (50)</tspan></text><text x="284" y="260.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Con paréntesis (15)</tspan></text><text x="284" y="324.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Minúsculas «mit» (26)</tspan></text><text x="284" y="388.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Barra «MIT/Apache-2.0» (18)</tspan></text><text x="284" y="452.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Identificador obsoleto «GPL-3.0» (16)</tspan></text><text x="284" y="516.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Remisión a un archivo (22)</tspan></text><rect x="294" y="102" width="590.733" height="24.5" rx="3" fill="#c0432f"/><text x="891.733" y="118.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="891.733" dy="0">39</tspan></text><rect x="294" y="129.5" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="303" y="146.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="303" dy="0">0</tspan></text><rect x="294" y="166" width="424.116" height="24.5" rx="3" fill="#c0432f"/><text x="725.116" y="182.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="725.116" dy="0">28</tspan></text><rect x="294" y="193.5" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="303" y="210.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="303" dy="0">0</tspan></text><rect x="294" y="230" width="227.205" height="24.5" rx="3" fill="#c0432f"/><text x="528.205" y="246.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="528.205" dy="0">15</tspan></text><rect x="294" y="257.5" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="303" y="274.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="303" dy="0">0</tspan></text><rect x="294" y="294" width="393.822" height="24.5" rx="3" fill="#c0432f"/><text x="694.822" y="310.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="694.822" dy="0">26</tspan></text><rect x="294" y="321.5" width="393.822" height="24.5" rx="3" fill="#087f8c"/><text x="694.822" y="338.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="694.822" dy="0">26</tspan></text><rect x="294" y="358" width="272.646" height="24.5" rx="3" fill="#c0432f"/><text x="573.646" y="374.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="573.646" dy="0">18</tspan></text><rect x="294" y="385.5" width="272.646" height="24.5" rx="3" fill="#087f8c"/><text x="573.646" y="402.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="573.646" dy="0">18</tspan></text><rect x="294" y="422" width="2" height="24.5" rx="3" fill="#c0432f"/><text x="303" y="438.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="303" dy="0">0</tspan></text><rect x="294" y="449.5" width="242.352" height="24.5" rx="3" fill="#087f8c"/><text x="543.352" y="466.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="543.352" dy="0">16</tspan></text><rect x="294" y="486" width="2" height="24.5" rx="3" fill="#c0432f"/><text x="303" y="502.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="303" dy="0">0</tspan></text><rect x="294" y="513.5" width="333.234" height="24.5" rx="3" fill="#087f8c"/><text x="634.234" y="530.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="634.234" dy="0">22</tspan></text><text x="596.94" y="588" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="596.94" dy="0">Casos</tspan></text><rect x="10" y="602" width="920" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="626.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">De 300 expresiones la comparación literal decide mal 146; el analizador, ninguna sin avisar. Lo que no entiende («mit»,</tspan></text><text x="470" y="643.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">«MIT/Apache-2.0», identificadores obsoletos) lo marca para revisión humana en lugar de decidir.</tspan></text><text x="470" y="691.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2). Los parámetros son supuestos del autor.</tspan></text></svg>
