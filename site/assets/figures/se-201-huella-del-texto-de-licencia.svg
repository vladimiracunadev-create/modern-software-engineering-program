<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 450" width="940" height="450" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Razón de similitud de difflib frente a la huella del texto de licencia normalizado</title><desc id="d">Barras horizontales con la razón de similitud de difflib de cinco variantes del texto de la licencia MIT: otro año y otro titular y los saltos de línea distintos dan 1,000 con la misma huella; quitar la cláusula del aviso da 0,486; cambiar «AS IS» por otro texto da 0,971, casi igual aunque la huella difiere; el texto de otra licencia da 0,024.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="450" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Razón de similitud de difflib frente a la huella del texto de licencia normalizado</tspan></text><line x1="354" y1="49" x2="354" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="269" x2="354" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="484.425" y1="49" x2="484.425" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="484.425" y1="269" x2="484.425" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="484.425" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="484.425" dy="0">0,25</tspan></text><line x1="614.85" y1="49" x2="614.85" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="614.85" y1="269" x2="614.85" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="614.85" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="614.85" dy="0">0,5</tspan></text><line x1="745.275" y1="49" x2="745.275" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="745.275" y1="269" x2="745.275" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="745.275" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="745.275" dy="0">0,75</tspan></text><line x1="875.7" y1="49" x2="875.7" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="269" x2="875.7" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">1</tspan></text><line x1="354" y1="269" x2="875.7" y2="269" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="75.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Otro año y otro titular (huella igual)</tspan></text><text x="344" y="111" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Saltos de línea y espacios distintos (huella</tspan></text><text x="344" y="128" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">igual)</tspan></text><text x="344" y="155" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Se elimina la cláusula del aviso (huella</tspan></text><text x="344" y="172" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">distinta)</tspan></text><text x="344" y="199" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">«AS IS» sustituido por otro texto (huella</tspan></text><text x="344" y="216" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">distinta)</tspan></text><text x="344" y="251.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Texto de otra licencia (huella distinta)</tspan></text><rect x="354" y="55" width="521.7" height="32" rx="3" fill="#946512"/><text x="882.7" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">1,000</tspan></text><rect x="354" y="99" width="521.7" height="32" rx="3" fill="#946512"/><text x="882.7" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">1,000</tspan></text><rect x="354" y="143" width="253.546" height="32" rx="3" fill="#946512"/><text x="614.546" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="614.546" dy="0">0,486</tspan></text><rect x="354" y="187" width="506.571" height="32" rx="3" fill="#946512"/><text x="867.571" y="207.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="867.571" dy="0">0,971</tspan></text><rect x="354" y="231" width="12.5208" height="32" rx="3" fill="#946512"/><text x="373.521" y="251.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="373.521" dy="0">0,024</tspan></text><text x="614.85" y="313" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="614.85" dy="0">Razón de similitud de difflib</tspan></text><rect x="10" y="327" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="351.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Una razón de 0,971 puede esconder el cambio que elimina la garantía. La huella exacta detecta cualquier diferencia pero no</tspan></text><text x="470" y="368.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">dice cuál; la similitud dice cuánto, no si importa. En 400 archivos sintéticos, 14 etiquetas SPDX (GPL-3.0-only)</tspan></text><text x="470" y="385.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">contradecían el LICENSE (MIT) y 165 archivos no tenían etiqueta.</tspan></text><text x="470" y="432.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2). Los parámetros son supuestos del autor.</tspan></text></svg>
