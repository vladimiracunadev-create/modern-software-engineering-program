<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 390" width="940" height="390" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Verificar commits firmados con SSH: resultado de git verify-commit</title><desc id="d">Barras apiladas horizontales con el resultado de git verify-commit en tres casos: 60 de 60 commits firmados con una clave SSH desechable verifican; una copia con el mensaje cambiado y la misma firma falla con código 1; una firma válida de un firmante que no figura en el archivo de firmantes falla con código 1.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="390" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Verificar commits firmados con SSH: resultado de git verify-commit</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Verifican</tspan></text><rect x="131.86" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="151.86" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="151.86" dy="0">Fallan (código 1)</tspan></text><line x1="324" y1="77" x2="324" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="209" x2="324" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="507.9" y1="77" x2="507.9" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="507.9" y1="209" x2="507.9" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="507.9" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507.9" dy="0">20</tspan></text><line x1="691.8" y1="77" x2="691.8" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="691.8" y1="209" x2="691.8" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="691.8" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="691.8" dy="0">40</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="209" x2="875.7" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">60</tspan></text><line x1="324" y1="209" x2="875.7" y2="209" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="95" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">60 commits firmados con una clave SSH</tspan></text><text x="314" y="112" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">desechable</tspan></text><text x="314" y="139" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Copia con el mensaje cambiado y la misma</tspan></text><text x="314" y="156" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">firma</tspan></text><text x="314" y="183" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Firma válida con otro archivo de</tspan></text><text x="314" y="200" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">firmantes</tspan></text><rect x="324" y="84" width="551.7" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="599.85" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="599.85" dy="0">60</tspan></text><rect x="875.7" y="84" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="103.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">60</tspan></text><rect x="324" y="128" width="0" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="324" y="128" width="9.195" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="340.195" y="147.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="340.195" dy="0">1</tspan></text><rect x="324" y="172" width="0" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="324" y="172" width="9.195" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="340.195" y="191.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="340.195" dy="0">1</tspan></text><text x="599.85" y="253" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="599.85" dy="0">Comprobaciones de git verify-commit</tspan></text><rect x="10" y="267" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="291.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">La firma vive en una cabecera del propio objeto y cubre el contenido exacto del commit; válida no significa de confianza.</tspan></text><text x="470" y="308.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Firmar añadió unos 92 ms por commit en Windows y 7 ms en Ubuntu, y verificar costó 15 ms por commit en Ubuntu y 234 ms en</tspan></text><text x="470" y="325.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Windows (60 repeticiones, medidas de un equipo): no se comparan entre sistemas.</tspan></text><text x="470" y="372.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Git real en repositorios temporales con identidad y fechas fijas; salidas idénticas con Git 2.55 (Windows) y 2.43 (Ubuntu, WSL2).</tspan></text></svg>
