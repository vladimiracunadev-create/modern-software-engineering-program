<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 247" width="1080" height="247" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reescribir el mensaje de un commit antiguo en una cadena de 50 firmados</title><desc id="d">Barras: al cambiar el mensaje del undécimo commit de una cadena de 50 firmados cambia el identificador de 40 y solo 10 firmas siguen siendo válidas; el tip viejo deja de ser ancestro del nuevo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1080" height="247" fill="#ffffff"/><text x="470" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">Commits cuyo identificador cambia al reescribir el 11.º</tspan></text><rect x="480" y="16" width="600" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="1088" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="1088" dy="0">40 de 50</tspan></text><text x="470" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">Firmas válidas antes de reescribir</tspan></text><rect x="480" y="60" width="750" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="1238" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="1238" dy="0">50</tspan></text><text x="470" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">Firmas válidas después, sin volver a firmar</tspan></text><rect x="480" y="104" width="150" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="638" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="638" dy="0">10</tspan></text><rect x="10" y="152" width="1060" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="540" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="540" dy="0">Cada commit incluye el identificador de su padre, así que cualquier reescritura cambia a todos los descendientes y rompe sus firmas. Quien</tspan></text><text x="540" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="540" dy="0">tenga el tip viejo detecta que el nuevo no desciende de él.</tspan></text><text x="540" y="233.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="540" dy="0">Git real en repositorios temporales con identidad y fechas fijas; salidas idénticas con Git 2.55 (Windows) y 2.43 (Ubuntu, WSL2).</tspan></text></svg>
