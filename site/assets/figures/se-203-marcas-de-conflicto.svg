<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 362" width="940" height="362" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Líneas de marca de conflicto según el estilo (y si muestran la base)</title><desc id="d">Barras horizontales con las líneas de marca de conflicto de tres estilos: merge, el predeterminado, usa 3 y no muestra el original común; diff3 y zdiff3 usan 4 y sí lo muestran, zdiff3 con menos contexto repetido; abortar la fusión devuelve HEAD, índice y estado limpio.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="362" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Líneas de marca de conflicto según el estilo (y si muestran la base)</tspan></text><line x1="354" y1="49" x2="354" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="181" x2="354" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="464.788" y1="49" x2="464.788" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="464.788" y1="181" x2="464.788" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="464.788" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="464.788" dy="0">1</tspan></text><line x1="575.576" y1="49" x2="575.576" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="575.576" y1="181" x2="575.576" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="575.576" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="575.576" dy="0">2</tspan></text><line x1="686.364" y1="49" x2="686.364" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="686.364" y1="181" x2="686.364" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="686.364" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="686.364" dy="0">3</tspan></text><line x1="797.152" y1="49" x2="797.152" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="797.152" y1="181" x2="797.152" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="797.152" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797.152" dy="0">4</tspan></text><line x1="907.94" y1="49" x2="907.94" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="907.94" y1="181" x2="907.94" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="907.94" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907.94" dy="0">5</tspan></text><line x1="354" y1="181" x2="907.94" y2="181" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="67" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">merge (predeterminado): dos versiones y nada</tspan></text><text x="344" y="84" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">más</tspan></text><text x="344" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">diff3: añade el original común</tspan></text><text x="344" y="155" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">zdiff3: igual que diff3 con menos contexto</tspan></text><text x="344" y="172" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">repetido</tspan></text><rect x="354" y="55" width="332.364" height="32" rx="3" fill="#087f8c"/><text x="693.364" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="693.364" dy="0">3</tspan></text><rect x="354" y="99" width="443.152" height="32" rx="3" fill="#087f8c"/><text x="804.152" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="804.152" dy="0">4</tspan></text><rect x="354" y="143" width="443.152" height="32" rx="3" fill="#087f8c"/><text x="804.152" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="804.152" dy="0">4</tspan></text><text x="630.97" y="225" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="630.97" dy="0">Líneas de marca por conflicto</tspan></text><rect x="10" y="239" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="263.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Ver el original común (la cuarta línea) permite decidir qué lado cambió qué. Con el estilo por defecto solo se ve el</tspan></text><text x="470" y="280.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">resultado de cada lado y es fácil elegir uno sin entender el otro. merge --abort a mitad de un conflicto devuelve HEAD,</tspan></text><text x="470" y="297.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">índice y estado limpio idénticos.</tspan></text><text x="470" y="344.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Git real en repositorios temporales con identidad y fechas fijas; salidas idénticas con Git 2.55 (Windows) y 2.43 (Ubuntu, WSL2).</tspan></text></svg>
