<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 363" width="1000" height="363" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Marcas de conflicto según el estilo y vuelta atrás con --abort</title><desc id="d">Tabla de tres estilos de marcas de conflicto con sus líneas de marca y si muestran la base, más el resultado de abortar una fusión a medias.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="363" fill="#ffffff"/><rect x="10" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="157" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="157" dy="0">Estilo</tspan></text><rect x="310" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="382" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="382" dy="0">Líneas de marca</tspan></text><rect x="460" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="552" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="552" dy="0">¿Muestra la base?</tspan></text><rect x="650" y="12" width="334" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="817" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="817" dy="0">Lectura</tspan></text><rect x="10" y="56" width="294" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="82.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">merge (predeterminado)</tspan></text><rect x="310" y="56" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="382" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382" dy="0">3</tspan></text><rect x="460" y="56" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">No</tspan></text><rect x="650" y="56" width="334" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">Dos versiones y nada más</tspan></text><rect x="10" y="108" width="294" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="134.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">diff3</tspan></text><rect x="310" y="108" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="382" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382" dy="0">4</tspan></text><rect x="460" y="108" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">Sí</tspan></text><rect x="650" y="108" width="334" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">Añade el original común</tspan></text><rect x="10" y="160" width="294" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="186.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">zdiff3</tspan></text><rect x="310" y="160" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="382" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382" dy="0">4</tspan></text><rect x="460" y="160" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">Sí</tspan></text><rect x="650" y="160" width="334" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">Igual que diff3 con menos contexto repetido</tspan></text><rect x="10" y="212" width="294" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="238.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">merge --abort a mitad de un conflicto</tspan></text><rect x="310" y="212" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="382" y="238.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382" dy="0">—</tspan></text><rect x="460" y="212" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="238.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">—</tspan></text><rect x="650" y="212" width="334" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="230.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">HEAD, índice y estado limpio vuelven a ser</tspan></text><text x="817" y="246.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">idénticos</tspan></text><rect x="10" y="268" width="980" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="500" y="292.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="500" dy="0">Ver el original común permite decidir qué lado cambió qué. Con el estilo por defecto solo se ve el resultado de cada lado y es</tspan></text><text x="500" y="309.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="500" dy="0">fácil elegir uno sin entender el otro.</tspan></text><text x="500" y="349.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Git real en repositorios temporales con identidad y fechas fijas; salidas idénticas con Git 2.55 (Windows) y 2.43 (Ubuntu, WSL2).</tspan></text></svg>
