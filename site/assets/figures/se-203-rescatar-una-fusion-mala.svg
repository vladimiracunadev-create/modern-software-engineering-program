<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 347" width="1000" height="347" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Rescatar una fusión que se resolvió con «ours» y perdió el periodo de gracia</title><desc id="d">Tabla de tres rescates de una fusión mal resuelta: reiniciar y repetir si no se publicó, un commit de corrección si se publicó, y revertir la fusión, que deja las pruebas en rojo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="347" fill="#ffffff"/><rect x="10" y="12" width="414" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="217" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="217" dy="0">Camino</tspan></text><rect x="430" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="512" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="512" dy="0">Resultado</tspan></text><rect x="600" y="12" width="384" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="792" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="792" dy="0">Lectura</tspan></text><rect x="10" y="56" width="414" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="80.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">(a) Sin publicar: reset al primer padre y fusionar de</tspan></text><text x="217" y="96.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">nuevo</tspan></text><rect x="430" y="56" width="164" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">Pruebas verdes</tspan></text><rect x="600" y="56" width="384" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">Se reescribe un commit que nadie tiene</tspan></text><rect x="10" y="120" width="414" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="152.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">(b) Publicada: nuevo commit que restaura lo perdido</tspan></text><rect x="430" y="120" width="164" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">Pruebas verdes</tspan></text><rect x="600" y="120" width="384" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">El commit malo sigue en la historia</tspan></text><rect x="10" y="184" width="414" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="216.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">(c) revert -m 1 y volver a fusionar</tspan></text><rect x="430" y="184" width="164" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">Pruebas rojas</tspan></text><rect x="600" y="184" width="384" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="208.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">Git responde «Already up to date»: la rama figura</tspan></text><text x="792" y="224.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">integrada</tspan></text><rect x="10" y="252" width="980" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="500" y="276.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Tras la fusión mala la rama figuraba como ancestro, así que fusionarla otra vez no hace nada. El revert devuelve el árbol al primer</tspan></text><text x="500" y="293.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">padre pero no devuelve la intención perdida.</tspan></text><text x="500" y="333.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Git real en repositorios temporales con identidad y fechas fijas; salidas idénticas con Git 2.55 (Windows) y 2.43 (Ubuntu, WSL2).</tspan></text></svg>
