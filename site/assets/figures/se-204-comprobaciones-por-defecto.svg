<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 335" width="1000" height="335" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Comprobaciones disparadas por cada defecto plantado</title><desc id="d">Barras: la contribución correcta no dispara ninguna comprobación, once defectos disparan una cada uno, dos defectos disparan dos y la prueba que no comprueba nada no dispara ninguna.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="335" fill="#ffffff"/><text x="400" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Contribución correcta</tspan></text><rect x="410" y="16" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="422" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="422" dy="0">0</tspan></text><text x="400" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Diez defectos con una sola comprobación</tspan></text><rect x="410" y="60" width="190" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="608" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="608" dy="0">1 cada uno</tspan></text><text x="400" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Prueba que falla en la punta</tspan></text><rect x="410" y="104" width="380" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="798" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="798" dy="0">2</tspan></text><text x="400" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">PR de más de 400 líneas</tspan></text><rect x="410" y="148" width="380" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="798" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="798" dy="0">2</tspan></text><text x="400" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Prueba que no comprueba nada</tspan></text><rect x="410" y="192" width="4" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="422" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="422" dy="0">0 (escapa)</tspan></text><rect x="10" y="240" width="980" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="500" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">Un defecto con dos comprobaciones no es redundancia sino dos síntomas de una causa: un PR enorme viene casi siempre con un commit</tspan></text><text x="500" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">enorme. El defecto con cero no es un fallo de las comprobaciones sino de lo que miden.</tspan></text><text x="500" y="321.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Git real en repositorios temporales con identidad y fechas fijas; salidas idénticas con Git 2.55 (Windows) y 2.43 (Ubuntu, WSL2).</tspan></text></svg>
