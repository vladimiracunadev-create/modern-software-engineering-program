<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 295" width="1000" height="295" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dos defectos con las pruebas verdes: uno se ve y otro no</title><desc id="d">Tabla con dos defectos que dejan las pruebas en verde: el cambio de tope sin tocar pruebas, que la comprobación de pruebas modificadas detecta, y una afirmación vacía, que ninguna comprobación de forma detecta.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="295" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Defecto</tspan></text><rect x="340" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="487" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="487" dy="0">Qué dicen las pruebas</tspan></text><rect x="640" y="12" width="344" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="812" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="812" dy="0">¿Lo detecta alguna comprobación?</tspan></text><rect x="10" y="56" width="324" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="91.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Cambia el tope de 72 a 48 sin tocar pruebas</tspan></text><rect x="340" y="56" width="294" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="91.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">Pasan: ninguna prueba mira el tope</tspan></text><rect x="640" y="56" width="344" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="83.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">Sí: la comprobación 12 exige cambiar alguna</tspan></text><text x="812" y="99.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">prueba</tspan></text><rect x="10" y="126" width="324" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="153.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Cambia pruebas pero una afirmación pasa a ser</tspan></text><text x="172" y="169.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">vacía</tspan></text><rect x="340" y="126" width="294" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="161.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">Pasan: la prueba siempre es verdadera</tspan></text><rect x="640" y="126" width="344" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="161.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">No: cumple la regla de «cambiar una prueba»</tspan></text><rect x="10" y="200" width="980" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="500" y="224.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Para ver el segundo hace falta una prueba que falle contra una versión errónea de la regla (mutación) o la lectura de una persona.</tspan></text><text x="500" y="241.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Un paquete aprobado por comprobaciones automáticas no es un paquete correcto.</tspan></text><text x="500" y="281.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Git real en repositorios temporales con identidad y fechas fijas; salidas idénticas con Git 2.55 (Windows) y 2.43 (Ubuntu, WSL2).</tspan></text></svg>
