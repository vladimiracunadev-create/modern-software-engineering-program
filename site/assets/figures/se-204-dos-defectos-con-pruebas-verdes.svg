<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 318" width="940" height="318" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dos defectos con las pruebas verdes: uno se ve y otro no</title><desc id="d">Diagrama de flujo de dos defectos que dejan las pruebas en verde: el cambio de tope sin tocar pruebas, que la comprobación de pruebas modificadas detecta, y una afirmación vacía, que ninguna comprobación de forma detecta.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="318" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dos defectos con las pruebas verdes: uno se ve y otro no</tspan></text><text x="164" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="164" dy="0">Defecto</tspan></text><text x="473" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="473" dy="0">Qué dicen las pruebas</tspan></text><text x="767" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="767" dy="0">¿Lo detecta alguna comprobación?</tspan></text><rect x="14" y="71" width="300" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="164" y="93.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="164" dy="0">Cambia el tope de 72 a 48 sin tocar</tspan></text><text x="164" y="110.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="164" dy="0">pruebas</tspan></text><polyline points="318,98.64 344,98.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="348" y="71" width="250" height="55.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="473" y="93.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="473" dy="0">Pasan: ninguna prueba mira el</tspan></text><text x="473" y="110.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="473" dy="0">tope</tspan></text><polyline points="602,98.64 628,98.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="632" y="71" width="270" height="55.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="767" y="93.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="767" dy="0">Sí: la comprobación 12 exige</tspan></text><text x="767" y="110.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="767" dy="0">cambiar alguna prueba</tspan></text><rect x="14" y="138.28" width="300" height="55.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="164" y="161.24" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="164" dy="0">Cambia pruebas pero una afirmación</tspan></text><text x="164" y="177.88" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="164" dy="0">pasa a ser vacía</tspan></text><polyline points="318,165.92 344,165.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="348" y="138.28" width="250" height="55.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="473" y="161.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="473" dy="0">Pasan: la prueba siempre es</tspan></text><text x="473" y="177.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="473" dy="0">verdadera</tspan></text><polyline points="602,165.92 628,165.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="632" y="138.28" width="270" height="55.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="767" y="161.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="767" dy="0">No: cumple la regla de «cambiar</tspan></text><text x="767" y="177.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="767" dy="0">una prueba»</tspan></text><rect x="10" y="211.56" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="236.52" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Para ver el segundo hace falta una prueba que falle contra una versión errónea de la regla (mutación) o la lectura de una</tspan></text><text x="470" y="253.16" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">persona. Un paquete aprobado por comprobaciones automáticas no es un paquete correcto.</tspan></text><text x="470" y="300.84" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Git real en repositorios temporales con identidad y fechas fijas; salidas idénticas con Git 2.55 (Windows) y 2.43 (Ubuntu, WSL2).</tspan></text></svg>
