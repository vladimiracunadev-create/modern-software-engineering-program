<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 263" width="1060" height="263" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Palabras que lee quien busca los pasos antes de llegar a ellos (200 páginas de 1 200 palabras)</title><desc id="d">Barras de 200 páginas simuladas de ocho secciones: cuando explicación, referencia, advertencias y pasos van mezclados en orden aleatorio, quien busca los pasos lee una mediana de 540 palabras y hasta 1 020 en el percentil 90 antes de llegar; en una página how-to separada, cero.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1060" height="263" fill="#ffffff"/><text x="350" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="350" dy="0">Página que mezcla: mediana</tspan></text><rect x="360" y="16" width="270" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="638" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="638" dy="0">540 palabras antes de la primera instrucción</tspan></text><text x="350" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="350" dy="0">Página que mezcla: percentil 90</tspan></text><rect x="360" y="60" width="510" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="878" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="878" dy="0">1 020 de 1 200</tspan></text><text x="350" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="350" dy="0">Tipos separados: how-to propio</tspan></text><rect x="360" y="104" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="372" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="372" dy="0">0 palabras de rodeo</tspan></text><rect x="10" y="152" width="1040" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="530" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="530" dy="0">No es que la explicación sobre: es que no está donde se necesita ejecutar. Separar tipos no elimina el contenido, lo enlaza. El orden</tspan></text><text x="530" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="530" dy="0">aleatorio es un supuesto; una página bien ordenada de un solo autor puede poner los pasos primero, y entonces el problema pasa a la</tspan></text><text x="530" y="210.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="530" dy="0">explicación.</tspan></text><text x="530" y="249.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="530" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
