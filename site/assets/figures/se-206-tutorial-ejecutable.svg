font-weight="700" fill="#ffffff"><tspan x="872.833" dy="0">falla</tspan></text><rect x="355.5" y="161.5" width="91.3333" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="401.167" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="401.167" dy="0">pasa</tspan></text><rect x="449.833" y="161.5" width="91.3333" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="495.5" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="495.5" dy="0">pasa</tspan></text><rect x="544.167" y="161.5" width="91.3333" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="589.833" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="589.833" dy="0">pasa</tspan></text><rect x="638.5" y="161.5" width="91.3333" height="41" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="684.167" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="684.167" dy="0">falla</tspan></text><rect x="732.833" y="161.5" width="91.3333" height="41" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="778.5" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="778.5" dy="0">falla</tspan></text><rect x="827.167" y="161.5" width="91.3333" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="872.833" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="872.833" dy="0">pasa</tspan></text><rect x="355.5" y="205.5" width="91.3333" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="401.167" y="230.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="401.167" dy="0">pasa</tspan></text><rect x="449.833" y="205.5" width="91.3333" height="41" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="495.5" y="230.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="495.5" dy="0">falla</tspan></text><rect x="544.167" y="205.5" width="91.3333" height="41" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="589.833" y="230.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="589.833" dy="0">falla</tspan></text><rect x="638.5" y="205.5" width="91.3333" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="684.167" y="230.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="684.167" dy="0">pasa</tspan></text><rect x="732.833" y="205.5" width="91.3333" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="778.5" y="230.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="778.5" dy="0">pasa</tspan></text><rect x="827.167" y="205.5" width="91.3333" height="41" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="872.833" y="230.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="872.833" dy="0">falla</tspan></text><text x="354" y="274" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="354" dy="0">pasa</tspan></text><rect x="392.16" y="262" width="30.5" height="14" fill="#fbe4de"/><rect x="422.16" y="262" width="30.5" height="14" fill="#f3cdc5"/><rect x="452.16" y="262" width="30.5" height="14" fill="#eab6ac"/><rect x="482.16" y="262" width="30.5" height="14" fill="#e29f93"/><rect x="512.16" y="262" width="30.5" height="14" fill="#d9887a"/><rect x="542.16" y="262" width="30.5" height="14" fill="#d17161"/><rect x="572.16" y="262" width="30.5" height="14" fill="#c85a48"/><rect x="602.16" y="262" width="30.5" height="14" fill="#c0432f"/><text x="640.16" y="274" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="640.16" dy="0">falla</tspan></text><text x="685.86" y="274" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="685.86" dy="0">más oscuro = mayor (falla)</tspan></text><rect x="10" y="290" width="920" height="92.56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="314.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Solo el primer fallo informa; los demás son consecuencia (con el renombrado, el paso 1 falla y los 2 y 3 fallan por</tspan></text><text x="470" y="331.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">arrastre; con el redondeo fallan las dos comprobaciones de nota; con el cuarto argumento, las dos llamadas y el recuento).</tspan></text><text x="470" y="348.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Un tutorial ejecutable convierte la deriva en un fallo de integración continua, pero solo detecta lo que sus pasos ejercen:</tspan></text><text x="470" y="364.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">un cambio que ningún paso comprueba pasa sin ruido.</tspan></text><text x="470" y="412.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
