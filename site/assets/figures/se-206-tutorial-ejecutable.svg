<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" width="940" height="430" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Seis pasos de un tutorial ejecutados contra cuatro versiones de la biblioteca</title><desc id="d">Mapa de calor de un tutorial de seis pasos ejecutado contra cuatro versiones: sin cambios pasan los seis, renombrar una función hace fallar los pasos 1, 2, 3 y 6, redondear días hacia abajo los pasos 4 y 5 y añadir un argumento obligatorio los pasos 2, 3 y 6.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="430" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Seis pasos de un tutorial ejecutados contra cuatro versiones de la biblioteca</tspan></text><text x="401.167" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="401.167" dy="0">Paso 1</tspan></text><text x="495.5" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="495.5" dy="0">Paso 2</tspan></text><text x="589.833" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="589.833" dy="0">Paso 3</tspan></text><text x="684.167" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="684.167" dy="0">Paso 4</tspan></text><text x="778.5" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="778.5" dy="0">Paso 5</tspan></text><text x="872.833" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="872.833" dy="0">Paso 6</tspan></text><text x="344" y="98.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">Sin cambios</tspan></text><text x="344" y="134" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">Se renombra crear a crear_tarea ·</tspan></text><text x="344" y="151" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">AttributeError</tspan></text><text x="344" y="178" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">El cálculo de días redondea hacia abajo ·</tspan></text><text x="344" y="195" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">AssertionError</tspan></text><text x="344" y="222" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">entregar exige un cuarto argumento ·</tspan></text><text x="344" y="239" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">TypeError</tspan></text><rect x="355.5" y="73.5" width="91.3333" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="401.167" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="401.167" dy="0">pasa</tspan></text><rect x="449.833" y="73.5" width="91.3333" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="495.5" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="495.5" dy="0">pasa</tspan></text><rect x="544.167" y="73.5" width="91.3333" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="589.833" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="589.833" dy="0">pasa</tspan></text><rect x="638.5" y="73.5" width="91.3333" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="684.167" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill=