<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 335" width="1000" height="335" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Integridad del registro de decisiones: cinco mutaciones del grafo de sustituciones</title><desc id="d">Barras de 200 registros de 40 ADR con una mutación cada uno: la comprobación estructural detecta 45 de 45 enlaces rotos, 41 de 41 doble sustitución, 39 de 39 ciclos y 39 de 39 estados incoherentes, pero 0 de 36 casos en los que un ADR sustituye a otro estructuralmente válido pero equivocado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="335" fill="#ffffff"/><text x="370" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="370" dy="0">Enlace a un ADR inexistente</tspan></text><rect x="380" y="16" width="40.5" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="428.5" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="428.5" dy="0">45 de 45</tspan></text><text x="370" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="370" dy="0">Dos ADR sustituyen al mismo</tspan></text><rect x="380" y="60" width="36.9" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="424.9" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="424.9" dy="0">41 de 41</tspan></text><text x="370" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="370" dy="0">Un ADR se sustituye a sí mismo (ciclo)</tspan></text><rect x="380" y="104" width="35.1" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="423.1" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="423.1" dy="0">39 de 39</tspan></text><text x="370" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="370" dy="0">El sustituido sigue «vigente»</tspan></text><rect x="380" y="148" width="35.1" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="423.1" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="423.1" dy="0">39 de 39</tspan></text><text x="370" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="370" dy="0">Sustituye al ADR equivocado</tspan></text><rect x="380" y="192" width="4" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="392" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="392" dy="0">0 de 36</tspan></text><rect x="10" y="240" width="980" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="500" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">Los 200 grafos limpios dieron 0 falsas alarmas. Lo que el grafo no puede saber es si «ADR-31 sustituye a ADR-12» dice la verdad:</tspan></text><text x="500" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">una sustitución mal dirigida es un grafo perfecto con la historia equivocada.</tspan></text><text x="500" y="321.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
