<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 459" width="930" height="459" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un linter de ADR sobre 300 registros con defectos conocidos</title><desc id="d">Tabla de un linter de ADR aplicado a 300 registros sintéticos: detecta las 54 secciones ausentes y las 45 fechas ilegibles, pero ninguna de las 54 alternativas vacías, 60 consecuencias vacías ni 46 contextos sin razón, y no da falsas alarmas sobre los 41 registros correctos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="459" fill="#ffffff"/><rect x="10" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Defecto introducido</tspan></text><rect x="390" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="452" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="452" dy="0">Registros</tspan></text><rect x="520" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="592" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="592" dy="0">Detectados</tspan></text><rect x="670" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="792" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="792" dy="0">¿Lo ve el linter?</tspan></text><rect x="10" y="56" width="374" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="80.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Falta una sección</tspan></text><rect x="390" y="56" width="124" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="80.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">54</tspan></text><rect x="520" y="56" width="144" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="80.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">54</tspan></text><rect x="670" y="56" width="244" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="80.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">Sí</tspan></text><rect x="10" y="104" width="374" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="128.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Fecha ilegible («ayer»)</tspan></text><rect x="390" y="104" width="124" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="128.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">45</tspan></text><rect x="520" y="104" width="144" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="128.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">45</tspan></text><rect x="670" y="104" width="244" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="128.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">Sí</tspan></text><rect x="10" y="152" width="374" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="176.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Alternativas: «Ninguna.»</tspan></text><rect x="390" y="152" width="124" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="176.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">54</tspan></text><rect x="520" y="152" width="144" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="176.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">0</tspan></text><rect x="670" y="152" width="244" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="176.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">No</tspan></text><rect x="10" y="200" width="374" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="224.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Consecuencias: «Ninguna.»</tspan></text><rect x="390" y="200" width="124" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="224.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">60</tspan></text><rect x="520" y="200" width="144" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="224.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">0</tspan></text><rect x="670" y="200" width="244" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="224.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">No</tspan></text><rect x="10" y="248" width="374" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="272.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Contexto: «Nada especial.»</tspan></text><rect x="390" y="248" width="124" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="272.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">46</tspan></text><rect x="520" y="248" width="144" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="272.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">0</tspan></text><rect x="670" y="248" width="244" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="272.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">No</tspan></text><rect x="10" y="296" width="374" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="320.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">ADR correcto</tspan></text><rect x="390" y="296" width="124" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="320.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">41</tspan></text><rect x="520" y="296" width="144" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="320.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">0</tspan></text><rect x="670" y="296" width="244" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="320.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">Sin falsas alarmas</tspan></text><rect x="10" y="348" width="910" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="465" y="372.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">El linter comprueba forma: presencia, formato, vocabulario. Un ADR con «Alternativas: Ninguna.» tiene todas las secciones</tspan></text><text x="465" y="389.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">y no contiene ninguna decisión defendible. La calidad del razonamiento la revisan personas, con una pregunta concreta:</tspan></text><text x="465" y="406.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">¿qué se descartó y por qué?</tspan></text><text x="465" y="445.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
