r="middle" font-weight="700" fill="#142231"><tspan x="380.851" dy="0">12</tspan></text><rect x="397.499" y="333" width="25.2973" height="42" rx="3" fill="#087f8c"/><text x="410.148" y="327" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="410.148" dy="0">12</tspan></text><rect x="426.797" y="373" width="25.2973" height="2" rx="3" fill="#946512"/><text x="439.445" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="439.445" dy="0">0</tspan></text><rect x="456.094" y="373" width="25.2973" height="2" rx="3" fill="#c0432f"/><text x="468.743" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="468.743" dy="0">0</tspan></text><text x="424.797" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="424.797" dy="0">argparse</tspan></text><rect x="509.689" y="301.5" width="25.2973" height="73.5" rx="3" fill="#6b7c86"/><text x="522.337" y="295.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="522.337" dy="0">21</tspan></text><rect x="538.986" y="301.5" width="25.2973" height="73.5" rx="3" fill="#087f8c"/><text x="551.635" y="295.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="551.635" dy="0">21</tspan></text><rect x="568.283" y="263" width="25.2973" height="112" rx="3" fill="#946512"/><text x="580.932" y="257" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="580.932" dy="0">32</tspan></text><rect x="597.581" y="280.5" width="25.2973" height="94.5" rx="3" fill="#c0432f"/><text x="610.229" y="274.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="610.229" dy="0">27</tspan></text><text x="566.283" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="566.283" dy="0">statistics</tspan></text><rect x="651.175" y="277" width="25.2973" height="98" rx="3" fill="#6b7c86"/><text x="663.824" y="271" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="663.824" dy="0">28</tspan></text><rect x="680.473" y="280.5" width="25.2973" height="94.5" rx="3" fill="#087f8c"/><text x="693.121" y="274.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="693.121" dy="0">27</tspan></text><rect x="709.77" y="144" width="25.2973" height="231" rx="3" fill="#946512"/><text x="722.419" y="138" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="722.419" dy="0">66</tspan></text><rect x="739.067" y="168.5" width="25.2973" height="206.5" rx="3" fill="#c0432f"/><text x="751.716" y="162.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="751.716" dy="0">59</tspan></text><text x="707.77" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707.77" dy="0">shutil</tspan></text><rect x="792.662" y="315.5" width="25.2973" height="59.5" rx="3" fill="#6b7c86"/><text x="805.311" y="309.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="805.311" dy="0">17</tspan></text><rect x="821.959" y="319" width="25.2973" height="56" rx="3" fill="#087f8c"/><text x="834.608" y="313" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="834.608" dy="0">16</tspan></text><rect x="851.257" y="256" width="25.2973" height="119" rx="3" fill="#946512"/><text x="863.905" y="250" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="863.905" dy="0">34</tspan></text><rect x="880.554" y="305" width="25.2973" height="70" rx="3" fill="#c0432f"/><text x="893.203" y="299" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="893.203" dy="0">20</tspan></text><text x="849.257" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="849.257" dy="0">re</tspan></text><rect x="10" y="427" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">En los diez módulos medidos: 123 públicos, 118 con docstring, 181 parámetros y 144 nombrados (80 %). Tener docstring no es</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">documentar los parámetros: en csv y argparse las clases tienen texto pero el recuento de parámetros de funciones es cero</tspan></text><text x="470" y="485.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">porque son clases; en re uno de cada tres parámetros no se nombra. Medimos presencia, no calidad.</tspan></text><text x="470" y="532.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido con inspect en CPython 3.12.9 (Windows) y 3.12.3 (Ubuntu); idéntico.</tspan></text></svg>
