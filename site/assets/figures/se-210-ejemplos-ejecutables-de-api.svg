<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 411" width="970" height="411" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diez ejemplos ejecutables de una API frente a cinco cambios del proveedor</title><desc id="d">Tabla de diez ejemplos de uso ejecutados contra una API en proceso: sin cambios fallan 0, con el campo renombrado fallan 4, con el estado 201 cambiado a 200 fallan 2, con el id pasado a texto fallan 2 y con la ruta movida fallan 2; una comparación de nombres de campos solo detecta el renombrado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="411" fill="#ffffff"/><rect x="10" y="12" width="394" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="207" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="207" dy="0">Cambio en la API</tspan></text><rect x="410" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="522" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="522" dy="0">Ejemplos que fallan</tspan></text><rect x="640" y="12" width="314" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="797" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="797" dy="0">¿Lo ve una comparación de nombres de</tspan></text><text x="797" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="797" dy="0">campo?</tspan></text><rect x="10" y="56" width="394" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="80.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Sin cambios</tspan></text><rect x="410" y="56" width="224" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="522" y="80.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="522" dy="0">0 de 10</tspan></text><rect x="640" y="56" width="314" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="80.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">No</tspan></text><rect x="10" y="104" width="394" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="128.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Campo renombrado (horas_retraso)</tspan></text><rect x="410" y="104" width="224" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="522" y="128.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="522" dy="0">4 de 10</tspan></text><rect x="640" y="104" width="314" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="128.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">Sí</tspan></text><rect x="10" y="152" width="394" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="176.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Estado 201 pasa a 200</tspan></text><rect x="410" y="152" width="224" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="522" y="176.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="522" dy="0">2 de 10</tspan></text><rect x="640" y="152" width="314" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="176.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">No</tspan></text><rect x="10" y="200" width="394" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="224.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">El id pasa a texto</tspan></text><rect x="410" y="200" width="224" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="522" y="224.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="522" dy="0">2 de 10</tspan></text><rect x="640" y="200" width="314" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="224.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">No</tspan></text><rect x="10" y="248" width="394" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="272.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Ruta /penalizacion movida</tspan></text><rect x="410" y="248" width="224" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="522" y="272.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="522" dy="0">2 de 10</tspan></text><rect x="640" y="248" width="314" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="272.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">No</tspan></text><rect x="10" y="300" width="950" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="485" y="324.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="485" dy="0">Ejecutar los ejemplos de la documentación detecta cambios de estado, de tipo y de ruta que una lista de campos no ve. Cada</tspan></text><text x="485" y="341.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="485" dy="0">cambio deja un patrón distinto de ejemplos rotos, lo que ayuda a localizarlo. Un ejemplo que no se ejecuta es una promesa sin</tspan></text><text x="485" y="358.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="485" dy="0">comprobar.</tspan></text><text x="485" y="397.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
