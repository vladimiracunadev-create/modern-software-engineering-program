<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 379" width="970" height="379" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Huellas distintas al construir la misma página con 8 semillas de hash</title><desc id="d">Tabla de una página generada con 8 valores de PYTHONHASHSEED: con etiquetas en orden de conjunto salen 8 huellas distintas, añadiendo la fecha de ejecución también 8, con orden explícito y fecha fija una sola; cambiar LF por CRLF cambia la huella aunque la estructura sea idéntica.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="379" fill="#ffffff"/><rect x="10" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Variante del generador</tspan></text><rect x="390" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="482" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="482" dy="0">Huellas distintas en 8</tspan></text><text x="482" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="482" dy="0">ejecuciones</tspan></text><rect x="580" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="767" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="767" dy="0">Lectura</tspan></text><rect x="10" y="56" width="374" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="84.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Etiquetas en el orden de un conjunto</tspan></text><rect x="390" y="56" width="184" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="84.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">8</tspan></text><rect x="580" y="56" width="374" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="84.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">Cada ejecución produce una página distinta</tspan></text><rect x="10" y="112" width="374" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="140.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Orden de conjunto y fecha de la ejecución</tspan></text><rect x="390" y="112" width="184" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="140.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">8</tspan></text><rect x="580" y="112" width="374" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="140.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">Además cambia con el reloj</tspan></text><rect x="10" y="168" width="374" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="196.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Etiquetas ordenadas y fecha fija</tspan></text><rect x="390" y="168" width="184" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="196.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">1</tspan></text><rect x="580" y="168" width="374" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="196.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">Misma huella en las 8 semillas</tspan></text><rect x="10" y="224" width="374" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="252.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Ordenadas, salto de línea CRLF en lugar de LF</tspan></text><rect x="390" y="224" width="184" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="252.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">1</tspan></text><rect x="580" y="224" width="374" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="252.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">Misma estructura, otra huella que la de LF</tspan></text><rect x="10" y="284" width="950" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="485" y="308.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="485" dy="0">Una construcción reproducible es la condición para que «reconstruir y comparar» sirva como prueba. Los saltos de línea cuentan:</tspan></text><text x="485" y="325.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="485" dy="0">un mismo generador en Windows y Ubuntu produce huellas distintas si no fija la salida a LF.</tspan></text><text x="485" y="365.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
