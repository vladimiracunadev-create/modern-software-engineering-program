<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 263" width="1020" height="263" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Avisos de un linter de Markdown sobre 40 archivos, 5 con un salto de encabezado real</title><desc id="d">Barras: un linter que lee también el interior de los bloques de código da 102 avisos sobre 40 archivos; el que respeta las vallas de código da 5, exactamente los 5 saltos de encabezado reales sembrados.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1020" height="263" fill="#ffffff"/><text x="430" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="430" dy="0">Linter que lee el interior de los bloques de código</tspan></text><rect x="440" y="16" width="428.4" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="876.4" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="876.4" dy="0">102 avisos</tspan></text><text x="430" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="430" dy="0">Linter que respeta las vallas de código</tspan></text><rect x="440" y="60" width="21" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="469" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="469" dy="0">5 avisos</tspan></text><text x="430" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="430" dy="0">Defectos reales sembrados</tspan></text><rect x="440" y="104" width="21" height="28" rx="3" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="469" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="469" dy="0">5</tspan></text><rect x="10" y="152" width="1000" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="510" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="510" dy="0">Los comentarios de shell empiezan por almohadilla y parecen encabezados; las líneas largas de un comando parecen texto. 97 de 102</tspan></text><text x="510" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="510" dy="0">avisos eran falsos. Un linter que se ignora por ruidoso protege menos que ninguno, de modo que la regla que respeta el contexto es</tspan></text><text x="510" y="210.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="510" dy="0">parte de la regla.</tspan></text><text x="510" y="249.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="510" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
