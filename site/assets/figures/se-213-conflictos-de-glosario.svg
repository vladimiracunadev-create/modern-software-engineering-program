<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 550" width="940" height="550" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Detectar definiciones contradictorias por similitud de palabras (240 pares de cada clase)</title><desc id="d">Barras agrupadas con los pares marcados de 240 definiciones contradictorias y 240 parafraseadas según el umbral de similitud de Jaccard (medias 0,87 y 0,65): con 0,5 no se marca ninguna clase, con 0,7 se marcan las 240 paráfrasis y ninguna contradicción, con 0,9 las dos clases; la similitud ordena al revés de lo deseado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="550" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Detectar definiciones contradictorias por similitud de palabras (240 pares de cada clase)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Contradicciones marcadas</tspan></text><rect x="244.96" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="264.96" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="264.96" dy="0">Paráfrasis marcadas (falsas alarmas)</tspan></text><line x1="78.62" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="375" x2="78.62" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="305" x2="920" y2="305" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="305" x2="78.62" y2="305" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="309.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">60</tspan></text><line x1="78.62" y1="235" x2="920" y2="235" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="235" x2="78.62" y2="235" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="239.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">120</tspan></text><line x1="78.62" y1="165" x2="920" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="165" x2="78.62" y2="165" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="169.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">180</tspan></text><line x1="78.62" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="95" x2="78.62" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">240</tspan></text><line x1="78.62" y1="95" x2="78.62" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">pares marcados de 240 (se marca si la similitud es menor que el umbral)</text><rect x="106.666" y="373" width="110.184" height="2" rx="3" fill="#c0432f"/><text x="161.758" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="161.758" dy="0">0</tspan></text><rect x="220.85" y="373" width="110.184" height="2" rx="3" fill="#946512"/><text x="275.942" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="275.942" dy="0">0</tspan></text><text x="218.85" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="218.85" dy="0">Umbral 0,5</tspan></text><rect x="387.126" y="373" width="110.184" height="2" rx="3" fill="#c0432f"/><text x="442.218" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="442.218" dy="0">0</tspan></text><rect x="501.31" y="95" width="110.184" height="280" rx="3" fill="#946512"/><text x="556.402" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="556.402" dy="0">240</tspan></text><text x="499.31" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="499.31" dy="0">Umbral 0,7</tspan></text><rect x="667.586" y="95" width="110.184" height="280" rx="3" fill="#c0432f"/><text x="722.678" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="722.678" dy="0">240</tspan></text><rect x="781.77" y="95" width="110.184" height="280" rx="3" fill="#946512"/><text x="836.862" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="836.862" dy="0">240</tspan></text><text x="779.77" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="779.77" dy="0">Umbral 0,9</tspan></text><rect x="10" y="427" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Las definiciones que se contradicen por una sola palabra clave se parecen más entre sí que las paráfrasis honestas, así que</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">la similitud léxica ordena al revés de lo deseado. Detectar conflictos de glosario exige comparar el valor de los términos</tspan></text><text x="470" y="485.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">definidos (números, condiciones) o la revisión de una persona.</tspan></text><text x="470" y="532.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
