<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 567" width="940" height="567" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Alcanzabilidad de 120 páginas desde la portada, antes y después de enlazar las huérfanas</title><desc id="d">Barras agrupadas de un sitio sintético de 120 páginas con 8 índices: antes de reparar hay 5 páginas sin enlaces entrantes e inalcanzables desde la portada, tras enlazarlas desde un índice quedan 0; ninguna está a más de 3 clics y la profundidad máxima es 3 en los dos casos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="567" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Alcanzabilidad de 120 páginas desde la portada, antes y después de enlazar las huérfanas</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Antes</tspan></text><rect x="101.7" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="121.7" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="121.7" dy="0">Después de enlazar desde índices</tspan></text><line x1="63.54" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="375" x2="63.54" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">0</tspan></text><line x1="63.54" y1="319" x2="920" y2="319" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="319" x2="63.54" y2="319" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="323.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">1</tspan></text><line x1="63.54" y1="263" x2="920" y2="263" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="263" x2="63.54" y2="263" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="267.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">2</tspan></text><line x1="63.54" y1="207" x2="920" y2="207" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="207" x2="63.54" y2="207" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="211.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">3</tspan></text><line x1="63.54" y1="151" x2="920" y2="151" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="151" x2="63.54" y2="151" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="155.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">4</tspan></text><line x1="63.54" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="95" x2="63.54" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">5</tspan></text><line x1="63.54" y1="95" x2="63.54" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">páginas o clics</text><rect x="84.9515" y="95" width="83.646" height="280" rx="3" fill="#c0432f"/><text x="126.774" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="126.774" dy="0">5</tspan></text><rect x="172.597" y="373" width="83.646" height="2" rx="3" fill="#087f8c"/><text x="214.421" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="214.421" dy="0">0</tspan></text><text x="170.597" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="170.597" dy="0">Páginas sin enlaces</tspan></text><text x="170.597" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="170.597" dy="0">entrantes</tspan></text><rect x="299.067" y="95" width="83.646" height="280" rx="3" fill="#c0432f"/><text x="340.889" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="340.889" dy="0">5</tspan></text><rect x="386.713" y="373" width="83.646" height="2" rx="3" fill="#087f8c"/><text x="428.536" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="428.536" dy="0">0</tspan></text><text x="384.713" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="384.713" dy="0">Páginas inalcanzables desde</tspan></text><text x="384.713" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="384.713" dy="0">la portada</tspan></text><rect x="513.182" y="373" width="83.646" height="2" rx="3" fill="#c0432f"/><text x="555.005" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="555.005" dy="0">0</tspan></text><rect x="600.828" y="373" width="83.646" height="2" rx="3" fill="#087f8c"/><text x="642.651" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="642.651" dy="0">0</tspan></text><text x="598.828" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="598.828" dy="0">Páginas a más de 3 clics</tspan></text><rect x="727.296" y="207" width="83.646" height="168" rx="3" fill="#c0432f"/><text x="769.119" y="201" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="769.119" dy="0">3</tspan></text><rect x="814.942" y="207" width="83.646" height="168" rx="3" fill="#087f8c"/><text x="856.765" y="201" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="856.765" dy="0">3</tspan></text><text x="812.942" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812.942" dy="0">Profundidad máxima</tspan></text><rect x="10" y="444" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="468.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El 4 % de páginas huérfanas es invisible para la navegación y solo aparece por búsqueda, si está indexada. La profundidad</tspan></text><text x="470" y="485.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">no fue el problema en este sitio porque los índices cuelgan de la portada; en uno real, la profundidad y la huérfana se</tspan></text><text x="470" y="502.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">miden con el mismo recorrido en anchura.</tspan></text><text x="470" y="549.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
