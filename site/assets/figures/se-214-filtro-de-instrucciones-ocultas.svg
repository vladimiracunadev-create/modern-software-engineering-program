<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 263" width="1060" height="263" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un filtro de expresiones regulares contra instrucciones ocultas en documentos que leerá un agente</title><desc id="d">Barras: un filtro léxico marca 6 de 6 instrucciones maliciosas literales y 0 de 8 ofuscadas, parafraseadas o en otro idioma, y no marca en falso ninguno de 8 textos benignos que contienen palabras como ignorar o instrucciones.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1060" height="263" fill="#ffffff"/><text x="360" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Instrucciones maliciosas literales</tspan></text><rect x="370" y="16" width="420" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="798" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="798" dy="0">6 de 6</tspan></text><text x="360" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Ofuscadas, parafraseadas u otro idioma</tspan></text><rect x="370" y="60" width="4" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="382" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="382" dy="0">0 de 8</tspan></text><text x="360" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Texto benigno marcado en falso</tspan></text><rect x="370" y="104" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="382" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="382" dy="0">0 de 8</tspan></text><rect x="10" y="152" width="1040" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="530" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="530" dy="0">El filtro se escribió viendo los casos literales, de ahí el 6 de 6; lo que no ve es lo que escribe un adversario que lo conoce (base64,</tspan></text><text x="530" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="530" dy="0">letras separadas, una nota dirigida al agente en un comentario HTML). Un filtro léxico es una molestia para el atacante, no un límite de</tspan></text><text x="530" y="210.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="530" dy="0">seguridad: el límite son los permisos del agente.</tspan></text><text x="530" y="249.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="530" dy="0">Veintidós textos escritos por el autor; sin ningún modelo ni agente; idéntico en Windows y Ubuntu.</tspan></text></svg>
