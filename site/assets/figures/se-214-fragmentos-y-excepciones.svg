<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 263" width="1000" height="263" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Hecho y excepción que lo limita, ¿quedan en el mismo fragmento? (30 documentos, 40 secciones)</title><desc id="d">Barras: con trozos fijos de 500 caracteres solo el 33,4 por ciento de los pares hecho más excepción quedan en el mismo fragmento, con solape de 150 el 46,5 y dividiendo por encabezado el 100, con un tamaño medio de 1 045 caracteres.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="263" fill="#ffffff"/><text x="300" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Trozos fijos de 500 caracteres</tspan></text><rect x="310" y="16" width="113.56" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="431.56" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="431.56" dy="0">33,4 % · trozo medio 498</tspan></text><text x="300" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Trozos de 500 con solape de 150</tspan></text><rect x="310" y="60" width="158.1" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="476.1" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="476.1" dy="0">46,5 % · 497</tspan></text><text x="300" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Un trozo por encabezado</tspan></text><rect x="310" y="104" width="340" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="658" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="658" dy="0">100 % · 1 045</tspan></text><rect x="10" y="152" width="980" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="500" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">Cortar por tamaño separa la regla de su excepción dos de cada tres veces; quien recupera solo el primer fragmento recibe una regla</tspan></text><text x="500" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">falsa. Dividir por encabezado lo evita a cambio de trozos más grandes. Documentos sintéticos con una excepción por sección; los</tspan></text><text x="500" y="210.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">reales son más variados.</tspan></text><text x="500" y="249.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
