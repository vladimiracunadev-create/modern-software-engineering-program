<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 395" width="970" height="395" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Validar los metadatos de 140 documentos: esquema solo o esquema más antigüedad</title><desc id="d">Tabla de 140 documentos con metadatos: el esquema solo detecta los 23 sin responsable, los 20 con estado inválido y los 15 con fecha incorrecta, pero ninguno de los 27 revisados hace más de 180 días; añadir la regla de antigüedad detecta los 27 y no marca ninguno de los 55 correctos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="395" fill="#ffffff"/><rect x="10" y="12" width="394" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="207" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="207" dy="0">Defecto</tspan></text><rect x="410" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="492" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="492" dy="0">Documentos</tspan></text><rect x="580" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="672" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="672" dy="0">Detecta el esquema</tspan></text><rect x="770" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="862" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="862" dy="0">Esquema + antigüedad</tspan></text><rect x="10" y="56" width="394" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="80.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Sin responsable</tspan></text><rect x="410" y="56" width="164" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="492" y="80.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">23</tspan></text><rect x="580" y="56" width="184" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="80.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">23</tspan></text><rect x="770" y="56" width="184" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="80.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">23</tspan></text><rect x="10" y="104" width="394" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="128.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Estado inválido («casi listo»)</tspan></text><rect x="410" y="104" width="164" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="492" y="128.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">20</tspan></text><rect x="580" y="104" width="184" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="128.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">20</tspan></text><rect x="770" y="104" width="184" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="128.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">20</tspan></text><rect x="10" y="152" width="394" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="176.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Fecha con formato incorrecto</tspan></text><rect x="410" y="152" width="164" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="492" y="176.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">15</tspan></text><rect x="580" y="152" width="184" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="176.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">15</tspan></text><rect x="770" y="152" width="184" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="176.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">15</tspan></text><rect x="10" y="200" width="394" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="224.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Revisado hace más de 180 días</tspan></text><rect x="410" y="200" width="164" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="492" y="224.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">27</tspan></text><rect x="580" y="200" width="184" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="224.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">0</tspan></text><rect x="770" y="200" width="184" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="224.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">27</tspan></text><rect x="10" y="248" width="394" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="272.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Metadatos correctos y recientes</tspan></text><rect x="410" y="248" width="164" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="492" y="272.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">55</tspan></text><rect x="580" y="248" width="184" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="272.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">0</tspan></text><rect x="770" y="248" width="184" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="272.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">0</tspan></text><rect x="10" y="300" width="950" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="485" y="324.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">Un documento puede ser válido y estar obsoleto: el esquema comprueba que la fecha exista, no que sea reciente. La antigüedad</tspan></text><text x="485" y="341.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">máxima de 180 días y la fecha de referencia son parámetros del experimento.</tspan></text><text x="485" y="381.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
