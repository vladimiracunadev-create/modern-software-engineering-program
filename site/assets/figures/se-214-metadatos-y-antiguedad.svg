<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 567" width="940" height="567" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Validar los metadatos de 140 documentos: esquema solo o esquema más antigüedad</title><desc id="d">Barras agrupadas con los documentos de cada defecto y los detectados: el esquema solo detecta los 23 sin responsable, los 20 con estado inválido y los 15 con fecha incorrecta, pero ninguno de los 27 revisados hace más de 180 días; añadir la regla de antigüedad detecta los 27 y no marca ninguno de los 55 correctos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="567" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Validar los metadatos de 140 documentos: esquema solo o esquema más antigüedad</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Documentos con el defecto</tspan></text><rect x="252.5" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="272.5" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="272.5" dy="0">Detecta el esquema</tspan></text><rect x="436.22" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="456.22" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="456.22" dy="0">Esquema + antigüedad</tspan></text><line x1="71.08" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="375" x2="71.08" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="281.667" x2="920" y2="281.667" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="281.667" x2="71.08" y2="281.667" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="286.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="188.333" x2="920" y2="188.333" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="188.333" x2="71.08" y2="188.333" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="192.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">40</tspan></text><line x1="71.08" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="95" x2="71.08" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">60</tspan></text><line x1="71.08" y1="95" x2="71.08" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">documentos</text><rect x="88.0584" y="267.667" width="42.6091" height="107.333" rx="3" fill="#6b7c86"/><text x="109.363" y="261.667" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="109.363" dy="0">23</tspan></text><rect x="134.667" y="267.667" width="42.6091" height="107.333" rx="3" fill="#c0432f"/><text x="155.972" y="261.667" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="155.972" dy="0">23</tspan></text><rect x="181.277" y="267.667" width="42.6091" height="107.333" rx="3" fill="#087f8c"/><text x="202.581" y="261.667" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="202.581" dy="0">23</tspan></text><text x="155.972" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="155.972" dy="0">Sin responsable</tspan></text><rect x="257.842" y="281.667" width="42.6091" height="93.3333" rx="3" fill="#6b7c86"/><text x="279.147" y="275.667" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="279.147" dy="0">20</tspan></text><rect x="304.451" y="281.667" width="42.6091" height="93.3333" rx="3" fill="#c0432f"/><text x="325.756" y="275.667" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="325.756" dy="0">20</tspan></text><rect x="351.061" y="281.667" width="42.6091" height="93.3333" rx="3" fill="#087f8c"/><text x="372.365" y="275.667" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="372.365" dy="0">20</tspan></text><text x="325.756" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="325.756" dy="0">Estado inválido («casi</tspan></text><text x="325.756" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="325.756" dy="0">listo»)</tspan></text><rect x="427.626" y="305" width="42.6091" height="70" rx="3" fill="#6b7c86"/><text x="448.931" y="299" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="448.931" dy="0">15</tspan></text><rect x="474.235" y="305" width="42.6091" height="70" rx="3" fill="#c0432f"/><text x="495.54" y="299" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="495.54" dy="0">15</tspan></text><rect x="520.845" y="305" width="42.6091" height="70" rx="3" fill="#087f8c"/><text x="542.149" y="299" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="542.149" dy="0">15</tspan></text><text x="495.54" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="495.54" dy="0">Fecha con formato</tspan></text><text x="495.54" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="495.54" dy="0">incorrecto</tspan></text><rect x="597.41" y="249" width="42.6091" height="126" rx="3" fill="#6b7c86"/><text x="618.715" y="243" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="618.715" dy="0">27</tspan></text><rect x="644.019" y="373" width="42.6091" height="2" rx="3" fill="#c0432f"/><text x="665.324" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="665.324" dy="0">0</tspan></text><rect x="690.629" y="249" width="42.6091" height="126" rx="3" fill="#087f8c"/><text x="711.933" y="243" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="711.933" dy="0">27</tspan></text><text x="665.324" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="665.324" dy="0">Revisado hace más de</tspan></text><text x="665.324" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="665.324" dy="0">180 días</tspan></text><rect x="767.194" y="118.333" width="42.6091" height="256.667" rx="3" fill="#6b7c86"/><text x="788.499" y="112.333" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="788.499" dy="0">55</tspan></text><rect x="813.803" y="373" width="42.6091" height="2" rx="3" fill="#c0432f"/><text x="835.108" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="835.108" dy="0">0</tspan></text><rect x="860.413" y="373" width="42.6091" height="2" rx="3" fill="#087f8c"/><text x="881.717" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="881.717" dy="0">0</tspan></text><text x="835.108" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="835.108" dy="0">Correctos y recientes</tspan></text><rect x="10" y="444" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="468.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La última categoría son los 55 correctos y recientes: ninguna regla marca ninguno. Un documento puede ser válido y estar</tspan></text><text x="470" y="485.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">obsoleto: el esquema comprueba que la fecha exista, no que sea reciente. La antigüedad máxima de 180 días y la fecha de</tspan></text><text x="470" y="502.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">referencia son parámetros del experimento.</tspan></text><text x="470" y="549.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
