<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 335" width="1060" height="335" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Archivos con algún responsable activo si se va el peor subconjunto de k personas (300 commits, 40 archivos)</title><desc id="d">Barras: en un repositorio sintético de 40 archivos y 300 commits repartidos entre 5 personas, el 97,5 por ciento de los archivos tiene algún responsable con al menos 25 por ciento de sus cambios; si se va la peor persona queda el 55, con dos el 35, con tres el 22,5 y con cuatro el 7,5.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1060" height="335" fill="#ffffff"/><text x="360" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Nadie se va</tspan></text><rect x="370" y="16" width="87.75" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="465.75" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="465.75" dy="0">97,5 %</tspan></text><text x="360" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Se va 1 persona (el peor caso)</tspan></text><rect x="370" y="60" width="49.5" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="427.5" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="427.5" dy="0">55,0 %</tspan></text><text x="360" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Se van 2</tspan></text><rect x="370" y="104" width="31.5" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="409.5" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="409.5" dy="0">35,0 %</tspan></text><text x="360" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Se van 3</tspan></text><rect x="370" y="148" width="20.25" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="398.25" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="398.25" dy="0">22,5 %</tspan></text><text x="360" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Se van 4 de 5</tspan></text><rect x="370" y="192" width="6.75" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="384.75" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="384.75" dy="0">7,5 %</tspan></text><rect x="10" y="240" width="1040" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="530" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="530" dy="0">Una sola persona concentra 180 de los 300 commits (60 %) y su salida deja sin responsable a 4 de cada 10 archivos. La métrica usa commits</tspan></text><text x="530" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="530" dy="0">como proxy de conocimiento, con un umbral de 25 %; no mide quién entiende el código ni quién revisa.</tspan></text><text x="530" y="321.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="530" dy="0">Repositorio creado con git fast-import y autores sintéticos; mismos recuentos en Windows (git 2.55) y Ubuntu (git 2.43).</tspan></text></svg>
