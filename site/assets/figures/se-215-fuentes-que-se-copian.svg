<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 305" width="1010" height="305" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Exactitud de una afirmación cuando todas las fuentes coinciden, según cuánto se copian</title><desc id="d">Tabla de 100 000 simulaciones por celda con fuentes de 80 por ciento de fiabilidad: si son independientes, que tres coincidan da 98,5 por ciento de exactitud y que cinco coincidan 99,9; si el 90 por ciento copia de la primera, tres coinciden con 81,8 y cinco con 83,8.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1010" height="305" fill="#ffffff"/><rect x="10" y="12" width="354" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="187" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="187" dy="0">Probabilidad de copiar la primera fuente</tspan></text><rect x="370" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="452" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="452" dy="0">1 fuente</tspan></text><rect x="540" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="652" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="652" dy="0">3 fuentes coinciden</tspan></text><rect x="770" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="882" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="882" dy="0">5 fuentes coinciden</tspan></text><rect x="10" y="56" width="354" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="187" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="187" dy="0">0 % (independientes)</tspan></text><rect x="370" y="56" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">80,0 %</tspan></text><rect x="540" y="56" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">98,5 %</tspan></text><rect x="770" y="56" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="882" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">99,9 %</tspan></text><rect x="10" y="106" width="354" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="187" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="187" dy="0">50 %</tspan></text><rect x="370" y="106" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">80,1 %</tspan></text><rect x="540" y="106" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">90,0 %</tspan></text><rect x="770" y="106" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="882" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">95,2 %</tspan></text><rect x="10" y="156" width="354" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="187" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="187" dy="0">90 %</tspan></text><rect x="370" y="156" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">80,0 %</tspan></text><rect x="540" y="156" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">81,8 %</tspan></text><rect x="770" y="156" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="882" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">83,8 %</tspan></text><rect x="10" y="210" width="990" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="505" y="234.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="505" dy="0">Diez documentos que repiten el mismo error cuentan como uno. Al reconstruir conocimiento perdido, la coincidencia entre fuentes solo</tspan></text><text x="505" y="251.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="505" dy="0">suma evidencia cuando se puede mostrar que no se copiaron. Fiabilidad y probabilidad de copia son supuestos, no medidas.</tspan></text><text x="505" y="291.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="505" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
