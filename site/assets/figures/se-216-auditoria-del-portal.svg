<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 522" width="940" height="522" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Auditoría de un portal de 40 páginas con 12 defectos sembrados</title><desc id="d">Barras horizontales apiladas con los defectos sembrados que detecta cada método: la comprobación estática detecta 9 de los 12 (3 enlaces rotos, 2 sin responsable, 2 revisiones obsoletas, 1 título duplicado y 1 página huérfana) y ninguna de las 3 afirmaciones falsas, que solo detecta ejecutar los ejemplos documentados.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="522" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Auditoría de un portal de 40 páginas con 12 defectos sembrados</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Detecta la comprobación estática</tspan></text><rect x="305.28" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="325.28" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="325.28" dy="0">Solo detecta ejecutar los ejemplos</tspan></text><line x1="274" y1="77" x2="274" y2="341" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="341" x2="274" y2="346" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="362" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0</tspan></text><line x1="474.567" y1="77" x2="474.567" y2="341" stroke="#d5dde1" stroke-width="1"/><line x1="474.567" y1="341" x2="474.567" y2="346" stroke="#5b7280" stroke-width="1.4"/><text x="474.567" y="362" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="474.567" dy="0">1</tspan></text><line x1="675.133" y1="77" x2="675.133" y2="341" stroke="#d5dde1" stroke-width="1"/><line x1="675.133" y1="341" x2="675.133" y2="346" stroke="#5b7280" stroke-width="1.4"/><text x="675.133" y="362" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="675.133" dy="0">2</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="341" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="341" x2="875.7" y2="346" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="362" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">3</tspan></text><line x1="274" y1="341" x2="875.7" y2="341" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="103.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Enlace roto</tspan></text><text x="264" y="147.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Sin responsable</tspan></text><text x="264" y="191.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Revisión obsoleta</tspan></text><text x="264" y="235.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Título duplicado</tspan></text><text x="264" y="279.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Página huérfana</tspan></text><text x="264" y="315" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Afirmación falsa (dice 15 %, es 10</tspan></text><text x="264" y="332" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">%)</tspan></text><rect x="274" y="84" width="601.7" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="574.85" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="574.85" dy="0">3</tspan></text><rect x="875.7" y="84" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="103.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">3</tspan></text><rect x="274" y="128" width="401.133" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="474.567" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="474.567" dy="0">2</tspan></text><rect x="675.133" y="128" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="682.133" y="147.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="682.133" dy="0">2</tspan></text><rect x="274" y="172" width="401.133" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="474.567" y="191.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="474.567" dy="0">2</tspan></text><rect x="675.133" y="172" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="682.133" y="191.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="682.133" dy="0">2</tspan></text><rect x="274" y="216" width="200.567" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="374.283" y="235.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="374.283" dy="0">1</tspan></text><rect x="474.567" y="216" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="481.567" y="235.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="481.567" dy="0">1</tspan></text><rect x="274" y="260" width="200.567" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="374.283" y="279.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="374.283" dy="0">1</tspan></text><rect x="474.567" y="260" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="481.567" y="279.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="481.567" dy="0">1</tspan></text><rect x="274" y="304" width="0" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="274" y="304" width="601.7" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="574.85" y="323.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="574.85" dy="0">3</tspan></text><text x="882.7" y="323.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">3</tspan></text><text x="574.85" y="385" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="574.85" dy="0">defectos sembrados</tspan></text><rect x="10" y="399" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="423.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La auditoría estática encuentra lo que deja una señal en el texto y se queda ciega ante una página limpia que dice algo</tspan></text><text x="470" y="440.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">falso. Hubo una falsa alarma: una página que quedó sin enlaces entrantes por azar al generar el corpus; una señal real,</tspan></text><text x="470" y="457.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">aunque no sembrada.</tspan></text><text x="470" y="504.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
