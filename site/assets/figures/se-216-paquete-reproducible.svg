<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 353" width="970" height="353" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Huellas distintas de un paquete zip de 30 páginas construido tres veces</title><desc id="d">Tabla de un archivo zip construido tres veces tras cambiar las fechas de los archivos: la construcción ingenua produce 3 huellas distintas, la determinista una sola, igual en Windows y Ubuntu cuando también se fija el campo de sistema de origen; con saltos de línea CRLF la huella cambia.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="353" fill="#ffffff"/><rect x="10" y="12" width="464" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="242" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="242" dy="0">Construcción del paquete</tspan></text><rect x="480" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="572" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="572" dy="0">Huellas en 3</tspan></text><text x="572" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="572" dy="0">construcciones</tspan></text><rect x="670" y="12" width="284" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="812" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="812" dy="0">Lectura</tspan></text><rect x="10" y="56" width="464" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="81.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Recorrer el directorio sin ordenar, con la fecha de modificación</tspan></text><text x="242" y="97.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">de cada archivo</tspan></text><rect x="480" y="56" width="184" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="89.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">3</tspan></text><rect x="670" y="56" width="284" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="89.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">Cambia con la hora de la extracción</tspan></text><rect x="10" y="122" width="464" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="147.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Ordenar, fijar la fecha y los permisos y declarar el sistema de</tspan></text><text x="242" y="163.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">origen</tspan></text><rect x="480" y="122" width="184" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="155.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">1</tspan></text><rect x="670" y="122" width="284" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="147.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">Misma huella entre ejecuciones y</tspan></text><text x="812" y="163.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">sistemas</tspan></text><rect x="10" y="188" width="464" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="221.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">El mismo árbol con saltos de línea CRLF</tspan></text><rect x="480" y="188" width="184" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="221.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">otra</tspan></text><rect x="670" y="188" width="284" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="221.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">El contenido distinto cambia la huella</tspan></text><rect x="10" y="258" width="950" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="485" y="282.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="485" dy="0">Un hallazgo del experimento: sin fijar el sistema de origen del zip (0 en Windows, 3 en Linux por defecto) la construcción</tspan></text><text x="485" y="299.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="485" dy="0">«determinista» daba huellas distintas en cada sistema. Fijar solo el orden y la fecha no basta.</tspan></text><text x="485" y="339.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Mismo conjunto de 30 páginas generado con semilla fija; huella determinista idéntica en Windows y Ubuntu.</tspan></text></svg>
