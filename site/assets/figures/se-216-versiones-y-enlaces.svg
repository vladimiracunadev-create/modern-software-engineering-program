<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 321" width="970" height="321" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres versiones etiquetadas de un portal de 10 páginas: enlaces internos rotos por versión</title><desc id="d">Tabla de tres versiones de un portal construidas desde etiquetas de git: v1 tiene 10 páginas, 30 enlaces y 0 rotos; v2 elimina dos páginas y renombra una, deja 8 páginas, 21 enlaces y 7 rotos; v3 añade una página y conserva los 7 rotos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="321" fill="#ffffff"/><rect x="10" y="12" width="444" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="232" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="232" dy="0">Versión</tspan></text><rect x="460" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="537" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="537" dy="0">Páginas</tspan></text><rect x="620" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="717" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="717" dy="0">Enlaces internos</tspan></text><rect x="820" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="887" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="887" dy="0">Rotos</tspan></text><rect x="10" y="56" width="444" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">v1</tspan></text><rect x="460" y="56" width="154" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">10</tspan></text><rect x="620" y="56" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">30</tspan></text><rect x="820" y="56" width="134" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="887" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="887" dy="0">0</tspan></text><rect x="10" y="106" width="444" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">v2 (se eliminan 2 páginas y se renombra 1)</tspan></text><rect x="460" y="106" width="154" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">8</tspan></text><rect x="620" y="106" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">21</tspan></text><rect x="820" y="106" width="134" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="887" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="887" dy="0">7</tspan></text><rect x="10" y="156" width="444" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">v3 (se añade 1 página)</tspan></text><rect x="460" y="156" width="154" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">9</tspan></text><rect x="620" y="156" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">23</tspan></text><rect x="820" y="156" width="134" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="887" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="887" dy="0">7</tspan></text><rect x="10" y="210" width="950" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="485" y="234.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">Las 3 páginas de v1 ausentes en la última versión (p03, p05 y p07) son el contrato roto con quien enlazó a la versión antigua.</tspan></text><text x="485" y="251.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">Un portal versionado necesita dos cosas distintas: que cada versión sea coherente consigo misma y una política para los enlaces</tspan></text><text x="485" y="268.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">entre versiones.</tspan></text><text x="485" y="307.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Repositorio de git creado en un directorio temporal; idéntico en Windows y Ubuntu.</tspan></text></svg>
