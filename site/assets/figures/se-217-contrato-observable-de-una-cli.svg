<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 562" width="940" height="562" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Lo que observa quien invoca una CLI de argparse</title><desc id="d">Barras horizontales con los bytes que cada invocación de una herramienta de ejemplo escribe en la salida estándar y en el error estándar: la ayuda escribe 125 bytes en stdout, los cuatro usos incorrectos escriben solo en stderr (89, 77 y 139 bytes, 143 en Ubuntu) y una invocación válida escribe 12 bytes en stdout.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="562" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Lo que observa quien invoca una CLI de argparse</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">stdout</tspan></text><rect x="109.24" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="129.24" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="129.24" dy="0">stderr</tspan></text><line x1="294" y1="77" x2="294" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="397" x2="294" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">0</tspan></text><line x1="493.273" y1="77" x2="493.273" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="493.273" y1="397" x2="493.273" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="493.273" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="493.273" dy="0">50</tspan></text><line x1="692.547" y1="77" x2="692.547" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="692.547" y1="397" x2="692.547" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="692.547" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692.547" dy="0">100</tspan></text><line x1="891.82" y1="77" x2="891.82" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="891.82" y1="397" x2="891.82" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="891.82" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="891.82" dy="0">150</tspan></text><line x1="294" y1="397" x2="891.82" y2="397" stroke="#5b7280" stroke-width="1.6"/><text x="284" y="113.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">-h (código 0)</tspan></text><text x="284" y="177.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Sin subcomando (código 2)</tspan></text><text x="284" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Flag desconocido (código 2)</tspan></text><text x="284" y="297" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Valor fuera de las opciones (código</tspan></text><text x="284" y="314" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">2)</tspan></text><text x="284" y="369.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Invocación válida (código 0)</tspan></text><rect x="294" y="83" width="498.183" height="24.5" rx="3" fill="#087f8c"/><text x="799.183" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="799.183" dy="0">125</tspan></text><rect x="294" y="110.5" width="2" height="24.5" rx="3" fill="#c0432f"/><text x="303" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="303" dy="0">0</tspan></text><rect x="294" y="147" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="303" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="303" dy="0">0</tspan></text><rect x="294" y="174.5" width="354.707" height="24.5" rx="3" fill="#c0432f"/><text x="655.707" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="655.707" dy="0">89</tspan></text><rect x="294" y="211" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="303" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="303" dy="0">0</tspan></text><rect x="294" y="238.5" width="306.881" height="24.5" rx="3" fill="#c0432f"/><text x="607.881" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="607.881" dy="0">77</tspan></text><rect x="294" y="275" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="303" y="291.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="303" dy="0">0</tspan></text><rect x="294" y="302.5" width="553.98" height="24.5" rx="3" fill="#c0432f"/><text x="854.98" y="319.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="854.98" dy="0">139</tspan></text><rect x="294" y="339" width="47.8256" height="24.5" rx="3" fill="#087f8c"/><text x="348.826" y="355.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="348.826" dy="0">12</tspan></text><rect x="294" y="366.5" width="2" height="24.5" rx="3" fill="#c0432f"/><text x="303" y="383.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="303" dy="0">0</tspan></text><text x="592.91" y="441" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="592.91" dy="0">Bytes escritos</tspan></text><rect x="10" y="455" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="479.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El código 2 y la separación de flujos salen gratis de argparse, pero el texto exacto del mensaje no es contrato: entre</tspan></text><text x="470" y="496.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Python 3.12.9 y 3.12.3 el mismo error midió 139 y 143 bytes. Quien automatice debe leer el código, no analizar el mensaje.</tspan></text><text x="470" y="544.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos y procesos locales; Windows (CPython 3.12.9) y Ubuntu/WSL2 (3.12.3); los tiempos son de un equipo.</tspan></text></svg>
