<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 307" width="1000" height="307" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tiempo hasta recibir la primera línea de un productor que emite una línea cada 0,1 s</title><desc id="d">Barras: con la salida conectada a una tubería, el productor por defecto entrega la primera línea a los 1,2 segundos en Windows, cuando termina; con flush, con la opción -u o con la variable de entorno la entrega a los 0,1 a 0,2 segundos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="307" fill="#ffffff"/><text x="300" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Salida a tubería, por defecto</tspan></text><rect x="310" y="16" width="396" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="714" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="714" dy="0">1,2 s</tspan></text><text x="300" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">print(flush=True)</tspan></text><rect x="310" y="60" width="33" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="351" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="351" dy="0">0,1 s</tspan></text><text x="300" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">python -u</tspan></text><rect x="310" y="104" width="33" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="351" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="351" dy="0">0,1 s</tspan></text><text x="300" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">PYTHONUNBUFFERED=1</tspan></text><rect x="310" y="148" width="66" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="384" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="384" dy="0">0,2 s</tspan></text><rect x="10" y="196" width="980" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="500" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Con una tubería la salida se acumula en un búfer de bloque y llega al final: el consumidor ve las diez líneas juntas. En Ubuntu la</tspan></text><text x="500" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">serie fue 1,0 / 0,0 / 0,0 / 0,0 s: mismo mecanismo. Una herramienta que informa progreso debe vaciar el búfer o decirlo en su</tspan></text><text x="500" y="254.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">contrato.</tspan></text><text x="500" y="293.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Datos sintéticos y procesos locales; Windows (CPython 3.12.9) y Ubuntu/WSL2 (3.12.3); los tiempos son de un equipo.</tspan></text></svg>
