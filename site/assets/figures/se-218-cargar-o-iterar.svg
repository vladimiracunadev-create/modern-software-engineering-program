<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 263" width="1020" height="263" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Memoria máxima al procesar un archivo: cargarlo entero o iterar</title><desc id="d">Barras: un archivo de 9,6 megabytes con 400 000 líneas necesita un pico de 37,7 megabytes si se lee entero y partir con splitlines, y 0,03 megabytes si se itera línea a línea.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1020" height="263" fill="#ffffff"/><text x="370" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="370" dy="0">Archivo CRLF de 400 000 líneas</tspan></text><rect x="380" y="16" width="105.6" height="28" rx="3" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="493.6" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="493.6" dy="0">9,6 MB</tspan></text><text x="370" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="370" dy="0">read().splitlines(): pico de memoria</tspan></text><rect x="380" y="60" width="414.7" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="802.7" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="802.7" dy="0">37,7 MB</tspan></text><text x="370" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="370" dy="0">Iterar línea a línea: pico de memoria</tspan></text><rect x="380" y="104" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="392" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="392" dy="0">0,03 MB</tspan></text><rect x="10" y="152" width="1000" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="510" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="510" dy="0">Cargar el archivo cuesta unas cuatro veces su tamaño por los objetos de texto; iterar mantiene la memoria constante. En modo texto las</tspan></text><text x="510" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="510" dy="0">400 000 líneas CRLF llegan como «\n»; en modo binario las 400 000 conservan el «\r» final: la decisión sobre los saltos de línea</tspan></text><text x="510" y="210.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="510" dy="0">cambia el contenido.</tspan></text><text x="510" y="249.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="510" dy="0">Datos sintéticos con semilla 218; tracemalloc; mismas cifras en Windows y Ubuntu.</tspan></text></svg>
