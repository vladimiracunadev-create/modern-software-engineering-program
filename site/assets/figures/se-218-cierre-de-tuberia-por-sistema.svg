<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 371" width="1050" height="371" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué ocurre cuando el consumidor cierra la tubería tras una línea</title><desc id="d">Tabla: ante el cierre anticipado de la tubería, un productor Python en Windows recibe OSError con errno 22 y uno en Ubuntu recibe BrokenPipeError con errno 32; sin manejo ambos terminan con código 1 y una traza.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1050" height="371" fill="#ffffff"/><rect x="10" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="132" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="132" dy="0">Situación</tspan></text><rect x="260" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="447" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="447" dy="0">Windows</tspan></text><rect x="640" y="12" width="394" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="837" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="837" dy="0">Ubuntu (WSL2)</tspan></text><rect x="10" y="56" width="244" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="84.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Productor que captura la</tspan></text><text x="132" y="100.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">excepción</tspan></text><rect x="260" y="56" width="374" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="447" y="92.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">Código 7 · OSError, errno 22</tspan></text><rect x="640" y="56" width="394" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="92.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">Código 7 · BrokenPipeError, errno 32</tspan></text><rect x="10" y="128" width="244" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="164.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Productor sin manejo</tspan></text><rect x="260" y="128" width="374" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="447" y="164.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">Código 1 · OSError: [Errno 22] Invalid argument</tspan></text><rect x="640" y="128" width="394" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="164.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">Código 1 · BrokenPipeError: [Errno 32] Broken pipe</tspan></text><rect x="10" y="200" width="244" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="236.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Qué debe hacer una herramienta</tspan></text><rect x="260" y="200" width="374" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="447" y="228.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">Tratar errno 22 y 32 como «el consumidor ya no</tspan></text><text x="447" y="244.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">quiere más»</tspan></text><rect x="640" y="200" width="394" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="236.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">Salir en silencio con el código acordado, sin traza</tspan></text><rect x="10" y="276" width="1030" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="525" y="300.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="525" dy="0">El mismo hecho —leer una línea y cerrar— produce excepciones distintas. Una herramienta portable debe tratar ambas como una terminación</tspan></text><text x="525" y="317.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="525" dy="0">normal del consumidor; imprimir una traza por haber usado «| head» es un defecto de la herramienta.</tspan></text><text x="525" y="357.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="525" dy="0">Datos sintéticos y procesos locales; Windows (CPython 3.12.9) y Ubuntu/WSL2 (3.12.3); los tiempos son de un equipo.</tspan></text></svg>
