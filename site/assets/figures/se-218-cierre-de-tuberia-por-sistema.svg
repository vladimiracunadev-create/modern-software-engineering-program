<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 404" width="940" height="404" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué ocurre cuando el consumidor cierra la tubería tras una línea</title><desc id="d">Diagrama de lo que ocurre cuando el consumidor cierra la tubería tras una línea: en Windows el productor recibe OSError con errno 22 y en Ubuntu BrokenPipeError con errno 32; sin manejo ambos terminan con código 1 y una traza; una herramienta portable trata los dos como una terminación normal y sale en silencio.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="404" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué ocurre cuando el consumidor cierra la tubería tras una línea</tspan></text><rect x="14" y="130.88" width="250" height="70" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="139" y="152.88" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="139" dy="0">El consumidor cierra la tubería</tspan></text><text x="139" y="169.52" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="139" dy="0">tras una línea</tspan></text><text x="139" y="186.16" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="139" dy="0">el productor sigue escribiendo</tspan></text><rect x="334" y="49" width="592" height="69.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="630" y="70.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="630" dy="0">Windows: OSError, errno 22</tspan></text><text x="630" y="87.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="630" dy="0">si el productor captura la excepción sale con código 7; sin manejo, código 1 y</tspan></text><text x="630" y="104.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="630" dy="0">una traza</tspan></text><polyline points="264,165.88 299,165.88 299,83.96 334,83.96" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><rect x="334" y="130.92" width="592" height="69.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="630" y="152.88" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="630" dy="0">Ubuntu (WSL2): BrokenPipeError, errno 32</tspan></text><text x="630" y="169.52" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="630" dy="0">si el productor captura la excepción sale con código 7; sin manejo, código 1 y</tspan></text><text x="630" y="186.16" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="630" dy="0">una traza</tspan></text><polyline points="264,165.88 299,165.88 299,165.88 334,165.88" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><rect x="334" y="212.84" width="592" height="69.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="630" y="234.8" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="630" dy="0">Qué debe hacer una herramienta portable</tspan></text><text x="630" y="251.44" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">tratar errno 22 y 32 como «el consumidor ya no quiere más» y salir en silencio</tspan></text><text x="630" y="268.08" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">con el código acordado, sin traza</tspan></text><polyline points="264,165.88 299,165.88 299,247.8 334,247.8" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="296.76" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="321.72" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El mismo hecho —leer una línea y cerrar— produce excepciones distintas. Una herramienta portable debe tratar ambas como una</tspan></text><text x="470" y="338.36" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">terminación normal del consumidor; imprimir una traza por haber usado «| head» es un defecto de la herramienta.</tspan></text><text x="470" y="386.04" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos y procesos locales; Windows (CPython 3.12.9) y Ubuntu/WSL2 (3.12.3); los tiempos son de un equipo.</tspan></text></svg>
