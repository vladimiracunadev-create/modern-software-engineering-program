<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 404" width="940" height="404" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El mismo código de salida observado desde el padre en Windows y en Ubuntu</title><desc id="d">Diagrama de lo que observa el padre al terminar un hijo en Windows y en Ubuntu: Windows devuelve el valor completo de sys.exit (256, 257, 1000 y 4294967295 para menos uno) mientras Ubuntu conserva solo el byte bajo (0, 1, 232 y 255); un aborto da 3221226505 frente a menos 6; una excepción sin capturar da 1 en los dos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="404" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">El mismo código de salida observado desde el padre en Windows y en Ubuntu</tspan></text><rect x="14" y="114.64" width="250" height="86.56" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="139" y="136.6" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="139" dy="0">Un hijo termina; el padre lee</tspan></text><text x="139" y="153.24" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="139" dy="0">el código</tspan></text><text x="139" y="169.88" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="139" dy="0">Windows (CPython 3.12.9) y</tspan></text><text x="139" y="186.52" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="139" dy="0">Ubuntu (3.12.3)</tspan></text><rect x="334" y="49" width="592" height="69.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="630" y="70.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="630" dy="0">sys.exit(256), (257), (1000), (-1)</tspan></text><text x="630" y="87.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="630" dy="0">Windows: 256, 257, 1000, 4294967295 · Ubuntu: 0, 1, 232, 255 (solo el byte</tspan></text><text x="630" y="104.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="630" dy="0">bajo)</tspan></text><polyline points="264,157.92 299,157.92 299,83.96 334,83.96" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><rect x="334" y="130.92" width="592" height="69.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="630" y="152.88" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="630" dy="0">Terminación por señal</tspan></text><text x="630" y="169.52" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="630" dy="0">os.abort(): 3221226505 en Windows, −6 (SIGABRT) en Ubuntu · kill() desde el</tspan></text><text x="630" y="186.16" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="630" dy="0">padre: 1 y −9 (SIGKILL)</tspan></text><polyline points="264,157.92 299,157.92 299,165.88 334,165.88" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><rect x="334" y="212.84" width="592" height="54" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="630" y="235.16" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="630" dy="0">Excepción sin capturar · sys.exit(«mensaje»)</tspan></text><text x="630" y="251.8" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">1 en Windows y 1 en Ubuntu: coinciden</tspan></text><polyline points="264,157.92 299,157.92 299,239.84 334,239.84" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="280.84" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="305.8" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Linux conserva solo ocho bits del código: 256 se lee como 0, es decir, éxito. Windows conserva treinta y dos. Un código</tspan></text><text x="470" y="322.44" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">fuera de 0–255 no es portable; en POSIX una señal se informa como un número negativo y en Windows como un código de</tspan></text><text x="470" y="339.08" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">excepción.</tspan></text><text x="470" y="386.76" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos y procesos locales; Windows (CPython 3.12.9) y Ubuntu/WSL2 (3.12.3); los tiempos son de un equipo.</tspan></text></svg>
