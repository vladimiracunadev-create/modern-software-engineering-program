<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 307" width="1020" height="307" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">10 000 trabajos con cinco tipos de fallo: coste de tres políticas de reintento</title><desc id="d">Barras: con 10 000 trabajos y fallos transitorios recuperables 70 por ciento de las veces, reintentar solo lo transitorio recupera 3 950 trabajos con 11 675 intentos; reintentar todo recupera los mismos 3 950 con 29 744 intentos, de ellos 24 092 inútiles.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1020" height="307" fill="#ffffff"/><text x="420" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Nunca reintentar: intentos</tspan></text><rect x="430" y="16" width="155" height="28" rx="3" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="593" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="593" dy="0">10 000</tspan></text><text x="420" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Reintentar solo el código 75: intentos</tspan></text><rect x="430" y="60" width="180.963" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="618.962" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="618.962" dy="0">11 675</tspan></text><text x="420" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Reintentar todo: intentos</tspan></text><rect x="430" y="104" width="461.032" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="899.032" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="899.032" dy="0">29 744</tspan></text><text x="420" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Reintentar todo: reintentos inútiles</tspan></text><rect x="430" y="148" width="373.426" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="811.426" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="811.426" dy="0">24 092</tspan></text><rect x="10" y="196" width="1000" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="510" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="510" dy="0">Reintentar solo el código transitorio recuperó 3 950 trabajos, 1 165 más que no reintentar (2 785), con 1 675 intentos extra;</tspan></text><text x="510" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="510" dy="0">reintentar todo recuperó los mismos 3 950 y gastó 18 069 intentos más. Un código de salida que distingue «temporal» de «permanente» es</tspan></text><text x="510" y="254.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="510" dy="0">lo que hace posible la política barata.</tspan></text><text x="510" y="293.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="510" dy="0">Simulación con semilla 220; porcentajes y la probabilidad de recuperación de 70 % son supuestos del autor, no mediciones.</tspan></text></svg>
