<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 438" width="940" height="438" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Estado de salida de tuberías y guiones de shell (bash, mismos resultados en Windows y Ubuntu)</title><desc id="d">Diagrama del estado de salida de seis guiones de bash agrupados en cuatro mecanismos: false seguido de cat devuelve 0 y el fallo se pierde, con pipefail devuelve 1 y PIPESTATUS conserva 1 0 0; false con &amp;&amp; deja 1; sin set -e el guion continúa y termina con 0; con set -e se detiene en el primer fallo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="438" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Estado de salida de tuberías y guiones de shell (bash, mismos resultados en Windows y Ubuntu)</tspan></text><rect x="14" y="147.96" width="250" height="70" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="139" y="169.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="139" dy="0">Estado de salida en bash</tspan></text><text x="139" y="186.6" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="139" dy="0">mismos resultados en Windows y</tspan></text><text x="139" y="203.24" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="139" dy="0">Ubuntu</tspan></text><rect x="334" y="49" width="592" height="69.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="630" y="70.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="630" dy="0">Tubería: false | cat</tspan></text><text x="630" y="87.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="630" dy="0">devuelve 0, el fallo se pierde · con set -o pipefail devuelve 1 · PIPESTATUS</tspan></text><text x="630" y="104.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="630" dy="0">conserva 1 0 0</tspan></text><polyline points="264,182.96 299,182.96 299,83.96 334,83.96" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><rect x="334" y="130.92" width="592" height="54" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="630" y="153.24" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="630" dy="0">false &amp;&amp; echo ok</tspan></text><text x="630" y="169.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="630" dy="0">el &amp;&amp; no ejecuta la segunda orden y $? queda en 1</tspan></text><polyline points="264,182.96 299,182.96 299,157.92 334,157.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="334" y="196.92" width="592" height="54" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="630" y="219.24" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="630" dy="0">Sin set -e: false; echo continua; true</tspan></text><text x="630" y="235.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="630" dy="0">continua · 0: el script sigue y el último estado oculta el fallo</tspan></text><polyline points="264,182.96 299,182.96 299,223.92 334,223.92" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><rect x="334" y="262.92" width="592" height="54" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="630" y="285.24" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="630" dy="0">Con set -e: false; echo continua</tspan></text><text x="630" y="301.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">(nada) · 1: el script se detiene en el primer fallo</tspan></text><polyline points="264,182.96 299,182.96 299,289.92 334,289.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="330.92" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="355.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Una tubería sin pipefail devuelve éxito aunque falle la primera etapa. Un trabajo programado que termina con 0 después de</tspan></text><text x="470" y="372.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">un fallo intermedio es la forma más común de fallo silencioso en la automatización.</tspan></text><text x="470" y="420.2" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Git Bash en Windows y bash 5.2.21 en Ubuntu/WSL2; los resultados fueron iguales.</tspan></text></svg>
