<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 263" width="1050" height="263" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ventana en la que llegan peticiones que fallan según qué significa preparado</title><desc id="d">Barras: con un servicio que abre su puerto a los 0,5 segundos y termina de calentar a los 0,8, declararlo preparado al lanzar el proceso deja 0,8 segundos de peticiones fallidas, hacerlo al abrirse el puerto deja 0,3 y esperar a que responda con éxito deja 0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1050" height="263" fill="#ffffff"/><text x="330" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Preparado = proceso lanzado</tspan></text><rect x="340" y="16" width="224" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="572" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="572" dy="0">0,8 s (≈20 fallos a 25 peticiones/s)</tspan></text><text x="330" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Preparado = puerto abierto</tspan></text><rect x="340" y="60" width="84" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="432" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="432" dy="0">0,3 s (≈6 fallos)</tspan></text><text x="330" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Preparado = responde 200</tspan></text><rect x="340" y="104" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="352" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="352" dy="0">0,0 s (0 fallos)</tspan></text><rect x="10" y="152" width="1030" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="525" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="525" dy="0">«Vivo» (el proceso existe) no es «preparado» (puede atender). Entre el arranque y la primera respuesta correcta hay una ventana en la que</tspan></text><text x="525" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="525" dy="0">el tráfico recibe rechazos o 503; a 25 peticiones por segundo son unas 20, 6 o 0 según la definición. Una sonda de preparación debe probar</tspan></text><text x="525" y="210.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="525" dy="0">lo mismo que hará el cliente.</tspan></text><text x="525" y="249.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="525" dy="0">Servidor HTTP local en 127.0.0.1 con retardos configurados; Ubuntu midió ≈7 fallos para «puerto abierto».</tspan></text></svg>
