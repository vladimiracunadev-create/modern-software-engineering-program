<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 307" width="950" height="307" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Arranques de un servicio que siempre falla al iniciar, durante 600 s</title><desc id="d">Barras: un servicio que falla de inmediato se arranca 3 000 veces en 600 segundos si se reinicia sin espera, 501 con una espera fija de un segundo, 15 con espera exponencial hasta 60 segundos y 24 con espera exponencial con jitter.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="307" fill="#ffffff"/><text x="370" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="370" dy="0">Sin espera (0,2 s por arranque)</tspan></text><rect x="380" y="16" width="450" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="838" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="838" dy="0">3 000</tspan></text><text x="370" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="370" dy="0">Espera fija de 1 s</tspan></text><rect x="380" y="60" width="75.15" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="463.15" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="463.15" dy="0">501</tspan></text><text x="370" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="370" dy="0">Espera exponencial hasta 60 s</tspan></text><rect x="380" y="104" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="392" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="392" dy="0">15</tspan></text><text x="370" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="370" dy="0">Exponencial con jitter</tspan></text><rect x="380" y="148" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="392" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="392" dy="0">24</tspan></text><rect x="10" y="196" width="930" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="475" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Un reinicio inmediato convierte un fallo de arranque en una carga de miles de intentos y de líneas de registro por diez</tspan></text><text x="475" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">minutos. La espera creciente reduce los arranques a decenas; el jitter reparte los reintentos de varias instancias para que</tspan></text><text x="475" y="254.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">no coincidan.</tspan></text><text x="475" y="293.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Simulación determinista con semilla 3 para el jitter; los tiempos de arranque (0,2 s) y de espera son supuestos del autor.</tspan></text></svg>
