<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 404" width="940" height="404" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Pedir a un servicio que termine: lo que ocurre en Windows y en Ubuntu</title><desc id="d">Diagrama de lo que ocurre al pedir a un servicio que termine: con un manejador que limpia en 0,2 segundos Windows termina con código 1 sin limpieza y Ubuntu con código 0 y marca de limpieza; con un manejador que ignora la señal Windows lo termina y Ubuntu necesita forzar con código menos 9 tras 1,5 segundos; solo CTRL_BREAK_EVENT limpia en Windows.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="404" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Pedir a un servicio que termine: lo que ocurre en Windows y en Ubuntu</tspan></text><rect x="14" y="122.92" width="250" height="70" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="139" y="153.24" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="139" dy="0">Pedir a un servicio que termine</tspan></text><text x="139" y="169.88" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="139" dy="0">Windows frente a Ubuntu (WSL2)</tspan></text><rect x="334" y="49" width="592" height="69.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="630" y="70.96" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="630" dy="0">terminate() con un manejador que limpia en 0,2 s</tspan></text><text x="630" y="87.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="630" dy="0">Windows: código 1, sin limpieza (terminación inmediata) · Ubuntu: código 0,</tspan></text><text x="630" y="104.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="630" dy="0">marca de limpieza escrita</tspan></text><polyline points="264,157.92 299,157.92 299,83.96 334,83.96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="334" y="130.92" width="592" height="69.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="630" y="152.88" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="630" dy="0">terminate() con un manejador que ignora la señal</tspan></text><text x="630" y="169.52" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="630" dy="0">Windows: código 1, el proceso desaparece · Ubuntu: código −9 tras 1,5 s, hubo</tspan></text><text x="630" y="186.16" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="630" dy="0">que forzar</tspan></text><polyline points="264,157.92 299,157.92 299,165.88 334,165.88" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><rect x="334" y="212.84" width="592" height="54" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="630" y="235.16" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="630" dy="0">CTRL_BREAK_EVENT (grupo de procesos nuevo)</tspan></text><text x="630" y="251.8" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">Windows: código 0, marca de limpieza escrita · Ubuntu: no existe</tspan></text><polyline points="264,157.92 299,157.92 299,239.84 334,239.84" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="280.84" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="305.8" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El mismo método de Python significa dos cosas: pedir y obligar. Un servicio que debe cerrar conexiones y vaciar datos</tspan></text><text x="470" y="322.44" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">necesita, en Windows, un canal de aviso distinto (CTRL_BREAK, una orden de control o una petición por un canal propio), y</tspan></text><text x="470" y="339.08" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">en cualquier sistema un plazo tras el cual se fuerza.</tspan></text><text x="470" y="386.76" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Un hijo de Python con un manejador de señales; no se probó un servicio de Windows real ni systemd.</tspan></text></svg>
