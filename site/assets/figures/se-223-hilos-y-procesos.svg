<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 706" width="940" height="706" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Hilos y procesos para trabajo de espera y de cálculo</title><desc id="d">Barras horizontales en escala logarítmica con el tiempo de cada estrategia en Windows y en Ubuntu: 40 esperas de 0,05 s tardan 2,01 s en secuencial y 0,25 s con ocho hilos; ocho cálculos de CPU no se aceleran con hilos (4,95 s frente a 2,27 s en Windows) y sí con cuatro procesos (1,31 s); arrancar procesos cuesta 0,41 s en Windows.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="706" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Hilos y procesos para trabajo de espera y de cálculo</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Windows</tspan></text><rect x="116.78" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="136.78" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="136.78" dy="0">Ubuntu (WSL2)</tspan></text><line x1="294" y1="77" x2="294" y2="525" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="525" x2="294" y2="530" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="546" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">0,01</tspan></text><line x1="490.587" y1="77" x2="490.587" y2="525" stroke="#d5dde1" stroke-width="1"/><line x1="490.587" y1="525" x2="490.587" y2="530" stroke="#5b7280" stroke-width="1.4"/><text x="490.587" y="546" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="490.587" dy="0">0,1</tspan></text><line x1="687.173" y1="77" x2="687.173" y2="525" stroke="#d5dde1" stroke-width="1"/><line x1="687.173" y1="525" x2="687.173" y2="530" stroke="#5b7280" stroke-width="1.4"/><text x="687.173" y="546" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="687.173" dy="0">1</tspan></text><line x1="883.76" y1="77" x2="883.76" y2="525" stroke="#d5dde1" stroke-width="1"/><line x1="883.76" y1="525" x2="883.76" y2="530" stroke="#5b7280" stroke-width="1.4"/><text x="883.76" y="546" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="883.76" dy="0">10</tspan></text><line x1="294" y1="525" x2="883.76" y2="525" stroke="#5b7280" stroke-width="1.6"/><text x="284" y="113.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">40 esperas: secuencial</tspan></text><text x="284" y="177.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">40 esperas: 8 hilos</tspan></text><text x="284" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">40 esperas: 4 procesos</tspan></text><text x="284" y="305.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">8 cálculos de CPU: secuencial</tspan></text><text x="284" y="369.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">8 cálculos: 8 hilos</tspan></text><text x="284" y="433.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">8 cálculos: 4 procesos</tspan></text><text x="284" y="489" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Arrancar 2 procesos con 2 tareas</tspan></text><text x="284" y="506" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">triviales</tspan></text><rect x="294" y="83" width="452.778" height="24.5" rx="3" fill="#c0432f"/><text x="753.778" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="753.778" dy="0">2,01</tspan></text><rect x="294" y="110.5" width="452.778" height="24.5" rx="3" fill="#087f8c"/><text x="753.778" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="753.778" dy="0">2,01</tspan></text><rect x="294" y="147" width="274.816" height="24.5" rx="3" fill="#c0432f"/><text x="575.816" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="575.816" dy="0">0,25</tspan></text><rect x="294" y="174.5" width="278.165" height="24.5" rx="3" fill="#087f8c"/><text x="579.165" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="579.165" dy="0">0,26</tspan></text><rect x="294" y="211" width="404.36" height="24.5" rx="3" fill="#c0432f"/><text x="705.36" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="705.36" dy="0">1,14</tspan></text><rect x="294" y="238.5" width="337.343" height="24.5" rx="3" fill="#087f8c"/><text x="638.343" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="638.343" dy="0">0,52</tspan></text><rect x="294" y="275" width="463.163" height="24.5" rx="3" fill="#c0432f"/><text x="764.163" y="291.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="764.163" dy="0">2,27</tspan></text><rect x="294" y="302.5" width="405.845" height="24.5" rx="3" fill="#087f8c"/><text x="706.845" y="319.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="706.845" dy="0">1,16</tspan></text><rect x="294" y="339" width="529.723" height="24.5" rx="3" fill="#c0432f"/><text x="830.723" y="355.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="830.723" dy="0">4,95</tspan></text><rect x="294" y="366.5" width="418.16" height="24.5" rx="3" fill="#087f8c"/><text x="719.16" y="383.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="719.16" dy="0">1,34</tspan></text><rect x="294" y="403" width="416.227" height="24.5" rx="3" fill="#c0432f"/><text x="717.227" y="419.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="717.227" dy="0">1,31</tspan></text><rect x="294" y="430.5" width="340.566" height="24.5" rx="3" fill="#087f8c"/><text x="641.566" y="447.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="641.566" dy="0">0,54</tspan></text><rect x="294" y="467" width="317.052" height="24.5" rx="3" fill="#c0432f"/><text x="618.052" y="483.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="618.052" dy="0">0,41</tspan></text><rect x="294" y="494.5" width="152.974" height="24.5" rx="3" fill="#087f8c"/><text x="453.974" y="511.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="453.974" dy="0">0,06</tspan></text><text x="588.88" y="569" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="588.88" dy="0">Tiempo (s) (escala logarítmica)</tspan></text><rect x="10" y="583" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="607.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los hilos sirven para esperar, no para calcular; los procesos sirven para calcular pero cuestan arranque (mucho más en</tspan></text><text x="470" y="624.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Windows, que no puede hacer fork). Las cifras son medianas de tres ejecuciones en un equipo y variaron entre ejecuciones</tspan></text><text x="470" y="641.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">hasta 2 veces: se leen como orden de magnitud.</tspan></text><text x="470" y="688.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Tiempos de un equipo con 8 procesadores lógicos; el patrón (no las cifras) es el hallazgo.</tspan></text></svg>
