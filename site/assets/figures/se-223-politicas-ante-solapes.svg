<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 567" width="940" height="567" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un trabajo cada 60 s cuya duración varía: tres políticas durante 1 440 ejecuciones</title><desc id="d">Barras agrupadas con el efecto de tres políticas en un trabajo cada 60 segundos durante 1 440 ejecuciones: sin bloqueo hay 271 arranques solapados con duración mediana de 40 s y 1 353 con 55 s; omitir deja 174 y 439 ejecuciones sin hacer; encolar retrasa el inicio hasta 79 y 576 segundos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="567" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un trabajo cada 60 s cuya duración varía: tres políticas durante 1 440 ejecuciones</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Mediana 40 s (14,0 % superan el periodo)</tspan></text><rect x="365.6" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="385.6" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="385.6" dy="0">Mediana 55 s (41,7 % superan el periodo)</tspan></text><line x1="93.7" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="375" x2="93.7" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">0</tspan></text><line x1="93.7" y1="281.667" x2="920" y2="281.667" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="281.667" x2="93.7" y2="281.667" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="286.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">500</tspan></text><line x1="93.7" y1="188.333" x2="920" y2="188.333" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="188.333" x2="93.7" y2="188.333" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="192.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1 000</tspan></text><line x1="93.7" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="95" x2="93.7" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1 500</tspan></text><line x1="93.7" y1="95" x2="93.7" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">Arranques, ejecuciones o segundos según la política</text><rect x="121.243" y="324.413" width="108.173" height="50.5867" rx="3" fill="#087f8c"/><text x="175.33" y="318.413" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="175.33" dy="0">271</tspan></text><rect x="233.417" y="122.44" width="108.173" height="252.56" rx="3" fill="#c0432f"/><text x="287.503" y="116.44" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287.503" dy="0">1 353</tspan></text><text x="231.417" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="231.417" dy="0">Sin bloqueo: arranques solapados</tspan></text><rect x="396.677" y="342.52" width="108.173" height="32.48" rx="3" fill="#087f8c"/><text x="450.763" y="336.52" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="450.763" dy="0">174</tspan></text><rect x="508.85" y="293.053" width="108.173" height="81.9467" rx="3" fill="#c0432f"/><text x="562.937" y="287.053" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="562.937" dy="0">439</tspan></text><text x="506.85" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="506.85" dy="0">Omitir si sigue activo: ejecuciones</tspan></text><text x="506.85" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="506.85" dy="0">omitidas</tspan></text><rect x="672.11" y="360.253" width="108.173" height="14.7467" rx="3" fill="#087f8c"/><text x="726.197" y="354.253" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="726.197" dy="0">79</tspan></text><rect x="784.283" y="267.48" width="108.173" height="107.52" rx="3" fill="#c0432f"/><text x="838.37" y="261.48" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="838.37" dy="0">576</tspan></text><text x="782.283" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.283" dy="0">Encolar en orden: retraso máximo de</tspan></text><text x="782.283" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.283" dy="0">inicio (s)</tspan></text><rect x="10" y="444" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="468.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Ninguna política arregla un trabajo que tarda más que su periodo: elige entre solapar (riesgo de corromper datos), omitir</tspan></text><text x="470" y="485.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">(datos que no se procesan) o encolar (retraso que crece). La señal para actuar es la proporción de ejecuciones que superan</tspan></text><text x="470" y="502.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">el periodo, no el promedio.</tspan></text><text x="470" y="549.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación con semilla 223: duraciones lognormales con sigma 0,35; supuestos del autor, no mediciones de un sistema.</tspan></text></svg>
