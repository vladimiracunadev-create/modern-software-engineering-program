<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 329" width="980" height="329" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">1 000 trabajos, 35 venenosos y 110 con un fallo transitorio, con presupuesto de 3 000 intentos</title><desc id="d">Tabla: reintentar sin límite un trabajo venenoso colocado al frente consume el presupuesto de 3 000 intentos y completa solo 6 trabajos; ponerlo al final completa 965 pero deja 35 venenosos circulando; limitar a tres intentos con cola de muertos completa 965 con 1 214 intentos y aparta los 35.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="329" fill="#ffffff"/><rect x="10" y="12" width="364" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="192" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="192" dy="0">Política</tspan></text><rect x="380" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="442" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="442" dy="0">Completados</tspan></text><rect x="510" y="12" width="174" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="597" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="597" dy="0">En cola de muertos</tspan></text><rect x="690" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="752" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="752" dy="0">Intentos</tspan></text><rect x="820" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="892" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="892" dy="0">Sin procesar</tspan></text><rect x="10" y="56" width="364" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="85.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Reintentar sin límite, al frente de la cola</tspan></text><rect x="380" y="56" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">6</tspan></text><rect x="510" y="56" width="174" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">0</tspan></text><rect x="690" y="56" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">3 000</tspan></text><rect x="820" y="56" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="892" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">994</tspan></text><rect x="10" y="114" width="364" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="143.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Reintentar sin límite, al final de la cola</tspan></text><rect x="380" y="114" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">965</tspan></text><rect x="510" y="114" width="174" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">0</tspan></text><rect x="690" y="114" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">3 000</tspan></text><rect x="820" y="114" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="892" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">35</tspan></text><rect x="10" y="172" width="364" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="201.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Máximo 3 intentos y cola de muertos</tspan></text><rect x="380" y="172" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">965</tspan></text><rect x="510" y="172" width="174" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">35</tspan></text><rect x="690" y="172" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">1 214</tspan></text><rect x="820" y="172" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="892" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">0</tspan></text><rect x="10" y="234" width="960" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="490" y="258.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Un solo trabajo que siempre falla, reintentado al frente de la cola, bloquea al resto: 994 trabajos sanos quedaron sin procesar.</tspan></text><text x="490" y="275.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Un límite de intentos y un lugar donde esperan los fallidos convierten un bloqueo en una lista de revisión.</tspan></text><text x="490" y="315.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Simulación con semilla 23; tasas del 3 % y del 10 % son supuestos del autor.</tspan></text></svg>
