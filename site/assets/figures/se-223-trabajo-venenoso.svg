<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 374" width="940" height="374" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">1 000 trabajos, 35 venenosos y 110 con un fallo transitorio, con presupuesto de 3 000 intentos</title><desc id="d">Barras apiladas con el destino de 1 000 trabajos según la política de reintento: reintentar sin límite al frente de la cola completa 6 y deja 994 sin procesar; al final de la cola completa 965 y deja 35 sin procesar; limitar a tres intentos con cola de muertos completa 965 y aparta los 35 venenosos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="374" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">1 000 trabajos, 35 venenosos y 110 con un fallo transitorio, con presupuesto de 3 000 intentos</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Completados</tspan></text><rect x="146.94" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="166.94" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="166.94" dy="0">En cola de muertos</tspan></text><rect x="330.66" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="350.66" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="350.66" dy="0">Sin procesar</tspan></text><line x1="324" y1="77" x2="324" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="209" x2="324" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="434.34" y1="77" x2="434.34" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="434.34" y1="209" x2="434.34" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="434.34" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="434.34" dy="0">200</tspan></text><line x1="544.68" y1="77" x2="544.68" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="544.68" y1="209" x2="544.68" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="544.68" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="544.68" dy="0">400</tspan></text><line x1="655.02" y1="77" x2="655.02" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="655.02" y1="209" x2="655.02" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="655.02" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="655.02" dy="0">600</tspan></text><line x1="765.36" y1="77" x2="765.36" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="765.36" y1="209" x2="765.36" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="765.36" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="765.36" dy="0">800</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="209" x2="875.7" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">1 000</tspan></text><line x1="324" y1="209" x2="875.7" y2="209" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="95" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Reintentar sin límite, al frente de la</tspan></text><text x="314" y="112" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">cola</tspan></text><text x="314" y="139" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Reintentar sin límite, al final de la</tspan></text><text x="314" y="156" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">cola</tspan></text><text x="314" y="191.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Máximo 3 intentos y cola de muertos</tspan></text><rect x="324" y="84" width="3.3102" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="327.31" y="84" width="0" height="30" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><rect x="327.31" y="84" width="548.39" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="601.505" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="601.505" dy="0">994</tspan></text><text x="882.7" y="103.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">1 000</tspan></text><rect x="324" y="128" width="532.39" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="590.195" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="590.195" dy="0">965</tspan></text><rect x="856.39" y="128" width="0" height="30" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><rect x="856.39" y="128" width="19.3095" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="147.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">1 000</tspan></text><rect x="324" y="172" width="532.39" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="590.195" y="191.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="590.195" dy="0">965</tspan></text><rect x="856.39" y="172" width="19.3095" height="30" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><rect x="875.7" y="172" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="191.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">1 000</tspan></text><text x="599.85" y="253" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="599.85" dy="0">Trabajos</tspan></text><rect x="10" y="267" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="291.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Un solo trabajo que siempre falla, reintentado al frente de la cola, bloquea al resto: 994 trabajos sanos quedaron sin</tspan></text><text x="470" y="308.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">procesar. Un límite de intentos y un lugar donde esperan los fallidos convierten un bloqueo en una lista de revisión.</tspan></text><text x="470" y="356.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación con semilla 23; tasas del 3 % y del 10 % son supuestos del autor.</tspan></text></svg>
