<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 587" width="1050" height="587" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Caídas en cada paso de un lote de 20 filas (40 escenarios por estrategia)</title><desc id="d">Tabla: seis estrategias de escritura con 40 escenarios de caída; reescribir en el sitio termina bien pero deja un archivo incompleto visible; anexar sin control duplica en 38; marcar después duplica en 19; marcar antes pierde en 40; anexar con clave y escribir a un temporal con reemplazo atómico terminan correctas, y solo la última no deja nunca un archivo incompleto.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1050" height="587" fill="#ffffff"/><rect x="10" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="157" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="157" dy="0">Estrategia</tspan></text><rect x="310" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="402" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="402" dy="0">Resultados finales</tspan></text><text x="402" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="402" dy="0">incorrectos</tspan></text><rect x="500" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="602" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="602" dy="0">Veces que un lector vio</tspan></text><text x="602" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="602" dy="0">un archivo incompleto</tspan></text><rect x="710" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="872" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="872" dy="0">Qué pasó</tspan></text><rect x="10" y="56" width="294" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="92.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">A. Reescribir en el sitio</tspan></text><rect x="310" y="56" width="184" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="92.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">0</tspan></text><rect x="500" y="56" width="204" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="92.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">40</tspan></text><rect x="710" y="56" width="324" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="84.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">El resultado final es correcto, pero durante</tspan></text><text x="872" y="100.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">la caída hay un archivo vacío o incompleto</tspan></text><rect x="10" y="128" width="294" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="164.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">B. Anexar sin punto de control</tspan></text><rect x="310" y="128" width="184" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="164.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">38</tspan></text><rect x="500" y="128" width="204" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="164.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">40</tspan></text><rect x="710" y="128" width="324" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="164.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">38 reanudaciones duplican filas</tspan></text><rect x="10" y="200" width="294" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="236.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">C. Anexar y marcar después</tspan></text><rect x="310" y="200" width="184" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="236.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">19</tspan></text><rect x="500" y="200" width="204" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="236.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">40</tspan></text><rect x="710" y="200" width="324" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="228.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">La caída entre escribir y marcar duplica una</tspan></text><text x="872" y="244.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">fila</tspan></text><rect x="10" y="272" width="294" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="308.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">D. Marcar antes de anexar</tspan></text><rect x="310" y="272" width="184" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="308.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">40</tspan></text><rect x="500" y="272" width="204" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="308.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">40</tspan></text><rect x="710" y="272" width="324" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="308.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">Todas las reanudaciones pierden una fila</tspan></text><rect x="10" y="344" width="294" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="380.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">E. Anexar con clave de fila</tspan></text><rect x="310" y="344" width="184" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="380.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">0</tspan></text><rect x="500" y="344" width="204" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="380.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">40</tspan></text><rect x="710" y="344" width="324" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="380.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">Correcto: repetir no cambia el resultado</tspan></text><rect x="10" y="416" width="294" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="452.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">F. Temporal y os.replace</tspan></text><rect x="310" y="416" width="184" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="452.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">0</tspan></text><rect x="500" y="416" width="204" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="452.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">0</tspan></text><rect x="710" y="416" width="324" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="452.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">Correcto y nunca visible a medias</tspan></text><rect x="10" y="492" width="1030" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="525" y="516.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="525" dy="0">Reanudar sin más información o duplica o pierde, según el orden de escribir y marcar. La salida correcta combina dos ideas distintas: una</tspan></text><text x="525" y="533.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="525" dy="0">clave que hace repetible cada fila (E) y un reemplazo atómico que oculta el trabajo a medias (F).</tspan></text><text x="525" y="573.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="525" dy="0">Exhaustivo: 20 puntos de caída × 2 variantes; idéntico en Windows y Ubuntu.</tspan></text></svg>
