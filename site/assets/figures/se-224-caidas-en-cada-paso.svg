<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 626" width="940" height="626" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Caídas en cada paso de un lote de 20 filas (40 escenarios por estrategia)</title><desc id="d">Barras horizontales con las caídas de 40 escenarios por estrategia de escritura: anexar sin punto de control deja 38 resultados incorrectos, marcar después 19 y marcar antes 40; reescribir en el sitio, anexar con clave y marcar antes deja 40 escenarios con un lector que vio un archivo incompleto; solo el temporal con os.replace no lo muestra nunca.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="626" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Caídas en cada paso de un lote de 20 filas (40 escenarios por estrategia)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Resultados finales incorrectos</tspan></text><rect x="290.2" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="310.2" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="310.2" dy="0">Veces que un lector vio un archivo incompleto</tspan></text><line x1="274" y1="77" x2="274" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="461" x2="274" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0</tspan></text><line x1="430.47" y1="77" x2="430.47" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="430.47" y1="461" x2="430.47" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="430.47" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="430.47" dy="0">10</tspan></text><line x1="586.94" y1="77" x2="586.94" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="586.94" y1="461" x2="586.94" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="586.94" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="586.94" dy="0">20</tspan></text><line x1="743.41" y1="77" x2="743.41" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="743.41" y1="461" x2="743.41" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="743.41" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="743.41" dy="0">30</tspan></text><line x1="899.88" y1="77" x2="899.88" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="899.88" y1="461" x2="899.88" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="899.88" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="899.88" dy="0">40</tspan></text><line x1="274" y1="461" x2="899.88" y2="461" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="113.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">A. Reescribir en el sitio</tspan></text><text x="264" y="177.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">B. Anexar sin punto de control</tspan></text><text x="264" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">C. Anexar y marcar después</tspan></text><text x="264" y="305.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">D. Marcar antes de anexar</tspan></text><text x="264" y="369.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">E. Anexar con clave de fila</tspan></text><text x="264" y="433.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">F. Temporal y os.replace</tspan></text><rect x="274" y="83" width="2" height="24.5" rx="3" fill="#c0432f"/><text x="283" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="283" dy="0">0</tspan></text><rect x="274" y="110.5" width="625.88" height="24.5" rx="3" fill="#946512"/><text x="906.88" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="906.88" dy="0">40</tspan></text><rect x="274" y="147" width="594.586" height="24.5" rx="3" fill="#c0432f"/><text x="875.586" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="875.586" dy="0">38</tspan></text><rect x="274" y="174.5" width="625.88" height="24.5" rx="3" fill="#946512"/><text x="906.88" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="906.88" dy="0">40</tspan></text><rect x="274" y="211" width="297.293" height="24.5" rx="3" fill="#c0432f"/><text x="578.293" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="578.293" dy="0">19</tspan></text><rect x="274" y="238.5" width="625.88" height="24.5" rx="3" fill="#946512"/><text x="906.88" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="906.88" dy="0">40</tspan></text><rect x="274" y="275" width="625.88" height="24.5" rx="3" fill="#c0432f"/><text x="906.88" y="291.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="906.88" dy="0">40</tspan></text><rect x="274" y="302.5" width="625.88" height="24.5" rx="3" fill="#946512"/><text x="906.88" y="319.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="906.88" dy="0">40</tspan></text><rect x="274" y="339" width="2" height="24.5" rx="3" fill="#c0432f"/><text x="283" y="355.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="283" dy="0">0</tspan></text><rect x="274" y="366.5" width="625.88" height="24.5" rx="3" fill="#946512"/><text x="906.88" y="383.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="906.88" dy="0">40</tspan></text><rect x="274" y="403" width="2" height="24.5" rx="3" fill="#c0432f"/><text x="283" y="419.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="283" dy="0">0</tspan></text><rect x="274" y="430.5" width="2" height="24.5" rx="3" fill="#946512"/><text x="283" y="447.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="283" dy="0">0</tspan></text><text x="586.94" y="505" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="586.94" dy="0">Escenarios de caída, de 40</tspan></text><rect x="10" y="519" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="543.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Reanudar sin más información o duplica o pierde, según el orden de escribir y marcar. La salida correcta combina dos ideas</tspan></text><text x="470" y="560.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">distintas: una clave que hace repetible cada fila (E) y un reemplazo atómico que oculta el trabajo a medias (F).</tspan></text><text x="470" y="608.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Exhaustivo: 20 puntos de caída × 2 variantes; idéntico en Windows y Ubuntu.</tspan></text></svg>
