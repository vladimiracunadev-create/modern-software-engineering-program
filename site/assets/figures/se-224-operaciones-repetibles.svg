<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 477" width="1050" height="477" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una ejecución frente a tres: qué operaciones se pueden repetir</title><desc id="d">Tabla de siete operaciones ejecutadas una y tres veces: anexar, incrementar y enviar un aviso no son idempotentes; fijar un valor, el upsert por clave, crear si falta y enviar un aviso con clave de idempotencia sí lo son.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1050" height="477" fill="#ffffff"/><rect x="10" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Operación</tspan></text><rect x="390" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="497" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="497" dy="0">Tras 1 ejecución</tspan></text><rect x="610" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="727" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="727" dy="0">Tras 3 ejecuciones</tspan></text><rect x="850" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="942" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="942" dy="0">Idempotente</tspan></text><rect x="10" y="56" width="374" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="79.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Anexar una línea</tspan></text><rect x="390" y="56" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="497" y="79.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="497" dy="0">1 línea</tspan></text><rect x="610" y="56" width="234" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="79.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">3 líneas iguales</tspan></text><rect x="850" y="56" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="942" y="79.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="942" dy="0">No</tspan></text><rect x="10" y="102" width="374" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="125.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Fijar un valor</tspan></text><rect x="390" y="102" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="497" y="125.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="497" dy="0">nota = ent-1</tspan></text><rect x="610" y="102" width="234" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="125.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">nota = ent-1</tspan></text><rect x="850" y="102" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="942" y="125.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="942" dy="0">Sí</tspan></text><rect x="10" y="148" width="374" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="171.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Incrementar un contador</tspan></text><rect x="390" y="148" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="497" y="171.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="497" dy="0">1</tspan></text><rect x="610" y="148" width="234" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="171.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">3</tspan></text><rect x="850" y="148" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="942" y="171.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="942" dy="0">No</tspan></text><rect x="10" y="194" width="374" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="217.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Upsert por clave</tspan></text><rect x="390" y="194" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="497" y="217.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="497" dy="0">1 entrada</tspan></text><rect x="610" y="194" width="234" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="217.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">1 entrada</tspan></text><rect x="850" y="194" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="942" y="217.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="942" dy="0">Sí</tspan></text><rect x="10" y="240" width="374" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="263.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Crear si falta</tspan></text><rect x="390" y="240" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="497" y="263.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="497" dy="0">1 borrador</tspan></text><rect x="610" y="240" width="234" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="263.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">1 borrador</tspan></text><rect x="850" y="240" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="942" y="263.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="942" dy="0">Sí</tspan></text><rect x="10" y="286" width="374" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="309.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Enviar un aviso (efecto externo)</tspan></text><rect x="390" y="286" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="497" y="309.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="497" dy="0">1 aviso</tspan></text><rect x="610" y="286" width="234" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="309.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">3 avisos</tspan></text><rect x="850" y="286" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="942" y="309.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="942" dy="0">No</tspan></text><rect x="10" y="332" width="374" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="355.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Enviar un aviso con clave de idempotencia</tspan></text><rect x="390" y="332" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="497" y="355.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="497" dy="0">1 aviso</tspan></text><rect x="610" y="332" width="234" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="355.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">1 aviso</tspan></text><rect x="850" y="332" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="942" y="355.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="942" dy="0">Sí</tspan></text><rect x="10" y="382" width="1030" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="525" y="406.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="525" dy="0">La misma intención —«registrar la nota»— es idempotente como «fijar» y no lo es como «anexar». El efecto externo (un aviso) solo se vuelve</tspan></text><text x="525" y="423.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="525" dy="0">repetible cuando se acompaña de una clave que el receptor recuerda.</tspan></text><text x="525" y="463.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="525" dy="0">Simulación local en memoria; sin servicios reales; idéntica en ambos sistemas.</tspan></text></svg>
