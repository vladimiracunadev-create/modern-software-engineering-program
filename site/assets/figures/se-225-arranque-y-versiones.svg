<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 421" width="1050" height="421" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Coste de arrancar y de ordenar versiones</title><desc id="d">Tabla: el arranque mínimo de Python tardó 281 milisegundos en Windows y 44 en Ubuntu; un zipapp de 167 bytes añadió poco al arranque; ordenar diez versiones como cadenas coloca seis en posición equivocada, por ejemplo 1.10.0 antes que 1.2.0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1050" height="421" fill="#ffffff"/><rect x="10" y="12" width="444" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="232" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="232" dy="0">Qué se mide</tspan></text><rect x="460" y="12" width="284" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="602" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="602" dy="0">Windows (mediana de 15)</tspan></text><rect x="750" y="12" width="284" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="892" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="892" dy="0">Ubuntu (mediana de 15)</tspan></text><rect x="10" y="56" width="444" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="81.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">python -c pass</tspan></text><rect x="460" y="56" width="284" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">281 ms</tspan></text><rect x="750" y="56" width="284" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="892" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">44 ms</tspan></text><rect x="10" y="106" width="444" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="131.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">python -I -S -c pass (sin sitio ni usuario)</tspan></text><rect x="460" y="106" width="284" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">100 ms</tspan></text><rect x="750" y="106" width="284" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="892" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">17 ms</tspan></text><rect x="10" y="156" width="444" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="181.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">python notas.pyz (zipapp de 167 B)</tspan></text><rect x="460" y="156" width="284" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">267 ms</tspan></text><rect x="750" y="156" width="284" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="892" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">36 ms</tspan></text><rect x="10" y="206" width="444" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="231.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">python app/ (directorio con __main__)</tspan></text><rect x="460" y="206" width="284" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">235 ms</tspan></text><rect x="750" y="206" width="284" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="892" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">29 ms</tspan></text><rect x="10" y="256" width="444" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="281.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Orden de 10 versiones como cadenas</tspan></text><rect x="460" y="256" width="284" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="281.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">6 posiciones mal</tspan></text><rect x="750" y="256" width="284" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="892" y="281.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">6 posiciones mal</tspan></text><rect x="10" y="310" width="1030" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="525" y="334.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="525" dy="0">Empaquetar en un zipapp no cambia el arranque de forma apreciable: el intérprete domina. Lo que sí cambia es la corrección: 1.10.0 &lt; 1.2.0</tspan></text><text x="525" y="351.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="525" dy="0">al ordenar como texto, y una actualización que «ve» una versión anterior como más nueva no se instala. Comparar versiones con tuplas</tspan></text><text x="525" y="368.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="525" dy="0">numéricas.</tspan></text><text x="525" y="407.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="525" dy="0">Un equipo; el antivirus y la caché de archivos afectan al arranque en Windows y no se controlaron.</tspan></text></svg>
