<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 514" width="940" height="514" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Coste de arrancar y de ordenar versiones</title><desc id="d">Barras horizontales con la mediana de 15 arranques de Python en Windows y en Ubuntu: el arranque mínimo tarda 281 ms y 44 ms; sin sitio ni usuario 100 ms y 17 ms; un zipapp de 167 bytes 267 ms y 36 ms; un directorio con archivo principal 235 ms y 29 ms; el sistema operativo pesa más que el empaquetado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="514" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Coste de arrancar y de ordenar versiones</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Windows</tspan></text><rect x="116.78" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="136.78" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="136.78" dy="0">Ubuntu (WSL2)</tspan></text><line x1="294" y1="77" x2="294" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="333" x2="294" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">0</tspan></text><line x1="493.273" y1="77" x2="493.273" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="493.273" y1="333" x2="493.273" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="493.273" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="493.273" dy="0">100</tspan></text><line x1="692.547" y1="77" x2="692.547" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="692.547" y1="333" x2="692.547" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="692.547" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692.547" dy="0">200</tspan></text><line x1="891.82" y1="77" x2="891.82" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="891.82" y1="333" x2="891.82" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="891.82" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="891.82" dy="0">300</tspan></text><line x1="294" y1="333" x2="891.82" y2="333" stroke="#5b7280" stroke-width="1.6"/><text x="284" y="113.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">python -c pass</tspan></text><text x="284" y="169" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">python -I -S -c pass (sin sitio ni</tspan></text><text x="284" y="186" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">usuario)</tspan></text><text x="284" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">python notas.pyz (zipapp de 167 B)</tspan></text><text x="284" y="305.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">python app/ (directorio con __main__)</tspan></text><rect x="294" y="83" width="559.958" height="24.5" rx="3" fill="#c0432f"/><text x="860.958" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="860.958" dy="0">281</tspan></text><rect x="294" y="110.5" width="87.6803" height="24.5" rx="3" fill="#087f8c"/><text x="388.68" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="388.68" dy="0">44</tspan></text><rect x="294" y="147" width="199.273" height="24.5" rx="3" fill="#c0432f"/><text x="500.273" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="500.273" dy="0">100</tspan></text><rect x="294" y="174.5" width="33.8765" height="24.5" rx="3" fill="#087f8c"/><text x="334.876" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="334.876" dy="0">17</tspan></text><rect x="294" y="211" width="532.06" height="24.5" rx="3" fill="#c0432f"/><text x="833.06" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="833.06" dy="0">267</tspan></text><rect x="294" y="238.5" width="71.7384" height="24.5" rx="3" fill="#087f8c"/><text x="372.738" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="372.738" dy="0">36</tspan></text><rect x="294" y="275" width="468.292" height="24.5" rx="3" fill="#c0432f"/><text x="769.292" y="291.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="769.292" dy="0">235</tspan></text><rect x="294" y="302.5" width="57.7893" height="24.5" rx="3" fill="#087f8c"/><text x="358.789" y="319.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="358.789" dy="0">29</tspan></text><text x="592.91" y="377" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="592.91" dy="0">Mediana de 15 arranques (ms)</tspan></text><rect x="10" y="391" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="415.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Empaquetar en un zipapp no cambia el arranque de forma apreciable: el intérprete domina. Lo que sí cambia es la corrección:</tspan></text><text x="470" y="432.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">1.10.0 &lt; 1.2.0 al ordenar como texto, y una actualización que «ve» una versión anterior como más nueva no se instala.</tspan></text><text x="470" y="449.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Comparar versiones con tuplas numéricas.</tspan></text><text x="470" y="496.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Un equipo; el antivirus y la caché de archivos afectan al arranque en Windows y no se controlaron.</tspan></text></svg>
