<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 379" width="900" height="379" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Instalaciones únicas (de 5 000) según cuántos atributos «inocuos» se combinan</title><desc id="d">Barras: con 5 000 instalaciones sintéticas, combinar 1 o 2 atributos como sistema, versión o idioma no deja a nadie único; con 3 es único el 0,5 por ciento, con 4 el 7,1, con 5 el 31,2 y con los 6 atributos es único el 67,5 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="900" height="379" fill="#ffffff"/><text x="190" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="190" dy="0">1 atributo</tspan></text><rect x="200" y="16" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="212" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="212" dy="0">0,0 %</tspan></text><text x="190" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="190" dy="0">2 atributos</tspan></text><rect x="200" y="60" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="212" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="212" dy="0">0,0 %</tspan></text><text x="190" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="190" dy="0">3 atributos</tspan></text><rect x="200" y="104" width="4.5" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="212.5" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="212.5" dy="0">0,5 %</tspan></text><text x="190" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="190" dy="0">4 atributos</tspan></text><rect x="200" y="148" width="63.9" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="271.9" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="271.9" dy="0">7,1 %</tspan></text><text x="190" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="190" dy="0">5 atributos</tspan></text><rect x="200" y="192" width="280.8" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="488.8" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="488.8" dy="0">31,2 %</tspan></text><text x="190" y="255.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="190" dy="0">6 atributos</tspan></text><rect x="200" y="236" width="607.5" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="815.5" y="255.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="815.5" dy="0">67,5 %</tspan></text><rect x="10" y="284" width="880" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="450" y="308.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">Ningún atributo identifica a nadie por sí solo, pero la combinación sí: con los seis atributos dos de cada tres</tspan></text><text x="450" y="325.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">instalaciones quedan únicas. El riesgo no está en cada campo sino en juntar campos en un mismo registro.</tspan></text><text x="450" y="365.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">Distribuciones y atributos inventados con semilla 226: la proporción real de un producto dependería de sus datos.</tspan></text></svg>
