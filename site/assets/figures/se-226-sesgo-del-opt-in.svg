<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 263" width="1000" height="263" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Adopción de una función estimada solo con quienes aceptan telemetría</title><desc id="d">Barras: en una población sintética de 100 000 donde 22 por ciento adopta la función, quienes aceptan telemetría son sobre todo usuarios intensivos y la estimación es 52,8 por ciento, 30,8 puntos de sesgo; si aceptaran igual todos los grupos la estimación sería 22,0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="263" fill="#ffffff"/><text x="420" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Adopción real de la función</tspan></text><rect x="430" y="16" width="132" height="28" rx="3" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="570" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="570" dy="0">22,0 %</tspan></text><text x="420" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Estimada con opt-in sesgado (40 % / 4 %)</tspan></text><rect x="430" y="60" width="316.8" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="754.8" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="754.8" dy="0">52,8 %</tspan></text><text x="420" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Estimada con opt-in no sesgado (10 % / 10 %)</tspan></text><rect x="430" y="104" width="132" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="570" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="570" dy="0">22,0 %</tspan></text><rect x="10" y="152" width="980" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="500" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Con más de 11 000 participantes el intervalo era de 52,0 a 53,6: más datos no corrigen el sesgo, solo lo hacen más seguro. El ruido</tspan></text><text x="500" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">de Laplace (epsilon 1) sobre un conteo agregado costó 1 % de error con n = 100 y 0,01 % con n = 10 000: la privacidad diferencial</tspan></text><text x="500" y="210.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">es barata a escala y no arregla quién participa.</tspan></text><text x="500" y="249.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Población sintética de 100 000 con semilla 226; las tasas de aceptación y de adopción son supuestos del autor.</tspan></text></svg>
