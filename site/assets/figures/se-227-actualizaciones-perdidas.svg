<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 307" width="1000" height="307" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Actualizaciones perdidas de 450: tres procesos incrementan un contador guardado en un archivo</title><desc id="d">Barras: tres procesos que incrementan 150 veces cada uno un contador en un archivo pierden en mediana 427 de las 450 actualizaciones en Windows y 443 en Ubuntu cuando no hay bloqueo, y 0 en ambos con un archivo de bloqueo creado en exclusiva.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="307" fill="#ffffff"/><text x="400" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Sin bloqueo, Windows (mediana de 5)</tspan></text><rect x="410" y="16" width="384.3" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="802.3" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="802.3" dy="0">427 perdidas</tspan></text><text x="400" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Sin bloqueo, Ubuntu (mediana de 5)</tspan></text><rect x="410" y="60" width="398.7" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="816.7" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="816.7" dy="0">443 perdidas</tspan></text><text x="400" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Con bloqueo O_EXCL, Windows</tspan></text><rect x="410" y="104" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="422" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="422" dy="0">0</tspan></text><text x="400" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Con bloqueo O_EXCL, Ubuntu</tspan></text><rect x="410" y="148" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="422" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="422" dy="0">0</tspan></text><rect x="10" y="196" width="980" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="500" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">Las pérdidas no son 1 o 2: casi todas, porque leer, sumar y escribir sin exclusión hace que cada proceso sobrescriba al otro (y</tspan></text><text x="500" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">abrir con «w» vacía el archivo antes de que otro lo lea). El bloqueo exclusivo corrigió todas las repeticiones, pero un bloqueo que</tspan></text><text x="500" y="254.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">sobrevive a un proceso muerto exige detectar bloqueos viejos.</tspan></text><text x="500" y="293.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Cinco repeticiones por sistema; las cifras varían entre ejecuciones (Windows 404–438, Ubuntu 442–448).</tspan></text></svg>
