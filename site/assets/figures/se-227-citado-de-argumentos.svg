gumentos</tspan></text><rect x="10" y="56" width="244" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="79.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">a b.txt</tspan></text><rect x="260" y="56" width="244" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="382" y="79.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382" dy="0">Mal</tspan></text><rect x="510" y="56" width="244" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="79.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">Mal</tspan></text><rect x="760" y="56" width="274" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="897" y="79.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="897" dy="0">Bien</tspan></text><rect x="10" y="102" width="244" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="125.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">x;echo INYECTADO</tspan></text><rect x="260" y="102" width="244" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="382" y="125.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382" dy="0">Mal</tspan></text><rect x="510" y="102" width="244" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="125.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">Inyección</tspan></text><rect x="760" y="102" width="274" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="897" y="125.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="897" dy="0">Bien</tspan></text><rect x="10" y="148" width="244" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="171.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">x&amp;echo INYECTADO</tspan></text><rect x="260" y="148" width="244" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="382" y="171.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382" dy="0">Inyección</tspan></text><rect x="510" y="148" width="244" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="171.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">Inyección</tspan></text><rect x="760" y="148" width="274" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="897" y="171.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="897" dy="0">Bien</tspan></text><rect x="10" y="194" width="244" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="217.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">$HOME.txt</tspan></text><rect x="260" y="194" width="244" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="382" y="217.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382" dy="0">Bien</tspan></text><rect x="510" y="194" width="244" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="217.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">Mal (se expande)</tspan></text><rect x="760" y="194" width="274" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="897" y="217.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="897" dy="0">Bien</tspan></text><rect x="10" y="240" width="244" height="40" rx="10" fill="#ffffff" strok