t-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">a|b.txt</tspan></text><rect x="260" y="332" width="244" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="382" y="355.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382" dy="0">Mal</tspan></text><rect x="510" y="332" width="244" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="355.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">Mal</tspan></text><rect x="760" y="332" width="274" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="897" y="355.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="897" dy="0">Bien</tspan></text><rect x="10" y="378" width="244" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="401.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">ñandú.txt</tspan></text><rect x="260" y="378" width="244" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="382" y="401.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382" dy="0">Mal (codificación)</tspan></text><rect x="510" y="378" width="244" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="401.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">Bien</tspan></text><rect x="760" y="378" width="274" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="897" y="401.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="897" dy="0">Windows: mal por la codificación</tspan></text><rect x="10" y="428" width="1030" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="525" y="452.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="525" dy="0">La misma cadena se interpreta distinto según el shell. Con una lista de argumentos el sistema no reinterpreta nada. El único fallo</tspan></text><text x="525" y="469.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="525" dy="0">restante (ñandú en Windows) es de otra naturaleza: la salida del hijo se escribió en la codificación local y el padre la leyó como UTF-8.</tspan></text><text x="525" y="509.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="525" dy="0">Doce nombres de prueba; el comando ejecutado es un script que imprime sus argumentos, sin tocar archivos reales.</tspan></text></svg>
