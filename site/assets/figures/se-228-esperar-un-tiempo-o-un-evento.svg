<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 335" width="1100" height="335" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Falsos fallos de una prueba que arranca un proceso: esperar un tiempo o esperar un evento</title><desc id="d">Barras: una prueba que espera 0,35 segundos a que un proceso diga que está listo falló 1 de 20 veces en Windows sin carga y 20 de 20 con 16 procesos ocupando la CPU; esperar el evento no falló nunca; en Ubuntu con carga falló 0 y 4 veces en dos ejecuciones.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1100" height="335" fill="#ffffff"/><text x="520" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="520" dy="0">Espera fija de 0,35 s, Windows sin carga</tspan></text><rect x="530" y="16" width="18" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="556" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="556" dy="0">1 de 20</tspan></text><text x="520" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="520" dy="0">Espera fija de 0,35 s, Windows con 16 procesos ocupados</tspan></text><rect x="530" y="60" width="360" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="898" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="898" dy="0">20 de 20</tspan></text><text x="520" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="520" dy="0">Espera por evento, Windows con carga</tspan></text><rect x="530" y="104" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="542" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="542" dy="0">0 de 20</tspan></text><text x="520" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="520" dy="0">Espera fija de 0,35 s, Ubuntu con carga (dos ejecuciones)</tspan></text><rect x="530" y="148" width="72" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="610" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="610" dy="0">0 y 4 de 20</tspan></text><text x="520" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="520" dy="0">Espera por evento, Ubuntu con carga</tspan></text><rect x="530" y="192" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="542" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="542" dy="0">0 de 20</tspan></text><rect x="10" y="240" width="1080" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="550" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="550" dy="0">El proceso era correcto siempre: lo que fallaba era la suposición de cuánto tarda en arrancar. Una prueba que depende de un tiempo mide la carga</tspan></text><text x="550" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="550" dy="0">de la máquina; una que espera la señal de que el servicio está listo (con un límite generoso) mide el servicio.</tspan></text><text x="550" y="321.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="550" dy="0">Mediciones en un equipo con 8 procesadores lógicos; los falsos fallos varían entre ejecuciones y se leen como orden de magnitud.</tspan></text></svg>
