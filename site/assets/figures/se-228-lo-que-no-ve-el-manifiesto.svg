<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 247" width="1000" height="247" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un validador de manifiesto de operabilidad: lo que ve y lo que no</title><desc id="d">Barras: de 102 mutantes de un manifiesto de 17 campos el validador estructural detecta los 102; pero acepta las 5 afirmaciones falsas con forma válida, como declarar SIGTERM sin manejarlo o publicar un hash sha256 que en realidad es md5.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="247" fill="#ffffff"/><text x="420" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Mutantes del manifiesto (borrar, tipo, valor)</tspan></text><rect x="430" y="16" width="428.4" height="28" rx="3" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="866.4" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="866.4" dy="0">102</tspan></text><text x="420" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Detectados por el validador estructural</tspan></text><rect x="430" y="60" width="428.4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="866.4" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="866.4" dy="0">102</tspan></text><text x="420" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Afirmaciones falsas con forma válida (de 5)</tspan></text><rect x="430" y="104" width="21" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="459" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="459" dy="0">5 aceptadas</tspan></text><rect x="10" y="152" width="980" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="500" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Un manifiesto completo no prueba una herramienta operable: el validador comprueba presencia, tipos y valores, no que la herramienta</tspan></text><text x="500" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">haga lo que declara. Por eso el manifiesto remite a pruebas de contrato por cada afirmación y a evidencia por plataforma.</tspan></text><text x="500" y="233.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Mutantes con semilla 228 (60 pares de campos borrados); las cinco afirmaciones falsas son ejemplos escritos por el autor.</tspan></text></svg>
