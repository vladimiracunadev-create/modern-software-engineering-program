<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 582" width="940" height="582" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Trece pruebas de contrato sobre la herramienta de referencia y seis defectos inyectados</title><desc id="d">Barras horizontales con las pruebas de contrato, de trece, que fallan en cada variante: la herramienta de referencia falla 1 en la primera ejecución (las abreviaturas no se heredan en los subcomandos) y 0 tras corregirla; cada uno de los seis defectos inyectados lo detectan de 1 a 3 pruebas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="582" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Trece pruebas de contrato sobre la herramienta de referencia y seis defectos inyectados</tspan></text><line x1="284" y1="49" x2="284" y2="401" stroke="#d5dde1" stroke-width="1"/><line x1="284" y1="401" x2="284" y2="406" stroke="#5b7280" stroke-width="1.4"/><text x="284" y="422" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="284" dy="0">0</tspan></text><line x1="439.985" y1="49" x2="439.985" y2="401" stroke="#d5dde1" stroke-width="1"/><line x1="439.985" y1="401" x2="439.985" y2="406" stroke="#5b7280" stroke-width="1.4"/><text x="439.985" y="422" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="439.985" dy="0">1</tspan></text><line x1="595.97" y1="49" x2="595.97" y2="401" stroke="#d5dde1" stroke-width="1"/><line x1="595.97" y1="401" x2="595.97" y2="406" stroke="#5b7280" stroke-width="1.4"/><text x="595.97" y="422" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="595.97" dy="0">2</tspan></text><line x1="751.955" y1="49" x2="751.955" y2="401" stroke="#d5dde1" stroke-width="1"/><line x1="751.955" y1="401" x2="751.955" y2="406" stroke="#5b7280" stroke-width="1.4"/><text x="751.955" y="422" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="751.955" dy="0">3</tspan></text><line x1="907.94" y1="49" x2="907.94" y2="401" stroke="#d5dde1" stroke-width="1"/><line x1="907.94" y1="401" x2="907.94" y2="406" stroke="#5b7280" stroke-width="1.4"/><text x="907.94" y="422" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907.94" dy="0">4</tspan></text><line x1="284" y1="401" x2="907.94" y2="401" stroke="#5b7280" stroke-width="1.6"/><text x="274" y="67" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Herramienta limpia, primera</tspan></text><text x="274" y="84" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">ejecución</tspan></text><text x="274" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Herramienta corregida</tspan></text><text x="274" y="163.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">entorno_gana</tspan></text><text x="274" y="207.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">error_en_stdout</tspan></text><text x="274" y="251.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">salida_1_generica</tspan></text><text x="274" y="295.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">escritura_directa</tspan></text><text x="274" y="339.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">traceback_utf8</tspan></text><text x="274" y="383.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">abreviaturas</tspan></text><rect x="284" y="55" width="155.985" height="32" rx="3" fill="#c0432f"/><text x="446.985" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="446.985" dy="0">1</tspan></text><rect x="284" y="99" width="2" height="32" rx="3" fill="#c0432f"/><text x="293" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="293" dy="0">0</tspan></text><rect x="284" y="143" width="155.985" height="32" rx="3" fill="#c0432f"/><text x="446.985" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="446.985" dy="0">1</tspan></text><rect x="284" y="187" width="311.97" height="32" rx="3" fill="#c0432f"/><text x="602.97" y="207.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="602.97" dy="0">2</tspan></text><rect x="284" y="231" width="467.955" height="32" rx="3" fill="#c0432f"/><text x="758.955" y="251.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="758.955" dy="0">3</tspan></text><rect x="284" y="275" width="155.985" height="32" rx="3" fill="#c0432f"/><text x="446.985" y="295.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="446.985" dy="0">1</tspan></text><rect x="284" y="319" width="155.985" height="32" rx="3" fill="#c0432f"/><text x="446.985" y="339.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="446.985" dy="0">1</tspan></text><rect x="284" y="363" width="155.985" height="32" rx="3" fill="#c0432f"/><text x="446.985" y="383.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="446.985" dy="0">1</tspan></text><text x="595.97" y="445" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="595.97" dy="0">Pruebas de contrato que fallan, de 13</tspan></text><rect x="10" y="459" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="483.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">La suite se probó a sí misma: cada defecto inyectado fue detectado por al menos una prueba, y antes de eso encontró un</tspan></text><text x="470" y="500.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">defecto real de la herramienta que no se había inyectado. Ninguno de los seis defectos fue visible en las pruebas del</tspan></text><text x="470" y="517.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">camino feliz (T01, T02, T05): cayeron en errores, precedencia y escritura.</tspan></text><text x="470" y="564.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Resultados idénticos en Windows y Ubuntu; la herramienta es sintética (notas.py) y no es un producto.</tspan></text></svg>
