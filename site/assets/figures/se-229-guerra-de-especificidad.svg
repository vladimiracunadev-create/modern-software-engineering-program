<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 333" width="1040" height="333" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Guerra de especificidad: subir el selector frente a ordenar con capas</title><desc id="d">Tabla: con 50, 200 y 800 peticiones de sobrescribir estilos sobre 40 elementos, escalar la especificidad llega a selectores de 4, 7 y 18 clases y a 0, 18 y 315 reglas que superan las cuatro clases, mientras que ordenar con capas mantiene una clase.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1040" height="333" fill="#ffffff"/><rect x="10" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="107" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="107" dy="0">Peticiones de cambio</tspan></text><rect x="210" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="347" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="347" dy="0">Selector más largo al escalar</tspan></text><rect x="490" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="627" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="627" dy="0">Reglas que superan 4 clases</tspan></text><rect x="770" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="897" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="897" dy="0">Selector más largo con capas</tspan></text><rect x="10" y="56" width="194" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="83.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">50</tspan></text><rect x="210" y="56" width="274" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="347" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="347" dy="0">4 clases</tspan></text><rect x="490" y="56" width="274" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="627" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="627" dy="0">0</tspan></text><rect x="770" y="56" width="254" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="897" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="897" dy="0">1 clase</tspan></text><rect x="10" y="110" width="194" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="137.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">200</tspan></text><rect x="210" y="110" width="274" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="347" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="347" dy="0">7 clases</tspan></text><rect x="490" y="110" width="274" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="627" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="627" dy="0">18</tspan></text><rect x="770" y="110" width="254" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="897" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="897" dy="0">1 clase</tspan></text><rect x="10" y="164" width="194" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="191.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">800</tspan></text><rect x="210" y="164" width="274" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="347" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="347" dy="0">18 clases</tspan></text><rect x="490" y="164" width="274" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="627" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="627" dy="0">315</tspan></text><rect x="770" y="164" width="254" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="897" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="897" dy="0">1 clase</tspan></text><rect x="10" y="222" width="1020" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="520" y="246.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="520" dy="0">La calculadora de especificidad usada acertó los 11 ejemplos de la especificación de Selectores (incluidos :where, que suma 0, y :is, que</tspan></text><text x="520" y="263.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="520" dy="0">suma su argumento más específico). La simulación supone que la mitad de las nuevas reglas llegan antes que la que deben vencer; el valor</tspan></text><text x="520" y="280.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="520" dy="0">exacto depende de ese supuesto.</tspan></text><text x="520" y="319.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="520" dy="0">Modelo con supuestos del autor, semilla fija; no es una medición de un navegador ni de usuarios reales.</tspan></text></svg>
