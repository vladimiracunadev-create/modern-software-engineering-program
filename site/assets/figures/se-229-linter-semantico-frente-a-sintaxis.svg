"/><text x="471.276" y="501.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="471.276" dy="0">14</tspan></text><rect x="628.552" y="484" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="635.552" y="501.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="635.552" dy="0">14</tspan></text><text x="594.85" y="561" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="594.85" dy="0">Mutaciones aplicadas</tspan></text><rect x="10" y="575" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="599.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">200 de 220 mutaciones detectadas por reglas; 0 por el balance de etiquetas, que no distingue ninguna de las once. Las 20</tspan></text><text x="470" y="616.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">sin detectar son textos alternativos que cambian de significado pero siguen siendo texto: solo una persona que mira la</tspan></text><text x="470" y="633.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">imagen lo nota.</tspan></text><text x="470" y="680.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
