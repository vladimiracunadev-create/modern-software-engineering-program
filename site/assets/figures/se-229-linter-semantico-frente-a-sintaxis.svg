<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 698" width="940" height="698" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Linter semántico frente a validar solo que el HTML esté bien formado</title><desc id="d">Barras apiladas horizontales con las 220 mutaciones de una página semántica en once tipos: un linter con ocho reglas detecta 200 y no detecta las 20 con alt engañoso; comprobar solo el balance de etiquetas no detecta ninguna.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="698" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Linter semántico frente a validar solo que el HTML esté bien formado</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Detectadas por el linter</tspan></text><rect x="244.96" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="264.96" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="264.96" dy="0">No detectadas</tspan></text><line x1="314" y1="77" x2="314" y2="517" stroke="#d5dde1" stroke-width="1"/><line x1="314" y1="517" x2="314" y2="522" stroke="#5b7280" stroke-width="1.4"/><text x="314" y="538" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="314" dy="0">0</tspan></text><line x1="426.34" y1="77" x2="426.34" y2="517" stroke="#d5dde1" stroke-width="1"/><line x1="426.34" y1="517" x2="426.34" y2="522" stroke="#5b7280" stroke-width=