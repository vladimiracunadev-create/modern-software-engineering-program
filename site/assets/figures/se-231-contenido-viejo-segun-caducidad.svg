<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 363" width="940" height="363" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Regeneración por caducidad: cuántas visitas ven una página desactualizada</title><desc id="d">Tabla: con una página que cambia 0,2 veces por hora y 30 visitas por hora, una caducidad de 6 minutos deja 0,7 por ciento de las visitas con contenido viejo, 1 hora 8,3, 6 horas 39,2 y 24 horas 76,9, con edades medias de 0,03 a 9,88 horas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="363" fill="#ffffff"/><rect x="10" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="157" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="157" dy="0">Caducidad antes de regenerar</tspan></text><rect x="310" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="457" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="457" dy="0">Visitas con contenido viejo</tspan></text><rect x="610" y="12" width="314" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="767" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="767" dy="0">Antigüedad media del cambio</tspan></text><rect x="10" y="56" width="294" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="82.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">6 minutos</tspan></text><rect x="310" y="56" width="294" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="82.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">0,7 %</tspan></text><rect x="610" y="56" width="314" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="82.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">0,03 h</tspan></text><rect x="10" y="108" width="294" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="134.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">1 hora</tspan></text><rect x="310" y="108" width="294" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="134.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">8,3 %</tspan></text><rect x="610" y="108" width="314" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="134.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">0,34 h</tspan></text><rect x="10" y="160" width="294" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="186.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">6 horas</tspan></text><rect x="310" y="160" width="294" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="186.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">39,2 %</tspan></text><rect x="610" y="160" width="314" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="186.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">2,15 h</tspan></text><rect x="10" y="212" width="294" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="238.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">24 horas</tspan></text><rect x="310" y="212" width="294" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="238.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">76,9 %</tspan></text><rect x="610" y="212" width="314" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="238.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">9,88 h</tspan></text><rect x="10" y="268" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="292.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Simulación de 2000 h con cambios de Poisson (0,2 por hora) y visitas de Poisson (30 por hora); regenerar al pedir tras</tspan></text><text x="470" y="309.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">caducar. Regenerar más a menudo cuesta compilaciones: este experimento no mide ese coste, solo la obsolescencia.</tspan></text><text x="470" y="349.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con supuestos del autor, semilla fija; no es una medición de un navegador ni de usuarios reales.</tspan></text></svg>
