<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 483" width="980" height="483" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reconciliar una lista de 1000 elementos: clave por posición frente a clave por identidad</title><desc id="d">Tabla de seis cambios en una lista de 1000 elementos: la clave por posición actualiza hasta 1000 nodos y asocia mal el estado local de hasta 1000, mientras que la clave por identidad crea, borra o mueve solo lo necesario y no asocia mal ningún estado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="483" fill="#ffffff"/><rect x="10" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="112" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="112" dy="0">Cambio en la lista</tspan></text><rect x="220" y="12" width="284" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="362" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="362" dy="0">Clave = posición</tspan></text><rect x="510" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="602" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="602" dy="0">Clave = identidad</tspan></text><rect x="700" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="832" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="832" dy="0">Estado mal asociado (posición /</tspan></text><text x="832" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="832" dy="0">identidad)</tspan></text><rect x="10" y="56" width="204" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="82.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">Insertar al inicio</tspan></text><rect x="220" y="56" width="284" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">1000 actualizar + 1 crear</tspan></text><rect x="510" y="56" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">1 crear</tspan></text><rect x="700" y="56" width="264" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">1000 / 0</tspan></text><rect x="10" y="108" width="204" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="134.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">Borrar el primero</tspan></text><rect x="220" y="108" width="284" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">999 actualizar + 1 borrar</tspan></text><rect x="510" y="108" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">1 borrar</tspan></text><rect x="700" y="108" width="264" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">999 / 0</tspan></text><rect x="10" y="160" width="204" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="186.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">Añadir al final</tspan></text><rect x="220" y="160" width="284" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">1 crear</tspan></text><rect x="510" y="160" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">1 crear</tspan></text><rect x="700" y="160" width="264" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">0 / 0</tspan></text><rect x="10" y="212" width="204" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="238.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">Intercambiar dos</tspan></text><rect x="220" y="212" width="284" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="238.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">2 actualizar</tspan></text><rect x="510" y="212" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="238.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">2 mover</tspan></text><rect x="700" y="212" width="264" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="238.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">2 / 0</tspan></text><rect x="10" y="264" width="204" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="290.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">Invertir</tspan></text><rect x="220" y="264" width="284" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="290.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">1000 actualizar</tspan></text><rect x="510" y="264" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="290.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">999 mover</tspan></text><rect x="700" y="264" width="264" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="290.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">1000 / 0</tspan></text><rect x="10" y="316" width="204" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="342.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">Barajar</tspan></text><rect x="220" y="316" width="284" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="342.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">1000 actualizar</tspan></text><rect x="510" y="316" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="342.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">943 mover</tspan></text><rect x="700" y="316" width="264" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="342.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">1000 / 0</tspan></text><rect x="10" y="372" width="960" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="490" y="396.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">El estado local mal asociado es, por ejemplo, el texto escrito en un campo de la fila 3 que pasa a estar junto a otro elemento.</tspan></text><text x="490" y="413.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">Los movimientos de la clave por identidad usan la subsecuencia creciente más larga; los marcos reales emplean heurísticas</tspan></text><text x="490" y="430.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">parecidas pero no idénticas.</tspan></text><text x="490" y="469.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
