<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 659" width="940" height="659" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reconciliar una lista de 1000 elementos: clave por posición frente a clave por identidad</title><desc id="d">Barras horizontales con los elementos de estado local mal asociado en seis cambios de una lista de 1000: con clave por posición 1000 al insertar al inicio, 999 al borrar el primero, 0 al añadir al final, 2 al intercambiar, 1000 al invertir y 1000 al barajar; con clave por identidad ninguno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="659" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Reconciliar una lista de 1000 elementos: clave por posición frente a clave por identidad</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Clave = posición</tspan></text><rect x="184.64" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="204.64" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="204.64" dy="0">Clave = identidad</tspan></text><line x1="184" y1="77" x2="184" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="184" y1="461" x2="184" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="184" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="184" dy="0">0</tspan></text><line x1="322.34" y1="77" x2="322.34" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="322.34" y1="461" x2="322.34" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="322.34" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="322.34" dy="0">200</tspan></text><line x1="460.68" y1="77" x2="460.68" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="460.68" y1="461" x2="460.68" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="460.68" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="460.68" dy="0">400</tspan></text><line x1="599.02" y1="77" x2="599.02" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="599.02" y1="461" x2="599.02" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="599.02" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="599.02" dy="0">600</tspan></text><line x1="737.36" y1="77" x2="737.36" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="737.36" y1="461" x2="737.36" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="737.36" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737.36" dy="0">800</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="461" x2="875.7" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">1 000</tspan></text><line x1="184" y1="461" x2="875.7" y2="461" stroke="#5b7280" stroke-width="1.6"/><text x="174" y="113.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="174" dy="0">Insertar al inicio</tspan></text><text x="174" y="177.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="174" dy="0">Borrar el primero</tspan></text><text x="174" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="174" dy="0">Añadir al final</tspan></text><text x="174" y="305.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="174" dy="0">Intercambiar dos</tspan></text><text x="174" y="369.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="174" dy="0">Invertir</tspan></text><text x="174" y="433.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="174" dy="0">Barajar</tspan></text><rect x="184" y="83" width="691.7" height="24.5" rx="3" fill="#c0432f"/><text x="882.7" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">1 000</tspan></text><rect x="184" y="110.5" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="193" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="193" dy="0">0</tspan></text><rect x="184" y="147" width="691.008" height="24.5" rx="3" fill="#c0432f"/><text x="882.008" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.008" dy="0">999</tspan></text><rect x="184" y="174.5" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="193" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="193" dy="0">0</tspan></text><rect x="184" y="211" width="2" height="24.5" rx="3" fill="#c0432f"/><text x="193" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="193" dy="0">0</tspan></text><rect x="184" y="238.5" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="193" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="193" dy="0">0</tspan></text><rect x="184" y="275" width="2" height="24.5" rx="3" fill="#c0432f"/><text x="193" y="291.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="193" dy="0">2</tspan></text><rect x="184" y="302.5" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="193" y="319.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="193" dy="0">0</tspan></text><rect x="184" y="339" width="691.7" height="24.5" rx="3" fill="#c0432f"/><text x="882.7" y="355.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">1 000</tspan></text><rect x="184" y="366.5" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="193" y="383.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="193" dy="0">0</tspan></text><rect x="184" y="403" width="691.7" height="24.5" rx="3" fill="#c0432f"/><text x="882.7" y="419.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">1 000</tspan></text><rect x="184" y="430.5" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="193" y="447.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="193" dy="0">0</tspan></text><text x="529.85" y="505" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="529.85" dy="0">Elementos con estado local mal asociado</tspan></text><rect x="10" y="519" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="543.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Operaciones por cambio: la posición actualiza hasta 1000 nodos (insertar al inicio: 1000 actualizar + 1 crear); la</tspan></text><text x="470" y="560.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">identidad crea, borra o mueve solo lo necesario (1 crear, 1 borrar, 0, 2 mover, 999 mover, 943 mover). El estado local mal</tspan></text><text x="470" y="577.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">asociado es, por ejemplo, el texto escrito en un campo de la fila 3 que pasa a estar junto a otro elemento. Los marcos</tspan></text><text x="470" y="593.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">reales emplean heurísticas parecidas pero no idénticas.</tspan></text><text x="470" y="641.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
