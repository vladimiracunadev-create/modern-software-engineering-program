<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 782" width="940" height="782" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Seis validadores de correo frente a un corpus de 64 direcciones etiquetadas por el autor</title><desc id="d">Barras horizontales con las direcciones que acierta cada validador: ordinarias aceptadas de 30, internacionalizadas aceptadas de 4 e inválidas rechazadas de 30; ninguno acierta los tres grupos, los laxos aceptan casi todo y el ASCII estricto rechaza 14 válidas y las 4 internacionalizadas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="782" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Seis validadores de correo frente a un corpus de 64 direcciones etiquetadas por el autor</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Acepta ordinarias (de 30)</tspan></text><rect x="252.5" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="272.5" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="272.5" dy="0">Acepta internacionalizadas (de 4)</tspan></text><rect x="549.32" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="569.32" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="569.32" dy="0">Rechaza inválidas (de 30)</tspan></text><line x1="324" y1="77" x2="324" y2="617" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="617" x2="324" y2="622" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="638" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="515.96" y1="77" x2="515.96" y2="617" stroke="#d5dde1" stroke-width="1"/><line x1="515.96" y1="617" x2="515.96" y2="622" stroke="#5b7280" stroke-width="1.4"/><text x="515.96" y="638" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="515.96" dy="0">10</tspan></text><line x1="707.92" y1="77" x2="707.92" y2="617" stroke="#d5dde1" stroke-width="1"/><line x1="707.92" y1="617" x2="707.92" y2="622" stroke="#5b7280" stroke-width="1.4"/><text x="707.92" y="638" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707.92" dy="0">20</tspan></text><line x1="899.88" y1="77" x2="899.88" y2="617" stroke="#d5dde1" stroke-width="1"/><line x1="899.88" y1="617" x2="899.88" y2="622" stroke="#5b7280" stroke-width="1.4"/><text x="899.88" y="638" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="899.88" dy="0">30</tspan></text><line x1="324" y1="617" x2="899.88" y2="617" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="126.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Solo comprobar que hay una @</tspan></text><text x="314" y="216.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Texto antes y después de la @</tspan></text><text x="314" y="306.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Expresión simple con punto en el dominio</tspan></text><text x="314" y="396.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Expresión ASCII estricta</tspan></text><text x="314" y="486.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Expresión de la especificación HTML</tspan></text><text x="314" y="568" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Especificación HTML más reglas de puntos</tspan></text><text x="314" y="585" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">y longitudes</tspan></text><rect x="324" y="83" width="575.88" height="24" rx="3" fill="#087f8c"/><text x="906.88" y="99.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="906.88" dy="0">30</tspan></text><rect x="324" y="110" width="76.784" height="24" rx="3" fill="#102a43"/><text x="407.784" y="126.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="407.784" dy="0">4</tspan></text><rect x="324" y="137" width="19.196" height="24" rx="3" fill="#c0432f"/><text x="350.196" y="153.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="350.196" dy="0">1</tspan></text><rect x="324" y="173" width="575.88" height="24" rx="3" fill="#087f8c"/><text x="906.88" y="189.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="906.88" dy="0">30</tspan></text><rect x="324" y="200" width="76.784" height="24" rx="3" fill="#102a43"/><text x="407.784" y="216.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="407.784" dy="0">4</tspan></text><rect x="324" y="227" width="57.588" height="24" rx="3" fill="#c0432f"/><text x="388.588" y="243.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="388.588" dy="0">3</tspan></text><rect x="324" y="263" width="575.88" height="24" rx="3" fill="#087f8c"/><text x="906.88" y="279.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="906.88" dy="0">30</tspan></text><rect x="324" y="290" width="76.784" height="24" rx="3" fill="#102a43"/><text x="407.784" y="306.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="407.784" dy="0">4</tspan></text><rect x="324" y="317" width="249.548" height="24" rx="3" fill="#c0432f"/><text x="580.548" y="333.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="580.548" dy="0">13</tspan></text><rect x="324" y="353" width="307.136" height="24" rx="3" fill="#087f8c"/><text x="638.136" y="369.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="638.136" dy="0">16</tspan></text><rect x="324" y="380" width="2" height="24" rx="3" fill="#102a43"/><text x="333" y="396.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">0</tspan></text><rect x="324" y="407" width="422.312" height="24" rx="3" fill="#c0432f"/><text x="753.312" y="423.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="753.312" dy="0">22</tspan></text><rect x="324" y="443" width="575.88" height="24" rx="3" fill="#087f8c"/><text x="906.88" y="459.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="906.88" dy="0">30</tspan></text><rect x="324" y="470" width="2" height="24" rx="3" fill="#102a43"/><text x="333" y="486.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">0</tspan></text><rect x="324" y="497" width="460.704" height="24" rx="3" fill="#c0432f"/><text x="791.704" y="513.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="791.704" dy="0">24</tspan></text><rect x="324" y="533" width="575.88" height="24" rx="3" fill="#087f8c"/><text x="906.88" y="549.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="906.88" dy="0">30</tspan></text><rect x="324" y="560" width="2" height="24" rx="3" fill="#102a43"/><text x="333" y="576.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">0</tspan></text><rect x="324" y="587" width="575.88" height="24" rx="3" fill="#c0432f"/><text x="906.88" y="603.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="906.88" dy="0">30</tspan></text><text x="611.94" y="661" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="611.94" dy="0">Direcciones</tspan></text><rect x="10" y="675" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="699.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Ningún validador puede saber si un buzón existe: solo un mensaje enviado y confirmado lo prueba. El corpus y sus etiquetas</tspan></text><text x="470" y="716.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">son del autor; con otro corpus las cifras cambian.</tspan></text><text x="470" y="764.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
