<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 318" width="940" height="318" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Resolver rutas: coste de buscar y ambigüedad según el orden de declaración</title><desc id="d">Barras horizontales con el coste medio de resolver una consulta entre 500 rutas: 288,2 comparaciones con búsqueda lineal y 3,61 pasos con un árbol de segmentos; con cuatro rutas, solo 6 de las 24 órdenes de declaración resuelven bien nuevo y el parámetro id.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="318" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Resolver rutas: coste de buscar y ambigüedad según el orden de declaración</tspan></text><line x1="324" y1="49" x2="324" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="137" x2="324" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="505.213" y1="49" x2="505.213" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="505.213" y1="137" x2="505.213" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="505.213" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="505.213" dy="0">100</tspan></text><line x1="686.427" y1="49" x2="686.427" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="686.427" y1="137" x2="686.427" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="686.427" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="686.427" dy="0">200</tspan></text><line x1="867.64" y1="49" x2="867.64" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="867.64" y1="137" x2="867.64" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="867.64" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867.64" dy="0">300</tspan></text><line x1="324" y1="137" x2="867.64" y2="137" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="67" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Búsqueda lineal en 500 rutas (20 000</tspan></text><text x="314" y="84" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">consultas)</tspan></text><text x="314" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Árbol de segmentos (mismas consultas)</tspan></text><rect x="324" y="55" width="522.257" height="32" rx="3" fill="#102a43"/><text x="853.257" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="853.257" dy="0">288,20</tspan></text><rect x="324" y="99" width="6.5418" height="32" rx="3" fill="#102a43"/><text x="337.542" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="337.542" dy="0">3,61</tspan></text><text x="595.82" y="181" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="595.82" dy="0">Comparaciones o pasos por consulta</tspan></text><rect x="10" y="195" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="219.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Con cuatro rutas /u/:id y /u/nuevo, solo 6 de las 24 órdenes de declaración resuelven bien; ordenadas por especificidad, el</tspan></text><text x="470" y="236.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">resultado es correcto. El árbol y la lista devolvieron la misma ruta en las 2000 consultas comparadas. La ambigüedad no es</tspan></text><text x="470" y="253.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">un fallo de rendimiento sino de diseño: /u/nuevo coincide con /u/:id y gana la primera declarada.</tspan></text><text x="470" y="300.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
