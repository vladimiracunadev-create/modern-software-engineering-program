<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 379" width="960" height="379" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Resolver rutas: coste de buscar y ambigüedad según el orden de declaración</title><desc id="d">Tabla: encontrar la ruta de una consulta cuesta en promedio 288,2 comparaciones recorriendo 500 rutas en lista y 3,61 pasos con un árbol de segmentos; con cuatro rutas, solo 6 de las 24 órdenes de declaración resuelven bien tanto nuevo como el parámetro id, y ordenarlas por especificidad lo resuelve.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="379" fill="#ffffff"/><rect x="10" y="12" width="464" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="242" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="242" dy="0">Situación</tspan></text><rect x="480" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="592" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="592" dy="0">Coste medio por consulta</tspan></text><rect x="710" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="827" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="827" dy="0">Orden de declaración</tspan></text><rect x="10" y="56" width="464" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="84.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Búsqueda lineal en 500 rutas (20 000 consultas)</tspan></text><rect x="480" y="56" width="224" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="84.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">288,2 comparaciones</tspan></text><rect x="710" y="56" width="234" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="84.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">—</tspan></text><rect x="10" y="112" width="464" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="140.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Árbol de segmentos (mismas consultas)</tspan></text><rect x="480" y="112" width="224" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="140.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">3,61 pasos</tspan></text><rect x="710" y="112" width="234" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="140.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">—</tspan></text><rect x="10" y="168" width="464" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="196.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">4 rutas /u/:id y /u/nuevo en orden arbitrario</tspan></text><rect x="480" y="168" width="224" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="196.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">—</tspan></text><rect x="710" y="168" width="234" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="196.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">6 de 24 órdenes resuelven bien</tspan></text><rect x="10" y="224" width="464" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="252.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Las mismas 4 rutas ordenadas por especificidad</tspan></text><rect x="480" y="224" width="224" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="252.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">—</tspan></text><rect x="710" y="224" width="234" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="252.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">correcto</tspan></text><rect x="10" y="284" width="940" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="308.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">El árbol y la lista devolvieron la misma ruta en las 2000 consultas comparadas. La ambigüedad no es un fallo de rendimiento</tspan></text><text x="480" y="325.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">sino de diseño: /u/nuevo coincide con /u/:id y gana la primera declarada.</tspan></text><text x="480" y="365.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
