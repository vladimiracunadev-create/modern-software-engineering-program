<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 335" width="1060" height="335" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">URLs distintas para 200 recursos con 12 variantes cada uno, según el nivel de normalización</title><desc id="d">Barras: 2400 URLs que escriben 200 recursos de doce maneras se reducen a 1600 al normalizar la sintaxis, a 1000 al ordenar parámetros y quitar fragmento y marcas utm y a 400 con una política de barra final e index punto html; los 400 son 200 recursos con y sin filtro.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1060" height="335" fill="#ffffff"/><text x="470" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">URLs distintas sin normalizar</tspan></text><rect x="480" y="16" width="480" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="968" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="968" dy="0">2400</tspan></text><text x="470" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">Tras normalizar sintaxis (RFC 3986)</tspan></text><rect x="480" y="60" width="320" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="808" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="808" dy="0">1600</tspan></text><text x="470" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">Tras ordenar parámetros y quitar fragmento y utm</tspan></text><rect x="480" y="104" width="200" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="688" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="688" dy="0">1000</tspan></text><text x="470" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">Tras política de barra final e index.html</tspan></text><rect x="480" y="148" width="80" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="568" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="568" dy="0">400</tspan></text><text x="470" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">Recursos reales (200) y sus 200 variantes con filtro</tspan></text><rect x="480" y="192" width="80" height="28" rx="3" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="568" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="568" dy="0">400</tspan></text><rect x="10" y="240" width="1040" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="530" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="530" dy="0">Cada nivel es una decisión: las mayúsculas del host se pueden igualar, las de la ruta no (un servidor puede distinguirlas) y quitar utm</tspan></text><text x="530" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="530" dy="0">cambia lo que se mide. La normalización de sintaxis no sabe qué dos rutas devuelven lo mismo.</tspan></text><text x="530" y="321.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="530" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
