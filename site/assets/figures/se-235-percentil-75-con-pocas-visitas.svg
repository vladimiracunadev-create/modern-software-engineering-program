<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 317" width="980" height="317" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Estimar el percentil 75 de una métrica con pocas visitas: intervalo y falsa conformidad</title><desc id="d">Tabla: con una población sintética de mediana 2000 milisegundos y percentil 75 verdadero de 2802, estimar el percentil 75 con 30 visitas da un intervalo de 95 por ciento de 2139 a 3500 y declara cumplido un presupuesto de 2500 en 22 por ciento de las repeticiones, con 300 visitas en 0,1 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="317" fill="#ffffff"/><rect x="10" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="132" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="132" dy="0">Tamaño de la muestra</tspan></text><rect x="260" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="372" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="372" dy="0">p75 estimado (media)</tspan></text><rect x="490" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="612" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="612" dy="0">Intervalo central del 95 %</tspan></text><rect x="740" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="852" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="852" dy="0">Dice cumplir 2500 ms</tspan></text><text x="852" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="852" dy="0">(falso)</tspan></text><rect x="10" y="56" width="244" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="83.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">30 visitas</tspan></text><rect x="260" y="56" width="224" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="372" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372" dy="0">2772 ms</tspan></text><rect x="490" y="56" width="244" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="612" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612" dy="0">2139 – 3500 ms</tspan></text><rect x="740" y="56" width="224" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">22,0 %</tspan></text><rect x="10" y="110" width="244" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="137.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">300 visitas</tspan></text><rect x="260" y="110" width="224" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="372" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372" dy="0">2804 ms</tspan></text><rect x="490" y="110" width="244" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="612" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612" dy="0">2597 – 3024 ms</tspan></text><rect x="740" y="110" width="224" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">0,1 %</tspan></text><rect x="10" y="164" width="244" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="191.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">3000 visitas</tspan></text><rect x="260" y="164" width="224" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="372" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372" dy="0">2800 ms</tspan></text><rect x="490" y="164" width="244" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="612" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612" dy="0">2745 – 2862 ms</tspan></text><rect x="740" y="164" width="224" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">0,0 %</tspan></text><rect x="10" y="222" width="960" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="490" y="246.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">Población lognormal con mediana 2000 ms y σ = 0,5: media 2266, p75 2802, p95 4552. Con 30 visitas una de cada cinco veces se</tspan></text><text x="490" y="263.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">concluye, erróneamente, que el presupuesto se cumple. Los valores reales de usuarios no son lognormales ni independientes.</tspan></text><text x="490" y="303.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Modelo con supuestos del autor, semilla fija; no es una medición de un navegador ni de usuarios reales.</tspan></text></svg>
