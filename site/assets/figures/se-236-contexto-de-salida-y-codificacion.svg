<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 564" width="940" height="564" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">De 16 cargas maliciosas o legítimas, cuántas se vuelven código según el contexto de salida</title><desc id="d">Barras agrupadas con las cargas de 16 que se ejecutan según el contexto: sin codificar 5 en texto, 1 en atributo con comillas, 3 sin comillas, 3 en href y 6 en un script; el escape HTML genérico deja 4 en atributo sin comillas y 2 en href, y en un script deforma el texto; la codificación adecuada deja 0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="564" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">De 16 cargas maliciosas o legítimas, cuántas se vuelven código según el contexto de salida</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Sin codificar</tspan></text><rect x="162.02" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="182.02" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="182.02" dy="0">Escape HTML genérico</tspan></text><line x1="63.54" y1="355" x2="920" y2="355" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="355" x2="63.54" y2="355" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="359.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">0</tspan></text><line x1="63.54" y1="268.333" x2="920" y2="268.333" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="268.333" x2="63.54" y2="268.333" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="272.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">2</tspan></text><line x1="63.54" y1="181.667" x2="920" y2="181.667" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="181.667" x2="63.54" y2="181.667" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="186.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">4</tspan></text><line x1="63.54" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="95" x2="63.54" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">6</tspan></text><line x1="63.54" y1="95" x2="63.54" y2="355" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="225" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 225)">Cargas que se ejecutan (de 16)</text><rect x="80.6692" y="138.333" width="66.5168" height="216.667" rx="3" fill="#c0432f"/><text x="113.928" y="132.333" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="113.928" dy="0">5</tspan></text><rect x="151.186" y="353" width="66.5168" height="2" rx="3" fill="#946512"/><text x="184.444" y="347" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="184.444" dy="0">0</tspan></text><text x="149.186" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="149.186" dy="0">Texto dentro de un</tspan></text><text x="149.186" y="393" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="149.186" dy="0">elemento</tspan></text><rect x="251.961" y="311.667" width="66.5168" height="43.3333" rx="3" fill="#c0432f"/><text x="285.22" y="305.667" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="285.22" dy="0">1</tspan></text><rect x="322.478" y="353" width="66.5168" height="2" rx="3" fill="#946512"/><text x="355.736" y="347" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="355.736" dy="0">0</tspan></text><text x="320.478" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="320.478" dy="0">Atributo entre</tspan></text><text x="320.478" y="393" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="320.478" dy="0">comillas dobles</tspan></text><rect x="423.253" y="225" width="66.5168" height="130" rx="3" fill="#c0432f"/><text x="456.512" y="219" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="456.512" dy="0">3</tspan></text><rect x="493.77" y="181.667" width="66.5168" height="173.333" rx="3" fill="#946512"/><text x="527.028" y="175.667" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="527.028" dy="0">4</tspan></text><text x="491.77" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="491.77" dy="0">Atributo sin comillas</tspan></text><rect x="594.545" y="225" width="66.5168" height="130" rx="3" fill="#c0432f"/><text x="627.804" y="219" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="627.804" dy="0">3</tspan></text><rect x="665.062" y="268.333" width="66.5168" height="86.6667" rx="3" fill="#946512"/><text x="698.32" y="262.333" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="698.32" dy="0">2</tspan></text><text x="663.062" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="663.062" dy="0">Valor de href</tspan></text><rect x="765.837" y="95" width="66.5168" height="260" rx="3" fill="#c0432f"/><text x="799.096" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="799.096" dy="0">6</tspan></text><rect x="836.354" y="353" width="66.5168" height="2" rx="3" fill="#946512"/><text x="869.612" y="347" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="869.612" dy="0">0</tspan></text><text x="834.354" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="834.354" dy="0">Cadena dentro de un</tspan></text><text x="834.354" y="393" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="834.354" dy="0">script</tspan></text><rect x="10" y="424" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="448.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Con la codificación adecuada para cada contexto se ejecutan 0 en todos. En un script, el escape HTML genérico muestra 0</tspan></text><text x="470" y="465.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">porque deforma la cadena. Escapar dos veces produce texto visible roto: ana &amp;amp; co pasó a ana &amp;amp;amp; co. La detección</tspan></text><text x="470" y="482.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">usa un analizador de HTML y, para el script, una regla de ruptura de cadena: es una comprobación acotada de 16 cargas, no</tspan></text><text x="470" y="498.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">una auditoría de seguridad.</tspan></text><text x="470" y="546.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
