<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 435" width="970" height="435" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">De 16 cargas maliciosas o legítimas, cuántas se vuelven código según el contexto de salida</title><desc id="d">Tabla: sin codificar, entre 1 y 6 de 16 cargas útiles se ejecutan según el contexto; el escape HTML basta en el texto, no en atributos sin comillas ni en href, y en un script deforma el texto; cada contexto necesita su propia codificación.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="435" fill="#ffffff"/><rect x="10" y="12" width="284" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="152" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="152" dy="0">Dónde se escribe el dato</tspan></text><rect x="300" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="362" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="362" dy="0">Sin codificar</tspan></text><rect x="430" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="527" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="527" dy="0">Escape HTML genérico</tspan></text><rect x="630" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="792" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="792" dy="0">Codificación adecuada</tspan></text><rect x="10" y="56" width="284" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="84.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="152" dy="0">Texto dentro de un elemento</tspan></text><rect x="300" y="56" width="124" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="84.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">5</tspan></text><rect x="430" y="56" width="194" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="84.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">0</tspan></text><rect x="630" y="56" width="324" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="84.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">Escape HTML: 0</tspan></text><rect x="10" y="112" width="284" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="140.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="152" dy="0">Atributo entre comillas dobles</tspan></text><rect x="300" y="112" width="124" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="140.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">1</tspan></text><rect x="430" y="112" width="194" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="140.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">0</tspan></text><rect x="630" y="112" width="324" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="140.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">Escape HTML con comillas: 0</tspan></text><rect x="10" y="168" width="284" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="196.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="152" dy="0">Atributo sin comillas</tspan></text><rect x="300" y="168" width="124" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="196.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">3</tspan></text><rect x="430" y="168" width="194" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="196.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">4</tspan></text><rect x="630" y="168" width="324" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="196.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">Poner comillas y escapar: 0</tspan></text><rect x="10" y="224" width="284" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="252.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="152" dy="0">Valor de href</tspan></text><rect x="300" y="224" width="124" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="252.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">3</tspan></text><rect x="430" y="224" width="194" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="252.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">2</tspan></text><rect x="630" y="224" width="324" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="244.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">Escapar y permitir solo http, https y mailto:</tspan></text><text x="792" y="260.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">0</tspan></text><rect x="10" y="280" width="284" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="308.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="152" dy="0">Cadena dentro de un script</tspan></text><rect x="300" y="280" width="124" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="308.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">6</tspan></text><rect x="430" y="280" width="194" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="308.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">0 (cadena deformada)</tspan></text><rect x="630" y="280" width="324" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="308.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">JSON con &lt; &gt; &amp; escapados: 0</tspan></text><rect x="10" y="340" width="950" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="485" y="364.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">Escapar dos veces produce texto visible roto: ana &amp;amp; co pasó a ana &amp;amp;amp; co. La detección usa un analizador de HTML y,</tspan></text><text x="485" y="381.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">para el script, una regla de ruptura de cadena: es una comprobación acotada de 16 cargas, no una auditoría de seguridad.</tspan></text><text x="485" y="421.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
