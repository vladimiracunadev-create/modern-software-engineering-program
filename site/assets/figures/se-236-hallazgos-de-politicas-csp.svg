<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 335" width="1060" height="335" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Hallazgos de un linter de políticas CSP sobre cinco políticas de ejemplo</title><desc id="d">Barras: un evaluador simplificado de script-src acertó 16 de 16 casos de prueba y un linter encontró 4 hallazgos en la ausencia de política, 6 en una política laxa, 3 en una con https: amplio y 0 en dos políticas restrictivas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1060" height="335" fill="#ffffff"/><text x="470" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">Sin política</tspan></text><rect x="480" y="16" width="220" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="708" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="708" dy="0">4 hallazgos</tspan></text><text x="470" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">Laxa: * con unsafe-inline y unsafe-eval</tspan></text><rect x="480" y="60" width="330" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="818" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="818" dy="0">6 hallazgos</tspan></text><text x="470" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">self con https: y object-src none</tspan></text><rect x="480" y="104" width="165" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="653" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="653" dy="0">3 hallazgos</tspan></text><text x="470" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">self con nonce, object, base y frame-ancestors</tspan></text><rect x="480" y="148" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="492" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="492" dy="0">0 hallazgos</tspan></text><text x="470" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">default-src none y permisos mínimos</tspan></text><rect x="480" y="192" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="492" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="492" dy="0">0 hallazgos</tspan></text><rect x="10" y="240" width="1040" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="530" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="530" dy="0">Los hallazgos son reglas escritas por el autor sobre una política de pocas directivas. El evaluador no implementa strict-dynamic, hashes,</tspan></text><text x="530" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="530" dy="0">trusted types ni el informe de violaciones; una política sin hallazgos aquí puede romper una página o seguir dejando pasar un ataque.</tspan></text><text x="530" y="321.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="530" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
