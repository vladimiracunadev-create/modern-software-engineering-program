<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 564" width="940" height="564" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Sincronizar tras estar sin conexión: duplicados, reintentos y escrituras perdidas</title><desc id="d">Barras agrupadas con el resultado de la sincronización: sin clave de idempotencia, 2000 envíos con 20 por ciento de confirmaciones perdidas producen 2476 efectos y 476 reintentos; con clave, 2000 efectos y 390 reintentos; con la última escritura gana, 300 ediciones se descartan, y con comprobación de versión ninguna en silencio.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="564" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Sincronizar tras estar sin conexión: duplicados, reintentos y escrituras perdidas</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Sin clave de idempotencia / última escritura gana</tspan></text><rect x="433.46" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="453.46" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="453.46" dy="0">Con clave por operación / comprobación de versión</tspan></text><line x1="93.7" y1="355" x2="920" y2="355" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="355" x2="93.7" y2="355" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="359.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">0</tspan></text><line x1="93.7" y1="303" x2="920" y2="303" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="303" x2="93.7" y2="303" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="307.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">500</tspan></text><line x1="93.7" y1="251" x2="920" y2="251" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="251" x2="93.7" y2="251" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="255.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1 000</tspan></text><line x1="93.7" y1="199" x2="920" y2="199" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="199" x2="93.7" y2="199" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="203.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1 500</tspan></text><line x1="93.7" y1="147" x2="920" y2="147" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="147" x2="93.7" y2="147" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="151.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">2 000</tspan></text><line x1="93.7" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="95" x2="93.7" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">2 500</tspan></text><line x1="93.7" y1="95" x2="93.7" y2="355" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="225" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 225)">Cantidad</text><rect x="121.243" y="97.496" width="108.173" height="257.504" rx="3" fill="#c0432f"/><text x="175.33" y="91.496" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="175.33" dy="0">2 476</tspan></text><rect x="233.417" y="147" width="108.173" height="208" rx="3" fill="#087f8c"/><text x="287.503" y="141" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287.503" dy="0">2 000</tspan></text><text x="231.417" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="231.417" dy="0">Efectos en el servidor (2000 envíos)</tspan></text><rect x="396.677" y="305.496" width="108.173" height="49.504" rx="3" fill="#c0432f"/><text x="450.763" y="299.496" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="450.763" dy="0">476</tspan></text><rect x="508.85" y="314.44" width="108.173" height="40.56" rx="3" fill="#087f8c"/><text x="562.937" y="308.44" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="562.937" dy="0">390</tspan></text><text x="506.85" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="506.85" dy="0">Reintentos (2000 envíos)</tspan></text><rect x="672.11" y="323.8" width="108.173" height="31.2" rx="3" fill="#c0432f"/><text x="726.197" y="317.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="726.197" dy="0">300</tspan></text><rect x="784.283" y="353" width="108.173" height="2" rx="3" fill="#087f8c"/><text x="838.37" y="347" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="838.37" dy="0">0</tspan></text><text x="782.283" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.283" dy="0">Ediciones descartadas en silencio</tspan></text><text x="782.283" y="393" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.283" dy="0">(300 concurrentes)</tspan></text><rect x="10" y="424" width="920" height="92.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="448.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Sin clave hay 476 efectos duplicados; con clave, 0. Con la última escritura gana, en 13,3 % gana la más antigua por reloj,</tspan></text><text x="470" y="465.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">y la comprobación de versión exige resolver el conflicto. Los relojes de los dispositivos se desviaron hasta ±2 min</tspan></text><text x="470" y="482.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">(supuesto). Si la política de nota por entrega tardía usa la hora del cliente, ese desajuste decide una nota: la hora debe</tspan></text><text x="470" y="498.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">ser la del servidor al recibir, o una marca firmada.</tspan></text><text x="470" y="546.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con supuestos del autor, semilla fija; no es una medición de un navegador ni de usuarios reales.</tspan></text></svg>
