<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 708" width="940" height="708" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Estrategias de caché en 20 000 peticiones con 19,4 % del tiempo sin conexión</title><desc id="d">Barras horizontales con el porcentaje de peticiones servidas desde caché, con fallo y con contenido obsoleto en cinco estrategias: solo red falla en 19,33 por ciento; caché primero responde en 6 milisegundos pero sirve obsoleto el 69,88; red primero casi no sirve obsoleto pero tarda 165; revalidar en segundo plano lo reduce a 5,2 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="708" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Estrategias de caché en 20 000 peticiones con 19,4 % del tiempo sin conexión</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Desde caché</tspan></text><rect x="146.94" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="166.94" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="166.94" dy="0">Fallos</tspan></text><rect x="240.18" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="260.18" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="260.18" dy="0">Contenido obsoleto</tspan></text><line x1="304" y1="77" x2="304" y2="527" stroke="#d5dde1" stroke-width="1"/><line x1="304" y1="527" x2="304" y2="532" stroke="#5b7280" stroke-width="1.4"/><text x="304" y="548" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="304" dy="0">0</tspan></text><line x1="416.728" y1="77" x2="416.728" y2="527" stroke="#d5dde1" stroke-width="1"/><line x1="416.728" y1="527" x2="416.728" y2="532" stroke="#5b7280" stroke-width="1.4"/><text x="416.728" y="548" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="416.728" dy="0">20</tspan></text><line x1="529.456" y1="77" x2="529.456" y2="527" stroke="#d5dde1" stroke-width="1"/><line x1="529.456" y1="527" x2="529.456" y2="532" stroke="#5b7280" stroke-width="1.4"/><text x="529.456" y="548" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="529.456" dy="0">40</tspan></text><line x1="642.184" y1="77" x2="642.184" y2="527" stroke="#d5dde1" stroke-width="1"/><line x1="642.184" y1="527" x2="642.184" y2="532" stroke="#5b7280" stroke-width="1.4"/><text x="642.184" y="548" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642.184" dy="0">60</tspan></text><line x1="754.912" y1="77" x2="754.912" y2="527" stroke="#d5dde1" stroke-width="1"/><line x1="754.912" y1="527" x2="754.912" y2="532" stroke="#5b7280" stroke-width="1.4"/><text x="754.912" y="548" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="754.912" dy="0">80</tspan></text><line x1="867.64" y1="77" x2="867.64" y2="527" stroke="#d5dde1" stroke-width="1"/><line x1="867.64" y1="527" x2="867.64" y2="532" stroke="#5b7280" stroke-width="1.4"/><text x="867.64" y="548" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867.64" dy="0">100</tspan></text><line x1="304" y1="527" x2="867.64" y2="527" stroke="#5b7280" stroke-width="1.6"/><text x="294" y="126.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="294" dy="0">Solo red (120 ms)</tspan></text><text x="294" y="216.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="294" dy="0">Caché primero (6,2 ms)</tspan></text><text x="294" y="306.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="294" dy="0">Caché primero con precarga (5,0 ms)</tspan></text><text x="294" y="388" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="294" dy="0">Red primero con respaldo en caché (165</tspan></text><text x="294" y="405" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="294" dy="0">ms)</tspan></text><text x="294" y="486.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="294" dy="0">Revalidar en segundo plano (6,2 ms)</tspan></text><rect x="304" y="83" width="2" height="24" rx="3" fill="#087f8c"/><text x="313" y="99.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="313" dy="0">0,00</tspan></text><rect x="304" y="110" width="108.952" height="24" rx="3" fill="#c0432f"/><text x="419.952" y="126.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="419.952" dy="0">19,33</tspan></text><rect x="304" y="137" width="2" height="24" rx="3" fill="#946512"/><text x="313" y="153.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="313" dy="0">0,00</tspan></text><rect x="304" y="173" width="554.058" height="24" rx="3" fill="#087f8c"/><text x="865.058" y="189.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="865.058" dy="0">98,30</tspan></text><rect x="304" y="200" width="3.88912" height="24" rx="3" fill="#c0432f"/><text x="314.889" y="216.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="314.889" dy="0">0,69</tspan></text><rect x="304" y="227" width="393.872" height="24" rx="3" fill="#946512"/><text x="704.872" y="243.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="704.872" dy="0">69,88</tspan></text><rect x="304" y="263" width="563.64" height="24" rx="3" fill="#087f8c"/><text x="874.64" y="279.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="874.64" dy="0">100,00</tspan></text><rect x="304" y="290" width="2" height="24" rx="3" fill="#c0432f"/><text x="313" y="306.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="313" dy="0">0,00</tspan></text><rect x="304" y="317" width="399.226" height="24" rx="3" fill="#946512"/><text x="710.226" y="333.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="710.226" dy="0">70,83</tspan></text><rect x="304" y="353" width="104.837" height="24" rx="3" fill="#087f8c"/><text x="415.837" y="369.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="415.837" dy="0">18,60</tspan></text><rect x="304" y="380" width="3.88912" height="24" rx="3" fill="#c0432f"/><text x="314.889" y="396.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="314.889" dy="0">0,69</tspan></text><rect x="304" y="407" width="8.28551" height="24" rx="3" fill="#946512"/><text x="319.286" y="423.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="319.286" dy="0">1,47</tspan></text><rect x="304" y="443" width="554.058" height="24" rx="3" fill="#087f8c"/><text x="865.058" y="459.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="865.058" dy="0">98,30</tspan></text><rect x="304" y="470" width="3.88912" height="24" rx="3" fill="#c0432f"/><text x="314.889" y="486.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="314.889" dy="0">0,69</tspan></text><rect x="304" y="497" width="29.3093" height="24" rx="3" fill="#946512"/><text x="340.309" y="513.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="340.309" dy="0">5,20</tspan></text><text x="585.82" y="571" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="585.82" dy="0">Peticiones (%)</tspan></text><rect x="10" y="585" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="609.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Entre paréntesis, la latencia media. 200 URL con popularidad 1/n, cambios de 0 a 12 por URL en 500 h y ráfagas sin conexión</tspan></text><text x="470" y="626.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">que suman 19,4 % del tiempo. Los 120 ms de red, 5 ms de caché y 360 ms de espera son supuestos; la obsolescencia cuenta</tspan></text><text x="470" y="643.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">versiones, no importancia del cambio.</tspan></text><text x="470" y="690.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con supuestos del autor, semilla fija; no es una medición de un navegador ni de usuarios reales.</tspan></text></svg>
