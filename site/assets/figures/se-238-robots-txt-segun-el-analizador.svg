<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 494" width="940" height="494" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Rutas en las que robotparser de Python y la regla de coincidencia más larga del RFC 9309 discrepan</title><desc id="d">Barras horizontales con las rutas de 14 en que discrepan el analizador de Python y el RFC 9309 sobre seis archivos robots.txt: 2 con Disallow /admin y Allow /admin/ayuda, 2 con /entregas, 3 con comodines y ninguna en los otros tres; 7 de 84 decisiones difieren.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="494" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Rutas en las que robotparser de Python y la regla de coincidencia más larga del RFC 9309 discrepan</tspan></text><line x1="324" y1="49" x2="324" y2="313" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="313" x2="324" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="334" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="518.647" y1="49" x2="518.647" y2="313" stroke="#d5dde1" stroke-width="1"/><line x1="518.647" y1="313" x2="518.647" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="518.647" y="334" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="518.647" dy="0">1</tspan></text><line x1="713.293" y1="49" x2="713.293" y2="313" stroke="#d5dde1" stroke-width="1"/><line x1="713.293" y1="313" x2="713.293" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="713.293" y="334" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="713.293" dy="0">2</tspan></text><line x1="907.94" y1="49" x2="907.94" y2="313" stroke="#d5dde1" stroke-width="1"/><line x1="907.94" y1="313" x2="907.94" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="907.94" y="334" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907.94" dy="0">3</tspan></text><line x1="324" y1="313" x2="907.94" y2="313" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="67" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Disallow /admin y luego Allow</tspan></text><text x="314" y="84" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">/admin/ayuda</tspan></text><text x="314" y="111" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Allow /admin/ayuda y luego Disallow</tspan></text><text x="314" y="128" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">/admin</tspan></text><text x="314" y="163.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Disallow /entregas y Allow /entregas/123</tspan></text><text x="314" y="207.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Comodines: /buscar? y /*.pdf$</tspan></text><text x="314" y="251.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Solo Disallow /privado</tspan></text><text x="314" y="295.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Archivo vacío</tspan></text><rect x="324" y="55" width="389.293" height="32" rx="3" fill="#c0432f"/><text x="720.293" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="720.293" dy="0">2</tspan></text><rect x="324" y="99" width="2" height="32" rx="3" fill="#c0432f"/><text x="333" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">0</tspan></text><rect x="324" y="143" width="389.293" height="32" rx="3" fill="#c0432f"/><text x="720.293" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="720.293" dy="0">2</tspan></text><rect x="324" y="187" width="583.94" height="32" rx="3" fill="#c0432f"/><text x="914.94" y="207.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="914.94" dy="0">3</tspan></text><rect x="324" y="231" width="2" height="32" rx="3" fill="#c0432f"/><text x="333" y="251.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">0</tspan></text><rect x="324" y="275" width="2" height="32" rx="3" fill="#c0432f"/><text x="333" y="295.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">0</tspan></text><text x="615.97" y="357" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="615.97" dy="0">Rutas con decisión distinta</tspan></text><rect x="10" y="371" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="395.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Difieren, por ejemplo, /admin/ayuda y /admin/ayuda/faq; con comodines, /buscar, /tmp/a.pdf y /a.pdf. Un mismo archivo puede</tspan></text><text x="470" y="412.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">permitir una ruta para un rastreador y bloquearla para otro si implementan distinto el RFC. Además, Disallow impide al</tspan></text><text x="470" y="429.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">rastreador leer la página, y por tanto ver un noindex que esta contenga.</tspan></text><text x="470" y="476.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
