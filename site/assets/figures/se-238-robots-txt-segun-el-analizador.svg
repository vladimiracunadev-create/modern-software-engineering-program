<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 467" width="960" height="467" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Rutas en las que robotparser de Python y la regla de coincidencia más larga del RFC 9309 discrepan</title><desc id="d">Tabla: sobre seis archivos robots.txt y 14 rutas, 7 de 84 decisiones difieren entre el analizador de la biblioteca estándar de Python, que aplica la primera regla coincidente y no admite comodines, y la regla de coincidencia más larga del RFC 9309.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="467" fill="#ffffff"/><rect x="10" y="12" width="424" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="222" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="222" dy="0">Conjunto de reglas</tspan></text><rect x="440" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="512" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="512" dy="0">Rutas que</tspan></text><text x="512" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="512" dy="0">difieren</tspan></text><rect x="590" y="12" width="354" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="767" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="767" dy="0">Cuáles</tspan></text><rect x="10" y="56" width="424" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="82.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Disallow /admin y luego Allow /admin/ayuda</tspan></text><rect x="440" y="56" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">2 de 14</tspan></text><rect x="590" y="56" width="354" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">/admin/ayuda y /admin/ayuda/faq</tspan></text><rect x="10" y="108" width="424" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="134.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Allow /admin/ayuda y luego Disallow /admin</tspan></text><rect x="440" y="108" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">0 de 14</tspan></text><rect x="590" y="108" width="354" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">coinciden</tspan></text><rect x="10" y="160" width="424" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="186.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Disallow /entregas y Allow /entregas/123</tspan></text><rect x="440" y="160" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">2 de 14</tspan></text><rect x="590" y="160" width="354" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">/entregas/123 y su subruta</tspan></text><rect x="10" y="212" width="424" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="238.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Comodines: /buscar? y /*.pdf$</tspan></text><rect x="440" y="212" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="238.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">3 de 14</tspan></text><rect x="590" y="212" width="354" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="238.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">/buscar, /tmp/a.pdf y /a.pdf</tspan></text><rect x="10" y="264" width="424" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="290.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Solo Disallow /privado</tspan></text><rect x="440" y="264" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="290.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">0 de 14</tspan></text><rect x="590" y="264" width="354" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="290.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">coinciden</tspan></text><rect x="10" y="316" width="424" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="342.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Archivo vacío</tspan></text><rect x="440" y="316" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="342.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">0 de 14</tspan></text><rect x="590" y="316" width="354" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="342.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">coinciden</tspan></text><rect x="10" y="372" width="940" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="396.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Un mismo archivo puede permitir una ruta para un rastreador y bloquearla para otro si implementan distinto el RFC. Además,</tspan></text><text x="480" y="413.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Disallow impide al rastreador leer la página, y por tanto ver un noindex que esta contenga.</tspan></text><text x="480" y="453.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
