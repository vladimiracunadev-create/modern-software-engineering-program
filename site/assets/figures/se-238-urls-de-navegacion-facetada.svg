<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 390" width="940" height="390" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">URLs que una navegación facetada pone al alcance de un rastreador</title><desc id="d">Barras horizontales en escala logarítmica con las URLs posibles: 33 600 combinaciones con seis facetas, 2 016 000 URLs con tres órdenes y veinte páginas en orden fijo, 544 467 960 si el orden de los parámetros puede variar y 600 si solo una faceta es indexable.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="390" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">URLs que una navegación facetada pone al alcance de un rastreador</tspan></text><line x1="354" y1="49" x2="354" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="225" x2="354" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">100</tspan></text><line x1="421.62" y1="49" x2="421.62" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="421.62" y1="225" x2="421.62" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="421.62" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="421.62" dy="0">1 000</tspan></text><line x1="489.24" y1="49" x2="489.24" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="489.24" y1="225" x2="489.24" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="489.24" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="489.24" dy="0">10 000</tspan></text><line x1="556.86" y1="49" x2="556.86" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="556.86" y1="225" x2="556.86" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="556.86" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="556.86" dy="0">100 000</tspan></text><line x1="624.48" y1="49" x2="624.48" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="624.48" y1="225" x2="624.48" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="624.48" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="624.48" dy="0">1 000 000</tspan></text><line x1="692.1" y1="49" x2="692.1" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="692.1" y1="225" x2="692.1" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="692.1" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692.1" dy="0">10 000 000</tspan></text><line x1="759.72" y1="49" x2="759.72" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="759.72" y1="225" x2="759.72" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="759.72" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="759.72" dy="0">100 000 000</tspan></text><line x1="827.34" y1="49" x2="827.34" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="827.34" y1="225" x2="827.34" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="827.34" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827.34" dy="0">1 000 000 000</tspan></text><line x1="354" y1="225" x2="827.34" y2="225" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="67" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">6 facetas con 4, 5, 6, 3, 7 y 4 valores, más</tspan></text><text x="344" y="84" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">«sin filtro»</tspan></text><text x="344" y="111" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Con 3 órdenes y 20 páginas, parámetros en</tspan></text><text x="344" y="128" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">orden fijo</tspan></text><text x="344" y="155" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Si los parámetros pueden llegar en cualquier</tspan></text><text x="344" y="172" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">orden</tspan></text><text x="344" y="199" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Como mucho una faceta indexable (el resto con</tspan></text><text x="344" y="216" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">canónica)</tspan></text><rect x="354" y="55" width="170.831" height="32" rx="3" fill="#c0432f"/><text x="531.831" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="531.831" dy="0">33 600</tspan></text><rect x="354" y="99" width="291.07" height="32" rx="3" fill="#c0432f"/><text x="652.07" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="652.07" dy="0">2 016 000</tspan></text><rect x="354" y="143" width="455.486" height="32" rx="3" fill="#c0432f"/><text x="816.486" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="816.486" dy="0">544 467 960</tspan></text><rect x="354" y="187" width="52.6186" height="32" rx="3" fill="#c0432f"/><text x="413.619" y="207.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="413.619" dy="0">600</tspan></text><text x="590.67" y="269" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="590.67" dy="0">URLs posibles (escala logarítmica)</tspan></text><rect x="10" y="283" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="307.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cálculo exacto por enumeración de subconjuntos y permutaciones, validado enumerando un caso pequeño (36 combinaciones).</tspan></text><text x="470" y="324.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cuántas de esas URLs rastrea realmente un buscador depende de enlaces, presupuesto y señales que no se miden aquí.</tspan></text><text x="470" y="372.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
