<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 543" width="940" height="543" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Nueve defectos de accesibilidad inyectados: cuáles detecta un conjunto de reglas automáticas</title><desc id="d">Mapa de calor con nueve defectos inyectados y si una regla automática los detecta: seis se detectan, entre ellos el contraste, el foco, las etiquetas y los errores sin asociar, y tres no, porque exigen ver la imagen, identificar el idioma o entender el propósito del campo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="543" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Nueve defectos de accesibilidad inyectados: cuáles detecta un conjunto de reglas automáticas</tspan></text><text x="617" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="617" dy="0">¿Lo detecta una regla?</tspan></text><text x="304" y="93.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">Contraste insuficiente de un enlace</tspan></text><text x="304" y="127.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">Indicador de foco eliminado</tspan></text><text x="304" y="161.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">Campo sin etiqueta</tspan></text><text x="304" y="195.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">Error sin asociar al campo</tspan></text><text x="304" y="229.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">tabindex positivo</tspan></text><text x="304" y="263.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">Enlace «clic aquí»</tspan></text><text x="304" y="297.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">Texto alternativo engañoso</tspan></text><text x="304" y="331.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">Idioma declarado equivocado</tspan></text><text x="304" y="357" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">Etiqueta que dice otra cosa que el</tspan></text><text x="304" y="374" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">campo</tspan></text><rect x="315.5" y="73.5" width="603" height="31" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="617" y="93.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="617" dy="0">detectado</tspan></text><rect x="315.5" y="107.5" width="603" height="31" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="617" y="127.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="617" dy="0">detectado</tspan></text><rect x="315.5" y="141.5" width="603" height="31" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="617" y="161.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="617" dy="0">detectado</tspan></text><rect x="315.5" y="175.5" width="603" height="31" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="617" y="195.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="617" dy="0">detectado</tspan></text><rect x="315.5" y="209.5" width="603" height="31" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="617" y="229.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="617" dy="0">detectado</tspan></text><rect x="315.5" y="243.5" width="603" height="31" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="617" y="263.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="617" dy="0">detectado</tspan></text><rect x="315.5" y="277.5" width="603" height="31" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="617" y="297.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="617" dy="0">no detectado</tspan></text><rect x="315.5" y="311.5" width="603" height="31" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="617" y="331.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="617" dy="0">no detectado</tspan></text><rect x="315.5" y="345.5" width="603" height="31" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="617" y="365.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="617" dy="0">no detectado</tspan></text><text x="314" y="404" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="314" dy="0">no detectado</tspan></text><rect x="412.48" y="392" width="30.5" height="14" fill="#dff1ee"/><rect x="442.48" y="392" width="30.5" height="14" fill="#c0e1e0"/><rect x="472.48" y="392" width="30.5" height="14" fill="#a2d0d2"/><rect x="502.48" y="392" width="30.5" height="14" fill="#83c0c4"/><rect x="532.48" y="392" width="30.5" height="14" fill="#64b0b6"/><rect x="562.48" y="392" width="30.5" height="14" fill="#45a0a8"/><rect x="592.48" y="392" width="30.5" height="14" fill="#278f9a"/><rect x="622.48" y="392" width="30.5" height="14" fill="#087f8c"/><text x="660.48" y="404" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="660.48" dy="0">detectado</tspan></text><text x="736.34" y="404" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="736.34" dy="0">más oscuro = mayor (detección)</tspan></text><rect x="10" y="420" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="444.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los tres no detectados exigen mirar la imagen, identificar el idioma del texto o entender el propósito del campo. 6 de 9 es</tspan></text><text x="470" y="461.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">el resultado de estas nueve reglas sobre estos nueve defectos, no una cobertura general de WCAG. Una herramienta automática</tspan></text><text x="470" y="478.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">real cubre más reglas y falla en otras: la revisión con teclado y lector de pantalla sigue haciendo falta.</tspan></text><text x="470" y="525.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
