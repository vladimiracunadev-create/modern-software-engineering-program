<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 247" width="1100" height="247" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Efecto de quitar cada una de las 18 transiciones del flujo de entrega con y sin conexión</title><desc id="d">Barras: en una máquina de ocho estados y 18 transiciones, quitar una transición deja un estado inalcanzable en 3 casos, un estado sin camino al estado final en 1 y no dispara ninguna comprobación estructural en 14, que cambian el comportamiento sin romper la forma.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1100" height="247" fill="#ffffff"/><text x="500" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="500" dy="0">Quitar una transición deja un estado inalcanzable</tspan></text><rect x="510" y="16" width="105" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="623" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="623" dy="0">3 de 18</tspan></text><text x="500" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="500" dy="0">Quitar una transición deja un estado sin camino a «Enviado»</tspan></text><rect x="510" y="60" width="35" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="553" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="553" dy="0">1 de 18</tspan></text><text x="500" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="500" dy="0">Quitar una transición no activa ninguna comprobación estructural</tspan></text><rect x="510" y="104" width="490" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="1008" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="1008" dy="0">14 de 18</tspan></text><rect x="10" y="152" width="1080" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="550" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="550" dy="0">Alcanzabilidad y camino al final son comprobaciones de forma; no saben si «cancelar» o «reintentar manual» debían existir. Las 14 transiciones</tspan></text><text x="550" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="550" dy="0">que la forma no protege solo las protegen pruebas que ejecuten el comportamiento.</tspan></text><text x="550" y="233.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="550" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
