<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 550" width="940" height="550" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">1000 clientes que fallan a la vez frente a un servidor que atiende 50 peticiones por segundo</title><desc id="d">Barras agrupadas en escala logarítmica de tres políticas de reintento: el reintento fijo y el exponencial sin dispersión producen 10,5 peticiones por cliente y un pico de 950 por segundo, y el segundo tarda 902 segundos en terminar; el exponencial con dispersión completa produce 2,0, un pico de 484 y termina en 23 segundos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="550" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">1000 clientes que fallan a la vez frente a un servidor que atiende 50 peticiones por segundo</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Peticiones por cliente</tspan></text><rect x="229.88" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="249.88" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="249.88" dy="0">Pico por segundo tras el 1.er segundo</tspan></text><rect x="556.86" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="576.86" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="576.86" dy="0">Segundos hasta el último cliente</tspan></text><line x1="93.7" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="375" x2="93.7" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1</tspan></text><line x1="93.7" y1="281.667" x2="920" y2="281.667" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="281.667" x2="93.7" y2="281.667" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="286.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">10</tspan></text><line x1="93.7" y1="188.333" x2="920" y2="188.333" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="188.333" x2="93.7" y2="188.333" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="192.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">100</tspan></text><line x1="93.7" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="95" x2="93.7" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1 000</tspan></text><line x1="93.7" y1="95" x2="93.7" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">Valor de cada medida (escala logarítmica)</text><rect x="121.243" y="279.689" width="70.7822" height="95.311" rx="3" fill="#6b7c86"/><text x="156.634" y="273.689" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="156.634" dy="0">10,5</tspan></text><rect x="196.026" y="97.0791" width="70.7822" height="277.921" rx="3" fill="#c0432f"/><text x="231.417" y="91.0791" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="231.417" dy="0">950,0</tspan></text><rect x="270.808" y="255.65" width="70.7822" height="119.35" rx="3" fill="#102a43"/><text x="306.199" y="249.65" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="306.199" dy="0">19,0</tspan></text><text x="231.417" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="231.417" dy="0">Reintento fijo cada segundo</tspan></text><rect x="396.677" y="279.689" width="70.7822" height="95.311" rx="3" fill="#6b7c86"/><text x="432.068" y="273.689" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="432.068" dy="0">10,5</tspan></text><rect x="471.459" y="97.0791" width="70.7822" height="277.921" rx="3" fill="#c0432f"/><text x="506.85" y="91.0791" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="506.85" dy="0">950,0</tspan></text><rect x="546.241" y="99.1807" width="70.7822" height="275.819" rx="3" fill="#102a43"/><text x="581.632" y="93.1807" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="581.632" dy="0">902,0</tspan></text><text x="506.85" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="506.85" dy="0">Exponencial sin dispersión</tspan></text><rect x="672.11" y="346.904" width="70.7822" height="28.0961" rx="3" fill="#6b7c86"/><text x="707.501" y="340.904" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="707.501" dy="0">2,0</tspan></text><rect x="746.892" y="124.414" width="70.7822" height="250.586" rx="3" fill="#c0432f"/><text x="782.283" y="118.414" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="782.283" dy="0">484,0</tspan></text><rect x="821.674" y="247.905" width="70.7822" height="127.095" rx="3" fill="#102a43"/><text x="857.066" y="241.905" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="857.066" dy="0">23,0</tspan></text><text x="782.283" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.283" dy="0">Exponencial con dispersión completa</tspan></text><rect x="10" y="427" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Sin dispersión, los clientes quedan sincronizados en oleadas que se repiten. Con dispersión se reparten y la carga total</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">baja a una quinta parte. Simulación de capacidad fija sin degradación del servidor: un servidor real puede empeorar bajo</tspan></text><text x="470" y="485.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">carga.</tspan></text><text x="470" y="532.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con supuestos del autor, semilla fija; no es una medición de un navegador ni de usuarios reales.</tspan></text></svg>
