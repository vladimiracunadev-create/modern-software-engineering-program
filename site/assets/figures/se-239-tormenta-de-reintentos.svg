<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 317" width="1000" height="317" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">1000 clientes que fallan a la vez frente a un servidor que atiende 50 peticiones por segundo</title><desc id="d">Tabla: el reintento fijo y el exponencial sin dispersión producen 10,5 peticiones por cliente y un pico de 950 por segundo tras el primer segundo, y el segundo tarda 902 segundos en terminar; el exponencial con dispersión completa produce 2 peticiones por cliente, un pico de 484 y termina en 23 segundos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="317" fill="#ffffff"/><rect x="10" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Política de reintento</tspan></text><rect x="390" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="487" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="487" dy="0">Peticiones por cliente</tspan></text><rect x="590" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="692" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="692" dy="0">Pico tras el 1.er</tspan></text><text x="692" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="692" dy="0">segundo</tspan></text><rect x="800" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="892" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="892" dy="0">Hasta el último</tspan></text><text x="892" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="892" dy="0">cliente</tspan></text><rect x="10" y="56" width="374" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="83.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Reintento fijo cada segundo</tspan></text><rect x="390" y="56" width="194" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">10,5</tspan></text><rect x="590" y="56" width="204" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">950</tspan></text><rect x="800" y="56" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="892" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">19 s</tspan></text><rect x="10" y="110" width="374" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="137.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Exponencial sin dispersión</tspan></text><rect x="390" y="110" width="194" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">10,5</tspan></text><rect x="590" y="110" width="204" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">950</tspan></text><rect x="800" y="110" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="892" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">902 s</tspan></text><rect x="10" y="164" width="374" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="191.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Exponencial con dispersión completa</tspan></text><rect x="390" y="164" width="194" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">2,0</tspan></text><rect x="590" y="164" width="204" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">484</tspan></text><rect x="800" y="164" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="892" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">23 s</tspan></text><rect x="10" y="222" width="980" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="500" y="246.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">Sin dispersión, los clientes quedan sincronizados en oleadas que se repiten. Con dispersión se reparten y la carga total baja a una</tspan></text><text x="500" y="263.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">quinta parte. Simulación de capacidad fija sin degradación del servidor: un servidor real puede empeorar bajo carga.</tspan></text><text x="500" y="303.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Modelo con supuestos del autor, semilla fija; no es una medición de un navegador ni de usuarios reales.</tspan></text></svg>
