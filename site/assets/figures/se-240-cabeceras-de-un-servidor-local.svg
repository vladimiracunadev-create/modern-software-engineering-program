<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 475" width="940" height="475" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Auditoría de cabeceras de un servidor local con ocho rutas y cinco configuraciones erróneas</title><desc id="d">Barras horizontales con los hallazgos por ruta de un comprobador que pidió ocho rutas a un servidor local: 7 en cinco rutas, con el service worker, la hoja de estilos y el manifiesto con 1 cada uno, los datos mutables y la página de ayuda con 2, y ninguno en las tres restantes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="475" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Auditoría de cabeceras de un servidor local con ocho rutas y cinco configuraciones erróneas</tspan></text><line x1="294" y1="49" x2="294" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="277" x2="294" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">0</tspan></text><line x1="447.485" y1="49" x2="447.485" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="447.485" y1="277" x2="447.485" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="447.485" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447.485" dy="0">0,5</tspan></text><line x1="600.97" y1="49" x2="600.97" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="600.97" y1="277" x2="600.97" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="600.97" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600.97" dy="0">1</tspan></text><line x1="754.455" y1="49" x2="754.455" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="754.455" y1="277" x2="754.455" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="754.455" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="754.455" dy="0">1,5</tspan></text><line x1="907.94" y1="49" x2="907.94" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="907.94" y1="277" x2="907.94" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="907.94" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907.94" dy="0">2</tspan></text><line x1="294" y1="277" x2="907.94" y2="277" stroke="#5b7280" stroke-width="1.6"/><text x="284" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">/app/sw.js</tspan></text><text x="284" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">/app/app.css</tspan></text><text x="284" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">/app/manifest.webmanifest</tspan></text><text x="284" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">/app/datos.json</tspan></text><text x="284" y="224.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">/app/ayuda/</tspan></text><text x="284" y="262.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">/app/, app.3f9a1c.js, icons/192.png</tspan></text><rect x="294" y="55" width="306.97" height="26" rx="3" fill="#c0432f"/><text x="607.97" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="607.97" dy="0">1</tspan></text><rect x="294" y="93" width="306.97" height="26" rx="3" fill="#c0432f"/><text x="607.97" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="607.97" dy="0">1</tspan></text><rect x="294" y="131" width="306.97" height="26" rx="3" fill="#c0432f"/><text x="607.97" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="607.97" dy="0">1</tspan></text><rect x="294" y="169" width="613.94" height="26" rx="3" fill="#c0432f"/><text x="914.94" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="914.94" dy="0">2</tspan></text><rect x="294" y="207" width="613.94" height="26" rx="3" fill="#c0432f"/><text x="914.94" y="224.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="914.94" dy="0">2</tspan></text><rect x="294" y="245" width="2" height="26" rx="3" fill="#c0432f"/><text x="303" y="262.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="303" dy="0">0</tspan></text><text x="600.97" y="321" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="600.97" dy="0">Hallazgos</tspan></text><rect x="10" y="335" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="359.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Hallazgos: caché de un año en el service worker; no-store en una hoja sin huella; Content-Type application/json en vez de</tspan></text><text x="470" y="376.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">application/manifest+json; un año de caché en datos mutables y sin nosniff; HTML sin charset y sin nosniff. Un servidor</tspan></text><text x="470" y="393.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Python en 127.0.0.1 con puerto efímero sirvió ocho respuestas de dos bytes; no se tocó ninguna red. Que las cabeceras sean</tspan></text><text x="470" y="409.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">correctas no demuestra que el service worker se actualice: eso solo se ve en un navegador.</tspan></text><text x="470" y="457.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
