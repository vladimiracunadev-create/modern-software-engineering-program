<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 550" width="940" height="550" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Validador de manifiesto: 120 mutaciones de un manifiesto de aplicación web sintético</title><desc id="d">Barras apiladas horizontales con las mutaciones por tipo que detecta el validador de forma: 83 de 120, todas las que faltan o rompen campos, alcance o iconos declarados, y ninguna de las que exigen comprobar el sistema de archivos o el significado, que son 37.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="550" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Validador de manifiesto: 120 mutaciones de un manifiesto de aplicación web sintético</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Detectadas</tspan></text><rect x="139.4" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="159.4" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="159.4" dy="0">No detectadas</tspan></text><line x1="324" y1="77" x2="324" y2="385" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="385" x2="324" y2="390" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="406" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="507.9" y1="77" x2="507.9" y2="385" stroke="#d5dde1" stroke-width="1"/><line x1="507.9" y1="385" x2="507.9" y2="390" stroke="#5b7280" stroke-width="1.4"/><text x="507.9" y="406" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507.9" dy="0">10</tspan></text><line x1="691.8" y1="77" x2="691.8" y2="385" stroke="#d5dde1" stroke-width="1"/><line x1="691.8" y1="385" x2="691.8" y2="390" stroke="#5b7280" stroke-width="1.4"/><text x="691.8" y="406" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="691.8" dy="0">20</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="385" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="385" x2="875.7" y2="390" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="406" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">30</tspan></text><line x1="324" y1="385" x2="875.7" y2="385" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="103.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Falta name, start_url o icons</tspan></text><text x="314" y="139" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">short_name largo, display o color</tspan></text><text x="314" y="156" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">inválidos</tspan></text><text x="314" y="191.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">start_url fuera del scope</tspan></text><text x="314" y="235.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Sin icono 512 o sin maskable, sizes roto</tspan></text><text x="314" y="279.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">src de un icono que no existe</tspan></text><text x="314" y="323.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Nombre engañoso o idioma equivocado</tspan></text><text x="314" y="367.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Icono declarado 192 que mide otra cosa</tspan></text><rect x="324" y="84" width="496.53" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="572.265" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="572.265" dy="0">27</tspan></text><rect x="820.53" y="84" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="827.53" y="103.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="827.53" dy="0">27</tspan></text><rect x="324" y="128" width="422.97" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="535.485" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="535.485" dy="0">23</tspan></text><rect x="746.97" y="128" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="753.97" y="147.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="753.97" dy="0">23</tspan></text><rect x="324" y="172" width="110.34" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="379.17" y="191.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="379.17" dy="0">6</tspan></text><rect x="434.34" y="172" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="441.34" y="191.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="441.34" dy="0">6</tspan></text><rect x="324" y="216" width="496.53" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="572.265" y="235.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="572.265" dy="0">27</tspan></text><rect x="820.53" y="216" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="827.53" y="235.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="827.53" dy="0">27</tspan></text><rect x="324" y="260" width="0" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="324" y="260" width="202.29" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="425.145" y="279.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="425.145" dy="0">11</tspan></text><text x="533.29" y="279.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="533.29" dy="0">11</tspan></text><rect x="324" y="304" width="0" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="324" y="304" width="331.02" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="489.51" y="323.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="489.51" dy="0">18</tspan></text><text x="662.02" y="323.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="662.02" dy="0">18</tspan></text><rect x="324" y="348" width="0" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="324" y="348" width="147.12" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="397.56" y="367.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="397.56" dy="0">8</tspan></text><text x="478.12" y="367.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="478.12" dy="0">8</tspan></text><text x="599.85" y="429" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="599.85" dy="0">Mutaciones</tspan></text><rect x="10" y="443" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="467.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Detectadas 83 de 120. Los 37 casos restantes no son defectos del JSON: son discrepancias entre el JSON y el mundo</tspan></text><text x="470" y="484.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">(archivos, significado). Para verlos hay que abrir los archivos referidos y revisar el contenido, no validar el esquema.</tspan></text><text x="470" y="532.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
