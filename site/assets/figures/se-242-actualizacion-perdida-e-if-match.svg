<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 534" width="940" height="534" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dos clientes editan la misma entrega: qué ocurre con el segundo PUT (1 000 rondas)</title><desc id="d">Barras agrupadas de 1 000 rondas: sin precondición el segundo PUT pisa al primero en las 1 000 y no hay respuestas 412; con If-Match y 412 no se pierde ninguna edición y el segundo escritor se entera 1 000 veces; si además reaplica el cambio sobre la versión nueva, las 1 000 rondas terminan con las dos ediciones.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="534" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dos clientes editan la misma entrega: qué ocurre con el segundo PUT (1 000 rondas)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Ediciones perdidas en silencio</tspan></text><rect x="290.2" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="310.2" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="310.2" dy="0">Respuestas 412</tspan></text><rect x="443.76" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="463.76" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="463.76" dy="0">Rondas con ambas ediciones</tspan></text><line x1="93.7" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="375" x2="93.7" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">0</tspan></text><line x1="93.7" y1="319" x2="920" y2="319" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="319" x2="93.7" y2="319" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="323.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">200</tspan></text><line x1="93.7" y1="263" x2="920" y2="263" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="263" x2="93.7" y2="263" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="267.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">400</tspan></text><line x1="93.7" y1="207" x2="920" y2="207" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="207" x2="93.7" y2="207" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="211.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">600</tspan></text><line x1="93.7" y1="151" x2="920" y2="151" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="151" x2="93.7" y2="151" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="155.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">800</tspan></text><line x1="93.7" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="95" x2="93.7" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1 000</tspan></text><line x1="93.7" y1="95" x2="93.7" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">Rondas (de 1 000)</text><rect x="121.243" y="95" width="70.7822" height="280" rx="3" fill="#c0432f"/><text x="156.634" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="156.634" dy="0">1 000</tspan></text><rect x="196.026" y="373" width="70.7822" height="2" rx="3" fill="#946512"/><text x="231.417" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="231.417" dy="0">0</tspan></text><rect x="270.808" y="373" width="70.7822" height="2" rx="3" fill="#087f8c"/><text x="306.199" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="306.199" dy="0">0</tspan></text><text x="231.417" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="231.417" dy="0">PUT sin precondición</tspan></text><rect x="396.677" y="373" width="70.7822" height="2" rx="3" fill="#c0432f"/><text x="432.068" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="432.068" dy="0">0</tspan></text><rect x="471.459" y="95" width="70.7822" height="280" rx="3" fill="#946512"/><text x="506.85" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="506.85" dy="0">1 000</tspan></text><rect x="546.241" y="373" width="70.7822" height="2" rx="3" fill="#087f8c"/><text x="581.632" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="581.632" dy="0">0</tspan></text><text x="506.85" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="506.85" dy="0">PUT con If-Match y 412</tspan></text><rect x="672.11" y="373" width="70.7822" height="2" rx="3" fill="#c0432f"/><text x="707.501" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="707.501" dy="0">0</tspan></text><rect x="746.892" y="95" width="70.7822" height="280" rx="3" fill="#946512"/><text x="782.283" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="782.283" dy="0">1 000</tspan></text><rect x="821.674" y="95" width="70.7822" height="280" rx="3" fill="#087f8c"/><text x="857.066" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="857.066" dy="0">1 000</tspan></text><text x="782.283" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.283" dy="0">If-Match, 412 y reaplicar el cambio</tspan></text><rect x="10" y="427" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El orden de ejecución se sorteó con semilla fija, pero el resultado no depende de ella: es una propiedad del protocolo. Lo</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">que no se midió es la tasa real de conflictos de un producto, que depende de cuántas personas editan el mismo recurso.</tspan></text><text x="470" y="516.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos y los recuentos de hilos indicados.</tspan></text></svg>
