<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 365" width="1050" height="365" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dos clientes editan la misma entrega: qué ocurre con el segundo PUT</title><desc id="d">Tabla de 1 000 rondas: sin If-Match el segundo PUT pisa al primero en las 1 000 rondas; con If-Match el servidor responde 412 al segundo y no se pierde nada; si el cliente relee y reaplica su cambio, las 1 000 rondas terminan con las dos ediciones.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1050" height="365" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Diseño</tspan></text><rect x="340" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="472" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="472" dy="0">Ediciones perdidas en silencio</tspan></text><rect x="610" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="727" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="727" dy="0">Respuestas 412</tspan></text><rect x="850" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="942" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="942" dy="0">Rondas con ambas</tspan></text><text x="942" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="942" dy="0">ediciones</tspan></text><rect x="10" y="56" width="324" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="91.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">PUT sin precondición</tspan></text><rect x="340" y="56" width="264" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="83.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">1 000 de 1 000 rondas pierden una</tspan></text><text x="472" y="99.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">edición en silencio</tspan></text><rect x="610" y="56" width="234" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="91.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">0</tspan></text><rect x="850" y="56" width="184" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="942" y="91.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="942" dy="0">0 de 1 000</tspan></text><rect x="10" y="126" width="324" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="161.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">PUT con If-Match y 412</tspan></text><rect x="340" y="126" width="264" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="161.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">0</tspan></text><rect x="610" y="126" width="234" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="153.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">1 000 (el segundo escritor se</tspan></text><text x="727" y="169.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">entera)</tspan></text><rect x="850" y="126" width="184" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="942" y="161.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="942" dy="0">0 de 1 000</tspan></text><rect x="10" y="196" width="324" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="223.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">If-Match, 412 y reaplicar el cambio sobre la</tspan></text><text x="172" y="239.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">versión nueva</tspan></text><rect x="340" y="196" width="264" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">0</tspan></text><rect x="610" y="196" width="234" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">1 000</tspan></text><rect x="850" y="196" width="184" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="942" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="942" dy="0">1 000 de 1 000</tspan></text><rect x="10" y="270" width="1030" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="525" y="294.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="525" dy="0">El orden de ejecución se sorteó con semilla fija, pero el resultado no depende de ella: es una propiedad del protocolo. Lo que no se midió</tspan></text><text x="525" y="311.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="525" dy="0">es la tasa real de conflictos de un producto, que depende de cuántas personas editan el mismo recurso.</tspan></text><text x="525" y="351.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="525" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos y los recuentos de hilos indicados.</tspan></text></svg>
