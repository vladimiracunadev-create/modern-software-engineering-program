<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 203" width="1060" height="203" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un recorrido de enlaces (prefetcher, buscador, antivirus de correo) sobre 200 entregas</title><desc id="d">Barras: un rastreador que solo hace GET borra 200 de 200 entregas si el borrado está modelado como un GET con efecto, y 0 si el borrado es un DELETE.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1060" height="203" fill="#ffffff"/><text x="430" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="430" dy="0">GET /entregas/{id}/borrar (efecto en un GET)</tspan></text><rect x="440" y="16" width="480" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="928" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="928" dy="0">200 de 200 borradas</tspan></text><text x="430" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="430" dy="0">DELETE /entregas/{id}</tspan></text><rect x="440" y="60" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="452" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="452" dy="0">0 borradas</tspan></text><rect x="10" y="108" width="1040" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="530" y="132.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="530" dy="0">GET es seguro por contrato: cualquier intermediario puede repetirlo, precargarlo o cachearlo. Un enlace de borrado que responde a GET</tspan></text><text x="530" y="149.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="530" dy="0">entrega la decisión a quien rastrea la página. Un DELETE no se dispara por navegar.</tspan></text><text x="530" y="189.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="530" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos y los recuentos de hilos indicados.</tspan></text></svg>
