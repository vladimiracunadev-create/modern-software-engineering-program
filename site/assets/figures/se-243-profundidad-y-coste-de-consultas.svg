" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="411.885" dy="0">8 420</tspan></text><line x1="571.928" y1="59" x2="571.928" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="571.928" y1="359" x2="571.928" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="571.928" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="571.928" dy="0">168 420</tspan></text><line x1="731.964" y1="59" x2="731.964" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="731.964" y1="359" x2="731.964" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="731.964" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="731.964" dy="0">3,4 millones</tspan></text><line x1="892" y1="59" x2="892" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="359" x2="892" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">67 millones</tspan></text><line x1="71.08" y1="359" x2="910" y2="359" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="209" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 209)">Consultas legítimas rechazadas (%)</text><text x="490.54" y="405" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="490.54" dy="0">Nodos de la consulta más profunda permitida (20 por nivel) (escala logarítmica)</tspan></text><polyline points="89.08,100.1 251.722,247.28 411.885,311.66 571.928,339.14 731.964,350.12 892,359" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="89.08" cy="100.1" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="89.08" y="89.1" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="89.08" dy="0">límite 1</tspan></text><circle cx="251.722" cy="247.28" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="251.722" y="236.28" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="251.722" dy="0">límite 2</tspan></text><circle cx="411.885" cy="311.66" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="411.885" y="300.66" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="411.885" dy="0">límite 3</tspan></text><circle cx="571.928" cy="339.14" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="571.928" y="328.14" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="571.928" dy="0">límite 4</tspan></text><circle cx="731.964" cy="350.12" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="731.964" y="339.12" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="731.964" dy="0">límite 5</tspan></text><circle cx="892" cy="359" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="348" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">límite 6</tspan></text><rect x="10" y="419" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="443.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Se acotan el coste y no solo la forma: un límite de 10 000 nodos acepta hasta profundidad 3 y uno de 1 000 solo hasta 2. La</tspan></text><text x="470" y="460.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">distribución de consultas legítimas es una suposición del autor (exponencial, media 1,2 niveles), no una medición de</tspan></text><text x="470" y="477.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">clientes reales.</tspan></text><text x="470" y="524.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos y los recuentos de hilos indicados.</tspan></text></svg>
