<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 542" width="940" height="542" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Límite de profundidad: nodos que permite y consultas legítimas que rechaza</title><desc id="d">Línea en escala logarítmica con el porcentaje de 10 000 consultas legítimas sintéticas que rechaza cada límite de profundidad frente a los nodos de la consulta más profunda que permite con 20 elementos por nivel: el límite 1 permite 20 nodos y rechaza 43,15 por ciento, el 2 permite 420 y rechaza 18,62, el 3 permite 8 420 y 7,89, el 4 permite 168 420 y 3,31, el 5 permite 3 368 420 y 1,48 y el 6 permite 67 368 420 y 0,00.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="542" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Límite de profundidad: nodos que permite y consultas legítimas que rechaza</tspan></text><line x1="71.08" y1="359" x2="910" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="359" x2="71.08" y2="359" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="363.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="299" x2="910" y2="299" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="299" x2="71.08" y2="299" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="303.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="239" x2="910" y2="239" stroke="#d5dde1" stroke-width=