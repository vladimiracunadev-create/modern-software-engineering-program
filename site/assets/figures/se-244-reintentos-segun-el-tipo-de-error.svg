<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 247" width="1100" height="247" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Solicitudes adicionales según la clasificación del error (10 000 fallos, 40 % permanentes)</title><desc id="d">Barras: reintentar todos los fallos genera 20 749 solicitudes adicionales para recuperar 5 677; reintentar solo 429, 503 y tiempo agotado genera 8 806 para recuperar 5 660; no reintentar no genera ninguna.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1100" height="247" fill="#ffffff"/><text x="300" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">No reintentar</tspan></text><rect x="310" y="16" width="4" height="28" rx="3" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="322" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="322" dy="0">0 extra · 0 recuperados</tspan></text><text x="300" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Reintentar todo (3 veces)</tspan></text><rect x="310" y="60" width="259.363" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="577.362" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="577.362" dy="0">20 749 extra · 5 677 recuperados · 3,65 por recuperado</tspan></text><text x="300" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Reintentar solo 429, 503 y timeout</tspan></text><rect x="310" y="104" width="110.075" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="428.075" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="428.075" dy="0">8 806 extra · 5 660 recuperados · 1,56 por recuperado</tspan></text><rect x="10" y="152" width="1080" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="550" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="550" dy="0">Los 4xx permanentes (el 40 % de la mezcla supuesta) nunca se recuperan y solo cargan al servidor. Clasificar el error cuesta 17 recuperaciones</tspan></text><text x="550" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="550" dy="0">menos y 11 943 solicitudes menos. La mezcla y las probabilidades de recuperación son supuestos del autor.</tspan></text><text x="550" y="233.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="550" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos y los recuentos de hilos indicados.</tspan></text></svg>
