<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 338" width="940" height="338" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">14 cargas JSON límite: errores de un validador con isinstance y de uno estricto</title><desc id="d">Barras apiladas de las 14 cargas JSON límite: el validador basado en isinstance se equivoca en 11 y acierta en 3; el estricto se equivoca en 0 y acierta en las 14.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="338" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">14 cargas JSON límite: errores de un validador con isinstance y de uno estricto</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Se equivoca</tspan></text><rect x="146.94" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="166.94" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="166.94" dy="0">Acierta</tspan></text><line x1="254" y1="77" x2="254" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="254" y1="157" x2="254" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="254" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="254" dy="0">0</tspan></text><line x1="461.233" y1="77" x2="461.233" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="461.233" y1="157" x2="461.233" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="461.233" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="461.233" dy="0">5</tspan></text><line x1="668.467" y1="77" x2="668.467" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="668.467" y1="157" x2="668.467" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="668.467" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="668.467" dy="0">10</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="157" x2="875.7" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">15</tspan></text><line x1="254" y1="157" x2="875.7" y2="157" stroke="#5b7280" stroke-width="1.6"/><text x="244" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">Validador ingenuo (isinstance)</tspan></text><text x="244" y="141.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">Validador estricto</tspan></text><rect x="254" y="84" width="455.913" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="481.957" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="481.957" dy="0">11</tspan></text><rect x="709.913" y="84" width="124.34" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="772.083" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="772.083" dy="0">3</tspan></text><text x="841.253" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="841.253" dy="0">14</tspan></text><rect x="254" y="124" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><rect x="254" y="124" width="580.253" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="544.127" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="544.127" dy="0">14</tspan></text><text x="841.253" y="141.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="841.253" dy="0">14</tspan></text><text x="564.85" y="201" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="564.85" dy="0">Cargas JSON</tspan></text><rect x="10" y="215" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="239.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Errores: ingenuo 11 de 14, estricto 0 de 14. En Python bool es subclase de int y json.loads acepta NaN e Infinity por</tspan></text><text x="470" y="256.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">defecto. Que el estricto acierte las 14 solo prueba que se escribió mirándolas: otras cargas (unicode normalizado, enteros</tspan></text><text x="470" y="273.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">con ceros) no se probaron.</tspan></text><text x="470" y="320.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos y los recuentos de hilos indicados.</tspan></text></svg>
