<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 247" width="1040" height="247" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Decisiones de la política que una suite de pruebas protege (48 = 3 roles × 4 recursos × 4 acciones)</title><desc id="d">Barras: de 48 decisiones de política, una suite con solo los 12 permisos concedidos detecta 12 mutaciones, una con 12 permisos y 12 denegaciones detecta 24 y una que recorre las 48 las detecta todas; 36 de las 48 decisiones son denegaciones.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1040" height="247" fill="#ffffff"/><text x="440" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="440" dy="0">12 casos: solo los permitidos</tspan></text><rect x="450" y="16" width="132" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="590" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="590" dy="0">12 de 48</tspan></text><text x="440" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="440" dy="0">24 casos: 12 permitidos + 12 denegados</tspan></text><rect x="450" y="60" width="264" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="722" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="722" dy="0">24 de 48</tspan></text><text x="440" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="440" dy="0">48 casos: todo el espacio de decisiones</tspan></text><rect x="450" y="104" width="528" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="986" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="986" dy="0">48 de 48</tspan></text><rect x="10" y="152" width="1020" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="520" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="520" dy="0">Cada caso protege una sola decisión: invertir una celda no lo ve nadie que no la haya probado. Como 36 de 48 decisiones son denegaciones,</tspan></text><text x="520" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="520" dy="0">una suite que solo comprueba que lo permitido funciona nunca verá una apertura indebida. Con 5 casos al azar se detectan 5 de 48.</tspan></text><text x="520" y="233.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="520" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos y los recuentos de hilos indicados.</tspan></text></svg>
