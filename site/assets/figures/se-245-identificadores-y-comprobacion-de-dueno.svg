<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 335" width="1100" height="335" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Filas ajenas que obtiene un alumno autenticado que prueba identificadores (1 000 entregas, 50 usuarios)</title><desc id="d">Barras: con identificadores secuenciales y sin comprobar el dueño, el alumno obtiene 984 filas ajenas; con comprobación 0; con UUID adivinados al azar 0; con 100 UUID filtrados y sin comprobar 95; con comprobación 0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1100" height="335" fill="#ffffff"/><text x="470" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">Secuenciales, sin comprobar dueño, prueba 1..1000</tspan></text><rect x="480" y="16" width="452.64" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="940.64" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="940.64" dy="0">984 filas ajenas</tspan></text><text x="470" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">Secuenciales, comprobando dueño</tspan></text><rect x="480" y="60" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="492" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="492" dy="0">0</tspan></text><text x="470" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">UUID, sin comprobar, 1 000 intentos al azar</tspan></text><rect x="480" y="104" width="4" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="492" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="492" dy="0">0</tspan></text><text x="470" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">UUID, sin comprobar, 100 ids filtrados en un registro</tspan></text><rect x="480" y="148" width="43.7" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="531.7" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="531.7" dy="0">95</tspan></text><text x="470" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">UUID, comprobando dueño, 100 ids filtrados</tspan></text><rect x="480" y="192" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="492" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="492" dy="0">0</tspan></text><rect x="10" y="240" width="1080" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="550" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="550" dy="0">Un identificador impredecible reduce la enumeración pero no sustituye la comprobación de dueño: en cuanto un identificador se filtra (URL</tspan></text><text x="550" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="550" dy="0">compartida, registro, correo), la fila queda expuesta. Las 16 filas propias de u-0 no se cuentan como filtración.</tspan></text><text x="550" y="321.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="550" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos y los recuentos de hilos indicados.</tspan></text></svg>
