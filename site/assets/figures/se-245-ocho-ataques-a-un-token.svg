<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 338" width="940" height="338" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ocho ataques a un token firmado: verificador ingenuo y verificador estricto</title><desc id="d">Barras apiladas de los ocho ataques: el verificador que solo comprueba la firma y confía en la cabecera acepta cinco y rechaza tres; el estricto, que fija el algoritmo y comprueba emisor, audiencia y vigencia, rechaza los ocho.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="338" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Ocho ataques a un token firmado: verificador ingenuo y verificador estricto</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Acepta el ataque</tspan></text><rect x="184.64" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="204.64" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="204.64" dy="0">Rechaza el ataque</tspan></text><line x1="224" y1="77" x2="224" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="224" y1="157" x2="224" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="224" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="224" dy="0">0</tspan></text><line x1="386.925" y1="77" x2="386.925" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="386.925" y1="157" x2="386.925" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="386.925" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="386.925" dy="0">2</tspan></text><line x1="549.85" y1="77" x2="549.85" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="549.85" y1="157" x2="549.85" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="549.85" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="549.85" dy="0">4</tspan></text><line x1="712.775" y1="77" x2="712.775" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="712.775" y1="157" x2="712.775" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="712.775" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="712.775" dy="0">6</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="157" x2="875.7" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">8</tspan></text><line x1="224" y1="157" x2="875.7" y2="157" stroke="#5b7280" stroke-width="1.6"/><text x="214" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="214" dy="0">Verificador ingenuo</tspan></text><text x="214" y="141.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="214" dy="0">Verificador estricto</tspan></text><rect x="224" y="84" width="407.312" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="427.656" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="427.656" dy="0">5</tspan></text><rect x="631.312" y="84" width="244.388" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="753.506" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="753.506" dy="0">3</tspan></text><text x="882.7" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">8</tspan></text><rect x="224" y="124" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><rect x="224" y="124" width="651.7" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="549.85" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="549.85" dy="0">8</tspan></text><text x="882.7" y="141.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">8</tspan></text><text x="549.85" y="201" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="549.85" dy="0">Ataques</tspan></text><rect x="10" y="215" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="239.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El token y la clave son sintéticos; el esquema es de laboratorio y no sustituye una biblioteca revisada. La firma válida</tspan></text><text x="470" y="256.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">solo dice quién emitió el token: pertenencia, audiencia y vigencia son reglas aparte. Aceptados: ingenuo 5 de 8, estricto 0</tspan></text><text x="470" y="273.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">de 8.</tspan></text><text x="470" y="320.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos y los recuentos de hilos indicados.</tspan></text></svg>
