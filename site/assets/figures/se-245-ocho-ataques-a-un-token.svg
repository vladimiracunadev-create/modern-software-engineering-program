<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 539" width="830" height="539" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ocho ataques a un token firmado: verificador ingenuo y verificador estricto</title><desc id="d">Tabla: de ocho ataques, el verificador que solo comprueba la firma y confía en la cabecera acepta cinco (alg none, expirado, audiencia ajena, emisor desconocido y nbf futuro); el estricto, que fija el algoritmo y comprueba emisor, audiencia y vigencia, rechaza los ocho.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="830" height="539" fill="#ffffff"/><rect x="10" y="12" width="424" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="222" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="222" dy="0">Ataque</tspan></text><rect x="440" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="532" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="532" dy="0">Ingenuo</tspan></text><rect x="630" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="722" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="722" dy="0">Estricto</tspan></text><rect x="10" y="56" width="424" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Alg none sin firma</tspan></text><rect x="440" y="56" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">acepta</tspan></text><rect x="630" y="56" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">rechaza</tspan></text><rect x="10" y="102" width="424" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="125.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Payload alterado con firma vieja</tspan></text><rect x="440" y="102" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">rechaza</tspan></text><rect x="630" y="102" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">rechaza</tspan></text><rect x="10" y="148" width="424" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="171.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Firma truncada</tspan></text><rect x="440" y="148" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">rechaza</tspan></text><rect x="630" y="148" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">rechaza</tspan></text><rect x="10" y="194" width="424" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="217.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Token expirado</tspan></text><rect x="440" y="194" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">acepta</tspan></text><rect x="630" y="194" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">rechaza</tspan></text><rect x="10" y="240" width="424" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="263.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Audiencia de otra API</tspan></text><rect x="440" y="240" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">acepta</tspan></text><rect x="630" y="240" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">rechaza</tspan></text><rect x="10" y="286" width="424" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="309.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Emisor desconocido</tspan></text><rect x="440" y="286" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">acepta</tspan></text><rect x="630" y="286" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">rechaza</tspan></text><rect x="10" y="332" width="424" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="355.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Aún no válido (nbf futuro)</tspan></text><rect x="440" y="332" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="355.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">acepta</tspan></text><rect x="630" y="332" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="355.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">rechaza</tspan></text><rect x="10" y="378" width="424" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="401.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Clave equivocada</tspan></text><rect x="440" y="378" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="401.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">rechaza</tspan></text><rect x="630" y="378" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="401.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">rechaza</tspan></text><rect x="10" y="428" width="810" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="415" y="452.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="415" dy="0">El token y la clave son sintéticos; el esquema es de laboratorio y no sustituye una biblioteca revisada. La</tspan></text><text x="415" y="469.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="415" dy="0">firma válida solo dice quién emitió el token: pertenencia, audiencia y vigencia son reglas aparte.</tspan></text><text x="415" y="486.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="415" dy="0">Aceptados: ingenuo 5 de 8, estricto 0 de 8.</tspan></text><text x="415" y="525.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="415" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos y los recuentos de hilos indicados.</tspan></text></svg>
