<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 291" width="1000" height="291" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Entregas duplicadas tras reintentar cuando se pierde la respuesta (5 000 entregas, hasta 3 intentos)</title><desc id="d">Barras: sin clave de idempotencia, perder la respuesta con probabilidad 1, 5 y 20 por ciento duplica 0,82, 5,30 y 23,84 por ciento de las entregas; con clave y restricción única el porcentaje es 0 en los tres casos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="291" fill="#ffffff"/><text x="320" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="320" dy="0">Sin clave · respuesta perdida 1 %</tspan></text><rect x="330" y="16" width="16.4" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="354.4" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="354.4" dy="0">0,82 %</tspan></text><text x="320" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="320" dy="0">Sin clave · 5 %</tspan></text><rect x="330" y="60" width="106" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="444" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="444" dy="0">5,30 %</tspan></text><text x="320" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="320" dy="0">Sin clave · 20 %</tspan></text><rect x="330" y="104" width="476.8" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="814.8" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="814.8" dy="0">23,84 %</tspan></text><text x="320" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="320" dy="0">Con Idempotency-Key · 1, 5 y 20 %</tspan></text><rect x="330" y="148" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="342" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="342" dy="0">0,00 %</tspan></text><rect x="10" y="196" width="980" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="500" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">El servidor confirmó la escritura y el cliente no lo supo: el reintento es indistinguible de una solicitud nueva sin una clave. La</tspan></text><text x="500" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">restricción única de la base de datos convierte el segundo insert en un error controlado y se devuelve la respuesta guardada.</tspan></text><text x="500" y="277.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos y los recuentos de hilos indicados.</tspan></text></svg>
