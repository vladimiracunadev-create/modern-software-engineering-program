<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 291" width="1000" height="291" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Efectos duplicados de 2 000 trabajos cuando el trabajador cae tras ejecutar y antes de confirmar</title><desc id="d">Barras: con una cola de visibilidad, si el trabajador cae después de ejecutar el efecto y antes de confirmar, un handler ingenuo duplica 117 efectos con 5 por ciento de caídas y 478 con 20 por ciento; un handler idempotente deja 0 duplicados con las mismas 2 117 y 2 478 ejecuciones.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="291" fill="#ffffff"/><text x="330" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Caída 5 % · handler ingenuo</tspan></text><rect x="340" y="16" width="111.15" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="459.15" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="459.15" dy="0">117 efectos duplicados</tspan></text><text x="330" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Caída 5 % · handler idempotente</tspan></text><rect x="340" y="60" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="352" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="352" dy="0">0</tspan></text><text x="330" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Caída 20 % · handler ingenuo</tspan></text><rect x="340" y="104" width="454.1" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="802.1" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="802.1" dy="0">478</tspan></text><text x="330" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Caída 20 % · handler idempotente</tspan></text><rect x="340" y="148" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="352" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="352" dy="0">0</tspan></text><rect x="10" y="196" width="980" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="500" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">La cola entrega al menos una vez: 2 117 y 2 478 ejecuciones para 2 000 trabajos. El efecto exactamente una vez no lo da la cola, lo</tspan></text><text x="500" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">da el handler al registrar el trabajo ya hecho. La probabilidad de caída es un parámetro del autor.</tspan></text><text x="500" y="277.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos y los recuentos de hilos indicados.</tspan></text></svg>
