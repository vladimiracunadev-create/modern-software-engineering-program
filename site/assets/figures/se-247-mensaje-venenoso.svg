<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 346" width="940" height="346" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">1 000 trabajos de 1 s con 10 venenosos y 2 trabajadores: buenos que terminan según la política</title><desc id="d">Barras con los trabajos buenos completados de 990: reintentar sin límite al frente de la cola completa 99 antes de agotar 20 000 ejecuciones; con tres intentos y cola de muertos, o con tres intentos y reintento al final de la cola, completa los 990 y deja 10 trabajos venenosos aislados.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="346" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">1 000 trabajos de 1 s con 10 venenosos y 2 trabajadores: buenos que terminan según la política</tspan></text><line x1="314" y1="49" x2="314" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="314" y1="181" x2="314" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="314" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="314" dy="0">0</tspan></text><line x1="429.564" y1="49" x2="429.564" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="429.564" y1="181" x2="429.564" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="429.564" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="429.564" dy="0">200</tspan></text><line x1="545.128" y1="49" x2="545.128" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="545.128" y1="181" x2="545.128" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="545.128" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="545.128" dy="0">400</tspan></text><line x1="660.692" y1="49" x2="660.692" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="660.692" y1="181" x2="660.692" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="660.692" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="660.692" dy="0">600</tspan></text><line x1="776.256" y1="49" x2="776.256" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="776.256" y1="181" x2="776.256" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="776.256" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="776.256" dy="0">800</tspan></text><line x1="891.82" y1="49" x2="891.82" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="891.82" y1="181" x2="891.82" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="891.82" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="891.82" dy="0">1 000</tspan></text><line x1="314" y1="181" x2="891.82" y2="181" stroke="#5b7280" stroke-width="1.6"/><text x="304" y="67" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Reintentar sin límite, al frente de la</tspan></text><text x="304" y="84" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">cola</tspan></text><text x="304" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">3 intentos y cola de muertos</tspan></text><text x="304" y="155" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">3 intentos, reintento al final de la</tspan></text><text x="304" y="172" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">cola</tspan></text><rect x="314" y="55" width="57.2042" height="32" rx="3" fill="#087f8c"/><text x="378.204" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="378.204" dy="0">99</tspan></text><rect x="314" y="99" width="572.042" height="32" rx="3" fill="#087f8c"/><text x="893.042" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="893.042" dy="0">990</tspan></text><rect x="314" y="143" width="572.042" height="32" rx="3" fill="#087f8c"/><text x="893.042" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="893.042" dy="0">990</tspan></text><line x1="886.042" y1="49" x2="886.042" y2="181" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="891.042" y="62" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="891.042" dy="0">990</tspan></text><text x="602.91" y="225" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="602.91" dy="0">Trabajos buenos completados (de 990)</tspan></text><rect x="10" y="239" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="263.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Un solo mensaje que siempre falla puede acaparar a los trabajadores. Limitar intentos y apartarlo convierte un fallo del</tspan></text><text x="470" y="280.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">sistema en una cola que una persona revisa. El 1 % de venenosos y la duración de 1 s son supuestos del autor.</tspan></text><text x="470" y="328.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos y los recuentos de hilos indicados.</tspan></text></svg>
