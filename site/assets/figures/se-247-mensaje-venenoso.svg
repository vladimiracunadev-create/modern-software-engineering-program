<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 365" width="1060" height="365" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">1 000 trabajos de 1 s con 10 venenosos y 2 trabajadores: qué política los aísla</title><desc id="d">Tabla: si el trabajo venenoso se reintenta sin límite al frente de la cola, solo 99 de los 990 buenos terminan antes de agotar 20 000 ejecuciones; con tres intentos y cola de muertos, los 990 terminan y 10 trabajos quedan aislados.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1060" height="365" fill="#ffffff"/><rect x="10" y="12" width="364" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="192" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="192" dy="0">Política</tspan></text><rect x="380" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="472" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="472" dy="0">Trabajos buenos</tspan></text><text x="472" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="472" dy="0">completados</tspan></text><rect x="570" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="632" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="632" dy="0">En cola de</tspan></text><text x="632" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="632" dy="0">muertos</tspan></text><rect x="700" y="12" width="174" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="787" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="787" dy="0">Ejecuciones</tspan></text><rect x="880" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="962" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="962" dy="0">Fin del último</tspan></text><text x="962" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="962" dy="0">bueno</tspan></text><rect x="10" y="56" width="364" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="91.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Reintentar sin límite, al frente de la cola</tspan></text><rect x="380" y="56" width="184" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="91.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">99 de 990</tspan></text><rect x="570" y="56" width="124" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="91.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">0</tspan></text><rect x="700" y="56" width="174" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="83.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">20 000 (tope del</tspan></text><text x="787" y="99.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">experimento)</tspan></text><rect x="880" y="56" width="164" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="962" y="91.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="962" dy="0">50 s (nunca termina)</tspan></text><rect x="10" y="126" width="364" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="161.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">3 intentos y cola de muertos</tspan></text><rect x="380" y="126" width="184" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="161.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">990 de 990</tspan></text><rect x="570" y="126" width="124" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="161.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">10</tspan></text><rect x="700" y="126" width="174" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="161.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">1 020</tspan></text><rect x="880" y="126" width="164" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="962" y="161.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="962" dy="0">509 s</tspan></text><rect x="10" y="196" width="364" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="231.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">3 intentos, reintento al final de la cola</tspan></text><rect x="380" y="196" width="184" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">990 de 990</tspan></text><rect x="570" y="196" width="124" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">10</tspan></text><rect x="700" y="196" width="174" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">1 020</tspan></text><rect x="880" y="196" width="164" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="962" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="962" dy="0">500 s</tspan></text><rect x="10" y="270" width="1040" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="530" y="294.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="530" dy="0">Un solo mensaje que siempre falla puede acaparar a los trabajadores. Limitar intentos y apartarlo convierte un fallo del sistema en una cola</tspan></text><text x="530" y="311.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="530" dy="0">que una persona revisa. El 1 % de venenosos y la duración de 1 s son supuestos del autor.</tspan></text><text x="530" y="351.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="530" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos y los recuentos de hilos indicados.</tspan></text></svg>
