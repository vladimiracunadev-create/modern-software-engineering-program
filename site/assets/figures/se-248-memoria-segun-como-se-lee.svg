<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 307" width="1000" height="307" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Pico de memoria de Python al calcular el SHA-256 de un archivo sintético de 64 MiB</title><desc id="d">Barras: leer el archivo de 64 MiB entero provoca un pico de 64,01 MiB; leerlo por trozos de 4 KiB, 64 KiB o 1 MiB produce picos de 0,02, 0,13 y 2,01 MiB con el mismo SHA-256, 4fca9c72bd87.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="307" fill="#ffffff"/><text x="300" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Leer todo en memoria</tspan></text><rect x="310" y="16" width="416.065" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="734.065" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="734.065" dy="0">64,01 MiB</tspan></text><text x="300" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Trozos de 4 KiB</tspan></text><rect x="310" y="60" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="322" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="322" dy="0">0,02 MiB</tspan></text><text x="300" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Trozos de 64 KiB</tspan></text><rect x="310" y="104" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="322" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="322" dy="0">0,13 MiB</tspan></text><text x="300" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Trozos de 1 MiB</tspan></text><rect x="310" y="148" width="13.065" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="331.065" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="331.065" dy="0">2,01 MiB</tspan></text><rect x="10" y="196" width="980" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="500" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">El hash es idéntico; lo que cambia es la memoria que cada solicitud retiene. Con 50 cargas simultáneas el diseño que lee todo</tspan></text><text x="500" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">retiene 3,2 GiB solo en búfer. Los tiempos (190 a 420 ms) fueron del orden del mismo valor para cualquier tamaño de trozo y varían</tspan></text><text x="500" y="254.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">por equipo.</tspan></text><text x="500" y="293.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Medido con tracemalloc en CPython 3.12.9 (Windows) y 3.12.3 (Ubuntu); los picos coinciden con diferencias de 0,01 MiB.</tspan></text></svg>
