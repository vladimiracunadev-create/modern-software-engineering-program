<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 344" width="940" height="344" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Bombas de descompresión: razón de compresión de tres entradas de 10 MB</title><desc id="d">Barras horizontales en escala logarítmica con la razón de compresión de 10 MB de entrada: 1 027 a 1 para ceros, 685 a 1 para texto repetido y 1 a 1 para datos aleatorios; el tope de salida a 50 MB y la lectura por trozos detienen la bomba de 200 MB comprimida a 194 kB al llegar a 48 MB.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="344" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Bombas de descompresión: razón de compresión de tres entradas de 10 MB</tspan></text><line x1="294" y1="49" x2="294" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="163" x2="294" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">0,1</tspan></text><line x1="410.34" y1="49" x2="410.34" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="410.34" y1="163" x2="410.34" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="410.34" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="410.34" dy="0">1</tspan></text><line x1="526.68" y1="49" x2="526.68" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="526.68" y1="163" x2="526.68" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="526.68" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="526.68" dy="0">10</tspan></text><line x1="643.02" y1="49" x2="643.02" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="643.02" y1="163" x2="643.02" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="643.02" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="643.02" dy="0">100</tspan></text><line x1="759.36" y1="49" x2="759.36" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="759.36" y1="163" x2="759.36" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="759.36" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="759.36" dy="0">1 000</tspan></text><line x1="875.7" y1="49" x2="875.7" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="163" x2="875.7" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">10 000</tspan></text><line x1="294" y1="163" x2="875.7" y2="163" stroke="#5b7280" stroke-width="1.6"/><text x="284" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">10 MB de ceros (9,7 kB)</tspan></text><text x="284" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">10 MB de texto repetido (14,6 kB)</tspan></text><text x="284" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">10 MB aleatorios (10 003 kB)</tspan></text><rect x="294" y="55" width="466.706" height="26" rx="3" fill="#c0432f"/><text x="767.706" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="767.706" dy="0">1 027</tspan></text><rect x="294" y="93" width="446.244" height="26" rx="3" fill="#c0432f"/><text x="747.244" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="747.244" dy="0">685</tspan></text><rect x="294" y="131" width="116.34" height="26" rx="3" fill="#c0432f"/><text x="417.34" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="417.34" dy="0">1</tspan></text><text x="584.85" y="207" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="584.85" dy="0">Razón de compresión (veces) (escala logarítmica)</tspan></text><rect x="10" y="221" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="245.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Los 12 nombres de archivo hostiles y la bomba de 200 MB están en la tabla. La diferencia entre sistemas sale de que Windows</tspan></text><text x="470" y="262.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">trata la barra invertida como separador. El tamaño comprimido no dice nada del descomprimido: el límite debe aplicarse a la</tspan></text><text x="470" y="279.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">salida. Los nombres y las razones son sintéticos; no se probó ningún formato real de archivo comprimido ni un antivirus.</tspan></text><text x="470" y="326.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos y los recuentos de hilos indicados.</tspan></text></svg>
