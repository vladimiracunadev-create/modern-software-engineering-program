t="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="760.558" dy="0">600 s</tspan></text><rect x="10" y="486" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="510.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Subir el TTL compra aciertos con obsolescencia: de 60 a 600 s con 2 500 entradas el acierto sube 11,6 puntos y las lecturas</tspan></text><text x="470" y="527.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">obsoletas se multiplican por 10. Con capacidad pequeña el TTL no importa: manda la capacidad. La popularidad Zipf y el</tspan></text><text x="470" y="544.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cambio cada 300 a 900 s son supuestos del autor.</tspan></text><text x="470" y="591.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos y los recuentos de hilos indicados.</tspan></text></svg>
