<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 263" width="1020" height="263" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Consultas al origen cuando una clave caliente expira y 200 hilos la piden a la vez</title><desc id="d">Barras: sin protección, 200 hilos que encuentran la caché vacía generan entre 169 y 189 consultas al origen en Windows y entre 46 y 129 en Ubuntu; con una única carga en vuelo (single-flight) el origen recibe 1 consulta en las seis ejecuciones.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1020" height="263" fill="#ffffff"/><text x="400" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Sin protección · Windows (3 ejecuciones)</tspan></text><rect x="410" y="16" width="453.6" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="871.6" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="871.6" dy="0">169 a 189 consultas</tspan></text><text x="400" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Sin protección · Ubuntu (3 ejecuciones)</tspan></text><rect x="410" y="60" width="309.6" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="727.6" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="727.6" dy="0">46 a 129</tspan></text><text x="400" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Single-flight · ambos sistemas (6 ejecuciones)</tspan></text><rect x="410" y="104" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="422" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="422" dy="0">1</tspan></text><rect x="10" y="152" width="1000" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="510" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="510" dy="0">El número sin protección depende del reparto de hilos del sistema operativo y cambia entre ejecuciones; el valor con single-flight no.</tspan></text><text x="510" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="510" dy="0">Esperar al líder reduce la carga del origen a cambio de que todos esperen su latencia (50 ms aquí) y de que un líder lento o fallido</tspan></text><text x="510" y="210.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="510" dy="0">bloquee a los demás.</tspan></text><text x="510" y="249.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="510" dy="0">Hilos reales con una carga simulada de 50 ms; los recuentos sin protección no son deterministas.</tspan></text></svg>
