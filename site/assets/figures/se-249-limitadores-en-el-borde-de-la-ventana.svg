<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 406" width="940" height="406" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Solicitudes aceptadas de una ráfaga de 200 junto al cambio de ventana</title><desc id="d">Barras con las solicitudes aceptadas de una ráfaga de 200 agrupadas en dos segundos alrededor del cambio de ventana: la ventana fija de 100 por 10 segundos acepta 200, la deslizante 100, la cubeta de fichas de capacidad 20 acepta 39 y la de capacidad 100 acepta 119; el límite pretendido es 100.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="406" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Solicitudes aceptadas de una ráfaga de 200 junto al cambio de ventana</tspan></text><line x1="314" y1="49" x2="314" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="314" y1="225" x2="314" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="314" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="314" dy="0">0</tspan></text><line x1="458.455" y1="49" x2="458.455" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="458.455" y1="225" x2="458.455" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="458.455" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="458.455" dy="0">50</tspan></text><line x1="602.91" y1="49" x2="602.91" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="602.91" y1="225" x2="602.91" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="602.91" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602.91" dy="0">100</tspan></text><line x1="747.365" y1="49" x2="747.365" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="747.365" y1="225" x2="747.365" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="747.365" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747.365" dy="0">150</tspan></text><line x1="891.82" y1="49" x2="891.82" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="891.82" y1="225" x2="891.82" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="891.82" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="891.82" dy="0">200</tspan></text><line x1="314" y1="225" x2="891.82" y2="225" stroke="#5b7280" stroke-width="1.6"/><text x="304" y="75.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Ventana fija 100 / 10 s</tspan></text><text x="304" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Ventana deslizante 100 / 10 s</tspan></text><text x="304" y="155" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Cubeta de fichas, 10 por s, capacidad</tspan></text><text x="304" y="172" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">20</tspan></text><text x="304" y="199" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Cubeta de fichas, 10 por s, capacidad</tspan></text><text x="304" y="216" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">100</tspan></text><rect x="314" y="55" width="577.82" height="32" rx="3" fill="#946512"/><text x="898.82" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="898.82" dy="0">200</tspan></text><rect x="314" y="99" width="288.91" height="32" rx="3" fill="#946512"/><text x="609.91" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="609.91" dy="0">100</tspan></text><rect x="314" y="143" width="112.675" height="32" rx="3" fill="#946512"/><text x="433.675" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="433.675" dy="0">39</tspan></text><rect x="314" y="187" width="343.803" height="32" rx="3" fill="#946512"/><text x="664.803" y="207.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="664.803" dy="0">119</tspan></text><line x1="602.91" y1="49" x2="602.91" y2="225" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="607.91" y="62" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="607.91" dy="0">límite 100</tspan></text><text x="602.91" y="269" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="602.91" dy="0">Solicitudes aceptadas (de 200)</tspan></text><rect x="10" y="283" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="307.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La ventana fija permite el doble del límite nominal en dos segundos. La deslizante es exacta pero rechaza más tráfico</tspan></text><text x="470" y="324.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">legítimo agrupado (920 frente a 966). La cubeta permite una ráfaga acotada por su capacidad y mantiene la tasa media.</tspan></text><text x="470" y="341.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Ningún limitador distingue a un atacante de un cliente legítimo sin una identidad fiable.</tspan></text><text x="470" y="388.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos y los recuentos de hilos indicados.</tspan></text></svg>
