<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 302" width="940" height="302" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La base de datos cae 120 s de 600: segundos sin proceso según el diseño de sondeos</title><desc id="d">Barras con los segundos sin proceso: si el sondeo de vida consulta la base de datos hay 4 reinicios y 80 segundos sin proceso; si el sondeo de vida es local y solo el de disponibilidad consulta la base hay 0 reinicios y 0 segundos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="302" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">La base de datos cae 120 s de 600: segundos sin proceso según el diseño de sondeos</tspan></text><line x1="334" y1="49" x2="334" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="334" y1="137" x2="334" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="334" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="334" dy="0">0</tspan></text><line x1="475.47" y1="49" x2="475.47" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="475.47" y1="137" x2="475.47" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="475.47" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="475.47" dy="0">20</tspan></text><line x1="616.94" y1="49" x2="616.94" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="616.94" y1="137" x2="616.94" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="616.94" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="616.94" dy="0">40</tspan></text><line x1="758.41" y1="49" x2="758.41" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="758.41" y1="137" x2="758.41" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="758.41" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="758.41" dy="0">60</tspan></text><line x1="899.88" y1="49" x2="899.88" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="899.88" y1="137" x2="899.88" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="899.88" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="899.88" dy="0">80</tspan></text><line x1="334" y1="137" x2="899.88" y2="137" stroke="#5b7280" stroke-width="1.6"/><text x="324" y="67" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="324" dy="0">Liveness y readiness consultan la base (4</tspan></text><text x="324" y="84" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="324" dy="0">reinicios)</tspan></text><text x="324" y="111" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="324" dy="0">Liveness local; readiness consulta la base</tspan></text><text x="324" y="128" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="324" dy="0">(0 reinicios)</tspan></text><rect x="334" y="55" width="565.88" height="32" rx="3" fill="#c0432f"/><text x="906.88" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="906.88" dy="0">80</tspan></text><rect x="334" y="99" width="2" height="32" rx="3" fill="#c0432f"/><text x="343" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="343" dy="0">0</tspan></text><text x="616.94" y="181" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="616.94" dy="0">Segundos sin proceso (de 600)</tspan></text><rect x="10" y="195" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="219.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Un reinicio no arregla una dependencia externa: la pierde la caché y añade 20 s de arranque a la caída. Los sondeos cada 5</tspan></text><text x="470" y="236.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">s, el umbral de 3 fallos y el arranque de 20 s son parámetros del autor, no valores por defecto de una plataforma.</tspan></text><text x="470" y="284.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos y los recuentos de hilos indicados.</tspan></text></svg>
