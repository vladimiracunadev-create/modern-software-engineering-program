<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 307" width="1000" height="307" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Pruebas que fallan contra la API con los 10 defectos a la vez</title><desc id="d">Barras: sobre la API con los 10 defectos, la suite de camino feliz tiene 0 pruebas fallidas de 5, la de contrato 7 de 8 y la adversaria 7 de 9; sobre la API reparada ninguna de las 22 pruebas falla.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="307" fill="#ffffff"/><text x="370" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="370" dy="0">Camino feliz · API con 10 defectos</tspan></text><rect x="380" y="16" width="4" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="392" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="392" dy="0">0 de 5 fallan</tspan></text><text x="370" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="370" dy="0">Contrato · API con 10 defectos</tspan></text><rect x="380" y="60" width="280" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="668" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="668" dy="0">7 de 8</tspan></text><text x="370" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="370" dy="0">Adversaria · API con 10 defectos</tspan></text><rect x="380" y="104" width="280" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="668" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="668" dy="0">7 de 9</tspan></text><text x="370" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="370" dy="0">Las tres suites · API reparada</tspan></text><rect x="380" y="148" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="392" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="392" dy="0">0 de 22</tspan></text><rect x="10" y="196" width="980" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="500" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Un conjunto verde de camino feliz no dice nada sobre la seguridad ni la coherencia: la API vulnerable lo supera. Que la API</tspan></text><text x="500" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">reparada pase todas las pruebas solo significa que las pruebas conocidas no fallan; no hay prueba de que no existan defectos que</tspan></text><text x="500" y="254.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">nadie escribió.</tspan></text><text x="500" y="293.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos y los recuentos de hilos indicados.</tspan></text></svg>
