<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 577" width="940" height="577" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué suite detecta cada defecto reintroducido en la API reparada</title><desc id="d">Mapa de calor de diez defectos y tres suites: la suite de camino feliz no detecta ninguno; la de contrato detecta la validación laxa y los estados inconsistentes; la adversaria detecta siete; el error con detalles internos no lo detecta ninguna cuando se reintroduce solo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="577" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué suite detecta cada defecto reintroducido en la API reparada</tspan></text><text x="381.667" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="381.667" dy="0">Camino feliz (5 pruebas)</tspan></text><text x="597" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="597" dy="0">Contrato (8)</tspan></text><text x="812.333" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="812.333" dy="0">Adversaria (9)</tspan></text><text x="264" y="93.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">D1 sin comprobar dueño (BOLA)</tspan></text><text x="264" y="127.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">D2 asignación masiva</tspan></text><text x="264" y="161.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">D3 inyección SQL</tspan></text><text x="264" y="195.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">D4 GET con efecto</tspan></text><text x="264" y="229.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">D5 error con detalles internos</tspan></text><text x="264" y="263.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">D6 cuerpo sin tope</tspan></text><text x="264" y="297.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">D7 validación laxa</tspan></text><text x="264" y="331.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">D8 sin idempotencia</tspan></text><text x="264" y="365.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">D9 estados inconsistentes</tspan></text><text x="264" y="399.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">D10 token sin verificar</tspan></text><rect x="275.5" y="73.5" width="212.333" height="31" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="381.667" y="93.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="381.667" dy="0">no</tspan></text><rect x="490.833" y="73.5" width="212.333" height="31" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="597" y="93.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="597" dy="0">no</tspan></text><rect x="706.167" y="73.5" width="212.333" height="31" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="812.333" y="93.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="812.333" dy="0">detecta</tspan></text><rect x="275.5" y="107.5" width="212.333" height="31" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="381.667" y="127.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="381.667" dy="0">no</tspan></text><rect x="490.833" y="107.5" width="212.333" height="31" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="597" y="127.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="597" dy="0">no</tspan></text><rect x="706.167" y="107.5" width="212.333" height="31" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="812.333" y="127.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="812.333" dy="0">detecta</tspan></text><rect x="275.5" y="141.5" width="212.333" height="31" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="381.667" y="161.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="381.667" dy="0">no</tspan></text><rect x="490.833" y="141.5" width="212.333" height="31" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="597" y="161.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="597" dy="0">no</tspan></text><rect x="706.167" y="141.5" width="212.333" height="31" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="812.333" y="161.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="812.333" dy="0">detecta</tspan></text><rect x="275.5" y="175.5" width="212.333" height="31" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="381.667" y="195.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="381.667" dy="0">no</tspan></text><rect x="490.833" y="175.5" width="212.333" height="31" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="597" y="195.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="597" dy="0">no</tspan></text><rect x="706.167" y="175.5" width="212.333" height="31" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="812.333" y="195.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="812.333" dy="0">detecta</tspan></text><rect x="275.5" y="209.5" width="212.333" height="31" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="381.667" y="229.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="381.667" dy="0">no</tspan></text><rect x="490.833" y="209.5" width="212.333" height="31" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="597" y="229.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="597" dy="0">no</tspan></text><rect x="706.167" y="209.5" width="212.333" height="31" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="812.333" y="229.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="812.333" dy="0">no</tspan></text><rect x="275.5" y="243.5" width="212.333" height="31" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="381.667" y="263.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="381.667" dy="0">no</tspan></text><rect x="490.833" y="243.5" width="212.333" height="31" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="597" y="263.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="597" dy="0">no</tspan></text><rect x="706.167" y="243.5" width="212.333" height="31" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="812.333" y="263.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="812.333" dy="0">detecta</tspan></text><rect x="275.5" y="277.5" width="212.333" height="31" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="381.667" y="297.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="381.667" dy="0">no</tspan></text><rect x="490.833" y="277.5" width="212.333" height="31" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="597" y="297.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="597" dy="0">detecta</tspan></text><rect x="706.167" y="277.5" width="212.333" height="31" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="812.333" y="297.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="812.333" dy="0">no</tspan></text><rect x="275.5" y="311.5" width="212.333" height="31" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="381.667" y="331.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="381.667" dy="0">no</tspan></text><rect x="490.833" y="311.5" width="212.333" height="31" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="597" y="331.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="597" dy="0">no</tspan></text><rect x="706.167" y="311.5" width="212.333" height="31" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="812.333" y="331.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="812.333" dy="0">detecta</tspan></text><rect x="275.5" y="345.5" width="212.333" height="31" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="381.667" y="365.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="381.667" dy="0">no</tspan></text><rect x="490.833" y="345.5" width="212.333" height="31" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="597" y="365.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="597" dy="0">detecta</tspan></text><rect x="706.167" y="345.5" width="212.333" height="31" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="812.333" y="365.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="812.333" dy="0">no</tspan></text><rect x="275.5" y="379.5" width="212.333" height="31" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="381.667" y="399.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="381.667" dy="0">no</tspan></text><rect x="490.833" y="379.5" width="212.333" height="31" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="597" y="399.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="597" dy="0">no</tspan></text><rect x="706.167" y="379.5" width="212.333" height="31" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="812.333" y="399.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="812.333" dy="0">detecta</tspan></text><text x="274" y="438" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="274" dy="0">no</tspan></text><rect x="297.08" y="426" width="30.5" height="14" fill="#dff1ee"/><rect x="327.08" y="426" width="30.5" height="14" fill="#c0e1e0"/><rect x="357.08" y="426" width="30.5" height="14" fill="#a2d0d2"/><rect x="387.08" y="426" width="30.5" height="14" fill="#83c0c4"/><rect x="417.08" y="426" width="30.5" height="14" fill="#64b0b6"/><rect x="447.08" y="426" width="30.5" height="14" fill="#45a0a8"/><rect x="477.08" y="426" width="30.5" height="14" fill="#278f9a"/><rect x="507.08" y="426" width="30.5" height="14" fill="#087f8c"/><text x="545.08" y="438" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="545.08" dy="0">detecta</tspan></text><text x="605.86" y="438" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="605.86" dy="0">más oscuro = mayor (Defecto detectado = 1, no detectado = 0)</tspan></text><rect x="10" y="454" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="478.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El defecto D5 queda dormido: solo se manifiesta si algo provoca un error interno, y con la inyección corregida nada lo</tspan></text><text x="470" y="495.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">provoca. Una suite no prueba el camino de error si no sabe cómo llegar a él. Contado sobre una API de laboratorio, no sobre</tspan></text><text x="470" y="512.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">un producto.</tspan></text><text x="470" y="559.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos y los recuentos de hilos indicados.</tspan></text></svg>
