o se manifiesta si algo provoca un error interno, y con la inyección corregida nada lo provoca. Una</tspan></text><text x="505" y="501.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="505" dy="0">suite no prueba el camino de error si no sabe cómo llegar a él. Contado sobre una API de laboratorio, no sobre un producto.</tspan></text><text x="505" y="541.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="505" dy="0">Datos sintéticos, semilla fija; idénticos en Windows y Ubuntu (WSL2), salvo los tiempos y los recuentos de hilos indicados.</tspan></text></svg>
