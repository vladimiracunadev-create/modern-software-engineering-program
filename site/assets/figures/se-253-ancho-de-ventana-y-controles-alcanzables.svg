<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 415" width="1010" height="415" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Doce controles según el ancho de ventana: diseño fijo frente a diseño adaptable</title><desc id="d">Tabla con cinco anchos de ventana de 320 a 1280 píxeles: un diseño de una sola fila de 1200 píxeles deja visibles 3, 3, 7, 10 y 12 de doce controles, y un diseño que se reparte en filas muestra los doce en 6, 4, 2, 2 y 1 filas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1010" height="415" fill="#ffffff"/><rect x="10" y="12" width="104" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="62" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="62" dy="0">Ancho</tspan></text><rect x="120" y="12" width="514" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="377" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="377" dy="0">Diseño fijo de una fila (100 px por control)</tspan></text><rect x="640" y="12" width="354" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="817" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="817" dy="0">Diseño adaptable (104 px por columna)</tspan></text><rect x="10" y="56" width="104" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="62" y="82.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="62" dy="0">320 px</tspan></text><rect x="120" y="56" width="514" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="377" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="377" dy="0">3 de 12 sin desplazar; el resto exige desplazamiento horizontal</tspan></text><rect x="640" y="56" width="354" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">12 de 12 en 6 filas</tspan></text><rect x="10" y="108" width="104" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="62" y="134.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="62" dy="0">390 px</tspan></text><rect x="120" y="108" width="514" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="377" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="377" dy="0">3 de 12 sin desplazar</tspan></text><rect x="640" y="108" width="354" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">12 de 12 en 4 filas</tspan></text><rect x="10" y="160" width="104" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="62" y="186.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="62" dy="0">768 px</tspan></text><rect x="120" y="160" width="514" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="377" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="377" dy="0">7 de 12 sin desplazar</tspan></text><rect x="640" y="160" width="354" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">12 de 12 en 2 filas</tspan></text><rect x="10" y="212" width="104" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="62" y="238.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="62" dy="0">1024 px</tspan></text><rect x="120" y="212" width="514" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="377" y="238.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="377" dy="0">10 de 12 sin desplazar</tspan></text><rect x="640" y="212" width="354" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="238.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">12 de 12 en 2 filas</tspan></text><rect x="10" y="264" width="104" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="62" y="290.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="62" dy="0">1280 px</tspan></text><rect x="120" y="264" width="514" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="377" y="290.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="377" dy="0">12 de 12 en una fila</tspan></text><rect x="640" y="264" width="354" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="290.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">12 de 12 en una fila</tspan></text><rect x="10" y="320" width="990" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="505" y="344.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="505" dy="0">El modelo cuenta solo geometría: no mide legibilidad, tamaño táctil ni orden de lectura. Reflujo no significa buen diseño, pero un</tspan></text><text x="505" y="361.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="505" dy="0">diseño de escritorio fijo deja inalcanzables nueve de doce controles en una pantalla de 320 px.</tspan></text><text x="505" y="401.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="505" dy="0">Modelo sintético con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
