<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 335" width="1080" height="335" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Arranques en frío según la rapidez con que el sistema recupera la memoria</title><desc id="d">Barras: con tiempos de ausencia sintéticos de mediana 20 minutos, el porcentaje de regresos que son arranque en frío es 0 si el sistema nunca recupera el proceso y 16,4, 38,3, 66,5 y 84,6 por ciento cuando la constante de recuperación baja de 240 a 5 minutos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1080" height="335" fill="#ffffff"/><text x="400" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Escritorio sin recuperación de memoria</tspan></text><rect x="410" y="16" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="422" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="422" dy="0">0 %</tspan></text><text x="400" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Recuperación lenta (tau = 240 min)</tspan></text><rect x="410" y="60" width="98.4" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="516.4" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="516.4" dy="0">16,4 %</tspan></text><text x="400" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Recuperación moderada (tau = 60 min)</tspan></text><rect x="410" y="104" width="229.8" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="647.8" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="647.8" dy="0">38,3 %</tspan></text><text x="400" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Recuperación agresiva (tau = 15 min)</tspan></text><rect x="410" y="148" width="399" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="817" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="817" dy="0">66,5 %</tspan></text><text x="400" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Recuperación muy agresiva (tau = 5 min)</tspan></text><rect x="410" y="192" width="507.6" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="925.6" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="925.6" dy="0">84,6 %</tspan></text><rect x="10" y="240" width="1060" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="540" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="540" dy="0">El porcentaje de regresos que parten de cero depende de una constante que el equipo no controla. El diseño que asume continuidad (proceso</tspan></text><text x="540" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="540" dy="0">vivo) funciona en el primer caso y falla en los demás: la restauración del estado debe ser parte normal del arranque.</tspan></text><text x="540" y="321.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="540" dy="0">Modelo sintético con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
