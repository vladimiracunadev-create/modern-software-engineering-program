<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 323" width="1030" height="323" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Restaurar un estado guardado por la versión 1 con la versión 2, 3 o 4</title><desc id="d">Tabla de tres políticas de lectura: la estricta falla en las 2000 restauraciones con cada versión, los valores por defecto fallan solo cuando cambia la forma de un campo existente en la versión 4, y las migraciones encadenadas no fallan.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1030" height="323" fill="#ffffff"/><rect x="10" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Política de lectura</tspan></text><rect x="390" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="472" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="472" dy="0">Versión 2</tspan></text><rect x="560" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="642" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="642" dy="0">Versión 3</tspan></text><rect x="730" y="12" width="284" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="872" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="872" dy="0">Versión 4 (cambia la forma del</tspan></text><text x="872" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="872" dy="0">cursor)</tspan></text><rect x="10" y="56" width="374" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="84.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Estricta (rechaza otra versión)</tspan></text><rect x="390" y="56" width="164" height="50" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="472" y="84.36" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="472" dy="0">2000 de 2000</tspan></text><rect x="560" y="56" width="164" height="50" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="642" y="84.36" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="642" dy="0">2000 de 2000</tspan></text><rect x="730" y="56" width="284" height="50" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="872" y="84.36" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="872" dy="0">2000 de 2000</tspan></text><rect x="10" y="112" width="374" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="140.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Valores por defecto para campos nuevos</tspan></text><rect x="390" y="112" width="164" height="50" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="472" y="140.36" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="472" dy="0">0</tspan></text><rect x="560" y="112" width="164" height="50" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="642" y="140.36" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="642" dy="0">0</tspan></text><rect x="730" y="112" width="284" height="50" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="872" y="140.36" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="872" dy="0">2000 de 2000</tspan></text><rect x="10" y="168" width="374" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="196.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Migraciones paso a paso (v1→v2→v3→v4)</tspan></text><rect x="390" y="168" width="164" height="50" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="472" y="196.36" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="472" dy="0">0</tspan></text><rect x="560" y="168" width="164" height="50" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="642" y="196.36" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="642" dy="0">0</tspan></text><rect x="730" y="168" width="284" height="50" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="872" y="196.36" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="872" dy="0">0</tspan></text><rect x="10" y="228" width="1010" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="515" y="252.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="515" dy="0">Los valores por defecto sirven mientras solo se añaden campos. Cuando un campo cambia de forma (un número pasa a ser un par línea y</tspan></text><text x="515" y="269.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="515" dy="0">columna) hace falta una migración explícita y una prueba que restaure un estado guardado por cada versión anterior.</tspan></text><text x="515" y="309.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="515" dy="0">Modelo sintético con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
