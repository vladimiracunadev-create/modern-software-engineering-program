<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 428" width="940" height="428" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Restaurar un estado guardado por la versión 1 con la versión 2, 3 o 4: restauraciones fallidas de 2000</title><desc id="d">Mapa de calor con las restauraciones fallidas de 2000 de un estado guardado por la versión 1: la política estricta falla las 2000 con la versión 2, la 3 y la 4; los valores por defecto para campos nuevos no fallan con la 2 ni la 3 y fallan las 2000 con la 4, que cambia la forma del cursor; las migraciones paso a paso no fallan nunca.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="428" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Restaurar un estado guardado por la versión 1 con la versión 2, 3 o 4: restauraciones fallidas de 2000</tspan></text><text x="608" y="59" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="608" dy="0">Versión que restaura el estado</tspan></text><text x="400" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="400" dy="0">Versión 2</tspan></text><text x="608" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="608" dy="0">Versión 3</tspan></text><text x="816" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="816" dy="0">Versión 4 (cambia la forma</tspan></text><text x="816" y="99" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="816" dy="0">del cursor)</tspan></text><text x="286" y="143.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="286" dy="0">Estricta (rechaza otra versión)</tspan></text><text x="286" y="191" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="286" dy="0">Valores por defecto para campos</tspan></text><text x="286" y="208" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="286" dy="0">nuevos</tspan></text><text x="286" y="247" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="286" dy="0">Migraciones paso a paso</tspan></text><text x="286" y="264" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="286" dy="0">(v1→v2→v3→v4)</tspan></text><rect x="297.5" y="112.5" width="205" height="53" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="400" y="143.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="400" dy="0">2 000</tspan></text><rect x="505.5" y="112.5" width="205" height="53" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="608" y="143.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="608" dy="0">2 000</tspan></text><rect x="713.5" y="112.5" width="205" height="53" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="816" y="143.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="816" dy="0">2 000</tspan></text><rect x="297.5" y="168.5" width="205" height="53" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="400" y="199.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="400" dy="0">0</tspan></text><rect x="505.5" y="168.5" width="205" height="53" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="608" y="199.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="608" dy="0">0</tspan></text><rect x="713.5" y="168.5" width="205" height="53" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="816" y="199.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="816" dy="0">2 000</tspan></text><rect x="297.5" y="224.5" width="205" height="53" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="400" y="255.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="400" dy="0">0</tspan></text><rect x="505.5" y="224.5" width="205" height="53" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="608" y="255.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="608" dy="0">0</tspan></text><rect x="713.5" y="224.5" width="205" height="53" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="816" y="255.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="816" dy="0">0</tspan></text><text x="20" y="195" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 195)">Política de lectura</text><text x="296" y="305" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="296" dy="0">0</tspan></text><rect x="311.54" y="293" width="30.5" height="14" fill="#fbe4de"/><rect x="341.54" y="293" width="30.5" height="14" fill="#f3cdc5"/><rect x="371.54" y="293" width="30.5" height="14" fill="#eab6ac"/><rect x="401.54" y="293" width="30.5" height="14" fill="#e29f93"/><rect x="431.54" y="293" width="30.5" height="14" fill="#d9887a"/><rect x="461.54" y="293" width="30.5" height="14" fill="#d17161"/><rect x="491.54" y="293" width="30.5" height="14" fill="#c85a48"/><rect x="521.54" y="293" width="30.5" height="14" fill="#c0432f"/><text x="559.54" y="305" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="559.54" dy="0">2 000</tspan></text><text x="605.24" y="305" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="605.24" dy="0">más oscuro = mayor (restauraciones fallidas de 2000)</tspan></text><rect x="10" y="321" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="345.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los valores por defecto sirven mientras solo se añaden campos. Cuando un campo cambia de forma (un número pasa a ser un par</tspan></text><text x="470" y="362.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">línea y columna) hace falta una migración explícita y una prueba que restaure un estado guardado por cada versión anterior.</tspan></text><text x="470" y="410.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo sintético con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
