<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 291" width="860" height="291" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Capacidades que ofrecen todas las plataformas cuando cada una ofrece el 80 %</title><desc id="d">Barras: si cada plataforma ofrece al azar el 80 por ciento de veinte capacidades, la intersección media de 1000 sorteos es 12,66 con dos plataformas, 10,19 con tres, 8,15 con cuatro y 5,27 con seis.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="860" height="291" fill="#ffffff"/><text x="220" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="220" dy="0">2 plataformas</tspan></text><rect x="230" y="16" width="506.4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="744.4" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="744.4" dy="0">12,66 de 20</tspan></text><text x="220" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="220" dy="0">3 plataformas</tspan></text><rect x="230" y="60" width="407.6" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="645.6" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="645.6" dy="0">10,19 de 20</tspan></text><text x="220" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="220" dy="0">4 plataformas</tspan></text><rect x="230" y="104" width="326" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="564" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="564" dy="0">8,15 de 20</tspan></text><text x="220" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="220" dy="0">6 plataformas</tspan></text><rect x="230" y="148" width="210.8" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="448.8" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="448.8" dy="0">5,27 de 20</tspan></text><rect x="10" y="196" width="840" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="430" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="430" dy="0">Un cliente que solo usa lo que todas ofrecen se encoge como 0,8 elevado al número de plataformas. Por eso las</tspan></text><text x="430" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="430" dy="0">abstracciones comunes necesitan capacidades opcionales declaradas y una degradación explícita.</tspan></text><text x="430" y="277.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="430" dy="0">Capacidades sintéticas con semilla fija; no describen ninguna plataforma real. Idénticas en Windows y Ubuntu.</tspan></text></svg>
