<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 307" width="960" height="307" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué opción gana cuando los pesos de los criterios se sortean 10 000 veces</title><desc id="d">Barras: con cuatro opciones puntuadas de 1 a 5 en siete criterios y pesos aleatorios, gana la opción nativa en 37,9 por ciento de los sorteos, la multiplataforma con interfaz propia en 27,4, la híbrida en 23,9 y la web instalable en 10,8.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="307" fill="#ffffff"/><text x="330" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Nativo por plataforma</tspan></text><rect x="340" y="16" width="341.1" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="689.1" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="689.1" dy="0">37,9 %</tspan></text><text x="330" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Multiplataforma con interfaz propia</tspan></text><rect x="340" y="60" width="246.6" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="594.6" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="594.6" dy="0">27,4 %</tspan></text><text x="330" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Híbrido (web en contenedor)</tspan></text><rect x="340" y="104" width="215.1" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="563.1" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="563.1" dy="0">23,9 %</tspan></text><text x="330" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Web instalable</tspan></text><rect x="340" y="148" width="97.2" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="445.2" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="445.2" dy="0">10,8 %</tspan></text><rect x="10" y="196" width="940" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Con pesos iguales gana la multiplataforma por 3,86 frente a 3,71 de otras dos, una diferencia que desaparece si cada</tspan></text><text x="480" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">puntuación cambia en uno: el ganador solo se mantiene en 59,1 % de 10 000 perturbaciones. La tabla de decisión ordena el</tspan></text><text x="480" y="254.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">debate; no lo cierra.</tspan></text><text x="480" y="293.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Puntuaciones y pesos: supuestos del autor, no mediciones de productos; semilla fija, idénticos en Windows y Ubuntu.</tspan></text></svg>
