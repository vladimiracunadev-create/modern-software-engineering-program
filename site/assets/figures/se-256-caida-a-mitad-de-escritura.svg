<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 329" width="1020" height="329" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Terminar el proceso a mitad de una escritura: tres formas de guardar</title><desc id="d">Tabla con tres formas de guardar un documento local y qué queda tras terminar el proceso a mitad de la escritura: el archivo sobrescrito queda corrupto, el temporal con reemplazo conserva el anterior y SQLite conserva la última transacción confirmada.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1020" height="329" fill="#ffffff"/><rect x="10" y="12" width="334" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="177" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="177" dy="0">Forma de guardar</tspan></text><rect x="350" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="512" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="512" dy="0">Qué ocurre</tspan></text><rect x="680" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="842" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="842" dy="0">Resultado observado</tspan></text><rect x="10" y="56" width="334" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="177" y="85.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177" dy="0">Abrir el archivo y escribir encima</tspan></text><rect x="350" y="56" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">Se corta a la mitad del contenido</tspan></text><rect x="680" y="56" width="324" height="52" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="842" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="842" dy="0">Documento corrupto (no es JSON válido)</tspan></text><rect x="10" y="114" width="334" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="177" y="143.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177" dy="0">Escribir un temporal y reemplazar al final</tspan></text><rect x="350" y="114" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">Se corta con el temporal a medias</tspan></text><rect x="680" y="114" width="324" height="52" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="842" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="842" dy="0">Documento anterior intacto y válido</tspan></text><rect x="10" y="172" width="334" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="177" y="201.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177" dy="0">SQLite con 1000 inserciones sin confirmar</tspan></text><rect x="350" y="172" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">El proceso termina dentro de la transacción</tspan></text><rect x="680" y="172" width="324" height="52" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="842" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="842" dy="0">1 fila (la anterior), integridad correcta</tspan></text><rect x="10" y="234" width="1000" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="510" y="258.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="510" dy="0">El experimento termina el proceso, no corta la corriente: no prueba lo que ocurre si el sistema operativo pierde la caché de</tspan></text><text x="510" y="275.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="510" dy="0">escritura. Esa garantía depende de la sincronización con el disco y del soporte, algo que aquí no se midió.</tspan></text><text x="510" y="315.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="510" dy="0">Procesos hijo terminados con os._exit; mismo resultado en Windows y Ubuntu (WSL2).</tspan></text></svg>
