<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 335" width="1180" height="335" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">500 inserciones en SQLite según el modo de diario, la sincronización y las transacciones</title><desc id="d">Barras en Windows: 500 transacciones con diario clásico y sincronización completa tardan 2874,5 milisegundos, sin sincronización 1300,0, con diario WAL completo 455,8, con WAL normal 42,1, y un lote de 500 inserciones en una transacción 8,0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1180" height="335" fill="#ffffff"/><text x="470" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">Diario clásico, sincronización completa, 500 transacciones</tspan></text><rect x="480" y="16" width="546.155" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="1034.15" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="1034.15" dy="0">2874,5 ms</tspan></text><text x="470" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">Diario clásico, sin sincronización</tspan></text><rect x="480" y="60" width="247" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="735" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="735" dy="0">1300,0 ms</tspan></text><text x="470" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">WAL, sincronización completa</tspan></text><rect x="480" y="104" width="86.602" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="574.602" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="574.602" dy="0">455,8 ms</tspan></text><text x="470" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">WAL, sincronización normal</tspan></text><rect x="480" y="148" width="7.999" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="495.999" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="495.999" dy="0">42,1 ms</tspan></text><text x="470" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">Diario clásico, sincronización completa, un lote</tspan></text><rect x="480" y="192" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="492" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="492" dy="0">8,0 ms</tspan></text><rect x="10" y="240" width="1160" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="590" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="590" dy="0">Agrupar escrituras en una transacción pesa más que cualquier ajuste: de 2874,5 a 8,0 ms. En Ubuntu (SQLite 3.45.1) las cifras fueron 2662,2, 46,6, 1410,3,</tspan></text><text x="590" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="590" dy="0">8,6 y 8,7 ms: el orden entre modos cambia con el sistema de archivos.</tspan></text><text x="590" y="321.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="590" dy="0">Tiempos medidos en un equipo (Windows 11, CPython 3.12.9); en Ubuntu (WSL2) la forma se repite con otras cifras.</tspan></text></svg>
