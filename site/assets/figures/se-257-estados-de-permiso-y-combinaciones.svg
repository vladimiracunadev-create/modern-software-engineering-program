<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 406" width="940" height="406" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Estados de un permiso y combinaciones de cuatro capacidades</title><desc id="d">Barras horizontales en escala logarítmica: seis estados por permiso y cuatro permisos dan 1296 combinaciones; un código que asume que el permiso está concedido falla en 1280 y 15 combinaciones con acceso solo aproximado devuelven un resultado engañoso sin lanzar ninguna excepción.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="406" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Estados de un permiso y combinaciones de cuatro capacidades</tspan></text><line x1="394" y1="49" x2="394" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="394" y1="225" x2="394" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="394" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="394" dy="0">1</tspan></text><line x1="514.425" y1="49" x2="514.425" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="514.425" y1="225" x2="514.425" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="514.425" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="514.425" dy="0">10</tspan></text><line x1="634.85" y1="49" x2="634.85" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="634.85" y1="225" x2="634.85" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="634.85" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="634.85" dy="0">100</tspan></text><line x1="755.275" y1="49" x2="755.275" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="755.275" y1="225" x2="755.275" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="755.275" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="755.275" dy="0">1 000</tspan></text><line x1="875.7" y1="49" x2="875.7" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="225" x2="875.7" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">10 000</tspan></text><line x1="394" y1="225" x2="875.7" y2="225" stroke="#5b7280" stroke-width="1.6"/><text x="384" y="75.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="384" dy="0">Estados por permiso</tspan></text><text x="384" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="384" dy="0">Combinaciones de 4 permisos (6 elevado a 4)</tspan></text><text x="384" y="155" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="384" dy="0">Combinaciones en que falla el código que asume</tspan></text><text x="384" y="172" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="384" dy="0">«concedido» (98,8 %)</tspan></text><text x="384" y="199" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="384" dy="0">Combinaciones con «solo aproximado» y sin fallo:</tspan></text><text x="384" y="216" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="384" dy="0">resultado engañoso</tspan></text><rect x="394" y="55" width="93.7089" height="32" rx="3" fill="#946512"/><text x="494.709" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="494.709" dy="0">6</tspan></text><rect x="394" y="99" width="374.835" height="32" rx="3" fill="#946512"/><text x="775.835" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="775.835" dy="0">1 296</tspan></text><rect x="394" y="143" width="374.186" height="32" rx="3" fill="#946512"/><text x="775.186" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="775.186" dy="0">1 280</tspan></text><rect x="394" y="187" width="141.631" height="32" rx="3" fill="#946512"/><text x="542.631" y="207.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="542.631" dy="0">15</tspan></text><text x="634.85" y="269" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="634.85" dy="0">Cantidad (escala logarítmica)</tspan></text><rect x="10" y="283" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="307.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los seis estados son concedido, denegado, denegado sin volver a preguntar, revocado en ajustes, restringido por política y</tspan></text><text x="470" y="324.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">solo aproximado. El reparto uniforme de estados es un supuesto del autor, no una medición de personas. La conclusión sólida</tspan></text><text x="470" y="341.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">es de forma: cada capacidad necesita un camino para cada estado, y el estado «aproximado» es el que no falla pero engaña.</tspan></text><text x="470" y="388.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo sintético con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
