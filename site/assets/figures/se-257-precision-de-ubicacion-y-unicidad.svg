<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 351" width="900" height="351" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Pares casa-trabajo únicos entre 2000 personas ficticias según la precisión de la ubicación</title><desc id="d">Barras: en una ciudad sintética de 20 por 20 kilómetros con 2000 personas, el par de celdas de casa y trabajo identifica a todas con celdas de 0,5 kilómetros, a 99,1 por ciento con 1 km, a 81,8 con 2 km y a ninguna con 5 km.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="900" height="351" fill="#ffffff"/><text x="290" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">Celdas de 0,05 y 0,5 km</tspan></text><rect x="300" y="16" width="600" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="908" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="908" dy="0">100 % únicos</tspan></text><text x="290" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">Celdas de 1 km</tspan></text><rect x="300" y="60" width="594.6" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="902.6" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="902.6" dy="0">99,1 % únicos</tspan></text><text x="290" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">Celdas de 2 km</tspan></text><rect x="300" y="104" width="490.8" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="798.8" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="798.8" dy="0">81,8 % únicos</tspan></text><text x="290" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">Celdas de 5 km</tspan></text><rect x="300" y="148" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="312" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="312" dy="0">0 % únicos</tspan></text><text x="290" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">Celdas de 10 km</tspan></text><rect x="300" y="192" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="312" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="312" dy="0">0 % únicos</tspan></text><rect x="10" y="240" width="880" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="450" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="450" dy="0">Reducir la precisión de la ubicación protege más de lo que parece intuitivo: de 100 % a 0 % de pares únicos entre 0,5</tspan></text><text x="450" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="450" dy="0">y 5 km. El resultado depende de la densidad sintética de la ciudad y de que solo se observan dos puntos; con más</tspan></text><text x="450" y="298.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="450" dy="0">puntos, la unicidad vuelve.</tspan></text><text x="450" y="337.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">Modelo sintético con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
