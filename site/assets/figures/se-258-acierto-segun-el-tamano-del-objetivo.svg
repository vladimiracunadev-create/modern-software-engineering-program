<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 479" width="940" height="479" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Toques simulados que caen dentro de un objetivo cuadrado según su lado y el error del dedo</title><desc id="d">Mapa de calor con el acierto de 20 000 toques simulados con error gaussiano de 2, 3 y 4 milímetros: un objetivo de 3 mm acierta 29,5, 14,6 y 8,5 por ciento, uno de 9 mm 95,0, 74,9 y 54,0 y uno de 12 mm 99,5, 90,9 y 74,9.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="479" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Toques simulados que caen dentro de un objetivo cuadrado según su lado y el error del dedo</tspan></text><text x="543" y="59" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="543" dy="0">Error del dedo (desviación)</tspan></text><text x="291.667" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="291.667" dy="0">Error 2 mm</tspan></text><text x="543" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="543" dy="0">Error 3 mm</tspan></text><text x="794.333" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="794.333" dy="0">Error 4 mm</tspan></text><text x="156" y="120.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="156" dy="0">3 mm</tspan></text><text x="156" y="164.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="156" dy="0">5 mm</tspan></text><text x="156" y="208.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="156" dy="0">7 mm</tspan></text><text x="156" y="252.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="156" dy="0">9 mm</tspan></text><text x="156" y="296.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="156" dy="0">12 mm</tspan></text><rect x="167.5" y="95.5" width="248.333" height="41" rx="4" fill="#a0cfd1" stroke="#ffffff" stroke-width="1"/><text x="291.667" y="120.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="291.667" dy="0">29,5 %</tspan></text><rect x="418.833" y="95.5" width="248.333" height="41" rx="4" fill="#c0e0e0" stroke="#ffffff" stroke-width="1"/><text x="543" y="120.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="543" dy="0">14,6 %</tspan></text><rect x="670.167" y="95.5" width="248.333" height="41" rx="4" fill="#cde7e6" stroke="#ffffff" stroke-width="1"/><text x="794.333" y="120.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="794.333" dy="0">8,5 %</tspan></text><rect x="167.5" y="139.5" width="248.333" height="41" rx="4" fill="#5aabb1" stroke="#ffffff" stroke-width="1"/><text x="291.667" y="164.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="291.667" dy="0">61,8 %</tspan></text><rect x="418.833" y="139.5" width="248.333" height="41" rx="4" fill="#94c9cc" stroke="#ffffff" stroke-width="1"/><text x="543" y="164.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="543" dy="0">34,8 %</tspan></text><rect x="670.167" y="139.5" width="248.333" height="41" rx="4" fill="#b1d9d9" stroke="#ffffff" stroke-width="1"/><text x="794.333" y="164.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="794.333" dy="0">21,4 %</tspan></text><rect x="167.5" y="183.5" width="248.333" height="41" rx="4" fill="#2a919b" stroke="#ffffff" stroke-width="1"/><text x="291.667" y="208.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="291.667" dy="0">84,4 %</tspan></text><rect x="418.833" y="183.5" width="248.333" height="41" rx="4" fill="#65b0b6" stroke="#ffffff" stroke-width="1"/><text x="543" y="208.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="543" dy="0">56,7 %</tspan></text><rect x="670.167" y="183.5" width="248.333" height="41" rx="4" fill="#8ec6c9" stroke="#ffffff" stroke-width="1"/><text x="794.333" y="208.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="794.333" dy="0">37,7 %</tspan></text><rect x="167.5" y="227.5" width="248.333" height="41" rx="4" fill="#138591" stroke="#ffffff" stroke-width="1"/><text x="291.667" y="252.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="291.667" dy="0">95,0 %</tspan></text><rect x="418.833" y="227.5" width="248.333" height="41" rx="4" fill="#3e9ca5" stroke="#ffffff" stroke-width="1"/><text x="543" y="252.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="543" dy="0">74,9 %</tspan></text><rect x="670.167" y="227.5" width="248.333" height="41" rx="4" fill="#6bb3b9" stroke="#ffffff" stroke-width="1"/><text x="794.333" y="252.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="794.333" dy="0">54,0 %</tspan></text><rect x="167.5" y="271.5" width="248.333" height="41" rx="4" fill="#09808c" stroke="#ffffff" stroke-width="1"/><text x="291.667" y="296.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="291.667" dy="0">99,5 %</tspan></text><rect x="418.833" y="271.5" width="248.333" height="41" rx="4" fill="#1c8995" stroke="#ffffff" stroke-width="1"/><text x="543" y="296.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="543" dy="0">90,9 %</tspan></text><rect x="670.167" y="271.5" width="248.333" height="41" rx="4" fill="#3e9ca5" stroke="#ffffff" stroke-width="1"/><text x="794.333" y="296.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="794.333" dy="0">74,9 %</tspan></text><text x="20" y="204" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 204)">Lado del objetivo</text><text x="166" y="340" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="166" dy="0">0,0 %</tspan></text><rect x="211.7" y="328" width="30.5" height="14" fill="#dff1ee"/><rect x="241.7" y="328" width="30.5" height="14" fill="#c0e1e0"/><rect x="271.7" y="328" width="30.5" height="14" fill="#a2d0d2"/><rect x="301.7" y="328" width="30.5" height="14" fill="#83c0c4"/><rect x="331.7" y="328" width="30.5" height="14" fill="#64b0b6"/><rect x="361.7" y="328" width="30.5" height="14" fill="#45a0a8"/><rect x="391.7" y="328" width="30.5" height="14" fill="#278f9a"/><rect x="421.7" y="328" width="30.5" height="14" fill="#087f8c"/><text x="459.7" y="340" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="459.7" dy="0">100,0 %</tspan></text><text x="520.48" y="340" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="520.48" dy="0">más oscuro = mayor (% de toques dentro del objetivo)</tspan></text><rect x="10" y="356" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="380.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El error del dedo es un supuesto del autor, no una medición de personas ni de pantallas: sirve para mostrar la forma de la</tspan></text><text x="470" y="397.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">curva. El acierto crece rápido hasta unos 9 mm y después apenas; la recomendación de cada guía de plataformas debe</tspan></text><text x="470" y="414.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">verificarse con usuarios reales.</tspan></text><text x="470" y="461.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo sintético con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
