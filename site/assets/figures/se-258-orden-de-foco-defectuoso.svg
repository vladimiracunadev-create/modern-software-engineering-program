<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 431" width="1020" height="431" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Recorrer con el tabulador un orden de foco con un defecto: lo que detecta un recorrido automático</title><desc id="d">Tabla de 1000 interfaces sintéticas de 14 controles por tipo de defecto: un recorrido que sigue el orden de foco detecta el 100 por ciento de las trampas, saltos, controles fuera del orden y ciclos anticipados, y deja 6,49, 1,00, 0,92 y 6,23 controles inalcanzables en media.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1020" height="431" fill="#ffffff"/><rect x="10" y="12" width="444" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="232" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="232" dy="0">Defecto del orden de foco</tspan></text><rect x="460" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="587" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="587" dy="0">Detectado por el recorrido</tspan></text><rect x="720" y="12" width="284" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="862" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="862" dy="0">Controles inalcanzables (media)</tspan></text><rect x="10" y="56" width="444" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="82.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Orden de foco correcto (14 controles)</tspan></text><rect x="460" y="56" width="254" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="587" y="82.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="587" dy="0">0 %</tspan></text><rect x="720" y="56" width="284" height="46" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="862" y="82.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="862" dy="0">0</tspan></text><rect x="10" y="108" width="444" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="134.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Un control que retiene el foco (trampa)</tspan></text><rect x="460" y="108" width="254" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="587" y="134.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="587" dy="0">100 %</tspan></text><rect x="720" y="108" width="284" height="46" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="862" y="134.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="862" dy="0">6,49</tspan></text><rect x="10" y="160" width="444" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="186.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Un salto que se salta un control</tspan></text><rect x="460" y="160" width="254" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="587" y="186.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="587" dy="0">100 %</tspan></text><rect x="720" y="160" width="284" height="46" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="862" y="186.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="862" dy="0">1,00</tspan></text><rect x="10" y="212" width="444" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="238.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Un control visible fuera del orden</tspan></text><rect x="460" y="212" width="254" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="587" y="238.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="587" dy="0">100 %</tspan></text><rect x="720" y="212" width="284" height="46" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="862" y="238.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="862" dy="0">0,92</tspan></text><rect x="10" y="264" width="444" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="290.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Un recorrido que vuelve al inicio antes de tiempo</tspan></text><rect x="460" y="264" width="254" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="587" y="290.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="587" dy="0">100 %</tspan></text><rect x="720" y="264" width="284" height="46" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="862" y="290.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="862" dy="0">6,23</tspan></text><rect x="10" y="320" width="1000" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="510" y="344.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="510" dy="0">El recorrido encuentra defectos de alcance, no de sentido: un orden completo que salta de la derecha a la izquierda sin lógica visual</tspan></text><text x="510" y="361.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="510" dy="0">sigue siendo inalcanzable para quien necesita entender dónde está. Ese juicio requiere a una persona que use el teclado o un lector de</tspan></text><text x="510" y="378.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="510" dy="0">pantalla.</tspan></text><text x="510" y="417.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="510" dy="0">Modelo sintético con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
