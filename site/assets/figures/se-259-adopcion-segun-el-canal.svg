6"/><text x="632" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="632" dy="0">52,2 %</tspan></text><rect x="710" y="110" width="144" height="48" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="782" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="782" dy="0">77,1 %</tspan></text><rect x="860" y="110" width="144" height="48" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="932" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="932" dy="0">95,6 %</tspan></text><rect x="10" y="164" width="394" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="191.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Manual (3 % por día)</tspan></text><rect x="410" y="164" width="144" height="48" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="482" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="482" dy="0">3,1 %</tspan></text><rect x="560" y="164" width="144" height="48" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="632" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="632" dy="0">18,6 %</tspan></text><rect x="710" y="164" width="144" height="48" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="782" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="782" dy="0">34,3 %</tspan></text><rect x="860" y="164" width="144" height="48" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="932" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="932" dy="0">59,2 %</tspan></text><rect x="10" y="218" width="394" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="245.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Empresarial con ventana (1 % por día)</tspan></text><rect x="410" y="218" width="144" height="48" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="482" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="482" dy="0">1,0 %</tspan></text><rect x="560" y="218" width="144" height="48" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="632" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="632" dy="0">6,8 %</tspan></text><rect x="710" y="218" width="144" height="48" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="782" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="782" dy="0">13,5 %</tspan></text><rect x="860" y="218" width="144" height="48" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="932" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="932" dy="0">26,2 %</tspan></text><rect x="10" y="276" width="1000" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="510" y="300.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="510" dy="0">Las probabilidades diarias son supuestos del autor, no medidas de ninguna tienda ni empresa. Lo transferible es la forma: con un canal</tspan></text><text x="510" y="317.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="510" dy="0">lento las versiones coexisten durante meses y el servidor debe aceptar a todas.</tspan></text><text x="510" y="357.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="510" dy="0">Modelo sintético con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
