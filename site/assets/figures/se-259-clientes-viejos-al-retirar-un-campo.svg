<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 554" width="940" height="554" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Clientes que siguen en la versión vieja cuando el servidor retira un campo</title><desc id="d">Líneas con el porcentaje de clientes que aún usa la versión vieja al retirar un campo del servidor a los 7, 30, 90 y 180 días: con canal automático 4,5, 0, 0 y 0 por ciento; mixto 47,1, 4,1, 0 y 0; manual 80,9, 39,8, 6,2 y 0,3; empresarial 93,2, 73,7, 40,2 y 16,7.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="554" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Clientes que siguen en la versión vieja cuando el servidor retira un campo</tspan></text><circle cx="22" cy="51" r="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Automática (35 %)</tspan></text><rect x="192.18" y="45" width="12" height="12" fill="#946512" stroke="#946512" stroke-width="2"/><text x="212.18" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="212.18" dy="0">Mixta (10 %)</tspan></text><polygon points="336.66,44.1 343.26,56.4 330.06,56.4" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="350.66" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="350.66" dy="0">Manual (3 %)</tspan></text><polygon points="475.14,43.5 482.64,51 475.14,58.5 467.64,51" fill="#102a43" stroke="#102a43" stroke-width="2"/>