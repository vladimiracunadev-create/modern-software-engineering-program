<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 371" width="1030" height="371" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Clientes que siguen en la versión vieja cuando el servidor retira un campo</title><desc id="d">Tabla con el porcentaje de clientes que aún usa la versión vieja al retirar un campo del servidor a los 7, 30, 90 y 180 días: con canal automático 4,5, 0, 0 y 0 por ciento; con canal empresarial 93,2, 73,7, 40,2 y 16,7 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1030" height="371" fill="#ffffff"/><rect x="10" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="132" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="132" dy="0">Canal</tspan></text><rect x="260" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="352" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="352" dy="0">Retirar a los 7 días</tspan></text><rect x="450" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="542" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="542" dy="0">A los 30 días</tspan></text><rect x="640" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="732" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="732" dy="0">A los 90 días</tspan></text><rect x="830" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="922" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="922" dy="0">A los 180 días</tspan></text><rect x="10" y="56" width="244" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="83.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Automática (35 %)</tspan></text><rect x="260" y="56" width="184" height="48" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="352" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="352" dy="0">4,5 %</tspan></text><rect x="450" y="56" width="184" height="48" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="542" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="542" dy="0">0 %</tspan></text><rect x="640" y="56" width="184" height="48" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="732" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="732" dy="0">0 %</tspan></text><rect x="830" y="56" width="184" height="48" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="922" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="922" dy="0">0 %</tspan></text><rect x="10" y="110" width="244" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="137.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Mixta (10 %)</tspan></text><rect x="260" y="110" width="184" height="48" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="352" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="352" dy="0">47,1 %</tspan></text><rect x="450" y="110" width="184" height="48" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="542" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="542" dy="0">4,1 %</tspan></text><rect x="640" y="110" width="184" height="48" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="732" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="732" dy="0">0 %</tspan></text><rect x="830" y="110" width="184" height="48" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="922" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="922" dy="0">0 %</tspan></text><rect x="10" y="164" width="244" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="191.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Manual (3 %)</tspan></text><rect x="260" y="164" width="184" height="48" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="352" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="352" dy="0">80,9 %</tspan></text><rect x="450" y="164" width="184" height="48" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="542" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="542" dy="0">39,8 %</tspan></text><rect x="640" y="164" width="184" height="48" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="732" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="732" dy="0">6,2 %</tspan></text><rect x="830" y="164" width="184" height="48" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="922" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="922" dy="0">0,3 %</tspan></text><rect x="10" y="218" width="244" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="245.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Empresarial (1 %)</tspan></text><rect x="260" y="218" width="184" height="48" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="352" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="352" dy="0">93,2 %</tspan></text><rect x="450" y="218" width="184" height="48" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="542" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="542" dy="0">73,7 %</tspan></text><rect x="640" y="218" width="184" height="48" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="732" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="732" dy="0">40,2 %</tspan></text><rect x="830" y="218" width="184" height="48" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="922" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="922" dy="0">16,7 %</tspan></text><rect x="10" y="276" width="1010" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="515" y="300.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="515" dy="0">La fecha para retirar algo no se decide por el calendario sino por la fracción de clientes que aún lo necesita. Con un canal</tspan></text><text x="515" y="317.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="515" dy="0">empresarial lento, a los 180 días queda una de cada seis instalaciones, y retirarlo las rompe.</tspan></text><text x="515" y="357.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="515" dy="0">Modelo sintético con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
