<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 291" width="1160" height="291" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Descargar solo los bloques de 64 KiB que cambiaron frente al paquete completo</title><desc id="d">Barras: de un paquete sintético de 2 MiB que comprime a 1 194 660 bytes, descargar solo los bloques de 64 KiB cuya huella cambió ahorra 96,8 por ciento si cambia el 1 por ciento, 87,3 si cambia el 10, 46,2 si cambia el 50 y cuesta un 1,3 por ciento más si cambia todo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1160" height="291" fill="#ffffff"/><text x="440" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="440" dy="0">Cambia el 1 % del paquete (1 de 32 bloques)</tspan></text><rect x="450" y="16" width="580.8" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="1038.8" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="1038.8" dy="0">ahorra 96,8 %</tspan></text><text x="440" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="440" dy="0">Cambia el 10 % (4 de 32 bloques)</tspan></text><rect x="450" y="60" width="523.8" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="981.8" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="981.8" dy="0">ahorra 87,3 %</tspan></text><text x="440" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="440" dy="0">Cambia el 50 % (17 de 32 bloques)</tspan></text><rect x="450" y="104" width="277.2" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="735.2" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="735.2" dy="0">ahorra 46,2 %</tspan></text><text x="440" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="440" dy="0">Cambia el 100 % (32 de 32 bloques)</tspan></text><rect x="450" y="148" width="4" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="462" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="462" dy="0">−1,3 % (más que el completo)</tspan></text><rect x="10" y="196" width="1140" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="580" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="580" dy="0">El ahorro depende de cuántos bloques cambian, no de cuánto pesa el cambio. Compilar de nuevo suele desplazar contenido y mover muchos bloques a la vez:</tspan></text><text x="580" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="580" dy="0">el experimento usa datos sintéticos con cambios contiguos, el caso más favorable.</tspan></text><text x="580" y="277.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="580" dy="0">Modelo sintético con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
