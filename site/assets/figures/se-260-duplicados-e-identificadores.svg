<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 554" width="940" height="554" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Estado final errado tras aplicar 40 operaciones con duplicados y desorden</title><desc id="d">Líneas con el porcentaje de 1000 repeticiones que terminan con el estado errado según la probabilidad de duplicar cada envío: sin identificador 0 por ciento sin duplicados, 87,1 con 5 por ciento de reenvíos y 100 con 15 y 30; con identificador de operación, 0 en todos los casos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="554" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Estado final errado tras aplicar 40 operaciones con duplicados y desorden</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Aplicar sin identificador</tspan></text><rect x="252.5" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="272.5" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="272.5" dy="0">Aplicar con identificador de operación</tspan></text><line x1="78.62" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="387" x2="78.62" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="3