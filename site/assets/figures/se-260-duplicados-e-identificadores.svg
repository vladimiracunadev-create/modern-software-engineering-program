5c1f14"><tspan x="470" dy="0">La idempotencia no es un detalle del servidor: es lo que permite reintentar sin miedo.</tspan></text><text x="470" y="536.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo sintético con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
