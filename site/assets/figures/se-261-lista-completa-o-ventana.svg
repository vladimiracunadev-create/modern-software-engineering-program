<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 530" width="940" height="530" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Construir las etiquetas de toda la lista o solo las 20 visibles</title><desc id="d">Barras agrupadas en escala logarítmica con el tiempo en Windows de construir las etiquetas de toda la lista, 0,50, 14,57 y 103,2 milisegundos con 1000, 10 000 y 100 000 elementos, o solo una ventana de 20, 0,027, 0,030 y 0,031; la razón sube de 18 a 3370 veces.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="530" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Construir las etiquetas de toda la lista o solo las 20 visibles</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Todos los elementos</tspan></text><rect x="207.26" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="227.26" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="227.26" dy="0">Ventana de 20</tspan></text><line x1="93.7" y1="355" x2="920" y2="355" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="355" x2="93.7" y2="355" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="359.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">0,01</tspan></text><line x1="93.7" y1="303" x2="920" y2="303" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="303" x2="93.7" y2="303" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="307.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">0,1</tspan></text><line x1="93.7" y1="251" x2="920" y2="251" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="251" x2="93.7" y2="251" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="255.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1</tspan></text><line x1="93.7" y1="199" x2="920" y2="199" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="199" x2="93.7" y2="199" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="203.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">10</tspan></text><line x1="93.7" y1="147" x2="920" y2="147" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="147" x2="93.7" y2="147" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="151.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">100</tspan></text><line x1="93.7" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="95" x2="93.7" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1 000</tspan></text><line x1="93.7" y1="95" x2="93.7" y2="355" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="225" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 225)">Tiempo (ms) (escala logarítmica)</text><rect x="121.243" y="266.654" width="108.173" height="88.3464" rx="3" fill="#c0432f"/><text x="175.33" y="260.654" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="175.33" dy="0">0,5</tspan></text><rect x="233.417" y="332.569" width="108.173" height="22.4309" rx="3" fill="#087f8c"/><text x="287.503" y="326.569" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287.503" dy="0">0,027</tspan></text><text x="231.417" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="231.417" dy="0">1000 elementos</tspan></text><rect x="396.677" y="190.5" width="108.173" height="164.5" rx="3" fill="#c0432f"/><text x="450.763" y="184.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="450.763" dy="0">14,57</tspan></text><rect x="508.85" y="330.19" width="108.173" height="24.8103" rx="3" fill="#087f8c"/><text x="562.937" y="324.19" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="562.937" dy="0">0,03</tspan></text><text x="506.85" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="506.85" dy="0">10 000 elementos</tspan></text><rect x="672.11" y="146.289" width="108.173" height="208.711" rx="3" fill="#c0432f"/><text x="726.197" y="140.289" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="726.197" dy="0">103,2</tspan></text><rect x="784.283" y="329.449" width="108.173" height="25.5508" rx="3" fill="#087f8c"/><text x="838.37" y="323.449" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="838.37" dy="0">0,031</tspan></text><text x="782.283" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.283" dy="0">100 000 elementos</tspan></text><rect x="10" y="407" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="431.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El tiempo de la ventana no depende del tamaño de la lista, y el tiempo completo crece con él (la razón es de 18, 485 y 3370</tspan></text><text x="470" y="448.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">veces). Es un proxy de cadenas en Python: no mide dibujo en pantalla ni el coste de un marco real; en Ubuntu fueron 0,44,</tspan></text><text x="470" y="465.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">3,14 y 42,9 ms completos y 0,006 a 0,012 ms para la ventana.</tspan></text><text x="470" y="512.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Tiempos medidos en un equipo (Windows 11, CPython 3.12.9); en Ubuntu (WSL2) la forma se repite con otras cifras.</tspan></text></svg>
