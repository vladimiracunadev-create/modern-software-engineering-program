<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 379" width="1180" height="379" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tasa de aciertos de una caché LRU con accesos que siguen una distribución de Zipf</title><desc id="d">Barras: con 1000 miniaturas y 50 000 accesos con exponente 1,1, una caché que guarda el 1 por ciento del catálogo acierta 30,3 por ciento, 5 por ciento acierta 56,8, 10 por ciento 67,3, 25 por ciento 80,4, 50 por ciento 90 y el catálogo completo 98 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1180" height="379" fill="#ffffff"/><text x="420" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Caché de 1 % del catálogo (10 elementos)</tspan></text><rect x="430" y="16" width="196.95" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="634.95" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="634.95" dy="0">30,3 %</tspan></text><text x="420" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Caché de 5 % (50 elementos)</tspan></text><rect x="430" y="60" width="369.2" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="807.2" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="807.2" dy="0">56,8 %</tspan></text><text x="420" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Caché de 10 % (100 elementos)</tspan></text><rect x="430" y="104" width="437.45" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="875.45" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="875.45" dy="0">67,3 %</tspan></text><text x="420" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Caché de 25 % (250 elementos)</tspan></text><rect x="430" y="148" width="522.6" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="960.6" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="960.6" dy="0">80,4 %</tspan></text><text x="420" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Caché de 50 % (500 elementos)</tspan></text><rect x="430" y="192" width="585" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="1023" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="1023" dy="0">90,0 %</tspan></text><text x="420" y="255.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Caché de 100 % (1000 elementos)</tspan></text><rect x="430" y="236" width="637" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="1075" y="255.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="1075" dy="0">98,0 %</tspan></text><rect x="10" y="284" width="1160" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="590" y="308.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="590" dy="0">Con accesos concentrados, un 10 % de memoria da dos tercios de los aciertos; los últimos puntos cuestan mucho más. El 98 % del catálogo completo no llega a</tspan></text><text x="590" y="325.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="590" dy="0">100 % porque cada elemento falla la primera vez. La distribución es sintética: los accesos reales deben medirse.</tspan></text><text x="590" y="365.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="590" dy="0">Modelo sintético con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
