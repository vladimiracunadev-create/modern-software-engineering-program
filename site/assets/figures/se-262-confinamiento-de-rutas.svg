<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 247" width="1180" height="247" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Doce rutas de prueba (siete intentos de escape) contra tres comprobaciones de confinamiento</title><desc id="d">Barras: de doce rutas con siete intentos de salir de la carpeta permitida, comprobar solo el prefijo deja pasar 6 escapes, rechazar los dos puntos deja pasar 2 y bloquea 1 ruta legítima, y normalizar la ruta y comparar con la raíz más un separador deja pasar 0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1180" height="247" fill="#ffffff"/><text x="400" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Comprobar solo el prefijo de la ruta</tspan></text><rect x="410" y="16" width="240" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="658" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="658" dy="0">6 escapes, 0 bloqueos erróneos</tspan></text><text x="400" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Rechazar rutas que contengan dos puntos</tspan></text><rect x="410" y="60" width="80" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="498" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="498" dy="0">2 escapes, 1 bloqueo erróneo</tspan></text><text x="400" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="400" dy="0">Normalizar y comparar con la raíz y un separador</tspan></text><rect x="410" y="104" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="422" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="422" dy="0">0 escapes, 0 bloqueos erróneos</tspan></text><rect x="10" y="152" width="1160" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="590" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="590" dy="0">La comprobación ingenua falla donde la mente no mira: la carpeta de nombre parecido, la barra invertida, la ruta absoluta. Normalizar y comparar es la regla</tspan></text><text x="590" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="590" dy="0">correcta aquí, pero depende del sistema: en el disco real también hay enlaces simbólicos, que el experimento no cubre.</tspan></text><text x="590" y="233.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="590" dy="0">Doce rutas escritas por el autor; la lista no agota los trucos posibles. Resultados idénticos en Windows y Ubuntu.</tspan></text></svg>
