<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 363" width="1050" height="363" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué detecta cada comprobación al voltear un bit y qué ocurre cuando alguien manipula el paquete</title><desc id="d">Tabla con tres comprobaciones sobre un paquete de 4096 bytes: las tres detectan los 32 768 volteos de un bit; un atacante puede recalcular el CRC y el SHA-256 publicado junto al paquete, pero no el HMAC sin la clave.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1050" height="363" fill="#ffffff"/><rect x="10" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="112" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="112" dy="0">Comprobación</tspan></text><rect x="220" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="337" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="337" dy="0">Volteos de un bit detectados</tspan></text><rect x="460" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="597" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="597" dy="0">¿Puede recalcularla quien</tspan></text><text x="597" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="597" dy="0">modifica?</tspan></text><rect x="740" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="887" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="887" dy="0">Límite</tspan></text><rect x="10" y="56" width="204" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="88.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">CRC-32</tspan></text><rect x="220" y="56" width="234" height="58" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="337" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="337" dy="0">32 768 de 32 768</tspan></text><rect x="460" y="56" width="274" height="58" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="597" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="597" dy="0">Sí: lo recalcula cualquiera</tspan></text><rect x="740" y="56" width="294" height="58" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="887" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="887" dy="0">Detecta corrupción, no manipulación</tspan></text><rect x="10" y="120" width="204" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="152.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">SHA-256 junto al paquete</tspan></text><rect x="220" y="120" width="234" height="58" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="337" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="337" dy="0">32 768 de 32 768</tspan></text><rect x="460" y="120" width="274" height="58" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="597" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="597" dy="0">Sí: se publica junto al archivo</tspan></text><rect x="740" y="120" width="294" height="58" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="887" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="887" dy="0">Solo vale si llega por un canal distinto</tspan></text><rect x="10" y="184" width="204" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="216.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">HMAC con clave compartida</tspan></text><rect x="220" y="184" width="234" height="58" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="337" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="337" dy="0">32 768 de 32 768</tspan></text><rect x="460" y="184" width="274" height="58" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="597" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="597" dy="0">No, sin la clave</tspan></text><rect x="740" y="184" width="294" height="58" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="887" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="887" dy="0">La clave no puede ir dentro del cliente</tspan></text><rect x="10" y="252" width="1030" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="525" y="276.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="525" dy="0">Detectar corrupción accidental y detectar manipulación son problemas distintos. Una firma con clave privada que el cliente no posee añade</tspan></text><text x="525" y="293.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="525" dy="0">lo que ni un CRC ni un hash resuelven: la procedencia. Aquí se usó HMAC con una clave de prueba por falta de criptografía asimétrica en la</tspan></text><text x="525" y="310.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="525" dy="0">biblioteca estándar.</tspan></text><text x="525" y="349.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="525" dy="0">Clave de prueba que no protege nada; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
