<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 291" width="1180" height="291" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Coste de adaptar 14 funciones a dos plataformas: una cifra frente a un intervalo</title><desc id="d">Barras: con 14 funciones y 28 casillas, un coste de 3 por adaptar y 8 por ausente da 60 puntos; si adaptar vale entre 1 y 6 y ausente entre 4 y 16, 10 000 sorteos dan 38,1 en el percentil 5, 71,3 en la mediana y 104,6 en el percentil 95.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1180" height="291" fill="#ffffff"/><text x="500" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="500" dy="0">Coste con los pesos de partida (3 por adaptar, 8 por ausente)</tspan></text><rect x="510" y="16" width="330" height="28" rx="3" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="848" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="848" dy="0">60</tspan></text><text x="500" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="500" dy="0">Percentil 5 con costes inciertos</tspan></text><rect x="510" y="60" width="209.55" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="727.55" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="727.55" dy="0">38,1</tspan></text><text x="500" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="500" dy="0">Mediana con costes inciertos</tspan></text><rect x="510" y="104" width="392.15" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="910.15" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="910.15" dy="0">71,3</tspan></text><text x="500" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="500" dy="0">Percentil 95 con costes inciertos</tspan></text><rect x="510" y="148" width="575.3" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="1093.3" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="1093.3" dy="0">104,6</tspan></text><rect x="10" y="196" width="1160" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="590" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="590" dy="0">La cifra puntual de 60 queda por debajo de la mediana: elegir un solo coste hace parecer más barato lo que tiene cola larga. Solo 5 de las 14 funciones son</tspan></text><text x="590" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="590" dy="0">iguales en ambas plataformas; el estado de cada casilla es una suposición del autor, no una auditoría de dos sistemas reales.</tspan></text><text x="590" y="277.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="590" dy="0">Modelo sintético con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
