<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 431" width="1020" height="431" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un contrato de cinco comprobaciones contra cuatro adaptadores de almacenamiento defectuosos</title><desc id="d">Tabla de un adaptador de almacenamiento falso y cuatro mutaciones: el contrato de cinco comprobaciones pasa el adaptador correcto y detecta las cuatro mutaciones, una de ellas con una excepción, otra con dos comprobaciones fallidas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1020" height="431" fill="#ffffff"/><rect x="10" y="12" width="424" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="222" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="222" dy="0">Adaptador</tspan></text><rect x="440" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="587" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="587" dy="0">Comprobaciones que fallan</tspan></text><rect x="740" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="872" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="872" dy="0">Resultado del contrato</tspan></text><rect x="10" y="56" width="424" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="82.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Sin mutación (adaptador falso correcto)</tspan></text><rect x="440" y="56" width="294" height="46" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="587" y="82.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="587" dy="0">Ninguno</tspan></text><rect x="740" y="56" width="264" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="872" y="82.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="872" dy="0">Pasa</tspan></text><rect x="10" y="108" width="424" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="134.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Guardar no sobrescribe un valor existente</tspan></text><rect x="440" y="108" width="294" height="46" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="587" y="134.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="587" dy="0">sobrescribir</tspan></text><rect x="740" y="108" width="264" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="872" y="134.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="872" dy="0">Detectada</tspan></text><rect x="10" y="160" width="424" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="186.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Borrar lo ausente lanza una excepción</tspan></text><rect x="440" y="160" width="294" height="46" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="587" y="186.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="587" dy="0">excepción KeyError</tspan></text><rect x="740" y="160" width="264" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="872" y="186.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="872" dy="0">Detectada</tspan></text><rect x="10" y="212" width="424" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="238.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Listar devuelve el orden inverso</tspan></text><rect x="440" y="212" width="294" height="46" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="587" y="238.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="587" dy="0">orden</tspan></text><rect x="740" y="212" width="264" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="872" y="238.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="872" dy="0">Detectada</tspan></text><rect x="10" y="264" width="424" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="290.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Leer lo ausente devuelve cadena vacía</tspan></text><rect x="440" y="264" width="294" height="46" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="587" y="290.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="587" dy="0">ausente y borrar</tspan></text><rect x="740" y="264" width="264" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="872" y="290.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="872" dy="0">Detectada</tspan></text><rect x="10" y="320" width="1000" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="510" y="344.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="510" dy="0">El mismo contrato se ejecuta contra el adaptador falso de las pruebas y contra el adaptador real de cada plataforma: si el falso no</tspan></text><text x="510" y="361.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="510" dy="0">cumple el contrato, las pruebas del resto de la aplicación certifican un comportamiento que no existe. Cuatro mutaciones no agotan los</tspan></text><text x="510" y="378.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="510" dy="0">defectos posibles.</tspan></text><text x="510" y="417.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="510" dy="0">Mutaciones escritas por el autor; resultados idénticos en Windows y Ubuntu (WSL2).</tspan></text></svg>
