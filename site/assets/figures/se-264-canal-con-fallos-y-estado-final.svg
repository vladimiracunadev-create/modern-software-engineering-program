<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 291" width="1160" height="291" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Sincronizar 40 operaciones por un canal que pierde el 20 %, duplica el 10 % y reordena</title><desc id="d">Barras: en 1000 sincronizaciones sintéticas de 40 operaciones, ni el reintento solo, ni el identificador solo, ni nada dejan el estado correcto; combinar reintento e identificador lo deja correcto el 100 por ciento de las veces, con 59,1 envíos en media en lugar de 40.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1160" height="291" fill="#ffffff"/><text x="440" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="440" dy="0">Sin reintento ni identificador (40 envíos)</tspan></text><rect x="450" y="16" width="4" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="462" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="462" dy="0">0 % correctos</tspan></text><text x="440" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="440" dy="0">Reintento sin identificador (61,5 envíos)</tspan></text><rect x="450" y="60" width="4" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="462" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="462" dy="0">0 % correctos</tspan></text><text x="440" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="440" dy="0">Identificador sin reintento (40 envíos)</tspan></text><rect x="450" y="104" width="4" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="462" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="462" dy="0">0 % correctos</tspan></text><text x="440" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="440" dy="0">Reintento con identificador (59,1 envíos)</tspan></text><rect x="450" y="148" width="550" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="1008" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="1008" dy="0">100 % correctos</tspan></text><rect x="10" y="196" width="1140" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="580" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="580" dy="0">Cada mecanismo por separado deja en cero la fracción de sesiones correctas: el reintento sin identificador suma las duplicaciones, y el identificador sin</tspan></text><text x="580" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="580" dy="0">reintento pierde lo que no llega. El precio de la corrección es un 48 % más de envíos.</tspan></text><text x="580" y="277.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="580" dy="0">Modelo sintético con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2), salvo los tiempos indicados.</tspan></text></svg>
