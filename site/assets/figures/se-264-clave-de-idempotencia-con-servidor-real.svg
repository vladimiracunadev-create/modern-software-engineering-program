<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 203" width="1000" height="203" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reintentos contra un servidor HTTP local que pierde cada tercera respuesta</title><desc id="d">Barras: con 30 operaciones pedidas a un servidor local que aplica cada tercera petición y pierde su respuesta, reintentar sin clave de idempotencia aplica 44 operaciones y con la clave se aplican exactamente 30, con 44 peticiones en ambos casos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="203" fill="#ffffff"/><text x="300" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Sin clave de idempotencia</tspan></text><rect x="310" y="16" width="440" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="758" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="758" dy="0">44 aplicadas de 30 pedidas</tspan></text><text x="300" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Con clave de idempotencia</tspan></text><rect x="310" y="60" width="300" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="618" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="618" dy="0">30 aplicadas de 30 pedidas</tspan></text><rect x="10" y="108" width="980" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="500" y="132.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">El reintento ciego convierte 30 operaciones en 44: las 14 de más son respuestas perdidas que el cliente repitió. El servidor local</tspan></text><text x="500" y="149.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">no sufre latencia ni pérdida real de red; solo reproduce el patrón de la respuesta perdida tras aplicar.</tspan></text><text x="500" y="189.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Servidor en 127.0.0.1 con puerto efímero; 178 y 96 ms en Windows, 106 y 58 ms en Ubuntu (WSL2).</tspan></text></svg>
