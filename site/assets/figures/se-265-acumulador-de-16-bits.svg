<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 321" width="960" height="321" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Promedio de lecturas de 12 bits con un acumulador de 16 bits</title><desc id="d">Tabla: al promediar lecturas de 12 bits con un acumulador de 16 bits, con una señal media de 1000 no falla nada hasta 32 lecturas y con 64 falla el 10 por ciento; con una señal media de 3000 falla el 100 por ciento desde 32 lecturas, con un error de 2048 cuentas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="321" fill="#ffffff"/><rect x="10" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="157" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="157" dy="0">Número de lecturas</tspan></text><rect x="310" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="407" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="407" dy="0">Señal media 1000</tspan></text><rect x="510" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="607" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="607" dy="0">Señal media 3000</tspan></text><rect x="710" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="827" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="827" dy="0">Error medio (cuentas)</tspan></text><rect x="10" y="56" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">4, 8, 16 o 17 lecturas</tspan></text><rect x="310" y="56" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="407" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="407" dy="0">0 %</tspan></text><rect x="510" y="56" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="607" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607" dy="0">0 %</tspan></text><rect x="710" y="56" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">—</tspan></text><rect x="10" y="106" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">32 lecturas</tspan></text><rect x="310" y="106" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="407" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="407" dy="0">0 %</tspan></text><rect x="510" y="106" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="607" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607" dy="0">100 %</tspan></text><rect x="710" y="106" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">2 048</tspan></text><rect x="10" y="156" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">64 lecturas</tspan></text><rect x="310" y="156" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="407" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="407" dy="0">10,0 %</tspan></text><rect x="510" y="156" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="607" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607" dy="0">100 %</tspan></text><rect x="710" y="156" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">1 024 y 2 048</tspan></text><rect x="10" y="210" width="940" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="234.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">El desbordamiento no avisa: el promedio sale plausible y erróneo en 2048 cuentas, la mitad del rango del convertidor. Depende</tspan></text><text x="480" y="251.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">del producto del número de lecturas por el máximo posible, no de la señal típica. Sobre 20 000 ventanas por celda, señal con</tspan></text><text x="480" y="268.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">ruido gaussiano de 150 cuentas.</tspan></text><text x="480" y="307.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
