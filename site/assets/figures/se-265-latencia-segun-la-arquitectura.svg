<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 438" width="940" height="438" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Latencia de un botón según la arquitectura del firmware (escala logarítmica)</title><desc id="d">Barras horizontales en escala logarítmica con la latencia de un botón: el sondeo en el bucle principal tarda 14,19 milisegundos de media, 78,2 en el percentil 99 y 166,0 como máximo; la interrupción con manejo inmediato tarda unos 0,03 en los tres casos, cerca de cinco mil veces menos en el peor caso.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="438" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Latencia de un botón según la arquitectura del firmware (escala logarítmica)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Media</tspan></text><rect x="101.7" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="121.7" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="121.7" dy="0">Percentil 99</tspan></text><rect x="240.18" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="260.18" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="260.18" dy="0">Máximo</tspan></text><line x1="274" y1="77" x2="274" y2="257" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="257" x2="274" y2="262" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="278" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0,01</tspan></text><line x1="394.34" y1="77" x2="394.34" y2="257" stroke="#d5dde1" stroke-width="1"/><line x1="394.34" y1="257" x2="394.34" y2="262" stroke="#5b7280" stroke-width="1.4"/><text x="394.34" y="278" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="394.34" dy="0">0,1</tspan></text><line x1="514.68" y1="77" x2="514.68" y2="257" stroke="#d5dde1" stroke-width="1"/><line x1="514.68" y1="257" x2="514.68" y2="262" stroke="#5b7280" stroke-width="1.4"/><text x="514.68" y="278" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="514.68" dy="0">1</tspan></text><line x1="635.02" y1="77" x2="635.02" y2="257" stroke="#d5dde1" stroke-width="1"/><line x1="635.02" y1="257" x2="635.02" y2="262" stroke="#5b7280" stroke-width="1.4"/><text x="635.02" y="278" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="635.02" dy="0">10</tspan></text><line x1="755.36" y1="77" x2="755.36" y2="257" stroke="#d5dde1" stroke-width="1"/><line x1="755.36" y1="257" x2="755.36" y2="262" stroke="#5b7280" stroke-width="1.4"/><text x="755.36" y="278" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="755.36" dy="0">100</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="257" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="257" x2="875.7" y2="262" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="278" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">1 000</tspan></text><line x1="274" y1="257" x2="875.7" y2="257" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="118" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Sondeo del botón en el bucle</tspan></text><text x="264" y="135" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">principal</tspan></text><text x="264" y="216.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Interrupción con manejo inmediato</tspan></text><rect x="274" y="83" width="379.31" height="24" rx="3" fill="#087f8c"/><text x="660.31" y="99.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="660.31" dy="0">14,19</tspan></text><rect x="274" y="110" width="468.509" height="24" rx="3" fill="#946512"/><text x="749.509" y="126.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="749.509" dy="0">78,2</tspan></text><rect x="274" y="137" width="507.848" height="24" rx="3" fill="#c0432f"/><text x="788.848" y="153.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="788.848" dy="0">166</tspan></text><rect x="274" y="173" width="47.8881" height="24" rx="3" fill="#087f8c"/><text x="328.888" y="189.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="328.888" dy="0">0,025</tspan></text><rect x="274" y="200" width="57.4168" height="24" rx="3" fill="#946512"/><text x="338.417" y="216.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="338.417" dy="0">0,03</tspan></text><rect x="274" y="227" width="57.4168" height="24" rx="3" fill="#c0432f"/><text x="338.417" y="243.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="338.417" dy="0">0,03</tspan></text><text x="574.85" y="301" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="574.85" dy="0">Latencia (ms) (escala logarítmica)</tspan></text><rect x="10" y="315" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="339.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La cola larga manda: el máximo del sondeo es 12 veces su media, porque lo fija la vuelta más lenta del bucle (una con radio</tspan></text><text x="470" y="356.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">dura unos 50 ms), no el botón. La interrupción cambia el problema de sitio: ahora hay que acotar lo que hace dentro de la</tspan></text><text x="470" y="373.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">rutina. Las duraciones del bucle son supuestos del autor.</tspan></text><text x="470" y="420.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
