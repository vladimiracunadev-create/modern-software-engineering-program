<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 219" width="900" height="219" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mutantes distinguibles de un antirrebote de tres muestras que mata cada suite</title><desc id="d">Barras: de ocho variantes de un antirrebote, tres son equivalentes y cinco son distinguibles; tres ejemplos de camino feliz matan cuatro de las cinco y doscientas secuencias con rebotes aleatorios, contra un modelo de referencia, matan las cinco.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="900" height="219" fill="#ffffff"/><text x="420" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">Tres ejemplos de camino feliz</tspan></text><rect x="430" y="16" width="320" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="758" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="758" dy="0">4 de 5</tspan></text><text x="420" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="420" dy="0">200 secuencias con rebotes aleatorios</tspan></text><rect x="430" y="60" width="400" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="838" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="838" dy="0">5 de 5</tspan></text><rect x="10" y="108" width="880" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="450" y="132.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="450" dy="0">El mutante que sobrevive a los ejemplos no reinicia el contador al cambiar la entrada: solo se nota con rebotes. Tres</tspan></text><text x="450" y="149.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="450" dy="0">variantes no cambian ninguna salida y no se pueden matar. El modelo de referencia es una función pura que se ejecuta</tspan></text><text x="450" y="166.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="450" dy="0">en el equipo de desarrollo, sin hardware.</tspan></text><text x="450" y="205.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
