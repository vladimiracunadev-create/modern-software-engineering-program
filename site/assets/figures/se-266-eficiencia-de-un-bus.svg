<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Eficiencia de datos al leer N bytes de un registro: I²C frente a SPI</title><desc id="d">Líneas de eficiencia de datos según los bytes leídos, en escala logarítmica: por I2C sube de 20,5 por ciento con 1 byte a 84,5 con 64 bytes; por SPI sube de 50 a 98,5 por ciento; leer un byte por I2C cuesta 39 ciclos de reloj, 97,5 microsegundos a 400 kilohercios.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Eficiencia de datos al leer N bytes de un registro: I²C frente a SPI</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">I²C</tspan></text><rect x="86.62" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="106.62" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="106.62" dy="0">SPI</tspan></text><line x1="78.62" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="387" x2="78.62" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="327" x2="910" y2="327" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="327" x2="78.62" y2="327" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="331.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">20</tspan></text><line x1="78.62" y1="267" x2="910" y2="267" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="267" x2="78.62" y2="267" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="271.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">40</tspan></text><line x1="78.62" y1="207" x2="910" y2="207" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="207" x2="78.62" y2="207" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="211.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">60</tspan></text><line x1="78.62" y1="147" x2="910" y2="147" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="147" x2="78.62" y2="147" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="151.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">80</tspan></text><line x1="78.62" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="87" x2="78.62" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="87" x2="78.62" y2="387" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="87" x2="96.62" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="387" x2="96.62" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">1</tspan></text><line x1="229.183" y1="87" x2="229.183" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="229.183" y1="387" x2="229.183" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="229.183" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="229.183" dy="0">2</tspan></text><line x1="439.291" y1="87" x2="439.291" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="439.291" y1="387" x2="439.291" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="439.291" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="439.291" dy="0">6</tspan></text><line x1="626.873" y1="87" x2="626.873" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="626.873" y1="387" x2="626.873" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="626.873" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="626.873" dy="0">16</tspan></text><line x1="892" y1="87" x2="892" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="387" x2="892" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">64</tspan></text><line x1="78.62" y1="387" x2="910" y2="387" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 237)">Eficiencia (bits útiles / ciclos de reloj, %)</text><text x="494.31" y="433" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Bytes leídos por transacción (escala logarítmica)</tspan></text><polyline points="96.62,325.5 229.183,287.1 439.291,215.7 626.873,166.2 892,133.5" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="96.62" cy="325.5" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="96.62" y="314.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">20,5</tspan></text><circle cx="229.183" cy="287.1" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="229.183" y="276.1" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="229.183" dy="0">33,3</tspan></text><circle cx="439.291" cy="215.7" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="439.291" y="204.7" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="439.291" dy="0">57,1</tspan></text><circle cx="626.873" cy="166.2" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="626.873" y="155.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="626.873" dy="0">73,6</tspan></text><circle cx="892" cy="133.5" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="122.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">84,5</tspan></text><polyline points="96.62,237 229.183,186.9 439.291,129.9 626.873,104.7 892,91.5" fill="none" stroke="#087f8c" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="91.12" y="231.5" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="96.62" y="226" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">50,0</tspan></text><rect x="223.683" y="181.4" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="229.183" y="175.9" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="229.183" dy="0">66,7</tspan></text><rect x="433.791" y="124.4" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="439.291" y="118.9" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="439.291" dy="0">85,7</tspan></text><rect x="621.373" y="99.2" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="626.873" y="93.7" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="626.873" dy="0">94,1</tspan></text><rect x="886.5" y="86" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="80.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">98,5</tspan></text><text x="191.62" y="343.5" font-size="13" text-anchor="start" font-weight="400" fill="#5c1f14" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="191.62" dy="0">1 byte por I²C: 39 ciclos,</tspan></text><text x="191.62" y="360.5" font-size="13" text-anchor="start" font-weight="400" fill="#5c1f14" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="191.62" dy="0">97,5 µs a 400 kHz</tspan></text><line x1="103.58" y1="326.54" x2="183.62" y2="338.5" stroke="#5c1f14" stroke-width="1.2"/><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La eficiencia mide bits útiles sobre ciclos de reloj, no la velocidad del bus: con direcciones, confirmaciones y reinicio,</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">leer un solo byte por I²C desperdicia cuatro de cada cinco ciclos, y la brecha con SPI se cierra al agrupar lecturas. El</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cálculo es aritmético, sin dispositivo real ni capacitancia de la línea.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
