<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 401" width="960" height="401" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Leer N bytes de un registro: ciclos de reloj, eficiencia y tiempo en I²C</title><desc id="d">Tabla: leer un byte de un registro por I2C cuesta 39 ciclos de reloj y la eficiencia de datos es de 20,5 por ciento; con 64 bytes sube a 84,5 por ciento; a 400 kilohercios el primer caso tarda 97,5 microsegundos; por SPI las eficiencias son 50 y 98,5 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="401" fill="#ffffff"/><rect x="10" y="12" width="104" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="62" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="62" dy="0">Bytes</tspan></text><rect x="120" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="202" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="202" dy="0">Ciclos I²C</tspan></text><rect x="290" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="387" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="387" dy="0">Eficiencia I²C</tspan></text><rect x="490" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="622" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="622" dy="0">Tiempo a 400 kHz (µs)</tspan></text><rect x="760" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="852" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="852" dy="0">Eficiencia SPI</tspan></text><rect x="10" y="56" width="104" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="62" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="62" dy="0">1</tspan></text><rect x="120" y="56" width="164" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="202" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="202" dy="0">39</tspan></text><rect x="290" y="56" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="387" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387" dy="0">20,5 %</tspan></text><rect x="490" y="56" width="264" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">97,5</tspan></text><rect x="760" y="56" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">50,0 %</tspan></text><rect x="10" y="102" width="104" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="62" y="125.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="62" dy="0">2</tspan></text><rect x="120" y="102" width="164" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="202" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="202" dy="0">48</tspan></text><rect x="290" y="102" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="387" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387" dy="0">33,3 %</tspan></text><rect x="490" y="102" width="264" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">120,0</tspan></text><rect x="760" y="102" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">66,7 %</tspan></text><rect x="10" y="148" width="104" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="62" y="171.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="62" dy="0">6</tspan></text><rect x="120" y="148" width="164" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="202" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="202" dy="0">84</tspan></text><rect x="290" y="148" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="387" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387" dy="0">57,1 %</tspan></text><rect x="490" y="148" width="264" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">210,0</tspan></text><rect x="760" y="148" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">85,7 %</tspan></text><rect x="10" y="194" width="104" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="62" y="217.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142