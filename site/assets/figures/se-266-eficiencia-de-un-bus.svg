h="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">98,5 %</tspan></text><rect x="10" y="290" width="940" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="314.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">La eficiencia mide bits útiles sobre ciclos de reloj, no la velocidad del bus: con direcciones, confirmaciones y reinicio,</tspan></text><text x="480" y="331.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">leer un solo byte desperdicia cuatro de cada cinco ciclos. El cálculo es aritmético, sin dispositivo real ni capacitancia de</tspan></text><text x="480" y="348.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">la línea.</tspan></text><text x="480" y="387.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
