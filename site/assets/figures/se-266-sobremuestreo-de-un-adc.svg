="498.08" y="273.363" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="498.08" dy="0">0,145</tspan></text><rect x="689.54" y="325.379" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="695.04" y="319.879" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="695.04" dy="0">0,071</tspan></text><rect x="886.5" y="369.623" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="364.123" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">0,036</tspan></text><polyline points="104.16,156.579 301.12,201.168 498.08,246.573 695.04,292.487 892,336.631" fill="none" stroke="#c0432f" stroke-width="2.4"/><polygon points="104.16,150.254 110.21,161.529 98.11,161.529" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="104.16" y="145.579" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="104.16" dy="0">1,031</tspan></text><polygon points="301.12,194.843 307.17,206.118 295.07,206.118" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="301.12" y="190.168" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="301.12" dy="0">0,52</tspan></text><polygon points="498.08,240.248 504.13,251.523 492.03,251.523" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="498.08" y="235.573" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="498.08" dy="0">0,259</tspan></text><polygon points="695.04,286.162 701.09,297.437 688.99,297.437" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="695.04" y="281.487" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="695.04" dy="0">0,128</tspan></text><polygon points="892,330.306 898.05,341.581 885.95,341.581" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="325.631" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">0,065</tspan></text><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Sobremuestrear mejora la resolución solo si hay un poco de ruido que la reparta: sin ruido todas las lecturas redondean</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">igual y el promedio no mejora. Cada factor cuatro cuesta cuatro veces más tiempo y energía. Señal constante de 1,2345 V con</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">referencia de 3,3 V.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
