<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Error eficaz de un ADC de 10 bits al promediar N lecturas</title><desc id="d">Líneas en doble escala logarítmica con el error eficaz en LSB según el número de lecturas promediadas: con ruido de 0,5 LSB baja de 0,583 con una lectura a 0,036 con 256, y con ruido de 1,0 LSB de 1,031 a 0,065, a la mitad por cada factor cuatro; sin ruido se queda plana en 0,431.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Error eficaz de un ADC de 10 bits al promediar N lecturas</tspan></text><circle cx="22" cy="51" r="6" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Sin ruido</tspan></text><rect x="131.86" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="151.86" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="151.86" dy="0">Ruido de 0,5 LSB</tspan></text><polygon points="306.5,44.1 313.1,56.4 299.9,56.4" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="320.5" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="320.5" dy="0">Ruido de 1,0 LSB</tspan></text><line x1="86.16" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="387" x2="86.16" y2="387" stroke="#