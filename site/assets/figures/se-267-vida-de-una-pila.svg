nchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="300.239" dy="0">6 222</tspan></text><polygon points="574.08,154.517 580.13,165.792 568.03,165.792" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="574.08" y="149.842" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="574.08" dy="0">3 219</tspan></text><polygon points="892,237.466 898.05,248.741 885.95,248.741" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="232.791" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">901</tspan></text><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Con un despertar cada 10 s la corriente de reposo apenas cuenta (la línea es casi plana): manda lo que se gasta despierto.</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Con 600 s, pasar de 2 a 100 µA divide la vida por 8,5. Supuestos: 15 mA durante 120 ms y 80 mA durante 40 ms de radio,</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">autodescarga del 1 % anual, sin envejecimiento ni temperatura.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
