<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Vida de una pila de 2400 mAh según la corriente de reposo y el periodo de despertar</title><desc id="d">Líneas en doble escala logarítmica con la vida de una pila de 2400 miliamperios hora según la corriente de reposo: con despertar cada 10 segundos baja de 198 a 166 días entre 2 y 100 microamperios; con 60 segundos de 1 135 a 538; con 600 segundos de 7 650 a 901, de modo que el reposo domina cuando el nodo despierta poco.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Vida de una pila de 2400 mAh según la corriente de reposo y el periodo de despertar</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Despierta cada 10 s</tspan></text><rect x="207.26" y="45" width="12" height="12" fill="#946512" stroke="#946512" stroke-width="2"/><text x="227.26" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="227.26" dy="0">Cada 60 s</tspan></text><polygon points="329.12,44.1 335.72,56.4 322.52,56.4" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="343.12" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="343.12" dy="0">Cada 600 s</tspan></text><line x1="101.24" y1="387" x2="910" y2=