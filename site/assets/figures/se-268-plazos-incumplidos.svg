<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 321" width="850" height="321" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Plazos incumplidos de una tarea periódica según la variabilidad del tiempo de ejecución</title><desc id="d">Tabla: una tarea con periodo y plazo de 10 milisegundos y tiempo medio de ejecución del 50 por ciento del periodo incumple el 0,0 por ciento de los plazos con poca variabilidad y el 9,7 con mucha; con utilización media 0,9 incumple entre 17,0 y 72,4 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="850" height="321" fill="#ffffff"/><rect x="10" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="137" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="137" dy="0">Utilización media</tspan></text><rect x="270" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="362" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="362" dy="0">σ = 0,1</tspan></text><rect x="460" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="552" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="552" dy="0">σ = 0,3</tspan></text><rect x="650" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="742" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="742" dy="0">σ = 0,6</tspan></text><rect x="10" y="56" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">0,5</tspan></text><rect x="270" y="56" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">0,0 %</tspan></text><rect x="460" y="56" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">0,7 %</tspan></text><rect x="650" y="56" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">9,7 %</tspan></text><rect x="10" y="106" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">0,7</tspan></text><rect x="270" y="106" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">0,01 %</tspan></text><rect x="460" y="106" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">11,2 %</tspan></text><rect x="650" y="106" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">32,3 %</tspan></text><rect x="10" y="156" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">0,9</tspan></text><rect x="270" y="156" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">17,0 %</tspan></text><rect x="460" y="156" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">55,6 %</tspan></text><rect x="650" y="156" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">72,4 %</tspan></text><rect x="10" y="210" width="830" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="425" y="234.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="425" dy="0">Con utilización media de 0,7 y σ = 0,3 se incumple un plazo de cada nueve, aunque la media quepa con holgura.</tspan></text><text x="425" y="251.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="425" dy="0">El tiempo medio no sirve para decidir si se cumple un plazo: hace falta el peor caso o un percentil alto. 200</tspan></text><text x="425" y="268.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="425" dy="0">000 trabajos por celda, tiempos lognormales y trabajos encadenados.</tspan></text><text x="425" y="307.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="425" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
