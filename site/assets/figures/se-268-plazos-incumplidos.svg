"11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="89.08" y="375.962" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="89.08" dy="0">0,0 y 0,01 %</tspan></text><rect x="404.748" y="339.5" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="410.248" y="334" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="410.248" dy="0">11,2 %</tspan></text><rect x="886.5" y="260.375" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="892" y="254.875" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">32,3 %</tspan></text><polyline points="89.08,323.25 410.248,178.5 892,115.5" fill="none" stroke="#c0432f" stroke-width="2.4"/><polygon points="89.08,316.925 95.13,328.2 83.03,328.2" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="89.08" y="312.25" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="89.08" dy="0">17,0 %</tspan></text><polygon points="410.248,172.175 416.298,183.45 404.198,183.45" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="410.248" y="167.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="410.248" dy="0">55,6 %</tspan></text><polygon points="892,109.175 898.05,120.45 885.95,120.45" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="104.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">72,4 %</tspan></text><text x="440.248" y="245" font-size="13" text-anchor="start" font-weight="400" fill="#5c1f14" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="440.248" dy="0">Con U = 0,7 y σ = 0,3 se</tspan></text><text x="440.248" y="262" font-size="13" text-anchor="start" font-weight="400" fill="#5c1f14" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="440.248" dy="0">incumple un plazo de cada</tspan></text><text x="440.248" y="279" font-size="13" text-anchor="start" font-weight="400" fill="#5c1f14" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="440.248" dy="0">nueve</tspan></text><line x1="412.008" y1="336.6" x2="432.248" y2="240" stroke="#5c1f14" stroke-width="1.2"/><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Con utilización media de 0,7 y σ = 0,3 se incumple un plazo de cada nueve, aunque la media quepa con holgura. El tiempo</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">medio no sirve para decidir si se cumple un plazo: hace falta el peor caso o un percentil alto. 200 000 trabajos por punto,</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">tiempos lognormales y trabajos encadenados.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
