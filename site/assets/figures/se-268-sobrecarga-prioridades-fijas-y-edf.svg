<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 587" width="940" height="587" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuántas de las 5 tareas pierden algún plazo cuando el conjunto fracasa, según la utilización objetivo</title><desc id="d">Barras agrupadas con el número medio de tareas distintas, de cinco, que pierden algún plazo en los conjuntos que fracasan: con prioridades fijas por periodo 1,08 con utilización objetivo 0,9, 1,45 con 1,0, 1,91 con 1,1 y 2,22 con 1,2; con el plazo más cercano primero 4,44, 4,76, 5,00 y 5,00. La tarea más prioritaria nunca falla con prioridades fijas salvo el 0,7 % de los conjuntos con 1,1 y 1,2, y falla en el 100 % de los conjuntos que fracasan con el plazo más cercano.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="587" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuántas de las 5 tareas pierden algún plazo cuando el conjunto fracasa, según la utilización objetivo</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Prioridades fijas por periodo</tspan></text><rect x="282.66" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="302.66" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="302.66" dy="0">Plazo más cercano primero (EDF)</tspan></text><line x1="63.54" y1="395" x2="920" y2="395" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="395" x2="63.54" y2="395" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="399.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">0</tspan></text><line x1="63.54" y1="335" x2="920" y2="335" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="335" x2="63.54" y2="335" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="339.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">1</tspan></text><line x1="63.54" y1="275" x2="920" y2="275" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="275" x2="63.54" y2="275" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="279.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">2</tspan></text><line x1="63.54" y1="215" x2="920" y2="215" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="215" x2="63.54" y2="215" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="219.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">3</tspan></text><line x1="63.54" y1="155" x2="920" y2="155" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="155" x2="63.54" y2="155" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="159.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">4</tspan></text><line x1="63.54" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="95" x2="63.54" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">5</tspan></text><line x1="63.54" y1="95" x2="63.54" y2="395" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="245" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 245)">Tareas distintas con algún plazo perdido (de 5)</text><rect x="84.9515" y="330.2" width="83.646" height="64.8" rx="3" fill="#087f8c"/><text x="126.774" y="324.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="126.774" dy="0">1,08</tspan></text><rect x="172.597" y="128.6" width="83.646" height="266.4" rx="3" fill="#c0432f"/><text x="214.421" y="122.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="214.421" dy="0">4,44</tspan></text><text x="170.597" y="416" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="170.597" dy="0">Objetivo 0,9 (real 0,92)</tspan></text><rect x="299.067" y="308" width="83.646" height="87" rx="3" fill="#087f8c"/><text x="340.889" y="302" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="340.889" dy="0">1,45</tspan></text><rect x="386.713" y="109.4" width="83.646" height="285.6" rx="3" fill="#c0432f"/><text x="428.536" y="103.4" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="428.536" dy="0">4,76</tspan></text><text x="384.713" y="416" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="384.713" dy="0">Objetivo 1,0 (real 1,02)</tspan></text><rect x="513.182" y="280.4" width="83.646" height="114.6" rx="3" fill="#087f8c"/><text x="555.005" y="274.4" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="555.005" dy="0">1,91</tspan></text><rect x="600.828" y="95" width="83.646" height="300" rx="3" fill="#c0432f"/><text x="642.651" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="642.651" dy="0">5,00</tspan></text><text x="598.828" y="416" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="598.828" dy="0">Objetivo 1,1 (real 1,12)</tspan></text><rect x="727.296" y="261.8" width="83.646" height="133.2" rx="3" fill="#087f8c"/><text x="769.119" y="255.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="769.119" dy="0">2,22</tspan></text><rect x="814.942" y="95" width="83.646" height="300" rx="3" fill="#c0432f"/><text x="856.765" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="856.765" dy="0">5,00</tspan></text><text x="812.942" y="416" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812.942" dy="0">Objetivo 1,2 (real 1,22)</tspan></text><line x1="63.54" y1="95" x2="920" y2="95" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="916" y="89" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="916" dy="0">las cinco tareas</tspan></text><rect x="10" y="447" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Con prioridades fijas la sobrecarga se concentra en las tareas de periodo largo y las de periodo corto siguen cumpliendo;</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">con el plazo más cercano primero, una vez que el procesador no alcanza, todas las tareas se atrasan a la vez. Con</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">utilización real igual o menor que 1, EDF no perdió ningún plazo en las 1 200 simulaciones. El objetivo y el valor real</tspan></text><text x="470" y="521.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">difieren porque los tiempos de cómputo son enteros y se redondean hacia arriba hasta 1 unidad.</tspan></text><text x="470" y="569.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación discreta con semilla fija (scripts/experiments_part22_ext.py): 300 conjuntos de 5 tareas por celda, CPython 3.12.9 en Windows.</tspan></text></svg>
