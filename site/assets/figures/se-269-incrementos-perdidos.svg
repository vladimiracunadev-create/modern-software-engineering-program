<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 410" width="940" height="410" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Posiciones de la interrupción que pierden un incremento en una vuelta de diez instrucciones</title><desc id="d">Diagrama de las diez posiciones en que una interrupción puede caer en una vuelta del bucle (load, add, store y siete instrucciones más): sin protección, las posiciones 1 y 2, antes de add y antes de store, pierden el incremento de la rutina, el 9,9 por ciento en 300 corridas; con una sección crítica que enmascara las interrupciones entre load y store ninguna posición pierde y la rutina se retrasa como máximo dos instrucciones.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="410" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Posiciones de la interrupción que pierden un incremento en una vuelta de diez instrucciones</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">La interrupción cae aquí y se pierde su incremento</tspan></text><rect x="441" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="461" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="461" dy="0">Sin pérdida</tspan></text><rect x="16" y="69" width="12" height="12" rx="2" fill="#946512"/><text x="36" y="80" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Interrupción diferida hasta salir de la sección crítica</tspan></text><text x="607" y="111" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="607" dy="0">Posición de la interrupción: justo antes de la instrucción</tspan></text><text x="325.3" y="136" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="325.3" dy="0">0 · load</tspan></text><text x="387.9" y="136" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="387.9" dy="0">1 · add</tspan></text><text x="450.5" y="136" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="450.5" dy="0">2 · store</tspan></text><text x="513.1" y="136" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="513.1" dy="0">3 · otra</tspan></text><text x="575.7" y="136" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="575.7" dy="0">4 · otra</tspan></text><text x="638.3" y="136" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="638.3" dy="0">5 · otra</tspan></text><text x="700.9" y="136" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="700.9" dy="0">6 · otra</tspan></text><text x="763.5" y="136" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="763.5" dy="0">7 · otra</tspan></text><text x="826.1" y="136" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="826.1" dy="0">8 · otra</tspan></text><text x="888.7" y="136" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="888.7" dy="0">9 · otra</tspan></text><text x="284" y="166.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="284" dy="0">Sin protección: 2 de 10 posiciones</tspan></text><text x="284" y="183.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="284" dy="0">pierden el incremento (9,9 % de los</tspan></text><text x="284" y="200.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="284" dy="0">incrementos perdidos)</tspan></text><text x="284" y="230.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="284" dy="0">Sección crítica entre load y store: 0</tspan></text><text x="284" y="247.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="284" dy="0">de 10 pierden; la rutina espera como</tspan></text><text x="284" y="264.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="284" dy="0">máximo 2 instrucciones</tspan></text><rect x="296" y="155" width="58.6" height="48" rx="5" fill="#087f8c"/><text x="325.3" y="183.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="325.3" dy="0">ok</tspan></text><rect x="358.6" y="155" width="58.6" height="48" rx="5" fill="#c0432f"/><text x="387.9" y="183.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="387.9" dy="0">pierde</tspan></text><rect x="421.2" y="155" width="58.6" height="48" rx="5" fill="#c0432f"/><text x="450.5" y="183.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="450.5" dy="0">pierde</tspan></text><rect x="483.8" y="155" width="58.6" height="48" rx="5" fill="#087f8c"/><text x="513.1" y="183.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="513.1" dy="0">ok</tspan></text><rect x="546.4" y="155" width="58.6" height="48" rx="5" fill="#087f8c"/><text x="575.7" y="183.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="575.7" dy="0">ok</tspan></text><rect x="609" y="155" width="58.6" height="48" rx="5" fill="#087f8c"/><text x="638.3" y="183.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="638.3" dy="0">ok</tspan></text><rect x="671.6" y="155" width="58.6" height="48" rx="5" fill="#087f8c"/><text x="700.9" y="183.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="700.9" dy="0">ok</tspan></text><rect x="734.2" y="155" width="58.6" height="48" rx="5" fill="#087f8c"/><text x="763.5" y="183.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="763.5" dy="0">ok</tspan></text><rect x="796.8" y="155" width="58.6" height="48" rx="5" fill="#087f8c"/><text x="826.1" y="183.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="826.1" dy="0">ok</tspan></text><rect x="859.4" y="155" width="58.6" height="48" rx="5" fill="#087f8c"/><text x="888.7" y="183.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="888.7" dy="0">ok</tspan></text><rect x="296" y="219" width="58.6" height="48" rx="5" fill="#087f8c"/><text x="325.3" y="247.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="325.3" dy="0">ok</tspan></text><rect x="358.6" y="219" width="58.6" height="48" rx="5" fill="#946512"/><text x="387.9" y="247.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="387.9" dy="0">difiere</tspan></text><rect x="421.2" y="219" width="58.6" height="48" rx="5" fill="#946512"/><text x="450.5" y="247.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="450.5" dy="0">difiere</tspan></text><rect x="483.8" y="219" width="58.6" height="48" rx="5" fill="#087f8c"/><text x="513.1" y="247.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="513.1" dy="0">ok</tspan></text><rect x="546.4" y="219" width="58.6" height="48" rx="5" fill="#087f8c"/><text x="575.7" y="247.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="575.7" dy="0">ok</tspan></text><rect x="609" y="219" width="58.6" height="48" rx="5" fill="#087f8c"/><text x="638.3" y="247.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="638.3" dy="0">ok</tspan></text><rect x="671.6" y="219" width="58.6" height="48" rx="5" fill="#087f8c"/><text x="700.9" y="247.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="700.9" dy="0">ok</tspan></text><rect x="734.2" y="219" width="58.6" height="48" rx="5" fill="#087f8c"/><text x="763.5" y="247.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="763.5" dy="0">ok</tspan></text><rect x="796.8" y="219" width="58.6" height="48" rx="5" fill="#087f8c"/><text x="826.1" y="247.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="826.1" dy="0">ok</tspan></text><rect x="859.4" y="219" width="58.6" height="48" rx="5" fill="#087f8c"/><text x="888.7" y="247.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="888.7" dy="0">ok</tspan></text><rect x="10" y="287" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="311.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El defecto solo existe en dos de diez posiciones, de modo que una prueba corta casi nunca lo ve. Enumerar las posiciones lo</tspan></text><text x="470" y="328.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">encuentra siempre. La sección crítica cuesta latencia de la rutina: acota esa espera o cambia a una estructura sin bloqueo.</tspan></text><text x="470" y="345.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Modelo de instrucciones, no de un procesador concreto.</tspan></text><text x="470" y="392.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
