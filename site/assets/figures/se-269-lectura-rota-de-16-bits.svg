<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 376" width="940" height="376" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Lectura partida de un valor de 16 bits: la interrupción cae entre las dos lecturas</title><desc id="d">Línea de tiempo de una lectura rota: el programa principal lee el byte alto, la interrupción escribe el byte alto y luego el bajo del valor incrementado, y el programa lee el byte bajo; une así un byte alto de antes con un byte bajo de después. En 400 000 lecturas simuladas se rompen 66, el 0,017 por ciento, todas con más de 100 cuentas de error y un máximo de 256.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="376" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Lectura partida de un valor de 16 bits: la interrupción cae entre las dos lecturas</tspan></text><line x1="194" y1="83" x2="194" y2="195" stroke="#d5dde1" stroke-width="1"/><line x1="194" y1="195" x2="194" y2="200" stroke="#5b7280" stroke-width="1.4"/><text x="194" y="216" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="194" dy="0">0</tspan></text><line x1="337.6" y1="83" x2="337.6" y2="195" stroke="#d5dde1" stroke-width="1"/><line x1="337.6" y1="195" x2="337.6" y2="200" stroke="#5b7280" stroke-width="1.4"/><text x="337.6" y="216" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="337.6" dy="0">1</tspan></text><line x1="481.2" y1="83" x2="481.2" y2="195" stroke="#d5dde1" stroke-width="1"/><line x1="481.2" y1="195" x2="481.2" y2="200" stroke="#5b7280" stroke-width="1.4"/><text x="481.2" y="216" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="481.2" dy="0">2</tspan></text><line x1="624.8" y1="83" x2="624.8" y2="195" stroke="#d5dde1" stroke-width="1"/><line x1="624.8" y1="195" x2="624.8" y2="200" stroke="#5b7280" stroke-width="1.4"/><text x="624.8" y="216" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="624.8" dy="0">3</tspan></text><line x1="768.4" y1="83" x2="768.4" y2="195" stroke="#d5dde1" stroke-width="1"/><line x1="768.4" y1="195" x2="768.4" y2="200" stroke="#5b7280" stroke-width="1.4"/><text x="768.4" y="216" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="768.4" dy="0">4</tspan></text><line x1="912" y1="83" x2="912" y2="195" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="195" x2="912" y2="200" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="216" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">5</tspan></text><line x1="194" y1="195" x2="912" y2="195" stroke="#5b7280" stroke-width="1.6"/><text x="184" y="115.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="184" dy="0">Programa principal</tspan></text><text x="184" y="171.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="184" dy="0">Interrupción</tspan></text><line x1="337.6" y1="75" x2="337.6" y2="195" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="337.6" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="337.6" dy="0">la interrupción cae entre las dos lecturas</tspan></text><line x1="768.4" y1="75" x2="768.4" y2="195" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="768.4" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="768.4" dy="0">resultado: alto viejo y bajo nuevo</tspan></text><rect x="194" y="92" width="143.6" height="38" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="265.8" y="115.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="265.8" dy="0">lee el byte alto</tspan></text><rect x="624.8" y="92" width="143.6" height="38" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="696.6" y="115.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="696.6" dy="0">lee el byte bajo</tspan></text><line x1="14" y1="139" x2="912" y2="139" stroke="#d5dde1" stroke-width="1"/><rect x="337.6" y="148" width="143.6" height="38" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="409.4" y="171.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="409.4" dy="0">escribe el alto</tspan></text><rect x="481.2" y="148" width="143.6" height="38" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="553" y="171.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="553" dy="0">escribe el bajo</tspan></text><text x="553" y="239" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="553" dy="0">Orden de las operaciones (sin escala de tiempo)</tspan></text><rect x="10" y="253" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="277.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Una lectura rota ocurre una vez cada 5000 (0,017 % observado frente a 0,0195 % esperado, 1/20 × 1/256) y casi nunca se ve</tspan></text><text x="470" y="294.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">en pruebas, pero cuando ocurre el error es de 256 cuentas, no de 1. Se evita con una sección crítica, leyendo dos veces</tspan></text><text x="470" y="311.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">hasta que coincidan, o con un número de secuencia. La mitigación no se midió: es una idealización.</tspan></text><text x="470" y="358.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
