<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 401" width="820" height="401" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Lectura de un valor de 16 bits en un micro de 8 bits con una ISR que lo incrementa</title><desc id="d">Tabla: de 400 000 lecturas de un valor de 16 bits que una interrupción incrementa escribiendo primero el byte alto y luego el bajo, 66 resultan rotas, el 0,017 por ciento; todas con un error de más de 100 cuentas y un máximo de 256, porque solo se rompe cuando el incremento cruza un límite de byte.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="820" height="401" fill="#ffffff"/><rect x="10" y="12" width="514" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="267" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="267" dy="0">Medida</tspan></text><rect x="530" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="667" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="667" dy="0">Resultado</tspan></text><rect x="10" y="56" width="514" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="267" dy="0">Lecturas simuladas</tspan></text><rect x="530" y="56" width="274" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="667" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667" dy="0">400 000</tspan></text><rect x="10" y="102" width="514" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="125.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="267" dy="0">Lecturas rotas</tspan></text><rect x="530" y="102" width="274" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="667" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667" dy="0">66 (0,017 %)</tspan></text><rect x="10" y="148" width="514" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="171.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="267" dy="0">Lecturas rotas con error mayor que 100</tspan></text><rect x="530" y="148" width="274" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="667" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667" dy="0">66 (todas)</tspan></text><rect x="10" y="194" width="514" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="217.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="267" dy="0">Error máximo</tspan></text><rect x="530" y="194" width="274" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="667" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667" dy="0">256 cuentas</tspan></text><rect x="10" y="240" width="514" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="263.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="267" dy="0">Frecuencia esperada: 1/20 × 1/256</tspan></text><rect x="530" y="240" width="274" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="667" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667" dy="0">0,0195 %</tspan></text><rect x="10" y="290" width="800" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="410" y="314.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="410" dy="0">Una lectura rota ocurre una vez cada 5000 y casi nunca se ve en pruebas, pero cuando ocurre el error es de</tspan></text><text x="410" y="331.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="410" dy="0">256 cuentas, no de 1. Se evita con una sección crítica, leyendo dos veces hasta que coincidan, o con un</tspan></text><text x="410" y="348.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="410" dy="0">número de secuencia. La mitigación no se midió: es una idealización.</tspan></text><text x="410" y="387.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="410" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
