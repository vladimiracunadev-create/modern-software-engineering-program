<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 355" width="940" height="355" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Bytes de una actualización diferencial de una imagen de 256 KiB (imagen completa: 262 144)</title><desc id="d">Tabla: con una imagen de 262 144 bytes, comparar bloques de 256 bytes por posición transmite 13 200 bytes si cambian 50 bytes al azar y 135 168 si se inserta un solo byte a mitad de la imagen; buscar los bloques en cualquier posición transmite 288 bytes en ese caso, y la imagen nueva comprimida ocupa unos 184 000.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="355" fill="#ffffff"/><rect x="10" y="12" width="394" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="207" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="207" dy="0">Cambio</tspan></text><rect x="410" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="517" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="517" dy="0">Bloques por posición</tspan></text><rect x="630" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="777" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="777" dy="0">Bloques en cualquier posición</tspan></text><rect x="10" y="56" width="394" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">50 bytes cambiados al azar</tspan></text><rect x="410" y="56" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="517" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517" dy="0">13 200</tspan></text><rect x="630" y="56" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">13 512</tspan></text><rect x="10" y="102" width="394" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="125.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">500 bytes cambiados al azar</tspan></text><rect x="410" y="102" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="517" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517" dy="0">106 128</tspan></text><rect x="630" y="102" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">106 936</tspan></text><rect x="10" y="148" width="394" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="171.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Inserción de 100 bytes a mitad</tspan></text><rect x="410" y="148" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="517" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517" dy="0">135 168</tspan></text><rect x="630" y="148" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">288</tspan></text><rect x="10" y="194" width="394" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="217.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Inserción de 1 byte a mitad</tspan></text><rect x="410" y="194" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="517" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517" dy="0">135 168</tspan></text><rect x="630" y="194" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">288</tspan></text><rect x="10" y="244" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="268.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Una inserción desplaza todo lo que sigue y la comparación por posición lo trata como un cambio total; la búsqueda de</tspan></text><text x="470" y="285.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">bloques lo reduce a 288 bytes. Con cambios dispersos ambos métodos se parecen. Firmware sintético de 50 % de estructura y</tspan></text><text x="470" y="302.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">50 % de bytes aleatorios: uno real se comprime de otro modo.</tspan></text><text x="470" y="341.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
