<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 514" width="940" height="514" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Bytes de una actualización diferencial de una imagen de 256 KiB</title><desc id="d">Barras horizontales en escala logarítmica con los bytes que se transmiten según el cambio y el método: comparar bloques de 256 bytes por posición envía 13 200 bytes si cambian 50 bytes al azar y 135 168 si se inserta un solo byte a mitad de la imagen; buscar los bloques en cualquier posición envía 288 en ese caso, frente a 262 144 de la imagen completa.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="514" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Bytes de una actualización diferencial de una imagen de 256 KiB</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Bloques por posición</tspan></text><rect x="214.8" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="234.8" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="234.8" dy="0">Bloques en cualquier posición</tspan></text><line x1="244" y1="77" x2="244" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="244" y1="333" x2="244" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="244" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="244" dy="0">100</tspan></text><line x1="397.895" y1="77" x2="397.895" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="397.895" y1="333" x2="397.895" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="397.895" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397.895" dy="0">1 000</tspan></text><line x1="551.79" y1="77" x2="551.79" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="551.79" y1="333" x2="551.79" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="551.79" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="551.79" dy="0">10 000</tspan></text><line x1="705.685" y1="77" x2="705.685" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="705.685" y1="333" x2="705.685" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="705.685" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705.685" dy="0">100 000</tspan></text><line x1="859.58" y1="77" x2="859.58" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="859.58" y1="333" x2="859.58" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="859.58" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="859.58" dy="0">1 000 000</tspan></text><line x1="244" y1="333" x2="859.58" y2="333" stroke="#5b7280" stroke-width="1.6"/><text x="234" y="113.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="234" dy="0">50 bytes cambiados al azar</tspan></text><text x="234" y="177.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="234" dy="0">500 bytes cambiados al azar</tspan></text><text x="234" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="234" dy="0">Inserción de 100 bytes a mitad</tspan></text><text x="234" y="305.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="234" dy="0">Inserción de 1 byte a mitad</tspan></text><rect x="244" y="83" width="326.346" height="24.5" rx="3" fill="#c0432f"/><text x="577.346" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="577.346" dy="0">13 200</tspan></text><rect x="244" y="110.5" width="327.907" height="24.5" rx="3" fill="#087f8c"/><text x="578.907" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="578.907" dy="0">13 512</tspan></text><rect x="244" y="147" width="465.66" height="24.5" rx="3" fill="#c0432f"/><text x="716.66" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="716.66" dy="0">106 128</tspan></text><rect x="244" y="174.5" width="466.167" height="24.5" rx="3" fill="#087f8c"/><text x="717.167" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="717.167" dy="0">106 936</tspan></text><rect x="244" y="211" width="481.826" height="24.5" rx="3" fill="#c0432f"/><text x="732.826" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="732.826" dy="0">135 168</tspan></text><rect x="244" y="238.5" width="70.6982" height="24.5" rx="3" fill="#087f8c"/><text x="321.698" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="321.698" dy="0">288</tspan></text><rect x="244" y="275" width="481.826" height="24.5" rx="3" fill="#c0432f"/><text x="732.826" y="291.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="732.826" dy="0">135 168</tspan></text><rect x="244" y="302.5" width="70.6982" height="24.5" rx="3" fill="#087f8c"/><text x="321.698" y="319.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="321.698" dy="0">288</tspan></text><line x1="770.096" y1="77" x2="770.096" y2="333" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="775.096" y="90" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="775.096" dy="0">Imagen completa</tspan></text><text x="551.79" y="377" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="551.79" dy="0">Bytes enviados (escala logarítmica)</tspan></text><rect x="10" y="391" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="415.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Una inserción desplaza todo lo que sigue y la comparación por posición lo trata como un cambio total; la búsqueda de</tspan></text><text x="470" y="432.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">bloques lo reduce a 288 bytes. Con cambios dispersos ambos métodos se parecen. Firmware sintético de 50 % de estructura y</tspan></text><text x="470" y="449.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">50 % de bytes aleatorios: uno real se comprime de otro modo. La imagen nueva comprimida ocupa unos 184 000 bytes.</tspan></text><text x="470" y="496.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
