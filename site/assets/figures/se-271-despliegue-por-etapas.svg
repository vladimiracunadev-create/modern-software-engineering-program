<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 587" width="940" height="587" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dispositivos dañados de 10 000 según la fracción de fallo y la política de despliegue</title><desc id="d">Líneas en doble escala logarítmica con los dispositivos dañados de 10 000 según el porcentaje de fallo de la versión: publicar a todos a la vez daña 10, 50, 200 y 1 002; las etapas de 1, 10 y 100 por ciento y las de 0,1, 1, 10 y 100 por ciento dañan entre 10 y 16 en cualquier caso, y detienen el despliegue casi siempre con fallos de 2 y 10 por ciento y casi nunca con 0,1.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="587" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dispositivos dañados de 10 000 según la fracción de fallo y la política de despliegue</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Todos a la vez</tspan></text><rect x="169.56" y="45" width="12" height="12" fill="#946512" stroke="#946512" stroke-width="2"/><text x="189.56" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="189.56" dy="0">Etapas 1 %, 10 %, 100 %</tspan></text><polygon points="396.98,44.1 403.58,56.4 390.38,56.4" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="410.98" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="410.98" dy="0">Etapas 0,1 %, 1 %, 10 %, 100 %</tspan></text><line x1="93.7" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="387" x2="93.7" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">3</tspan></text><line x1="93.7" y1="324.824" x2="910" y2="324.824" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="324.824" x2="93.7" y2="324.824" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="329.324" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">10</tspan></text><line x1="93.7" y1="205.912" x2="910" y2="205.912" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="205.912" x2="93.7" y2="205.912" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="210.412" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">100</tspan></text><line x1="93.7" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="87" x2="93.7" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1 000</tspan></text><line x1="93.7" y1="87" x2="93.7" y2="387" stroke="#5b7280" stroke-width="1.6"/><line x1="111.7" y1="87" x2="111.7" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="111.7" y1="387" x2="111.7" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="111.7" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="111.7" dy="0">0,1</tspan></text><line x1="384.403" y1="87" x2="384.403" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="384.403" y1="387" x2="384.403" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="384.403" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="384.403" dy="0">0,5</tspan></text><line x1="619.297" y1="87" x2="619.297" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="619.297" y1="387" x2="619.297" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="619.297" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="619.297" dy="0">2</tspan></text><line x1="892" y1="87" x2="892" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="387" x2="892" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">10</tspan></text><line x1="93.7" y1="387" x2="910" y2="387" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 237)">Dispositivos dañados (de 10 000) (escala logarítmica)</text><text x="501.85" y="433" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="501.85" dy="0">Fallo de la versión (% de dispositivos) (escala logarítmica)</tspan></text><polyline points="111.7,324.824 384.403,241.708 619.297,170.116 892,86.8968" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="111.7" cy="324.824" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="111.7" y="313.824" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="111.7" dy="0">10</tspan></text><circle cx="384.403" cy="241.708" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="384.403" y="230.708" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="384.403" dy="0">50</tspan></text><circle cx="619.297" cy="170.116" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="619.297" y="159.116" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="619.297" dy="0">200</tspan></text><circle cx="892" cy="86.8968" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="75.8968" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">1 002</tspan></text><polyline points="111.7,324.824 384.403,303.884 619.297,303.884 892,319.901" fill="none" stroke="#946512" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="106.2" y="319.324" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="111.7" y="348.824" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="111.7" dy="0"> </tspan></text><rect x="378.903" y="298.384" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="384.403" y="327.884" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="384.403" dy="0">15</tspan></text><rect x="613.797" y="298.384" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="619.297" y="327.884" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="619.297" dy="0">15</tspan></text><rect x="886.5" y="314.401" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="892" y="343.901" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">11</tspan></text><polyline points="111.7,324.824 384.403,303.884 619.297,300.551 892,324.824" fill="none" stroke="#087f8c" stroke-width="2.4"/><polygon points="111.7,318.499 117.75,329.774 105.65,329.774" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="111.7" y="348.824" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="111.7" dy="0">10</tspan></text><polygon points="384.403,297.559 390.453,308.834 378.353,308.834" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="384.403" y="292.884" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="384.403" dy="0">15</tspan></text><polygon points="619.297,294.226 625.347,305.501 613.247,305.501" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="619.297" y="289.551" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="619.297" dy="0">16</tspan></text><polygon points="892,318.499 898.05,329.774 885.95,329.774" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="313.824" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">10</tspan></text><text x="151.7" y="254.824" font-size="13" text-anchor="start" font-weight="400" fill="#5c1f14" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="151.7" dy="0">Con 0,1 % las etapas solo</tspan></text><text x="151.7" y="271.824" font-size="13" text-anchor="start" font-weight="400" fill="#5c1f14" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="151.7" dy="0">detienen el 5 % de los</tspan></text><text x="151.7" y="288.824" font-size="13" text-anchor="start" font-weight="400" fill="#5c1f14" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="151.7" dy="0">despliegues</tspan></text><line x1="114.26" y1="318.824" x2="143.7" y2="249.824" stroke="#5c1f14" stroke-width="1.2"/><rect x="10" y="447" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las etapas protegen cuando el fallo es lo bastante frecuente como para dar tres informes en la etapa pequeña: con 2 % y 10</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">% detienen el 100 % de los despliegues. Con un fallo del 0,1 % la etapa de 100 dispositivos espera 0,1 fallos y el defecto</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">llega a toda la flota: el tamaño de la primera etapa fija qué fallos se ven. Probabilidad de informe 0,9; 600 despliegues</tspan></text><text x="470" y="521.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">por punto.</tspan></text><text x="470" y="569.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
