<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1070 305" width="1070" height="305" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dispositivos suplantables tras extraer k claves de una flota de 10 000</title><desc id="d">Tabla: si toda la flota comparte una clave, extraer una sola clave de un dispositivo permite suplantar a los 10 000; con claves distintas por dispositivo, extraer 1, 10 o 100 claves permite suplantar exactamente 1, 10 o 100, y si la clave maestra de derivación sale del dispositivo, vuelven a ser 10 000.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1070" height="305" fill="#ffffff"/><rect x="10" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="122" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="122" dy="0">Claves extraídas</tspan></text><rect x="240" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="352" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="352" dy="0">Una clave de flota</tspan></text><rect x="470" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="597" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="597" dy="0">Claves por dispositivo</tspan></text><rect x="730" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="892" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="892" dy="0">Derivadas, con la maestra extraída</tspan></text><rect x="10" y="56" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="122" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">1</tspan></text><rect x="240" y="56" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="352" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352" dy="0">10 000</tspan></text><rect x="470" y="56" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">1</tspan></text><rect x="730" y="56" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="892" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">10 000</tspan></text><rect x="10" y="106" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="122" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">10</tspan></text><rect x="240" y="106" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="352" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352" dy="0">10 000</tspan></text><rect x="470" y="106" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">10</tspan></text><rect x="730" y="106" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="892" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">10 000</tspan></text><rect x="10" y="156" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="122" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">100</tspan></text><rect x="240" y="156" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="352" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352" dy="0">10 000</tspan></text><rect x="470" y="156" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">100</tspan></text><rect x="730" y="156" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="892" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">10 000</tspan></text><rect x="10" y="210" width="1050" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="535" y="234.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="535" dy="0">La clave por dispositivo limita el daño de una extracción a un dispositivo, siempre que la clave maestra nunca esté en ninguno. Las firmas</tspan></text><text x="535" y="251.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="535" dy="0">son HMAC-SHA256 reales; la flota, la extracción y los números son sintéticos y no se atacó ningún chip.</tspan></text><text x="535" y="291.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="535" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
