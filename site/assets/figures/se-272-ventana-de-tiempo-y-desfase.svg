<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 403" width="940" height="403" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mensajes legítimos rechazados por una ventana de tiempo según el desfase del reloj</title><desc id="d">Mapa de calor con el porcentaje de mensajes legítimos rechazados según el desfase típico del reloj y el ancho de la ventana: con desfase de 5 segundos una ventana de más o menos 5 rechaza el 31,56 por ciento; con 30 segundos de desfase una de más o menos 5 rechaza el 86,71 y una de 30 el 31,56; una de 120 segundos casi no rechaza, 0,01 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="403" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Mensajes legítimos rechazados por una ventana de tiempo según el desfase del reloj</tspan></text><text x="528" y="59" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="528" dy="0">Ancho de la ventana de aceptación</tspan></text><text x="266.667" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="266.667" dy="0">Ventana ±5 s</tspan></text><text x="528" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="528" dy="0">Ventana ±30 s</tspan></text><text x="789.333" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="789.333" dy="0">Ventana ±120 s</tspan></text><text x="126" y="122.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="126" dy="0">σ = 1 s</tspan></text><text x="126" y="170.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="126" dy="0">σ = 5 s</tspan></text><text x="126" y="218.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="126" dy="0">σ = 30 s</tspan></text><rect x="137.5" y="95.5" width="258.333" height="45" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="266.667" y="122.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="266.667" dy="0">0 %</tspan></text><rect x="398.833" y="95.5" width="258.333" height="45" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="528" y="122.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="528" dy="0">0 %</tspan></text><rect x="660.167" y="95.5" width="258.333" height="45" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="789.333" y="122.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="789.333" dy="0">0 %</tspan></text><rect x="137.5" y="143.5" width="258.333" height="45" rx="4" fill="#e8b1a7" stroke="#102a43" stroke-width="3"/><text x="266.667" y="170.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="266.667" dy="0">31,56 %</tspan></text><rect x="398.833" y="143.5" width="258.333" height="45" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="528" y="170.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="528" dy="0">0 %</tspan></text><rect x="660.167" y="143.5" width="258.333" height="45" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="789.333" y="170.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="789.333" dy="0">0 %</tspan></text><rect x="137.5" y="191.5" width="258.333" height="45" rx="4" fill="#c85846" stroke="#ffffff" stroke-width="1"/><text x="266.667" y="218.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="266.667" dy="0">86,71 %</tspan></text><rect x="398.833" y="191.5" width="258.333" height="45" rx="4" fill="#e8b1a7" stroke="#102a43" stroke-width="3"/><text x="528" y="218.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="528" dy="0">31,56 %</tspan></text><rect x="660.167" y="191.5" width="258.333" height="45" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="789.333" y="218.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="789.333" dy="0">0,01 %</tspan></text><text x="20" y="166" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 166)">Desfase típico del reloj</text><text x="136" y="264" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="136" dy="0">0 %</tspan></text><rect x="166.62" y="252" width="30.5" height="14" fill="#fbe4de"/><rect x="196.62" y="252" width="30.5" height="14" fill="#f3cdc5"/><rect x="226.62" y="252" width="30.5" height="14" fill="#eab6ac"/><rect x="256.62" y="252" width="30.5" height="14" fill="#e29f93"/><rect x="286.62" y="252" width="30.5" height="14" fill="#d9887a"/><rect x="316.62" y="252" width="30.5" height="14" fill="#d17161"/><rect x="346.62" y="252" width="30.5" height="14" fill="#c85a48"/><rect x="376.62" y="252" width="30.5" height="14" fill="#c0432f"/><text x="414.62" y="264" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="414.62" dy="0">100,00 %</tspan></text><text x="482.94" y="264" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="482.94" dy="0">más oscuro = mayor (% de mensajes rechazados)</tspan></text><rect x="10" y="280" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="304.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Ensanchar la ventana evita rechazos y deja más tiempo para reproducir un mensaje capturado. Un contador estricto no depende</tspan></text><text x="470" y="321.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">del reloj, pero si se reinicia sin memoria persistente acepta el 50,8 % de las reproducciones del modelo. Desfase gaussiano</tspan></text><text x="470" y="338.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">supuesto; no se midió ningún reloj.</tspan></text><text x="470" y="385.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
