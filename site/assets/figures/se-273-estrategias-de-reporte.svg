ll="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="217.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Banda muerta de 0,5</tspan></text><rect x="340" y="194" width="154" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="417" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="417" dy="0">1 250</tspan></text><rect x="500" y="194" width="204" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">8</tspan></text><rect x="710" y="194" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">0</tspan></text><rect x="930" y="194" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="997" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="997" dy="0">0,140</tspan></text><rect x="10" y="240" width="324" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="263.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Media por minuto y evento</tspan></text><rect x="340" y="240" width="154" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="417" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="417" dy="0">11 608</tspan></text><rect x="500" y="240" width="204" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">8</tspan></text><rect x="710" y="240" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">22</tspan></text><rect x="930" y="240" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="997" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="997" dy="0">0,100</tspan></text><rect x="10" y="290" width="1060" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="540" y="314.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="540" dy="0">La banda muerta reduce los bytes 550 veces y avisa de inmediato, pero reconstruye peor la señal lenta. La media por minuto la reconstruye</tspan></text><text x="540" y="331.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="540" dy="0">mejor y retrasa el aviso. No hay estrategia que gane en todo: se elige según lo que se decide con los datos. Señal sintética con ocho picos de</tspan></text><text x="540" y="348.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="540" dy="0">3 °C.</tspan></text><text x="540" y="387.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="540" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
