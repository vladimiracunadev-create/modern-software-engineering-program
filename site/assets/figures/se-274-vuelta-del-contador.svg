<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 355" width="870" height="355" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Temporizadores armados en los dos minutos previos a la vuelta de un contador de 32 bits</title><desc id="d">Tabla: entre temporizadores armados en los dos minutos previos a la vuelta de un contador de milisegundos de 32 bits, la comparación directa decide mal el 33,35 por ciento, 66 703 de 200 000, y la resta sin signo ninguno; el contador da la vuelta a los 49,71 días y los segundos con signo de 32 bits se desbordan el 19 de enero de 2038.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="870" height="355" fill="#ffffff"/><rect x="10" y="12" width="424" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="222" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="222" dy="0">Medida</tspan></text><rect x="440" y="12" width="414" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="647" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="647" dy="0">Resultado</tspan></text><rect x="10" y="56" width="424" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Comparación directa de tiempos</tspan></text><rect x="440" y="56" width="414" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">66 703 de 200 000 (33,35 %)</tspan></text><rect x="10" y="102" width="424" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="125.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Resta sin signo en 32 bits</tspan></text><rect x="440" y="102" width="414" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">0 de 200 000</tspan></text><rect x="10" y="148" width="424" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="171.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Vuelta del contador de milisegundos</tspan></text><rect x="440" y="148" width="414" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">49,71 días</tspan></text><rect x="10" y="194" width="424" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="217.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Desbordamiento de segundos con signo</tspan></text><rect x="440" y="194" width="414" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">19 de enero de 2038, 03:14:07 UTC</tspan></text><rect x="10" y="244" width="850" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="435" y="268.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="435" dy="0">El defecto no aparece nunca en las pruebas de un día y llega a los 49,7 días en todos los dispositivos a la vez si</tspan></text><text x="435" y="285.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="435" dy="0">arrancaron juntos. Se cura con una comparación escrita para la vuelta, no con un contador más grande. Un</tspan></text><text x="435" y="302.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="435" dy="0">dispositivo de 15 años instalado en 2026 pasa por 2038.</tspan></text><text x="435" y="341.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="435" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
