<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 335" width="940" height="335" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Temporizadores armados en los dos minutos previos a la vuelta de un contador de 32 bits</title><desc id="d">Barras horizontales con el porcentaje de decisiones erróneas de 200 000 temporizadores armados justo antes de la vuelta de un contador de milisegundos de 32 bits: la comparación directa decide mal el 33,35 por ciento, 66 703, y la resta sin signo ninguno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="335" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Temporizadores armados en los dos minutos previos a la vuelta de un contador de 32 bits</tspan></text><line x1="324" y1="49" x2="324" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="137" x2="324" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="461.925" y1="49" x2="461.925" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="461.925" y1="137" x2="461.925" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="461.925" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="461.925" dy="0">10</tspan></text><line x1="599.85" y1="49" x2="599.85" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="599.85" y1="137" x2="599.85" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="599.85" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="599.85" dy="0">20</tspan></text><line x1="737.775" y1="49" x2="737.775" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="737.775" y1="137" x2="737.775" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="737.775" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737.775" dy="0">30</tspan></text><line x1="875.7" y1="49" x2="875.7" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="137" x2="875.7" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">40</tspan></text><line x1="324" y1="137" x2="875.7" y2="137" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="67" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Comparación directa de tiempos (66 703 de</tspan></text><text x="314" y="84" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">200 000)</tspan></text><text x="314" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Resta sin signo en 32 bits (0 de 200 000)</tspan></text><rect x="324" y="55" width="459.98" height="32" rx="3" fill="#c0432f"/><text x="790.98" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="790.98" dy="0">33,35</tspan></text><rect x="324" y="99" width="2" height="32" rx="3" fill="#c0432f"/><text x="333" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">0</tspan></text><text x="599.85" y="181" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="599.85" dy="0">% de los 200 000 temporizadores</tspan></text><rect x="10" y="195" width="920" height="92.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="219.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El defecto no aparece nunca en las pruebas de un día y llega a los 49,71 días en todos los dispositivos a la vez si</tspan></text><text x="470" y="236.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">arrancaron juntos; los segundos con signo de 32 bits se desbordan el 19 de enero de 2038, 03:14:07 UTC. Se cura con una</tspan></text><text x="470" y="253.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">comparación escrita para la vuelta, no con un contador más grande. Un dispositivo de 15 años instalado en 2026 pasa por</tspan></text><text x="470" y="269.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">2038.</tspan></text><text x="470" y="317.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
