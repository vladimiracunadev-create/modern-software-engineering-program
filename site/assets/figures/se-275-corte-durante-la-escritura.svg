<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 378" width="940" height="378" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Corte de energía en cada punto de la escritura de una configuración de 8 bytes</title><desc id="d">Barras horizontales apiladas con el estado en que queda la configuración según el punto de corte: sobrescribir en el mismo sitio deja una configuración inválida en 8 de 10 puntos; una sola copia con CRC, en 10 de 12; dos copias alternadas con CRC, en ninguno de 12, y queda siempre la antigua o la nueva.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="378" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Corte de energía en cada punto de la escritura de una configuración de 8 bytes</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Antigua válida</tspan></text><rect x="169.56" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="189.56" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="189.56" dy="0">Nueva válida</tspan></text><rect x="308.04" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="328.04" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="328.04" dy="0">Inválida</tspan></text><line x1="284" y1="77" x2="284" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="284" y1="197" x2="284" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="284" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="284" dy="0">0</tspan></text><line x1="402.34" y1="77" x2="402.34" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="402.34" y1="197" x2="402.34" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="402.34" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402.34" dy="0">2,5</tspan></text><line x1="520.68" y1="77" x2="520.68" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="520.68" y1="197" x2="520.68" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="520.68" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="520.68" dy="0">5</tspan></text><line x1="639.02" y1="77" x2="639.02" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="639.02" y1="197" x2="639.02" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="639.02" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="639.02" dy="0">7,5</tspan></text><line x1="757.36" y1="77" x2="757.36" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="757.36" y1="197" x2="757.36" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="757.36" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757.36" dy="0">10</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="197" x2="875.7" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">12,5</tspan></text><line x1="284" y1="197" x2="875.7" y2="197" stroke="#5b7280" stroke-width="1.6"/><text x="274" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Sobrescribir en el mismo sitio</tspan></text><text x="274" y="141.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Una copia con CRC</tspan></text><text x="274" y="181.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Dos copias alternadas con CRC</tspan></text><rect x="284" y="84" width="47.336" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="307.668" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="307.668" dy="0">1</tspan></text><rect x="331.336" y="84" width="47.336" height="26" fill="#102a43" stroke="#ffffff" stroke-width="1.5"/><text x="355.004" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="355.004" dy="0">1</tspan></text><rect x="378.672" y="84" width="378.688" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="568.016" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="568.016" dy="0">8</tspan></text><text x="764.36" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="764.36" dy="0">10</tspan></text><rect x="284" y="124" width="47.336" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="307.668" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="307.668" dy="0">1</tspan></text><rect x="331.336" y="124" width="47.336" height="26" fill="#102a43" stroke="#ffffff" stroke-width="1.5"/><text x="355.004" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="355.004" dy="0">1</tspan></text><rect x="378.672" y="124" width="473.36" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="615.352" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="615.352" dy="0">10</tspan></text><text x="859.032" y="141.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="859.032" dy="0">12</tspan></text><rect x="284" y="164" width="520.696" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="544.348" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="544.348" dy="0">11</tspan></text><rect x="804.696" y="164" width="47.336" height="26" fill="#102a43" stroke="#ffffff" stroke-width="1.5"/><text x="828.364" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="828.364" dy="0">1</tspan></text><rect x="852.032" y="164" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="859.032" y="181.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="859.032" dy="0">12</tspan></text><text x="579.85" y="241" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="579.85" dy="0">Puntos de corte posibles</tspan></text><rect x="10" y="255" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="279.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Una sola copia con CRC detecta la corrupción, pero no la repara: sin la copia anterior no hay a qué volver. La alternancia</tspan></text><text x="470" y="296.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">de dos copias convierte cualquier corte en «antigua o nueva». Modelo de escritura byte a byte; una flash real programa</tspan></text><text x="470" y="313.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">páginas y puede dejar bits a medias.</tspan></text><text x="470" y="360.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
