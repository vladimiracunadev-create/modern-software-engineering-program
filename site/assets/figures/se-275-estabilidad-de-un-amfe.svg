<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 247" width="1010" height="247" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Estabilidad de un AMFE de 12 modos de fallo si dos evaluadoras difieren en ±1 punto</title><desc id="d">Barras: al perturbar cada puntuación de gravedad, ocurrencia y detección en más o menos un punto en 2000 repeticiones, el primer modo de fallo se conserva el 86,3 por ciento de las veces, el conjunto de los tres peores solo el 27,2 y la correlación de rangos media es 0,834, con un mínimo de 0,427.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1010" height="247" fill="#ffffff"/><text x="470" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">Se conserva el mismo primer modo de fallo</tspan></text><rect x="480" y="16" width="431.5" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="919.5" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="919.5" dy="0">86,3 %</tspan></text><text x="470" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">Se conservan los mismos tres peores modos</tspan></text><rect x="480" y="60" width="136" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="624" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="624" dy="0">27,2 %</tspan></text><text x="470" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">Correlación de rangos media (×100)</tspan></text><rect x="480" y="104" width="417" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="905" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="905" dy="0">0,834</tspan></text><rect x="10" y="152" width="990" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="505" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="505" dy="0">El número de prioridad de riesgo mezcla tres escalas ordinales: un punto de desacuerdo mueve el ranking. Sirve para empezar una</tspan></text><text x="505" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="505" dy="0">conversación, no para ordenar con precisión. Las puntuaciones de los doce modos son sintéticas, con semilla fija.</tspan></text><text x="505" y="233.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="505" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
