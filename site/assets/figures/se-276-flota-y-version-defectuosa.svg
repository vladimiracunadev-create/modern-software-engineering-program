<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 390" width="940" height="390" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mil dispositivos y una versión defectuosa (3 % fallan; informe con probabilidad 0,9)</title><desc id="d">Dumbbell con los dispositivos dañados cuando acaba la publicación y los que siguen dañados al final, de 1000 con una versión que daña al 3 por ciento: publicar a todos daña 30 y siguen 30; las etapas dañan 18, detienen el despliegue a tiempo en el 44,2 por ciento y también dejan 18 sin reversión; con reversión automática y umbral de tres informes solo 1,8 siguen dañados.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="390" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Mil dispositivos y una versión defectuosa (3 % fallan; informe con probabilidad 0,9)</tspan></text><circle cx="22" cy="51" r="6" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Dañados al terminar la publicación</tspan></text><circle cx="326.36" cy="51" r="6" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="340.36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="340.36" dy="0">Siguen dañados al final</tspan></text><line x1="396.18" y1="77" x2="396.18" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="396.18" y1="209" x2="396.18" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="396.18" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="396.18" dy="0">0</tspan></text><line x1="523.86" y1="77" x2="523.86" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="523.86" y1="209" x2="523.86" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="523.86" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="523.86" dy="0">10</tspan></text><line x1="651.54" y1="77" x2="651.54" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="651.54" y1="209" x2="651.54" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="651.54" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="651.54" dy="0">20</tspan></text><line x1="779.22" y1="77" x2="779.22" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="779.22" y1="209" x2="779.22" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="779.22" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="779.22" dy="0">30</tspan></text><line x1="396.18" y1="209" x2="779.22" y2="209" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="95" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">Publicar a todos el día 1 · 1 día · 0 %</tspan></text><text x="344" y="112" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">detenidos</tspan></text><text x="344" y="139" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">Etapas sin reversión automática · 7,7 días ·</tspan></text><text x="344" y="156" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">44,2 % detenidos</tspan></text><text x="344" y="183" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">Etapas con reversión y umbral de 3 informes ·</tspan></text><text x="344" y="200" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">7,7 días · 44,2 % detenidos</tspan></text><line x1="779.22" y1="99" x2="779.22" y2="99" stroke="#c0432f" stroke-width="4"/><circle cx="779.22" cy="99" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="779.22" cy="99" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="767.22" y="103.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="767.22" dy="0">30</tspan></text><text x="791.22" y="103.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="791.22" dy="0">30</tspan></text><text x="926" y="103.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">sin cambio</tspan></text><line x1="626.004" y1="143" x2="626.004" y2="143" stroke="#c0432f" stroke-width="4"/><circle cx="626.004" cy="143" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="626.004" cy="143" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="614.004" y="147.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="614.004" dy="0">18</tspan></text><text x="638.004" y="147.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="638.004" dy="0">18</tspan></text><text x="926" y="147.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">sin cambio</tspan></text><line x1="626.004" y1="187" x2="419.162" y2="187" stroke="#087f8c" stroke-width="4"/><circle cx="626.004" cy="187" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="419.162" cy="187" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="638.004" y="191.5" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="638.004" dy="0">18</tspan></text><text x="407.162" y="191.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="407.162" dy="0">1,8</tspan></text><text x="926" y="191.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">÷ 10</tspan></text><text x="587.7" y="253" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="587.7" dy="0">Dispositivos dañados (de 1000)</tspan></text><rect x="10" y="267" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="291.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Las etapas reducen el daño inicial; la reversión lo repara. Con el 3 % de fallo, 55,8 % de los despliegues llegan a toda la</tspan></text><text x="470" y="308.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">flota antes de detectar el problema, porque la primera etapa de 10 dispositivos espera 0,3 fallos. 2000 despliegues; la</tspan></text><text x="470" y="325.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">reparación al 90 % es un supuesto.</tspan></text><text x="470" y="372.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
