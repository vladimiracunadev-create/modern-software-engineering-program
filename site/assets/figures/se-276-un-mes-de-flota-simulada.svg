<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 567" width="940" height="567" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un mes de 1000 dispositivos simulados con cortes de red, cuelgues y una actualización</title><desc id="d">Barras agrupadas con las horas fuera de servicio por dispositivo y los dispositivos inutilizados de 1000 en un mes simulado, al sumar defensas: el dispositivo básico, que recibe el 86,3 por ciento de los datos, acumula 51,5 horas y 22 inutilizados; con vigilancia, 9,5 horas y 20; con la cola de almacenar y reenviar, 98,6 por ciento de los datos; con dos ranuras y reversión, 0,1 horas y ninguno inutilizado, con 99,9 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="567" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un mes de 1000 dispositivos simulados con cortes de red, cuelgues y una actualización</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Horas fuera de servicio por dispositivo</tspan></text><rect x="358.06" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="378.06" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="378.06" dy="0">Dispositivos inutilizados de 1000</tspan></text><line x1="71.08" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="375" x2="71.08" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="281.667" x2="920" y2="281.667" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="281.667" x2="71.08" y2="281.667" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="286.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="188.333" x2="920" y2="188.333" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="188.333" x2="71.08" y2="188.333" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="192.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">40</tspan></text><line x1="71.08" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="95" x2="71.08" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">60</tspan></text><line x1="71.08" y1="95" x2="71.08" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">Horas · dispositivos de 1000 (menos es mejor)</text><rect x="92.303" y="134.667" width="82.892" height="240.333" rx="3" fill="#946512"/><text x="133.749" y="128.667" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="133.749" dy="0">51,5</tspan></text><rect x="179.195" y="272.333" width="82.892" height="102.667" rx="3" fill="#c0432f"/><text x="220.641" y="266.333" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="220.641" dy="0">22</tspan></text><text x="177.195" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="177.195" dy="0">Básico</tspan></text><text x="177.195" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="177.195" dy="0">86,3 % de los datos</tspan></text><rect x="304.533" y="330.667" width="82.892" height="44.3333" rx="3" fill="#946512"/><text x="345.979" y="324.667" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="345.979" dy="0">9,5</tspan></text><rect x="391.425" y="281.667" width="82.892" height="93.3333" rx="3" fill="#c0432f"/><text x="432.871" y="275.667" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="432.871" dy="0">20</tspan></text><text x="389.425" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="389.425" dy="0">Con vigilancia</tspan></text><text x="389.425" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="389.425" dy="0">91,8 % de los datos</tspan></text><rect x="516.763" y="330.667" width="82.892" height="44.3333" rx="3" fill="#946512"/><text x="558.209" y="324.667" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="558.209" dy="0">9,5</tspan></text><rect x="603.655" y="281.667" width="82.892" height="93.3333" rx="3" fill="#c0432f"/><text x="645.101" y="275.667" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="645.101" dy="0">20</tspan></text><text x="601.655" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="601.655" dy="0">Y cola de reenvío</tspan></text><text x="601.655" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="601.655" dy="0">98,6 % de los datos</tspan></text><rect x="728.993" y="373" width="82.892" height="2" rx="3" fill="#946512"/><text x="770.439" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="770.439" dy="0">0,1</tspan></text><rect x="815.885" y="373" width="82.892" height="2" rx="3" fill="#c0432f"/><text x="857.331" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="857.331" dy="0">0</tspan></text><text x="813.885" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="813.885" dy="0">Y dos ranuras</tspan></text><text x="813.885" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="813.885" dy="0">99,9 % de los datos</tspan></text><rect x="10" y="444" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="468.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Cada mecanismo cura un problema distinto: la vigilancia el tiempo caído, la cola los datos perdidos, las dos ranuras los</tspan></text><text x="470" y="485.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">dispositivos inutilizados. Probabilidades de cuelgue, cortes y fallo de actualización supuestas por el autor; no se simuló</tspan></text><text x="470" y="502.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">ningún componente real.</tspan></text><text x="470" y="549.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
