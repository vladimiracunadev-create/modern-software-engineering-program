<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 371" width="1110" height="371" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un mes de 1000 dispositivos simulados con cortes de red, cuelgues y una actualización</title><desc id="d">Tabla: en un mes simulado con cortes de red, cuelgues y una actualización el día 10, un dispositivo básico entrega el 86,3 por ciento de los datos esperados con 51,5 horas fuera de servicio y deja 22 de 1000 inutilizados; con vigilancia, cola y dos ranuras entrega el 99,9 por ciento con 0,1 horas y ninguno inutilizado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1110" height="371" fill="#ffffff"/><rect x="10" y="12" width="444" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="232" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="232" dy="0">Configuración</tspan></text><rect x="460" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="552" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="552" dy="0">Datos recibidos</tspan></text><rect x="650" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="772" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="772" dy="0">Horas fuera de servicio</tspan></text><rect x="900" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="997" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="997" dy="0">Inutilizados de 1000</tspan></text><rect x="10" y="56" width="444" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="83.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Básico (sin vigilancia, sin cola, sobrescribe)</tspan></text><rect x="460" y="56" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">86,3 %</tspan></text><rect x="650" y="56" width="244" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">51,5</tspan></text><rect x="900" y="56" width="194" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="997" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="997" dy="0">22</tspan></text><rect x="10" y="110" width="444" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="137.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Con temporizador de vigilancia</tspan></text><rect x="460" y="110" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">91,8 %</tspan></text><rect x="650" y="110" width="244" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">9,5</tspan></text><rect x="900" y="110" width="194" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="997" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="997" dy="0">20</tspan></text><rect x="10" y="164" width="444" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="191.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Y cola de almacenar y reenviar</tspan></text><rect x="460" y="164" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">98,6 %</tspan></text><rect x="650" y="164" width="244" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">9,5</tspan></text><rect x="900" y="164" width="194" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="997" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="997" dy="0">20</tspan></text><rect x="10" y="218" width="444" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="245.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Y dos ranuras con reversión</tspan></text><rect x="460" y="218" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">99,9 %</tspan></text><rect x="650" y="218" width="244" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">0,1</tspan></text><rect x="900" y="218" width="194" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="997" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="997" dy="0">0</tspan></text><rect x="10" y="276" width="1090" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="555" y="300.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="555" dy="0">Cada mecanismo cura un problema distinto: la vigilancia el tiempo caído, la cola los datos perdidos, las dos ranuras los dispositivos</tspan></text><text x="555" y="317.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="555" dy="0">inutilizados. Probabilidades de cuelgue, cortes y fallo de actualización supuestas por el autor; no se simuló ningún componente real.</tspan></text><text x="555" y="357.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="555" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
