9.08,305.675 95.13,316.95 83.03,316.95" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="89.08" y="336" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="89.08" dy="0">20</tspan></text><polygon points="356.72,256.925 362.77,268.2 350.67,268.2" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="356.72" y="287.25" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="356.72" dy="0">33</tspan></text><polygon points="624.36,208.175 630.41,219.45 618.31,219.45" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="624.36" y="238.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="624.36" dy="0">46</tspan></text><polygon points="892,159.425 898.05,170.7 885.95,170.7" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="189.75" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">59</tspan></text><text x="129.08" y="183.25" font-size="13" text-anchor="start" font-weight="400" fill="#5c1f14" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="129.08" dy="0">Control estable (r = 2,8):</tspan></text><text x="129.08" y="200.25" font-size="13" text-anchor="start" font-weight="400" fill="#5c1f14" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="129.08" dy="0">no diverge en 500 pasos</tspan></text><line x1="91.64" y1="270.25" x2="121.08" y2="178.25" stroke="#5c1f14" stroke-width="1.2"/><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Cada mil millonésima de diferencia compra apenas unos 14 pasos: la divergencia crece de forma exponencial, así que mejorar</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">la precisión de la máquina retrasa el desacuerdo pero no lo elimina. Si el modelo es caótico, reproducir bit a bit una</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">trayectoria larga en otra plataforma no es un objetivo realista; hay que reproducir estadísticos.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
