<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Pasos hasta que dos trayectorias casi idénticas se separan en 0,1 (mapa logístico, r = 3,9)</title><desc id="d">Líneas con los pasos que tardan en separarse dos trayectorias del mapa logístico caótico según la diferencia inicial: la mediana sube de 23 pasos con diez a la menos seis a 65 con diez a la menos quince, unos 14 pasos por cada tres décadas; en el régimen estable no divergen en quinientos pasos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Pasos hasta que dos trayectorias casi idénticas se separan en 0,1 (mapa logístico, r = 3,9)</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Percentil 90</tspan></text><rect x="154.48" y="45" width="12" height="12" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="174.48" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="174.48" dy="0">Mediana</tspan></text><polygon points="261.26,44.1 267.86,56.4 254.66,56.4" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="275.26" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="275.26" dy="0">Percentil 10</tspan></text><line x1="71.08" y1="387" x2="910" y2="387" stroke="#d5dd