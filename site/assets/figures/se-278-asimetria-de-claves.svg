<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 371" width="950" height="371" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Carga de la partición más cargada frente a la media (8 particiones, 200 000 filas, 1 000 claves)</title><desc id="d">Tabla: con claves repartidas de forma uniforme la partición más cargada tiene 1,01 veces la media; con una distribución de Zipf de exponente 1,1 tiene 2,03 veces y con 1,5 tiene 3,43; añadir un sufijo aleatorio a la clave la devuelve a 1,01.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="371" fill="#ffffff"/><rect x="10" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="132" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="132" dy="0">Exponente de Zipf</tspan></text><rect x="260" y="12" width="334" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="427" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="427" dy="0">Máxima / media sin sal</tspan></text><rect x="600" y="12" width="334" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="767" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="767" dy="0">Máxima / media con sal de 8</tspan></text><rect x="10" y="56" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">0,0 (uniforme)</tspan></text><rect x="260" y="56" width="334" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="427" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="427" dy="0">1,01</tspan></text><rect x="600" y="56" width="334" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">1,01</tspan></text><rect x="10" y="106" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">0,8</tspan></text><rect x="260" y="106" width="334" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="427" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="427" dy="0">1,35</tspan></text><rect x="600" y="106" width="334" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">1,01</tspan></text><rect x="10" y="156" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">1,1</tspan></text><rect x="260" y="156" width="334" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="427" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="427" dy="0">2,03</tspan></text><rect x="600" y="156" width="334" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">1,01</tspan></text><rect x="10" y="206" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">1,5</tspan></text><rect x="260" y="206" width="334" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="427" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="427" dy="0">3,43</tspan></text><rect x="600" y="206" width="334" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">1,01</tspan></text><rect x="10" y="260" width="930" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="475" y="284.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">El reparto por clave es equilibrado solo si las claves lo son: una sola partición con 3,4 veces la media fija el tiempo</tspan></text><text x="475" y="301.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">total del trabajo. Salar la clave reparte la carga a cambio de un paso más para recombinar los resultados parciales. Las</tspan></text><text x="475" y="318.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">claves y los exponentes son sintéticos.</tspan></text><text x="475" y="357.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
