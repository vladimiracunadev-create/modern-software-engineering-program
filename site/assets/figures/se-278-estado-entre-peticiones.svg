<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 530" width="940" height="530" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Valor que devuelve el contador del módulo en cinco peticiones según la política de instancias</title><desc id="d">Líneas con el valor del contador en cinco peticiones: con una instancia reutilizada sube de 1 a 5 y con una instancia nueva por petición vale siempre 1.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="530" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Valor que devuelve el contador del módulo en cinco peticiones según la política de instancias</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Instancia reutilizada</tspan></text><rect x="222.34" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="242.34" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="242.34" dy="0">Instancia nueva por petición</tspan></text><line x1="63.54" y1="347" x2="910" y2="347" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="347" x2="63.54" y2="347" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="351.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">0</tspan></text><line x1="63.54" y1="295" x2="910" y2="295" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="295" x2="63.54" y2="295" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="299.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">1</tspan></text><line x1="63.54" y1="243" x2="910" y2="243" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="243" x2="63.54" y2="243" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="247.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">2</tspan></text><line x1="63.54" y1="191" x2="910" y2="191" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="191" x2="63.54" y2="191" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="195.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">3</tspan></text><line x1="63.54" y1="139" x2="910" y2="139" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="139" x2="63.54" y2="139" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="143.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">4</tspan></text><line x1="63.54" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="87" x2="63.54" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">5</tspan></text><line x1="63.54" y1="87" x2="63.54" y2="347" stroke="#5b7280" stroke-width="1.6"/><line x1="81.54" y1="87" x2="81.54" y2="347" stroke="#d5dde1" stroke-width="1"/><line x1="81.54" y1="347" x2="81.54" y2="352" stroke="#5b7280" stroke-width="1.4"/><text x="81.54" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="81.54" dy="0">1</tspan></text><line x1="284.155" y1="87" x2="284.155" y2="347" stroke="#d5dde1" stroke-width="1"/><line x1="284.155" y1="347" x2="284.155" y2="352" stroke="#5b7280" stroke-width="1.4"/><text x="284.155" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="2