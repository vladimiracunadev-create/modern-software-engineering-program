" dy="0">1</tspan></text><rect x="683.885" y="289.5" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="689.385" y="284" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="689.385" dy="0">1</tspan></text><rect x="886.5" y="289.5" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="284" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">1</tspan></text><rect x="10" y="407" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="431.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Con una instancia reutilizada, el estado de una petición se filtra a la siguiente: el resultado de un estudiante depende</tspan></text><text x="470" y="448.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">del anterior. La instancia por petición cuesta unos 0,5 ms y garantiza que cada una parte limpia. Si una importación guarda</tspan></text><text x="470" y="465.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">datos en el anfitrión, el estado se puede filtrar aunque la instancia sea nueva.</tspan></text><text x="470" y="512.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; los recuentos se repiten y los tiempos varían de una ejecución y de un equipo a otro.</tspan></text></svg>
