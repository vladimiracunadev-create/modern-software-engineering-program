<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 371" width="940" height="371" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Alarmas de deriva (PSI &gt; 0,2) según el desplazamiento de la media y el tamaño de la ventana</title><desc id="d">Tabla: con ventanas de 100 observaciones la alarma de deriva suena el 4 por ciento de las veces sin cambio y el 37 por ciento con un desplazamiento de 0,3 desviaciones; con ventanas de 500 o 5000 no suena con ese desplazamiento y suena el 92 y el 100 por ciento con 0,5.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="371" fill="#ffffff"/><rect x="10" y="12" width="304" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="162" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="162" dy="0">Desplazamiento (desviaciones</tspan></text><text x="162" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="162" dy="0">típicas)</tspan></text><rect x="320" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="417" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="417" dy="0">Ventana de 100</tspan></text><rect x="520" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="617" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="617" dy="0">Ventana de 500</tspan></text><rect x="720" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="822" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="822" dy="0">Ventana de 5 000</tspan></text><rect x="10" y="56" width="304" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">0,0 (sin cambio)</tspan></text><rect x="320" y="56" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="417" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="417" dy="0">4 %</tspan></text><rect x="520" y="56" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="617" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">0 %</tspan></text><rect x="720" y="56" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">0 %</tspan></text><rect x="10" y="106" width="304" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">0,1</tspan></text><rect x="320" y="106" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="417" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="417" dy="0">6 %</tspan></text><rect x="520" y="106" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="617" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">0 %</tspan></text><rect x="720" y="106" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">0 %</tspan></text><rect x="10" y="156" width="304" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">0,3</tspan></text><rect x="320" y="156" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="417" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="417" dy="0">37 %</tspan></text><rect x="520" y="156" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="617" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">0 %</tspan></text><rect x="720" y="156" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">0 %</tspan></text><rect x="10" y="206" width="304" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">0,5</tspan></text><rect x="320" y="206" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="417" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="417" dy="0">92 %</tspan></text><rect x="520" y="206" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="617" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">92 %</tspan></text><rect x="720" y="206" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">100 %</tspan></text><rect x="10" y="260" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="284.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Con ventanas pequeñas el índice se infla por azar: a 0,3 desviaciones la alarma de n = 100 suena 37 veces de 100 y la de n</tspan></text><text x="470" y="301.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">≥ 500 ninguna, porque el valor real del índice (alrededor de 0,09) queda bajo el umbral. El umbral de 0,2 es una</tspan></text><text x="470" y="318.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">convención, no una ley; 200 ventanas por celda.</tspan></text><text x="470" y="357.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
