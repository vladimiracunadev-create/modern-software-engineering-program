<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 590" width="940" height="590" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un detector con sensibilidad 0,90 y especificidad 0,95 según la prevalencia del evento</title><desc id="d">Líneas en escala logarítmica según la prevalencia del evento, con sensibilidad 0,90 y especificidad 0,95: la exactitud se mantiene entre 0,925 y 0,950, la regla «siempre no» sube de 0,500 a 0,999 y la proporción de avisos reales cae de 0,947 con el 50 por ciento a 0,154 con el 1 por ciento y 0,018 con el 0,1.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="590" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un detector con sensibilidad 0,90 y especificidad 0,95 según la prevalencia del evento</tspan></text><circle cx="22" cy="51" r="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Exactitud del detector</tspan></text><rect x="229.88" y="45" width="12" height="12" fill="#946512" stroke="#946512" stroke-width="2"/><text x="249.88" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="249.88" dy="0">Exactitud de «siempre no»</tspan></text><polygon points="472.38,44.1 478.98,56.4 465.78,56.4" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="486.38" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="486.38" dy="0">De cada aviso, proporción real</tspan></text><line 