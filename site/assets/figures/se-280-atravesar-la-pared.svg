<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 421" width="960" height="421" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una bala contra una pared de 0,2 unidades de grosor: choques detectados por la prueba discreta y por la barrida</title><desc id="d">Tabla: con velocidad 5 y 12 unidades por segundo ambos métodos detectan el mismo porcentaje de choques; a 30 la prueba discreta detecta el 19,2 por ciento y la barrida el 49,4; a 60 detecta el 20 y la barrida el 100; a 120 la discreta no detecta ninguno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="421" fill="#ffffff"/><rect x="10" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="117" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="117" dy="0">Velocidad (u/s)</tspan></text><rect x="230" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="367" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="367" dy="0">Paso por fotograma (u)</tspan></text><rect x="510" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="617" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="617" dy="0">Prueba discreta</tspan></text><rect x="730" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="837" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="837" dy="0">Prueba barrida</tspan></text><rect x="10" y="56" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="117" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="117" dy="0">5</tspan></text><rect x="230" y="56" width="274" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="367" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="367" dy="0">0,08</tspan></text><rect x="510" y="56" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="617" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">8,2 %</tspan></text><rect x="730" y="56" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">8,2 %</tspan></text><rect x="10" y="106" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="117" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="117" dy="0">12</tspan></text><rect x="230" y="106" width="274" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="367" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="367" dy="0">0,20</tspan></text><rect x="510" y="106" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="617" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">20,5 %</tspan></text><rect x="730" y="106" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">20,5 %</tspan></text><rect x="10" y="156" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="117" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="117" dy="0">30</tspan></text><rect x="230" y="156" width="274" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="367" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="367" dy="0">0,50</tspan></text><rect x="510" y="156" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="617" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">19,2 %</tspan></text><rect x="730" y="156" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">49,4 %</tspan></text><rect x="10" y="206" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="117" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="117" dy="0">60</tspan></text><rect x="230" y="206" width="274" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="367" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="367" dy="0">1,00</tspan></text><rect x="510" y="206" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="617" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">20,0 %</tspan></text><rect x="730" y="206" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">100 %</tspan></text><rect x="10" y="256" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="117" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="117" dy="0">120</tspan></text><rect x="230" y="256" width="274" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="367" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="367" dy="0">2,00</tspan></text><rect x="510" y="256" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="617" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">0 %</tspan></text><rect x="730" y="256" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">100 %</tspan></text><rect x="10" y="310" width="940" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="334.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Cuando el desplazamiento por fotograma supera el grosor de la pared, la bala aparece a un lado y luego al otro sin estar nunca</tspan></text><text x="480" y="351.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">dentro: el choque desaparece. La prueba barrida revisa el segmento recorrido. Mide cada trayectoria de tres lados: pared, bala</tspan></text><text x="480" y="368.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">y paso del fotograma. 2 000 lanzamientos por celda.</tspan></text><text x="480" y="407.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
