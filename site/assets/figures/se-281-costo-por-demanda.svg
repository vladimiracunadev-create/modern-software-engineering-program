<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 587" width="940" height="587" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Costo por millón de peticiones según la demanda sostenida: un acelerador y una CPU con precios supuestos</title><desc id="d">Líneas en escala logarítmica con el costo en dólares por millón de peticiones según la demanda: el acelerador pasa de 41,67 con 20 peticiones por segundo a 0,42 con 2000 y la CPU de 5,56 a 0,78; el acelerador es más caro hasta 1000 y más barato desde 2000.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="587" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Costo por millón de peticiones según la demanda sostenida: un acelerador y una CPU con precios supuestos</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Acelerador (3,00 USD/h, 2000 peticiones/s por unidad)</tspan></text><rect x="463.62" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="483.62" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="483.62" dy="0">CPU (0,40 USD/h, 150 peticiones/s por unidad)</tspan></text><line x1="78.62" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="387" x2="78.62" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="391.5" font-size="13" text-anchor="end" font-weight="400" 