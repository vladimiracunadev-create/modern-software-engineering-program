<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 421" width="980" height="421" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Pantalla de 90 Hz (presupuesto de 11,1 ms): fotogramas fuera de presupuesto según el coste medio</title><desc id="d">Tabla: con un coste medio de render de 6 milisegundos solo el 0,5 por ciento de los fotogramas supera el presupuesto de 11,1; con 8 milisegundos el 7,4; con 10 milisegundos el 29 por ciento; con sincronización vertical el intervalo medio pasa de 11,2 a 15,9 milisegundos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="421" fill="#ffffff"/><rect x="10" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="102" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="102" dy="0">Coste medio (ms)</tspan></text><rect x="200" y="12" width="314" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="357" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="357" dy="0">Fotogramas fuera de presupuesto</tspan></text><rect x="520" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="657" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="657" dy="0">Intervalo medio mostrado (ms)</tspan></text><rect x="800" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="882" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="882" dy="0">Equivale a (fps)</tspan></text><rect x="10" y="56" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">6</tspan></text><rect x="200" y="56" width="314" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="357" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">0,5 %</tspan></text><rect x="520" y="56" width="274" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="657" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="657" dy="0">11,2</tspan></text><rect x="800" y="56" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="882" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">90</tspan></text><rect x="10" y="106" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">8</tspan></text><rect x="200" y="106" width="314" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="357" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">7,4 %</tspan></text><rect x="520" y="106" width="274" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="657" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="657" dy="0">11,9</tspan></text><rect x="800" y="106" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="882" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">84</tspan></text><rect x="10" y="156" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">9</tspan></text><rect x="200" y="156" width="314" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="357" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">16,5 %</tspan></text><rect x="520" y="156" width="274" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="657" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="657" dy="0">12,9</tspan></text><rect x="800" y="156" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="882" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">77</tspan></text><rect x="10" y="206" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">10</tspan></text><rect x="200" y="206" width="314" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="357" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">29,0 %</tspan></text><rect x="520" y="206" width="274" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="657" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="657" dy="0">14,3</tspan></text><rect x="800" y="206" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="882" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">70</tspan></text><rect x="10" y="256" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">11</tspan></text><rect x="200" y="256" width="314" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="357" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">43,3 %</tspan></text><rect x="520" y="256" width="274" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="657" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="657" dy="0">15,9</tspan></text><rect x="800" y="256" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="882" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">63</tspan></text><rect x="10" y="310" width="960" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="490" y="334.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">El promedio engaña: con un coste medio de 8 ms, por debajo de 11,1, aún el 7 % de los fotogramas se pierde y con sincronización</tspan></text><text x="490" y="351.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">cada uno se muestra el doble de tiempo (22,2 ms en el percentil 99). En realidad virtual esos fotogramas son los que se sienten.</tspan></text><text x="490" y="368.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">Tiempos lognormales con σ = 0,25 supuestos; no se midió ningún casco.</tspan></text><text x="490" y="407.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
