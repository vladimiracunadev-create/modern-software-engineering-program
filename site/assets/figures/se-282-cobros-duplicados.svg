<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 381" width="970" height="381" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reintentar un cobro con hasta tres reintentos cuando la respuesta se pierde</title><desc id="d">Tabla: si el 5 por ciento de las respuestas se pierde y el cliente reintenta hasta tres veces, sin clave de idempotencia se cobra 1,0526 veces por pago y el 4,98 por ciento de los pagos se cobra dos veces o más; con clave de idempotencia se cobra exactamente una vez.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="381" fill="#ffffff"/><rect x="10" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="92" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="92" dy="0">Respuestas</tspan></text><text x="92" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="92" dy="0">perdidas</tspan></text><rect x="180" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="282" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="282" dy="0">Cobros por pago sin</tspan></text><text x="282" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="282" dy="0">clave</tspan></text><rect x="390" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="487" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="487" dy="0">Pagos cobrados 2+</tspan></text><text x="487" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="487" dy="0">veces</tspan></text><rect x="590" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="687" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="687" dy="0">Cobros por pago con</tspan></text><text x="687" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="687" dy="0">clave</tspan></text><rect x="790" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="872" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="872" dy="0">Pagos duplicados</tspan></text><text x="872" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="872" dy="0">con clave</tspan></text><rect x="10" y="56" width="164" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="92" y="91.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="92" dy="0">1 %</tspan></text><rect x="180" y="56" width="204" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="282" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="282" dy="0">1,0109</tspan></text><rect x="390" y="56" width="194" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">1,08 %</tspan></text><rect x="590" y="56" width="194" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="687" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="687" dy="0">1,0000</tspan></text><rect x="790" y="56" width="164" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">0 %</tspan></text><rect x="10" y="126" width="164" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="92" y="161.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="92" dy="0">5 %</tspan></text><rect x="180" y="126" width="204" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="282" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="282" dy="0">1,0526</tspan></text><rect x="390" y="126" width="194" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">4,98 %</tspan></text><rect x="590" y="126" width="194" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="687" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="687" dy="0">1,0000</tspan></text><rect x="790" y="126" width="164" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">0 %</tspan></text><rect x="10" y="196" width="164" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="92" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="92" dy="0">20 %</tspan></text><rect x="180" y="196" width="204" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="282" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="282" dy="0">1,2482</tspan></text><rect x="390" y="196" width="194" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">19,98 %</tspan></text><rect x="590" y="196" width="194" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="687" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="687" dy="0">1,0000</tspan></text><rect x="790" y="196" width="164" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">0 %</tspan></text><rect x="10" y="270" width="950" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="485" y="294.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">El reintento es correcto para el cliente y desastroso para el cargo si el servidor no reconoce la repetición. La clave de</tspan></text><text x="485" y="311.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">idempotencia convierte «lo intenté de nuevo» en «es el mismo cobro». Modelo de 100 000 pagos; el procesador siempre recibe la</tspan></text><text x="485" y="328.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">petición y solo se pierde la respuesta.</tspan></text><text x="485" y="367.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
