<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 511" width="940" height="511" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Libro mayor con cinco mutantes: corridas de 200 operaciones detectadas por cada tipo de comprobación</title><desc id="d">Mapa de calor con las corridas, de 100, en que cada comprobación detecta cada fallo inyectado en un libro mayor: las invariantes de conservación y saldo no negativo detectan 100 de 100 en cuatro fallos y 0 en el redondeo de la comisión; la comparación con un modelo de referencia detecta 100 de 100 en cinco fallos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="511" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Libro mayor con cinco mutantes: corridas de 200 operaciones detectadas por cada tipo de comprobación</tspan></text><text x="598" y="59" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="598" dy="0">Corridas detectadas (de 100)</tspan></text><text x="437" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="437" dy="0">Conservación y saldo ≥ 0</tspan></text><text x="759" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="759" dy="0">Comparación con modelo de referencia</tspan></text><text x="266" y="119.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="266" dy="0">Sin fallos (control)</tspan></text><text x="266" y="161.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="266" dy="0">Transferir sin comprobar saldo</tspan></text><text x="266" y="195" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="266" dy="0">Perder el abono de una</tspan></text><text x="266" y="212" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="266" dy="0">transferencia</tspan></text><text x="266" y="245.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="266" dy="0">Abonar dos veces</tspan></text><text x="266" y="287.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="266" dy="0">Cobrar comisión sin acreditarla</tspan></text><text x="266" y="321" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="266" dy="0">Redondear la comisión hacia</tspan></text><text x="266" y="338" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="266" dy="0">arriba</tspan></text><rect x="277.5" y="95.5" width="319" height="39" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="437" y="119.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="437" dy="0">0 de 100</tspan></text><rect x="599.5" y="95.5" width="319" height="39" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="759" y="119.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="759" dy="0">0 de 100</tspan></text><rect x="277.5" y="137.5" width="319" height="39" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="437" y="161.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="437" dy="0">100 de 100</tspan></text><rect x="599.5" y="137.5" width="319" height="39" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="759" y="161.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="759" dy="0">100 de 100</tspan></text><rect x="277.5" y="179.5" width="319" height="39" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="437" y="203.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="437" dy="0">100 de 100</tspan></text><rect x="599.5" y="179.5" width="319" height="39" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="759" y="203.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="759" dy="0">100 de 100</tspan></text><rect x="277.5" y="221.5" width="319" height="39" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="437" y="245.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="437" dy="0">100 de 100</tspan></text><rect x="599.5" y="221.5" width="319" height="39" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="759" y="245.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="759" dy="0">100 de 100</tspan></text><rect x="277.5" y="263.5" width="319" height="39" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="437" y="287.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="437" dy="0">100 de 100</tspan></text><rect x="599.5" y="263.5" width="319" height="39" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="759" y="287.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="759" dy="0">100 de 100</tspan></text><rect x="277.5" y="305.5" width="319" height="39" rx="4" fill="#dff1ee" stroke="#102a43" stroke-width="3"/><text x="437" y="329.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="437" dy="0">0 de 100</tspan></text><rect x="599.5" y="305.5" width="319" height="39" rx="4" fill="#087f8c" stroke="#102a43" stroke-width="3"/><text x="759" y="329.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="759" dy="0">100 de 100</tspan></text><text x="20" y="220" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 220)">Fallo inyectado</text><text x="276" y="372" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="276" dy="0">0 de 100</tspan></text><rect x="344.32" y="360" width="30.5" height="14" fill="#dff1ee"/><rect x="374.32" y="360" width="30.5" height="14" fill="#c0e1e0"/><rect x="404.32" y="360" width="30.5" height="14" fill="#a2d0d2"/><rect x="434.32" y="360" width="30.5" height="14" fill="#83c0c4"/><rect x="464.32" y="360" width="30.5" height="14" fill="#64b0b6"/><rect x="494.32" y="360" width="30.5" height="14" fill="#45a0a8"/><rect x="524.32" y="360" width="30.5" height="14" fill="#278f9a"/><rect x="554.32" y="360" width="30.5" height="14" fill="#087f8c"/><text x="592.32" y="372" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="592.32" dy="0">100 de 100</tspan></text><text x="675.72" y="372" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="675.72" dy="0">más oscuro = mayor (corridas detectadas)</tspan></text><rect x="10" y="388" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="412.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">La conservación del dinero se cumple aunque el importe sea el equivocado: cobrar 8 en lugar de 7 mueve dinero entre cuentas</tspan></text><text x="470" y="429.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">sin crearlo ni destruirlo. Las invariantes cubren lo que el sistema nunca debe hacer; una regla de negocio exige un oráculo</tspan></text><text x="470" y="446.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">independiente. 100 semillas por mutante.</tspan></text><text x="470" y="493.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
