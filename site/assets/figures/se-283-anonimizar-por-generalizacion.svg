<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 542" width="940" height="542" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Anonimizar 5 000 registros sintéticos por generalización: quién queda único</title><desc id="d">Línea que une el número de clases con el porcentaje de registros únicos al generalizar 5000 registros: con edad exacta y cuatro dígitos hay 4774 clases y el 91,2 por ciento es único; con edad en tramos de 5 años 4025 clases y 64,5; con tramos de 10 años y tres dígitos 736 clases y 1,8; con dos dígitos o menos ningún registro es único, a costa de 80 clases o menos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="542" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Anonimizar 5 000 registros sintéticos por generalización: quién queda único</tspan></text><line x1="78.62" y1="359" x2="910" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="359" x2="78.62" y2="359" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="363.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="299" x2="910" y2="299" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="299" x2="78.62" y2="299" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="303.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">20</tspan></text><line x1="78.62" y1="239" x2="910" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="239" x2="78.62" y2="239" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="243.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">40</tspan></text><line x1="78.62" y1="179" x2="910" y2="179" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="179" x2="78.62" y2="179" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="183.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">60</tspan></text><line x1="78.62" y1="119" x2="910" y2="119" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="119" x2="78.62" y2="119" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="123.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">80</tspan></text><line x1="78.62" y1="59" x2="910" y2="59" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="59" x2="78.62" y2="59" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="63.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="59" x2="78.62" y2="359" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="59" x2="96.62" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="359" x2="96.62" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">1</tspan></text><line x1="295.465" y1="59" x2="295.465" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="295.465" y1="359" x2="295.465" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="295.465" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="295.465" dy="0">10</tspan></text><line x1="494.31" y1="59" x2="494.31" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="494.31" y1="359" x2="494.31" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="494.31" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="494.31" dy="0">100</tspan></text><line x1="693.155" y1="59" x2="693.155" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="693.155" y1="359" x2="693.155" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="693.155" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="693.155" dy="0">1 000</tspan></text><line x1="892" y1="59" x2="892" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="359" x2="892" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">10 000</tspan></text><line x1="78.62" y1="359" x2="910" y2="359" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="209" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 209)">Registros únicos (%)</text><text x="494.31" y="405" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Número de clases (más clases = más detalle conservado) (escala logarítmica)</tspan></text><polyline points="156.478,359 295.465,359 475.04,359 666.684,353.6 813.41,165.5 828.147,85.4" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="156.478" cy="359" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="156.478" y="348" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="156.478" dy="0">Sin edad ni zona</tspan></text><circle cx="295.465" cy="359" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="295.465" y="348" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="295.465" dy="0">Edad 20 años, 1 díg.</tspan></text><circle cx="475.04" cy="359" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="475.04" y="348" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="475.04" dy="0">Edad 10 años, 2 díg.</tspan></text><circle cx="666.684" cy="353.6" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="666.684" y="342.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="666.684" dy="0">Edad 10 años, 3 díg. · 1,8 %</tspan></text><circle cx="813.41" cy="165.5" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="803.41" y="170" font-size="13" text-anchor="end" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="803.41" dy="0">Edad 5 años, 4 díg. · 64,5 %</tspan></text><circle cx="828.147" cy="85.4" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="818.147" y="89.9" font-size="13" text-anchor="end" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="818.147" dy="0">Edad exacta, 4 díg. · 91,2 %</tspan></text><rect x="10" y="419" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="443.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Cada nivel de generalización cuesta detalle útil: con tres dígitos todavía hay 89 personas únicas, y otras 211 están en</tspan></text><text x="470" y="460.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">clases de dos o más personas que comparten el mismo diagnóstico, así que pertenecer a la clase ya revela el dato. k ≥ 2 no</tspan></text><text x="470" y="477.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">es privacidad completa. Población y diagnósticos sintéticos.</tspan></text><text x="470" y="524.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
