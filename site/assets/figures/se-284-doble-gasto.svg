<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 321" width="1080" height="321" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Probabilidad de que un atacante rehaga la cadena: simulación (fórmula de Nakamoto)</title><desc id="d">Tabla: con el 10 por ciento del poder de cómputo un atacante rehace una transacción con 6 confirmaciones con probabilidad 0,001; con el 30 por ciento la probabilidad es 0,157 simulada y 0,132 por la fórmula; con el 40 por ciento es 0,492 y 0,504.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1080" height="321" fill="#ffffff"/><rect x="10" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="112" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="112" dy="0">Poder del atacante</tspan></text><rect x="220" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="302" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="302" dy="0">1 confirmación</tspan></text><rect x="390" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="472" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="472" dy="0">2</tspan></text><rect x="560" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="642" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="642" dy="0">4</tspan></text><rect x="730" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="812" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="812" dy="0">6</tspan></text><rect x="900" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="982" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="982" dy="0">10</tspan></text><rect x="10" y="56" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="81.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">10 %</tspan></text><rect x="220" y="56" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="302" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="302" dy="0">0,200 (0,205)</tspan></text><rect x="390" y="56" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">0,053 (0,051)</tspan></text><rect x="560" y="56" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">0,006 (0,004)</tspan></text><rect x="730" y="56" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">0,001 (0,000)</tspan></text><rect x="900" y="56" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="982" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="982" dy="0">0,000 (0,000)</tspan></text><rect x="10" y="106" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="131.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">30 %</tspan></text><rect x="220" y="106" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="302" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="302" dy="0">0,603 (0,628)</tspan></text><rect x="390" y="106" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">0,431 (0,446)</tspan></text><rect x="560" y="106" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">0,249 (0,239)</tspan></text><rect x="730" y="106" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">0,157 (0,132)</tspan></text><rect x="900" y="106" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="982" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="982" dy="0">0,064 (0,042)</tspan></text><rect x="10" y="156" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="181.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">40 %</tspan></text><rect x="220" y="156" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="302" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="302" dy="0">0,800 (0,829)</tspan></text><rect x="390" y="156" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">0,706 (0,736)</tspan></text><rect x="560" y="156" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">0,581 (0,603)</tspan></text><rect x="730" y="156" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">0,492 (0,504)</tspan></text><rect x="900" y="156" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="982" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="982" dy="0">0,372 (0,360)</tspan></text><rect x="10" y="210" width="1060" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="540" y="234.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="540" dy="0">La seguridad probabilística depende de dos cosas que el código no controla: la fracción de poder del atacante y el número de confirmaciones</tspan></text><text x="540" y="251.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="540" dy="0">que se esperan. Con 30 % ni 10 confirmaciones bajan la probabilidad de 0,04. Simulación (40 000 carreras) y fórmula coinciden en torno a</tspan></text><text x="540" y="268.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="540" dy="0">±0,03; no se probó ninguna red real.</tspan></text><text x="540" y="307.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="540" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
