<rect x="492.58" y="81.529" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><rect x="591.06" y="119.026" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><rect x="689.54" y="214.291" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><rect x="788.02" y="316.11" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><rect x="886.5" y="369.789" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><rect x="10" y="437" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="461.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">El óptimo está cerca de (π/4)·√N: 3 iteraciones con 16 elementos y 12 con 256. Con el doble de iteraciones la probabilidad</tspan></text><text x="470" y="478.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">cae (0,02 con 6 y 4 qubits; 0,006 con 24 y 8): la amplificación es una rotación y se puede pasar de largo. Fórmula exacta</tspan></text><text x="470" y="495.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">para un elemento marcado y sin ruido; la simulación del laboratorio da los mismos valores salvo redondeo.</tspan></text><text x="470" y="542.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación clásica con NumPy: no hubo acceso a ningún ordenador cuántico ni se ejecutó ningún SDK de proveedor.</tspan></text></svg>
