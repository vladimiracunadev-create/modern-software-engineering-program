<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 451" width="1050" height="451" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Retirada con reentrada: fondos extraídos por un atacante con 10 de saldo en un fondo de 110</title><desc id="d">Tabla: en un contrato que actualiza el saldo después de enviar el pago, un atacante con 10 de saldo extrae 30 con profundidad 3, 50 con profundidad 5 y vacía los 110 con profundidad 11; si actualiza el saldo antes de enviar, extrae solo sus 10.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1050" height="451" fill="#ffffff"/><rect x="10" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="102" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="102" dy="0">Profundidad de</tspan></text><text x="102" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="102" dy="0">reentrada</tspan></text><rect x="200" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="317" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="317" dy="0">Extraído (actualiza</tspan></text><text x="317" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="317" dy="0">después)</tspan></text><rect x="440" y="12" width="174" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="527" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="527" dy="0">Fondo restante</tspan></text><rect x="620" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="737" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="737" dy="0">Extraído (actualiza antes)</tspan></text><rect x="860" y="12" width="174" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="947" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="947" dy="0">Fondo restante</tspan></text><rect x="10" y="56" width="184" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="91.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">1</tspan></text><rect x="200" y="56" width="234" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="317" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="317" dy="0">10</tspan></text><rect x="440" y="56" width="174" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">100</tspan></text><rect x="620" y="56" width="234" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">10</tspan></text><rect x="860" y="56" width="174" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="947" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="947" dy="0">100</tspan></text><rect x="10" y="126" width="184" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="161.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">3</tspan></text><rect x="200" y="126" width="234" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="317" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="317" dy="0">30</tspan></text><rect x="440" y="126" width="174" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">80</tspan></text><rect x="620" y="126" width="234" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">10</tspan></text><rect x="860" y="126" width="174" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="947" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="947" dy="0">100</tspan></text><rect x="10" y="196" width="184" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">5</tspan></text><rect x="200" y="196" width="234" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="317" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="317" dy="0">50</tspan></text><rect x="440" y="196" width="174" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">60</tspan></text><rect x="620" y="196" width="234" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">10</tspan></text><rect x="860" y="196" width="174" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="947" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="947" dy="0">100</tspan></text><rect x="10" y="266" width="184" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="301.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">11</tspan></text><rect x="200" y="266" width="234" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="317" y="301.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="317" dy="0">110</tspan></text><rect x="440" y="266" width="174" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="301.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">0</tspan></text><rect x="620" y="266" width="234" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="301.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">10</tspan></text><rect x="860" y="266" width="174" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="947" y="301.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="947" dy="0">100</tspan></text><rect x="10" y="340" width="1030" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="525" y="364.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="525" dy="0">El defecto no está en la aritmética sino en el orden: llamar a código ajeno antes de actualizar el estado permite que ese código vuelva a</tspan></text><text x="525" y="381.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="525" dy="0">entrar con el estado viejo. Comprobar, actualizar y luego interactuar elimina esta clase de ataque; no elimina otras. Modelo de juguete en</tspan></text><text x="525" y="398.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="525" dy="0">Python, no un contrato real ni una red.</tspan></text><text x="525" y="437.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="525" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
