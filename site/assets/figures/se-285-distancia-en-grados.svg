<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 371" width="920" height="371" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Error al tratar grados de longitud y latitud como un plano (pares a menos de 100 km)</title><desc id="d">Tabla: medir distancias como si los grados fueran un plano tiene un error mediano de 0 por ciento en el ecuador, 6,8 a 30 grados de latitud, 25,5 a 60 y 41,4 a 80; el error máximo a 80 grados supera el 500 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="920" height="371" fill="#ffffff"/><rect x="10" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="112" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="112" dy="0">Latitud</tspan></text><rect x="220" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="332" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="332" dy="0">Error mediano</tspan></text><rect x="450" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="562" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="562" dy="0">Percentil 95</tspan></text><rect x="680" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="792" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="792" dy="0">Máximo</tspan></text><rect x="10" y="56" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">0°</tspan></text><rect x="220" y="56" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="332" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="332" dy="0">0,0 %</tspan></text><rect x="450" y="56" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">0,0 %</tspan></text><rect x="680" y="56" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">0,0 %</tspan></text><rect x="10" y="106" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">30°</tspan></text><rect x="220" y="106" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="332" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="332" dy="0">6,8 %</tspan></text><rect x="450" y="106" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">15,2 %</tspan></text><rect x="680" y="106" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">16,0 %</tspan></text><rect x="10" y="156" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">60°</tspan></text><rect x="220" y="156" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="332" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="332" dy="0">25,5 %</tspan></text><rect x="450" y="156" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">96,5 %</tspan></text><rect x="680" y="156" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">103,0 %</tspan></text><rect x="10" y="206" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">80°</tspan></text><rect x="220" y="206" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="332" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="332" dy="0">41,4 %</tspan></text><rect x="450" y="206" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">408,4 %</tspan></text><rect x="680" y="206" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">505,2 %</tspan></text><rect x="10" y="260" width="900" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="460" y="284.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">Un grado de longitud mide 111 km en el ecuador y 19 km a 80° de latitud; la fórmula plana no lo sabe. Además, dos puntos</tspan></text><text x="460" y="301.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">a ambos lados de ±180° quedan a 111 km pero la resta ingenua da 39 919 km. Esferas frente a elipsoides y proyecciones no</tspan></text><text x="460" y="318.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">se evaluaron: la haversine usa un radio medio.</tspan></text><text x="460" y="357.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
