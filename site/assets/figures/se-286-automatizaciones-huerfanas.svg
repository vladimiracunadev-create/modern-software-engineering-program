<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 371" width="950" height="371" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Automatizaciones sin responsable activo si cada responsable se va con probabilidad del 15 % al año (500 flujos)</title><desc id="d">Tabla: con un solo responsable por automatización, el 15,4 por ciento queda sin responsable al año, el 37,8 a los tres y el 52,2 a los cinco, con o sin revisión anual; con dos responsables y revisión anual con reposición queda el 2 por ciento al año, el 5,6 a los tres y el 8,6 a los cinco.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="371" fill="#ffffff"/><rect x="10" y="12" width="394" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="207" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="207" dy="0">Política</tspan></text><rect x="410" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="492" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="492" dy="0">Tras 1 año</tspan></text><rect x="580" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="662" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="662" dy="0">Tras 3 años</tspan></text><rect x="750" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="842" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="842" dy="0">Tras 5 años</tspan></text><rect x="10" y="56" width="394" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Un responsable, sin revisión</tspan></text><rect x="410" y="56" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="492" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">15,4 %</tspan></text><rect x="580" y="56" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">37,8 %</tspan></text><rect x="750" y="56" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">52,2 %</tspan></text><rect x="10" y="106" width="394" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Dos responsables, sin revisión</tspan></text><rect x="410" y="106" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="492" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">2,0 %</tspan></text><rect x="580" y="106" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">12,8 %</tspan></text><rect x="750" y="106" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">30,8 %</tspan></text><rect x="10" y="156" width="394" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Un responsable, revisión anual</tspan></text><rect x="410" y="156" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="492" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">15,4 %</tspan></text><rect x="580" y="156" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">37,8 %</tspan></text><rect x="750" y="156" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">52,2 %</tspan></text><rect x="10" y="206" width="394" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Dos responsables, revisión anual</tspan></text><rect x="410" y="206" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="492" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">2,0 %</tspan></text><rect x="580" y="206" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">5,6 %</tspan></text><rect x="750" y="206" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">8,6 %</tspan></text><rect x="10" y="260" width="930" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="475" y="284.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">La revisión anual no sirve si no queda nadie a quien reasignar: solo cambia el resultado cuando hay al menos dos</tspan></text><text x="475" y="301.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">responsables y la revisión repone al que se fue. La tasa de salida del 15 % es un supuesto, no una medición de ninguna</tspan></text><text x="475" y="318.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">organización; el patrón (no basta revisar) es el hallazgo.</tspan></text><text x="475" y="357.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
