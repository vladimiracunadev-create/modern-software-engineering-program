<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 519" width="950" height="519" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un flujo con 10 bifurcaciones (1 024 caminos): defectos de dos bifurcaciones que halla cada conjunto de pruebas</title><desc id="d">Tabla: en un flujo con diez bifurcaciones y 1024 caminos, 2 pruebas aleatorias hallan en promedio el 43,9 por ciento de los defectos que dependen de dos bifurcaciones, 8 pruebas el 90,4 y 20 el 99,7; un conjunto de 9 pruebas diseñado para cubrir todos los pares los halla todos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="519" fill="#ffffff"/><rect x="10" y="12" width="344" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="182" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="182" dy="0">Conjunto de pruebas</tspan></text><rect x="360" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="507" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="507" dy="0">Defectos de dos bifurcaciones</tspan></text><text x="507" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="507" dy="0">hallados</tspan></text><rect x="660" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="797" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="797" dy="0">Conjuntos que ven cada rama en</tspan></text><text x="797" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="797" dy="0">ambos valores</tspan></text><rect x="10" y="56" width="344" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="182" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">2 pruebas aleatorias</tspan></text><rect x="360" y="56" width="294" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="507" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">43,9 %</tspan></text><rect x="660" y="56" width="274" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">0 %</tspan></text><rect x="10" y="114" width="344" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="182" y="143.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">5 pruebas aleatorias</tspan></text><rect x="360" y="114" width="294" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="507" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">76,8 %</tspan></text><rect x="660" y="114" width="274" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">52 %</tspan></text><rect x="10" y="172" width="344" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="182" y="201.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">8 pruebas aleatorias</tspan></text><rect x="360" y="172" width="294" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="507" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">90,4 %</tspan></text><rect x="660" y="172" width="274" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">93 %</tspan></text><rect x="10" y="230" width="344" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="182" y="259.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">12 pruebas aleatorias</tspan></text><rect x="360" y="230" width="294" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="507" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">96,9 %</tspan></text><rect x="660" y="230" width="274" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">100 %</tspan></text><rect x="10" y="288" width="344" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="182" y="317.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">20 pruebas aleatorias</tspan></text><rect x="360" y="288" width="294" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="507" y="317.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">99,7 %</tspan></text><rect x="660" y="288" width="274" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="317.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">100 %</tspan></text><rect x="10" y="346" width="344" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="182" y="375.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">9 pruebas diseñadas por pares</tspan></text><rect x="360" y="346" width="294" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="507" y="375.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">100 %</tspan></text><rect x="660" y="346" width="274" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="375.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">100 %</tspan></text><rect x="10" y="408" width="930" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="475" y="432.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="475" dy="0">Probar todos los caminos exige 1 024 ejecuciones y duplica con cada bifurcación; cubrir todos los pares exige 9. El cálculo</tspan></text><text x="475" y="449.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="475" dy="0">supone que los defectos dependen como máximo de dos decisiones: uno que dependa de tres se escapa de los pares. 180 defectos</tspan></text><text x="475" y="466.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="475" dy="0">posibles, 300 conjuntos aleatorios por fila.</tspan></text><text x="475" y="505.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
