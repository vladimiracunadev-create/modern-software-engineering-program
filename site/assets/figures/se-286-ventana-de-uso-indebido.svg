<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 522" width="940" height="522" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ventana media de uso indebido de una credencial robada según su vida, con detección de media 20 minutos</title><desc id="d">Líneas con la ventana media de uso indebido de una credencial robada según su vida, con detección exponencial de media 20 minutos: 2,3 minutos con vida de 5 minutos, 13,5 con 60, 19,2 con 480 y 20,1 con 30 días.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="522" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Ventana media de uso indebido de una credencial robada según su vida, con detección de media 20 minutos</tspan></text><line x1="71.08" y1="339" x2="910" y2="339" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="339" x2="71.08" y2="339" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="343.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="283" x2="910" y2="283" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="283" x2="71.08" y2="283" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="287.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">5</tspan></text><line x1="71.08" y1="227" x2="910" y2="227" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="227" x2="71.08" y2="227" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="231.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="171" x2="910" y2="171" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="171" x2="71.08" y2="171" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="175.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">15</tspan></text><line x1="71.08" y1="115" x2="910" y2="115" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="115" x2="71.08" y2="115" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="59" x2="910" y2="59" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="59" x2="71.08" y2="59" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="63.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">25</tspan></text><line x1="71.08" y1="59" x2="71.08" y2="339" stroke="#5b7280" stroke-width="1.6"/><line x1="89.08" y1="59" x2="89.08" y2="339" stroke="#d5dde1" stroke-width="1"/><line x1="89.08" y1="339" x2="89.08" y2="344" stroke="#5b7280" stroke-width="1.4"/><text x="89.08" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="89.08" dy="0">5</tspan></text><line x1="309.198" y1="59" x2="309.198" y2="339" stroke="#d5dde1" stroke-width="1"/><line x1="309.198" y1="339" x2="309.198" y2="344" stroke="#5b7280" stroke-width="1.4"/><text x="309.198" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="309.198" dy="0">60</tspan></text><line x1="493.398" y1="59" x2="493.398" y2="339" stroke="#d5dde1" stroke-width="1"/><line x1="493.398" y1="339" x2="493.398" y2="344" stroke="#5b7280" stroke-width="1.4"/><text x="493.398" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="493.398" dy="0">480 (8 h)</tspan></text><line x1="892" y1="59" x2="892" y2="339" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="339" x2="892" y2="344" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">43 200 (30 días)</tspan></text><line x1="71.08" y1="339" x2="910" y2="339" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="199" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 199)">Ventana media de uso indebido (minutos)</text><text x="490.54" y="385" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="490.54" dy="0">Vida del token en minutos (escala logarítmica) (escala logarítmica)</tspan></text><polyline points="89.08,313.24 309.198,187.8 493.398,123.96 892,113.88" fill="none" stroke="#087f8c" stroke-width="2.4"/><circle cx="89.08" cy="313.24" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="89.08" y="302.24" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="89.08" dy="0">2,3</tspan></text><circle cx="309.198" cy="187.8" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="309.198" y="176.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="309.198" dy="0">13,5</tspan></text><circle cx="493.398" cy="123.96" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="493.398" y="112.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="493.398" dy="0">19,2</tspan></text><circle cx="892" cy="113.88" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="102.88" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">20,1</tspan></text><rect x="10" y="399" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="423.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Pasar de 8 horas a 5 minutos reduce la ventana de 19,2 a 2,3 minutos; pasar de 30 días a 8 horas casi no cambia nada,</tspan></text><text x="470" y="440.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">porque ya manda la detección (20 minutos de media). Acortar la vida ayuda mientras sea menor que el retraso de detección.</tspan></text><text x="470" y="457.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">La detección exponencial de media 20 minutos y la vida restante uniforme son supuestos del autor.</tspan></text><text x="470" y="504.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 48; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
