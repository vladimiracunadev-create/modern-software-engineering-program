stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Un kappa de 0,84 suena alto y aun así el podio cambia en uno de cada cuatro pares de evaluadores. Antes de comparar</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">dominios hay que calibrar la escala con ejemplos y reportar el acuerdo. 300 pares simulados; el ruido gaussiano es un</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">modelo, no una medición de personas.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
