<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 371" width="950" height="371" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dos evaluadores puntúan los mismos 60 criterios con ruido: acuerdo y cambio en los tres primeros</title><desc id="d">Tabla: si dos evaluadores se desvían medio punto al puntuar, coinciden exactamente en el 58 por ciento de los criterios, el kappa ponderado es 0,84 y el trío de dominios más riesgosos difiere en el 24,3 por ciento de los pares; con un punto de ruido coinciden el 36,4 por ciento y el trío difiere en el 61,3.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="371" fill="#ffffff"/><rect x="10" y="12" width="304" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="162" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="162" dy="0">Ruido de cada evaluador (puntos)</tspan></text><rect x="320" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="417" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="417" dy="0">Acuerdo exacto</tspan></text><rect x="520" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="622" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="622" dy="0">Kappa ponderado</tspan></text><rect x="730" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="832" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="832" dy="0">Tres primeros distintos</tspan></text><rect x="10" y="56" width="304" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">0,0</tspan></text><rect x="320" y="56" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="417" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="417" dy="0">100 %</tspan></text><rect x="520" y="56" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">1,00</tspan></text><rect x="730" y="56" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">0 %</tspan></text><rect x="10" y="106" width="304" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">0,5</tspan></text><rect x="320" y="106" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="417" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="417" dy="0">58,0 %</tspan></text><rect x="520" y="106" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">0,84</tspan></text><rect x="730" y="106" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">24,3 %</tspan></text><rect x="10" y="156" width="304" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">1,0</tspan></text><rect x="320" y="156" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="417" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="417" dy="0">36,4 %</tspan></text><rect x="520" y="156" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">0,59</tspan></text><rect x="730" y="156" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">61,3 %</tspan></text><rect x="10" y="206" width="304" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">1,5</tspan></text><rect x="320" y="206" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="417" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="417" dy="0">30,3 %</tspan></text><rect x="520" y="206" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">0,39</tspan></text><rect x="730" y="206" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">82,7 %</tspan></text><rect x="10" y="260" width="930" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="475" y="284.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Un kappa de 0,84 suena alto y aun así el podio cambia en uno de cada cuatro pares de evaluadores. Antes de comparar dominios</tspan></text><text x="475" y="301.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">hay que calibrar la escala con ejemplos y reportar el acuerdo. 300 pares simulados; el ruido gaussiano es un modelo, no una</tspan></text><text x="475" y="318.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">medición de personas.</tspan></text><text x="475" y="357.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
