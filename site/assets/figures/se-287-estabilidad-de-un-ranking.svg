<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 345" width="960" height="345" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diez dominios puntuados en seis criterios: cuánto cambia el ranking al variar los pesos (5 000 sorteos)</title><desc id="d">Tabla: al perturbar los pesos de seis criterios sobre diez dominios, el primer lugar se mantiene en el 100 por ciento de los sorteos con pesos casi iguales, en el 97,6 con pesos algo distintos y en el 84,9 con pesos muy dispares; la correlación de Kendall en el percentil 5 baja de 1,00 a 0,69.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="345" fill="#ffffff"/><rect x="10" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Dispersión de los pesos</tspan></text><rect x="390" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="487" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="487" dy="0">Primer lugar igual</tspan></text><rect x="590" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="702" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="702" dy="0">Primeros dos (conjunto)</tspan></text><text x="702" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="702" dy="0">iguales</tspan></text><rect x="820" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="882" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="882" dy="0">Kendall</tspan></text><text x="882" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="882" dy="0">(percentil 5)</tspan></text><rect x="10" y="56" width="374" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Pesos casi iguales (concentración 50)</tspan></text><rect x="390" y="56" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">100 %</tspan></text><rect x="590" y="56" width="224" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="702" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">99,8 %</tspan></text><rect x="820" y="56" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="882" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">1,00</tspan></text><rect x="10" y="114" width="374" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="143.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Pesos algo distintos (10)</tspan></text><rect x="390" y="114" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">97,6 %</tspan></text><rect x="590" y="114" width="224" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="702" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">88,4 %</tspan></text><rect x="820" y="114" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="882" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">0,87</tspan></text><rect x="10" y="172" width="374" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="201.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Pesos muy dispares (3)</tspan></text><rect x="390" y="172" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">84,9 %</tspan></text><rect x="590" y="172" width="224" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="702" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">71,4 %</tspan></text><rect x="820" y="172" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="882" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">0,69</tspan></text><rect x="10" y="234" width="940" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="258.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">El primer puesto es estable porque en este ejemplo un dominio puntúa alto en casi todo; la parte media del ranking no lo es.</tspan></text><text x="480" y="275.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Los puntajes de 1 a 5 son un juicio ilustrativo del autor, no una medición de los dominios: el ejercicio muestra cómo revisar</tspan></text><text x="480" y="292.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">un ranking, no cuál es el orden verdadero.</tspan></text><text x="480" y="331.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
