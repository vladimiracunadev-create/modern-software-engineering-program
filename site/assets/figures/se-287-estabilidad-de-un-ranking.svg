<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 550" width="940" height="550" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diez dominios puntuados en seis criterios: cuánto cambia el ranking al variar los pesos (5 000 sorteos)</title><desc id="d">Barras agrupadas con el porcentaje de sorteos en que se mantiene el primer lugar y el par de primeros del ranking según lo dispares que sean los pesos: con pesos casi iguales es 100 y 99,8; con pesos algo distintos 97,6 y 88,4; con pesos muy dispares 84,9 y 71,4.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="550" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Diez dominios puntuados en seis criterios: cuánto cambia el ranking al variar los pesos (5 000 sorteos)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Primer lugar igual</tspan></text><rect x="199.72" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="219.72" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="219.72" dy="0">Primeros dos (conjunto) iguales</tspan></text><line x1="78.62" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="375" x2="78.62" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="319" x2="920" y2="319" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="319" x2="78.62" y2="319" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="323.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">20</tspan></text><line x1="78.62" y1="263" x2="920" y2="263" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="263" x2="78.62" y2="263" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="267.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">40</tspan></text><line x1="78.62" y1="207" x2="920" y2="207" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="207" x2="78.62" y2="207" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="211.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">60</tspan></text><line x1="78.62" y1="151" x2="920" y2="151" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="151" x2="78.62" y2="151" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="155.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">80</tspan></text><line x1="78.62" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="95" x2="78.62" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="95" x2="78.62" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">Sorteos en que se mantiene (%)</text><rect x="106.666" y="95" width="110.184" height="280" rx="3" fill="#087f8c"/><text x="161.758" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="161.758" dy="0">100</tspan></text><rect x="220.85" y="95.56" width="110.184" height="279.44" rx="3" fill="#946512"/><text x="275.942" y="89.56" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="275.942" dy="0">99,8</tspan></text><text x="218.85" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="218.85" dy="0">Pesos casi iguales (50)</tspan></text><rect x="387.126" y="101.72" width="110.184" height="273.28" rx="3" fill="#087f8c"/><text x="442.218" y="95.72" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="442.218" dy="0">97,6</tspan></text><rect x="501.31" y="127.48" width="110.184" height="247.52" rx="3" fill="#946512"/><text x="556.402" y="121.48" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="556.402" dy="0">88,4</tspan></text><text x="499.31" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="499.31" dy="0">Pesos algo distintos (10)</tspan></text><rect x="667.586" y="137.28" width="110.184" height="237.72" rx="3" fill="#087f8c"/><text x="722.678" y="131.28" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="722.678" dy="0">84,9</tspan></text><rect x="781.77" y="175.08" width="110.184" height="199.92" rx="3" fill="#946512"/><text x="836.862" y="169.08" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="836.862" dy="0">71,4</tspan></text><text x="779.77" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="779.77" dy="0">Pesos muy dispares (3)</tspan></text><rect x="10" y="427" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El primer puesto es estable porque en este ejemplo un dominio puntúa alto en casi todo; la parte media del ranking no lo</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">es. Los puntajes de 1 a 5 son un juicio ilustrativo del autor, no una medición de los dominios: el ejercicio muestra cómo</tspan></text><text x="470" y="485.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">revisar un ranking, no cuál es el orden verdadero.</tspan></text><text x="470" y="532.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
