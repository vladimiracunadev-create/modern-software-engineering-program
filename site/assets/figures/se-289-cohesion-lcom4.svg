<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 371" width="910" height="371" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Falta de cohesión (LCOM4) de una clase de envíos y de su separación</title><desc id="d">Tabla: una clase de envíos con siete métodos tiene tres componentes de métodos que no comparten atributos, LCOM4 igual a 3; al separarla en precio, aviso y bitácora cada clase tiene LCOM4 igual a 1.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="910" height="371" fill="#ffffff"/><rect x="10" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="132" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="132" dy="0">Clase</tspan></text><rect x="260" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="317" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="317" dy="0">Métodos</tspan></text><rect x="380" y="12" width="104" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="432" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="432" dy="0">LCOM4</tspan></text><rect x="490" y="12" width="404" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="692" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="692" dy="0">Qué agrupa</tspan></text><rect x="10" y="56" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Envio (clase mezclada)</tspan></text><rect x="260" y="56" width="114" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="317" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="317" dy="0">7</tspan></text><rect x="380" y="56" width="104" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">3</tspan></text><rect x="490" y="56" width="404" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">precio, aviso y bitácora no comparten atributos</tspan></text><rect x="10" y="106" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Precio</tspan></text><rect x="260" y="106" width="114" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="317" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="317" dy="0">3</tspan></text><rect x="380" y="106" width="104" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">1</tspan></text><rect x="490" y="106" width="404" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">peso y zona</tspan></text><rect x="10" y="156" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Aviso</tspan></text><rect x="260" y="156" width="114" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="317" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="317" dy="0">2</tspan></text><rect x="380" y="156" width="104" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">1</tspan></text><rect x="490" y="156" width="404" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">correo y plantilla</tspan></text><rect x="10" y="206" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Bitacora</tspan></text><rect x="260" y="206" width="114" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="317" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="317" dy="0">2</tspan></text><rect x="380" y="206" width="104" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">1</tspan></text><rect x="490" y="206" width="404" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">líneas de registro</tspan></text><rect x="10" y="260" width="890" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="455" y="284.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455" dy="0">LCOM4 cuenta los grupos de métodos conectados por atributos compartidos o llamadas entre sí; 3 significa tres clases en</tspan></text><text x="455" y="301.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455" dy="0">una. Con clases aleatorias de seis métodos, si cada uno usa un solo atributo de seis, ninguna clase queda en 1; con dos</tspan></text><text x="455" y="318.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455" dy="0">atributos por método, el 88,7 %; con tres, el 100 %: la métrica mide densidad de uso, no calidad del diseño.</tspan></text><text x="455" y="357.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="455" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
