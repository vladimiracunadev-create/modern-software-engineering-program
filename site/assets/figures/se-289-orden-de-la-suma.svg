<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 423" width="940" height="423" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Sumar 20 000 números de magnitudes muy distintas: el orden cambia el resultado</title><desc id="d">Barras horizontales con el número de totales distintos al sumar veinte mil números de magnitudes muy distintas en mil órdenes aleatorios: la suma ingenua da 205 resultados distintos; la suma ordenada por magnitud, la suma por pares y math.fsum dan uno solo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="423" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Sumar 20 000 números de magnitudes muy distintas: el orden cambia el resultado</tspan></text><line x1="274" y1="49" x2="274" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="225" x2="274" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0</tspan></text><line x1="397.564" y1="49" x2="397.564" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="397.564" y1="225" x2="397.564" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="397.564" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397.564" dy="0">50</tspan></text><line x1="521.128" y1="49" x2="521.128" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="521.128" y1="225" x2="521.128" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="521.128" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="521.128" dy="0">100</tspan></text><line x1="644.692" y1="49" x2="644.692" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="644.692" y1="225" x2="644.692" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="644.692" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="644.692" dy="0">150</tspan></text><line x1="768.256" y1="49" x2="768.256" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="768.256" y1="225" x2="768.256" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="768.256" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="768.256" dy="0">200</tspan></text><line x1="891.82" y1="49" x2="891.82" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="891.82" y1="225" x2="891.82" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="891.82" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="891.82" dy="0">250</tspan></text><line x1="274" y1="225" x2="891.82" y2="225" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="67" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Suma ingenua, 1000 órdenes</tspan></text><text x="264" y="84" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">aleatorios</tspan></text><text x="264" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Suma ingenua ordenada por magnitud</tspan></text><text x="264" y="163.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Suma por pares (recursiva)</tspan></text><text x="264" y="207.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">math.fsum (referencia exacta)</tspan></text><rect x="274" y="55" width="506.612" height="32" rx="3" fill="#c0432f"/><text x="787.612" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="787.612" dy="0">205</tspan></text><rect x="274" y="99" width="2.47128" height="32" rx="3" fill="#c0432f"/><text x="283.471" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="283.471" dy="0">1</tspan></text><rect x="274" y="143" width="2.47128" height="32" rx="3" fill="#c0432f"/><text x="283.471" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="283.471" dy="0">1</tspan></text><rect x="274" y="187" width="2.47128" height="32" rx="3" fill="#c0432f"/><text x="283.471" y="207.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="283.471" dy="0">1</tspan></text><text x="582.91" y="269" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="582.91" dy="0">Totales distintos en 1 000 órdenes</tspan></text><rect x="10" y="283" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="307.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Sumar en coma flotante no es asociativo: el mismo conjunto de datos produce 205 totales distintos según el orden en que lo</tspan></text><text x="470" y="324.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">recorre un procesador, un hilo o una partición. Cambiar el número de núcleos puede cambiar la última cifra publicada. El</tspan></text><text x="470" y="341.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">error absoluto es pequeño frente a un total de unos 2·10⁹, pero basta para que una comparación exacta entre ejecuciones</tspan></text><text x="470" y="357.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">falle.</tspan></text><text x="470" y="405.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
