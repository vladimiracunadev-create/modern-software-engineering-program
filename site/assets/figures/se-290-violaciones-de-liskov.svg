<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 461" width="920" height="461" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Subclases que rompen el contrato de Tarifa: tres ejemplos frente a 2000 entradas al azar</title><desc id="d">Tabla: de cuatro subclases que violan el contrato de una tarifa, tres ejemplos de camino feliz no detectan ninguna; 2000 entradas al azar con una comprobación de contrato detectan el 61,8 por ciento de la que rechaza pesos altos, el 19,1 de la que lanza una excepción nueva, el 0,9 de la no monótona y solo el 0,1 de la que falla en un rincón estrecho.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="920" height="461" fill="#ffffff"/><rect x="10" y="12" width="474" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="247" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="247" dy="0">Subclase</tspan></text><rect x="490" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="572" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="572" dy="0">Fallos en 3</tspan></text><text x="572" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="572" dy="0">ejemplos</tspan></text><rect x="660" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="782" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="782" dy="0">Fallos en 2000 entradas al</tspan></text><text x="782" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="782" dy="0">azar</tspan></text><rect x="10" y="56" width="474" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">Compatible</tspan></text><rect x="490" y="56" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">0</tspan></text><rect x="660" y="56" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">0 de 2000</tspan></text><rect x="10" y="114" width="474" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="143.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">Rechaza pesos mayores de 20 (precondición más fuerte)</tspan></text><rect x="490" y="114" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">0</tspan></text><rect x="660" y="114" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">1236 (61,8 %)</tspan></text><rect x="10" y="172" width="474" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="201.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">Pierde monotonía solo si peso &gt; 45 y zona 1</tspan></text><rect x="490" y="172" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">0</tspan></text><rect x="660" y="172" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">3 (0,1 %)</tspan></text><rect x="10" y="230" width="474" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="259.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">Pesos desde 30 con 20 % de descuento (no monótona)</tspan></text><rect x="490" y="230" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">0</tspan></text><rect x="660" y="230" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">18 (0,9 %)</tspan></text><rect x="10" y="288" width="474" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="317.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">Lanza KeyError en la zona 5 (excepción nueva)</tspan></text><rect x="490" y="288" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="317.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">0</tspan></text><rect x="660" y="288" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="317.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">382 (19,1 %)</tspan></text><rect x="10" y="350" width="900" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="460" y="374.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">Probar con la superclase en la mano es la prueba de sustitución: todas las subclases deben pasar el mismo conjunto de</tspan></text><text x="460" y="391.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">comprobaciones. Una violación que ocurre en el 0,1 % del dominio se escapa incluso a 2000 entradas: el azar no sustituye</tspan></text><text x="460" y="408.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">a razonar sobre las condiciones del contrato. El contrato es del autor.</tspan></text><text x="460" y="447.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
