<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 578" width="980" height="578" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Subclases que rompen el contrato de Tarifa: tres ejemplos frente a 2000 entradas al azar</title><desc id="d">Barras horizontales con el porcentaje de violaciones que detecta cada método en cinco subclases de una tarifa: tres ejemplos de camino feliz no detectan ninguna; 2000 entradas al azar detectan el 61,8 por ciento de la que rechaza pesos altos, el 19,1 de la que lanza una excepción nueva, el 0,9 de la no monótona y solo el 0,1 de la que falla en un rincón estrecho.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="578" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Subclases que rompen el contrato de Tarifa: tres ejemplos frente a 2000 entradas al azar</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">3 ejemplos de camino feliz</tspan></text><rect x="260.04" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="280.04" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="280.04" dy="0">2000 entradas al azar</tspan></text><line x1="314" y1="77" x2="314" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="314" y1="397" x2="314" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="314" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="314" dy="0">0</tspan></text><line x1="466.44" y1="77" x2="466.44" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="466.44" y1="397" x2="466.44" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="466.44" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="466.44" dy="0">20</tspan></text><line x1="618.88" y1="77" x2="618.88" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="618.88" y1="397" x2="618.88" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="618.88" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="618.88" dy="0">40</tspan></text><line x1="771.32" y1="77" x2="771.32" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="771.32" y1="397" x2="771.32" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="771.32" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="771.32" dy="0">60</tspan></text><line x1="923.76" y1="77" x2="923.76" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="923.76" y1="397" x2="923.76" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="923.76" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="923.76" dy="0">80</tspan></text><line x1="314" y1="397" x2="923.76" y2="397" stroke="#5b7280" stroke-width="1.6"/><text x="304" y="113.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Compatible</tspan></text><text x="304" y="177.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Rechaza pesos mayores de 20</tspan></text><text x="304" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Lanza KeyError en la zona 5</tspan></text><text x="304" y="305.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Pesos desde 30 con 20 % de descuento</tspan></text><text x="304" y="369.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Pierde monotonía si peso &gt; 45 y zona 1</tspan></text><rect x="314" y="83" width="2" height="24.5" rx="3" fill="#946512"/><text x="323" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="323" dy="0">0,0</tspan></text><rect x="314" y="110.5" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="323" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="323" dy="0">0,0</tspan></text><rect x="314" y="147" width="2" height="24.5" rx="3" fill="#946512"/><text x="323" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="323" dy="0">0,0</tspan></text><rect x="314" y="174.5" width="471.04" height="24.5" rx="3" fill="#087f8c"/><text x="792.04" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="792.04" dy="0">61,8</tspan></text><rect x="314" y="211" width="2" height="24.5" rx="3" fill="#946512"/><text x="323" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="323" dy="0">0,0</tspan></text><rect x="314" y="238.5" width="145.58" height="24.5" rx="3" fill="#087f8c"/><text x="466.58" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="466.58" dy="0">19,1</tspan></text><rect x="314" y="275" width="2" height="24.5" rx="3" fill="#946512"/><text x="323" y="291.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="323" dy="0">0,0</tspan></text><rect x="314" y="302.5" width="6.8598" height="24.5" rx="3" fill="#087f8c"/><text x="327.86" y="319.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="327.86" dy="0">0,9</tspan></text><rect x="314" y="339" width="2" height="24.5" rx="3" fill="#946512"/><text x="323" y="355.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="323" dy="0">0,0</tspan></text><rect x="314" y="366.5" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="323" y="383.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="323" dy="0">0,1</tspan></text><text x="618.88" y="441" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="618.88" dy="0">Entradas en que se detecta la violación (%)</tspan></text><rect x="10" y="455" width="960" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="490" y="479.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Probar con la superclase en la mano es la prueba de sustitución: todas las subclases deben pasar el mismo conjunto de</tspan></text><text x="490" y="496.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">comprobaciones. Una violación que ocurre en el 0,1 % del dominio se escapa incluso a 2000 entradas: el azar no sustituye a</tspan></text><text x="490" y="513.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">razonar sobre las condiciones del contrato. El contrato es del autor.</tspan></text><text x="490" y="560.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
