<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 287" width="930" height="287" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Contador de elementos agregados: lotes con cuenta errónea según el diseño y la base</title><desc id="d">Tabla: un contador implementado por herencia cuenta mal los mil lotes cuando la clase base implementa agregar todos llamando a agregar, y ninguno cuando la base la implementa de otra manera; el mismo contador por composición y delegación cuenta bien los mil lotes con ambas bases.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="287" fill="#ffffff"/><rect x="10" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="137" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="137" dy="0">Diseño del contador</tspan></text><rect x="270" y="12" width="344" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="442" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="442" dy="0">Base V1 (agregar_todos llama a agregar)</tspan></text><rect x="620" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="767" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="767" dy="0">Base V2 (agregar_todos usa extend)</tspan></text><rect x="10" y="56" width="254" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">Herencia</tspan></text><rect x="270" y="56" width="344" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">1000 de 1000</tspan></text><rect x="620" y="56" width="294" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">0 de 1000</tspan></text><rect x="10" y="114" width="254" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="143.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">Composición y delegación</tspan></text><rect x="270" y="114" width="344" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">0 de 1000</tspan></text><rect x="620" y="114" width="294" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">0 de 1000</tspan></text><rect x="10" y="176" width="910" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="465" y="200.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">La subclase funcionaba o fallaba según un detalle interno de la base que ni la interfaz ni la documentación prometían: eso</tspan></text><text x="465" y="217.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">es la clase base frágil. La composición solo depende de lo que la base promete. La prueba que pasó con V2 no vio que V1</tspan></text><text x="465" y="234.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">existía. Lotes de 1 a 6 elementos con semilla fija.</tspan></text><text x="465" y="273.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
