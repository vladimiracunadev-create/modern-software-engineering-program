<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 346" width="940" height="346" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Exactitud de un umbral sobre una variable con y sin fuga de la etiqueta (4 000 casos por conjunto)</title><desc id="d">Puntos unidos por una línea con la exactitud en prueba y en producción de dos variables: la señal real pasa de 0,742 a 0,755; la copia ruidosa de la etiqueta cae de 0,899 a 0,515 porque en producción esa copia no existe.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="346" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Exactitud de un umbral sobre una variable con y sin fuga de la etiqueta (4 000 casos por conjunto)</tspan></text><circle cx="22" cy="51" r="6" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">En prueba</tspan></text><circle cx="137.86" cy="51" r="6" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="151.86" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="151.86" dy="0">En producción</tspan></text><line x1="332.3" y1="77" x2="332.3" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="332.3" y1="165" x2="332.3" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="332.3" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="332.3" dy="0">0</tspan></text><line x1="424.908" y1="77" x2="424.908" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="424.908" y1="165" x2="424.908" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="424.908" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="424.908" dy="0">0,2</tspan></text><line x1="517.516" y1="77" x2="517.516" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="517.516" y1="165" x2="517.516" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="517.516" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517.516" dy="0">0,4</tspan></text><line x1="610.124" y1="77" x2="610.124" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="610.124" y1="165" x2="610.124" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="610.124" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="610.124" dy="0">0,6</tspan></text><line x1="702.732" y1="77" x2="702.732" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="702.732" y1="165" x2="702.732" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="702.732" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702.732" dy="0">0,8</tspan></text><line x1="795.34" y1="77" x2="795.34" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="795.34" y1="165" x2="795.34" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="795.34" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="795.34" dy="0">1</tspan></text><line x1="332.3" y1="165" x2="795.34" y2="165" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="103.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Señal real (x), sin fuga</tspan></text><text x="264" y="139" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Copia ruidosa de la etiqueta (z),</tspan></text><text x="264" y="156" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">con fuga</tspan></text><line x1="675.876" y1="99" x2="681.895" y2="99" stroke="#087f8c" stroke-width="4"/><circle cx="675.876" cy="99" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="681.895" cy="99" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="663.876" y="103.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="663.876" dy="0">0,742</tspan></text><text x="693.895" y="103.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="693.895" dy="0">0,755</tspan></text><text x="926" y="103.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">+0,013</tspan></text><line x1="748.573" y1="143" x2="570.766" y2="143" stroke="#c0432f" stroke-width="4"/><circle cx="748.573" cy="143" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="570.766" cy="143" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="760.573" y="147.5" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="760.573" dy="0">0,899</tspan></text><text x="558.766" y="147.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="558.766" dy="0">0,515</tspan></text><text x="926" y="147.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">−0,384</tspan></text><text x="563.82" y="209" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="563.82" dy="0">Exactitud del umbral (0 a 1)</tspan></text><rect x="10" y="223" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="247.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">La métrica de prueba subió 16 puntos justo cuando el modelo dejó de aprender el fenómeno y empezó a leer la respuesta. Una</tspan></text><text x="470" y="264.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">exactitud sorprendentemente alta es una pista para buscar fuga, no para celebrar. La fuga se detecta preguntando, variable</tspan></text><text x="470" y="281.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">por variable, si existiría en el momento de predecir.</tspan></text><text x="470" y="328.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
