<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 263" width="1010" height="263" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">3000 jerarquías aleatorias de 8 clases con hasta 3 bases cada una</title><desc id="d">Barras: de tres mil jerarquías aleatorias de ocho clases con hasta tres bases, el 65,2 por ciento no se puede crear por un orden de resolución de métodos inconsistente; del resto, en el 91,6 por ciento de los casos con un método heredado de dos o más bases, invertir el orden de las bases cambia el método que se ejecuta.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1010" height="263" fill="#ffffff"/><text x="470" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">Jerarquías que no se pueden crear (MRO)</tspan></text><rect x="480" y="16" width="326" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="814" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="814" dy="0">65,2 %</tspan></text><text x="470" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">Jerarquías que se crean</tspan></text><rect x="480" y="60" width="174" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="662" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="662" dy="0">34,8 %</tspan></text><text x="470" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="470" dy="0">De las que heredan el mismo método de 2 o más bases: el elegido cambia al invertir las bases</tspan></text><rect x="480" y="104" width="458" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="946" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="946" dy="0">91,6 % (175 de 191)</tspan></text><rect x="10" y="152" width="990" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="505" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="505" dy="0">Python rechaza con TypeError los órdenes de bases imposibles y resuelve el resto por un orden lineal definido por el orden en que se</tspan></text><text x="505" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="505" dy="0">escriben las bases. Escribir class C(A, B) o class C(B, A) cambia el programa. Jerarquías sintéticas sin semántica: miden la</tspan></text><text x="505" y="210.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="505" dy="0">mecánica, no cuán común es en proyectos reales.</tspan></text><text x="505" y="249.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="505" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
