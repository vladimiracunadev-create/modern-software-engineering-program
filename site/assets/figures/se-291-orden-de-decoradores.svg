"/><text x="396.933" y="342.651" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="396.933" dy="0">6</tspan></text><rect x="638.967" y="342.796" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="644.467" y="337.296" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="644.467" dy="0">8</tspan></text><rect x="886.5" y="338.643" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="333.143" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">10</tspan></text><polyline points="149.4,327.848 396.933,264.543 644.467,189.621 892,105.867" fill="none" stroke="#946512" stroke-width="2.4"/><polygon points="149.4,321.523 155.45,332.798 143.35,332.798" fill="#946512" stroke="#946512" stroke-width="2"/><text x="149.4" y="316.848" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="149.4" dy="0">24</tspan></text><polygon points="396.933,258.218 402.983,269.493 390.883,269.493" fill="#946512" stroke="#946512" stroke-width="2"/><text x="396.933" y="253.543" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="396.933" dy="0">720</tspan></text><polygon points="644.467,183.296 650.517,194.571 638.417,194.571" fill="#946512" stroke="#946512" stroke-width="2"/><text x="644.467" y="178.621" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="644.467" dy="0">40 320</tspan></text><polygon points="892,99.5423 898.05,110.817 885.95,110.817" fill="#946512" stroke="#946512" stroke-width="2"/><text x="892" y="94.8673" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">3 628 800</tspan></text><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Con cuatro opciones, base 50, frágil +4, seguro ×1,02, urgente ×1,30 y refrigerado +6, los 24 órdenes dan 14 totales entre</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">76,30 y 79,56: la composición cambia el crecimiento (lineal en vez de exponencial) pero el orden pasa a ser parte del</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">diseño y debe fijarse o probarse.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
