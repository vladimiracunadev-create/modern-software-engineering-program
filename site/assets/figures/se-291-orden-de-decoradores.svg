<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 371" width="930" height="371" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Opciones de envío combinables: subclases por combinación frente a decoradores</title><desc id="d">Tabla: con cuatro opciones combinables hacen falta 15 subclases por combinación frente a 4 decoradores; con diez opciones, 1023 frente a 10; pero los decoradores se pueden aplicar en 24 órdenes con cuatro opciones y en 3 628 800 con diez, y con cuatro opciones los 24 órdenes dan 14 totales distintos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="371" fill="#ffffff"/><rect x="10" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="72" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="72" dy="0">Opciones</tspan></text><rect x="140" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="222" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="222" dy="0">Subclases</tspan></text><rect x="310" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="402" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="402" dy="0">Decoradores</tspan></text><rect x="500" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="607" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="607" dy="0">Órdenes posibles</tspan></text><rect x="720" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="817" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="817" dy="0">Totales distintos</tspan></text><rect x="10" y="56" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="72" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="72" dy="0">4</tspan></text><rect x="140" y="56" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="222" dy="0">15</tspan></text><rect x="310" y="56" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">4</tspan></text><rect x="500" y="56" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="607" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607" dy="0">24</tspan></text><rect x="720" y="56" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">14 de 24</tspan></text><rect x="10" y="106" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="72" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="72" dy="0">6</tspan></text><rect x="140" y="106" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="222" dy="0">63</tspan></text><rect x="310" y="106" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">6</tspan></text><rect x="500" y="106" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="607" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607" dy="0">720</tspan></text><rect x="720" y="106" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">—</tspan></text><rect x="10" y="156" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="72" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="72" dy="0">8</tspan></text><rect x="140" y="156" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="222" dy="0">255</tspan></text><rect x="310" y="156" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">8</tspan></text><rect x="500" y="156" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="607" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607" dy="0">40 320</tspan></text><rect x="720" y="156" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">—</tspan></text><rect x="10" y="206" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="72" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="72" dy="0">10</tspan></text><rect x="140" y="206" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="222" dy="0">1023</tspan></text><rect x="310" y="206" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">10</tspan></text><rect x="500" y="206" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="607" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607" dy="0">3 628 800</tspan></text><rect x="720" y="206" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">—</tspan></text><rect x="10" y="260" width="910" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="284.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">Con base 50, frágil +4, seguro ×1,02, urgente ×1,30 y refrigerado +6, los 24 órdenes dan 14 totales entre 76,30 y 79,56:</tspan></text><text x="465" y="301.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">la composición cambia el crecimiento (lineal en vez de exponencial) pero el orden pasa a ser parte del diseño y debe</tspan></text><text x="465" y="318.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">fijarse o probarse.</tspan></text><text x="465" y="357.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
