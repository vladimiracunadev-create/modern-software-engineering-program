<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Opciones de envío combinables: subclases, decoradores y órdenes posibles</title><desc id="d">Líneas en escala logarítmica según el número de opciones combinables: las subclases por combinación crecen de 15 con 4 opciones a 1023 con 10, los decoradores solo de 4 a 10, y los órdenes en que se pueden aplicar los decoradores crecen de 24 a 3 628 800.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Opciones de envío combinables: subclases, decoradores y órdenes posibles</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Subclases por combinación</tspan></text><rect x="252.5" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="272.5" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="272.5" dy="0">Decoradores</tspan></text><polygon points="389.44,44.1 396.04,56.4 382.84,56.4" fill="#946512" stroke="#946512" stroke-width="2"/><text x="403.44" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="403.44" dy="0">Órdenes posibles de los decoradores</tspan></text><line x1="131.4" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="126.4" y1