y1="106" x2="315.726" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="315.726" y1="406" x2="315.726" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="315.726" y="427" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="315.726" dy="0">12</tspan></text><line x1="545.048" y1="106" x2="545.048" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="545.048" y1="406" x2="545.048" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="545.048" y="427" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="545.048" dy="0">30</tspan></text><line x1="718.524" y1="106" x2="718.524" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="718.524" y1="406" x2="718.524" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="718.524" y="427" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="718.524" dy="0">60</tspan></text><line x1="892" y1="106" x2="892" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="406" x2="892" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="427" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">120</tspan></text><line x1="78.62" y1="406" x2="910" y2="406" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="256" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 256)">Choques detectados (%)</text><text x="494.31" y="452" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Velocidad de la bala (u/s) (escala logarítmica)</tspan></text><line x1="315.726" y1="106" x2="315.726" y2="406" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="320.726" y="119" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14"><tspan x="320.726" dy="0">paso = grosor</tspan></text><polyline points="96.62,381.4 315.726,344.5 545.048,348.4 718.524,346 892,406" fill="none" stroke="#c0432f" stroke-width="2.4"/><cir