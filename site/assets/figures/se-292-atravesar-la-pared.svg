<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 589" width="940" height="589" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una bala contra una pared de 0,2 unidades de grosor: choques detectados por la prueba discreta y por la barrida</title><desc id="d">Líneas en escala logarítmica con el porcentaje de choques detectados según la velocidad de la bala: la prueba discreta se queda en torno al 20 por ciento desde 12 unidades por segundo y cae a 0 con 120; la prueba barrida sube a 49,4 con 30 y a 100 con 60 y 120.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="589" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Una bala contra una pared de 0,2 unidades de grosor: choques detectados por la prueba discreta y por la</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">barrida</tspan></text><circle cx="22" cy="70" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Prueba discreta</tspan></text><rect x="177.1" y="64" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="197.1" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="197.1" dy="0">Prueba barrida</tspan></text><line x1="78.62" y1="406" x2="910" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="406" x2="78.62" y2="406" stroke="#5b7280" stroke-width="1.4"/><text x