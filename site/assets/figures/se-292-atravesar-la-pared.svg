="246.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="545.048" dy="0">49,4</tspan></text><rect x="713.024" y="100.5" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="718.524" y="130" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="718.524" dy="0">100</tspan></text><rect x="886.5" y="100.5" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="130" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">100</tspan></text><rect x="10" y="466" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="490.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Cuando el desplazamiento por fotograma supera el grosor de la pared, la bala aparece a un lado y luego al otro sin estar</tspan></text><text x="470" y="507.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">nunca dentro: el choque desaparece. La prueba barrida revisa el segmento recorrido. Mide cada trayectoria de tres lados:</tspan></text><text x="470" y="524.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">pared, bala y paso del fotograma. 2 000 lanzamientos por celda.</tspan></text><text x="470" y="571.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
