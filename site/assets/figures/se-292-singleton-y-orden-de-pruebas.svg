<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 263" width="1000" height="263" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Órdenes aleatorios de 12 pruebas con al menos un fallo (5000 órdenes)</title><desc id="d">Barras: de cinco mil órdenes aleatorios de doce pruebas, ocho que leen el valor por defecto y cuatro que lo cambian, el 99,8 por ciento tiene algún fallo si la configuración es un singleton sin reinicio, y ninguno si se reinicia en cada prueba o si la configuración se inyecta.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="263" fill="#ffffff"/><text x="330" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Singleton sin reinicio</tspan></text><rect x="340" y="16" width="339.32" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="687.32" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="687.32" dy="0">99,8 % de los órdenes fallan</tspan></text><text x="330" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Singleton con reinicio por prueba</tspan></text><rect x="340" y="60" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="352" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="352" dy="0">0 %</tspan></text><text x="330" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="330" dy="0">Configuración inyectada</tspan></text><rect x="340" y="104" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="352" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="352" dy="0">0 %</tspan></text><rect x="10" y="152" width="980" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="500" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">Con lectoras primero hay 0 fallos y con escritoras primero 8: la suite pasa o falla según el orden. El reinicio por prueba arregla</tspan></text><text x="500" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">el síntoma pero exige que cada prueba conozca el singleton; la inyección quita la causa. Pruebas de ejemplo de una sola clase de</tspan></text><text x="500" y="210.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">configuración.</tspan></text><text x="500" y="249.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
