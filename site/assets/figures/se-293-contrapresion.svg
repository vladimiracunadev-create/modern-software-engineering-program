<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 702" width="1000" height="702" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Latencia de una cola entre un productor y un consumidor (20 000 eventos, capacidad 20)</title><desc id="d">Intervalos en escala logarítmica con la latencia media y el percentil 99 de seis configuraciones de una cola: con llegadas de 100 por segundo y servicio de 80, la cola sin límite llega a 24 713,8 milisegundos de media y 49 544,7 de p99; con capacidad 20 las tres políticas mantienen la media entre 167 y 221 milisegundos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="702" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Latencia de una cola entre un productor y un consumidor (20 000 eventos, capacidad 20)</tspan></text><rect x="16" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">media</tspan></text><polygon points="107.7,44.1 114.3,56.4 101.1,56.4" fill="#946512" stroke="#946512" stroke-width="2"/><text x="121.7" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="121.7" dy="0">p99</tspan></text><line x1="374" y1="77" x2="374" y2="521" stroke="#d5dde1" stroke-width="1"/><line x1="374" y1="521" x2="374" y2="526" stroke="#5b7280" stroke-width="1.4"/><text x="374" y="542" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="374" dy="0">10</tspan></text><line x1="518" y1="77" x2="518" y2="521" stroke="#d5dde1" stroke-width="1"/><line x1="518" y1="521" x2="518" y2="526" stroke="#5b7280" stroke-width="1.4"/><text x="518" y="542" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="518" dy="0">100</tspan></text><line x1="662" y1="77" x2="662" y2="521" stroke="#d5dde1" stroke-width="1"/><line x1="662" y1="521" x2="662" y2="526" stroke="#5b7280" stroke-width="1.4"/><text x="662" y="542" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">1 000</tspan></text><line x1="806" y1="77" x2="806" y2="521" stroke="#d5dde1" stroke-width="1"/><line x1="806" y1="521" x2="806" y2="526" stroke="#5b7280" stroke-width="1.4"/><text x="806" y="542" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="806" dy="0">10 000</tspan></text><line x1="950" y1="77" x2="950" y2="521" stroke="#d5dde1" stroke-width="1"/><line x1="950" y1="521" x2="950" y2="526" stroke="#5b7280" stroke-width="1.4"/><text x="950" y="542" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="950" dy="0">100 000</tspan></text><line x1="374" y1="521" x2="950" y2="521" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="118.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">Estable 70/s → 80/s, sin límite</tspan></text><text x="344" y="192.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">Estable 70/s → 80/s, bloquea al productor</tspan></text><text x="344" y="266.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">Saturada 100/s → 80/s, sin límite</tspan></text><text x="344" y="340.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">Saturada, bloquea al productor</tspan></text><text x="344" y="414.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">Saturada, descarta lo nuevo</tspan></text><text x="344" y="488.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">Saturada, descarta lo viejo</tspan></text><line x1="517.498" y1="114" x2="608.104" y2="114" stroke="#8a9aa3" stroke-width="5"/><rect x="510.498" y="107" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="517.498" y="98" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="517.498" dy="0">99,2</tspan></text><polygon points="608.104,105.95 615.804,120.3 600.404,120.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="608.104" y="143" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="608.104" dy="0">422,4</tspan></text><line x1="505.36" y1="188" x2="588.493" y2="188" stroke="#8a9aa3" stroke-width="5"/><rect x="498.36" y="181" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="505.36" y="172" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="505.36" dy="0">81,7</tspan></text><polygon points="588.493,179.95 596.193,194.3 580.793,194.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="588.493" y="217" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="588.493" dy="0">308,7</tspan></text><line x1="862.583" y1="262" x2="906.08" y2="262" stroke="#8a9aa3" stroke-width="5"/><rect x="855.583" y="255" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="862.583" y="246" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="862.583" dy="0">24 713,8</tspan></text><polygon points="906.08,253.95 913.78,268.3 898.38,268.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="906.08" y="291" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="906.08" dy="0">49 544,7</tspan></text><line x1="567.508" y1="336" x2="602.485" y2="336" stroke="#8a9aa3" stroke-width="5"/><rect x="560.508" y="329" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="567.508" y="320" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="567.508" dy="0">220,7</tspan></text><polygon points="602.485,327.95 610.185,342.3 594.785,342.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="602.485" y="365" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="602.485" dy="0">386,1</tspan></text><line x1="565.228" y1="410" x2="600.86" y2="410" stroke="#8a9aa3" stroke-width="5"/><rect x="558.228" y="403" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="565.228" y="394" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="565.228" dy="0">212,8</tspan></text><polygon points="600.86,401.95 608.56,416.3 593.16,416.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="600.86" y="439" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="600.86" dy="0">376,2</tspan></text><line x1="550.221" y1="484" x2="580.371" y2="484" stroke="#8a9aa3" stroke-width="5"/><rect x="543.221" y="477" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="550.221" y="468" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="550.221" dy="0">167,4</tspan></text><polygon points="580.371,475.95 588.071,490.3 572.671,490.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="580.371" y="513" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="580.371" dy="0">271,1</tspan></text><text x="662" y="565" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="662" dy="0">Latencia (ms) (escala logarítmica)</tspan></text><rect x="10" y="579" width="980" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="500" y="603.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">La cola sin límite no pierde nada (cola máxima de 3992 elementos) y deja todo inservible: en la saturación nadie recibe una</tspan></text><text x="500" y="620.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">respuesta a tiempo. Un límite obliga a decidir quién paga: el productor espera unos 50 s, se pierden 3991 eventos nuevos o se</tspan></text><text x="500" y="637.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">pierden 3922 viejos. Llegadas y servicios exponenciales con semilla fija; los tiempos son del modelo, no de una máquina.</tspan></text><text x="500" y="684.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
