lo viejo. Llegadas y servicios exponenciales con semilla fija; los tiempos</tspan></text><text x="525" y="394.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="525" dy="0">son del modelo, no de una máquina.</tspan></text><text x="525" y="433.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="525" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
