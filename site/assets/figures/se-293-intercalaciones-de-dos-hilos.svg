<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 434" width="1000" height="434" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Intercalaciones de dos hilos sobre un dato compartido que dan el resultado esperado</title><desc id="d">Barras apiladas al 100 por ciento con las intercalaciones que dan el resultado esperado: sin protección solo 6 de 70 dan 4 en el contador y 2 de 6 dan un solo cupo vendido; con una operación atómica todas las intercalaciones dan el resultado esperado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="434" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Intercalaciones de dos hilos sobre un dato compartido que dan el resultado esperado</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Resultado esperado</tspan></text><rect x="199.72" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="219.72" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="219.72" dy="0">Resultado erróneo</tspan></text><line x1="354" y1="77" x2="354" y2="253" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="253" x2="354" y2="258" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="274" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="499.425" y1="77" x2="499.425" y2="253" stroke="#d5dde1" stroke-width="1"/><line x1="499.425" y1="253" x2="499.425" y2="258" stroke="#5b7280" stroke-width="1.4"/><text x="499.425" y="274" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="499.425" dy="0">25</tspan></text><line x1="644.85" y1="77" x2="644.85" y2="253" stroke="#d5dde1" stroke-width="1"/><line x1="644.85" y1="253" x2="644.85" y2="258" stroke="#5b7280" stroke-width="1.4"/><text x="644.85" y="274" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="644.85" dy="0">50</tspan></text><line x1="790.275" y1="77" x2="790.275" y2="253" stroke="#d5dde1" stroke-width="1"/><line x1="790.275" y1="253" x2="790.275" y2="258" stroke="#5b7280" stroke-width="1.4"/><text x="790.275" y="274" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="790.275" dy="0">75</tspan></text><line x1="935.7" y1="77" x2="935.7" y2="253" stroke="#d5dde1" stroke-width="1"/><line x1="935.7" y1="253" x2="935.7" y2="258" stroke="#5b7280" stroke-width="1.4"/><text x="935.7" y="274" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="935.7" dy="0">100</tspan></text><line x1="354" y1="253" x2="935.7" y2="253" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="95" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Contador de 2 incrementos por hilo, sin</tspan></text><text x="344" y="112" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">protección (70)</tspan></text><text x="344" y="147.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Contador, operación atómica (6)</tspan></text><text x="344" y="191.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Último cupo, sin protección (6)</tspan></text><text x="344" y="235.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Último cupo, operación atómica (2)</tspan></text><rect x="354" y="84" width="49.86" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="378.93" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="378.93" dy="0">9 %</tspan></text><rect x="403.86" y="84" width="531.84" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="669.78" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="669.78" dy="0">91 %</tspan></text><text x="942.7" y="103.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="942.7" dy="0">100 %</tspan></text><rect x="354" y="128" width="581.7" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="644.85" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="644.85" dy="0">100 %</tspan></text><rect x="935.7" y="128" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="942.7" y="147.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="942.7" dy="0">100 %</tspan></text><rect x="354" y="172" width="193.9" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="450.95" y="191.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="450.95" dy="0">33 %</tspan></text><rect x="547.9" y="172" width="387.8" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="741.8" y="191.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="741.8" dy="0">67 %</tspan></text><text x="942.7" y="191.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="942.7" dy="0">100 %</tspan></text><rect x="354" y="216" width="581.7" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="644.85" y="235.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="644.85" dy="0">100 %</tspan></text><rect x="935.7" y="216" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="942.7" y="235.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="942.7" dy="0">100 %</tspan></text><text x="644.85" y="297" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="644.85" dy="0">% del total</tspan></text><rect x="10" y="311" width="980" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="500" y="335.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Solo 6 de 70 intercalaciones salen bien, y una prueba corrida mil veces puede no ver nunca las malas: depende del planificador. En</tspan></text><text x="500" y="352.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">el contador los errores son 3 (32 intercalaciones) o 2 (32); en el cupo, 4 de 6 lo venden dos veces. Enumerar, o diseñar para que</tspan></text><text x="500" y="369.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">un solo hilo sea dueño del dato, convierte la sospecha en conteo. Modelo de pasos atómicos, sin hilos reales.</tspan></text><text x="500" y="416.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
