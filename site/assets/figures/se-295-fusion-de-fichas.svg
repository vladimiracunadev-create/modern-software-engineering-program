"#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">439</tspan></text><polyline points="96.62,294 361.747,385.2 494.31,386.4 626.873,387 759.437,387 892,387" fill="none" stroke="#c0432f" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="91.12" y="288.5" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="96.62" y="283" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">155</tspan></text><rect x="356.247" y="379.7" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="361.747" y="374.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="361.747" dy="0">3</tspan></text><rect x="488.81" y="380.9" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="494.31" y="375.4" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="494.31" dy="0">1</tspan></text><rect x="621.373" y="381.5" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><rect x="753.937" y="381.5" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><rect x="886.5" y="381.5" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="376" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">0</tspan></text><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los dos errores no cuestan lo mismo: un duplicado sin fusionar fragmenta una historia clínica; una fusión errónea mezcla la</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de dos personas, y ese es el error que puede dañar. Por eso la zona intermedia se envía a revisión humana en lugar de</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">decidirse con un umbral único. Nombres y errores de tecleo sintéticos.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
