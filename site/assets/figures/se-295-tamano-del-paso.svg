<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 550" width="940" height="550" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">60 pasos de refactor con 3 % de probabilidad de defecto por paso: tamaño del lote</title><desc id="d">Líneas en escala logarítmica en el tamaño del lote: el porcentaje de lotes con dos o más defectos sube de 0 con un paso a 15,3 con 12 pasos y 64,6 con un lote de 60; los defectos escondidos tras otro suben de 0 a 14,5 con 12 pasos y 53,5 con 60.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="550" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">60 pasos de refactor con 3 % de probabilidad de defecto por paso: tamaño del lote</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Lotes con 2 o más defectos</tspan></text><rect x="260.04" y="45" width="12" height="12" fill="#946512" stroke="#946512" stroke-width="2"/><text x="280.04" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="280.04" dy="0">Defectos escondidos tras otro</tspan></text><line x1="71.08" y1="367" x2="910" y2="367" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="367" x2="71.08" y2="367" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="371.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="297" x2="910" y2="297" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="297" x2="71.08" y2="297" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="301.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="227" x2="910" y2="227" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="227" x2="71.08" y2="227" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="231.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">40</tspan></text><line x1="71.08" y1="157" x2="910" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="157" x2="71.08" y2="157" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="161.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">60</tspan></text><line x1="71.08" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="87" x2="71.08" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">80</tspan></text><line x1="71.08" y1="87" x2="71.08" y2="367" stroke="#5b7280" stroke-width="1.6"/><line x1="89.08" y1="87" x2="89.08" y2="367" stroke="#d5dde1" stroke-width="1"/><line x1="89.08" y1="367" x2="89.08" y2="372" stroke="#5b7280" stroke-width="1.4"/><text x="89.08" y="388" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="89.08" dy="0">1</tspan></text><line x1="304.523" y1="87" x2="304.523" y2="367" stroke="#d5dde1" stroke-width="1"/><line x1="304.523" y1="367" x2="304.523" y2="372" stroke="#5b7280" stroke-width="1.4"/><text x="304.523" y="388" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="304.523" dy="0">3</tspan></text><line x1="440.452" y1="87" x2="440.452" y2="367" stroke="#d5dde1" stroke-width="1"/><line x1="440.452" y1="367" x2="440.452" y2="372" stroke="#5b7280" stroke-width="1.4"/><text x="440.