oke-width="2"/><circle cx="892" cy="140.9" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="129.9" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">64,6</tspan></text><polyline points="89.08,367 304.523,356.5 440.452,339.7 576.382,316.25 756.071,252.2 892,179.75" fill="none" stroke="#946512" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="83.58" y="361.5" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><rect x="299.023" y="351" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><rect x="434.952" y="334.2" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><rect x="570.882" y="310.75" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><rect x="750.571" y="246.7" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><rect x="886.5" y="174.25" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="892" y="168.75" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">53,5</tspan></text><rect x="10" y="427" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Los porcentajes salen de simular 6000 repeticiones; los pasos que revisar (la mitad del lote: de 1 a 30) y las corridas de</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">pruebas (de 1 a 7, una más una bisección) son una fórmula del modelo, no un conteo. Con pasos pequeños el defecto tiene un</tspan></text><text x="470" y="485.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">solo sospechoso; con uno grande, la primera pista se oculta tras otro defecto.</tspan></text><text x="470" y="532.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
