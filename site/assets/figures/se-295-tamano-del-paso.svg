<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 447" width="960" height="447" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">60 pasos de refactor con 3 % de probabilidad de defecto por paso: tamaño del lote</title><desc id="d">Tabla: con sesenta pasos y tres por ciento de probabilidad de introducir un defecto en cada uno, al comprobar después de cada paso nunca hay dos defectos mezclados; con lotes de 12 pasos el 15,3 por ciento de los lotes defectuosos tiene dos o más y hay que revisar seis pasos de media; con un solo lote de 60, el 64,6 por ciento tiene dos o más.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="447" fill="#ffffff"/><rect x="10" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="82" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="82" dy="0">Pasos por lote</tspan></text><rect x="160" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="267" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="267" dy="0">Lotes con 2 o más defectos</tspan></text><rect x="380" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="462" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="462" dy="0">Pasos que revisar</tspan></text><rect x="550" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="632" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="632" dy="0">Corridas de pruebas</tspan></text><rect x="720" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="832" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="832" dy="0">Defectos escondidos tras</tspan></text><text x="832" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="832" dy="0">otro</tspan></text><rect x="10" y="56" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="79.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">1</tspan></text><rect x="160" y="56" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="79.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="267" dy="0">0,0 %</tspan></text><rect x="380" y="56" width="164" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="79.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">1,0</tspan></text><rect x="550" y="56" width="164" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="79.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">1,0</tspan></text><rect x="720" y="56" width="224" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="79.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">0,0 %</tspan></text><rect x="10" y="102" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="125.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">3</tspan></text><rect x="160" y="102" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="125.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="267" dy="0">3,0 %</tspan></text><rect x="380" y="102" width="164" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="125.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">1,5</tspan></text><rect x="550" y="102" width="164" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="125.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">3,0</tspan></text><rect x="720" y="102" width="224" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="125.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">3,0 %</tspan></text><rect x="10" y="148" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="171.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">6</tspan></text><rect x="160" y="148" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="171.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="267" dy="0">8,1 %</tspan></text><rect x="380" y="148" width="164" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="171.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">3,0</tspan></text><rect x="550" y="148" width="164" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="171.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">4,0</tspan></text><rect x="720" y="148" width="224" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="171.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">7,8 %</tspan></text><rect x="10" y="194" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="217.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">12</tspan></text><rect x="160" y="194" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="217.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="267" dy="0">15,3 %</tspan></text><rect x="380" y="194" width="164" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="217.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">6,0</tspan></text><rect x="550" y="194" width="164" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="217.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">5,0</tspan></text><rect x="720" y="194" width="224" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="217.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">14,5 %</tspan></text><rect x="10" y="240" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="263.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">30</tspan></text><rect x="160" y="240" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="263.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="267" dy="0">36,5 %</tspan></text><rect x="380" y="240" width="164" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="263.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">15,0</tspan></text><rect x="550" y="240" width="164" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="263.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">6,0</tspan></text><rect x="720" y="240" width="224" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="263.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">32,8 %</tspan></text><rect x="10" y="286" width="144" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="309.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">60</tspan></text><rect x="160" y="286" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="309.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="267" dy="0">64,6 %</tspan></text><rect x="380" y="286" width="164" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="309.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">30,0</tspan></text><rect x="550" y="286" width="164" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="309.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">7,0</tspan></text><rect x="720" y="286" width="224" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="309.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">53,5 %</tspan></text><rect x="10" y="336" width="940" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="480" y="360.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">Los porcentajes salen de simular 6000 repeticiones; los pasos que revisar (la mitad del lote) y las corridas (una más una</tspan></text><text x="480" y="377.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">bisección) son una fórmula del modelo, no un conteo. Con pasos pequeños el defecto tiene un solo sospechoso; con uno grande,</tspan></text><text x="480" y="394.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">la primera pista se oculta tras otro defecto.</tspan></text><text x="480" y="433.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
