<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 307" width="1000" height="307" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Secuencias reconstruidas sin identificador de solicitud (con identificador: 100 %)</title><desc id="d">Barras: al reconstruir sin identificador de solicitud la secuencia de eventos de cada petición a partir de registros de cuatro workers, se acierta el 92,2 por ciento con 2 solicitudes por segundo y por worker, el 78 con 6, el 61,6 con 12 y el 40,9 con 25; con un identificador de solicitud se acierta el 100 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="307" fill="#ffffff"/><text x="410" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="410" dy="0">2 solicitudes/s por worker (concurrencia ~0,15)</tspan></text><rect x="420" y="16" width="599.3" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="1027.3" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="1027.3" dy="0">92,2 %</tspan></text><text x="410" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="410" dy="0">6 solicitudes/s (~0,45)</tspan></text><rect x="420" y="60" width="507" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="935" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="935" dy="0">78,0 %</tspan></text><text x="410" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="410" dy="0">12 solicitudes/s (~0,90)</tspan></text><rect x="420" y="104" width="400.4" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="828.4" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="828.4" dy="0">61,6 %</tspan></text><text x="410" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="410" dy="0">25 solicitudes/s (~1,88)</tspan></text><rect x="420" y="148" width="265.85" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="693.85" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="693.85" dy="0">40,9 %</tspan></text><rect x="10" y="196" width="980" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="500" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">Sin identificador, el orden y el worker no bastan en cuanto hay solicitudes simultáneas: la reconstrucción las mezcla. El</tspan></text><text x="500" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">identificador cuesta una línea por registro y evita la heurística. 1200 solicitudes con cinco pasos de duración lognormal; la regla</tspan></text><text x="500" y="254.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">de reconstrucción es una construcción del autor.</tspan></text><text x="500" y="293.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
