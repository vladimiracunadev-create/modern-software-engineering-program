<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Retirada con reentrada: fondos extraídos por un atacante con 10 de saldo en un fondo de 110</title><desc id="d">Líneas con los fondos extraídos por un atacante con 10 de saldo según la profundidad de reentrada: si el contrato actualiza el saldo después de enviar el pago extrae 10, 30, 50 y 110 con profundidad 1, 3, 5 y 11, hasta vaciar el fondo de 110; si actualiza antes de enviar extrae siempre 10.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Retirada con reentrada: fondos extraídos por un atacante con 10 de saldo en un fondo de 110</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Actualiza después de enviar</tspan></text><rect x="267.58" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="287.58" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="287.58" dy="0">Actualiza antes de enviar</tspan></text><line x1="78.62" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="387" x2="78.62" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0"