span x="494.31" dy="0">Profundidad de reentrada</tspan></text><line x1="78.62" y1="112" x2="910" y2="112" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="84.62" y="106" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="84.62" dy="0">fondo total: 110</tspan></text><polyline points="96.62,362 255.696,312 414.772,262 892,112" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="96.62" cy="362" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="96.62" y="351" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">10</tspan></text><circle cx="255.696" cy="312" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="255.696" y="301" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="255.696" dy="0">30</tspan></text><circle cx="414.772" cy="262" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="414.772" y="251" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="414.772" dy="0">50</tspan></text><circle cx="892" cy="112" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="136" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">110</tspan></text><polyline points="96.62,362 255.696,362 414.772,362 892,362" fill="none" stroke="#087f8c" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="91.12" y="356.5" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><rect x="250.196" y="356.5" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="255.696" y="351" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="255.696" dy="0">10</tspan></text><rect x="409.272" y="356.5" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="414.772" y="351" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="414.772" dy="0">10</tspan></text><rect x="886.5" y="356.5" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="351" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">10</tspan></text><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El defecto no está en la aritmética sino en el orden: llamar a código ajeno antes de actualizar el estado permite que ese</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">código vuelva a entrar con el estado viejo. Comprobar, actualizar y luego interactuar elimina esta clase de ataque; no</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">elimina otras. Modelo de juguete en Python, no un contrato real ni una red.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
