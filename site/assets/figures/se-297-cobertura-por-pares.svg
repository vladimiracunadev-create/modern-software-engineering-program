idth="1.6"/><text x="692" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">46,1 %</tspan></text><rect x="790" y="206" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="902" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="902" dy="0">91,7 %</tspan></text><rect x="10" y="256" width="94" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="57" y="281.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="57" dy="0">12</tspan></text><rect x="110" y="256" width="94" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="281.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="157" dy="0">4096</tspan></text><rect x="210" y="256" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="317" y="281.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="317" dy="0">9</tspan></text><rect x="430" y="256" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="281.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">81,5 %</tspan></text><rect x="600" y="256" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="281.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">50,3 %</tspan></text><rect x="790" y="256" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="902" y="281.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="902" dy="0">95,8 %</tspan></text><rect x="10" y="310" width="1010" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="515" y="334.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="515" dy="0">Si los fallos de interacción suelen implicar pocas opciones, los pares atrapan casi todos con una fracción de las pruebas; si requieren</tspan></text><text x="515" y="351.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="515" dy="0">tres o cuatro, la mitad queda sin ver. El conjunto se construyó con un algoritmo voraz de semilla fija. Pares al azar del mismo tamaño</tspan></text><text x="515" y="368.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="515" dy="0">cubren menos.</tspan></text><text x="515" y="407.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="515" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
