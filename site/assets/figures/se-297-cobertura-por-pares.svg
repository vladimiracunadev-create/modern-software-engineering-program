<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 421" width="1030" height="421" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Configuraciones de opciones binarias: todas frente a un conjunto que cubre todos los pares</title><desc id="d">Tabla: para 12 opciones binarias hay 4096 configuraciones; nueve configuraciones bien elegidas cubren todos los pares, el 81,5 por ciento de los tríos y el 50,3 por ciento de los cuartetos; con 10 opciones bastan 8 configuraciones para cubrir todos los pares frente a 1024.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1030" height="421" fill="#ffffff"/><rect x="10" y="12" width="94" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="57" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="57" dy="0">Opciones</tspan></text><rect x="110" y="12" width="94" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="157" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="157" dy="0">Todas</tspan></text><rect x="210" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="317" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="317" dy="0">Cubren todos los pares</tspan></text><rect x="430" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="512" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="512" dy="0">Tríos cubiertos</tspan></text><rect x