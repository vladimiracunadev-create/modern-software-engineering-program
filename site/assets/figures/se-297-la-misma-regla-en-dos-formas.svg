<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 421" width="910" height="421" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La misma regla de tarifa en una tabla con tres reglas y en condicionales anidados</title><desc id="d">Tabla: la misma regla de tarifa, con cuatro zonas, tres bandas de peso y tres opciones, ocupa 13 líneas con complejidad 4 en forma de tabla más tres reglas y 51 líneas con complejidad 19 en condicionales anidados; ambas coinciden en las 224 entradas de la rejilla y la regla tiene 96 combinaciones esenciales.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="910" height="421" fill="#ffffff"/><rect x="10" y="12" width="434" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="227" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="227" dy="0">Medida</tspan></text><rect x="450" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="557" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="557" dy="0">Tabla + 3 reglas</tspan></text><rect x="670" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="782" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="782" dy="0">Condicionales anidados</tspan></text><rect x="10" y="56" width="434" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">Líneas</tspan></text><rect x="450" y="56" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">13</tspan></text><rect x="670" y="56" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">51</tspan></text><rect x="10" y="106" width="434" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">Complejidad ciclomática</tspan></text><rect x="450" y="106" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">4</tspan></text><rect x="670" y="106" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">19</tspan></text><rect x="10" y="156" width="434" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">Anidamiento máximo</tspan></text><rect x="450" y="156" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">1</tspan></text><rect x="670" y="156" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">3</tspan></text><rect x="10" y="206" width="434" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">Caminos distintos recorridos por la rejilla</tspan></text><rect x="450" y="206" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">8</tspan></text><rect x="670" y="206" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">96</tspan></text><rect x="10" y="256" width="434" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">Combinaciones esenciales de la regla</tspan></text><rect x="450" y="256" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">96</tspan></text><rect x="670" y="256" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">96</tspan></text><rect x="10" y="310" width="890" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="455" y="334.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="455" dy="0">La regla tiene 96 combinaciones en cualquier forma: eso es complejidad esencial. La forma anidada reparte la misma</tspan></text><text x="455" y="351.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="455" dy="0">regla en 96 caminos de código y multiplica por cinco la complejidad ciclomática: lo que sobra es accidental. Coinciden</tspan></text><text x="455" y="368.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="455" dy="0">en 224 entradas; no se probó equivalencia completa.</tspan></text><text x="455" y="407.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="455" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
