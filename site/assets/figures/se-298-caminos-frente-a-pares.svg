oke"><tspan x="892" dy="0">100</tspan></text><polyline points="405.934,183.333" fill="none" stroke="#102a43" stroke-width="2.4"/><polygon points="405.934,177.008 411.984,188.283 399.884,188.283" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="405.934" y="172.333" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="405.934" dy="0">100</tspan></text><rect x="10" y="510" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="534.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Probar todos los caminos exige 1 024 ejecuciones y duplica con cada bifurcación; cubrir todos los pares exige 9. El cálculo</tspan></text><text x="470" y="551.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">supone que los defectos dependen como máximo de dos decisiones: uno que dependa de tres se escapa de los pares. 180</tspan></text><text x="470" y="568.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">defectos posibles, 300 conjuntos aleatorios por fila.</tspan></text><text x="470" y="615.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
