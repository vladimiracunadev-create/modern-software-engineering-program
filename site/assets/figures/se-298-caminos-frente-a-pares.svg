<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 633" width="940" height="633" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un flujo con 10 bifurcaciones (1 024 caminos): defectos de dos bifurcaciones que halla cada conjunto de pruebas</title><desc id="d">Líneas con el porcentaje de defectos de dos bifurcaciones hallados y de conjuntos que ven cada rama en ambos valores según el número de pruebas aleatorias: 2 pruebas hallan 43,9 por ciento, 8 el 90,4 y 20 el 99,7; un conjunto de 9 pruebas diseñado por pares halla el 100 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="633" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un flujo con 10 bifurcaciones (1 024 caminos): defectos de dos bifurcaciones que halla cada conjunto de</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">pruebas</tspan></text><circle cx="22" cy="70" r="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Defectos de dos bifurcaciones hallados</tspan></text><rect x="350.52" y="64" width="12" height="12" fill="#946512" stroke="#946512" stroke-width="2"/><text x="370.52" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="370.52" dy="0">Conjuntos que ven cada rama en ambos valores</tspan></text><polygon points="22,87.1 28.6,99.4 15.4,99.4" fill="#102a43" stroke="#102a43" stroke-width="