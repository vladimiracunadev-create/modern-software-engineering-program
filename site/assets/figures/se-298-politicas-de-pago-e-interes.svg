<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 371" width="950" height="371" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Puntos entregados en 24 sprints / deuda final según la política y el interés (parámetros supuestos)</title><desc id="d">Tabla: en 24 sprints con capacidad 40 puntos, no pagar nunca entrega 703 puntos con un interés de 0,002 por unidad de deuda y 173 con 0,020; pagar todo hasta bajar de 10 unidades entrega 716 y 609; con interés bajo todas las políticas entregan casi lo mismo y con interés alto la diferencia es de un factor 3,5.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="371" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Política</tspan></text><rect x="340" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="412" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="412" dy="0">Interés 0,002</tspan></text><rect x="490" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="562" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="562" dy="0">0,006</tspan></text><rect x="640" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="712" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="712" dy="0">0,012</tspan></text><rect x="790" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="862" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="862" dy="0">0,020</tspan></text><rect x="10" y="56" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Nunca pagar</tspan></text><rect x="340" y="56" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="412" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412" dy="0">703 / 246</tspan></text><rect x="490" y="56" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">408 / 146</tspan></text><rect x="640" y="56" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="712" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="712" dy="0">241 / 91</tspan></text><rect x="790" y="56" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">173 / 68</tspan></text><rect x="10" y="106" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">20 % de la capacidad</tspan></text><rect x="340" y="106" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="412" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412" dy="0">717 / 59</tspan></text><rect x="490" y="106" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">654 / 38</tspan></text><rect x="640" y="106" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="712" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="712" dy="0">609 / 23</tspan></text><rect x="790" y="106" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">585 / 15</tspan></text><rect x="10" y="156" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">50 % cuando la deuda pasa de 25</tspan></text><rect x="340" y="156" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="412" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412" dy="0">706 / 33</tspan></text><rect x="490" y="156" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">663 / 38</tspan></text><rect x="640" y="156" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="712" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="712" dy="0">600 / 35</tspan></text><rect x="790" y="156" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">505 / 23</tspan></text><rect x="10" y="206" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Todo hasta bajar de 10</tspan></text><rect x="340" y="206" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="412" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412" dy="0">716 / 23</tspan></text><rect x="490" y="206" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">693 / 22</tspan></text><rect x="640" y="206" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="712" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="712" dy="0">651 / 8</tspan></text><rect x="790" y="206" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">609 / 7</tspan></text><rect x="10" y="260" width="930" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="475" y="284.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Con interés bajo, pagar no mejora lo entregado (703 frente a 717 puntos): la deuda barata se puede dejar. Con interés alto,</tspan></text><text x="475" y="301.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">no pagar entrega menos de un tercio. La política correcta depende de la tasa, que hay que estimar. Capacidad, generación de</tspan></text><text x="475" y="318.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">deuda e interés son supuestos del autor; no se midió ningún equipo.</tspan></text><text x="475" y="357.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
