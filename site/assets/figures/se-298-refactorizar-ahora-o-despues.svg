<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 447" width="970" height="447" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Costo esperado en 12 meses (puntos): refactorizar ahora, al primer cambio o nunca</title><desc id="d">Tabla: con un refactor de 8 puntos y una fricción de 3 puntos por cambio sin refactor, si el área cambia 0,15 veces al mes lo más barato es no refactorizar, con 0,30 es refactorizar al primer cambio y con 1 o más es refactorizar ahora; si aplazar duplica el costo del refactor, desde 0,30 conviene hacerlo ahora.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="447" fill="#ffffff"/><rect x="10" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="77" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="77" dy="0">Cambios por mes</tspan></text><rect x="150" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="207" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="207" dy="0">Nunca</tspan></text><rect x="270" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="327" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="327" dy="0">Ahora</tspan></text><rect x="390" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="482" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="482" dy="0">Al primer cambio</