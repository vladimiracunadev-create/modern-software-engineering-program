ill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="217.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">al primer cambio</tspan></text><rect x="770" y="194" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="217.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">ahora</tspan></text><rect x="10" y="240" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="77" y="263.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="77" dy="0">1,00</tspan></text><rect x="150" y="240" width="114" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="263.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="207" dy="0">36,04</tspan></text><rect x="270" y="240" width="114" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="263.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="327" dy="0">8,00</tspan></text><rect x="390" y="240" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="263.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">8,00</tspan></text><rect x="580" y="240" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="263.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">ahora</tspan></text><rect x="770" y="240" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="263.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">ahora</tspan></text><rect x="10" y="286" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="77" y="309.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="77" dy="0">2,00</tspan></text><rect x="150" y="286" width="114" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="309.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="207" dy="0">72,22</tspan></text><rect x="270" y="286" width="114" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="309.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="327" dy="0">8,00</tspan></text><rect x="390" y="286" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="309.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">8,00</tspan></text><rect x="580" y="286" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="309.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">ahora</tspan></text><rect x="770" y="286" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="309.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">ahora</tspan></text><rect x="10" y="336" width="950" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="485" y="360.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="485" dy="0">Esperar al primer cambio es una opción: se paga solo si el área se mueve. Deja de convenir cuando aplazar encarece el trabajo</tspan></text><text x="485" y="377.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="485" dy="0">(se pierde el contexto) o cuando el área cambia tanto que el pago es seguro. Un área que nunca cambia no merece refactor,</tspan></text><text x="485" y="394.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="485" dy="0">aunque se vea fea. Poisson aproximado, 20 000 repeticiones y parámetros supuestos.</tspan></text><text x="485" y="433.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
