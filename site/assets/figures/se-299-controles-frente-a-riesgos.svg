dth="2"/><text x="328.486" y="176" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="328.486" dy="0">10 de 14 · peor: juegos 33 %</tspan></text><circle cx="433.189" cy="134" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="443.189" y="138.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="443.189" dy="0">12 de 14 · peor: audio/XR 50 %</tspan></text><circle cx="662.594" cy="96.5" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="672.594" y="101" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="672.594" dy="0">14 de 14 · todos cubiertos</tspan></text><rect x="10" y="419" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="443.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Una lista universal corta cubre mucho en promedio y deja a algún dominio casi sin protección. Los riesgos más repetidos</tspan></text><text x="470" y="460.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">(privacidad, duplicados, pérdida de datos) aparecen en cuatro dominios cada uno; los demás son propios de uno. La matriz de</tspan></text><text x="470" y="477.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">controles y riesgos es una construcción del autor.</tspan></text><text x="470" y="524.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
