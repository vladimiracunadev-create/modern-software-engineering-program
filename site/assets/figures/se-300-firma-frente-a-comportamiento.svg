"#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="564.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Cinco de diez cambios con efecto real no cambian la firma: el verificador por firma es necesario y no suficiente. Los</tspan></text><text x="470" y="581.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">consumidores son ocho funciones sintéticas con estilos de llamada distintos; su cobertura es del autor y una compatibilidad</tspan></text><text x="470" y="598.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">semántica real exige consumidores reales.</tspan></text><text x="470" y="637.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
