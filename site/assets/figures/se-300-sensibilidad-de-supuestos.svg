<tspan x="776.04" dy="0">12 600</tspan></text><line x1="508.08" y1="336" x2="757.56" y2="336" stroke="#8a9aa3" stroke-width="5"/><rect x="501.08" y="329" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="508.08" y="320" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="508.08" dy="0">−4 800</tspan></text><polygon points="757.56,327.95 765.26,342.3 749.86,342.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="757.56" y="365" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="757.56" dy="0">11 400</tspan></text><line x1="480.36" y1="410" x2="702.12" y2="410" stroke="#8a9aa3" stroke-width="5"/><rect x="473.36" y="403" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="480.36" y="394" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="480.36" dy="0">−6 600</tspan></text><polygon points="702.12,401.95 709.82,416.3 694.42,416.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="702.12" y="439" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="702.12" dy="0">7 800</tspan></text><line x1="498.84" y1="484" x2="637.44" y2="484" stroke="#8a9aa3" stroke-width="5"/><rect x="491.84" y="477" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="498.84" y="468" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="498.84" dy="0">−5 400</tspan></text><polygon points="637.44,475.95 645.14,490.3 629.74,490.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="637.44" y="513" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="637.44" dy="0">3 600</tspan></text><line x1="582" y1="77" x2="582" y2="521" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="587" y="90" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="587" dy="0">empate</tspan></text><text x="582" y="565" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="582" dy="0">Diferencia de coste construir − comprar (unidades de coste)</tspan></text><rect x="10" y="579" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="603.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los nueve supuestos cambian el signo de la diferencia dentro de su rango: la decisión no se sostiene en el punto base. En</tspan></text><text x="470" y="620.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">20 000 sorteos construir sale más barato el 36 % de las veces. El modelo y los rangos son un ejemplo del autor, no cifras</tspan></text><text x="470" y="637.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de un proveedor ni de un equipo real.</tspan></text><text x="470" y="684.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
