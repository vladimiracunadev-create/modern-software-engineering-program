<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 702" width="940" height="702" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Construir o comprar: cuánto mueve la diferencia de coste cada supuesto (base: construir cuesta 600 más)</title><desc id="d">Intervalos horizontales con la diferencia de coste entre construir y comprar al variar cada supuesto por separado: la licencia anual la mueve de −17 400 a 9 600, la tarifa horaria de −7 000 a 12 000, las horas de construcción de −5 400 a 12 600, el mantenimiento de −4 800 a 11 400, el incidente propio de −6 600 a 7 800 y la integración de −5 400 a 3 600; todos cruzan el cero.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="702" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Construir o comprar: cuánto mueve la diferencia de coste cada supuesto (base: construir cuesta 600 más)</tspan></text><rect x="16" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">mínimo</tspan></text><polygon points="115.24,44.1 121.84,56.4 108.64,56.4" fill="#946512" stroke="#946512" stroke-width="2"/><text x="129.24" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="129.24" dy="0">máximo</tspan></text><line x1="274" y1="77" x2="274" y2="521" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="521" x2="274" y2="526" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="542" font-siz