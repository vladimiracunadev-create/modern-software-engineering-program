<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 401" width="910" height="401" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Retirar la versión antigua: clientes migrados y clientes rotos (500 clientes, parámetros supuestos)</title><desc id="d">Tabla: si 500 clientes sintéticos migran con una mediana de 6 semanas, el 10 por ciento nunca migra y el 15 por ciento solo reacciona cuando se rompe, retirar la versión antigua a la semana 12 rompe a 212 y a la semana 104 todavía a 129; esperar no lleva a cero.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="910" height="401" fill="#ffffff"/><rect x="10" y="12" width="304" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="162" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="162" dy="0">Semana de retirada</tspan></text><rect x="320" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="452" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="452" dy="0">Ya migraron</tspan></text><rect x="590" y="12" width="304" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="742" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="742" dy="0">Se rompen al retirar</tspan></text><rect x="10" y="56" width="304" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">8</tspan></text><rect x="320" y="56" width="264" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">46,2 %</tspan></text><rect x="590" y="56" width="304" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">269 (53,8 %)</tspan></text><rect x="10" y="102" width="304" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="125.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">12</tspan></text><rect x="320" y="102" width="264" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">57,6 %</tspan></text><rect x="590" y="102" width="304" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">212 (42,4 %)</tspan></text><rect x="10" y="148" width="304" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="171.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">26</tspan></text><rect x="320" y="148" width="264" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">68,4 %</tspan></text><rect x="590" y="148" width="304" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">158 (31,6 %)</tspan></text><rect x="10" y="194" width="304" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="217.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">52</tspan></text><rect x="320" y="194" width="264" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">72,6 %</tspan></text><rect x="590" y="194" width="304" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">137 (27,4 %)</tspan></text><rect x="10" y="240" width="304" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="263.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">104</tspan></text><rect x="320" y="240" width="264" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">74,2 %</tspan></text><rect x="590" y="240" width="304" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">129 (25,8 %)</tspan></text><rect x="10" y="290" width="890" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="455" y="314.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455" dy="0">El 75 % de los diligentes migra en 11,3 semanas, el 95 % en 36,3 y el 99 % en 72,4, pero el 25,6 % de los clientes</tspan></text><text x="455" y="331.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455" dy="0">(abandonados y reactivos) nunca migrará solo. Una ventana larga cuesta mantenimiento en paralelo y no elimina el</tspan></text><text x="455" y="348.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455" dy="0">riesgo; la fecha de retirada es una decisión de producto con aviso. Todos los porcentajes son supuestos.</tspan></text><text x="455" y="387.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="455" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
