<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 530" width="940" height="530" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Métodos y grupos desconectados (LCOM4) de una clase de envíos y de su separación</title><desc id="d">Barras agrupadas con el número de métodos y el LCOM4 de cuatro clases: la clase mezclada de envíos tiene 7 métodos y LCOM4 igual a 3; al separarla, precio tiene 3 métodos, aviso 2 y bitácora 2, y cada una tiene LCOM4 igual a 1.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="530" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Métodos y grupos desconectados (LCOM4) de una clase de envíos y de su separación</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Métodos</tspan></text><rect x="116.78" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="136.78" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="136.78" dy="0">LCOM4 (grupos de métodos que no se tocan)</tspan></text><line x1="63.54" y1="355" x2="920" y2="355" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="355" x2="63.54" y2="355" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="359.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">0</tspan></text><line x1="63.54" y1="290" x2="920" y2="290" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="290" x2="63.54" y2="290" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="294.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">2</tspan></text><line x1="63.54" y1="225" x2="920" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="225" x2="63.54" y2="225" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="229.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">4</tspan></text><line x1="63.54" y1="160" x2="920" y2="160" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="160" x2="63.54" y2="160" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="164.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">6</tspan></text><line x1="63.54" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="95" x2="63.54" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">8</tspan></text><line x1="63.54" y1="95" x2="63.54" y2="355" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="225" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 225)">Cantidad</text><rect x="84.9515" y="127.5" width="83.646" height="227.5" rx="3" fill="#6b7c86"/><text x="126.774" y="121.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="126.774" dy="0">7</tspan></text><rect x="172.597" y="257.5" width="83.646" height="97.5" rx="3" fill="#c0432f"/><text x="214.421" y="251.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="214.421" dy="0">3</tspan></text><text x="170.597" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="170.597" dy="0">Envío (clase mezclada)</tspan></text><rect x="299.067" y="257.5" width="83.646" height="97.5" rx="3" fill="#6b7c86"/><text x="340.889" y="251.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="340.889" dy="0">3</tspan></text><rect x="386.713" y="322.5" width="83.646" height="32.5" rx="3" fill="#c0432f"/><text x="428.536" y="316.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="428.536" dy="0">1</tspan></text><text x="384.713" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="384.713" dy="0">Precio</tspan></text><rect x="513.182" y="290" width="83.646" height="65" rx="3" fill="#6b7c86"/><text x="555.005" y="284" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="555.005" dy="0">2</tspan></text><rect x="600.828" y="322.5" width="83.646" height="32.5" rx="3" fill="#c0432f"/><text x="642.651" y="316.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="642.651" dy="0">1</tspan></text><text x="598.828" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="598.828" dy="0">Aviso</tspan></text><rect x="727.296" y="290" width="83.646" height="65" rx="3" fill="#6b7c86"/><text x="769.119" y="284" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="769.119" dy="0">2</tspan></text><rect x="814.942" y="322.5" width="83.646" height="32.5" rx="3" fill="#c0432f"/><text x="856.765" y="316.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="856.765" dy="0">1</tspan></text><text x="812.942" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812.942" dy="0">Bitácora</tspan></text><rect x="10" y="407" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="431.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">LCOM4 cuenta los grupos de métodos conectados por atributos compartidos o llamadas entre sí; 3 significa tres clases en</tspan></text><text x="470" y="448.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">una. Con clases aleatorias de seis métodos, si cada uno usa un solo atributo de seis, ninguna clase queda en 1; con dos</tspan></text><text x="470" y="465.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">atributos por método, el 88,7 %; con tres, el 100 %: la métrica mide densidad de uso, no calidad del diseño.</tspan></text><text x="470" y="512.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
