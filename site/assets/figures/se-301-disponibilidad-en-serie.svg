<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Minutos de caída al mes de una cadena de componentes con 99,9 % cada uno (escala logarítmica)</title><desc id="d">Líneas en escala logarítmica con los minutos de caída al mes según el número de componentes en serie: sin réplica sube de 43,2 con uno a 344,4 con ocho; con dos réplicas independientes la cuenta teórica es de 0,04 a 0,35 minutos; con 30 por ciento de causa común la simulación da 36,5 minutos con tres componentes y 65,3 con cinco, una mejora de 3,5 veces sobre no replicar, no de las mil de la cuenta independiente.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Minutos de caída al mes de una cadena de componentes con 99,9 % cada uno (escala logarítmica)</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Sin réplica</tspan></text><rect x="146.94" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="166.94" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="166.94" dy="0">2 réplicas, caídas independientes</tspan></text><polygon points="449.76,44.1 456.36,56.4 443.16,56.4" fill="#946512" stroke="#946512" stroke-width="2"/><text x="463.76" y="56" font-size="13" text-anchor=