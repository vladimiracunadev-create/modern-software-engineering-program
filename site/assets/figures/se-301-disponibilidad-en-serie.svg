<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 427" width="1020" height="427" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Minutos de caída al mes de una cadena de componentes con 99,9 % cada uno</title><desc id="d">Tabla: una cadena en serie de tres componentes con disponibilidad de 99,9 por ciento cada uno da 99,7 por ciento y 129,5 minutos de caída al mes; con dos réplicas independientes la cuenta teórica baja a 0,13 minutos, pero si el 30 por ciento de las caídas es de causa común la simulación da 36,5 minutos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1020" height="427" fill="#ffffff"/><rect x="10" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="82" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="82" dy="0">Componentes en</tspan></text><text x="82" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="82" dy="0">serie</tspan></text><rect x="160" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="232" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="232" dy="0">Disponibilidad</tspan></text><rect x="310" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="402" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="402" dy="0">Min/mes sin réplica</tspan></text><rect x="500" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="622" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="622" dy="0">Min/mes, 2 réplicas</tspan></text><text x="622" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="622" dy="0">independientes</tspan></text><rect x="750" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="877" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="877" dy="0">Min/mes, 2 réplicas y 30 % de</tspan></text><text x="877" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="877" dy="0">causa común</tspan></text><rect x="10" y="56" width="144" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="88.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">1</tspan></text><rect x="160" y="56" width="144" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="232" dy="0">99,900 %</tspan></text><rect x="310" y="56" width="184" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">43,2</tspan></text><rect x="500" y="56" width="244" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">0,04</tspan></text><rect x="750" y="56" width="254" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="877" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="877" dy="0">—</tspan></text><rect x="10" y="120" width="144" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="152.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">3</tspan></text><rect x="160" y="120" width="144" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="232" dy="0">99,700 %</tspan></text><rect x="310" y="120" width="184" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">129,5</tspan></text><rect x="500" y="120" width="244" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">0,13</tspan></text><rect x="750" y="120" width="254" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="877" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="877" dy="0">36,5</tspan></text><rect x="10" y="184" width="144" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="216.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">5</tspan></text><rect x="160" y="184" width="144" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="232" dy="0">99,501 %</tspan></text><rect x="310" y="184" width="184" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">215,6</tspan></text><rect x="500" y="184" width="244" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">0,22</tspan></text><rect x="750" y="184" width="254" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="877" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="877" dy="0">65,3</tspan></text><rect x="10" y="248" width="144" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="280.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">8</tspan></text><rect x="160" y="248" width="144" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="280.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="232" dy="0">99,203 %</tspan></text><rect x="310" y="248" width="184" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="280.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">344,4</tspan></text><rect x="500" y="248" width="244" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="280.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">0,35</tspan></text><rect x="750" y="248" width="254" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="877" y="280.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="877" dy="0">—</tspan></text><rect x="10" y="316" width="1000" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="510" y="340.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="510" dy="0">Duplicar cada componente reduce la caída unas 1000 veces solo si las caídas son independientes. Con un 30 % de causa común</tspan></text><text x="510" y="357.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="510" dy="0">(despliegue, configuración, dependencia compartida) la mejora real es 3,5 veces, no 1000. La causa común es un supuesto del autor; el</tspan></text><text x="510" y="374.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="510" dy="0">mecanismo es el que importa.</tspan></text><text x="510" y="413.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="510" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
