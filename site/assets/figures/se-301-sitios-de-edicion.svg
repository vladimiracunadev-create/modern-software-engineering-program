<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 450" width="940" height="450" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Sitios que hay que editar en 30 clientes al cambiar la representación del peso</title><desc id="d">Barras agrupadas con los sitios que hay que editar en treinta clientes: renombrar el campo obliga a editar 30 sitios si los clientes leen peso_kg y ninguno con getter o comportamiento; cambiar kilos a gramos obliga a editar 51 sitios con campo o getter y ninguno si los clientes piden comportamiento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="450" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Sitios que hay que editar en 30 clientes al cambiar la representación del peso</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Renombrar el campo</tspan></text><rect x="199.72" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="219.72" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="219.72" dy="0">Cambiar kg a g</tspan></text><line x1="284" y1="77" x2="284" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="284" y1="269" x2="284" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="284" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="284" dy="0">0</tspan></text><line x1="489.293" y1="77" x2="489.293" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="489.293" y1="269" x2="489.293" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="489.293" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="489.293" dy="0">20</tspan></text><line x1="694.587" y1="77" x2="694.587" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="694.587" y1="269" x2="694.587" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="694.587" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="694.587" dy="0">40</tspan></text><line x1="899.88" y1="77" x2="899.88" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="899.88" y1="269" x2="899.88" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="899.88" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="899.88" dy="0">60</tspan></text><line x1="284" y1="269" x2="899.88" y2="269" stroke="#5b7280" stroke-width="1.6"/><text x="274" y="113.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Los clientes leen el campo peso_kg</tspan></text><text x="274" y="169" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Los clientes llaman a un getter</tspan></text><text x="274" y="186" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">peso()</tspan></text><text x="274" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Los clientes piden comportamiento</tspan></text><rect x="284" y="83" width="307.94" height="24.5" rx="3" fill="#946512"/><text x="598.94" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="598.94" dy="0">30</tspan></text><rect x="284" y="110.5" width="523.498" height="24.5" rx="3" fill="#c0432f"/><text x="814.498" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="814.498" dy="0">51</tspan></text><rect x="284" y="147" width="2" height="24.5" rx="3" fill="#946512"/><text x="293" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="293" dy="0">0</tspan></text><rect x="284" y="174.5" width="523.498" height="24.5" rx="3" fill="#c0432f"/><text x="814.498" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="814.498" dy="0">51</tspan></text><rect x="284" y="211" width="2" height="24.5" rx="3" fill="#946512"/><text x="293" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="293" dy="0">0</tspan></text><rect x="284" y="238.5" width="2" height="24.5" rx="3" fill="#c0432f"/><text x="293" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="293" dy="0">0</tspan></text><text x="591.94" y="313" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="591.94" dy="0">Sitios que editar</tspan></text><rect x="10" y="327" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="351.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Un getter oculta el nombre pero no el significado: los clientes siguen multiplicando kilos. Solo encapsular la decisión</tspan></text><text x="470" y="368.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">(qué es el peso y cuánto cuesta) deja la unidad dentro. Los 30 clientes salen de cuatro plantillas elegidas con semilla</tspan></text><text x="470" y="385.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">fija; es una construcción del autor, no un proyecto real.</tspan></text><text x="470" y="432.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
