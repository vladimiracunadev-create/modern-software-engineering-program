" font-weight="400" fill="#142231"><tspan x="672" dy="0">122,2</tspan></text><rect x="760" y="194" width="224" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">7,7 %</tspan></text><rect x="10" y="244" width="980" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="500" y="268.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">En serie las latencias se suman y la cola se acumula; en paralelo manda el más lento. La probabilidad de tocar una llamada lenta</tspan></text><text x="500" y="285.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">crece como 1 − 0,99ᴺ. La vista de runtime muestra esas rutas; la lógica no. Latencias lognormales sintéticas (σ = 0,6) y llamadas</tspan></text><text x="500" y="302.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">independientes, un supuesto que la contención real rompe.</tspan></text><text x="500" y="341.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
