<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 510" width="940" height="510" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Contador de elementos agregados: lotes con cuenta errónea según el diseño y la base</title><desc id="d">Barras agrupadas con los lotes mal contados de mil: el contador por herencia cuenta mal los 1000 lotes cuando la base implementa agregar todos llamando a agregar y ninguno cuando usa extend; el contador por composición y delegación cuenta bien los mil lotes con ambas bases.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="510" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Contador de elementos agregados: lotes con cuenta errónea según el diseño y la base</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Base V1 (agregar_todos llama a agregar)</tspan></text><rect x="358.06" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="378.06" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="378.06" dy="0">Base V2 (agregar_todos usa extend)</tspan></text><line x1="93.7" y1="335" x2="920" y2="335" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="335" x2="93.7" y2="335" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="339.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">0</tspan></text><line x1="93.7" y1="287" x2="920" y2="287" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="287" x2="93.7" y2="287" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="291.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">200</tspan></text><line x1="93.7" y1="239" x2="920" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="239" x2="93.7" y2="239" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="243.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">400</tspan></text><line x1="93.7" y1="191" x2="920" y2="191" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="191" x2="93.7" y2="191" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="195.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">600</tspan></text><line x1="93.7" y1="143" x2="920" y2="143" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="143" x2="93.7" y2="143" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="147.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">800</tspan></text><line x1="93.7" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="95" x2="93.7" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1 000</tspan></text><line x1="93.7" y1="95" x2="93.7" y2="335" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="215" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 215)">Lotes con cuenta errónea (de 1000)</text><rect x="135.015" y="95" width="163.26" height="240" rx="3" fill="#c0432f"/><text x="216.645" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="216.645" dy="0">1 000</tspan></text><rect x="302.275" y="333" width="163.26" height="2" rx="3" fill="#087f8c"/><text x="383.905" y="327" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="383.905" dy="0">0</tspan></text><text x="300.275" y="356" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="300.275" dy="0">Herencia</tspan></text><rect x="548.165" y="333" width="163.26" height="2" rx="3" fill="#c0432f"/><text x="629.795" y="327" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="629.795" dy="0">0</tspan></text><rect x="715.425" y="333" width="163.26" height="2" rx="3" fill="#087f8c"/><text x="797.055" y="327" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="797.055" dy="0">0</tspan></text><text x="713.425" y="356" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="713.425" dy="0">Composición y delegación</tspan></text><rect x="10" y="387" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="411.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">La subclase funcionaba o fallaba según un detalle interno de la base que ni la interfaz ni la documentación prometían: eso</tspan></text><text x="470" y="428.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">es la clase base frágil. La composición solo depende de lo que la base promete. La prueba que pasó con V2 no vio que V1</tspan></text><text x="470" y="445.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">existía. Lotes de 1 a 6 elementos con semilla fija.</tspan></text><text x="470" y="492.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
