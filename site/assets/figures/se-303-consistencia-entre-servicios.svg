<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 345" width="1030" height="345" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Operación que cruza tres servicios: estados inconsistentes con y sin compensación</title><desc id="d">Tabla: si cada una de tres llamadas remotas falla con probabilidad 1 por ciento, sin compensación el 1,98 por ciento de las operaciones queda inconsistente; con compensación que falla el 5 por ciento de las veces queda el 0,14 por ciento; con 5 por ciento de fallo por llamada quedan 9,27 y 0,69 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1030" height="345" fill="#ffffff"/><rect x="10" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="107" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="107" dy="0">Fallo por llamada</tspan></text><rect x="210" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="322" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="322" dy="0">Operaciones completas</tspan></text><rect x="440" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="572" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="572" dy="0">Inconsistentes sin compensación</tspan></text><rect x="710" y="12" width="304" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="862" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="862" dy="0">Inconsistentes con compensación (5 %</tspan></text><text x="862" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="862" dy="0">de fallo)</tspan></text><rect x="10" y="56" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">0,1 %</tspan></text><rect x="210" y="56" width="224" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="322" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="322" dy="0">99,69 %</tspan></text><rect x="440" y="56" width="264" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">0,22 %</tspan></text><rect x="710" y="56" width="304" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">0,02 %</tspan></text><rect x="10" y="114" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="143.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">1 %</tspan></text><rect x="210" y="114" width="224" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="322" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="322" dy="0">97,01 %</tspan></text><rect x="440" y="114" width="264" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">1,98 %</tspan></text><rect x="710" y="114" width="304" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">0,14 %</tspan></text><rect x="10" y="172" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="201.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">5 %</tspan></text><rect x="210" y="172" width="224" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="322" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="322" dy="0">85,78 %</tspan></text><rect x="440" y="172" width="264" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">9,27 %</tspan></text><rect x="710" y="172" width="304" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">0,69 %</tspan></text><rect x="10" y="234" width="1010" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="515" y="258.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="515" dy="0">Una transacción local en el monolito deja 0 filas tras un fallo (se comprobó con SQLite). Entre servicios, la consistencia se compra</tspan></text><text x="515" y="275.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="515" dy="0">con compensaciones, que también pueden fallar: no desaparece el estado intermedio, se reduce y se vuelve observable. 200 000</tspan></text><text x="515" y="292.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="515" dy="0">operaciones por celda; fallos independientes por supuesto.</tspan></text><text x="515" y="331.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="515" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
