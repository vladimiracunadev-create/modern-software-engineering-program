82" y="283.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="354.82" dy="0">0,945</tspan></text><rect x="437.06" y="257.5" width="158.48" height="43" rx="4" fill="#384f65" stroke="#ffffff" stroke-width="1"/><text x="516.3" y="283.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="516.3" dy="0">0,980</tspan></text><rect x="598.54" y="257.5" width="158.48" height="43" rx="4" fill="#203951" stroke="#102a43" stroke-width="3"/><text x="677.78" y="283.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="677.78" dy="0">0,992</tspan></text><rect x="760.02" y="257.5" width="158.48" height="43" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="839.26" y="283.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="839.26" dy="0">1,000</tspan></text><text x="112.6" y="328" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="112.6" dy="0">0,900</tspan></text><rect x="158.3" y="316" width="30.5" height="14" fill="#d9e2ec"/><rect x="188.3" y="316" width="30.5" height="14" fill="#bcc8d4"/><rect x="218.3" y="316" width="30.5" height="14" fill="#a0adbc"/><rect x="248.3" y="316" width="30.5" height="14" fill="#8393a4"/><rect x="278.3" y="316" width="30.5" height="14" fill="#66798b"/><rect x="308.3" y="316" width="30.5" height="14" fill="#495f73"/><rect x="338.3" y="316" width="30.5" height="14" fill="#2d445b"/><rect x="368.3" y="316" width="30.5" height="14" fill="#102a43"/><text x="406.3" y="328" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="406.3" dy="0">1,000</tspan></text><text x="452" y="328" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="452" dy="0">más oscuro = mayor (similitud coseno (escala desde 0,90))</tspan></text><rect x="10" y="344" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="368.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Las cinco clases guardan un colaborador y le delegan: lo que cambia es la intención (traducir, controlar el acceso, añadir,</tspan></text><text x="470" y="385.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">intercambiar un algoritmo, cambiar de comportamiento con el estado). El patrón no se reconoce por la forma sino por el</tspan></text><text x="470" y="402.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">motivo del cambio. Cinco clases escritas por el autor.</tspan></text><text x="470" y="449.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
