<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 467" width="940" height="467" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Similitud de la estructura sintáctica entre implementaciones de cinco patrones</title><desc id="d">Mapa de calor con la similitud coseno entre los tipos de nodo del árbol sintáctico de cinco patrones: todos los pares están entre 0,926 y 0,992, proxy con decorador es el par más distinto, 0,926, y estrategia con estado el más parecido, 0,992; el código casi no distingue un patrón de otro.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="467" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Similitud de la estructura sintáctica entre implementaciones de cinco patrones</tspan></text><text x="193.34" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="193.34" dy="0">Adaptador</tspan></text><text x="354.82" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="354.82" dy="0">Proxy</tspan></text><text x="516.3" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="516.3" dy="0">Decorador</tspan></text><text x="677.78" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="677.78" dy="0">Estrategia</tspan></text><text x="839.26" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="839.26" dy="0">Estado</tspan></text><text x="102.6" y="99.5" font-size="13" text-anchor="end" font-weight="700" fill="#142