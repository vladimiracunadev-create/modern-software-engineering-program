<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 236" width="960" height="236" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Defectos sembrados en dobles del repositorio que detecta cada suite</title><desc id="d">Barras: de siete defectos sembrados en dobles de un repositorio, entre ellos duplicar al guardar, no reemplazar, no ordenar y devolver referencias compartidas, tres ejemplos de camino feliz matan 1 y una suite de contrato escrita contra el comportamiento de referencia mata los 7.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="236" fill="#ffffff"/><text x="300" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">3 ejemplos de camino feliz</tspan></text><rect x="310" y="16" width="50" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="368" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="368" dy="0">1 de 7</tspan></text><text x="300" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Pruebas de contrato del puerto</tspan></text><rect x="310" y="60" width="350" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="668" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="668" dy="0">7 de 7</tspan></text><rect x="10" y="108" width="940" height="92.56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="480" y="132.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">El contrato fija lo que el puerto promete (orden, aislamiento por curso, reemplazo sin duplicar, ausencia como None, rechazo</tspan></text><text x="480" y="149.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">de notas fuera de 1 a 7, copia defensiva). Se ejecuta contra todos los dobles y contra el adaptador real. Los defectos son</tspan></text><text x="480" y="166.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">sembrados por el autor: miden la capacidad de detectar esas siete formas de desviación, no la tasa de defectos de un</tspan></text><text x="480" y="182.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">repositorio.</tspan></text><text x="480" y="222.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
