<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 326" width="910" height="326" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una prueba de la regla de promedio con tres implementaciones del repositorio (mediana de 60 ejecuciones)</title><desc id="d">Tabla: la misma prueba de la regla de promedio tarda entre 0,008 y 0,044 milisegundos con un doble en memoria, entre 0,26 y 0,83 con SQLite en memoria y entre 102 y 133 con SQLite en un archivo, entre 2587 y 16136 veces más que el doble.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="910" height="326" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Implementación del puerto</tspan></text><rect x="340" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="472" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="472" dy="0">Mediana por prueba</tspan></text><rect x="610" y="12" width="284" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="752" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="752" dy="0">Razón sobre el doble</tspan></text><rect x="10" y="56" width="324" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Doble en memoria</tspan></text><rect x="340" y="56" width="264" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">0,008 – 0,044 ms</tspan></text><rect x="610" y="56" width="284" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">1×</tspan></text><rect x="10" y="102" width="324" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="125.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">SQLite en memoria</tspan></text><rect x="340" y="102" width="264" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">0,26 – 0,83 ms</tspan></text><rect x="610" y="102" width="284" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">16 – 41×</tspan></text><rect x="10" y="148" width="324" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="171.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">SQLite en archivo temporal</tspan></text><rect x="340" y="148" width="264" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">102 – 133 ms</tspan></text><rect x="610" y="148" width="284" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">2 587 – 16 136×</tspan></text><rect x="10" y="198" width="890" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="455" y="222.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455" dy="0">El puerto hace que la regla se pueda probar a velocidad de función. Medición real con crear el repositorio y 20</tspan></text><text x="455" y="239.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455" dy="0">inserciones por prueba; el coste del archivo se debe sobre todo a crear, sincronizar y borrar un archivo, no a la</tspan></text><text x="455" y="256.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455" dy="0">regla. Es la razón por la que un doble necesita pruebas de contrato: es rápido, pero no demuestra que el adaptador real</tspan></text><text x="455" y="272.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455" dy="0">se comporte igual.</tspan></text><text x="455" y="312.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="455" dy="0">Medición real en bucle local: depende de la máquina; rangos de cinco ejecuciones en Windows y cuatro en Ubuntu (WSL2).</tspan></text></svg>
