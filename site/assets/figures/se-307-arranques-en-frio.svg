00" fill="#142231"><tspan x="592" dy="0">0 de 4</tspan></text><rect x="730" y="306" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">—</tspan></text><rect x="10" y="360" width="950" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="485" y="384.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">El promedio engaña: 0,40 % parece despreciable, pero se concentra en los primeros segundos de la ráfaga, justo cuando hay gente</tspan></text><text x="485" y="401.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">entregando contra un plazo. El arranque en frío (0,8 s) y el tibio (30 ms) son supuestos del autor; el mecanismo es la espera</tspan></text><text x="485" y="418.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">mientras se crea una instancia por cada petición simultánea sin instancia libre.</tspan></text><text x="485" y="457.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
