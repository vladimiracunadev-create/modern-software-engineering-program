<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 465" width="1020" height="465" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Rondas para que un rumor llegue al 99 % de los pares conectados (1000 pares, 200 repeticiones)</title><desc id="d">Tabla: en una red de mil pares con 20 por ciento desconectados, un rumor con fanout 2 llega al 99 por ciento de los conectados en 10,5 rondas de media y 12 como máximo, enviando 5402 mensajes; con fanout 5 tarda 6,0 rondas y envía 6563; con 80 por ciento de pares desconectados el fanout 2 tarda 28,8 rondas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1020" height="465" fill="#ffffff"/><rect x="10" y="12" width="394" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="207" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="207" dy="0">Configuración</tspan></text><rect x="410" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="502" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="502" dy="0">Rondas, media</tspan></text><rect x="600" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="697" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="697" dy="0">Rondas, máximo</tspan></text><rect x="800" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="902" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="902" dy="0">Mensajes, media</tspan></text><rect x="10" y="56" width="394" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="77.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Fanout 1 · 20 % desconectados</tspan></text><rect x="410" y="56" width="184" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="77.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">17,8</tspan></text><rect x="600" y="56" width="194" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="77.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">21</tspan></text><rect x="800" y="56" width="204" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="902" y="77.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="902" dy="0">5 003</tspan></text><rect x="10" y="98" width="394" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="119.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Fanout 2 · 20 % desconectados</tspan></text><rect x="410" y="98" width="184" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="119.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">10,5</tspan></text><rect x="600" y="98" width="194" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="119.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">12</tspan></text><rect x="800" y="98" width="204" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="902" y="119.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="902" dy="0">5 402</tspan></text><rect x="10" y="140" width="394" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="161.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Fanout 3 · 20 % desconectados</tspan></text><rect x="410" y="140" width="184" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">8,1</tspan></text><rect x="600" y="140" width="194" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">9</tspan></text><rect x="800" y="140" width="204" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="902" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="902" dy="0">5 769</tspan></text><rect x="10" y="182" width="394" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="203.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Fanout 5 · 20 % desconectados</tspan></text><rect x="410" y="182" width="184" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="203.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">6,0</tspan></text><rect x="600" y="182" width="194" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="203.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">7</tspan></text><rect x="800" y="182" width="204" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="902" y="203.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="902" dy="0">6 563</tspan></text><rect x="10" y="224" width="394" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="245.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Fanout 2 · 0 % desconectados</tspan></text><rect x="410" y="224" width="184" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">9,0</tspan></text><rect x="600" y="224" width="194" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">10</tspan></text><rect x="800" y="224" width="204" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="902" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="902" dy="0">—</tspan></text><rect x="10" y="266" width="394" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="287.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Fanout 2 · 50 % desconectados</tspan></text><rect x="410" y="266" width="184" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="287.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">14,3</tspan></text><rect x="600" y="266" width="194" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="287.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">19</tspan></text><rect x="800" y="266" width="204" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="902" y="287.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="902" dy="0">—</tspan></text><rect x="10" y="308" width="394" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="329.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Fanout 2 · 80 % desconectados</tspan></text><rect x="410" y="308" width="184" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="329.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">28,8</tspan></text><rect x="600" y="308" width="194" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="329.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">40</tspan></text><rect x="800" y="308" width="204" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="902" y="329.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="902" dy="0">—</tspan></text><rect x="10" y="354" width="1000" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="510" y="378.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="510" dy="0">Las rondas crecen con el logaritmo del tamaño (8,2 con 100 pares, 10,5 con 1000, 13,1 con 10 000) y se disparan cuando casi todos los</tspan></text><text x="510" y="395.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="510" dy="0">pares están desconectados. Más fanout acorta la difusión y encarece el tráfico: cinco veces el fanout envía solo un 31 % más de</tspan></text><text x="510" y="412.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="510" dy="0">mensajes. Modelo sin latencias, sin fallos de enlace y con elección uniforme de pares.</tspan></text><text x="510" y="451.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="510" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
