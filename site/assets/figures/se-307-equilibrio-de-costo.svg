<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 464" width="950" height="464" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tráfico a partir del cual un servidor fijo cuesta menos que pagar por uso (unidades ficticias)</title><desc id="d">Tabla: con una función de 128 megabytes y 0,15 segundos por petición, un servidor fijo de 40 peticiones por segundo cuesta menos a partir de 22,2 peticiones por segundo, el 56 por ciento de su capacidad; con 1024 megabytes y un segundo por petición el punto de equilibrio baja a 0,7 peticiones por segundo, el 2 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="464" fill="#ffffff"/><rect x="10" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="102" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="102" dy="0">Memoria</tspan></text><rect x="200" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="307" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="307" dy="0">Duración por petición</tspan></text><rect x="420" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="567" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="567" dy="0">Equilibrio (peticiones por</tspan></text><text x="567" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="567" dy="0">segundo)</tspan></text><rect x="720" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="827" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="827" dy="0">Del servidor de 40 rps</tspan></text><rect x="10" y="56" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">128 MB</tspan></text><rect x="200" y="56" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="307" dy="0">0,15 s</tspan></text><rect x="420" y="56" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="567" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="567" dy="0">22,2</tspan></text><rect x="720" y="56" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">56 %</tspan></text><rect x="10" y="102" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="125.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">128 MB</tspan></text><rect x="200" y="102" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="307" dy="0">1,0 s</tspan></text><rect x="420" y="102" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="567" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="567" dy="0">5,0</tspan></text><rect x="720" y="102" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">12 %</tspan></text><rect x="10" y="148" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="171.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">512 MB</tspan></text><rect x="200" y="148" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="307" dy="0">0,15 s</tspan></text><rect x="420" y="148" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="567" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="567" dy="0">7,8</tspan></text><rect x="720" y="148" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">20 %</tspan></text><rect x="10" y="194" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="217.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">512 MB</tspan></text><rect x="200" y="194" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="307" dy="0">1,0 s</tspan></text><rect x="420" y="194" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="567" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="567" dy="0">1,3</tspan></text><rect x="720" y="194" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">3 %</tspan></text><rect x="10" y="240" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="263.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">1 024 MB</tspan></text><rect x="200" y="240" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="307" dy="0">0,15 s</tspan></text><rect x="420" y="240" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="567" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="567" dy="0">4,2</tspan></text><rect x="720" y="240" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">10 %</tspan></text><rect x="10" y="286" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="102" y="309.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="102" dy="0">1 024 MB</tspan></text><rect x="200" y="286" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="307" dy="0">1,0 s</tspan></text><rect x="420" y="286" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="567" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="567" dy="0">0,7</tspan></text><rect x="720" y="286" width="214" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">2 %</tspan></text><rect x="10" y="336" width="930" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="475" y="360.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">El equilibrio no es una propiedad del modelo serverless sino del producto memoria × duración y de la utilización: una</tspan></text><text x="475" y="377.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">función ligera y esporádica favorece el pago por uso; una pesada y sostenida favorece el servidor. Los precios (0,20 por</tspan></text><text x="475" y="394.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">millón, 0,0000167 por GB-s, 30 por servidor) son unidades ficticias de orden de magnitud, no una tarifa de proveedor; con</tspan></text><text x="475" y="410.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">dos servidores el equilibrio sube a 44,5 rps.</tspan></text><text x="475" y="450.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
