<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 706" width="960" height="706" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Módulos que hay que editar al cambiar una decisión de diseño</title><desc id="d">Barras horizontales con los módulos que se editan al cambiar una de seis decisiones: la descomposición por pasos del flujo obliga a editar 2 módulos y 4 en moneda y redondeo, 2,19 de media sobre mil cambios; la descomposición por decisión oculta obliga a editar uno en todos los casos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="706" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Módulos que hay que editar al cambiar una decisión de diseño</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Por pasos del flujo (5 módulos)</tspan></text><rect x="297.74" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="317.74" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="317.74" dy="0">Por decisión oculta (6 + orquestador)</tspan></text><line x1="294" y1="77" x2="294" y2="525" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="525" x2="294" y2="530" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="546" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">0</tspan></text><line x1="446.44" y1="77" x2="446.44" y2="525" stroke="#d5dde1" stroke-width="1"/><line x1="446.44" y1="525" x2="446.44" y2="530" stroke="#5b7280" stroke-width="1.4"/><text x="446.44" y="546" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="446.44" dy="0">1</tspan></text><line x1="598.88" y1="77" x2="598.88" y2="525" stroke="#d5dde1" stroke-width="1"/><line x1="598.88" y1="525" x2="598.88" y2="530" stroke="#5b7280" stroke-width="1.4"/><text x="598.88" y="546" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="598.88" dy="0">2</tspan></text><line x1="751.32" y1="77" x2="751.32" y2="525" stroke="#d5dde1" stroke-width="1"/><line x1="751.32" y1="525" x2="751.32" y2="530" stroke="#5b7280" stroke-width="1.4"/><text x="751.32" y="546" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="751.32" dy="0">3</tspan></text><line x1="903.76" y1="77" x2="903.76" y2="525" stroke="#d5dde1" stroke-width="1"/><line x1="903.76" y1="525" x2="903.76" y2="530" stroke="#5b7280" stroke-width="1.4"/><text x="903.76" y="546" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="903.76" dy="0">4</tspan></text><line x1="294" y1="525" x2="903.76" y2="525" stroke="#5b7280" stroke-width="1.6"/><text x="284" y="113.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Tarifas</tspan></text><text x="284" y="177.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Zonas</tspan></text><text x="284" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Descuentos (30 % de los cambios)</tspan></text><text x="284" y="305.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Moneda y redondeo</tspan></text><text x="284" y="369.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Canal de aviso</tspan></text><text x="284" y="433.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Persistencia</tspan></text><text x="284" y="497.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Media sobre 1000 cambios</tspan></text><rect x="294" y="83" width="304.88" height="24.5" rx="3" fill="#c0432f"/><text x="605.88" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="605.88" dy="0">2</tspan></text><rect x="294" y="110.5" width="152.44" height="24.5" rx="3" fill="#087f8c"/><text x="453.44" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="453.44" dy="0">1</tspan></text><rect x="294" y="147" width="304.88" height="24.5" rx="3" fill="#c0432f"/><text x="605.88" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="605.88" dy="0">2</tspan></text><rect x="294" y="174.5" width="152.44" height="24.5" rx="3" fill="#087f8c"/><text x="453.44" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="453.44" dy="0">1</tspan></text><rect x="294" y="211" width="304.88" height="24.5" rx="3" fill="#c0432f"/><text x="605.88" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="605.88" dy="0">2</tspan></text><rect x="294" y="238.5" width="152.44" height="24.5" rx="3" fill="#087f8c"/><text x="453.44" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="453.44" dy="0">1</tspan></text><rect x="294" y="275" width="609.76" height="24.5" rx="3" fill="#c0432f"/><text x="910.76" y="291.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="910.76" dy="0">4</tspan></text><rect x="294" y="302.5" width="152.44" height="24.5" rx="3" fill="#087f8c"/><text x="453.44" y="319.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="453.44" dy="0">1</tspan></text><rect x="294" y="339" width="304.88" height="24.5" rx="3" fill="#c0432f"/><text x="605.88" y="355.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="605.88" dy="0">2</tspan></text><rect x="294" y="366.5" width="152.44" height="24.5" rx="3" fill="#087f8c"/><text x="453.44" y="383.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="453.44" dy="0">1</tspan></text><rect x="294" y="403" width="304.88" height="24.5" rx="3" fill="#c0432f"/><text x="605.88" y="419.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="605.88" dy="0">2</tspan></text><rect x="294" y="430.5" width="152.44" height="24.5" rx="3" fill="#087f8c"/><text x="453.44" y="447.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="453.44" dy="0">1</tspan></text><rect x="294" y="467" width="333.844" height="24.5" rx="3" fill="#c0432f"/><text x="634.844" y="483.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="634.844" dy="0">2,19</tspan></text><rect x="294" y="494.5" width="152.44" height="24.5" rx="3" fill="#087f8c"/><text x="453.44" y="511.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="453.44" dy="0">1</tspan></text><text x="598.88" y="569" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="598.88" dy="0">Módulos que editar</tspan></text><rect x="10" y="583" width="940" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="607.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">La moneda aparece en cuatro pasos del flujo: un cambio de redondeo recorre cuatro módulos. Con módulos que conocen cada</tspan></text><text x="480" y="624.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">decisión al azar con probabilidad 0,3, la media es 1,48; con 0,5, 2,50. Las matrices de conocimiento y los pesos de los</tspan></text><text x="480" y="641.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">cambios son supuestos del autor, no un proyecto medido.</tspan></text><text x="480" y="688.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
