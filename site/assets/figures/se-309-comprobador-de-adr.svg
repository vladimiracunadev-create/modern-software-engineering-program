<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 523" width="840" height="523" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un comprobador de ADR frente a 12 ADR válidos con un defecto cada uno</title><desc id="d">Tabla: el comprobador detecta las 12 de 12 variantes con un defecto de forma, falta de sección, estado inventado, fecha mal escrita o una sola alternativa, y 0 de 12 de las cuatro con un defecto de sentido, alternativas vacías, consecuencias solo positivas, decisión que no responde al contexto o reversibilidad sin condición; los doce ADR válidos pasan sin falsos positivos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="840" height="523" fill="#ffffff"/><rect x="10" y="12" width="494" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="257" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="257" dy="0">Defecto introducido</tspan></text><rect x="510" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="592" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="592" dy="0">Detectado</tspan></text><rect x="680" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="752" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="752" dy="0">Tipo</tspan></text><rect x="10" y="56" width="494" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="78.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Sin sección de alternativas</tspan></text><rect x="510" y="56" width="164" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="78.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">12 de 12</tspan></text><rect x="680" y="56" width="144" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="78.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">forma</tspan></text><rect x="10" y="100" width="494" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="122.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Estado inventado («en discusión»)</tspan></text><rect x="510" y="100" width="164" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="122.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">12 de 12</tspan></text><rect x="680" y="100" width="144" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="122.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">forma</tspan></text><rect x="10" y="144" width="494" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="166.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Fecha en formato 13/11/2026</tspan></text><rect x="510" y="144" width="164" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="166.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">12 de 12</tspan></text><rect x="680" y="144" width="144" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="166.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">forma</tspan></text><rect x="10" y="188" width="494" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="210.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Una sola alternativa</tspan></text><rect x="510" y="188" width="164" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="210.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">12 de 12</tspan></text><rect x="680" y="188" width="144" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="210.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">forma</tspan></text><rect x="10" y="232" width="494" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="254.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Alternativas «Ninguna» repetidas</tspan></text><rect x="510" y="232" width="164" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="254.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">0 de 12</tspan></text><rect x="680" y="232" width="144" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="254.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">sentido</tspan></text><rect x="10" y="276" width="494" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="298.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Consecuencias solo positivas</tspan></text><rect x="510" y="276" width="164" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="298.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">0 de 12</tspan></text><rect x="680" y="276" width="144" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="298.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">sentido</tspan></text><rect x="10" y="320" width="494" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="342.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Decisión que no responde al contexto</tspan></text><rect x="510" y="320" width="164" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="342.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">0 de 12</tspan></text><rect x="680" y="320" width="144" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="342.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">sentido</tspan></text><rect x="10" y="364" width="494" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="386.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Reversibilidad «Sí.» sin plazo ni condición</tspan></text><rect x="510" y="364" width="164" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="386.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">0 de 12</tspan></text><rect x="680" y="364" width="144" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="386.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">sentido</tspan></text><rect x="10" y="412" width="820" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="420" y="436.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="420" dy="0">El comprobador exige secciones, estado válido, fecha ISO y al menos dos alternativas: eso evita ADR</tspan></text><text x="420" y="453.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="420" dy="0">incompletos, no malos. Las cuatro variantes que pasan cumplen la forma y vacían el contenido; eso lo ve una</tspan></text><text x="420" y="470.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="420" dy="0">persona leyendo. Un ADR aceptado por el comprobador sigue necesitando revisión humana del sentido.</tspan></text><text x="420" y="509.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="420" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
