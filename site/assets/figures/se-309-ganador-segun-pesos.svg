<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 345" width="930" height="345" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Quién gana la matriz de decisión cuando cambian los pesos o los puntajes</title><desc id="d">Tabla: con los pesos base la matriz da 3,95 puntos al monolito modular, 3,30 a servicios y 3,45 a serverless; con 20000 conjuntos de pesos al azar el monolito gana el 64,5 por ciento de las veces, servicios el 35,0 y serverless el 0,5; con los pesos base y puntajes que varían en uno gana el monolito el 80,4 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="345" fill="#ffffff"/><rect x="10" y="12" width="434" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="227" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="227" dy="0">Condición</tspan></text><rect x="450" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="532" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="532" dy="0">Monolito modular</tspan></text><rect x="620" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="692" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="692" dy="0">Servicios</tspan></text><rect x="770" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="842" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="842" dy="0">Serverless</tspan></text><rect x="10" y="56" width="434" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="85.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">Pesos base de la matriz</tspan></text><rect x="450" y="56" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">3,95 puntos</tspan></text><rect x="620" y="56" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">3,30 puntos</tspan></text><rect x="770" y="56" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">3,45 puntos</tspan></text><rect x="10" y="114" width="434" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="143.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">20 000 conjuntos de pesos al azar</tspan></text><rect x="450" y="114" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">64,5 %</tspan></text><rect x="620" y="114" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">35,0 %</tspan></text><rect x="770" y="114" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">0,5 %</tspan></text><rect x="10" y="172" width="434" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="201.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">Pesos base, puntajes con ±1 en la mitad de los casos</tspan></text><rect x="450" y="172" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">80,4 %</tspan></text><rect x="620" y="172" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">3,7 %</tspan></text><rect x="770" y="172" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">15,9 %</tspan></text><rect x="10" y="234" width="910" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="258.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">El ganador de los pesos base lleva 0,5 puntos de ventaja sobre 3,95, pero con pesos al azar pierde una de cada tres veces</tspan></text><text x="465" y="275.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">frente a servicios. Una matriz no decide: muestra qué supuestos hay que defender. Los puntajes son juicios del autor, no</tspan></text><text x="465" y="292.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">mediciones; sirven para ver sensibilidad, no para elegir una arquitectura real.</tspan></text><text x="465" y="331.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
