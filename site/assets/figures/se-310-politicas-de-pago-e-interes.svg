<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 587" width="980" height="587" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Puntos entregados en 24 sprints según la política de pago de deuda y el interés (parámetros supuestos)</title><desc id="d">Líneas con los puntos entregados en 24 sprints según el interés por unidad de deuda: no pagar nunca baja de 703 puntos con interés 0,002 a 173 con 0,020; pagar todo hasta bajar de 10 unidades baja solo de 716 a 609; con interés bajo todas las políticas entregan casi lo mismo y con interés alto la diferencia es de un factor 3,5.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="587" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Puntos entregados en 24 sprints según la política de pago de deuda y el interés (parámetros supuestos)</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Nunca pagar</tspan></text><rect x="146.94" y="45" width="12" height="12" fill="#946512" stroke="#946512" stroke-width="2"/><text x="166.94" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="166.94" dy="0">20 % de la capacidad</tspan></text><polygon points="351.74,44.1 358.34,56.4 345.14,56.4" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="365.74" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="365.74" dy="0">50 % cuando la deuda pasa de 25</tspan></text><polygon points="633.48,43.5 640.98,51 633.48,58.5 625.98,51" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="647.48" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="647.48" dy="0">Todo hasta bajar de 10</tspan></text><line x1="78.62" y1="387" x2="950" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="387" x2="78.62" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="312" x2="950" y2="312" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="312" x2="78.62" y2="312" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="316.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">200</tspan></text><line x1="78.62" y1="237" x2="950" y2="237" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="237" x2="78.62" y2="237" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">400</tspan></text><line x1="78.62" y1="162" x2="950" y2="162" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="162" x2="78.62" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="166.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">600</tspan></text><line x1="78.62" y1="87" x2="950" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="87" x2="78.62" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">800</tspan></text><line x1="78.62" y1="87" x2="78.62" y2="387" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="87" x2="96.62" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="387" x2="96.62" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">0,002</tspan></text><line x1="282.26" y1="87" x2="282.26" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="282.26" y1="387" x2="282.26" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="282.26" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="282.26" dy="0">0,006</tspan></text><line x1="560.72" y1="87" x2="560.72" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="560.72" y1="387" x2="560.72" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="560.72" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="560.72" dy="0">0,012</tspan></text><line x1="932" y1="87" x2="932" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="932" y1="387" x2="932" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="932" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="932" dy="0">0,020</tspan></text><line x1="78.62" y1="387" x2="950" y2="387" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 237)">Puntos entregados en 24 sprints</text><text x="514.31" y="433" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="514.31" dy="0">Interés por unidad de deuda</tspan></text><polyline points="96.62,123.375 282.26,234 560.72,296.625 932,322.125" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="96.62" cy="123.375" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><circle cx="282.26" cy="234" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><circle cx="560.72" cy="296.625" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><circle cx="932" cy="322.125" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="932" y="311.125" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="932" dy="0">173</tspan></text><polyline points="96.62,118.125 282.26,141.75 560.72,158.625 932,167.625" fill="none" stroke="#946512" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="91.12" y="112.625" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><rect x="276.76" y="136.25" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><rect x="555.22" y="153.125" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><rect x="926.5" y="162.125" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="932" y="191.625" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="932" dy="0">585</tspan></text><polyline points="96.62,122.25 282.26,138.375 560.72,162 932,197.625" fill="none" stroke="#102a43" stroke-width="2.4"/><polygon points="96.62,115.925 102.67,127.2 90.57,127.2" fill="#102a43" stroke="#102a43" stroke-width="2"/><polygon points="282.26,132.05 288.31,143.325 276.21,143.325" fill="#102a43" stroke="#102a43" stroke-width="2"/><polygon points="560.72,155.675 566.77,166.95 554.67,166.95" fill="#102a43" stroke="#102a43" stroke-width="2"/><polygon points="932,191.3 938.05,202.575 925.95,202.575" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="932" y="221.625" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="932" dy="0">505</tspan></text><polyline points="96.62,118.5 282.26,127.125 560.72,142.875 932,158.625" fill="none" stroke="#087f8c" stroke-width="2.4" stroke-dasharray="7 4"/><polygon points="96.62,111.625 103.495,118.5 96.62,125.375 89.745,118.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polygon points="282.26,120.25 289.135,127.125 282.26,134 275.385,127.125" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polygon points="560.72,136 567.595,142.875 560.72,149.75 553.845,142.875" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polygon points="932,151.75 938.875,158.625 932,165.5 925.125,158.625" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="932" y="147.625" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="932" dy="0">609</tspan></text><rect x="10" y="447" width="960" height="92.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="490" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Con interés bajo, pagar no mejora lo entregado (703 frente a 717 puntos): la deuda barata se puede dejar. Con interés alto, no</tspan></text><text x="490" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">pagar entrega menos de un tercio. La deuda final de «nunca pagar» pasa de 246 a 68 unidades según el interés y la de «todo hasta</tspan></text><text x="490" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">bajar de 10», de 23 a 7. La política correcta depende de la tasa, que hay que estimar. Capacidad, generación de deuda e interés</tspan></text><text x="490" y="521.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">son supuestos del autor; no se midió ningún equipo.</tspan></text><text x="490" y="569.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
