<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 355" width="1020" height="355" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reparto de 24 módulos entre 4 equipos: dependencias y cambios que cruzan equipos (32 dependencias)</title><desc id="d">Tabla: al repartir 24 módulos por comunidades de afinidad, 4 de 32 dependencias cruzan equipos y el 16,3 por ciento de los cambios obliga a coordinar; al repartir por capa técnica cruzan 29 dependencias y el 72,5 por ciento de los cambios involucra a más de un equipo, con 2,11 equipos por cambio.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1020" height="355" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Reparto</tspan></text><rect x="340" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="452" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="452" dy="0">Dependencias entre equipos</tspan></text><rect x="570" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="687" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="687" dy="0">Cambios que cruzan equipos</tspan></text><rect x="810" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="907" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="907" dy="0">Equipos por cambio</tspan></text><rect x="10" y="56" width="324" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Por comunidad (afinidad real)</tspan></text><rect x="340" y="56" width="224" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">4 (12 %)</tspan></text><rect x="570" y="56" width="234" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="687" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="687" dy="0">16,3 %</tspan></text><rect x="810" y="56" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="907" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907" dy="0">1,16</tspan></text><rect x="10" y="102" width="324" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="125.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Un equipo grande y tres pequeños</tspan></text><rect x="340" y="102" width="224" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">12 (38 %)</tspan></text><rect x="570" y="102" width="234" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="687" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="687" dy="0">40,0 %</tspan></text><rect x="810" y="102" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="907" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907" dy="0">1,45</tspan></text><rect x="10" y="148" width="324" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="171.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Al azar</tspan></text><rect x="340" y="148" width="224" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">26 (81 %)</tspan></text><rect x="570" y="148" width="234" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="687" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="687" dy="0">66,8 %</tspan></text><rect x="810" y="148" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="907" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907" dy="0">1,89</tspan></text><rect x="10" y="194" width="324" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="217.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Por capa técnica</tspan></text><rect x="340" y="194" width="224" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">29 (91 %)</tspan></text><rect x="570" y="194" width="234" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="687" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="687" dy="0">72,5 %</tspan></text><rect x="810" y="194" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="907" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907" dy="0">2,11</tspan></text><rect x="10" y="244" width="1000" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="510" y="268.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="510" dy="0">Los equipos por capa técnica son cómodos para especialistas y obligan a que casi todo cambio de negocio cruce equipos. El reparto por</tspan></text><text x="510" y="285.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="510" dy="0">comunidad ahorra coordinación solo si las comunidades existen en el grafo de dependencias; el grafo y las probabilidades de arista son</tspan></text><text x="510" y="302.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="510" dy="0">sintéticos. Los canales de comunicación crecen como n(n−1)/2: 28 con 8 personas, 190 con 20.</tspan></text><text x="510" y="341.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="510" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
