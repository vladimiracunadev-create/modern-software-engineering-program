<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 423" width="980" height="423" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Entradas del maestro dorado (3000) cuyo resultado cambia en cada paso del refactor</title><desc id="d">Barras horizontales con las entradas del maestro dorado, de 3000, cuyo resultado cambia en cada paso: extraer zona y peso no cambia ninguna, extraer opciones, cupón y redondeo tampoco, simplificar la comparación con True cambia 142 y sustituir el redondeo histórico por round cambia 257, 106 de ellas con parámetros booleanos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="423" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Entradas del maestro dorado (3000) cuyo resultado cambia en cada paso del refactor</tspan></text><line x1="364" y1="49" x2="364" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="364" y1="225" x2="364" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="364" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="364" dy="0">0</tspan></text><line x1="553.273" y1="49" x2="553.273" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="553.273" y1="225" x2="553.273" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="553.273" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="553.273" dy="0">100</tspan></text><line x1="742.547" y1="49" x2="742.547" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="742.547" y1="225" x2="742.547" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="742.547" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742.547" dy="0">200</tspan></text><line x1="931.82" y1="49" x2="931.82" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="931.82" y1="225" x2="931.82" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="931.82" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="931.82" dy="0">300</tspan></text><line x1="364" y1="225" x2="931.82" y2="225" stroke="#5b7280" stroke-width="1.6"/><text x="354" y="75.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="354" dy="0">1. Extraer zona y peso</tspan></text><text x="354" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="354" dy="0">2. Extraer opciones, cupón y redondeo</tspan></text><text x="354" y="155" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="354" dy="0">3. Simplificar «urgente == True» a «if</tspan></text><text x="354" y="172" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="354" dy="0">urgente»</tspan></text><text x="354" y="207.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="354" dy="0">4. Cambiar el redondeo histórico por round()</tspan></text><rect x="364" y="55" width="2" height="32" rx="3" fill="#c0432f"/><text x="373" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="373" dy="0">0</tspan></text><rect x="364" y="99" width="2" height="32" rx="3" fill="#c0432f"/><text x="373" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="373" dy="0">0</tspan></text><rect x="364" y="143" width="268.768" height="32" rx="3" fill="#c0432f"/><text x="639.768" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="639.768" dy="0">142</tspan></text><rect x="364" y="187" width="486.432" height="32" rx="3" fill="#c0432f"/><text x="857.432" y="207.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="857.432" dy="0">257</tspan></text><text x="647.91" y="269" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="647.91" dy="0">Entradas cuyo resultado cambia</tspan></text><rect x="10" y="283" width="960" height="92.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="490" y="307.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Los dos pasos que parecían simplificaciones cambiaron comportamiento: el primero (142, con urgente igual a 2 o «sí») con entradas</tspan></text><text x="490" y="324.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">que la función aceptaba sin documentar, el segundo (257, de ellas 106 con urgente booleano) con la diferencia entre sumar 0,5 y</tspan></text><text x="490" y="341.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">redondear al par. Hay que decidir caso por caso si el comportamiento se conserva o se corrige. Entradas sintéticas con semilla</tspan></text><text x="490" y="357.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">fija.</tspan></text><text x="490" y="405.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Medición sobre código de ejemplo y simulación con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
