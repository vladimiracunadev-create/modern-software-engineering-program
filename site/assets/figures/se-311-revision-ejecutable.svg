<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 458" width="940" height="458" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Revisión ejecutable de la arquitectura en servicios contra 12 escenarios (supuestos del autor)</title><desc id="d">Barras horizontales apiladas con los escenarios que cumple y los que falla el modelo de la arquitectura en servicios según su categoría: latencia 2 y 1, disponibilidad 1 y 1, aislamiento 3 y 0, capacidad 0 y 2, cambio 0 y 2; en total seis de doce fallan, y los cuatro de capacidad y cambio fallan todos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="458" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Revisión ejecutable de la arquitectura en servicios contra 12 escenarios (supuestos del autor)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Cumple</tspan></text><rect x="109.24" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="129.24" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="129.24" dy="0">Falla</tspan></text><line x1="244" y1="77" x2="244" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="244" y1="277" x2="244" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="244" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="244" dy="0">0</tspan></text><line x1="454.567" y1="77" x2="454.567" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="454.567" y1="277" x2="454.567" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="454.567" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="454.567" dy="0">1</tspan></text><line x1="665.133" y1="77" x2="665.133" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="665.133" y1="277" x2="665.133" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="665.133" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="665.133" dy="0">2</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="277" x2="875.7" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">3</tspan></text><line x1="244" y1="277" x2="875.7" y2="277" stroke="#5b7280" stroke-width="1.6"/><text x="234" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="234" dy="0">Latencia (E01 – E03)</tspan></text><text x="234" y="141.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="234" dy="0">Disponibilidad (E04 – E05)</tspan></text><text x="234" y="181.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="234" dy="0">Aislamiento (E06 – E08)</tspan></text><text x="234" y="221.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="234" dy="0">Capacidad (E09 – E10)</tspan></text><text x="234" y="261.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="234" dy="0">Cambio (E11 – E12)</tspan></text><rect x="244" y="84" width="421.133" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="454.567" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="454.567" dy="0">2</tspan></text><rect x="665.133" y="84" width="210.567" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="770.417" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="770.417" dy="0">1</tspan></text><text x="882.7" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">3</tspan></text><rect x="244" y="124" width="210.567" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="349.283" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="349.283" dy="0">1</tspan></text><rect x="454.567" y="124" width="210.567" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="559.85" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="559.85" dy="0">1</tspan></text><text x="672.133" y="141.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="672.133" dy="0">2</tspan></text><rect x="244" y="164" width="631.7" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="559.85" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="559.85" dy="0">3</tspan></text><rect x="875.7" y="164" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="181.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">3</tspan></text><rect x="244" y="204" width="0" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="244" y="204" width="421.133" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="454.567" y="221.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="454.567" dy="0">2</tspan></text><text x="672.133" y="221.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="672.133" dy="0">2</tspan></text><rect x="244" y="244" width="0" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="244" y="244" width="421.133" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="454.567" y="261.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="454.567" dy="0">2</tspan></text><text x="672.133" y="261.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="672.133" dy="0">2</tspan></text><text x="559.85" y="321" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="559.85" dy="0">Escenarios</tspan></text><rect x="10" y="335" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="359.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Seis de doce escenarios fallan y cuatro de ellos por la misma pieza: el almacenamiento de archivos y su revisión limitan el</tspan></text><text x="470" y="376.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">pico. Los números salen de un modelo con latencias p95 sumadas, disponibilidades por componente y capacidades supuestas;</tspan></text><text x="470" y="393.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">sirve para encontrar dónde mirar, no para predecir el comportamiento de un sistema real.</tspan></text><text x="470" y="440.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
