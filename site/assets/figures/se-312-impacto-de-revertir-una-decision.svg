<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 567" width="940" height="567" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Escenarios que dependen de los componentes de cada decisión y los que su ADR no declara</title><desc id="d">Barras agrupadas con, para cuatro decisiones, los escenarios de doce que dependen de sus componentes, los que su ADR declara y los no declarados: revertir el monolito modular afecta a 10 escenarios y el ADR declara 2, con 9 sin declarar; subir archivos por URL firmada afecta a 8 con 3 declarados; la revisión asíncrona a 7 con 3; las tres instancias a 10 con 4.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="567" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Escenarios que dependen de los componentes de cada decisión y los que su ADR no declara</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Afectados</tspan></text><rect x="131.86" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="151.86" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="151.86" dy="0">Declarados en el ADR</tspan></text><rect x="330.66" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="350.66" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="350.66" dy="0">Sin declarar</tspan></text><line x1="71.08" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="375" x2="71.08" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="328.333" x2="920" y2="328.333" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="328.333" x2="71.08" y2="328.333" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="332.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">2</tspan></text><line x1="71.08" y1="281.667" x2="920" y2="281.667" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="281.667" x2="71.08" y2="281.667" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="286.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">4</tspan></text><line x1="71.08" y1="235" x2="920" y2="235" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="235" x2="71.08" y2="235" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="239.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">6</tspan></text><line x1="71.08" y1="188.333" x2="920" y2="188.333" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="188.333" x2="71.08" y2="188.333" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="192.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">8</tspan></text><line x1="71.08" y1="141.667" x2="920" y2="141.667" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="141.667" x2="71.08" y2="141.667" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="146.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="95" x2="71.08" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">12</tspan></text><line x1="71.08" y1="95" x2="71.08" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">Escenarios (de 12)</text><rect x="92.303" y="188.333" width="53.928" height="186.667" rx="3" fill="#c0432f"/><text x="119.267" y="182.333" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="119.267" dy="0">8</tspan></text><rect x="150.231" y="305" width="53.928" height="70" rx="3" fill="#087f8c"/><text x="177.195" y="299" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177.195" dy="0">3</tspan></text><rect x="208.159" y="258.333" width="53.928" height="116.667" rx="3" fill="#946512"/><text x="235.123" y="252.333" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="235.123" dy="0">5</tspan></text><text x="177.195" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="177.195" dy="0">ADR-1 · URL firmada de</tspan></text><text x="177.195" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="177.195" dy="0">subida</tspan></text><rect x="304.533" y="141.667" width="53.928" height="233.333" rx="3" fill="#c0432f"/><text x="331.497" y="135.667" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="331.497" dy="0">10</tspan></text><rect x="362.461" y="328.333" width="53.928" height="46.6667" rx="3" fill="#087f8c"/><text x="389.425" y="322.333" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="389.425" dy="0">2</tspan></text><rect x="420.389" y="165" width="53.928" height="210" rx="3" fill="#946512"/><text x="447.353" y="159" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="447.353" dy="0">9</tspan></text><text x="389.425" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="389.425" dy="0">ADR-2 · monolito modular</tspan></text><rect x="516.763" y="211.667" width="53.928" height="163.333" rx="3" fill="#c0432f"/><text x="543.727" y="205.667" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="543.727" dy="0">7</tspan></text><rect x="574.691" y="305" width="53.928" height="70" rx="3" fill="#087f8c"/><text x="601.655" y="299" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="601.655" dy="0">3</tspan></text><rect x="632.619" y="281.667" width="53.928" height="93.3333" rx="3" fill="#946512"/><text x="659.583" y="275.667" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="659.583" dy="0">4</tspan></text><text x="601.655" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="601.655" dy="0">ADR-3 · revisión asíncrona</tspan></text><rect x="728.993" y="141.667" width="53.928" height="233.333" rx="3" fill="#c0432f"/><text x="755.957" y="135.667" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="755.957" dy="0">10</tspan></text><rect x="786.921" y="281.667" width="53.928" height="93.3333" rx="3" fill="#087f8c"/><text x="813.885" y="275.667" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="813.885" dy="0">4</tspan></text><rect x="844.849" y="235" width="53.928" height="140" rx="3" fill="#946512"/><text x="871.813" y="229" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="871.813" dy="0">6</tspan></text><text x="813.885" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="813.885" dy="0">ADR-4 · tres instancias</tspan></text><rect x="10" y="444" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="468.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">El grafo decisión → componente → escenario muestra que los ADR declaran menos dependencias de las reales: una decisión</tspan></text><text x="470" y="485.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">estructural como el monolito modular toca casi todo. Por eso un ADR lista los escenarios que podría romper, y esa lista se</tspan></text><text x="470" y="502.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">regenera desde el modelo en lugar de escribirse de memoria.</tspan></text><text x="470" y="549.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
