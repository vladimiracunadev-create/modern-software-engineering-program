<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 379" width="990" height="379" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Escenarios que dependen de los componentes de cada decisión y los que su ADR no declara</title><desc id="d">Tabla: al revertir la decisión del monolito modular dependen de sus componentes 10 de 12 escenarios, pero el ADR solo declara 2, es decir 9 sin declarar; la decisión de subir archivos por URL firmada afecta a 8 escenarios con 3 declarados; hay que re-ejecutar entre 4 y 5 funciones de aptitud según la decisión.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="990" height="379" fill="#ffffff"/><rect x="10" y="12" width="344" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="182" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="182" dy="0">Decisión</tspan></text><rect x="360" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="432" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="432" dy="0">Escenarios</tspan></text><text x="432" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="432" dy="0">afectados</tspan></text><rect x="510" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="582" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="582" dy="0">Declarados en el</tspan></text><text x="582" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="582" dy="0">ADR</tspan></text><rect x="660" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="717" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="717" dy="0">Sin declarar</tspan></text><rect x="780" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="877" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="877" dy="0">Funciones de aptitud a</tspan></text><text x="877" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="877" dy="0">re-ejecutar</tspan></text><rect x="10" y="56" width="344" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="182" y="82.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">ADR-1 · subir archivos por URL firmada</tspan></text><rect x="360" y="56" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">8</tspan></text><rect x="510" y="56" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">3</tspan></text><rect x="660" y="56" width="114" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">5</tspan></text><rect x="780" y="56" width="194" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="877" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="877" dy="0">F1, F2, F5, F6</tspan></text><rect x="10" y="108" width="344" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="182" y="134.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">ADR-2 · monolito modular</tspan></text><rect x="360" y="108" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">10</tspan></text><rect x="510" y="108" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">2</tspan></text><rect x="660" y="108" width="114" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">9</tspan></text><rect x="780" y="108" width="194" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="877" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="877" dy="0">F1, F2, F3, F5, F6</tspan></text><rect x="10" y="160" width="344" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="182" y="186.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">ADR-3 · revisión asíncrona</tspan></text><rect x="360" y="160" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">7</tspan></text><rect x="510" y="160" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">3</tspan></text><rect x="660" y="160" width="114" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">4</tspan></text><rect x="780" y="160" width="194" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="877" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="877" dy="0">F1, F2, F4, F6</tspan></text><rect x="10" y="212" width="344" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="182" y="238.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182" dy="0">ADR-4 · tres instancias</tspan></text><rect x="360" y="212" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="238.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">10</tspan></text><rect x="510" y="212" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="238.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">4</tspan></text><rect x="660" y="212" width="114" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="238.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">6</tspan></text><rect x="780" y="212" width="194" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="877" y="238.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="877" dy="0">F1, F2, F3, F5, F6</tspan></text><rect x="10" y="268" width="970" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="495" y="292.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="495" dy="0">El grafo decisión → componente → escenario muestra que los ADR declaran menos dependencias de las reales: una decisión estructural</tspan></text><text x="495" y="309.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="495" dy="0">como el monolito modular toca casi todo. Por eso un ADR lista los escenarios que podría romper, y esa lista se regenera desde el</tspan></text><text x="495" y="326.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="495" dy="0">modelo en lugar de escribirse de memoria.</tspan></text><text x="495" y="365.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
