nt-weight="400" fill="#142231"><tspan x="652" dy="0">99,919 %</tspan></text><rect x="730" y="56" width="114" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">60 %</tspan></text><rect x="850" y="56" width="144" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="922" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="922" dy="0">40,0</tspan></text><rect x="10" y="120" width="274" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="147" y="152.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="147" dy="0">Monolito modular</tspan></text><rect x="290" y="120" width="144" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">50 rps</tspan></text><rect x="440" y="120" width="134" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="507" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">99,794 %</tspan></text><rect x="580" y="120" width="144" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">99,951 %</tspan></text><rect x="730" y="120" width="114" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">74 %</tspan></text><rect x="850" y="120" width="144" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="922" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="922" dy="0">40,0</tspan></text><rect x="10" y="184" width="274" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="147" y="216.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="147" dy="0">Monolito + archivos asíncronos</tspan></text><rect x="290" y="184" width="144" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">120 rps</tspan></text><rect x="440" y="184" width="134" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="507" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">99,794 %</tspan></text><rect x="580" y="184" width="144" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">99,951 %</tspan></text><rect x="730" y="184" width="114" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">74 %</tspan></text><rect x="850" y="184" width="144" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="922" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="922" dy="0">0,0</tspan></text><rect x="10" y="248" width="274" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="147" y="280.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="147" dy="0">Propuesta final (más instancias)</tspan></text><rect x="290" y="248" width="144" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="280.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">135 rps</tspan></text><rect x="440" y="248" width="134" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="507" y="280.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">99,794 %</tspan></text><rect x="580" y="248" width="144" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="280.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">99,951 %</tspan></text><rect x="730" y="248" width="114" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="280.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">74 %</tspan></text><rect x="850" y="248" width="144" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="922" y="280.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="922" dy="0">0,0</tspan></text><rect x="10" y="316" width="990" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="505" y="340.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="505" dy="0">Añadir instancias elimina la saturación pero no mejora la disponibilidad: lo domina la causa común. Eso obliga a una decisión de</tspan></text><text x="505" y="357.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="505" dy="0">negocio escrita en un ADR: aceptar 99,9 % o invertir en aislar la causa común. Caídas con duración exponencial de 20 minutos y 30 %</tspan></text><text x="505" y="374.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="505" dy="0">de causa común: supuestos del autor, no datos de un sistema.</tspan></text><text x="505" y="413.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="505" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
