<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 387" width="880" height="387" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una tabla plana frente a un modelo normalizado (5 000 entregas, 800 estudiantes, 40 cursos)</title><desc id="d">Tabla: al renombrar un curso, la tabla plana actualiza 112 filas y, si el lote se corta tras 100, deja dos nombres distintos; el modelo normalizado cambia una fila. Al borrar las entregas de un curso, la tabla plana lo pierde. La plana ocupa 483 328 bytes y la normalizada 147 456.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="880" height="387" fill="#ffffff"/><rect x="10" y="12" width="514" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="267" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="267" dy="0">Medida</tspan></text><rect x="530" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="612" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="612" dy="0">Tabla plana</tspan></text><rect x="700" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="782" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="782" dy="0">Normalizado</tspan></text><rect x="10" y="56" width="514" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="83.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="267" dy="0">Filas que se actualizan al renombrar un curso</tspan></text><rect x="530" y="56" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="612" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612" dy="0">112</tspan></text><rect x="700" y="56" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">1</tspan></text><rect x="10" y="110" width="514" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="137.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="267" dy="0">Nombres distintos del curso si el lote se corta tras 100 filas</tspan></text><rect x="530" y="110" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="612" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612" dy="0">2</tspan></text><rect x="700" y="110" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">1</tspan></text><rect x="10" y="164" width="514" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="191.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="267" dy="0">Cursos visibles tras borrar las entregas del curso 40</tspan></text><rect x="530" y="164" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="612" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612" dy="0">39</tspan></text><rect x="700" y="164" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">40</tspan></text><rect x="10" y="218" width="514" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="245.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="267" dy="0">Tamaño del archivo con 5 000 entregas, tras VACUUM (bytes)</tspan></text><rect x="530" y="218" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="612" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612" dy="0">483 328</tspan></text><rect x="700" y="218" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">147 456</tspan></text><rect x="10" y="276" width="860" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="440" y="300.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="440" dy="0">La redundancia no es un problema de espacio sino de verdad: el mismo hecho vive en 112 lugares y cada escritura</tspan></text><text x="440" y="317.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="440" dy="0">parcial deja dos versiones. Un curso que solo existe como columna de las entregas desaparece con la última entrega.</tspan></text><text x="440" y="334.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="440" dy="0">Los nombres, las cifras y la interrupción tras 100 filas son construcciones del autor.</tspan></text><text x="440" y="373.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="440" dy="0">Datos sintéticos con semilla fija; SQLite 3.45 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
