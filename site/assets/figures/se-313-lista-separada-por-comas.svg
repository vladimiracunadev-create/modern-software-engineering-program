<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 333" width="940" height="333" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Estudiantes de un grupo guardados como lista de identificadores (3 000 grupos, 800 estudiantes)</title><desc id="d">Tabla: buscar los grupos de cada estudiante con LIKE sobre una lista separada por comas devuelve 33 099 resultados cuando los correctos son 7 408, con 25 691 falsos positivos y 99 estudiantes con resultado erróneo; con delimitadores o con una tabla intermedia el resultado es exacto, y solo la tabla intermedia permite una clave foránea.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="333" fill="#ffffff"/><rect x="10" y="12" width="424" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="222" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="222" dy="0">Modelo</tspan></text><rect x="440" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="512" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="512" dy="0">Resultados</tspan></text><rect x="590" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="672" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="672" dy="0">Falsos positivos</tspan></text><rect x="760" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="842" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="842" dy="0">Permite clave</tspan></text><text x="842" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="842" dy="0">foránea</tspan></text><rect x="10" y="56" width="424" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="83.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Lista en una columna, LIKE &#x27;%12%&#x27;</tspan></text><rect x="440" y="56" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">33 099</tspan></text><rect x="590" y="56" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">25 691</tspan></text><rect x="760" y="56" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">No</tspan></text><rect x="10" y="110" width="424" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="137.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Lista en una columna, con comas alrededor</tspan></text><rect x="440" y="110" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">7 408</tspan></text><rect x="590" y="110" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">0</tspan></text><rect x="760" y="110" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">No</tspan></text><rect x="10" y="164" width="424" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="191.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Tabla intermedia estudiante-grupo</tspan></text><rect x="440" y="164" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">7 408</tspan></text><rect x="590" y="164" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">0</tspan></text><rect x="760" y="164" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">Sí</tspan></text><rect x="10" y="222" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="246.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El estudiante 12 aparece al buscar 1, 2, 12, 112 o 120: 99 de los 800 identificadores (los de uno y dos dígitos) dan un</tspan></text><text x="470" y="263.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">resultado equivocado. Arreglar la búsqueda con delimitadores corrige la consulta pero no impide guardar un identificador</tspan></text><text x="470" y="280.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">inexistente ni permite un índice.</tspan></text><text x="470" y="319.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; SQLite 3.45 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
