<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 390" width="940" height="390" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Grupos devueltos al buscar los grupos de cada estudiante (800 búsquedas, 3 000 grupos)</title><desc id="d">Barras apiladas horizontales con los grupos devueltos por las 800 búsquedas: la lista con LIKE devuelve 33 099 resultados de los que 7 408 son correctos y 25 691 son falsos positivos; con comas alrededor del patrón o con una tabla intermedia se devuelven solo los 7 408 correctos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="390" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Grupos devueltos al buscar los grupos de cada estudiante (800 búsquedas, 3 000 grupos)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Resultados correctos</tspan></text><rect x="214.8" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="234.8" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="234.8" dy="0">Falsos positivos</tspan></text><line x1="274" y1="77" x2="274" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="209" x2="274" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0</tspan></text><line x1="424.425" y1="77" x2="424.425" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="424.425" y1="209" x2="424.425" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="424.425" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="424.425" dy="0">10 000</tspan></text><line x1="574.85" y1="77" x2="574.85" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="574.85" y1="209" x2="574.85" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="574.85" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="574.85" dy="0">20 000</tspan></text><line x1="725.275" y1="77" x2="725.275" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="725.275" y1="209" x2="725.275" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="725.275" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="725.275" dy="0">30 000</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="209" x2="875.7" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">40 000</tspan></text><line x1="274" y1="209" x2="875.7" y2="209" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="103.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Lista separada por comas con LIKE</tspan></text><text x="264" y="139" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Lista con comas alrededor del</tspan></text><text x="264" y="156" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">patrón</tspan></text><text x="264" y="191.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Tabla intermedia estudiante-grupo</tspan></text><rect x="274" y="84" width="111.435" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="329.717" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="329.717" dy="0">7 408</tspan></text><rect x="385.435" y="84" width="386.457" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="578.663" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="578.663" dy="0">25 691</tspan></text><text x="778.892" y="103.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="778.892" dy="0">33 099</tspan></text><rect x="274" y="128" width="111.435" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="329.717" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="329.717" dy="0">7 408</tspan></text><rect x="385.435" y="128" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="392.435" y="147.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="392.435" dy="0">7 408</tspan></text><rect x="274" y="172" width="111.435" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="329.717" y="191.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="329.717" dy="0">7 408</tspan></text><rect x="385.435" y="172" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="392.435" y="191.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="392.435" dy="0">7 408</tspan></text><text x="574.85" y="253" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="574.85" dy="0">Grupos devueltos por las 800 búsquedas</tspan></text><rect x="10" y="267" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="291.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El estudiante 12 aparece al buscar 1, 2, 12, 112 o 120: 99 de los 800 identificadores (los de uno y dos dígitos) dan un</tspan></text><text x="470" y="308.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">resultado equivocado. Arreglar la búsqueda con delimitadores corrige la consulta pero no impide guardar un identificador</tspan></text><text x="470" y="325.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">inexistente ni permite un índice: solo la tabla intermedia admite una clave foránea.</tspan></text><text x="470" y="372.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; SQLite 3.45 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
