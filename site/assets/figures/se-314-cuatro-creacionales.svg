<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro patrones creacionales: la fuerza que atacan y lo que se midió</title><desc id="d">Diagrama de cuatro patrones creacionales con la fuerza que atacan y lo medido: Factory con registro rechaza al crear 2 de 5 pedidos erróneos; Builder con argumentos con nombre rechaza las 500 llamadas con tipos intercambiados que la forma posicional aceptaba; Singleton hace fallar 18 de 24 ordenaciones de pruebas con estado mutable; Prototype contamina 1 000 clones con copia superficial y 1 con profunda.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="470" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuatro patrones creacionales: la fuerza que atacan y lo que se midió</tspan></text><rect x="14" y="163.88" width="250" height="70" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="139" y="185.88" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="139" dy="0">Cuatro patrones creacionales</tspan></text><text x="139" y="202.52" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="139" dy="0">la fuerza que atacan y lo que</tspan></text><text x="139" y="219.16" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="139" dy="0">se midió</tspan></text><rect x="334" y="49" width="592" height="69.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="630" y="70.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="630" dy="0">Factory con registro</tspan></text><text x="630" y="87.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">ataca el canal desconocido · rechaza al crear: 2 de 5 pedidos erróneos se</tspan></text><text x="630" y="104.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">detectan antes de enviar</tspan></text><polyline points="264,198.88 299,198.88 299,83.96 334,83.96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="334" y="130.92" width="592" height="69.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="630" y="152.88" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="630" dy="0">Builder / argumentos con nombre</tspan></text><text x="630" y="169.52" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">ataca argumentos del mismo tipo intercambiados · 500 de 500 llamadas</tspan></text><text x="630" y="186.16" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">posicionales aceptadas; con kw_only se rechazan las 500</tspan></text><polyline points="264,198.88 299,198.88 299,165.88 334,165.88" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="334" y="212.84" width="592" height="69.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="630" y="234.8" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="630" dy="0">Singleton</tspan></text><text x="630" y="251.44" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="630" dy="0">ofrece un único punto de acceso · 18 de 24 ordenaciones de pruebas fallan con</tspan></text><text x="630" y="268.08" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="630" dy="0">estado mutable</tspan></text><polyline points="264,198.88 299,198.88 299,247.8 334,247.8" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><rect x="334" y="294.76" width="592" height="54" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="630" y="317.08" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="630" dy="0">Prototype</tspan></text><text x="630" y="333.72" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="630" dy="0">copiar un objeto configurado · superficial: 1 000 contaminados; profunda: 1</tspan></text><polyline points="264,198.88 299,198.88 299,321.76 334,321.76" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="362.76" width="920" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="387.72" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">En Python, argumentos con nombre y dataclasses sustituyen buena parte del Builder; el mecanismo del patrón sigue siendo</tspan></text><text x="470" y="404.36" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">útil en lenguajes sin ellos.</tspan></text><text x="470" y="452.04" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad (CPython 3.12, Windows 11); los recuentos son deterministas y los tiempos varían de equipo en equipo.</tspan></text></svg>
