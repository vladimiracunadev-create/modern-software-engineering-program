<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 411" width="940" height="411" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una transferencia de cupos en cuatro pasos, cortada antes de cada paso</title><desc id="d">Diagrama de secuencia de los cuatro pasos de una transferencia de cupos y del estado que deja un corte antes de cada uno: sin transacción, cortar antes del paso 2, 3 o 4 deja un registro huérfano, una suma de cupos de 55 en vez de 60 o un registro que nunca se cierra; con una transacción, todos los cortes dejan el estado anterior intacto.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="411" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Una transferencia de cupos en cuatro pasos, cortada antes de cada paso</tspan></text><line x1="284" y1="51" x2="284" y2="213" stroke="#d5dde1" stroke-width="1"/><line x1="284" y1="213" x2="284" y2="218" stroke="#5b7280" stroke-width="1.4"/><text x="284" y="234" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="284" dy="0">0</tspan></text><line x1="409.6" y1="51" x2="409.6" y2="213" stroke="#d5dde1" stroke-width="1"/><line x1="409.6" y1="213" x2="409.6" y2="218" stroke="#5b7280" stroke-width="1.4"/><text x="409.6" y="234" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="409.6" dy="0">1</tspan></text><line x1="535.2" y1="51" x2="535.2" y2="213" stroke="#d5dde1" stroke-width="1"/><line x1="535.2" y1="213" x2="535.2" y2="218" stroke="#5b7280" stroke-width="1.4"/><text x="535.2" y="234" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="535.2" dy="0">2</tspan></text><line x1="660.8" y1="51" x2="660.8" y2="213" stroke="#d5dde1" stroke-width="1"/><line x1="660.8" y1="213" x2="660.8" y2="218" stroke="#5b7280" stroke-width="1.4"/><text x="660.8" y="234" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="660.8" dy="0">3</tspan></text><line x1="786.4" y1="51" x2="786.4" y2="213" stroke="#d5dde1" stroke-width="1"/><line x1="786.4" y1="213" x2="786.4" y2="218" stroke="#5b7280" stroke-width="1.4"/><text x="786.4" y="234" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="786.4" dy="0">4</tspan></text><line x1="912" y1="51" x2="912" y2="213" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="213" x2="912" y2="218" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="234" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">5</tspan></text><line x1="284" y1="213" x2="912" y2="213" stroke="#5b7280" stroke-width="1.6"/><text x="274" y="82.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="274" dy="0">Pasos de la transferencia</tspan></text><text x="274" y="128" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="274" dy="0">Sin transacción: estado si se corta</tspan></text><text x="274" y="145" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="274" dy="0">antes del paso</tspan></text><text x="274" y="182" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="274" dy="0">Con una transacción: estado si se</tspan></text><text x="274" y="199" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="274" dy="0">corta</tspan></text><rect x="284" y="60" width="125.6" height="36" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="346.8" y="82.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="346.8" dy="0">1 registrar</tspan></text><rect x="409.6" y="60" width="125.6" height="36" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="472.4" y="82.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="472.4" dy="0">2 descontar 5</tspan></text><rect x="535.2" y="60" width="125.6" height="36" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="598" y="82.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="598" dy="0">3 sumar 5</tspan></text><rect x="660.8" y="60" width="125.6" height="36" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="723.6" y="82.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="723.6" dy="0">4 cerrar</tspan></text><rect x="786.4" y="60" width="125.6" height="36" rx="4" fill="#6b7c86" stroke="#ffffff" stroke-width="1"/><text x="849.2" y="82.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="849.2" dy="0">fin</tspan></text><line x1="14" y1="105" x2="912" y2="105" stroke="#d5dde1" stroke-width="1"/><rect x="284" y="114" width="125.6" height="36" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="346.8" y="136.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="346.8" dy="0">consistente</tspan></text><rect x="409.6" y="114" width="125.6" height="36" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="472.4" y="136.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="472.4" dy="0">huérfano</tspan></text><rect x="535.2" y="114" width="125.6" height="36" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="598" y="136.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="598" dy="0">suma de 55</tspan></text><rect x="660.8" y="114" width="125.6" height="36" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="723.6" y="136.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="723.6" dy="0">abierto</tspan></text><rect x="786.4" y="114" width="125.6" height="36" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="849.2" y="136.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="849.2" dy="0">completado</tspan></text><line x1="14" y1="159" x2="912" y2="159" stroke="#d5dde1" stroke-width="1"/><rect x="284" y="168" width="502.4" height="36" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="535.2" y="190.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="535.2" dy="0">el estado anterior queda intacto</tspan></text><rect x="786.4" y="168" width="125.6" height="36" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="849.2" y="190.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="849.2" dy="0">completado</tspan></text><text x="598" y="257" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="598" dy="0">Punto de corte: antes del paso indicado (el último no corta)</tspan></text><rect x="10" y="271" width="920" height="92.56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="295.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Tres de cuatro cortes dejan el sistema inconsistente sin transacción y ninguno con ella: «huérfano» es un registro</tspan></text><text x="470" y="312.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">«iniciado» sin movimiento, «suma de 55» pierde 5 cupos y «abierto» deja el registro «iniciado» para siempre. La atomicidad</tspan></text><text x="470" y="329.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">es la propiedad de que el corte no es observable, no de que los pasos sean rápidos. El corte es una excepción lanzada en el</tspan></text><text x="470" y="345.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">cliente, no un apagón del servidor.</tspan></text><text x="470" y="393.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; SQLite 3.45 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
