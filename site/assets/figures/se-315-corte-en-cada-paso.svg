<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 441" width="940" height="441" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una transferencia de cupos en cuatro pasos, cortada antes de cada paso</title><desc id="d">Tabla: sin transacción, un corte antes de los pasos 2, 3 o 4 deja un registro huérfano, una suma de cupos de 55 en vez de 60 o un registro que nunca se cierra; con una transacción, todos los cortes dejan el estado anterior intacto.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="441" fill="#ffffff"/><rect x="10" y="12" width="414" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="217" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="217" dy="0">Momento del corte</tspan></text><rect x="430" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="592" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="592" dy="0">Cada paso confirmado solo</tspan></text><rect x="760" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="842" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="842" dy="0">Una transacción</tspan></text><rect x="10" y="56" width="414" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="83.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Antes del paso 1 (registro del movimiento)</tspan></text><rect x="430" y="56" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">Consistente</tspan></text><rect x="760" y="56" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">Consistente</tspan></text><rect x="10" y="110" width="414" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="137.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Antes del paso 2 (descontar 5 cupos)</tspan></text><rect x="430" y="110" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">Registro «iniciado» sin movimiento</tspan></text><rect x="760" y="110" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">Consistente</tspan></text><rect x="10" y="164" width="414" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="191.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Antes del paso 3 (sumar 5 cupos)</tspan></text><rect x="430" y="164" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">Suma de cupos 55: se pierden 5</tspan></text><rect x="760" y="164" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">Consistente</tspan></text><rect x="10" y="218" width="414" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="245.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Antes del paso 4 (cerrar el registro)</tspan></text><rect x="430" y="218" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="237.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">Cupos bien; registro «iniciado» para</tspan></text><text x="592" y="253.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">siempre</tspan></text><rect x="760" y="218" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">Consistente</tspan></text><rect x="10" y="272" width="414" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="299.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Sin corte</tspan></text><rect x="430" y="272" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="299.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">Completado</tspan></text><rect x="760" y="272" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="299.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">Completado</tspan></text><rect x="10" y="330" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="354.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Tres de cuatro cortes dejan el sistema inconsistente sin transacción y ninguno con ella. La atomicidad es la propiedad de</tspan></text><text x="470" y="371.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">que el corte no es observable, no de que los pasos sean rápidos. El corte es una excepción lanzada en el cliente, no un</tspan></text><text x="470" y="388.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">apagón del servidor.</tspan></text><text x="470" y="427.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; SQLite 3.45 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
