<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 488" width="940" height="488" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Observer y Command: fugas, aislamiento de fallos y deshacer, medidos</title><desc id="d">Diagrama de cinco medidas de Observer y Command: con referencias fuertes quedan vivos 1 000 de 1 000 oyentes descartados y con referencias débiles 0; sin aislamiento un oyente que falla impide la entrega a los demás y con aislamiento se entrega a 3 y se registra 1 error; el deshacer recupera el estado inicial en 200 de 200 secuencias.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="488" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Observer y Command: fugas, aislamiento de fallos y deshacer, medidos</tspan></text><rect x="14" y="173" width="250" height="70" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="139" y="195" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="139" dy="0">Observer y Command</tspan></text><text x="139" y="211.64" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="139" dy="0">fugas, aislamiento de fallos y</tspan></text><text x="139" y="228.28" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="139" dy="0">deshacer</tspan></text><rect x="334" y="49" width="592" height="54" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="630" y="71.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="630" dy="0">Observer con referencias fuertes</tspan></text><text x="630" y="87.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="630" dy="0">1 000 oyentes descartados sin darse de baja: 1 000 siguen vivos</tspan></text><polyline points="264,208 299,208 299,76 334,76" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><rect x="334" y="115" width="592" height="54" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="630" y="137.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="630" dy="0">Observer con referencias débiles</tspan></text><text x="630" y="153.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">los mismos 1 000 oyentes: 0 siguen vivos</tspan></text><polyline points="264,208 299,208 299,142 334,142" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="334" y="181" width="592" height="54" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="630" y="203.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="630" dy="0">Notificación sin aislamiento</tspan></text><text x="630" y="219.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="630" dy="0">4 oyentes, el segundo falla: entrega a 1 oyente</tspan></text><polyline points="264,208 299,208 299,208 334,208" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><rect x="334" y="247" width="592" height="54" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="630" y="269.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="630" dy="0">Notificación con aislamiento</tspan></text><text x="630" y="285.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">4 oyentes, el segundo falla: entrega a 3 y registra 1 error</tspan></text><polyline points="264,208 299,208 299,274 334,274" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="334" y="313" width="592" height="54" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="630" y="335.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="630" dy="0">Command con deshacer</tspan></text><text x="630" y="351.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">200 secuencias aleatorias: estado inicial recuperado en 200 de 200</tspan></text><polyline points="264,208 299,208 299,340 334,340" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="381" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="405.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El Observer desacopla al emisor de los receptores, pero deja a su cargo el ciclo de vida de los oyentes y el aislamiento de</tspan></text><text x="470" y="422.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">sus fallos: sin ellos, el desacoplamiento es una trampa.</tspan></text><text x="470" y="470.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad (CPython 3.12, Windows 11); los recuentos son deterministas y los tiempos varían de equipo en equipo.</tspan></text></svg>
