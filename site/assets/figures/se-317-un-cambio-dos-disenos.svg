<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 534" width="940" height="534" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El mismo cambio de regla, un descuento del 10 % hecho en un solo lugar, en dos diseños</title><desc id="d">Barras agrupadas con dos diseños del cálculo de totales ante un descuento del 10 por ciento aplicado en un solo lugar: en el diseño A, 3 clases leen el precio ajeno y la fórmula está copiada 3 veces, y los totales quedan inconsistentes (33,5 y 35); en el diseño B, con el Experto en información, 0 clases leen el precio ajeno, hay 2 copias y los totales coinciden (33,5 y 33,5).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="534" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">El mismo cambio de regla, un descuento del 10 % hecho en un solo lugar, en dos diseños</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Clases que leen el precio ajeno</tspan></text><rect x="297.74" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="317.74" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="317.74" dy="0">Copias de la fórmula</tspan></text><line x1="63.54" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="375" x2="63.54" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">0</tspan></text><line x1="63.54" y1="305" x2="920" y2="305" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="305" x2="63.54" y2="305" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="309.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">1</tspan></text><line x1="63.54" y1="235" x2="920" y2="235" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="235" x2="63.54" y2="235" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="239.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">2</tspan></text><line x1="63.54" y1="165" x2="920" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="165" x2="63.54" y2="165" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="169.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">3</tspan></text><line x1="63.54" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="95" x2="63.54" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">4</tspan></text><line x1="63.54" y1="95" x2="63.54" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">Clases o copias</text><rect x="106.363" y="165" width="169.292" height="210" rx="3" fill="#c0432f"/><text x="191.009" y="159" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="191.009" dy="0">3</tspan></text><rect x="279.655" y="165" width="169.292" height="210" rx="3" fill="#946512"/><text x="364.301" y="159" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="364.301" dy="0">3</tspan></text><text x="277.655" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="277.655" dy="0">A: la lógica vive en quien la usa</tspan></text><rect x="534.593" y="373" width="169.292" height="2" rx="3" fill="#c0432f"/><text x="619.239" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="619.239" dy="0">0</tspan></text><rect x="707.885" y="235" width="169.292" height="140" rx="3" fill="#946512"/><text x="792.531" y="229" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="792.531" dy="0">2</tspan></text><text x="705.885" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705.885" dy="0">B: Experto en información (Linea.subtotal)</tspan></text><rect x="10" y="427" width="920" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Asignar el cálculo a quien tiene los datos (Experto en información) hace que un cambio de regla se haga en un lugar. No es</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">un teorema: es una consecuencia verificable de dónde viven los datos.</tspan></text><text x="470" y="516.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad (CPython 3.12, Windows 11); los recuentos son deterministas y los tiempos varían de equipo en equipo.</tspan></text></svg>
