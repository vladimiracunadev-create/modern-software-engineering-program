<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 471" width="930" height="471" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Valores alterados o perdidos tras aplicar una migración y su inversa (1 000 filas)</title><desc id="d">Tabla: renombrar una columna y volver no pierde nada; añadir una columna, escribir en ella y quitarla pierde las 1 000 escrituras; quitar y volver a añadir una columna pierde 666 valores; pasar una nota a entero y volver altera 937 filas; dividir y recomponer el nombre altera 66; pasar a mayúsculas y volver altera 1 000.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="471" fill="#ffffff"/><rect x="10" y="12" width="444" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="232" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="232" dy="0">Operación y su inversa</tspan></text><rect x="460" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="522" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="522" dy="0">Filas</tspan></text><text x="522" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="522" dy="0">alteradas</tspan></text><rect x="590" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="752" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="752" dy="0">Qué se pierde</tspan></text><rect x="10" y="56" width="444" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Renombrar una columna y volver</tspan></text><rect x="460" y="56" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="522" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="522" dy="0">0</tspan></text><rect x="590" y="56" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">Sin pérdida</tspan></text><rect x="10" y="106" width="444" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Añadir una columna, escribir en ella y quitarla</tspan></text><rect x="460" y="106" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="522" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="522" dy="0">1 000</tspan></text><rect x="590" y="106" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">Se pierden los datos nuevos</tspan></text><rect x="10" y="156" width="444" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Quitar la columna comentario y volver a añadirla</tspan></text><rect x="460" y="156" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="522" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="522" dy="0">666</tspan></text><rect x="590" y="156" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">Se pierden los valores</tspan></text><rect x="10" y="206" width="444" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Nota de decimal a entero y volver</tspan></text><rect x="460" y="206" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="522" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="522" dy="0">937</tspan></text><rect x="590" y="206" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">Se pierden los decimales</tspan></text><rect x="10" y="256" width="444" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Dividir el nombre en dos columnas y recomponer</tspan></text><rect x="460" y="256" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="522" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="522" dy="0">66</tspan></text><rect x="590" y="256" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">Los nombres sin coma cambian</tspan></text><rect x="10" y="306" width="444" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="331.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Pasar el nombre a mayúsculas y volver</tspan></text><rect x="460" y="306" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="522" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="522" dy="0">1 000</tspan></text><rect x="590" y="306" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">Se pierde la capitalización</tspan></text><rect x="10" y="360" width="910" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="465" y="384.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">«Tiene un down» no significa «es reversible»: solo el renombrado devuelve los mismos datos. Las demás restauran la</tspan></text><text x="465" y="401.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">estructura y pierden información; para volver de verdad hace falta una copia anterior al paso. Datos sintéticos con 5 % de</tspan></text><text x="465" y="418.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">nombres sin coma.</tspan></text><text x="465" y="457.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Datos sintéticos con semilla fija; SQLite 3.45 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
