<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 471" width="900" height="471" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Claves que cambian de nodo al añadir uno (100 000 claves) y desequilibrio con 5 nodos</title><desc id="d">Tabla: repartir por el módulo del hash mueve el 79,9 por ciento de las claves al pasar de 4 a 5 nodos y el 94,2 al pasar de 16 a 17; un anillo con 128 puntos por nodo mueve el 21,1, cerca del ideal de 20, y reduce el desequilibrio entre nodos de 2,07 veces la media a 1,06.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="900" height="471" fill="#ffffff"/><rect x="10" y="12" width="464" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="242" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="242" dy="0">Reparto</tspan></text><rect x="480" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="572" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="572" dy="0">Claves movidas</tspan></text><rect x="670" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="777" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="777" dy="0">Carga máxima / media</tspan></text><rect x="10" y="56" width="464" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Reparto por módulo N (4 → 5 nodos)</tspan></text><rect x="480" y="56" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">79,9 %</tspan></text><rect x="670" y="56" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">—</tspan></text><rect x="10" y="106" width="464" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Reparto por módulo N (16 → 17 nodos)</tspan></text><rect x="480" y="106" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">94,2 %</tspan></text><rect x="670" y="106" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">—</tspan></text><rect x="10" y="156" width="464" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Anillo de hash con 1 punto por nodo</tspan></text><rect x="480" y="156" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">41,5 %</tspan></text><rect x="670" y="156" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">2,07</tspan></text><rect x="10" y="206" width="464" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Anillo con 16 puntos por nodo</tspan></text><rect x="480" y="206" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">17,0 %</tspan></text><rect x="670" y="206" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">1,20</tspan></text><rect x="10" y="256" width="464" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Anillo con 128 puntos por nodo</tspan></text><rect x="480" y="256" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">21,1 %</tspan></text><rect x="670" y="256" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">1,06</tspan></text><rect x="10" y="306" width="464" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="331.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Anillo con 512 puntos por nodo</tspan></text><rect x="480" y="306" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">20,8 %</tspan></text><rect x="670" y="306" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">1,04</tspan></text><rect x="10" y="360" width="880" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="450" y="384.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="450" dy="0">El módulo es sencillo y obliga a mover casi todo; el anillo mueve solo lo que llega al nodo nuevo, pero con pocos</tspan></text><text x="450" y="401.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="450" dy="0">puntos reparte desigual. El ideal al pasar de 4 a 5 nodos es mover 1/5 = 20 %. Hash MD5 de claves sintéticas; ningún</tspan></text><text x="450" y="418.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="450" dy="0">motor de bases de datos real.</tspan></text><text x="450" y="457.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">Datos sintéticos con semilla fija; SQLite 3.45 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
