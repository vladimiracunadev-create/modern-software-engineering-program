<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro patrones de mensajería y lo que se midió con un canal simulado</title><desc id="d">Diagrama de cuatro patrones de mensajería con lo medido en un canal simulado: el enrutador por contenido reparte mil mensajes en 601 pagos, 206 avisos y 193 bajas; la cola de cartas muertas procesa 198 y aparta 2 con 204 intentos; el resecuenciador deja 977 pares fuera de orden a la entrada y 0 a la salida; el identificador de correlación asocia 20 de 20 respuestas frente a 1 de 20 por posición.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="470" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuatro patrones de mensajería y lo que se midió con un canal simulado</tspan></text><rect x="14" y="163.88" width="250" height="70" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="139" y="185.88" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="139" dy="0">Cuatro patrones de mensajería</tspan></text><text x="139" y="202.52" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="139" dy="0">escenario y resultado medido en</tspan></text><text x="139" y="219.16" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="139" dy="0">un canal simulado</tspan></text><rect x="334" y="49" width="592" height="54" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="630" y="71.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="630" dy="0">Content-Based Router</tspan></text><text x="630" y="87.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">mil mensajes por tipo · 601 pagos, 206 avisos, 193 bajas</tspan></text><polyline points="264,198.88 299,198.88 299,76 334,76" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="334" y="115" width="592" height="69.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="630" y="136.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="630" dy="0">Dead Letter Channel</tspan></text><text x="630" y="153.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">200 mensajes, 25 de la muestra son veneno, tope de 3 intentos · 198</tspan></text><text x="630" y="170.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">procesados, 2 a la cola de cartas muertas, 204 intentos</tspan></text><polyline points="264,198.88 299,198.88 299,149.96 334,149.96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="334" y="196.92" width="592" height="69.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="630" y="218.88" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="630" dy="0">Resequencer</tspan></text><text x="630" y="235.52" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">entrega desordenada en ventanas de 6 · 977 pares fuera de orden a la entrada,</tspan></text><text x="630" y="252.16" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">0 a la salida</tspan></text><polyline points="264,198.88 299,198.88 299,231.88 334,231.88" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="334" y="278.84" width="592" height="69.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="630" y="300.8" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="630" dy="0">Correlation Identifier</tspan></text><text x="630" y="317.44" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">20 respuestas desordenadas · 20 de 20 asociadas por identificador; 1 de 20 por</tspan></text><text x="630" y="334.08" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">posición</tspan></text><polyline points="264,198.88 299,198.88 299,313.8 334,313.8" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="362.76" width="920" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="387.72" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">El catálogo de Hohpe y Woolf da nombre a los mismos problemas que aparecen con colas, buses y sistemas de eventos de hoy;</tspan></text><text x="470" y="404.36" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">el nombre sirve para discutir, la medida para decidir.</tspan></text><text x="470" y="452.04" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación con semilla fija sobre código ejecutado de verdad (CPython 3.12); las magnitudes son de este modelo, no de un sistema real.</tspan></text></svg>
