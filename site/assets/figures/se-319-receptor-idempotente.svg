<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 322" width="940" height="322" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mil mensajes con entrega al menos una vez: 208 duplicados y la suma de pagos</title><desc id="d">Puntos unidos por una línea con la suma de los pagos de mil mensajes con entrega al menos una vez y 208 duplicados: la suma real es 15 682; sin receptor idempotente da 18 759, con un error de 3 077 por duplicados contados dos veces; con receptor idempotente da 15 682 y el error es 0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="322" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Mil mensajes con entrega al menos una vez: 208 duplicados y la suma de pagos</tspan></text><circle cx="22" cy="51" r="6" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Suma real</tspan></text><circle cx="137.86" cy="51" r="6" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="151.86" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="151.86" dy="0">Suma calculada</tspan></text><line x1="330.36" y1="77" x2="330.36" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="330.36" y1="157" x2="330.36" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="330.36" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="330.36" dy="0">0</tspan></text><line x1="444.59" y1="77" x2="444.59" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="444.59" y1="157" x2="444.59" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="444.59" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="444.59" dy="0">5 000</tspan></text><line x1="558.82" y1="77" x2="558.82" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="558.82" y1="157" x2="558.82" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="558.82" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="558.82" dy="0">10 000</tspan></text><line x1="673.05" y1="77" x2="673.05" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="673.05" y1="157" x2="673.05" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="673.05" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="673.05" dy="0">15 000</tspan></text><line x1="787.28" y1="77" x2="787.28" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="787.28" y1="157" x2="787.28" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="787.28" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787.28" dy="0">20 000</tspan></text><line x1="330.36" y1="157" x2="787.28" y2="157" stroke="#5b7280" stroke-width="1.6"/><text x="254" y="101.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="254" dy="0">Sin receptor idempotente</tspan></text><text x="254" y="141.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="254" dy="0">Con receptor idempotente</tspan></text><line x1="688.631" y1="97" x2="758.928" y2="97" stroke="#c0432f" stroke-width="4"/><circle cx="688.631" cy="97" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="758.928" cy="97" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="676.631" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="676.631" dy="0">15 682</tspan></text><text x="770.928" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="770.928" dy="0">18 759</tspan></text><text x="926" y="101.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">+3 077</tspan></text><line x1="688.631" y1="137" x2="688.631" y2="137" stroke="#c0432f" stroke-width="4"/><circle cx="688.631" cy="137" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="688.631" cy="137" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="676.631" y="141.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="676.631" dy="0">15 682</tspan></text><text x="700.631" y="141.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="700.631" dy="0">15 682</tspan></text><text x="926" y="141.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">0</tspan></text><text x="558.82" y="201" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="558.82" dy="0">Suma de pagos</tspan></text><rect x="10" y="215" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="239.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">La entrega al menos una vez es la garantía habitual y barata; la exactamente una vez se construye en el receptor. Sin</tspan></text><text x="470" y="256.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">identificadores estables, el receptor idempotente no se puede escribir.</tspan></text><text x="470" y="304.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación con semilla fija sobre código ejecutado de verdad (CPython 3.12); las magnitudes son de este modelo, no de un sistema real.</tspan></text></svg>
