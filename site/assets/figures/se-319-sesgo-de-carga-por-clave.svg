<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 335" width="960" height="335" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Carga de la partición más cargada frente a la media (8 particiones, 100 000 peticiones)</title><desc id="d">Barras: con peticiones uniformes la partición más cargada recibe 1,05 veces la media; con popularidad Zipf y hash por estudiante, 1,77; repartiendo la clave caliente en cuatro subclaves, 1,39; particionando por curso, 1,92; y con rangos contiguos de identificador, 6,76.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="335" fill="#ffffff"/><text x="430" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="430" dy="0">Claves uniformes, hash por estudiante</tspan></text><rect x="440" y="16" width="84" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="532" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="532" dy="0">1,05 ×</tspan></text><text x="430" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="430" dy="0">Estudiantes con popularidad Zipf, hash por estudiante</tspan></text><rect x="440" y="60" width="141.6" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="589.6" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="589.6" dy="0">1,77 ×</tspan></text><text x="430" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="430" dy="0">Zipf con la clave caliente repartida en 4 subclaves</tspan></text><rect x="440" y="104" width="111.2" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="559.2" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="559.2" dy="0">1,39 ×</tspan></text><text x="430" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="430" dy="0">Zipf, partición por curso (50 cursos)</tspan></text><rect x="440" y="148" width="153.6" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="601.6" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="601.6" dy="0">1,92 ×</tspan></text><text x="430" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="430" dy="0">Zipf, rangos contiguos de identificador</tspan></text><rect x="440" y="192" width="540.8" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="988.8" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="988.8" dy="0">6,76 ×</tspan></text><rect x="10" y="240" width="940" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Una sola clave recibe el 15,8 % de las peticiones: ninguna función de reparto la divide, hay que cambiar la clave. Repartirla</tspan></text><text x="480" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">en subclaves mejora la escritura y obliga a leer las cuatro. La popularidad Zipf con exponente 1,1 es un supuesto del autor.</tspan></text><text x="480" y="321.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Datos sintéticos con semilla fija; SQLite 3.45 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
