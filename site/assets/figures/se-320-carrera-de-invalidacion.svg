<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 357" width="940" height="357" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una lectura y una escritura concurrentes sobre la misma clave: órdenes que dejan la caché vieja</title><desc id="d">Tabla: de los seis órdenes posibles de dos pasos de un lector y dos de un escritor, escribir en la base y luego borrar la clave deja la caché con el valor viejo en un orden; borrar primero y escribir después en dos; guardar con versión y no sobrescribir una más nueva, en ninguno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="357" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Orden del escritor</tspan></text><rect x="340" y="12" width="94" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="387" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="387" dy="0">Órdenes</tspan></text><rect x="440" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="502" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="502" dy="0">Caché vieja</tspan></text><rect x="570" y="12" width="354" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="747" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="747" dy="0">Cuándo ocurre</tspan></text><rect x="10" y="56" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="79.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Escribir en la base y luego borrar la</tspan></text><text x="172" y="95.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">clave</tspan></text><rect x="340" y="56" width="94" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="387" y="87.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387" dy="0">6</tspan></text><rect x="440" y="56" width="124" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="87.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">1</tspan></text><rect x="570" y="56" width="354" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="87.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">R1 W1 W2 R2: la lectura vieja llega después</tspan></text><rect x="10" y="118" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="141.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Borrar la clave y luego escribir en la</tspan></text><text x="172" y="157.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">base</tspan></text><rect x="340" y="118" width="94" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="387" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387" dy="0">6</tspan></text><rect x="440" y="118" width="124" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">2</tspan></text><rect x="570" y="118" width="354" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">Un lector rellena entre las dos acciones</tspan></text><rect x="10" y="180" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="203.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Guardar con versión y no pisar una más</tspan></text><text x="172" y="219.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">nueva</tspan></text><rect x="340" y="180" width="94" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="387" y="211.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387" dy="0">6</tspan></text><rect x="440" y="180" width="124" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="211.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">0</tspan></text><rect x="570" y="180" width="354" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="211.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">Se conserva siempre la más nueva</tspan></text><rect x="10" y="246" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="270.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Mientras la clave no expire, el valor viejo se sirve para siempre: el TTL solo acota cuánto dura. El error aparece una vez</tspan></text><text x="470" y="287.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">en seis intercalaciones, es decir, es raro, no inexistente, y solo se ve con pruebas de intercalación. El modelo tiene un</tspan></text><text x="470" y="304.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">lector y un escritor.</tspan></text><text x="470" y="343.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; SQLite 3.45 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
