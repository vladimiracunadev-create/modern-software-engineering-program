<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 322" width="940" height="322" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una dependencia caída 7 segundos con 100 peticiones por segundo, con y sin circuit breaker</title><desc id="d">Barras apiladas con las 2 000 peticiones de una ventana de veinte segundos con la dependencia caída siete: sin circuit breaker las 2 000 llegan al servicio y no se rechaza ninguna; con circuit breaker llegan 1 307 y se rechazan al instante 693; los éxitos son 1 300 y 1 296.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="322" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Una dependencia caída 7 segundos con 100 peticiones por segundo, con y sin circuit breaker</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Llamadas al servicio</tspan></text><rect x="214.8" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="234.8" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="234.8" dy="0">Rechazadas al instante</tspan></text><line x1="194" y1="77" x2="194" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="194" y1="157" x2="194" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="194" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="194" dy="0">0</tspan></text><line x1="364.425" y1="77" x2="364.425" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="364.425" y1="157" x2="364.425" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="364.425" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="364.425" dy="0">500</tspan></text><line x1="534.85" y1="77" x2="534.85" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="534.85" y1="157" x2="534.85" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="534.85" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="534.85" dy="0">1 000</tspan></text><line x1="705.275" y1="77" x2="705.275" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="705.275" y1="157" x2="705.275" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="705.275" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705.275" dy="0">1 500</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="157" x2="875.7" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">2 000</tspan></text><line x1="194" y1="157" x2="875.7" y2="157" stroke="#5b7280" stroke-width="1.6"/><text x="184" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="184" dy="0">Sin circuit breaker</tspan></text><text x="184" y="141.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="184" dy="0">Con circuit breaker</tspan></text><rect x="194" y="84" width="681.7" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="534.85" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="534.85" dy="0">2 000</tspan></text><rect x="875.7" y="84" width="0" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">2 000</tspan></text><rect x="194" y="124" width="445.491" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="416.745" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="416.745" dy="0">1 307</tspan></text><rect x="639.491" y="124" width="236.209" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="757.595" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="757.595" dy="0">693</tspan></text><text x="882.7" y="141.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">2 000</tspan></text><text x="534.85" y="201" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="534.85" dy="0">Peticiones</tspan></text><rect x="10" y="215" width="920" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="239.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">El interruptor ahorra 693 llamadas a una dependencia que no puede contestar, a cambio de 4 éxitos menos por los instantes</tspan></text><text x="470" y="256.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">de la recuperación. Protege al llamante y a la dependencia caída; no repara nada.</tspan></text><text x="470" y="304.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación con semilla fija sobre código ejecutado de verdad (CPython 3.12); las magnitudes son de este modelo, no de un sistema real.</tspan></text></svg>
