pan x="96.62" dy="0">0</tspan></text><line x1="255.696" y1="87" x2="255.696" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="255.696" y1="387" x2="255.696" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="255.696" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="255.696" dy="0">20</tspan></text><line x1="414.772" y1="87" x2="414.772" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="414.772" y1="387" x2="414.772" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="414.772" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="414.772" dy="0">40</tspan></text><line x1="573.848" y1="87" x2="573.848" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="573.848" y1="387" x2="573.848" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="573.848" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="573.848" dy="0">60</tspan></text><line x1="732.924" y1="87" x2="732.924" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="732.924" y1="387" x2="732.924" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="732.924" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="732.924" dy="0">80</tspan></text><line x1="892" y1="87" x2="892" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="387" x2="892" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">100</tspan></text><line x1="78.62" y1="387" x2="910" y2="387" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 237)">Lecturas obsoletas (%)</text><text x="494.31" y="433" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Aciertos de la caché (% de lecturas)</tspan></text><polyline points="197.633,386.37 394.887,373.77 610.435,315.81 883.251,130.53" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="197.633" cy="386.37" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="197.633" y="375.37" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="197.633" dy="0">TTL 10</tspan></text><circle cx="394.887" cy="373.77" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="394.887" y="362.77" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="394.887" dy="0">TTL 100</tspan></text><circle cx="610.435" cy="315.81" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="600.435" y="320.31" font-size="13" text-anchor="end" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="600.435" dy="0">TTL 1 000</tspan></text><circle cx="883.251" cy="130.53" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="873.251" y="135.03" font-size="13" text-anchor="end" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="873.251" dy="0">Sin TTL ni invalidación</tspan></text><polyline points="596.914,387 623.162,387" fill="none" stroke="#087f8c" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="591.414" y="381.5" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><rect x="617.662" y="381.5" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="562.914" y="343" font-size="13" text-anchor="end" font-weight="400" fill="#5c1f14" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="562.914" dy="0">Invalidar al escribir:</tspan></text><text x="562.914" y="360" font-size="13" text-anchor="end" font-weight="400" fill="#5c1f14" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="562.914" dy="0">62,9 %, 0 obsoletas</tspan></text><line x1="594.834" y1="383.08" x2="570.914" y2="338" stroke="#5c1f14" stroke-width="1.2"/><text x="659.162" y="325" font-size="13" text-anchor="start" font-weight="400" fill="#5c1f14" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="659.162" dy="0">Escribir también en la</tspan></text><text x="659.162" y="342" font-size="13" text-anchor="start" font-weight="400" fill="#5c1f14" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="659.162" dy="0">caché: 66,2 %, 0 obsoletas</tspan></text><line x1="625.402" y1="381.64" x2="651.162" y2="320" stroke="#5c1f14" stroke-width="1.2"/><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El TTL cambia frescura por aciertos; la invalidación elimina la obsolescencia sin perder aciertos, pero solo si la</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">invalidación llega siempre. Las consultas a la base bajan de 165 849 con TTL de 10 a 2 000 sin TTL. Las obsolescencias no</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">incluyen las carreras de la figura siguiente: aquí el modelo es secuencial.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; SQLite 3.45 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
