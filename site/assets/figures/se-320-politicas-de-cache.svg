<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Lecturas obsoletas frente a aciertos según la política de caché (200 000 operaciones, 5 % escrituras)</title><desc id="d">Líneas con las lecturas obsoletas según los aciertos de la caché: subir el TTL de 10 a 100 y 1 000 operaciones sube los aciertos de 12,7 a 37,5 y 64,6 por ciento y las lecturas obsoletas de 0,21 a 4,41 y 23,73; sin TTL ni invalidación 98,9 por ciento de aciertos y 85,49 de obsoletas; invalidar al escribir o escribir también en la caché logra 62,9 y 66,2 por ciento de aciertos con 0 obsoletas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Lecturas obsoletas frente a aciertos según la política de caché (200 000 operaciones, 5 % escrituras)</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">TTL de 10, 100, 1 000 operaciones y sin TTL</tspan></text><rect x="388.22" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="408.22" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="408.22" dy="0">Con invalidación o escritura en la caché (TTL de 1 000)</tspan></text><line x1="78.62" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="387" x