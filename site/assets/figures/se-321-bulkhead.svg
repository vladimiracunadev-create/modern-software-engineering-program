<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 213" width="960" height="213" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una dependencia lenta de 3 segundos entre t=10 y t=30: éxito de las peticiones de la dependencia sana</title><desc id="d">Gráfico de barras con el porcentaje de peticiones de una dependencia sana que terminan dentro de 0,5 segundos mientras otra dependencia está lenta: 30,6 por ciento con un grupo compartido de 10 hilos y 100 por ciento con un compartimento propio de 8 hilos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="213" fill="#ffffff"/><text x="384" y="37" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="384" dy="0">Grupo compartido de 10 hilos</tspan></text><rect x="394" y="16" width="122.4" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="524.4" y="37" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="524.4" dy="0">30,6 %</tspan></text><text x="384" y="83" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="384" dy="0">Compartimento propio de 8 hilos</tspan></text><rect x="394" y="62" width="400" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="802" y="83" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="802" dy="0">100 %</tspan></text><rect x="10" y="110" width="940" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="480" y="134.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">Con compartimentos, la dependencia lenta solo ahoga su propio grupo (su éxito baja a 23,4 % en ambos casos). El compartimento</tspan></text><text x="480" y="151.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">no repara la dependencia lenta; limita el daño a quien depende de ella.</tspan></text><text x="480" y="199.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Simulación con semilla fija sobre código ejecutado de verdad (CPython 3.12); las magnitudes son de este modelo, no de un sistema real.</tspan></text></svg>
