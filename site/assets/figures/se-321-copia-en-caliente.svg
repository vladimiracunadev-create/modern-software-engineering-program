<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 333" width="890" height="333" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Copiar el archivo de una base mientras otra transacción mueve 20 000 cupos</title><desc id="d">Tabla: copiar el archivo de la base mientras una transacción está a medias produce una copia con suma de cupos 1 999 803 en vez de 2 000 000 y con integrity_check en ok; la API de copia en línea conserva la suma exacta.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="890" height="333" fill="#ffffff"/><rect x="10" y="12" width="494" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="257" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="257" dy="0">Método</tspan></text><rect x="510" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="602" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="602" dy="0">Suma de cupos</tspan></text><rect x="700" y="12" width="174" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="787" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="787" dy="0">integrity_check</tspan></text><rect x="10" y="56" width="494" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="83.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Base original, antes de la transferencia</tspan></text><rect x="510" y="56" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">2 000 000</tspan></text><rect x="700" y="56" width="174" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">ok</tspan></text><rect x="10" y="110" width="494" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="137.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Copia del archivo con una transacción sin confirmar</tspan></text><rect x="510" y="110" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">1 999 803</tspan></text><rect x="700" y="110" width="174" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">ok</tspan></text><rect x="10" y="164" width="494" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="191.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Copia con la API de copia en línea (backup)</tspan></text><rect x="510" y="164" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">2 000 000</tspan></text><rect x="700" y="164" width="174" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">ok</tspan></text><rect x="10" y="222" width="870" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="445" y="246.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="445" dy="0">La copia a medias está estructuralmente sana y es lógicamente falsa: integrity_check no ve un invariante de negocio.</tspan></text><text x="445" y="263.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="445" dy="0">La API la corrige tomando una instantánea consistente. Con otro tamaño de caché o de transacción, la diferencia</tspan></text><text x="445" y="280.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="445" dy="0">sería otra: lo que no cambia es que puede haber alguna.</tspan></text><text x="445" y="319.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="445" dy="0">Datos sintéticos con semilla fija; SQLite 3.45 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
