<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 351" width="980" height="351" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Pérdida de datos al fallar a una hora uniforme, según el intervalo entre puntos recuperables</title><desc id="d">Barras: con una copia diaria la pérdida media al fallar es de 723 minutos y la máxima de 1 440; con una copia cada hora, 30 y 60; archivando el registro de cambios cada 5 minutos, 2,5 y 5; cada minuto, 0,5 y 1.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="351" fill="#ffffff"/><text x="300" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Copia diaria</tspan></text><rect x="310" y="16" width="325.395" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="643.395" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="643.395" dy="0">723 min de media (máx. 1 440)</tspan></text><text x="300" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Copia cada 6 horas</tspan></text><rect x="310" y="60" width="81.18" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="399.18" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="399.18" dy="0">180 min (máx. 360)</tspan></text><text x="300" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Copia cada hora</tspan></text><rect x="310" y="104" width="13.5" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="331.5" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="331.5" dy="0">30 min (máx. 60)</tspan></text><text x="300" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Registro archivado cada 5 min</tspan></text><rect x="310" y="148" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="322" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="322" dy="0">2,5 min (máx. 5)</tspan></text><text x="300" y="211.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Registro archivado cada minuto</tspan></text><rect x="310" y="192" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="322" y="211.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="322" dy="0">0,5 min (máx. 1)</tspan></text><rect x="10" y="240" width="960" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="490" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">La pérdida media es la mitad del intervalo y la máxima es el intervalo: el objetivo de punto de recuperación se cumple por</tspan></text><text x="490" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">diseño, no por buena suerte. 20 000 fallos uniformes en 30 días; una escritura por minuto. La copia no incluye el tiempo para</tspan></text><text x="490" y="298.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">detectar el fallo.</tspan></text><text x="490" y="337.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Datos sintéticos con semilla fija; SQLite 3.45 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
