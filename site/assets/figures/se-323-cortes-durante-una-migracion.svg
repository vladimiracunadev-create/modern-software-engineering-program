<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 295" width="900" height="295" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una migración de cinco pasos cortada antes de cada paso (seis puntos de corte)</title><desc id="d">Tabla: si cada paso de la migración se confirma por separado, 4 de 6 cortes dejan un esquema intermedio con las dos columnas o solo con la nueva; si todos los pasos van en una transacción, ninguno deja un estado intermedio, porque SQLite admite DDL transaccional.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="900" height="295" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Variante</tspan></text><rect x="340" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="432" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="432" dy="0">Cortes con estado</tspan></text><text x="432" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="432" dy="0">intermedio</tspan></text><rect x="530" y="12" width="354" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="707" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="707" dy="0">Estados observados</tspan></text><rect x="10" y="56" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="87.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Cada paso confirmado por separado</tspan></text><rect x="340" y="56" width="184" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="87.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">4 de 6</tspan></text><rect x="530" y="56" width="354" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="707" y="79.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">Columnas «estado» y «estado_v2» a la vez, o</tspan></text><text x="707" y="95.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">solo «estado_v2»</tspan></text><rect x="10" y="118" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="149.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Todos los pasos en una transacción</tspan></text><rect x="340" y="118" width="184" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">0 de 6</tspan></text><rect x="530" y="118" width="354" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="707" y="141.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">Siempre el esquema anterior o el nuevo,</tspan></text><text x="707" y="157.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707" dy="0">completo</tspan></text><rect x="10" y="184" width="880" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="450" y="208.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">La seguridad de un corte depende del motor: SQLite y PostgreSQL permiten DDL transaccional, MySQL confirma</tspan></text><text x="450" y="225.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">implícitamente cada sentencia DDL. El experimento usa SQLite y un corte como excepción en el cliente; no prueba el</tspan></text><text x="450" y="242.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">comportamiento de ningún otro motor.</tspan></text><text x="450" y="281.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">Datos sintéticos con semilla fija; SQLite 3.45 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
