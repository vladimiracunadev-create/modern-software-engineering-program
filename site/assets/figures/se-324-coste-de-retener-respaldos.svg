<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 590" width="940" height="590" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Retener 30 días de una base de 40 000 filas: bytes comprimidos frente a piezas al restaurar</title><desc id="d">Dispersión con tres políticas de retención de 30 días: 30 copias completas comprimidas ocupan 16 237 980 bytes y se restauran con una sola pieza; cuatro completas semanales y 26 incrementales ocupan 11 614 707 y exigen hasta 7 piezas; una completa y 29 incrementales ocupan 11 081 253 y exigen hasta 30.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="590" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Retener 30 días de una base de 40 000 filas: bytes comprimidos frente a piezas al restaurar</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">30 copias completas</tspan></text><rect x="207.26" y="45" width="12" height="12" fill="#946512" stroke="#946512" stroke-width="2"/><text x="227.26" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="227.26" dy="0">4 completas semanales + 26 incrementales</tspan></text><polygon points="562.86,44.1 569.46,56.4 556.26,56.4" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="576.86" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="576.86" dy="0">1 completa + 29 incrementales</tspan></text><line x1="71.08" y1="407" x2="910" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="407" x2="71.08" y2="407" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="411.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="327" x2="910" y2="327" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="327" x2="71.08" y2="327" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="331.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">5</tspan></text><line x1="71.08" y1="247" x2="910" y2="247" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="247" x2="71.08" y2="247" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="251.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="167" x2="910" y2="167" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="167" x2="71.08" y2="167" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="171.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">15</tspan></text><line x1="71.08" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="87" x2="71.08" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="87" x2="71.08" y2="407" stroke="#5b7280" stroke-width="1.6"/><line x1="89.08" y1="87" x2="89.08" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="89.08" y1="407" x2="89.08" y2="412" stroke="#5b7280" stroke-width="1.4"/><text x="89.08" y="428" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="89.08" dy="0">1</tspan></text><line x1="255.201" y1="87" x2="255.201" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="255.201" y1="407" x2="255.201" y2="412" stroke="#5b7280" stroke-width="1.4"/><text x="255.201" y="428" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="255.201" dy="0">7</tspan></text><line x1="892" y1="87" x2="892" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="407" x2="892" y2="412" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="428" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">30</tspan></text><line x1="71.08" y1="407" x2="910" y2="407" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="247" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 247)">Bytes comprimidos (millones)</text><text x="490.54" y="453" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="490.54" dy="0">Piezas que hay que aplicar al restaurar, en el peor caso</tspan></text><circle cx="89.08" cy="147.192" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="99.08" y="151.692" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="99.08" dy="0">16 237 980 B</tspan></text><rect x="249.701" y="215.665" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="255.201" y="210.165" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="255.201" dy="0">11 614 707 B</tspan></text><polygon points="892,223.375 898.05,234.65 885.95,234.65" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="218.7" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">11 081 253 B</tspan></text><rect x="10" y="467" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="491.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La compresión reduce una copia completa al 18 % y un incremental por páginas, aunque toque el 67 % de las páginas, al 12 %.</tspan></text><text x="470" y="508.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los incrementales ahorran un 30 %, pero cada eslabón es un punto de fallo. Con la zlib de Ubuntu las cifras difieren en</tspan></text><text x="470" y="525.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">menos de un 1 %.</tspan></text><text x="470" y="572.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; SQLite 3.45 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
