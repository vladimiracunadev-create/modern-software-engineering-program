<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 306" width="940" height="306" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Del código al catálogo: cuatro pasos y el hecho medido que justifica cada uno</title><desc id="d">Cadena de cuatro pasos para pasar del código a un catálogo de patrones con el hecho medido de cada uno: el inventario con una regla por nombre da 5 falsos positivos en 14 fragmentos; la verificación con un detector estructural deja 1 falso positivo y 2 negativos; para Strategy hay 44 por ciento más de nodos y la complejidad baja de 15 a 3; en la decisión una entrada sin evidencia no entra.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="306" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Del código al catálogo: cuatro pasos y el hecho medido que justifica cada uno</tspan></text><rect x="14" y="49" width="201" height="136.48" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="114.5" y="79.28" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="114.5" dy="0">1. Inventario</tspan></text><text x="114.5" y="95.92" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="114.5" dy="0">buscar estructuras con</tspan></text><text x="114.5" y="112.56" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="114.5" dy="0">una regla y registrar</tspan></text><text x="114.5" y="129.2" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="114.5" dy="0">candidatos · la regla</tspan></text><text x="114.5" y="145.84" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="114.5" dy="0">por nombre da 5 falsos</tspan></text><text x="114.5" y="162.48" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="114.5" dy="0">positivos en 14</tspan></text><polyline points="215,117.24 251,117.24" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="251" y="49" width="201" height="136.48" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="351.5" y="70.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="351.5" dy="0">2. Verificación</tspan></text><text x="351.5" y="87.6" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="351.5" dy="0">una persona lee cada</tspan></text><text x="351.5" y="104.24" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="351.5" dy="0">candidato contra la</tspan></text><text x="351.5" y="120.88" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="351.5" dy="0">definición · el detector</tspan></text><text x="351.5" y="137.52" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="351.5" dy="0">estructural deja 1 falso</tspan></text><text x="351.5" y="154.16" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="351.5" dy="0">positivo y 2 falsos</tspan></text><text x="351.5" y="170.8" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="351.5" dy="0">negativos</tspan></text><polyline points="452,117.24 488,117.24" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="488" y="49" width="201" height="136.48" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="588.5" y="79.28" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="588.5" dy="0">3. Fuerza y costo</tspan></text><text x="588.5" y="95.92" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="588.5" dy="0">nombrar la fuerza y</tspan></text><text x="588.5" y="112.56" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="588.5" dy="0">medir el costo ·</tspan></text><text x="588.5" y="129.2" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="588.5" dy="0">Strategy: +44 % de</tspan></text><text x="588.5" y="145.84" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="588.5" dy="0">nodos, complejidad 15 →</tspan></text><text x="588.5" y="162.48" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="588.5" dy="0">3</tspan></text><polyline points="689,117.24 725,117.24" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="725" y="49" width="201" height="136.48" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="825.5" y="87.6" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="825.5" dy="0">4. Decisión</tspan></text><text x="825.5" y="104.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="825.5" dy="0">conservar, simplificar o</tspan></text><text x="825.5" y="120.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="825.5" dy="0">retirar, con condición</tspan></text><text x="825.5" y="137.52" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="825.5" dy="0">de salida · una entrada</tspan></text><text x="825.5" y="154.16" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="825.5" dy="0">sin evidencia no entra</tspan></text><rect x="10" y="199.48" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="224.44" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El catálogo es un documento vivo que responde por cada patrón del sistema. Su valor no está en la lista sino en las razones</tspan></text><text x="470" y="241.08" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">y en las salidas que registra.</tspan></text><text x="470" y="288.76" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad (CPython 3.12, Windows 11); los recuentos son deterministas y los tiempos varían de equipo en equipo.</tspan></text></svg>
