<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 465" width="940" height="465" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un mes con un borrado accidental (día 10) y una corrupción silenciosa (día 18, detectada el día 21)</title><desc id="d">Tabla: con una copia diaria sin verificar y tres días de retención, el borrado del día 10 pierde 200 filas y la corrupción del día 18 queda en las tres copias retenidas, sin recuperar 68 valores; con verificación y catorce días, la copia del 18 se rechaza y se pierden 800 filas posteriores; con bitácora, esas filas se recuperan.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="465" fill="#ffffff"/><rect x="10" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="142" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="142" dy="0">Estrategia</tspan></text><rect x="280" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="342" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="342" dy="0">Borrado (día</tspan></text><text x="342" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="342" dy="0">10)</tspan></text><rect x="410" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="597" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="597" dy="0">Corrupción (día 18)</tspan></text><rect x="790" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="857" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="857" dy="0">Copias</tspan></text><text x="857" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="857" dy="0">retenidas</tspan></text><rect x="10" y="56" width="264" height="92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="97.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">A: copia diaria, sin verificar, 3</tspan></text><text x="142" y="113.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">días</tspan></text><rect x="280" y="56" width="124" height="92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="342" y="105.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="342" dy="0">200 de 2 000</tspan></text><rect x="410" y="56" width="374" height="92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="97.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">Copia del 18 aceptada; ninguna anterior; 68 valores</tspan></text><text x="597" y="113.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">alterados sin recuperar</tspan></text><rect x="790" y="56" width="134" height="92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="857" y="105.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">3 (28–30)</tspan></text><rect x="10" y="154" width="264" height="92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="203.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">B: copia diaria verificada, 14 días</tspan></text><rect x="280" y="154" width="124" height="92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="342" y="203.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="342" dy="0">200 de 2 000</tspan></text><rect x="410" y="154" width="374" height="92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="195.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">Copia del 18 rechazada; última sana el 17; 800 filas</tspan></text><text x="597" y="211.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">posteriores perdidas</tspan></text><rect x="790" y="154" width="134" height="92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="857" y="203.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">14 (4–17)</tspan></text><rect x="10" y="252" width="264" height="92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="301.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">C: B + bitácora de cambios</tspan></text><rect x="280" y="252" width="124" height="92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="342" y="301.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="342" dy="0">0 de 2 000</tspan></text><rect x="410" y="252" width="374" height="92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="293.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">Última sana el 17; 800 filas recuperables desde la</tspan></text><text x="597" y="309.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">bitácora</tspan></text><rect x="790" y="252" width="134" height="92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="857" y="301.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">14 (4–17)</tspan></text><rect x="10" y="354" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="378.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">La verificación convierte una corrupción detectada el día 21 en una detectada el día 18, y la retención larga deja una</tspan></text><text x="470" y="395.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">copia sana para usar; la bitácora cierra la brecha entre copias. Las cifras son de un sistema sintético de 200 filas nuevas</tspan></text><text x="470" y="412.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">al día y dos incidentes inyectados.</tspan></text><text x="470" y="451.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; SQLite 3.45 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
