<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 627" width="860" height="627" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Validador del paquete de datos sobre 200 mutaciones: 134 detectadas</title><desc id="d">Tabla: un verificador de forma y de coherencia entre campos detecta 134 de 200 mutaciones de un paquete de capa de datos, todas las de campos ausentes, plazos o números incoherentes, y ninguna de las 66 que dejan los campos plausibles: evidencia copiada de otro entorno, un invariante sin prueba que exista, una purga nunca programada o la clave junto a la copia.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="860" height="627" fill="#ffffff"/><rect x="10" y="12" width="634" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="327" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="327" dy="0">Mutación</tspan></text><rect x="650" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="747" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="747" dy="0">Detectadas</tspan></text><rect x="10" y="56" width="634" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="75.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Campo del respaldo ausente</tspan></text><rect x="650" y="56" width="194" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="75.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">18 de 18</tspan></text><rect x="10" y="94" width="634" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="113.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Migración sin down</tspan></text><rect x="650" y="94" width="194" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="113.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">13 de 13</tspan></text><rect x="10" y="132" width="634" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="151.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">RPO objetivo menor que el intervalo de copia</tspan></text><rect x="650" y="132" width="194" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="151.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">23 de 23</tspan></text><rect x="10" y="170" width="634" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="189.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Copia en el mismo volumen que los datos</tspan></text><rect x="650" y="170" width="194" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="189.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">14 de 14</tspan></text><rect x="10" y="208" width="634" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="227.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Prueba de restauración vencida (más de 90 días)</tspan></text><rect x="650" y="208" width="194" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="227.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">17 de 17</tspan></text><rect x="10" y="246" width="634" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="265.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Retención mayor que el plazo legal</tspan></text><rect x="650" y="246" width="194" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="265.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">20 de 20</tspan></text><rect x="10" y="284" width="634" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="303.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Responsable colectivo</tspan></text><rect x="650" y="284" width="194" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="303.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">11 de 11</tspan></text><rect x="10" y="322" width="634" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="341.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Índice sin consulta que lo justifique</tspan></text><rect x="650" y="322" width="194" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="341.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">18 de 18</tspan></text><rect x="10" y="360" width="634" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="379.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Evidencia de restauración copiada de otro entorno</tspan></text><rect x="650" y="360" width="194" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="379.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">0 de 9</tspan></text><rect x="10" y="398" width="634" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="417.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Invariante sin prueba ejecutable</tspan></text><rect x="650" y="398" width="194" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="417.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">0 de 22</tspan></text><rect x="10" y="436" width="634" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="455.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Purga de retención nunca programada</tspan></text><rect x="650" y="436" width="194" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="455.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">0 de 17</tspan></text><rect x="10" y="474" width="634" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="493.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Clave de cifrado junto a la copia</tspan></text><rect x="650" y="474" width="194" height="32" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="493.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">0 de 18</tspan></text><rect x="10" y="516" width="840" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="430" y="540.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="430" dy="0">Las cuatro que no ve son las que ocurren en la realidad cuando un paquete se rellena para aprobar. Las reglas se</tspan></text><text x="430" y="557.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="430" dy="0">escribieron conociendo las mutaciones y cada tipo sale al 100 % o al 0 %: la exactitud real sobre paquetes</tspan></text><text x="430" y="574.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="430" dy="0">reales es desconocida.</tspan></text><text x="430" y="613.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="430" dy="0">Datos sintéticos con semilla fija; SQLite 3.45 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
