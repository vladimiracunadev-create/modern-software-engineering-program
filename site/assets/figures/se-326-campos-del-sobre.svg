<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 357" width="940" height="357" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué se pierde al quitar un campo del sobre del mensaje (2 300 mensajes, 80 estudiantes)</title><desc id="d">Tabla: sin identificador, deduplicar por contenido quita 835 mensajes cuando los duplicados son 200 y descarta 635 mensajes distintos; sin número de secuencia, ordenar por marca de tiempo deja 992 de 2 100 mensajes fuera de lugar; sin correlación, la reconstrucción por estudiante y ventana propone 254 pares de los cuales 128 son correctos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="357" fill="#ffffff"/><rect x="10" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="137" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="137" dy="0">Capacidad</tspan></text><rect x="270" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="432" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="432" dy="0">Con el campo en el sobre</tspan></text><rect x="600" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="762" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="762" dy="0">Sin el campo (heurística)</tspan></text><rect x="10" y="56" width="254" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="87.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">Quitar duplicados exactos</tspan></text><rect x="270" y="56" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="79.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">Con id: 200 quitados, 0 distintos</tspan></text><text x="432" y="95.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">perdidos</tspan></text><rect x="600" y="56" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="79.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">Por contenido: 835 quitados, 635</tspan></text><text x="762" y="95.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">distintos perdidos</tspan></text><rect x="10" y="118" width="254" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="141.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">Ordenar los eventos de un</tspan></text><text x="137" y="157.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">estudiante</tspan></text><rect x="270" y="118" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="141.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">Con secuencia por origen: 0 fuera de</tspan></text><text x="432" y="157.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">lugar</tspan></text><rect x="600" y="118" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="141.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">Por marca de tiempo: 992 de 2 100 fuera</tspan></text><text x="762" y="157.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">de lugar</tspan></text><rect x="10" y="180" width="254" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="203.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">Seguir una operación entre</tspan></text><text x="137" y="219.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">mensajes</tspan></text><rect x="270" y="180" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="211.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">Con correlación: 2 302 pares correctos</tspan></text><rect x="600" y="180" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="203.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">Por estudiante y ventana: 254 pares, 128</tspan></text><text x="762" y="219.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">correctos</tspan></text><rect x="10" y="246" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="270.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">El sobre es el contrato que no depende del contenido: id, tipo, origen, secuencia y correlación permiten deduplicar,</tspan></text><text x="470" y="287.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">enrutar, ordenar y seguir mensajes sin leer el cuerpo. Las heurísticas parecen funcionar y fallan justo cuando hay reenvíos</tspan></text><text x="470" y="304.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">legítimos, ráfagas o concurrencia.</tspan></text><text x="470" y="343.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; CPython 3.12 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
