<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 407" width="940" height="407" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué se pierde al quitar un campo del sobre del mensaje (2 300 mensajes, 80 estudiantes)</title><desc id="d">Mancuernas con los resultados erróneos con el campo en el sobre y con la heurística que lo sustituye: deduplicar por contenido descarta 635 mensajes distintos frente a 0 con identificador; ordenar por marca de tiempo deja 992 de 2 100 eventos fuera de lugar frente a 0 con secuencia; seguir una operación por estudiante y ventana propone 254 pares y solo 128 son correctos, es decir 126 pares falsos frente a 0 con correlación.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="407" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué se pierde al quitar un campo del sobre del mensaje (2 300 mensajes, 80 estudiantes)</tspan></text><circle cx="22" cy="51" r="6" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Con el campo en el sobre</tspan></text><circle cx="250.96" cy="51" r="6" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="264.96" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="264.96" dy="0">Sin el campo (heurística)</tspan></text><line x1="386.18" y1="77" x2="386.18" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="386.18" y1="209" x2="386.18" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="386.18" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="386.18" dy="0">0</tspan></text><line x1="463.176" y1="77" x2="463.176" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="463.176" y1="209" x2="463.176" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="463.176" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="463.176" dy="0">200</tspan></text><line x1="540.172" y1="77" x2="540.172" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="540.172" y1="209" x2="540.172" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="540.172" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="540.172" dy="0">400</tspan></text><line x1="617.168" y1="77" x2="617.168" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="617.168" y1="209" x2="617.168" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="617.168" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617.168" dy="0">600</tspan></text><line x1="694.164" y1="77" x2="694.164" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="694.164" y1="209" x2="694.164" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="694.164" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="694.164" dy="0">800</tspan></text><line x1="771.16" y1="77" x2="771.16" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="771.16" y1="209" x2="771.16" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="771.16" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="771.16" dy="0">1 000</tspan></text><line x1="386.18" y1="209" x2="771.16" y2="209" stroke="#5b7280" stroke-width="1.6"/><text x="334" y="103.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Deduplicar: distintos descartados</tspan></text><text x="334" y="147.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Ordenar: eventos fuera de lugar</tspan></text><text x="334" y="183" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Seguir: pares propuestos que no son</tspan></text><text x="334" y="200" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">correctos</tspan></text><line x1="386.18" y1="99" x2="630.642" y2="99" stroke="#c0432f" stroke-width="4"/><circle cx="386.18" cy="99" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="630.642" cy="99" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="374.18" y="103.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="374.18" dy="0">0</tspan></text><text x="642.642" y="103.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="642.642" dy="0">635</tspan></text><text x="926" y="103.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">635 errores</tspan></text><line x1="386.18" y1="143" x2="768.08" y2="143" stroke="#c0432f" stroke-width="4"/><circle cx="386.18" cy="143" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="768.08" cy="143" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="374.18" y="147.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="374.18" dy="0">0</tspan></text><text x="780.08" y="147.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="780.08" dy="0">992</tspan></text><text x="926" y="147.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">992 errores</tspan></text><line x1="386.18" y1="187" x2="434.687" y2="187" stroke="#c0432f" stroke-width="4"/><circle cx="386.18" cy="187" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="434.687" cy="187" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="374.18" y="191.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="374.18" dy="0">0</tspan></text><text x="446.687" y="191.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="446.687" dy="0">126</tspan></text><text x="926" y="191.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">126 errores</tspan></text><text x="578.67" y="253" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="578.67" dy="0">Resultados erróneos</tspan></text><rect x="10" y="267" width="920" height="92.56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="291.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">El sobre es el contrato que no depende del contenido: id, tipo, origen, secuencia y correlación permiten deduplicar,</tspan></text><text x="470" y="308.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">enrutar, ordenar y seguir mensajes sin leer el cuerpo. Las heurísticas parecen funcionar y fallan justo cuando hay reenvíos</tspan></text><text x="470" y="325.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">legítimos, ráfagas o concurrencia. Los 126 pares falsos son 254 propuestos menos 128 correctos; la tabla da también los 2</tspan></text><text x="470" y="341.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">302 pares correctos con correlación.</tspan></text><text x="470" y="389.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; CPython 3.12 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
