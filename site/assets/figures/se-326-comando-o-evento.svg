<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 574" width="940" height="574" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El mismo mensaje como comando y como evento según los manejadores registrados (1 000 mensajes)</title><desc id="d">Barras agrupadas según haya 0, 1 o 3 manejadores: con ninguno un comando exigido se rechaza 1 000 veces y un evento se pierde 1 000 veces sin aviso; con uno todo funciona; con tres un comando exigido se rechaza por ambiguo, un comando difundido se ejecuta 3 000 veces y un evento se entrega 3 000 veces como se espera.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="574" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">El mismo mensaje como comando y como evento según los manejadores registrados (1 000 mensajes)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Comando exigido: rechazos</tspan></text><rect x="252.5" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="272.5" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="272.5" dy="0">Comando difundido: ejecuciones</tspan></text><rect x="526.7" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="546.7" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="546.7" dy="0">Evento: entregas</tspan></text><rect x="16" y="69" width="12" height="12" rx="2" fill="#102a43"/><text x="36" y="80" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Evento: perdidos sin aviso</tspan></text><line x1="93.7" y1="399" x2="920" y2="399" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="399" x2="93.7" y2="399" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="403.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">0</tspan></text><line x1="93.7" y1="305.667" x2="920" y2="305.667" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="305.667" x2="93.7" y2="305.667" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="310.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1 000</tspan></text><line x1="93.7" y1="212.333" x2="920" y2="212.333" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="212.333" x2="93.7" y2="212.333" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="216.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">2 000</tspan></text><line x1="93.7" y1="119" x2="920" y2="119" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="119" x2="93.7" y2="119" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="123.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">3 000</tspan></text><line x1="93.7" y1="119" x2="93.7" y2="399" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="259" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 259)">De 1 000 mensajes</text><rect x="121.243" y="305.667" width="52.0867" height="93.3333" rx="3" fill="#c0432f"/><text x="147.287" y="299.667" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="147.287" dy="0">1 000</tspan></text><rect x="177.33" y="397" width="52.0867" height="2" rx="3" fill="#946512"/><text x="203.373" y="391" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="203.373" dy="0">0</tspan></text><rect x="233.417" y="397" width="52.0867" height="2" rx="3" fill="#087f8c"/><text x="259.46" y="391" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="259.46" dy="0">0</tspan></text><rect x="289.503" y="305.667" width="52.0867" height="93.3333" rx="3" fill="#102a43"/><text x="315.547" y="299.667" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="315.547" dy="0">1 000</tspan></text><text x="231.417" y="420" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="231.417" dy="0">0 manejadores</tspan></text><rect x="396.677" y="397" width="52.0867" height="2" rx="3" fill="#c0432f"/><text x="422.72" y="391" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="422.72" dy="0">0</tspan></text><rect x="452.763" y="305.667" width="52.0867" height="93.3333" rx="3" fill="#946512"/><text x="478.807" y="299.667" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="478.807" dy="0">1 000</tspan></text><rect x="508.85" y="305.667" width="52.0867" height="93.3333" rx="3" fill="#087f8c"/><text x="534.893" y="299.667" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="534.893" dy="0">1 000</tspan></text><rect x="564.937" y="397" width="52.0867" height="2" rx="3" fill="#102a43"/><text x="590.98" y="391" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="590.98" dy="0">0</tspan></text><text x="506.85" y="420" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="506.85" dy="0">1 manejador</tspan></text><rect x="672.11" y="305.667" width="52.0867" height="93.3333" rx="3" fill="#c0432f"/><text x="698.153" y="299.667" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="698.153" dy="0">1 000</tspan></text><rect x="728.197" y="119" width="52.0867" height="280" rx="3" fill="#946512"/><text x="754.24" y="113" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="754.24" dy="0">3 000</tspan></text><rect x="784.283" y="119" width="52.0867" height="280" rx="3" fill="#087f8c"/><text x="810.327" y="113" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="810.327" dy="0">3 000</tspan></text><rect x="840.37" y="397" width="52.0867" height="2" rx="3" fill="#102a43"/><text x="866.413" y="391" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="866.413" dy="0">0</tspan></text><text x="782.283" y="420" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.283" dy="0">3 manejadores</tspan></text><rect x="10" y="451" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="475.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Con cero manejadores el comando falla a gritos y el evento falla en silencio; con tres, difundir un comando lo ejecuta tres</tspan></text><text x="470" y="492.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">veces, que no es lo que significa una orden, y entregar un evento tres veces es justo su contrato. Un bus de diccionario</tspan></text><text x="470" y="509.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">sin fallos ni reintentos: solo muestra la diferencia de contrato.</tspan></text><text x="470" y="556.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; CPython 3.12 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
