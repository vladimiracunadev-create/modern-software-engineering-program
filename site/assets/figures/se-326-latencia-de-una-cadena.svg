<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Latencia (ms) de una petición que atraviesa N servicios con mediana de 20 ms cada uno</title><desc id="d">Líneas con la mediana y el percentil 99 de la latencia según el número de servicios llamados: en serie crecen de 20,0 y 80,6 milisegundos con un servicio a 186,3 y 321,1 con ocho, porque las latencias se suman; en paralelo solo llegan a 45,8 y 122,2, porque manda el más lento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Latencia (ms) de una petición que atraviesa N servicios con mediana de 20 ms cada uno</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Serie, p99</tspan></text><rect x="139.4" y="45" width="12" height="12" fill="#946512" stroke="#946512" stroke-width="2"/><text x="159.4" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="159.4" dy="0">Serie, p50</tspan></text><polygon points="268.8,44.1 275.4,56.4 262.2,56.4" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="282.8" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="282.8" dy="0">Paralelo, p99</tspan></text><polygon points="414.82,43.5 422.32,51 414.82,58.5 407.32,51" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="428.82" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="428.82" dy="0">Paralelo, p50</tspan></text><line x1="78.62" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="387" x2="78.62" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="312" x2="910" y2="312" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="312" x2="78.62" y2="312" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="316.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="237" x2="910" y2="237" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="237" x2="78.62" y2="237" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">200</tspan></text><line x1="78.62" y1="162" x2="910" y2="162" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="162" x2="78.62" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="166.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">300</tspan></text><line x1="78.62" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="87" x2="78.62" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">400</tspan></text><line x1="78.62" y1="87" x2="78.62" y2="387" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="87" x2="96.62" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="387" x2="96.62" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">1</tspan></text><line x1="361.747" y1="87" x2="361.747" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="361.747" y1="387" x2="361.747" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="361.747" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="361.747" dy="0">2</tspan></text><line x1="626.873" y1="87" x2="626.873" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="626.873" y1="387" x2="626.873" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="626.873" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="626.873" dy="0">4</tspan></text><line x1="892" y1="87" x2="892" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="387" x2="892" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">8</tspan></text><line x1="78.62" y1="387" x2="910" y2="387" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 237)">Latencia de la petición (ms)</text><text x="494.31" y="433" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Servicios llamados (N) (escala logarítmica)</tspan></text><polyline points="96.62,326.55 361.747,294.825 626.873,241.725 892,146.175" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="96.62" cy="326.55" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="96.62" y="315.55" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">80,6</tspan></text><circle cx="361.747" cy="294.825" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><circle cx="626.873" cy="241.725" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><circle cx="892" cy="146.175" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="135.175" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">321,1</tspan></text><polyline points="96.62,372 361.747,354.45 626.873,318.9 892,247.275" fill="none" stroke="#946512" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="91.12" y="366.5" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="96.62" y="361" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">20,0</tspan></text><rect x="356.247" y="348.95" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><rect x="621.373" y="313.4" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><rect x="886.5" y="241.775" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="892" y="236.275" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">186,3</tspan></text><polyline points="96.62,326.55 361.747,316.425 626.873,306 892,295.35" fill="none" stroke="#087f8c" stroke-width="2.4"/><polygon points="96.62,320.225 102.67,331.5 90.57,331.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polygon points="361.747,310.1 367.797,321.375 355.697,321.375" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polygon points="626.873,299.675 632.923,310.95 620.823,310.95" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polygon points="892,289.025 898.05,300.3 885.95,300.3" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="284.35" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">122,2</tspan></text><polyline points="96.62,372 361.747,366.225 626.873,359.7 892,352.65" fill="none" stroke="#102a43" stroke-width="2.4" stroke-dasharray="7 4"/><polygon points="96.62,365.125 103.495,372 96.62,378.875 89.745,372" fill="#102a43" stroke="#102a43" stroke-width="2"/><polygon points="361.747,359.35 368.622,366.225 361.747,373.1 354.872,366.225" fill="#102a43" stroke="#102a43" stroke-width="2"/><polygon points="626.873,352.825 633.748,359.7 626.873,366.575 619.998,359.7" fill="#102a43" stroke="#102a43" stroke-width="2"/><polygon points="892,345.775 898.875,352.65 892,359.525 885.125,352.65" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="892" y="376.65" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">45,8</tspan></text><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">En serie las latencias se suman y la cola se acumula; en paralelo manda el más lento. La probabilidad de tocar una llamada</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">lenta crece como 1 − 0,99ᴺ. La vista de runtime muestra esas rutas; la lógica no. Latencias lognormales sintéticas (σ =</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">0,6) y llamadas independientes, un supuesto que la contención real rompe.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
