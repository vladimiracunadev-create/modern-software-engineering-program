<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 406" width="940" height="406" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Recorridos de usuario rotos por la caída del peor nodo (4 recorridos, 9 componentes)</title><desc id="d">Barras horizontales con los recorridos de usuario que rompe la caída del peor nodo: un solo servidor rompe 4 de 4, separar aplicación y base sigue en 4, replicar solo la base sigue en 4 porque la web vive en un único nodo, y replicar también web e identidad baja el peor caso a 3 de 4.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="406" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Recorridos de usuario rotos por la caída del peor nodo (4 recorridos, 9 componentes)</tspan></text><line x1="274" y1="49" x2="274" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="225" x2="274" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0</tspan></text><line x1="432.485" y1="49" x2="432.485" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="432.485" y1="225" x2="432.485" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="432.485" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432.485" dy="0">1</tspan></text><line x1="590.97" y1="49" x2="590.97" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="590.97" y1="225" x2="590.97" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="590.97" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="590.97" dy="0">2</tspan></text><line x1="749.455" y1="49" x2="749.455" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="749.455" y1="225" x2="749.455" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="749.455" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="749.455" dy="0">3</tspan></text><line x1="907.94" y1="49" x2="907.94" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="907.94" y1="225" x2="907.94" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="907.94" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907.94" dy="0">4</tspan></text><line x1="274" y1="225" x2="907.94" y2="225" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="75.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Un solo servidor</tspan></text><text x="264" y="111" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Aplicación y base de datos</tspan></text><text x="264" y="128" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">separadas</tspan></text><text x="264" y="163.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">3 nodos, solo la base replicada</tspan></text><text x="264" y="199" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">3 nodos, web, identidad y base</tspan></text><text x="264" y="216" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">replicadas</tspan></text><rect x="274" y="55" width="633.94" height="32" rx="3" fill="#c0432f"/><text x="914.94" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="914.94" dy="0">4</tspan></text><rect x="274" y="99" width="633.94" height="32" rx="3" fill="#c0432f"/><text x="914.94" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="914.94" dy="0">4</tspan></text><rect x="274" y="143" width="633.94" height="32" rx="3" fill="#c0432f"/><text x="914.94" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="914.94" dy="0">4</tspan></text><rect x="274" y="187" width="475.455" height="32" rx="3" fill="#c0432f"/><text x="756.455" y="207.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="756.455" dy="0">3</tspan></text><text x="590.97" y="269" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="590.97" dy="0">Recorridos de usuario rotos (de 4)</tspan></text><rect x="10" y="283" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="307.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Replicar la base de datos no protege si la puerta de entrada (la web) vive en un único nodo: los cuatro recorridos pasan</tspan></text><text x="470" y="324.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">por ella. La vista de despliegue se lee contra los recorridos, no componente por componente. Los recorridos y los nodos son</tspan></text><text x="470" y="341.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">del autor; no se simuló ninguna caída real.</tspan></text><text x="470" y="388.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
