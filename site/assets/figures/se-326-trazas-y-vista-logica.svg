<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 542" width="940" height="542" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dependencias reales no declaradas que aparecen según cuántas trazas se miran</title><desc id="d">Línea con el número de dependencias no declaradas en la vista lógica que se ven al analizar trazas, en escala logarítmica de peticiones: una de tres con 100 peticiones, dos de tres con 1000, las tres con 5000 y con 100000; la dependencia declarada y nunca usada se ve desde la primera muestra.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="542" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dependencias reales no declaradas que aparecen según cuántas trazas se miran</tspan></text><line x1="63.54" y1="359" x2="910" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="359" x2="63.54" y2="359" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="363.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">0</tspan></text><line x1="63.54" y1="259" x2="910" y2="259" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="259" x2="63.54" y2="259" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="263.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">1</tspan></text><line x1="63.54" y1="159" x2="910" y2="159" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="159" x2="63.54" y2="159" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="163.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">2</tspan></text><line x1="63.54" y1="59" x2="910" y2="59" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="59" x2="63.54" y2="59" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="63.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">3</tspan></text><line x1="63.54" y1="59" x2="63.54" y2="359" stroke="#5b7280" stroke-width="1.6"/><line x1="81.54" y1="59" x2="81.54" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="81.54" y1="359" x2="81.54" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="81.54" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="81.54" dy="0">100</tspan></text><line x1="351.693" y1="59" x2="351.693" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="351.693" y1="359" x2="351.693" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="351.693" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="351.693" dy="0">1 000</tspan></text><line x1="540.522" y1="59" x2="540.522" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="540.522" y1="359" x2="540.522" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="540.522" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="540.522" dy="0">5 000</tspan></text><line x1="892" y1="59" x2="892" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="359" x2="892" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">100 000</tspan></text><line x1="63.54" y1="359" x2="910" y2="359" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="209" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 209)">Dependencias no declaradas vistas</text><text x="486.77" y="405" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="486.77" dy="0">Peticiones analizadas (escala logarítmica)</tspan></text><line x1="63.54" y1="59" x2="910" y2="59" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="69.54" y="53" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="69.54" dy="0">las 3 existen</tspan></text><polyline points="81.54,259 351.693,159 540.522,59 892,59" fill="none" stroke="#087f8c" stroke-width="2.4"/><circle cx="81.54" cy="259" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="81.54" y="283" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="81.54" dy="0">1 de 3</tspan></text><circle cx="351.693" cy="159" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="351.693" y="148" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="351.693" dy="0">2 de 3</tspan></text><circle cx="540.522" cy="59" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="540.522" y="83" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="540.522" dy="0">3 de 3</tspan></text><circle cx="892" cy="59" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="83" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">3 de 3</tspan></text><text x="176.54" y="299" font-size="13" text-anchor="start" font-weight="400" fill="#5c1f14" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="176.54" dy="0">La declarada y sin uso ya</tspan></text><text x="176.54" y="316" font-size="13" text-anchor="start" font-weight="400" fill="#5c1f14" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="176.54" dy="0">se ve con 100 peticiones</tspan></text><line x1="88.5" y1="261.8" x2="168.54" y2="294" stroke="#5c1f14" stroke-width="1.2"/><rect x="10" y="419" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="443.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las tres dependencias tienen probabilidad 4 %, 0,5 % y 0,1 % por petición; la probabilidad de ver la última en n peticiones</tspan></text><text x="470" y="460.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">es 1 − (1 − p)ⁿ, 63 % con 1000 y 99 % con 5000. Que una traza no muestre una arista no prueba que no exista: solo acota con</tspan></text><text x="470" y="477.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">qué probabilidad la habríamos visto.</tspan></text><text x="470" y="524.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
