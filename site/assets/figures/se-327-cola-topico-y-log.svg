<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 387" width="950" height="387" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cola de trabajo, tópico con suscripciones y log con desplazamientos frente a las mismas tres preguntas</title><desc id="d">Tabla: en una cola de trabajo dos consumidores se reparten 1 500 y 1 500 de 3 000 mensajes y no se puede reprocesar nada; un tópico entrega todo a cada suscripción pero el suscriptor tardío solo ve 2 000; un log conserva los 3 000 y permite releer los últimos 500 reposicionando el desplazamiento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="387" fill="#ffffff"/><rect x="10" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="132" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="132" dy="0">Pregunta</tspan></text><rect x="260" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="372" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="372" dy="0">Cola de trabajo</tspan></text><rect x="490" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="597" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="597" dy="0">Tópico con suscripciones</tspan></text><rect x="710" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="822" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="822" dy="0">Log con desplazamientos</tspan></text><rect x="10" y="56" width="244" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="84.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Dos consumidores del mismo</tspan></text><text x="132" y="100.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">trabajo (3 000 mensajes)</tspan></text><rect x="260" y="56" width="224" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="372" y="84.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372" dy="0">1 500 y 1 500: cada mensaje</tspan></text><text x="372" y="100.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372" dy="0">a uno solo</tspan></text><rect x="490" y="56" width="214" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="84.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">Cada suscripción recibe</tspan></text><text x="597" y="100.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">los 3 000</tspan></text><rect x="710" y="56" width="224" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="84.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">Un grupo se reparte los 3</tspan></text><text x="822" y="100.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">000; otro grupo lee todos</tspan></text><rect x="10" y="128" width="244" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="156.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Un suscriptor nuevo llega tras</tspan></text><text x="132" y="172.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">1 000 mensajes</tspan></text><rect x="260" y="128" width="224" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="372" y="156.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372" dy="0">Compite por lo que quede</tspan></text><text x="372" y="172.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372" dy="0">desde ahora</tspan></text><rect x="490" y="128" width="214" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="156.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">Recibe 2 000: no ve los 1</tspan></text><text x="597" y="172.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">000 anteriores</tspan></text><rect x="710" y="128" width="224" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="156.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">Lee 3 000 desde el</tspan></text><text x="822" y="172.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">desplazamiento 0</tspan></text><rect x="10" y="200" width="244" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="228.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Reprocesar los últimos 500</tspan></text><text x="132" y="244.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">tras corregir un defecto</tspan></text><rect x="260" y="200" width="224" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="372" y="228.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372" dy="0">0: ya se borraron al</tspan></text><text x="372" y="244.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372" dy="0">confirmarse</tspan></text><rect x="490" y="200" width="214" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="236.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">0: ya se entregaron</tspan></text><rect x="710" y="200" width="224" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="228.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">500: se reposiciona el</tspan></text><text x="822" y="244.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">desplazamiento</tspan></text><rect x="10" y="276" width="930" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="475" y="300.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">Lo que distingue a las tres estructuras es qué ocurre con un mensaje después de entregarse: la cola lo borra, el tópico lo</tspan></text><text x="475" y="317.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">entrega a cada suscripción vigente y el log lo conserva mientras dure la retención. Implementaciones mínimas en memoria;</tspan></text><text x="475" y="334.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">ningún corredor real.</tspan></text><text x="475" y="373.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Datos sintéticos con semilla fija; CPython 3.12 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
