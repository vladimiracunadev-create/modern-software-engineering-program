<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 554" width="940" height="554" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Coste de una llamada: en proceso, serializada y por TCP en bucle local</title><desc id="d">Intervalos en escala logarítmica con el rango medido entre ejecuciones: una llamada de función tarda de 0,22 a 0,84 microsegundos, serializar con JSON de 10,7 a 36,9, una ida y vuelta TCP en bucle local de 117 a 201 en la mediana y de 227 a 686 en el percentil 99; cada nivel de frontera queda a unas dos o tres décadas del anterior.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="554" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Coste de una llamada: en proceso, serializada y por TCP en bucle local</tspan></text><rect x="16" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">mínimo</tspan></text><polygon points="115.24,44.1 121.84,56.4 108.64,56.4" fill="#946512" stroke="#946512" stroke-width="2"/><text x="129.24" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="129.24" dy="0">máximo</tspan></text><line x1="344" y1="77" x2="344" y2="373" stroke="#d5dde1" stroke-width="1"/><line x1="344" y1="373" x2="344" y2="378" stroke="#5b7280" stroke-width="1.4"/><text x="344" y="394" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="344" dy="0">0,1</tspan></text><line x1="480.5" y1="77" x2="480.5" y2="373" stroke="#d5dde1" stroke-width="1"/><line x1="480.5" y1="373" x2="480.5" y2="378" stroke="#5b7280" stroke-width="1.4"/><text x="480.5" y="394" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="480.5" dy="0">1</tspan></text><line x1="617" y1="77" x2="617" y2="373" stroke="#d5dde1" stroke-width="1"/><line x1="617" y1="373" x2="617" y2="378" stroke="#5b7280" stroke-width="1.4"/><text x="617" y="394" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">10</tspan></text><line x1="753.5" y1="77" x2="753.5" y2="373" stroke="#d5dde1" stroke-width="1"/><line x1="753.5" y1="373" x2="753.5" y2="378" stroke="#5b7280" stroke-width="1.4"/><text x="753.5" y="394" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="753.5" dy="0">100</tspan></text><line x1="890" y1="77" x2="890" y2="373" stroke="#d5dde1" stroke-width="1"/><line x1="890" y1="373" x2="890" y2="378" stroke="#5b7280" stroke-width="1.4"/><text x="890" y="394" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="890" dy="0">1 000</tspan></text><line x1="344" y1="373" x2="890" y2="373" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="118.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Llamada de función en el mismo proceso</tspan></text><text x="314" y="184" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Serializar y deserializar JSON ida y</tspan></text><text x="314" y="201" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">vuelta</tspan></text><text x="314" y="266.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">TCP en bucle local, mediana</tspan></text><text x="314" y="340.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">TCP en bucle local, percentil 99</tspan></text><line x1="390.741" y1="114" x2="470.164" y2="114" stroke="#8a9aa3" stroke-width="5"/><rect x="383.741" y="107" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="390.741" y="98" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="390.741" dy="0">0,22</tspan></text><polygon points="470.164,105.95 477.864,120.3 462.464,120.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="470.164" y="143" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="470.164" dy="0">0,84</tspan></text><line x1="621.011" y1="188" x2="694.399" y2="188" stroke="#8a9aa3" stroke-width="5"/><rect x="614.011" y="181" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="621.011" y="172" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="621.011" dy="0">10,7</tspan></text><polygon points="694.399,179.95 702.099,194.3 686.699,194.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="694.399" y="217" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="694.399" dy="0">36,9</tspan></text><line x1="762.807" y1="262" x2="794.886" y2="262" stroke="#8a9aa3" stroke-width="5"/><rect x="755.807" y="255" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="762.807" y="246" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="762.807" dy="0">117</tspan></text><polygon points="794.886,253.95 802.586,268.3 787.186,268.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="794.886" y="291" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="794.886" dy="0">201</tspan></text><line x1="802.098" y1="336" x2="867.658" y2="336" stroke="#8a9aa3" stroke-width="5"/><rect x="795.098" y="329" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="802.098" y="320" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="802.098" dy="0">227</tspan></text><polygon points="867.658,327.95 875.358,342.3 859.958,342.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="867.658" y="365" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="867.658" dy="0">686</tspan></text><text x="617" y="417" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="617" dy="0">Tiempo por operación (µs), rango entre ejecuciones (escala logarítmica)</tspan></text><rect x="10" y="431" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="455.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Medición real, sin red: el bucle local no tiene latencia de enlace, balanceador ni TLS, así que subestima el coste de</tspan></text><text x="470" y="472.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cruzar una máquina. Las cifras cambian con la máquina; el orden de magnitud (dos o tres décimas de millar de veces) es lo</tspan></text><text x="470" y="489.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">que se repite. Una operación con 20 llamadas internas pasa de unos 7 µs a unos 2,3 ms si cada una cruza la red.</tspan></text><text x="470" y="536.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medición real en bucle local: depende de la máquina; rangos de cinco ejecuciones en Windows y cuatro en Ubuntu (WSL2).</tspan></text></svg>
