="0">orden); con reparto circular 106 de 669 quedaron fuera de orden. La clave más popular suma 3 643 eventos y ninguna cantidad</tspan></text><text x="470" y="418.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">de particiones la reparte. Exponente de popularidad 1,1: supuesto del autor.</tspan></text><text x="470" y="457.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; CPython 3.12 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
