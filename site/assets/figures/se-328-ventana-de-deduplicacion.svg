<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 421" width="940" height="421" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ventana de deduplicación: duplicados que pasan de 86 590 reentregas en un día (5 mensajes por segundo)</title><desc id="d">Tabla: una ventana de 10 segundos deja pasar 73 414 de 86 590 reentregas y guarda 50 identificadores; 60 segundos deja pasar 32 388; 5 minutos 1 521; una hora 921 por una cola larga del 1 por ciento hasta seis horas; 24 horas ninguna pero guarda 432 000 identificadores.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="421" fill="#ffffff"/><rect x="10" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="157" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="157" dy="0">Ventana de deduplicación</tspan></text><rect x="310" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="457" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="457" dy="0">Duplicados que pasan</tspan></text><rect x="610" y="12" width="314" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="767" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="767" dy="0">Identificadores guardados</tspan></text><rect x="10" y="56" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">10 s</tspan></text><rect x="310" y="56" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">73 414</tspan></text><rect x="610" y="56" width="314" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">50</tspan></text><rect x="10" y="106" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">60 s</tspan></text><rect x="310" y="106" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">32 388</tspan></text><rect x="610" y="106" width="314" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">300</tspan></text><rect x="10" y="156" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">5 min</tspan></text><rect x="310" y="156" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">1 521</tspan></text><rect x="610" y="156" width="314" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">1 500</tspan></text><rect x="10" y="206" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">1 h</tspan></text><rect x="310" y="206" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">921</tspan></text><rect x="610" y="206" width="314" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">18 000</tspan></text><rect x="10" y="256" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">24 h</tspan></text><rect x="310" y="256" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">0</tspan></text><rect x="610" y="256" width="314" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">432 000</tspan></text><rect x="10" y="310" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="334.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El tamaño de la ventana es una apuesta sobre cuánto tarda en volver una reentrega. Las reentregas siguen una distribución</tspan></text><text x="470" y="351.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">con cola larga (1 % entre 1 y 6 horas), por eso una ventana que cubre casi todo deja pasar cientos de duplicados. Retardos</tspan></text><text x="470" y="368.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">exponenciales con cola: supuesto del autor.</tspan></text><text x="470" y="407.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; CPython 3.12 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
