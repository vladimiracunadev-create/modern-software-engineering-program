<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 425" width="940" height="425" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Promedio de dos notas (1,0 a 7,0): empates exactos que se redondean distinto de la regla «medio hacia arriba»</title><desc id="d">Barras horizontales con los pares de notas, de 1860 cuyo promedio cae justo en medio, que se redondean distinto de la regla medio hacia arriba: el float con round y el decimal con redondeo por defecto se apartan en 930, la mitad; el decimal con half-up declarado y los enteros en décimas, en ninguno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="425" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Promedio de dos notas (1,0 a 7,0): empates exactos que se redondean distinto de la regla «medio hacia</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">arriba»</tspan></text><line x1="284" y1="68" x2="284" y2="244" stroke="#d5dde1" stroke-width="1"/><line x1="284" y1="244" x2="284" y2="249" stroke="#5b7280" stroke-width="1.4"/><text x="284" y="265" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="284" dy="0">0</tspan></text><line x1="421.85" y1="68" x2="421.85" y2="244" stroke="#d5dde1" stroke-width="1"/><line x1="421.85" y1="244" x2="421.85" y2="249" stroke="#5b7280" stroke-width="1.4"/><text x="421.85" y="265" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="421.85" dy="0">500</tspan></text><line x1="559.7" y1="68" x2="559.7" y2="244" stroke="#d5dde1" stroke-width="1"/><line x1="559.7" y1="244" x2="559.7" y2="249" stroke="#5b7280" stroke-width="1.4"/><text x="559.7" y="265" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="559.7" dy="0">1 000</tspan></text><line x1="697.55" y1="68" x2="697.55" y2="244" stroke="#d5dde1" stroke-width="1"/><line x1="697.55" y1="244" x2="697.55" y2="249" stroke="#5b7280" stroke-width="1.4"/><text x="697.55" y="265" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697.55" dy="0">1 500</tspan></text><line x1="835.4" y1="68" x2="835.4" y2="244" stroke="#d5dde1" stroke-width="1"/><line x1="835.4" y1="244" x2="835.4" y2="249" stroke="#5b7280" stroke-width="1.4"/><text x="835.4" y="265" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="835.4" dy="0">2 000</tspan></text><line x1="284" y1="244" x2="835.4" y2="244" stroke="#5b7280" stroke-width="1.6"/><text x="274" y="94.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Float con round()</tspan></text><text x="274" y="130" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Decimal con redondeo por defecto</tspan></text><text x="274" y="147" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">(half-even)</tspan></text><text x="274" y="182.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Decimal con half-up declarado</tspan></text><text x="274" y="226.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Enteros en décimas con half-up</tspan></text><rect x="284" y="74" width="256.401" height="32" rx="3" fill="#c0432f"/><text x="547.401" y="94.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="547.401" dy="0">930 · 50 %</tspan></text><rect x="284" y="118" width="256.401" height="32" rx="3" fill="#c0432f"/><text x="547.401" y="138.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="547.401" dy="0">930 · 50 %</tspan></text><rect x="284" y="162" width="2" height="32" rx="3" fill="#c0432f"/><text x="293" y="182.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="293" dy="0">0</tspan></text><rect x="284" y="206" width="2" height="32" rx="3" fill="#c0432f"/><text x="293" y="226.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="293" dy="0">0</tspan></text><line x1="796.802" y1="68" x2="796.802" y2="244" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="801.802" y="81" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="801.802" dy="0">1 860 pares</tspan></text><text x="559.7" y="288" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="559.7" dy="0">Pares de notas (de 1 860 empates exactos)</tspan></text><rect x="10" y="302" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="326.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Ejemplo: 1,0 y 1,3 promedian 1,15; con float el resultado es 1,1 en lugar de 1,2. Un objeto de valor Nota que encapsula la</tspan></text><text x="470" y="343.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">representación y la regla de redondeo hace que la regla viva en un sitio y se pruebe contra todos los pares. Comprobado con</tspan></text><text x="470" y="360.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Fraction como referencia exacta.</tspan></text><text x="470" y="407.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
