<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 569" width="940" height="569" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Arranques en frío con picos de entrega según las instancias mantenidas (una hora de tráfico, escala logarítmica)</title><desc id="d">Barras agrupadas en escala logarítmica con el porcentaje de peticiones que arranca en frío con picos de entrega: en toda la hora 0,40, 0,17 y 0,06 por ciento con 0, 5 y 10 instancias mantenidas, pero en los primeros 10 segundos del pico 11,1, 5,1 y 0,7 por ciento; con tráfico estable, sin instancias mantenidas, es solo 0,10 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="569" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Arranques en frío con picos de entrega según las instancias mantenidas (una hora de tráfico, escala</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">logarítmica)</tspan></text><rect x="16" y="64" width="12" height="12" rx="2" fill="#946512"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">En toda la hora</tspan></text><rect x="177.1" y="64" width="12" height="12" rx="2" fill="#c0432f"/><text x="197.1" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="197.1" dy="0">En los primeros 10 s del pico</tspan></text><line x1="86.16" y1="394" x2="920" y2="394" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="394" x2="86.16" y2="394" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="398.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">0,01</tspan></text><line x1="86.16" y1="324" x2="920" y2="324" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="324" x2="86.16" y2="324" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="328.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">0,1</tspan></text><line x1="86.16" y1="254" x2="920" y2="254" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="254" x2="86.16" y2="254" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="258.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">1</tspan></text><line x1="86.16" y1="184" x2="920" y2="184" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="184" x2="86.16" y2="184" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="188.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">10</tspan></text><line x1="86.16" y1="114" x2="920" y2="114" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="114" x2="86.16" y2="114" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="118.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">100</tspan></text><line x1="86.16" y1="114" x2="86.16" y2="394" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 254)">Peticiones con arranque en frío (%) (escala logarítmica)</text><rect x="113.955" y="281.856" width="109.179" height="112.144" rx="3" fill="#946512"/><text x="168.544" y="275.856" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="168.544" dy="0">0,4</tspan></text><rect x="227.133" y="180.827" width="109.179" height="213.173" rx="3" fill="#c0432f"/><text x="281.723" y="174.827" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="281.723" dy="0">11,1</tspan></text><text x="225.133" y="415" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="225.133" dy="0">Sin instancias mantenidas</tspan></text><rect x="391.901" y="307.869" width="109.179" height="86.1314" rx="3" fill="#946512"/><text x="446.491" y="301.869" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="446.491" dy="0">0,17</tspan></text><rect x="505.08" y="204.47" width="109.179" height="189.53" rx="3" fill="#c0432f"/><text x="559.669" y="198.47" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="559.669" dy="0">5,1</tspan></text><text x="503.08" y="415" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="503.08" dy="0">5 instancias mantenidas</tspan></text><rect x="669.848" y="339.529" width="109.179" height="54.4706" rx="3" fill="#946512"/><text x="724.437" y="333.529" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="724.437" dy="0">0,06</tspan></text><rect x="783.027" y="264.843" width="109.179" height="129.157" rx="3" fill="#c0432f"/><text x="837.616" y="258.843" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="837.616" dy="0">0,7</tspan></text><text x="781.027" y="415" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="781.027" dy="0">10 instancias mantenidas</tspan></text><rect x="10" y="446" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="470.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El promedio engaña: 0,40 % parece despreciable, pero se concentra en los primeros segundos de la ráfaga, justo cuando hay</tspan></text><text x="470" y="487.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">gente entregando contra un plazo. El arranque en frío (0,8 s) y el tibio (30 ms) son supuestos del autor; el mecanismo es</tspan></text><text x="470" y="504.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">la espera mientras se crea una instancia por cada petición simultánea sin instancia libre.</tspan></text><text x="470" y="551.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
