<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 589" width="940" height="589" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Rondas para que un rumor llegue al 99 % de los pares conectados (1000 pares, 20 % desconectados, 200 repeticiones)</title><desc id="d">Líneas con las rondas necesarias frente a los mensajes enviados al variar el fanout de 1 a 5: con fanout 1 el rumor tarda 17,8 rondas de media y 21 como máximo con 5003 mensajes; con fanout 2, 10,5 y 12 con 5402; con 3, 8,1 y 9 con 5769; con 5, 6,0 y 7 con 6563, de modo que cinco veces el fanout envía solo un 31 por ciento más de mensajes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="589" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Rondas para que un rumor llegue al 99 % de los pares conectados (1000 pares, 20 % desconectados, 200</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">repeticiones)</tspan></text><circle cx="22" cy="70" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Rondas, máximo</tspan></text><rect x="169.56" y="64" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="189.56" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="189.56" dy="0">Rondas, media</tspan></text><line x1="71.08" y1="406" x2="910" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="406" x2="71.08" y2="406" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="410.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="346" x2="910" y2="346" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="346" x2="71.08" y2="346" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="350.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">5</tspan></text><line x1="71.08" y1="286" x2="910" y2="286" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="286" x2="71.08" y2="286" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="290.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="226" x2="910" y2="226" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="226" x2="71.08" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="230.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">15</tspan></text><line x1="71.08" y1="166" x2="910" y2="166" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="166" x2="71.08" y2="166" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="170.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="106" x2="910" y2="106" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="106" x2="71.08" y2="106" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">25</tspan></text><line x1="71.08" y1="106" x2="71.08" y2="406" stroke="#5b7280" stroke-width="1.6"/><line x1="89.08" y1="106" x2="89.08" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="89.08" y1="406" x2="89.08" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="89.08" y="427" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="89.08" dy="0">4 800</tspan></text><line x1="249.664" y1="106" x2="249.664" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="249.664" y1="406" x2="249.664" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="249.664" y="427" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="249.664" dy="0">5 200</tspan></text><line x1="410.248" y1="106" x2="410.248" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="410.248" y1="406" x2="410.248" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="410.248" y="427" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="410.248" dy="0">5 600</tspan></text><line x1="570.832" y1="106" x2="570.832" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="570.832" y1="406" x2="570.832" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="570.832" y="427" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="570.832" dy="0">6 000</tspan></text><line x1="731.416" y1="106" x2="731.416" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="731.416" y1="406" x2="731.416" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="731.416" y="427" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="731.416" dy="0">6 400</tspan></text><line x1="892" y1="106" x2="892" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="406" x2="892" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="427" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">6 800</tspan></text><line x1="71.08" y1="406" x2="910" y2="406" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="256" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 256)">Rondas hasta el 99 % de los conectados</text><text x="490.54" y="452" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="490.54" dy="0">Mensajes enviados (media)</tspan></text><polyline points="170.576,154 330.759,262 478.095,298 796.854,322" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="170.576" cy="154" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="170.576" y="143" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="170.576" dy="0">fanout 1: 21</tspan></text><circle cx="330.759" cy="262" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="330.759" y="251" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="330.759" dy="0">fanout 2: 12</tspan></text><circle cx="478.095" cy="298" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="478.095" y="287" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="478.095" dy="0">fanout 3: 9</tspan></text><circle cx="796.854" cy="322" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="796.854" y="311" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="796.854" dy="0">fanout 5: 7</tspan></text><polyline points="170.576,192.4 330.759,280 478.095,308.8 796.854,334" fill="none" stroke="#087f8c" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="165.076" y="186.9" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="170.576" y="216.4" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="170.576" dy="0">17,8</tspan></text><rect x="325.259" y="274.5" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="330.759" y="304" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="330.759" dy="0">10,5</tspan></text><rect x="472.595" y="303.3" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="478.095" y="332.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="478.095" dy="0">8,1</tspan></text><rect x="791.354" y="328.5" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="796.854" y="358" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="796.854" dy="0">6,0</tspan></text><rect x="10" y="466" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="490.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Las rondas crecen con el logaritmo del tamaño (8,2 con 100 pares, 10,5 con 1000, 13,1 con 10 000) y se disparan cuando casi</tspan></text><text x="470" y="507.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">todos los pares están desconectados. Más fanout acorta la difusión y encarece el tráfico: cinco veces el fanout envía solo</tspan></text><text x="470" y="524.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">un 31 % más de mensajes. Modelo sin latencias, sin fallos de enlace y con elección uniforme de pares.</tspan></text><text x="470" y="571.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
