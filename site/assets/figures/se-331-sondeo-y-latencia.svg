" fill="#142231"><tspan x="632" dy="0">447,3 s</tspan></text><rect x="730" y="256" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">856,1 s</tspan></text><rect x="10" y="306" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="331.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">1 h</tspan></text><rect x="160" y="306" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="252" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="252" dy="0">24</tspan></text><rect x="350" y="306" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">0,0 %</tspan></text><rect x="540" y="306" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">1 807,5 s</tspan></text><rect x="730" y="306" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">3 379,3 s</tspan></text><rect x="10" y="360" width="910" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="384.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">El sondeo cambia peticiones por retraso: el retraso medio es la mitad del intervalo y las peticiones vacías crecen cuando</tspan></text><text x="465" y="401.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">el intervalo baja. Un webhook empuja 311 entregas sin peticiones vacías, a cambio de recibir tráfico que no controlas.</tspan></text><text x="465" y="418.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">Eventos de Poisson de tasa fija: supuesto del autor.</tspan></text><text x="465" y="457.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Datos sintéticos con semilla fija; CPython 3.12 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
