<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 642" width="940" height="642" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Despliegue gradual en cinco pasos: mensajes que fallan de 10 000 según qué lado se actualiza primero</title><desc id="d">Barras horizontales con los mensajes que fallan de 10 000 según el cambio, el tipo de lector y qué lado se actualiza primero: añadir un campo opcional falla 0 veces con lectores tolerantes y 2 825 o 820 con estrictos; añadir un obligatorio falla 801 o 2 809 con tolerantes y 3 626 o 3 629 con estrictos; renombrar falla unas 3 600 veces en cualquier orden.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="642" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Despliegue gradual en cinco pasos: mensajes que fallan de 10 000 según qué lado se actualiza primero</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Productores primero</tspan></text><rect x="207.26" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="227.26" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="227.26" dy="0">Consumidores primero</tspan></text><line x1="264" y1="77" x2="264" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="264" y1="461" x2="264" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="264" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="264" dy="0">0</tspan></text><line x1="416.925" y1="77" x2="416.925" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="416.925" y1="461" x2="416.925" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="416.925" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="416.925" dy="0">1 000</tspan></text><line x1="569.85" y1="77" x2="569.85" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="569.85" y1="461" x2="569.85" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="569.85" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="569.85" dy="0">2 000</tspan></text><line x1="722.775" y1="77" x2="722.775" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="722.775" y1="461" x2="722.775" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="722.775" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722.775" dy="0">3 000</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="461" x2="875.7" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">4 000</tspan></text><line x1="264" y1="461" x2="875.7" y2="461" stroke="#5b7280" stroke-width="1.6"/><text x="254" y="113.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="254" dy="0">Añadir opcional · tolerante</tspan></text><text x="254" y="177.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="254" dy="0">Añadir opcional · estricto</tspan></text><text x="254" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="254" dy="0">Añadir obligatorio · tolerante</tspan></text><text x="254" y="305.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="254" dy="0">Añadir obligatorio · estricto</tspan></text><text x="254" y="369.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="254" dy="0">Renombrar · tolerante</tspan></text><text x="254" y="433.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="254" dy="0">Renombrar · estricto</tspan></text><rect x="264" y="83" width="2" height="24.5" rx="3" fill="#c0432f"/><text x="273" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="273" dy="0">0</tspan></text><rect x="264" y="110.5" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="273" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="273" dy="0">0</tspan></text><rect x="264" y="147" width="432.013" height="24.5" rx="3" fill="#c0432f"/><text x="703.013" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="703.013" dy="0">2 825</tspan></text><rect x="264" y="174.5" width="125.399" height="24.5" rx="3" fill="#087f8c"/><text x="396.399" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="396.399" dy="0">820</tspan></text><rect x="264" y="211" width="122.493" height="24.5" rx="3" fill="#c0432f"/><text x="393.493" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="393.493" dy="0">801</tspan></text><rect x="264" y="238.5" width="429.566" height="24.5" rx="3" fill="#087f8c"/><text x="700.566" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="700.566" dy="0">2 809</tspan></text><rect x="264" y="275" width="554.506" height="24.5" rx="3" fill="#c0432f"/><text x="825.506" y="291.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="825.506" dy="0">3 626</tspan></text><rect x="264" y="302.5" width="554.965" height="24.5" rx="3" fill="#087f8c"/><text x="825.965" y="319.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="825.965" dy="0">3 629</tspan></text><rect x="264" y="339" width="554.506" height="24.5" rx="3" fill="#c0432f"/><text x="825.506" y="355.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="825.506" dy="0">3 626</tspan></text><rect x="264" y="366.5" width="554.965" height="24.5" rx="3" fill="#087f8c"/><text x="825.965" y="383.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="825.965" dy="0">3 629</tspan></text><rect x="264" y="403" width="554.506" height="24.5" rx="3" fill="#c0432f"/><text x="825.506" y="419.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="825.506" dy="0">3 626</tspan></text><rect x="264" y="430.5" width="554.965" height="24.5" rx="3" fill="#087f8c"/><text x="825.965" y="447.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="825.965" dy="0">3 629</tspan></text><text x="569.85" y="505" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="569.85" dy="0">Mensajes que fallan de 10 000</tspan></text><rect x="10" y="519" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="543.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Un despliegue gradual convive con dos versiones durante un rato y los fallos aparecen en ese rato. Añadir obligatorio es</tspan></text><text x="470" y="560.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">seguro solo si primero se actualizan los productores en dos pasos (opcional y luego obligatorio). Renombrar nunca es seguro</tspan></text><text x="470" y="577.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">de una vez. Cinco pasos del 20 %: supuesto del autor.</tspan></text><text x="470" y="624.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; CPython 3.12 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
