<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 607" width="940" height="607" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Prueba de rendimiento con umbral sobre el percentil 95: falsas alarmas y regresiones de +20 % no detectadas</title><desc id="d">Dispersión con las falsas alarmas en el eje horizontal y las regresiones de 20 por ciento no detectadas en el vertical, un punto por muestras y margen del umbral: con 30 muestras y margen 1,10 hay 24,7 y 21,6 por ciento; con 500 muestras y 1,10 casi nada, 0,3 y 0,5; los márgenes 1,25 y 1,50 reducen las falsas alarmas pero dejan pasar del 61 al 94 por ciento de las regresiones con 30 muestras y 87,5 con 500.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="607" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Prueba de rendimiento con umbral sobre el percentil 95: falsas alarmas y regresiones de +20 % no detectadas</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">30 muestras</tspan></text><rect x="146.94" y="45" width="12" height="12" fill="#946512" stroke="#946512" stroke-width="2"/><text x="166.94" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="166.94" dy="0">100 muestras</tspan></text><polygon points="291.42,44.1 298.02,56.4 284.82,56.4" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="305.42" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="305.42" dy="0">500 muestras</tspan></text><line x1="78.62" y1="407" x2="910" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="407" x2="78.62" y2="407" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="411.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="343" x2="910" y2="343" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="343" x2="78.62" y2="343" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="347.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">20</tspan></text><line x1="78.62" y1="279" x2="910" y2="279" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="279" x2="78.62" y2="279" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="283.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">40</tspan></text><line x1="78.62" y1="215" x2="910" y2="215" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="215" x2="78.62" y2="215" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="219.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">60</tspan></text><line x1="78.62" y1="151" x2="910" y2="151" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="151" x2="78.62" y2="151" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="155.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">80</tspan></text><line x1="78.62" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="87" x2="78.62" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="87" x2="78.62" y2="407" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="87" x2="96.62" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="407" x2="96.62" y2="412" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="428" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">0</tspan></text><line x1="255.696" y1="87" x2="255.696" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="255.696" y1="407" x2="255.696" y2="412" stroke="#5b7280" stroke-width="1.4"/><text x="255.696" y="428" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="255.696" dy="0">5</tspan></text><line x1="414.772" y1="87" x2="414.772" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="414.772" y1="407" x2="414.772" y2="412" stroke="#5b7280" stroke-width="1.4"/><text x="414.772" y="428" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="414.772" dy="0">10</tspan></text><line x1="573.848" y1="87" x2="573.848" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="573.848" y1="407" x2="573.848" y2="412" stroke="#5b7280" stroke-width="1.4"/><text x="573.848" y="428" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="573.848" dy="0">15</tspan></text><line x1="732.924" y1="87" x2="732.924" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="732.924" y1="407" x2="732.924" y2="412" stroke="#5b7280" stroke-width="1.4"/><text x="732.924" y="428" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="732.924" dy="0">20</tspan></text><line x1="892" y1="87" x2="892" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="407" x2="892" y2="412" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="428" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">25</tspan></text><line x1="78.62" y1="407" x2="910" y2="407" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="247" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 247)">Regresión de +20 % no detectada (%)</text><text x="494.31" y="453" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Falsas alarmas (% de ejecuciones sin regresión)</tspan></text><circle cx="882.455" cy="337.88" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892.455" y="342.38" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892.455" dy="0">×1,10</tspan></text><circle cx="303.419" cy="211.8" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="313.419" y="216.3" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="313.419" dy="0">×1,25</tspan></text><circle cx="109.346" cy="104.6" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="119.346" y="109.1" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="119.346" dy="0">×1,50</tspan></text><rect x="444.269" y="369.18" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="459.769" y="379.18" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="459.769" dy="0">×1,10</tspan></text><rect x="97.483" y="179.74" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="112.983" y="189.74" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="112.983" dy="0">×1,25</tspan></text><polygon points="106.165,399.075 112.215,410.35 100.115,410.35" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="116.165" y="409.9" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="116.165" dy="0">×1,10</tspan></text><polygon points="96.62,120.675 102.67,131.95 90.57,131.95" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="106.62" y="131.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="106.62" dy="0">×1,25</tspan></text><rect x="10" y="467" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="491.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El umbral y el número de muestras son una decisión estadística: con pocas muestras no existe un umbral que dé a la vez</tspan></text><text x="470" y="508.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">pocas falsas alarmas y pocas regresiones perdidas; con muchas sí, a costa de tiempo de ejecución. Una prueba que falla al</tspan></text><text x="470" y="525.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">azar se ignora, y una función de aptitud ignorada ha dejado de existir. 2000 ejecuciones por celda, latencias lognormales</tspan></text><text x="470" y="541.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">sintéticas.</tspan></text><text x="470" y="589.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
