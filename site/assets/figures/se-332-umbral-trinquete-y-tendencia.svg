<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 545" width="940" height="545" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres alarmas sobre una deriva de acoplamiento (926 series de 80 semanas con daño real sobre 26)</title><desc id="d">Barras horizontales agrupadas con tres resultados de cada alarma en porcentaje de series: el umbral absoluto de 30 avisa antes del daño en 0 por ciento, no avisa nunca en 18 y no da falsas alarmas; el trinquete avisa antes en 99 por ciento con 24,4 de falsas alarmas; la pendiente avisa antes en 95 por ciento con 95,4 de falsas alarmas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="545" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Tres alarmas sobre una deriva de acoplamiento (926 series de 80 semanas con daño real sobre 26)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Avisa antes del daño</tspan></text><rect x="214.8" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="234.8" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="234.8" dy="0">Nunca avisa</tspan></text><rect x="345.74" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="365.74" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="365.74" dy="0">Falsa alarma en series planas</tspan></text><line x1="284" y1="77" x2="284" y2="347" stroke="#d5dde1" stroke-width="1"/><line x1="284" y1="347" x2="284" y2="352" stroke="#5b7280" stroke-width="1.4"/><text x="284" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="284" dy="0">0</tspan></text><line x1="433.94" y1="77" x2="433.94" y2="347" stroke="#d5dde1" stroke-width="1"/><line x1="433.94" y1="347" x2="433.94" y2="352" stroke="#5b7280" stroke-width="1.4"/><text x="433.94" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="433.94" dy="0">25</tspan></text><line x1="583.88" y1="77" x2="583.88" y2="347" stroke="#d5dde1" stroke-width="1"/><line x1="583.88" y1="347" x2="583.88" y2="352" stroke="#5b7280" stroke-width="1.4"/><text x="583.88" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="583.88" dy="0">50</tspan></text><line x1="733.82" y1="77" x2="733.82" y2="347" stroke="#d5dde1" stroke-width="1"/><line x1="733.82" y1="347" x2="733.82" y2="352" stroke="#5b7280" stroke-width="1.4"/><text x="733.82" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="733.82" dy="0">75</tspan></text><line x1="883.76" y1="77" x2="883.76" y2="347" stroke="#d5dde1" stroke-width="1"/><line x1="883.76" y1="347" x2="883.76" y2="352" stroke="#5b7280" stroke-width="1.4"/><text x="883.76" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="883.76" dy="0">100</tspan></text><line x1="284" y1="347" x2="883.76" y2="347" stroke="#5b7280" stroke-width="1.6"/><text x="274" y="126.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Umbral absoluto de 30</tspan></text><text x="274" y="216.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Trinquete: +2 sobre el mejor valor</tspan></text><text x="274" y="298" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Pendiente &gt; 0,1 por semana en 8</tspan></text><text x="274" y="315" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">semanas</tspan></text><rect x="284" y="83" width="2" height="24" rx="3" fill="#087f8c"/><text x="293" y="99.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="293" dy="0">0</tspan></text><rect x="284" y="110" width="107.957" height="24" rx="3" fill="#946512"/><text x="398.957" y="126.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="398.957" dy="0">18</tspan></text><rect x="284" y="137" width="2" height="24" rx="3" fill="#c0432f"/><text x="293" y="153.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="293" dy="0">0</tspan></text><rect x="284" y="173" width="593.762" height="24" rx="3" fill="#087f8c"/><text x="884.762" y="189.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="884.762" dy="0">99</tspan></text><rect x="284" y="200" width="2" height="24" rx="3" fill="#946512"/><text x="293" y="216.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="293" dy="0">0</tspan></text><rect x="284" y="227" width="146.341" height="24" rx="3" fill="#c0432f"/><text x="437.341" y="243.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="437.341" dy="0">24,4</tspan></text><rect x="284" y="263" width="569.772" height="24" rx="3" fill="#087f8c"/><text x="860.772" y="279.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="860.772" dy="0">95</tspan></text><rect x="284" y="290" width="2" height="24" rx="3" fill="#946512"/><text x="293" y="306.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="293" dy="0">0</tspan></text><rect x="284" y="317" width="572.171" height="24" rx="3" fill="#c0432f"/><text x="863.171" y="333.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="863.171" dy="0">95,4</tspan></text><text x="583.88" y="391" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="583.88" dy="0">Series (%)</tspan></text><rect x="10" y="405" width="920" height="92.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="429.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Una alarma que llega pronto es una alarma que se equivoca más: el umbral absoluto no da falsas alarmas porque llega tarde;</tspan></text><text x="470" y="446.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">la pendiente de ocho semanas ve tendencias en el ruido. La combinación habitual, un trinquete con tolerancia más una</tspan></text><text x="470" y="463.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">revisión humana de las alarmas, es una decisión sobre qué error cuesta más. Series sintéticas con deriva de 0,05 por semana</tspan></text><text x="470" y="479.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">y ruido de 0,4.</tspan></text><text x="470" y="527.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
