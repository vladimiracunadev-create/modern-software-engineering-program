<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Coste esperado (semanas-equipo) de decidir tras esperar, según lo caro que sea revertir</title><desc id="d">Líneas con el coste esperado total según las semanas de espera antes de decidir: si revertir cuesta 5 o 30 semanas-equipo el coste mínimo está en decidir ya, 2,0 y 12,0; si cuesta 100 el coste baja de 40,2 al decidir ya a 25,0 tras esperar 20 semanas y vuelve a subir a 35,0 con 30.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Coste esperado (semanas-equipo) de decidir tras esperar, según lo caro que sea revertir</tspan></text><circle cx="22" cy="51" r="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Revertir cuesta 5</tspan></text><rect x="192.18" y="45" width="12" height="12" fill="#946512" stroke="#946512" stroke-width="2"/><text x="212.18" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="212.18" dy="0">Revertir cuesta 30</tspan></text><polygon points="381.9,44.1 388.5,56.4 375.3,56.4" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="395.9" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="395.9" dy="0">Revertir cuesta 100</tspan></text><line x1="71.08" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="387" x2="71.08" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="327" x2="910" y2="327" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="327" x2="71.08" y2="327" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="331.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="267" x2="910" y2="267" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="267" x2="71.08" y2="267" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="271.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="207" x2="910" y2="207" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="207" x2="71.08" y2="207" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="211.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">30</tspan></text><line x1="71.08" y1="147" x2="910" y2="147" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="147" x2="71.08" y2="147" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="151.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">40</tspan></text><line x1="71.08" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="87" x2="71.08" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">50</tspan></text><line x1="71.08" y1="87" x2="71.08" y2="387" stroke="#5b7280" stroke-width="1.6"/><line x1="89.08" y1="87" x2="89.08" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="89.08" y1="387" x2="89.08" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="89.08" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="89.08" dy="0">0</tspan></text><line x1="196.136" y1="87" x2="196.136" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="196.136" y1="387" x2="196.136" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="196.136" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="196.136" dy="0">4</tspan></text><line x1="303.192" y1="87" x2="303.192" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="303.192" y1="387" x2="303.192" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="303.192" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="303.192" dy="0">8</tspan></text><line x1="410.248" y1="87" x2="410.248" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="410.248" y1="387" x2="410.248" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="410.248" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="410.248" dy="0">12</tspan></text><line x1="624.36" y1="87" x2="624.36" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="624.36" y1="387" x2="624.36" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="624.36" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="624.36" dy="0">20</tspan></text><line x1="892" y1="87" x2="892" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="387" x2="892" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">30</tspan></text><line x1="71.08" y1="387" x2="910" y2="387" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 237)">Coste esperado (semanas-equipo)</text><text x="490.54" y="433" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="490.54" dy="0">Semanas de espera antes de decidir</tspan></text><polyline points="89.08,375 196.136,352.8 303.192,330.6 410.248,309 624.36,265.2 892,205.2" fill="none" stroke="#087f8c" stroke-width="2.4"/><circle cx="89.08" cy="375" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="89.08" y="364" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="89.08" dy="0">2,0</tspan></text><circle cx="196.136" cy="352.8" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><circle cx="303.192" cy="330.6" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><circle cx="410.248" cy="309" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><circle cx="624.36" cy="265.2" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><circle cx="892" cy="205.2" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polyline points="89.08,315 196.136,301.2 303.192,289.8 410.248,279.6 624.36,258 892,198" fill="none" stroke="#946512" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="83.58" y="309.5" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="89.08" y="304" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="89.08" dy="0">12,0</tspan></text><rect x="190.636" y="295.7" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><rect x="297.692" y="284.3" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><rect x="404.748" y="274.1" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><rect x="618.86" y="252.5" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><rect x="886.5" y="192.5" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><polyline points="89.08,145.8 196.136,157.8 303.192,175.8 410.248,196.2 624.36,237 892,177" fill="none" stroke="#c0432f" stroke-width="2.4"/><polygon points="89.08,139.475 95.13,150.75 83.03,150.75" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="89.08" y="134.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="89.08" dy="0">40,2</tspan></text><polygon points="196.136,151.475 202.186,162.75 190.086,162.75" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><polygon points="303.192,169.475 309.242,180.75 297.142,180.75" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><polygon points="410.248,189.875 416.298,201.15 404.198,201.15" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><polygon points="624.36,230.675 630.41,241.95 618.31,241.95" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="624.36" y="226" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="624.36" dy="0">25,0 (mínimo)</tspan></text><polygon points="892,170.675 898.05,181.95 885.95,181.95" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="166" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">35,0</tspan></text><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La espera tiene un coste lineal de 1 por semana y la evidencia pasa de acertar el 60 % a acertar el 95 % tras un tiempo</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">desconocido (2 a 20 semanas). Esperar solo compensa cuando equivocarse es caro y la evidencia mejora de verdad. Es un</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">modelo de juguete con supuestos del autor: sirve para pensar la reversibilidad, no para fijar cifras.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
