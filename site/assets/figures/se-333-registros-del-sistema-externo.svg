<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 287" width="940" height="287" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">5 000 notas de un sistema externo con cuatro formatos distintos</title><desc id="d">Tabla: convertir la nota con float acepta 1 132 de 5 000 registros, rompe con 3 868 y deja pasar 411 notas fuera del rango de 1,0 a 7,0 porque vienen en escala de 0 a 100; una capa anticorrupción acepta 4 627 normalizados, no deja pasar ninguna fuera de rango y pone 373 en cuarentena con su motivo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="287" fill="#ffffff"/><rect x="10" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="132" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="132" dy="0">Adaptador</tspan></text><rect x="260" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="317" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="317" dy="0">Aceptadas</tspan></text><rect x="380" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="462" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="462" dy="0">Rotas por</tspan></text><text x="462" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="462" dy="0">excepción</tspan></text><rect x="550" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="632" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="632" dy="0">Aceptadas fuera de</tspan></text><text x="632" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="632" dy="0">rango</tspan></text><rect x="720" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="822" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="822" dy="0">En cuarentena</tspan></text><rect x="10" y="56" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Conversión directa con float</tspan></text><rect x="260" y="56" width="114" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="317" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="317" dy="0">1 132</tspan></text><rect x="380" y="56" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">3 868</tspan></text><rect x="550" y="56" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">411</tspan></text><rect x="720" y="56" width="204" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">0</tspan></text><rect x="10" y="114" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="143.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Capa anticorrupción</tspan></text><rect x="260" y="114" width="114" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="317" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="317" dy="0">4 627</tspan></text><rect x="380" y="114" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">0</tspan></text><rect x="550" y="114" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">0</tspan></text><rect x="720" y="114" width="204" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">373 (198 N/P, 175 vacías)</tspan></text><rect x="10" y="176" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="200.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El modelo externo usa coma decimal, punto decimal, escala de 0 a 100, «N/P» y vacío. La conversión directa no solo rompe:</tspan></text><text x="470" y="217.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">acepta como válidas 411 notas que significan otra cosa. La capa traduce, rechaza con motivo y deja un lugar único donde</tspan></text><text x="470" y="234.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">mirar. Distribución de formatos del autor.</tspan></text><text x="470" y="273.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; CPython 3.12 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
