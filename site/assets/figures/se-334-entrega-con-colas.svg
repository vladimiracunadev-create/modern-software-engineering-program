<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 594" width="940" height="594" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Días de entrega de un cambio según los equipos por los que pasa y su ocupación</title><desc id="d">Líneas con los días de entrega según el número de equipos por los que pasa un cambio: con ocupación del 50 por ciento la mediana sube de 1,4 días con un equipo a 9,3 con cinco; con 70, de 2,3 a 15,4; con 90, de 6,5 a 42,8, y su percentil 90 llega a 71,4; la espera crece más rápido cuanto mayor es la ocupación.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="594" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Días de entrega de un cambio según los equipos por los que pasa y su ocupación</tspan></text><circle cx="22" cy="51" r="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Ocupación 50 %, mediana</tspan></text><rect x="237.42" y="45" width="12" height="12" fill="#946512" stroke="#946512" stroke-width="2"/><text x="257.42" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="257.42" dy="0">Ocupación 70 %, mediana</tspan></text><polygon points="464.84,44.1 471.44,56.4 458.24,56.4" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="478.84" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="478.84" dy="0">Ocupación 90 %, mediana</tspan></text><polygon points="22,67.5 29.5,75 22,82.5 14.5,75" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="36" y="80" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Ocupación 90 %, percentil 90</tspan></text><line x1="71.08" y1="411" x2="910" y2="411" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="411" x2="71.08" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="415.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="336" x2="910" y2="336" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="336" x2="71.08" y2="336" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="340.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="261" x2="910" y2="261" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="261" x2="71.08" y2="261" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="265.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">40</tspan></text><line x1="71.08" y1="186" x2="910" y2="186" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="186" x2="71.08" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="190.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">60</tspan></text><line x1="71.08" y1="111" x2="910" y2="111" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="111" x2="71.08" y2="111" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="115.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">80</tspan></text><line x1="71.08" y1="111" x2="71.08" y2="411" stroke="#5b7280" stroke-width="1.6"/><line x1="89.08" y1="111" x2="89.08" y2="411" stroke="#d5dde1" stroke-width="1"/><line x1="89.08" y1="411" x2="89.08" y2="416" stroke="#5b7280" stroke-width="1.4"/><text x="89.08" y="432" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="89.08" dy="0">1</tspan></text><line x1="289.81" y1="111" x2="289.81" y2="411" stroke="#d5dde1" stroke-width="1"/><line x1="289.81" y1="411" x2="289.81" y2="416" stroke="#5b7280" stroke-width="1.4"/><text x="289.81" y="432" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="289.81" dy="0">2</tspan></text><line x1="490.54" y1="111" x2="490.54" y2="411" stroke="#d5dde1" stroke-width="1"/><line x1="490.54" y1="411" x2="490.54" y2="416" stroke="#5b7280" stroke-width="1.4"/><text x="490.54" y="432" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="490.54" dy="0">3</tspan></text><line x1="892" y1="111" x2="892" y2="411" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="411" x2="892" y2="416" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="432" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">5</tspan></text><line x1="71.08" y1="411" x2="910" y2="411" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="261" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 261)">Días de entrega</text><text x="490.54" y="457" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="490.54" dy="0">Equipos por los que pasa el cambio</tspan></text><polyline points="89.08,405.75 289.81,398.25 490.54,391.125 892,376.125" fill="none" stroke="#087f8c" stroke-width="2.4"/><circle cx="89.08" cy="405.75" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><circle cx="289.81" cy="398.25" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><circle cx="490.54" cy="391.125" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><circle cx="892" cy="376.125" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="400.125" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">9,3</tspan></text><polyline points="89.08,402.375 289.81,390 490.54,377.625 892,353.25" fill="none" stroke="#946512" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="83.58" y="396.875" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><rect x="284.31" y="384.5" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><rect x="485.04" y="372.125" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><rect x="886.5" y="347.75" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="892" y="342.25" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">15,4</tspan></text><polyline points="89.08,386.625 289.81,351.75 490.54,317.625 892,250.5" fill="none" stroke="#c0432f" stroke-width="2.4"/><polygon points="89.08,380.3 95.13,391.575 83.03,391.575" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><polygon points="289.81,345.425 295.86,356.7 283.76,356.7" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><polygon points="490.54,311.3 496.59,322.575 484.49,322.575" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><polygon points="892,244.175 898.05,255.45 885.95,255.45" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="239.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">42,8</tspan></text><polyline points="89.08,340.125 289.81,283.125 490.54,233.625 892,143.25" fill="none" stroke="#102a43" stroke-width="2.4" stroke-dasharray="7 4"/><polygon points="89.08,333.25 95.955,340.125 89.08,347 82.205,340.125" fill="#102a43" stroke="#102a43" stroke-width="2"/><polygon points="289.81,276.25 296.685,283.125 289.81,290 282.935,283.125" fill="#102a43" stroke="#102a43" stroke-width="2"/><polygon points="490.54,226.75 497.415,233.625 490.54,240.5 483.665,233.625" fill="#102a43" stroke="#102a43" stroke-width="2"/><polygon points="892,136.375 898.875,143.25 892,150.125 885.125,143.25" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="892" y="132.25" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">71,4</tspan></text><rect x="10" y="471" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="495.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Cada traspaso añade una cola y la espera crece más que linealmente con la ocupación. El trabajo (servicio medio de un día)</tspan></text><text x="470" y="512.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">es el mismo en todas las celdas: lo que cambia es cuánto espera. Colas M/M/1 en serie con llegadas de Poisson, un modelo</tspan></text><text x="470" y="529.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">ideal; los equipos reales tienen trabajo en paralelo, prioridades y vacaciones.</tspan></text><text x="470" y="576.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
