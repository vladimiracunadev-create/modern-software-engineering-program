<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 514" width="940" height="514" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reparto de 24 módulos entre 4 equipos: dependencias y cambios que cruzan equipos (32 dependencias)</title><desc id="d">Barras horizontales agrupadas con el porcentaje de dependencias y de cambios que cruzan equipos según el reparto: por comunidades de afinidad cruzan el 12 por ciento de las dependencias y el 16,3 de los cambios; con un equipo grande, 38 y 40,0; al azar, 81 y 66,8; por capa técnica, 91 y 72,5.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="514" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Reparto de 24 módulos entre 4 equipos: dependencias y cambios que cruzan equipos (32 dependencias)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Dependencias que cruzan equipos (de 32)</tspan></text><rect x="358.06" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="378.06" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="378.06" dy="0">Cambios que cruzan equipos</tspan></text><line x1="264" y1="77" x2="264" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="264" y1="333" x2="264" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="264" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="264" dy="0">0</tspan></text><line x1="387.952" y1="77" x2="387.952" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="387.952" y1="333" x2="387.952" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="387.952" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387.952" dy="0">20</tspan></text><line x1="511.904" y1="77" x2="511.904" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="511.904" y1="333" x2="511.904" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="511.904" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="511.904" dy="0">40</tspan></text><line x1="635.856" y1="77" x2="635.856" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="635.856" y1="333" x2="635.856" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="635.856" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="635.856" dy="0">60</tspan></text><line x1="759.808" y1="77" x2="759.808" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="759.808" y1="333" x2="759.808" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="759.808" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="759.808" dy="0">80</tspan></text><line x1="883.76" y1="77" x2="883.76" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="883.76" y1="333" x2="883.76" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="883.76" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="883.76" dy="0">100</tspan></text><line x1="264" y1="333" x2="883.76" y2="333" stroke="#5b7280" stroke-width="1.6"/><text x="254" y="113.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="254" dy="0">Por comunidad (afinidad real)</tspan></text><text x="254" y="177.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="254" dy="0">Un equipo grande y tres pequeños</tspan></text><text x="254" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="254" dy="0">Al azar</tspan></text><text x="254" y="305.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="254" dy="0">Por capa técnica</tspan></text><rect x="264" y="83" width="74.3712" height="24.5" rx="3" fill="#946512"/><text x="345.371" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="345.371" dy="0">12</tspan></text><rect x="264" y="110.5" width="101.021" height="24.5" rx="3" fill="#c0432f"/><text x="372.021" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="372.021" dy="0">16,3</tspan></text><rect x="264" y="147" width="235.509" height="24.5" rx="3" fill="#946512"/><text x="506.509" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="506.509" dy="0">38</tspan></text><rect x="264" y="174.5" width="247.904" height="24.5" rx="3" fill="#c0432f"/><text x="518.904" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="518.904" dy="0">40</tspan></text><rect x="264" y="211" width="502.006" height="24.5" rx="3" fill="#946512"/><text x="773.006" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="773.006" dy="0">81</tspan></text><rect x="264" y="238.5" width="414" height="24.5" rx="3" fill="#c0432f"/><text x="685" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="685" dy="0">66,8</tspan></text><rect x="264" y="275" width="563.982" height="24.5" rx="3" fill="#946512"/><text x="834.982" y="291.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="834.982" dy="0">91</tspan></text><rect x="264" y="302.5" width="449.326" height="24.5" rx="3" fill="#c0432f"/><text x="720.326" y="319.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="720.326" dy="0">72,5</tspan></text><text x="573.88" y="377" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="573.88" dy="0">Proporción (%)</tspan></text><rect x="10" y="391" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="415.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Los equipos por capa técnica son cómodos para especialistas y obligan a que casi todo cambio de negocio cruce equipos. El</tspan></text><text x="470" y="432.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">reparto por comunidad ahorra coordinación solo si las comunidades existen en el grafo de dependencias; el grafo y las</tspan></text><text x="470" y="449.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">probabilidades de arista son sintéticos. Los canales de comunicación crecen como n(n−1)/2: 28 con 8 personas, 190 con 20.</tspan></text><text x="470" y="496.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación sintética con semilla fija; salidas idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
