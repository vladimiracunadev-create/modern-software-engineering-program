<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 441" width="940" height="441" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cinco formas de provocar duplicados en un consumidor sin defensa (2 000 mensajes)</title><desc id="d">Tabla: sin ninguna defensa, la caída antes de acusar produce 106 efectos duplicados de 2 000, el acuse perdido 122, el reintento del productor 103, una visibilidad de 30 segundos menor que el tiempo de proceso 378 y reiniciar los desplazamientos de 200 mensajes produce 200.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="441" fill="#ffffff"/><rect x="10" y="12" width="424" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="222" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="222" dy="0">Causa provocada</tspan></text><rect x="440" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="602" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="602" dy="0">Parámetro</tspan></text><rect x="770" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="847" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="847" dy="0">Efectos</tspan></text><text x="847" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="847" dy="0">duplicados</tspan></text><rect x="10" y="56" width="424" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="83.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Caída del consumidor antes de acusar</tspan></text><rect x="440" y="56" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">5 % de los mensajes</tspan></text><rect x="770" y="56" width="154" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">106</tspan></text><rect x="10" y="110" width="424" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="137.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Acuse perdido en la red</tspan></text><rect x="440" y="110" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">5 % de los acuses</tspan></text><rect x="770" y="110" width="154" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">122</tspan></text><rect x="10" y="164" width="424" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="191.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Reintento del productor tras un tiempo agotado</tspan></text><rect x="440" y="164" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">5 % de los envíos, con otro id</tspan></text><rect x="770" y="164" width="154" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">103</tspan></text><rect x="10" y="218" width="424" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="245.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Visibilidad de 30 s menor que el proceso</tspan></text><rect x="440" y="218" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">Proceso lognormal, mediana 16 s</tspan></text><rect x="770" y="218" width="154" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">378</tspan></text><rect x="10" y="272" width="424" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="299.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Reinicio de desplazamientos</tspan></text><rect x="440" y="272" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="299.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">200 mensajes releídos</tspan></text><rect x="770" y="272" width="154" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="299.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">200</tspan></text><rect x="10" y="330" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="354.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cinco causas distintas producen el mismo síntoma, un efecto repetido, y se defienden de formas distintas. La de visibilidad</tspan></text><text x="470" y="371.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">es la más cara porque depende del tiempo de proceso y no de un fallo. Las probabilidades y la distribución del tiempo de</tspan></text><text x="470" y="388.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">proceso son supuestos del autor.</tspan></text><text x="470" y="427.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; CPython 3.12 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
