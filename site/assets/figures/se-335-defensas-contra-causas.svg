 fill="#142231"><tspan x="702" dy="0">0</tspan></text><rect x="770" y="218" width="154" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">0</tspan></text><rect x="10" y="272" width="304" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="299.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">Operación naturalmente idempotente</tspan></text><rect x="320" y="272" width="94" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="367" y="299.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="367" dy="0">0</tspan></text><rect x="420" y="272" width="94" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="467" y="299.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">0</tspan></text><rect x="520" y="272" width="114" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="299.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">0</tspan></text><rect x="640" y="272" width="124" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="702" y="299.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">0</tspan></text><rect x="770" y="272" width="154" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="299.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">0</tspan></text><rect x="10" y="330" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="354.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">La clave del mensaje no ve duplicados que nacen antes del corredor: el reintento del productor crea un mensaje nuevo con el</tspan></text><text x="470" y="371.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">mismo contenido. La clave de negocio atrapa todas las causas porque no depende de cómo llegó el duplicado, pero exige saber</tspan></text><text x="470" y="388.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">qué identifica una operación. SQLite real.</tspan></text><text x="470" y="427.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; CPython 3.12 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
