<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 461" width="930" height="461" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dónde falla la defensa de idempotencia: orden de los pasos y alcance de la clave</title><desc id="d">Tabla: guardar la clave de idempotencia y después el efecto en dos transacciones pierde 100 efectos de 2 000 cuando hay una caída entre ambos; guardar primero el efecto duplica 100; hacerlo en una sola transacción no pierde ni duplica; una clave solo por estudiante descarta 309 intentos legítimos de 609 y una clave por estudiante e intento no descarta ninguno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="461" fill="#ffffff"/><rect x="10" y="12" width="424" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="222" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="222" dy="0">Diseño de la defensa</tspan></text><rect x="440" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="512" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="512" dy="0">Efectos</tspan></text><text x="512" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="512" dy="0">perdidos</tspan></text><rect x="590" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="662" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="662" dy="0">Efectos</tspan></text><text x="662" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="662" dy="0">duplicados</tspan></text><rect x="740" y="12" width="174" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="827" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="827" dy="0">Intentos legítimos</tspan></text><text x="827" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="827" dy="0">descartados</tspan></text><rect x="10" y="56" width="424" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Guardar la clave y luego el efecto (dos transacciones)</tspan></text><rect x="440" y="56" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">100</tspan></text><rect x="590" y="56" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">0</tspan></text><rect x="740" y="56" width="174" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">—</tspan></text><rect x="10" y="114" width="424" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="143.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Guardar el efecto y luego la clave (dos transacciones)</tspan></text><rect x="440" y="114" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">0</tspan></text><rect x="590" y="114" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">100</tspan></text><rect x="740" y="114" width="174" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">—</tspan></text><rect x="10" y="172" width="424" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="201.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Clave y efecto en una sola transacción</tspan></text><rect x="440" y="172" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">0</tspan></text><rect x="590" y="172" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">0</tspan></text><rect x="740" y="172" width="174" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">—</tspan></text><rect x="10" y="230" width="424" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="259.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Clave gruesa: solo el estudiante</tspan></text><rect x="440" y="230" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">0</tspan></text><rect x="590" y="230" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">0</tspan></text><rect x="740" y="230" width="174" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">309</tspan></text><rect x="10" y="288" width="424" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="317.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Clave fina: estudiante e intento</tspan></text><rect x="440" y="288" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="317.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">0</tspan></text><rect x="590" y="288" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="317.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">0</tspan></text><rect x="740" y="288" width="174" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="317.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">0</tspan></text><rect x="10" y="350" width="910" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="465" y="374.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Una defensa mal ubicada produce el fallo contrario al que prevenía: perder en lugar de duplicar. La clave y el efecto</tspan></text><text x="465" y="391.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">deben confirmarse juntos, y la clave debe identificar la operación, no a la persona. Caída del 5 % entre pasos y 100</tspan></text><text x="465" y="408.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">duplicados reales entre 609 intentos legítimos: supuestos del autor.</tspan></text><text x="465" y="447.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Datos sintéticos con semilla fija; CPython 3.12 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
