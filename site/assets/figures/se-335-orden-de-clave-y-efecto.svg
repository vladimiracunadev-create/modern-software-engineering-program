<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 725" width="940" height="725" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dónde falla la defensa de idempotencia: orden de los pasos y alcance de la clave</title><desc id="d">Barras horizontales con los efectos perdidos, los duplicados y los intentos legítimos descartados según el diseño de la defensa: guardar la clave y luego el efecto en dos transacciones pierde 100 de 2 000; guardar el efecto y luego la clave duplica 100; una sola transacción no pierde ni duplica; una clave solo por estudiante descarta 309 de 609 intentos legítimos y una clave por estudiante e intento ninguno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="725" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dónde falla la defensa de idempotencia: orden de los pasos y alcance de la clave</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Efectos perdidos</tspan></text><rect x="184.64" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="204.64" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="204.64" dy="0">Efectos duplicados</tspan></text><rect x="368.36" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="388.36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="388.36" dy="0">Intentos legítimos descartados</tspan></text><line x1="324" y1="77" x2="324" y2="527" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="527" x2="324" y2="532" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="548" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="465.955" y1="77" x2="465.955" y2="527" stroke="#d5dde1" stroke-width="1"/><line x1="465.955" y1="527" x2="465.955" y2="532" stroke="#5b7280" stroke-width="1.4"/><text x="465.955" y="548" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="465.955" dy="0">100</tspan></text><line x1="607.91" y1="77" x2="607.91" y2="527" stroke="#d5dde1" stroke-width="1"/><line x1="607.91" y1="527" x2="607.91" y2="532" stroke="#5b7280" stroke-width="1.4"/><text x="607.91" y="548" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607.91" dy="0">200</tspan></text><line x1="749.865" y1="77" x2="749.865" y2="527" stroke="#d5dde1" stroke-width="1"/><line x1="749.865" y1="527" x2="749.865" y2="532" stroke="#5b7280" stroke-width="1.4"/><text x="749.865" y="548" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="749.865" dy="0">300</tspan></text><line x1="891.82" y1="77" x2="891.82" y2="527" stroke="#d5dde1" stroke-width="1"/><line x1="891.82" y1="527" x2="891.82" y2="532" stroke="#5b7280" stroke-width="1.4"/><text x="891.82" y="548" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="891.82" dy="0">400</tspan></text><line x1="324" y1="527" x2="891.82" y2="527" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="126.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Clave y luego efecto (dos transacciones)</tspan></text><text x="314" y="216.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Efecto y luego clave (dos transacciones)</tspan></text><text x="314" y="306.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Clave y efecto en una sola transacción</tspan></text><text x="314" y="396.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Clave gruesa: solo el estudiante</tspan></text><text x="314" y="486.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Clave fina: estudiante e intento</tspan></text><rect x="324" y="83" width="141.955" height="24" rx="3" fill="#c0432f"/><text x="472.955" y="99.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="472.955" dy="0">100</tspan></text><rect x="324" y="110" width="2" height="24" rx="3" fill="#946512"/><text x="333" y="126.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">0</tspan></text><rect x="324" y="137" width="2" height="24" rx="3" fill="#102a43"/><text x="333" y="153.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">0</tspan></text><rect x="324" y="173" width="2" height="24" rx="3" fill="#c0432f"/><text x="333" y="189.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">0</tspan></text><rect x="324" y="200" width="141.955" height="24" rx="3" fill="#946512"/><text x="472.955" y="216.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="472.955" dy="0">100</tspan></text><rect x="324" y="227" width="2" height="24" rx="3" fill="#102a43"/><text x="333" y="243.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">0</tspan></text><rect x="324" y="263" width="2" height="24" rx="3" fill="#c0432f"/><text x="333" y="279.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">0</tspan></text><rect x="324" y="290" width="2" height="24" rx="3" fill="#946512"/><text x="333" y="306.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">0</tspan></text><rect x="324" y="317" width="2" height="24" rx="3" fill="#102a43"/><text x="333" y="333.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">0</tspan></text><rect x="324" y="353" width="2" height="24" rx="3" fill="#c0432f"/><text x="333" y="369.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">0</tspan></text><rect x="324" y="380" width="2" height="24" rx="3" fill="#946512"/><text x="333" y="396.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">0</tspan></text><rect x="324" y="407" width="438.641" height="24" rx="3" fill="#102a43"/><text x="769.641" y="423.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="769.641" dy="0">309</tspan></text><rect x="324" y="443" width="2" height="24" rx="3" fill="#c0432f"/><text x="333" y="459.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">0</tspan></text><rect x="324" y="470" width="2" height="24" rx="3" fill="#946512"/><text x="333" y="486.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">0</tspan></text><rect x="324" y="497" width="2" height="24" rx="3" fill="#102a43"/><text x="333" y="513.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">0</tspan></text><text x="607.91" y="571" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="607.91" dy="0">De 2 000 efectos (descartados: de 609 intentos legítimos)</tspan></text><rect x="10" y="585" width="920" height="92.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="609.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Una defensa mal ubicada produce el fallo contrario al que prevenía: perder en lugar de duplicar. La clave y el efecto deben</tspan></text><text x="470" y="626.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">confirmarse juntos, y la clave debe identificar la operación, no a la persona. Los tres primeros diseños no miden intentos</tspan></text><text x="470" y="643.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">descartados (la tabla escribe un guion; aquí 0). Caída del 5 % entre pasos y 100 duplicados reales entre 609 intentos</tspan></text><text x="470" y="659.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">legítimos: supuestos del autor.</tspan></text><text x="470" y="707.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; CPython 3.12 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
