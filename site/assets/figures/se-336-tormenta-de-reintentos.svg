<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 345" width="940" height="345" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">600 mensajes que fallan a la vez y reintentan: carga que recibe el servicio por segundo</title><desc id="d">Tabla: con espera fija o exponencial sin jitter los 600 mensajes reintentan juntos y el servicio recibe un pico de 600 reintentos en un segundo, en 8 y 6 instantes; con jitter completo el pico baja a 93 y los reintentos se reparten en 468 segundos distintos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="345" fill="#ffffff"/><rect x="10" y="12" width="424" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="222" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="222" dy="0">Política de reintentos</tspan></text><rect x="440" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="517" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="517" dy="0">Reintentos</tspan></text><text x="517" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="517" dy="0">totales</tspan></text><rect x="600" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="672" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="672" dy="0">Pico por</tspan></text><text x="672" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="672" dy="0">segundo</tspan></text><rect x="750" y="12" width="174" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="837" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="837" dy="0">Segundos con</tspan></text><text x="837" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="837" dy="0">reintentos</tspan></text><rect x="10" y="56" width="424" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Espera fija de 30 s, 8 intentos</tspan></text><rect x="440" y="56" width="154" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="517" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517" dy="0">4 800</tspan></text><rect x="600" y="56" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">600</tspan></text><rect x="750" y="56" width="174" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">8</tspan></text><rect x="10" y="114" width="424" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="143.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Exponencial 10, 20, 40... s, sin jitter</tspan></text><rect x="440" y="114" width="154" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="517" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517" dy="0">3 600</tspan></text><rect x="600" y="114" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">600</tspan></text><rect x="750" y="114" width="174" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">6</tspan></text><rect x="10" y="172" width="424" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="201.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Exponencial 10, 20, 40... s, con jitter completo</tspan></text><rect x="440" y="172" width="154" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="517" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517" dy="0">3 600</tspan></text><rect x="600" y="172" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">93</tspan></text><rect x="750" y="172" width="174" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">468</tspan></text><rect x="10" y="234" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="258.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El retardo exponencial espacia los reintentos de un mensaje pero no los desincroniza entre mensajes: 600 mensajes que</tspan></text><text x="470" y="275.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">fallaron a la vez vuelven a la vez. El jitter reparte la carga y no cambia cuántos reintentos hay. Fallo simultáneo de</tspan></text><text x="470" y="292.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">todos los mensajes: supuesto del autor.</tspan></text><text x="470" y="331.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; CPython 3.12 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
