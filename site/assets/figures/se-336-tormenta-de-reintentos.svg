<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 567" width="940" height="567" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">600 mensajes que fallan a la vez y reintentan: carga que recibe el servicio</title><desc id="d">Barras agrupadas en escala logarítmica con los reintentos totales y el pico de reintentos en un segundo según la política: con espera fija de 30 segundos y ocho intentos hay 4 800 reintentos y un pico de 600 en 8 instantes; con exponencial sin jitter, 3 600 y un pico de 600 en 6 instantes; con jitter completo, 3 600 y un pico de 93 repartidos en 468 segundos distintos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="567" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">600 mensajes que fallan a la vez y reintentan: carga que recibe el servicio</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Reintentos totales</tspan></text><rect x="199.72" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="219.72" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="219.72" dy="0">Pico en un segundo</tspan></text><line x1="101.24" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="375" x2="101.24" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">10</tspan></text><line x1="101.24" y1="281.667" x2="920" y2="281.667" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="281.667" x2="101.24" y2="281.667" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="286.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">100</tspan></text><line x1="101.24" y1="188.333" x2="920" y2="188.333" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="188.333" x2="101.24" y2="188.333" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="192.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">1 000</tspan></text><line x1="101.24" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="95" x2="101.24" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">10 000</tspan></text><line x1="101.24" y1="95" x2="101.24" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">Reintentos (escala logarítmica)</text><rect x="128.532" y="124.751" width="107.168" height="250.249" rx="3" fill="#102a43"/><text x="182.116" y="118.751" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="182.116" dy="0">4 800</tspan></text><rect x="239.7" y="209.039" width="107.168" height="165.961" rx="3" fill="#c0432f"/><text x="293.284" y="203.039" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="293.284" dy="0">600</tspan></text><text x="237.7" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="237.7" dy="0">Espera fija de 30 s, 8 intentos</tspan></text><rect x="401.452" y="136.412" width="107.168" height="238.588" rx="3" fill="#102a43"/><text x="455.036" y="130.412" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="455.036" dy="0">3 600</tspan></text><rect x="512.62" y="209.039" width="107.168" height="165.961" rx="3" fill="#c0432f"/><text x="566.204" y="203.039" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="566.204" dy="0">600</tspan></text><text x="510.62" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="510.62" dy="0">Exponencial 10, 20, 40... s, sin</tspan></text><text x="510.62" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="510.62" dy="0">jitter</tspan></text><rect x="674.372" y="136.412" width="107.168" height="238.588" rx="3" fill="#102a43"/><text x="727.956" y="130.412" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="727.956" dy="0">3 600</tspan></text><rect x="785.54" y="284.608" width="107.168" height="90.3917" rx="3" fill="#c0432f"/><text x="839.124" y="278.608" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="839.124" dy="0">93</tspan></text><text x="783.54" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="783.54" dy="0">Exponencial 10, 20, 40... s, con</tspan></text><text x="783.54" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="783.54" dy="0">jitter completo</tspan></text><rect x="10" y="444" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="468.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El retardo exponencial espacia los reintentos de un mensaje pero no los desincroniza entre mensajes: 600 mensajes que</tspan></text><text x="470" y="485.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">fallaron a la vez vuelven a la vez (en 8, 6 y 468 segundos distintos con reintentos). El jitter reparte la carga y no</tspan></text><text x="470" y="502.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">cambia cuántos reintentos hay. Fallo simultáneo de todos los mensajes: supuesto del autor.</tspan></text><text x="470" y="549.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; CPython 3.12 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
