<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 567" width="900" height="567" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un validador sobre 200 mutaciones de un paquete de integración: 140 detectadas</title><desc id="d">Tabla: el validador detecta las 100 mutaciones estructurales, las 10 de ventana de deduplicación demasiado corta, las 20 de cero intentos o espera mal contada y las 10 de bandeja de entrada sin unicidad; no detecta ninguna de las 10 sin firma con la palabra HMAC presente, las 20 sin jitter o con horizonte incoherente, ni las de cola sin alarma, clave gruesa o datos personales.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="900" height="567" fill="#ffffff"/><rect x="10" y="12" width="554" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="287" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="287" dy="0">Tipo de mutación</tspan></text><rect x="570" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="647" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="647" dy="0">Mutaciones</tspan></text><rect x="730" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="807" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="807" dy="0">Detectadas</tspan></text><rect x="10" y="56" width="554" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="78.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Quitar o vaciar una sección</tspan></text><rect x="570" y="56" width="154" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="78.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">100</tspan></text><rect x="730" y="56" width="154" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="78.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">100</tspan></text><rect x="10" y="100" width="554" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="122.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Ventana de deduplicación menor que el horizonte de reintentos</tspan></text><rect x="570" y="100" width="154" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="122.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">10</tspan></text><rect x="730" y="100" width="154" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="122.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">10</tspan></text><rect x="10" y="144" width="554" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="166.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Cero intentos o espera mal contada</tspan></text><rect x="570" y="144" width="154" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="166.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">20</tspan></text><rect x="730" y="144" width="154" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="166.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">20</tspan></text><rect x="10" y="188" width="554" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="210.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Bandeja de entrada sin restricción de unicidad</tspan></text><rect x="570" y="188" width="154" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="210.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">10</tspan></text><rect x="730" y="188" width="154" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="210.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">10</tspan></text><rect x="10" y="232" width="554" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="254.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Sin firma, aunque aparezca la palabra HMAC</tspan></text><rect x="570" y="232" width="154" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="254.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">10</tspan></text><rect x="730" y="232" width="154" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="254.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">0</tspan></text><rect x="10" y="276" width="554" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="298.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Reintentos sin jitter o con horizonte incoherente</tspan></text><rect x="570" y="276" width="154" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="298.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">20</tspan></text><rect x="730" y="276" width="154" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="298.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">0</tspan></text><rect x="10" y="320" width="554" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="342.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Cola de fallidos sin alarma ni dueño</tspan></text><rect x="570" y="320" width="154" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="342.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">10</tspan></text><rect x="730" y="320" width="154" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="342.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">0</tspan></text><rect x="10" y="364" width="554" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="386.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Clave de idempotencia demasiado gruesa</tspan></text><rect x="570" y="364" width="154" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="386.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">10</tspan></text><rect x="730" y="364" width="154" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="386.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">0</tspan></text><rect x="10" y="408" width="554" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="430.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Registrar datos personales</tspan></text><rect x="570" y="408" width="154" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="430.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">10</tspan></text><rect x="730" y="408" width="154" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="430.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">0</tspan></text><rect x="10" y="456" width="880" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="450" y="480.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="450" dy="0">Un paquete completo no es un paquete correcto: el validador ve la forma y algunas incoherencias numéricas, y deja</tspan></text><text x="450" y="497.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="450" dy="0">pasar todo lo que requiere entender el sentido. Las reglas se escribieron mirando estos mismos casos, por lo que 140</tspan></text><text x="450" y="514.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="450" dy="0">de 200 no estima su exactitud real.</tspan></text><text x="450" y="553.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">Datos sintéticos con semilla fija; CPython 3.12 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
