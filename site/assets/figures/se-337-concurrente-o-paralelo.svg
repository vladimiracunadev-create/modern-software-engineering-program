<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 403" width="970" height="403" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tiempo total de 200 solicitudes según el modelo de ejecución (milisegundos virtuales)</title><desc id="d">Tabla con el tiempo total de 200 solicitudes: con 10 ms de CPU y 90 de espera, el modelo concurrente de un núcleo baja de 20 000 a 2 090 ms y combinado con 4 núcleos a 590; con 100 ms de CPU y nada de espera solo ayuda el paralelismo, que da 5 000.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="403" fill="#ffffff"/><rect x="10" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Modelo</tspan></text><rect x="390" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="482" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="482" dy="0">10 ms CPU + 90 ms</tspan></text><text x="482" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="482" dy="0">espera</tspan></text><rect x="580" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="672" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="672" dy="0">90 ms CPU + 10 ms</tspan></text><text x="672" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="672" dy="0">espera</tspan></text><rect x="770" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="862" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="862" dy="0">100 ms CPU + 0</tspan></text><text x="862" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="862" dy="0">espera</tspan></text><rect x="10" y="56" width="374" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Secuencial</tspan></text><rect x="390" y="56" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">20 000</tspan></text><rect x="580" y="56" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">20 000</tspan></text><rect x="770" y="56" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">20 000</tspan></text><rect x="10" y="114" width="374" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="143.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Concurrente, un núcleo (la espera se solapa)</tspan></text><rect x="390" y="114" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">2 090 (×9,57)</tspan></text><rect x="580" y="114" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">18 010 (×1,11)</tspan></text><rect x="770" y="114" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">20 000 (×1,00)</tspan></text><rect x="10" y="172" width="374" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="193.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Paralelo, 4 núcleos, cada tarea bloquea su</tspan></text><text x="197" y="209.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">núcleo</tspan></text><rect x="390" y="172" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">5 000 (×4,00)</tspan></text><rect x="580" y="172" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">5 000 (×4,00)</tspan></text><rect x="770" y="172" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">5 000 (×4,00)</tspan></text><rect x="10" y="230" width="374" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="259.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Concurrente y 4 núcleos</tspan></text><rect x="390" y="230" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">590 (×33,90)</tspan></text><rect x="580" y="230" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">4 510 (×4,43)</tspan></text><rect x="770" y="230" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">5 000 (×4,00)</tspan></text><rect x="10" y="292" width="950" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="485" y="316.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">Concurrencia y paralelismo resuelven problemas distintos: solapar esperas ayuda cuando hay espera; repartir CPU ayuda cuando</tspan></text><text x="485" y="333.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">hay CPU. Un hilo que bloquea mientras espera gasta un núcleo entero. Es un planificador en tiempo virtual escrito por el autor,</tspan></text><text x="485" y="350.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">no una medición de Python ni de un sistema operativo.</tspan></text><text x="485" y="389.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Modelos sintéticos con semilla fija; resultados idénticos en Windows y Ubuntu (WSL2) salvo donde se indica.</tspan></text></svg>
