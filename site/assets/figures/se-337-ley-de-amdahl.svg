<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 387" width="930" height="387" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Aceleración según la parte secuencial y el número de trabajadores (ley de Amdahl)</title><desc id="d">Tabla de la aceleración teórica: con un 5 por ciento secuencial, 64 trabajadores dan 15,4 veces y el tope es 20; con un 25 por ciento, 64 trabajadores dan 3,8 y el tope es 4; con un 50 por ciento el tope es 2.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="387" fill="#ffffff"/><rect x="10" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="82" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="82" dy="0">Parte</tspan></text><text x="82" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="82" dy="0">secuencial</tspan></text><rect x="160" y="12" width="84" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="202" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="202" dy="0">2</tspan></text><rect x="250" y="12" width="84" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="292" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="292" dy="0">4</tspan></text><rect x="340" y="12" width="84" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="382" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="382" dy="0">8</t