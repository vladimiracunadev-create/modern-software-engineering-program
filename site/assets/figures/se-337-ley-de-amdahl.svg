ext x="472" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">3,37</tspan></text><rect x="520" y="164" width="84" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">3,82</tspan></text><rect x="610" y="164" width="84" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">4</tspan></text><rect x="700" y="164" width="214" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">28</tspan></text><rect x="10" y="218" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="245.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="82" dy="0">50 %</tspan></text><rect x="160" y="218" width="84" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="202" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="202" dy="0">1,33</tspan></text><rect x="250" y="218" width="84" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="292" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="292" dy="0">1,60</tspan></text><rect x="340" y="218" width="84" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="382" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382" dy="0">1,78</tspan></text><rect x="430" y="218" width="84" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">1,88</tspan></text><rect x="520" y="218" width="84" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">1,97</tspan></text><rect x="610" y="218" width="84" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">2</tspan></text><rect x="700" y="218" width="214" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">10</tspan></text><rect x="10" y="276" width="910" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="300.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">Acercarse al tope exige muchos más trabajadores de los que parece: con un 5 % secuencial, 171 para llegar al 90 % de 20.</tspan></text><text x="465" y="317.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">La fórmula es 1 / (s + (1 − s) / n) y supone una carga fija sin costo de coordinación, que en la práctica añade un tramo</tspan></text><text x="465" y="334.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">secuencial más.</tspan></text><text x="465" y="373.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Modelos sintéticos con semilla fija; resultados idénticos en Windows y Ubuntu (WSL2) salvo donde se indica.</tspan></text></svg>
