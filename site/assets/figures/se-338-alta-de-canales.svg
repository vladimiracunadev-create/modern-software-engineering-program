<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 501" width="940" height="501" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Añadir tres canales de aviso: líneas tocadas del núcleo en un monolito con if y elif y en un núcleo con complementos</title><desc id="d">Barras con las líneas del núcleo que se tocan al añadir tres canales: un monolito con if y elif toca 6 líneas, pasando de 8 a 14, y un núcleo con complementos descubiertos en un directorio toca 0 porque los tres canales son archivos nuevos y la huella del código no cambia.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="501" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Añadir tres canales de aviso: líneas tocadas del núcleo en un monolito con if y elif y en un núcleo con</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">complementos</tspan></text><line x1="63.54" y1="326" x2="920" y2="326" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="326" x2="63.54" y2="326" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="330.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">0</tspan></text><line x1="63.54" y1="246" x2="920" y2="246" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="246" x2="63.54" y2="246" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="250.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">2</tspan></text><line x1="63.54" y1="166" x2="920" y2="166" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="166" x2="63.54" y2="166" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="170.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">4</tspan></text><line x1="63.54" y1="86" x2="920" y2="86" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="86" x2="63.54" y2="86" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="90.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">6</tspan></text><line x1="63.54" y1="86" x2="63.54" y2="326" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="206" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 206)">Líneas del núcleo tocadas al añadir 3 canales</text><rect x="106.363" y="86" width="342.584" height="240" rx="3" fill="#102a43"/><text x="277.655" y="80" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="277.655" dy="0">6</tspan></text><text x="277.655" y="347" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="277.655" dy="0">Monolito con if y elif</tspan></text><rect x="534.593" y="324" width="342.584" height="2" rx="3" fill="#102a43"/><text x="705.885" y="318" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="705.885" dy="0">0</tspan></text><text x="705.885" y="347" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705.885" dy="0">Núcleo con complementos descubiertos</tspan></text><rect x="10" y="378" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="402.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">El monolito pasa de 8 líneas con 3 canales a 14 con 6; el núcleo con complementos conserva la misma huella SHA-256 del</tspan></text><text x="470" y="419.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">código fuente de su clase antes y después. La huella se calcula con SHA-256 del código fuente de la clase del núcleo. Esto</tspan></text><text x="470" y="436.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">mide la extensión sin tocar el núcleo, no que el contrato del complemento sea bueno: ese contrato es el costo del estilo.</tspan></text><text x="470" y="483.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; los recuentos se repiten y los tiempos varían de un equipo a otro.</tspan></text></svg>
