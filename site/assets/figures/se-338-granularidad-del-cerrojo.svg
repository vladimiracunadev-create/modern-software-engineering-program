<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 333" width="890" height="333" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Fracción del trabajo que avanza sin esperar con 8 trabajadores (20 000 rondas, 40 cursos)</title><desc id="d">Tabla: con un cerrojo global avanza el 12,5 por ciento del trabajo; con 8 fragmentos, 59,1 si los cursos se piden con popularidad Zipf y 65,6 si son uniformes; con un cerrojo por curso, 73,8 y 91,7.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="890" height="333" fill="#ffffff"/><rect x="10" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Cerrojo</tspan></text><rect x="390" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="522" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="522" dy="0">Cursos con popularidad Zipf 1,1</tspan></text><rect x="660" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="767" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="767" dy="0">Cursos uniformes</tspan></text><rect x="10" y="56" width="374" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="83.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Un cerrojo global</tspan></text><rect x="390" y="56" width="264" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="522" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="522" dy="0">12,5 %</tspan></text><rect x="660" y="56" width="214" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">12,5 %</tspan></text><rect x="10" y="110" width="374" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="137.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">8 fragmentos (clave módulo 8)</tspan></text><rect x="390" y="110" width="264" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="522" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="522" dy="0">59,1 %</tspan></text><rect x="660" y="110" width="214" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">65,6 %</tspan></text><rect x="10" y="164" width="374" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="191.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Un cerrojo por curso (40)</tspan></text><rect x="390" y="164" width="264" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="522" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="522" dy="0">73,8 %</tspan></text><rect x="660" y="164" width="214" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">91,7 %</tspan></text><rect x="10" y="222" width="870" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="445" y="246.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="445" dy="0">Dividir el cerrojo ayuda hasta donde la distribución de las claves lo permite: con unos pocos cursos populares, los</tspan></text><text x="445" y="263.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="445" dy="0">trabajadores siguen chocando en el mismo cerrojo. Cada ronda es una comparación de claves, no tiempo de ejecución;</tspan></text><text x="445" y="280.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="445" dy="0">un cerrojo por curso tiene además un costo de memoria y de orden de adquisición.</tspan></text><text x="445" y="319.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="445" dy="0">Modelos sintéticos con semilla fija; resultados idénticos en Windows y Ubuntu (WSL2) salvo donde se indica.</tspan></text></svg>
