<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 315" width="970" height="315" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dos hilos y dos cerrojos: ejecuciones del modelo de estados que terminan en interbloqueo</title><desc id="d">Tabla: con orden opuesto de adquisición, de 6 ejecuciones del modelo 2 terminan en interbloqueo; con el mismo orden ninguna. Con tiempo límite y una barrera, en Windows ambos hilos fallan y en Ubuntu uno completa tras liberar el otro.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="315" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Orden de adquisición</tspan></text><rect x="340" y="12" width="94" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="387" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="387" dy="0">Ejecuciones</tspan></text><rect x="440" y="12" width="94" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="487" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="487" dy="0">Completan</tspan></text><rect x="540" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="607" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="607" dy="0">Interbloqueo</tspan></text><rect x="680" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="817" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="817" dy="0">Con barrera y tiempo límite de 0,3</tspan></text><text x="817" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="817" dy="0">s</tspan></text><rect x="10" y="56" width="324" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="92.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Un hilo toma A y luego B; el otro B y luego A</tspan></text><rect x="340" y="56" width="94" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="387" y="92.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387" dy="0">6</tspan></text><rect x="440" y="56" width="94" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="92.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">4</tspan></text><rect x="540" y="56" width="134" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="607" y="92.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607" dy="0">2 (33,3 %)</tspan></text><rect x="680" y="56" width="274" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="84.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">Ambos agotan el tiempo (Windows) ·</tspan></text><text x="817" y="100.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">uno completa (Ubuntu)</tspan></text><rect x="10" y="128" width="324" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="164.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Ambos toman A y luego B</tspan></text><rect x="340" y="128" width="94" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="387" y="164.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387" dy="0">2</tspan></text><rect x="440" y="128" width="94" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="164.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">2</tspan></text><rect x="540" y="128" width="134" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="607" y="164.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607" dy="0">0</tspan></text><rect x="680" y="128" width="274" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="164.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">—</tspan></text><rect x="10" y="204" width="950" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="485" y="228.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="485" dy="0">Un orden global de adquisición elimina el ciclo de espera. El tiempo límite no lo evita: lo convierte en un error, y quién</tspan></text><text x="485" y="245.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="485" dy="0">falla primero depende de una carrera de temporización (distinta entre los dos sistemas). Recuperarse exige liberar lo ya tomado</tspan></text><text x="485" y="262.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="485" dy="0">y poder repetir.</tspan></text><text x="485" y="301.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Modelo exhaustivo determinista; la última columna es una ejecución real y no es reproducible entre sistemas.</tspan></text></svg>
