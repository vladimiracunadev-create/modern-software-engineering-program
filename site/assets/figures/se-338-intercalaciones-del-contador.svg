<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 271" width="960" height="271" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dos hilos suben un contador dos veces cada uno: todas las intercalaciones (valor correcto: 4)</title><desc id="d">Tabla: de 70 intercalaciones de dos hilos que leen, suman y escriben dos veces, solo 6 terminan en 4; 32 terminan en 3 y 32 en 2 sin aviso. Con un cerrojo alrededor de cada incremento solo son posibles 6 intercalaciones y todas terminan en 4.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="271" fill="#ffffff"/><rect x="10" y="12" width="414" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="217" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="217" dy="0">Variante</tspan></text><rect x="430" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="522" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="522" dy="0">Intercalaciones</tspan></text><text x="522" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="522" dy="0">posibles</tspan></text><rect x="620" y="12" width="104" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="672" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="672" dy="0">Final = 4</tspan></text><rect x="730" y="12" width="104" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="782" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="782" dy="0">Final = 3</tspan></text><rect x="840" y="12" width="104" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="892" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="892" dy="0">Final = 2</tspan></text><rect x="10" y="56" width="414" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Sin cerrojo: leer, sumar, escribir</tspan></text><rect x="430" y="56" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="522" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="522" dy="0">70</tspan></text><rect x="620" y="56" width="104" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">6</tspan></text><rect x="730" y="56" width="104" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">32</tspan></text><rect x="840" y="56" width="104" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="892" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">32</tspan></text><rect x="10" y="114" width="414" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="143.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Con cerrojo alrededor de cada incremento</tspan></text><rect x="430" y="114" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="522" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="522" dy="0">6</tspan></text><rect x="620" y="114" width="104" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">6</tspan></text><rect x="730" y="114" width="104" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">0</tspan></text><rect x="840" y="114" width="104" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="892" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">0</tspan></text><rect x="10" y="176" width="940" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="200.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Cuatro hilos reales de CPython 3.12 con 100 000 incrementos sin cerrojo dieron 400 000 en tres ejecuciones: el defecto existe</tspan></text><text x="480" y="217.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">y no se vio. Que una prueba pase no demuestra que no haya carrera; enumerar o forzar el orden sí la expone.</tspan></text><text x="480" y="257.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Modelos sintéticos con semilla fija; resultados idénticos en Windows y Ubuntu (WSL2) salvo donde se indica.</tspan></text></svg>
