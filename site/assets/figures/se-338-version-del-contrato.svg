<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 395" width="940" height="395" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un núcleo que sube su contrato a la versión 2: seis complementos, cinco escritos para la versión 1</title><desc id="d">Barras apiladas horizontales con los seis complementos según la política del núcleo: sin comprobar la versión, 0 correctos y 6 rotos en plena ejecución; si exige la API 2, 1 cargado y 5 rechazados al arrancar con su motivo; con un adaptador para la API 1, 6 cargados y 0 rechazados, sin cambios para sus autores.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="395" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un núcleo que sube su contrato a la versión 2: seis complementos, cinco escritos para la versión 1</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Correctos o cargados</tspan></text><rect x="214.8" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="234.8" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="234.8" dy="0">Rotos o rechazados</tspan></text><line x1="214" y1="77" x2="214" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="214" y1="197" x2="214" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="214" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="214" dy="0">0</tspan></text><line x1="434.567" y1="77" x2="434.567" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="434.567" y1="197" x2="434.567" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="434.567" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="434.567" dy="0">2</tspan></text><line x1="655.133" y1="77" x2="655.133" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="655.133" y1="197" x2="655.133" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="655.133" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="655.133" dy="0">4</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="197" x2="875.7" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">6</tspan></text><line x1="214" y1="197" x2="875.7" y2="197" stroke="#5b7280" stroke-width="1.6"/><text x="204" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="204" dy="0">Sin comprobar la versión</tspan></text><text x="204" y="141.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="204" dy="0">Exigir la API 2</tspan></text><text x="204" y="181.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="204" dy="0">Adaptador para la API 1</tspan></text><rect x="214" y="84" width="0" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="214" y="84" width="661.7" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="544.85" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="544.85" dy="0">6</tspan></text><text x="882.7" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">6</tspan></text><rect x="214" y="124" width="110.283" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="269.142" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="269.142" dy="0">1</tspan></text><rect x="324.283" y="124" width="551.417" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="599.992" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="599.992" dy="0">5</tspan></text><text x="882.7" y="141.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">6</tspan></text><rect x="214" y="164" width="661.7" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="544.85" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="544.85" dy="0">6</tspan></text><rect x="875.7" y="164" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="181.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">6</tspan></text><text x="544.85" y="241" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="544.85" dy="0">Complementos de 6</tspan></text><rect x="10" y="255" width="920" height="92.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="279.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Cuándo se descubre: sin comprobar, en plena ejecución; exigiendo la API 2, al arrancar y con motivo; con adaptador, no hay</tspan></text><text x="470" y="296.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">nada que descubrir. El contrato entre núcleo y complemento es la parte más cara de un microkernel: cambiarlo rompe a quien</tspan></text><text x="470" y="313.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">no controlas. La versión declarada convierte un fallo en ejecución en un rechazo al arrancar; el adaptador lo convierte en</tspan></text><text x="470" y="329.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">una deuda del núcleo.</tspan></text><text x="470" y="377.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; los recuentos se repiten y los tiempos varían de un equipo a otro.</tspan></text></svg>
