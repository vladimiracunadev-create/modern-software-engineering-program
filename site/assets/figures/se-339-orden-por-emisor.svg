<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 333" width="860" height="333" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un buzón conserva el orden de cada emisor, no el orden entre emisores</title><desc id="d">Tabla: tres emisores con dos mensajes cada uno pueden producir 90 órdenes globales; en 2 000 ejecuciones asyncio produjo 89 distintos, y ninguna alteró el orden de los mensajes de un mismo emisor.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="860" height="333" fill="#ffffff"/><rect x="10" y="12" width="634" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="327" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="327" dy="0">Medida</tspan></text><rect x="650" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="747" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="747" dy="0">Resultado</tspan></text><rect x="10" y="56" width="634" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="83.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Órdenes globales posibles de 3 emisores con 2 mensajes cada uno</tspan></text><rect x="650" y="56" width="194" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">90</tspan></text><rect x="10" y="110" width="634" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="137.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Órdenes globales distintos observados en 2 000 ejecuciones</tspan></text><rect x="650" y="110" width="194" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">89</tspan></text><rect x="10" y="164" width="634" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="191.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Ejecuciones en que un emisor vio alterado su propio orden</tspan></text><rect x="650" y="164" width="194" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">0</tspan></text><rect x="10" y="222" width="840" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="430" y="246.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="430" dy="0">El orden entre emisores no existe como propiedad del buzón: depende de quién llegó antes. Cualquier lógica que</tspan></text><text x="430" y="263.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="430" dy="0">lo suponga funcionará hasta que cambie el reparto de los turnos. El retardo aleatorio de los emisores es una</tspan></text><text x="430" y="280.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="430" dy="0">construcción del autor.</tspan></text><text x="430" y="319.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="430" dy="0">Modelos sintéticos con semilla fija; resultados idénticos en Windows y Ubuntu (WSL2) salvo donde se indica.</tspan></text></svg>
