<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 514" width="940" height="514" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cambio incompatible del contrato de s7 en ocho servicios: cuántos deben cambiar o desplegarse a la vez</title><desc id="d">Barras agrupadas con los servicios afectados por un cambio incompatible en s7 en dos topologías de ocho servicios: en una cadena, 7 transitivos y 1 directo; en una estrella con siete servicios que llaman a s7, 7 transitivos y 7 directos; con un cambio compatible y consumidores tolerantes, 0 despliegues coordinados en ambas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="514" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cambio incompatible del contrato de s7 en ocho servicios: cuántos deben cambiar o desplegarse a la vez</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Afectados (transitivos)</tspan></text><rect x="237.42" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="257.42" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="257.42" dy="0">Afectados (directos)</tspan></text><rect x="436.22" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="456.22" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="456.22" dy="0">Con cambio compatible</tspan></text><line x1="63.54" y1="355" x2="920" y2="355" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="355" x2="63.54" y2="355" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="359.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">0</tspan></text><line x1="63.54" y1="290" x2="920" y2="290" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="290" x2="63.54" y2="290" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="294.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">2</tspan></text><line x1="63.54" y1="225" x2="920" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="225" x2="63.54" y2="225" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="229.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">4</tspan></text><line x1="63.54" y1="160" x2="920" y2="160" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="160" x2="63.54" y2="160" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="164.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">6</tspan></text><line x1="63.54" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="95" x2="63.54" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">8</tspan></text><line x1="63.54" y1="95" x2="63.54" y2="355" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="225" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 225)">Servicios que coordinar</text><rect x="106.363" y="127.5" width="111.528" height="227.5" rx="3" fill="#946512"/><text x="162.127" y="121.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162.127" dy="0">7</tspan></text><rect x="221.891" y="322.5" width="111.528" height="32.5" rx="3" fill="#c0432f"/><text x="277.655" y="316.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="277.655" dy="0">1</tspan></text><rect x="337.419" y="353" width="111.528" height="2" rx="3" fill="#087f8c"/><text x="393.183" y="347" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="393.183" dy="0">0</tspan></text><text x="277.655" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="277.655" dy="0">Cadena de ocho servicios</tspan></text><rect x="534.593" y="127.5" width="111.528" height="227.5" rx="3" fill="#946512"/><text x="590.357" y="121.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="590.357" dy="0">7</tspan></text><rect x="650.121" y="127.5" width="111.528" height="227.5" rx="3" fill="#c0432f"/><text x="705.885" y="121.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="705.885" dy="0">7</tspan></text><rect x="765.649" y="353" width="111.528" height="2" rx="3" fill="#087f8c"/><text x="821.413" y="347" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="821.413" dy="0">0</tspan></text><text x="705.885" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705.885" dy="0">Siete servicios que llaman a uno</tspan></text><rect x="10" y="407" width="920" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="431.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Un servicio con consumidores que dependen de su forma exacta se despliega con ellos: es un monolito distribuido con más</tspan></text><text x="470" y="448.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">latencia. Lo que desacopla es la compatibilidad de los contratos, no la separación de procesos.</tspan></text><text x="470" y="496.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 44; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
