<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 606" width="940" height="606" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una petición que atraviesa k servicios en serie, cada uno al 99,9 % y con latencia mediana de 20 ms: disponibilidad y latencia</title><desc id="d">Líneas con la latencia mediana y el percentil 99 de una petición que atraviesa k servicios en serie: la mediana sube de 20,1 a 186,1 milisegundos y el percentil 99 de 79,2 a 316,7 con 1, 2, 4 y 8 servicios; la disponibilidad analítica baja de 99,900 a 99,203 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="606" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Una petición que atraviesa k servicios en serie, cada uno al 99,9 % y con latencia mediana de 20 ms:</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">disponibilidad y latencia</tspan></text><circle cx="22" cy="70" r="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">p50</tspan></text><rect x="86.62" y="64" width="12" height="12" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="106.62" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="106.62" dy="0">p99</tspan></text><line x1="78.62" y1="406" x2="910" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="406" x2="78.62" y2="406" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="410.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="331" x2="910" y2="331" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="331" x2="78.62" y2="331" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="335.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="256" x2="910" y2="256" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="256" x2="78.62" y2="256" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="260.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">200</tspan></text><line x1="78.62" y1="181" x2="910" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="181" x2="78.62" y2="181" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="185.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">300</tspan></text><line x1="78.62" y1="106" x2="910" y2="106" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="106" x2="78.62" y2="106" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">400</tspan></text><line x1="78.62" y1="106" x2="78.62" y2="406" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="106" x2="96.62" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="406" x2="96.62" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="427" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">1</tspan></text><line x1="210.246" y1="106" x2="210.246" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="210.246" y1="406" x2="210.246" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="210.246" y="427" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="210.246" dy="0">2</tspan></text><line x1="437.497" y1="106" x2="437.497" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="437.497" y1="406" x2="437.497" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="437.497" y="427" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437.497" dy="0">4</tspan></text><line x1="892" y1="106" x2="892" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="406" x2="892" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="427" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">8</tspan></text><line x1="78.62" y1="406" x2="910" y2="406" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="256" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 256)">Milisegundos</text><text x="494.31" y="452" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Servicios en la cadena</tspan></text><polyline points="96.62,390.925 210.246,373.525 437.497,337.975 892,266.425" fill="none" stroke="#087f8c" stroke-width="2.4"/><circle cx="96.62" cy="390.925" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="96.62" y="379.925" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">20,1</tspan></text><circle cx="210.246" cy="373.525" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="210.246" y="362.525" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="210.246" dy="0">43,3</tspan></text><circle cx="437.497" cy="337.975" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="437.497" y="326.975" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="437.497" dy="0">90,7</tspan></text><circle cx="892" cy="266.425" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="255.425" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">186,1</tspan></text><polyline points="96.62,346.6 210.246,315.55 437.497,260.575 892,168.475" fill="none" stroke="#c0432f" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="91.12" y="341.1" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="96.62" y="335.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">79,2</tspan></text><rect x="204.746" y="310.05" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="210.246" y="304.55" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="210.246" dy="0">120,6</tspan></text><rect x="431.997" y="255.075" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="437.497" y="249.575" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="437.497" dy="0">193,9</tspan></text><rect x="886.5" y="162.975" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="157.475" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">316,7</tspan></text><rect x="10" y="466" width="920" height="92.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="490.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Disponibilidad analítica y simulada con 1, 2, 4 y 8 servicios: 99,900 % y 99,915 %; 99,800 % y 99,750 %; 99,601 % y 99,655</tspan></text><text x="470" y="507.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">%; 99,203 % y 99,150 %. La disponibilidad de una cadena es el producto de las de sus eslabones: ocho servicios al 99,9 %</tspan></text><text x="470" y="524.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">dan 99,2 %, unas cinco horas más de caída al mes que un solo servicio. Los 20 000 casos simulados con semilla 44 coinciden</tspan></text><text x="470" y="540.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">con la fórmula dentro de su ruido. La latencia de cada salto es una distribución lognormal del autor.</tspan></text><text x="470" y="588.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 44; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
