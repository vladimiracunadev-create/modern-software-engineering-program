<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 534" width="1000" height="534" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Costo medido de una consulta de aviso según cómo se llame: en proceso, serializada y por HTTP en la misma máquina</title><desc id="d">Barras agrupadas en escala logarítmica con la mediana y el percentil 99 en milisegundos de cuatro formas de hacer la misma consulta: en el mismo proceso 0,0002 y 0,0002, serializar y deserializar JSON 0,0051 y 0,0162, HTTP local con conexión reutilizada 0,3237 y 0,6739, y HTTP local con conexión nueva 1,0791 y 1,8198.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="534" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Costo medido de una consulta de aviso según cómo se llame: en proceso, serializada y por HTTP en la misma máquina</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Mediana</tspan></text><rect x="116.78" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="136.78" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="136.78" dy="0">p99</tspan></text><line x1="101.24" y1="375" x2="980" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="375" x2="101.24" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">0,0001</tspan></text><line x1="101.24" y1="319" x2="980" y2="319" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="319" x2="101.24" y2="319" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="323.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">0,001</tspan></text><line x1="101.24" y1="263" x2="980" y2="263" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="263" x2="101.24" y2="263" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="267.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">0,01</tspan></text><line x1="101.24" y1="207" x2="980" y2="207" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="207" x2="101.24" y2="207" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="211.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">0,1</tspan></text><line x1="101.24" y1="151" x2="980" y2="151" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="151" x2="101.24" y2="151" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="155.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">1</tspan></text><line x1="101.24" y1="95" x2="980" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="95" x2="101.24" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">10</tspan></text><line x1="101.24" y1="95" x2="101.24" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">Milisegundos (escala logarítmica)</text><rect x="123.209" y="358.142" width="85.876" height="16.8577" rx="3" fill="#087f8c"/><text x="166.147" y="352.142" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="166.147" dy="0">0,0002</tspan></text><rect x="213.085" y="358.142" width="85.876" height="16.8577" rx="3" fill="#c0432f"/><text x="256.023" y="352.142" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="256.023" dy="0">0,0002</tspan></text><text x="211.085" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="211.085" dy="0">En el mismo proceso</tspan></text><rect x="342.899" y="279.376" width="85.876" height="95.6239" rx="3" fill="#087f8c"/><text x="385.837" y="273.376" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="385.837" dy="0">0,0051</tspan></text><rect x="432.775" y="251.267" width="85.876" height="123.733" rx="3" fill="#c0432f"/><text x="475.713" y="245.267" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="475.713" dy="0">0,0162</tspan></text><text x="430.775" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="430.775" dy="0">JSON ida y vuelta</tspan></text><rect x="562.589" y="178.432" width="85.876" height="196.568" rx="3" fill="#087f8c"/><text x="605.527" y="172.432" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="605.527" dy="0">0,3237</tspan></text><rect x="652.465" y="160.599" width="85.876" height="214.401" rx="3" fill="#c0432f"/><text x="695.403" y="154.599" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="695.403" dy="0">0,6739</tspan></text><text x="650.465" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="650.465" dy="0">HTTP, conexión reutilizada</tspan></text><rect x="782.279" y="149.149" width="85.876" height="225.851" rx="3" fill="#087f8c"/><text x="825.217" y="143.149" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="825.217" dy="0">1,0791</tspan></text><rect x="872.155" y="136.439" width="85.876" height="238.561" rx="3" fill="#c0432f"/><text x="915.093" y="130.439" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="915.093" dy="0">1,8198</tspan></text><text x="870.155" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="870.155" dy="0">HTTP, conexión nueva</tspan></text><rect x="10" y="427" width="980" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="500" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Cruzar un límite de proceso cuesta más de mil veces lo que una llamada en proceso aun en la misma máquina y sin red real; con red,</tspan></text><text x="500" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">balanceador y TLS el costo sube. Una ejecución en Windows 11: las proporciones son estables y los valores absolutos no.</tspan></text><text x="500" y="516.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; los recuentos se repiten y los tiempos varían de un equipo a otro.</tspan></text></svg>
