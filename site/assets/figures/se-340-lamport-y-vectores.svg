<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 338" width="940" height="338" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Los 44 850 pares de eventos de 3 nodos: qué relación ve cada reloj</title><desc id="d">Barras apiladas horizontales sobre los 44 850 pares de eventos: el reloj vectorial separa 40 317 pares con causalidad y 4 533 concurrentes; el reloj de Lamport da marcas distintas a 44 617 pares y ordena 4 300 pares que en realidad son concurrentes, aparentando un orden que no existe.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="338" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Los 44 850 pares de eventos de 3 nodos: qué relación ve cada reloj</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Con causalidad (orden real)</tspan></text><rect x="267.58" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="287.58" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="287.58" dy="0">Concurrentes, reconocidos como tales</tspan></text><rect x="587.02" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="607.02" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="607.02" dy="0">Concurrentes con un orden inventado</tspan></text><line x1="174" y1="77" x2="174" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="174" y1="157" x2="174" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="174" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="174" dy="0">0</tspan></text><line x1="314.34" y1="77" x2="314.34" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="314.34" y1="157" x2="314.34" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="314.34" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="314.34" dy="0">10 000</tspan></text><line x1="454.68" y1="77" x2="454.68" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="454.68" y1="157" x2="454.68" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="454.68" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="454.68" dy="0">20 000</tspan></text><line x1="595.02" y1="77" x2="595.02" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="595.02" y1="157" x2="595.02" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="595.02" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="595.02" dy="0">30 000</tspan></text><line x1="735.36" y1="77" x2="735.36" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="735.36" y1="157" x2="735.36" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="735.36" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="735.36" dy="0">40 000</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="157" x2="875.7" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">50 000</tspan></text><line x1="174" y1="157" x2="875.7" y2="157" stroke="#5b7280" stroke-width="1.6"/><text x="164" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="164" dy="0">Reloj vectorial</tspan></text><text x="164" y="141.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="164" dy="0">Reloj de Lamport</tspan></text><rect x="174" y="84" width="565.809" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="456.904" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="456.904" dy="0">40 317</tspan></text><rect x="739.809" y="84" width="63.6161" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="771.617" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="771.617" dy="0">4 533</tspan></text><rect x="803.425" y="84" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="810.425" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="810.425" dy="0">44 850</tspan></text><rect x="174" y="124" width="565.809" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="456.904" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="456.904" dy="0">40 317</tspan></text><rect x="739.809" y="124" width="3.26992" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><rect x="743.079" y="124" width="60.3462" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="773.252" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="773.252" dy="0">4 300</tspan></text><text x="810.425" y="141.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="810.425" dy="0">44 850</tspan></text><text x="524.85" y="201" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="524.85" dy="0">Pares de eventos</tspan></text><rect x="10" y="215" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="239.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Si a causó b, la marca de Lamport de a es menor; la inversa no vale: una marca menor no implica causa. Los 4 300 pares en</tspan></text><text x="470" y="256.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">coral son el 9,6 % de los pares con marcas distintas; los vectoriales distinguen causa de concurrencia a cambio de un</tspan></text><text x="470" y="273.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">vector por evento. Mensajes y turnos son una simulación del autor con semilla 340.</tspan></text><text x="470" y="320.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelos sintéticos con semilla fija; resultados idénticos en Windows y Ubuntu (WSL2) salvo donde se indica.</tspan></text></svg>
