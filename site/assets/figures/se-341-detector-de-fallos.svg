<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 421" width="880" height="421" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Detector de fallos por latidos cada 1 000 ms: tiempo límite, falsas sospechas y retraso en detectar</title><desc id="d">Tabla: con un retardo de red lognormal de mediana 100 ms y un tiempo límite de 150 ms, el 32,3 por ciento de los latidos de un nodo sano parecen una falla; con 600 ms, el 2,25; con 2 400 ms, el 0,02, y el nodo caído se detecta 1 150, 1 600 y 3 400 ms después del último latido.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="880" height="421" fill="#ffffff"/><rect x="10" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="107" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="107" dy="0">Tiempo límite</tspan></text><rect x="210" y="12" width="354" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="387" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="387" dy="0">Latidos de un nodo sano sospechosos</tspan></text><rect x="570" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="717" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="717" dy="0">Detección de un nodo caído</tspan></text><rect x="10" y="56" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">150 ms</tspan></text><rect x="210" y="56" width="354" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="387" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387" dy="0">32,34 %</tspan></text><rect x="570" y="56" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">1 150 ms</tspan></text><rect x="10" y="106" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">300 ms</tspan></text><rect x="210" y="106" width="354" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="387" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387" dy="0">10,97 %</tspan></text><rect x="570" y="106" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">1 300 ms</tspan></text><rect x="10" y="156" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">600 ms</tspan></text><rect x="210" y="156" width="354" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="387" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387" dy="0">2,25 %</tspan></text><rect x="570" y="156" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">1 600 ms</tspan></text><rect x="10" y="206" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">1 200 ms</tspan></text><rect x="210" y="206" width="354" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="387" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387" dy="0">0,28 %</tspan></text><rect x="570" y="206" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">2 200 ms</tspan></text><rect x="10" y="256" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">2 400 ms</tspan></text><rect x="210" y="256" width="354" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="387" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387" dy="0">0,02 %</tspan></text><rect x="570" y="256" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">3 400 ms</tspan></text><rect x="10" y="310" width="860" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="440" y="334.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="440" dy="0">No existe un tiempo límite que dé detección rápida y cero falsas sospechas: subirlo baja las falsas alarmas y</tspan></text><text x="440" y="351.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="440" dy="0">retrasa la detección. La distribución del retardo (lognormal, mediana 100 ms, p99 de 795 ms) es un supuesto del</tspan></text><text x="440" y="368.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="440" dy="0">autor, no una red medida.</tspan></text><text x="440" y="407.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="440" dy="0">Modelos sintéticos con semilla fija; resultados idénticos en Windows y Ubuntu (WSL2) salvo donde se indica.</tspan></text></svg>
