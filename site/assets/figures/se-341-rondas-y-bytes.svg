<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 514" width="940" height="514" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una pantalla de avisos con cuatro servicios detrás: rondas, bytes y tiempo modelado según quién agrega</title><desc id="d">Barras horizontales en escala logarítmica con los bytes y el tiempo modelado de cuatro caminos para armar la pantalla: el cliente llama a cuatro servicios en dos rondas con 6692 bytes y 173 milisegundos, un gateway de agregación usa una ronda con 6692 bytes y 93, un BFF móvil una ronda con 163 bytes y 80 y un BFF web una ronda con 1169 bytes y 82.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="514" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Una pantalla de avisos con cuatro servicios detrás: rondas, bytes y tiempo modelado según quién agrega</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Bytes</tspan></text><rect x="101.7" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="121.7" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="121.7" dy="0">Tiempo modelado (ms)</tspan></text><line x1="324" y1="77" x2="324" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="333" x2="324" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">10</tspan></text><line x1="507.9" y1="77" x2="507.9" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="507.9" y1="333" x2="507.9" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="507.9" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507.9" dy="0">100</tspan></text><line x1="691.8" y1="77" x2="691.8" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="691.8" y1="333" x2="691.8" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="691.8" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="691.8" dy="0">1 000</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="333" x2="875.7" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">10 000</tspan></text><line x1="324" y1="333" x2="875.7" y2="333" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="105" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">El cliente llama a cuatro servicios (2</tspan></text><text x="314" y="122" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">rondas)</tspan></text><text x="314" y="169" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Gateway de agregación, carga completa (1</tspan></text><text x="314" y="186" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">ronda)</tspan></text><text x="314" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">BFF móvil, carga proyectada (1 ronda)</tspan></text><text x="314" y="305.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">BFF web, carga proyectada (1 ronda)</tspan></text><rect x="324" y="83" width="519.62" height="24.5" rx="3" fill="#102a43"/><text x="850.62" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="850.62" dy="0">6 692</tspan></text><rect x="324" y="110.5" width="227.677" height="24.5" rx="3" fill="#c0432f"/><text x="558.677" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="558.677" dy="0">173</tspan></text><rect x="324" y="147" width="519.62" height="24.5" rx="3" fill="#102a43"/><text x="850.62" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="850.62" dy="0">6 692</tspan></text><rect x="324" y="174.5" width="178.104" height="24.5" rx="3" fill="#c0432f"/><text x="509.104" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="509.104" dy="0">93</tspan></text><rect x="324" y="211" width="222.921" height="24.5" rx="3" fill="#102a43"/><text x="553.921" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="553.921" dy="0">163</tspan></text><rect x="324" y="238.5" width="166.078" height="24.5" rx="3" fill="#c0432f"/><text x="497.078" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="497.078" dy="0">80</tspan></text><rect x="324" y="275" width="380.271" height="24.5" rx="3" fill="#102a43"/><text x="711.271" y="291.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="711.271" dy="0">1 169</tspan></text><rect x="324" y="302.5" width="168.05" height="24.5" rx="3" fill="#c0432f"/><text x="499.05" y="319.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="499.05" dy="0">82</tspan></text><text x="599.85" y="377" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="599.85" dy="0">Bytes o milisegundos (escala logarítmica)</tspan></text><rect x="10" y="391" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="415.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">La agregación ahorra una ronda; la proyección por cliente ahorra bytes: el móvil necesita el 2,4 % de la carga completa.</tspan></text><text x="470" y="432.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Los tiempos usan 80 ms de ida y vuelta y 0,5 MB/s, supuestos del autor, no una medición de red; los tamaños sí son medidos</tspan></text><text x="470" y="449.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">sobre datos sintéticos.</tspan></text><text x="470" y="496.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 44; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
