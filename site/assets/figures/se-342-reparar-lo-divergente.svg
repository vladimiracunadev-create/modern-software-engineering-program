<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 369" width="910" height="369" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reparar dos lados que divergieron: último escritor gana frente a tipos que se fusionan</title><desc id="d">Tabla: tras una partición, el último escritor gana conserva 1 048 de 2 059 entregas contadas y 500 de 750 entregas distintas; un contador por réplica y una unión de conjuntos conservan 2 059 y 750, pero la unión simple resucita las 50 entregas que se habían borrado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="910" height="369" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Dato</tspan></text><rect x="340" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="472" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="472" dy="0">Último escritor gana</tspan></text><rect x="610" y="12" width="284" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="752" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="752" dy="0">Tipo que se fusiona</tspan></text><rect x="10" y="56" width="324" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="89.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Contador de entregas (2 059 reales)</tspan></text><rect x="340" y="56" width="264" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="89.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">1 048 (pierde 1 011)</tspan></text><rect x="610" y="56" width="284" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="89.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">2 059 (contador por réplica)</tspan></text><rect x="10" y="122" width="324" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="155.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Conjunto de entregas (750 reales)</tspan></text><rect x="340" y="122" width="264" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="155.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">500 (pierde 250)</tspan></text><rect x="610" y="122" width="284" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="155.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">750 (unión)</tspan></text><rect x="10" y="188" width="324" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="221.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">50 entregas borradas en un lado</tspan></text><rect x="340" y="188" width="264" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="213.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">Se pierden o se conservan según la</tspan></text><text x="472" y="229.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">marca</tspan></text><rect x="610" y="188" width="284" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="221.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">La unión simple las resucita (50)</tspan></text><rect x="10" y="258" width="890" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="455" y="282.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="455" dy="0">Fusionar sin perder nada es posible cuando la operación conmuta y se tolera su semántica: sumar sí, borrar no sin más</tspan></text><text x="455" y="299.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="455" dy="0">información. Cada tipo fusionable fija qué conflictos resuelve. Las cantidades salen de semilla 3423; la latencia de 1</tspan></text><text x="455" y="316.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="455" dy="0">ms frente a 81 ms de replicar de forma síncrona entre regiones es un supuesto.</tspan></text><text x="455" y="355.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="455" dy="0">Modelos sintéticos con semilla fija; resultados idénticos en Windows y Ubuntu (WSL2) salvo donde se indica.</tspan></text></svg>
