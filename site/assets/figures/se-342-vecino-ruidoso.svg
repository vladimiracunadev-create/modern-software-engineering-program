<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 549" width="940" height="549" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un inquilino ruidoso a 40 solicitudes por segundo durante 20 s con cuatro trabajadores: espera p95 por política</title><desc id="d">Barras agrupadas con la espera p95 de los inquilinos normales y del ruidoso por política: sin política 7,96 segundos y 7,84; con un tope de un trabajador de cuatro para el ruidoso, 0,16 y 54,24.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="549" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un inquilino ruidoso a 40 solicitudes por segundo durante 20 s con cuatro trabajadores: espera p95 por</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">política</tspan></text><rect x="16" y="64" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Espera p95 de los normales</tspan></text><rect x="260.04" y="64" width="12" height="12" rx="2" fill="#c0432f"/><text x="280.04" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="280.04" dy="0">Espera p95 del ruidoso</tspan></text><line x1="71.08" y1="374" x2="920" y2="374" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="374" x2="71.08" y2="374" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="378.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="287.333" x2="920" y2="287.333" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="287.333" x2="71.08" y2="287.333" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="291.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="200.667" x2="920" y2="200.667" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="200.667" x2="71.08" y2="200.667" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="205.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">40</tspan></text><line x1="71.08" y1="114" x2="920" y2="114" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="114" x2="71.08" y2="114" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="118.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">60</tspan></text><line x1="71.08" y1="114" x2="71.08" y2="374" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="244" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 244)">Segundos de espera (p95)</text><rect x="113.526" y="339.507" width="167.784" height="34.4933" rx="3" fill="#087f8c"/><text x="197.418" y="333.507" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197.418" dy="0">7,96</tspan></text><rect x="285.31" y="340.027" width="167.784" height="33.9733" rx="3" fill="#c0432f"/><text x="369.202" y="334.027" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="369.202" dy="0">7,84</tspan></text><text x="283.31" y="395" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="283.31" dy="0">Ninguna (cola común)</tspan></text><rect x="537.986" y="372" width="167.784" height="2" rx="3" fill="#087f8c"/><text x="621.878" y="366" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="621.878" dy="0">0,16</tspan></text><rect x="709.77" y="138.96" width="167.784" height="235.04" rx="3" fill="#c0432f"/><text x="793.662" y="132.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="793.662" dy="0">54,24</tspan></text><text x="707.77" y="395" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707.77" dy="0">Tope de 1 trabajador de 4 para el ruidoso</tspan></text><rect x="10" y="426" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="450.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Las solicitudes son 1 056 normales y 818 ruidosas en ambos casos. El tope no hace desaparecer la sobrecarga: la traslada a</tspan></text><text x="470" y="467.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">quien la causa. Los inquilinos normales vuelven a 0,16 s y el ruidoso espera 54 s. Simulación de eventos con semilla 44;</tspan></text><text x="470" y="484.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">los tiempos de servicio son exponenciales de media 0,1 s, un supuesto del autor.</tspan></text><text x="470" y="531.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 44; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
