<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 589" width="940" height="589" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un equipo de datos central de cuatro personas atendiendo a D dominios: espera por solicitud de un conjunto de datos nuevo</title><desc id="d">Líneas con la espera por solicitud según los dominios atendidos por un equipo central de cuatro personas, cada dominio con 0,15 solicitudes por semana: la espera media simulada es 0,00 semanas con 5 dominios, 0,03 con 10, 0,14 con 15, 0,53 con 20 y 2,17 con 24; la analítica de Erlang C coincide y el percentil 90 llega a 5,65 semanas con 24.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="589" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un equipo de datos central de cuatro personas atendiendo a D dominios: espera por solicitud de un conjunto</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">de datos nuevo</tspan></text><circle cx="22" cy="70" r="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Espera media simulada</tspan></text><rect x="222.34" y="64" width="12" height="12" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="242.34" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="242.34" dy="0">Espera media analítica</tspan></text><polygon points="442.22,63.1 448.82,75.4 435.62,75.4" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="456.22" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="456.22" dy="0">Espera p90 simulada</tspan></text><line x1="63.54" y1="406" x2="910" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="406" x2="63.54" y2="406" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="410.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">0</tspan></text><line x1="63.54" y1="356" x2="910" y2="356" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="356" x2="63.54" y2="356" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="360.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">1</tspan></text><line x1="63.54" y1="306" x2="910" y2="306" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="306" x2="63.54" y2="306" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="310.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">2</tspan></text><line x1="63.54" y1="256" x2="910" y2="256" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="256" x2="63.54" y2="256" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="260.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">3</tspan></text><line x1="63.54" y1="206" x2="910" y2="206" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="206" x2="63.54" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="210.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">4</tspan></text><line x1="63.54" y1="156" x2="910" y2="156" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="156" x2="63.54" y2="156" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="160.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">5</tspan></text><line x1="63.54" y1="106" x2="910" y2="106" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="106" x2="63.54" y2="106" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">6</tspan></text><line x1="63.54" y1="106" x2="63.54" y2="406" stroke="#5b7280" stroke-width="1.6"/><line x1="81.54" y1="106" x2="81.54" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="81.54" y1="406" x2="81.54" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="81.54" y="427" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="81.54" dy="0">5</tspan></text><line x1="294.819" y1="106" x2="294.819" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="294.819" y1="406" x2="294.819" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="294.819" y="427" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294.819" dy="0">10</tspan></text><line x1="508.098" y1="106" x2="508.098" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="508.098" y1="406" x2="508.098" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="508.098" y="427" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="508.098" dy="0">15</tspan></text><line x1="721.377" y1="106" x2="721.377" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="721.377" y1="406" x2="721.377" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="721.377" y="427" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="721.377" dy="0">20</tspan></text><line x1="892" y1="106" x2="892" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="406" x2="892" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="427" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">24</tspan></text><line x1="63.54" y1="406" x2="910" y2="406" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="256" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 256)">Semanas de espera</text><text x="486.77" y="452" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="486.77" dy="0">Dominios atendidos</tspan></text><polyline points="81.54,406 294.819,404.5 508.098,399 721.377,379.5 892,297.5" fill="none" stroke="#087f8c" stroke-width="2.4"/><circle cx="81.54" cy="406" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><circle cx="294.819" cy="404.5" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><circle cx="508.098" cy="399" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><circle cx="721.377" cy="379.5" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><circle cx="892" cy="297.5" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polyline points="81.54,406 294.819,404.5 508.098,399 721.377,380.5 892,307.5" fill="none" stroke="#102a43" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="76.04" y="400.5" width="11" height="11" fill="#102a43" stroke="#102a43" stroke-width="2"/><rect x="289.319" y="399" width="11" height="11" fill="#102a43" stroke="#102a43" stroke-width="2"/><rect x="502.598" y="393.5" width="11" height="11" fill="#102a43" stroke="#102a43" stroke-width="2"/><rect x="715.877" y="375" width="11" height="11" fill="#102a43" stroke="#102a43" stroke-width="2"/><rect x="886.5" y="302" width="11" height="11" fill="#102a43" stroke="#102a43" stroke-width="2"/><polyline points="81.54,406 294.819,406 508.098,381 721.377,323 892,123.5" fill="none" stroke="#c0432f" stroke-width="2.4"/><polygon points="81.54,399.675 87.59,410.95 75.49,410.95" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><polygon points="294.819,399.675 300.869,410.95 288.769,410.95" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><polygon points="508.098,374.675 514.148,385.95 502.048,385.95" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><polygon points="721.377,316.675 727.427,327.95 715.327,327.95" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><polygon points="892,117.175 898.05,128.45 885.95,128.45" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><rect x="10" y="466" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="490.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Utilización del equipo con 5, 10, 15, 20 y 24 dominios: 19 %, 38 %, 56 %, 75 % y 90 %. La espera no crece en línea recta:</tspan></text><text x="470" y="507.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">pasar de 20 a 24 dominios (un 20 % más de demanda) multiplica la espera media por cuatro. La simulación coincide con la</tspan></text><text x="470" y="524.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">fórmula de Erlang C hasta el 90 % de utilización, lo que valida la simulación, no el modelo de organización.</tspan></text><text x="470" y="571.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 44; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
