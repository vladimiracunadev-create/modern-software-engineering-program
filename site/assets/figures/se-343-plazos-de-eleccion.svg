<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 471" width="930" height="471" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Elección de líder entre cinco nodos con plazos aleatorios (retardo de mensajes hasta 25 ms)</title><desc id="d">Tabla: con plazos de elección sin aleatoriedad o con menos de 25 ms de dispersión no se llega a un líder en 50 rondas; con plazos entre 150 y 300 ms se necesitan 2,49 rondas de media y 461 ms, y entre 150 y 450 ms, 1,54 rondas y 333 ms.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="471" fill="#ffffff"/><rect x="10" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="132" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="132" dy="0">Plazo de elección</tspan></text><rect x="260" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="372" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="372" dy="0">Rondas medias (tope 50)</tspan></text><rect x="490" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="602" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="602" dy="0">Líder en la primera ronda</tspan></text><rect x="720" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="817" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="817" dy="0">Tiempo medio hasta</tspan></text><text x="817" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="817" dy="0">líder</tspan></text><rect x="10" y="56" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">150 ms (sin aleatoriedad)</tspan></text><rect x="260" y="56" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="372" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372" dy="0">51,0 (no converge)</tspan></text><rect x="490" y="56" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">0,0 %</tspan></text><rect x="720" y="56" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">7 650 ms</tspan></text><rect x="10" y="106" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">150 a 175 ms</tspan></text><rect x="260" y="106" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="372" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372" dy="0">51,0 (no converge)</tspan></text><rect x="490" y="106" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">0,0 %</tspan></text><rect x="720" y="106" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">7 863 ms</tspan></text><rect x="10" y="156" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">150 a 200 ms</tspan></text><rect x="260" y="156" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="372" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372" dy="0">25,5</tspan></text><rect x="490" y="156" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">3,1 %</tspan></text><rect x="720" y="156" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">4 057 ms</tspan></text><rect x="10" y="206" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">150 a 250 ms</tspan></text><rect x="260" y="206" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="372" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372" dy="0">4,20</tspan></text><rect x="490" y="206" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">24,0 %</tspan></text><rect x="720" y="206" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">725 ms</tspan></text><rect x="10" y="256" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">150 a 300 ms</tspan></text><rect x="260" y="256" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="372" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372" dy="0">2,49</tspan></text><rect x="490" y="256" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">40,3 %</tspan></text><rect x="720" y="256" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">461 ms</tspan></text><rect x="10" y="306" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="331.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">150 a 450 ms</tspan></text><rect x="260" y="306" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="372" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372" dy="0">1,54</tspan></text><rect x="490" y="306" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">64,7 %</tspan></text><rect x="720" y="306" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">333 ms</tspan></text><rect x="10" y="360" width="910" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="384.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">La dispersión de los plazos debe ser mayor que el retardo de los mensajes para que un candidato gane antes de que otro se</tspan></text><text x="465" y="401.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">presente. Con mayor dispersión se tarda más en empezar una elección y menos en terminarla. Es un modelo simplificado</tspan></text><text x="465" y="418.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">inspirado en Raft, no Raft.</tspan></text><text x="465" y="457.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Modelos sintéticos con semilla fija; resultados idénticos en Windows y Ubuntu (WSL2) salvo donde se indica.</tspan></text></svg>
