<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 371" width="840" height="371" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un titular del arrendamiento que se pausa más de 10 s y escribe después de que otro tomó su lugar</title><desc id="d">Tabla: con pausas de media 1, 2, 4 y 8 segundos, un arrendamiento de 10 segundos caduca antes de que el titular escriba en 1, 73, 854 y 2 918 de 10 000 tareas; sin testigo de cerco el almacén acepta esas 849 escrituras tardías de la corrida de media 4 s y con testigo rechaza las 849.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="840" height="371" fill="#ffffff"/><rect x="10" y="12" width="314" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="167" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="167" dy="0">Pausa media del titular</tspan></text><rect x="330" y="12" width="494" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="577" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="577" dy="0">Tareas cuyo arrendamiento caduca antes de escribir</tspan></text><rect x="10" y="56" width="314" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">1 s</tspan></text><rect x="330" y="56" width="494" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">1 de 10 000</tspan></text><rect x="10" y="106" width="314" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">2 s</tspan></text><rect x="330" y="106" width="494" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">73 de 10 000</tspan></text><rect x="10" y="156" width="314" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">4 s</tspan></text><rect x="330" y="156" width="494" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">854 de 10 000</tspan></text><rect x="10" y="206" width="314" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">8 s</tspan></text><rect x="330" y="206" width="494" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">2 918 de 10 000</tspan></text><rect x="10" y="260" width="820" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="420" y="284.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="420" dy="0">En la corrida de media 4 s hay 849 escrituras de un titular caducado (otra semilla da 854 caducados): sin</tspan></text><text x="420" y="301.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="420" dy="0">testigo el almacén las acepta todas, con un número de cerco creciente las rechaza todas. El arrendamiento</tspan></text><text x="420" y="318.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="420" dy="0">solo no basta porque el titular no sabe que caducó. Las pausas exponenciales son un supuesto del autor.</tspan></text><text x="420" y="357.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="420" dy="0">Modelos sintéticos con semilla fija; resultados idénticos en Windows y Ubuntu (WSL2) salvo donde se indica.</tspan></text></svg>
