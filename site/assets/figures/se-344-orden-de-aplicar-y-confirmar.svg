<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 390" width="940" height="390" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Contar 1 000 entregas cuando el consumidor se cae el 5 % de las veces en el peor punto</title><desc id="d">Barras apiladas horizontales con el total contado de 1 000 entregas: aplicar y luego confirmar cuenta 1 053 por 53 duplicados de mensajes reentregados; confirmar y luego aplicar cuenta 950 y pierde 50; aplicar y registrar la clave de mensaje visto en la misma transacción cuenta exactamente 1 000.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="390" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Contar 1 000 entregas cuando el consumidor se cae el 5 % de las veces en el peor punto</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Entregas contadas una vez</tspan></text><rect x="252.5" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="272.5" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="272.5" dy="0">Duplicados contados de más</tspan></text><rect x="496.54" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="516.54" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="516.54" dy="0">Entregas perdidas (no contadas)</tspan></text><line x1="324" y1="77" x2="324" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="209" x2="324" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="442.4" y1="77" x2="442.4" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="442.4" y1="209" x2="442.4" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="442.4" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442.4" dy="0">250</tspan></text><line x1="560.8" y1="77" x2="560.8" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="560.8" y1="209" x2="560.8" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="560.8" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="560.8" dy="0">500</tspan></text><line x1="679.2" y1="77" x2="679.2" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="679.2" y1="209" x2="679.2" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="679.2" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="679.2" dy="0">750</tspan></text><line x1="797.6" y1="77" x2="797.6" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="797.6" y1="209" x2="797.6" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="797.6" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797.6" dy="0">1 000</tspan></text><line x1="916" y1="77" x2="916" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="916" y1="209" x2="916" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="916" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="916" dy="0">1 250</tspan></text><line x1="324" y1="209" x2="916" y2="209" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="95" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Aplicar y luego confirmar (al menos una</tspan></text><text x="314" y="112" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">vez)</tspan></text><text x="314" y="139" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Confirmar y luego aplicar (como mucho una</tspan></text><text x="314" y="156" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">vez)</tspan></text><text x="314" y="183" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Aplicar y registrar la clave en una</tspan></text><text x="314" y="200" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">transacción</tspan></text><rect x="324" y="84" width="473.6" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="560.8" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="560.8" dy="0">1 000</tspan></text><rect x="797.6" y="84" width="25.1008" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="810.15" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="810.15" dy="0">53</tspan></text><rect x="822.701" y="84" width="0" height="30" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><rect x="324" y="128" width="449.92" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="548.96" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="548.96" dy="0">950</tspan></text><rect x="773.92" y="128" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><rect x="773.92" y="128" width="23.68" height="30" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><rect x="324" y="172" width="473.6" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="560.8" y="191.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="560.8" dy="0">1 000</tspan></text><rect x="797.6" y="172" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><rect x="797.6" y="172" width="0" height="30" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="620" y="253" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="620" dy="0">Entregas (el total correcto es 1 000)</tspan></text><rect x="10" y="267" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="291.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">El proceso exactamente una vez no existe entre dos sistemas: lo que se logra es efecto único sobre el estado porque aplicar</tspan></text><text x="470" y="308.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">y recordar viven en una sola transacción. El segmento dorado son entregas que faltan: el total contado es 950. El 5 % de</tspan></text><text x="470" y="325.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">caídas es un supuesto del autor; el estado es una base SQLite real en memoria.</tspan></text><text x="470" y="372.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelos sintéticos con semilla fija; resultados idénticos en Windows y Ubuntu (WSL2) salvo donde se indica.</tspan></text></svg>
