<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 333" width="910" height="333" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Contar 1 000 entregas cuando el consumidor se cae el 5 % de las veces en el peor punto</title><desc id="d">Tabla: aplicar y luego confirmar cuenta 1 053 de 1 000 por los mensajes reentregados; confirmar y luego aplicar cuenta 950 y pierde 50; aplicar y registrar la clave de mensaje visto en la misma transacción cuenta exactamente 1 000.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="910" height="333" fill="#ffffff"/><rect x="10" y="12" width="474" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="247" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="247" dy="0">Orden de las operaciones</tspan></text><rect x="490" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="582" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="582" dy="0">Total contado</tspan></text><rect x="680" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="787" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="787" dy="0">Diferencia con 1 000</tspan></text><rect x="10" y="56" width="474" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="83.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">Aplicar y luego confirmar (al menos una vez)</tspan></text><rect x="490" y="56" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">1 053</tspan></text><rect x="680" y="56" width="214" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">+53 duplicados</tspan></text><rect x="10" y="110" width="474" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="137.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">Confirmar y luego aplicar (como mucho una vez)</tspan></text><rect x="490" y="110" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">950</tspan></text><rect x="680" y="110" width="214" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">−50 perdidos</tspan></text><rect x="10" y="164" width="474" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="191.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">Aplicar y registrar la clave en una transacción</tspan></text><rect x="490" y="164" width="184" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">1 000</tspan></text><rect x="680" y="164" width="214" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">0</tspan></text><rect x="10" y="222" width="890" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="455" y="246.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="455" dy="0">El proceso exactamente una vez no existe entre dos sistemas: lo que se logra es efecto único sobre el estado porque</tspan></text><text x="455" y="263.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="455" dy="0">aplicar y recordar viven en una sola transacción. El 5 % de caídas es un supuesto del autor; el estado es una base</tspan></text><text x="455" y="280.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="455" dy="0">SQLite real en memoria.</tspan></text><text x="455" y="319.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="455" dy="0">Modelos sintéticos con semilla fija; resultados idénticos en Windows y Ubuntu (WSL2) salvo donde se indica.</tspan></text></svg>
