<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 371" width="840" height="371" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Duplicados que llegan cuando la clave de idempotencia ya se olvidó y se ejecutan otra vez</title><desc id="d">Tabla: con retraso de duplicados de cola larga (mediana 55 s, p99 9 209 s), una retención de 1 minuto deja pasar el 48,2 por ciento de los duplicados, una de 1 hora el 2,75, una de 24 horas el 0,03 y una de 7 días ninguno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="840" height="371" fill="#ffffff"/><rect x="10" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="157" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="157" dy="0">Retención de la clave</tspan></text><rect x="310" y="12" width="514" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="567" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="567" dy="0">Duplicados reejecutados</tspan></text><rect x="10" y="56" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">1 minuto</tspan></text><rect x="310" y="56" width="514" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="567" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="567" dy="0">9 639 de 20 000 (48,20 %)</tspan></text><rect x="10" y="106" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">1 hora</tspan></text><rect x="310" y="106" width="514" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="567" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="567" dy="0">550 de 20 000 (2,75 %)</tspan></text><rect x="10" y="156" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">24 horas</tspan></text><rect x="310" y="156" width="514" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="567" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="567" dy="0">6 de 20 000 (0,03 %)</tspan></text><rect x="10" y="206" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">7 días</tspan></text><rect x="310" y="206" width="514" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="567" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="567" dy="0">0 de 20 000</tspan></text><rect x="10" y="260" width="820" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="420" y="284.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="420" dy="0">La retención de claves es una decisión de negocio sobre cuánto tarda en llegar el último duplicado posible,</tspan></text><text x="420" y="301.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="420" dy="0">no un detalle de almacenamiento. Además, 615 de 640 reutilizaciones de una clave con otro cuerpo habrían</tspan></text><text x="420" y="318.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="420" dy="0">devuelto la respuesta ajena sin la huella del cuerpo. La distribución lognormal es un supuesto del autor.</tspan></text><text x="420" y="357.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="420" dy="0">Modelos sintéticos con semilla fija; resultados idénticos en Windows y Ubuntu (WSL2) salvo donde se indica.</tspan></text></svg>
