<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 541" width="940" height="541" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un defecto visible en 0,4 % de las peticiones con 20 000 peticiones por escalón: usuarios afectados y probabilidad de detectarlo</title><desc id="d">Línea con la probabilidad de ver al menos 3 errores de un defecto que afecta al 0,4 por ciento de las peticiones según el escalón de tráfico: 4,7 por ciento con el 1 por ciento, 76,2 con el 5 y 100 desde el 25; los usuarios afectados esperados son 0,8, 4,0, 20,0, 40,0 y 80,0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="541" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un defecto visible en 0,4 % de las peticiones con 20 000 peticiones por escalón: usuarios afectados y</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">probabilidad de detectarlo</tspan></text><line x1="78.62" y1="358" x2="910" y2="358" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="358" x2="78.62" y2="358" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="362.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="302" x2="910" y2="302" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="302" x2="78.62" y2="302" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="306.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">20</tspan></text><line x1="78.62" y1="246" x2="910" y2="246" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="246" x2="78.62" y2="246" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="250.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">40</tspan></text><line x1="78.62" y1="190" x2="910" y2="190" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="190" x2="78.62" y2="190" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="194.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">60</tspan></text><line x1="78.62" y1="134" x2="910" y2="134" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="134" x2="78.62" y2="134" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="138.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">80</tspan></text><line x1="78.62" y1="78" x2="910" y2="78" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="78" x2="78.62" y2="78" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="82.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="78" x2="78.62" y2="358" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="78" x2="96.62" y2="358" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="358" x2="96.62" y2="363" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="379" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">1 %</tspan></text><line x1="374.593" y1="78" x2="374.593" y2="358" stroke="#d5dde1" stroke-width="1"/><line x1="374.593" y1="358" x2="374.593" y2="363" stroke="#5b7280" stroke-width="1.4"/><text x="374.593" y="379" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="374.593" dy="0">5 %</tspan></text><line x1="652.567" y1="78" x2="652.567" y2="358" stroke="#d5dde1" stroke-width="1"/><line x1="652.567" y1="358" x2="652.567" y2="363" stroke="#5b7280" stroke-width="1.4"/><text x="652.567" y="379" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652.567" dy="0">25 %</tspan></text><line x1="772.283" y1="78" x2="772.283" y2="358" stroke="#d5dde1" stroke-width="1"/><line x1="772.283" y1="358" x2="772.283" y2="363" stroke="#5b7280" stroke-width="1.4"/><text x="772.283" y="379" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772.283" dy="0">50 %</tspan></text><line x1="892" y1="78" x2="892" y2="358" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="358" x2="892" y2="363" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="379" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">100 %</tspan></text><line x1="78.62" y1="358" x2="910" y2="358" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 218)">Probabilidad (%)</text><text x="494.31" y="404" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Escalón de tráfico (%) (escala logarítmica)</tspan></text><polyline points="96.62,344.84 374.593,144.64 652.567,78 772.283,78 892,78" fill="none" stroke="#087f8c" stroke-width="2.4"/><circle cx="96.62" cy="344.84" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="96.62" y="333.84" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">4,7 %</tspan></text><circle cx="374.593" cy="144.64" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="374.593" y="168.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="374.593" dy="0">76,2 %</tspan></text><circle cx="652.567" cy="78" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="652.567" y="67" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="652.567" dy="0">100 %</tspan></text><circle cx="772.283" cy="78" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="772.283" y="67" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="772.283" dy="0">100 %</tspan></text><circle cx="892" cy="78" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="67" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">100 %</tspan></text><rect x="10" y="418" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="442.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Usuarios afectados esperados por escalón: 0,8, 4,0, 20,0, 40,0 y 80,0. Un escalón demasiado pequeño no detecta y uno</tspan></text><text x="470" y="459.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">demasiado grande daña: con 1 % no se alcanza a ver el defecto (4,7 %) y con 5 % se ve tres de cada cuatro veces afectando a</tspan></text><text x="470" y="476.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">unos 4 usuarios. Si el 5 % lo detiene, el daño acumulado es de 4,8 usuarios frente a 80 si se cambia de golpe.</tspan></text><text x="470" y="523.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 44; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
