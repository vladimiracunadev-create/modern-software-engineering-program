<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 589" width="940" height="589" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Probabilidad de ver cada causa de divergencia según la fracción del tráfico que se compara (500 repeticiones por fila)</title><desc id="d">Líneas en escala logarítmica con la probabilidad de observar cada divergencia según la fracción del tráfico comparada en modo sombra: con 1 por ciento se ve el plazo de extensión el 46 por ciento de las veces, el cambio de hora el 1 y el redondeo el 75; con 5 por ciento, 95, 6 y 100; con 25 por ciento, 100, 27 y 100; con todo el tráfico, siempre los tres.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="589" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Probabilidad de ver cada causa de divergencia según la fracción del tráfico que se compara (500 repeticiones</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">por fila)</tspan></text><circle cx="22" cy="70" r="6" fill="#946512" stroke="#946512" stroke-width="2"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Plazo de extensión</tspan></text><rect x="199.72" y="64" width="12" height="12" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="219.72" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="219.72" dy="0">Cambio de hora</tspan></text><polygon points="359.28,63.1 365.88,75.4 352.68,75.4" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="373.28" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="373.28" dy="0">Redondeo en el borde</tspan></text><line x1="78.62" y1="406" x2="910" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="406" x2="78.62" y2="406" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="410.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="346" x2="910" y2="346" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="346" x2="78.62" y2="346" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="350.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">20</tspan></text><line x1="78.62" y1="286" x2="910" y2="286" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="286" x2="78.62" y2="286" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="290.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">40</tspan></text><line x1="78.62" y1="226" x2="910" y2="226" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="226" x2="78.62" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="230.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">60</tspan></text><line x1="78.62" y1="166" x2="910" y2="166" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="166" x2="78.62" y2="166" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="170.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">80</tspan></text><line x1="78.62" y1="106" x2="910" y2="106" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="106" x2="78.62" y2="106" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="106" x2="78.62" y2="406" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="106" x2="96.62" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="406" x2="96.62" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="427" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">1 %</tspan></text><line x1="374.593" y1="106" x2="374.593" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="374.593" y1="406" x2="374.593" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="374.593" y="427" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="374.593" dy="0">5 %</tspan></text><line x1="652.567" y1="106" x2="652.567" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="652.567" y1="406" x2="652.567" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="652.567" y="427" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652.567" dy="0">25 %</tspan></text><line x1="892" y1="106" x2="892" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="406" x2="892" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="427" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">100 %</tspan></text><line x1="78.62" y1="406" x2="910" y2="406" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="256" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 256)">Probabilidad de verla (%)</text><text x="494.31" y="452" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Fracción del tráfico comparada (%) (escala logarítmica)</tspan></text><polyline points="96.62,268 374.593,121 652.567,106 892,106" fill="none" stroke="#946512" stroke-width="2.4"/><circle cx="96.62" cy="268" r="5.5" fill="#946512" stroke="#946512" stroke-width="2"/><circle cx="374.593" cy="121" r="5.5" fill="#946512" stroke="#946512" stroke-width="2"/><circle cx="652.567" cy="106" r="5.5" fill="#946512" stroke="#946512" stroke-width="2"/><circle cx="892" cy="106" r="5.5" fill="#946512" stroke="#946512" stroke-width="2"/><polyline points="96.62,403 374.593,388 652.567,325 892,106" fill="none" stroke="#c0432f" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="91.12" y="397.5" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><rect x="369.093" y="382.5" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><rect x="647.067" y="319.5" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><rect x="886.5" y="100.5" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><polyline points="96.62,181 374.593,106 652.567,106 892,106" fill="none" stroke="#087f8c" stroke-width="2.4"/><polygon points="96.62,174.675 102.67,185.95 90.57,185.95" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polygon points="374.593,99.675 380.643,110.95 368.543,110.95" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polygon points="652.567,99.675 658.617,110.95 646.517,110.95" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polygon points="892,99.675 898.05,110.95 885.95,110.95" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><rect x="10" y="466" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="490.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Un defecto que ocurre una vez en 20 000 peticiones no se ve comparando el 1 % ni el 25 % del tráfico con fiabilidad: su</tspan></text><text x="470" y="507.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">probabilidad es la fracción comparada. Comparar todo es la única forma de ver lo raro, y aun así solo si ocurre durante la</tspan></text><text x="470" y="524.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">comparación.</tspan></text><text x="470" y="571.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 44; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
