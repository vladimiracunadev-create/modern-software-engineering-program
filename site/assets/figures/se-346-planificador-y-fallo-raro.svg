<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 419" width="940" height="419" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El mismo defecto en 1 620 de 1 680 intercalaciones: cuántas ejecuciones al azar hacen falta según el planificador</title><desc id="d">Tabla: aunque 1 620 de las 1 680 intercalaciones de tres solicitudes violan el cupo, un planificador que cambia de hilo con probabilidad 0,03 solo lo expone en el 4,84 por ciento de las ejecuciones, con mediana de 14 ejecuciones hasta verlo y 57 en el percentil 95.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="419" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Probabilidad de cambiar de hilo en cada</tspan></text><text x="172" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">paso</tspan></text><rect x="340" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="432" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="432" dy="0">Ejecuciones que fallan</tspan></text><rect x="530" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="657" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="657" dy="0">Ejecuciones hasta el primer</tspan></text><text x="657" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="657" dy="0">fallo (mediana)</tspan></text><rect x="790" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="857" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="857" dy="0">Percentil 95</tspan></text><rect x="10" y="56" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="87.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">1,0 (cualquier hilo, siempre)</tspan></text><rect x="340" y="56" width="184" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">84,35 %</tspan></text><rect x="530" y="56" width="254" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="657" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="657" dy="0">1</tspan></text><rect x="790" y="56" width="134" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="857" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">2</tspan></text><rect x="10" y="118" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="149.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">0,3</tspan></text><rect x="340" y="118" width="184" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">40,34 %</tspan></text><rect x="530" y="118" width="254" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="657" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="657" dy="0">2</tspan></text><rect x="790" y="118" width="134" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="857" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">6</tspan></text><rect x="10" y="180" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="211.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">0,1</tspan></text><rect x="340" y="180" width="184" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">15,41 %</tspan></text><rect x="530" y="180" width="254" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="657" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="657" dy="0">5</tspan></text><rect x="790" y="180" width="134" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="857" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">17</tspan></text><rect x="10" y="242" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="273.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">0,03 (hilos casi siempre seguidos)</tspan></text><rect x="340" y="242" width="184" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="273.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">4,84 %</tspan></text><rect x="530" y="242" width="254" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="657" y="273.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="657" dy="0">14</tspan></text><rect x="790" y="242" width="134" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="857" y="273.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">57</tspan></text><rect x="10" y="308" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="332.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">No todas las intercalaciones son igual de probables: los planificadores reales mantienen un hilo en marcha un buen rato.</tspan></text><text x="470" y="349.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Por eso una pasada limpia dice poco y una semilla guardada permite repetir exactamente el mismo orden (misma semilla, misma</tspan></text><text x="470" y="366.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">traza, comprobado).</tspan></text><text x="470" y="405.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelos sintéticos con semilla fija; resultados idénticos en Windows y Ubuntu (WSL2) salvo donde se indica.</tspan></text></svg>
