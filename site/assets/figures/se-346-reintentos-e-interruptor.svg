 font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">20,1</tspan></text><polyline points="96.62,87 295.465,87.3 593.733,107.7 892,224.7" fill="none" stroke="#946512" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="91.12" y="81.5" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><rect x="289.965" y="81.8" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><rect x="588.233" y="102.2" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><rect x="886.5" y="219.2" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="892" y="213.7" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">54,1</tspan></text><polyline points="96.62,87 295.465,87.3 593.733,107.7 892,357.3" fill="none" stroke="#c0432f" stroke-width="2.4"/><polygon points="96.62,80.675 102.67,91.95 90.57,91.95" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><polygon points="295.465,80.975 301.515,92.25 289.415,92.25" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><polygon points="593.733,101.375 599.783,112.65 587.683,112.65" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><polygon points="892,350.975 898.05,362.25 885.95,362.25" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="346.3" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">9,9</tspan></text><text x="832" y="194.7" font-size="13" text-anchor="end" font-weight="400" fill="#5c1f14" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="832" dy="0">3,05 llamadas</tspan></text><line x1="887.84" y1="221.9" x2="840" y2="189.7" stroke="#5c1f14" stroke-width="1.2"/><text x="802" y="337.3" font-size="13" text-anchor="end" font-weight="400" fill="#5c1f14" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="802" dy="0">0,53 llamadas</tspan></text><line x1="885.44" y1="355.3" x2="810" y2="332.3" stroke="#5c1f14" stroke-width="1.2"/><rect x="10" y="447" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Un experimento de caos busca el punto donde la estrategia deja de proteger: aquí, entre 50 % y 80 %, los reintentos</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">triplican la carga sobre una dependencia ya enferma (1,90 llamadas por solicitud con 50 % de fallo y 3,05 con 80 %, frente</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">a 1,00) y el interruptor sacrifica éxito para dejarla respirar (0,53 llamadas). El servicio, su capacidad de 100 y el</tspan></text><text x="470" y="521.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">exceso son un modelo del autor.</tspan></text><text x="470" y="569.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelos sintéticos con semilla fija; resultados idénticos en Windows y Ubuntu (WSL2) salvo donde se indica.</tspan></text></svg>
