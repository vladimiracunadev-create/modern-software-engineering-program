<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 369" width="910" height="369" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Flujo de 5 pasos con efectos: puntos de fallo que dejan el estado incoherente</title><desc id="d">Tabla: en un flujo de cinco pasos con efectos, un corte antes de cada paso deja un estado incoherente en 4 de 5 puntos; perder la respuesta tras cada paso y reintentar el flujo entero lo deja incoherente en 5 de 5; con pasos idempotentes, en ninguno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="910" height="369" fill="#ffffff"/><rect x="10" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Fallo inyectado</tspan></text><rect x="390" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="462" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="462" dy="0">Puntos</tspan></text><text x="462" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="462" dy="0">incoherentes</tspan></text><rect x="540" y="12" width="354" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="717" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="717" dy="0">Qué ocurre</tspan></text><rect x="10" y="56" width="374" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="81.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Corte antes de cada uno de los 5 pasos, sin</tspan></text><text x="197" y="97.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">reintento</tspan></text><rect x="390" y="56" width="144" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="89.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">4 de 5</tspan></text><rect x="540" y="56" width="354" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="89.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">Solo el corte antes del primero deja todo intacto</tspan></text><rect x="10" y="122" width="374" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="147.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Respuesta perdida tras cada paso, reintento del</tspan></text><text x="197" y="163.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">flujo completo</tspan></text><rect x="390" y="122" width="144" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="155.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">5 de 5</tspan></text><rect x="540" y="122" width="354" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="155.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">Cupo, entrega, penalización y aviso se repiten</tspan></text><rect x="10" y="188" width="374" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="221.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Respuesta perdida tras cada paso, pasos idempotentes</tspan></text><rect x="390" y="188" width="144" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="221.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">0 de 5</tspan></text><rect x="540" y="188" width="354" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="221.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">Cada paso aplicado una sola vez</tspan></text><rect x="10" y="258" width="890" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="455" y="282.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="455" dy="0">Los dos fallos parciales distintos, el corte y la respuesta perdida, necesitan defensas distintas: el corte pide</tspan></text><text x="455" y="299.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="455" dy="0">atomicidad o compensación; la respuesta perdida pide idempotencia. Se enumeran todos los puntos del flujo; los efectos</tspan></text><text x="455" y="316.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="455" dy="0">son contadores en memoria, sin red.</tspan></text><text x="455" y="355.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="455" dy="0">Enumeración exacta de los puntos de fallo; sin aleatoriedad.</tspan></text></svg>
