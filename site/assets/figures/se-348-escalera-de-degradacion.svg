<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 363" width="950" height="363" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La base de entregas cae 60 s de 300 (50 lecturas y 10 escrituras por segundo)</title><desc id="d">Tabla: con fallo duro se pierden 3 000 lecturas y 600 escrituras durante la caída; con caché obsoleta las lecturas se sirven pero las 600 escrituras se rechazan; con caché y cola, las 3 000 lecturas son obsoletas, ninguna falla y las 600 escrituras se encolan y se reenvían al volver.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="363" fill="#ffffff"/><rect x="10" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="132" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="132" dy="0">Estrategia</tspan></text><rect x="260" y="12" width="284" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="402" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="402" dy="0">Lecturas</tspan></text><rect x="550" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="657" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="657" dy="0">Escrituras</tspan></text><rect x="770" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="852" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="852" dy="0">Datos perdidos</tspan></text><rect x="10" y="56" width="244" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="88.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Fallo duro</tspan></text><rect x="260" y="56" width="284" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">3 000 lecturas falladas</tspan></text><rect x="550" y="56" width="214" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="657" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="657" dy="0">600 rechazadas</tspan></text><rect x="770" y="56" width="164" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">0</tspan></text><rect x="10" y="120" width="244" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="152.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Caché obsoleta para lecturas</tspan></text><rect x="260" y="120" width="284" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">3 000 lecturas obsoletas, 0 falladas</tspan></text><rect x="550" y="120" width="214" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="657" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="657" dy="0">600 rechazadas</tspan></text><rect x="770" y="120" width="164" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">0</tspan></text><rect x="10" y="184" width="244" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="216.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Caché + cola de escrituras</tspan></text><rect x="260" y="184" width="284" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">3 000 obsoletas, 0 falladas</tspan></text><rect x="550" y="184" width="214" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="657" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="657" dy="0">600 encoladas y reenviadas</tspan></text><rect x="770" y="184" width="164" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">0 si la cola cabe</tspan></text><rect x="10" y="252" width="930" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="475" y="276.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="475" dy="0">Cada peldaño cambia un fallo visible por un estado que hay que declarar: una lectura vieja hasta N minutos, una escritura</tspan></text><text x="475" y="293.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="475" dy="0">confirmada que aún no está en la base. Pasar de uno a otro es una decisión de producto con su límite, no un interruptor</tspan></text><text x="475" y="310.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="475" dy="0">técnico. Tasas y duración son supuestos del autor.</tspan></text><text x="475" y="349.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Modelos sintéticos con semilla fija; resultados idénticos en Windows y Ubuntu (WSL2) salvo donde se indica.</tspan></text></svg>
