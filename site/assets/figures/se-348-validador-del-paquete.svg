<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 521" width="820" height="521" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Validador del paquete del servicio distribuido sobre 200 mutaciones: 101 detectadas</title><desc id="d">Tabla: un verificador de forma detecta 101 de 200 mutaciones de un paquete de servicio distribuido, todas las de campos ausentes, degradación sin límite y reintentos ilimitados, y ninguna de las 99 que dejan el texto plausible: tiempos incoherentes, evidencia copiada, pruebas no ejecutadas y garantías imposibles.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="820" height="521" fill="#ffffff"/><rect x="10" y="12" width="634" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="327" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="327" dy="0">Mutación</tspan></text><rect x="650" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="727" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="727" dy="0">Detectadas</tspan></text><rect x="10" y="56" width="634" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="81.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Campo ausente o vacío</tspan></text><rect x="650" y="56" width="154" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">59 de 59</tspan></text><rect x="10" y="106" width="634" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="131.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Degradación sin límite declarado</tspan></text><rect x="650" y="106" width="154" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">21 de 21</tspan></text><rect x="10" y="156" width="634" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="181.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Reintento «hasta que funcione»</tspan></text><rect x="650" y="156" width="154" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">21 de 21</tspan></text><rect x="10" y="206" width="634" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="231.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Presupuesto de tiempos incoherente (800 ms con 3 llamadas de 500 ms)</tspan></text><rect x="650" y="206" width="154" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">0 de 23</tspan></text><rect x="10" y="256" width="634" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="281.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Evidencia copiada del servicio vecino</tspan></text><rect x="650" y="256" width="154" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="281.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">0 de 23</tspan></text><rect x="10" y="306" width="634" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="331.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Prueba de fallos que nunca se ejecutó</tspan></text><rect x="650" y="306" width="154" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="331.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">0 de 25</tspan></text><rect x="10" y="356" width="634" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="381.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Garantía imposible (exactamente una vez y disponible en cualquier partición)</tspan></text><rect x="650" y="356" width="154" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="381.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">0 de 28</tspan></text><rect x="10" y="410" width="800" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="410" y="434.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="410" dy="0">Un paquete completo no es un paquete correcto. Lo que ningún validador de forma ve es lo que ocurre en las</tspan></text><text x="410" y="451.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="410" dy="0">revisiones reales: una garantía que no puede cumplirse, una prueba que no se corrió. Reglas escritas</tspan></text><text x="410" y="468.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="410" dy="0">conociendo las mutaciones: la exactitud sobre paquetes reales es desconocida.</tspan></text><text x="410" y="507.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="410" dy="0">Modelos sintéticos con semilla fija; resultados idénticos en Windows y Ubuntu (WSL2) salvo donde se indica.</tspan></text></svg>
