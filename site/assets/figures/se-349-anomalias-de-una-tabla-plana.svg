<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 363" width="940" height="363" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Renombrar el curso 7 con un lote que se corta tras 100 filas: cuántas filas guardan cada nombre</title><desc id="d">Barras apiladas horizontales con las filas que guardan el nombre del curso 7 después de un renombrado cortado tras 100 filas: la tabla plana tiene 112 filas, 100 con el nombre nuevo y 12 con el viejo, es decir dos versiones de la verdad; el modelo normalizado tiene una sola fila con el nombre nuevo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="363" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Renombrar el curso 7 con un lote que se corta tras 100 filas: cuántas filas guardan cada nombre</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Con el nombre nuevo</tspan></text><rect x="207.26" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="227.26" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="227.26" dy="0">Con el nombre viejo</tspan></text><line x1="274" y1="77" x2="274" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="165" x2="274" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0</tspan></text><line x1="394.34" y1="77" x2="394.34" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="394.34" y1="165" x2="394.34" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="394.34" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="394.34" dy="0">25</tspan></text><line x1="514.68" y1="77" x2="514.68" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="514.68" y1="165" x2="514.68" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="514.68" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="514.68" dy="0">50</tspan></text><line x1="635.02" y1="77" x2="635.02" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="635.02" y1="165" x2="635.02" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="635.02" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="635.02" dy="0">75</tspan></text><line x1="755.36" y1="77" x2="755.36" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="755.36" y1="165" x2="755.36" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="755.36" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="755.36" dy="0">100</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="165" x2="875.7" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">125</tspan></text><line x1="274" y1="165" x2="875.7" y2="165" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="95" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Tabla plana (el nombre se repite</tspan></text><text x="264" y="112" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">en cada entrega)</tspan></text><text x="264" y="139" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Modelo normalizado (el nombre vive</tspan></text><text x="264" y="156" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">en el curso)</tspan></text><rect x="274" y="84" width="481.36" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="514.68" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="514.68" dy="0">100</tspan></text><rect x="755.36" y="84" width="57.7632" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="784.242" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="784.242" dy="0">12</tspan></text><text x="820.123" y="103.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="820.123" dy="0">112</tspan></text><rect x="274" y="128" width="4.8136" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="278.814" y="128" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="285.814" y="147.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="285.814" dy="0">1</tspan></text><text x="574.85" y="209" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="574.85" dy="0">Filas que guardan el nombre del curso 7</tspan></text><rect x="10" y="223" width="920" height="92.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="247.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">La redundancia no es un problema de espacio sino de verdad: el mismo hecho vive en 112 lugares y cada escritura parcial</tspan></text><text x="470" y="264.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">deja dos versiones. Un curso que solo existe como columna de las entregas desaparece con la última entrega (39 cursos</tspan></text><text x="470" y="281.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">visibles en vez de 40). Los nombres, las cifras y la interrupción tras 100 filas son construcciones del autor; la tabla de</tspan></text><text x="470" y="297.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">la clase da también el tamaño del archivo (483 328 frente a 147 456 bytes).</tspan></text><text x="470" y="345.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; SQLite 3.45 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
