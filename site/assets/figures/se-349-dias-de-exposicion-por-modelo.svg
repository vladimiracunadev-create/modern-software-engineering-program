<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 307" width="960" height="307" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Días de exposición al año por modelo, con las mismas 127 vulnerabilidades anuales (media de 1 000 años)</title><desc id="d">Barras: con las mismas vulnerabilidades, la suma anual de días expuestos baja de 3 708 en una instalación propia a 3 579 con IaaS, 2 137 con PaaS y 1 061 con SaaS; en SaaS el 60,7 por ciento de lo que queda corresponde a capas que sigue operando el cliente.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="307" fill="#ffffff"/><text x="190" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="190" dy="0">Instalación propia</tspan></text><rect x="200" y="16" width="370.8" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="578.8" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="578.8" dy="0">3 708 días (100 % por capas del cliente)</tspan></text><text x="190" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="190" dy="0">IaaS</tspan></text><rect x="200" y="60" width="357.9" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="565.9" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="565.9" dy="0">3 579 días (99,5 %)</tspan></text><text x="190" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="190" dy="0">PaaS</tspan></text><rect x="200" y="104" width="213.7" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="421.7" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="421.7" dy="0">2 137 días (84,7 %)</tspan></text><text x="190" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="190" dy="0">SaaS</tspan></text><rect x="200" y="148" width="106.1" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="314.1" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="314.1" dy="0">1 061 días (60,7 %)</tspan></text><rect x="10" y="196" width="940" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="480" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">IaaS casi no mejora porque las capas que más vulnerabilidades traen, sistema operativo, entorno de ejecución y dependencias,</tspan></text><text x="480" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">siguen siendo del cliente. En SaaS la exposición cae a un tercio, pero el 60,7 % del resto es de identidad, datos y</tspan></text><text x="480" y="254.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">configuración: lo que se delega se parchea, lo que se configura se responde.</tspan></text><text x="480" y="293.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Modelo sintético con semilla fija; Windows y Ubuntu (WSL2) con cifras idénticas. Los parámetros son supuestos del autor.</tspan></text></svg>
