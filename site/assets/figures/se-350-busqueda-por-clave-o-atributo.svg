<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 406" width="940" height="406" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Buscar entre 50 000 valores guardados por clave: comparaciones por consulta</title><desc id="d">Barras horizontales en escala logarítmica con las comparaciones por consulta: buscar por la clave o con un índice secundario cuesta 1; recorrer por posición cuesta 23 881 y buscar por un atributo sin índice cuesta 50 000; el índice mantenido a mano deja 206 de 20 000 escrituras sin entrada.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="406" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Buscar entre 50 000 valores guardados por clave: comparaciones por consulta</tspan></text><line x1="354" y1="49" x2="354" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="225" x2="354" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">1</tspan></text><line x1="456.728" y1="49" x2="456.728" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="456.728" y1="225" x2="456.728" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="456.728" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="456.728" dy="0">10</tspan></text><line x1="559.456" y1="49" x2="559.456" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="559.456" y1="225" x2="559.456" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="559.456" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="559.456" dy="0">100</tspan></text><line x1="662.184" y1="49" x2="662.184" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="662.184" y1="225" x2="662.184" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="662.184" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662.184" dy="0">1 000</tspan></text><line x1="764.912" y1="49" x2="764.912" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="764.912" y1="225" x2="764.912" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="764.912" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="764.912" dy="0">10 000</tspan></text><line x1="867.64" y1="49" x2="867.64" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="867.64" y1="225" x2="867.64" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="867.64" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867.64" dy="0">100 000</tspan></text><line x1="354" y1="225" x2="867.64" y2="225" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="75.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Por clave directa (mapa de claves)</tspan></text><text x="344" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Por posición en una lista de claves</tspan></text><text x="344" y="163.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Por atributo (estudiante), sin índice</tspan></text><text x="344" y="199" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Por atributo, con índice a mano (206 de 20</tspan></text><text x="344" y="216" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">000 escrituras sin entrada)</tspan></text><rect x="354" y="55" width="2" height="32" rx="3" fill="#c0432f"/><text x="363" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">1</tspan></text><rect x="354" y="99" width="449.749" height="32" rx="3" fill="#c0432f"/><text x="810.749" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="810.749" dy="0">23 881</tspan></text><rect x="354" y="143" width="482.716" height="32" rx="3" fill="#c0432f"/><text x="843.716" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="843.716" dy="0">50 000</tspan></text><rect x="354" y="187" width="2" height="32" rx="3" fill="#c0432f"/><text x="363" y="207.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">1</tspan></text><text x="610.82" y="269" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="610.82" dy="0">Comparaciones por consulta (escala logarítmica)</tspan></text><rect x="10" y="283" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="307.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">El almacén de clave-valor es la estructura más barata para una sola pregunta y la más cara para cualquier otra. El índice</tspan></text><text x="470" y="324.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">secundario devuelve el costo a uno, pero ahora son dos escrituras sin transacción entre ellas: la probabilidad de 1 % de</tspan></text><text x="470" y="341.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">cortarse en medio es un supuesto del autor.</tspan></text><text x="470" y="388.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; SQLite 3.45 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
