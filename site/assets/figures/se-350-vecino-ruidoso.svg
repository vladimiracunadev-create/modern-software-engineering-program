<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 421" width="930" height="421" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Vecino ruidoso: trabajo por proceso al correr k procesos que consumen CPU a la vez, relativo a correr uno solo</title><desc id="d">Tabla: con 8 hilos lógicos, el trabajo por proceso baja a 0,58 en Windows y 0,86 en Ubuntu con dos procesos, a 0,37 y 0,58 con cuatro, a 0,28 y 0,34 con ocho y a 0,22 y 0,21 con dieciséis, mediana de siete repeticiones.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="421" fill="#ffffff"/><rect x="10" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="132" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="132" dy="0">Procesos simultáneos</tspan></text><rect x="260" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="422" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="422" dy="0">Windows 11: mediana (rango)</tspan></text><rect x="590" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="752" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="752" dy="0">Ubuntu (WSL2): mediana (rango)</tspan></text><rect x="10" y="56" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">1 (referencia)</tspan></text><rect x="260" y="56" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">1,00</tspan></text><rect x="590" y="56" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">1,00</tspan></text><rect x="10" y="106" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">2</tspan></text><rect x="260" y="106" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">0,58 (0,26–0,80)</tspan></text><rect x="590" y="106" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">0,86 (0,73–1,05)</tspan></text><rect x="10" y="156" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">4</tspan></text><rect x="260" y="156" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">0,37 (0,25–0,40)</tspan></text><rect x="590" y="156" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">0,58 (0,39–0,62)</tspan></text><rect x="10" y="206" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">8</tspan></text><rect x="260" y="206" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">0,28 (0,25–0,31)</tspan></text><rect x="590" y="206" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">0,34 (0,32–0,42)</tspan></text><rect x="10" y="256" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">16</tspan></text><rect x="260" y="256" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">0,22 (0,18–0,23)</tspan></text><rect x="590" y="256" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">0,21 (0,18–0,25)</tspan></text><rect x="10" y="310" width="910" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="465" y="334.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Con 8 hilos lógicos se esperaba un valor cercano a 1,00 hasta ocho procesos y 0,50 con dieciséis. Bajó antes porque el</tspan></text><text x="465" y="351.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">anfitrión no estaba ocioso: otras tareas compartían los núcleos, que es el problema que un límite de CPU reservado intenta</tspan></text><text x="465" y="368.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">acotar. No se probaron cuotas ni cgroups.</tspan></text><text x="465" y="407.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Tiempos medidos en un equipo de 8 hilos lógicos con otros procesos activos; cambian de una ejecución a otra, léanse como órdenes de magnitud.</tspan></text></svg>
