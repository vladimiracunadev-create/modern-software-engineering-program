<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 407" width="940" height="407" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dos docentes de guardia se retiran a la vez: destino de las 70 intercalaciones posibles</title><desc id="d">Barras apiladas horizontales con el destino de las 70 intercalaciones de dos transacciones que comprueban que quedan dos docentes y se retiran: bajo lectura confirmada 60 dejan cero docentes de guardia, bajo instantánea 68; con detección de conflictos de lectura-escritura ninguna, a costa de abortar una transacción en 68.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="407" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dos docentes de guardia se retiran a la vez: destino de las 70 intercalaciones posibles</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Quedan 0 de guardia</tspan></text><rect x="207.26" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="227.26" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="227.26" dy="0">Una transacción aborta</tspan></text><rect x="421.14" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="441.14" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="441.14" dy="0">Termina bien sin abortar</tspan></text><line x1="274" y1="77" x2="274" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="209" x2="274" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0</tspan></text><line x1="424.425" y1="77" x2="424.425" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="424.425" y1="209" x2="424.425" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="424.425" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="424.425" dy="0">20</tspan></text><line x1="574.85" y1="77" x2="574.85" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="574.85" y1="209" x2="574.85" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="574.85" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="574.85" dy="0">40</tspan></text><line x1="725.275" y1="77" x2="725.275" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="725.275" y1="209" x2="725.275" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="725.275" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="725.275" dy="0">60</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="209" x2="875.7" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">80</tspan></text><line x1="274" y1="209" x2="875.7" y2="209" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="103.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Lee lo confirmado (READ COMMITTED)</tspan></text><text x="264" y="147.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Lee una instantánea (SNAPSHOT)</tspan></text><text x="264" y="183" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Instantánea con detección de</tspan></text><text x="264" y="200" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">lecturas obsoletas</tspan></text><rect x="274" y="84" width="451.275" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="499.638" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="499.638" dy="0">60</tspan></text><rect x="725.275" y="84" width="0" height="30" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><rect x="725.275" y="84" width="75.2125" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="762.881" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="762.881" dy="0">10</tspan></text><text x="807.488" y="103.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="807.488" dy="0">70</tspan></text><rect x="274" y="128" width="511.445" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="529.723" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="529.723" dy="0">68</tspan></text><rect x="785.445" y="128" width="0" height="30" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><rect x="785.445" y="128" width="15.0425" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="807.488" y="147.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="807.488" dy="0">70</tspan></text><rect x="274" y="172" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><rect x="274" y="172" width="511.445" height="30" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="529.723" y="191.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="529.723" dy="0">68</tspan></text><rect x="785.445" y="172" width="15.0425" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="807.488" y="191.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="807.488" dy="0">70</tspan></text><text x="574.85" y="253" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="574.85" dy="0">Intercalaciones de 70</tspan></text><rect x="10" y="267" width="920" height="92.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="291.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Las dos transacciones escriben filas distintas, así que ningún conflicto de escritura las detiene: el invariante «al menos</tspan></text><text x="470" y="308.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">uno» solo se protege si la lectura también cuenta. Los tramos «sin abortar» son lo que resta de 70. SQLite, con dos</tspan></text><text x="470" y="325.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">conexiones DEFERRED, lo evita bloqueando: la segunda escritura y el commit del primero fallan con «database is locked». El</tspan></text><text x="470" y="341.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">modelo de niveles es una simplificación del autor; SQLite se ejecutó de verdad.</tspan></text><text x="470" y="389.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; SQLite 3.45 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
