-width="2"/><text x="295.465" y="363.1" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="295.465" dy="0">4,3</tspan></text><circle cx="494.31" cy="183.3" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="494.31" y="207.3" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="494.31" dy="0">67,9</tspan></text><circle cx="892" cy="87" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="111" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">100</tspan></text><polyline points="96.62,234 196.043,192 295.465,150 494.31,96 892,87" fill="none" stroke="#087f8c" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="91.12" y="228.5" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="96.62" y="223" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">51</tspan></text><rect x="190.543" y="186.5" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="196.043" y="181" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="196.043" dy="0">65</tspan></text><rect x="289.965" y="144.5" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="295.465" y="139" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="295.465" dy="0">79</tspan></text><rect x="488.81" y="90.5" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="494.31" y="85" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="494.31" dy="0">97</tspan></text><rect x="886.5" y="81.5" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La sobreasignación compra uso medio a cambio de riesgo de cola: pasar de 1,5 a 2,0 veces no suma un 33 % de riesgo, lo</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">multiplica por 16. La distribución del uso (normal de media 0,55 y desviación 0,25 de lo pedido, acotada) es un supuesto</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">del autor; con uso correlacionado entre pods el riesgo sería mayor.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo sintético con semilla fija; Windows y Ubuntu (WSL2) con cifras idénticas. Los parámetros son supuestos del autor.</tspan></text></svg>
