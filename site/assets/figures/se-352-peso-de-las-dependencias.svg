<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 371" width="940" height="371" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tiempo de arrancar un proceso Python que solo importa módulos de la biblioteca estándar</title><desc id="d">Tabla: arrancar un intérprete sin dependencias toma unos 49 milisegundos en Windows y 30 en Ubuntu; importar json y re lo lleva a 104 y 38; añadir sqlite3, decimal, http.client y email, a 220 y 90; y añadir asyncio, ssl, unittest y xml.dom, a 734 y 155, mediana de 21 repeticiones.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="371" fill="#ffffff"/><rect x="10" y="12" width="394" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="207" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="207" dy="0">Módulos importados al iniciar</tspan></text><rect x="410" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="542" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="542" dy="0">Windows 11: mediana (rango)</tspan></text><rect x="680" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="802" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="802" dy="0">Ubuntu (WSL2): mediana</tspan></text><text x="802" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="802" dy="0">(rango)</tspan></text><rect x="10" y="56" width="394" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Sin dependencias</tspan></text><rect x="410" y="56" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">≈ 49 ms (45–66)</tspan></text><rect x="680" y="56" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">≈ 30 ms (26–36)</tspan></text><rect x="10" y="106" width="394" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">json y re</tspan></text><rect x="410" y="106" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">≈ 104 ms (92–119)</tspan></text><rect x="680" y="106" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">≈ 38 ms (33–47)</tspan></text><rect x="10" y="156" width="394" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">+ sqlite3, decimal, http.client, email</tspan></text><rect x="410" y="156" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">≈ 220 ms (206–306)</tspan></text><rect x="680" y="156" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">≈ 90 ms (78–141)</tspan></text><rect x="10" y="206" width="394" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">+ asyncio, ssl, unittest, xml.dom</tspan></text><rect x="410" y="206" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">≈ 734 ms (517–868)</tspan></text><rect x="680" y="206" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">≈ 155 ms (137–450)</tspan></text><rect x="10" y="260" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="284.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El coste inicial de una función sin servidor crece con lo que carga, no con lo que ejecuta: quince veces más en Windows</tspan></text><text x="470" y="301.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">entre la primera y la última fila. Es el único tiempo de esta clase medido de verdad; el arranque de una plataforma</tspan></text><text x="470" y="318.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">gestionada incluye además descarga y aislamiento que no se midió.</tspan></text><text x="470" y="357.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Tiempos medidos en un equipo de 8 hilos lógicos con otros procesos activos; cambian de una ejecución a otra, léanse como órdenes de magnitud.</tspan></text></svg>
