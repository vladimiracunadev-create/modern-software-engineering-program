<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 479" width="940" height="479" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Pasos por consulta según el índice compuesto (30 000 entregas)</title><desc id="d">Mapa de calor con los pasos de cinco consultas con cuatro conjuntos de índices, con el color en escala logarítmica: el índice sobre curso y estudiante resuelve curso y estudiante en 27 pasos y solo curso en 6 743; el orden inverso resuelve estudiante en 264 y deja solo curso en 94 904; curso y fecha resuelve el rango de un curso en 404 pasos; el rango solo cuesta 124 772 sin índice y 18 142 con el último.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="479" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Pasos por consulta según el índice compuesto (30 000 entregas)</tspan></text><text x="598" y="59" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="598" dy="0">Índice disponible</tspan></text><text x="356.5" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="356.5" dy="0">Sin índice</tspan></text><text x="517.5" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="517.5" dy="0">(curso, estudiante)</tspan></text><text x="678.5" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="678.5" dy="0">(estudiante, curso)</tspan></text><text x="839.5" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="839.5" dy="0">(curso, fecha)</tspan></text><text x="266" y="120.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="266" dy="0">Curso y estudiante</tspan></text><text x="266" y="164.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="266" dy="0">Solo estudiante</tspan></text><text x="266" y="208.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="266" dy="0">Solo curso</tspan></text><text x="266" y="252.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="266" dy="0">Curso y rango de fechas</tspan></text><text x="266" y="296.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="266" dy="0">Solo rango de fechas</tspan></text><rect x="277.5" y="95.5" width="158" height="41" rx="4" fill="#c24935" stroke="#ffffff" stroke-width="1"/><text x="356.5" y="120.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="356.5" dy="0">91 266</tspan></text><rect x="438.5" y="95.5" width="158" height="41" rx="4" fill="#fbe3dd" stroke="#ffffff" stroke-width="1"/><text x="517.5" y="120.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="517.5" dy="0">27</tspan></text><rect x="599.5" y="95.5" width="158" height="41" rx="4" fill="#fbe4de" stroke="#102a43" stroke-width="3"/><text x="678.5" y="120.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="678.5" dy="0">26</tspan></text><rect x="760.5" y="95.5" width="158" height="41" rx="4" fill="#da897b" stroke="#ffffff" stroke-width="1"/><text x="839.5" y="120.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="839.5" dy="0">3 142</tspan></text><rect x="277.5" y="139.5" width="158" height="41" rx="4" fill="#c24936" stroke="#ffffff" stroke-width="1"/><text x="356.5" y="164.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="356.5" dy="0">90 192</tspan></text><rect x="438.5" y="139.5" width="158" height="41" rx="4" fill="#e4a69b" stroke="#ffffff" stroke-width="1"/><text x="517.5" y="164.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="517.5" dy="0">663</tspan></text><rect x="599.5" y="139.5" width="158" height="41" rx="4" fill="#ebb8ae" stroke="#102a43" stroke-width="3"/><text x="678.5" y="164.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="678.5" dy="0">264</tspan></text><rect x="760.5" y="139.5" width="158" height="41" rx="4" fill="#c24936" stroke="#ffffff" stroke-width="1"/><text x="839.5" y="164.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="839.5" dy="0">90 192</tspan></text><rect x="277.5" y="183.5" width="158" height="41" rx="4" fill="#c24835" stroke="#ffffff" stroke-width="1"/><text x="356.5" y="208.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="356.5" dy="0">94 904</tspan></text><rect x="438.5" y="183.5" width="158" height="41" rx="4" fill="#d47a6b" stroke="#102a43" stroke-width="3"/><text x="517.5" y="208.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="517.5" dy="0">6 743</tspan></text><rect x="599.5" y="183.5" width="158" height="41" rx="4" fill="#c24835" stroke="#ffffff" stroke-width="1"/><text x="678.5" y="208.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="678.5" dy="0">94 904</tspan></text><rect x="760.5" y="183.5" width="158" height="41" rx="4" fill="#d47a6b" stroke="#102a43" stroke-width="3"/><text x="839.5" y="208.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="839.5" dy="0">6 743</tspan></text><rect x="277.5" y="227.5" width="158" height="41" rx="4" fill="#c24935" stroke="#ffffff" stroke-width="1"/><text x="356.5" y="252.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="356.5" dy="0">91 948</tspan></text><rect x="438.5" y="227.5" width="158" height="41" rx="4" fill="#d88577" stroke="#ffffff" stroke-width="1"/><text x="517.5" y="252.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="517.5" dy="0">3 788</tspan></text><rect x="599.5" y="227.5" width="158" height="41" rx="4" fill="#c24935" stroke="#ffffff" stroke-width="1"/><text x="678.5" y="252.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="678.5" dy="0">91 948</tspan></text><rect x="760.5" y="227.5" width="158" height="41" rx="4" fill="#e8b0a5" stroke="#102a43" stroke-width="3"/><text x="839.5" y="252.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="839.5" dy="0">404</tspan></text><rect x="277.5" y="271.5" width="158" height="41" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="356.5" y="296.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="356.5" dy="0">124 772</tspan></text><rect x="438.5" y="271.5" width="158" height="41" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="517.5" y="296.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="517.5" dy="0">124 772</tspan></text><rect x="599.5" y="271.5" width="158" height="41" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="678.5" y="296.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="678.5" dy="0">124 772</tspan></text><rect x="760.5" y="271.5" width="158" height="41" rx="4" fill="#cd6857" stroke="#102a43" stroke-width="3"/><text x="839.5" y="296.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="839.5" dy="0">18 142</tspan></text><text x="20" y="204" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 204)">Consulta</text><text x="276" y="340" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="276" dy="0">26</tspan></text><rect x="299.08" y="328" width="30.5" height="14" fill="#fbe4de"/><rect x="329.08" y="328" width="30.5" height="14" fill="#f3cdc5"/><rect x="359.08" y="328" width="30.5" height="14" fill="#eab6ac"/><rect x="389.08" y="328" width="30.5" height="14" fill="#e29f93"/><rect x="419.08" y="328" width="30.5" height="14" fill="#d9887a"/><rect x="449.08" y="328" width="30.5" height="14" fill="#d17161"/><rect x="479.08" y="328" width="30.5" height="14" fill="#c85a48"/><rect x="509.08" y="328" width="30.5" height="14" fill="#c0432f"/><text x="547.08" y="340" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="547.08" dy="0">124 772</tspan></text><text x="607.86" y="340" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="607.86" dy="0">más oscuro = mayor (pasos, color en escala logarítmica)</tspan></text><rect x="10" y="356" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="380.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">El orden de las columnas decide qué consultas ayuda; el contorno marca el mejor índice de cada consulta (o los empatados).</tspan></text><text x="470" y="397.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">SQLite, tras ANALYZE, usó un recorrido por saltos (ANY(curso)) para algunas consultas sin el primer prefijo, algo que otros</tspan></text><text x="470" y="414.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">motores no hacen. Pasos medidos, no tiempo.</tspan></text><text x="470" y="461.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; SQLite 3.45 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
