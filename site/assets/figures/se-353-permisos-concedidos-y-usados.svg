<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 531" width="940" height="531" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Pares acción-recurso concedidos y usados por rol, según el estilo de política (25 roles, 400 pares posibles)</title><desc id="d">Barras horizontales agrupadas en escala logarítmica: un rol administrador concede 400 pares y usa 5,8; conceder el servicio completo da 80,8; las acciones usadas sobre todos los recursos, 32,4; solo los pares usados, 5,8. Lo usado es 5,8 en los cuatro estilos, por lo que lo concedido va de 69 veces lo usado a lo justo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="531" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Pares acción-recurso concedidos y usados por rol, según el estilo de política (25 roles, 400 pares posibles)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Pares concedidos</tspan></text><rect x="184.64" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="204.64" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="204.64" dy="0">Pares usados</tspan></text><line x1="264" y1="77" x2="264" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="264" y1="333" x2="264" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="264" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="264" dy="0">1</tspan></text><line x1="470.587" y1="77" x2="470.587" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="470.587" y1="333" x2="470.587" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="470.587" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470.587" dy="0">10</tspan></text><line x1="677.173" y1="77" x2="677.173" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="677.173" y1="333" x2="677.173" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="677.173" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="677.173" dy="0">100</tspan></text><line x1="883.76" y1="77" x2="883.76" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="883.76" y1="333" x2="883.76" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="883.76" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="883.76" dy="0">1 000</tspan></text><line x1="264" y1="333" x2="883.76" y2="333" stroke="#5b7280" stroke-width="1.6"/><text x="254" y="113.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="254" dy="0">Administrador (* sobre *)</tspan></text><text x="254" y="177.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="254" dy="0">Todo el servicio sobre *</tspan></text><text x="254" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="254" dy="0">Acciones usadas sobre *</tspan></text><text x="254" y="305.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="254" dy="0">Pares acción-recurso usados</tspan></text><rect x="264" y="83" width="537.551" height="24.5" rx="3" fill="#c0432f"/><text x="808.551" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="808.551" dy="0">400</tspan></text><rect x="264" y="110.5" width="157.714" height="24.5" rx="3" fill="#087f8c"/><text x="428.714" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="428.714" dy="0">5,8</tspan></text><rect x="264" y="147" width="394.046" height="24.5" rx="3" fill="#c0432f"/><text x="665.046" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="665.046" dy="0">80,8</tspan></text><rect x="264" y="174.5" width="157.714" height="24.5" rx="3" fill="#087f8c"/><text x="428.714" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="428.714" dy="0">5,8</tspan></text><rect x="264" y="211" width="312.058" height="24.5" rx="3" fill="#c0432f"/><text x="583.058" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="583.058" dy="0">32,4</tspan></text><rect x="264" y="238.5" width="157.714" height="24.5" rx="3" fill="#087f8c"/><text x="428.714" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="428.714" dy="0">5,8</tspan></text><rect x="264" y="275" width="157.714" height="24.5" rx="3" fill="#c0432f"/><text x="428.714" y="291.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="428.714" dy="0">5,8</tspan></text><rect x="264" y="302.5" width="157.714" height="24.5" rx="3" fill="#087f8c"/><text x="428.714" y="319.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="428.714" dy="0">5,8</tspan></text><text x="573.88" y="377" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="573.88" dy="0">Pares acción-recurso por rol (media) (escala logarítmica)</tspan></text><rect x="10" y="391" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="415.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Dos roles conservan una ruta de escalada incluso con el mínimo porque su uso real incluye la acción de adjuntar políticas:</tspan></text><text x="470" y="432.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">el menor privilegio mide lo concedido contra lo usado, no si lo usado es prudente. Los roles con ruta de escalada por</tspan></text><text x="470" y="449.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">estilo (25, 6, 2 y 2) están en la tabla. Los roles, el registro de uso y las 60 acciones son sintéticos; generar la</tspan></text><text x="470" y="465.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">política desde el registro supone que el registro fue completo.</tspan></text><text x="470" y="513.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo sintético con semilla fija; Windows y Ubuntu (WSL2) con cifras idénticas. Los parámetros son supuestos del autor.</tspan></text></svg>
