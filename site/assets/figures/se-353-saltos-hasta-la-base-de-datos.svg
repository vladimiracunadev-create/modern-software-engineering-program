<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 287" width="930" height="287" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Saltos mínimos desde internet hasta un destino sensible tras añadir una sola regla (127 reglas posibles)</title><desc id="d">Tabla: en una red de 12 servicios la base de datos y el almacén de secretos están a 4 saltos de internet; de las 127 reglas que se pueden añadir, 1 deja la base de datos a un salto, 5 a dos y 9 a tres, y 112 no cambian la distancia; para el almacén de secretos son 1, 3 y 7, y 116 no la cambian.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="287" fill="#ffffff"/><rect x="10" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="147" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="147" dy="0">Destino</tspan></text><rect x="290" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="367" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="367" dy="0">Saltos al inicio</tspan></text><rect x="450" y="12" width="314" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="607" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="607" dy="0">Reglas que lo dejan a 1 / 2 / 3</tspan></text><text x="607" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="607" dy="0">saltos</tspan></text><rect x="770" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="842" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="842" dy="0">Reglas sin</tspan></text><text x="842" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="842" dy="0">efecto</tspan></text><rect x="10" y="56" width="274" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="147" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="147" dy="0">Base de datos</tspan></text><rect x="290" y="56" width="154" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="367" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="367" dy="0">4</tspan></text><rect x="450" y="56" width="314" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="607" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607" dy="0">1 / 5 / 9</tspan></text><rect x="770" y="56" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">112</tspan></text><rect x="10" y="114" width="274" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="147" y="143.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="147" dy="0">Almacén de secretos</tspan></text><rect x="290" y="114" width="154" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="367" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="367" dy="0">4</tspan></text><rect x="450" y="114" width="314" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="607" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607" dy="0">1 / 3 / 7</tspan></text><rect x="770" y="114" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">116</tspan></text><rect x="10" y="176" width="910" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="465" y="200.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Nueve de cada diez reglas nuevas no acercan nada, pero 15 de 127 sí acercan la base de datos, y una sola la deja directa.</tspan></text><text x="465" y="217.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Menos saltos no significa más tráfico: significa menos barreras entre un atacante y el dato. Un salto es una regla</tspan></text><text x="465" y="234.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">permitida; no se modelaron puertos, protocolos ni reglas de salida.</tspan></text><text x="465" y="273.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Modelo sintético con semilla fija; Windows y Ubuntu (WSL2) con cifras idénticas. Los parámetros son supuestos del autor.</tspan></text></svg>
