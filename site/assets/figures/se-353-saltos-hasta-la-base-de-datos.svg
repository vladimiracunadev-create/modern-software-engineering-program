<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 346" width="940" height="346" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una regla nueva entre las 127 posibles: ¿acerca internet a un destino sensible? (partiendo de 4 saltos)</title><desc id="d">Barras apiladas horizontales con las 127 reglas que se pueden añadir a una red de 12 servicios: para la base de datos 1 regla la deja a un salto, 5 a dos, 9 a tres y 112 no cambian la distancia; para el almacén de secretos son 1, 3 y 7, y 116 no la cambian. Casi todo el ancho es de reglas sin efecto.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="346" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Una regla nueva entre las 127 posibles: ¿acerca internet a un destino sensible? (partiendo de 4 saltos)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Dejan a 1 salto</tspan></text><rect x="177.1" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="197.1" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="197.1" dy="0">A 2 saltos</tspan></text><rect x="300.5" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="320.5" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="320.5" dy="0">A 3 saltos</tspan></text><rect x="423.9" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="443.9" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="443.9" dy="0">Sin efecto</tspan></text><line x1="284" y1="77" x2="284" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="284" y1="165" x2="284" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="284" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="284" dy="0">0</tspan></text><line x1="481.233" y1="77" x2="481.233" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="481.233" y1="165" x2="481.233" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="481.233" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="481.233" dy="0">50</tspan></text><line x1="678.467" y1="77" x2="678.467" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="678.467" y1="165" x2="678.467" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="678.467" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="678.467" dy="0">100</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="165" x2="875.7" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">150</tspan></text><line x1="284" y1="165" x2="875.7" y2="165" stroke="#5b7280" stroke-width="1.6"/><text x="274" y="95" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Base de datos (1, 5 y 9 reglas</tspan></text><text x="274" y="112" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">acercan; 112 no)</tspan></text><text x="274" y="139" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Almacén de secretos (1, 3 y 7</tspan></text><text x="274" y="156" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">reglas acercan; 116 no)</tspan></text><rect x="284" y="84" width="3.94467" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><rect x="287.945" y="84" width="19.7233" height="30" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="297.806" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="297.806" dy="0">5</tspan></text><rect x="307.668" y="84" width="35.502" height="30" fill="#102a43" stroke="#ffffff" stroke-width="1.5"/><text x="325.419" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="325.419" dy="0">9</tspan></text><rect x="343.17" y="84" width="441.803" height="30" fill="#6b7c86" stroke="#ffffff" stroke-width="1.5"/><text x="564.071" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="564.071" dy="0">112</tspan></text><text x="791.973" y="103.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="791.973" dy="0">127</tspan></text><rect x="284" y="128" width="3.94467" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><rect x="287.945" y="128" width="11.834" height="30" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><rect x="299.779" y="128" width="27.6127" height="30" fill="#102a43" stroke="#ffffff" stroke-width="1.5"/><text x="313.585" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="313.585" dy="0">7</tspan></text><rect x="327.391" y="128" width="457.581" height="30" fill="#6b7c86" stroke="#ffffff" stroke-width="1.5"/><text x="556.182" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="556.182" dy="0">116</tspan></text><text x="791.973" y="147.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="791.973" dy="0">127</tspan></text><text x="579.85" y="209" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="579.85" dy="0">Reglas posibles (de 127)</tspan></text><rect x="10" y="223" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="247.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Nueve de cada diez reglas nuevas no acercan nada, pero 15 de 127 sí acercan la base de datos, y una sola la deja directa.</tspan></text><text x="470" y="264.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Menos saltos no significa más tráfico: significa menos barreras entre un atacante y el dato. Un salto es una regla</tspan></text><text x="470" y="281.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">permitida; no se modelaron puertos, protocolos ni reglas de salida.</tspan></text><text x="470" y="328.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo sintético con semilla fija; Windows y Ubuntu (WSL2) con cifras idénticas. Los parámetros son supuestos del autor.</tspan></text></svg>
