<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 494" width="940" height="494" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Filas alteradas tras aplicar una migración y su inversa (1 000 filas)</title><desc id="d">Barras horizontales con las filas alteradas de 1 000 tras aplicar una migración y su inversa: renombrar una columna y volver no altera ninguna; dividir y recomponer el nombre altera 66; quitar y volver a añadir una columna, 666; pasar la nota a entero y volver, 937; añadir una columna, escribir en ella y quitarla, y pasar a mayúsculas y volver, las 1 000.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="494" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Filas alteradas tras aplicar una migración y su inversa (1 000 filas)</tspan></text><line x1="324" y1="49" x2="324" y2="313" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="313" x2="324" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="334" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="461.925" y1="49" x2="461.925" y2="313" stroke="#d5dde1" stroke-width="1"/><line x1="461.925" y1="313" x2="461.925" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="461.925" y="334" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="461.925" dy="0">250</tspan></text><line x1="599.85" y1="49" x2="599.85" y2="313" stroke="#d5dde1" stroke-width="1"/><line x1="599.85" y1="313" x2="599.85" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="599.85" y="334" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="599.85" dy="0">500</tspan></text><line x1="737.775" y1="49" x2="737.775" y2="313" stroke="#d5dde1" stroke-width="1"/><line x1="737.775" y1="313" x2="737.775" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="737.775" y="334" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737.775" dy="0">750</tspan></text><line x1="875.7" y1="49" x2="875.7" y2="313" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="313" x2="875.7" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="334" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">1 000</tspan></text><line x1="324" y1="313" x2="875.7" y2="313" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="75.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Renombrar una columna y volver</tspan></text><text x="314" y="111" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Dividir el nombre en dos columnas y</tspan></text><text x="314" y="128" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">recomponer</tspan></text><text x="314" y="155" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Quitar la columna comentario y volver a</tspan></text><text x="314" y="172" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">añadirla</tspan></text><text x="314" y="207.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Nota de decimal a entero y volver</tspan></text><text x="314" y="243" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Añadir una columna, escribir en ella y</tspan></text><text x="314" y="260" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">quitarla</tspan></text><text x="314" y="295.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Pasar el nombre a mayúsculas y volver</tspan></text><rect x="324" y="55" width="2" height="32" rx="3" fill="#c0432f"/><text x="333" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">0</tspan></text><rect x="324" y="99" width="36.4122" height="32" rx="3" fill="#c0432f"/><text x="367.412" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="367.412" dy="0">66</tspan></text><rect x="324" y="143" width="367.432" height="32" rx="3" fill="#c0432f"/><text x="698.432" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="698.432" dy="0">666</tspan></text><rect x="324" y="187" width="516.943" height="32" rx="3" fill="#c0432f"/><text x="847.943" y="207.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="847.943" dy="0">937</tspan></text><rect x="324" y="231" width="551.7" height="32" rx="3" fill="#c0432f"/><text x="882.7" y="251.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">1 000</tspan></text><rect x="324" y="275" width="551.7" height="32" rx="3" fill="#c0432f"/><text x="882.7" y="295.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">1 000</tspan></text><text x="599.85" y="357" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="599.85" dy="0">Filas alteradas de 1 000</tspan></text><rect x="10" y="371" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="395.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">«Tiene un down» no significa «es reversible»: solo el renombrado devuelve los mismos datos. Las demás restauran la</tspan></text><text x="470" y="412.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">estructura y pierden información (los valores, los decimales, la capitalización o las escrituras nuevas); para volver de</tspan></text><text x="470" y="429.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">verdad hace falta una copia anterior al paso. Datos sintéticos con 5 % de nombres sin coma.</tspan></text><text x="470" y="476.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; SQLite 3.45 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
