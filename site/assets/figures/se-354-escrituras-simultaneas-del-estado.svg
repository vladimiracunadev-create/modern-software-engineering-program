<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 271" width="960" height="271" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Escrituras simultáneas sobre un mismo archivo de estado: todas las intercalaciones de leer y escribir</title><desc id="d">Tabla: con dos aplicaciones que leen el estado y luego lo escriben entero hay 6 intercalaciones y 4 pierden el trabajo de una; con tres hay 90, de las cuales 6 no pierden nada, 36 pierden el trabajo de una y 48 el de dos; con un bloqueo solo quedan las ejecuciones en serie, 2 y 6, sin pérdidas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="271" fill="#ffffff"/><rect x="10" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="132" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="132" dy="0">Situación</tspan></text><rect x="260" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="332" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="332" dy="0">Intercalaciones</tspan></text><rect x="410" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="477" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="477" dy="0">Sin pérdida</tspan></text><rect x="550" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="607" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="607" dy="0">Pierde 1</tspan></text><rect x="670" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="727" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="727" dy="0">Pierde 2</tspan></text><rect x="790" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="867" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="867" dy="0">Con bloqueo</tspan></text><rect x="10" y="56" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">2 aplicaciones a la vez</tspan></text><rect x="260" y="56" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="332" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="332" dy="0">6</tspan></text><rect x="410" y="56" width="134" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">2</tspan></text><rect x="550" y="56" width="114" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="607" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607" dy="0">4</tspan></text><rect x="670" y="56" width="114" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">—</tspan></text><rect x="790" y="56" width="154" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">2 (sin pérdidas)</tspan></text><rect x="10" y="106" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">3 aplicaciones a la vez</tspan></text><rect x="260" y="106" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="332" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="332" dy="0">90</tspan></text><rect x="410" y="106" width="134" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">6</tspan></text><rect x="550" y="106" width="114" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="607" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607" dy="0">36</tspan></text><rect x="670" y="106" width="114" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="727" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727" dy="0">48</tspan></text><rect x="790" y="106" width="154" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">6 (sin pérdidas)</tspan></text><rect x="10" y="160" width="940" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="480" y="184.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">Es la misma actualización perdida de la Parte 26 aplicada a un archivo que describe infraestructura: el recurso existe en la</tspan></text><text x="480" y="201.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">nube y no en el estado, y el siguiente plan lo creará otra vez o fallará por duplicado. Un bloqueo con caducidad añade su</tspan></text><text x="480" y="218.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">propio riesgo cuando el proceso muere con el bloqueo tomado.</tspan></text><text x="480" y="257.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Modelo sintético con semilla fija; Windows y Ubuntu (WSL2) con cifras idénticas. Los parámetros son supuestos del autor.</tspan></text></svg>
