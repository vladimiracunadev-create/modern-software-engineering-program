<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 447" width="950" height="447" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Divergencia entre preproducción y producción en 52 semanas (72 claves que deberían coincidir; media de 300 años)</title><desc id="d">Tabla: sin una promoción que copie la configuración, con una edición manual cada diez semanas hay divergencia en 38 de 52 semanas y quedan 3,34 claves distintas al final; con una edición cada dos semanas y media, 50,5 semanas y 17,39 claves; con una promoción cada cuatro semanas, las claves distintas al final son 0 y las semanas con divergencia bajan a 5,0, 13,7 y 24,1.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="447" fill="#ffffff"/><rect x="10" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="157" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="157" dy="0">Proceso</tspan></text><rect x="310" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="422" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="422" dy="0">Ediciones manuales por</tspan></text><text x="422" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="422" dy="0">semana</tspan></text><rect x="540" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="642" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="642" dy="0">Semanas con divergencia</tspan></text><rect x="750" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="842" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="842" dy="0">Claves distintas al</tspan></text><text x="842" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="842" dy="0">final</tspan></text><rect x="10" y="56" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="79.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Sin promoción</tspan></text><rect x="310" y="56" width="224" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="79.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">0,1</tspan></text><rect x="540" y="56" width="204" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="79.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">38,0</tspan></text><rect x="750" y="56" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="79.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">3,34</tspan></text><rect x="10" y="102" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="125.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Sin promoción</tspan></text><rect x="310" y="102" width="224" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="125.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">0,3</tspan></text><rect x="540" y="102" width="204" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="125.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">48,3</tspan></text><rect x="750" y="102" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="125.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">9,32</tspan></text><rect x="10" y="148" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="171.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Sin promoción</tspan></text><rect x="310" y="148" width="224" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="171.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">0,6</tspan></text><rect x="540" y="148" width="204" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="171.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">50,5</tspan></text><rect x="750" y="148" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="171.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">17,39</tspan></text><rect x="10" y="194" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="217.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Con promoción cada 4 semanas</tspan></text><rect x="310" y="194" width="224" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="217.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">0,1</tspan></text><rect x="540" y="194" width="204" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="217.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">5,0</tspan></text><rect x="750" y="194" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="217.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">0</tspan></text><rect x="10" y="240" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="263.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Con promoción cada 4 semanas</tspan></text><rect x="310" y="240" width="224" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="263.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">0,3</tspan></text><rect x="540" y="240" width="204" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="263.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">13,7</tspan></text><rect x="750" y="240" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="263.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">0</tspan></text><rect x="10" y="286" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="309.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Con promoción cada 4 semanas</tspan></text><rect x="310" y="286" width="224" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="309.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">0,6</tspan></text><rect x="540" y="286" width="204" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="642" y="309.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642" dy="0">24,1</tspan></text><rect x="750" y="286" width="184" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="309.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">0</tspan></text><rect x="10" y="336" width="930" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="475" y="360.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">La promoción no impide la divergencia, la acota en el tiempo: dura hasta la siguiente copia. Sin ella las diferencias se</tspan></text><text x="475" y="377.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">acumulan, la probabilidad de la edición manual es un supuesto del autor, y la experiencia de «en preproducción funcionaba»</tspan></text><text x="475" y="394.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">deja de significar nada tras unas semanas.</tspan></text><text x="475" y="433.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Modelo sintético con semilla fija; Windows y Ubuntu (WSL2) con cifras idénticas. Los parámetros son supuestos del autor.</tspan></text></svg>
