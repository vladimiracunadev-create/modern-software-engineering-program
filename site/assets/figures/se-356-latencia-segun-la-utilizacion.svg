<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 421" width="940" height="421" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una cola de un servidor: tiempo en el sistema, en unidades del tiempo de servicio, simulado / teórico</title><desc id="d">Tabla: con utilización del 50 por ciento el tiempo medio en el sistema es 2 veces el de servicio y el percentil 99 es 9,3; con 80 por ciento es 5,1 y 23,7; con 90 por ciento es 10,1 y 48,3; con 95 por ciento es 20,7 y 103. La teoría da 2, 5, 10 y 20 para la media.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="421" fill="#ffffff"/><rect x="10" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="137" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="137" dy="0">Utilización</tspan></text><rect x="270" y="12" width="314" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="427" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="427" dy="0">Media simulada / teórica</tspan></text><rect x="590" y="12" width="334" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="757" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="757" dy="0">Percentil 99 simulado / teórico</tspan></text><rect x="10" y="56" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">50 %</tspan></text><rect x="270" y="56" width="314" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="427" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="427" dy="0">2,00 / 2,00</tspan></text><rect x="590" y="56" width="334" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">9,3 / 9,2</tspan></text><rect x="10" y="106" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">70 %</tspan></text><rect x="270" y="106" width="314" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="427" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="427" dy="0">3,35 / 3,33</tspan></text><rect x="590" y="106" width="334" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">15,6 / 15,4</tspan></text><rect x="10" y="156" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">80 %</tspan></text><rect x="270" y="156" width="314" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="427" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="427" dy="0">5,07 / 5,00</tspan></text><rect x="590" y="156" width="334" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">23,7 / 23,0</tspan></text><rect x="10" y="206" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">90 %</tspan></text><rect x="270" y="206" width="314" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="427" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="427" dy="0">10,1 / 10,0</tspan></text><rect x="590" y="206" width="334" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">48,3 / 46,1</tspan></text><rect x="10" y="256" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">95 %</tspan></text><rect x="270" y="256" width="314" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="427" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="427" dy="0">20,7 / 20,0</tspan></text><rect x="590" y="256" width="334" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">103 / 92</tspan></text><rect x="10" y="310" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="334.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">De 80 a 95 % de utilización el tiempo medio se cuadruplica: ese es el codo que el escalado debe evitar. La simulación de</tspan></text><text x="470" y="351.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">200 000 clientes de Poisson con servicio exponencial coincide con la fórmula 1 ÷ (μ − λ); no representa colas con ráfagas,</tspan></text><text x="470" y="368.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">prioridades ni varios servidores.</tspan></text><text x="470" y="407.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo sintético con semilla fija; Windows y Ubuntu (WSL2) con cifras idénticas. Los parámetros son supuestos del autor.</tspan></text></svg>
