<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 471" width="890" height="471" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Siete días de tráfico con picos: demanda sin atender e instancias-hora según la política</title><desc id="d">Tabla: con 12 instancias fijas queda sin atender el 1,64 por ciento de la demanda y se gastan 2 016 instancias-hora; con 30 fijas no queda nada y se gastan 5 040; un escalado reactivo sin retardo no deja nada con 1 910, y con arranques de 2 y 5 minutos deja 0,34 y 0,84 por ciento con 1 866 y 1 813; el programado deja 1,85 con 1 762.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="890" height="471" fill="#ffffff"/><rect x="10" y="12" width="444" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="232" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="232" dy="0">Política</tspan></text><rect x="460" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="572" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="572" dy="0">Demanda sin atender</tspan></text><rect x="690" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="782" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="782" dy="0">Instancias-hora</tspan></text><rect x="10" y="56" width="444" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Fijo en el pico diurno (12 instancias)</tspan></text><rect x="460" y="56" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">1,64 %</tspan></text><rect x="690" y="56" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">2 016</tspan></text><rect x="10" y="106" width="444" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Fijo en el pico de los picos (30)</tspan></text><rect x="460" y="106" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">0 %</tspan></text><rect x="690" y="106" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">5 040</tspan></text><rect x="10" y="156" width="444" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Reactivo, arranque inmediato</tspan></text><rect x="460" y="156" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">0 %</tspan></text><rect x="690" y="156" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">1 910</tspan></text><rect x="10" y="206" width="444" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Reactivo, arranque de 2 minutos</tspan></text><rect x="460" y="206" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">0,34 %</tspan></text><rect x="690" y="206" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">1 866</tspan></text><rect x="10" y="256" width="444" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Reactivo, arranque de 5 minutos</tspan></text><rect x="460" y="256" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">0,84 %</tspan></text><rect x="690" y="256" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">1 813</tspan></text><rect x="10" y="306" width="444" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="331.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Programado (solo la curva diaria)</tspan></text><rect x="460" y="306" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">1,85 %</tspan></text><rect x="690" y="306" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">1 762</tspan></text><rect x="10" y="360" width="870" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="445" y="384.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="445" dy="0">El arranque tarda y eso se paga en demanda perdida: cada minuto de retardo añade unos 0,17 puntos porcentuales de</tspan></text><text x="445" y="401.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="445" dy="0">demanda perdida en este tráfico. Reservar para el peor pico cuesta 2,6 veces más que escalar con reacción. Capacidad</tspan></text><text x="445" y="418.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="445" dy="0">de 20 solicitudes por segundo por instancia, objetivo del 60 % y picos de 2,5 a 4 veces son supuestos del autor.</tspan></text><text x="445" y="457.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="445" dy="0">Modelo sintético con semilla fija; Windows y Ubuntu (WSL2) con cifras idénticas. Los parámetros son supuestos del autor.</tspan></text></svg>
