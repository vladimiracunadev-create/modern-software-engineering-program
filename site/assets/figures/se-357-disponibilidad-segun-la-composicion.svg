<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 421" width="930" height="421" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Disponibilidad anual al combinar dos proveedores que fallan de forma independiente</title><desc id="d">Tabla: un proveedor con 99,95 por ciento de disponibilidad pierde 262,8 minutos al año; dos proveedores con conmutación perfecta pierden 0,1; si la conmutación acierta el 90 por ciento de las veces, 26,4; si hay un servicio compartido de 99,95 por ciento, 262,9; y si el servicio necesita ambos a la vez, 525,5.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="421" fill="#ffffff"/><rect x="10" y="12" width="484" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="252" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="252" dy="0">Composición</tspan></text><rect x="500" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="597" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="597" dy="0">Disponibilidad</tspan></text><rect x="700" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="807" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="807" dy="0">Minutos de caída al año</tspan></text><rect x="10" y="56" width="484" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="252" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="252" dy="0">Un proveedor (99,95 %)</tspan></text><rect x="500" y="56" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">99,95 %</tspan></text><rect x="700" y="56" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">262,8</tspan></text><rect x="10" y="106" width="484" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="252" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="252" dy="0">Dos, conmutación perfecta e instantánea</tspan></text><rect x="500" y="106" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">99,99998 %</tspan></text><rect x="700" y="106" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">0,1</tspan></text><rect x="10" y="156" width="484" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="252" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="252" dy="0">Dos, la conmutación acierta el 90 % de las veces</tspan></text><rect x="500" y="156" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">99,995 %</tspan></text><rect x="700" y="156" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">26,4</tspan></text><rect x="10" y="206" width="484" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="252" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="252" dy="0">Dos, pero con un DNS compartido de 99,95 %</tspan></text><rect x="500" y="206" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">99,95 %</tspan></text><rect x="700" y="206" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">262,9</tspan></text><rect x="10" y="256" width="484" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="252" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="252" dy="0">Dos, exigiendo ambos a la vez (réplica síncrona)</tspan></text><rect x="500" y="256" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">99,90 %</tspan></text><rect x="700" y="256" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">525,5</tspan></text><rect x="10" y="310" width="910" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="465" y="334.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Redundancia en paralelo ayuda mucho solo si la conmutación funciona y nada se comparte; una dependencia en serie con el</tspan></text><text x="465" y="351.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">mismo 99,95 % anula el beneficio, y exigir ambos lo empeora al doble. El cálculo se verificó con 35 millones de horas</tspan></text><text x="465" y="368.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">simuladas. La independencia de fallos y los 99,95 % son supuestos del autor, no medidas de un proveedor.</tspan></text><text x="465" y="407.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Modelo sintético con semilla fija; Windows y Ubuntu (WSL2) con cifras idénticas. Los parámetros son supuestos del autor.</tspan></text></svg>
