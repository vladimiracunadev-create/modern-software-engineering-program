<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tiempo de mover datos entre proveedores según el volumen y el enlace (70 % de eficiencia)</title><desc id="d">Líneas en escala logarítmica con las horas para mover 0,1, 1, 10 y 100 terabytes: por un enlace de 100 megabits por segundo, 3,2, 31,7, 317,5 y 3 175 horas; por uno de 1 gigabit, 0,3, 3,2, 31,7 y 317,5. La línea de un día queda superada a partir de 1 terabyte con 100 megabits. El coste de salida crece de 8 a 8 000 unidades.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Tiempo de mover datos entre proveedores según el volumen y el enlace (70 % de eficiencia)</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Enlace de 100 Mbps</tspan></text><rect x="199.72" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="219.72" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="219.72" dy="0">Enlace de 1 Gbps</tspan></text><line x1="101.24" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="387" x2="101.24" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">0,1</tspan></text><line x1="101.24" y1="327" x2="910" y2="327" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="327" x2="101.24" y2="327" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="331.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">1</tspan></text><line x1="101.24" y1="267" x2="910" y2="267" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="267" x2="101.24" y2="267" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="271.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">10</tspan></text><line x1="101.24" y1="207" x2="910" y2="207" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="207" x2="101.24" y2="207" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="211.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">100</tspan></text><line x1="101.24" y1="147" x2="910" y2="147" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="147" x2="101.24" y2="147" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="151.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">1 000</tspan></text><line x1="101.24" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="87" x2="101.24" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">10 000</tspan></text><line x1="101.24" y1="87" x2="101.24" y2="387" stroke="#5b7280" stroke-width="1.6"/><line x1="119.24" y1="87" x2="119.24" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="119.24" y1="387" x2="119.24" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="119.24" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="119.24" dy="0">0,1</tspan></text><line x1="376.827" y1="87" x2="376.827" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="376.827" y1="387" x2="376.827" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="376.827" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="376.827" dy="0">1</tspan></text><line x1="634.413" y1="87" x2="634.413" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="634.413" y1="387" x2="634.413" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="634.413" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="634.413" dy="0">10</tspan></text><line x1="892" y1="87" x2="892" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="387" x2="892" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">100</tspan></text><line x1="101.24" y1="387" x2="910" y2="387" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 237)">Horas para moverlo (escala logarítmica)</text><text x="505.62" y="433" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="505.62" dy="0">Volumen a mover (TB) (escala logarítmica)</tspan></text><line x1="101.24" y1="244.187" x2="910" y2="244.187" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="107.24" y="238.187" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="107.24" dy="0">1 día</tspan></text><polyline points="119.24,296.691 376.827,236.936 634.413,176.895 892,116.895" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="119.24" cy="296.691" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="119.24" y="285.691" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="119.24" dy="0">3,2</tspan></text><circle cx="376.827" cy="236.936" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="376.827" y="225.936" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="376.827" dy="0">31,7</tspan></text><circle cx="634.413" cy="176.895" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="634.413" y="165.895" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="634.413" dy="0">317,5</tspan></text><circle cx="892" cy="116.895" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="882" y="121.395" font-size="13" text-anchor="end" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="882" dy="0">3 175</tspan></text><polyline points="119.24,358.373 376.827,296.691 634.413,236.936 892,176.895" fill="none" stroke="#087f8c" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="113.74" y="352.873" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="119.24" y="382.373" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="119.24" dy="0">0,3</tspan></text><rect x="371.327" y="291.191" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="376.827" y="320.691" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="376.827" dy="0">3,2</tspan></text><rect x="628.913" y="231.436" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="634.413" y="260.936" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="634.413" dy="0">31,7</tspan></text><rect x="886.5" y="171.395" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="200.895" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">317,5</tspan></text><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Los datos no se mueven tan rápido como el código: 100 TB tardan 13 días incluso a 1 Gbps. Además la luz limita la latencia:</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">8 000 km imponen al menos 80 ms de ida y vuelta por la fibra, 20 ms con 2 000 km. El coste de salida (8, 80, 800 y 8 000</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">unidades) está en la tabla; el precio de 0,08 por GB es una unidad inventada y la eficiencia del 70 % un supuesto.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo sintético con semilla fija; Windows y Ubuntu (WSL2) con cifras idénticas. Los parámetros son supuestos del autor.</tspan></text></svg>
