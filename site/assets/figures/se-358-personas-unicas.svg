<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 659" width="940" height="659" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Personas únicas y grupos distintos según los atributos que se combinan (5 000 personas sintéticas)</title><desc id="d">Barras horizontales con las personas únicas y los grupos distintos de 5 000 personas según los atributos combinados: con solo la edad hay 48 grupos y ninguna persona única; con edad y comuna, 161 únicas; con edad, comuna y año, 3 094; con el curso también, 4 876; generalizar a rangos baja a 2 y a 1 persona única.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="659" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Personas únicas y grupos distintos según los atributos que se combinan (5 000 personas sintéticas)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Personas únicas</tspan></text><rect x="177.1" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="197.1" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="197.1" dy="0">Grupos distintos</tspan></text><line x1="324" y1="77" x2="324" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="461" x2="324" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="434.34" y1="77" x2="434.34" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="434.34" y1="461" x2="434.34" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="434.34" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="434.34" dy="0">1 000</tspan></text><line x1="544.68" y1="77" x2="544.68" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="544.68" y1="461" x2="544.68" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="544.68" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="544.68" dy="0">2 000</tspan></text><line x1="655.02" y1="77" x2="655.02" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="655.02" y1="461" x2="655.02" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="655.02" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="655.02" dy="0">3 000</tspan></text><line x1="765.36" y1="77" x2="765.36" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="765.36" y1="461" x2="765.36" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="765.36" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="765.36" dy="0">4 000</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="461" x2="875.7" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">5 000</tspan></text><line x1="324" y1="461" x2="875.7" y2="461" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="113.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Edad</tspan></text><text x="314" y="177.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Edad + comuna</tspan></text><text x="314" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Edad + comuna + año de ingreso</tspan></text><text x="314" y="305.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Edad + comuna + año + curso</tspan></text><text x="314" y="369.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Edad en rangos de 10 + 6 zonas + año</tspan></text><text x="314" y="425" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Edad en rangos de 20 + 3 zonas + año en</tspan></text><text x="314" y="442" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">bloques de 4</tspan></text><rect x="324" y="83" width="2" height="24.5" rx="3" fill="#c0432f"/><text x="333" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">0</tspan></text><rect x="324" y="110.5" width="5.29632" height="24.5" rx="3" fill="#946512"/><text x="336.296" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="336.296" dy="0">48</tspan></text><rect x="324" y="147" width="17.7647" height="24.5" rx="3" fill="#c0432f"/><text x="348.765" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="348.765" dy="0">161</tspan></text><rect x="324" y="174.5" width="153.152" height="24.5" rx="3" fill="#946512"/><text x="484.152" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="484.152" dy="0">1 388</tspan></text><rect x="324" y="211" width="341.392" height="24.5" rx="3" fill="#c0432f"/><text x="672.392" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="672.392" dy="0">3 094</tspan></text><rect x="324" y="238.5" width="437.939" height="24.5" rx="3" fill="#946512"/><text x="768.939" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="768.939" dy="0">3 969</tspan></text><rect x="324" y="275" width="538.018" height="24.5" rx="3" fill="#c0432f"/><text x="869.018" y="291.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="869.018" dy="0">4 876</tspan></text><rect x="324" y="302.5" width="544.859" height="24.5" rx="3" fill="#946512"/><text x="875.859" y="319.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="875.859" dy="0">4 938</tspan></text><rect x="324" y="339" width="2" height="24.5" rx="3" fill="#c0432f"/><text x="333" y="355.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">2</tspan></text><rect x="324" y="366.5" width="27.3643" height="24.5" rx="3" fill="#946512"/><text x="358.364" y="383.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="358.364" dy="0">248</tspan></text><rect x="324" y="403" width="2" height="24.5" rx="3" fill="#c0432f"/><text x="333" y="419.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">1</tspan></text><rect x="324" y="430.5" width="3.53088" height="24.5" rx="3" fill="#946512"/><text x="334.531" y="447.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="334.531" dy="0">32</tspan></text><text x="599.85" y="505" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="599.85" dy="0">Personas únicas o grupos (de 5 000 personas)</tspan></text><rect x="10" y="519" width="920" height="92.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="543.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Quitar el nombre no anonimiza: combinar tres atributos que parecen inofensivos identifica a 3 094 de 5 000. El grupo más</tspan></text><text x="470" y="560.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">pequeño (k mínimo) es de 90 personas con solo la edad y de 1 en cuanto aparece una persona única. Aparte, con un</tspan></text><text x="470" y="577.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">diccionario de 200 000 correos plausibles, el hash SHA-256 sin clave recuperó 2 000 de 2 000 correos; con HMAC y clave</tspan></text><text x="470" y="593.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">aparte, 0.</tspan></text><text x="470" y="641.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; SQLite 3.45 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
