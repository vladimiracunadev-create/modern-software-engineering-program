r una columna</tspan></text><text x="344" y="221.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">UPDATE sin WHERE</tspan></text><text x="344" y="261.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Crear un índice que bloquea escrituras</tspan></text><text x="344" y="301.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Sin plan de reversión</tspan></text><text x="344" y="341.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Sin tiempo máximo de espera de bloqueo</tspan></text><text x="344" y="381.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Cambiar el tipo de una columna</tspan></text><text x="344" y="421.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Relleno que omite filas (nota &gt; 0)</tspan></text><text x="344" y="461.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Relleno con la columna equivocada</tspan></text><text x="344" y="501.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Relleno antes de crear la columna</tspan></text><text x="344" y="541.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Valor por defecto equivocado</tspan></text><rect x="354" y="84" width="271.284" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="489.642" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="489.642" dy="0">13</tspan></text><rect x="625.284" y="84" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="632.284" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="632.284" dy="0">13</tspan></text><rect x="354" y="124" width="354.756" height="26" fill="#087f8c" stroke="#ff