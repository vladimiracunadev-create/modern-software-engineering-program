chor="middle" font-weight="700" fill="#ffffff"><tspan x="583.548" dy="0">22</tspan></text><text x="820.096" y="461.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="820.096" dy="0">22</tspan></text><rect x="354" y="484" width="0" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="354" y="484" width="229.548" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="468.774" y="501.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="468.774" dy="0">11</tspan></text><text x="590.548" y="501.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="590.548" dy="0">11</tspan></text><rect x="354" y="524" width="0" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="354" y="524" width="187.812" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="447.906" y="541.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="447.906" dy="0">9</tspan></text><text x="548.812" y="541.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="548.812" dy="0">9</tspan></text><text x="614.85" y="601" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="614.85" dy="0">Mutaciones de cada tipo</tspan></text><rect x="10" y="615" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="639.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las cuatro mutaciones que no ve son las que dañan los datos sin romper la sintaxis. Las reglas se escribieron conociendo</tspan></text><text x="470" y="656.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">las mutaciones, así que el 100 % por tipo es optimista. El analizador trabaja sobre texto: no ejecuta nada.</tspan></text><text x="470" y="704.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; SQLite 3.45 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
