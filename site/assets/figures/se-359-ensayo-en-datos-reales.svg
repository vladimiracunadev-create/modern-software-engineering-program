<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 482" width="940" height="482" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Defectos de migración que muestra cada entorno de ensayo (6 migraciones defectuosas, 10 000 filas de origen)</title><desc id="d">Barras con los defectos detectados de seis migraciones defectuosas según el entorno de ensayo: un esquema vacío no detecta ninguno; una muestra de 100 filas detecta tres; una copia completa de 10 000 filas detecta las seis, incluidos los que dependen de pocas filas, como siete correos duplicados o treinta notas en cero.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="482" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Defectos de migración que muestra cada entorno de ensayo (6 migraciones defectuosas, 10 000 filas de origen)</tspan></text><line x1="63.54" y1="307" x2="920" y2="307" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="307" x2="63.54" y2="307" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="311.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">0</tspan></text><line x1="63.54" y1="227" x2="920" y2="227" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="227" x2="63.54" y2="227" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="231.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">2</tspan></text><line x1="63.54" y1="147" x2="920" y2="147" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="147" x2="63.54" y2="147" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="151.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">4</tspan></text><line x1="63.54" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="67" x2="63.54" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">6</tspan></text><line x1="63.54" y1="67" x2="63.54" y2="307" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="187" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 187)">Defectos detectados de 6</text><rect x="92.0887" y="305" width="228.389" height="2" rx="3" fill="#087f8c"/><text x="206.283" y="299" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="206.283" dy="0">0</tspan></text><text x="206.283" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="206.283" dy="0">Esquema vacío</tspan></text><rect x="377.575" y="187" width="228.389" height="120" rx="3" fill="#087f8c"/><text x="491.77" y="181" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="491.77" dy="0">3</tspan></text><text x="491.77" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="491.77" dy="0">Muestra de 100 filas</tspan></text><rect x="663.062" y="67" width="228.389" height="240" rx="3" fill="#087f8c"/><text x="777.257" y="61" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="777.257" dy="0">6</tspan></text><text x="777.257" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777.257" dy="0">Copia completa de 10 000 filas</tspan></text><line x1="63.54" y1="67" x2="920" y2="67" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="916" y="61" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="916" dy="0">6 migraciones defectuosas</tspan></text><rect x="10" y="359" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="383.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Una muestra aleatoria encuentra los defectos frecuentes y no los raros; un ensayo en una copia completa y con invariantes</tspan></text><text x="470" y="400.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">comprobados después encuentra ambos. Los siete duplicados y las treinta notas en cero son construcciones del autor. La</tspan></text><text x="470" y="417.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">tabla de la clase indica qué defecto ve cada entorno.</tspan></text><text x="470" y="464.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; SQLite 3.45 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
