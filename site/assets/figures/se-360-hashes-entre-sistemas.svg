<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 421" width="850" height="421" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">SHA-256 del mismo paquete (12 archivos) construido en Windows y en Ubuntu: primeros 8 caracteres</title><desc id="d">Tabla: construir el mismo paquete de 12 archivos en Windows y en Ubuntu da sumas distintas sin normalizar y también al fijar fechas y orden pero no el sistema que crea el archivo; al fijar además ese campo coinciden, y también coinciden con compresión deflate en los niveles 6 y 9.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="850" height="421" fill="#ffffff"/><rect x="10" y="12" width="424" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="222" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="222" dy="0">Variante de construcción</tspan></text><rect x="440" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="512" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="512" dy="0">Windows 11</tspan></text><rect x="590" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="662" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="662" dy="0">Ubuntu (WSL2)</tspan></text><rect x="740" y="12" width="94" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="787" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="787" dy="0">¿Igual?</tspan></text><rect x="10" y="56" width="424" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Sin normalizar, sin compresión</tspan></text><rect x="440" y="56" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">0bc289f3</tspan></text><rect x="590" y="56" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">740aafa8</tspan></text><rect x="740" y="56" width="94" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">No</tspan></text><rect x="10" y="106" width="424" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Fechas y orden fijos, sin fijar el sistema</tspan></text><rect x="440" y="106" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">cf351096</tspan></text><rect x="590" y="106" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">765d27f7</tspan></text><rect x="740" y="106" width="94" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">No</tspan></text><rect x="10" y="156" width="424" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Además se fija el sistema que crea el archivo</tspan></text><rect x="440" y="156" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">765d27f7</tspan></text><rect x="590" y="156" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">765d27f7</tspan></text><rect x="740" y="156" width="94" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">Sí</tspan></text><rect x="10" y="206" width="424" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Normalizado con deflate, nivel 6</tspan></text><rect x="440" y="206" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">c3d29a42</tspan></text><rect x="590" y="206" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">c3d29a42</tspan></text><rect x="740" y="206" width="94" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">Sí</tspan></text><rect x="10" y="256" width="424" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Normalizado con deflate, nivel 9</tspan></text><rect x="440" y="256" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">c3d29a42</tspan></text><rect x="590" y="256" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">c3d29a42</tspan></text><rect x="740" y="256" width="94" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">Sí</tspan></text><rect x="10" y="310" width="830" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="425" y="334.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="425" dy="0">El campo «versión creada por» del formato ZIP dice 0 en Windows y 3 en Linux: un detalle invisible que cambia</tspan></text><text x="425" y="351.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="425" dy="0">la suma. Con zlib 1.3.1 y 1.3 la compresión dio bytes idénticos para este contenido; no se garantiza con otro</tspan></text><text x="425" y="368.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="425" dy="0">contenido ni otra versión de zlib. El paquete se generó con semilla, no con archivos del repositorio.</tspan></text><text x="425" y="407.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="425" dy="0">Modelo sintético con semilla fija; Windows y Ubuntu (WSL2) con cifras idénticas. Los parámetros son supuestos del autor.</tspan></text></svg>
