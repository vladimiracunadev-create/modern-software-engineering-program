<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 495" width="890" height="495" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué clases de fallo puede ver cada nivel de prueba (matriz del autor, costo por ejecución en minutos)</title><desc id="d">Tabla: seis niveles de prueba con su costo supuesto por ejecución y las clases de fallo que pueden ver; ninguno cubre las ocho clases, las unitarias cubren dos y el conjunto más barato que cubre las ocho (unitaria, contrato, extremo a extremo y carga) cuesta 91,1 minutos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="890" height="495" fill="#ffffff"/><rect x="10" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="107" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="107" dy="0">Nivel</tspan></text><rect x="210" y="12" width="94" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="257" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="257" dy="0">Minutos</tspan></text><rect x="310" y="12" width="454" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="537" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="537" dy="0">Clases de fallo que puede ver</tspan></text><rect x="770" y="12" width="104" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="822" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="822" dy="0">Cubre</tspan></text><