" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="191.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">Integración</tspan></text><rect x="210" y="164" width="94" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="257" dy="0">2</tspan></text><rect x="310" y="164" width="454" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">frontera de datos, contrato, configuración</tspan></text><rect x="770" y="164" width="104" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">3 de 8</tspan></text><rect x="10" y="218" width="194" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="245.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">De extremo a extremo</tspan></text><rect x="210" y="218" width="94" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="257" dy="0">30</tspan></text><rect x="310" y="218" width="454" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">configuración, recorrido de usuario, accesibilidad</tspan></text><rect x="770" y="218" width="104" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">3 de 8</tspan></text><rect x="10" y="272" width="194" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="299.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">Exploratoria</tspan></text><rect x="210" y="272" width="94" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="299.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="257" dy="0">45</tspan></text><rect x="310" y="272" width="454" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="299.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">recorrido de usuario, accesibilidad, concurrencia</tspan></text><rect x="770" y="272" width="104" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="299.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">3 de 8</tspan></text><rect x="10" y="326" width="194" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="353.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">De carga</tspan></text><rect x="210" y="326" width="94" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="353.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="257" dy="0">60</tspan></text><rect x="310" y="326" width="454" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="353.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">concurrencia, rendimiento</tspan></text><rect x="770" y="326" width="104" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="353.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">2 de 8</tspan></text><rect x="10" y="384" width="870" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="445" y="408.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="445" dy="0">El conjunto más barato que cubre las ocho clases combina unitaria, contrato, extremo a extremo y carga (91,1</tspan></text><text x="445" y="425.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="445" dy="0">minutos). Sumar unitaria, integración y contrato cubre solo cuatro clases: ninguna cantidad de pruebas rápidas ve</tspan></text><text x="445" y="442.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="445" dy="0">concurrencia, rendimiento, accesibilidad ni el recorrido del usuario. La matriz es un supuesto del autor.</tspan></text><text x="445" y="481.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="445" dy="0">Datos sintéticos y modelos del autor con semilla fija; Windows (CPython 3.12.9) y Ubuntu (WSL2, 3.12.3) con cifras idénticas.</tspan></text></svg>
