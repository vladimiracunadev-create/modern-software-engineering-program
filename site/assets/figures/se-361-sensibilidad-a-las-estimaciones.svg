<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 573" width="940" height="573" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Pérdida real frente a la del plan óptimo cuando las estimaciones se equivocan hasta un factor 2 (5 000 realidades)</title><desc id="d">Intervalos con la mediana, el percentil 90 y el máximo de la razón entre la pérdida del plan y la del óptimo para cuatro estrategias: el reparto por probabilidad por impacto y el marginal quedan entre 1,10 y 1,46 veces el óptimo, el uniforme llega a 1,955 y el proporcional al tamaño a 2,382.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="573" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Pérdida real frente a la del plan óptimo cuando las estimaciones se equivocan hasta un factor 2 (5 000</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">realidades)</tspan></text><rect x="16" y="64" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">mediana</tspan></text><polygon points="122.78,63.1 129.38,75.4 116.18,75.4" fill="#946512" stroke="#946512" stroke-width="2"/><text x="136.78" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="136.78" dy="0">p90</tspan></text><polygon points="193.4,62.5 200.9,70 193.4,77.5 185.9,70" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="207.4" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="207.4" dy="0">máx</tspan></text><line x1="304" y1="96" x2="304" y2="392" stroke="#d5dde1" stroke-width="1"/><line x1="304" y1="392" x2="304" y2="397" stroke="#5b7280" stroke-width="1.4"/><text x="304" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="304" dy="0">0</tspan></text><line x1="421.2" y1="96" x2="421.2" y2="392" stroke="#d5dde1" stroke-width="1"/><line x1="421.2" y1="392" x2="421.2" y2="397" stroke="#5b7280" stroke-width="1.4"/><text x="421.2" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="421.2" dy="0">0,5</tspan></text><line x1="538.4" y1="96" x2="538.4" y2="392" stroke="#d5dde1" stroke-width="1"/><line x1="538.4" y1="392" x2="538.4" y2="397" stroke="#5b7280" stroke-width="1.4"/><text x="538.4" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="538.4" dy="0">1</tspan></text><line x1="655.6" y1="96" x2="655.6" y2="392" stroke="#d5dde1" stroke-width="1"/><line x1="655.6" y1="392" x2="655.6" y2="397" stroke="#5b7280" stroke-width="1.4"/><text x="655.6" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="655.6" dy="0">1,5</tspan></text><line x1="772.8" y1="96" x2="772.8" y2="392" stroke="#d5dde1" stroke-width="1"/><line x1="772.8" y1="392" x2="772.8" y2="397" stroke="#5b7280" stroke-width="1.4"/><text x="772.8" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772.8" dy="0">2</tspan></text><line x1="890" y1="96" x2="890" y2="392" stroke="#d5dde1" stroke-width="1"/><line x1="890" y1="392" x2="890" y2="397" stroke="#5b7280" stroke-width="1.4"/><text x="890" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="890" dy="0">2,5</tspan></text><line x1="304" y1="392" x2="890" y2="392" stroke="#5b7280" stroke-width="1.6"/><text x="274" y="137.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="274" dy="0">Uniforme</tspan></text><text x="274" y="211.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="274" dy="0">Proporcional al tamaño</tspan></text><text x="274" y="277" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="274" dy="0">Proporcional a probabilidad ×</tspan></text><text x="274" y="294" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="274" dy="0">impacto</tspan></text><text x="274" y="359.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="274" dy="0">Marginal con las estimaciones</tspan></text><line x1="601.922" y1="133" x2="762.252" y2="133" stroke="#8a9aa3" stroke-width="5"/><rect x="594.922" y="126" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="601.922" y="117" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="601.922" dy="0">1,271</tspan></text><polygon points="645.052,124.95 652.752,139.3 637.352,139.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="645.052" y="162" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="645.052" dy="0">1,455</tspan></text><polygon points="762.252,124.25 771.002,133 762.252,141.75 753.502,133" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="762.252" y="117" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="762.252" dy="0">1,955</tspan></text><line x1="641.77" y1="207" x2="862.341" y2="207" stroke="#8a9aa3" stroke-width="5"/><rect x="634.77" y="200" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="641.77" y="191" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="641.77" dy="0">1,441</tspan></text><polygon points="710.684,198.95 718.384,213.3 702.984,213.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="710.684" y="236" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="710.684" dy="0">1,735</tspan></text><polygon points="862.341,198.25 871.091,207 862.341,215.75 853.591,207" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="862.341" y="191" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="862.341" dy="0">2,382</tspan></text><line x1="568.403" y1="281" x2="646.224" y2="281" stroke="#8a9aa3" stroke-width="5"/><rect x="561.403" y="274" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="568.403" y="265" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="568.403" dy="0">1,128</tspan></text><polygon points="588.093,272.95 595.793,287.3 580.393,287.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="588.093" y="310" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="588.093" dy="0">1,212</tspan></text><polygon points="646.224,272.25 654.974,281 646.224,289.75 637.474,281" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="646.224" y="265" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="646.224" dy="0">1,460</tspan></text><line x1="562.074" y1="355" x2="631.222" y2="355" stroke="#8a9aa3" stroke-width="5"/><rect x="555.074" y="348" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="562.074" y="339" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="562.074" dy="0">1,101</tspan></text><polygon points="580.123,346.95 587.823,361.3 572.423,361.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="580.123" y="384" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="580.123" dy="0">1,178</tspan></text><polygon points="631.222,346.25 639.972,355 631.222,363.75 622.472,355" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="631.222" y="339" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="631.222" dy="0">1,396</tspan></text><text x="597" y="436" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="597" dy="0">veces la pérdida del plan óptimo (1 = el óptimo de esa realidad)</tspan></text><rect x="10" y="450" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="474.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Equivocarse por un factor 2 en cada estimación no invalida el reparto por riesgo: gana al uniforme en el 97,2 % de las 5</tspan></text><text x="470" y="491.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">000 realidades. Lo que sí cambia es el ranking: el trío de componentes más arriesgados difiere del estimado en el 74,2 % de</tspan></text><text x="470" y="508.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">ellas. El plan es una hipótesis que se revisa, no un resultado.</tspan></text><text x="470" y="555.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos y modelos del autor con semilla fija; Windows (CPython 3.12.9) y Ubuntu (WSL2, 3.12.3) con cifras idénticas.</tspan></text></svg>
