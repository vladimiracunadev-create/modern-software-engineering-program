<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 472" width="940" height="472" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Efecto de las reentregas de un sistema de entrega al menos una vez sobre el conteo por hora</title><desc id="d">Barras con el error en el conteo de eventos por hora como porcentaje del total, sobre 10221 entregas de 10000 eventos únicos: contar entregas infla un 2,21 por ciento, contar eventos únicos por clave deja 0, y el 2,21 por ciento es el mismo número de reentregas, 221, sobre 10000.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="472" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Efecto de las reentregas de un sistema de entrega al menos una vez sobre el conteo por hora</tspan></text><line x1="78.62" y1="297" x2="920" y2="297" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="297" x2="78.62" y2="297" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="301.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="251" x2="920" y2="251" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="251" x2="78.62" y2="251" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="255.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,5</tspan></text><line x1="78.62" y1="205" x2="920" y2="205" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="205" x2="78.62" y2="205" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="209.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">1</tspan></text><line x1="78.62" y1="159" x2="920" y2="159" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="159" x2="78.62" y2="159" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="163.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">1,5</tspan></text><line x1="78.62" y1="113" x2="920" y2="113" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="113" x2="78.62" y2="113" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="117.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">2</tspan></text><line x1="78.62" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="67" x2="78.62" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">2,5</tspan></text><line x1="78.62" y1="67" x2="78.62" y2="297" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="182" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 182)">Error del conteo (% del total)</text><rect x="120.689" y="93.68" width="336.552" height="203.32" rx="3" fill="#c0432f"/><text x="288.965" y="87.68" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="288.965" dy="0">2,21</tspan></text><text x="288.965" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="288.965" dy="0">Contar entregas (10 221)</tspan></text><rect x="541.379" y="295" width="336.552" height="2" rx="3" fill="#c0432f"/><text x="709.655" y="289" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="709.655" dy="0">0,00</tspan></text><text x="709.655" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="709.655" dy="0">Contar eventos únicos por clave (10 000)</tspan></text><rect x="10" y="349" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="373.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La entrega al menos una vez reenvía lo que no se confirmó; el 2,2 % de reentregas inventado por el autor se vuelve un 2,21</tspan></text><text x="470" y="390.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">% de error cuando se cuentan entregas. Escribir por clave (la misma clave, el mismo resultado) vuelve inofensiva la</tspan></text><text x="470" y="407.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">reentrega: las 221 reentregas no cambian nada.</tspan></text><text x="470" y="454.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 45; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
