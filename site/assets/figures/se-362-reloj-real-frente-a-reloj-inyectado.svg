<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 311" width="940" height="311" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una prueba de plazos con el reloj real y con el reloj como parámetro</title><desc id="d">Tabla: una prueba que construye el plazo con el reloj real y comprueba un segundo después falla en 173 de 10 000 ejecuciones simuladas por pausas ocasionales; la misma lógica con la hora inyectada prueba sin azar las cinco fronteras del plazo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="311" fill="#ffffff"/><rect x="10" y="12" width="474" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="247" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="247" dy="0">Variante de la prueba</tspan></text><rect x="490" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="602" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="602" dy="0">Fallos</tspan></text><rect x="720" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="822" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="822" dy="0">Origen</tspan></text><rect x="10" y="56" width="474" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="91.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">Reloj real, margen de 1 s entre construir el plazo y comprobar</tspan></text><rect x="490" y="56" width="224" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="91.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">173 de 10 000 (1,73 %)</tspan></text><rect x="720" y="56" width="204" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="83.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">Depende de pausas del</tspan></text><text x="822" y="99.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">equipo</tspan></text><rect x="10" y="126" width="474" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="153.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">Reloj inyectado, 5 casos de frontera (−1 s, 0, +1 s, +24 h, +24 h 1</tspan></text><text x="247" y="169.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">s)</tspan></text><rect x="490" y="126" width="224" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="161.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">0 de 10 000</tspan></text><rect x="720" y="126" width="204" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="153.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">Determinista por</tspan></text><text x="822" y="169.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">construcción</tspan></text><rect x="10" y="200" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="224.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El 1,73 % viene de un modelo del autor (3 de cada 100 ejecuciones sufren una pausa de 0,5 a 3 s), no de una medición del</tspan></text><text x="470" y="241.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">equipo. La lección es el mecanismo: una prueba que depende de cuánto tarda la máquina falla a veces sin que haya un</tspan></text><text x="470" y="258.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">defecto, y con la hora inyectada la hora deja de ser una variable.</tspan></text><text x="470" y="297.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos y modelos del autor con semilla fija; Windows (CPython 3.12.9) y Ubuntu (WSL2, 3.12.3) con cifras idénticas.</tspan></text></svg>
