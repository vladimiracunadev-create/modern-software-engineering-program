 x="620" y="350" width="119" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="679.5" y="371.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="679.5" dy="0">No</tspan></text><rect x="745" y="350" width="164" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="371.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">No</tspan></text><rect x="10" y="396" width="905" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="462.5" y="420.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="462.5" dy="0">El contrato no detecta el orden invertido porque no lo declara, y la prueba contra la respuesta real lo ve porque el</tspan></text><text x="462.5" y="437.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="462.5" dy="0">panel espera un orden. Un contrato solo protege lo que afirma. Los ocho cambios son construcciones del autor sobre una</tspan></text><text x="462.5" y="454.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="462.5" dy="0">respuesta JSON y una base SQLite en memoria.</tspan></text><text x="462.5" y="493.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="462.5" dy="0">Datos sintéticos y modelos del autor con semilla fija; Windows (CPython 3.12.9) y Ubuntu (WSL2, 3.12.3) con cifras idénticas.</tspan></text></svg>
