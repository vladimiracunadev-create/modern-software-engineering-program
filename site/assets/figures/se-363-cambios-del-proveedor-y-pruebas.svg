<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 567" width="940" height="567" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuántos de los seis cambios que rompen al panel detecta cada prueba (de ocho cambios del proveedor)</title><desc id="d">Barras agrupadas: de ocho cambios del proveedor, seis rompen al panel; el doble escrito a mano no detecta ninguno, el contrato del consumidor cinco, la prueba contra la respuesta real los seis y la comparación del esquema completo uno, con una falsa alarma por el campo extra.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="567" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuántos de los seis cambios que rompen al panel detecta cada prueba (de ocho cambios del proveedor)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Cambios que rompen y la prueba detecta</tspan></text><rect x="350.52" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="370.52" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="370.52" dy="0">Falsa alarma</tspan></text><line x1="63.54" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="375" x2="63.54" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">0</tspan></text><line x1="63.54" y1="305" x2="920" y2="305" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="305" x2="63.54" y2="305" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="309.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">2</tspan></text><line x1="63.54" y1="235" x2="920" y2="235" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="235" x2="63.54" y2="235" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="239.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">4</tspan></text><line x1="63.54" y1="165" x2="920" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="165" x2="63.54" y2="165" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="169.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">6</tspan></text><line x1="63.54" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="95" x2="63.54" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">8</tspan></text><line x1="63.54" y1="95" x2="63.54" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">cambios del proveedor (de 8)</text><rect x="84.9515" y="373" width="83.646" height="2" rx="3" fill="#087f8c"/><text x="126.774" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="126.774" dy="0">0</tspan></text><rect x="172.597" y="373" width="83.646" height="2" rx="3" fill="#c0432f"/><text x="214.421" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="214.421" dy="0">0</tspan></text><text x="170.597" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="170.597" dy="0">Doble escrito a mano</tspan></text><rect x="299.067" y="200" width="83.646" height="175" rx="3" fill="#087f8c"/><text x="340.889" y="194" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="340.889" dy="0">5</tspan></text><rect x="386.713" y="373" width="83.646" height="2" rx="3" fill="#c0432f"/><text x="428.536" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="428.536" dy="0">0</tspan></text><text x="384.713" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="384.713" dy="0">Contrato del consumidor</tspan></text><rect x="513.182" y="165" width="83.646" height="210" rx="3" fill="#087f8c"/><text x="555.005" y="159" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="555.005" dy="0">6</tspan></text><rect x="600.828" y="373" width="83.646" height="2" rx="3" fill="#c0432f"/><text x="642.651" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="642.651" dy="0">0</tspan></text><text x="598.828" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="598.828" dy="0">Prueba contra la respuesta</tspan></text><text x="598.828" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="598.828" dy="0">real</tspan></text><rect x="727.296" y="340" width="83.646" height="35" rx="3" fill="#087f8c"/><text x="769.119" y="334" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="769.119" dy="0">1</tspan></text><rect x="814.942" y="340" width="83.646" height="35" rx="3" fill="#c0432f"/><text x="856.765" y="334" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="856.765" dy="0">1</tspan></text><text x="812.942" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812.942" dy="0">Esquema completo</tspan></text><line x1="63.54" y1="165" x2="920" y2="165" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="916" y="159" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="916" dy="0">6 cambios rompen al panel</tspan></text><rect x="10" y="444" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="468.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">El contrato no detecta el orden invertido porque no lo declara, y la prueba contra la respuesta real lo ve porque el panel</tspan></text><text x="470" y="485.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">espera un orden. Un contrato solo protege lo que afirma. Los ocho cambios son construcciones del autor sobre una respuesta</tspan></text><text x="470" y="502.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">JSON y una base SQLite en memoria.</tspan></text><text x="470" y="549.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos y modelos del autor con semilla fija; Windows (CPython 3.12.9) y Ubuntu (WSL2, 3.12.3) con cifras idénticas.</tspan></text></svg>
