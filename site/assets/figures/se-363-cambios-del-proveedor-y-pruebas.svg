<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 925 507" width="925" height="507" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ocho cambios del proveedor frente a cuatro pruebas del consumidor</title><desc id="d">Tabla: de ocho cambios, seis rompen al panel; el doble escrito a mano no detecta ninguno, el contrato del consumidor detecta cinco, la prueba contra la respuesta real detecta los seis y la comparación del esquema completo detecta uno y da una falsa alarma con el campo extra.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="925" height="507" fill="#ffffff"/><rect x="10" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="157" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="157" dy="0">Cambio del proveedor</tspan></text><rect x="310" y="12" width="99" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="359.5" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="359.5" dy="0">¿Rompe el</tspan></text><text x="359.5" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="359.5" dy="0">panel?</tspan></text><rect x="415" y="12" width="94" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="462" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="462" dy="0">Doble fijo</tspan></text><rect x="515" y="12" width="99" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="564.5" y="34.64" fon