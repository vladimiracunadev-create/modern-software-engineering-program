<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 550" width="940" height="550" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Instantánea del HTML frente a aserciones semánticas, sobre 7 cambios benignos y 9 defectos</title><desc id="d">Barras agrupadas: la instantánea exacta da alarma en los siete cambios benignos y detecta los nueve defectos; las aserciones semánticas no dan alarma en ninguno de los benignos y detectan seis de nueve, sin ver el botón deshabilitado, la lista oculta ni el texto con el color del fondo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="550" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Instantánea del HTML frente a aserciones semánticas, sobre 7 cambios benignos y 9 defectos</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Instantánea exacta</tspan></text><rect x="199.72" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="219.72" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="219.72" dy="0">Aserciones semánticas</tspan></text><line x1="63.54" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="375" x2="63.54" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">0</tspan></text><line x1="63.54" y1="281.667" x2="920" y2="281.667" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="281.667" x2="63.54" y2="281.667" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="286.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">3</tspan></text><line x1="63.54" y1="188.333" x2="920" y2="188.333" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="188.333" x2="63.54" y2="188.333" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="192.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">6</tspan></text><line x1="63.54" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="95" x2="63.54" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">9</tspan></text><line x1="63.54" y1="95" x2="63.54" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">cambios o defectos</text><rect x="106.363" y="157.222" width="169.292" height="217.778" rx="3" fill="#946512"/><text x="191.009" y="151.222" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="191.009" dy="0">7</tspan></text><rect x="279.655" y="373" width="169.292" height="2" rx="3" fill="#087f8c"/><text x="364.301" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="364.301" dy="0">0</tspan></text><text x="277.655" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="277.655" dy="0">Falsas alarmas (de 7 cambios benignos)</tspan></text><rect x="534.593" y="95" width="169.292" height="280" rx="3" fill="#946512"/><text x="619.239" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="619.239" dy="0">9</tspan></text><rect x="707.885" y="188.333" width="169.292" height="186.667" rx="3" fill="#087f8c"/><text x="792.531" y="182.333" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="792.531" dy="0">6</tspan></text><text x="705.885" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705.885" dy="0">Defectos detectados (de 9)</tspan></text><rect x="10" y="427" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Si el equipo aprueba cada diferencia de la instantánea sin leerla, acepta los nueve defectos con la misma facilidad que los</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">siete cambios benignos. Las aserciones semánticas no ven lo que está en atributos de estilo. Hace falta una comprobación de</tspan></text><text x="470" y="485.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">lo visual aparte; esta figura no la mide.</tspan></text><text x="470" y="532.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos y modelos del autor con semilla fija; Windows (CPython 3.12.9) y Ubuntu (WSL2, 3.12.3) con cifras idénticas.</tspan></text></svg>
