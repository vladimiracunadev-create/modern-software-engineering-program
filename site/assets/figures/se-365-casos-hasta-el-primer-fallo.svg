<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 441" width="970" height="441" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cinco versiones de «repartir n entregas entre k correctores» frente a cinco ejemplos y a cuatro propiedades</title><desc id="d">Tabla: cinco ejemplos escritos a mano detectan solo una de las cuatro versiones defectuosas; las propiedades con generador uniforme detectan las cuatro, una de ellas solo en 87 de 100 semillas, y un generador con 30 por ciento de casos cerca de la frontera la detecta en las 100.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="441" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Versión</tspan></text><rect x="340" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="397" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="397" dy="0">5 ejemplos</tspan></text><rect x="460" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="582" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="582" dy="0">Propiedades, generador</tspan></text><text x="582" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="582" dy="0">uniforme</tspan></text><rect x="710" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="832" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="832" dy="0">Con 30 % de casos cerca de la</tspan></text><text x="832" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="832" dy="0">frontera</tspan></text><rect x="10" y="56" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="83.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Correcto</tspan></text><rect x="340" y="56" width="114" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="83.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">no detecta</tspan></text><rect x="460" y="56" width="244" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="83.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">0 de 100</tspan></text><rect x="710" y="56" width="244" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="83.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">0 de 100 (sin falsas alarmas)</tspan></text><rect x="10" y="110" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="137.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Olvida el resto</tspan></text><rect x="340" y="110" width="114" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="137.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">detecta</tspan></text><rect x="460" y="110" width="244" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="137.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">100 de 100 (mediana 1)</tspan></text><rect x="710" y="110" width="244" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="137.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">100 de 100</tspan></text><rect x="10" y="164" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="191.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Resto al último corrector</tspan></text><rect x="340" y="164" width="114" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">no detecta</tspan></text><rect x="460" y="164" width="244" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">100 de 100 (mediana 1)</tspan></text><rect x="710" y="164" width="244" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">100 de 100</tspan></text><rect x="10" y="218" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="237.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Falla solo si hay menos entregas que</tspan></text><text x="172" y="253.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">correctores</tspan></text><rect x="340" y="218" width="114" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="245.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">no detecta</tspan></text><rect x="460" y="218" width="244" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="245.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">87 de 100 (mediana 66)</tspan></text><rect x="710" y="218" width="244" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="245.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">100 de 100</tspan></text><rect x="10" y="272" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="299.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Pierde una entrega si n ≥ 500</tspan></text><rect x="340" y="272" width="114" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="299.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">no detecta</tspan></text><rect x="460" y="272" width="244" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="299.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">100 de 100 (mediana 4)</tspan></text><rect x="710" y="272" width="244" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="299.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">100 de 100</tspan></text><rect x="10" y="330" width="950" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="485" y="354.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="485" dy="0">Las propiedades son longitud igual a k, suma igual a n, diferencia máxima de 1 y ninguna cantidad negativa. El defecto que solo</tspan></text><text x="485" y="371.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="485" dy="0">ocurre con n &lt; k aparece en el 1 % de los casos uniformes y por eso necesita más casos: la calidad del generador es parte de la</tspan></text><text x="485" y="388.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="485" dy="0">prueba. Cada celda es el resultado de 100 semillas.</tspan></text><text x="485" y="427.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Datos sintéticos y modelos del autor con semilla fija; Windows (CPython 3.12.9) y Ubuntu (WSL2, 3.12.3) con cifras idénticas.</tspan></text></svg>
