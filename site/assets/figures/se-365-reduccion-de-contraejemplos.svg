<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 307" width="980" height="307" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reducción (shrinking) de contraejemplos: 100 listas de nombres y 106 secuencias de operaciones</title><desc id="d">Barras: un contraejemplo de una lista de nombres pasa de 155,3 caracteres a 20,9 tras reducirlo; una secuencia fallida de 40 operaciones sobre una cola pasa a 9,7 operaciones de media, entre 9 y 12.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="307" fill="#ffffff"/><text x="360" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Contraejemplo sin reducir (caracteres)</tspan></text><rect x="370" y="16" width="465.9" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="843.9" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="843.9" dy="0">155,3 de media</tspan></text><text x="360" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Contraejemplo reducido (caracteres)</tspan></text><rect x="370" y="60" width="62.7" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="440.7" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="440.7" dy="0">20,9 de media</tspan></text><text x="360" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Secuencia de 40 operaciones sin reducir</tspan></text><rect x="370" y="104" width="120" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="498" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="498" dy="0">40</tspan></text><text x="360" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="360" dy="0">Secuencia reducida (operaciones)</tspan></text><rect x="370" y="148" width="29.1" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="407.1" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="407.1" dy="0">9,7 de media (9 a 12)</tspan></text><rect x="10" y="196" width="960" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="490" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">El tamaño mínimo de la lista (unos 21 caracteres) viene del defecto: truncar a 20 solo aparece si el nombre tiene más de 20. La</tspan></text><text x="490" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">secuencia mínima de 9 operaciones es el estado que la cola necesita para llegar a la compactación defectuosa. Sin reducir, el</tspan></text><text x="490" y="254.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">contraejemplo es un ruido que nadie diagnostica.</tspan></text><text x="490" y="293.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Datos sintéticos y modelos del autor con semilla fija; Windows (CPython 3.12.9) y Ubuntu (WSL2, 3.12.3) con cifras idénticas.</tspan></text></svg>
