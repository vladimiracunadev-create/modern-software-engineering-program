<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 495" width="960" height="495" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Renombrar la columna fee_cents a amount_cents: lo que ve cada lector en cada paso</title><desc id="d">Cuatro pasos medidos en SQLite con un lector viejo que suma fee_cents y uno nuevo que suma amount_cents: al inicio el viejo lee 14950 y el nuevo falla; al añadir la columna nueva el viejo sigue leyendo 14950 y el nuevo devuelve nulo sin error; al escribir en las dos y rellenar, ambos leen 14950; al quitar la columna vieja el viejo falla.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="495" fill="#ffffff"/><rect x="10" y="14" width="290" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="155" y="55.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="155" dy="0">Inicial: solo existe fee_cents</tspan></text><rect x="336" y="14" width="270" height="76" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="471" y="55.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="471" dy="0">Viejo 14 950 · Nuevo ERROR</tspan></text><rect x="642" y="14" width="308" height="76" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="796" y="55.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="796" dy="0">El lector nuevo aún no tiene dónde leer</tspan></text><polyline points="300,52 336,52" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="606,52 642,52" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="108" width="290" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="155" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="155" dy="0">1. Expandir: añadir amount_cents</tspan></text><rect x="336" y="108" width="270" height="76" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="471" y="141.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="471" dy="0">Viejo 14 950 · Nuevo NULO sin</tspan></text><text x="471" y="157.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="471" dy="0">error</tspan></text><rect x="642" y="108" width="308" height="76" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="796" y="141.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="796" dy="0">El peligro: el nuevo lee una columna</tspan></text><text x="796" y="157.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="796" dy="0">vacía y no falla</tspan></text><polyline points="300,146 336,146" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="606,146 642,146" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="202" width="290" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="155" y="235.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="155" dy="0">2. Escribir en las dos y rellenar lo</tspan></text><text x="155" y="251.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="155" dy="0">antiguo</tspan></text><rect x="336" y="202" width="270" height="76" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="471" y="243.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="471" dy="0">Viejo 14 950 · Nuevo 14 950</tspan></text><rect x="642" y="202" width="308" height="76" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="796" y="235.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="796" dy="0">Ventana segura: los dos lectores</tspan></text><text x="796" y="251.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="796" dy="0">coinciden</tspan></text><polyline points="300,240 336,240" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="606,240 642,240" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="296" width="290" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="155" y="337.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="155" dy="0">3. Contraer: quitar fee_cents</tspan></text><rect x="336" y="296" width="270" height="76" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="471" y="337.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="471" dy="0">Viejo ERROR · Nuevo 14 950</tspan></text><rect x="642" y="296" width="308" height="76" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="796" y="329.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="796" dy="0">Solo es seguro cuando el viejo ya no</tspan></text><text x="796" y="345.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="796" dy="0">existe</tspan></text><polyline points="300,334 336,334" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="606,334 642,334" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="386" width="940" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="410.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Un RENAME COLUMN de golpe rompe al lector viejo al instante. Expandir y contraer reparte el cambio en pasos que cada lector</tspan></text><text x="480" y="427.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">sobrevive, y exige un paso que el renombre no tiene: comprobar que nadie lee la columna vieja antes de quitarla. El paso 1</tspan></text><text x="480" y="444.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">muestra que «sin error» no es «correcto».</tspan></text><text x="480" y="485.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9 y SQLite 3.45.3; los recuentos se repiten y los tiempos varían de un equipo a otro.</tspan></text></svg>
