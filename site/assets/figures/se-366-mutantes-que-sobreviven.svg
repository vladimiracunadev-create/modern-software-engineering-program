<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 434" width="940" height="434" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Los casos que le faltan a la batería B: cuatro caen justo sobre un límite de la nota</title><desc id="d">Recta de la nota de 0,5 a 7,5 con la zona aceptada entre 1,0 y 7,0 y cuatro casos que matan mutantes de los límites y que la batería B no usa: 0,9 y 7,1 deben rechazarse; 1,0 y 7,0 deben aceptarse. Debajo, los otros dos casos que faltan: una anulada con nota entre válidas y un promedio de tres notas como 5,33.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="434" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Los casos que le faltan a la batería B: cuatro caen justo sobre un límite de la nota</tspan></text><rect x="118.571" y="119" width="702.857" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="144.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="470" dy="0">Nota aceptada: de 1,0 a 7,0</tspan></text><line x1="60" y1="167" x2="60" y2="175" stroke="#5b7280" stroke-width="1.4"/><text x="60" y="193" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="60" dy="0">0,5</tspan></text><line x1="118.571" y1="167" x2="118.571" y2="175" stroke="#5b7280" stroke-width="1.4"/><text x="118.571" y="193" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="118.571" dy="0">1</tspan></text><line x1="235.714" y1="167" x2="235.714" y2="175" stroke="#5b7280" stroke-width="1.4"/><text x="235.714" y="193" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="235.714" dy="0">2</tspan></text><line x1="352.857" y1="167" x2="352.857" y2="175" stroke="#5b7280" stroke-width="1.4"/><text x="352.857" y="193" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="352.857" dy="0">3</tspan></text><line x1="470" y1="167" x2="470" y2="175" stroke="#5b7280" stroke-width="1.4"/><text x="470" y="193" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="470" dy="0">4</tspan></text><line x1="587.143" y1="167" x2="587.143" y2="175" stroke="#5b7280" stroke-width="1.4"/><text x="587.143" y="193" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="587.143" dy="0">5</tspan></text><line x1="704.286" y1="167" x2="704.286" y2="175" stroke="#5b7280" stroke-width="1.4"/><text x="704.286" y="193" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="704.286" dy="0">6</tspan></text><line x1="821.429" y1="167" x2="821.429" y2="175" stroke="#5b7280" stroke-width="1.4"/><text x="821.429" y="193" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="821.429" dy="0">7</tspan></text><line x1="60" y1="167" x2="880" y2="167" stroke="#5b7280" stroke-width="1.4"/><text x="470" y="213" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="470" dy="0">Nota ingresada</tspan></text><rect x="10" y="47" width="175" height="36" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="97.5" y="68.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="97.5" dy="0">0,9 debe rechazarse</tspan></text><polyline points="98,83 106.857,119" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="195" y="47" width="175" height="36" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="282.5" y="68.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="282.5" dy="0">1,0 debe aceptarse</tspan></text><polyline points="283,83 118.571,119" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="560" y="47" width="175" height="36" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="647.5" y="68.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="647.5" dy="0">7,0 debe aceptarse</tspan></text><polyline points="648,83 821.429,119" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="745" y="47" width="175" height="36" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="832.5" y="68.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="832.5" dy="0">7,1 debe rechazarse</tspan></text><polyline points="833,83 833.143,119" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="60" y="237" width="400" height="56" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="260" y="260.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="260" dy="0">Anulada con nota 2,0 entre entradas válidas (mata</tspan></text><text x="260" y="276.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="260" dy="0">«and» por «or» al excluir anuladas)</tspan></text><rect x="480" y="237" width="400" height="56" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="680" y="260.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="680" dy="0">Promedio de tres notas, como 5,33 (mata el cambio de</tspan></text><text x="680" y="276.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="680" dy="0">redondeo de 1 a 2 decimales)</tspan></text><rect x="10" y="311" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="335.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Un mutante superviviente es una pregunta, no un veredicto: o falta un caso o el mutante es equivalente y no hay nada que</tspan></text><text x="470" y="352.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">probar. Aquí ninguno es equivalente, de modo que cada uno señala una prueba concreta que falta; los dos del límite inferior</tspan></text><text x="470" y="369.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">cuentan como una misma causa. La tabla de la clase da la causa de cada superviviente.</tspan></text><text x="470" y="416.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos y modelos del autor con semilla fija; Windows (CPython 3.12.9) y Ubuntu (WSL2, 3.12.3) con cifras idénticas.</tspan></text></svg>
