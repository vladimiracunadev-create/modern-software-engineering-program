<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 471" width="910" height="471" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un mismo script en 12 procesos: qué cambia con la semilla de hash y con el sistema</title><desc id="d">Tabla: el orden de un conjunto de cadenas cambia con la semilla de hash en 11 de 12 procesos en ambos sistemas; el separador de rutas, la codificación por defecto y los bytes de un archivo de texto difieren entre Windows y Ubuntu; forzar UTF-8 corrige la codificación y no el salto de línea.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="910" height="471" fill="#ffffff"/><rect x="10" y="12" width="424" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="222" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="222" dy="0">Comportamiento</tspan></text><rect x="440" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="552" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="552" dy="0">Windows 11 (3.12.9)</tspan></text><rect x="670" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="782" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="782" dy="0">Ubuntu en WSL2 (3.12.3)</tspan></text><rect x="10" y="56" width="424" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="81.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Orden de un conjunto de cadenas (12 semillas de hash)</tspan></text><rect x="440" y="56" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">11 resultados distintos</tspan></text><rect x="670" y="56" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">11 resultados distintos</tspan></text><rect x="10" y="106" width="424" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="131.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Separador de rutas</tspan></text><rect x="440" y="106" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">\</tspan></text><rect x="670" y="106" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">/</tspan></text><rect x="10" y="156" width="424" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="181.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Codificación por defecto al abrir un archivo</tspan></text><rect x="440" y="156" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">cp1252</tspan></text><rect x="670" y="156" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">UTF-8</tspan></text><rect x="10" y="206" width="424" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="231.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Bytes de «é» seguido de salto de línea</tspan></text><rect x="440" y="206" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">233, 13, 10</tspan></text><rect x="670" y="206" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">195, 169, 10</tspan></text><rect x="10" y="256" width="424" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="281.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Con PYTHONUTF8=1</tspan></text><rect x="440" y="256" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="281.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">195, 169, 13, 10</tspan></text><rect x="670" y="256" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="281.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">195, 169, 10</tspan></text><rect x="10" y="306" width="424" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="331.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Orden alfabético con mayúsculas y «ñ»</tspan></text><rect x="440" y="306" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="331.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">Igual</tspan></text><rect x="670" y="306" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="331.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">Igual</tspan></text><rect x="10" y="360" width="890" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="455" y="384.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="455" dy="0">Una prueba que depende del orden de un conjunto es inestable en cualquier sistema y se arregla ordenando. Una que</tspan></text><text x="455" y="401.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="455" dy="0">depende de la codificación o del salto de línea cambia de resultado entre sistemas y se arregla declarándolos. Esta</tspan></text><text x="455" y="418.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="455" dy="0">figura es la única de la parte cuyos valores difieren por sistema.</tspan></text><text x="455" y="457.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="455" dy="0">Datos sintéticos y modelos del autor con semilla fija; Windows (CPython 3.12.9) y Ubuntu (WSL2, 3.12.3) con cifras idénticas salvo donde se indica.</tspan></text></svg>
