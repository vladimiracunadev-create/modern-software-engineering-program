<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 421" width="940" height="421" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cinco versiones del servicio frente a tres estilos de prueba</title><desc id="d">Tabla: ante tres refactorizaciones que no cambian lo que el servicio hace, la prueba con asertos sobre las llamadas falla en dos y la que además fija las consultas al repositorio falla en una; la prueba de estado con un doble espía no falla en ninguna; las tres detectan el defecto real.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="421" fill="#ffffff"/><rect x="10" y="12" width="364" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="192" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="192" dy="0">Versión del servicio</tspan></text><rect x="380" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="472" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="472" dy="0">Mock con asertos de</tspan></text><text x="472" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="472" dy="0">llamadas</tspan></text><rect x="570" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="662" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="662" dy="0">Mock más consultas</tspan></text><text x="662" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="662" dy="0">exactas</tspan></text><rect x="760" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="842" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="842" dy="0">Estado con espía</tspan></text><rect x="10" y="56" width="364" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="81.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Original</tspan></text><rect x="380" y="56" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">Pasa</tspan></text><rect x="570" y="56" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">Pasa</tspan></text><rect x="760" y="56" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">Pasa</tspan></text><rect x="10" y="106" width="364" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="131.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Refactor: procesa en orden inverso</tspan></text><rect x="380" y="106" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">Falla</tspan></text><rect x="570" y="106" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">Falla</tspan></text><rect x="760" y="106" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">Pasa</tspan></text><rect x="10" y="156" width="364" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="181.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Refactor: argumentos con nombre</tspan></text><rect x="380" y="156" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">Falla</tspan></text><rect x="570" y="156" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">Pasa</tspan></text><rect x="760" y="156" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">Pasa</tspan></text><rect x="10" y="206" width="364" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="231.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Refactor: consulta antes de enviar</tspan></text><rect x="380" y="206" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">Pasa</tspan></text><rect x="570" y="206" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">Pasa</tspan></text><rect x="760" y="206" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">Pasa</tspan></text><rect x="10" y="256" width="364" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="281.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Defecto: avisa también a quien ya tiene nota</tspan></text><rect x="380" y="256" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="281.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">Falla</tspan></text><rect x="570" y="256" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="281.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">Falla</tspan></text><rect x="760" y="256" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="281.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">Falla</tspan></text><rect x="10" y="310" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="334.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Dos de tres refactorizaciones rompen la prueba acoplada a la interacción sin que haya un defecto. La prueba de estado</tspan></text><text x="470" y="351.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">comprueba qué se envió y a quién, no cómo. Esto no vuelve inútiles los mocks: verifican que se produzca un efecto cuando el</tspan></text><text x="470" y="368.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">efecto es lo único observable.</tspan></text><text x="470" y="407.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos y modelos del autor con semilla fija; Windows (CPython 3.12.9) y Ubuntu (WSL2, 3.12.3) con cifras idénticas salvo donde se indica.</tspan></text></svg>
