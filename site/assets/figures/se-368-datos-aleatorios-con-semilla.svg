<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 403" width="930" height="403" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una propiedad con datos aleatorios que falla una de cada diez veces</title><desc id="d">Tabla: una propiedad que falla con el 0,48 por ciento de las entregas individuales falla con 10,9 por ciento de las pruebas de 20 entregas; con la semilla 6 anotada reproduce el fallo 100 de 100 veces; sin semilla fija falla entre 73 y 101 de 1 000 corridas y no puede reproducirse.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="403" fill="#ffffff"/><rect x="10" y="12" width="394" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="207" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="207" dy="0">Medida</tspan></text><rect x="410" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="522" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="522" dy="0">Resultado</tspan></text><rect x="640" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="777" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="777" dy="0">Lectura</tspan></text><rect x="10" y="56" width="394" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="85.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Entregas individuales que violan la propiedad</tspan></text><rect x="410" y="56" width="224" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="522" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="522" dy="0">0,48 %</tspan></text><rect x="640" y="56" width="274" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="77.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">Efecto del redondeo con nota bruta</tspan></text><text x="777" y="93.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">1,0</tspan></text><rect x="10" y="114" width="394" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="135.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Pruebas con 20 entregas aleatorias que fallan, 1 000</tspan></text><text x="207" y="151.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">semillas</tspan></text><rect x="410" y="114" width="224" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="522" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="522" dy="0">109 de 1 000 (10,9 %)</tspan></text><rect x="640" y="114" width="274" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">20 entregas multiplican el riesgo</tspan></text><rect x="10" y="172" width="394" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="201.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Semilla 6 anotada, 100 repeticiones</tspan></text><rect x="410" y="172" width="224" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="522" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="522" dy="0">Falla 100 de 100</tspan></text><rect x="640" y="172" width="274" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">Reproducible</tspan></text><rect x="10" y="230" width="394" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="259.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Sin semilla fija, 1 000 corridas independientes</tspan></text><rect x="410" y="230" width="224" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="522" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="522" dy="0">Falla 73 a 101 de 1 000</tspan></text><rect x="640" y="230" width="274" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="251.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">No reproducible; el valor cambia en</tspan></text><text x="777" y="267.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">cada corrida</tspan></text><rect x="10" y="292" width="910" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="316.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">Una probabilidad pequeña por elemento no se queda pequeña en la prueba: con 20 elementos la prueba falla 23 veces más a</tspan></text><text x="465" y="333.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">menudo (10,9 % frente a 0,48 %). Anotar la semilla en el informe convierte un fallo que nadie puede repetir en uno que se</tspan></text><text x="465" y="350.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">repite siempre. La cifra sin semilla varía entre ejecuciones y entre sistemas.</tspan></text><text x="465" y="389.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Datos sintéticos y modelos del autor con semilla fija; Windows (CPython 3.12.9) y Ubuntu (WSL2, 3.12.3) con cifras idénticas salvo donde se indica.</tspan></text></svg>
