<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 450" width="940" height="450" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una propiedad con datos aleatorios que falla una de cada diez veces</title><desc id="d">Barras horizontales en escala logarítmica: la propiedad falla con 0,48 por ciento de las entregas individuales y con 10,9 por ciento de las pruebas de 20 entregas; con la semilla 6 anotada falla 100 por ciento de las repeticiones y sin semilla fija entre 8,7 y 10,1 por ciento de las corridas, sin poder reproducirse.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="450" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Una propiedad con datos aleatorios que falla una de cada diez veces</tspan></text><line x1="364" y1="49" x2="364" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="364" y1="269" x2="364" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="364" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="364" dy="0">0,1</tspan></text><line x1="531.88" y1="49" x2="531.88" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="531.88" y1="269" x2="531.88" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="531.88" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="531.88" dy="0">1</tspan></text><line x1="699.76" y1="49" x2="699.76" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="699.76" y1="269" x2="699.76" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="699.76" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="699.76" dy="0">10</tspan></text><line x1="867.64" y1="49" x2="867.64" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="867.64" y1="269" x2="867.64" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="867.64" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867.64" dy="0">100</tspan></text><line x1="364" y1="269" x2="867.64" y2="269" stroke="#5b7280" stroke-width="1.6"/><text x="354" y="75.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="354" dy="0">Una entrega individual</tspan></text><text x="354" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="354" dy="0">Prueba con 20 entregas (1 000 semillas)</tspan></text><text x="354" y="163.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="354" dy="0">Semilla 6 anotada (100 repeticiones)</tspan></text><text x="354" y="199" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="354" dy="0">Sin semilla fija: corrida con menos fallos (87</tspan></text><text x="354" y="216" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="354" dy="0">de 1 000)</tspan></text><text x="354" y="243" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="354" dy="0">Sin semilla fija: corrida con más fallos (101</tspan></text><text x="354" y="260" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="354" dy="0">de 1 000)</tspan></text><rect x="364" y="55" width="114.367" height="32" rx="3" fill="#c0432f"/><text x="485.367" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="485.367" dy="0">0,48 %</tspan></text><rect x="364" y="99" width="342.043" height="32" rx="3" fill="#c0432f"/><text x="713.043" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="713.043" dy="0">10,9 %</tspan></text><rect x="364" y="143" width="503.64" height="32" rx="3" fill="#c0432f"/><text x="874.64" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="874.64" dy="0">100 %</tspan></text><rect x="364" y="187" width="325.606" height="32" rx="3" fill="#c0432f"/><text x="696.606" y="207.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="696.606" dy="0">8,7 %</tspan></text><rect x="364" y="231" width="336.485" height="32" rx="3" fill="#c0432f"/><text x="707.485" y="251.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="707.485" dy="0">10,1 %</tspan></text><text x="615.82" y="313" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="615.82" dy="0">% de ejecuciones que violan la propiedad (escala logarítmica)</tspan></text><rect x="10" y="327" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="351.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Una probabilidad pequeña por elemento no se queda pequeña en la prueba: con 20 elementos la prueba falla 23 veces más a</tspan></text><text x="470" y="368.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">menudo (10,9 % frente a 0,48 %). Anotar la semilla en el informe convierte un fallo que nadie puede repetir en uno que se</tspan></text><text x="470" y="385.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">repite siempre. La cifra sin semilla varía entre ejecuciones y entre sistemas.</tspan></text><text x="470" y="432.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos y modelos del autor con semilla fija; Windows (CPython 3.12.9) y Ubuntu (WSL2, 3.12.3) con cifras idénticas salvo donde se indica.</tspan></text></svg>
