e" font-weight="400" fill="#142231"><tspan x="532" dy="0">45</tspan></text><rect x="610" y="376" width="184" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="702" y="396.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">Persona</tspan></text><rect x="10" y="416" width="444" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="436.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Mensaje de error ambiguo</tspan></text><rect x="460" y="416" width="144" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="436.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">32</tspan></text><rect x="610" y="416" width="184" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="702" y="436.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">Persona</tspan></text><rect x="10" y="460" width="790" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="405" y="484.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="405" dy="0">El 59,6 % depende de las clases que el autor eligió y de cuántas plantó de cada una, no es una tasa de la</tspan></text><text x="405" y="501.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="405" dy="0">web real. El hecho que se conserva es cuáles clases son decidibles por una regla (un contraste se calcula</tspan></text><text x="405" y="518.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="405" dy="0">con la fórmula de WCAG) y cuáles exigen juicio (si un texto alternativo describe la imagen).</tspan></text><text x="405" y="557.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="405" dy="0">Datos sintéticos y modelos del autor con semilla fija; Windows (CPython 3.12.9) y Ubuntu (WSL2, 3.12.3) con cifras idénticas salvo donde se indica.</tspan></text></svg>
