<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 478" width="940" height="478" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La misma condición de carrera: resultados incorrectos según la enumeración exacta y según los hilos reales</title><desc id="d">Barras horizontales con el porcentaje de resultados incorrectos: la enumeración exacta da 66,7 por ciento con dos hilos y 93,3 por ciento con tres; los hilos reales de CPython 3.12 no fallan en 100 ejecuciones sin código entre la lectura y la escritura ni en 300 con pocas vueltas, y fallan en las 40 con 200 000 vueltas y un bucle vacío entre ambas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="478" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">La misma condición de carrera: resultados incorrectos según la enumeración exacta y según los hilos reales</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Cálculo de intercalaciones (4 de 6 y 84 de 90)</tspan></text><rect x="410.84" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="430.84" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="430.84" dy="0">Ejecuciones con hilos reales (Windows y Ubuntu)</tspan></text><line x1="404" y1="77" x2="404" y2="297" stroke="#d5dde1" stroke-width="1"/><line x1="404" y1="297" x2="404" y2="302" stroke="#5b7280" stroke-width="1.4"/><text x="404" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="404" dy="0">0</tspan></text><line x1="498.34" y1="77" x2="498.34" y2="297" stroke="#d5dde1" stroke-width="1"/><line x1="498.34" y1="297" x2="498.34" y2="302" stroke="#5b7280" stroke-width="1.4"/><text x="498.34" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="498.34" dy="0">20</tspan></text><line x1="592.68" y1="77" x2="592.68" y2="297" stroke="#d5dde1" stroke-width="1"/><line x1="592.68" y1="297" x2="592.68" y2="302" stroke="#5b7280" stroke-width="1.4"/><text x="592.68" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592.68" dy="0">40</tspan></text><line x1="687.02" y1="77" x2="687.02" y2="297" stroke="#d5dde1" stroke-width="1"/><line x1="687.02" y1="297" x2="687.02" y2="302" stroke="#5b7280" stroke-width="1.4"/><text x="687.02" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="687.02" dy="0">60</tspan></text><line x1="781.36" y1="77" x2="781.36" y2="297" stroke="#d5dde1" stroke-width="1"/><line x1="781.36" y1="297" x2="781.36" y2="302" stroke="#5b7280" stroke-width="1.4"/><text x="781.36" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="781.36" dy="0">80</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="297" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="297" x2="875.7" y2="302" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">100</tspan></text><line x1="404" y1="297" x2="875.7" y2="297" stroke="#5b7280" stroke-width="1.6"/><text x="394" y="103.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="394" dy="0">Enumeración exacta, 2 hilos</tspan></text><text x="394" y="147.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="394" dy="0">Enumeración exacta, 3 hilos</tspan></text><text x="394" y="183" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="394" dy="0">Hilos reales, sin nada entre leer y escribir (100</tspan></text><text x="394" y="200" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="394" dy="0">ejecuciones)</tspan></text><text x="394" y="227" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="394" dy="0">Hilos reales, bucle vacío, 1 a 1 000 vueltas (300</tspan></text><text x="394" y="244" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="394" dy="0">ejecuciones)</tspan></text><text x="394" y="271" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="394" dy="0">Hilos reales, bucle vacío, 200 000 vueltas (40</tspan></text><text x="394" y="288" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="394" dy="0">ejecuciones)</tspan></text><rect x="404" y="84" width="314.624" height="30" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="561.312" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="561.312" dy="0">66,7</tspan></text><rect x="718.624" y="84" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="725.624" y="103.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="725.624" dy="0">66,7</tspan></text><rect x="404" y="128" width="440.096" height="30" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="624.048" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="624.048" dy="0">93,3</tspan></text><rect x="844.096" y="128" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="851.096" y="147.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="851.096" dy="0">93,3</tspan></text><rect x="404" y="172" width="0" height="30" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><rect x="404" y="172" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="411" y="191.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="411" dy="0">0,0</tspan></text><rect x="404" y="216" width="0" height="30" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><rect x="404" y="216" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="411" y="235.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="411" dy="0">0,0</tspan></text><rect x="404" y="260" width="0" height="30" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><rect x="404" y="260" width="471.7" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="639.85" y="279.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="639.85" dy="0">100,0</tspan></text><text x="882.7" y="279.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100,0</tspan></text><text x="639.85" y="341" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="639.85" dy="0">% de resultados incorrectos</tspan></text><rect x="10" y="355" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="379.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Ejecutar cien veces y ver verde no prueba que no haya carrera: el intérprete solo cambia de hilo en ciertos puntos y una</tspan></text><text x="470" y="396.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">línea más de código, un tamaño mayor o otra versión de Python mueve el resultado de 0 % a 100 %. La enumeración exacta no</tspan></text><text x="470" y="413.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">depende del planificador; los hilos reales sí.</tspan></text><text x="470" y="460.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos y modelos del autor con semilla fija; Windows (CPython 3.12.9) y Ubuntu (WSL2, 3.12.3) con cifras idénticas salvo donde se indica.</tspan></text></svg>
