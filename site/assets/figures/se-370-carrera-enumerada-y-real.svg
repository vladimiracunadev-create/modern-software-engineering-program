<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 461" width="930" height="461" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La misma condición de carrera: lo que dice la enumeración y lo que dicen los hilos reales</title><desc id="d">Tabla: leer y escribir un contador con dos hilos termina bien en un tercio de las intercalaciones posibles y con tres hilos en 6,7 por ciento; los hilos reales de CPython 3.12 no fallaron en 100 ejecuciones sin código entre la lectura y la escritura ni en 300 con pocas vueltas, y fallaron en las 40 con 200 000 vueltas cuando había un bucle vacío entre ambas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="461" fill="#ffffff"/><rect x="10" y="12" width="424" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="222" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="222" dy="0">Experimento</tspan></text><rect x="440" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="602" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="602" dy="0">Resultado</tspan></text><rect x="770" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="842" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="842" dy="0">Dónde</tspan></text><rect x="10" y="56" width="424" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="85.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Enumeración exacta, 2 hilos que leen y escriben</tspan></text><rect x="440" y="56" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="77.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">Termina bien en 2 de 6 intercalaciones (33,3</tspan></text><text x="602" y="93.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">%)</tspan></text><rect x="770" y="56" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">Cálculo</tspan></text><rect x="10" y="114" width="424" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="143.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Enumeración exacta, 3 hilos</tspan></text><rect x="440" y="114" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="135.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">Termina bien en 6 de 90 intercalaciones (6,7</tspan></text><text x="602" y="151.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">%)</tspan></text><rect x="770" y="114" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">Cálculo</tspan></text><rect x="10" y="172" width="424" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="193.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Hilos reales, sin nada entre leer y escribir, hasta 200 000</tspan></text><text x="222" y="209.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">vueltas</tspan></text><rect x="440" y="172" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">0 fallos en 100 ejecuciones</tspan></text><rect x="770" y="172" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">Windows y Ubuntu</tspan></text><rect x="10" y="230" width="424" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="251.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Hilos reales con un bucle vacío entre leer y escribir, 1 y 1</tspan></text><text x="222" y="267.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">000 vueltas</tspan></text><rect x="440" y="230" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">0 fallos en 300 ejecuciones</tspan></text><rect x="770" y="230" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">Windows y Ubuntu</tspan></text><rect x="10" y="288" width="424" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="317.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Los mismos con 200 000 vueltas</tspan></text><rect x="440" y="288" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="317.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">Falla en 40 de 40 ejecuciones</tspan></text><rect x="770" y="288" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="317.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">Windows y Ubuntu</tspan></text><rect x="10" y="350" width="910" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="465" y="374.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="465" dy="0">Ejecutar cien veces y ver verde no prueba que no haya carrera: el intérprete solo cambia de hilo en ciertos puntos y una</tspan></text><text x="465" y="391.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="465" dy="0">línea más de código, un tamaño mayor o otra versión de Python mueve el resultado de 0 % a 100 %. La enumeración exacta no</tspan></text><text x="465" y="408.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="465" dy="0">depende del planificador; los hilos reales sí.</tspan></text><text x="465" y="447.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Datos sintéticos y modelos del autor con semilla fija; Windows (CPython 3.12.9) y Ubuntu (WSL2, 3.12.3) con cifras idénticas salvo donde se indica.</tspan></text></svg>
