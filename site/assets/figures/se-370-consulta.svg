<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 509" width="940" height="509" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Costo mensual de una consulta de 10 días ejecutada 100 veces al día, sobre una tabla escalada a 1 TB</title><desc id="d">Barras con el costo mensual en unidades inventadas, a 5 unidades por terabyte escaneado: leer el CSV completo 15000, columnar leyendo dos columnas de todo el rango 1213 y columnar leyendo dos columnas con estadísticas que descartan 18 de 20 grupos 121; escala logarítmica.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="509" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Costo mensual de una consulta de 10 días ejecutada 100 veces al día, sobre una tabla escalada a 1 TB</tspan></text><line x1="108.78" y1="317" x2="920" y2="317" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="317" x2="108.78" y2="317" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="321.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">100</tspan></text><line x1="108.78" y1="233.667" x2="920" y2="233.667" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="233.667" x2="108.78" y2="233.667" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="238.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">1 000</tspan></text><line x1="108.78" y1="150.333" x2="920" y2="150.333" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="150.333" x2="108.78" y2="150.333" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="154.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">10 000</tspan></text><line x1="108.78" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="67" x2="108.78" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">100 000</tspan></text><line x1="108.78" y1="67" x2="108.78" y2="317" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="192" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 192)">Costo mensual (unidades inventadas) (escala logarítmica)</text><rect x="135.821" y="135.659" width="216.325" height="181.341" rx="3" fill="#102a43"/><text x="243.983" y="129.659" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="243.983" dy="0">15 000</tspan></text><text x="243.983" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="243.983" dy="0">CSV, lectura completa</tspan></text><rect x="406.227" y="226.678" width="216.325" height="90.3217" rx="3" fill="#102a43"/><text x="514.39" y="220.678" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="514.39" dy="0">1 213</tspan></text><text x="514.39" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="514.39" dy="0">Columnar, dos columnas, todo el</tspan></text><text x="514.39" y="355" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="514.39" dy="0">rango</tspan></text><rect x="676.634" y="310.101" width="216.325" height="6.89878" rx="3" fill="#102a43"/><text x="784.797" y="304.101" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="784.797" dy="0">121</tspan></text><text x="784.797" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="784.797" dy="0">Columnar, dos columnas, 10 días con</tspan></text><text x="784.797" y="355" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="784.797" dy="0">estadísticas</tspan></text><rect x="10" y="386" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="410.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los bytes escaneados se midieron sobre 200 000 filas y se escalaron a 1 TB; el precio de 5 unidades por TB es un parámetro</tspan></text><text x="470" y="427.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">del autor, no una tarifa. La proporción entre barras (124 veces entre la primera y la última) es lo que se traslada, y solo</tspan></text><text x="470" y="444.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">para consultas que lean un rango estrecho de un archivo agrupado por esa columna.</tspan></text><text x="470" y="491.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 45; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
