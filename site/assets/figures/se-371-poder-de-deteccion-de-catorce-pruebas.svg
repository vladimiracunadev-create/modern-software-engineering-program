 x="802" dy="0">Útil</tspan></text><rect x="10" y="488" width="254" height="30" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="506.08" font-size="11" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">t13 promedio vacío</tspan></text><rect x="270" y="488" width="214" height="30" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="377" y="506.08" font-size="11" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="377" dy="0">1</tspan></text><rect x="490" y="488" width="174" height="30" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="506.08" font-size="11" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">No</tspan></text><rect x="670" y="488" width="264" height="30" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="506.08" font-size="11" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">Débil</tspan></text><rect x="10" y="524" width="254" height="30" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="542.08" font-size="11" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">t14 sin nota y con espacios</tspan></text><rect x="270" y="524" width="214" height="30" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="377" y="542.08" font-size="11" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="377" dy="0">8</tspan></text><rect x="490" y="524" width="174" height="30" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="542.08" font-size="11" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">No</tspan></text><rect x="670" y="524" width="264" height="30" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="542.08" font-size="11" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">Útil</tspan></text><rect x="10" y="564" width="930" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="475" y="588.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Tres pruebas con poder de detección aparente (t02, t03, t04) matan solo porque el mutante hace lanzar una excepción: ninguna</tspan></text><text x="475" y="605.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">comprueba un valor. t09 pasa con el defecto porque el desempaquetado de una línea corta ya lanza ValueError. Una prueba que</tspan></text><text x="475" y="622.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">mata mutantes sin comprobar nada no demuestra lo que dice.</tspan></text><text x="475" y="661.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Datos sintéticos y modelos del autor con semilla fija; Windows (CPython 3.12.9) y Ubuntu (WSL2, 3.12.3) con cifras idénticas salvo donde se indica.</tspan></text></svg>
