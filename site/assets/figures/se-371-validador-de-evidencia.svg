<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 471" width="910" height="471" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">200 mutaciones de un paquete de evidencia: en qué nivel del validador se detecta cada tipo</title><desc id="d">Tabla: el nivel de estructura detecta 77 de 200 mutaciones; con referencias, 139; con re-ejecución de las pruebas contra el defecto, 153; con refactorizaciones benignas, 173; con reglas sobre las aserciones, 200.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="910" height="471" fill="#ffffff"/><rect x="10" y="12" width="594" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="307" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="307" dy="0">Tipo de mutación del paquete (cantidad)</tspan></text><rect x="610" y="12" width="284" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="752" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="752" dy="0">Primer nivel que la detecta</tspan></text><rect x="10" y="56" width="594" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="307" dy="0">Campo faltante (26) o afirmación negativa (22)</tspan></text><rect x="610" y="56" width="284" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">Estructura</tspan></text><rect x="10" y="106" width="594" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="307" dy="0">Menos de 3 ejecuciones (14) · prueba repetida (15)</tspan></text><rect x="610" y="106" width="284" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">Estructura</tspan></text><rect x="10" y="156" width="594" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="307" dy="0">Prueba inventada (22) · defecto inventado (40)</tspan></text><rect x="610" y="156" width="284" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">Referencias</tspan></text><rect x="10" y="206" width="594" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="307" dy="0">La prueba no detecta ese defecto (14)</tspan></text><rect x="610" y="206" width="284" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">Re-ejecución</tspan></text><rect x="10" y="256" width="594" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="307" dy="0">Prueba frágil que sí detecta (20)</tspan></text><rect x="610" y="256" width="284" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">Refactor benigno</tspan></text><rect x="10" y="306" width="594" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="331.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="307" dy="0">Prueba sin aserciones o tautológica (27)</tspan></text><rect x="610" y="306" width="284" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">Reglas de aserción</tspan></text><rect x="10" y="360" width="890" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="455" y="384.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455" dy="0">Acumulado por nivel: estructura 77 de 200, referencias 139, re-ejecución 153, refactor 173, aserciones 200. El 100 %</tspan></text><text x="455" y="401.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455" dy="0">final es engañoso: las reglas se diseñaron con las nueve mutaciones que se evalúan. Un paquete con una trampa nueva</tspan></text><text x="455" y="418.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455" dy="0">podría pasar los cinco niveles.</tspan></text><text x="455" y="457.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="455" dy="0">Datos sintéticos y modelos del autor con semilla fija; Windows (CPython 3.12.9) y Ubuntu (WSL2, 3.12.3) con cifras idénticas salvo donde se indica.</tspan></text></svg>
