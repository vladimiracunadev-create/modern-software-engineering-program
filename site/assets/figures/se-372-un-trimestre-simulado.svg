1.6"/><text x="202" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="202" dy="0">Por exposición (× cambios)</tspan></text><rect x="400" y="256" width="154" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">21,75</tspan></text><rect x="560" y="256" width="154" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="637" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="637" dy="0">35,60</tspan></text><rect x="720" y="256" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">8,00</tspan></text><rect x="10" y="306" width="384" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="202" y="331.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="202" dy="0">Marginal con exposición</tspan></text><rect x="400" y="306" width="154" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">21,37</tspan></text><rect x="560" y="306" width="154" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="637" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="637" dy="0">35,10</tspan></text><rect x="720" y="306" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">8,14</tspan></text><rect x="10" y="360" width="890" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="455" y="384.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="455" dy="0">Pasar de un reparto uniforme al marginal con exposición baja la pérdida media 11 % y el percentil 95 el 11 %; es una</tspan></text><text x="455" y="401.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="455" dy="0">mejora real y modesta. La mayor parte del beneficio (42,41 a 24,09) llega con tener pruebas. Los cambios se reparten</tspan></text><text x="455" y="418.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="455" dy="0">por tamaño del código y la probabilidad por cambio es p/4: ambos supuestos del autor.</tspan></text><text x="455" y="457.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="455" dy="0">Datos sintéticos y modelos del autor con semilla fija; Windows (CPython 3.12.9) y Ubuntu (WSL2, 3.12.3) con cifras idénticas salvo donde se indica.</tspan></text></svg>
