<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 659" width="940" height="659" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">2 000 trimestres simulados con 40 horas de pruebas y 240 cambios por trimestre</title><desc id="d">Barras horizontales con la pérdida media del trimestre y su percentil 95 para seis estrategias: sin pruebas 42,41 y 62,00; con reparto uniforme 24,09 y 39,30; el marginal con exposición baja a 21,37 y 35,10.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="659" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">2 000 trimestres simulados con 40 horas de pruebas y 240 cambios por trimestre</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Pérdida media</tspan></text><rect x="162.02" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="182.02" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="182.02" dy="0">Percentil 95</tspan></text><line x1="294" y1="77" x2="294" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="461" x2="294" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">0</tspan></text><line x1="439.425" y1="77" x2="439.425" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="439.425" y1="461" x2="439.425" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="439.425" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="439.425" dy="0">20</tspan></text><line x1="584.85" y1="77" x2="584.85" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="584.85" y1="461" x2="584.85" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="584.85" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="584.85" dy="0">40</tspan></text><line x1="730.275" y1="77" x2="730.275" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="730.275" y1="461" x2="730.275" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="730.275" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="730.275" dy="0">60</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="461" x2="875.7" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">80</tspan></text><line x1="294" y1="461" x2="875.7" y2="461" stroke="#5b7280" stroke-width="1.6"/><text x="284" y="113.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Sin pruebas</tspan></text><text x="284" y="177.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Reparto uniforme</tspan></text><text x="284" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Proporcional al tamaño</tspan></text><text x="284" y="305.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Proporcional a probabilidad × impacto</tspan></text><text x="284" y="369.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Por exposición (× cambios)</tspan></text><text x="284" y="433.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Marginal con exposición</tspan></text><rect x="294" y="83" width="308.374" height="24.5" rx="3" fill="#087f8c"/><text x="609.374" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="609.374" dy="0">42,41</tspan></text><rect x="294" y="110.5" width="450.818" height="24.5" rx="3" fill="#c0432f"/><text x="751.818" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="751.818" dy="0">62,00</tspan></text><rect x="294" y="147" width="175.164" height="24.5" rx="3" fill="#087f8c"/><text x="476.164" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="476.164" dy="0">24,09</tspan></text><rect x="294" y="174.5" width="285.76" height="24.5" rx="3" fill="#c0432f"/><text x="586.76" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="586.76" dy="0">39,30</tspan></text><rect x="294" y="211" width="175.746" height="24.5" rx="3" fill="#087f8c"/><text x="476.746" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="476.746" dy="0">24,17</tspan></text><rect x="294" y="238.5" width="283.579" height="24.5" rx="3" fill="#c0432f"/><text x="584.579" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="584.579" dy="0">39,00</tspan></text><rect x="294" y="275" width="165.639" height="24.5" rx="3" fill="#087f8c"/><text x="466.639" y="291.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="466.639" dy="0">22,78</tspan></text><rect x="294" y="302.5" width="270.491" height="24.5" rx="3" fill="#c0432f"/><text x="571.491" y="319.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="571.491" dy="0">37,20</tspan></text><rect x="294" y="339" width="158.15" height="24.5" rx="3" fill="#087f8c"/><text x="459.15" y="355.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="459.15" dy="0">21,75</tspan></text><rect x="294" y="366.5" width="258.857" height="24.5" rx="3" fill="#c0432f"/><text x="559.857" y="383.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="559.857" dy="0">35,60</tspan></text><rect x="294" y="403" width="155.387" height="24.5" rx="3" fill="#087f8c"/><text x="456.387" y="419.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="456.387" dy="0">21,37</tspan></text><rect x="294" y="430.5" width="255.221" height="24.5" rx="3" fill="#c0432f"/><text x="556.221" y="447.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="556.221" dy="0">35,10</tspan></text><text x="584.85" y="505" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="584.85" dy="0">pérdida del trimestre (unidades del modelo; menos es mejor)</tspan></text><rect x="10" y="519" width="920" height="92.56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="543.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Pasar de un reparto uniforme al marginal con exposición baja la pérdida media 11 % y el percentil 95 el 11 %; es una mejora</tspan></text><text x="470" y="560.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">real y modesta. La mayor parte del beneficio (42,41 a 24,09) llega con tener pruebas. Los escapes medios (15,69 sin pruebas</tspan></text><text x="470" y="577.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">y entre 7,9 y 8,7 con ellas) están en la tabla. Los cambios se reparten por tamaño del código y la probabilidad por cambio</tspan></text><text x="470" y="593.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">es p/4: ambos supuestos del autor.</tspan></text><text x="470" y="641.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos y modelos del autor con semilla fija; Windows (CPython 3.12.9) y Ubuntu (WSL2, 3.12.3) con cifras idénticas salvo donde se indica.</tspan></text></svg>
