<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 483" width="960" height="483" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Bloqueos espurios al encadenar comprobaciones que fallan solas el 2 % de las veces</title><desc id="d">Tabla: con comprobaciones que fallan solas el 2 por ciento de las veces, encadenar 10 bloquea el 18,4 por ciento de los cambios al primer intento y 40 el 55,9; permitir hasta tres intentos baja el bloqueo pero deja que un defecto detectado el 90 por ciento de las veces se cuele en el 27,3 por ciento de los casos en lugar del 10.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="483" fill="#ffffff"/><rect x="10" y="12" width="394" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="207" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="207" dy="0">Comprobaciones encadenadas</tspan></text><rect x="410" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="542" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="542" dy="0">Bloqueo al primer intento</tspan></text><rect x="680" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="812" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="812" dy="0">Bloqueo tras hasta 3 intentos</tspan></text><rect x="10" y="56" width="394" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="82.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">1</tspan></text><rect x="410" y="56" width="264" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="82.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">2,1 %</tspan></text><rect x="680" y="56" width="264" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="82.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">0,01 %</tspan></text><rect x="10" y="108" width="394" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="134.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">5</tspan></text><rect x="410" y="108" width="264" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="134.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">9,4 %</tspan></text><rect x="680" y="108" width="264" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="134.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">0,11 %</tspan></text><rect x="10" y="160" width="394" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="186.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">10</tspan></text><rect x="410" y="160" width="264" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="186.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">18,4 %</tspan></text><rect x="680" y="160" width="264" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="186.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">0,61 %</tspan></text><rect x="10" y="212" width="394" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="238.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">20</tspan></text><rect x="410" y="212" width="264" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="238.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">33,5 %</tspan></text><rect x="680" y="212" width="264" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="238.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">3,52 %</tspan></text><rect x="10" y="264" width="394" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="290.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">40</tspan></text><rect x="410" y="264" width="264" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="290.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">55,9 %</tspan></text><rect x="680" y="264" width="264" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="290.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">17,14 %</tspan></text><rect x="10" y="316" width="394" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="342.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Defecto detectado el 90 % de las veces</tspan></text><rect x="410" y="316" width="264" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="342.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">Se cuela el 10,0 %</tspan></text><rect x="680" y="316" width="264" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="342.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">Se cuela el 27,3 %</tspan></text><rect x="10" y="372" width="940" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="396.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Reintentar hasta ponerse en verde elimina el ruido y también la señal: si la detección es intermitente, el defecto pasa en</tspan></text><text x="480" y="413.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">cuanto una ejecución sale verde. La corrección es hacer determinista la comprobación o separar «inestable» de «falla», no</tspan></text><text x="480" y="430.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">ampliar los intentos.</tspan></text><text x="480" y="469.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
