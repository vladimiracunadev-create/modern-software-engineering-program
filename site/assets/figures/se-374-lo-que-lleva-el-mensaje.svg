<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 716" width="940" height="716" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Notificación mínima (78 B) frente a estado completo en el evento (246 B), 1 000 eventos</title><desc id="d">Barras horizontales por consumidor: con la notificación de 78 bytes cuatro de cinco consumidores llaman de vuelta 1 000 veces y la auditoría y el calificador leen un valor del instante equivocado 299 veces; con el estado dentro del evento de 246 bytes no hay llamadas, pero las notificaciones y la analítica quedan desactualizadas 299 veces; la facturación solo necesita el identificador.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="716" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Notificación mínima (78 B) frente a estado completo en el evento (246 B), 1 000 eventos</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Llamadas de vuelta (notificación)</tspan></text><rect x="312.82" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="332.82" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="332.82" dy="0">Instante equivocado (notificación)</tspan></text><rect x="16" y="69" width="12" height="12" rx="2" fill="#946512"/><text x="36" y="80" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Desactualizadas (estado en el evento)</tspan></text><line x1="284" y1="101" x2="284" y2="551" stroke="#d5dde1" stroke-width="1"/><line x1="284" y1="551" x2="284" y2="556" stroke="#5b7280" stroke-width="1.4"/><text x="284" y="572" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="284" dy="0">0</tspan></text><line x1="431.925" y1="101" x2="431.925" y2="551" stroke="#d5dde1" stroke-width="1"/><line x1="431.925" y1="551" x2="431.925" y2="556" stroke="#5b7280" stroke-width="1.4"/><text x="431.925" y="572" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="431.925" dy="0">250</tspan></text><line x1="579.85" y1="101" x2="579.85" y2="551" stroke="#d5dde1" stroke-width="1"/><line x1="579.85" y1="551" x2="579.85" y2="556" stroke="#5b7280" stroke-width="1.4"/><text x="579.85" y="572" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="579.85" dy="0">500</tspan></text><line x1="727.775" y1="101" x2="727.775" y2="551" stroke="#d5dde1" stroke-width="1"/><line x1="727.775" y1="551" x2="727.775" y2="556" stroke="#5b7280" stroke-width="1.4"/><text x="727.775" y="572" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="727.775" dy="0">750</tspan></text><line x1="875.7" y1="101" x2="875.7" y2="551" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="551" x2="875.7" y2="556" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="572" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">1 000</tspan></text><line x1="284" y1="551" x2="875.7" y2="551" stroke="#5b7280" stroke-width="1.6"/><text x="274" y="150.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Notificaciones (estado actual)</tspan></text><text x="274" y="240.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Auditoría (estado del instante)</tspan></text><text x="274" y="330.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Analítica (curso y estado actuales)</tspan></text><text x="274" y="420.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Calificador (archivo del instante)</tspan></text><text x="274" y="510.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Facturación (solo el identificador)</tspan></text><rect x="284" y="107" width="591.7" height="24" rx="3" fill="#087f8c"/><text x="882.7" y="123.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">1 000</tspan></text><rect x="284" y="134" width="2" height="24" rx="3" fill="#c0432f"/><text x="293" y="150.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="293" dy="0">0</tspan></text><rect x="284" y="161" width="176.918" height="24" rx="3" fill="#946512"/><text x="467.918" y="177.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="467.918" dy="0">299</tspan></text><rect x="284" y="197" width="591.7" height="24" rx="3" fill="#087f8c"/><text x="882.7" y="213.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">1 000</tspan></text><rect x="284" y="224" width="176.918" height="24" rx="3" fill="#c0432f"/><text x="467.918" y="240.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="467.918" dy="0">299</tspan></text><rect x="284" y="251" width="2" height="24" rx="3" fill="#946512"/><text x="293" y="267.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="293" dy="0">0</tspan></text><rect x="284" y="287" width="591.7" height="24" rx="3" fill="#087f8c"/><text x="882.7" y="303.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">1 000</tspan></text><rect x="284" y="314" width="2" height="24" rx="3" fill="#c0432f"/><text x="293" y="330.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="293" dy="0">0</tspan></text><rect x="284" y="341" width="176.918" height="24" rx="3" fill="#946512"/><text x="467.918" y="357.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="467.918" dy="0">299</tspan></text><rect x="284" y="377" width="591.7" height="24" rx="3" fill="#087f8c"/><text x="882.7" y="393.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">1 000</tspan></text><rect x="284" y="404" width="176.918" height="24" rx="3" fill="#c0432f"/><text x="467.918" y="420.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="467.918" dy="0">299</tspan></text><rect x="284" y="431" width="2" height="24" rx="3" fill="#946512"/><text x="293" y="447.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="293" dy="0">0</tspan></text><rect x="284" y="467" width="2" height="24" rx="3" fill="#087f8c"/><text x="293" y="483.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="293" dy="0">0</tspan></text><rect x="284" y="494" width="2" height="24" rx="3" fill="#c0432f"/><text x="293" y="510.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="293" dy="0">0</tspan></text><rect x="284" y="521" width="2" height="24" rx="3" fill="#946512"/><text x="293" y="537.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="293" dy="0">0</tspan></text><text x="579.85" y="595" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="579.85" dy="0">De 1 000 eventos</tspan></text><rect x="10" y="609" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="633.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Ninguna forma de evento es correcta en general: la notificación obliga a un viaje de vuelta y lee el estado de ahora; el</tspan></text><text x="470" y="650.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">estado en el evento lee el del instante y puede estar viejo. El 30 % de cambios antes de leer es un supuesto del autor.</tspan></text><text x="470" y="698.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; CPython 3.12 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
