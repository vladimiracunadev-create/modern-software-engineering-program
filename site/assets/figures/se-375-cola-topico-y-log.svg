<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 476" width="940" height="476" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cola de trabajo, tópico con suscripciones y log con desplazamientos frente a un mismo flujo de 3 000 mensajes</title><desc id="d">Diagrama de tres columnas que muestra qué ocurre con un mensaje después de entregarse: en la cola de trabajo se borra al confirmarse, dos consumidores se reparten 1 500 y 1 500, el suscriptor tardío compite por lo que quede y no se puede reprocesar nada; en el tópico cada suscripción recibe los 3 000, el suscriptor tardío recibe 2 000 y no se puede reprocesar; en el log se conservan los 3 000, un grupo se reparte y otro lee todos, el suscriptor tardío lee desde el desplazamiento 0 y se reprocesan 500.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="476" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cola de trabajo, tópico con suscripciones y log con desplazamientos frente a un mismo flujo de 3 000 mensajes</tspan></text><rect x="10" y="46" width="296" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="158" y="68.2" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="158" dy="0">Cola de trabajo</tspan></text><rect x="10" y="98" width="296" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="158" y="118.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="158" dy="0">3 000 mensajes entran</tspan></text><polyline points="158,132 158,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="160" width="296" height="54" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="158" y="190.92" font-size="14" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="158" dy="0">El mensaje se borra al confirmarse</tspan></text><polyline points="158,214 82,252" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="252" width="144" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="82" y="278.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="82" dy="0">Consumidor A</tspan></text><text x="82" y="294.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="82" dy="0">1 500 mensajes</tspan></text><polyline points="158,214 234,252" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="162" y="252" width="144" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="234" y="278.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="234" dy="0">Consumidor B</tspan></text><text x="234" y="294.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="234" dy="0">1 500 mensajes</tspan></text><rect x="10" y="336" width="296" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><text x="158" y="361.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="158" dy="0">Suscriptor tardío: compite por lo que</tspan></text><text x="158" y="377.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="158" dy="0">quede desde ahora</tspan></text><rect x="10" y="406" width="296" height="60" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="158" y="431.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="158" dy="0">Reprocesar los últimos 500: 0, ya se</tspan></text><text x="158" y="447.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="158" dy="0">borraron</tspan></text><rect x="322" y="46" width="296" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="68.2" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Tópico con suscripciones</tspan></text><rect x="322" y="98" width="296" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="118.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">3 000 mensajes entran</tspan></text><polyline points="470,132 470,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="322" y="160" width="296" height="54" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="181.96" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="470" dy="0">Cada suscripción vigente recibe una</tspan></text><text x="470" y="199.88" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="470" dy="0">copia</tspan></text><polyline points="470,214 394,252" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="322" y="252" width="144" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="394" y="278.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="394" dy="0">Suscripción A</tspan></text><text x="394" y="294.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="394" dy="0">3 000 mensajes</tspan></text><polyline points="470,214 546,252" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="474" y="252" width="144" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="546" y="278.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="546" dy="0">Suscripción B</tspan></text><text x="546" y="294.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="546" dy="0">3 000 mensajes</tspan></text><rect x="322" y="336" width="296" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><text x="470" y="361.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Suscriptor tardío: recibe 2 000, no</tspan></text><text x="470" y="377.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">ve los 1 000 anteriores</tspan></text><rect x="322" y="406" width="296" height="60" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="431.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Reprocesar los últimos 500: 0, ya se</tspan></text><text x="470" y="447.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">entregaron</tspan></text><rect x="634" y="46" width="296" height="36" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="782" y="68.2" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="782" dy="0">Log con desplazamientos</tspan></text><rect x="634" y="98" width="296" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="118.92" font-size="14" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">3 000 mensajes entran</tspan></text><polyline points="782,132 782,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="634" y="160" width="296" height="54" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="782" y="181.96" font-size="14" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="782" dy="0">El mensaje se conserva mientras</tspan></text><text x="782" y="199.88" font-size="14" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="782" dy="0">dure la retención</tspan></text><polyline points="782,214 706,252" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="634" y="252" width="144" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="706" y="270" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="706" dy="0">Grupo 1 (se</tspan></text><text x="706" y="286.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="706" dy="0">reparte)</tspan></text><text x="706" y="303.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="706" dy="0">3 000 mensajes</tspan></text><polyline points="782,214 858,252" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="786" y="252" width="144" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="858" y="270" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="858" dy="0">Grupo 2 (lee</tspan></text><text x="858" y="286.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="858" dy="0">todo)</tspan></text><text x="858" y="303.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="858" dy="0">3 000 mensajes</tspan></text><rect x="634" y="336" width="296" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><text x="782" y="361.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">Suscriptor tardío: lee 3 000 desde el</tspan></text><text x="782" y="377.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">desplazamiento 0</tspan></text><rect x="634" y="406" width="296" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="782" y="431.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="782" dy="0">Reprocesar los últimos 500: 500, se</tspan></text><text x="782" y="447.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="782" dy="0">reposiciona el desplazamiento</tspan></text></svg>
