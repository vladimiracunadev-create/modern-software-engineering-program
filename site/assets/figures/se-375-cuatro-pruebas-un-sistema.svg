<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 586" width="940" height="586" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Rampa de estrés sobre el sistema sintético: percentil 95 según la carga (4 servidores, capacidad nominal de 80 req/s)</title><desc id="d">Líneas con el percentil 95 según la carga ofrecida: la prueba de carga estable a 60 solicitudes por segundo da 202 milisegundos, y la rampa de estrés da 288 a 68, 357 a 77 y 1 718 a 86 solicitudes por segundo con 32,7 por ciento de fallos, por encima de la capacidad nominal de 80; el codo está entre 68 y 86 y la carga estable no lo muestra.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="586" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Rampa de estrés sobre el sistema sintético: percentil 95 según la carga (4 servidores, capacidad nominal de</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">80 req/s)</tspan></text><circle cx="22" cy="70" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Rampa de estrés</tspan></text><rect x="177.1" y="64" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="197.1" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="197.1" dy="0">Carga estable a 60 req/s</tspan></text><line x1="101.24" y1="386" x2="910" y2="386" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="386" x2="101.24" y2="386" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="390.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">100</tspan></text><line x1="101.24" y1="246" x2="910" y2="246" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="246" x2="101.24" y2="246" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="250.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">1 000</tspan></text><line x1="101.24" y1="106" x2="910" y2="106" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="106" x2="101.24" y2="106" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">10 000</tspan></text><line x1="101.24" y1="106" x2="101.24" y2="386" stroke="#5b7280" stroke-width="1.6"/><line x1="119.24" y1="106" x2="119.24" y2="386" stroke="#d5dde1" stroke-width="1"/><line x1="119.24" y1="386" x2="119.24" y2="391" stroke="#5b7280" stroke-width="1.4"/><text x="119.24" y="407" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="119.24" dy="0">60</tspan></text><line x1="357.012" y1="106" x2="357.012" y2="386" stroke="#d5dde1" stroke-width="1"/><line x1="357.012" y1="386" x2="357.012" y2="391" stroke="#5b7280" stroke-width="1.4"/><text x="357.012" y="407" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357.012" dy="0">68</tspan></text><line x1="624.506" y1="106" x2="624.506" y2="386" stroke="#d5dde1" stroke-width="1"/><line x1="624.506" y1="386" x2="624.506" y2="391" stroke="#5b7280" stroke-width="1.4"/><text x="624.506" y="407" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="624.506" dy="0">77</tspan></text><line x1="892" y1="106" x2="892" y2="386" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="386" x2="892" y2="391" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="407" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">86</tspan></text><line x1="101.24" y1="386" x2="910" y2="386" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 246)">p95 (ms) (escala logarítmica)</text><text x="505.62" y="432" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="505.62" dy="0">Solicitudes por segundo ofrecidas</tspan></text><line x1="713.671" y1="106" x2="713.671" y2="386" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="718.671" y="119" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14"><tspan x="718.671" dy="0">Capacidad nominal 80 req/s</tspan></text><polyline points="357.012,321.685 624.506,308.626 892,213.097" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="357.012" cy="321.685" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="357.012" y="310.685" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="357.012" dy="0">288 ms</tspan></text><circle cx="624.506" cy="308.626" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="624.506" y="297.626" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="624.506" dy="0">357 ms</tspan></text><circle cx="892" cy="213.097" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="882" y="217.597" font-size="13" text-anchor="end" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="882" dy="0">1 718 ms · 32,7 % fallos</tspan></text><polyline points="119.24,343.251" fill="none" stroke="#087f8c" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="113.74" y="337.751" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="119.24" y="367.251" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="119.24" dy="0">202 ms</tspan></text><rect x="10" y="446" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="470.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cada forma de carga responde a una pregunta distinta y ninguna sustituye a otra: la carga estable no dice dónde está el</tspan></text><text x="470" y="487.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">límite; el pico de 20 s a 240 req/s deja 165 s de recuperación y la fuga de una conexión cada 5 000 solicitudes solo agota</tspan></text><text x="470" y="504.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">el pool a los 67 min. El colapso de la rampa (100 % de fallos después) no es un defecto del algoritmo de cola: el servidor</tspan></text><text x="470" y="520.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">sigue atendiendo solicitudes cuyo cliente ya se rindió a los 2 s.</tspan></text><text x="470" y="568.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
