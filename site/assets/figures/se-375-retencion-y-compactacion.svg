<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 450" width="940" height="450" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reconstruir el estado desde el log: 100 000 eventos sobre 2 000 claves con 5 % de borrados</title><desc id="d">Barras horizontales en escala logarítmica con las entradas que guarda cada estrategia y las claves vivas que reconstruye: el log completo guarda 100 000 y reconstruye 1 891; conservar los últimos 20 000 eventos reconstruye 1 692 y pierde 199 claves; la compactación guarda 1 999 entradas y reconstruye las mismas 1 891.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="450" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Reconstruir el estado desde el log: 100 000 eventos sobre 2 000 claves con 5 % de borrados</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Entradas guardadas</tspan></text><rect x="199.72" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="219.72" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="219.72" dy="0">Claves vivas reconstruidas</tspan></text><line x1="294" y1="77" x2="294" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="269" x2="294" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">100</tspan></text><line x1="482.527" y1="77" x2="482.527" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="482.527" y1="269" x2="482.527" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="482.527" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482.527" dy="0">1 000</tspan></text><line x1="671.053" y1="77" x2="671.053" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="671.053" y1="269" x2="671.053" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="671.053" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="671.053" dy="0">10 000</tspan></text><line x1="859.58" y1="77" x2="859.58" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="859.58" y1="269" x2="859.58" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="859.58" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="859.58" dy="0">100 000</tspan></text><line x1="294" y1="269" x2="859.58" y2="269" stroke="#5b7280" stroke-width="1.6"/><text x="284" y="113.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Log completo</tspan></text><text x="284" y="169" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Retención de los últimos 20 000</tspan></text><text x="284" y="186" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">eventos</tspan></text><text x="284" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Compactación (último valor por clave)</tspan></text><rect x="294" y="83" width="565.58" height="24.5" rx="3" fill="#102a43"/><text x="866.58" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="866.58" dy="0">100 000</tspan></text><rect x="294" y="110.5" width="240.69" height="24.5" rx="3" fill="#087f8c"/><text x="541.69" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="541.69" dy="0">1 891</tspan></text><rect x="294" y="147" width="433.806" height="24.5" rx="3" fill="#102a43"/><text x="734.806" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="734.806" dy="0">20 000</tspan></text><rect x="294" y="174.5" width="231.586" height="24.5" rx="3" fill="#087f8c"/><text x="532.586" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="532.586" dy="0">1 692</tspan></text><rect x="294" y="211" width="245.238" height="24.5" rx="3" fill="#102a43"/><text x="546.238" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="546.238" dy="0">1 999</tspan></text><rect x="294" y="238.5" width="240.69" height="24.5" rx="3" fill="#087f8c"/><text x="541.69" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="541.69" dy="0">1 891</tspan></text><text x="576.79" y="313" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="576.79" dy="0">Cantidad (escala logarítmica)</tspan></text><rect x="10" y="327" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="351.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">La retención por tiempo o tamaño sirve para eventos; para reconstruir un estado hace falta compactar: las claves vivas</tspan></text><text x="470" y="368.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">reales son 1 891 y la ventana pierde 199 que no cambiaron en ella, sin devolver nunca un valor equivocado. Datos sintéticos</tspan></text><text x="470" y="385.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">con popularidad Zipf de exponente 1,0.</tspan></text><text x="470" y="432.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; CPython 3.12 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
