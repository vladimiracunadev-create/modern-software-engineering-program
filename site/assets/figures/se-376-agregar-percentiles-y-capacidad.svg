<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 587" width="960" height="587" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Agregar percentiles de 8 servidores y planificar la capacidad con un objetivo de cola</title><desc id="d">Tabla: promediar los percentiles 99 de ocho servidores da 345 milisegundos, el promedio ponderado 262, el máximo 983 y el percentil 99 de las muestras unidas 323; planificar 1 000 solicitudes por segundo con un objetivo de percentil 99 de 300 milisegundos exige 216 servidores al 23 por ciento de utilización, frente a 63 al planificar con la media al 80 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="587" fill="#ffffff"/><rect x="10" y="12" width="334" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="177" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="177" dy="0">Cálculo</tspan></text><rect x="350" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="512" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="512" dy="0">Resultado</tspan></text><rect x="680" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="812" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="812" dy="0">Lectura</tspan></text><rect x="10" y="56" width="334" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="177" y="83.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177" dy="0">Promedio simple de los 8 p99</tspan></text><rect x="350" y="56" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="83.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">345 ms</tspan></text><rect x="680" y="56" width="264" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="75.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">Mezcla servidores con 12 000 y con 1</tspan></text><text x="812" y="91.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">000 peticiones</tspan></text><rect x="10" y="110" width="334" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="177" y="137.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177" dy="0">Promedio ponderado por peticiones</tspan></text><rect x="350" y="110" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="137.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">262 ms</tspan></text><rect x="680" y="110" width="264" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="137.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">Mejor, pero no es un percentil</tspan></text><rect x="10" y="164" width="334" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="177" y="191.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177" dy="0">Máximo de los 8 p99</tspan></text><rect x="350" y="164" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">983 ms</tspan></text><rect x="680" y="164" width="264" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">Cota, no valor</tspan></text><rect x="10" y="218" width="334" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="177" y="245.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177" dy="0">p99 de las muestras unidas</tspan></text><rect x="350" y="218" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="245.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">323 ms</tspan></text><rect x="680" y="218" width="264" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="245.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">El único resultado correcto</tspan></text><rect x="10" y="272" width="334" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="177" y="299.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177" dy="0">Objetivo p99 ≤ 300 ms, cola M/M/1</tspan></text><rect x="350" y="272" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="291.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">23 % de utilización; 216 servidores para 1</tspan></text><text x="512" y="307.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">000 req/s</tspan></text><rect x="680" y="272" width="264" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="291.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">Planificar con la media (80 %) da 63</tspan></text><text x="812" y="307.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">servidores</tspan></text><rect x="10" y="326" width="334" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="177" y="353.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177" dy="0">Objetivo p99 ≤ 500 ms</tspan></text><rect x="350" y="326" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="353.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">54 %; 93 servidores</tspan></text><rect x="680" y="326" width="264" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><rect x="10" y="380" width="334" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="177" y="407.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177" dy="0">Objetivo p99 ≤ 1 s</tspan></text><rect x="350" y="380" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="407.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">77 %; 65 servidores</tspan></text><rect x="680" y="380" width="264" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><rect x="10" y="434" width="334" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="177" y="461.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177" dy="0">Objetivo p99 ≤ 2 s</tspan></text><rect x="350" y="434" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="461.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">88 %; 57 servidores</tspan></text><rect x="680" y="434" width="264" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><rect x="10" y="492" width="940" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="516.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Un servidor lento con poco tráfico (983 ms con 1 000 peticiones) mueve el promedio simple 22 ms por encima del p99 real. Y</tspan></text><text x="480" y="533.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">exigir un percentil, no una media, multiplica por 3,4 la flota: la elección del estadístico es una decisión de costo.</tspan></text><text x="480" y="573.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
