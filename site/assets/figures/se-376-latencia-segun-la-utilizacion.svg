<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una cola M/M/1 de 50 ms de servicio medio: latencia simulada frente a teoría según la utilización</title><desc id="d">Líneas en escala logarítmica con la latencia media y el percentil 99 simulados y teóricos según la utilización: la media simulada pasa de 99 milisegundos al 50 por ciento a 481 al 90 y 6 115 al 99, y el percentil 99 de 454 a 2 098 y 24 286; simulación y teoría coinciden entre el 50 y el 80 por ciento y se separan al 90, 95 y 99.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Una cola M/M/1 de 50 ms de servicio medio: latencia simulada frente a teoría según la utilización</tspan></text><circle cx="22" cy="51" r="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Media simulada</tspan></text><rect x="169.56" y="45" width="12" height="12" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><text x="189.56" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="189.56" dy="0">Media teórica</tspan></text><polygon points="321.58,44.1 328.18,56.4 314.98,56.4" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="335.58" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="335.58" dy="0">p99 simulado</tspan></text><p