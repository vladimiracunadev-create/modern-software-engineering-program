dth="1.4"/><text x="439.115" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="439.115" dy="0">70</tspan></text><line x1="595.282" y1="87" x2="595.282" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="595.282" y1="387" x2="595.282" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="595.282" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="595.282" dy="0">80</tspan></text><line x1="751.449" y1="87" x2="751.449" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="751.449" y1="387" x2="751.449" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="751.449" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="751.449" dy="0">90</tspan></text><line x1="829.533" y1="87" x2="829.533" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="829.533" y1="387" x2="829.533" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="829.533" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="829.533" dy="0">95</tspan></text><line x1="892" y1="87" x2="892" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="387" x2="892" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">99</tspan></text><line x1="108.78" y1="387" x2="910" y2="387" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 237)">Latencia (ms) (escala logarítmica)</text><text x="509.39" y="433" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="509.39" dy="0">Utilización del servidor (%)</tspan></text><polyline points="126.78,387 439.115,365.252 595.282,347.906 751.449,318.785 829.533,288.189 892,208.36" fill="none" stroke="#087f8c" stroke-width="2.4"/><circle cx="126.78" cy="387" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><circle cx="439.115" cy="365.252" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><circle cx="595.282" cy="347.906" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><circle cx="751.449" cy="318.785" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><circle cx="829.533" cy="288.189" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><circle cx="892" cy="208.36" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polyline points="126.78,387 439.115,364.728 595.282,347.206 751.449,317.103 829.533,287 892,217.103" fill="none" stroke="#6b7c86" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="121.28" y="381.5" width="11" height="11" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><rect x="433.615" y="359.228" width="11" height="11" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><rect x="589.782" y="341.706" width="11" height="11" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><rect x="745.949" y="311.603" width="11" height="11" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><rect x="824.033" y="281.5" width="11" height="11" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><rect x="886.5" y="211.603" width="11" height="11" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><polyline points="126.78,321.294 439.115,299.263 595.282,281.615 751.449,254.819 829.533,225.038 892,148.464" fill="none" stroke="#c0432f" stroke-width="2.4"/><polygon points="126.78,314.969 132.83,326.244 120.73,326.244" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><polygon points="439.115,292.938 445.165,304.213 433.065,304.213" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><polygon points="595.282,275.29 601.332,286.565 589.232,286.565" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><polygon points="751.449,248.494 757.499,259.769 745.399,259.769" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><polygon points="829.533,218.713 835.583,229.988 823.483,229.988" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><polygon points="892,142.139 898.05,153.414 885.95,153.414" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><polyline points="126.78,320.63 439.115,298.464 595.282,280.892 751.449,250.771 829.533,220.677 892,150.778" fill="none" stroke="#946512" stroke-width="2.4" stroke-dasharray="7 4"/><polygon points="126.78,313.755 133.655,320.63 126.78,327.505 119.905,320.63" fill="#946512" stroke="#946512" stroke-width="2"/><polygon points="439.115,291.589 445.99,298.464 439.115,305.339 432.24,298.464" fill="#946512" stroke="#946512" stroke-width="2"/><polygon points="595.282,274.017 602.157,280.892 595.282,287.767 588.407,280.892" fill="#946512" stroke="#946512" stroke-width="2"/><polygon points="751.449,243.896 758.324,250.771 751.449,257.646 744.574,250.771" fill="#946512" stroke="#946512" stroke-width="2"/><polygon points="829.533,213.802 836.408,220.677 829.533,227.552 822.658,220.677" fill="#946512" stroke="#946512" stroke-width="2"/><polygon points="892,143.903 898.875,150.778 892,157.653 885.125,150.778" fill="#946512" stroke="#946512" stroke-width="2"/><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El crecimiento no es lineal: del 90 al 99 % la media se multiplica por 12. La simulación de 400 000 llegadas se aparta de</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">la teoría cerca del 100 % porque el régimen estable tarda mucho en alcanzarse; 400 000 llegadas no bastan al 99 %. Con</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">llegadas de Poisson y servicio exponencial; un sistema real no cumple ninguna de las dos.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
