<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 403" width="940" height="403" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mismo promedio de servicio (50 ms) y misma utilización (80 %) con cuatro formas de variabilidad</title><desc id="d">Tabla: con la misma utilización del 80 por ciento y el mismo servicio medio, la espera media pasa de 101 milisegundos con servicio constante a 203 con exponencial, 502 con lognormal y 1 364 con una mezcla de 95 por ciento rápida y 5 por ciento lenta; la ley de Little se cumple en los cuatro casos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="403" fill="#ffffff"/><rect x="10" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="157" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="157" dy="0">Distribución del servicio</tspan></text><rect x="310" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="367" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="367" dy="0">cv²</tspan></text><text x="367" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="367" dy="0">observado</tspan></text><rect x="430" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="542" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="542" dy="0">Espera media simulada /</tspan></text><text x="542" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="542" dy="0">teoría</tspan></text><rect x="660" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="722" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="722" dy="0">p99 de la</tspan></text><text x="722" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="722" dy="0">latencia</tspan></text><rect x="790" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="857" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="857" dy="0">L / λ·W</tspan></text><rect x="10" y="56" width="294" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="85.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Determinista (cv² = 0)</tspan></text><rect x="310" y="56" width="114" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="367" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="367" dy="0">0,00</tspan></text><rect x="430" y="56" width="224" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">101 / 100 ms</tspan></text><rect x="660" y="56" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">573 ms</tspan></text><rect x="790" y="56" width="134" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="857" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">2,42 / 2,42</tspan></text><rect x="10" y="114" width="294" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="143.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Exponencial (cv² = 1)</tspan></text><rect x="310" y="114" width="114" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="367" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="367" dy="0">1,00</tspan></text><rect x="430" y="114" width="224" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">203 / 200 ms</tspan></text><rect x="660" y="114" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">1 160 ms</tspan></text><rect x="790" y="114" width="134" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="857" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">4,06 / 4,06</tspan></text><rect x="10" y="172" width="294" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="201.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Lognormal (cv² = 4)</tspan></text><rect x="310" y="172" width="114" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="367" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="367" dy="0">3,94</tspan></text><rect x="430" y="172" width="224" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">502 / 495 ms</tspan></text><rect x="660" y="172" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">3 617 ms</tspan></text><rect x="790" y="172" width="134" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="857" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">8,85 / 8,85</tspan></text><rect x="10" y="230" width="294" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="259.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Bimodal: 95 % 10 ms y 5 % 810 ms</tspan></text><rect x="310" y="230" width="114" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="367" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="367" dy="0">12,13</tspan></text><rect x="430" y="230" width="224" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">1 364 / 1 317 ms</tspan></text><rect x="660" y="230" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">7 053 ms</tspan></text><rect x="790" y="230" width="134" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="857" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">22,67 / 22,67</tspan></text><rect x="10" y="292" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="316.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">La fórmula de Pollaczek–Khinchine acierta y dice lo importante: la espera crece con (1 + cv²). Con un 5 % de solicitudes</tspan></text><text x="470" y="333.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">lentas el sistema espera 13 veces más que con servicio constante, aunque el promedio no cambie. La ley de Little es una</tspan></text><text x="470" y="350.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">identidad: sirve para detectar una instrumentación inconsistente, no para predecir.</tspan></text><text x="470" y="389.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
