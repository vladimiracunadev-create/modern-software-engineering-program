<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 628" width="940" height="628" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La misma función (ordenar 20 000 enteros) medida 30 veces en cinco procesos nuevos de Windows 11</title><desc id="d">Intervalos con el mínimo, la mediana y el máximo de 30 mediciones por proceso: las medianas van de 5,49 a 11,04 milisegundos, una razón de 2,01 entre procesos, y el máximo supera de 1,66 a 3,03 veces el mínimo dentro de cada uno; el proceso 3 tiene la mediana más alta y el 1 el máximo de 18,06.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="628" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">La misma función (ordenar 20 000 enteros) medida 30 veces en cinco procesos nuevos de Windows 11</tspan></text><rect x="16" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">mínimo</tspan></text><polygon points="115.24,44.1 121.84,56.4 108.64,56.4" fill="#946512" stroke="#946512" stroke-width="2"/><text x="129.24" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="129.24" dy="0">mediana</tspan></text><polygon points="216.02,43.5 223.52,51 216.02,58.5 208.52,51" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="230.02" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="230.02" dy="0">máximo</tspan></text><line x1="164" y1="77" x2="164" y2="447" stroke="#d5dde1" stroke-width="1"/><line x1="164" y1="447" x2="164" y2="452" stroke="#5b7280" stroke-width="1.4"/><text x="164" y="468" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="164" dy="0">0</tspan></text><line x1="345.5" y1="77" x2="345.5" y2="447" stroke="#d5dde1" stroke-width="1"/><line x1="345.5" y1="447" x2="345.5" y2="452" stroke="#5b7280" stroke-width="1.4"/><text x="345.5" y="468" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="345.5" dy="0">5</tspan></text><line x1="527" y1="77" x2="527" y2="447" stroke="#d5dde1" stroke-width="1"/><line x1="527" y1="447" x2="527" y2="452" stroke="#5b7280" stroke-width="1.4"/><text x="527" y="468" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">10</tspan></text><line x1="708.5" y1="77" x2="708.5" y2="447" stroke="#d5dde1" stroke-width="1"/><line x1="708.5" y1="447" x2="708.5" y2="452" stroke="#5b7280" stroke-width="1.4"/><text x="708.5" y="468" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="708.5" dy="0">15</tspan></text><line x1="890" y1="77" x2="890" y2="447" stroke="#d5dde1" stroke-width="1"/><line x1="890" y1="447" x2="890" y2="452" stroke="#5b7280" stroke-width="1.4"/><text x="890" y="468" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="890" dy="0">20</tspan></text><line x1="164" y1="447" x2="890" y2="447" stroke="#5b7280" stroke-width="1.6"/><text x="134" y="118.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="134" dy="0">Proceso 1</tspan></text><text x="134" y="192.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="134" dy="0">Proceso 2</tspan></text><text x="134" y="266.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="134" dy="0">Proceso 3</tspan></text><text x="134" y="340.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="134" dy="0">Proceso 4</tspan></text><text x="134" y="414.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="134" dy="0">Proceso 5</tspan></text><line x1="380.711" y1="114" x2="819.578" y2="114" stroke="#8a9aa3" stroke-width="5"/><rect x="373.711" y="107" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="380.711" y="98" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="380.711" dy="0">5,97</tspan></text><polygon points="421.73,105.95 429.43,120.3 414.03,120.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="421.73" y="143" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="421.73" dy="0">7,10</tspan></text><polygon points="819.578,105.25 828.328,114 819.578,122.75 810.828,114" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="819.578" y="98" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="819.578" dy="0">18,06</tspan></text><line x1="381.8" y1="188" x2="580.724" y2="188" stroke="#8a9aa3" stroke-width="5"/><rect x="374.8" y="181" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="381.8" y="172" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="381.8" dy="0">6,00</tspan></text><polygon points="422.093,179.95 429.793,194.3 414.393,194.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="422.093" y="217" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="422.093" dy="0">7,11</tspan></text><polygon points="580.724,179.25 589.474,188 580.724,196.75 571.974,188" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="580.724" y="172" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="580.724" dy="0">11,48</tspan></text><line x1="372.725" y1="262" x2="721.931" y2="262" stroke="#8a9aa3" stroke-width="5"/><rect x="365.725" y="255" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="372.725" y="246" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="372.725" dy="0">5,75</tspan></text><polygon points="564.752,253.95 572.452,268.3 557.052,268.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="564.752" y="291" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="564.752" dy="0">11,04</tspan></text><polygon points="721.931,253.25 730.681,262 721.931,270.75 713.181,262" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="721.931" y="246" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="721.931" dy="0">15,37</tspan></text><line x1="311.378" y1="336" x2="436.976" y2="336" stroke="#8a9aa3" stroke-width="5"/><rect x="304.378" y="329" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="311.378" y="320" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="311.378" dy="0">4,06</tspan></text><polygon points="371.999,327.95 379.699,342.3 364.299,342.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="371.999" y="365" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="371.999" dy="0">5,73</tspan></text><polygon points="436.976,327.25 445.726,336 436.976,344.75 428.226,336" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="436.976" y="320" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="436.976" dy="0">7,52</tspan></text><line x1="303.755" y1="410" x2="397.046" y2="410" stroke="#8a9aa3" stroke-width="5"/><rect x="296.755" y="403" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="303.755" y="394" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="303.755" dy="0">3,85</tspan></text><polygon points="363.287,401.95 370.987,416.3 355.587,416.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="363.287" y="439" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="363.287" dy="0">5,49</tspan></text><polygon points="397.046,401.25 405.796,410 397.046,418.75 388.296,410" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="397.046" y="394" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="397.046" dy="0">6,42</tspan></text><text x="527" y="491" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="527" dy="0">Milisegundos (ms)</tspan></text><rect x="10" y="505" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="529.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">La variación entre procesos (medianas con razón 2,01) supera a la variación que una mejora típica querría detectar. En</tspan></text><text x="470" y="546.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Ubuntu las medianas de cinco procesos van de 3,97 a 5,18 ms. Ninguna de estas cifras es reproducible al milisegundo; sí lo</tspan></text><text x="470" y="563.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">es la conclusión de que una sola medición no basta. Equipo, versión y carga de fondo del sistema no se controlaron.</tspan></text><text x="470" y="610.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido en Windows 11 (CPython 3.12.9) y Ubuntu bajo WSL2 (3.12.3); los tiempos de reloj cambian de equipo en equipo.</tspan></text></svg>
