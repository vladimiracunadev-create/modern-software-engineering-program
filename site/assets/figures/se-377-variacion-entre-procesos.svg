y="0">Ubuntu (WSL2), 5 procesos</tspan></text><rect x="300" y="316" width="114" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="357" y="342.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">—</tspan></text><rect x="420" y="316" width="124" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="342.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">3,67 – 3,83</tspan></text><rect x="550" y="316" width="124" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="612" y="342.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612" dy="0">3,97 – 5,18</tspan></text><rect x="680" y="316" width="124" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="342.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">5,16 – 7,01</tspan></text><rect x="810" y="316" width="114" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="342.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">1,35 – 1,85</tspan></text><rect x="10" y="372" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="396.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">La variación entre procesos (medianas con razón 2,01) supera a la variación que una mejora típica querría detectar. Ninguna</tspan></text><text x="470" y="413.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">de estas cifras es reproducible al milisegundo; sí lo es la conclusión de que una sola medición no basta. Equipo, versión y</tspan></text><text x="470" y="430.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">carga de fondo del sistema no se controlaron.</tspan></text><text x="470" y="469.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido en Windows 11 (CPython 3.12.9) y Ubuntu bajo WSL2 (3.12.3); los tiempos de reloj cambian de equipo en equipo.</tspan></text></svg>
