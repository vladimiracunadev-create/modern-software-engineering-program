<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 528" width="940" height="528" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Réplica tras 2 000 operaciones sobre 10 000 filas (origen: 10 195 filas)</title><desc id="d">Barras horizontales con las filas faltantes, desactualizadas y que debían borrarse según el método de detección: sondear con mayor estricto deja 11, 50 y 194; con mayor o igual 0, 0 y 194; un registro de cambios con disparadores deja 0, 0 y 0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="528" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Réplica tras 2 000 operaciones sobre 10 000 filas (origen: 10 195 filas)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Filas faltantes</tspan></text><rect x="177.1" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="197.1" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="197.1" dy="0">Filas desactualizadas</tspan></text><rect x="383.44" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="403.44" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="403.44" dy="0">Filas que debían borrarse</tspan></text><line x1="324" y1="77" x2="324" y2="347" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="347" x2="324" y2="352" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="465.955" y1="77" x2="465.955" y2="347" stroke="#d5dde1" stroke-width="1"/><line x1="465.955" y1="347" x2="465.955" y2="352" stroke="#5b7280" stroke-width="1.4"/><text x="465.955" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="465.955" dy="0">50</tspan></text><line x1="607.91" y1="77" x2="607.91" y2="347" stroke="#d5dde1" stroke-width="1"/><line x1="607.91" y1="347" x2="607.91" y2="352" stroke="#5b7280" stroke-width="1.4"/><text x="607.91" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607.91" dy="0">100</tspan></text><line x1="749.865" y1="77" x2="749.865" y2="347" stroke="#d5dde1" stroke-width="1"/><line x1="749.865" y1="347" x2="749.865" y2="352" stroke="#5b7280" stroke-width="1.4"/><text x="749.865" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="749.865" dy="0">150</tspan></text><line x1="891.82" y1="77" x2="891.82" y2="347" stroke="#d5dde1" stroke-width="1"/><line x1="891.82" y1="347" x2="891.82" y2="352" stroke="#5b7280" stroke-width="1.4"/><text x="891.82" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="891.82" dy="0">200</tspan></text><line x1="324" y1="347" x2="891.82" y2="347" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="126.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Sondeo por marca con mayor estricto (&gt;)</tspan></text><text x="314" y="216.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Sondeo con mayor o igual (&gt;=)</tspan></text><text x="314" y="306.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Registro de cambios con disparadores</tspan></text><rect x="324" y="83" width="31.2301" height="24" rx="3" fill="#c0432f"/><text x="362.23" y="99.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="362.23" dy="0">11</tspan></text><rect x="324" y="110" width="141.955" height="24" rx="3" fill="#946512"/><text x="472.955" y="126.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="472.955" dy="0">50</tspan></text><rect x="324" y="137" width="550.785" height="24" rx="3" fill="#102a43"/><text x="881.785" y="153.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="881.785" dy="0">194</tspan></text><rect x="324" y="173" width="2" height="24" rx="3" fill="#c0432f"/><text x="333" y="189.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">0</tspan></text><rect x="324" y="200" width="2" height="24" rx="3" fill="#946512"/><text x="333" y="216.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">0</tspan></text><rect x="324" y="227" width="550.785" height="24" rx="3" fill="#102a43"/><text x="881.785" y="243.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="881.785" dy="0">194</tspan></text><rect x="324" y="263" width="2" height="24" rx="3" fill="#c0432f"/><text x="333" y="279.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">0</tspan></text><rect x="324" y="290" width="2" height="24" rx="3" fill="#946512"/><text x="333" y="306.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">0</tspan></text><rect x="324" y="317" width="2" height="24" rx="3" fill="#102a43"/><text x="333" y="333.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">0</tspan></text><text x="607.91" y="391" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="607.91" dy="0">Filas de la réplica que difieren del origen</tspan></text><rect x="10" y="405" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="429.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Sondear por marca no puede ver un borrado: la fila ya no está para devolver su marca. El mayor estricto además pierde las</tspan></text><text x="470" y="446.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">filas modificadas en el mismo segundo que la marca. La resolución de un segundo con 5 operaciones por segundo y el sondeo</tspan></text><text x="470" y="463.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">cada 47 operaciones son supuestos del autor.</tspan></text><text x="470" y="510.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; CPython 3.12 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
