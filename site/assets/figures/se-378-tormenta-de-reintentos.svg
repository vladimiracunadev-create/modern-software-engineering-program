<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 638" width="960" height="638" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reintentos tras un brownout de 10 s y tras una oleada sincronizada de 400 clientes (10 semillas cada caso)</title><desc id="d">Tabla: en un brownout de 10 segundos con timeout de 1 segundo, el reintento inmediato, el exponencial y el jitter completo llevan el pico de 70 a unas 234 solicitudes por segundo y las diez semillas colapsan, con 94 por ciento del trabajo del servidor hecho para clientes que ya se fueron; un presupuesto de reintentos del 10 por ciento evita el colapso. En una oleada sincronizada el jitter reduce el pico de reintentos de 332 a 143 por cada 100 milisegundos pero las diez semillas entran en sobrecarga sostenida.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="638" fill="#ffffff"/><rect x="10" y="12" width="364" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="192" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="192" dy="0">Escenario y política</tspan></text><rect x="380" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="462" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="462" dy="0">Pico de carga</tspan></text><rect x="550" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="612" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="612" dy="0">Intentos por</tspan></text><text x="612" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="612" dy="0">solicitud</tspan></text><rect x="680" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="747" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="747" dy="0">Semillas que</tspan></text><text x="747" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="747" dy="0">colapsan</tspan></text><rect x="820" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="882" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="882" dy="0">Trabajo inútil</tspan></text><rect x="10" y="56" width="364" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="81.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Brownout de 10 s: sin reintentos</tspan></text><rect x="380" y="56" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">70 req/s</tspan></text><rect x="550" y="56" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="612" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612" dy="0">1,00</tspan></text><rect x="680" y="56" width="134" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">0 de 10</tspan></text><rect x="820" y="56" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="882" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">15 %</tspan></text><rect x="10" y="106" width="364" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="131.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Brownout: reintento inmediato</tspan></text><rect x="380" y="106" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">235 req/s</tspan></text><rect x="550" y="106" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="612" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612" dy="0">3,38</tspan></text><rect x="680" y="106" width="134" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">10 de 10</tspan></text><rect x="820" y="106" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="882" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">94 %</tspan></text><rect x="10" y="156" width="364" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="181.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Brownout: retardo exponencial</tspan></text><rect x="380" y="156" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">232 req/s</tspan></text><rect x="550" y="156" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="612" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612" dy="0">3,38</tspan></text><rect x="680" y="156" width="134" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">10 de 10</tspan></text><rect x="820" y="156" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="882" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">94 %</tspan></text><rect x="10" y="206" width="364" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="231.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Brownout: exponencial con jitter completo</tspan></text><rect x="380" y="206" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">234 req/s</tspan></text><rect x="550" y="206" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="612" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612" dy="0">3,38</tspan></text><rect x="680" y="206" width="134" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">10 de 10</tspan></text><rect x="820" y="206" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="882" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">94 %</tspan></text><rect x="10" y="256" width="364" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="281.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Brownout: jitter y presupuesto del 10 %</tspan></text><rect x="380" y="256" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="281.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">88 req/s</tspan></text><rect x="550" y="256" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="612" y="281.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612" dy="0">1,01</tspan></text><rect x="680" y="256" width="134" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="281.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">0 de 10</tspan></text><rect x="820" y="256" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="882" y="281.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">19 %</tspan></text><rect x="10" y="306" width="364" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="331.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Oleada de 400 clientes: sin reintentos</tspan></text><rect x="380" y="306" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="331.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">14 por 100 ms</tspan></text><rect x="550" y="306" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="612" y="331.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612" dy="0">1,00</tspan></text><rect x="680" y="306" width="134" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="331.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">0 de 10</tspan></text><rect x="820" y="306" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="882" y="331.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">0 %</tspan></text><rect x="10" y="356" width="364" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="381.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Oleada: reintento inmediato</tspan></text><rect x="380" y="356" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="381.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">333 por 100 ms</tspan></text><rect x="550" y="356" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="612" y="381.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612" dy="0">1,12</tspan></text><rect x="680" y="356" width="134" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="381.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">0 de 10</tspan></text><rect x="820" y="356" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="882" y="381.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">2 %</tspan></text><rect x="10" y="406" width="364" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="431.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Oleada: retardo exponencial</tspan></text><rect x="380" y="406" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="431.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">332 por 100 ms</tspan></text><rect x="550" y="406" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="612" y="431.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612" dy="0">1,11</tspan></text><rect x="680" y="406" width="134" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="431.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">0 de 10</tspan></text><rect x="820" y="406" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="882" y="431.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">1 %</tspan></text><rect x="10" y="456" width="364" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="481.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Oleada: exponencial con jitter completo</tspan></text><rect x="380" y="456" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="462" y="481.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="462" dy="0">143 por 100 ms</tspan></text><rect x="550" y="456" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="612" y="481.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612" dy="0">2,53</tspan></text><rect x="680" y="456" width="134" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="481.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">10 de 10</tspan></text><rect x="820" y="456" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="882" y="481.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">67 %</tspan></text><rect x="10" y="510" width="940" height="92.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="534.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Tres políticas de espera distintas dan el mismo colapso porque el problema es la cantidad de trabajo, no su sincronización; lo</tspan></text><text x="480" y="551.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">evita el presupuesto. En la oleada el jitter aplana el pico pero reparte los reintentos de modo que muchos terminan justo</tspan></text><text x="480" y="568.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">después del timeout: 67 % del trabajo es inútil. Es un resultado de este modelo (el servidor solo descarta tras 1 s de</tspan></text><text x="480" y="584.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">espera), no una regla general.</tspan></text><text x="480" y="624.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
