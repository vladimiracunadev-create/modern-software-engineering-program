<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 379" width="940" height="379" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dos dependencias (A: 80 req/s de 50 ms; B: 20 req/s) y 20 trabajadores: solicitudes atendidas A / B</title><desc id="d">Tabla: con un pool compartido de 20 trabajadores y la dependencia B lenta, la A deja de atender el 25,7 por ciento de sus solicitudes; con pools separados A queda en 100 por ciento y B atiende entre 9,3 y 45 por ciento según su tamaño.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="379" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Reparto de trabajadores</tspan></text><rect x="340" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="487" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="487" dy="0">B sana (50 ms): A / B</tspan></text><rect x="640" y="12" width="284" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="782" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="782" dy="0">B lenta (1 s): A / B</tspan></text><rect x="10" y="56" width="324" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Un pool compartido de 20</tspan></text><rect x="340" y="56" width="294" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="84.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">100,0 % / 100,0 %</tspan></text><rect x="640" y="56" width="284" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="84.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">74,3 % / 73,6 %</tspan></text><rect x="10" y="112" width="324" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="140.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">A 15 y B 5</tspan></text><rect x="340" y="112" width="294" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="140.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">100,0 % / 99,6 %</tspan></text><rect x="640" y="112" width="284" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="140.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">100,0 % / 23,1 %</tspan></text><rect x="10" y="168" width="324" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="196.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">A 10 y B 10</tspan></text><rect x="340" y="168" width="294" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="196.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">99,5 % / 100,0 %</tspan></text><rect x="640" y="168" width="284" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="196.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">99,6 % / 45,0 %</tspan></text><rect x="10" y="224" width="324" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="252.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">A 18 y B 2</tspan></text><rect x="340" y="224" width="294" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="252.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">100,0 % / 79,6 %</tspan></text><rect x="640" y="224" width="284" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="252.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">100,0 % / 9,3 %</tspan></text><rect x="10" y="284" width="920" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="308.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">El mamparo no arregla B: lo confina. Cuesta capacidad ociosa (con B sana, 18 + 2 rechaza el 20 % de B) y exige dimensionar</tspan></text><text x="470" y="325.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">cada compartimento. A 10 y B 10 protege a A y deja a B en 45 %, y no existe un reparto que dé lo mejor a ambos.</tspan></text><text x="470" y="365.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
