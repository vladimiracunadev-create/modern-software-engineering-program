<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 425" width="940" height="425" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Disponibilidad simulada durante 400 años: minutos de caída al año según la arquitectura y la causa común de fallo</title><desc id="d">Barras horizontales con los minutos de caída al año: un componente 529, tres componentes en serie 1 574, dos réplicas de la aplicación 1 044 y dos réplicas con cuatro despliegues malos al año 1 282; la réplica mejora de 99,70 a 99,80 por ciento de disponibilidad y la causa común la baja a 99,756.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="425" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Disponibilidad simulada durante 400 años: minutos de caída al año según la arquitectura y la causa común de</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">fallo</tspan></text><line x1="324" y1="68" x2="324" y2="244" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="244" x2="324" y2="249" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="265" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="461.925" y1="68" x2="461.925" y2="244" stroke="#d5dde1" stroke-width="1"/><line x1="461.925" y1="244" x2="461.925" y2="249" stroke="#5b7280" stroke-width="1.4"/><text x="461.925" y="265" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="461.925" dy="0">500</tspan></text><line x1="599.85" y1="68" x2="599.85" y2="244" stroke="#d5dde1" stroke-width="1"/><line x1="599.85" y1="244" x2="599.85" y2="249" stroke="#5b7280" stroke-width="1.4"/><text x="599.85" y="265" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="599.85" dy="0">1 000</tspan></text><line x1="737.775" y1="68" x2="737.775" y2="244" stroke="#d5dde1" stroke-width="1"/><line x1="737.775" y1="244" x2="737.775" y2="249" stroke="#5b7280" stroke-width="1.4"/><text x="737.775" y="265" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737.775" dy="0">1 500</tspan></text><line x1="875.7" y1="68" x2="875.7" y2="244" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="244" x2="875.7" y2="249" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="265" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">2 000</tspan></text><line x1="324" y1="244" x2="875.7" y2="244" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="94.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Un componente (MTBF 500 h, MTTR 0,5 h)</tspan></text><text x="314" y="138.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Serie: web, aplicación y base de datos</tspan></text><text x="314" y="174" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Dos réplicas independientes de la</tspan></text><text x="314" y="191" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">aplicación</tspan></text><text x="314" y="218" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Dos réplicas y 4 despliegues malos al año</tspan></text><text x="314" y="235" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">de 1 h</tspan></text><rect x="324" y="74" width="145.925" height="32" rx="3" fill="#102a43"/><text x="476.925" y="94.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="476.925" dy="0">529</tspan></text><rect x="324" y="118" width="434.188" height="32" rx="3" fill="#102a43"/><text x="765.188" y="138.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="765.188" dy="0">1 574</tspan></text><rect x="324" y="162" width="287.987" height="32" rx="3" fill="#102a43"/><text x="618.987" y="182.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="618.987" dy="0">1 044</tspan></text><rect x="324" y="206" width="353.64" height="32" rx="3" fill="#102a43"/><text x="684.64" y="226.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="684.64" dy="0">1 282</tspan></text><text x="599.85" y="288" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="599.85" dy="0">Minutos de caída al año</tspan></text><rect x="10" y="302" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="326.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La réplica de una capa mejora el 99,70 % a un 99,80 % y nada más: los otros dos tramos en serie mandan. La causa común es</tspan></text><text x="470" y="343.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">la que quita el beneficio: la aplicación con dos réplicas pasa de 0,9999996 a 0,99955. Los MTBF y MTTR son supuestos del</tspan></text><text x="470" y="360.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">autor y las caídas independientes son un modelo, no una medición.</tspan></text><text x="470" y="407.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
