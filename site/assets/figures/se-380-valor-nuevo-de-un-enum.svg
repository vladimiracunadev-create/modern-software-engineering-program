<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 618" width="940" height="618" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un estado nuevo aparece en 338 de 10 000 mensajes desde la mitad del flujo</title><desc id="d">Barras horizontales con los mensajes bloqueados, perdidos y procesados con el valor nuevo según la política del consumidor: lanzar una excepción bloquea 4 991; descartar pierde 338; sustituir por desconocido procesa los 338 sin su significado; conservar el valor y enviarlo a revisión procesa los 338 con su valor.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="618" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un estado nuevo aparece en 338 de 10 000 mensajes desde la mitad del flujo</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Mensajes bloqueados</tspan></text><rect x="207.26" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="227.26" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="227.26" dy="0">Mensajes perdidos</tspan></text><rect x="383.44" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="403.44" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="403.44" dy="0">Procesados con el valor nuevo</tspan></text><line x1="354" y1="77" x2="354" y2="437" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="437" x2="354" y2="442" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="458" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="458.34" y1="77" x2="458.34" y2="437" stroke="#d5dde1" stroke-width="1"/><line x1="458.34" y1="437" x2="458.34" y2="442" stroke="#5b7280" stroke-width="1.4"/><text x="458.34" y="458" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="458.34" dy="0">1 000</tspan></text><line x1="562.68" y1="77" x2="562.68" y2="437" stroke="#d5dde1" stroke-width="1"/><line x1="562.68" y1="437" x2="562.68" y2="442" stroke="#5b7280" stroke-width="1.4"/><text x="562.68" y="458" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562.68" dy="0">2 000</tspan></text><line x1="667.02" y1="77" x2="667.02" y2="437" stroke="#d5dde1" stroke-width="1"/><line x1="667.02" y1="437" x2="667.02" y2="442" stroke="#5b7280" stroke-width="1.4"/><text x="667.02" y="458" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667.02" dy="0">3 000</tspan></text><line x1="771.36" y1="77" x2="771.36" y2="437" stroke="#d5dde1" stroke-width="1"/><line x1="771.36" y1="437" x2="771.36" y2="442" stroke="#5b7280" stroke-width="1.4"/><text x="771.36" y="458" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="771.36" dy="0">4 000</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="437" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="437" x2="875.7" y2="442" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="458" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">5 000</tspan></text><line x1="354" y1="437" x2="875.7" y2="437" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="126.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Lanzar una excepción y reintentar sin fin</tspan></text><text x="344" y="216.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Descartar el valor desconocido</tspan></text><text x="344" y="298" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Sustituir por «desconocido» (sin su</tspan></text><text x="344" y="315" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">significado)</tspan></text><text x="344" y="388" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Conservar el valor y enviarlo a revisión (con</tspan></text><text x="344" y="405" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">su valor)</tspan></text><rect x="354" y="83" width="520.761" height="24" rx="3" fill="#c0432f"/><text x="881.761" y="99.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="881.761" dy="0">4 991</tspan></text><rect x="354" y="110" width="2" height="24" rx="3" fill="#946512"/><text x="363" y="126.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="137" width="2" height="24" rx="3" fill="#087f8c"/><text x="363" y="153.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="173" width="2" height="24" rx="3" fill="#c0432f"/><text x="363" y="189.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="200" width="35.2669" height="24" rx="3" fill="#946512"/><text x="396.267" y="216.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="396.267" dy="0">338</tspan></text><rect x="354" y="227" width="2" height="24" rx="3" fill="#087f8c"/><text x="363" y="243.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="263" width="2" height="24" rx="3" fill="#c0432f"/><text x="363" y="279.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="290" width="2" height="24" rx="3" fill="#946512"/><text x="363" y="306.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="317" width="35.2669" height="24" rx="3" fill="#087f8c"/><text x="396.267" y="333.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="396.267" dy="0">338</tspan></text><rect x="354" y="353" width="2" height="24" rx="3" fill="#c0432f"/><text x="363" y="369.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="380" width="2" height="24" rx="3" fill="#946512"/><text x="363" y="396.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="407" width="35.2669" height="24" rx="3" fill="#087f8c"/><text x="396.267" y="423.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="396.267" dy="0">338</tspan></text><text x="614.85" y="481" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="614.85" dy="0">Mensajes de 10 000</tspan></text><rect x="10" y="495" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="519.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Un valor nuevo de una enumeración es el cambio más común y el que más se subestima: la política por defecto del consumidor</tspan></text><text x="470" y="536.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">decide si es un incidente, una pérdida silenciosa o una tarea de revisión. 6 % de valores nuevos en la segunda mitad:</tspan></text><text x="470" y="553.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">supuesto del autor.</tspan></text><text x="470" y="600.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; CPython 3.12 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
