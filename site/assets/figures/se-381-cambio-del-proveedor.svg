<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" width="940" height="430" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un proveedor renombra un campo: qué falla sin y con capa anticorrupción</title><desc id="d">Diagrama de dos diseños cuando el proveedor renombra cod_alumno a alumno_id: sin capa, las seis funciones mencionan el nombre externo y las seis fallan; con capa, solo lo menciona el traductor, que falla con un error explícito, y las seis funciones siguen funcionando. Con datos en el formato actual no falla ninguna en ningún diseño.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="430" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un proveedor renombra un campo: qué falla sin y con capa anticorrupción</tspan></text><rect x="10" y="46" width="450" height="300" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="24" y="68" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="24" dy="0">Sin capa: 6 lugares mencionan cod_alumno</tspan></text><rect x="480" y="46" width="450" height="300" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="494" y="68" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="494" dy="0">Con capa: 1 lugar menciona cod_alumno</tspan></text><rect x="110" y="84" width="250" height="44" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="235" y="100.96" font-size="14" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="235" dy="0">Proveedor: ahora envía</tspan></text><text x="235" y="118.88" font-size="14" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="235" dy="0">alumno_id</tspan></text><polyline points="235,128 88,190" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><rect x="24" y="190" width="128" height="52" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="88" y="211.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="88" dy="0">Función 1</tspan></text><text x="88" y="227.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="88" dy="0">falla</tspan></text><polyline points="235,128 230,190" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><rect x="166" y="190" width="128" height="52" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="230" y="211.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="230" dy="0">Función 2</tspan></text><text x="230" y="227.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="230" dy="0">falla</tspan></text><polyline points="235,128 372,190" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><rect x="308" y="190" width="128" height="52" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="372" y="211.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="372" dy="0">Función 3</tspan></text><text x="372" y="227.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="372" dy="0">falla</tspan></text><polyline points="235,128 88,264" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><rect x="24" y="264" width="128" height="52" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="88" y="285.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="88" dy="0">Función 4</tspan></text><text x="88" y="301.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="88" dy="0">falla</tspan></text><polyline points="235,128 230,264" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><rect x="166" y="264" width="128" height="52" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="230" y="285.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="230" dy="0">Función 5</tspan></text><text x="230" y="301.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="230" dy="0">falla</tspan></text><polyline points="235,128 372,264" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><rect x="308" y="264" width="128" height="52" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="372" y="285.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="372" dy="0">Función 6</tspan></text><text x="372" y="301.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="372" dy="0">falla</tspan></text><rect x="580" y="84" width="250" height="44" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="705" y="100.96" font-size="14" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="705" dy="0">Proveedor: ahora envía</tspan></text><text x="705" y="118.88" font-size="14" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="705" dy="0">alumno_id</tspan></text><polyline points="705,128 705,156" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><rect x="560" y="156" width="290" height="46" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="705" y="174.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="705" dy="0">Traductor: falla con un error</tspan></text><text x="705" y="190.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="705" dy="0">explícito</tspan></text><rect x="494" y="244" width="128" height="38" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="558" y="258.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="558" dy="0">Función 1:</tspan></text><text x="558" y="274.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="558" dy="0">sigue</tspan></text><rect x="636" y="244" width="128" height="38" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="700" y="258.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="700" dy="0">Función 2:</tspan></text><text x="700" y="274.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="700" dy="0">sigue</tspan></text><rect x="778" y="244" width="128" height="38" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="842" y="258.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="842" dy="0">Función 3:</tspan></text><text x="842" y="274.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="842" dy="0">sigue</tspan></text><rect x="494" y="292" width="128" height="38" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="558" y="306.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="558" dy="0">Función 4:</tspan></text><text x="558" y="322.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="558" dy="0">sigue</tspan></text><rect x="636" y="292" width="128" height="38" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="700" y="306.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="700" dy="0">Función 5:</tspan></text><text x="700" y="322.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="700" dy="0">sigue</tspan></text><rect x="778" y="292" width="128" height="38" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="842" y="306.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="842" dy="0">Función 6:</tspan></text><text x="842" y="322.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="842" dy="0">sigue</tspan></text><polyline points="705,202 705,240" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="360" width="920" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="384.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Con datos en el formato actual no falla ninguna de las 6 funciones en ninguno de los dos diseños: la capa no evita el</tspan></text><text x="470" y="400.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">cambio del proveedor, limita su alcance a un lugar y lo convierte en un error con nombre.</tspan></text></svg>
