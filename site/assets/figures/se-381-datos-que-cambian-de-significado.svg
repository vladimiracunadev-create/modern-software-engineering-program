<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 543" width="940" height="543" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Datos que cambian de significado al cruzar una frontera: medidas sobre cinco formatos</title><desc id="d">Tabla: un identificador de 54 bits cambia en el 49,9 por ciento de los casos al pasar por un decimal de 64 bits y uno de 63 bits en el 99,9 por ciento, mientras que los de 53 bits o menos no cambian; dos fuentes con el mismo nombre en NFC y NFD difieren en 1 026 de 2 000 pares; 4,6 por ciento de los precios cambia al multiplicar por cien con decimales binarios; y el 36,2 por ciento de las fechas de 2026 se lee distinto como día-mes o mes-día.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="543" fill="#ffffff"/><rect x="10" y="12" width="394" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="207" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="207" dy="0">Frontera y dato</tspan></text><rect x="410" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="557" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="557" dy="0">Medida</tspan></text><rect x="710" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="817" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="817" dy="0">Lectura</tspan></text><rect x="10" y="56" width="394" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="79.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Identificadores de 40 y 53 bits convertidos a decimal</tspan></text><text x="207" y="95.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">de 64 bits</tspan></text><rect x="410" y="56" width="294" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">0 de 100 000 cambian</tspan></text><rect x="710" y="56" width="214" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">0 de 100 000</tspan></text><rect x="10" y="118" width="394" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="149.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Identificadores de 54 bits</tspan></text><rect x="410" y="118" width="294" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">49 896 de 100 000 cambian (49,9 %)</tspan></text><rect x="710" y="118" width="214" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">Pasan de 2⁵³</tspan></text><rect x="10" y="180" width="394" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="211.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Identificadores de 63 bits</tspan></text><rect x="410" y="180" width="294" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">99 886 de 100 000 cambian (99,9 %)</tspan></text><rect x="710" y="180" width="214" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">Casi todos</tspan></text><rect x="10" y="242" width="394" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="273.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">«José» en NFC y en NFD de dos fuentes (2 000 pares)</tspan></text><rect x="410" y="242" width="294" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="273.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">1 026 distintos con ==; 0 tras NFC</tspan></text><rect x="710" y="242" width="214" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="273.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">Longitud 4 frente a 5</tspan></text><rect x="10" y="304" width="394" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="335.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Precios de 1 a 99 999 centavos con int(precio · 100)</tspan></text><rect x="410" y="304" width="294" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="335.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">4 586 de 99 999 cambian (4,6 %)</tspan></text><rect x="710" y="304" width="214" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="335.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">0 con round()</tspan></text><rect x="10" y="366" width="394" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="397.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Fechas de 2026 que dd/mm y mm/dd leen distinto</tspan></text><rect x="410" y="366" width="294" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="397.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">132 de 365 (36,2 %)</tspan></text><rect x="710" y="366" width="214" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="397.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">ISO 8601 sin ambigüedad</tspan></text><rect x="10" y="432" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="456.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Ninguno de estos fallos lanza una excepción: el dato llega y es otro. Un contrato de interoperabilidad debe fijar la</tspan></text><text x="470" y="473.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">representación (cadena para identificadores de más de 53 bits, normalización Unicode, enteros en centavos o decimales,</tspan></text><text x="470" y="490.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">fechas ISO 8601 con zona) y probar con valores en los bordes.</tspan></text><text x="470" y="529.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
