<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 451" width="940" height="451" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mensajes de la versión 1 a la 5 leídos por lectores de la versión 1 a la 5: 25 pares con lector estricto y con lector tolerante</title><desc id="d">Tabla: con lectores estrictos que rechazan campos desconocidos son compatibles 7 de los 25 pares de versiones; con lectores tolerantes que ignoran campos desconocidos, 9 de 25; añadir un campo opcional solo es compatible hacia atrás con el lector tolerante, y renombrar un campo o cambiar el tipo de otro rompe con ambos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="451" fill="#ffffff"/><rect x="10" y="12" width="314" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="167" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="167" dy="0">Versión del productor</tspan></text><rect x="330" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="477" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="477" dy="0">Lector estricto: v1 · v2 · v3 · v4 ·</tspan></text><text x="477" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="477" dy="0">v5</tspan></text><rect x="630" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="777" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="777" dy="0">Lector tolerante: v1 · v2 · v3 · v4 ·</tspan></text><text x="777" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="777" dy="0">v5</tspan></text><rect x="10" y="56" width="314" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="84.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">v1: id, estudiante, nota</tspan></text><rect x="330" y="56" width="294" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="84.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">sí · sí · — · — · —</tspan></text><rect x="630" y="56" width="294" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="84.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">sí · sí · — · — · —</tspan></text><rect x="10" y="112" width="314" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="140.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">v2: añade comentario opcional</tspan></text><rect x="330" y="112" width="294" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="140.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">— · sí · — · — · —</tspan></text><rect x="630" y="112" width="294" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="140.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">sí · sí · — · — · —</tspan></text><rect x="10" y="168" width="314" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="196.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">v3: renombra estudiante a alumno</tspan></text><rect x="330" y="168" width="294" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="196.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">— · — · sí · — · —</tspan></text><rect x="630" y="168" width="294" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="196.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">— · — · sí · — · —</tspan></text><rect x="10" y="224" width="314" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="252.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">v4: la nota pasa de número a texto</tspan></text><rect x="330" y="224" width="294" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="252.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">— · — · — · sí · sí</tspan></text><rect x="630" y="224" width="294" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="252.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">— · — · — · sí · sí</tspan></text><rect x="10" y="280" width="314" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="308.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">v5: añade el campo estado</tspan></text><rect x="330" y="280" width="294" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="308.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">— · — · — · — · sí</tspan></text><rect x="630" y="280" width="294" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="308.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">— · — · — · sí · sí</tspan></text><rect x="10" y="340" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="364.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">El lector tolerante gana 2 de 25 pares: los cambios aditivos. Renombrar (v3) y cambiar el tipo (v4) rompen en ambos</tspan></text><text x="470" y="381.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">sentidos y exigen expandir y contraer. La matriz se construye ejecutando los lectores, no leyendo la especificación. Es un</tspan></text><text x="470" y="398.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">modelo de cinco versiones, no un esquema real.</tspan></text><text x="470" y="437.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
