<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 451" width="940" height="451" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La misma página (440 KB) vista desde el laboratorio y desde tres segmentos de dispositivos</title><desc id="d">Tabla: el laboratorio con un equipo de escritorio rápido da un percentil 75 de 0,49 segundos; el campo completo da 1,50 segundos y supera el límite de 2,5 segundos en el 10,2 por ciento de las cargas; el teléfono lento, que es el 10 por ciento de la población, tiene un percentil 75 de 4,93 segundos y el 98 por ciento de sus cargas supera 2,5.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="451" fill="#ffffff"/><rect x="10" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Medición</tspan></text><rect x="390" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="452" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="452" dy="0">Población</tspan></text><rect x="520" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="577" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="577" dy="0">Mediana</tspan></text><rect x="640" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="697" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="697" dy="0">p75</tspan></text><rect x="760" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="842" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="842" dy="0">Cargas &gt; 2,5 s</tspan></text><rect x="10" y="56" width="374" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="84.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Laboratorio: solo equipo de escritorio rápido</tspan></text><rect x="390" y="56" width="124" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="84.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">100 %</tspan></text><rect x="520" y="56" width="114" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="84.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">—</tspan></text><rect x="640" y="56" width="114" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="84.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">0,49 s</tspan></text><rect x="760" y="56" width="164" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="84.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">—</tspan></text><rect x="10" y="112" width="374" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="140.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Equipo de escritorio rápido</tspan></text><rect x="390" y="112" width="124" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="140.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">55 %</tspan></text><rect x="520" y="112" width="114" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="140.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">0,41 s</tspan></text><rect x="640" y="112" width="114" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="140.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">0,49 s</tspan></text><rect x="760" y="112" width="164" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="140.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">0 %</tspan></text><rect x="10" y="168" width="374" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="196.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Teléfono medio</tspan></text><rect x="390" y="168" width="124" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="196.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">35 %</tspan></text><rect x="520" y="168" width="114" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="196.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">1,43 s</tspan></text><rect x="640" y="168" width="114" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="196.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">1,69 s</tspan></text><rect x="760" y="168" width="164" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="196.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">1 %</tspan></text><rect x="10" y="224" width="374" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="252.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Teléfono lento</tspan></text><rect x="390" y="224" width="124" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="252.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">10 %</tspan></text><rect x="520" y="224" width="114" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="252.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">4,16 s</tspan></text><rect x="640" y="224" width="114" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="252.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">4,93 s</tspan></text><rect x="760" y="224" width="164" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="252.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">98 %</tspan></text><rect x="10" y="280" width="374" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="308.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Campo: la población completa</tspan></text><rect x="390" y="280" width="124" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="308.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">100 %</tspan></text><rect x="520" y="280" width="114" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="308.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">—</tspan></text><rect x="640" y="280" width="114" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="308.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">1,50 s</tspan></text><rect x="760" y="280" width="164" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="308.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">10,2 %</tspan></text><rect x="10" y="340" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="364.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El p75 de la población (1,50 s) cumple y deja fuera a quienes más lo necesitan: el 10 % con teléfono lento queda en 4,93 s.</tspan></text><text x="470" y="381.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Para esa persona la página necesitaría 110 KB, o menos CPU, para llegar a 2,5 s. Los segmentos, los porcentajes y el modelo</tspan></text><text x="470" y="398.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">de tiempo son supuestos del autor; no se midió ningún navegador ni dispositivo.</tspan></text><text x="470" y="437.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
