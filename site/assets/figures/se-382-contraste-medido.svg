<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 563" width="940" height="563" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Contraste WCAG medido con la fórmula de luminancia sobre los colores del propio repositorio</title><desc id="d">Tabla: los seis tipos de recuadro de las figuras tienen entre 9,91 y 16,12 a 1 de contraste de texto; el pie, el texto atenuado y los enlaces del portal cumplen 4,5 a 1; el texto de la etiqueta superior del portal, coral sobre papel, llega a 3,51 a 1 y no cumple para texto pequeño; el borde gris de las figuras llega a 2,90 a 1.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="563" fill="#ffffff"/><rect x="10" y="12" width="434" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="227" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="227" dy="0">Combinación</tspan></text><rect x="450" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="542" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="542" dy="0">Razón de contraste</tspan></text><rect x="640" y="12" width="284" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="782" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="782" dy="0">Criterio</tspan></text><rect x="10" y="56" width="434" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="84.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">Texto de figura sobre su relleno (seis tipos)</tspan></text><rect x="450" y="56" width="184" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="84.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">9,91:1 a 16,12:1</tspan></text><rect x="640" y="56" width="284" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="84.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">≥ 4,5:1: cumplen los seis</tspan></text><rect x="10" y="112" width="434" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="140.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">Pie de las figuras (#5c1f14 sobre blanco)</tspan></text><rect x="450" y="112" width="184" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="140.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">12,64:1</tspan></text><rect x="640" y="112" width="284" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="140.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">Cumple</tspan></text><rect x="10" y="168" width="434" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="196.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">Texto atenuado del portal sobre el papel</tspan></text><rect x="450" y="168" width="184" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="196.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">5,24:1</tspan></text><rect x="640" y="168" width="284" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="196.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">Cumple</tspan></text><rect x="10" y="224" width="434" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="252.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">Enlaces del portal sobre el papel</tspan></text><rect x="450" y="224" width="184" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="252.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">5,60:1</tspan></text><rect x="640" y="224" width="284" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="252.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">Cumple</tspan></text><rect x="10" y="280" width="434" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="308.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">Eyebrow del portal: coral #d85845 sobre el papel #f6f3ec</tspan></text><rect x="450" y="280" width="184" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="308.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">3,51:1</tspan></text><rect x="640" y="280" width="284" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="308.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">No cumple el 4,5:1 del texto pequeño</tspan></text><rect x="10" y="336" width="434" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="364.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">Borde dorado de las figuras sobre blanco</tspan></text><rect x="450" y="336" width="184" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="364.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">3,98:1</tspan></text><rect x="640" y="336" width="284" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="364.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">Cumple el 3:1 de componentes gráficos</tspan></text><rect x="10" y="392" width="434" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="420.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">Borde gris de las figuras sobre blanco</tspan></text><rect x="450" y="392" width="184" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="420.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">2,90:1</tspan></text><rect x="640" y="392" width="284" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="412.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">No cumple el 3:1 si el borde fuera la</tspan></text><text x="782" y="428.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">única señal</tspan></text><rect x="10" y="452" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="476.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La medida es exacta y encuentra algo concreto: una etiqueta del portal por debajo del umbral. No prueba que la experiencia</tspan></text><text x="470" y="493.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">sea accesible: ninguna fórmula de contraste ve el orden de lectura, el foco ni el texto alternativo. En las figuras el</tspan></text><text x="470" y="510.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">borde nunca es la única señal, porque cada recuadro lleva texto.</tspan></text><text x="470" y="549.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
