<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 357" width="940" height="357" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una deriva de peso del 0,6 % por compilación (de 800 KB a 1 324 KB en 80) frente a tres compuertas</title><desc id="d">Tabla: el presupuesto absoluto de 1 000 kilobytes avisa recién en la compilación 38, cuando el peso ya subió un 25 por ciento; la compuerta contra la compilación anterior falla en 21 de 79 compilaciones por puro ruido y 15 de 79 sin deriva alguna; la compuerta de tendencia avisa en la compilación 26 con un 16 por ciento de aumento y no da falsas alarmas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="357" fill="#ffffff"/><rect x="10" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Compuerta</tspan></text><rect x="390" y="12" width="354" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="567" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="567" dy="0">Con deriva</tspan></text><rect x="750" y="12" width="174" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="837" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="837" dy="0">Falsas alarmas sin</tspan></text><text x="837" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="837" dy="0">deriva</tspan></text><rect x="10" y="56" width="374" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="87.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Presupuesto absoluto de 1 000 KB</tspan></text><rect x="390" y="56" width="354" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="567" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="567" dy="0">Primera falla en la compilación 38 (+25 %)</tspan></text><rect x="750" y="56" width="174" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">0 de 80</tspan></text><rect x="10" y="118" width="374" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="149.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Contra la compilación anterior, +2 %</tspan></text><rect x="390" y="118" width="354" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="567" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="567" dy="0">Falla en 21 de 79; ninguna por la deriva real</tspan></text><rect x="750" y="118" width="174" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">15 de 79</tspan></text><rect x="10" y="180" width="374" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="203.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Tendencia: mediana de 3 contra las 10 primeras, +10</tspan></text><text x="197" y="219.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">%</tspan></text><rect x="390" y="180" width="354" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="567" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="567" dy="0">Primera falla en la 26 (926 KB, +16 %)</tspan></text><rect x="750" y="180" width="174" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">0 de 70</tspan></text><rect x="10" y="246" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="270.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Cada compilación solo engorda 0,6 %, por debajo del ruido de 1,2 %, y por eso la compuerta paso a paso no la ve (y se</tspan></text><text x="470" y="287.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">dispara por ruido). La tendencia ve el conjunto sin disparar: 12 compilaciones antes que el presupuesto absoluto, con la</tspan></text><text x="470" y="304.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">ventaja de llegar cuando aún hay margen.</tspan></text><text x="470" y="343.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
