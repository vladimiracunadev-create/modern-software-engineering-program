<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 351" width="960" height="351" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Error inyectado frente a fracción del tráfico afectado: detección / solicitudes erróneas esperadas (60 s a 40 req/s)</title><desc id="d">Tabla: inyectar un error del 20 por ciento al 1 por ciento del tráfico se detecta el 97 por ciento de las veces con cinco solicitudes erróneas; inyectar un error del 2 por ciento solo se detecta con certeza al 100 por ciento del tráfico, con 48 solicitudes erróneas, y al 1 por ciento no se detecta en el 91 por ciento de las ejecuciones.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="351" fill="#ffffff"/><rect x="10" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="112" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="112" dy="0">Error inyectado</tspan></text><rect x="220" y="12" width="174" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="307" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="307" dy="0">1 % del tráfico</tspan></text><rect x="400" y="12" width="174" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="487" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="487" dy="0">5 %</tspan></text><rect x="580" y="12" width="174" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="667" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="667" dy="0">10 %</tspan></text><rect x="760" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="852" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="852" dy="0">100 %</tspan></text><rect x="10" y="56" width="204" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="86.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">2 %</tspan></text><rect x="220" y="56" width="174" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="86.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="307" dy="0">9 % · 0</tspan></text><rect x="400" y="56" width="174" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="86.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">43 % · 2</tspan></text><rect x="580" y="56" width="174" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="667" y="86.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667" dy="0">70 % · 5</tspan></text><rect x="760" y="56" width="184" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="86.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">100 % · 48</tspan></text><rect x="10" y="116" width="204" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="146.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">5 %</tspan></text><rect x="220" y="116" width="174" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="146.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="307" dy="0">33 % · 1</tspan></text><rect x="400" y="116" width="174" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="146.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">94 % · 6</tspan></text><rect x="580" y="116" width="174" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="667" y="146.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667" dy="0">100 % · 12</tspan></text><rect x="760" y="116" width="184" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="146.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">100 % · 120</tspan></text><rect x="10" y="176" width="204" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="206.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">20 %</tspan></text><rect x="220" y="176" width="174" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="206.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="307" dy="0">97 % · 5</tspan></text><rect x="400" y="176" width="174" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="206.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">100 % · 24</tspan></text><rect x="580" y="176" width="174" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="667" y="206.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667" dy="0">100 % · 48</tspan></text><rect x="760" y="176" width="184" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="206.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">100 % · 480</tspan></text><rect x="10" y="240" width="940" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Un fallo fuerte se descubre con un radio de impacto mínimo; un fallo sutil exige exponer más usuarios o ejecutar más tiempo, y</tspan></text><text x="480" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">eso hay que decidirlo antes. Detección: cola binomial exacta con error base de 0,3 % y nivel 1 %, estimada con 2 000</tspan></text><text x="480" y="298.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">repeticiones por celda.</tspan></text><text x="480" y="337.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
