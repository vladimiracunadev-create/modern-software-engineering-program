<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 501" width="960" height="501" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro fallos inyectados 30 s en una API con 6 trabajadores y una base de datos (mediana de 10 semillas)</title><desc id="d">Tabla: la configuración ingenua termina con 90,6 por ciento de errores con 200 milisegundos extra de la base, 100 por ciento con la base caída y 82,9 por ciento con tráfico cinco veces mayor; la endurecida con timeout de 0,5 segundos, interruptor, cola acotada y respaldo en caché baja esos errores a 35,9, 0 y 27,5 por ciento, y responde degradada al 100 por ciento cuando la base cae.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="501" fill="#ffffff"/><rect x="10" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="147" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="147" dy="0">Fallo inyectado (60 s a 90 s)</tspan></text><rect x="290" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="452" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="452" dy="0">Configuración ingenua</tspan></text><rect x="620" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="782" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="782" dy="0">Configuración endurecida</tspan></text><rect x="10" y="56" width="274" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="147" y="89.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="147" dy="0">Sin fallo</tspan></text><rect x="290" y="56" width="324" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="89.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">0,0 % · p99 70 ms</tspan></text><rect x="620" y="56" width="324" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="89.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">0,0 % · p99 70 ms</tspan></text><rect x="10" y="122" width="274" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="147" y="155.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="147" dy="0">+200 ms en la base de datos</tspan></text><rect x="290" y="122" width="324" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="147.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">90,6 % errores · p99 1 968 ms · recupera en 5</tspan></text><text x="452" y="163.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">s</tspan></text><rect x="620" y="122" width="324" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="155.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">35,9 % errores · p99 1 481 ms</tspan></text><rect x="10" y="188" width="274" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="147" y="221.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="147" dy="0">20 % de errores de la base</tspan></text><rect x="290" y="188" width="324" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="221.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">19,7 % errores</tspan></text><rect x="620" y="188" width="324" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="221.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">0,0 % errores · 19,7 % degradadas</tspan></text><rect x="10" y="254" width="274" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="147" y="287.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="147" dy="0">Caída total de la base</tspan></text><rect x="290" y="254" width="324" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="287.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">100 % errores · recupera en 10 s</tspan></text><rect x="620" y="254" width="324" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="287.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">0,0 % errores · 100 % degradadas · p99 510 ms</tspan></text><rect x="10" y="320" width="274" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="147" y="353.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="147" dy="0">Tráfico × 5</tspan></text><rect x="290" y="320" width="324" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="353.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">82,9 % errores · recupera en 15 s</tspan></text><rect x="620" y="320" width="324" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="353.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">27,5 % errores · p99 276 ms</tspan></text><rect x="10" y="390" width="940" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="480" y="414.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">Endurecer cambia el tipo de fallo: de errores a respuestas degradadas, que son una decisión de producto. No sustituye a la</tspan></text><text x="480" y="431.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">capacidad: con +200 ms o con ×5 siguen los errores (35,9 % y 27,5 %) porque el sistema necesita más trabajadores. El modelo (6</tspan></text><text x="480" y="448.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">trabajadores, 40 req/s, base de 30 ms) es una construcción del autor.</tspan></text><text x="480" y="487.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
