<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 357" width="940" height="357" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Umbral de la hipótesis de estado estable (p95 por ventana de 10 s): falsas alarmas y detección de un +10 ms</title><desc id="d">Tabla: un umbral tomado del máximo de una sola ejecución base produce falsas alarmas en 46 de 100 ejecuciones sanas pero detecta el aumento de 10 milisegundos en 100 de 100; multiplicarlo por 1,5 elimina las falsas alarmas y detecta solo 41 de 100; el percentil 99,9 de 30 ejecuciones base por 1,2 no da falsas alarmas y detecta 92 de 100.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="357" fill="#ffffff"/><rect x="10" y="12" width="394" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="207" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="207" dy="0">Umbral</tspan></text><rect x="410" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="472" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="472" dy="0">Ventanas</tspan></text><text x="472" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="472" dy="0">falsas</tspan></text><rect x="540" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="637" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="637" dy="0">Ejecuciones sanas con</tspan></text><text x="637" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="637" dy="0">alarma</tspan></text><rect x="740" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="832" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="832" dy="0">Detecta +10 ms</tspan></text><rect x="10" y="56" width="394" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="87.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Máximo de una ejecución base de 5 min = 73 ms</tspan></text><rect x="410" y="56" width="124" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">2,00 %</tspan></text><rect x="540" y="56" width="194" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="637" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="637" dy="0">46 de 100</tspan></text><rect x="740" y="56" width="184" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="87.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">100 de 100</tspan></text><rect x="10" y="118" width="394" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="149.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Ese máximo × 1,5 = 110 ms</tspan></text><rect x="410" y="118" width="124" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">0,00 %</tspan></text><rect x="540" y="118" width="194" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="637" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="637" dy="0">0 de 100</tspan></text><rect x="740" y="118" width="184" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="149.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">41 de 100</tspan></text><rect x="10" y="180" width="394" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="211.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">p99,9 de 30 ejecuciones base × 1,2 = 94 ms</tspan></text><rect x="410" y="180" width="124" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">0,00 %</tspan></text><rect x="540" y="180" width="194" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="637" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="637" dy="0">0 de 100</tspan></text><rect x="740" y="180" width="184" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="211.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">92 de 100</tspan></text><rect x="10" y="246" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="270.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Un solo experimento de base fija un umbral demasiado ajustado o demasiado holgado sin que se note. Con 30 ejecuciones base</tspan></text><text x="470" y="287.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">se conoce la forma del ruido y el umbral deja de ser una conjetura. El aumento de 10 ms sobre 50 ms de servicio (al 75 % de</tspan></text><text x="470" y="304.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">utilización) es un fallo sutil escogido por el autor.</tspan></text><text x="470" y="343.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
