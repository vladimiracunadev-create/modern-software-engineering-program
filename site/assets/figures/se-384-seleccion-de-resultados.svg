<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 403" width="940" height="403" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dos versiones idénticas comparadas 4 000 veces: porcentaje de informes que declaran una mejora de al menos el 5 %</title><desc id="d">Tabla: al comparar dos versiones idénticas, el procedimiento fijado de antemano con medianas de 30 corridas declara una mejora de al menos 5 por ciento en el 0,1 por ciento de los casos; elegir la mejor de cinco repeticiones lo sube a 23,1; elegir la mejor de seis métricas, a 59,1; y combinar ambas, a 96,4 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="403" fill="#ffffff"/><rect x="10" y="12" width="674" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="347" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="347" dy="0">Cómo se elige el resultado que se informa</tspan></text><rect x="690" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="807" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="807" dy="0">Informes con «mejora» ≥ 5 %</tspan></text><rect x="10" y="56" width="674" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="347" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="347" dy="0">Mediana de 30 contra mediana de 30, una métrica, una vez</tspan></text><rect x="690" y="56" width="234" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">0,1 %</tspan></text><rect x="10" y="114" width="674" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="347" y="143.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="347" dy="0">La mejor de 5 repeticiones de B contra una corrida de A</tspan></text><rect x="690" y="114" width="234" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">23,1 %</tspan></text><rect x="10" y="172" width="674" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="347" y="201.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="347" dy="0">La mejor de 6 métricas, 30 contra 30</tspan></text><rect x="690" y="172" width="234" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">59,1 %</tspan></text><rect x="10" y="230" width="674" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="347" y="259.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="347" dy="0">La mejor de 6 métricas y la mejor de 5 repeticiones de B</tspan></text><rect x="690" y="230" width="234" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">96,4 %</tspan></text><rect x="10" y="292" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="316.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Nada del procedimiento es fraudulento paso a paso y casi todos los informes concluyen una mejora que no existe. La defensa</tspan></text><text x="470" y="333.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">es registrar antes la métrica, el número de repeticiones y el criterio, y publicar todas las corridas; el validador de la</tspan></text><text x="470" y="350.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">figura anterior no puede verificar el orden.</tspan></text><text x="470" y="389.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
