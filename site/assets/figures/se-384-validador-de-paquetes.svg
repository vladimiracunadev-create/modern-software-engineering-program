<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 738" width="940" height="738" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un validador de paquetes de informe frente a 240 mutaciones (12 operadores × 20): 140 detectadas</title><desc id="d">Barras apiladas horizontales con las mutaciones detectadas de 20 por cada uno de los doce operadores: los siete que quitan, alteran o contradicen un dato, como quitar un campo, alterar una fila o invertir el veredicto, se detectan 20 de 20; los cinco coherentes, como reemplazar los datos con su hash y sus resultados o cambiar a la vez el umbral y el plan, 0 de 20.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="738" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un validador de paquetes de informe frente a 240 mutaciones (12 operadores × 20): 140 detectadas</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Detectadas</tspan></text><rect x="139.4" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="159.4" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="159.4" dy="0">No detectadas</tspan></text><line x1="294" y1="77" x2="294" y2="557" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="557" x2="294" y2="562" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="578" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">0</tspan></text><line x1="439.425" y1="77" x2="439.425" y2="557" stroke="#d5dde1" stroke-width="1"/><line x1="439.425" y1="557" x2="439.425" y2="562" stroke="#5b7280" stroke-width="1.4"/><text x="439.425" y="578" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="439.425" dy="0">5</tspan></text><line x1="584.85" y1="77" x2="584.85" y2="557" stroke="#d5dde1" stroke-width="1"/><line x1="584.85" y1="557" x2="584.85" y2="562" stroke="#5b7280" stroke-width="1.4"/><text x="584.85" y="578" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="584.85" dy="0">10</tspan></text><line x1="730.275" y1="77" x2="730.275" y2="557" stroke="#d5dde1" stroke-width="1"/><line x1="730.275" y1="557" x2="730.275" y2="562" stroke="#5b7280" stroke-width="1.4"/><text x="730.275" y="578" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="730.275" dy="0">15</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="557" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="557" x2="875.7" y2="562" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="578" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">20</tspan></text><line x1="294" y1="557" x2="875.7" y2="557" stroke="#5b7280" stroke-width="1.6"/><text x="284" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Quitar un campo obligatorio</tspan></text><text x="284" y="141.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Alterar una fila de los datos</tspan></text><text x="284" y="181.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Alterar un resultado un 10 %</tspan></text><text x="284" y="221.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Invertir el veredicto</tspan></text><text x="284" y="261.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Vaciar los límites («n/a»)</tspan></text><text x="284" y="301.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Dejar el entorno incompleto</tspan></text><text x="284" y="341.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Cambiar el umbral sin el plan</tspan></text><text x="284" y="381.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Cambiar umbral y plan a la vez</tspan></text><text x="284" y="421.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Reemplazar datos, hash y resultados</tspan></text><text x="284" y="461.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Conservar solo la mitad más rápida</tspan></text><text x="284" y="501.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Un límite genérico pero extenso</tspan></text><text x="284" y="541.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Borrar lo no medido («nada»)</tspan></text><rect x="294" y="84" width="581.7" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="584.85" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="584.85" dy="0">20</tspan></text><rect x="875.7" y="84" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">20</tspan></text><rect x="294" y="124" width="581.7" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="584.85" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="584.85" dy="0">20</tspan></text><rect x="875.7" y="124" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="141.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">20</tspan></text><rect x="294" y="164" width="581.7" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="584.85" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="584.85" dy="0">20</tspan></text><rect x="875.7" y="164" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="181.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">20</tspan></text><rect x="294" y="204" width="581.7" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="584.85" y="221.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="584.85" dy="0">20</tspan></text><rect x="875.7" y="204" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="221.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">20</tspan></text><rect x="294" y="244" width="581.7" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="584.85" y="261.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="584.85" dy="0">20</tspan></text><rect x="875.7" y="244" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="261.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">20</tspan></text><rect x="294" y="284" width="581.7" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="584.85" y="301.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="584.85" dy="0">20</tspan></text><rect x="875.7" y="284" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="301.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">20</tspan></text><rect x="294" y="324" width="581.7" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="584.85" y="341.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="584.85" dy="0">20</tspan></text><rect x="875.7" y="324" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="341.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">20</tspan></text><rect x="294" y="364" width="0" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="294" y="364" width="581.7" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="584.85" y="381.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="584.85" dy="0">20</tspan></text><text x="882.7" y="381.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">20</tspan></text><rect x="294" y="404" width="0" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="294" y="404" width="581.7" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="584.85" y="421.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="584.85" dy="0">20</tspan></text><text x="882.7" y="421.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">20</tspan></text><rect x="294" y="444" width="0" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="294" y="444" width="581.7" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="584.85" y="461.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="584.85" dy="0">20</tspan></text><text x="882.7" y="461.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">20</tspan></text><rect x="294" y="484" width="0" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="294" y="484" width="581.7" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="584.85" y="501.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="584.85" dy="0">20</tspan></text><text x="882.7" y="501.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">20</tspan></text><rect x="294" y="524" width="0" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="294" y="524" width="581.7" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="584.85" y="541.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="584.85" dy="0">20</tspan></text><text x="882.7" y="541.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">20</tspan></text><text x="584.85" y="601" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="584.85" dy="0">Mutaciones de 20 por operador</tspan></text><rect x="10" y="615" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="639.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Detecta 140 de 240 (58 %) y las 100 que se escapan son coherentes: el informe se contradice solo cuando algo se olvidó, no</tspan></text><text x="470" y="656.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">cuando se eligió. El hash prueba que los datos no cambiaron, no que sean los correctos; el plan con hash prueba el orden</tspan></text><text x="470" y="673.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">solo si se registró antes (por ejemplo, en un commit anterior).</tspan></text><text x="470" y="720.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
