<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 654" width="940" height="654" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un validador sobre 200 mutaciones de un paquete de integración: 140 detectadas</title><desc id="d">Barras apiladas horizontales con las mutaciones detectadas y no detectadas por tipo: el validador detecta las 100 estructurales, las 10 de ventana de deduplicación corta, las 20 de cero intentos o espera mal contada y las 10 de bandeja de entrada sin unicidad; no detecta ninguna de las 10 sin firma con la palabra HMAC, las 20 sin jitter, ni las 10 de cola sin alarma, clave gruesa o datos personales.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="654" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un validador sobre 200 mutaciones de un paquete de integración: 140 detectadas</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Detectadas</tspan></text><rect x="139.4" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="159.4" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="159.4" dy="0">No detectadas</tspan></text><line x1="354" y1="77" x2="354" y2="473" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="473" x2="354" y2="478" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="494" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="466.4" y1="77" x2="466.4" y2="473" stroke="#d5dde1" stroke-width="1"/><line x1="466.4" y1="473" x2="466.4" y2="478" stroke="#5b7280" stroke-width="1.4"/><text x="466.4" y="494" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="466.4" dy="0">20</tspan></text><line x1="578.8" y1="77" x2="578.8" y2="473" stroke="#d5dde1" stroke-width="1"/><line x1="578.8" y1="473" x2="578.8" y2="478" stroke="#5b7280" stroke-width="1.4"/><text x="578.8" y="494" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="578.8" dy="0">40</tspan></text><line x1="691.2" y1="77" x2="691.2" y2="473" stroke="#d5dde1" stroke-width="1"/><line x1="691.2" y1="473" x2="691.2" y2="478" stroke="#5b7280" stroke-width="1.4"/><text x="691.2" y="494" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="691.2" dy="0">60</tspan></text><line x1="803.6" y1="77" x2="803.6" y2="473" stroke="#d5dde1" stroke-width="1"/><line x1="803.6" y1="473" x2="803.6" y2="478" stroke="#5b7280" stroke-width="1.4"/><text x="803.6" y="494" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="803.6" dy="0">80</tspan></text><line x1="916" y1="77" x2="916" y2="473" stroke="#d5dde1" stroke-width="1"/><line x1="916" y1="473" x2="916" y2="478" stroke="#5b7280" stroke-width="1.4"/><text x="916" y="494" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="916" dy="0">100</tspan></text><line x1="354" y1="473" x2="916" y2="473" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="103.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Quitar o vaciar una sección</tspan></text><text x="344" y="139" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Ventana de deduplicación menor que el</tspan></text><text x="344" y="156" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">horizonte</tspan></text><text x="344" y="191.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Cero intentos o espera mal contada</tspan></text><text x="344" y="235.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Bandeja de entrada sin unicidad</tspan></text><text x="344" y="279.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Sin firma, aunque aparezca HMAC</tspan></text><text x="344" y="315" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Reintentos sin jitter o con horizonte</tspan></text><text x="344" y="332" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">incoherente</tspan></text><text x="344" y="367.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Cola de fallidos sin alarma ni dueño</tspan></text><text x="344" y="411.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Clave de idempotencia demasiado gruesa</tspan></text><text x="344" y="455.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Registrar datos personales</tspan></text><rect x="354" y="84" width="562" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="635" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="635" dy="0">100</tspan></text><rect x="916" y="84" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><rect x="354" y="128" width="56.2" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="382.1" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="382.1" dy="0">10</tspan></text><rect x="410.2" y="128" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><rect x="354" y="172" width="112.4" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="410.2" y="191.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="410.2" dy="0">20</tspan></text><rect x="466.4" y="172" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><rect x="354" y="216" width="56.2" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="382.1" y="235.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="382.1" dy="0">10</tspan></text><rect x="410.2" y="216" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><rect x="354" y="260" width="0" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="354" y="260" width="56.2" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="382.1" y="279.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="382.1" dy="0">10</tspan></text><rect x="354" y="304" width="0" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="354" y="304" width="112.4" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="410.2" y="323.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="410.2" dy="0">20</tspan></text><rect x="354" y="348" width="0" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="354" y="348" width="56.2" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="382.1" y="367.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="382.1" dy="0">10</tspan></text><rect x="354" y="392" width="0" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="354" y="392" width="56.2" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="382.1" y="411.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="382.1" dy="0">10</tspan></text><rect x="354" y="436" width="0" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="354" y="436" width="56.2" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="382.1" y="455.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="382.1" dy="0">10</tspan></text><text x="635" y="517" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="635" dy="0">Mutaciones de 200</tspan></text><rect x="10" y="531" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="555.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Un paquete completo no es un paquete correcto: el validador ve la forma y algunas incoherencias numéricas, y deja pasar</tspan></text><text x="470" y="572.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">todo lo que requiere entender el sentido. Las reglas se escribieron mirando estos mismos casos, por lo que 140 de 200 no</tspan></text><text x="470" y="589.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">estima su exactitud real.</tspan></text><text x="470" y="636.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; CPython 3.12 en Windows y Ubuntu (WSL2); cifras idénticas salvo donde se indica.</tspan></text></svg>
