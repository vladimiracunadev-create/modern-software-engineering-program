<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 590" width="940" height="590" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un grafo de ataque de 12 aristas: costo mínimo para alterar una nota tras cada decisión de defensa</title><desc id="d">Barras con el costo mínimo del camino de ataque para alterar una nota tras cada decisión: 7 en la línea base y tras corregir la inyección SQL, 8 tras bloquear cada uno de los tres caminos más baratos y 27 tras el cuarto bloqueo, cuando ya no queda ninguna ruta de costo 10 o menos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="590" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un grafo de ataque de 12 aristas: costo mínimo para alterar una nota tras cada decisión de defensa</tspan></text><line x1="71.08" y1="347" x2="920" y2="347" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="347" x2="71.08" y2="347" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="351.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="253.667" x2="920" y2="253.667" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="253.667" x2="71.08" y2="253.667" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="258.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="160.333" x2="920" y2="160.333" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="160.333" x2="71.08" y2="160.333" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="164.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="67" x2="71.08" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">30</tspan></text><line x1="71.08" y1="67" x2="71.08" y2="347" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="207" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 207)">costo mínimo para alterar una nota</text><rect x="85.2287" y="281.667" width="113.189" height="65.3333" rx="3" fill="#087f8c"/><text x="141.823" y="275.667" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="141.823" dy="0">7</tspan></text><text x="141.823" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="141.823" dy="0">Línea base</tspan></text><rect x="226.715" y="281.667" width="113.189" height="65.3333" rx="3" fill="#087f8c"/><text x="283.31" y="275.667" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="283.31" dy="0">7</tspan></text><text x="283.31" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="283.31" dy="0">Corregir la</tspan></text><text x="283.31" y="385" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="283.31" dy="0">inyección SQL (+20</tspan></text><text x="283.31" y="402" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="283.31" dy="0">de costo)</tspan></text><rect x="368.202" y="272.333" width="113.189" height="74.6667" rx="3" fill="#087f8c"/><text x="424.797" y="266.333" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="424.797" dy="0">8</tspan></text><text x="424.797" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="424.797" dy="0">Bloquear el camino</tspan></text><text x="424.797" y="385" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="424.797" dy="0">más barato</tspan></text><rect x="509.689" y="272.333" width="113.189" height="74.6667" rx="3" fill="#087f8c"/><text x="566.283" y="266.333" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="566.283" dy="0">8</tspan></text><text x="566.283" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="566.283" dy="0">Bloquear el</tspan></text><text x="566.283" y="385" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="566.283" dy="0">segundo camino</tspan></text><rect x="651.175" y="272.333" width="113.189" height="74.6667" rx="3" fill="#087f8c"/><text x="707.77" y="266.333" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="707.77" dy="0">8</tspan></text><text x="707.77" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707.77" dy="0">Bloquear el tercer</tspan></text><text x="707.77" y="385" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707.77" dy="0">camino</tspan></text><rect x="792.662" y="95" width="113.189" height="252" rx="3" fill="#087f8c"/><text x="849.257" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="849.257" dy="0">27</tspan></text><text x="849.257" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="849.257" dy="0">Bloquear el cuarto</tspan></text><text x="849.257" y="385" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="849.257" dy="0">camino</tspan></text><rect x="10" y="433" width="920" height="109.2" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="457.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Caminos más baratos: la cuenta docente por phishing (6) y alterar nota (1) en la base, con 4 rutas de costo 10 o menos;</tspan></text><text x="470" y="474.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">tras la inyección quedan 3; los bloqueos cierran, en orden, la inyección SQL con base de datos directa, la cuenta de</tspan></text><text x="470" y="491.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">estudiante con rol elevado y el token de servicio filtrado; tras el cuarto el mínimo es la cuenta docente con +20. Arreglar</tspan></text><text x="470" y="507.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">lo que más asusta no movió el mínimo porque ese no era el camino más barato. Los costos son una escala del autor, no una</tspan></text><text x="470" y="524.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">medición de atacantes reales.</tspan></text><text x="470" y="572.2" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
