<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 346" width="940" height="346" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dos hilos y dos cerrojos: ejecuciones del modelo de estados que completan o terminan en interbloqueo</title><desc id="d">Barras apiladas horizontales con las ejecuciones del modelo de estados: con orden opuesto de adquisición, de 6 ejecuciones 4 completan y 2 terminan en interbloqueo, el 33,3 por ciento; con el mismo orden las 2 ejecuciones completan y ninguna se bloquea.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="346" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dos hilos y dos cerrojos: ejecuciones del modelo de estados que completan o terminan en interbloqueo</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Completan</tspan></text><rect x="131.86" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="151.86" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="151.86" dy="0">Interbloqueo</tspan></text><line x1="284" y1="77" x2="284" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="284" y1="165" x2="284" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="284" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="284" dy="0">0</tspan></text><line x1="481.233" y1="77" x2="481.233" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="481.233" y1="165" x2="481.233" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="481.233" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="481.233" dy="0">2</tspan></text><line x1="678.467" y1="77" x2="678.467" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="678.467" y1="165" x2="678.467" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="678.467" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="678.467" dy="0">4</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="165" x2="875.7" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">6</tspan></text><line x1="284" y1="165" x2="875.7" y2="165" stroke="#5b7280" stroke-width="1.6"/><text x="274" y="95" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Un hilo toma A y luego B; el otro,</tspan></text><text x="274" y="112" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">B y luego A</tspan></text><text x="274" y="147.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Ambos toman A y luego B</tspan></text><rect x="284" y="84" width="394.467" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="481.233" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="481.233" dy="0">4</tspan></text><rect x="678.467" y="84" width="197.233" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="777.083" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="777.083" dy="0">2</tspan></text><text x="882.7" y="103.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">6</tspan></text><rect x="284" y="128" width="197.233" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="382.617" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="382.617" dy="0">2</tspan></text><rect x="481.233" y="128" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="488.233" y="147.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="488.233" dy="0">2</tspan></text><text x="579.85" y="209" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="579.85" dy="0">Ejecuciones del modelo</tspan></text><rect x="10" y="223" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="247.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Un orden global de adquisición elimina el ciclo de espera. El tiempo límite no lo evita: lo convierte en un error, y quién</tspan></text><text x="470" y="264.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">falla primero depende de una carrera de temporización (en la versión real con barrera y 0,3 s ambos hilos agotan el tiempo</tspan></text><text x="470" y="281.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">en Windows y uno completa en Ubuntu). Recuperarse exige liberar lo ya tomado y poder repetir.</tspan></text><text x="470" y="328.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo exhaustivo determinista; la versión real con tiempo límite no es reproducible entre sistemas.</tspan></text></svg>
