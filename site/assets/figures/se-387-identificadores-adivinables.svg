<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 431" width="940" height="431" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Lectura de entregas ajenas: identificadores adivinables frente a comprobar el dueño (5 000 entregas)</title><desc id="d">Tabla: con identificadores secuenciales y sin comprobar el dueño, 20 000 peticiones leen 4 988 entregas ajenas; con identificadores aleatorios y sin comprobar, adivinar no lee ninguna pero 150 identificadores filtrados leen 150; comprobar el dueño las reduce a cero en ambos casos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="431" fill="#ffffff"/><rect x="10" y="12" width="554" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="287" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="287" dy="0">Combinación</tspan></text><rect x="570" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="647" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="647" dy="0">Peticiones</tspan></text><rect x="730" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="827" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="827" dy="0">Entregas ajenas leídas</tspan></text><rect x="10" y="56" width="554" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="82.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Secuencial, sin comprobar el dueño</tspan></text><rect x="570" y="56" width="154" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="82.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">20 000</tspan></text><rect x="730" y="56" width="194" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="82.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">4 988</tspan></text><rect x="10" y="108" width="554" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="134.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Aleatorio (UUID), sin comprobar, adivinando</tspan></text><rect x="570" y="108" width="154" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="134.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">1 000 000</tspan></text><rect x="730" y="108" width="194" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="134.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">0</tspan></text><rect x="10" y="160" width="554" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="186.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Aleatorio, sin comprobar, con el 3 % de los identificadores filtrados</tspan></text><rect x="570" y="160" width="154" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="186.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">150</tspan></text><rect x="730" y="160" width="194" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="186.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">150</tspan></text><rect x="10" y="212" width="554" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="238.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Secuencial, comprobando el dueño</tspan></text><rect x="570" y="212" width="154" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="238.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">20 000</tspan></text><rect x="730" y="212" width="194" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="238.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">0</tspan></text><rect x="10" y="264" width="554" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="290.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Aleatorio, comprobando el dueño</tspan></text><rect x="570" y="264" width="154" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="290.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">1 000 000</tspan></text><rect x="730" y="264" width="194" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="290.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">0</tspan></text><rect x="10" y="320" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="344.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El identificador aleatorio reduce la facilidad de enumerar y no es un control de acceso: cuando un identificador aparece en</tspan></text><text x="470" y="361.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">un correo, un enlace o un registro, la entrega queda al alcance de cualquiera. Solo la comprobación en el servidor, en cada</tspan></text><text x="470" y="378.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">petición, cierra el defecto.</tspan></text><text x="470" y="417.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
