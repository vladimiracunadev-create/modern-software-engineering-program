ze="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">4</tspan></text><rect x="720" y="212" width="94" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="238.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">0</tspan></text><rect x="820" y="212" width="104" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="238.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">1</tspan></text><rect x="10" y="264" width="324" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="290.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">urllib.parse.quote total</tspan></text><rect x="340" y="264" width="94" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="387" y="290.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387" dy="0">0</tspan></text><rect x="440" y="264" width="134" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="507" y="290.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">0</tspan></text><rect x="580" y="264" width="134" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="290.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">0</tspan></text><rect x="720" y="264" width="94" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="290.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">0</tspan></text><rect x="820" y="264" width="104" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="290.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">0</tspan></text><rect x="10" y="320" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="344.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Ningún codificador sirve para todos los contextos: html.escape no mira las comillas simples sin el parámetro, deja pasar un</tspan></text><text x="470" y="361.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">atributo sin comillas y no toca el esquema de una URL. quote lo anula todo porque destruye el significado. Es un modelo de</tspan></text><text x="470" y="378.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">reglas escrito por el autor, no un navegador.</tspan></text><text x="470" y="417.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
