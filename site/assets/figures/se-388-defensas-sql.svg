<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 431" width="940" height="431" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Doce cargas por contexto contra SQLite real: cuántas alteran la consulta según la defensa</title><desc id="d">Tabla: concatenar deja pasar 4 de 12 cargas en un valor de texto, 9 en un número y 4 en un identificador de ORDER BY; duplicar comillas cierra el texto y no el número; una lista de palabras prohibidas deja pasar 1, 6 y 2; el parámetro enlazado cierra texto y número; solo la lista blanca resuelve el identificador.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="431" fill="#ffffff"/><rect x="10" y="12" width="394" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="207" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="207" dy="0">Defensa</tspan></text><rect x="410" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="487" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="487" dy="0">Valor entre</tspan></text><text x="487" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="487" dy="0">comillas</tspan></text><rect x="570" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="647" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="647" dy="0">Número sin</tspan></text><text x="647" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="647" dy="0">comillas</tspan></text><rect x="730" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="827" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="827" dy="0">Identificador (ORDER</tspan></text><text x="827" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="827" dy="0">BY)</tspan></text><rect x="10" y="56" width="394" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="82.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Concatenar el texto</tspan></text><rect x="410" y="56" width="154" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">4</tspan></text><rect x="570" y="56" width="154" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">9</tspan></text><rect x="730" y="56" width="194" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="82.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">4</tspan></text><rect x="10" y="108" width="394" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="134.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Duplicar las comillas simples</tspan></text><rect x="410" y="108" width="154" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">0</tspan></text><rect x="570" y="108" width="154" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">9</tspan></text><rect x="730" y="108" width="194" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="134.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">4</tspan></text><rect x="10" y="160" width="394" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="186.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Rechazar palabras (union, select, drop, delete)</tspan></text><rect x="410" y="160" width="154" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">1</tspan></text><rect x="570" y="160" width="154" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">6</tspan></text><rect x="730" y="160" width="194" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="186.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">2</tspan></text><rect x="10" y="212" width="394" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="238.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Parámetro enlazado</tspan></text><rect x="410" y="212" width="154" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="238.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">0</tspan></text><rect x="570" y="212" width="154" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="238.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">0</tspan></text><rect x="730" y="212" width="194" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="238.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">0 (pero no ordena)</tspan></text><rect x="10" y="264" width="394" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="290.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Lista blanca de columnas</tspan></text><rect x="410" y="264" width="154" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="290.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">—</tspan></text><rect x="570" y="264" width="154" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="290.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">—</tspan></text><rect x="730" y="264" width="194" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="290.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">0</tspan></text><rect x="10" y="320" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="344.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Duplicar comillas es la defensa correcta para un contexto y inútil en otro: el número no lleva comillas que cerrar. El</tspan></text><text x="470" y="361.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">parámetro enlazado separa dato de código, pero no puede enlazar el nombre de una columna: ORDER BY ? con «titulo DESC» no</tspan></text><text x="470" y="378.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ordena. Las 36 cargas son del autor y la lista de palabras se escribió sin ajustarla a ellas.</tspan></text><text x="470" y="417.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">SQLite 3 del módulo estándar de CPython 3.12; cifras idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
