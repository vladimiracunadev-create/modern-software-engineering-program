<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 403" width="940" height="403" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Resolución de los relojes de Python en dos sistemas operativos (escala logarítmica)</title><desc id="d">Barras agrupadas horizontales en escala logarítmica con la resolución de time.time() y de time.monotonic(): 15,6 ms en Windows 11 frente a 1 ns en Ubuntu (WSL2), una diferencia de unos 15 millones de veces en los dos relojes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="403" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Resolución de los relojes de Python en dos sistemas operativos (escala logarítmica)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Windows 11</tspan></text><rect x="139.4" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="159.4" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="159.4" dy="0">Ubuntu (WSL2)</tspan></text><line x1="174" y1="77" x2="174" y2="205" stroke="#d5dde1" stroke-width="1"/><line x1="174" y1="205" x2="174" y2="210" stroke="#5b7280" stroke-width="1.4"/><text x="174" y="226" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="174" dy="0">1</tspan></text><line x1="402.527" y1="77" x2="402.527" y2="205" stroke="#d5dde1" stroke-width="1"/><line x1="402.527" y1="205" x2="402.527" y2="210" stroke="#5b7280" stroke-width="1.4"/><text x="402.527" y="226" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402.527" dy="0">1 000</tspan></text><line x1="631.053" y1="77" x2="631.053" y2="205" stroke="#d5dde1" stroke-width="1"/><line x1="631.053" y1="205" x2="631.053" y2="210" stroke="#5b7280" stroke-width="1.4"/><text x="631.053" y="226" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="631.053" dy="0">1 000 000</tspan></text><line x1="859.58" y1="77" x2="859.58" y2="205" stroke="#d5dde1" stroke-width="1"/><line x1="859.58" y1="205" x2="859.58" y2="210" stroke="#5b7280" stroke-width="1.4"/><text x="859.58" y="226" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="859.58" dy="0">1 000 000 000</tspan></text><line x1="174" y1="205" x2="859.58" y2="205" stroke="#5b7280" stroke-width="1.6"/><text x="164" y="113.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="164" dy="0">time.time()</tspan></text><text x="164" y="177.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="164" dy="0">time.monotonic()</tspan></text><rect x="174" y="83" width="547.94" height="24.5" rx="3" fill="#c0432f"/><text x="728.94" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="728.94" dy="0">15,6 ms</tspan></text><rect x="174" y="110.5" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="183" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="183" dy="0">1 ns</tspan></text><rect x="174" y="147" width="547.94" height="24.5" rx="3" fill="#c0432f"/><text x="728.94" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="728.94" dy="0">15,6 ms</tspan></text><rect x="174" y="174.5" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="183" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="183" dy="0">1 ns</tspan></text><text x="516.79" y="249" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="516.79" dy="0">Resolución en nanosegundos (escala logarítmica)</tspan></text><rect x="10" y="263" width="920" height="92.56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="287.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Para medir cuánto duró algo se usa un reloj monotónico; para decir cuándo ocurrió, el de pared, sabiendo que se ajusta y</tspan></text><text x="470" y="304.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">que los nodos no coinciden. Medir 5 ms con un reloj de 15,6 ms es inexacto: la resolución es una propiedad del sistema, no</tspan></text><text x="470" y="321.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">de Python. El monotónico no retrocedió en 2 000 000 de lecturas y, con un ajuste simulado de −80 ms (1 de cada 500), el</tspan></text><text x="470" y="337.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">reloj de pared dio 205 duraciones negativas en 100 000 mediciones y el monotónico 0 (iguales en los dos sistemas).</tspan></text><text x="470" y="385.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Resolución medida con time.get_clock_info; el ajuste de reloj es una simulación con semilla 3403.</tspan></text></svg>
