iddle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="149.645" dy="0">2,9</tspan></text><circle cx="255.696" cy="350.7" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="255.696" y="339.7" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="255.696" dy="0">12,1</tspan></text><circle cx="467.797" cy="268.5" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="467.797" y="257.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="467.797" dy="0">39,5</tspan></text><circle cx="892" cy="132.6" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="121.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">84,8</tspan></text><polyline points="96.62,384.9 149.645,378.3 255.696,353.4 467.797,273.3 892,131.7" fill="none" stroke="#6b7c86" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="91.12" y="379.4" width="11" height="11" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><rect x="144.145" y="372.8" width="11" height="11" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><rect x="250.196" y="347.9" width="11" height="11" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><text x="255.696" y="377.4" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="255.696" dy="0">11,2</tspan></text><rect x="462.297" y="267.8" width="11" height="11" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><text x="467.797" y="297.3" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="467.797" dy="0">37,9</tspan></text><rect x="886.5" y="126.2" width="11" height="11" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><text x="892" y="155.7" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">85,1</tspan></text><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Con 96 bits, una probabilidad de colisión de 2^-32 llega con unos 6,07 × 10^9 mensajes por clave; NIST SP 800-38D limita</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">las invocaciones con IV aleatorio de 96 bits a 2^32 por clave. Envolver un millón de claves de datos con una clave maestra</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">mueve 48 MB; recifrar 2 TB de datos para rotar sin sobre-cifrado es unas 40 000 veces más.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
