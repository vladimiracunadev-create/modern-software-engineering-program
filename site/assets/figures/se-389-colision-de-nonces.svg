<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Colisión de nonces aleatorios de 24 bits (1 500 repeticiones por punto) frente a 1 − exp(−n²/2^25)</title><desc id="d">Líneas con la probabilidad de repetir algún nonce de 24 bits según los mensajes con la misma clave: de 0,9 por ciento con 500 mensajes a 84,8 con 8 000, casi sobre la fórmula del cumpleaños, que da 0,7 y 85,1.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Colisión de nonces aleatorios de 24 bits (1 500 repeticiones por punto) frente a 1 − exp(−n²/2^25)</tspan></text><circle cx="22" cy="51" r="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Colisión observada</tspan></text><rect x="199.72" y="45" width="12" height="12" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><text x="219.72" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="219.72" dy="0">Fórmula del cumpleaños</tspan></text><line x1="78.62" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="387" x2="78.62" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="327" x2="910" y2="327" stroke="#d5dde1" s