<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 561" width="940" height="561" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Detector de fallos por latidos cada 1 000 ms: falsas sospechas frente a retraso en detectar, según el tiempo límite</title><desc id="d">Línea que une cinco tiempos límite: con 150 ms el 32,34 por ciento de los latidos de un nodo sano parece una falla y un nodo caído se detecta 1 150 ms después del último latido; con 600 ms, 2,25 por ciento y 1 600 ms; con 2 400 ms, 0,02 por ciento y 3 400 ms. Bajar las falsas alarmas retrasa la detección.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="561" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Detector de fallos por latidos cada 1 000 ms: falsas sospechas frente a retraso en detectar, según el tiempo</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">límite</tspan></text><line x1="93.7" y1="378" x2="910" y2="378" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="378" x2="93.7" y2="378" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="382.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">0</tspan></text><line x1="93.7" y1="303" x2="910" y2="303" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="303" x2="93.7" y2="303" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="307.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1 000</tspan></text><line x1="93.7" y1="228" x2="910" y2="228" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="228" x2="93.7" y2="228" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="232.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">2 000</tspan></text><line x1="93.7" y1="153" x2="910" y2="153" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="153" x2="93.7" y2="153" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="157.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">3 000</tspan></text><line x1="93.7" y1="78" x2="910" y2="78" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="78" x2="93.7" y2="78" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="82.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">4 000</tspan></text><line x1="93.7" y1="78" x2="93.7" y2="378" stroke="#5b7280" stroke-width="1.6"/><line x1="111.7" y1="78" x2="111.7" y2="378" stroke="#d5dde1" stroke-width="1"/><line x1="111.7" y1="378" x2="111.7" y2="383" stroke="#5b7280" stroke-width="1.4"/><text x="111.7" y="399" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="111.7" dy="0">0,01</tspan></text><line x1="306.775" y1="78" x2="306.775" y2="378" stroke="#d5dde1" stroke-width="1"/><line x1="306.775" y1="378" x2="306.775" y2="383" stroke="#5b7280" stroke-width="1.4"/><text x="306.775" y="399" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="306.775" dy="0">0,1</tspan></text><line x1="501.85" y1="78" x2="501.85" y2="378" stroke="#d5dde1" stroke-width="1"/><line x1="501.85" y1="378" x2="501.85" y2="383" stroke="#5b7280" stroke-width="1.4"/><text x="501.85" y="399" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="501.85" dy="0">1</tspan></text><line x1="696.925" y1="78" x2="696.925" y2="378" stroke="#d5dde1" stroke-width="1"/><line x1="696.925" y1="378" x2="696.925" y2="383" stroke="#5b7280" stroke-width="1.4"/><text x="696.925" y="399" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="696.925" dy="0">10</tspan></text><line x1="892" y1="78" x2="892" y2="378" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="378" x2="892" y2="383" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="399" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">100</tspan></text><line x1="93.7" y1="378" x2="910" y2="378" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="228" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 228)">Retraso en detectar un nodo caído (ms)</text><text x="501.85" y="424" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="501.85" dy="0">Latidos de un nodo sano que se sospechan (%) (escala logarítmica)</tspan></text><polyline points="796.363,291.75 704.768,280.5 570.552,258 394.004,213 170.423,123" fill="none" stroke="#087f8c" stroke-width="2.4"/><circle cx="796.363" cy="291.75" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="806.363" y="296.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="806.363" dy="0">150 ms</tspan></text><circle cx="704.768" cy="280.5" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="704.768" y="269.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="704.768" dy="0">300 ms</tspan></text><circle cx="570.552" cy="258" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="570.552" y="247" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="570.552" dy="0">600 ms</tspan></text><circle cx="394.004" cy="213" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="394.004" y="202" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="394.004" dy="0">1 200 ms</tspan></text><circle cx="170.423" cy="123" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="170.423" y="112" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="170.423" dy="0">2 400 ms</tspan></text><rect x="10" y="438" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="462.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">No existe un tiempo límite que dé detección rápida y cero falsas sospechas: subirlo baja las falsas alarmas y retrasa la</tspan></text><text x="470" y="479.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">detección, y por eso la curva baja hacia la derecha. La distribución del retardo (lognormal, mediana 100 ms, p99 de 795 ms)</tspan></text><text x="470" y="496.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">es un supuesto del autor, no una red medida.</tspan></text><text x="470" y="543.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelos sintéticos con semilla fija; resultados idénticos en Windows y Ubuntu (WSL2) salvo donde se indica.</tspan></text></svg>
