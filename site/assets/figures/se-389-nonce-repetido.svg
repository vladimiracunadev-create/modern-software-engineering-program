<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 287" width="940" height="287" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cifrado de flujo de juguete (HMAC-SHA256 en modo contador) con y sin nonce repetido, 200 pares de mensajes</title><desc id="d">Tabla: si dos mensajes se cifran con la misma clave y el mismo nonce, quien conoce uno recupera el 100 por ciento del otro sin la clave y la plantilla común acierta 200 de 200 veces; con nonce distinto se acierta el 0,4 por ciento, lo que da el azar.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="287" fill="#ffffff"/><rect x="10" y="12" width="474" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="247" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="247" dy="0">Uso del nonce</tspan></text><rect x="490" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="602" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="602" dy="0">Bytes recuperados sin la</tspan></text><text x="602" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="602" dy="0">clave</tspan></text><rect x="720" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="822" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="822" dy="0">Acierto de la plantilla</tspan></text><text x="822" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="822" dy="0">común</tspan></text><rect x="10" y="56" width="474" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">Nonce fijo para todos los mensajes</tspan></text><rect x="490" y="56" width="224" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">100,0 %</tspan></text><rect x="720" y="56" width="204" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">200 de 200</tspan></text><rect x="10" y="114" width="474" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="143.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">Nonce aleatorio de 96 bits distinto en cada mensaje</tspan></text><rect x="490" y="114" width="224" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">0,4 %</tspan></text><rect x="720" y="114" width="204" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">0 de 200</tspan></text><rect x="10" y="176" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="200.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El XOR de dos textos cifrados con el mismo flujo es el XOR de los textos en claro; con uno conocido o una plantilla («Nota</tspan></text><text x="470" y="217.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">final: …») se lee el otro. Es una construcción didáctica: en producción se usa AEAD de una biblioteca revisada y el nonce</tspan></text><text x="470" y="234.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">nunca lo decide el llamador.</tspan></text><text x="470" y="273.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
