<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 407" width="940" height="407" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuando el cliente se rinde, ¿se ejecutó la operación? (100 000 solicitudes, tres perfiles de red)</title><desc id="d">Barras apiladas horizontales al 100 por ciento con los tiempos agotados de 100 000 solicitudes: con peticiones perdidas 2 por ciento, respuestas perdidas 2 y lentas 1, la operación sí se ejecutó en el 59,1 por ciento de los 4 986 tiempos agotados; con respuestas lentas del 10 por ciento sube al 85,1 y con pérdida de peticiones de 0,5 y de respuestas de 5, al 93,4.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="407" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuando el cliente se rinde, ¿se ejecutó la operación? (100 000 solicitudes, tres perfiles de red)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">La operación se ejecutó</tspan></text><rect x="237.42" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="257.42" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="257.42" dy="0">No se ejecutó</tspan></text><line x1="294" y1="77" x2="294" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="209" x2="294" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">0</tspan></text><line x1="439.425" y1="77" x2="439.425" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="439.425" y1="209" x2="439.425" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="439.425" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="439.425" dy="0">25</tspan></text><line x1="584.85" y1="77" x2="584.85" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="584.85" y1="209" x2="584.85" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="584.85" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="584.85" dy="0">50</tspan></text><line x1="730.275" y1="77" x2="730.275" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="730.275" y1="209" x2="730.275" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="730.275" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="730.275" dy="0">75</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="209" x2="875.7" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">100</tspan></text><line x1="294" y1="209" x2="875.7" y2="209" stroke="#5b7280" stroke-width="1.6"/><text x="284" y="95" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">2 % · 2 % · 1 % (4 986 tiempos</tspan></text><text x="284" y="112" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">agotados)</tspan></text><text x="284" y="147.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">2 % · 2 % · 10 % (13 649)</tspan></text><text x="284" y="191.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">0,5 % · 5 % · 2 % (7 389)</tspan></text><rect x="294" y="84" width="343.7" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="465.85" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="465.85" dy="0">59 %</tspan></text><rect x="637.7" y="84" width="238" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="756.7" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="756.7" dy="0">41 %</tspan></text><text x="882.7" y="103.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100 %</tspan></text><rect x="294" y="128" width="494.758" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="541.379" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="541.379" dy="0">85 %</tspan></text><rect x="788.758" y="128" width="86.9418" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="832.229" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="832.229" dy="0">15 %</tspan></text><text x="882.7" y="147.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100 %</tspan></text><rect x="294" y="172" width="543.518" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="565.759" y="191.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="565.759" dy="0">93 %</tspan></text><rect x="837.518" y="172" width="38.1817" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="856.609" y="191.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="856.609" dy="0">7 %</tspan></text><text x="882.7" y="191.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100 %</tspan></text><text x="584.85" y="253" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="584.85" dy="0">% del total</tspan></text><rect x="10" y="267" width="920" height="92.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="291.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Desde fuera, un tiempo agotado cubre tres historias que el cliente no puede distinguir (petición perdida, respuesta</tspan></text><text x="470" y="308.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">perdida, respuesta lenta). Reintentar sin una clave de idempotencia duplica el efecto en la mayoría de los casos. El perfil</tspan></text><text x="470" y="325.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">se lee petición perdida · respuesta perdida · respuesta lenta. Las tres probabilidades son supuestos del autor; la</tspan></text><text x="470" y="341.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">proporción cambia con ellas, el mecanismo no.</tspan></text><text x="470" y="389.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelos sintéticos con semilla fija; resultados idénticos en Windows y Ubuntu (WSL2) salvo donde se indica.</tspan></text></svg>
