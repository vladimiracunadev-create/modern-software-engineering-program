<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 327" width="940" height="327" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Radio de una credencial filtrada: 3 ambientes × 5 servicios × 6 recursos (3 000 fugas al azar)</title><desc id="d">Tabla: si la credencial filtrada vale en todos los ambientes alcanza 90 recursos de 90 y 30 de los 30 de producción; con una credencial por ambiente alcanza 30 y 10 de producción de media; con una por servicio y ambiente alcanza 6 y 1,9 de producción de media.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="327" fill="#ffffff"/><rect x="10" y="12" width="474" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="247" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="247" dy="0">Esquema de credenciales</tspan></text><rect x="490" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="602" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="602" dy="0">Recursos alcanzados de 90</tspan></text><rect x="720" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="822" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="822" dy="0">De producción (de 30)</tspan></text><rect x="10" y="56" width="474" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="82.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">Una credencial válida en todos los ambientes</tspan></text><rect x="490" y="56" width="224" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="82.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">90</tspan></text><rect x="720" y="56" width="204" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="82.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">30</tspan></text><rect x="10" y="108" width="474" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="134.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">Una credencial por ambiente</tspan></text><rect x="490" y="108" width="224" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="134.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">30</tspan></text><rect x="720" y="108" width="204" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="134.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">10</tspan></text><rect x="10" y="160" width="474" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="186.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">Una credencial por servicio y ambiente</tspan></text><rect x="490" y="160" width="224" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="186.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">6</tspan></text><rect x="720" y="160" width="204" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="186.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">1,9</tspan></text><rect x="10" y="216" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="240.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Separar ambientes y servicios no evita la fuga: reduce lo que vale lo filtrado. La separación no cubre los datos: una copia</tspan></text><text x="470" y="257.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de producción en staging expone todos los registros aunque la credencial de staging no abra producción. La fuga uniforme</tspan></text><text x="470" y="274.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">entre ambientes es un supuesto del autor.</tspan></text><text x="470" y="313.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
