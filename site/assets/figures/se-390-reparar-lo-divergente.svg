<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 374" width="940" height="374" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reparar dos lados que divergieron: entregas que conserva el último escritor gana frente a un tipo que se fusiona</title><desc id="d">Mancuernas con las entregas conservadas tras una partición: el último escritor gana conserva 1 048 de 2 059 entregas contadas y 500 de 750 entregas distintas; un contador por réplica y una unión de conjuntos conservan las 2 059 y las 750.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="374" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Reparar dos lados que divergieron: entregas que conserva el último escritor gana frente a un tipo que se</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">fusiona</tspan></text><circle cx="22" cy="70" r="6" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Último escritor gana</tspan></text><circle cx="220.8" cy="70" r="6" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="234.8" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="234.8" dy="0">Tipo que se fusiona</tspan></text><line x1="342.3" y1="96" x2="342.3" y2="176" stroke="#d5dde1" stroke-width="1"/><line x1="342.3" y1="176" x2="342.3" y2="181" stroke="#5b7280" stroke-width="1.4"/><text x="342.3" y="197" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="342.3" dy="0">0</tspan></text><line x1="432.908" y1="96" x2="432.908" y2="176" stroke="#d5dde1" stroke-width="1"/><line x1="432.908" y1="176" x2="432.908" y2="181" stroke="#5b7280" stroke-width="1.4"/><text x="432.908" y="197" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432.908" dy="0">500</tspan></text><line x1="523.516" y1="96" x2="523.516" y2="176" stroke="#d5dde1" stroke-width="1"/><line x1="523.516" y1="176" x2="523.516" y2="181" stroke="#5b7280" stroke-width="1.4"/><text x="523.516" y="197" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="523.516" dy="0">1 000</tspan></text><line x1="614.124" y1="96" x2="614.124" y2="176" stroke="#d5dde1" stroke-width="1"/><line x1="614.124" y1="176" x2="614.124" y2="181" stroke="#5b7280" stroke-width="1.4"/><text x="614.124" y="197" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="614.124" dy="0">1 500</tspan></text><line x1="704.732" y1="96" x2="704.732" y2="176" stroke="#d5dde1" stroke-width="1"/><line x1="704.732" y1="176" x2="704.732" y2="181" stroke="#5b7280" stroke-width="1.4"/><text x="704.732" y="197" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.732" dy="0">2 000</tspan></text><line x1="795.34" y1="96" x2="795.34" y2="176" stroke="#d5dde1" stroke-width="1"/><line x1="795.34" y1="176" x2="795.34" y2="181" stroke="#5b7280" stroke-width="1.4"/><text x="795.34" y="197" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="795.34" dy="0">2 500</tspan></text><line x1="342.3" y1="176" x2="795.34" y2="176" stroke="#5b7280" stroke-width="1.6"/><text x="274" y="120.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="274" dy="0">Contador de entregas (2 059 reales)</tspan></text><text x="274" y="160.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="274" dy="0">Conjunto de entregas (750 reales)</tspan></text><line x1="532.214" y1="116" x2="715.424" y2="116" stroke="#087f8c" stroke-width="4"/><circle cx="532.214" cy="116" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="715.424" cy="116" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="520.214" y="120.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="520.214" dy="0">1 048</tspan></text><text x="727.424" y="120.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="727.424" dy="0">2 059</tspan></text><text x="926" y="120.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">+1 011</tspan></text><line x1="432.908" y1="156" x2="478.212" y2="156" stroke="#087f8c" stroke-width="4"/><circle cx="432.908" cy="156" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="478.212" cy="156" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="420.908" y="160.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="420.908" dy="0">500</tspan></text><text x="490.212" y="160.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="490.212" dy="0">750</tspan></text><text x="926" y="160.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">+250</tspan></text><text x="568.82" y="220" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="568.82" dy="0">Entregas conservadas</tspan></text><rect x="10" y="234" width="920" height="92.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="258.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fusionar sin perder nada es posible cuando la operación conmuta y se tolera su semántica: sumar sí, borrar no sin más</tspan></text><text x="470" y="275.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">información (la unión simple resucita 50 entregas que se habían borrado en un lado). Cada tipo fusionable fija qué</tspan></text><text x="470" y="292.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">conflictos resuelve. Las cantidades salen de semilla 3423; la latencia de 1 ms frente a 81 ms de replicar de forma síncrona</tspan></text><text x="470" y="308.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">entre regiones es un supuesto.</tspan></text><text x="470" y="356.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelos sintéticos con semilla fija; resultados idénticos en Windows y Ubuntu (WSL2) salvo donde se indica.</tspan></text></svg>
