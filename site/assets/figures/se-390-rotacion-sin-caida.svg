<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 363" width="940" height="363" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Rotar una clave entre 20 instancias (100 solicitudes por segundo, 600 s, 10 semillas)</title><desc id="d">Tabla: aceptar solo la clave nueva desde el inicio falla el 28,77 por ciento de las solicitudes; aceptar ambas y cerrar a los 360 segundos falla el 1,59 por ciento cuando una instancia no recargó; cerrar solo cuando ninguna instancia usa la vieja no falla ninguna y mantiene la vieja aceptada 538 segundos de media.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="363" fill="#ffffff"/><rect x="10" y="12" width="434" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="227" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="227" dy="0">Estrategia de rotación</tspan></text><rect x="450" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="582" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="582" dy="0">Solicitudes fallidas</tspan></text><rect x="720" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="822" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="822" dy="0">Segundos con la clave</tspan></text><text x="822" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="822" dy="0">vieja aceptada</tspan></text><rect x="10" y="56" width="434" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="88.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">Corte: el verificador solo acepta la nueva desde el segundo 0</tspan></text><rect x="450" y="56" width="264" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">17 262 de 60 000 (28,77 %)</tspan></text><rect x="720" y="56" width="204" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">0</tspan></text><rect x="10" y="120" width="434" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="152.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">Doble validez con cierre fijo a los 360 s</tspan></text><rect x="450" y="120" width="264" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">956 de 60 000 (1,59 %)</tspan></text><rect x="720" y="120" width="204" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">360</tspan></text><rect x="10" y="184" width="434" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="208.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">Doble validez; se cierra cuando ninguna instancia usa la</tspan></text><text x="227" y="224.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">vieja</tspan></text><rect x="450" y="184" width="264" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">0 de 60 000 (0 %)</tspan></text><rect x="720" y="184" width="204" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">538</tspan></text><rect x="10" y="252" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="276.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Rotar sin caída cuesta una ventana en que dos secretos valen. En 8 de las 10 semillas una instancia no recarga: el cierre</tspan></text><text x="470" y="293.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">fijo la deja fuera y el cierre condicionado la espera, es decir, una rotación incompleta es visible en vez de silenciosa.</tspan></text><text x="470" y="310.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Los tiempos de recarga (0 a 300 s) son un supuesto del autor.</tspan></text><text x="470" y="349.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
