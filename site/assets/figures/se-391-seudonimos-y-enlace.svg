<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 411" width="940" height="411" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Seudonimizar 20 000 correos (12 000 en una lista de 100 000 candidatos): qué se reidentifica y qué se enlaza</title><desc id="d">Tabla: un hash SHA-256 sin sal de 12 000 correos presentes en una lista de 100 000 candidatos los reidentifica todos; un HMAC con clave no reidentifica ninguno sin la clave; si dos conjuntos usan el mismo HMAC se enlazan 6 000 de 6 000 y con una clave por propósito ninguno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="411" fill="#ffffff"/><rect x="10" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Técnica</tspan></text><rect x="390" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="497" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="497" dy="0">Resultado</tspan></text><rect x="610" y="12" width="314" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="767" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="767" dy="0">Condición</tspan></text><rect x="10" y="56" width="374" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="88.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">SHA-256 sin sal del correo</tspan></text><rect x="390" y="56" width="214" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="497" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="497" dy="0">12 000 de 12 000</tspan></text><rect x="610" y="56" width="314" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="80.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">Cualquiera con la lista de correos</tspan></text><text x="767" y="96.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">candidatos</tspan></text><rect x="10" y="120" width="374" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="144.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">HMAC-SHA256 con clave del servidor, atacante sin</tspan></text><text x="197" y="160.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">clave</tspan></text><rect x="390" y="120" width="214" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="497" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="497" dy="0">0 de 12 000</tspan></text><rect x="610" y="120" width="314" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="144.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">Se necesita la clave para repetir el</tspan></text><text x="767" y="160.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">cálculo</tspan></text><rect x="10" y="184" width="374" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="216.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Mismo HMAC en dos conjuntos de datos</tspan></text><rect x="390" y="184" width="214" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="497" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="497" dy="0">6 000 de 6 000 enlazados</tspan></text><rect x="610" y="184" width="314" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="216.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">El seudónimo permite cruzar los conjuntos</tspan></text><rect x="10" y="248" width="374" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="280.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">HMAC con una clave distinta por propósito</tspan></text><rect x="390" y="248" width="214" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="497" y="280.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="497" dy="0">0 de 6 000 enlazados</tspan></text><rect x="610" y="248" width="314" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="272.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">Los conjuntos dejan de ser cruzables sin la</tspan></text><text x="767" y="288.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">clave</tspan></text><rect x="10" y="316" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="340.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Un hash sin clave de un dato adivinable es una forma de publicarlo. La seudonimización con clave sigue siendo dato personal</tspan></text><text x="470" y="357.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">para quien tiene la clave. Las listas de correos y los porcentajes son del autor; no se usó ningún dato de personas reales.</tspan></text><text x="470" y="397.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
