<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 403" width="940" height="403" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">5 000 estudiantes sintéticos: cuántos son únicos según cuánto se generalizan cuatro atributos</title><desc id="d">Tabla: con año de nacimiento, comuna, curso y género exactos el 88,2 por ciento de las 5 000 personas es única y todas están en grupos de menos de cinco; generalizando año y comuna baja a 44,5 por ciento; con tramos de cinco años, región y sin curso el grupo mínimo es de tres personas; con macrozona y sin género es de 63.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="403" fill="#ffffff"/><rect x="10" y="12" width="394" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="207" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="207" dy="0">Nivel de generalización</tspan></text><rect x="410" y="12" width="84" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="452" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="452" dy="0">Grupos</tspan></text><rect x="500" y="12" width="94" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="547" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="547" dy="0">k mínimo</tspan></text><rect x="600" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="672" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspa