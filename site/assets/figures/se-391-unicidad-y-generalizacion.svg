stroke="#5b7280" stroke-width="1.6"/><text x="452" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">3 268</tspan></text><rect x="500" y="114" width="94" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="547" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547" dy="0">1</tspan></text><rect x="600" y="114" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">44,5 %</tspan></text><rect x="750" y="114" width="174" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">90,6 %</tspan></text><rect x="10" y="172" width="394" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="201.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Tramos de 5 años, región, sin curso</tspan></text><rect x="410" y="172" width="84" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">191</tspan></text><rect x="500" y="172" width="94" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="547" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547" dy="0">3</tspan></text><rect x="600" y="172" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">0,0 %</tspan></text><rect x="750" y="172" width="174" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">0,9 %</tspan></text><rect x="10" y="230" width="394" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="259.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Tramos de 5 años, macrozona, sin curso ni género</tspan></text><rect x="410" y="230" width="84" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">12</tspan></text><rect x="500" y="230" width="94" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="547" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547" dy="0">63</tspan></text><rect x="600" y="230" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">0,0 %</tspan></text><rect x="750" y="230" width="174" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">0,0 %</tspan></text><rect x="10" y="292" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="316.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Ningún dato de la tabla es un nombre y aun así el 88,2 % se distingue de los demás. Generalizar reduce la unicidad y</tspan></text><text x="470" y="333.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">también la utilidad: con 12 grupos solo se puede contar por macrozona. La distribución de comunas y de años es del autor, y</tspan></text><text x="470" y="350.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">k-anonimato no protege frente a quien conoce otros datos.</tspan></text><text x="470" y="389.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
