<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 299" width="940" height="299" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ocho reglas de ast sobre 60 fragmentos de código (24 con defecto sencillo, 6 con defecto difícil, 30 seguros)</title><desc id="d">Tabla: las reglas de ast encuentran los 24 defectos sencillos sin falsas alarmas y ninguno de los 6 defectos difíciles, y marcan 2 de los 6 fragmentos seguros difíciles, uno que define su propia función eval y otro que usa md5 para un uso que no es de seguridad.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="299" fill="#ffffff"/><rect x="10" y="12" width="494" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="257" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="257" dy="0">Tipo de fragmento</tspan></text><rect x="510" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="577" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="577" dy="0">Con defecto</tspan></text><rect x="650" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="717" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="717" dy="0">Detectados</tspan></text><rect x="790" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="857" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="857" dy="0">Seguros</tspan></text><text x="857" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="857" dy="0">marcados</tspan></text><rect x="10" y="56" width="494" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="88.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Fragmentos sencillos (llamada directa, argumento literal)</tspan></text><rect x="510" y="56" width="134" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">24</tspan></text><rect x="650" y="56" width="134" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">24</tspan></text><rect x="790" y="56" width="134" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="857" y="88.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">0</tspan></text><rect x="10" y="120" width="494" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="257" y="144.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">Fragmentos difíciles (alias, flujo de datos, comentarios, suma de</tspan></text><text x="257" y="160.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="257" dy="0">cadenas)</tspan></text><rect x="510" y="120" width="134" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">6</tspan></text><rect x="650" y="120" width="134" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="717" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717" dy="0">0</tspan></text><rect x="790" y="120" width="134" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="857" y="152.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">2</tspan></text><rect x="10" y="188" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="212.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Una regla sintáctica ve la forma de la llamada, no el flujo del dato: no sigue alias (from subprocess import run as r),</tspan></text><text x="470" y="229.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">variables que valen True, yaml.FullLoader ni una contraseña armada con una suma. Las 2 falsas alarmas son lo contrario: una</tspan></text><text x="470" y="246.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">función propia llamada eval y md5 con usedforsecurity=False. Reglas y fragmentos son del autor.</tspan></text><text x="470" y="285.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
