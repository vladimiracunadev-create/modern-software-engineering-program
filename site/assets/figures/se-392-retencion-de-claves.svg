<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 539" width="940" height="539" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Duplicados que se reejecutan porque la clave de idempotencia ya se olvidó, según cuánto se retiene la clave</title><desc id="d">Línea en escala logarítmica con los duplicados reejecutados de 20 000, según la retención de la clave: 48,20 por ciento con 1 minuto, 2,75 con 1 hora y 0,03 con 24 horas; con 7 días no escapa ninguno (0 de 20 000, no representable en escala logarítmica). La cola larga del retraso obliga a retener mucho más que la mediana de 55 s.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="539" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Duplicados que se reejecutan porque la clave de idempotencia ya se olvidó, según cuánto se retiene la clave</tspan></text><line x1="86.16" y1="339" x2="910" y2="339" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="339" x2="86.16" y2="339" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="343.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">0,01</tspan></text><line x1="86.16" y1="269" x2="910" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="269" x2="86.16" y2="269" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="273.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">0,1</tspan></text><line x1="86.16" y1="199" x2="910" y2="199" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="199" x2="86.16" y2="199" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="203.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">1</tspan></text><line x1="86.16" y1="129" x2="910" y2="129" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="129" x2="86.16" y2="129" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="133.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">10</tspan></text><line x1="86.16" y1="59" x2="910" y2="59" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="59" x2="86.16" y2="59" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="63.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">100</tspan></text><line x1="86.16" y1="59" x2="86.16" y2="339" stroke="#5b7280" stroke-width="1.6"/><line x1="104.16" y1="59" x2="104.16" y2="339" stroke="#d5dde1" stroke-width="1"/><line x1="104.16" y1="339" x2="104.16" y2="344" stroke="#5b7280" stroke-width="1.4"/><text x="104.16" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="104.16" dy="0">1 min</tspan></text><line x1="353.606" y1="59" x2="353.606" y2="339" stroke="#d5dde1" stroke-width="1"/><line x1="353.606" y1="339" x2="353.606" y2="344" stroke="#5b7280" stroke-width="1.4"/><text x="353.606" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="353.606" dy="0">10</tspan></text><line x1="547.712" y1="59" x2="547.712" y2="339" stroke="#d5dde1" stroke-width="1"/><line x1="547.712" y1="339" x2="547.712" y2="344" stroke="#5b7280" stroke-width="1.4"/><text x="547.712" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547.712" dy="0">1 h</tspan></text><line x1="892" y1="59" x2="892" y2="339" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="339" x2="892" y2="344" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">24 h</tspan></text><line x1="86.16" y1="339" x2="910" y2="339" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="199" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 199)">Duplicados reejecutados (% de 20 000) (escala logarítmica)</text><text x="498.08" y="385" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="498.08" dy="0">Retención de la clave (minutos; 1 h = 60, 24 h = 1 440) (escala logarítmica)</tspan></text><polyline points="104.16,81.1867 547.712,168.247 892,305.602" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="104.16" cy="81.1867" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="114.16" y="85.6867" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="114.16" dy="0">48,20 %</tspan></text><circle cx="547.712" cy="168.247" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="547.712" y="157.247" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="547.712" dy="0">2,75 %</tspan></text><circle cx="892" cy="305.602" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="294.602" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">0,03 %</tspan></text><rect x="10" y="399" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="423.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La retención de claves es una decisión de negocio sobre cuánto tarda en llegar el último duplicado posible, no un detalle</tspan></text><text x="470" y="440.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de almacenamiento: con 7 días, 0 de 20 000. Además, 615 de 640 reutilizaciones de una clave con otro cuerpo habrían</tspan></text><text x="470" y="457.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">devuelto la respuesta ajena sin la huella del cuerpo. La distribución lognormal (mediana 55 s, p99 9 209 s) es un supuesto</tspan></text><text x="470" y="473.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">del autor.</tspan></text><text x="470" y="521.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelos sintéticos con semilla fija; resultados idénticos en Windows y Ubuntu (WSL2) salvo donde se indica.</tspan></text></svg>
