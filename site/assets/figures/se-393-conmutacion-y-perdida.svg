<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" width="940" height="480" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Conmutar tras la caída del primario con 200 escrituras por segundo: costo de confirmar y escrituras perdidas</title><desc id="d">Intervalos con la latencia de confirmación en escala logarítmica: la replicación asíncrona confirma en 1,0 ms y pierde en promedio 6,11 escrituras ya confirmadas al conmutar; la semisíncrona confirma en 21,1 ms de mediana y 63,6 ms en el percentil 99 y no pierde ninguna; la síncrona, 27,5 y 75,3 ms, tampoco pierde.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="480" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Conmutar tras la caída del primario con 200 escrituras por segundo: costo de confirmar y escrituras perdidas</tspan></text><rect x="16" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">mediana</tspan></text><polygon points="122.78,44.1 129.38,56.4 116.18,56.4" fill="#946512" stroke="#946512" stroke-width="2"/><text x="136.78" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="136.78" dy="0">p99</tspan></text><line x1="344" y1="77" x2="344" y2="299" stroke="#d5dde1" stroke-width="1"/><line x1="344" y1="299" x2="344" y2="304" stroke="#5b7280" stroke-width="1.4"/><text x="344" y="320" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="344" dy="0">0,1</tspan></text><line x1="526" y1="77" x2="526" y2="299" stroke="#d5dde1" stroke-width="1"/><line x1="526" y1="299" x2="526" y2="304" stroke="#5b7280" stroke-width="1.4"/><text x="526" y="320" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="526" dy="0">1</tspan></text><line x1="708" y1="77" x2="708" y2="299" stroke="#d5dde1" stroke-width="1"/><line x1="708" y1="299" x2="708" y2="304" stroke="#5b7280" stroke-width="1.4"/><text x="708" y="320" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="708" dy="0">10</tspan></text><line x1="890" y1="77" x2="890" y2="299" stroke="#d5dde1" stroke-width="1"/><line x1="890" y1="299" x2="890" y2="304" stroke="#5b7280" stroke-width="1.4"/><text x="890" y="320" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="890" dy="0">100</tspan></text><line x1="344" y1="299" x2="890" y2="299" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="118.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Asíncrona · pierde 6,11 escrituras</tspan></text><text x="314" y="192.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Semisíncrona (1 réplica) · pierde 0</tspan></text><text x="314" y="266.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Síncrona (2 réplicas) · pierde 0</tspan></text><line x1="526" y1="114" x2="526" y2="114" stroke="#8a9aa3" stroke-width="5"/><polygon points="526,105.95 533.7,120.3 518.3,120.3" fill="#946512" stroke="#946512" stroke-width="2"/><rect x="519" y="107" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="526" y="98" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="526" dy="0">1,0 · mediana, p99</tspan></text><line x1="767.019" y1="188" x2="854.229" y2="188" stroke="#8a9aa3" stroke-width="5"/><rect x="760.019" y="181" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="767.019" y="172" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="767.019" dy="0">21,1</tspan></text><polygon points="854.229,179.95 861.929,194.3 846.529,194.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="854.229" y="217" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="854.229" dy="0">63,6</tspan></text><line x1="787.959" y1="262" x2="867.577" y2="262" stroke="#8a9aa3" stroke-width="5"/><rect x="780.959" y="255" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="787.959" y="246" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="787.959" dy="0">27,5</tspan></text><polygon points="867.577,253.95 875.277,268.3 859.877,268.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="867.577" y="291" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="867.577" dy="0">75,3</tspan></text><text x="617" y="343" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="617" dy="0">Milisegundos hasta confirmar la escritura (escala logarítmica)</tspan></text><rect x="10" y="357" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="381.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">La pérdida es el trabajo que el cliente ya consideró guardado y que la réplica nunca vio (6,11 escrituras en promedio con</tspan></text><text x="470" y="398.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">replicación asíncrona). Pagarlo en latencia lo evita: de 1 ms a 21–28 ms de mediana. El retraso de 30 ms y el tiempo de ida</tspan></text><text x="470" y="415.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">y vuelta lognormal son supuestos del autor, no una red medida.</tspan></text><text x="470" y="462.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelos sintéticos con semilla fija; resultados idénticos en Windows y Ubuntu (WSL2) salvo donde se indica.</tspan></text></svg>
