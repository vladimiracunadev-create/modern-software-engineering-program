<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 514" width="940" height="514" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Repartir por hash o por rango de fecha: fragmentos que toca cada operación (de 8)</title><desc id="d">Barras agrupadas horizontales con los fragmentos de 8 que toca cada operación: con reparto por hash, las 5 000 escrituras más recientes se reparten entre los 8 fragmentos y toda consulta de un tramo de claves toca los 8; con rangos fijos, las 5 000 escrituras caen en un solo fragmento y las consultas de 100 y 10 000 claves tocan uno y la de 50 000, cinco.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="514" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Repartir por hash o por rango de fecha: fragmentos que toca cada operación (de 8)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Reparto por hash</tspan></text><rect x="184.64" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="204.64" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="204.64" dy="0">Reparto por rango fijo</tspan></text><line x1="274" y1="77" x2="274" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="333" x2="274" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0</tspan></text><line x1="432.485" y1="77" x2="432.485" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="432.485" y1="333" x2="432.485" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="432.485" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432.485" dy="0">2</tspan></text><line x1="590.97" y1="77" x2="590.97" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="590.97" y1="333" x2="590.97" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="590.97" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="590.97" dy="0">4</tspan></text><line x1="749.455" y1="77" x2="749.455" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="749.455" y1="333" x2="749.455" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="749.455" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="749.455" dy="0">6</tspan></text><line x1="907.94" y1="77" x2="907.94" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="907.94" y1="333" x2="907.94" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="907.94" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907.94" dy="0">8</tspan></text><line x1="274" y1="333" x2="907.94" y2="333" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="113.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">5 000 escrituras recientes</tspan></text><text x="264" y="169" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Consulta de 100 claves</tspan></text><text x="264" y="186" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">consecutivas</tspan></text><text x="264" y="233" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Consulta de 10 000 claves</tspan></text><text x="264" y="250" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">consecutivas</tspan></text><text x="264" y="297" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Consulta de 50 000 claves</tspan></text><text x="264" y="314" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">consecutivas</tspan></text><rect x="274" y="83" width="633.94" height="24.5" rx="3" fill="#087f8c"/><text x="914.94" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="914.94" dy="0">8</tspan></text><rect x="274" y="110.5" width="79.2425" height="24.5" rx="3" fill="#c0432f"/><text x="360.243" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="360.243" dy="0">1</tspan></text><rect x="274" y="147" width="633.94" height="24.5" rx="3" fill="#087f8c"/><text x="914.94" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="914.94" dy="0">8</tspan></text><rect x="274" y="174.5" width="79.2425" height="24.5" rx="3" fill="#c0432f"/><text x="360.243" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="360.243" dy="0">1</tspan></text><rect x="274" y="211" width="633.94" height="24.5" rx="3" fill="#087f8c"/><text x="914.94" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="914.94" dy="0">8</tspan></text><rect x="274" y="238.5" width="79.2425" height="24.5" rx="3" fill="#c0432f"/><text x="360.243" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="360.243" dy="0">1</tspan></text><rect x="274" y="275" width="633.94" height="24.5" rx="3" fill="#087f8c"/><text x="914.94" y="291.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="914.94" dy="0">8</tspan></text><rect x="274" y="302.5" width="396.213" height="24.5" rx="3" fill="#c0432f"/><text x="677.213" y="319.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="677.213" dy="0">5</tspan></text><text x="590.97" y="377" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="590.97" dy="0">Fragmentos que toca la operación (de 8)</tspan></text><rect x="10" y="391" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="415.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Cada reparto abarata una pregunta y encarece la otra: el hash esparce la escritura (578 a 674 por fragmento) y dispersa la</tspan></text><text x="470" y="432.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">lectura por rango; el rango agrupa la lectura y acumula las 5 000 escrituras nuevas en un fragmento. Ocho fragmentos y 100</tspan></text><text x="470" y="449.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">000 claves son sintéticos; el hash es MD5 solo por su reparto, no por seguridad.</tspan></text><text x="470" y="496.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelos sintéticos con semilla fija; resultados idénticos en Windows y Ubuntu (WSL2) salvo donde se indica.</tspan></text></svg>
