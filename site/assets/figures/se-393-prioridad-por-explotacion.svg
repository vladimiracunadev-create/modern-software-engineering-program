<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 379" width="940" height="379" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">3 000 vulnerabilidades sintéticas (83 explotadas): cuántas se parchean y cuántas explotadas se cubren</title><desc id="d">Tabla: parchear todo lo de CVSS 7 o más exige 1 076 parches y cubre 40 de las 83 explotadas; CVSS 9 o más, 236 parches y 14; parchear solo las explotadas conocidas, 83 parches y 83; la unión con CVSS 9 o más, 305 parches y 83.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="379" fill="#ffffff"/><rect x="10" y="12" width="434" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="227" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="227" dy="0">Estrategia</tspan></text><rect x="450" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="557" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="557" dy="0">Parches a aplicar</tspan></text><rect x="670" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="797" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="797" dy="0">Explotadas cubiertas</tspan></text><rect x="10" y="56" width="434" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="82.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">CVSS de 7 o más</tspan></text><rect x="450" y="56" width="214" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="82.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">1 076</tspan></text><rect x="670" y="56" width="254" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="82.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">40 de 83</tspan></text><rect x="10" y="108" width="434" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="134.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">CVSS de 9 o más</tspan></text><rect x="450" y="108" width="214" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="134.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">236</tspan></text><rect x="670" y="108" width="254" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="134.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">14 de 83</tspan></text><rect x="10" y="160" width="434" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="186.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">Lista de explotación conocida</tspan></text><rect x="450" y="160" width="214" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="186.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">83</tspan></text><rect x="670" y="160" width="254" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="186.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">83 de 83</tspan></text><rect x="10" y="212" width="434" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="238.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">Explotadas más CVSS de 9 o más</tspan></text><rect x="450" y="212" width="214" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="238.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">305</tspan></text><rect x="670" y="212" width="254" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="238.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">83 de 83</tspan></text><rect x="10" y="268" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="292.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Es un ejemplo de mecanismo: la gravedad describe el daño posible y la explotación observada describe la probabilidad. Aquí</tspan></text><text x="470" y="309.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">la correlación entre ambas es débil por supuesto del autor (2 % frente a 3,5 %); en el mundo real hay que medirla con</tspan></text><text x="470" y="326.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">listas como KEV y EPSS. La lista conocida solo cubre lo ya explotado.</tspan></text><text x="470" y="365.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
