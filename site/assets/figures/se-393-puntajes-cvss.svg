<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 519" width="910" height="519" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres analistas puntúan con CVSS v3.1 el mismo hallazgo: puntajes y banda según su lectura del vector</title><desc id="d">Tabla: tres lecturas razonables del vector CVSS de seis hallazgos dan rangos de hasta 3,8 puntos; la denegación por expresión regular va de 3,7 a 7,5, es decir de baja a alta, y la inyección SQL de 7,1 a 9,8, de alta a crítica.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="910" height="519" fill="#ffffff"/><rect x="10" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Hallazgo</tspan></text><rect x="390" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="482" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="482" dy="0">Tres puntajes</tspan></text><rect x="580" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="647" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="647" dy="0">Rango</tspan></text><rect x="720" y="12" width="174" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="807" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="807" dy="0">Bandas</tspan></text><rect x="10" y="56" width="374" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="85.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Lectura de notas ajenas por identificador</tspan></text><rect x="390" y="56" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">6,5 · 4,3 · 7,5</tspan></text><rect x="580" y="56" width="134" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">4,3 – 7,5</tspan></text><rect x="720" y="56" width="174" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">media – alta</tspan></text><rect x="10" y="114" width="374" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="143.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Cambio de nota sin comprobar el dueño</tspan></text><rect x="390" y="114" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">6,5 · 5,4 · 5,3</tspan></text><rect x="580" y="114" width="134" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">5,3 – 6,5</tspan></text><rect x="720" y="114" width="174" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">media</tspan></text><rect x="10" y="172" width="374" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="201.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">XSS almacenado en un comentario</tspan></text><rect x="390" y="172" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">5,4 · 4,6 · 6,1</tspan></text><rect x="580" y="172" width="134" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">4,6 – 6,1</tspan></text><rect x="720" y="172" width="174" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">media</tspan></text><rect x="10" y="230" width="374" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="259.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Inyección SQL en la búsqueda de entregas</tspan></text><rect x="390" y="230" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">9,8 · 8,8 · 7,1</tspan></text><rect x="580" y="230" width="134" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">7,1 – 9,8</tspan></text><rect x="720" y="230" width="174" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">alta – crítica</tspan></text><rect x="10" y="288" width="374" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="317.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Secreto en un registro accesible a soporte</tspan></text><rect x="390" y="288" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="317.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">5,5 · 4,9 · 2,3</tspan></text><rect x="580" y="288" width="134" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="317.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">2,3 – 5,5</tspan></text><rect x="720" y="288" width="174" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="317.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">baja – media</tspan></text><rect x="10" y="346" width="374" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="375.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Denegación por expresión regular catastrófica</tspan></text><rect x="390" y="346" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="375.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">7,5 · 6,5 · 3,7</tspan></text><rect x="580" y="346" width="134" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="375.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">3,7 – 7,5</tspan></text><rect x="720" y="346" width="174" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="375.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">baja – alta</tspan></text><rect x="10" y="408" width="890" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="455" y="432.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455" dy="0">La fórmula es determinista (9,8 para AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H, 6,1 para el XSS reflejado clásico); lo</tspan></text><text x="455" y="449.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455" dy="0">subjetivo es elegir cada métrica del vector: alcance de red o adyacente, privilegio requerido, complejidad. Los</tspan></text><text x="455" y="466.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455" dy="0">vectores de cada analista los escribió el autor para ilustrar lecturas posibles, no son de analistas reales.</tspan></text><text x="455" y="505.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="455" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
