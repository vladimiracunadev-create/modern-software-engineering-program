<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 321" width="940" height="321" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">307 informes de vulnerabilidad en un año (60 % válidos), horario laboral de lunes a viernes de 9 a 17 h</title><desc id="d">Tabla: con una persona de triaje la mediana hasta el primer acuse es de 27,7 horas y el percentil 99 de 144,2; con dos baja a 10,6 y 63,2; con tres a 9,7 y 63,2, porque el límite pasa a ser el horario y no la cola.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="321" fill="#ffffff"/><rect x="10" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="137" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="137" dy="0">Personas de triaje</tspan></text><rect x="270" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="367" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="367" dy="0">Mediana (h)</tspan></text><rect x="470" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="582" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="582" dy="0">Percentil 90 (h)</tspan></text><rect x="700" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="812" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="812" dy="0">Percentil 99 (h)</tspan></text><rect x="10" y="56" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">1</tspan></text><rect x="270" y="56" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="367" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="367" dy="0">27,7</tspan></text><rect x="470" y="56" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">94,0</tspan></text><rect x="700" y="56" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">144,2</tspan></text><rect x="10" y="106" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">2</tspan></text><rect x="270" y="106" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="367" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="367" dy="0">10,6</tspan></text><rect x="470" y="106" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">52,2</tspan></text><rect x="700" y="106" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">63,2</tspan></text><rect x="10" y="156" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">3</tspan></text><rect x="270" y="156" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="367" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="367" dy="0">9,7</tspan></text><rect x="470" y="156" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">51,3</tspan></text><rect x="700" y="156" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">63,2</tspan></text><rect x="10" y="210" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="234.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Pasar de una a dos personas recorta la espera a la mitad; la tercera casi no cambia nada porque los informes del viernes</tspan></text><text x="470" y="251.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">por la tarde esperan al lunes. Una política de «acuse en 72 horas» pide dos personas o un acuse automático. Las llegadas (6</tspan></text><text x="470" y="268.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">por semana) y los tiempos son del autor.</tspan></text><text x="470" y="307.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
