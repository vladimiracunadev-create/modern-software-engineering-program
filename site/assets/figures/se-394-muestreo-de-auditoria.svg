<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 550" width="940" height="550" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Muestrear 2 000 eventos con 30 defectos (1,5 %): probabilidad de que la muestra contenga al menos un defecto</title><desc id="d">Barras agrupadas con la probabilidad de que una muestra aleatoria contenga al menos un defecto: 14,1 por ciento con 10 eventos, 31,6 con 25, 60,2 con 60, 78,8 con 100 y 95,9 con 200, valores que la simulación de 20 000 repeticiones reproduce.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="550" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Muestrear 2 000 eventos con 30 defectos (1,5 %): probabilidad de que la muestra contenga al menos un defecto</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Probabilidad exacta</tspan></text><rect x="207.26" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="227.26" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="227.26" dy="0">Simulada (20 000)</tspan></text><line x1="78.62" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="375" x2="78.62" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="319" x2="920" y2="319" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="319" x2="78.62" y2="319" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="323.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">20</tspan></text><line x1="78.62" y1="263" x2="920" y2="263" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="263" x2="78.62" y2="263" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="267.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">40</tspan></text><line x1="78.62" y1="207" x2="920" y2="207" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="207" x2="78.62" y2="207" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="211.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">60</tspan></text><line x1="78.62" y1="151" x2="920" y2="151" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="151" x2="78.62" y2="151" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="155.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">80</tspan></text><line x1="78.62" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="95" x2="78.62" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="95" x2="78.62" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">% de muestras con al menos un defecto</text><rect x="95.4476" y="335.52" width="65.3104" height="39.48" rx="3" fill="#087f8c"/><text x="128.103" y="329.52" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="128.103" dy="0">14,1</tspan></text><rect x="164.758" y="336.08" width="65.3104" height="38.92" rx="3" fill="#6b7c86"/><text x="197.413" y="330.08" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197.413" dy="0">13,9</tspan></text><text x="162.758" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="162.758" dy="0">10 eventos</tspan></text><rect x="263.724" y="286.52" width="65.3104" height="88.48" rx="3" fill="#087f8c"/><text x="296.379" y="280.52" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="296.379" dy="0">31,6</tspan></text><rect x="333.034" y="286.52" width="65.3104" height="88.48" rx="3" fill="#6b7c86"/><text x="365.689" y="280.52" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="365.689" dy="0">31,6</tspan></text><text x="331.034" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="331.034" dy="0">25 eventos</tspan></text><rect x="432" y="206.44" width="65.3104" height="168.56" rx="3" fill="#087f8c"/><text x="464.655" y="200.44" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="464.655" dy="0">60,2</tspan></text><rect x="501.31" y="206.16" width="65.3104" height="168.84" rx="3" fill="#6b7c86"/><text x="533.965" y="200.16" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="533.965" dy="0">60,3</tspan></text><text x="499.31" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="499.31" dy="0">60 eventos</tspan></text><rect x="600.276" y="154.36" width="65.3104" height="220.64" rx="3" fill="#087f8c"/><text x="632.931" y="148.36" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="632.931" dy="0">78,8</tspan></text><rect x="669.586" y="154.36" width="65.3104" height="220.64" rx="3" fill="#6b7c86"/><text x="702.241" y="148.36" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="702.241" dy="0">78,8</tspan></text><text x="667.586" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667.586" dy="0">100 eventos</tspan></text><rect x="768.552" y="106.48" width="65.3104" height="268.52" rx="3" fill="#087f8c"/><text x="801.207" y="100.48" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="801.207" dy="0">95,9</tspan></text><rect x="837.862" y="106.2" width="65.3104" height="268.8" rx="3" fill="#6b7c86"/><text x="870.517" y="100.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="870.517" dy="0">96,0</tspan></text><text x="835.862" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="835.862" dy="0">200 eventos</tspan></text><rect x="10" y="427" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Una muestra de 25 «sin hallazgos» no prueba control: con 1,5 % de defectos ocurre el 68 % de las veces. Si los defectos se</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">concentran (cuentas de servicio: 4 % de los eventos y 60 % de los defectos), 25 eventos al azar encuentran uno el 31,6 % de</tspan></text><text x="470" y="485.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">las veces; 15 de ese estrato más 10 del resto, el 98,7 %.</tspan></text><text x="470" y="532.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
