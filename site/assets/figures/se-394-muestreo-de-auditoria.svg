<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 411" width="940" height="411" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Muestrear 2 000 eventos con 30 defectos (1,5 %): probabilidad de que la muestra contenga al menos un defecto</title><desc id="d">Tabla: una muestra aleatoria de 25 eventos encuentra al menos un defecto el 31,6 por ciento de las veces, una de 60 el 60,2 por ciento y una de 200 el 95,9 por ciento, valores que la simulación de 20 000 repeticiones reproduce.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="411" fill="#ffffff"/><rect x="10" y="12" width="354" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="187" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="187" dy="0">Tamaño de la muestra</tspan></text><rect x="370" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="507" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="507" dy="0">Probabilidad exacta</tspan></text><rect x="650" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="787" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="787" dy="0">Simulada (20 000)</tspan></text><rect x="10" y="56" width="354" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="187" y="80.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="187" dy="0">10</tspan></text><rect x="370" y="56" width=