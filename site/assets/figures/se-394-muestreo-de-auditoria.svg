="1.6"/><text x="187" y="224.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="187" dy="0">100</tspan></text><rect x="370" y="200" width="274" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="507" y="224.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">78,8 %</tspan></text><rect x="650" y="200" width="274" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="224.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">78,8 %</tspan></text><rect x="10" y="248" width="354" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="187" y="272.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="187" dy="0">200</tspan></text><rect x="370" y="248" width="274" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="507" y="272.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">95,9 %</tspan></text><rect x="650" y="248" width="274" height="42" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="272.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">96,0 %</tspan></text><rect x="10" y="300" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="324.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Una muestra de 25 «sin hallazgos» no prueba control: con 1,5 % de defectos ocurre el 68 % de las veces. Si los defectos se</tspan></text><text x="470" y="341.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">concentran (cuentas de servicio: 4 % de los eventos y 60 % de los defectos), 25 eventos al azar encuentran uno el 31,6 % de</tspan></text><text x="470" y="358.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">las veces; 15 de ese estrato más 10 del resto, el 98,7 %.</tspan></text><text x="470" y="397.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
