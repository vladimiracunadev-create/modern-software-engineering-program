<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 554" width="940" height="554" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El mismo defecto en 1 620 de 1 680 intercalaciones: ejecuciones al azar hasta verlo según el planificador</title><desc id="d">Intervalos en escala logarítmica con las ejecuciones hasta el primer fallo (mediana y percentil 95) según la probabilidad de cambiar de hilo: con 1,0 el defecto aparece en 1 y 2 ejecuciones y falla el 84,35 por ciento; con 0,1, en 5 y 17; con 0,03 solo falla el 4,84 por ciento de las ejecuciones y hacen falta 14 de mediana y 57 en el percentil 95.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="554" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">El mismo defecto en 1 620 de 1 680 intercalaciones: ejecuciones al azar hasta verlo según el planificador</tspan></text><rect x="16" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">mediana</tspan></text><polygon points="122.78,44.1 129.38,56.4 116.18,56.4" fill="#946512" stroke="#946512" stroke-width="2"/><text x="136.78" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="136.78" dy="0">p95</tspan></text><line x1="344" y1="77" x2="344" y2="373" stroke="#d5dde1" stroke-width="1"/><line x1="344" y1="373" x2="344" y2="378" stroke="#5b7280" stroke-width="1.4"/><text x="344" y="394" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="344" dy="0">0,1</tspan></text><line x1="526" y1="77" x2="526" y2="373" stroke="#d5dde1" stroke-width="1"/><line x1="526" y1="373" x2="526" y2="378" stroke="#5b7280" stroke-width="1.4"/><text x="526" y="394" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="526" dy="0">1</tspan></text><line x1="708" y1="77" x2="708" y2="373" stroke="#d5dde1" stroke-width="1"/><line x1="708" y1="373" x2="708" y2="378" stroke="#5b7280" stroke-width="1.4"/><text x="708" y="394" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="708" dy="0">10</tspan></text><line x1="890" y1="77" x2="890" y2="373" stroke="#d5dde1" stroke-width="1"/><line x1="890" y1="373" x2="890" y2="378" stroke="#5b7280" stroke-width="1.4"/><text x="890" y="394" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="890" dy="0">100</tspan></text><line x1="344" y1="373" x2="890" y2="373" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="118.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Cambio de hilo 1,0 · falla el 84,35 %</tspan></text><text x="314" y="192.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Cambio 0,3 · falla el 40,34 %</tspan></text><text x="314" y="266.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Cambio 0,1 · falla el 15,41 %</tspan></text><text x="314" y="340.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Cambio 0,03 · falla el 4,84 %</tspan></text><line x1="526" y1="114" x2="580.787" y2="114" stroke="#8a9aa3" stroke-width="5"/><rect x="519" y="107" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="526" y="98" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="526" dy="0">1</tspan></text><polygon points="580.787,105.95 588.487,120.3 573.087,120.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="580.787" y="143" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="580.787" dy="0">2</tspan></text><line x1="580.787" y1="188" x2="667.624" y2="188" stroke="#8a9aa3" stroke-width="5"/><rect x="573.787" y="181" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="580.787" y="172" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="580.787" dy="0">2</tspan></text><polygon points="667.624,179.95 675.324,194.3 659.924,194.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="667.624" y="217" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="667.624" dy="0">6</tspan></text><line x1="653.213" y1="262" x2="749.942" y2="262" stroke="#8a9aa3" stroke-width="5"/><rect x="646.213" y="255" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="653.213" y="246" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="653.213" dy="0">5</tspan></text><polygon points="749.942,253.95 757.642,268.3 742.242,268.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="749.942" y="291" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="749.942" dy="0">17</tspan></text><line x1="734.595" y1="336" x2="845.569" y2="336" stroke="#8a9aa3" stroke-width="5"/><rect x="727.595" y="329" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="734.595" y="320" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="734.595" dy="0">14</tspan></text><polygon points="845.569,327.95 853.269,342.3 837.869,342.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="845.569" y="365" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="845.569" dy="0">57</tspan></text><text x="617" y="417" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="617" dy="0">Ejecuciones hasta el primer fallo (escala logarítmica)</tspan></text><rect x="10" y="431" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="455.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">No todas las intercalaciones son igual de probables: los planificadores reales mantienen un hilo en marcha un buen rato, y</tspan></text><text x="470" y="472.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">con hilos casi siempre seguidos (0,03) una pasada limpia dice poco. Una semilla guardada permite repetir exactamente el</tspan></text><text x="470" y="489.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">mismo orden (misma semilla, misma traza, comprobado).</tspan></text><text x="470" y="536.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelos sintéticos con semilla fija; resultados idénticos en Windows y Ubuntu (WSL2) salvo donde se indica.</tspan></text></svg>
