<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 421" width="940" height="421" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Defensa CSRF: cinco peticiones contra tres implementaciones (la primera solo comprueba que haya token)</title><desc id="d">Tabla: comprobar solo que el token exista acepta un token inventado, uno con un espacio y el de otra sesión; compararlo con un valor global rechaza los inventados pero acepta el de otra sesión y rechaza el token propio; ligarlo a la sesión con un HMAC rechaza lo ajeno y acepta lo propio.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="421" fill="#ffffff"/><rect x="10" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Petición</tspan></text><rect x="390" y="12" width="174" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="477" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="477" dy="0">Solo presencia</tspan></text><rect x="570" y="12" width="174" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="657" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="657" dy="0">Valor global</tspan></text><rect x="750" y="12" width="174" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="837" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="837" dy="0">Ligado a la sesión</tspan></text><rect x="10" y="56" width="374" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="81.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Sin token</tspan></text><rect x="390" y="56" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">rechaza</tspan></text><rect x="570" y="56" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="657" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="657" dy="0">rechaza</tspan></text><rect x="750" y="56" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">rechaza</tspan></text><rect x="10" y="106" width="374" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="131.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Token inventado</tspan></text><rect x="390" y="106" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">ACEPTA</tspan></text><rect x="570" y="106" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="657" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="657" dy="0">rechaza</tspan></text><rect x="750" y="106" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">rechaza</tspan></text><rect x="10" y="156" width="374" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="181.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Token con un espacio</tspan></text><rect x="390" y="156" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">ACEPTA</tspan></text><rect x="570" y="156" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="657" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="657" dy="0">rechaza</tspan></text><rect x="750" y="156" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">rechaza</tspan></text><rect x="10" y="206" width="374" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="231.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Token válido de la sesión de otra persona</tspan></text><rect x="390" y="206" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">ACEPTA</tspan></text><rect x="570" y="206" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="657" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="657" dy="0">ACEPTA</tspan></text><rect x="750" y="206" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">rechaza</tspan></text><rect x="10" y="256" width="374" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="281.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Token propio de la sesión</tspan></text><rect x="390" y="256" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="281.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">acepta</tspan></text><rect x="570" y="256" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="657" y="281.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="657" dy="0">rechaza</tspan></text><rect x="750" y="256" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="837" y="281.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837" dy="0">acepta</tspan></text><rect x="10" y="310" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="334.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las pruebas felices (token propio, sin token) pasan en la implementación débil: ninguna prueba que no intente falsificar</tspan></text><text x="470" y="351.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">detecta que el control es de apariencia. La implementación con valor global parece mejor y falla en la otra dirección. El</tspan></text><text x="470" y="368.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">token es un HMAC de la sesión, no un secreto compartido por todos.</tspan></text><text x="470" y="407.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
