<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 584" width="940" height="584" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">5 000 cargas al azar (puntos, barras, %2e, %2f): cuántas salen de la raíz según el control</title><desc id="d">Barras agrupadas con las cargas de 5 000 que salen de la raíz según el control: quitar una vez la secuencia punto punto barra deja salir 2072 con rutas POSIX y 2154 con rutas de Windows, quitarla en bucle 1106 y 1181, y decodificar, resolver y comprobar el prefijo 0 y 0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="584" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">5 000 cargas al azar (puntos, barras, %2e, %2f): cuántas salen de la raíz según el control</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Salen de la raíz (POSIX)</tspan></text><rect x="244.96" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="264.96" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="264.96" dy="0">Salen de la raíz (Windows)</tspan></text><line x1="93.7" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="375" x2="93.7" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">0</tspan></text><line x1="93.7" y1="319" x2="920" y2="319" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="319" x2="93.7" y2="319" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="323.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">500</tspan></text><line x1="93.7" y1="263" x2="920" y2="263" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="263" x2="93.7" y2="263" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="267.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1 000</tspan></text><line x1="93.7" y1="207" x2="920" y2="207" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="207" x2="93.7" y2="207" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="211.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1 500</tspan></text><line x1="93.7" y1="151" x2="920" y2="151" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="151" x2="93.7" y2="151" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="155.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">2 000</tspan></text><line x1="93.7" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="95" x2="93.7" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">2 500</tspan></text><line x1="93.7" y1="95" x2="93.7" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">cargas que salen de la raíz, de 5 000</text><rect x="121.243" y="142.936" width="108.173" height="232.064" rx="3" fill="#c0432f"/><text x="175.33" y="136.936" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="175.33" dy="0">2 072</tspan></text><rect x="233.417" y="133.752" width="108.173" height="241.248" rx="3" fill="#946512"/><text x="287.503" y="127.752" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287.503" dy="0">2 154</tspan></text><text x="231.417" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="231.417" dy="0">Quitar «../» una vez y decodificar</tspan></text><text x="231.417" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="231.417" dy="0">después</tspan></text><rect x="396.677" y="251.128" width="108.173" height="123.872" rx="3" fill="#c0432f"/><text x="450.763" y="245.128" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="450.763" dy="0">1 106</tspan></text><rect x="508.85" y="242.728" width="108.173" height="132.272" rx="3" fill="#946512"/><text x="562.937" y="236.728" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="562.937" dy="0">1 181</tspan></text><text x="506.85" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="506.85" dy="0">Quitar «../» en bucle y decodificar</tspan></text><text x="506.85" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="506.85" dy="0">después</tspan></text><rect x="672.11" y="373" width="108.173" height="2" rx="3" fill="#c0432f"/><text x="726.197" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="726.197" dy="0">0</tspan></text><rect x="784.283" y="373" width="108.173" height="2" rx="3" fill="#946512"/><text x="838.37" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="838.37" dy="0">0</tspan></text><text x="782.283" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.283" dy="0">Decodificar, resolver y comprobar el</tspan></text><text x="782.283" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.283" dy="0">prefijo de la raíz</tspan></text><rect x="10" y="444" width="920" height="92.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="468.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El tercer control rechaza 903 cargas en POSIX y 958 en Windows y deja salir ninguna. Quitar «../» una vez convierte</tspan></text><text x="470" y="485.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">«....//secreto» en «../secreto». El bucle cierra ese caso y falla con la decodificación posterior (%2e%2e%2f), y las barras</tspan></text><text x="470" y="502.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">invertidas de Windows son otro separador. La reparación no filtra: resuelve la ruta final y comprueba que sigue dentro de</tspan></text><text x="470" y="518.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">la raíz.</tspan></text><text x="470" y="566.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
