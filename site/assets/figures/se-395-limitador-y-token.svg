<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 720" width="940" height="720" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dos controles aparentes más: limitador por cabecera X-Forwarded-For y verificación de token que lee el algoritmo del propio token</title><desc id="d">Seis pruebas contra un limitador por cabecera y un verificador de token que lee el algoritmo, con el control aparente y el reparado: cambiar la cabecera permite 1000 intentos frente a 5; un token con algoritmo none y rol docente se acepta frente a rechazarse; los tokens con otra clave o carga alterada se rechazan en ambos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="720" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dos controles aparentes más: limitador por cabecera X-Forwarded-For y verificación de token que lee el</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">algoritmo del propio token</tspan></text><rect x="14" y="66" width="14" height="14" rx="3" fill="#c0432f"/><text x="36" y="78" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">falla o sorprende</tspan></text><rect x="183.2" y="66" width="14" height="14" rx="3" fill="#087f8c"/><text x="205.2" y="78" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="205.2" dy="0">se sostiene</tspan></text><rect x="306.8" y="66" width="14" height="14" rx="3" fill="#946512"/><text x="328.8" y="78" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="328.8" dy="0">depende</tspan></text><rect x="20" y="96" width="378" height="57.28" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="119.96" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">1 000 intentos con una cabecera distinta en cada</tspan></text><text x="30" y="136.6" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">uno</tspan></text><polyline points="402,124.64 438,124.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="442" y="96" width="478" height="57.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="452" y="128.28" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14"><tspan x="452" dy="0">Aparente: 1 000 permitidos · Reparado: 5 permitidos</tspan></text><text x="24" y="170.28" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">El limitador cuenta por un dato que controla el atacante.</tspan></text><rect x="20" y="191.92" width="378" height="40.64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="215.88" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">1 000 intentos sin cambiar de dirección</tspan></text><polyline points="402,212.24 438,212.24" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="442" y="191.92" width="478" height="40.64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="452" y="215.88" font-size="13" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="452" dy="0">Aparente: 5 permitidos · Reparado: 5 permitidos</tspan></text><text x="24" y="249.56" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">Sin trampa, los dos limitan igual.</tspan></text><rect x="20" y="271.2" width="378" height="40.64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="295.16" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">Token legítimo</tspan></text><polyline points="402,291.52 438,291.52" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="442" y="271.2" width="478" height="40.64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="452" y="295.16" font-size="13" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="452" dy="0">Aparente: acepta · Reparado: acepta</tspan></text><text x="24" y="328.84" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">Las pruebas felices pasan en ambos.</tspan></text><rect x="20" y="350.48" width="378" height="40.64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="374.44" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">Token con alg «none» y rol docente</tspan></text><polyline points="402,370.8 438,370.8" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="442" y="350.48" width="478" height="40.64" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="452" y="374.44" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14"><tspan x="452" dy="0">Aparente: ACEPTA · Reparado: rechaza</tspan></text><text x="24" y="408.12" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">El verificador confía en el encabezado del propio token.</tspan></text><rect x="20" y="429.76" width="378" height="40.64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="453.72" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">Token con la firma de otra clave</tspan></text><polyline points="402,450.08 438,450.08" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="442" y="429.76" width="478" height="40.64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="452" y="453.72" font-size="13" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="452" dy="0">Aparente: rechaza · Reparado: rechaza</tspan></text><text x="24" y="487.4" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">La firma sí se comprueba.</tspan></text><rect x="20" y="509.04" width="378" height="40.64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="533" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">Token con la carga alterada y la firma vieja</tspan></text><polyline points="402,529.36 438,529.36" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="442" y="509.04" width="478" height="40.64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="452" y="533" font-size="13" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="452" dy="0">Aparente: rechaza · Reparado: rechaza</tspan></text><text x="24" y="566.68" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">La firma sí se comprueba.</tspan></text><rect x="10" y="590.32" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="615.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">En ambos casos el control confía en un dato que controla el atacante: la cabecera y el encabezado del token. Con el control</tspan></text><text x="470" y="631.92" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">reparado solo cambia quién decide (la conexión, el servidor). Detrás de un proxy la reparación exige configurar qué proxies</tspan></text><text x="470" y="648.56" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">son de confianza.</tspan></text><text x="470" y="692.24" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
