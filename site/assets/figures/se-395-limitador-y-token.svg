<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 471" width="940" height="471" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dos controles aparentes más: limitador por cabecera X-Forwarded-For y verificación de token que lee el algoritmo del propio token</title><desc id="d">Tabla: un limitador que cuenta por la cabecera que envía el cliente permite 1 000 de 1 000 intentos si el atacante cambia la cabecera y 5 si no; contar por la dirección de la conexión permite 5 en ambos casos; un verificador que acepta el algoritmo none acepta un token forjado, uno que fija HS256 lo rechaza.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="471" fill="#ffffff"/><rect x="10" y="12" width="474" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="247" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="247" dy="0">Prueba</tspan></text><rect x="490" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="597" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="597" dy="0">Control aparente</tspan></text><rect x="710" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="817" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="817" dy="0">Control reparado</tspan></text><rect x="10" y="56" width="474" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="81.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">1 000 intentos con una cabecera distinta en cada uno</tspan></text><rect x="490" y="56" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">1 000 permitidos</tspan></text><rect x="710" y="56" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">5 permitidos</tspan></text><rect x="10" y="106" width="474" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="131.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">1 000 intentos sin cambiar de dirección</tspan></text><rect x="490" y="106" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">5 permitidos</tspan></text><rect x="710" y="106" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">5 permitidos</tspan></text><rect x="10" y="156" width="474" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="181.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">Token legítimo</tspan></text><rect x="490" y="156" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">acepta</tspan></text><rect x="710" y="156" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">acepta</tspan></text><rect x="10" y="206" width="474" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="231.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">Token con alg «none» y rol docente</tspan></text><rect x="490" y="206" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">ACEPTA</tspan></text><rect x="710" y="206" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">rechaza</tspan></text><rect x="10" y="256" width="474" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="281.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">Token con la firma de otra clave</tspan></text><rect x="490" y="256" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="281.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">rechaza</tspan></text><rect x="710" y="256" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="281.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">rechaza</tspan></text><rect x="10" y="306" width="474" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="331.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">Token con la carga alterada y la firma vieja</tspan></text><rect x="490" y="306" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="331.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">rechaza</tspan></text><rect x="710" y="306" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="331.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">rechaza</tspan></text><rect x="10" y="360" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="384.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">En ambos casos el control confía en un dato que controla el atacante: la cabecera y el encabezado del token. Con el control</tspan></text><text x="470" y="401.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">reparado solo cambia quién decide (la conexión, el servidor). Detrás de un proxy la reparación exige configurar qué proxies</tspan></text><text x="470" y="418.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">son de confianza.</tspan></text><text x="470" y="457.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
