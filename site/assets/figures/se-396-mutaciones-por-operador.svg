ct x="10" y="256" width="474" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="281.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">Identificador duplicado</tspan></text><rect x="490" y="256" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="281.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">0</tspan></text><rect x="620" y="256" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="281.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">15</tspan></text><rect x="750" y="256" width="154" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="281.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">15</tspan></text><rect x="10" y="306" width="474" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="331.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">Misma evidencia en 10 requisitos o copia de otro</tspan></text><rect x="490" y="306" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="331.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">0</tspan></text><rect x="620" y="306" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="331.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">0</tspan></text><rect x="750" y="306" width="154" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="331.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">15</tspan></text><rect x="10" y="356" width="474" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="381.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">Prueba sin aserciones; prueba fallida marcada como cumple</tspan></text><rect x="490" y="356" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="381.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">0</tspan></text><rect x="620" y="356" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="381.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">0</tspan></text><rect x="750" y="356" width="154" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="381.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">15</tspan></text><rect x="10" y="406" width="474" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="431.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">Archivo de evidencia vacío</tspan></text><rect x="490" y="406" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="431.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">0</tspan></text><rect x="620" y="406" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="431.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">0</tspan></text><rect x="750" y="406" width="154" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="431.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">15</tspan></text><rect x="10" y="456" width="474" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="481.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">Evidencia única que dice «aprobado» sin ejecutar nada</tspan></text><rect x="490" y="456" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="481.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">0</tspan></text><rect x="620" y="456" width="124" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="481.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">0</tspan></text><rect x="750" y="456" width="154" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="481.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">0</tspan></text><rect x="10" y="510" width="900" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="460" y="534.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="460" dy="0">Cada capa añade reglas que alguien tuvo que imaginar. La última fila no cae en ninguna regla porque su forma es la de</tspan></text><text x="460" y="551.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="460" dy="0">una evidencia correcta. Las agrupaciones suman 14 operadores; en las filas con dos, cada valor es la detección de cada</tspan></text><text x="460" y="568.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="460" dy="0">uno de ellos.</tspan></text><text x="460" y="607.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
