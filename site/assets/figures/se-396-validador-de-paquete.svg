<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 307" width="1000" height="307" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Validador de un paquete de evidencia de seguridad frente a 210 mutaciones (14 operadores × 15)</title><desc id="d">Barras: un validador que solo mira la presencia de la evidencia detecta 15 de 210 mutaciones del paquete, uno que comprueba estructura 120 y uno que añade heurísticas semánticas 195; las 15 restantes son evidencia única sin relación con el requisito.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="307" fill="#ffffff"/><text x="480" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="480" dy="0">Solo presencia de la evidencia</tspan></text><rect x="490" y="16" width="33" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="531" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="531" dy="0">15 de 210</tspan></text><text x="480" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="480" dy="0">Estructura: existencia, fecha, alcance, duplicados</tspan></text><rect x="490" y="60" width="264" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="762" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="762" dy="0">120 de 210</tspan></text><text x="480" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="480" dy="0">Estructura y heurísticas (huellas repetidas, aserciones, resultado)</tspan></text><rect x="490" y="104" width="429" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="927" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="927" dy="0">195 de 210</tspan></text><text x="480" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="480" dy="0">Mutaciones aplicadas</tspan></text><rect x="490" y="148" width="462" height="28" rx="3" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="960" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="960" dy="0">14 operadores × 15</tspan></text><rect x="10" y="196" width="980" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="500" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">Las 15 que ningún validador ve son evidencia que parece buena: un archivo con la palabra «aprobado» que no ejecutó nada. Lo que</tspan></text><text x="500" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">detecta la estructura se puede automatizar; que la evidencia pruebe el requisito lo decide una revisión humana con la prueba</tspan></text><text x="500" y="254.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">delante. Las mutaciones y los validadores son del autor.</tspan></text><text x="500" y="293.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
