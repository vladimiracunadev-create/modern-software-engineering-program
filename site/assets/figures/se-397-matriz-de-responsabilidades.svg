<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 418" width="940" height="418" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Quién responde por cada una de las 12 capas según el modelo de servicio</title><desc id="d">Barras apiladas horizontales con cuántas de 12 capas quedan al cliente, compartidas o del proveedor: una instalación propia deja las 12 al cliente; IaaS 9 al cliente y 3 al proveedor; PaaS 4, 3 compartidas y 5; SaaS 3, 2 compartidas y 7. El tramo del cliente se encoge pero no desaparece.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="418" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Quién responde por cada una de las 12 capas según el modelo de servicio</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Del cliente</tspan></text><rect x="146.94" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="166.94" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="166.94" dy="0">Compartidas</tspan></text><rect x="277.88" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="297.88" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="297.88" dy="0">Del proveedor</tspan></text><line x1="254" y1="77" x2="254" y2="237" stroke="#d5dde1" stroke-width="1"/><line x1="254" y1="237" x2="254" y2="242" stroke="#5b7280" stroke-width="1.4"/><text x="254" y="258" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="254" dy="0">0</tspan></text><line x1="378.34" y1="77" x2="378.34" y2="237" stroke="#d5dde1" stroke-width="1"/><line x1="378.34" y1="237" x2="378.34" y2="242" stroke="#5b7280" stroke-width="1.4"/><text x="378.34" y="258" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="378.34" dy="0">2,5</tspan></text><line x1="502.68" y1="77" x2="502.68" y2="237" stroke="#d5dde1" stroke-width="1"/><line x1="502.68" y1="237" x2="502.68" y2="242" stroke="#5b7280" stroke-width="1.4"/><text x="502.68" y="258" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502.68" dy="0">5</tspan></text><line x1="627.02" y1="77" x2="627.02" y2="237" stroke="#d5dde1" stroke-width="1"/><line x1="627.02" y1="237" x2="627.02" y2="242" stroke="#5b7280" stroke-width="1.4"/><text x="627.02" y="258" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="627.02" dy="0">7,5</tspan></text><line x1="751.36" y1="77" x2="751.36" y2="237" stroke="#d5dde1" stroke-width="1"/><line x1="751.36" y1="237" x2="751.36" y2="242" stroke="#5b7280" stroke-width="1.4"/><text x="751.36" y="258" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="751.36" dy="0">10</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="237" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="237" x2="875.7" y2="242" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="258" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">12,5</tspan></text><line x1="254" y1="237" x2="875.7" y2="237" stroke="#5b7280" stroke-width="1.6"/><text x="244" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">Instalación propia (local)</tspan></text><text x="244" y="141.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">IaaS</tspan></text><text x="244" y="181.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">PaaS</tspan></text><text x="244" y="221.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">SaaS</tspan></text><rect x="254" y="84" width="596.832" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="552.416" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="552.416" dy="0">12</tspan></text><rect x="850.832" y="84" width="0" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><rect x="850.832" y="84" width="0" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="857.832" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="857.832" dy="0">12</tspan></text><rect x="254" y="124" width="447.624" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="477.812" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="477.812" dy="0">9</tspan></text><rect x="701.624" y="124" width="0" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><rect x="701.624" y="124" width="149.208" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="776.228" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="776.228" dy="0">3</tspan></text><text x="857.832" y="141.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="857.832" dy="0">12</tspan></text><rect x="254" y="164" width="198.944" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="353.472" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="353.472" dy="0">4</tspan></text><rect x="452.944" y="164" width="149.208" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="527.548" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="527.548" dy="0">3</tspan></text><rect x="602.152" y="164" width="248.68" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="726.492" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="726.492" dy="0">5</tspan></text><text x="857.832" y="181.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="857.832" dy="0">12</tspan></text><rect x="254" y="204" width="149.208" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="328.604" y="221.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="328.604" dy="0">3</tspan></text><rect x="403.208" y="204" width="99.472" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="452.944" y="221.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="452.944" dy="0">2</tspan></text><rect x="502.68" y="204" width="348.152" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="676.756" y="221.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="676.756" dy="0">7</tspan></text><text x="857.832" y="221.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="857.832" dy="0">12</tspan></text><text x="564.85" y="281" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="564.85" dy="0">Capas (de 12)</tspan></text><rect x="10" y="295" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="319.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Pasar de IaaS a SaaS reduce la lista, pero tres capas no se mueven nunca: quién entra, qué datos hay y cómo se configura el</tspan></text><text x="470" y="336.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">servicio. La matriz es un modelo del autor basado en la estructura de los documentos públicos de responsabilidad</tspan></text><text x="470" y="353.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">compartida; cada proveedor y cada producto la dibuja distinta.</tspan></text><text x="470" y="400.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo sintético con semilla fija; Windows y Ubuntu (WSL2) con cifras idénticas. Los parámetros son supuestos del autor.</tspan></text></svg>
