<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 514" width="940" height="514" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Probabilidad de dejar al menos un ajuste de seguridad mal configurado, con 1 % y 2 % de error por ajuste</title><desc id="d">Barras horizontales agrupadas con la probabilidad de dejar al menos un ajuste mal configurado: con un 1 por ciento de error por ajuste es 95,1 con 300 ajustes (instalación propia), 70,1 con 120 (IaaS), 36,4 con 45 (PaaS) y 13,1 con 14 (SaaS); con un 2 por ciento sube a 99,8, 91,1, 59,7 y 24,6.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="514" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Probabilidad de dejar al menos un ajuste de seguridad mal configurado, con 1 % y 2 % de error por ajuste</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">1 % de error por ajuste</tspan></text><rect x="237.42" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="257.42" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="257.42" dy="0">2 % de error por ajuste</tspan></text><line x1="274" y1="77" x2="274" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="333" x2="274" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0</tspan></text><line x1="395.952" y1="77" x2="395.952" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="395.952" y1="333" x2="395.952" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="395.952" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="395.952" dy="0">20</tspan></text><line x1="517.904" y1="77" x2="517.904" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="517.904" y1="333" x2="517.904" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="517.904" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517.904" dy="0">40</tspan></text><line x1="639.856" y1="77" x2="639.856" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="639.856" y1="333" x2="639.856" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="639.856" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="639.856" dy="0">60</tspan></text><line x1="761.808" y1="77" x2="761.808" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="761.808" y1="333" x2="761.808" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="761.808" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="761.808" dy="0">80</tspan></text><line x1="883.76" y1="77" x2="883.76" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="883.76" y1="333" x2="883.76" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="883.76" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="883.76" dy="0">100</tspan></text><line x1="274" y1="333" x2="883.76" y2="333" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="113.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Instalación propia (300 ajustes)</tspan></text><text x="264" y="177.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">IaaS (120 ajustes)</tspan></text><text x="264" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">PaaS (45 ajustes)</tspan></text><text x="264" y="305.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">SaaS (14 ajustes)</tspan></text><rect x="274" y="83" width="579.882" height="24.5" rx="3" fill="#946512"/><text x="860.882" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="860.882" dy="0">95,1</tspan></text><rect x="274" y="110.5" width="608.54" height="24.5" rx="3" fill="#c0432f"/><text x="889.54" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="889.54" dy="0">99,8</tspan></text><rect x="274" y="147" width="427.442" height="24.5" rx="3" fill="#946512"/><text x="708.442" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="708.442" dy="0">70,1</tspan></text><rect x="274" y="174.5" width="555.491" height="24.5" rx="3" fill="#c0432f"/><text x="836.491" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="836.491" dy="0">91,1</tspan></text><rect x="274" y="211" width="221.953" height="24.5" rx="3" fill="#946512"/><text x="502.953" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="502.953" dy="0">36,4</tspan></text><rect x="274" y="238.5" width="364.027" height="24.5" rx="3" fill="#c0432f"/><text x="645.027" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="645.027" dy="0">59,7</tspan></text><rect x="274" y="275" width="79.8786" height="24.5" rx="3" fill="#946512"/><text x="360.879" y="291.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="360.879" dy="0">13,1</tspan></text><rect x="274" y="302.5" width="150.001" height="24.5" rx="3" fill="#c0432f"/><text x="431.001" y="319.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="431.001" dy="0">24,6</tspan></text><text x="578.88" y="377" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="578.88" dy="0">% de instalaciones con al menos un error</tspan></text><rect x="10" y="391" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="415.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">La probabilidad cae porque hay menos ajustes, no porque el cliente se equivoque menos. Con 14 ajustes y un 1 % de error,</tspan></text><text x="470" y="432.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">uno de cada ocho equipos tiene un error: el modelo es el producto 1 − (1 − p)^n, verificado con 20 000 ensayos por celda;</tspan></text><text x="470" y="449.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">los 300, 120, 45 y 14 ajustes son supuestos del autor.</tspan></text><text x="470" y="496.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo sintético con semilla fija; Windows y Ubuntu (WSL2) con cifras idénticas. Los parámetros son supuestos del autor.</tspan></text></svg>
