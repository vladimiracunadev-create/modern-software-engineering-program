<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 421" width="940" height="421" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dependencias reales de dos entornos de Python: la clausura transitiva depende del entorno, no del proyecto</title><desc id="d">Tabla: el entorno de Windows tiene 349 distribuciones instaladas, 188 con al menos una dependencia, mediana de 3 transitivas y una clausura máxima de 88 paquetes para jupyter; el entorno de Ubuntu tiene 63, 10 con dependencias, mediana de 2,5 y máximo 6 para twisted.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="421" fill="#ffffff"/><rect x="10" y="12" width="474" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="247" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="247" dy="0">Medida con importlib.metadata</tspan></text><rect x="490" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="597" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="597" dy="0">Windows (3.12.9)</tspan></text><rect x="710" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="817" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="817" dy="0">Ubuntu WSL2 (3.12.3)</tspan></text><rect x="10" y="56" width="474" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">Distribuciones instaladas</tspan></text><rect x="490" y="56" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">349</tspan></text><rect x="710" y="56" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">63</tspan></text><rect x="10" y="106" width="474" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">Paquetes con al menos una dependencia instalada</tspan></text><rect x="490" y="106" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">188</tspan></text><rect x="710" y="106" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">10</tspan></text><rect x="10" y="156" width="474" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">Mediana de dependencias transitivas entre ellos</tspan></text><rect x="490" y="156" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">3</tspan></text><rect x="710" y="156" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">2,5</tspan></text><rect x="10" y="206" width="474" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">Mayor clausura transitiva de un paquete</tspan></text><rect x="490" y="206" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">88 (jupyter)</tspan></text><rect x="710" y="206" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">6 (twisted)</tspan></text><rect x="10" y="256" width="474" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">Paquetes que nadie más requiere (raíces)</tspan></text><rect x="490" y="256" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">77</tspan></text><rect x="710" y="256" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">43</tspan></text><rect x="10" y="310" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="334.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que se instaló no es lo que el proyecto declara: la clausura de un paquete se calcula leyendo los metadatos de lo que</tspan></text><text x="470" y="351.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">hay. Los dos entornos difieren por diseño; no representan ningún proyecto de producción y las extras opcionales se</tspan></text><text x="470" y="368.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">excluyeron.</tspan></text><text x="470" y="407.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido en Windows 11 (CPython 3.12.9) y Ubuntu bajo WSL2 (3.12.3); lo que difiere entre sistemas se indica en la figura.</tspan></text></svg>
