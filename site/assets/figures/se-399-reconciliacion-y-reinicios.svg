<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 559" width="940" height="559" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Réplicas-segundo ausentes en 600 s con 10 réplicas deseadas, según cada cuánto revisa el controlador</title><desc id="d">Línea con las réplicas-segundo ausentes en 600 segundos según el intervalo de revisión del controlador, media de 300 corridas: 102,6 con 1 segundo, 125,4 con 5, 193,9 con 15, 319,9 con 30 y 474,4 con 60; con 60 segundos faltan 4,6 veces más que con 1.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="559" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Réplicas-segundo ausentes en 600 s con 10 réplicas deseadas, según cada cuánto revisa el controlador</tspan></text><line x1="78.62" y1="359" x2="910" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="359" x2="78.62" y2="359" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="363.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="299" x2="910" y2="299" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="299" x2="78.62" y2="299" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="303.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="239" x2="910" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="239" x2="78.62" y2="239" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="243.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">200</tspan></text><line x1="78.62" y1="179" x2="910" y2="179" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="179" x2="78.62" y2="179" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="183.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">300</tspan></text><line x1="78.62" y1="119" x2="910" y2="119" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="119" x2="78.62" y2="119" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="123.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">400</tspan></text><line x1="78.62" y1="59" x2="910" y2="59" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="59" x2="78.62" y2="59" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="63.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">500</tspan></text><line x1="78.62" y1="59" x2="78.62" y2="359" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="59" x2="96.62" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="359" x2="96.62" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">1</tspan></text><line x1="150.544" y1="59" x2="150.544" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="150.544" y1="359" x2="150.544" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="150.544" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="150.544" dy="0">5</tspan></text><line x1="285.354" y1="59" x2="285.354" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="285.354" y1="359" x2="285.354" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="285.354" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="285.354" dy="0">15</tspan></text><line x1="487.569" y1="59" x2="487.569" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="487.569" y1="359" x2="487.569" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="487.569" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487.569" dy="0">30</tspan></text><line x1="892" y1="59" x2="892" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="359" x2="892" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">60</tspan></text><line x1="78.62" y1="359" x2="910" y2="359" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="209" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 209)">Réplicas-segundo ausentes en 600 s</text><text x="494.31" y="405" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Intervalo de revisión del controlador (s)</tspan></text><polyline points="96.62,297.44 150.544,283.76 285.354,242.66 487.569,167.06 892,74.36" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="96.62" cy="297.44" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="96.62" y="286.44" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">102,6</tspan></text><circle cx="150.544" cy="283.76" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="150.544" y="272.76" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="150.544" dy="0">125,4</tspan></text><circle cx="285.354" cy="242.66" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="285.354" y="231.66" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="285.354" dy="0">193,9</tspan></text><circle cx="487.569" cy="167.06" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="487.569" y="156.06" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="487.569" dy="0">319,9</tspan></text><circle cx="892" cy="74.36" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="882" y="78.86" font-size="13" text-anchor="end" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="882" dy="0">474,4</tspan></text><rect x="10" y="419" width="920" height="92.56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="443.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">El bucle no evita el fallo: acota cuánto dura, y el arranque de 7 s deja un piso de 102,6 aun revisando cada segundo. La</tspan></text><text x="470" y="460.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">espera tras cada reinicio cuesta menos que reiniciar sin freno: con un retardo que se duplica desde 10 s hasta 300 s, una</tspan></text><text x="470" y="477.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">réplica que siempre falla se reinicia 15 veces por hora; con 10 s fijos serían 360. Dos fallos por réplica del 0,2 % por</tspan></text><text x="470" y="493.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">segundo y 3 pods perdidos en el segundo 100 son supuestos del autor.</tspan></text><text x="470" y="541.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo sintético con semilla fija; Windows y Ubuntu (WSL2) con cifras idénticas. Los parámetros son supuestos del autor.</tspan></text></svg>
