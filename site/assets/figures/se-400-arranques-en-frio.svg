<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 479" width="940" height="479" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Porcentaje de peticiones que caen en un arranque en frío según la tasa de llegada y la inactividad tolerada</title><desc id="d">Mapa de calor con el porcentaje de peticiones que arrancan en frío: con 0,05 peticiones por minuto, 96,6 si la instancia se descarta tras 1 minuto de inactividad y 3,0 si tras 60; con 1 por minuto, 37,4 y 0,32; con 30 por minuto, 1,02 y 0,01. El color se concentra en la esquina de poco tráfico y descarte rápido.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="479" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Porcentaje de peticiones que caen en un arranque en frío según la tasa de llegada y la inactividad tolerada</tspan></text><text x="558" y="59" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="558" dy="0">Inactividad tolerada antes de descartar la instancia</tspan></text><text x="286.5" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="286.5" dy="0">Descarte tras 1 min</tspan></text><text x="467.5" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="467.5" dy="0">Descarte tras 5 min</tspan></text><text x="648.5" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="648.5" dy="0">Descarte tras 15 min</tspan></text><text x="829.5" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="829.5" dy="0">Descarte tras 60 min</tspan></text><text x="186" y="120.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="186" dy="0">0,05 por minuto</tspan></text><text x="186" y="164.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="186" dy="0">0,2 por minuto</tspan></text><text x="186" y="208.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="186" dy="0">1 por minuto</tspan></text><text x="186" y="252.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="186" dy="0">5 por minuto</tspan></text><text x="186" y="296.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="186" dy="0">30 por minuto</tspan></text><rect x="197.5" y="95.5" width="178" height="41" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="286.5" y="120.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="286.5" dy="0">96,6 %</tspan></text><rect x="378.5" y="95.5" width="178" height="41" rx="4" fill="#cb604f" stroke="#ffffff" stroke-width="1"/><text x="467.5" y="120.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="467.5" dy="0">79,1 %</tspan></text><rect x="559.5" y="95.5" width="178" height="41" rx="4" fill="#de9689" stroke="#ffffff" stroke-width="1"/><text x="648.5" y="120.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="648.5" dy="0">46,8 %</tspan></text><rect x="740.5" y="95.5" width="178" height="41" rx="4" fill="#f9dfd9" stroke="#ffffff" stroke-width="1"/><text x="829.5" y="120.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="829.5" dy="0">3,0 %</tspan></text><rect x="197.5" y="139.5" width="178" height="41" rx="4" fill="#c85947" stroke="#ffffff" stroke-width="1"/><text x="286.5" y="164.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="286.5" dy="0">83,3 %</tspan></text><rect x="378.5" y="139.5" width="178" height="41" rx="4" fill="#e4a69b" stroke="#ffffff" stroke-width="1"/><text x="467.5" y="164.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="467.5" dy="0">37,0 %</tspan></text><rect x="559.5" y="139.5" width="178" height="41" rx="4" fill="#f8dbd4" stroke="#ffffff" stroke-width="1"/><text x="648.5" y="164.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="648.5" dy="0">5,3 %</tspan></text><rect x="740.5" y="139.5" width="178" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="829.5" y="164.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="829.5" dy="0">0,05 %</tspan></text><rect x="197.5" y="183.5" width="178" height="41" rx="4" fill="#e4a69a" stroke="#ffffff" stroke-width="1"/><text x="286.5" y="208.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="286.5" dy="0">37,4 %</tspan></text><rect x="378.5" y="183.5" width="178" height="41" rx="4" fill="#fae2dc" stroke="#ffffff" stroke-width="1"/><text x="467.5" y="208.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="467.5" dy="0">1,15 %</tspan></text><rect x="559.5" y="183.5" width="178" height="41" rx="4" fill="#fbe3dd" stroke="#ffffff" stroke-width="1"/><text x="648.5" y="208.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="648.5" dy="0">0,39 %</tspan></text><rect x="740.5" y="183.5" width="178" height="41" rx="4" fill="#fbe3dd" stroke="#ffffff" stroke-width="1"/><text x="829.5" y="208.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="829.5" dy="0">0,32 %</tspan></text><rect x="197.5" y="227.5" width="178" height="41" rx="4" fill="#fae0da" stroke="#ffffff" stroke-width="1"/><text x="286.5" y="252.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="286.5" dy="0">2,35 %</tspan></text><rect x="378.5" y="227.5" width="178" height="41" rx="4" fill="#fae2dc" stroke="#ffffff" stroke-width="1"/><text x="467.5" y="252.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="467.5" dy="0">1,14 %</tspan></text><rect x="559.5" y="227.5" width="178" height="41" rx="4" fill="#fbe3dd" stroke="#ffffff" stroke-width="1"/><text x="648.5" y="252.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="648.5" dy="0">0,53 %</tspan></text><rect x="740.5" y="227.5" width="178" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="829.5" y="252.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="829.5" dy="0">0,03 %</tspan></text><rect x="197.5" y="271.5" width="178" height="41" rx="4" fill="#fae2dc" stroke="#ffffff" stroke-width="1"/><text x="286.5" y="296.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="286.5" dy="0">1,02 %</tspan></text><rect x="378.5" y="271.5" width="178" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="467.5" y="296.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="467.5" dy="0">0,24 %</tspan></text><rect x="559.5" y="271.5" width="178" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="648.5" y="296.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="648.5" dy="0">0,08 %</tspan></text><rect x="740.5" y="271.5" width="178" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="829.5" y="296.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="829.5" dy="0">0,01 %</tspan></text><text x="20" y="204" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 204)">Tasa de llegada</text><text x="196" y="340" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="196" dy="0">0,01 %</tspan></text><rect x="249.24" y="328" width="30.5" height="14" fill="#fbe4de"/><rect x="279.24" y="328" width="30.5" height="14" fill="#f3cdc5"/><rect x="309.24" y="328" width="30.5" height="14" fill="#eab6ac"/><rect x="339.24" y="328" width="30.5" height="14" fill="#e29f93"/><rect x="369.24" y="328" width="30.5" height="14" fill="#d9887a"/><rect x="399.24" y="328" width="30.5" height="14" fill="#d17161"/><rect x="429.24" y="328" width="30.5" height="14" fill="#c85a48"/><rect x="459.24" y="328" width="30.5" height="14" fill="#c0432f"/><text x="497.24" y="340" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="497.24" dy="0">96,6 %</tspan></text><text x="550.48" y="340" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="550.48" dy="0">más oscuro = mayor (% de peticiones en frío)</tspan></text><rect x="10" y="356" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="380.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El arranque en frío no es un defecto del tráfico alto: a 30 peticiones por minuto es raro y a 0,05 es casi la regla. La</tspan></text><text x="470" y="397.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">tasa baja con ráfagas sufre más que la alta uniforme. Siete días de llegadas de Poisson, una petición por instancia a la</tspan></text><text x="470" y="414.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">vez y 0,2 s de servicio son supuestos del autor.</tspan></text><text x="470" y="461.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo sintético con semilla fija; Windows y Ubuntu (WSL2) con cifras idénticas. Los parámetros son supuestos del autor.</tspan></text></svg>
