<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 595" width="940" height="595" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Detector de secretos: precisión y exhaustividad de cinco reglas (80 secretos sintéticos y 180 señuelos)</title><desc id="d">Barras horizontales agrupadas con la precisión y la exhaustividad de cinco reglas: entropía 3,5 da 25,8 y 75,0 por ciento, entropía 4,0 da 40,0 y 50,0, entropía 4,5 da 34,8 y 40,0, el nombre de la variable da 100 y 65,0, y nombre o entropía 4,5 da 50,8 y 77,5. Ninguna regla alcanza ambas por encima del 80.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="595" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Detector de secretos: precisión y exhaustividad de cinco reglas (80 secretos sintéticos y 180 señuelos)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Precisión</tspan></text><rect x="131.86" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="151.86" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="151.86" dy="0">Exhaustividad</tspan></text><line x1="254" y1="77" x2="254" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="254" y1="397" x2="254" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="254" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="254" dy="0">0</tspan></text><line x1="378.34" y1="77" x2="378.34" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="378.34" y1="397" x2="378.34" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="378.34" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="378.34" dy="0">20</tspan></text><line x1="502.68" y1="77" x2="502.68" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="502.68" y1="397" x2="502.68" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="502.68" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502.68" dy="0">40</tspan></text><line x1="627.02" y1="77" x2="627.02" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="627.02" y1="397" x2="627.02" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="627.02" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="627.02" dy="0">60</tspan></text><line x1="751.36" y1="77" x2="751.36" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="751.36" y1="397" x2="751.36" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="751.36" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="751.36" dy="0">80</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="397" x2="875.7" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">100</tspan></text><line x1="254" y1="397" x2="875.7" y2="397" stroke="#5b7280" stroke-width="1.6"/><text x="244" y="113.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">Entropía ≥ 3,5</tspan></text><text x="244" y="177.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">Entropía ≥ 4,0</tspan></text><text x="244" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">Entropía ≥ 4,5</tspan></text><text x="244" y="305.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">Solo el nombre de la variable</tspan></text><text x="244" y="369.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">Nombre o entropía ≥ 4,5</tspan></text><rect x="254" y="83" width="160.399" height="24.5" rx="3" fill="#946512"/><text x="421.399" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="421.399" dy="0">25,8</tspan></text><rect x="254" y="110.5" width="466.275" height="24.5" rx="3" fill="#087f8c"/><text x="727.275" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="727.275" dy="0">75,0</tspan></text><rect x="254" y="147" width="248.68" height="24.5" rx="3" fill="#946512"/><text x="509.68" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="509.68" dy="0">40,0</tspan></text><rect x="254" y="174.5" width="310.85" height="24.5" rx="3" fill="#087f8c"/><text x="571.85" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="571.85" dy="0">50,0</tspan></text><rect x="254" y="211" width="216.352" height="24.5" rx="3" fill="#946512"/><text x="477.352" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="477.352" dy="0">34,8</tspan></text><rect x="254" y="238.5" width="248.68" height="24.5" rx="3" fill="#087f8c"/><text x="509.68" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="509.68" dy="0">40,0</tspan></text><rect x="254" y="275" width="621.7" height="24.5" rx="3" fill="#946512"/><text x="882.7" y="291.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100,0</tspan></text><rect x="254" y="302.5" width="404.105" height="24.5" rx="3" fill="#087f8c"/><text x="665.105" y="319.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="665.105" dy="0">65,0</tspan></text><rect x="254" y="339" width="315.824" height="24.5" rx="3" fill="#946512"/><text x="576.824" y="355.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="576.824" dy="0">50,8</tspan></text><rect x="254" y="366.5" width="481.818" height="24.5" rx="3" fill="#087f8c"/><text x="742.818" y="383.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="742.818" dy="0">77,5</tspan></text><text x="564.85" y="441" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="564.85" dy="0">%</tspan></text><rect x="10" y="455" width="920" height="92.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="479.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Los secretos hexadecimales y las contraseñas con palabras tienen entropía menor que un resumen SHA-256 en base 64, así que</tspan></text><text x="470" y="496.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">ningún umbral separa bien. El contexto (el nombre de la variable) es más preciso y deja pasar a los que no lo tienen. Los</tspan></text><text x="470" y="513.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">hallados, falsos positivos y omitidos están en la tabla. Los 80 secretos y 180 señuelos los generé yo: las cifras describen</tspan></text><text x="470" y="529.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">estas reglas sobre estos datos, no un escáner real.</tspan></text><text x="470" y="577.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo sintético con semilla fija; Windows y Ubuntu (WSL2) con cifras idénticas. Los parámetros son supuestos del autor.</tspan></text></svg>
