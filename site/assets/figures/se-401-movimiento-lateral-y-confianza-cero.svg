<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 423" width="940" height="423" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Servicios de 40 que cae un atacante que parte de uno cualquiera, según la regla de red e identidad</title><desc id="d">Barras horizontales con el número medio de servicios comprometidos de 40 tras 4 000 ensayos: 40,0 con red plana, 39,61 con segmentos por equipo, 4,32 con lista de permitidos por servicio y 1,28 con identidad por servicio y autorización por operación. El servicio crítico cae en el 100 %, el 99,0 %, el 6,6 % y el 0,6 % de los ensayos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="423" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Servicios de 40 que cae un atacante que parte de uno cualquiera, según la regla de red e identidad</tspan></text><line x1="314" y1="49" x2="314" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="314" y1="225" x2="314" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="314" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="314" dy="0">0</tspan></text><line x1="454.425" y1="49" x2="454.425" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="454.425" y1="225" x2="454.425" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="454.425" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="454.425" dy="0">10</tspan></text><line x1="594.85" y1="49" x2="594.85" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="594.85" y1="225" x2="594.85" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="594.85" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="594.85" dy="0">20</tspan></text><line x1="735.275" y1="49" x2="735.275" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="735.275" y1="225" x2="735.275" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="735.275" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="735.275" dy="0">30</tspan></text><line x1="875.7" y1="49" x2="875.7" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="225" x2="875.7" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">40</tspan></text><line x1="314" y1="225" x2="875.7" y2="225" stroke="#5b7280" stroke-width="1.6"/><text x="304" y="75.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Red plana: confianza por ubicación</tspan></text><text x="304" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Segmentos por equipo</tspan></text><text x="304" y="163.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Lista de permitidos por servicio</tspan></text><text x="304" y="199" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Identidad por servicio y autorización</tspan></text><text x="304" y="216" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">por operación</tspan></text><rect x="314" y="55" width="561.7" height="32" rx="3" fill="#c0432f"/><text x="882.7" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">40,00</tspan></text><rect x="314" y="99" width="556.223" height="32" rx="3" fill="#c0432f"/><text x="877.223" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="877.223" dy="0">39,61</tspan></text><rect x="314" y="143" width="60.6636" height="32" rx="3" fill="#c0432f"/><text x="381.664" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="381.664" dy="0">4,32</tspan></text><rect x="314" y="187" width="17.9744" height="32" rx="3" fill="#c0432f"/><text x="338.974" y="207.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="338.974" dy="0">1,28</tspan></text><text x="594.85" y="269" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="594.85" dy="0">Servicios comprometidos de 40, media de 4 000 ensayos</tspan></text><rect x="10" y="283" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="307.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los segmentos por equipo apenas ayudan porque el grafo de llamadas encadena equipos: el atacante salta de un segmento</tspan></text><text x="470" y="324.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">permitido al siguiente. Lo que contiene el avance es acotar cada servicio a las conexiones que su función necesita, y</tspan></text><text x="470" y="341.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">reducir lo que cada una de esas conexiones permite. Cada salto cae con probabilidad 0,3 (0,075 con autorización por</tspan></text><text x="470" y="357.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">operación, que supone 2 de 8 operaciones expuestas); ambos números son supuestos.</tspan></text><text x="470" y="405.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo sintético con semilla fija (scripts/experiments_part33_ext.py), CPython 3.12.9 en Windows; las probabilidades son supuestos del autor.</tspan></text></svg>
