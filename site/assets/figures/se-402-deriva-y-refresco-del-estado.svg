<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 630" width="940" height="630" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Deriva sobre 100 recursos con 10 ediciones en el código: lo que el plan muestra y lo que el siguiente apply revierte</title><desc id="d">Líneas según cuántos recursos se alteran a mano (0, 5 y 20): un plan sin refrescar muestra 0, 0,49 y 2,01 de ellos; un plan refrescado muestra 0, 5 y 20; el siguiente apply revierte 0, 4,51 y 17,99 arreglos manuales. La brecha entre las dos primeras líneas es la deriva que el plan sin refrescar no ve.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="630" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Deriva sobre 100 recursos con 10 ediciones en el código: lo que el plan muestra y lo que el siguiente apply</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">revierte</tspan></text><circle cx="22" cy="70" r="6" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Deriva que muestra el plan refrescado</tspan></text><rect x="342.98" y="64" width="12" height="12" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="362.98" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="362.98" dy="0">Arreglos manuales que el siguiente apply revierte</tspan></text><polygon points="22,87.1 28.6,99.4 15.4,99.4" fill="#946512" stroke="#946512" stroke-width="2"/><text x="36" y="99" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Deriva que muestra el plan sin refrescar</tspan></text><line x1="71.08" y1="430" x2="910" y2="430" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="430" x2="71.08" y2="430" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="434.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="355" x2="910" y2="355" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="355" x2="71.08" y2="355" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="359.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">5</tspan></text><line x1="71.08" y1="280" x2="910" y2="280" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="280" x2="71.08" y2="280" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="284.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="205" x2="910" y2="205" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="205" x2="71.08" y2="205" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="209.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">15</tspan></text><line x1="71.08" y1="130" x2="910" y2="130" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="130" x2="71.08" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="134.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="130" x2="71.08" y2="430" stroke="#5b7280" stroke-width="1.6"/><line x1="89.08" y1="130" x2="89.08" y2="430" stroke="#d5dde1" stroke-width="1"/><line x1="89.08" y1="430" x2="89.08" y2="435" stroke="#5b7280" stroke-width="1.4"/><text x="89.08" y="451" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="89.08" dy="0">0</tspan></text><line x1="289.81" y1="130" x2="289.81" y2="430" stroke="#d5dde1" stroke-width="1"/><line x1="289.81" y1="430" x2="289.81" y2="435" stroke="#5b7280" stroke-width="1.4"/><text x="289.81" y="451" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="289.81" dy="0">5</tspan></text><line x1="892" y1="130" x2="892" y2="430" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="430" x2="892" y2="435" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="451" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">20</tspan></text><line x1="71.08" y1="430" x2="910" y2="430" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="280" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 280)">Recursos (media de 1 000 corridas)</text><text x="490.54" y="476" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="490.54" dy="0">Recursos alterados fuera del código (k)</tspan></text><polyline points="89.08,430 289.81,355 892,130" fill="none" stroke="#102a43" stroke-width="2.4"/><circle cx="89.08" cy="430" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><circle cx="289.81" cy="355" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="289.81" y="344" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="289.81" dy="0">5,0</tspan></text><circle cx="892" cy="130" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="882" y="134.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="882" dy="0">20,0</tspan></text><polyline points="89.08,430 289.81,362.35 892,160.15" fill="none" stroke="#c0432f" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="83.58" y="424.5" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><rect x="284.31" y="356.85" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="299.81" y="366.85" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="299.81" dy="0">4,51</tspan></text><rect x="886.5" y="154.65" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="184.15" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">17,99</tspan></text><polyline points="89.08,430 289.81,422.65 892,399.85" fill="none" stroke="#946512" stroke-width="2.4"/><polygon points="89.08,423.675 95.13,434.95 83.03,434.95" fill="#946512" stroke="#946512" stroke-width="2"/><text x="89.08" y="419" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="89.08" dy="0">0</tspan></text><polygon points="289.81,416.325 295.86,427.6 283.76,427.6" fill="#946512" stroke="#946512" stroke-width="2"/><text x="289.81" y="446.65" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="289.81" dy="0">0,49</tspan></text><polygon points="892,393.525 898.05,404.8 885.95,404.8" fill="#946512" stroke="#946512" stroke-width="2"/><text x="892" y="423.85" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">2,01</tspan></text><rect x="10" y="490" width="920" height="92.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="514.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Un plan sin refresco compara el código con un archivo de estado que supone cierto: ve la deriva por casualidad. Con</tspan></text><text x="470" y="531.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">refresco la ve toda, y entonces aplicar sin leerla revierte los arreglos de emergencia hechos a mano. Los cambios totales</tspan></text><text x="470" y="548.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">del plan (10, 14,5 y 28,0 refrescado) están en la tabla. El modelo es un diferenciador de diccionarios, no Terraform ni</tspan></text><text x="470" y="564.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">OpenTofu.</tspan></text><text x="470" y="612.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo sintético con semilla fija; Windows y Ubuntu (WSL2) con cifras idénticas. Los parámetros son supuestos del autor.</tspan></text></svg>
