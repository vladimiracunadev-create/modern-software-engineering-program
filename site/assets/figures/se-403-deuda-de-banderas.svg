<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 329" width="940" height="329" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Deuda de banderas tras 60 meses con 3 banderas nuevas por mes</title><desc id="d">Tabla: sin política de retirada quedan 180 banderas vivas, 177 de ellas ya al cien por cien y por tanto código muerto; con una retirada lenta quedan 23 y 20; con fecha de caducidad y dueño, 14 y 11.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="329" fill="#ffffff"/><rect x="10" y="12" width="424" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="222" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="222" dy="0">Política</tspan></text><rect x="440" y="12" width="174" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="527" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="527" dy="0">Vivas a los 60 meses</tspan></text><rect x="620" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="687" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="687" dy="0">Ya al 100 %</tspan></text><rect x="760" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="842" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="842" dy="0">Estados posibles</tspan></text><rect x="10" y="56" width="424" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="85.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Sin política de retirada</tspan></text><rect x="440" y="56" width="174" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">180</tspan></text><rect x="620" y="56" width="134" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="687" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="687" dy="0">177</tspan></text><rect x="760" y="56" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">2^180</tspan></text><rect x="10" y="114" width="424" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="143.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Retirar tras el 100 % con probabilidad 0,10 al mes</tspan></text><rect x="440" y="114" width="174" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">23</tspan></text><rect x="620" y="114" width="134" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="687" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="687" dy="0">20</tspan></text><rect x="760" y="114" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">2^23</tspan></text><rect x="10" y="172" width="424" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="201.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Fecha de caducidad y dueño (probabilidad 0,35 al mes)</tspan></text><rect x="440" y="172" width="174" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="527" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527" dy="0">14</tspan></text><rect x="620" y="172" width="134" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="687" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="687" dy="0">11</tspan></text><rect x="760" y="172" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">2^14</tspan></text><rect x="10" y="234" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="258.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Una bandera al 100 % durante meses es una rama muerta que sigue ejecutándose en las pruebas y confundiendo a quien lee. Las</tspan></text><text x="470" y="275.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">probabilidades de retirada son supuestos del autor; el patrón, que la deuda crece linealmente si nadie retira, es robusto.</tspan></text><text x="470" y="315.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
