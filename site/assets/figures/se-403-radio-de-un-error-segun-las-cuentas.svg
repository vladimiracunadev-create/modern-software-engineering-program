<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 590" width="940" height="590" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un error cometido en desarrollo o preproducción (20 000 ensayos): ¿llega a producción y cuánto daña?</title><desc id="d">Dispersión con tres estructuras de cuentas, con el porcentaje de errores que tocan producción en el eje vertical y los recursos afectados por error en el horizontal: una sola cuenta, 5,54 por ciento y 2,28 recursos; una cuenta por entorno, 0 y 1,39; una por entorno y servicio, 0 y 1,06. Separar cuentas baja ambos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="590" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un error cometido en desarrollo o preproducción (20 000 ensayos): ¿llega a producción y cuánto daña?</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Una sola cuenta</tspan></text><rect x="177.1" y="45" width="12" height="12" fill="#946512" stroke="#946512" stroke-width="2"/><text x="197.1" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="197.1" dy="0">Una cuenta por entorno</tspan></text><polygon points="396.98,44.1 403.58,56.4 390.38,56.4" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="410.98" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="410.98" dy="0">Una cuenta por entorno y servicio</tspan></text><line x1="63.54" y1="407" x2="910" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="407" x2="63.54" y2="407" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="411.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">0</tspan></text><line x1="63.54" y1="300.333" x2="910" y2="300.333" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="300.333" x2="63.54" y2="300.333" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="304.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">2</tspan></text><line x1="63.54" y1="193.667" x2="910" y2="193.667" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="193.667" x2="63.54" y2="193.667" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="198.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">4</tspan></text><line x1="63.54" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="87" x2="63.54" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">6</tspan></text><line x1="63.54" y1="87" x2="63.54" y2="407" stroke="#5b7280" stroke-width="1.6"/><line x1="81.54" y1="87" x2="81.54" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="81.54" y1="407" x2="81.54" y2="412" stroke="#5b7280" stroke-width="1.4"/><text x="81.54" y="428" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="81.54" dy="0">1,0</tspan></text><line x1="351.693" y1="87" x2="351.693" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="351.693" y1="407" x2="351.693" y2="412" stroke="#5b7280" stroke-width="1.4"/><text x="351.693" y="428" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="351.693" dy="0">1,5</tspan></text><line x1="621.847" y1="87" x2="621.847" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="621.847" y1="407" x2="621.847" y2="412" stroke="#5b7280" stroke-width="1.4"/><text x="621.847" y="428" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="621.847" dy="0">2,0</tspan></text><line x1="892" y1="87" x2="892" y2="407" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="407" x2="892" y2="412" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="428" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">2,5</tspan></text><line x1="63.54" y1="407" x2="910" y2="407" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="247" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 247)">Errores que tocan producción (%)</text><text x="486.77" y="453" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="486.77" dy="0">Recursos afectados por error (media)</tspan></text><circle cx="773.133" cy="111.533" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="763.133" y="116.033" font-size="13" text-anchor="end" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="763.133" dy="0">5,54 %</tspan></text><rect x="286.76" y="401.5" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="292.26" y="396" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="292.26" dy="0">0 %</tspan></text><polygon points="113.958,400.675 120.008,411.95 107.908,411.95" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="113.958" y="396" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="113.958" dy="0">0 %</tspan></text><rect x="10" y="467" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="491.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">La frontera de la cuenta no evita el error, acota su alcance: con una cuenta por entorno el comodín destruye más en</tspan></text><text x="470" y="508.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">desarrollo, pero ya no cruza. Los 24 recursos (3 entornos, 4 servicios, 2 clases), el 5 % de acciones comodín y la</tspan></text><text x="470" y="525.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">intención uniforme son supuestos del autor.</tspan></text><text x="470" y="572.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo sintético con semilla fija; Windows y Ubuntu (WSL2) con cifras idénticas. Los parámetros son supuestos del autor.</tspan></text></svg>
