<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 567" width="940" height="567" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Emisiones por tarea (SCI) de dos implementaciones de la misma tarea según la intensidad de la red eléctrica</title><desc id="d">Barras agrupadas en escala logarítmica con las emisiones por tarea, en miligramos de CO2e, de una implementación con búsqueda lineal y otra con diccionario sobre 20 000 registros: 0,947 y 0,006 con una red de 50 gCO2e/kWh, 2,105 y 0,014 con 300 y 3,957 y 0,027 con 700. El tiempo medido fue de 1,1112 s la ingenua y 0,0076 s la eficiente, unas 146 veces menos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="567" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Emisiones por tarea (SCI) de dos implementaciones de la misma tarea según la intensidad de la red eléctrica</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Búsqueda lineal (1,11 s)</tspan></text><rect x="244.96" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="264.96" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="264.96" dy="0">Diccionario (0,0076 s)</tspan></text><line x1="93.7" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="375" x2="93.7" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">0,001</tspan></text><line x1="93.7" y1="305" x2="920" y2="305" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="305" x2="93.7" y2="305" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="309.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">0,01</tspan></text><line x1="93.7" y1="235" x2="920" y2="235" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="235" x2="93.7" y2="235" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="239.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">0,1</tspan></text><line x1="93.7" y1="165" x2="920" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="165" x2="93.7" y2="165" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="169.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1</tspan></text><line x1="93.7" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="95" x2="93.7" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">10</tspan></text><line x1="93.7" y1="95" x2="93.7" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">mg CO2e por tarea (SCI) (escala logarítmica)</text><rect x="121.243" y="166.656" width="108.173" height="208.344" rx="3" fill="#c0432f"/><text x="175.33" y="160.656" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="175.33" dy="0">0,947</tspan></text><rect x="233.417" y="320.529" width="108.173" height="54.4706" rx="3" fill="#087f8c"/><text x="287.503" y="314.529" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287.503" dy="0">0,006</tspan></text><text x="231.417" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="231.417" dy="0">Red de 50 gCO2e/kWh</tspan></text><rect x="396.677" y="142.372" width="108.173" height="232.628" rx="3" fill="#c0432f"/><text x="450.763" y="136.372" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="450.763" dy="0">2,105</tspan></text><rect x="508.85" y="294.771" width="108.173" height="80.229" rx="3" fill="#087f8c"/><text x="562.937" y="288.771" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="562.937" dy="0">0,014</tspan></text><text x="506.85" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="506.85" dy="0">Red de 300 gCO2e/kWh</tspan></text><rect x="672.11" y="123.184" width="108.173" height="251.816" rx="3" fill="#c0432f"/><text x="726.197" y="117.184" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="726.197" dy="0">3,957</tspan></text><rect x="784.283" y="274.805" width="108.173" height="100.195" rx="3" fill="#087f8c"/><text x="838.37" y="268.805" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="838.37" dy="0">0,027</tspan></text><text x="782.283" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.283" dy="0">Red de 700 gCO2e/kWh</tspan></text><rect x="10" y="427" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cambiar el algoritmo redujo el SCI unas 146 veces en cualquier red; cambiar de una red de 700 a una de 50 lo redujo unas</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">4,2 veces. Con la red limpia, el término de emisiones incorporadas del hardware pasa a ser cerca de tres cuartas partes del</tspan></text><text x="470" y="485.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">total del caso eficiente: bajar la energía deja de bastar y empieza a importar usar menos servidor. Los tiempos varían</tspan></text><text x="470" y="501.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">entre ejecuciones (la razón estuvo entre 75 y 170 en las repeticiones del autor).</tspan></text><text x="470" y="549.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Tiempos medidos con CPython 3.12.9 en Windows (un equipo, mínimo de repeticiones); las intensidades de la red y la potencia por núcleo son supuestos declarados, no mediciones.</tspan></text></svg>
