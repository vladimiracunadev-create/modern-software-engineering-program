<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" width="940" height="420" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Fallo inyectado en cada paso de una actualización de 6 módulos y un manifiesto: estado final de la instalación (archivos reales)</title><desc id="d">Tabla: sobrescribir en sitio deja 6 de 7 interrupciones con una mezcla corrupta y una que no arranca; reemplazar archivo por archivo deja 12 de 14 con mezcla de versiones; preparar un directorio nuevo y cambiar un puntero deja la versión anterior intacta en las 9 interrupciones, con o sin verificación previa.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="420" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Estrategia</tspan></text><rect x="340" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="407" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="407" dy="0">Puntos de fallo</tspan></text><rect x="480" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="572" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="572" dy="0">Quedan en v1</tspan></text><text x="572" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="572" dy="0">consistente</tspan></text><rect x="670" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="797" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="797" dy="0">Resto</tspan></text><rect x="10" y="56" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="85.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">A: sobrescribir en sitio</tspan></text><rect x="340" y="56" width="134" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="407" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="407" dy="0">7</tspan></text><rect x="480" y="56" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">0</tspan></text><rect x="670" y="56" width="254" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="77.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">6 con mezcla o corrupto, 1 no</tspan></text><text x="797" y="93.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">arranca</tspan></text><rect x="10" y="114" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="143.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">B: reemplazar cada archivo por separado</tspan></text><rect x="340" y="114" width="134" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="407" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="407" dy="0">14</tspan></text><rect x="480" y="114" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">2</tspan></text><rect x="670" y="114" width="254" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">12 con mezcla de versiones</tspan></text><rect x="10" y="172" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="201.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">C: directorio nuevo y puntero</tspan></text><rect x="340" y="172" width="134" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="407" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="407" dy="0">9</tspan></text><rect x="480" y="172" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">9</tspan></text><rect x="670" y="172" width="254" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">0</tspan></text><rect x="10" y="230" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="259.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">D: como C, con verificación previa</tspan></text><rect x="340" y="230" width="134" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="407" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="407" dy="0">9</tspan></text><rect x="480" y="230" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">9</tspan></text><rect x="670" y="230" width="254" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">0</tspan></text><rect x="10" y="292" width="920" height="92.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="316.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Sin interrupción las cuatro terminan en v2 consistente; la diferencia está en qué hay después de una interrupción. Con un</tspan></text><text x="470" y="333.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">byte alterado en un módulo descargado, C termina en una instalación corrupta y D la rechaza antes del reemplazo y conserva</tspan></text><text x="470" y="350.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">v1. El experimento simula el corte con una excepción y no desconecta energía ni prueba el comportamiento del sistema de</tspan></text><text x="470" y="366.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">archivos.</tspan></text><text x="470" y="406.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Operaciones reales con archivos temporales; resultado idéntico en Windows y Ubuntu.</tspan></text></svg>
