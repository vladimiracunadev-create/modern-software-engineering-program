<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 603" width="940" height="603" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Fallo inyectado en cada paso de una actualización de 6 módulos y un manifiesto: estado final de la instalación (archivos reales)</title><desc id="d">Barras agrupadas con los puntos de fallo inyectados en cada estrategia de actualización de 6 módulos y un manifiesto y los que dejan la instalación en la versión 1 consistente: sobrescribir en sitio deja 0 de 7, reemplazar archivo por archivo 2 de 14 y las estrategias con directorio nuevo y puntero, con o sin verificación previa, 9 de 9.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="603" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Fallo inyectado en cada paso de una actualización de 6 módulos y un manifiesto: estado final de la</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">instalación (archivos reales)</tspan></text><rect x="16" y="64" width="12" height="12" rx="2" fill="#6b7c86"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Puntos de fallo</tspan></text><rect x="177.1" y="64" width="12" height="12" rx="2" fill="#087f8c"/><text x="197.1" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="197.1" dy="0">Quedan en v1 consistente</tspan></text><line x1="71.08" y1="394" x2="920" y2="394" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="394" x2="71.08" y2="394" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="398.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="324" x2="920" y2="324" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="324" x2="71.08" y2="324" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="328.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">4</tspan></text><line x1="71.08" y1="254" x2="920" y2="254" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="254" x2="71.08" y2="254" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="258.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">8</tspan></text><line x1="71.08" y1="184" x2="920" y2="184" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="184" x2="71.08" y2="184" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="188.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">12</tspan></text><line x1="71.08" y1="114" x2="920" y2="114" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="114" x2="71.08" y2="114" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="118.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">16</tspan></text><line x1="71.08" y1="114" x2="71.08" y2="394" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 254)">Puntos de fallo inyectados</text><rect x="92.303" y="271.5" width="82.892" height="122.5" rx="3" fill="#6b7c86"/><text x="133.749" y="265.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="133.749" dy="0">7</tspan></text><rect x="179.195" y="392" width="82.892" height="2" rx="3" fill="#087f8c"/><text x="220.641" y="386" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="220.641" dy="0">0</tspan></text><text x="177.195" y="415" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="177.195" dy="0">A: sobrescribir en sitio</tspan></text><rect x="304.533" y="149" width="82.892" height="245" rx="3" fill="#6b7c86"/><text x="345.979" y="143" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="345.979" dy="0">14</tspan></text><rect x="391.425" y="359" width="82.892" height="35" rx="3" fill="#087f8c"/><text x="432.871" y="353" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="432.871" dy="0">2</tspan></text><text x="389.425" y="415" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="389.425" dy="0">B: reemplazar cada archivo</tspan></text><text x="389.425" y="432" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="389.425" dy="0">por separado</tspan></text><rect x="516.763" y="236.5" width="82.892" height="157.5" rx="3" fill="#6b7c86"/><text x="558.209" y="230.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="558.209" dy="0">9</tspan></text><rect x="603.655" y="236.5" width="82.892" height="157.5" rx="3" fill="#087f8c"/><text x="645.101" y="230.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="645.101" dy="0">9</tspan></text><text x="601.655" y="415" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="601.655" dy="0">C: directorio nuevo y</tspan></text><text x="601.655" y="432" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="601.655" dy="0">puntero</tspan></text><rect x="728.993" y="236.5" width="82.892" height="157.5" rx="3" fill="#6b7c86"/><text x="770.439" y="230.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="770.439" dy="0">9</tspan></text><rect x="815.885" y="236.5" width="82.892" height="157.5" rx="3" fill="#087f8c"/><text x="857.331" y="230.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="857.331" dy="0">9</tspan></text><text x="813.885" y="415" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="813.885" dy="0">D: como C, con verificación</tspan></text><text x="813.885" y="432" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="813.885" dy="0">previa</tspan></text><rect x="10" y="463" width="920" height="92.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="487.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Sin interrupción las cuatro terminan en v2 consistente; la diferencia está en qué hay después de una interrupción. Con un</tspan></text><text x="470" y="504.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">byte alterado en un módulo descargado, C termina en una instalación corrupta y D la rechaza antes del reemplazo y conserva</tspan></text><text x="470" y="521.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">v1. El experimento simula el corte con una excepción y no desconecta energía ni prueba el comportamiento del sistema de</tspan></text><text x="470" y="537.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">archivos.</tspan></text><text x="470" y="585.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Operaciones reales con archivos temporales; resultado idéntico en Windows y Ubuntu.</tspan></text></svg>
