<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 321" width="940" height="321" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Sesgo de versiones en 20 000 clientes con un lanzamiento cada 14 días: versiones de retraso</title><desc id="d">Tabla: a los 30 días con 2 lanzamientos el 78 por ciento está al día y el 22 por ciento lleva 2 o 3 versiones de retraso; a los 90 días con 6 lanzamientos, el 10,8 por ciento lleva 2 o 3 y el 11,2 por ciento 4 o más; a los 180 días con 12 lanzamientos, el 11,2 por ciento lleva 4 o más.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="321" fill="#ffffff"/><rect x="10" y="12" width="84" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="52" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="52" dy="0">Día</tspan></text><rect x="100" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="177" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="177" dy="0">Versión actual</tspan></text><rect x="260" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="332" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="332" dy="0">Al día</tspan></text><rect x="410" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="487" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="487" dy="0">1 de retraso</tspan></text><rect x="570" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="662" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="662" dy="0">2–3 de retraso</tspan></text><rect x="760" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="842" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="842" dy="0">4 o más</tspan></text><rect x="10" y="56" width="84" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="52" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="52" dy="0">30</tspan></text><rect x="100" y="56" width="154" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="177" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="177" dy="0">2</tspan></text><rect x="260" y="56" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="332" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="332" dy="0">78,0 %</tspan></text><rect x="410" y="56" width="154" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">0,0 %</tspan></text><rect x="570" y="56" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">22,0 %</tspan></text><rect x="760" y="56" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">0,0 %</tspan></text><rect x="10" y="106" width="84" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="52" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="52" dy="0">90</tspan></text><rect x="100" y="106" width="154" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="177" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="177" dy="0">6</tspan></text><rect x="260" y="106" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="332" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="332" dy="0">78,0 %</tspan></text><rect x="410" y="106" width="154" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">0,0 %</tspan></text><rect x="570" y="106" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">10,8 %</tspan></text><rect x="760" y="106" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">11,2 %</tspan></text><rect x="10" y="156" width="84" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="52" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="52" dy="0">180</tspan></text><rect x="100" y="156" width="154" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="177" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="177" dy="0">12</tspan></text><rect x="260" y="156" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="332" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="332" dy="0">88,8 %</tspan></text><rect x="410" y="156" width="154" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">0,0 %</tspan></text><rect x="570" y="156" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">0,0 %</tspan></text><rect x="760" y="156" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">11,2 %</tspan></text><rect x="10" y="210" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="234.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los clientes abren la aplicación cada 1, 2, 3, 7, 14, 30, 60 o 120 días (distribución supuesta). Se observaron 22 caminos</tspan></text><text x="470" y="251.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de actualización distintos y 8 712 de 182 568 actualizaciones saltaron 3 versiones o más: cada camino tiene que haberse</tspan></text><text x="470" y="268.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">probado.</tspan></text><text x="470" y="307.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
