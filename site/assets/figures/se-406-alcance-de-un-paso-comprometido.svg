<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 435" width="940" height="435" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Alcance de un paso comprometido según la configuración del workflow</title><desc id="d">Tabla: con permisos de escritura por defecto y secretos en variables, un paso comprometido alcanza el código, las etiquetas, los releases, los secretos del job y la caché; con permisos de solo lectura alcanza la lectura y puede alterar el artefacto; con permisos vacíos y mínimos por job, solo lo que ese job necesita; con pull_request_target y código de un fork, los secretos del repositorio base.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="435" fill="#ffffff"/><rect x="10" y="12" width="434" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="227" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="227" dy="0">Configuración</tspan></text><rect x="450" y="12" width="474" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="687" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="687" dy="0">Qué alcanza un paso comprometido</tspan></text><rect x="10" y="56" width="434" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="83.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">Permisos de escritura por defecto y secretos como</tspan></text><text x="227" y="99.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">variables del job</tspan></text><rect x="450" y="56" width="474" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="687" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="687" dy="0">Código, etiquetas, releases, secretos del job y caché</tspan></text><rect x="10" y="126" width="434" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="161.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">permissions: contents: read, sin secretos</tspan></text><rect x="450" y="126" width="474" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="687" y="153.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="687" dy="0">Lectura del código; el artefacto puede alterarse dentro del</tspan></text><text x="687" y="169.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="687" dy="0">job</tspan></text><rect x="10" y="196" width="434" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">permissions: {} arriba y permisos mínimos por job</tspan></text><rect x="450" y="196" width="474" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="687" y="223.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="687" dy="0">Solo lo que ese job necesita; id-token solo en el job de</tspan></text><text x="687" y="239.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="687" dy="0">publicación</tspan></text><rect x="10" y="266" width="434" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="301.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">pull_request_target ejecutando código de un fork</tspan></text><rect x="450" y="266" width="474" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="687" y="293.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="687" dy="0">Contexto privilegiado con código no confiable: secretos del</tspan></text><text x="687" y="309.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="687" dy="0">repositorio base</tspan></text><rect x="10" y="340" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="364.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Es un modelo de alcance a partir de la documentación de GitHub Actions, sin medir ningún ataque. Reducir permisos no evita</tspan></text><text x="470" y="381.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">el compromiso; reduce lo que se pierde cuando ocurre.</tspan></text><text x="470" y="421.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Análisis del autor a partir de la documentación oficial.</tspan></text></svg>
