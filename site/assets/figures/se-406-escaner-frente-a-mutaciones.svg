<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 611" width="860" height="611" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un escáner de reglas frente a 155 mutaciones de los workflows reales (11 operadores)</title><desc id="d">Tabla: el escáner detecta 15 de 15 mutaciones que desfijan una acción, añaden pull_request_target, interpolan el título del PR o un secreto, añaden curl a bash o quitan persist-credentials, y 10 de 10 de las de permisos, pero ninguna de las 45 que mantienen la forma: fijar un repositorio ajeno, un SHA malicioso o un paso con salida de red.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="860" height="611" fill="#ffffff"/><rect x="10" y="12" width="634" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="327" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="327" dy="0">Mutación</tspan></text><rect x="650" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="747" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="747" dy="0">Detectadas</tspan></text><rect x="10" y="56" width="634" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="76.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Desfijar una acción (de SHA a v4)</tspan></text><rect x="650" y="56" width="194" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="76.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">15 de 15</tspan></text><rect x="10" y="96" width="634" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="116.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Quitar permissions de nivel superior</tspan></text><rect x="650" y="96" width="194" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="116.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">10 de 10</tspan></text><rect x="10" y="136" width="634" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="156.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Poner permissions en write-all</tspan></text><rect x="650" y="136" width="194" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="156.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">10 de 10</tspan></text><rect x="10" y="176" width="634" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="196.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Añadir pull_request_target</tspan></text><rect x="650" y="176" width="194" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="196.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">15 de 15</tspan></text><rect x="10" y="216" width="634" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="236.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Interpolar el título del PR en un comando</tspan></text><rect x="650" y="216" width="194" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="236.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">15 de 15</tspan></text><rect x="10" y="256" width="634" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="276.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Añadir curl | bash</tspan></text><rect x="650" y="256" width="194" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="276.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">15 de 15</tspan></text><rect x="10" y="296" width="634" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="316.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Quitar persist-credentials: false</tspan></text><rect x="650" y="296" width="194" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="316.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">15 de 15</tspan></text><rect x="10" y="336" width="634" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="356.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Interpolar un secreto en un comando</tspan></text><rect x="650" y="336" width="194" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="356.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">15 de 15</tspan></text><rect x="10" y="376" width="634" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="396.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Fijar a SHA un repositorio de otro dueño</tspan></text><rect x="650" y="376" width="194" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="396.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">0 de 15</tspan></text><rect x="10" y="416" width="634" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="436.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Fijar a un SHA válido pero malicioso</tspan></text><rect x="650" y="416" width="194" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="436.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">0 de 15</tspan></text><rect x="10" y="456" width="634" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="476.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Añadir un paso con salida de red</tspan></text><rect x="650" y="456" width="194" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="476.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">0 de 15</tspan></text><rect x="10" y="500" width="840" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="430" y="524.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="430" dy="0">Detecta 110 de 155 (71,0 %). Las 45 que se escapan son todas formalmente correctas: están fijadas, con permisos</tspan></text><text x="430" y="541.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="430" dy="0">mínimos, y cambian de qué se fía el workflow. Las mutaciones que no cambiaron el texto (permisos ya vacíos) se</tspan></text><text x="430" y="558.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="430" dy="0">descartaron.</tspan></text><text x="430" y="597.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="430" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
