<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 575" width="940" height="575" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Seis casos coherentes que el verificador no rechaza y qué haría falta para verlos</title><desc id="d">Tabla: un código malicioso aprobado, una dependencia comprometida en el bloqueo, un commit distinto del revisado, una clave de firma robada, un segundo release con la misma secuencia y una afirmación de reproducibilidad sin reconstruir pasan las doce comprobaciones; cada uno exige un control distinto fuera del verificador.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="575" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Caso</tspan></text><rect x="340" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="457" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="457" dy="0">Resultado del verificador</tspan></text><rect x="580" y="12" width="344" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="752" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="752" dy="0">Control que lo vería</tspan></text><rect x="10" y="56" width="324" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="83.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Código malicioso aprobado y construido por el</tspan></text><text x="172" y="99.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">CI legítimo</tspan></text><rect x="340" y="56" width="234" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="91.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">Pasa: todo es coherente</tspan></text><rect x="580" y="56" width="344" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="83.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">Revisión de código y reconstrucción desde la</tspan></text><text x="752" y="99.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">fuente revisada</tspan></text><rect x="10" y="126" width="324" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="153.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Dependencia comprometida declarada en el</tspan></text><text x="172" y="169.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">bloqueo</tspan></text><rect x="340" y="126" width="234" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="161.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">Pasa</tspan></text><rect x="580" y="126" width="344" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="153.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">Revisión de cambios del bloqueo y escaneo de</tspan></text><text x="752" y="169.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">vulnerabilidades</tspan></text><rect x="10" y="196" width="324" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="231.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Commit distinto del revisado</tspan></text><rect x="340" y="196" width="234" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="223.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">Pasa: el verificador no conoce</tspan></text><text x="457" y="239.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">la revisión</tspan></text><rect x="580" y="196" width="344" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">Registro de revisión firmado y comprobado</tspan></text><rect x="10" y="266" width="324" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="301.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Clave de firma robada</tspan></text><rect x="340" y="266" width="234" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="301.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">Pasa</tspan></text><rect x="580" y="266" width="344" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="293.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">Revocación, claves de corta vida, firma sin</tspan></text><text x="752" y="309.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">clave larga</tspan></text><rect x="10" y="336" width="324" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="363.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Segundo release con la misma versión y</tspan></text><text x="172" y="379.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">secuencia</tspan></text><rect x="340" y="336" width="234" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="371.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">Pasa</tspan></text><rect x="580" y="336" width="344" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="371.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">Registro transparente que impida reemplazos</tspan></text><rect x="10" y="406" width="324" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="433.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Procedencia con reproducible=true sin</tspan></text><text x="172" y="449.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">reconstruir</tspan></text><rect x="340" y="406" width="234" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="441.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">Pasa (es una afirmación)</tspan></text><rect x="580" y="406" width="344" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="441.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">Reconstrucción independiente</tspan></text><rect x="10" y="480" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="504.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Rechaza 0 de 6, y el sexto es el propio release legítimo con una afirmación que nadie comprueba. La integridad y la</tspan></text><text x="470" y="521.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">procedencia se verifican con una cadena de huellas; la confianza en el contenido no sale de ninguna cadena de huellas.</tspan></text><text x="470" y="561.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido en Windows 11 (CPython 3.12.9) y Ubuntu bajo WSL2 (3.12.3); lo que difiere entre sistemas se indica en la figura.</tspan></text></svg>
