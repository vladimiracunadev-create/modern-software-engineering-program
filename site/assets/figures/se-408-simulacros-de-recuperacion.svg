<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 502" width="940" height="502" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro simulacros de recuperación del canal de release y su resultado</title><desc id="d">Diagrama de cuatro simulacros de recuperación del canal de release: reinstalar un bundle antiguo es rechazado por la secuencia y se republica como 1.4.2 con secuencia 16; perder el repositorio se resuelve reconstruyendo con la misma huella; rotar la clave se declara antes de necesitarla; perder la clave sin rotación previa deja rechazadas todas las versiones nuevas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="502" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuatro simulacros de recuperación del canal de release y su resultado</tspan></text><rect x="14" y="163.56" width="250" height="86.56" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="139" y="185.52" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="139" dy="0">Simulacros de recuperación del</tspan></text><text x="139" y="202.16" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="139" dy="0">canal de release</tspan></text><text x="139" y="218.8" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="139" dy="0">resultado observado y cómo se</tspan></text><text x="139" y="235.44" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="139" dy="0">recupera</tspan></text><rect x="334" y="49" width="592" height="69.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="630" y="70.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="630" dy="0">Reinstalar el bundle firmado de 1.4.0 tras publicar 1.4.1</tspan></text><text x="630" y="87.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">rechazado por la secuencia (retroceso) · republicar como 1.4.2 con secuencia</tspan></text><text x="630" y="104.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">16</tspan></text><polyline points="264,206.84 299,206.84 299,83.96 334,83.96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="334" y="130.92" width="592" height="69.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="630" y="152.88" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="630" dy="0">Perder el repositorio de releases</tspan></text><text x="630" y="169.52" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">reconstrucción idéntica a la publicada · reconstruir desde la fuente y</tspan></text><text x="630" y="186.16" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">comparar huellas</tspan></text><polyline points="264,206.84 299,206.84 299,165.88 334,165.88" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="334" y="212.84" width="592" height="69.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="630" y="234.8" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="630" dy="0">Rotar la clave de firma</tspan></text><text x="630" y="251.44" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="630" dy="0">declaración firmada con la clave vigente; 1.5.0 verifica con la nueva ·</tspan></text><text x="630" y="268.08" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="630" dy="0">declarar la rotación antes de necesitarla</tspan></text><polyline points="264,206.84 299,206.84 299,247.8 334,247.8" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="334" y="294.76" width="592" height="69.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="630" y="316.72" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="630" dy="0">Perder la clave privada sin rotación previa</tspan></text><text x="630" y="333.36" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="630" dy="0">toda versión nueva rechazada por los clientes · acción humana por un canal de</tspan></text><text x="630" y="350" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="630" dy="0">confianza anterior</tspan></text><polyline points="264,206.84 299,206.84 299,329.72 334,329.72" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><rect x="10" y="378.68" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="403.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Los tres primeros se resuelven con lo que el canal ya tiene; el cuarto es el que no se recupera con automatización: la</tspan></text><text x="470" y="420.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">recuperación de una clave perdida depende de un canal que los clientes ya hayan aceptado. Es un simulacro con un solo</tspan></text><text x="470" y="436.92" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">proceso y no la operación de un repositorio real.</tspan></text><text x="470" y="484.6" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido en Windows 11 (CPython 3.12.9) y Ubuntu bajo WSL2 (3.12.3); lo que difiere entre sistemas se indica en la figura.</tspan></text></svg>
