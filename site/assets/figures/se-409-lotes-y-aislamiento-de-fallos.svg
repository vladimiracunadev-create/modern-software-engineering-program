<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 558" width="940" height="558" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Integrar por lotes: cuántas veces se construye hasta aislar cada cambio defectuoso (24 000 cambios, 4 % defectuosos)</title><desc id="d">Línea con las construcciones por cambio, con bisección, según el tamaño del lote: un cambio por lote exige 1,00; con lotes de 5 baja a 0,38; el mínimo está en lotes de 10 con 0,35 y con lotes de 50 vuelve a 0,37.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="558" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Integrar por lotes: cuántas veces se construye hasta aislar cada cambio defectuoso (24 000 cambios, 4 %</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">defectuosos)</tspan></text><line x1="86.16" y1="358" x2="910" y2="358" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="358" x2="86.16" y2="358" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="362.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">0</tspan></text><line x1="86.16" y1="288" x2="910" y2="288" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="288" x2="86.16" y2="288" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="292.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">0,25</tspan></text><line x1="86.16" y1="218" x2="910" y2="218" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="218" x2="86.16" y2="218" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="222.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">0,5</tspan></text><line x1="86.16" y1="148" x2="910" y2="148" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="148" x2="86.16" y2="148" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="152.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">0,75</tspan></text><line x1="86.16" y1="78" x2="910" y2="78" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="78" x2="86.16" y2="78" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="82.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">1</tspan></text><line x1="86.16" y1="78" x2="86.16" y2="358" stroke="#5b7280" stroke-width="1.6"/><line x1="104.16" y1="78" x2="104.16" y2="358" stroke="#d5dde1" stroke-width="1"/><line x1="104.16" y1="358" x2="104.16" y2="363" stroke="#5b7280" stroke-width="1.4"/><text x="104.16" y="379" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="104.16" dy="0">1</tspan></text><line x1="243.753" y1="78" x2="243.753" y2="358" stroke="#d5dde1" stroke-width="1"/><line x1="243.753" y1="358" x2="243.753" y2="363" stroke="#5b7280" stroke-width="1.4"/><text x="243.753" y="379" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="243.753" dy="0">2</tspan></text><line x1="428.284" y1="78" x2="428.284" y2="358" stroke="#d5dde1" stroke-width="1"/><line x1="428.284" y1="358" x2="428.284" y2="363" stroke="#5b7280" stroke-width="1.4"/><text x="428.284" y="379" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="428.284" dy="0">5</tspan></text><line x1="567.876" y1="78" x2="567.876" y2="358" stroke="#d5dde1" stroke-width="1"/><line x1="567.876" y1="358" x2="567.876" y2="363" stroke="#5b7280" stroke-width="1.4"/><text x="567.876" y="379" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="567.876" dy="0">10</tspan></text><line x1="752.407" y1="78" x2="752.407" y2="358" stroke="#d5dde1" stroke-width="1"/><line x1="752.407" y1="358" x2="752.407" y2="363" stroke="#5b7280" stroke-width="1.4"/><text x="752.407" y="379" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752.407" dy="0">25</tspan></text><line x1="892" y1="78" x2="892" y2="358" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="358" x2="892" y2="363" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="379" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">50</tspan></text><line x1="86.16" y1="358" x2="910" y2="358" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 218)">Construcciones por cambio</text><text x="498.08" y="404" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="498.08" dy="0">Cambios por lote (escala logarítmica)</tspan></text><polyline points="104.16,78 243.753,195.973 428.284,251.203 567.876,260.77 752.407,257.457 892,253.513" fill="none" stroke="#087f8c" stroke-width="2.4"/><circle cx="104.16" cy="78" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="104.16" y="67" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="104.16" dy="0">1,00</tspan></text><circle cx="243.753" cy="195.973" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="243.753" y="184.973" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="243.753" dy="0">0,58</tspan></text><circle cx="428.284" cy="251.203" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="428.284" y="240.203" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="428.284" dy="0">0,38</tspan></text><circle cx="567.876" cy="260.77" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="567.876" y="249.77" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="567.876" dy="0">0,35</tspan></text><circle cx="752.407" cy="257.457" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="752.407" y="246.457" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="752.407" dy="0">0,36</tspan></text><circle cx="892" cy="253.513" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="242.513" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">0,37</tspan></text><rect x="10" y="418" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="442.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lotes en rojo según el tamaño: 1: 4 %, 2: 8 %, 5: 18 %, 10: 33 %, 25: 63 %, 50: 85 %. Agrupar ahorra construcciones hasta</tspan></text><text x="470" y="459.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">unos 10 cambios por lote y deja de ahorrar: con 50 cambios casi todos los lotes salen rojos y hay que aislar a mano. El</tspan></text><text x="470" y="476.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ahorro se paga con retraso: el cambio bueno espera al lote y el defectuoso se localiza más tarde. El 4 % de defectos por</tspan></text><text x="470" y="492.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cambio y la independencia entre cambios son supuestos.</tspan></text><text x="470" y="540.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
