stroke="#5b7280" stroke-width="1.6"/><text x="137" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">5 días</tspan></text><rect x="270" y="206" width="374" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">100 %</tspan></text><rect x="650" y="206" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">5,9</tspan></text><rect x="10" y="256" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">10 días</tspan></text><rect x="270" y="256" width="374" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">100 %</tspan></text><rect x="650" y="256" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">13,9</tspan></text><rect x="10" y="306" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="331.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">20 días</tspan></text><rect x="270" y="306" width="374" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">100 %</tspan></text><rect x="650" y="306" width="294" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">30,8</tspan></text><rect x="10" y="360" width="940" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="384.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">La probabilidad de choque no crece de forma lineal sino saturada: pasa de 21 % a 89 % en un día y medio y después ya no puede</tspan></text><text x="480" y="401.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">empeorar, aunque el trabajo por resolver sigue creciendo (de 0,2 a 31 archivos). Los puntos calientes (los archivos que todos</tspan></text><text x="480" y="418.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">tocan) y las tres modificaciones diarias por persona son supuestos del autor.</tspan></text><text x="480" y="457.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
