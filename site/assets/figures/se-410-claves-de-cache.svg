<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 618" width="940" height="618" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro claves de caché en 600 construcciones (la dependencia cambia en el 10 % de ellas)</title><desc id="d">Barras horizontales con aciertos, restauraciones parciales y entorno obsoleto de cuatro claves de caché: el hash del lockfile acierta el 89 por ciento y tarda 26,6 segundos; con respaldo por prefijo baja a 12,2 segundos con 11 por ciento parciales; el SHA del commit acierta el 17,5 por ciento y tarda 149,9; una clave fija acierta siempre pero el 97 por ciento usa dependencias obsoletas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="618" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuatro claves de caché en 600 construcciones (la dependencia cambia en el 10 % de ellas)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Aciertos</tspan></text><rect x="124.32" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="144.32" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="144.32" dy="0">Parciales</tspan></text><rect x="240.18" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="260.18" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="260.18" dy="0">Entorno obsoleto</tspan></text><line x1="274" y1="77" x2="274" y2="437" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="437" x2="274" y2="442" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="458" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0</tspan></text><line x1="394.34" y1="77" x2="394.34" y2="437" stroke="#d5dde1" stroke-width="1"/><line x1="394.34" y1="437" x2="394.34" y2="442" stroke="#5b7280" stroke-width="1.4"/><text x="394.34" y="458" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="394.34" dy="0">20</tspan></text><line x1="514.68" y1="77" x2="514.68" y2="437" stroke="#d5dde1" stroke-width="1"/><line x1="514.68" y1="437" x2="514.68" y2="442" stroke="#5b7280" stroke-width="1.4"/><text x="514.68" y="458" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="514.68" dy="0">40</tspan></text><line x1="635.02" y1="77" x2="635.02" y2="437" stroke="#d5dde1" stroke-width="1"/><line x1="635.02" y1="437" x2="635.02" y2="442" stroke="#5b7280" stroke-width="1.4"/><text x="635.02" y="458" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="635.02" dy="0">60</tspan></text><line x1="755.36" y1="77" x2="755.36" y2="437" stroke="#d5dde1" stroke-width="1"/><line x1="755.36" y1="437" x2="755.36" y2="442" stroke="#5b7280" stroke-width="1.4"/><text x="755.36" y="458" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="755.36" dy="0">80</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="437" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="437" x2="875.7" y2="442" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="458" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">100</tspan></text><line x1="274" y1="437" x2="875.7" y2="437" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="126.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">hash del lockfile (26,6 s)</tspan></text><text x="264" y="216.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">hash + respaldo (12,2 s)</tspan></text><text x="264" y="306.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">SHA del commit (149,9 s)</tspan></text><text x="264" y="396.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">clave fija (8,0 s)</tspan></text><rect x="274" y="83" width="536.516" height="24" rx="3" fill="#087f8c"/><text x="817.516" y="99.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="817.516" dy="0">89,2</tspan></text><rect x="274" y="110" width="2" height="24" rx="3" fill="#946512"/><text x="283" y="126.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="283" dy="0">0,0</tspan></text><rect x="274" y="137" width="2" height="24" rx="3" fill="#c0432f"/><text x="283" y="153.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="283" dy="0">0,0</tspan></text><rect x="274" y="173" width="536.516" height="24" rx="3" fill="#087f8c"/><text x="817.516" y="189.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="817.516" dy="0">89,2</tspan></text><rect x="274" y="200" width="64.1813" height="24" rx="3" fill="#946512"/><text x="345.181" y="216.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="345.181" dy="0">10,7</tspan></text><rect x="274" y="227" width="2" height="24" rx="3" fill="#c0432f"/><text x="283" y="243.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="283" dy="0">0,0</tspan></text><rect x="274" y="263" width="105.298" height="24" rx="3" fill="#087f8c"/><text x="386.298" y="279.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="386.298" dy="0">17,5</tspan></text><rect x="274" y="290" width="2" height="24" rx="3" fill="#946512"/><text x="283" y="306.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="283" dy="0">0,0</tspan></text><rect x="274" y="317" width="2" height="24" rx="3" fill="#c0432f"/><text x="283" y="333.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="283" dy="0">0,0</tspan></text><rect x="274" y="353" width="601.7" height="24" rx="3" fill="#087f8c"/><text x="882.7" y="369.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100,0</tspan></text><rect x="274" y="380" width="2" height="24" rx="3" fill="#946512"/><text x="283" y="396.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="283" dy="0">0,0</tspan></text><rect x="274" y="407" width="584.652" height="24" rx="3" fill="#c0432f"/><text x="865.652" y="423.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="865.652" dy="0">97,2</tspan></text><text x="574.85" y="481" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="574.85" dy="0">Construcciones (%)</tspan></text><rect x="10" y="495" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="519.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Entre paréntesis, la instalación media. Una clave fija da el mejor tiempo (8 s) y el peor resultado: el 97 % de las</tspan></text><text x="470" y="536.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">construcciones corre con dependencias que ya no coinciden con el lockfile. El tiempo ahorrado no compensa un resultado que</tspan></text><text x="470" y="553.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">no es reproducible. Los tiempos de 180, 45 y 8 segundos son supuestos del autor.</tspan></text><text x="470" y="600.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
