<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 516" width="940" height="516" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Latencia de los clientes que no hacen ruido mientras uno envía una ráfaga: tres políticas sobre la misma carga</title><desc id="d">Pistas de percentiles en milisegundos y escala logarítmica para los siete clientes normales: sin protección p50 9370, p95 23540 y p99 24730; con cuota de tasa por cliente p50 10, p95 10 y p99 20; con cola justa por cliente p50 10, p95 10 y p99 20.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="516" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Latencia de los clientes que no hacen ruido mientras uno envía una ráfaga: tres políticas sobre la misma</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">carga</tspan></text><rect x="16" y="64" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">p50</tspan></text><polygon points="92.62,63.1 99.22,75.4 86.02,75.4" fill="#946512" stroke="#946512" stroke-width="2"/><text x="106.62" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="106.62" dy="0">p95</tspan></text><polygon points="163.24,62.5 170.74,70 163.24,77.5 155.74,70" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="177.24" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="177.24" dy="0">p99</tspan></text><line x1="274" y1="96" x2="274" y2="318" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="318" x2="274" y2="323" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="339" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">1</tspan></text><line x1="397.2" y1="96" x2="397.2" y2="318" stroke="#d5dde1" stroke-width="1"/><line x1="397.2" y1="318" x2="397.2" y2="323" stroke="#5b7280" stroke-width="1.4"/><text x="397.2" y="339" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397.2" dy="0">10</tspan></text><line x1="520.4" y1="96" x2="520.4" y2="318" stroke="#d5dde1" stroke-width="1"/><line x1="520.4" y1="318" x2="520.4" y2="323" stroke="#5b7280" stroke-width="1.4"/><text x="520.4" y="339" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="520.4" dy="0">100</tspan></text><line x1="643.6" y1="96" x2="643.6" y2="318" stroke="#d5dde1" stroke-width="1"/><line x1="643.6" y1="318" x2="643.6" y2="323" stroke="#5b7280" stroke-width="1.4"/><text x="643.6" y="339" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="643.6" dy="0">1 000</tspan></text><line x1="766.8" y1="96" x2="766.8" y2="318" stroke="#d5dde1" stroke-width="1"/><line x1="766.8" y1="318" x2="766.8" y2="323" stroke="#5b7280" stroke-width="1.4"/><text x="766.8" y="339" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="766.8" dy="0">10 000</tspan></text><line x1="890" y1="96" x2="890" y2="318" stroke="#d5dde1" stroke-width="1"/><line x1="890" y1="318" x2="890" y2="323" stroke="#5b7280" stroke-width="1.4"/><text x="890" y="339" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="890" dy="0">100 000</tspan></text><line x1="274" y1="318" x2="890" y2="318" stroke="#5b7280" stroke-width="1.6"/><text x="244" y="137.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="244" dy="0">Cola compartida, sin cuotas</tspan></text><text x="244" y="211.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="244" dy="0">Cuota de tasa por cliente</tspan></text><text x="244" y="285.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="244" dy="0">Cola justa por cliente</tspan></text><line x1="763.318" y1="133" x2="815.245" y2="133" stroke="#8a9aa3" stroke-width="5"/><rect x="756.318" y="126" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="763.318" y="117" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="763.318" dy="0">9 370</tspan></text><polygon points="812.607,124.25 821.357,133 812.607,141.75 803.857,133" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><polygon points="812.607,124.95 820.307,139.3 804.907,139.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="812.607" y="162" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="812.607" dy="0">23 540 · p95, p99</tspan></text><line x1="397.2" y1="207" x2="434.287" y2="207" stroke="#8a9aa3" stroke-width="5"/><polygon points="397.2,198.95 404.9,213.3 389.5,213.3" fill="#946512" stroke="#946512" stroke-width="2"/><rect x="390.2" y="200" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="397.2" y="191" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="397.2" dy="0">10 · p50, p95</tspan></text><polygon points="434.287,198.25 443.037,207 434.287,215.75 425.537,207" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="434.287" y="236" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="434.287" dy="0">20</tspan></text><line x1="397.2" y1="281" x2="434.287" y2="281" stroke="#8a9aa3" stroke-width="5"/><polygon points="397.2,272.95 404.9,287.3 389.5,287.3" fill="#946512" stroke="#946512" stroke-width="2"/><rect x="390.2" y="274" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="397.2" y="265" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="397.2" dy="0">10 · p50, p95</tspan></text><polygon points="434.287,272.25 443.037,281 434.287,289.75 425.537,281" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="434.287" y="310" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="434.287" dy="0">20</tspan></text><text x="582" y="362" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="582" dy="0">Milisegundos (escala logarítmica) (escala logarítmica)</tspan></text><rect x="10" y="376" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="400.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Misma semilla, misma carga y misma capacidad. Sin protección la ráfaga de un cliente retrasa a todos hasta unos 24 s,</tspan></text><text x="470" y="417.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">porque la cola es una sola; con una de las dos políticas los otros siete casi no notan la ráfaga. La cuota de tasa lo logra</tspan></text><text x="470" y="434.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">rechazando 56 619 solicitudes del vecino (y 914 de los normales); la cola justa no rechaza nada, pero el vecino espera</tspan></text><text x="470" y="450.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">hasta 74 s.</tspan></text><text x="470" y="498.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 34; muestra un mecanismo, no mide un producto ni un proveedor reales.</tspan></text></svg>
