<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 403" width="960" height="403" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reintentar pruebas: porcentaje de ejecuciones que pasan con 0, 1 o 2 reintentos</title><desc id="d">Tabla: un defecto real que aparece en el 20 por ciento de las ejecuciones pasa el 80 por ciento sin reintentos, el 96 con uno y el 99 con dos; los rojos falsos por pruebas inestables bajan de 25,9 por ciento a 0,015 por ciento con un reintento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="403" fill="#ffffff"/><rect x="10" y="12" width="444" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="232" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="232" dy="0">Situación</tspan></text><rect x="460" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="537" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="537" dy="0">Sin reintentos</tspan></text><rect x="620" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="697" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="697" dy="0">1 reintento</tspan></text><rect x="780" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="862" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="862" dy="0">2 reintentos</tspan></text><rect x="10" y="56" width="444" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="85.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Defecto que aparece en el 50 % de las ejecuciones</tspan></text><rect x="460" y="56" width="154" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">49,7 %</tspan></text><rect x="620" y="56" width="154" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">74,6 %</tspan></text><rect x="780" y="56" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">87,6 %</tspan></text><rect x="10" y="114" width="444" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="143.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Defecto que aparece en el 20 % de las ejecuciones</tspan></text><rect x="460" y="114" width="154" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">80,1 %</tspan></text><rect x="620" y="114" width="154" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">96,1 %</tspan></text><rect x="780" y="114" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">99,2 %</tspan></text><rect x="10" y="172" width="444" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="201.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Defecto que aparece en el 5 % de las ejecuciones</tspan></text><rect x="460" y="172" width="154" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">94,9 %</tspan></text><rect x="620" y="172" width="154" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">99,7 %</tspan></text><rect x="780" y="172" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">100,0 %</tspan></text><rect x="10" y="230" width="444" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="251.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Rojo falso por pruebas inestables (600 pruebas, 0,05 % cada</tspan></text><text x="232" y="267.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">una)</tspan></text><rect x="460" y="230" width="154" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">25,924 %</tspan></text><rect x="620" y="230" width="154" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">0,015 %</tspan></text><rect x="780" y="230" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">0,000 %</tspan></text><rect x="10" y="292" width="940" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="316.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">El reintento hace desaparecer los rojos falsos (25,9 % → 0,015 %) y también hace pasar los defectos intermitentes: uno que</tspan></text><text x="480" y="333.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">aparece 1 vez de 5 pasa el 99,2 % con dos reintentos. Reintentar sin registrar qué se reintentó convierte una señal en ruido</tspan></text><text x="480" y="350.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">silencioso; hay que contar los reintentos y cuarentenar la prueba.</tspan></text><text x="480" y="389.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
