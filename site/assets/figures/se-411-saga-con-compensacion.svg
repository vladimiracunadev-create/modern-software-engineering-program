<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 353" width="960" height="353" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un alta en cinco pasos que falla en el cuarto: qué se deshace y en qué orden</title><desc id="d">Diagrama de dos filas: arriba los pasos crear inquilino, crear datos, crear identidad y vincular facturación, este último marcado como fallido; abajo las compensaciones que deshacen en orden inverso la identidad, los datos y el inquilino, con una nota sobre repetir pasos sin duplicar.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="353" fill="#ffffff"/><rect x="10" y="14" width="202" height="96" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="111" y="57.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="111" dy="0">1. Crear inquilino</tspan></text><text x="111" y="73.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="111" dy="0">Estado: aprovisionando</tspan></text><rect x="256" y="14" width="202" height="96" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="357" y="57.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="357" dy="0">2. Crear datos</tspan></text><text x="357" y="73.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="357" dy="0">Esquema o filas semilla</tspan></text><polyline points="212,62 256,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="502" y="14" width="202" height="96" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="603" y="57.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="603" dy="0">3. Crear identidad</tspan></text><text x="603" y="73.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="603" dy="0">Primer administrador</tspan></text><polyline points="458,62 502,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="748" y="14" width="202" height="96" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="849" y="49" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="849" dy="0">4. Vincular facturación</tspan></text><text x="849" y="65.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="849" dy="0">Falla: el procesador no</tspan></text><text x="849" y="82.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="849" dy="0">responde</tspan></text><polyline points="704,62 748,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="150" width="202" height="96" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="111" y="185" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="111" dy="0">Deshacer identidad</tspan></text><text x="111" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="111" dy="0">Se borra el</tspan></text><text x="111" y="218.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="111" dy="0">administrador</tspan></text><rect x="256" y="150" width="202" height="96" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="357" y="193.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="357" dy="0">Deshacer datos</tspan></text><text x="357" y="209.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="357" dy="0">Se borran filas semilla</tspan></text><polyline points="212,198 256,198" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="502" y="150" width="202" height="96" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="603" y="185" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="603" dy="0">Deshacer inquilino</tspan></text><text x="603" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="603" dy="0">Estado: fallido, con</tspan></text><text x="603" y="218.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="603" dy="0">motivo</tspan></text><polyline points="458,198 502,198" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="748" y="150" width="202" height="96" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="849" y="185" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="849" dy="0">Reintentar con la misma</tspan></text><text x="849" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="849" dy="0">clave</tspan></text><text x="849" y="218.28" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="849" dy="0">O dejar en revisión</tspan></text><polyline points="704,198 748,198" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="849,110 849,130 111,130 111,150" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="260" width="940" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="284.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Cada paso y cada compensación tiene que poder repetirse sin duplicar: si el proceso se corta justo después del paso 3, el</tspan></text><text x="480" y="301.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">reintento debe encontrar el administrador ya creado y seguir. Sin eso, un corte deja un cliente a medias que nadie ve.</tspan></text><text x="480" y="343.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Modelo con parámetros del autor y semilla fija 34; muestra un mecanismo, no mide un producto ni un proveedor reales.</tspan></text></svg>
