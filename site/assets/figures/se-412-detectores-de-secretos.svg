<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 371" width="1020" height="371" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Buscar secretos en 1200 líneas sintéticas con 460 secretos sembrados</title><desc id="d">Tabla: buscar prefijos conocidos no da falsos positivos pero pierde 202 de 460 secretos; la entropía encuentra 343 pero señala 414 identificadores y hashes que no son secretos; buscar asignaciones sospechosas encuentra 393 con 4 falsos positivos y pierde 67 secretos con otra forma, como una cabecera Bearer o una URL con credencial.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1020" height="371" fill="#ffffff"/><rect x="10" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="142" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="142" dy="0">Detector</tspan></text><rect x="280" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="337" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="337" dy="0">Aciertos</tspan></text><rect x="400" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="482" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="482" dy="0">Falsos positivos</tspan></text><rect x="570" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="652" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="652" dy="0">Secretos perdidos</tspan></text><rect x="740" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="797" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="797" dy="0">Precisión</tspan></text><rect x="860" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="932" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="932" dy="0">Exhaustividad</tspan></text><rect x="10" y="56" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="81.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">prefijos conocidos</tspan></text><rect x="280" y="56" width="114" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="337" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="337" dy="0">258</tspan></text><rect x="400" y="56" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">0</tspan></text><rect x="570" y="56" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">202</tspan></text><rect x="740" y="56" width="114" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">100 %</tspan></text><rect x="860" y="56" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="932" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="932" dy="0">56 %</tspan></text><rect x="10" y="106" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="131.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">entropía</tspan></text><rect x="280" y="106" width="114" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="337" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="337" dy="0">343</tspan></text><rect x="400" y="106" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">414</tspan></text><rect x="570" y="106" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">117</tspan></text><rect x="740" y="106" width="114" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">45 %</tspan></text><rect x="860" y="106" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="932" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="932" dy="0">75 %</tspan></text><rect x="10" y="156" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="181.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">asignación sospechosa</tspan></text><rect x="280" y="156" width="114" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="337" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="337" dy="0">393</tspan></text><rect x="400" y="156" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">4</tspan></text><rect x="570" y="156" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">67</tspan></text><rect x="740" y="156" width="114" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">99 %</tspan></text><rect x="860" y="156" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="932" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="932" dy="0">85 %</tspan></text><rect x="10" y="206" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="231.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">prefijos + asignación</tspan></text><rect x="280" y="206" width="114" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="337" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="337" dy="0">393</tspan></text><rect x="400" y="206" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">4</tspan></text><rect x="570" y="206" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="652" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652" dy="0">67</tspan></text><rect x="740" y="206" width="114" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">99 %</tspan></text><rect x="860" y="206" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="932" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="932" dy="0">85 %</tspan></text><rect x="10" y="260" width="1000" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="510" y="284.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="510" dy="0">Cada detector ve una forma y ciega ante otra: la entropía confunde 170 SHA de git, 153 UUID y 91 imágenes en base64 con secretos y aun</tspan></text><text x="510" y="301.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="510" dy="0">así pierde las contraseñas de baja entropía. Un detector no sustituye a la rotación: lo que encuentra ya estaba expuesto. Los secretos</tspan></text><text x="510" y="318.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="510" dy="0">y señuelos son cadenas inventadas.</tspan></text><text x="510" y="357.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="510" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
