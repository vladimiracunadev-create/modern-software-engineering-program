<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 618" width="940" height="618" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Buscar secretos en 1200 líneas sintéticas con 460 secretos sembrados</title><desc id="d">Barras horizontales con aciertos, falsos positivos y secretos perdidos de cuatro detectores: buscar prefijos conocidos no da falsos positivos pero pierde 202 de 460 secretos; la entropía encuentra 343 pero señala 414 identificadores y hashes; buscar asignaciones sospechosas encuentra 393 con 4 falsos positivos y pierde 67.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="618" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Buscar secretos en 1200 líneas sintéticas con 460 secretos sembrados</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Aciertos</tspan></text><rect x="124.32" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="144.32" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="144.32" dy="0">Falsos positivos</tspan></text><rect x="292.96" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="312.96" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="312.96" dy="0">Secretos perdidos</tspan></text><line x1="214" y1="77" x2="214" y2="437" stroke="#d5dde1" stroke-width="1"/><line x1="214" y1="437" x2="214" y2="442" stroke="#5b7280" stroke-width="1.4"/><text x="214" y="458" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="214" dy="0">0</tspan></text><line x1="349.564" y1="77" x2="349.564" y2="437" stroke="#d5dde1" stroke-width="1"/><line x1="349.564" y1="437" x2="349.564" y2="442" stroke="#5b7280" stroke-width="1.4"/><text x="349.564" y="458" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="349.564" dy="0">100</tspan></text><line x1="485.128" y1="77" x2="485.128" y2="437" stroke="#d5dde1" stroke-width="1"/><line x1="485.128" y1="437" x2="485.128" y2="442" stroke="#5b7280" stroke-width="1.4"/><text x="485.128" y="458" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="485.128" dy="0">200</tspan></text><line x1="620.692" y1="77" x2="620.692" y2="437" stroke="#d5dde1" stroke-width="1"/><line x1="620.692" y1="437" x2="620.692" y2="442" stroke="#5b7280" stroke-width="1.4"/><text x="620.692" y="458" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="620.692" dy="0">300</tspan></text><line x1="756.256" y1="77" x2="756.256" y2="437" stroke="#d5dde1" stroke-width="1"/><line x1="756.256" y1="437" x2="756.256" y2="442" stroke="#5b7280" stroke-width="1.4"/><text x="756.256" y="458" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="756.256" dy="0">400</tspan></text><line x1="891.82" y1="77" x2="891.82" y2="437" stroke="#d5dde1" stroke-width="1"/><line x1="891.82" y1="437" x2="891.82" y2="442" stroke="#5b7280" stroke-width="1.4"/><text x="891.82" y="458" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="891.82" dy="0">500</tspan></text><line x1="214" y1="437" x2="891.82" y2="437" stroke="#5b7280" stroke-width="1.6"/><text x="204" y="126.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="204" dy="0">prefijos conocidos</tspan></text><text x="204" y="216.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="204" dy="0">entropía</tspan></text><text x="204" y="306.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="204" dy="0">asignación sospechosa</tspan></text><text x="204" y="396.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="204" dy="0">prefijos + asignación</tspan></text><rect x="214" y="83" width="349.755" height="24" rx="3" fill="#087f8c"/><text x="570.755" y="99.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="570.755" dy="0">258</tspan></text><rect x="214" y="110" width="2" height="24" rx="3" fill="#c0432f"/><text x="223" y="126.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="223" dy="0">0</tspan></text><rect x="214" y="137" width="273.839" height="24" rx="3" fill="#946512"/><text x="494.839" y="153.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="494.839" dy="0">202</tspan></text><rect x="214" y="173" width="464.985" height="24" rx="3" fill="#087f8c"/><text x="685.985" y="189.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="685.985" dy="0">343</tspan></text><rect x="214" y="200" width="561.235" height="24" rx="3" fill="#c0432f"/><text x="782.235" y="216.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="782.235" dy="0">414</tspan></text><rect x="214" y="227" width="158.61" height="24" rx="3" fill="#946512"/><text x="379.61" y="243.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="379.61" dy="0">117</tspan></text><rect x="214" y="263" width="532.767" height="24" rx="3" fill="#087f8c"/><text x="753.767" y="279.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="753.767" dy="0">393</tspan></text><rect x="214" y="290" width="5.42256" height="24" rx="3" fill="#c0432f"/><text x="226.423" y="306.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="226.423" dy="0">4</tspan></text><rect x="214" y="317" width="90.8279" height="24" rx="3" fill="#946512"/><text x="311.828" y="333.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="311.828" dy="0">67</tspan></text><rect x="214" y="353" width="532.767" height="24" rx="3" fill="#087f8c"/><text x="753.767" y="369.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="753.767" dy="0">393</tspan></text><rect x="214" y="380" width="5.42256" height="24" rx="3" fill="#c0432f"/><text x="226.423" y="396.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="226.423" dy="0">4</tspan></text><rect x="214" y="407" width="90.8279" height="24" rx="3" fill="#946512"/><text x="311.828" y="423.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="311.828" dy="0">67</tspan></text><text x="552.91" y="481" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="552.91" dy="0">Secretos o alarmas</tspan></text><rect x="10" y="495" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="519.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cada detector ve una forma y ciega ante otra: la entropía confunde 170 SHA de git, 153 UUID y 91 imágenes en base64 con</tspan></text><text x="470" y="536.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">secretos y aun así pierde las contraseñas de baja entropía. Un detector no sustituye a la rotación: lo que encuentra ya</tspan></text><text x="470" y="553.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">estaba expuesto. Los secretos y señuelos son cadenas inventadas.</tspan></text><text x="470" y="600.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
