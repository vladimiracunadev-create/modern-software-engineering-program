<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 353" width="960" height="353" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Los estados de una suscripción y lo que dispara cada cambio de uno a otro</title><desc id="d">Diagrama de dos filas: prueba, activa, con pago pendiente en la primera, y suspendida, cancelada y terminada en la segunda; una nota dice que cada flecha es un evento con su fecha y que el acceso se decide por el estado, no por la última factura.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="353" fill="#ffffff"/><rect x="10" y="14" width="202" height="96" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="111" y="49" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="111" dy="0">Prueba</tspan></text><text x="111" y="65.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="111" dy="0">Sin cobro hasta que</tspan></text><text x="111" y="82.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="111" dy="0">termina</tspan></text><rect x="256" y="14" width="202" height="96" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="357" y="49" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="357" dy="0">Activa</tspan></text><text x="357" y="65.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="357" dy="0">Pago al día, acceso</tspan></text><text x="357" y="82.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="357" dy="0">completo</tspan></text><polyline points="212,62 256,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="502" y="14" width="202" height="96" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="603" y="49" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="603" dy="0">Pago pendiente</tspan></text><text x="603" y="65.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="603" dy="0">Cobro fallido, se</tspan></text><text x="603" y="82.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="603" dy="0">reintenta</tspan></text><polyline points="458,62 502,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="748" y="14" width="202" height="96" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="849" y="49" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="849" dy="0">Suspendida</tspan></text><text x="849" y="65.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="849" dy="0">Se agotaron los</tspan></text><text x="849" y="82.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="849" dy="0">reintentos</tspan></text><polyline points="704,62 748,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="150" width="202" height="96" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="111" y="185" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="111" dy="0">Cancelación pedida</tspan></text><text x="111" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="111" dy="0">Sigue activa hasta fin</tspan></text><text x="111" y="218.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="111" dy="0">de ciclo</tspan></text><rect x="256" y="150" width="202" height="96" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="357" y="193.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="357" dy="0">Cancelada</tspan></text><text x="357" y="209.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="357" dy="0">Sin renovación</tspan></text><polyline points="212,198 256,198" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="502" y="150" width="202" height="96" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="603" y="185" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="603" dy="0">Datos retenidos</tspan></text><text x="603" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="603" dy="0">Plazo para reactivar o</tspan></text><text x="603" y="218.28" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="603" dy="0">exportar</tspan></text><polyline points="458,198 502,198" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="748" y="150" width="202" height="96" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="849" y="185" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="849" dy="0">Eliminada</tspan></text><text x="849" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="849" dy="0">Borrado según la</tspan></text><text x="849" y="218.28" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="849" dy="0">política</tspan></text><polyline points="704,198 748,198" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="849,110 849,130 111,130 111,150" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="260" width="940" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="284.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">El estado es una decisión de negocio guardada: la pantalla de facturación, el control de acceso y los informes leen el mismo</tspan></text><text x="480" y="301.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">estado. Si cada uno lo deduce por su cuenta de la última factura, tres lugares dirán tres cosas distintas.</tspan></text><text x="480" y="343.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Modelo con parámetros del autor y semilla fija 34; muestra un mecanismo, no mide un producto ni un proveedor reales.</tspan></text></svg>
