<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 578" width="940" height="578" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Verificar un token de identidad con más o menos comprobaciones: 12 tokens manipulados y 3 legítimos</title><desc id="d">Barras horizontales con los tokens que acepta cada nivel de verificación: solo la firma acepta 9 de 12 manipulados; añadir vigencia, 6; emisor y audiencia, 4; el sujeto con prefijo sigue aceptando 4, incluido un repositorio de otra organización; el sujeto exacto con vida corta no acepta ninguno y sigue aceptando los 3 legítimos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="578" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Verificar un token de identidad con más o menos comprobaciones: 12 tokens manipulados y 3 legítimos</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Manipulados aceptados (de 12)</tspan></text><rect x="282.66" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="302.66" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="302.66" dy="0">Legítimos aceptados (de 3)</tspan></text><line x1="294" y1="77" x2="294" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="397" x2="294" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">0</tspan></text><line x1="416.788" y1="77" x2="416.788" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="416.788" y1="397" x2="416.788" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="416.788" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="416.788" dy="0">2</tspan></text><line x1="539.576" y1="77" x2="539.576" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="539.576" y1="397" x2="539.576" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="539.576" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="539.576" dy="0">4</tspan></text><line x1="662.364" y1="77" x2="662.364" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="662.364" y1="397" x2="662.364" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="662.364" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662.364" dy="0">6</tspan></text><line x1="785.152" y1="77" x2="785.152" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="785.152" y1="397" x2="785.152" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="785.152" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="785.152" dy="0">8</tspan></text><line x1="907.94" y1="77" x2="907.94" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="907.94" y1="397" x2="907.94" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="907.94" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907.94" dy="0">10</tspan></text><line x1="294" y1="397" x2="907.94" y2="397" stroke="#5b7280" stroke-width="1.6"/><text x="284" y="113.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">solo firma</tspan></text><text x="284" y="177.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">firma + vigencia</tspan></text><text x="284" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">+ emisor y audiencia</tspan></text><text x="284" y="305.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">+ sujeto con prefijo «repo:org»</tspan></text><text x="284" y="369.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">+ sujeto exacto y vida corta</tspan></text><rect x="294" y="83" width="552.546" height="24.5" rx="3" fill="#c0432f"/><text x="853.546" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="853.546" dy="0">9</tspan></text><rect x="294" y="110.5" width="184.182" height="24.5" rx="3" fill="#087f8c"/><text x="485.182" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="485.182" dy="0">3</tspan></text><rect x="294" y="147" width="368.364" height="24.5" rx="3" fill="#c0432f"/><text x="669.364" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="669.364" dy="0">6</tspan></text><rect x="294" y="174.5" width="184.182" height="24.5" rx="3" fill="#087f8c"/><text x="485.182" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="485.182" dy="0">3</tspan></text><rect x="294" y="211" width="245.576" height="24.5" rx="3" fill="#c0432f"/><text x="546.576" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="546.576" dy="0">4</tspan></text><rect x="294" y="238.5" width="184.182" height="24.5" rx="3" fill="#087f8c"/><text x="485.182" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="485.182" dy="0">3</tspan></text><rect x="294" y="275" width="245.576" height="24.5" rx="3" fill="#c0432f"/><text x="546.576" y="291.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="546.576" dy="0">4</tspan></text><rect x="294" y="302.5" width="184.182" height="24.5" rx="3" fill="#087f8c"/><text x="485.182" y="319.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="485.182" dy="0">3</tspan></text><rect x="294" y="339" width="2" height="24.5" rx="3" fill="#c0432f"/><text x="303" y="355.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="303" dy="0">0</tspan></text><rect x="294" y="366.5" width="184.182" height="24.5" rx="3" fill="#087f8c"/><text x="485.182" y="383.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="485.182" dy="0">3</tspan></text><text x="600.97" y="441" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="600.97" dy="0">Tokens aceptados</tspan></text><rect x="10" y="455" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="479.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El prefijo «repo:org» deja pasar «repo:org-malicioso/…» y todos los repositorios de la organización: no basta con que el</tspan></text><text x="470" y="496.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">sujeto empiece bien. Solo el sujeto exacto (repositorio, rama o entorno) y una vida de 15 min dejan fuera a los 12. Los</tspan></text><text x="470" y="513.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">tokens y la clave son sintéticos y firmados con HMAC, no con la clave pública de un proveedor.</tspan></text><text x="470" y="560.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
