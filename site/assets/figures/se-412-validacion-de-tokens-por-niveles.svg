<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 461" width="970" height="461" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Verificar un token de identidad con más o menos comprobaciones: 12 tokens manipulados y 3 legítimos</title><desc id="d">Tabla: verificar solo la firma acepta 9 de 12 tokens manipulados; añadir vigencia, 6; añadir emisor y audiencia, 4; comprobar el sujeto con un prefijo sigue aceptando 4, incluido un repositorio de otra organización con nombre parecido; el sujeto exacto con vida corta no acepta ninguno y sigue aceptando los 3 legítimos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="461" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Comprobaciones</tspan></text><rect x="340" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="422" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="422" dy="0">Manipulados</tspan></text><text x="422" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="422" dy="0">aceptados</tspan></text><rect x="510" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="587" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="587" dy="0">Legítimos</tspan></text><text x="587" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="587" dy="0">aceptados</tspan></text><rect x="670" y="12" width="284" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="812" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="812" dy="0">Primeros que se cuelan</tspan></text><rect x="10" y="56" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="85.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">solo firma</tspan></text><rect x="340" y="56" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">9 de 12</tspan></text><rect x="510" y="56" width="154" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587" dy="0">3 de 3</tspan></text><rect x="670" y="56" width="284" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">expirado, sin exp, audiencia ajena…</tspan></text><rect x="10" y="114" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="143.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">firma + vigencia</tspan></text><rect x="340" y="114" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">6 de 12</tspan></text><rect x="510" y="114" width="154" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587" dy="0">3 de 3</tspan></text><rect x="670" y="114" width="284" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="135.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">audiencia ajena, emisor ajeno, otro</tspan></text><text x="812" y="151.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">repositorio…</tspan></text><rect x="10" y="172" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="201.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">+ emisor y audiencia</tspan></text><rect x="340" y="172" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">4 de 12</tspan></text><rect x="510" y="172" width="154" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587" dy="0">3 de 3</tspan></text><rect x="670" y="172" width="284" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="193.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">otro repositorio, prefijo parecido,</tspan></text><text x="812" y="209.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">rama de PR…</tspan></text><rect x="10" y="230" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="259.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">+ sujeto con prefijo «repo:org»</tspan></text><rect x="340" y="230" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">4 de 12</tspan></text><rect x="510" y="230" width="154" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587" dy="0">3 de 3</tspan></text><rect x="670" y="230" width="284" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="251.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">otro repositorio, prefijo parecido,</tspan></text><text x="812" y="267.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">rama de PR…</tspan></text><rect x="10" y="288" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="317.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">+ sujeto exacto y vida corta</tspan></text><rect x="340" y="288" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="317.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">0 de 12</tspan></text><rect x="510" y="288" width="154" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587" y="317.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587" dy="0">3 de 3</tspan></text><rect x="670" y="288" width="284" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="317.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">ninguno</tspan></text><rect x="10" y="350" width="950" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="485" y="374.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">El prefijo «repo:org» deja pasar «repo:org-malicioso/…» y todos los repositorios de la organización: no basta con que el sujeto</tspan></text><text x="485" y="391.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">empiece bien. Solo el sujeto exacto (repositorio, rama o entorno) y una vida de 15 min dejan fuera a los 12. Los tokens y la</tspan></text><text x="485" y="408.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">clave son sintéticos y firmados con HMAC, no con la clave pública de un proveedor.</tspan></text><text x="485" y="447.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
