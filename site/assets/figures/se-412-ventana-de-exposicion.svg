<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 307" width="1000" height="307" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Probabilidad de que una credencial filtrada siga siendo útil y horas de exposición media</title><desc id="d">Barras: un secreto estático con rotación anual o de 90 días es utilizable en el 99,9 y el 99,8 por ciento de las filtraciones con unas 330 y 310 horas de exposición; un token de una hora, en el 4,8 por ciento con 0,5 horas; uno de 15 minutos, en el 0,18 por ciento con 0,12 horas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="307" fill="#ffffff"/><text x="290" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">secreto estático (rotación anual)</tspan></text><rect x="300" y="16" width="519.705" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="827.705" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="827.705" dy="0">99,9 % · 329,4 h</tspan></text><text x="290" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">secreto estático rotado a 90 días</tspan></text><rect x="300" y="60" width="518.96" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="826.96" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="826.96" dy="0">99,8 % · 310,0 h</tspan></text><text x="290" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">token de 1 hora</tspan></text><rect x="300" y="104" width="24.7693" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="332.769" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="332.769" dy="0">4,8 % · 0,5 h</tspan></text><text x="290" y="167.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="290" dy="0">token de 15 minutos</tspan></text><rect x="300" y="148" width="4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="312" y="167.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="312" dy="0">0,2 % · 0,1 h</tspan></text><rect x="10" y="196" width="980" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="500" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">La exposición del secreto estático la fija el tiempo en detectar la fuga (14 días supuestos), no la rotación: rotar cada 90 días en</tspan></text><text x="500" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">vez de cada año apenas la cambia. Que el token dure 15 minutos limita el daño aunque se filtre. El atacante con mediana de 3 h</tspan></text><text x="500" y="254.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">(lognormal) y la detección a 14 días son supuestos del autor.</tspan></text><text x="500" y="293.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
