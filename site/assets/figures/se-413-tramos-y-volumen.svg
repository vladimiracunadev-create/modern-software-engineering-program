<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" width="940" height="560" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Importe a pagar según las unidades usadas: tramos graduales frente a precio por volumen</title><desc id="d">Línea con dos series: el cobro gradual crece sin saltos, 10 a 500 unidades, 20 a 1000, 80 a 5000, 170 a 10000 y 305 a 25000; el cobro por volumen baja de 150 con 10000 unidades a 100,01 con 10001, y vale 250 con 25000.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="560" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Importe a pagar según las unidades usadas: tramos graduales frente a precio por volumen</tspan></text><circle cx="22" cy="51" r="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Tramos graduales</tspan></text><rect x="184.64" y="45" width="12" height="12" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="204.64" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="204.64" dy="0">Precio por volumen</tspan></text><line x1="78.62" y1="377" x2="910" y2="377" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="377" x2="78.62" y2="377" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="381.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="304.5" x2="910" y2="304.5" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="304.5" x2="78.62" y2="304.5" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="309" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="232" x2="910" y2="232" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="232" x2="78.62" y2="232" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="236.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">200</tspan></text><line x1="78.62" y1="159.5" x2="910" y2="159.5" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="159.5" x2="78.62" y2="159.5" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="164" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">300</tspan></text><line x1="78.62" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="87" x2="78.62" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">400</tspan></text><line x1="78.62" y1="87" x2="78.62" y2="377" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="87" x2="96.62" y2="377" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="377" x2="96.62" y2="382" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="398" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">500</tspan></text><line x1="242.71" y1="87" x2="242.71" y2="377" stroke="#d5dde1" stroke-width="1"/><line x1="242.71" y1="377" x2="242.71" y2="382" stroke="#5b7280" stroke-width="1.4"/><text x="242.71" y="398" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="242.71" dy="0">5000</tspan></text><line x1="405.033" y1="87" x2="405.033" y2="377" stroke="#d5dde1" stroke-width="1"/><line x1="405.033" y1="377" x2="405.033" y2="382" stroke="#5b7280" stroke-width="1.4"/><text x="405.033" y="398" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="405.033" dy="0">10 000</tspan></text><line x1="892" y1="87" x2="892" y2="377" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="377" x2="892" y2="382" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="398" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">25 000</tspan></text><line x1="78.62" y1="377" x2="910" y2="377" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="232" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 232)">Importe (unidades de moneda)</text><text x="494.31" y="423" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Unidades usadas en el mes</tspan></text><polyline points="96.62,369.75 112.852,362.5 112.885,362.486 242.71,319 405.033,264.625 405.065,264.618 892,155.875" fill="none" stroke="#087f8c" stroke-width="2.4"/><circle cx="96.62" cy="369.75" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><circle cx="112.852" cy="362.5" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><circle cx="112.885" cy="362.486" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><circle cx="242.71" cy="319" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><circle cx="405.033" cy="264.625" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><circle cx="405.065" cy="264.618" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><circle cx="892" cy="155.875" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polyline points="96.62,369.75 112.852,362.5 112.885,366.118 242.71,322.625 405.033,268.25 405.065,304.493 892,195.75" fill="none" stroke="#c0432f" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="91.12" y="364.25" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><rect x="107.352" y="357" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><rect x="107.385" y="360.618" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><rect x="237.21" y="317.125" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><rect x="399.533" y="262.75" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><rect x="399.565" y="298.993" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><rect x="886.5" y="190.25" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><rect x="10" y="437" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="461.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Con volumen, un cliente que pasa de 10 000 a 10 001 unidades paga la mitad (de 150 a 100,01 con estos precios): un</tspan></text><text x="470" y="478.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">incentivo a mentir sobre el consumo o a partirlo. Con tramos graduales el importe nunca baja al usar más. Es una decisión</tspan></text><text x="470" y="495.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de producto y se prueba con casos en los bordes.</tspan></text><text x="470" y="542.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 34; muestra un mecanismo, no mide un producto ni un proveedor reales.</tspan></text></svg>
