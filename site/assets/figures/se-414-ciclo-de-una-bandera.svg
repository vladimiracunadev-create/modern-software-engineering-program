<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 360" width="940" height="360" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres tipos de bandera: cuáles tienen fecha de retiro y cuáles se quedan como parte del producto</title><desc id="d">Diagrama de Gantt con tres carriles en semanas: la bandera de lanzamiento pasa por equipo, 1 por ciento, 10 por ciento y 100 por ciento y se retira en la semana 5 a 6; la bandera de permiso y el interruptor de emergencia duran todo el periodo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="360" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Tres tipos de bandera: cuáles tienen fecha de retiro y cuáles se quedan como parte del producto</tspan></text><line x1="234" y1="51" x2="234" y2="195" stroke="#d5dde1" stroke-width="1"/><line x1="234" y1="195" x2="234" y2="200" stroke="#5b7280" stroke-width="1.4"/><text x="234" y="216" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="234" dy="0">0</tspan></text><line x1="347" y1="51" x2="347" y2="195" stroke="#d5dde1" stroke-width="1"/><line x1="347" y1="195" x2="347" y2="200" stroke="#5b7280" stroke-width="1.4"/><text x="347" y="216" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="347" dy="0">1</tspan></text><line x1="460" y1="51" x2="460" y2="195" stroke="#d5dde1" stroke-width="1"/><line x1="460" y1="195" x2="460" y2="200" stroke="#5b7280" stroke-width="1.4"/><text x="460" y="216" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="460" dy="0">2</tspan></text><line x1="573" y1="51" x2="573" y2="195" stroke="#d5dde1" stroke-width="1"/><line x1="573" y1="195" x2="573" y2="200" stroke="#5b7280" stroke-width="1.4"/><text x="573" y="216" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="573" dy="0">3</tspan></text><line x1="686" y1="51" x2="686" y2="195" stroke="#d5dde1" stroke-width="1"/><line x1="686" y1="195" x2="686" y2="200" stroke="#5b7280" stroke-width="1.4"/><text x="686" y="216" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="686" dy="0">4</tspan></text><line x1="799" y1="51" x2="799" y2="195" stroke="#d5dde1" stroke-width="1"/><line x1="799" y1="195" x2="799" y2="200" stroke="#5b7280" stroke-width="1.4"/><text x="799" y="216" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="799" dy="0">5</tspan></text><line x1="912" y1="51" x2="912" y2="195" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="195" x2="912" y2="200" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="216" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">6</tspan></text><line x1="234" y1="195" x2="912" y2="195" stroke="#5b7280" stroke-width="1.6"/><text x="224" y="79.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="224" dy="0">Bandera de lanzamiento</tspan></text><text x="224" y="127.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="224" dy="0">Bandera de permiso</tspan></text><text x="224" y="175.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="224" dy="0">Interruptor de emergencia</tspan></text><rect x="234" y="60" width="113" height="30" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="290.5" y="79.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="290.5" dy="0">Equipo</tspan></text><rect x="347" y="60" width="113" height="30" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="403.5" y="79.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="403.5" dy="0">1 %</tspan></text><rect x="460" y="60" width="113" height="30" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="516.5" y="79.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="516.5" dy="0">10 %</tspan></text><rect x="573" y="60" width="226" height="30" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="686" y="79.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="686" dy="0">100 %</tspan></text><rect x="799" y="60" width="113" height="30" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="855.5" y="79.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="855.5" dy="0">Retirar</tspan></text><line x1="14" y1="99" x2="912" y2="99" stroke="#d5dde1" stroke-width="1"/><rect x="234" y="108" width="678" height="30" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="573" y="127.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="573" dy="0">Permanente: depende del plan</tspan></text><line x1="14" y1="147" x2="912" y2="147" stroke="#d5dde1" stroke-width="1"/><rect x="234" y="156" width="678" height="30" rx="4" fill="#6b7c86" stroke="#ffffff" stroke-width="1"/><text x="573" y="175.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="573" dy="0">Permanente: apagado por defecto</tspan></text><text x="573" y="239" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="573" dy="0">Semanas desde la creación (valores del autor)</tspan></text><rect x="10" y="253" width="920" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="277.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Solo la bandera de lanzamiento debe morir: una que sigue en el código meses después del 100 % es una rama de ejecución más</tspan></text><text x="470" y="294.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">que nadie prueba. Las otras dos son decisiones de producto y de operación que se documentan con su responsable.</tspan></text><text x="470" y="342.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 34; muestra un mecanismo, no mide un producto ni un proveedor reales.</tspan></text></svg>
