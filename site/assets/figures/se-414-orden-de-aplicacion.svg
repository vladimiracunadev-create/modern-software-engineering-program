<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 382" width="940" height="382" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un planificador de infraestructura mínimo: 300 grafos aleatorios de 12 recursos</title><desc id="d">Barras horizontales con el porcentaje de casos de cada comprobación: aplicar las acciones en orden aleatorio falla en el 79 por ciento de los planes y en orden topológico en ninguno; repetir la aplicación deja un plan vacío en los 300 casos y los 100 ciclos inyectados se detectan.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="382" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un planificador de infraestructura mínimo: 300 grafos aleatorios de 12 recursos</tspan></text><line x1="294" y1="49" x2="294" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="201" x2="294" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">0</tspan></text><line x1="413.564" y1="49" x2="413.564" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="413.564" y1="201" x2="413.564" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="413.564" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="413.564" dy="0">20</tspan></text><line x1="533.128" y1="49" x2="533.128" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="533.128" y1="201" x2="533.128" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="533.128" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="533.128" dy="0">40</tspan></text><line x1="652.692" y1="49" x2="652.692" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="652.692" y1="201" x2="652.692" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="652.692" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="652.692" dy="0">60</tspan></text><line x1="772.256" y1="49" x2="772.256" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="772.256" y1="201" x2="772.256" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="772.256" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772.256" dy="0">80</tspan></text><line x1="891.82" y1="49" x2="891.82" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="891.82" y1="201" x2="891.82" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="891.82" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="891.82" dy="0">100</tspan></text><line x1="294" y1="201" x2="891.82" y2="201" stroke="#5b7280" stroke-width="1.6"/><text x="284" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Orden aleatorio: planes que fallan</tspan></text><text x="284" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Orden topológico: planes que fallan</tspan></text><text x="284" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Repetir la aplicación: plan vacío</tspan></text><text x="284" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Ciclos inyectados que se detectan</tspan></text><rect x="294" y="55" width="470.285" height="26" rx="3" fill="#102a43"/><text x="771.285" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="771.285" dy="0">79</tspan></text><rect x="294" y="93" width="2" height="26" rx="3" fill="#102a43"/><text x="303" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="303" dy="0">0</tspan></text><rect x="294" y="131" width="597.82" height="26" rx="3" fill="#102a43"/><text x="898.82" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="898.82" dy="0">100</tspan></text><rect x="294" y="169" width="597.82" height="26" rx="3" fill="#102a43"/><text x="898.82" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="898.82" dy="0">100</tspan></text><text x="592.91" y="245" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="592.91" dy="0">Casos (%)</tspan></text><rect x="10" y="259" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="283.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cada plan tiene 7,76 acciones de las cuales 1,30 son destructivas (borrar o reemplazar) y 0,47 tocan recursos con estado,</tspan></text><text x="470" y="300.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">que solo se detectan si la política las examina. El orden no es un detalle: el 79 % de los planes se rompe si las acciones</tspan></text><text x="470" y="317.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">no respetan las dependencias. Los grafos y los porcentajes de recursos con estado (25 %) son supuestos del autor.</tspan></text><text x="470" y="364.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
