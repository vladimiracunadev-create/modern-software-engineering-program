<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 551" width="940" height="551" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ingreso mensual con un único precio: sube mientras entran compradores y baja cuando se pierden más de los que el precio compensa</title><desc id="d">Línea del ingreso mensual de 1000 clientes simulados contra el precio único: 9810 con precio 10, 24810 con 30, 32700 con 50, 38610 con 110 en el máximo, 37950 con 150, 28750 con 230 y 23400 con 300.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="551" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Ingreso mensual con un único precio: sube mientras entran compradores y baja cuando se pierden más de los</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">que el precio compensa</tspan></text><line x1="101.24" y1="368" x2="910" y2="368" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="368" x2="101.24" y2="368" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="372.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">0</tspan></text><line x1="101.24" y1="295.5" x2="910" y2="295.5" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="295.5" x2="101.24" y2="295.5" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="300" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">10 000</tspan></text><line x1="101.24" y1="223" x2="910" y2="223" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="223" x2="101.24" y2="223" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="227.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">20 000</tspan></text><line x1="101.24" y1="150.5" x2="910" y2="150.5" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="150.5" x2="101.24" y2="150.5" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="155" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">30 000</tspan></text><line x1="101.24" y1="78" x2="910" y2="78" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="78" x2="101.24" y2="78" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="82.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">40 000</tspan></text><line x1="101.24" y1="78" x2="101.24" y2="368" stroke="#5b7280" stroke-width="1.6"/><line x1="119.24" y1="78" x2="119.24" y2="368" stroke="#d5dde1" stroke-width="1"/><line x1="119.24" y1="368" x2="119.24" y2="373" stroke="#5b7280" stroke-width="1.4"/><text x="119.24" y="389" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="119.24" dy="0">10</tspan></text><line x1="225.828" y1="78" x2="225.828" y2="368" stroke="#d5dde1" stroke-width="1"/><line x1="225.828" y1="368" x2="225.828" y2="373" stroke="#5b7280" stroke-width="1.4"/><text x="225.828" y="389" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="225.828" dy="0">50</tspan></text><line x1="385.709" y1="78" x2="385.709" y2="368" stroke="#d5dde1" stroke-width="1"/><line x1="385.709" y1="368" x2="385.709" y2="373" stroke="#5b7280" stroke-width="1.4"/><text x="385.709" y="389" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="385.709" dy="0">110</tspan></text><line x1="492.297" y1="78" x2="492.297" y2="368" stroke="#d5dde1" stroke-width="1"/><line x1="492.297" y1="368" x2="492.297" y2="373" stroke="#5b7280" stroke-width="1.4"/><text x="492.297" y="389" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492.297" dy="0">150</tspan></text><line x1="705.472" y1="78" x2="705.472" y2="368" stroke="#d5dde1" stroke-width="1"/><line x1="705.472" y1="368" x2="705.472" y2="373" stroke="#5b7280" stroke-width="1.4"/><text x="705.472" y="389" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705.472" dy="0">230</tspan></text><line x1="892" y1="78" x2="892" y2="368" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="368" x2="892" y2="373" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="389" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">300</tspan></text><line x1="101.24" y1="368" x2="910" y2="368" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="223" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 223)">Ingreso mensual (unidades inventadas)</text><text x="505.62" y="414" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="505.62" dy="0">Precio único mensual</tspan></text><polyline points="119.24,296.877 172.534,188.127 225.828,130.925 279.121,105.623 332.415,92.645 385.709,88.0775 439.003,90.905 492.297,92.8625 598.884,124.183 705.472,159.562 812.059,176.165 892,198.35" fill="none" stroke="#102a43" stroke-width="2.4"/><circle cx="119.24" cy="296.877" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><circle cx="172.534" cy="188.127" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><circle cx="225.828" cy="130.925" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><circle cx="279.121" cy="105.623" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><circle cx="332.415" cy="92.645" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><circle cx="385.709" cy="88.0775" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><circle cx="439.003" cy="90.905" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><circle cx="492.297" cy="92.8625" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><circle cx="598.884" cy="124.183" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><circle cx="705.472" cy="159.562" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><circle cx="812.059" cy="176.165" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><circle cx="892" cy="198.35" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="345.709" y="58.0775" font-size="13" text-anchor="end" font-weight="400" fill="#5c1f14" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="345.709" dy="0">Máximo: 38 610 con precio</tspan></text><text x="345.709" y="75.0775" font-size="13" text-anchor="end" font-weight="400" fill="#5c1f14" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="345.709" dy="0">110</tspan></text><line x1="383.149" y1="85.2775" x2="353.709" y2="53.0775" stroke="#5c1f14" stroke-width="1.2"/><rect x="10" y="428" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="452.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">La curva es plana cerca del máximo: entre 90 y 150 el ingreso varía menos de 3 %. Eso importa porque el precio exacto es</tspan></text><text x="470" y="469.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">menos decisivo que la forma del plan; subir de 150 a 230 cuesta 24 % de ingreso. Es una simulación del autor, no una</tspan></text><text x="470" y="486.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">elasticidad medida.</tspan></text><text x="470" y="533.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 34; muestra un mecanismo, no mide un producto, un mercado ni un proveedor reales.</tspan></text></svg>
