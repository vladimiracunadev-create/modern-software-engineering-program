<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 567" width="940" height="567" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Intervalo de reconciliación: cuánto vive una deriva manual y cuántas lecturas cuesta (200 aplicaciones)</title><desc id="d">Barras agrupadas en escala logarítmica con la espera media y el percentil 95 hasta corregir una deriva manual: reconciliar cada 30 segundos da 15 y 28 segundos, cada 3 minutos 91 y 171, cada 15 minutos 453 y 857 y cada hora 1 803 y 3 417.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="567" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Intervalo de reconciliación: cuánto vive una deriva manual y cuántas lecturas cuesta (200 aplicaciones)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Deriva: espera media</tspan></text><rect x="214.8" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="234.8" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="234.8" dy="0">Percentil 95</tspan></text><line x1="101.24" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="375" x2="101.24" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">10</tspan></text><line x1="101.24" y1="281.667" x2="920" y2="281.667" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="281.667" x2="101.24" y2="281.667" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="286.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">100</tspan></text><line x1="101.24" y1="188.333" x2="920" y2="188.333" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="188.333" x2="101.24" y2="188.333" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="192.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">1 000</tspan></text><line x1="101.24" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="95" x2="101.24" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">10 000</tspan></text><line x1="101.24" y1="95" x2="101.24" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">Segundos hasta corregir (escala logarítmica)</text><rect x="121.709" y="358.612" width="79.876" height="16.3876" rx="3" fill="#087f8c"/><text x="161.647" y="352.612" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="161.647" dy="0">15</tspan></text><rect x="205.585" y="332.559" width="79.876" height="42.4408" rx="3" fill="#c0432f"/><text x="245.523" y="326.559" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="245.523" dy="0">28</tspan></text><text x="203.585" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="203.585" dy="0">cada 30 s</tspan></text><rect x="326.399" y="285.678" width="79.876" height="89.3222" rx="3" fill="#087f8c"/><text x="366.337" y="279.678" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="366.337" dy="0">91</tspan></text><rect x="410.275" y="260" width="79.876" height="115" rx="3" fill="#c0432f"/><text x="450.213" y="254" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="450.213" dy="0">171</tspan></text><text x="408.275" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="408.275" dy="0">cada 3 min</tspan></text><rect x="531.089" y="220.396" width="79.876" height="154.604" rx="3" fill="#087f8c"/><text x="571.027" y="214.396" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="571.027" dy="0">453</tspan></text><rect x="614.965" y="194.602" width="79.876" height="180.398" rx="3" fill="#c0432f"/><text x="654.903" y="188.602" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="654.903" dy="0">857</tspan></text><text x="612.965" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612.965" dy="0">cada 15 min</tspan></text><rect x="735.779" y="164.447" width="79.876" height="210.553" rx="3" fill="#087f8c"/><text x="775.717" y="158.447" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="775.717" dy="0">1 803</tspan></text><rect x="819.655" y="138.53" width="79.876" height="236.47" rx="3" fill="#c0432f"/><text x="859.593" y="132.53" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="859.593" dy="0">3 417</tspan></text><text x="817.655" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817.655" dy="0">cada hora</tspan></text><rect x="10" y="427" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lecturas por día: cada 30 s: 1 152 000; cada 3 min: 192 000; cada 15 min: 38 400; cada hora: 9 600. Bajar el intervalo de</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">una hora a 30 segundos acorta la deriva en 120 veces y multiplica las lecturas por 120. Un aviso del repositorio (unos 2 s)</tspan></text><text x="470" y="485.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">resuelve los cambios en Git, no las derivas del clúster, que solo se ven al comparar. Las dos lecturas por ciclo y el</tspan></text><text x="470" y="501.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">reparto uniforme de las derivas son supuestos.</tspan></text><text x="470" y="549.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
