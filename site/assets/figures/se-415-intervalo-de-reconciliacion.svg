 rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">171 s</tspan></text><rect x="560" y="106" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">192 000</tspan></text><rect x="740" y="106" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">90 s</tspan></text><rect x="10" y="156" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="97" y="181.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="97" dy="0">cada 15 min</tspan></text><rect x="190" y="156" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="292" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="292" dy="0">453 s</tspan></text><rect x="400" y="156" width="154" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">857 s</tspan></text><rect x="560" y="156" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">38 400</tspan></text><rect x="740" y="156" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">450 s</tspan></text><rect x="10" y="206" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="97" y="231.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="97" dy="0">cada hora</tspan></text><rect x="190" y="206" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="292" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="292" dy="0">1 803 s</tspan></text><rect x="400" y="206" width="154" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">3 417 s</tspan></text><rect x="560" y="206" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">9 600</tspan></text><rect x="740" y="206" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">1 800 s</tspan></text><rect x="10" y="260" width="940" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="284.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Bajar el intervalo de una hora a 30 segundos acorta la deriva en 120 veces y multiplica las lecturas por 120. Un aviso del</tspan></text><text x="480" y="301.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">repositorio (unos 2 s) resuelve los cambios en Git, no las derivas del clúster, que solo se ven al comparar. Las dos lecturas</tspan></text><text x="480" y="318.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">por ciclo y el reparto uniforme de las derivas son supuestos.</tspan></text><text x="480" y="357.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
