<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 371" width="960" height="371" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Intervalo de reconciliación: cuánto vive una deriva manual y cuántas lecturas cuesta (200 aplicaciones)</title><desc id="d">Tabla: reconciliar cada 30 segundos corrige una deriva manual en 15 segundos de media y 28 en el percentil 95 con 1 152 000 lecturas al día; cada 3 minutos, 91 y 171 segundos con 192 000 lecturas; cada 15 minutos, 453 y 857 con 38 400; cada hora, 1 803 y 3 417 con 9 600.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="371" fill="#ffffff"/><rect x="10" y="12" width="174" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="97" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="97" dy="0">Intervalo</tspan></text><rect x="190" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="292" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="292" dy="0">Deriva: espera media</tspan></text><rect x="400" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="477" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="477" dy="0">Percentil 95</tspan></text><rect x="560" y="12" width="174" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="647" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="647" dy="0">Lecturas por día</tsp