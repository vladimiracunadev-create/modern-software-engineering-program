<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 512" width="940" height="512" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ingreso mensual de 1000 clientes simulados con tres diseños de precio, cada uno con sus mejores parámetros</title><desc id="d">Barras con el ingreso mensual en unidades inventadas: un precio único de 110 reúne 38610 con 351 compradores, tres planes con límites reúnen 53040 con 567 y un precio por puesto reúne 58938 con 744.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="512" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Ingreso mensual de 1000 clientes simulados con tres diseños de precio, cada uno con sus mejores parámetros</tspan></text><line x1="101.24" y1="337" x2="920" y2="337" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="337" x2="101.24" y2="337" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="341.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">0</tspan></text><line x1="101.24" y1="247" x2="920" y2="247" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="247" x2="101.24" y2="247" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="251.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">20 000</tspan></text><line x1="101.24" y1="157" x2="920" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="157" x2="101.24" y2="157" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="161.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">40 000</tspan></text><line x1="101.24" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="67" x2="101.24" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">60 000</tspan></text><line x1="101.24" y1="67" x2="101.24" y2="337" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 202)">Ingreso mensual (unidades inventadas)</text><rect x="128.532" y="163.255" width="218.336" height="173.745" rx="3" fill="#087f8c"/><text x="237.7" y="157.255" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="237.7" dy="0">38 610</tspan></text><text x="237.7" y="358" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="237.7" dy="0">Un precio único</tspan></text><rect x="401.452" y="98.32" width="218.336" height="238.68" rx="3" fill="#087f8c"/><text x="510.62" y="92.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="510.62" dy="0">53 040</tspan></text><text x="510.62" y="358" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="510.62" dy="0">Tres planes con límites</tspan></text><rect x="674.372" y="71.779" width="218.336" height="265.221" rx="3" fill="#087f8c"/><text x="783.54" y="65.779" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="783.54" dy="0">58 938</tspan></text><text x="783.54" y="358" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="783.54" dy="0">Precio por puesto</tspan></text><rect x="10" y="389" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="413.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Compran 351, 567 y 744 clientes de 1000: el diseño que escala con el tamaño llega a más clientes y a más ingreso, pero</tspan></text><text x="470" y="430.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">también hace la factura menos predecible para ellos. Población y disposición a pagar son del autor; en un mercado real se</tspan></text><text x="470" y="447.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">estiman con entrevistas y pruebas, no con una semilla.</tspan></text><text x="470" y="494.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 34; muestra un mecanismo, no mide un producto, un mercado ni un proveedor reales.</tspan></text></svg>
