<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 378" width="940" height="378" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">A quién llega cada centavo de una venta: vendedor, plataforma y procesador de pagos según el precio</title><desc id="d">Barras apiladas al 100 por ciento para ventas de 5, 20 y 100 unidades de moneda con 10 por ciento de comisión de la plataforma y 2,9 por ciento más 0,30 al procesador: en la de 5 el vendedor recibe 81 por ciento, en la de 20 86 y en la de 100 87.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="378" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">A quién llega cada centavo de una venta: vendedor, plataforma y procesador de pagos según el precio</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Vendedor</tspan></text><rect x="124.32" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="144.32" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="144.32" dy="0">Plataforma</tspan></text><rect x="247.72" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="267.72" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="267.72" dy="0">Procesador</tspan></text><line x1="174" y1="77" x2="174" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="174" y1="197" x2="174" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="174" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="174" dy="0">0</tspan></text><line x1="349.425" y1="77" x2="349.425" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="349.425" y1="197" x2="349.425" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="349.425" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="349.425" dy="0">25</tspan></text><line x1="524.85" y1="77" x2="524.85" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="524.85" y1="197" x2="524.85" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="524.85" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="524.85" dy="0">50</tspan></text><line x1="700.275" y1="77" x2="700.275" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="700.275" y1="197" x2="700.275" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="700.275" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700.275" dy="0">75</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="197" x2="875.7" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">100</tspan></text><line x1="174" y1="197" x2="875.7" y2="197" stroke="#5b7280" stroke-width="1.6"/><text x="164" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="164" dy="0">Venta de 5,00</tspan></text><text x="164" y="141.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="164" dy="0">Venta de 20,00</tspan></text><text x="164" y="181.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="164" dy="0">Venta de 100,00</tspan></text><rect x="174" y="84" width="569.78" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="458.89" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="458.89" dy="0">81 %</tspan></text><rect x="743.78" y="84" width="70.17" height="26" fill="#102a43" stroke="#ffffff" stroke-width="1.5"/><text x="778.865" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="778.865" dy="0">10 %</tspan></text><rect x="813.95" y="84" width="61.7496" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="844.825" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="844.825" dy="0">9 %</tspan></text><text x="882.7" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100 %</tspan></text><rect x="174" y="124" width="600.655" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="474.328" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="474.328" dy="0">86 %</tspan></text><rect x="774.655" y="124" width="70.17" height="26" fill="#102a43" stroke="#ffffff" stroke-width="1.5"/><text x="809.74" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="809.74" dy="0">10 %</tspan></text><rect x="844.825" y="124" width="30.8748" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="141.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100 %</tspan></text><rect x="174" y="164" width="609.076" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="478.538" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="478.538" dy="0">87 %</tspan></text><rect x="783.076" y="164" width="70.17" height="26" fill="#102a43" stroke="#ffffff" stroke-width="1.5"/><text x="818.161" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="818.161" dy="0">10 %</tspan></text><rect x="853.246" y="164" width="22.4544" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="181.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100 %</tspan></text><text x="524.85" y="241" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="524.85" dy="0">% del total</tspan></text><rect x="10" y="255" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="279.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El costo fijo del procesador pesa más en ventas pequeñas: en la de 5,00 se queda con 8,8 % frente a 3,2 % en la de 100,00.</tspan></text><text x="470" y="296.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Si la plataforma promete «10 % de comisión», el vendedor de ventas chicas recibe menos de lo que espera y se va.</tspan></text><text x="470" y="313.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Porcentajes del autor.</tspan></text><text x="470" y="360.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 34; muestra un mecanismo, no mide un producto, un mercado ni un proveedor reales.</tspan></text></svg>
