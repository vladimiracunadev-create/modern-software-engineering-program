<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 518" width="940" height="518" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Enmascarar datos para una prueba: uniones que sobreviven y distribución de las notas (3 000 estudiantes, 15 000 entregas)</title><desc id="d">Barras con el porcentaje de uniones entre estudiantes y entregas que sobreviven a cada enmascarado: el identificador sin enmascarar conserva el 100 por ciento, el aleatorio por tabla el 0 y el determinista con HMAC y sal el 100.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="518" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Enmascarar datos para una prueba: uniones que sobreviven y distribución de las notas (3 000 estudiantes, 15</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">000 entregas)</tspan></text><line x1="78.62" y1="326" x2="920" y2="326" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="326" x2="78.62" y2="326" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="330.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="278" x2="920" y2="278" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="278" x2="78.62" y2="278" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="282.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">20</tspan></text><line x1="78.62" y1="230" x2="920" y2="230" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="230" x2="78.62" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="234.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">40</tspan></text><line x1="78.62" y1="182" x2="920" y2="182" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="182" x2="78.62" y2="182" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">60</tspan></text><line x1="78.62" y1="134" x2="920" y2="134" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="134" x2="78.62" y2="134" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="138.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">80</tspan></text><line x1="78.62" y1="86" x2="920" y2="86" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="86" x2="78.62" y2="86" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="90.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="86" x2="78.62" y2="326" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="206" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 206)">Uniones que sobreviven (%)</text><rect x="106.666" y="86" width="224.368" height="240" rx="3" fill="#087f8c"/><text x="218.85" y="80" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="218.85" dy="0">100</tspan></text><text x="218.85" y="347" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="218.85" dy="0">Identificador sin enmascarar</tspan></text><rect x="387.126" y="324" width="224.368" height="2" rx="3" fill="#087f8c"/><text x="499.31" y="318" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="499.31" dy="0">0</tspan></text><text x="499.31" y="347" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="499.31" dy="0">Aleatorio por tabla</tspan></text><rect x="667.586" y="86" width="224.368" height="240" rx="3" fill="#087f8c"/><text x="779.77" y="80" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="779.77" dy="0">100</tspan></text><text x="779.77" y="347" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="779.77" dy="0">Determinista con HMAC y sal</tspan></text><rect x="10" y="378" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="402.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Notas con ruido gaussiano (σ = 1): media 5,20, σ 1,52, r 0,74; la desviación crece de 1,11 a 1,52. Notas permutadas: media</tspan></text><text x="470" y="419.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">5,21, σ 1,11, r -0,006; conservan la distribución y borran la relación. Cada técnica protege algo y rompe otra cosa: el</tspan></text><text x="470" y="436.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">aleatorio protege la identidad y anula la prueba de integridad; el determinista conserva las uniones y permite vincular</tspan></text><text x="470" y="452.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">registros si se filtra la sal.</tspan></text><text x="470" y="500.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
