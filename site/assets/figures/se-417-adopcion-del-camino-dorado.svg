<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 333" width="950" height="333" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Equipos que adoptan el camino dorado según su cobertura y el esfuerzo de empezar (400 equipos por celda)</title><desc id="d">Tabla: si el camino cubre 3 de 6 capacidades lo adopta el 31 por ciento con 4 horas de puesta en marcha, 16 con 20 y 2 con 60; si cubre 4, el 55, 33 y 5; si cubre las 6, el 100, 92 y 20 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="333" fill="#ffffff"/><rect x="10" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="157" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="157" dy="0">Cobertura del camino</tspan></text><rect x="310" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="412" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="412" dy="0">4 h para empezar</tspan></text><rect x="520" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="622" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="622" dy="0">20 h para empezar</tspan></text><rect x="730" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="832" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="832" dy="0">60 h para empezar</tspan></text><rect x="10" y="56" width="294" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="83.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">El camino cubre 3 de 6 capacidades</tspan></text><rect x="310" y="56" width="204" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="412" y="83.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412" dy="0">31 % (95 % parcial)</tspan></text><rect x="520" y="56" width="204" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="83.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">16 % (95 % parcial)</tspan></text><rect x="730" y="56" width="204" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="83.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">2 % (62 % parcial)</tspan></text><rect x="10" y="110" width="294" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="137.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">El camino cubre 4 de 6 capacidades</tspan></text><rect x="310" y="110" width="204" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="412" y="137.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412" dy="0">55 % (84 % parcial)</tspan></text><rect x="520" y="110" width="204" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="137.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">33 % (71 % parcial)</tspan></text><rect x="730" y="110" width="204" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="137.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">5 % (74 % parcial)</tspan></text><rect x="10" y="164" width="294" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="191.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">El camino cubre 6 de 6 capacidades</tspan></text><rect x="310" y="164" width="204" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="412" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412" dy="0">100 % (0 % parcial)</tspan></text><rect x="520" y="164" width="204" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">92 % (0 % parcial)</tspan></text><rect x="730" y="164" width="204" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">20 % (0 % parcial)</tspan></text><rect x="10" y="222" width="930" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="475" y="246.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">Un camino fácil de empezar pero incompleto lo adopta la mitad de los equipos y casi todos acaban improvisando lo que falta.</tspan></text><text x="475" y="263.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">Uno completo pero costoso de usar (60 h) casi nadie lo toma. La adopción no mide calidad: mide que el camino compite bien</tspan></text><text x="475" y="280.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">contra el costo de construirlo por cuenta propia (mediana de 40 h, supuesto del autor).</tspan></text><text x="475" y="319.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
