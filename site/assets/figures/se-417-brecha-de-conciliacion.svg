<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 399" width="940" height="399" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro diferencias entre el libro y la liquidación del procesador, en centavos, con la causa de cada una</title><desc id="d">Barras horizontales con el valor absoluto de cuatro diferencias sembradas en 500 cobros: un cobro que está en el libro y no en la liquidación 1815 centavos, un monto distinto 500, un cobro en la liquidación que el libro no conoce 4728 y un asiento duplicado en el libro 4728 que solo se descubre por el total; la brecha neta es 2315 y la suma de las cuatro coincide con ella.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="399" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuatro diferencias entre el libro y la liquidación del procesador, en centavos, con la causa de cada una</tspan></text><line x1="314" y1="49" x2="314" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="314" y1="201" x2="314" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="314" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="314" dy="0">0</tspan></text><line x1="426.34" y1="49" x2="426.34" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="426.34" y1="201" x2="426.34" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="426.34" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="426.34" dy="0">1 000</tspan></text><line x1="538.68" y1="49" x2="538.68" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="538.68" y1="201" x2="538.68" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="538.68" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="538.68" dy="0">2 000</tspan></text><line x1="651.02" y1="49" x2="651.02" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="651.02" y1="201" x2="651.02" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="651.02" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="651.02" dy="0">3 000</tspan></text><line x1="763.36" y1="49" x2="763.36" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="763.36" y1="201" x2="763.36" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="763.36" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="763.36" dy="0">4 000</tspan></text><line x1="875.7" y1="49" x2="875.7" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="201" x2="875.7" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">5 000</tspan></text><line x1="314" y1="201" x2="875.7" y2="201" stroke="#5b7280" stroke-width="1.6"/><text x="304" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">En el libro y no en la liquidación</tspan></text><text x="304" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Monto distinto (disputa parcial)</tspan></text><text x="304" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">En la liquidación y no en el libro</tspan></text><text x="304" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Asiento duplicado en el libro</tspan></text><rect x="314" y="55" width="203.897" height="26" rx="3" fill="#087f8c"/><text x="524.897" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="524.897" dy="0">1 815</tspan></text><rect x="314" y="93" width="56.17" height="26" rx="3" fill="#087f8c"/><text x="377.17" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="377.17" dy="0">500</tspan></text><rect x="314" y="131" width="531.144" height="26" rx="3" fill="#087f8c"/><text x="852.144" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="852.144" dy="0">4 728</tspan></text><rect x="314" y="169" width="531.144" height="26" rx="3" fill="#087f8c"/><text x="852.144" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="852.144" dy="0">4 728</tspan></text><text x="594.85" y="245" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="594.85" dy="0">Centavos (valor absoluto)</tspan></text><rect x="10" y="259" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="283.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El libro y la liquidación difieren en 2 315 centavos, pero las cuatro causas suman más y se compensan (1815 + 500 − 4728 +</tspan></text><text x="470" y="300.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">4728 = 2315). El cotejo cobro por cobro encuentra tres; la cuarta aparece porque, explicadas esas tres, sobran 4 728 en el</tspan></text><text x="470" y="317.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">total, justo el monto de un asiento repetido. Una restricción de unicidad sobre la referencia del procesador en el libro la</tspan></text><text x="470" y="333.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">habría impedido.</tspan></text><text x="470" y="381.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9 y sqlite3; los recuentos se repiten con la semilla 34 y los tiempos varían entre ejecuciones y equipos.</tspan></text></svg>
