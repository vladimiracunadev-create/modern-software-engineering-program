<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 458" width="910" height="458" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un catálogo de 150 servicios: entradas que pasan según el rigor de la validación</title><desc id="d">Tabla: comprobar solo que los campos existan aprueba 130 de 150 entradas; exigir que el dueño exista en el registro de equipos, 122; que el enlace no sea de relleno, 108; que la revisión sea de los últimos 180 días, 43; hay 107 entradas con algún problema sembrado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="910" height="458" fill="#ffffff"/><rect x="10" y="12" width="514" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="267" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="267" dy="0">Validación acumulada</tspan></text><rect x="530" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="627" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="627" dy="0">Entradas que pasan</tspan></text><rect x="730" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="812" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="812" dy="0">Fracción</tspan></text><rect x="10" y="56" width="514" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="83.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="267" dy="0">campos presentes</tspan></text><rect x="530" y="56" width="194" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="627" y="83.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="627" dy="0">130</tspan></text><rect x="730" y="56" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="83.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">87 %</tspan></text><rect x="10" y="110" width="514" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="137.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="267" dy="0">+ dueño existe en el registro de equipos</tspan></text><rect x="530" y="110" width="194" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="627" y="137.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="627" dy="0">122</tspan></text><rect x="730" y="110" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="137.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">81 %</tspan></text><rect x="10" y="164" width="514" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="191.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="267" dy="0">+ enlace con forma de URL (no relleno)</tspan></text><rect x="530" y="164" width="194" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="627" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="627" dy="0">108</tspan></text><rect x="730" y="164" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">72 %</tspan></text><rect x="10" y="218" width="514" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="245.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="267" dy="0">+ revisado en los últimos 180 días</tspan></text><rect x="530" y="218" width="194" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="627" y="245.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="627" dy="0">43</tspan></text><rect x="730" y="218" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="245.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">29 %</tspan></text><rect x="10" y="272" width="514" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="267" y="299.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="267" dy="0">Entradas con algún problema sembrado (dueño, enlace o revisión)</tspan></text><rect x="530" y="272" width="194" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="627" y="299.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="627" dy="0">107</tspan></text><rect x="730" y="272" width="164" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="299.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">71 %</tspan></text><rect x="10" y="330" width="890" height="92.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="455" y="354.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="455" dy="0">Con la validación de presencia el catálogo parece completo al 87 % y en realidad solo 43 entradas (29 %) están al día.</tspan></text><text x="455" y="371.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="455" dy="0">Medir la completitud por campos lleno invita a rellenar con «TBD»; comprobar contra otra fuente (el registro de</tspan></text><text x="455" y="388.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="455" dy="0">equipos, la fecha de revisión) es lo que distingue completo de actual. Las proporciones de problemas son supuestos del</tspan></text><text x="455" y="404.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="455" dy="0">autor.</tspan></text><text x="455" y="444.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="455" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
