<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 486" width="940" height="486" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cobros reales ante el mismo número de intentos: sin clave de idempotencia y con ella</title><desc id="d">Barras con 1069 intentos de cobro sobre 1000 renovaciones, 8 por ciento reintentadas tras una respuesta perdida: sin clave de idempotencia el procesador de ejemplo cobra 1069 veces, 69 de más y 338100 centavos de más; con clave cobra 1000.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="486" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cobros reales ante el mismo número de intentos: sin clave de idempotencia y con ella</tspan></text><line x1="93.7" y1="327" x2="920" y2="327" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="327" x2="93.7" y2="327" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="331.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">0</tspan></text><line x1="93.7" y1="275" x2="920" y2="275" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="275" x2="93.7" y2="275" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="279.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">250</tspan></text><line x1="93.7" y1="223" x2="920" y2="223" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="223" x2="93.7" y2="223" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="227.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">500</tspan></text><line x1="93.7" y1="171" x2="920" y2="171" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="171" x2="93.7" y2="171" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="175.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">750</tspan></text><line x1="93.7" y1="119" x2="920" y2="119" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="119" x2="93.7" y2="119" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="123.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1 000</tspan></text><line x1="93.7" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="67" x2="93.7" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1 250</tspan></text><line x1="93.7" y1="67" x2="93.7" y2="327" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="197" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 197)">Cobros</text><rect x="121.243" y="104.648" width="220.347" height="222.352" rx="3" fill="#087f8c"/><text x="231.417" y="98.648" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="231.417" dy="0">1 069</tspan></text><text x="231.417" y="348" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="231.417" dy="0">Intentos enviados</tspan></text><rect x="396.677" y="104.648" width="220.347" height="222.352" rx="3" fill="#087f8c"/><text x="506.85" y="98.648" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="506.85" dy="0">1 069</tspan></text><text x="506.85" y="348" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="506.85" dy="0">Cobros reales sin clave</tspan></text><rect x="672.11" y="119" width="220.347" height="208" rx="3" fill="#087f8c"/><text x="782.283" y="113" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="782.283" dy="0">1 000</tspan></text><text x="782.283" y="348" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.283" dy="0">Cobros reales con clave</tspan></text><line x1="93.7" y1="119" x2="920" y2="119" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="916" y="113" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="916" dy="0">Renovaciones</tspan></text><rect x="10" y="379" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="403.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los 69 cobros de más suman 3 381,00 en cargos duplicados: cada uno es un cliente cobrado dos veces por un reintento que él</tspan></text><text x="470" y="420.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">no pidió. La clave estable por renovación (no por intento) es lo que convierte el reintento en seguro.</tspan></text><text x="470" y="468.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9 y sqlite3; los recuentos se repiten con la semilla 34 y los tiempos varían entre ejecuciones y equipos.</tspan></text></svg>
