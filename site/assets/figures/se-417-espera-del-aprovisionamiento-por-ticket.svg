<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 321" width="940" height="321" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Aprovisionar por ticket con dos personas de plataforma (3 horas por solicitud): espera antes de empezar</title><desc id="d">Tabla: con 0,2 solicitudes por hora la utilización es del 30 por ciento y la espera media 0,3 horas; con 0,4 la utilización es del 60 por ciento y la espera media 1,7 horas con 5,7 en el percentil 90; con 0,55 la utilización es del 83 por ciento y la espera media 6,4 horas con 16,6 en el percentil 90.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="321" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Demanda</tspan></text><rect x="340" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="432" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="432" dy="0">Utilización</tspan></text><rect x="530" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="627" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="627" dy="0">Espera media</tspan></text><rect x="730" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="827" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="827" dy="0">Espera p90</tspan></text><rect x="10" y="56" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">0,20 solicitudes por hora</tspan></text><rect x="340" y="56" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">30 %</tspan></text><rect x="530" y="56" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="627" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="627" dy="0">0,3 h</tspan></text><rect x="730" y="56" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">0,6 h</tspan></text><rect x="10" y="106" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">0,40 solicitudes por hora</tspan></text><rect x="340" y="106" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">60 %</tspan></text><rect x="530" y="106" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="627" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="627" dy="0">1,7 h</tspan></text><rect x="730" y="106" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">5,7 h</tspan></text><rect x="10" y="156" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">0,55 solicitudes por hora</tspan></text><rect x="340" y="156" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="432" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432" dy="0">82 %</tspan></text><rect x="530" y="156" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="627" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="627" dy="0">6,4 h</tspan></text><rect x="730" y="156" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">16,6 h</tspan></text><rect x="10" y="210" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="234.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La espera no crece proporcionalmente: al subir la demanda 2,75 veces (de 0,2 a 0,55), la espera media se multiplica por 22.</tspan></text><text x="470" y="251.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Es la misma curva de saturación de la cola de SE-376 aplicada a un equipo humano. El autoservicio saca el tiempo de espera</tspan></text><text x="470" y="268.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de la cola, a cambio de construir y mantener la automatización. Servicio exponencial de 3 h: supuesto.</tspan></text><text x="470" y="307.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
