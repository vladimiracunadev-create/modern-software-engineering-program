<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 376" width="940" height="376" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un cobro que cobra bien pero cuya respuesta se pierde: el reintento con la misma clave no cobra otra vez</title><desc id="d">Diagrama de Gantt con tres carriles: el servicio pide el cobro 1 y espera hasta agotar el tiempo; el procesador cobra entre 1 y 3 segundos y la respuesta se pierde; el servicio repite el cobro con la misma clave; el procesador devuelve el resultado guardado; el libro registra un solo asiento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="376" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un cobro que cobra bien pero cuya respuesta se pierde: el reintento con la misma clave no cobra otra vez</tspan></text><line x1="204" y1="51" x2="204" y2="195" stroke="#d5dde1" stroke-width="1"/><line x1="204" y1="195" x2="204" y2="200" stroke="#5b7280" stroke-width="1.4"/><text x="204" y="216" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="204" dy="0">0</tspan></text><line x1="322" y1="51" x2="322" y2="195" stroke="#d5dde1" stroke-width="1"/><line x1="322" y1="195" x2="322" y2="200" stroke="#5b7280" stroke-width="1.4"/><text x="322" y="216" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="322" dy="0">2</tspan></text><line x1="440" y1="51" x2="440" y2="195" stroke="#d5dde1" stroke-width="1"/><line x1="440" y1="195" x2="440" y2="200" stroke="#5b7280" stroke-width="1.4"/><text x="440" y="216" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="440" dy="0">4</tspan></text><line x1="558" y1="51" x2="558" y2="195" stroke="#d5dde1" stroke-width="1"/><line x1="558" y1="195" x2="558" y2="200" stroke="#5b7280" stroke-width="1.4"/><text x="558" y="216" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="558" dy="0">6</tspan></text><line x1="676" y1="51" x2="676" y2="195" stroke="#d5dde1" stroke-width="1"/><line x1="676" y1="195" x2="676" y2="200" stroke="#5b7280" stroke-width="1.4"/><text x="676" y="216" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="676" dy="0">8</tspan></text><line x1="794" y1="51" x2="794" y2="195" stroke="#d5dde1" stroke-width="1"/><line x1="794" y1="195" x2="794" y2="200" stroke="#5b7280" stroke-width="1.4"/><text x="794" y="216" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="794" dy="0">10</tspan></text><line x1="912" y1="51" x2="912" y2="195" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="195" x2="912" y2="200" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="216" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">12</tspan></text><line x1="204" y1="195" x2="912" y2="195" stroke="#5b7280" stroke-width="1.6"/><text x="194" y="79.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="194" dy="0">Cliente (servicio)</tspan></text><text x="194" y="127.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="194" dy="0">API del procesador</tspan></text><text x="194" y="175.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="194" dy="0">Libro mayor</tspan></text><rect x="204" y="60" width="177" height="30" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="292.5" y="79.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="292.5" dy="0">Pide cobro 1</tspan></text><rect x="381" y="60" width="236" height="30" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="499" y="79.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="499" dy="0">Espera: tiempo agotado</tspan></text><rect x="617" y="60" width="177" height="30" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="705.5" y="79.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="705.5" dy="0">Repite cobro 1</tspan></text><line x1="14" y1="99" x2="912" y2="99" stroke="#d5dde1" stroke-width="1"/><rect x="263" y="108" width="118" height="30" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="322" y="127.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="322" dy="0">Cobra</tspan></text><rect x="617" y="108" width="177" height="30" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="705.5" y="127.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="705.5" dy="0">Guardado</tspan></text><line x1="14" y1="147" x2="912" y2="147" stroke="#d5dde1" stroke-width="1"/><rect x="794" y="156" width="118" height="30" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="853" y="175.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="853" dy="0">Un asiento</tspan></text><text x="558" y="239" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="558" dy="0">Segundos desde la primera petición (valores del autor)</tspan></text><rect x="10" y="253" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="277.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">El servicio no puede saber si el cobro ocurrió: sin clave, repetir arriesga cobrar dos veces y no repetir arriesga no</tspan></text><text x="470" y="294.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">cobrar. Con la misma clave, repetir es seguro y el procesador devuelve lo que ya guardó. Secuencia de ejemplo con valores</tspan></text><text x="470" y="311.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">del autor.</tspan></text><text x="470" y="358.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 34; muestra un mecanismo, no mide un producto, un mercado ni un proveedor reales.</tspan></text></svg>
