<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 567" width="940" height="567" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una métrica se vuelve meta: el mismo trabajo y los mismos defectos en 26 semanas</title><desc id="d">Barras agrupadas en escala logarítmica con tres métricas en tres casos: sin incentivo hay 4 despliegues por semana, 24 por ciento de fallos y plazo mediano de 32 horas; con despliegues vacíos, 16, 6 por ciento y 0,1 horas; partiendo los cambios en tres, 30, 3,2 por ciento y 8 horas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="567" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Una métrica se vuelve meta: el mismo trabajo y los mismos defectos en 26 semanas</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">sin incentivo</tspan></text><rect x="162.02" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="182.02" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="182.02" dy="0">incentivo en frecuencia: despliegues vacíos</tspan></text><rect x="534.24" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="554.24" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="554.24" dy="0">incentivo en frecuencia: cambios partidos</tspan></text><line x1="86.16" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="375" x2="86.16" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">0,01</tspan></text><line x1="86.16" y1="305" x2="920" y2="305" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="305" x2="86.16" y2="305" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="309.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">0,1</tspan></text><line x1="86.16" y1="235" x2="920" y2="235" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="235" x2="86.16" y2="235" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="239.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">1</tspan></text><line x1="86.16" y1="165" x2="920" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="165" x2="86.16" y2="165" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="169.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">10</tspan></text><line x1="86.16" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="95" x2="86.16" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">100</tspan></text><line x1="86.16" y1="95" x2="86.16" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">Valor de la métrica (escala logarítmica)</text><rect x="113.955" y="192.856" width="71.4524" height="182.144" rx="3" fill="#6b7c86"/><text x="149.681" y="186.856" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="149.681" dy="0">4,0</tspan></text><rect x="189.407" y="150.712" width="71.4524" height="224.288" rx="3" fill="#c0432f"/><text x="225.133" y="144.712" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="225.133" dy="0">16,0</tspan></text><rect x="264.86" y="131.602" width="71.4524" height="243.398" rx="3" fill="#946512"/><text x="300.586" y="125.602" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="300.586" dy="0">30,0</tspan></text><text x="225.133" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="225.133" dy="0">Despliegues por semana</tspan></text><rect x="391.901" y="138.337" width="71.4524" height="236.663" rx="3" fill="#6b7c86"/><text x="427.628" y="132.337" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="427.628" dy="0">24,0</tspan></text><rect x="467.354" y="180.481" width="71.4524" height="194.519" rx="3" fill="#c0432f"/><text x="503.08" y="174.481" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="503.08" dy="0">6,0</tspan></text><rect x="542.806" y="199.591" width="71.4524" height="175.409" rx="3" fill="#946512"/><text x="578.532" y="193.591" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="578.532" dy="0">3,2</tspan></text><text x="503.08" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="503.08" dy="0">Tasa de fallos (%)</tspan></text><rect x="669.848" y="129.264" width="71.4524" height="245.736" rx="3" fill="#6b7c86"/><text x="705.574" y="123.264" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="705.574" dy="0">32,4</tspan></text><rect x="745.3" y="305" width="71.4524" height="70" rx="3" fill="#c0432f"/><text x="781.027" y="299" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="781.027" dy="0">0,1</tspan></text><rect x="820.753" y="171.196" width="71.4524" height="203.804" rx="3" fill="#946512"/><text x="856.479" y="165.196" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="856.479" dy="0">8,2</tspan></text><text x="781.027" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="781.027" dy="0">Plazo mediano (h)</tspan></text><rect x="10" y="427" width="920" height="92.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">En los tres casos hay 0,96 defectos por semana y 10 cambios de valor. Las tres métricas mejoraron (más frecuencia, menos</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">fallos, menos plazo) y el trabajo entregado y los defectos son idénticos. Partir cambios puede ser una buena práctica real,</tspan></text><text x="470" y="485.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">pero medido por el ratio sale lo mismo que el truco de los despliegues vacíos. La defensa es mirar las métricas juntas con</tspan></text><text x="470" y="501.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">una medida de valor y desconfiar de la que mejora sola.</tspan></text><text x="470" y="549.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
