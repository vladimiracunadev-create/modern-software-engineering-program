<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 502" width="940" height="502" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Pedidos aceptados cuando 40 compradores piden a la vez una de las 10 unidades disponibles</title><desc id="d">Barras con 40 compradores simultáneos y 10 unidades: leer el saldo y escribir después acepta 40 pedidos, 30 de más; una actualización condicional en una sola sentencia acepta 10; el resultado se repitió igual en cinco ejecuciones.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="502" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Pedidos aceptados cuando 40 compradores piden a la vez una de las 10 unidades disponibles</tspan></text><line x1="71.08" y1="327" x2="920" y2="327" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="327" x2="71.08" y2="327" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="331.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="262" x2="920" y2="262" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="262" x2="71.08" y2="262" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="266.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="197" x2="920" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="197" x2="71.08" y2="197" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="201.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="132" x2="920" y2="132" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="132" x2="71.08" y2="132" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="136.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">30</tspan></text><line x1="71.08" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="67" x2="71.08" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">40</tspan></text><line x1="71.08" y1="67" x2="71.08" y2="327" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="197" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 197)">Pedidos aceptados</text><rect x="99.3773" y="262" width="226.379" height="65" rx="3" fill="#087f8c"/><text x="212.567" y="256" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="212.567" dy="0">10</tspan></text><text x="212.567" y="348" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="212.567" dy="0">Existencias</tspan></text><rect x="382.351" y="67" width="226.379" height="260" rx="3" fill="#087f8c"/><text x="495.54" y="61" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="495.54" dy="0">40</tspan></text><text x="495.54" y="348" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="495.54" dy="0">Leer y después escribir</tspan></text><rect x="665.324" y="262" width="226.379" height="65" rx="3" fill="#087f8c"/><text x="778.513" y="256" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="778.513" dy="0">10</tspan></text><text x="778.513" y="348" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="778.513" dy="0">Actualización condicional</tspan></text><line x1="71.08" y1="262" x2="920" y2="262" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="916" y="256" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="916" dy="0">Existencias reales</tspan></text><rect x="10" y="379" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="403.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Con la lectura previa los 40 hilos ven «10 disponibles» antes de que ninguno escriba y todos aceptan el pedido; el saldo</tspan></text><text x="470" y="420.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">final dice 9 aunque haya 40 pedidos. La actualización condicional deja a la base de datos decidir quién llega primero.</tspan></text><text x="470" y="437.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Hilos reales contra sqlite3; con otro motor cambian los tiempos, no la causa.</tspan></text><text x="470" y="484.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9 y sqlite3; los recuentos se repiten con la semilla 34 y los tiempos varían entre ejecuciones y equipos.</tspan></text></svg>
