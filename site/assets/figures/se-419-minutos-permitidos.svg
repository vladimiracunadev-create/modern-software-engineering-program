<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" width="940" height="420" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Minutos de caída que permite un objetivo de disponibilidad en un mes de 30 días</title><desc id="d">Barras horizontales en escala logarítmica con los minutos de caída por mes: 99 por ciento permite 432, 99,5 permite 216, 99,9 permite 43,2, 99,95 permite 21,6 y 99,99 permite 4,3.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="420" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Minutos de caída que permite un objetivo de disponibilidad en un mes de 30 días</tspan></text><line x1="144" y1="49" x2="144" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="144" y1="239" x2="144" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="144" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="144" dy="0">1</tspan></text><line x1="387.9" y1="49" x2="387.9" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="387.9" y1="239" x2="387.9" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="387.9" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="387.9" dy="0">10</tspan></text><line x1="631.8" y1="49" x2="631.8" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="631.8" y1="239" x2="631.8" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="631.8" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="631.8" dy="0">100</tspan></text><line x1="875.7" y1="49" x2="875.7" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="239" x2="875.7" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">1 000</tspan></text><line x1="144" y1="239" x2="875.7" y2="239" stroke="#5b7280" stroke-width="1.6"/><text x="134" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="134" dy="0">99 %</tspan></text><text x="134" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="134" dy="0">99,5 %</tspan></text><text x="134" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="134" dy="0">99,9 %</tspan></text><text x="134" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="134" dy="0">99,95 %</tspan></text><text x="134" y="224.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="134" dy="0">99,99 %</tspan></text><rect x="144" y="55" width="642.794" height="26" rx="3" fill="#102a43"/><text x="793.794" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="793.794" dy="0">432,0</tspan></text><rect x="144" y="93" width="569.373" height="26" rx="3" fill="#102a43"/><text x="720.373" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="720.373" dy="0">216,0</tspan></text><rect x="144" y="131" width="398.894" height="26" rx="3" fill="#102a43"/><text x="549.894" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="549.894" dy="0">43,2</tspan></text><rect x="144" y="169" width="325.473" height="26" rx="3" fill="#102a43"/><text x="476.473" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="476.473" dy="0">21,6</tspan></text><rect x="144" y="207" width="154.503" height="26" rx="3" fill="#102a43"/><text x="305.503" y="224.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="305.503" dy="0">4,3</tspan></text><text x="509.85" y="283" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="509.85" dy="0">Minutos de caída permitidos (escala logarítmica) (escala logarítmica)</tspan></text><rect x="10" y="297" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="321.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cada «nueve» más divide por diez el tiempo permitido. De 99,9 % a 99,99 % se pasa de 43,2 a 4,3 minutos: menos de lo que</tspan></text><text x="470" y="338.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">tarda en reaccionar una guardia humana. Prometer un nivel exige haber medido el actual y poder pagarlo; no es un adjetivo</tspan></text><text x="470" y="355.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">del plan.</tspan></text><text x="470" y="402.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 34; muestra un mecanismo, no mide un producto, un mercado ni un proveedor reales.</tspan></text></svg>
