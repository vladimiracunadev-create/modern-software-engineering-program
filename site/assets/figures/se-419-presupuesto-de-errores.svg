<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Presupuesto de caída de 99,9 % (43,2 minutos al mes): tres meses distintos y cuándo se agota cada uno</title><desc id="d">Línea con tres series de minutos de caída acumulados a lo largo de 30 días contra el presupuesto de 43,2 minutos: un mes tranquilo llega a 12 minutos; un mes con un incidente de 40 minutos el día 12 cierra en 44; un mes con tres incidentes pasa de 43,2 entre el día 10 y el 15 y llega a 78.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Presupuesto de caída de 99,9 % (43,2 minutos al mes): tres meses distintos y cuándo se agota cada uno</tspan></text><circle cx="22" cy="51" r="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Mes tranquilo</tspan></text><rect x="162.02" y="45" width="12" height="12" fill="#946512" stroke="#946512" stroke-width="2"/><text x="182.02" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="182.02" dy="0">Un incidente grande</tspan></text><polygon points="359.28,44.1 365.88,56.4 352.68,56.4" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="373.28" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="373.28" dy="0">Tres incidentes</tspan></text><line x1="71.08" y1="387" 