abaja en fiabilidad. El crédito al cliente por incumplir es una consecuencia contractual aparte.</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Series inventadas para mostrar la lectura.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 34; muestra un mecanismo, no mide un producto, un mercado ni un proveedor reales.</tspan></text></svg>
