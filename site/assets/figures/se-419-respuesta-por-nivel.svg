<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 429" width="940" height="429" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Horas hasta la primera respuesta de soporte por severidad y plan: dónde el plan cambia la promesa y dónde no</title><desc id="d">Mapa de calor con las horas hasta la primera respuesta por severidad y plan: crítica 72 en gratis, 4 en equipo y 1 en empresa; alta 8 en equipo y 2 en empresa; media 24 y 8; baja 72 y 24; el plan gratis solo tiene compromiso de 72 horas para lo crítico.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="429" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Horas hasta la primera respuesta de soporte por severidad y plan: dónde el plan cambia la promesa y dónde no</tspan></text><text x="415" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="415" dy="0">Gratis</tspan></text><text x="617" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="617" dy="0">Equipo</tspan></text><text x="819" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="819" dy="0">Empresa</tspan></text><text x="304" y="100.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">Crítica: servicio caído</tspan></text><text x="304" y="148.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">Alta: función principal degradada</tspan></text><text x="304" y="196.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">Media: error con alternativa</tspan></text><text x="304" y="244.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">Baja: consulta o mejora</tspan></text><rect x="315.5" y="73.5" width="199" height="45" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="415" y="100.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="415" dy="0">72</tspan></text><rect x="517.5" y="73.5" width="199" height="45" rx="4" fill="#d1dae5" stroke="#ffffff" stroke-width="1"/><text x="617" y="100.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="617" dy="0">4</tspan></text><rect x="719.5" y="73.5" width="199" height="45" rx="4" fill="#d9e2ec" stroke="#ffffff" stroke-width="1"/><text x="819" y="100.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="819" dy="0">1</tspan></text><rect x="315.5" y="121.5" width="199" height="45" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><text x="415" y="148.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="415" dy="0">—</tspan></text><rect x="517.5" y="121.5" width="199" height="45" rx="4" fill="#c5d0db" stroke="#ffffff" stroke-width="1"/><text x="617" y="148.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="617" dy="0">8</tspan></text><rect x="719.5" y="121.5" width="199" height="45" rx="4" fill="#d6dfea" stroke="#ffffff" stroke-width="1"/><text x="819" y="148.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="819" dy="0">2</tspan></text><rect x="315.5" y="169.5" width="199" height="45" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><text x="415" y="196.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="415" dy="0">—</tspan></text><rect x="517.5" y="169.5" width="199" height="45" rx="4" fill="#98a6b5" stroke="#ffffff" stroke-width="1"/><text x="617" y="196.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="617" dy="0">24</tspan></text><rect x="719.5" y="169.5" width="199" height="45" rx="4" fill="#c5d0db" stroke="#ffffff" stroke-width="1"/><text x="819" y="196.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="819" dy="0">8</tspan></text><rect x="315.5" y="217.5" width="199" height="45" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><text x="415" y="244.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="415" dy="0">—</tspan></text><rect x="517.5" y="217.5" width="199" height="45" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="617" y="244.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="617" dy="0">72</tspan></text><rect x="719.5" y="217.5" width="199" height="45" rx="4" fill="#98a6b5" stroke="#ffffff" stroke-width="1"/><text x="819" y="244.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="819" dy="0">24</tspan></text><text x="314" y="290" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="314" dy="0">1</tspan></text><rect x="329.54" y="278" width="30.5" height="14" fill="#d9e2ec"/><rect x="359.54" y="278" width="30.5" height="14" fill="#bcc8d4"/><rect x="389.54" y="278" width="30.5" height="14" fill="#a0adbc"/><rect x="419.54" y="278" width="30.5" height="14" fill="#8393a4"/><rect x="449.54" y="278" width="30.5" height="14" fill="#66798b"/><rect x="479.54" y="278" width="30.5" height="14" fill="#495f73"/><rect x="509.54" y="278" width="30.5" height="14" fill="#2d445b"/><rect x="539.54" y="278" width="30.5" height="14" fill="#102a43"/><text x="577.54" y="290" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="577.54" dy="0">72</tspan></text><text x="600.62" y="290" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="600.62" dy="0">más oscuro = mayor (horas hasta la primera respuesta)</tspan></text><rect x="10" y="306" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="330.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Una primera respuesta no es una resolución: el compromiso de respuesta es lo que se cumple fácil y se mide; el de</tspan></text><text x="470" y="347.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">resolución depende de la causa. Los guiones indican «sin compromiso». Valores del autor para mostrar la forma de una tabla</tspan></text><text x="470" y="364.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de niveles, no un contrato.</tspan></text><text x="470" y="411.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 34; muestra un mecanismo, no mide un producto, un mercado ni un proveedor reales.</tspan></text></svg>
