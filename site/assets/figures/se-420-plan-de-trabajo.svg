<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 452" width="940" height="452" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Plan de diez horas de trabajo con solapes: qué puede avanzar a la vez y qué espera</title><desc id="d">Diagrama de Gantt con cinco carriles en horas: aislamiento y alta de 0 a 3, uso y derechos de 2 a 5, pagos y libro de 4 a 8, inventario y SLA de 6 a 9 y evidencia de 8 a 10.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="452" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Plan de diez horas de trabajo con solapes: qué puede avanzar a la vez y qué espera</tspan></text><line x1="194" y1="51" x2="194" y2="271" stroke="#d5dde1" stroke-width="1"/><line x1="194" y1="271" x2="194" y2="276" stroke="#5b7280" stroke-width="1.4"/><text x="194" y="292" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="194" dy="0">0</tspan></text><line x1="337.6" y1="51" x2="337.6" y2="271" stroke="#d5dde1" stroke-width="1"/><line x1="337.6" y1="271" x2="337.6" y2="276" stroke="#5b7280" stroke-width="1.4"/><text x="337.6" y="292" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="337.6" dy="0">2</tspan></text><line x1="481.2" y1="51" x2="481.2" y2="271" stroke="#d5dde1" stroke-width="1"/><line x1="481.2" y1="271" x2="481.2" y2="276" stroke="#5b7280" stroke-width="1.4"/><text x="481.2" y="292" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="481.2" dy="0">4</tspan></text><line x1="624.8" y1="51" x2="624.8" y2="271" stroke="#d5dde1" stroke-width="1"/><line x1="624.8" y1="271" x2="624.8" y2="276" stroke="#5b7280" stroke-width="1.4"/><text x="624.8" y="292" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="624.8" dy="0">6</tspan></text><line x1="768.4" y1="51" x2="768.4" y2="271" stroke="#d5dde1" stroke-width="1"/><line x1="768.4" y1="271" x2="768.4" y2="276" stroke="#5b7280" stroke-width="1.4"/><text x="768.4" y="292" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="768.4" dy="0">8</tspan></text><line x1="912" y1="51" x2="912" y2="271" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="271" x2="912" y2="276" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="292" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">10</tspan></text><line x1="194" y1="271" x2="912" y2="271" stroke="#5b7280" stroke-width="1.6"/><text x="184" y="77.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="184" dy="0">Aislamiento y alta</tspan></text><text x="184" y="121.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="184" dy="0">Uso y derechos</tspan></text><text x="184" y="165.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="184" dy="0">Pagos y libro</tspan></text><text x="184" y="209.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="184" dy="0">Inventario y SLA</tspan></text><text x="184" y="253.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="184" dy="0">Evidencia</tspan></text><rect x="194" y="60" width="215.4" height="26" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="301.7" y="77.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="301.7" dy="0">Inquilino y vecino</tspan></text><line x1="14" y1="95" x2="912" y2="95" stroke="#d5dde1" stroke-width="1"/><rect x="337.6" y="104" width="215.4" height="26" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="445.3" y="121.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="445.3" dy="0">Medidor y motor</tspan></text><line x1="14" y1="139" x2="912" y2="139" stroke="#d5dde1" stroke-width="1"/><rect x="481.2" y="148" width="287.2" height="26" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="624.8" y="165.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="624.8" dy="0">Libro y conciliación</tspan></text><line x1="14" y1="183" x2="912" y2="183" stroke="#d5dde1" stroke-width="1"/><rect x="624.8" y="192" width="215.4" height="26" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="732.5" y="209.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="732.5" dy="0">Concurrencia y objetivos</tspan></text><line x1="14" y1="227" x2="912" y2="227" stroke="#d5dde1" stroke-width="1"/><rect x="768.4" y="236" width="143.6" height="26" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="840.2" y="253.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="840.2" dy="0">Informe</tspan></text><text x="553" y="315" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="553" dy="0">Horas de trabajo (valores del autor)</tspan></text><rect x="10" y="329" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="353.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Los solapes son posibles porque cada pieza tiene su propia prueba; la evidencia solo empieza cuando las demás tienen</tspan></text><text x="470" y="370.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">resultado reproducible. Con una persona, las horas se suman; con equipo, el plan marca dónde coordinar. Duraciones</tspan></text><text x="470" y="387.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">inventadas.</tspan></text><text x="470" y="434.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 34; muestra un mecanismo, no mide un producto, un mercado ni un proveedor reales.</tspan></text></svg>
