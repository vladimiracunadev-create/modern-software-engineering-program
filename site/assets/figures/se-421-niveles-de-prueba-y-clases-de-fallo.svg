<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 518" width="1000" height="518" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué clases de fallo puede ver cada nivel de prueba (matriz del autor y costo por ejecución)</title><desc id="d">Mapa de calor de seis niveles de prueba frente a ocho clases de fallo: ningún nivel cubre las ocho, la lógica pura solo la ve la prueba unitaria y el rendimiento solo la carga; el conjunto más barato que cubre las ocho (unitaria, contrato, extremo a extremo y carga) cuesta 91,1 minutos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="518" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué clases de fallo puede ver cada nivel de prueba (matriz del autor y costo por ejecución)</tspan></text><text x="299.375" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="299.375" dy="0">Lógica pura</tspan></text><text x="390.125" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="390.125" dy="0">Frontera de</tspan></text><text x="390.125" y="77" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="390.125" dy="0">datos</tspan></text><text x="480.875" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="480.875" dy="0">Contrato</tspan></text><text x="571.625" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="571.625" dy="0">Configuración</tspan></text><text x="662.375" y="60" font-size="13"