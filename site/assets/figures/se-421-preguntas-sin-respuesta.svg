<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 381" width="940" height="381" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Sesenta preguntas hechas después de un incidente: qué diseño de señales puede responderlas</title><desc id="d">Tabla: con tres dimensiones previstas las métricas responden 6 de las 60 preguntas con 45 series; los eventos anchos las responden todas con unos 268 megabytes al día; cubrir todas las combinaciones con métricas exigiría 1 296 000 series.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="381" fill="#ffffff"/><rect x="10" y="12" width="304" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="162" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="162" dy="0">Diseño</tspan></text><rect x="320" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="402" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="402" dy="0">Preguntas</tspan></text><text x="402" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="402" dy="0">respondidas</tspan></text><rect x="490" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="582" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="582" dy="0">Coste</tspan></text><rect x="680" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="802" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="802" dy="0">Lectura</tspan></text><rect x="10" y="56" width="304" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="91.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">Métricas con 3 dimensiones previstas</tspan></text><rect x="320" y="56" width="164" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="91.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">6 de 60</tspan></text><rect x="490" y="56" width="184" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="91.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">45 series</tspan></text><rect x="680" y="56" width="244" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="91.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">Barato, cerrado a lo previsto</tspan></text><rect x="10" y="126" width="304" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="161.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">Eventos anchos con todos los campos</tspan></text><rect x="320" y="126" width="164" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="161.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">60 de 60</tspan></text><rect x="490" y="126" width="184" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="161.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">268 MB al día</tspan></text><rect x="680" y="126" width="244" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="153.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">268 bytes por evento, un millón</tspan></text><text x="802" y="169.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">de peticiones</tspan></text><rect x="10" y="196" width="304" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="231.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">Métricas con todas las combinaciones</tspan></text><rect x="320" y="196" width="164" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402" dy="0">60 de 60</tspan></text><rect x="490" y="196" width="184" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">1 296 000 series</tspan></text><rect x="680" y="196" width="244" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="223.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">Responde todo y no cabe en un</tspan></text><text x="802" y="239.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">almacén de métricas</tspan></text><rect x="10" y="270" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="294.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Las 60 preguntas son combinaciones de 1 a 3 de las 8 dimensiones del servicio (endpoint, estado, región, curso, cliente,</tspan></text><text x="470" y="311.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">versión, dispositivo, plan); las dimensiones previstas son endpoint, estado y región. Los eventos conservan el detalle a</tspan></text><text x="470" y="328.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">cambio de volumen y de privacidad: cada campo extra es un dato que alguien puede leer.</tspan></text><text x="470" y="367.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
