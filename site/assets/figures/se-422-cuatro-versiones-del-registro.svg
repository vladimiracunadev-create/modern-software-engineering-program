<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 403" width="940" height="403" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La misma línea de registro en cuatro versiones del código: extracción con una expresión regular y con campos por nombre</title><desc id="d">Tabla: una expresión regular escrita para la versión 1 extrae el 100 por ciento de las líneas de esa versión y 0 de las tres siguientes; leer campos por nombre de un registro JSON sigue en 100 por ciento cuando cambia la redacción o se añade un campo y cae a 0 cuando se renombra un campo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="403" fill="#ffffff"/><rect x="10" y="12" width="424" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="222" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="222" dy="0">Redacción del mensaje</tspan></text><rect x="440" y="12" width="94" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="487" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="487" dy="0">Regex v1</tspan></text><rect x="540" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="672" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="672" dy="0">Campos del registro JSON</tspan></text><rect x="810" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="867" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="867" dy="0">JSON por</tspan></text><text x="867" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="867" dy="0">nombre</tspan></text><rect x="10" y="56" width="424" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="85.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">v1: Entrega 123 aceptada para curso 45 en 83 ms</tspan></text><rect x="440" y="56" width="94" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">100 %</tspan></text><rect x="540" y="56" width="264" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">id, curso, ms</tspan></text><rect x="810" y="56" width="114" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">100 %</tspan></text><rect x="10" y="114" width="424" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="143.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">v2: Entrega aceptada: id=123 curso=45 duración=83ms</tspan></text><rect x="440" y="114" width="94" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">0 %</tspan></text><rect x="540" y="114" width="264" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">id, curso, ms</tspan></text><rect x="810" y="114" width="114" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">100 %</tspan></text><rect x="10" y="172" width="424" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="193.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">v3: [api] entrega id=123 (curso 45) OK tiempo=83</tspan></text><text x="222" y="209.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">milisegundos</tspan></text><rect x="440" y="172" width="94" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">0 %</tspan></text><rect x="540" y="172" width="264" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">id, curso, ms + región</tspan></text><rect x="810" y="172" width="114" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">100 %</tspan></text><rect x="10" y="230" width="424" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="259.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">v4: Submission 123 accepted for course 45 in 83 ms</tspan></text><rect x="440" y="230" width="94" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">0 %</tspan></text><rect x="540" y="230" width="264" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">id, curso, duration_ms (renombrado)</tspan></text><rect x="810" y="230" width="114" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">0 %</tspan></text><rect x="10" y="292" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="316.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cada versión se evaluó con 1 500 líneas. El registro estructurado mueve la ruptura del texto al contrato: sobrevive a un</tspan></text><text x="470" y="333.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cambio de redacción y no a un campo renombrado. Por eso el nombre de un campo es una interfaz que se versiona y se prueba,</tspan></text><text x="470" y="350.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">no un detalle de implementación.</tspan></text><text x="470" y="389.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
