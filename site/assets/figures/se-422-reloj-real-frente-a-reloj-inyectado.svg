<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 318" width="940" height="318" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una prueba de plazos con el reloj real y con el reloj como parámetro (10 000 ejecuciones simuladas)</title><desc id="d">Barras horizontales con los fallos de la misma prueba de plazos en 10 000 ejecuciones simuladas: con el reloj real y un margen de 1 s falla 173 veces por pausas ocasionales; con la hora inyectada y cinco casos de frontera no falla ninguna.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="318" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Una prueba de plazos con el reloj real y con el reloj como parámetro (10 000 ejecuciones simuladas)</tspan></text><line x1="354" y1="49" x2="354" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="137" x2="354" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="488.455" y1="49" x2="488.455" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="488.455" y1="137" x2="488.455" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="488.455" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="488.455" dy="0">50</tspan></text><line x1="622.91" y1="49" x2="622.91" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="622.91" y1="137" x2="622.91" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="622.91" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622.91" dy="0">100</tspan></text><line x1="757.365" y1="49" x2="757.365" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="757.365" y1="137" x2="757.365" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="757.365" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757.365" dy="0">150</tspan></text><line x1="891.82" y1="49" x2="891.82" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="891.82" y1="137" x2="891.82" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="891.82" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="891.82" dy="0">200</tspan></text><line x1="354" y1="137" x2="891.82" y2="137" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="67" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Reloj real, margen de 1 s entre construir el</tspan></text><text x="344" y="84" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">plazo y comprobar</tspan></text><text x="344" y="111" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Reloj inyectado, 5 casos de frontera (−1 s,</tspan></text><text x="344" y="128" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">0, +1 s, +24 h, +24 h 1 s)</tspan></text><rect x="354" y="55" width="465.214" height="32" rx="3" fill="#c0432f"/><text x="826.214" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="826.214" dy="0">173</tspan></text><rect x="354" y="99" width="2" height="32" rx="3" fill="#c0432f"/><text x="363" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><text x="622.91" y="181" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="622.91" dy="0">fallos en 10 000 ejecuciones (1,73 % frente a 0 %)</tspan></text><rect x="10" y="195" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="219.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El 1,73 % viene de un modelo del autor (3 de cada 100 ejecuciones sufren una pausa de 0,5 a 3 s), no de una medición del</tspan></text><text x="470" y="236.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">equipo. La lección es el mecanismo: una prueba que depende de cuánto tarda la máquina falla a veces sin que haya un</tspan></text><text x="470" y="253.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">defecto, y con la hora inyectada la hora deja de ser una variable.</tspan></text><text x="470" y="300.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos y modelos del autor con semilla fija; Windows (CPython 3.12.9) y Ubuntu (WSL2, 3.12.3) con cifras idénticas.</tspan></text></svg>
