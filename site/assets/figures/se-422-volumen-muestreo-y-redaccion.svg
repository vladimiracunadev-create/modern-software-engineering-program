<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 519" width="930" height="519" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Coste, muestreo y redacción de registros: tamaño, errores conservados y datos personales detectados</title><desc id="d">Tabla: la misma línea pesa 117 bytes en texto y 166 en JSON; conservar el 10 por ciento de las líneas deja 412 de 4 039 errores, mientras que conservar todos los errores y el 10 por ciento del resto ocupa 11,8 por ciento del volumen; una expresión regular para correos detecta 40 de 100 variantes, una de tokens detecta 100 de 100 y una de documentos de identidad detecta 20 de 100.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="930" height="519" fill="#ffffff"/><rect x="10" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="132" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="132" dy="0">Política</tspan></text><rect x="260" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="352" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="352" dy="0">Resultado</tspan></text><rect x="450" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="557" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="557" dy="0">Detalle</tspan></text><rect x="670" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="792" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="792" dy="0">Lectura</tspan></text><rect x="10" y="56" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="85.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Tamaño de la misma línea</tspan></text><rect x="260" y="56" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="352" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352" dy="0">117 bytes de texto</tspan></text><rect x="450" y="56" width="214" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">166 bytes de JSON</tspan></text><rect x="670" y="56" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="77.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">El JSON repite las claves en cada</tspan></text><text x="792" y="93.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">línea</tspan></text><rect x="10" y="114" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="143.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Muestreo uniforme del 10 %</tspan></text><rect x="260" y="114" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="352" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352" dy="0">19 876 de 200 000 líneas</tspan></text><rect x="450" y="114" width="214" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">412 de 4 039 errores</tspan></text><rect x="670" y="114" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">Pierde 9 de cada 10 errores</tspan></text><rect x="10" y="172" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="193.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Todos los errores y 10 % del</tspan></text><text x="132" y="209.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">resto</tspan></text><rect x="260" y="172" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="352" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352" dy="0">23 503 líneas</tspan></text><rect x="450" y="172" width="214" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">4 039 de 4 039 errores</tspan></text><rect x="670" y="172" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">Conserva 11,8 % del volumen</tspan></text><rect x="10" y="230" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="251.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Redacción de correos con una</tspan></text><text x="132" y="267.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">regex</tspan></text><rect x="260" y="230" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="352" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352" dy="0">40 de 100</tspan></text><rect x="450" y="230" width="214" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="251.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">Falla con mayúsculas y con</tspan></text><text x="557" y="267.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">variantes</tspan></text><rect x="670" y="230" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">Reconoce dos de cinco formatos</tspan></text><rect x="10" y="288" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="309.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Redacción de tokens con prefijo</tspan></text><text x="132" y="325.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">fijo</tspan></text><rect x="260" y="288" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="352" y="317.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352" dy="0">100 de 100</tspan></text><rect x="450" y="288" width="214" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="317.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">Formato cerrado y conocido</tspan></text><rect x="670" y="288" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="309.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">Funciona porque el formato es</tspan></text><text x="792" y="325.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">estable</tspan></text><rect x="10" y="346" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="367.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Redacción de documentos de</tspan></text><text x="132" y="383.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">identidad</tspan></text><rect x="260" y="346" width="184" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="352" y="375.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352" dy="0">20 de 100</tspan></text><rect x="450" y="346" width="214" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="375.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">Solo el formato con puntos</tspan></text><rect x="670" y="346" width="244" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="375.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">Reconoce un formato de cinco</tspan></text><rect x="10" y="408" width="910" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="465" y="432.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">La redacción por patrones solo protege los formatos que alguien previó: cada variante escrita por una persona (mayúsculas,</tspan></text><text x="465" y="449.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">espacios, un «arroba» escrito) es un dato personal que llega al almacén. Los 200 000 registros y las variantes son</tspan></text><text x="465" y="466.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">sintéticos; el 2 % de errores es un supuesto del autor.</tspan></text><text x="465" y="505.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
