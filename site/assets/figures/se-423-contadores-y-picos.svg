<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 493" width="910" height="493" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Contador con reinicios y pico de un gauge: qué reconstruye cada forma de leer y cada intervalo de muestreo</title><desc id="d">Tabla: un contador de 60 513 incrementos con tres reinicios se lee como 14 858 si se resta el último valor del primero, como 60 198 con detección de reinicios y scrape de 15 segundos y como 55 707 con scrape de 60 segundos; un pico de 20 segundos de un gauge se observa en 100 por ciento de los casos con scrape de 15 segundos, 32,9 con 60 y 6,7 con 300.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="910" height="493" fill="#ffffff"/><rect x="10" y="12" width="424" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="222" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="222" dy="0">Lectura</tspan></text><rect x="440" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="507" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="507" dy="0">Resultado</tspan></text><rect x="580" y="12" width="314" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="737" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="737" dy="0">Lectura de la cifra</tspan></text><rect x="10" y="56" width="424" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="79.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Incremento real (600 s, 3 reinicios)</tspan></text><rect x="440" y="56" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="507" y="79.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">60 513</tspan></text><rect x="580" y="56" width="314" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="79.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">Verdad de la simulación</tspan></text><rect x="10" y="102" width="424" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="125.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Último valor menos primero, scrape cada 15 s</tspan></text><rect x="440" y="102" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="507" y="125.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">14 858</tspan></text><rect x="580" y="102" width="314" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="125.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">Pierde todo lo anterior al último reinicio</tspan></text><rect x="10" y="148" width="424" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="171.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Con detección de reinicios, scrape cada 15 s</tspan></text><rect x="440" y="148" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="507" y="171.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">60 198</tspan></text><rect x="580" y="148" width="314" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="171.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">Pierde 0,5 %</tspan></text><rect x="10" y="194" width="424" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="217.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Con detección de reinicios, scrape cada 60 s</tspan></text><rect x="440" y="194" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="507" y="217.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">55 707</tspan></text><rect x="580" y="194" width="314" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="217.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">Pierde 7,9 %</tspan></text><rect x="10" y="240" width="424" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="263.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Pico de 20 s de un gauge visto con scrape de 15 s</tspan></text><rect x="440" y="240" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="507" y="263.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">100 %</tspan></text><rect x="580" y="240" width="314" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="263.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">Se ve siempre</tspan></text><rect x="10" y="286" width="424" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="309.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Pico de 20 s de un gauge visto con scrape de 60 s</tspan></text><rect x="440" y="286" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="507" y="309.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">33 %</tspan></text><rect x="580" y="286" width="314" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="309.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">Se ve una de cada tres veces</tspan></text><rect x="10" y="332" width="424" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="355.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Pico de 20 s de un gauge visto con scrape de 300 s</tspan></text><rect x="440" y="332" width="134" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="507" y="355.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="507" dy="0">7 %</tspan></text><rect x="580" y="332" width="314" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="355.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">Casi nunca</tspan></text><rect x="10" y="382" width="890" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="455" y="406.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455" dy="0">Un contador sobrevive a un muestreo grueso porque acumula; un gauge no, porque el valor entre dos lecturas desaparece.</tspan></text><text x="455" y="423.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455" dy="0">La detección de reinicios pierde el tramo anterior a cada reinicio dentro del intervalo. Tasa de 100 por segundo,</tspan></text><text x="455" y="440.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455" dy="0">reinicios en 137, 301 y 452 s y picos uniformes son supuestos del autor.</tspan></text><text x="455" y="479.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="455" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
