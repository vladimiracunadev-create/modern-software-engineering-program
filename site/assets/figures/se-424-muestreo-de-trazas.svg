<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 519" width="940" height="519" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Muestreo de trazas: lo interesante que conserva cada política y el efecto de enrutar los spans a varios recolectores</title><desc id="d">Tabla: sobre 100 000 trazas con 976 errores y 1 994 lentas, el muestreo de cabeza del 1 por ciento conserva 9 errores y 30 lentas, el muestreo por cola conserva las 2 970 y almacena 3 967 trazas frente a 1 045; con dos recolectores y enrutado aleatorio solo 1,7 por ciento de las trazas llega completa a un mismo recolector, y con cuatro, 0 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="519" fill="#ffffff"/><rect x="10" y="12" width="414" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="217" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="217" dy="0">Política</tspan></text><rect x="430" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="557" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="557" dy="0">Resultado</tspan></text><rect x="690" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="807" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="807" dy="0">Contraste</tspan></text><rect x="10" y="56" width="414" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="85.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Muestreo de cabeza del 1 %: errores conservados</tspan></text><rect x="430" y="56" width="254" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">9 de 976</tspan></text><rect x="690" y="56" width="234" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">0,9 %</tspan></text><rect x="10" y="114" width="414" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="143.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Muestreo de cabeza del 1 %: trazas lentas conservadas</tspan></text><rect x="430" y="114" width="254" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">30 de 1 994</tspan></text><rect x="690" y="114" width="234" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">1,5 %</tspan></text><rect x="10" y="172" width="414" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="201.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Muestreo por cola: errores y lentas conservadas</tspan></text><rect x="430" y="172" width="254" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">2 970 de 2 970</tspan></text><rect x="690" y="172" width="234" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">100 %</tspan></text><rect x="10" y="230" width="414" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="259.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Trazas almacenadas por 100 000 (cabeza frente a cola)</tspan></text><rect x="430" y="230" width="254" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">1 045 frente a 3 967</tspan></text><rect x="690" y="230" width="234" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">3,8 veces más</tspan></text><rect x="10" y="288" width="414" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="317.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Trazas completas con dos recolectores y enrutado aleatorio</tspan></text><rect x="430" y="288" width="254" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="317.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">1,7 %</tspan></text><rect x="690" y="288" width="234" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="309.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">Con hash del identificador: 100</tspan></text><text x="807" y="325.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">%</tspan></text><rect x="10" y="346" width="414" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="217" y="367.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">Trazas completas con cuatro recolectores y enrutado</tspan></text><text x="217" y="383.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="217" dy="0">aleatorio</tspan></text><rect x="430" y="346" width="254" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="375.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">0,0 %</tspan></text><rect x="690" y="346" width="234" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="367.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">Con hash del identificador: 100</tspan></text><text x="807" y="383.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">%</tspan></text><rect x="10" y="408" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="432.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El muestreo por cola decide con la traza entera, así que exige que todos los spans de una traza lleguen al mismo recolector</tspan></text><text x="470" y="449.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">(enrutado por hash del identificador) y memoria para retenerlos mientras se decide. Las proporciones de 1 % de errores y 2</tspan></text><text x="470" y="466.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">% de lentas son supuestos del autor.</tspan></text><text x="470" y="505.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
