<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 519" width="940" height="519" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Composición de dependencias en serie y meses que incumplen un SLO y un SLA según la duración de los incidentes</title><desc id="d">Tabla: cinco dependencias de 99,9 por ciento en serie dan 99,501 por ciento; con 1,2 incidentes al mes de duración mediana de 20 minutos, 30,9 por ciento de los meses incumple un objetivo de 99,9 por ciento y 1,72 incumple uno de 99,5; con duración mediana de 10 minutos esas cifras bajan a 13,9 y 0,2.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="519" fill="#ffffff"/><rect x="10" y="12" width="304" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="162" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="162" dy="0">Caso</tspan></text><rect x="320" y="12" width="334" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="487" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="487" dy="0">Resultado</tspan></text><rect x="660" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="792" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="792" dy="0">Lectura</tspan></text><rect x="10" y="56" width="304" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="85.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">1 dependencias de 99,9 %</tspan></text><rect x="320" y="56" width="334" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">99,900 %</tspan></text><rect x="660" y="56" width="264" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">Producto de disponibilidades</tspan></text><rect x="10" y="114" width="304" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="143.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">3 dependencias de 99,9 %</tspan></text><rect x="320" y="114" width="334" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">99,700 %</tspan></text><rect x="660" y="114" width="264" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">Producto de disponibilidades</tspan></text><rect x="10" y="172" width="304" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="201.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">5 dependencias de 99,9 %</tspan></text><rect x="320" y="172" width="334" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">99,501 %</tspan></text><rect x="660" y="172" width="264" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">Producto de disponibilidades</tspan></text><rect x="10" y="230" width="304" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="259.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">8 dependencias de 99,9 %</tspan></text><rect x="320" y="230" width="334" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">99,203 %</tspan></text><rect x="660" y="230" width="264" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">Producto de disponibilidades</tspan></text><rect x="10" y="288" width="304" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="317.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">Incidentes de duración mediana 20 min</tspan></text><rect x="320" y="288" width="334" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="317.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">SLO 99,9 %: incumple 30,9 % de los meses</tspan></text><rect x="660" y="288" width="264" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="317.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">SLA 99,5 %: 1,72 %</tspan></text><rect x="10" y="346" width="304" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="375.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">Incidentes de duración mediana 10 min</tspan></text><rect x="320" y="346" width="334" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="375.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">SLO 99,9 %: incumple 13,9 % de los meses</tspan></text><rect x="660" y="346" width="264" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="375.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">SLA 99,5 %: 0,20 %</tspan></text><rect x="10" y="408" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="432.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Un SLO de 99,9 % con tres o más dependencias del mismo nivel ya es optimista, y un SLA más holgado que el SLO deja margen</tspan></text><text x="470" y="449.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">para el contrato y no para la ingeniería. Dos incidentes de 20 minutos agotan el mes entero. 20 000 meses simulados; 1,2</tspan></text><text x="470" y="466.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">incidentes por mes y la forma lognormal son supuestos del autor.</tspan></text><text x="470" y="505.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
