<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 450" width="940" height="450" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un presupuesto de error del 99,9 % mensual medido por peticiones y por minutos en tres incidentes</title><desc id="d">Barras horizontales con el presupuesto mensual consumido por tres incidentes según se cuente por peticiones o por minutos: un corte total de 30 minutos a las 03:00 consume 8,6 por ciento por peticiones y 69,4 por minutos; el mismo corte a las 14:00 consume 166 por ciento por peticiones y 69,4 por minutos; 5 por ciento de errores durante 8 horas consume 121 por peticiones y 1 111 por minutos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="450" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un presupuesto de error del 99,9 % mensual medido por peticiones y por minutos en tres incidentes</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Presupuesto por peticiones</tspan></text><rect x="260.04" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="280.04" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="280.04" dy="0">Presupuesto por minutos</tspan></text><line x1="324" y1="77" x2="324" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="269" x2="324" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">1</tspan></text><line x1="457.895" y1="77" x2="457.895" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="457.895" y1="269" x2="457.895" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="457.895" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457.895" dy="0">10</tspan></text><line x1="591.79" y1="77" x2="591.79" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="591.79" y1="269" x2="591.79" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="591.79" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="591.79" dy="0">100</tspan></text><line x1="725.685" y1="77" x2="725.685" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="725.685" y1="269" x2="725.685" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="725.685" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="725.685" dy="0">1 000</tspan></text><line x1="859.58" y1="77" x2="859.58" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="859.58" y1="269" x2="859.58" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="859.58" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="859.58" dy="0">10 000</tspan></text><line x1="324" y1="269" x2="859.58" y2="269" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="113.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">corte total de 30 min a las 03:00</tspan></text><text x="314" y="177.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">corte total de 30 min a las 14:00</tspan></text><text x="314" y="233" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">5 % de errores durante 8 h desde las</tspan></text><text x="314" y="250" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">09:00</tspan></text><rect x="324" y="83" width="125.125" height="24.5" rx="3" fill="#c0432f"/><text x="456.125" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="456.125" dy="0">8,6</tspan></text><rect x="324" y="110.5" width="246.549" height="24.5" rx="3" fill="#087f8c"/><text x="577.549" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="577.549" dy="0">69,4</tspan></text><rect x="324" y="147" width="297.261" height="24.5" rx="3" fill="#c0432f"/><text x="628.261" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="628.261" dy="0">166,0</tspan></text><rect x="324" y="174.5" width="246.549" height="24.5" rx="3" fill="#087f8c"/><text x="577.549" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="577.549" dy="0">69,4</tspan></text><rect x="324" y="211" width="278.875" height="24.5" rx="3" fill="#c0432f"/><text x="609.875" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="609.875" dy="0">121,0</tspan></text><rect x="324" y="238.5" width="407.811" height="24.5" rx="3" fill="#087f8c"/><text x="738.811" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="738.811" dy="0">1 111,1</tspan></text><line x1="591.79" y1="77" x2="591.79" y2="269" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="596.79" y="90" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="596.79" dy="0">presupuesto agotado</tspan></text><text x="591.79" y="313" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="591.79" dy="0">Presupuesto de error consumido (%) (escala logarítmica)</tspan></text><rect x="10" y="327" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="351.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Contar por peticiones pondera el daño por las personas afectadas; contar minutos malos no distingue el tráfico y, con un</tspan></text><text x="470" y="368.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">umbral de 1 %, trata como minuto perdido uno con 5 % de errores. El tráfico (5 por segundo de noche, hasta 100 de día) y</tspan></text><text x="470" y="385.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">los 43,2 minutos mensuales del 99,9 % son el marco del autor.</tspan></text><text x="470" y="432.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
