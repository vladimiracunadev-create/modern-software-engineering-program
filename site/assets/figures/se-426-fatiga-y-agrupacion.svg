<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 362" width="940" height="362" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Fatiga de alertas: páginas por 200 incidentes en cascada y 3 000 destellos según la política de filtrado</title><desc id="d">Barras horizontales con las páginas que genera cada política: 7 881 sin filtros, 1 735 con una duración mínima antes de paginar y 308 con duración mínima y agrupación por incidente.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="362" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Fatiga de alertas: páginas por 200 incidentes en cascada y 3 000 destellos según la política de filtrado</tspan></text><line x1="334" y1="49" x2="334" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="334" y1="181" x2="334" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="334" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="334" dy="0">0</tspan></text><line x1="469.425" y1="49" x2="469.425" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="469.425" y1="181" x2="469.425" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="469.425" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="469.425" dy="0">2 000</tspan></text><line x1="604.85" y1="49" x2="604.85" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="604.85" y1="181" x2="604.85" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="604.85" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="604.85" dy="0">4 000</tspan></text><line x1="740.275" y1="49" x2="740.275" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="740.275" y1="181" x2="740.275" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="740.275" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="740.275" dy="0">6 000</tspan></text><line x1="875.7" y1="49" x2="875.7" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="181" x2="875.7" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">8 000</tspan></text><line x1="334" y1="181" x2="875.7" y2="181" stroke="#5b7280" stroke-width="1.6"/><text x="324" y="67" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="324" dy="0">Sin filtros: cada alerta de cada servicio</tspan></text><text x="324" y="84" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="324" dy="0">pagina</tspan></text><text x="324" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="324" dy="0">Con duración mínima antes de paginar</tspan></text><text x="324" y="155" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="324" dy="0">Con duración mínima y agrupación por</tspan></text><text x="324" y="172" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="324" dy="0">incidente</tspan></text><rect x="334" y="55" width="533.642" height="32" rx="3" fill="#c0432f"/><text x="874.642" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="874.642" dy="0">7 881</tspan></text><rect x="334" y="99" width="117.481" height="32" rx="3" fill="#c0432f"/><text x="458.481" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="458.481" dy="0">1 735</tspan></text><rect x="334" y="143" width="20.8555" height="32" rx="3" fill="#c0432f"/><text x="361.855" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="361.855" dy="0">308</tspan></text><text x="604.85" y="225" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="604.85" dy="0">Páginas</tspan></text><rect x="10" y="239" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="263.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Filtrar no es silenciar: el filtro de duración retrasa la página por construcción y la agrupación exige conocer el mapa de</tspan></text><text x="470" y="280.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">dependencias para saber qué alertas pertenecen al mismo incidente. El 4 % de destellos que sobrevive al filtro es un</tspan></text><text x="470" y="297.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">supuesto del autor.</tspan></text><text x="470" y="344.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
