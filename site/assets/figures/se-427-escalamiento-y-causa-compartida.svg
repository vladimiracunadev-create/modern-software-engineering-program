<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 311" width="940" height="311" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una página con y sin escalamiento: fracción atendida y minutos hasta que alguien responde</title><desc id="d">Tabla: con respuesta de 85 por ciento por persona y fallos independientes, una página sin escalar se atiende 84,8 por ciento de las veces y con tres niveles de cinco minutos 99,8 por ciento en 15 minutos; si 30 por ciento de los fallos comparte causa, esas cifras son 59,9 y 96,9 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="311" fill="#ffffff"/><rect x="10" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Escenario</tspan></text><rect x="390" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="457" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="457" dy="0">Sin escalar</tspan></text><rect x="530" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="622" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="622" dy="0">Tres niveles (15 min)</tspan></text><rect x="720" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="822" y="26.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="822" dy="0">Mediana / p99 hasta</tspan></text><text x="822" y="42.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="822" dy="0">atender</tspan></text><rect x="10" y="56" width="374" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="91.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">fallos independientes</tspan></text><rect x="390" y="56" width="134" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="91.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">84,8 %</tspan></text><rect x="530" y="56" width="184" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="91.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">99,8 %</tspan></text><rect x="720" y="56" width="204" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="91.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">2,9 / 12,8 min</tspan></text><rect x="10" y="126" width="374" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="161.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">30 % comparten causa (misma zona sin red)</tspan></text><rect x="390" y="126" width="134" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="161.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">59,9 %</tspan></text><rect x="530" y="126" width="184" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="161.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">96,9 %</tspan></text><rect x="720" y="126" width="204" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="161.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">4,0 / 14,8 min</tspan></text><rect x="10" y="200" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="224.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El escalamiento protege contra el olvido y el sueño; no protege contra una causa compartida entre niveles (la misma zona</tspan></text><text x="470" y="241.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">sin red, el mismo canal de aviso). Las probabilidades de 85 %, 85 % y 90 % por nivel y el 30 % de causa compartida son</tspan></text><text x="470" y="258.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">supuestos del autor, no mediciones de ninguna herramienta de guardia.</tspan></text><text x="470" y="297.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
