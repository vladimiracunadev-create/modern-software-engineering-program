<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 550" width="940" height="550" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres estilos de prueba frente a tres refactorizaciones neutras y un defecto real del servicio</title><desc id="d">Barras agrupadas: ante tres refactorizaciones que no cambian lo que el servicio hace, la prueba con asertos sobre las llamadas falla dos veces y la que además fija las consultas falla una; la prueba de estado con un doble espía no falla ninguna; las tres detectan el defecto real.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="550" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Tres estilos de prueba frente a tres refactorizaciones neutras y un defecto real del servicio</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Falsa alarma ante un refactor neutro (de 3)</tspan></text><rect x="388.22" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="408.22" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="408.22" dy="0">Detecta el defecto real (de 1)</tspan></text><line x1="63.54" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="375" x2="63.54" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">0</tspan></text><line x1="63.54" y1="281.667" x2="920" y2="281.667" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="281.667" x2="63.54" y2="281.667" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="286.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">1</tspan></text><line x1="63.54" y1="188.333" x2="920" y2="188.333" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="188.333" x2="63.54" y2="188.333" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="192.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">2</tspan></text><line x1="63.54" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="95" x2="63.54" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">3</tspan></text><line x1="63.54" y1="95" x2="63.54" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">versiones del servicio</text><rect x="92.0887" y="188.333" width="112.195" height="186.667" rx="3" fill="#c0432f"/><text x="148.186" y="182.333" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="148.186" dy="0">2</tspan></text><rect x="208.283" y="281.667" width="112.195" height="93.3333" rx="3" fill="#087f8c"/><text x="264.381" y="275.667" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="264.381" dy="0">1</tspan></text><text x="206.283" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="206.283" dy="0">Mock con asertos de llamadas</tspan></text><rect x="377.575" y="281.667" width="112.195" height="93.3333" rx="3" fill="#c0432f"/><text x="433.673" y="275.667" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="433.673" dy="0">1</tspan></text><rect x="493.77" y="281.667" width="112.195" height="93.3333" rx="3" fill="#087f8c"/><text x="549.867" y="275.667" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="549.867" dy="0">1</tspan></text><text x="491.77" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="491.77" dy="0">Mock más consultas exactas</tspan></text><rect x="663.062" y="373" width="112.195" height="2" rx="3" fill="#c0432f"/><text x="719.159" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="719.159" dy="0">0</tspan></text><rect x="779.257" y="281.667" width="112.195" height="93.3333" rx="3" fill="#087f8c"/><text x="835.354" y="275.667" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="835.354" dy="0">1</tspan></text><text x="777.257" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777.257" dy="0">Estado con espía</tspan></text><rect x="10" y="427" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Dos de tres refactorizaciones rompen la prueba acoplada a la interacción sin que haya un defecto. La prueba de estado</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">comprueba qué se envió y a quién, no cómo. Esto no vuelve inútiles los mocks: verifican que se produzca un efecto cuando el</tspan></text><text x="470" y="485.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">efecto es lo único observable.</tspan></text><text x="470" y="532.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos y modelos del autor con semilla fija; Windows (CPython 3.12.9) y Ubuntu (WSL2, 3.12.3) con cifras idénticas salvo donde se indica.</tspan></text></svg>
