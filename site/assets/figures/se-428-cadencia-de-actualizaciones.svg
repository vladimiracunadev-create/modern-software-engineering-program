<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 421" width="940" height="421" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cadencia de actualizaciones de estado: preguntas que recibe la persona al mando según la política</title><desc id="d">Tabla: sin cadencia la persona al mando recibe 32,9 preguntas por incidente y gasta 98,7 minutos entre responderlas; actualizar cada 30 minutos baja las preguntas a 10,1 y el gasto a 42,4 minutos, el mínimo; actualizar cada 5 minutos deja 6,1 preguntas y el gasto sube a 102,9 minutos por las 21,1 actualizaciones.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="421" fill="#ffffff"/><rect x="10" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="137" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="137" dy="0">Política de actualización</tspan></text><rect x="270" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="372" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="372" dy="0">Preguntas por incidente</tspan></text><rect x="480" y="12" width="174" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="567" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="567" dy="0">Actualizaciones</tspan></text><rect x="660" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="792" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="792" dy="0">Minutos de la persona al mando</tspan></text><rect x="10" y="56" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">Sin cadencia</tspan></text><rect x="270" y="56" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="372" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372" dy="0">32,9</tspan></text><rect x="480" y="56" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="567" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="567" dy="0">0,0</tspan></text><rect x="660" y="56" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">98,7 min</tspan></text><rect x="10" y="106" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">Cada 60 min</tspan></text><rect x="270" y="106" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="372" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372" dy="0">14,8</tspan></text><rect x="480" y="106" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="567" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="567" dy="0">1,3</tspan></text><rect x="660" y="106" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">49,4 min</tspan></text><rect x="10" y="156" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">Cada 30 min</tspan></text><rect x="270" y="156" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="372" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372" dy="0">10,1</tspan></text><rect x="480" y="156" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="567" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="567" dy="0">3,0</tspan></text><rect x="660" y="156" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">42,4 min</tspan></text><rect x="10" y="206" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">Cada 15 min</tspan></text><rect x="270" y="206" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="372" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372" dy="0">7,6</tspan></text><rect x="480" y="206" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="567" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="567" dy="0">6,5</tspan></text><rect x="660" y="206" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">49,1 min</tspan></text><rect x="10" y="256" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">Cada 5 min</tspan></text><rect x="270" y="256" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="372" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372" dy="0">6,1</tspan></text><rect x="480" y="256" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="567" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="567" dy="0">21,1</tspan></text><rect x="660" y="256" width="264" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">102,9 min</tspan></text><rect x="10" y="310" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="334.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Hay una cadencia que minimiza el coste y no es la más frecuente: cada actualización cuesta 4 minutos y cada pregunta 3. La</tspan></text><text x="470" y="351.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">tasa de preguntas que crece con la antigüedad de la última noticia y la duración mediana de 90 minutos son supuestos del</tspan></text><text x="470" y="368.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">autor; el óptimo real depende de a quién se informa y de cómo.</tspan></text><text x="470" y="407.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
