<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 451" width="940" height="451" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dos mil incidentes sintéticos: de qué se compone el tiempo hasta resolver y cuánto varía su media entre trimestres</title><desc id="d">Tabla: en 2 000 incidentes sintéticos la media del tiempo hasta resolver es 73,5 minutos, la mediana 58,9, el percentil 90 es 125,6 y el 99 es 259,8; el diagnóstico aporta 40,6 minutos de la media; la media de un trimestre de 30 incidentes varía de 59,9 a 91,1 minutos sin cambiar la práctica; reducir a la mitad la mediana del diagnóstico baja la media a 53,6 minutos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="451" fill="#ffffff"/><rect x="10" y="12" width="394" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="207" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="207" dy="0">Medida</tspan></text><rect x="410" y="12" width="514" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="667" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="667" dy="0">Resultado</tspan></text><rect x="10" y="56" width="394" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="83.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Tiempo total hasta resolver: media / mediana / p90 /</tspan></text><text x="207" y="99.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">p99</tspan></text><rect x="410" y="56" width="514" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="667" y="91.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667" dy="0">73,5 / 58,9 / 125,6 / 259,8 min</tspan></text><rect x="10" y="126" width="394" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="161.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Reparto de la media por tramo</tspan></text><rect x="410" y="126" width="514" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="667" y="153.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667" dy="0">detección 8,8, reconocimiento 3,4, diagnóstico 40,6, mitigación 15,4,</tspan></text><text x="667" y="169.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667" dy="0">verificación 5,4 min</tspan></text><rect x="10" y="196" width="394" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="223.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Media de un trimestre de 30 incidentes (p5 a p95 de 4</tspan></text><text x="207" y="239.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">000 trimestres)</tspan></text><rect x="410" y="196" width="514" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="667" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667" dy="0">de 59,9 a 91,1 min con la misma práctica</tspan></text><rect x="10" y="266" width="394" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="293.68" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Media si se reduce a la mitad la mediana de la</tspan></text><text x="207" y="309.04" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">detección / el diagnóstico / la mitigación</tspan></text><rect x="410" y="266" width="514" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="667" y="301.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667" dy="0">68,9 / 53,6 / 65,6 min</tspan></text><rect x="10" y="340" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="364.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Comparar la media de dos trimestres con 30 incidentes cada uno confunde azar y mejora: la diferencia entre p5 y p95 (31</tspan></text><text x="470" y="381.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">minutos) es mayor que la mejora que produce adelantar la detección. Las medianas y dispersiones de cada tramo son supuestos</tspan></text><text x="470" y="398.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">del autor, no mediciones.</tspan></text><text x="470" y="437.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
