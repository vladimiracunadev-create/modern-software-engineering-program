<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 658" width="940" height="658" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">374 defectos de accesibilidad plantados en 30 páginas sintéticas: quién puede decidirlos</title><desc id="d">Barras apiladas horizontales de diez clases de defecto: las seis primeras las decide una regla automática y suman 223 de los 374 defectos (59,6 por ciento); las cuatro últimas necesitan a una persona y suman 151.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="658" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">374 defectos de accesibilidad plantados en 30 páginas sintéticas: quién puede decidirlos</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Decide una regla (6 clases, 223)</tspan></text><rect x="305.28" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="325.28" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="325.28" dy="0">Decide una persona (4 clases, 151)</tspan></text><line x1="324" y1="77" x2="324" y2="477" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="477" x2="324" y2="482" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="498" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="434.34" y1="77" x2="434.34" y2="477" stroke="#d5dde1" stroke-width="1"/><line x1="434.34" y1="