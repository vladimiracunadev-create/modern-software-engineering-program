stroke="#087f8c" stroke-width="1.6"/><text x="470" y="559.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">El 59,6 % depende de las clases que el autor eligió y de cuántas plantó de cada una, no es una tasa de la web real. El</tspan></text><text x="470" y="576.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">hecho que se conserva es cuáles clases son decidibles por una regla (un contraste se calcula con la fórmula de WCAG) y</tspan></text><text x="470" y="593.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">cuáles exigen juicio (si un texto alternativo describe la imagen).</tspan></text><text x="470" y="640.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos y modelos del autor con semilla fija; Windows (CPython 3.12.9) y Ubuntu (WSL2, 3.12.3) con cifras idénticas salvo donde se indica.</tspan></text></svg>
