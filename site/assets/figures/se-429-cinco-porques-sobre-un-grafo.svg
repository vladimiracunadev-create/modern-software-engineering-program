<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 571" width="940" height="571" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cinco porqués sobre un grafo de 12 factores: causas raíz distintas que declaran 400 analistas y fracción del grafo que ven</title><desc id="d">Tabla: sobre el mismo grafo de 12 factores contribuyentes, 400 analistas que siguen cada uno una cadena de porqués declaran 6 causas raíz distintas; una cadena recorre en promedio 24 por ciento de los factores y cuatro analistas independientes cubren 61,3 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="571" fill="#ffffff"/><rect x="10" y="12" width="484" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="252" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="252" dy="0">Resultado</tspan></text><rect x="500" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="602" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="602" dy="0">Frecuencia</tspan></text><rect x="710" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="817" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="817" dy="0">Contexto</tspan></text><rect x="10" y="56" width="484" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="252" y="81.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="252" dy="0">Raíz declarada: pipeline sin etapa de humo</tspan></text><rect x="500" y="56" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">110 de 400 analistas</tspan></text><rect x="710" y="56" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="81.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">28 %</tspan></text><rect x="10" y="106" width="484" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="252" y="131.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="252" dy="0">Raíz declarada: presión por el plazo</tspan></text><rect x="500" y="106" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">101 de 400 analistas</tspan></text><rect x="710" y="106" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="131.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">25 %</tspan></text><rect x="10" y="156" width="484" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="252" y="181.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="252" dy="0">Raíz declarada: guardia de una sola persona</tspan></text><rect x="500" y="156" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">52 de 400 analistas</tspan></text><rect x="710" y="156" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="181.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">13 %</tspan></text><rect x="10" y="206" width="484" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="252" y="231.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="252" dy="0">Raíz declarada: documentación desactualizada</tspan></text><rect x="500" y="206" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">48 de 400 analistas</tspan></text><rect x="710" y="206" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="231.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">12 %</tspan></text><rect x="10" y="256" width="484" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="252" y="281.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="252" dy="0">Raíz declarada: sin automatización</tspan></text><rect x="500" y="256" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="281.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">45 de 400 analistas</tspan></text><rect x="710" y="256" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="281.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">11 %</tspan></text><rect x="10" y="306" width="484" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="252" y="331.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="252" dy="0">Raíz declarada: fatiga de alertas</tspan></text><rect x="500" y="306" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="331.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">44 de 400 analistas</tspan></text><rect x="710" y="306" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="331.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">11 %</tspan></text><rect x="10" y="356" width="484" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="252" y="381.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="252" dy="0">Factores contribuyentes que recorre una cadena de «cinco porqués»</tspan></text><rect x="500" y="356" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="381.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">24,0 %</tspan></text><rect x="710" y="356" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="381.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">De los 12 factores del grafo</tspan></text><rect x="10" y="406" width="484" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="252" y="431.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="252" dy="0">Factores cubiertos por cuatro analistas independientes</tspan></text><rect x="500" y="406" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="431.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">61,3 %</tspan></text><rect x="710" y="406" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="431.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">Unión de cuatro cadenas</tspan></text><rect x="10" y="460" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="484.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Una cadena lineal sobre un sistema con causas que convergen produce una causa raíz que depende de qué rama se eligió</tspan></text><text x="470" y="501.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">primero, no de qué pasó. El grafo (un síntoma, 12 factores y 12 aristas) es un caso construido por el autor para la clase;</tspan></text><text x="470" y="518.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">su forma, no sus nombres, es el punto.</tspan></text><text x="470" y="557.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
