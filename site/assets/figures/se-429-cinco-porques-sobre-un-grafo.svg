<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 458" width="940" height="458" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cinco porqués sobre un grafo de 12 factores: causas raíz distintas que declaran 400 analistas</title><desc id="d">Barras horizontales con los analistas, de 400, que declaran cada causa raíz tras seguir una cadena de porqués sobre el mismo grafo de 12 factores contribuyentes: aparecen 6 causas raíz distintas; una cadena recorre en promedio 24,0 % de los factores y cuatro analistas independientes cubren 61,3 %.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="458" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cinco porqués sobre un grafo de 12 factores: causas raíz distintas que declaran 400 analistas</tspan></text><line x1="354" y1="49" x2="354" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="277" x2="354" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="461.564" y1="49" x2="461.564" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="461.564" y1="277" x2="461.564" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="461.564" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="461.564" dy="0">25</tspan></text><line x1="569.128" y1="49" x2="569.128" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="569.128" y1="277" x2="569.128" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="569.128" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="569.128" dy="0">50</tspan></text><line x1="676.692" y1="49" x2="676.692" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="676.692" y1="277" x2="676.692" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="676.692" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="676.692" dy="0">75</tspan></text><line x1="784.256" y1="49" x2="784.256" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="784.256" y1="277" x2="784.256" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="784.256" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="784.256" dy="0">100</tspan></text><line x1="891.82" y1="49" x2="891.82" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="891.82" y1="277" x2="891.82" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="891.82" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="891.82" dy="0">125</tspan></text><line x1="354" y1="277" x2="891.82" y2="277" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Raíz declarada: pipeline sin etapa de humo</tspan></text><text x="344" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Raíz declarada: presión por el plazo</tspan></text><text x="344" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Raíz declarada: guardia de una sola persona</tspan></text><text x="344" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Raíz declarada: documentación desactualizada</tspan></text><text x="344" y="224.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Raíz declarada: sin automatización</tspan></text><text x="344" y="262.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Raíz declarada: fatiga de alertas</tspan></text><rect x="354" y="55" width="473.282" height="26" rx="3" fill="#087f8c"/><text x="834.282" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="834.282" dy="0">110</tspan></text><rect x="354" y="93" width="434.559" height="26" rx="3" fill="#087f8c"/><text x="795.559" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="795.559" dy="0">101</tspan></text><rect x="354" y="131" width="223.733" height="26" rx="3" fill="#087f8c"/><text x="584.733" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="584.733" dy="0">52</tspan></text><rect x="354" y="169" width="206.523" height="26" rx="3" fill="#087f8c"/><text x="567.523" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="567.523" dy="0">48</tspan></text><rect x="354" y="207" width="193.615" height="26" rx="3" fill="#087f8c"/><text x="554.615" y="224.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="554.615" dy="0">45</tspan></text><rect x="354" y="245" width="189.313" height="26" rx="3" fill="#087f8c"/><text x="550.313" y="262.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="550.313" dy="0">44</tspan></text><text x="622.91" y="321" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="622.91" dy="0">Analistas (de 400)</tspan></text><rect x="10" y="335" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="359.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Una cadena lineal sobre un sistema con causas que convergen produce una causa raíz que depende de qué rama se eligió</tspan></text><text x="470" y="376.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">primero, no de qué pasó. El grafo (un síntoma, 12 factores y 12 aristas) es un caso construido por el autor para la clase;</tspan></text><text x="470" y="393.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">su forma, no sus nombres, es el punto.</tspan></text><text x="470" y="440.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
