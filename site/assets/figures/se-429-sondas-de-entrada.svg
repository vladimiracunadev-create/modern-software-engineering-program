<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 661" width="940" height="661" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Seis validadores de un nombre de curso, cada uno con un defecto: sondas dirigidas frente a cadenas aleatorias</title><desc id="d">Barras horizontales: las quince sondas dirigidas detectan el defecto de los seis validadores; quince cadenas aleatorias lo detectan en 2,0 por ciento de las semillas para el que no recorta espacios, 11,0 por ciento para el límite exclusivo y 0 por ciento para los otros cuatro.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="661" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Seis validadores de un nombre de curso, cada uno con un defecto: sondas dirigidas frente a cadenas</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">aleatorias</tspan></text><rect x="16" y="64" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">15 sondas dirigidas</tspan></text><rect x="207.26" y="64" width="12" height="12" rx="2" fill="#c0432f"/><text x="227.26" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="227.26" dy="0">15 cadenas aleatorias (200 semillas)</tspan></text><line x1="314" y1="96" x2="314" y2="480" stroke="#d5dde1" stroke-width="1"/><line x1="314" y1="480" x2="314" y2="485" stroke="#5b7280" stroke-width="1.4"/><text x="314" y="501" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="314" dy="0">0</tspan></text><line x1="454.425" y1="96" x2="454.425" y2="480" stroke="#d5dde1" stroke-width="1"/><line x1="454.425" y1="480" x2="454.425" y2="485" stroke="#5b7280" stroke-width="1.4"/><text x="454.425" y="501" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="454.425" dy="0">25</tspan></text><line x1="594.85" y1="96" x2="594.85" y2="480" stroke="#d5dde1" stroke-width="1"/><line x1="594.85" y1="480" x2="594.85" y2="485" stroke="#5b7280" stroke-width="1.4"/><text x="594.85" y="501" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="594.85" dy="0">50</tspan></text><line x1="735.275" y1="96" x2="735.275" y2="480" stroke="#d5dde1" stroke-width="1"/><line x1="735.275" y1="480" x2="735.275" y2="485" stroke="#5b7280" stroke-width="1.4"/><text x="735.275" y="501" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="735.275" dy="0">75</tspan></text><line x1="875.7" y1="96" x2="875.7" y2="480" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="480" x2="875.7" y2="485" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="501" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">100</tspan></text><line x1="314" y1="480" x2="875.7" y2="480" stroke="#5b7280" stroke-width="1.6"/><text x="304" y="132.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">No recorta espacios</tspan></text><text x="304" y="196.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Límite de 80 exclusivo</tspan></text><text x="304" y="260.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Acepta caracteres de control</tspan></text><text x="304" y="324.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Cuenta bytes en vez de caracteres</tspan></text><text x="304" y="388.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Rechaza caracteres chinos</tspan></text><text x="304" y="444" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Bloquea nombres que empiezan por</tspan></text><text x="304" y="461" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">«admin»</tspan></text><rect x="314" y="102" width="561.7" height="24.5" rx="3" fill="#087f8c"/><text x="882.7" y="118.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100,0</tspan></text><rect x="314" y="129.5" width="11.234" height="24.5" rx="3" fill="#c0432f"/><text x="332.234" y="146.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="332.234" dy="0">2,0</tspan></text><rect x="314" y="166" width="561.7" height="24.5" rx="3" fill="#087f8c"/><text x="882.7" y="182.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100,0</tspan></text><rect x="314" y="193.5" width="61.787" height="24.5" rx="3" fill="#c0432f"/><text x="382.787" y="210.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="382.787" dy="0">11,0</tspan></text><rect x="314" y="230" width="561.7" height="24.5" rx="3" fill="#087f8c"/><text x="882.7" y="246.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100,0</tspan></text><rect x="314" y="257.5" width="2" height="24.5" rx="3" fill="#c0432f"/><text x="323" y="274.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="323" dy="0">0,0</tspan></text><rect x="314" y="294" width="561.7" height="24.5" rx="3" fill="#087f8c"/><text x="882.7" y="310.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100,0</tspan></text><rect x="314" y="321.5" width="2" height="24.5" rx="3" fill="#c0432f"/><text x="323" y="338.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="323" dy="0">0,0</tspan></text><rect x="314" y="358" width="561.7" height="24.5" rx="3" fill="#087f8c"/><text x="882.7" y="374.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100,0</tspan></text><rect x="314" y="385.5" width="2" height="24.5" rx="3" fill="#c0432f"/><text x="323" y="402.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="323" dy="0">0,0</tspan></text><rect x="314" y="422" width="561.7" height="24.5" rx="3" fill="#087f8c"/><text x="882.7" y="438.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100,0</tspan></text><rect x="314" y="449.5" width="2" height="24.5" rx="3" fill="#c0432f"/><text x="323" y="466.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="323" dy="0">0,0</tspan></text><text x="594.85" y="524" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="594.85" dy="0">% de semillas que detectan el defecto (las sondas son deterministas)</tspan></text><rect x="10" y="538" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="562.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las sondas son una lista de criterios (vacío, solo espacios, límites 79/80/81, tildes, control, bidireccional, emoji). Se</tspan></text><text x="470" y="579.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">escribieron conociendo qué defectos suelen existir: una lista incompleta deja pasar los que no anticipa. No sustituyen la</tspan></text><text x="470" y="596.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">exploración, la preparan.</tspan></text><text x="470" y="643.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos y modelos del autor con semilla fija; Windows (CPython 3.12.9) y Ubuntu (WSL2, 3.12.3) con cifras idénticas salvo donde se indica.</tspan></text></svg>
