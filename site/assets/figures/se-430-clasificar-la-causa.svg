<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 498" width="940" height="498" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Clasificar la causa con un historial de 300 ejecuciones: 440 pruebas sintéticas con causa plantada</title><desc id="d">Barras apiladas horizontales: de 440 pruebas con causa conocida, el clasificador por correlaciones acierta 412 (93,6 por ciento); los errores se concentran en la causa mixta, donde confunde 16 de 40 pruebas con una causa de orden, y en las pruebas que fallan tras otra prueba, con 8 errores.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="498" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Clasificar la causa con un historial de 300 ejecuciones: 440 pruebas sintéticas con causa plantada</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Bien clasificadas</tspan></text><rect x="192.18" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="212.18" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="212.18" dy="0">Mal clasificadas</tspan></text><line x1="254" y1="77" x2="254" y2="317" stroke="#d5dde1" stroke-width="1"/><line x1="254" y1="317" x2="254" y2="322" stroke="#5b7280" stroke-width="1.4"/><text x="254" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="254" dy="0">0</tspan></text><line x1="409.425" y1="77" x2="409.425" y2="317" stroke="#d5dde1" stroke-width="1"/><line x1="409.425" y1="317" x2="409.425" y2="322" stroke="#5b7280" stroke-width="1.4"/><text x="409.425" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="409.425" dy="0">50</tspan></text><line x1="564.85" y1="77" x2="564.85" y2="317" stroke="#d5dde1" stroke-width="1"/><line x1="564.85" y1="317" x2="564.85" y2="322" stroke="#5b7280" stroke-width="1.4"/><text x="564.85" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="564.85" dy="0">100</tspan></text><line x1="720.275" y1="77" x2="720.275" y2="317" stroke="#d5dde1" stroke-width="1"/><line x1="720.275" y1="317" x2="720.275" y2="322" stroke="#5b7280" stroke-width="1.4"/><text x="720.275" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="720.275" dy="0">150</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="317" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="317" x2="875.7" y2="322" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">200</tspan></text><line x1="254" y1="317" x2="875.7" y2="317" stroke="#5b7280" stroke-width="1.6"/><text x="244" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">Estable (0,2 % de ruido)</tspan></text><text x="244" y="141.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">Rota (falla 98 %)</tspan></text><text x="244" y="181.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">Falla con carga alta</tspan></text><text x="244" y="221.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">Falla tras otra prueba</tspan></text><text x="244" y="261.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">Azar puro (8 %)</tspan></text><text x="244" y="301.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">Carga y orden a la vez</tspan></text><rect x="254" y="84" width="618.591" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="563.296" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="563.296" dy="0">199</tspan></text><rect x="872.591" y="84" width="3.1085" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">200</tspan></text><rect x="254" y="124" width="124.34" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="316.17" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="316.17" dy="0">40</tspan></text><rect x="378.34" y="124" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="385.34" y="141.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="385.34" dy="0">40</tspan></text><rect x="254" y="164" width="177.184" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="342.592" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="342.592" dy="0">57</tspan></text><rect x="431.184" y="164" width="9.3255" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="447.51" y="181.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="447.51" dy="0">60</tspan></text><rect x="254" y="204" width="130.557" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="319.279" y="221.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="319.279" dy="0">42</tspan></text><rect x="384.557" y="204" width="24.868" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="396.991" y="221.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="396.991" dy="0">8</tspan></text><text x="416.425" y="221.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="416.425" dy="0">50</tspan></text><rect x="254" y="244" width="155.425" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="331.712" y="261.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="331.712" dy="0">50</tspan></text><rect x="409.425" y="244" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="416.425" y="261.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="416.425" dy="0">50</tspan></text><rect x="254" y="284" width="74.604" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="291.302" y="301.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="291.302" dy="0">24</tspan></text><rect x="328.604" y="284" width="49.736" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="353.472" y="301.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="353.472" dy="0">16</tspan></text><text x="385.34" y="301.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="385.34" dy="0">40</tspan></text><text x="564.85" y="361" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="564.85" dy="0">pruebas sintéticas</tspan></text><rect x="10" y="375" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="399.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Con solo 30 ejecuciones el historial no basta (70,9 %); con 100, 85,0 %; con 300, 93,6 %. Las reglas se ajustaron con estos</tspan></text><text x="470" y="416.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">mismos casos, de modo que la exactitud real es desconocida. El hecho que se conserva: la carga y el orden se confunden</tspan></text><text x="470" y="433.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cuando están correlacionados, y solo un experimento que varíe uno de ellos los separa.</tspan></text><text x="470" y="480.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos y modelos del autor con semilla fija; Windows (CPython 3.12.9) y Ubuntu (WSL2, 3.12.3) con cifras idénticas salvo donde se indica.</tspan></text></svg>
