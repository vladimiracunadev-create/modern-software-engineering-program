<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 403" width="940" height="403" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Datos perdidos al fallar en un instante aleatorio según la estrategia de copia y réplica frente a un RPO de 5 minutos</title><desc id="d">Tabla: con copia diaria la pérdida mediana es 719,7 minutos y el máximo 1 440; con copia cada hora la mediana es 30 y el máximo 60; una réplica asíncrona con retraso mediano de 2 segundos pierde una mediana de 0,03 minutos y en el peor caso 5, con 1 por ciento de picos de entre 10 y 300 segundos; un RPO de 5 minutos lo incumple el 99,6 por ciento de las fallas con copia diaria y ninguna con la réplica.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="403" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Estrategia</tspan></text><rect x="340" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="407" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="407" dy="0">Pérdida mediana</tspan></text><rect x="480" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="537" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="537" dy="0">p99</tspan></text><rect x="600" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="662" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="662" dy="0">Máxima</tspan></text><rect x="730" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="827" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="827" dy="0">Incumple RPO de 5 min</tspan></text><rect x="10" y="56" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="85.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Copia diaria</tspan></text><rect x="340" y="56" width="134" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="407" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="407" dy="0">719,7 min</tspan></text><rect x="480" y="56" width="114" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">1 424,5 min</tspan></text><rect x="600" y="56" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">1 440,0 min</tspan></text><rect x="730" y="56" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">99,6 %</tspan></text><rect x="10" y="114" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="143.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Copia cada 6 h</tspan></text><rect x="340" y="114" width="134" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="407" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="407" dy="0">179,8 min</tspan></text><rect x="480" y="114" width="114" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">356,5 min</tspan></text><rect x="600" y="114" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">360,0 min</tspan></text><rect x="730" y="114" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">98,5 %</tspan></text><rect x="10" y="172" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="201.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Copia cada hora</tspan></text><rect x="340" y="172" width="134" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="407" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="407" dy="0">30,0 min</tspan></text><rect x="480" y="172" width="114" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">59,4 min</tspan></text><rect x="600" y="172" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">60,0 min</tspan></text><rect x="730" y="172" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">91,4 %</tspan></text><rect x="10" y="230" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="259.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Réplica asíncrona (retraso medido en minutos)</tspan></text><rect x="340" y="230" width="134" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="407" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="407" dy="0">0,0 min</tspan></text><rect x="480" y="230" width="114" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">0,3 min</tspan></text><rect x="600" y="230" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">5,0 min</tspan></text><rect x="730" y="230" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">0,0 %</tspan></text><rect x="10" y="292" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="316.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El RPO real de una copia periódica es su intervalo, no la mediana; el de una réplica es el peor retraso, no el habitual, y</tspan></text><text x="470" y="333.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">una réplica también copia los errores (un borrado). 20 000 fallas por estrategia; el retraso con 1 % de picos es un</tspan></text><text x="470" y="350.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">supuesto del autor.</tspan></text><text x="470" y="389.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
