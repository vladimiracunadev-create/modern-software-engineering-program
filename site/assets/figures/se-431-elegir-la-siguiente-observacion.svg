<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 345" width="920" height="345" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cómo elegir la siguiente observación para aislar una falla entre diez: tres estrategias sobre 4 000 diagnósticos</title><desc id="d">Tabla: elegir en cada paso la observación que mejor reparte las hipótesis restantes aísla la falla en 3,59 observaciones y coste 4,98; mirar primero lo más barato necesita 6,09 observaciones y coste 8,49; elegir al azar necesita 5,81 observaciones y coste 12,08.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="920" height="345" fill="#ffffff"/><rect x="10" y="12" width="424" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="222" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="222" dy="0">Estrategia</tspan></text><rect x="440" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="572" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="572" dy="0">Observaciones hasta aislar</tspan></text><rect x="710" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="807" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="807" dy="0">Coste medio</tspan></text><rect x="10" y="56" width="424" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Mayor ganancia de información</tspan></text><rect x="440" y="56" width="264" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">3,59</tspan></text><rect x="710" y="56" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">4,98</tspan></text><rect x="10" y="114" width="424" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="143.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">La más barata primero</tspan></text><rect x="440" y="114" width="264" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">6,09</tspan></text><rect x="710" y="114" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">8,49</tspan></text><rect x="10" y="172" width="424" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="222" y="201.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222" dy="0">Al azar</tspan></text><rect x="440" y="172" width="264" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="572" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572" dy="0">5,81</tspan></text><rect x="710" y="172" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="807" dy="0">12,08</tspan></text><rect x="10" y="234" width="900" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="460" y="258.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="460" dy="0">Lo más barato primero no es lo más informativo: mira señales que no separan hipótesis. Los costes de 1 a 4 por</tspan></text><text x="460" y="275.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="460" dy="0">observación y la ausencia de ruido de medida son supuestos del autor; con medidas ruidosas hay que repetir observaciones</tspan></text><text x="460" y="292.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="460" dy="0">y la ventaja de elegir bien se reduce.</tspan></text><text x="460" y="331.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
