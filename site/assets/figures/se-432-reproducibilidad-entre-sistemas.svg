<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 577" width="940" height="577" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mismo código, dos sistemas: qué se reproduce y qué cambia en Windows 11 y Ubuntu bajo WSL2</title><desc id="d">Tabla: los resultados de tiempo virtual del paquete operativo tienen la misma huella b3d17854ae65d56a en Windows 11 con CPython 3.12.9 y en Ubuntu con 3.12.3; el separador de línea, los bytes escritos como texto, la lectura con la codificación local, el separador de rutas y la distinción de mayúsculas en rutas cambian entre los dos sistemas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="577" fill="#ffffff"/><rect x="10" y="12" width="354" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="187" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="187" dy="0">Sonda</tspan></text><rect x="370" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="452" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="452" dy="0">Windows 11</tspan></text><rect x="540" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="622" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="622" dy="0">Ubuntu (WSL2)</tspan></text><rect x="710" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="817" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="817" dy="0">Resultado</tspan></text><rect x="10" y="56" width="354" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="187" y="85.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="187" dy="0">Huella de los resultados de tiempo virtual</tspan></text><rect x="370" y="56" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">b3d17854ae65d56a</tspan></text><rect x="540" y="56" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">b3d17854ae65d56a</tspan></text><rect x="710" y="56" width="214" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="85.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">Idénticas</tspan></text><rect x="10" y="114" width="354" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="187" y="143.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="187" dy="0">Separador de línea del sistema</tspan></text><rect x="370" y="114" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">\r\n</tspan></text><rect x="540" y="114" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">\n</tspan></text><rect x="710" y="114" width="214" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="143.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">Distinto</tspan></text><rect x="10" y="172" width="354" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="187" y="201.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="187" dy="0">Bytes de «línea» más salto escritos como texto</tspan></text><rect x="370" y="172" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">8</tspan></text><rect x="540" y="172" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">7</tspan></text><rect x="710" y="172" width="214" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="201.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">Distinto</tspan></text><rect x="10" y="230" width="354" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="187" y="259.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="187" dy="0">Caracteres al leer con la codificación local</tspan></text><rect x="370" y="230" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">7</tspan></text><rect x="540" y="230" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="259.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">6</tspan></text><rect x="710" y="230" width="214" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="251.68" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">Distinto (en Windows se lee</tspan></text><text x="817" y="267.04" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">con cp1252)</tspan></text><rect x="10" y="288" width="354" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="187" y="317.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="187" dy="0">Separador de rutas</tspan></text><rect x="370" y="288" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="317.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">\</tspan></text><rect x="540" y="288" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="317.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">/</tspan></text><rect x="710" y="288" width="214" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="317.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">Distinto</tspan></text><rect x="10" y="346" width="354" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="187" y="375.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="187" dy="0">Mayúsculas y minúsculas distintas en una ruta</tspan></text><rect x="370" y="346" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="375.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">No</tspan></text><rect x="540" y="346" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="375.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">Sí</tspan></text><rect x="710" y="346" width="214" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="375.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">Distinto</tspan></text><rect x="10" y="404" width="354" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="187" y="433.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="187" dy="0">Nombre de archivo con eñe conservado</tspan></text><rect x="370" y="404" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="433.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">Sí</tspan></text><rect x="540" y="404" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="622" y="433.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622" dy="0">Sí</tspan></text><rect x="710" y="404" width="214" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="433.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">Idéntico</tspan></text><rect x="10" y="466" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="490.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Un resultado calculado con semilla fija se reproduce en cualquier sistema; todo lo que toca el sistema de archivos o la</tspan></text><text x="470" y="507.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">codificación cambia. Declarar la codificación (utf-8) en cada lectura y escritura evita el caso del texto leído con otra.</tspan></text><text x="470" y="524.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Medición real de los dos sistemas; la huella cubre tres experimentos del paquete.</tspan></text><text x="470" y="563.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido en Windows 11 (CPython 3.12.9) y Ubuntu bajo WSL2 (3.12.3); los tiempos de reloj cambian de equipo en equipo.</tspan></text></svg>
