<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 675" width="940" height="675" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un validador de paquetes operativos frente a 360 mutaciones (doce operadores, treinta paquetes cada uno)</title><desc id="d">Tabla: un validador de referencias cruzadas entre servicios, objetivos, alertas, runbooks, copias y ejercicios detecta 210 de 360 mutaciones; detecta 30 de 30 de siete operadores, entre ellos el servicio sin SLO, la alerta sin runbook, la restauración sin probar y el escalamiento de un nivel, y 0 de 30 del objetivo laxo pero en rango, el RPO incoherente, el ejercicio sin hallazgos, los runbooks intercambiados y el SLI que no mide al usuario.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="675" fill="#ffffff"/><rect x="10" y="12" width="474" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="247" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="247" dy="0">Mutación</tspan></text><rect x="490" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="552" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="552" dy="0">Detectadas</tspan></text><rect x="620" y="12" width="304" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="772" y="34.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="772" dy="0">Resultado</tspan></text><rect x="10" y="56" width="474" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="77.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">Servicio sin slo</tspan></text><rect x="490" y="56" width="124" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="77.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">30 de 30</tspan></text><rect x="620" y="56" width="304" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="77.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">Lo ve la forma</tspan></text><rect x="10" y="98" width="474" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="119.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">Alerta sin slo existente</tspan></text><rect x="490" y="98" width="124" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="119.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">30 de 30</tspan></text><rect x="620" y="98" width="304" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="119.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">Lo ve la forma</tspan></text><rect x="10" y="140" width="474" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="161.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">Alerta sin runbook existente</tspan></text><rect x="490" y="140" width="124" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="161.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">30 de 30</tspan></text><rect x="620" y="140" width="304" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="161.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">Lo ve la forma</tspan></text><rect x="10" y="182" width="474" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="203.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">Restauración sin probar</tspan></text><rect x="490" y="182" width="124" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="203.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">30 de 30</tspan></text><rect x="620" y="182" width="304" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="203.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">Lo ve la forma</tspan></text><rect x="10" y="224" width="474" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="245.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">Restauración mayor que el rto</tspan></text><rect x="490" y="224" width="124" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="245.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">30 de 30</tspan></text><rect x="620" y="224" width="304" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="245.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">Lo ve la forma</tspan></text><rect x="10" y="266" width="474" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="287.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">Sin ejercicio</tspan></text><rect x="490" y="266" width="124" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="287.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">30 de 30</tspan></text><rect x="620" y="266" width="304" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="287.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">Lo ve la forma</tspan></text><rect x="10" y="308" width="474" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="329.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">Escalamiento de un nivel</tspan></text><rect x="490" y="308" width="124" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="329.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">30 de 30</tspan></text><rect x="620" y="308" width="304" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="329.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">Lo ve la forma</tspan></text><rect x="10" y="350" width="474" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="371.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">Objetivo slo laxo pero en rango</tspan></text><rect x="490" y="350" width="124" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="371.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">0 de 30</tspan></text><rect x="620" y="350" width="304" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="371.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">Pasa el validador</tspan></text><rect x="10" y="392" width="474" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="413.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">Rpo incoherente con la copia</tspan></text><rect x="490" y="392" width="124" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="413.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">0 de 30</tspan></text><rect x="620" y="392" width="304" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="413.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">Pasa el validador</tspan></text><rect x="10" y="434" width="474" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="455.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">Ejercicio sin hallazgos que corregir</tspan></text><rect x="490" y="434" width="124" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="455.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">0 de 30</tspan></text><rect x="620" y="434" width="304" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="455.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">Pasa el validador</tspan></text><rect x="10" y="476" width="474" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="497.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">Runbooks intercambiados</tspan></text><rect x="490" y="476" width="124" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="497.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">0 de 30</tspan></text><rect x="620" y="476" width="304" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="497.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">Pasa el validador</tspan></text><rect x="10" y="518" width="474" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="247" y="539.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247" dy="0">Sli que no mide al usuario</tspan></text><rect x="490" y="518" width="124" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="539.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">0 de 30</tspan></text><rect x="620" y="518" width="304" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="539.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">Pasa el validador</tspan></text><rect x="10" y="564" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="588.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Detecta 210 de 360 (58 %), todas por referencias rotas o fechas vencidas. Ninguna de las cinco clases que se escapan viola</tspan></text><text x="470" y="605.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">el formato: son errores de significado. Un paquete coherente consigo mismo no es un sistema operable; los doce operadores y</tspan></text><text x="470" y="622.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">el paquete base son construcciones del autor.</tspan></text><text x="470" y="661.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
