<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 333" width="960" height="333" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">600 solicitudes sintéticas: un clasificador por palabras clave y el acuerdo entre dos revisoras</title><desc id="d">Tabla con 600 solicitudes sintéticas: un clasificador por palabras clave acierta las 456 claras y 74 de las 144 ambiguas, 88,3 por ciento en total, y dos revisoras simuladas coinciden en el 76,8 por ciento con kappa 0,69, pero solo en el 34 por ciento de las ambiguas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="333" fill="#ffffff"/><rect x="10" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="87" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="87" dy="0">Conjunto</tspan></text><rect x="170" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="242" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="242" dy="0">Solicitudes</tspan></text><rect x="320" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="467" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="467" dy="0">Aciertos del clasificador</tspan></text><rect x="620" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="782" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="782" dy="0">Acuerdo entre dos revisoras</tspan></text><rect x="10" y="56" width="154" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="87" y="83.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="87" dy="0">Claras</tspan></text><rect x="170" y="56" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="242" dy="0">456</tspan></text><rect x="320" y="56" width="294" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="467" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">456 (100 %)</tspan></text><rect x="620" y="56" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">—</tspan></text><rect x="10" y="110" width="154" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="87" y="137.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="87" dy="0">Ambiguas</tspan></text><rect x="170" y="110" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="242" dy="0">144</tspan></text><rect x="320" y="110" width="294" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="467" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">74 (51 %)</tspan></text><rect x="620" y="110" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">34 %</tspan></text><rect x="10" y="164" width="154" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="87" y="191.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="87" dy="0">Todas</tspan></text><rect x="170" y="164" width="144" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="242" dy="0">600</tspan></text><rect x="320" y="164" width="294" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="467" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">530 (88,3 %)</tspan></text><rect x="620" y="164" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">76,8 % (kappa 0,69)</tspan></text><rect x="10" y="222" width="940" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="246.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">El acierto global del 88 % esconde que una cuarta parte de la cartera es ambigua y que ahí el acuerdo entre personas es del 34</tspan></text><text x="480" y="263.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">%. Esas solicitudes necesitan una conversación con quien las pidió. La proporción de ambiguas y las tasas de las revisoras son</tspan></text><text x="480" y="280.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">supuestos del autor.</tspan></text><text x="480" y="319.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
