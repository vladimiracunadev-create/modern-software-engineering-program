<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 317" width="980" height="317" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres criterios para elegir 30 de 300 archivos en un historial sintético de 4 000 commits</title><desc id="d">Tabla con tres criterios para elegir los 30 archivos de 300 en un historial sintético de 4 000 commits: el tamaño captura 23,5 por ciento de las correcciones y coincide con 11 de los 30 más corregidos, la frecuencia de cambio 51,7 por ciento y 19, y el producto de ambas 55,6 por ciento y 22.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="317" fill="#ffffff"/><rect x="10" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="142" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="142" dy="0">Criterio de ranking</tspan></text><rect x="280" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="377" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="377" dy="0">Commits en los 30</tspan></text><rect x="480" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="587" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="587" dy="0">Correcciones en los 30</tspan></text><rect x="700" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="832" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="832" dy="0">Coincide con los 30 más</tspan></text><text x="832" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="832" dy="0">corregidos</tspan></text><rect x="10" y="56" width="264" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="83.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">Solo tamaño</tspan></text><rect x="280" y="56" width="194" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="377" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="377" dy="0">10,3 %</tspan></text><rect x="480" y="56" width="214" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587" dy="0">23,5 %</tspan></text><rect x="700" y="56" width="264" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">11 de 30</tspan></text><rect x="10" y="110" width="264" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="137.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">Solo frecuencia de cambio</tspan></text><rect x="280" y="110" width="194" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="377" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="377" dy="0">55,9 %</tspan></text><rect x="480" y="110" width="214" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587" dy="0">51,7 %</tspan></text><rect x="700" y="110" width="264" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">19 de 30</tspan></text><rect x="10" y="164" width="264" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="191.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">Frecuencia × tamaño</tspan></text><rect x="280" y="164" width="194" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="377" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="377" dy="0">53,3 %</tspan></text><rect x="480" y="164" width="214" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587" dy="0">55,6 %</tspan></text><rect x="700" y="164" width="264" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">22 de 30</tspan></text><rect x="10" y="222" width="960" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="490" y="246.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">El 10 % de los archivos concentra más de la mitad de los commits y de las correcciones. Ordenar por tamaño apenas supera al azar;</tspan></text><text x="490" y="263.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">el producto captura el 55,6 % de las correcciones. La relación entre tamaño y correcciones es un supuesto del autor.</tspan></text><text x="490" y="303.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
