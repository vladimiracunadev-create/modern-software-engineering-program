<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 521" width="940" height="521" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres criterios para elegir 30 de 300 archivos en un historial sintético de 4 000 commits</title><desc id="d">Barras agrupadas con la parte de commits y de correcciones que caen en los 30 archivos elegidos: solo por tamaño, 10,3 y 23,5 por ciento; por frecuencia de cambio, 55,9 y 51,7; por frecuencia por tamaño, 53,3 y 55,6; los criterios coinciden con 11, 19 y 22 de los 30 archivos más corregidos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="521" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Tres criterios para elegir 30 de 300 archivos en un historial sintético de 4 000 commits</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Commits en los 30 archivos</tspan></text><rect x="260.04" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="280.04" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="280.04" dy="0">Correcciones en los 30 archivos</tspan></text><line x1="71.08" y1="345" x2="920" y2="345" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="345" x2="71.08" y2="345" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="349.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="282.5" x2="920" y2="282.5" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="282.5" x2="71.08" y2="282.5" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="287" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="220" x2="920" y2="220" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="220" x2="71.08" y2="220" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="224.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">40</tspan></text><line x1="71.08" y1="157.5" x2="920" y2="157.5" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="157.5" x2="71.08" y2="157.5" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="162" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">60</tspan></text><line x1="71.08" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="95" x2="71.08" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">80</tspan></text><line x1="71.08" y1="95" x2="71.08" y2="345" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="220" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 220)">% del total</text><rect x="99.3773" y="312.812" width="111.189" height="32.1875" rx="3" fill="#946512"/><text x="154.972" y="306.812" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="154.972" dy="0">10,3 %</tspan></text><rect x="214.567" y="271.562" width="111.189" height="73.4375" rx="3" fill="#087f8c"/><text x="270.161" y="265.562" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="270.161" dy="0">23,5 %</tspan></text><text x="212.567" y="366" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="212.567" dy="0">Solo tamaño (coincide con 11 de los</tspan></text><text x="212.567" y="383" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="212.567" dy="0">30 más corregidos)</tspan></text><rect x="382.351" y="170.312" width="111.189" height="174.688" rx="3" fill="#946512"/><text x="437.945" y="164.312" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="437.945" dy="0">55,9 %</tspan></text><rect x="497.54" y="183.438" width="111.189" height="161.562" rx="3" fill="#087f8c"/><text x="553.135" y="177.438" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="553.135" dy="0">51,7 %</tspan></text><text x="495.54" y="366" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="495.54" dy="0">Solo frecuencia de cambio (19 de 30)</tspan></text><rect x="665.324" y="178.438" width="111.189" height="166.562" rx="3" fill="#946512"/><text x="720.919" y="172.438" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="720.919" dy="0">53,3 %</tspan></text><rect x="780.513" y="171.25" width="111.189" height="173.75" rx="3" fill="#087f8c"/><text x="836.108" y="165.25" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="836.108" dy="0">55,6 %</tspan></text><text x="778.513" y="366" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="778.513" dy="0">Frecuencia × tamaño (22 de 30)</tspan></text><rect x="10" y="414" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="438.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El 10 % de los archivos concentra más de la mitad de los commits y de las correcciones. Ordenar por tamaño apenas supera al</tspan></text><text x="470" y="455.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">azar; el producto captura el 55,6 % de las correcciones. La relación entre tamaño y correcciones es un supuesto del autor.</tspan></text><text x="470" y="503.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
