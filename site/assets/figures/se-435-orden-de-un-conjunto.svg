<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 401" width="920" height="401" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El mismo programa con seis alumnos en un conjunto, en ocho procesos con semilla de hash distinta</title><desc id="d">Tabla con tres de las ocho salidas del mismo programa con seis alumnos ejecutado con semillas de hash 1, 2 y 3, todas distintas entre sí, y el resultado de ordenar antes de escribir: una sola salida para los ocho procesos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="920" height="401" fill="#ffffff"/><rect x="10" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="157" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="157" dy="0">Semilla de hash</tspan></text><rect x="310" y="12" width="594" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="607" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="607" dy="0">Salida</tspan></text><rect x="10" y="56" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">1</tspan></text><rect x="310" y="56" width="594" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="607" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607" dy="0">pedro,marta,sofia,tomas,luis,ana</tspan></text><rect x="10" y="102" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="125.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">2</tspan></text><rect x="310" y="102" width="594" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="607" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607" dy="0">pedro,marta,tomas,ana,sofia,luis</tspan></text><rect x="10" y="148" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="171.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">3</tspan></text><rect x="310" y="148" width="594" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="607" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607" dy="0">luis,pedro,tomas,sofia,ana,marta</tspan></text><rect x="10" y="194" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="217.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Las ocho</tspan></text><rect x="310" y="194" width="594" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="607" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607" dy="0">8 salidas distintas</tspan></text><rect x="10" y="240" width="294" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="263.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Ordenando antes de escribir</tspan></text><rect x="310" y="240" width="594" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="607" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607" dy="0">1 salida</tspan></text><rect x="10" y="290" width="900" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="460" y="314.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">Un maestro dorado que compare el texto completo falla entre procesos aunque el código sea idéntico. Ordenar elimina la</tspan></text><text x="460" y="331.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">variación solo si el contrato no exige otro orden. El orden de los conjuntos de cadenas depende del intérprete y de su</tspan></text><text x="460" y="348.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">versión.</tspan></text><text x="460" y="387.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="460" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
