<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 437" width="940" height="437" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Servidores necesarios para 1 000 req/s según el objetivo de cola (M/M/1, 50 ms de servicio)</title><desc id="d">Barras horizontales con los servidores que exige cada objetivo de percentil 99: 216 con 300 milisegundos (utilización del 23 por ciento), 93 con 500, 65 con 1 segundo y 57 con 2 segundos, frente a 63 al planificar con la media al 80 por ciento; exigir un percentil en lugar de la media multiplica la flota por 3,4.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="437" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Servidores necesarios para 1 000 req/s según el objetivo de cola (M/M/1, 50 ms de servicio)</tspan></text><line x1="274" y1="49" x2="274" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="239" x2="274" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0</tspan></text><line x1="397.564" y1="49" x2="397.564" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="397.564" y1="239" x2="397.564" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="397.564" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397.564" dy="0">50</tspan></text><line x1="521.128" y1="49" x2="521.128" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="521.128" y1="239" x2="521.128" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="521.128" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="521.128" dy="0">100</tspan></text><line x1="644.692" y1="49" x2="644.692" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="644.692" y1="239" x2="644.692" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="644.692" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="644.692" dy="0">150</tspan></text><line x1="768.256" y1="49" x2="768.256" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="768.256" y1="239" x2="768.256" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="768.256" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="768.256" dy="0">200</tspan></text><line x1="891.82" y1="49" x2="891.82" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="891.82" y1="239" x2="891.82" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="891.82" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="891.82" dy="0">250</tspan></text><line x1="274" y1="239" x2="891.82" y2="239" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">p99 ≤ 300 ms (utilización 23 %)</tspan></text><text x="264" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">p99 ≤ 500 ms (54 %)</tspan></text><text x="264" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">p99 ≤ 1 s (77 %)</tspan></text><text x="264" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">p99 ≤ 2 s (88 %)</tspan></text><text x="264" y="224.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Planificar con la media (80 %)</tspan></text><rect x="274" y="55" width="533.796" height="26" rx="3" fill="#102a43"/><text x="814.796" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="814.796" dy="0">216</tspan></text><rect x="274" y="93" width="229.829" height="26" rx="3" fill="#102a43"/><text x="510.829" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="510.829" dy="0">93</tspan></text><rect x="274" y="131" width="160.633" height="26" rx="3" fill="#102a43"/><text x="441.633" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="441.633" dy="0">65</tspan></text><rect x="274" y="169" width="140.863" height="26" rx="3" fill="#102a43"/><text x="421.863" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="421.863" dy="0">57</tspan></text><rect x="274" y="207" width="155.691" height="26" rx="3" fill="#102a43"/><text x="436.691" y="224.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="436.691" dy="0">63</tspan></text><text x="582.91" y="283" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="582.91" dy="0">Servidores para 1 000 solicitudes por segundo</tspan></text><rect x="10" y="297" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="321.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Exigir un percentil, no una media, multiplica por 3,4 la flota: la elección del estadístico es una decisión de costo.</tspan></text><text x="470" y="338.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Aparte, agregar percentiles es un error: el promedio simple de los p99 de 8 servidores da 345 ms, el ponderado 262, el</tspan></text><text x="470" y="355.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">máximo 983 y solo el p99 de las muestras unidas (323 ms) es correcto; un servidor lento con poco tráfico mueve el promedio</tspan></text><text x="470" y="371.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">simple 22 ms por encima.</tspan></text><text x="470" y="419.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
