<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 317" width="940" height="317" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Paquetes arrastrados al actualizar uno, en 200 grafos sintéticos de 60 paquetes</title><desc id="d">Tabla con el radio de impacto de actualizar un paquete en 200 grafos sintéticos de 60 paquetes: una hoja arrastra 0 paquetes de mediana y hasta 20, un paquete intermedio 3 de mediana y hasta 39, y un concentrador con cinco o más dependientes 12 de mediana, 27 en el percentil 90 y hasta 44.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="317" fill="#ffffff"/><rect x="10" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="157" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="157" dy="0">Tipo de paquete</tspan></text><rect x="310" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="382" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="382" dy="0">Paquetes</tspan></text><rect x="460" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="557" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="557" dy="0">Arrastrados (mediana)</tspan></text><rect x="660" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="732" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="732" dy="0">Percentil 90</tspan><