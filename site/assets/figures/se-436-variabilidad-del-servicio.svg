6.312" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="365.153" y="240.363" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="365.153" dy="0">3 617</tspan></text><polygon points="892,116.187 898.05,127.462 885.95,127.462" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="111.512" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">7 053</tspan></text><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">La fórmula de Pollaczek–Khinchine acierta y dice lo importante: la espera crece con (1 + cv²). Con un 5 % de solicitudes</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">lentas el sistema espera 13 veces más que con servicio constante, aunque el promedio no cambie. La ley de Little se cumple</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">en los cuatro casos: es una identidad que detecta una instrumentación inconsistente, no una predicción.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
