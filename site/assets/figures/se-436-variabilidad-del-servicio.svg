<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mismo promedio de servicio (50 ms) y misma utilización (80 %) con cuatro formas de variabilidad</title><desc id="d">Líneas con la espera media y el percentil 99 según el cuadrado del coeficiente de variación del servicio: la espera simulada sube de 101 milisegundos con servicio constante a 203 con exponencial, 502 con lognormal y 1 364 con una mezcla de 95 por ciento rápida y 5 por ciento lenta, casi sobre la fórmula teórica, y el percentil 99 de 573 a 7 053.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Mismo promedio de servicio (50 ms) y misma utilización (80 %) con cuatro formas de variabilidad</tspan></text><circle cx="22" cy="51" r="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Espera media simulada</tspan></text><rect x="222.34" y="45" width="12" height="12" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><text x="242.34" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="242.34" dy="0">Espera media teórica</tspan></text><polygon points="427.14,44.1 433.74,56.4 420.54,56.4" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="441.14" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="441.14" dy="0">p9