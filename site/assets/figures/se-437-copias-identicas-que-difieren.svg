<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 587" width="940" height="587" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Comparar dos copias idénticas: falsas diferencias frente a detección de una regresión real del 5 %</title><desc id="d">Líneas con una serie por estadístico con 3, 5, 10 y 30 repeticiones por versión: la media se queda en 58 a 60 por ciento de falsas diferencias entre copias idénticas con 3 a 10 repeticiones y detecta 64 por ciento; la mediana baja de 48,6 a 2,8 por ciento de falsas diferencias y sube de 67 a 92 por ciento de detección; el mínimo queda en medio.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="587" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Comparar dos copias idénticas: falsas diferencias frente a detección de una regresión real del 5 %</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Media</tspan></text><rect x="101.7" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="121.7" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="121.7" dy="0">Mediana</tspan></text><polygon points="208.48,44.1 215.08,56.4 201.88,56.4" fill="#946512" stroke="#946512" stroke-width="2"/><text x="222.48" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="222.48" dy="0">Mínimo</tspan></text><line x1="78.62" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="387" x2="78.62" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">60</tspan></text><line x1="78.62" y1="312" x2="910" y2="312" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="312" x2="78.62" y2="312" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="316.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">70</tspan></text><line x1="78.62" y1="237" x2="910" y2="237" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="237" x2="78.62" y2="237" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">80</tspan></text><line x1="78.62" y1="162" x2="910" y2="162" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="162" x2="78.62" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="166.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">90</tspan></text><line x1="78.62" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="87" x2="78.62" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="87" x2="78.62" y2="387" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="87" x2="96.62" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="387" x2="96.62" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">0</tspan></text><line x1="295.465" y1="87" x2="295.465" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="295.465" y1="387" x2="295.465" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="295.465" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="295.465" dy="0">20</tspan></text><line x1="494.31" y1="87" x2="494.31" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="494.31" y1="387" x2="494.31" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="494.31" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="494.31" dy="0">40</tspan></text><line x1="693.155" y1="87" x2="693.155" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="693.155" y1="387" x2="693.155" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="693.155" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="693.155" dy="0">60</tspan></text><line x1="892" y1="87" x2="892" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="387" x2="892" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">80</tspan></text><line x1="78.62" y1="387" x2="910" y2="387" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 237)">Detección de una regresión real del 5 % (%)</text><text x="494.31" y="433" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Falsas diferencias de más del 3 % entre copias idénticas (%)</tspan></text><polyline points="681.224,357 697.132,357 673.27,357 489.339,297" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="681.224" cy="357" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="681.224" y="346" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="681.224" dy="0">3</tspan></text><circle cx="697.132" cy="357" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="697.132" y="381" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="697.132" dy="0">5</tspan></text><circle cx="673.27" cy="357" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="673.27" y="381" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="673.27" dy="0">10</tspan></text><circle cx="489.339" cy="297" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="489.339" y="286" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="489.339" dy="0">30</tspan></text><polyline points="579.813,334.5 471.443,297 281.546,244.5 124.458,147" fill="none" stroke="#087f8c" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="574.313" y="329" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="579.813" y="323.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="579.813" dy="0">3</tspan></text><rect x="465.943" y="291.5" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="471.443" y="286" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="471.443" dy="0">5</tspan></text><rect x="276.046" y="239" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="281.546" y="233.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="281.546" dy="0">10</tspan></text><rect x="118.958" y="141.5" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="134.458" y="151.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="134.458" dy="0">30</tspan></text><polyline points="582.796,342 531.096,319.5 454.541,304.5 370.032,259.5" fill="none" stroke="#946512" stroke-width="2.4"/><polygon points="582.796,335.675 588.846,346.95 576.746,346.95" fill="#946512" stroke="#946512" stroke-width="2"/><text x="592.796" y="346.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="592.796" dy="0">3</tspan></text><polygon points="531.096,313.175 537.146,324.45 525.046,324.45" fill="#946512" stroke="#946512" stroke-width="2"/><text x="541.096" y="324" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="541.096" dy="0">5</tspan></text><polygon points="454.541,298.175 460.591,309.45 448.491,309.45" fill="#946512" stroke="#946512" stroke-width="2"/><text x="454.541" y="328.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="454.541" dy="0">10</tspan></text><polygon points="370.032,253.175 376.082,264.45 363.982,264.45" fill="#946512" stroke="#946512" stroke-width="2"/><text x="370.032" y="248.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="370.032" dy="0">30</tspan></text><rect x="10" y="447" width="920" height="92.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Cada punto está rotulado con las repeticiones por versión (3, 5, 10 o 30); lo mejor es arriba a la izquierda, con pocas</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">falsas diferencias y mucha detección. Con 5 repeticiones y la media, dos programas idénticos «difieren» el 60 % de las</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">veces. La mediana es robusta a las interferencias y mejora con las repeticiones; el mínimo reduce el ruido pero también la</tspan></text><text x="470" y="521.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">señal. El ruido (lognormal de 4 %, 8 % de interferencias de +15 a +80 %) es un supuesto del autor.</tspan></text><text x="470" y="569.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
