<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 522" width="940" height="522" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El perfilador cambia lo que mide y una caché puede estar midiéndose a sí misma</title><desc id="d">Puntos unidos en escala logarítmica con el tiempo sin y con cambio: cProfile multiplica por 4,6 el tiempo de 300 000 llamadas mínimas en Windows y por 3,7 en Ubuntu; repetir la misma clave con caché baja 300 llamadas caras de 69 a 0,05 milisegundos, 1 395 veces menos, mientras que con claves distintas apenas cambian.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="522" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">El perfilador cambia lo que mide y una caché puede estar midiéndose a sí misma</tspan></text><circle cx="22" cy="51" r="6" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Sin perfilador / sin caché</tspan></text><circle cx="266.04" cy="51" r="6" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="280.04" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="280.04" dy="0">Con cProfile / con caché</tspan></text><line x1="412.3" y1="77" x2="412.3" y2="341" stroke="#d5dde1" stroke-width="1"/><line x1="412.3" y1="341" x2="412.3" y2="346" stroke="#5b7280" stroke-width="1.4"/><text x="412.3" y="362" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412.3" dy="0">0,01</tspan></text><line x1="477.624" y1="77" x2="477.624" y2="341" stroke="#d5dde1" stroke-width="1"/><line x1="477.624" y1="341" x2="477.624" y2="346" stroke="#5b7280" stroke-width="1.4"/><text x="477.624" y="362" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477.624" dy="0">0,1</tspan></text><line x1="542.948" y1="77" x2="542.948" y2="341" stroke="#d5dde1" stroke-width="1"/><line x1="542.948" y1="341" x2="542.948" y2="346" stroke="#5b7280" stroke-width="1.4"/><text x="542.948" y="362" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542.948" dy="0">1</tspan></text><line x1="608.272" y1="77" x2="608.272" y2="341" stroke="#d5dde1" stroke-width="1"/><line x1="608.272" y1="341" x2="608.272" y2="346" stroke="#5b7280" stroke-width="1.4"/><text x="608.272" y="362" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="608.272" dy="0">10</tspan></text><line x1="673.596" y1="77" x2="673.596" y2="341" stroke="#d5dde1" stroke-width="1"/><line x1="673.596" y1="341" x2="673.596" y2="346" stroke="#5b7280" stroke-width="1.4"/><text x="673.596" y="362" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="673.596" dy="0">100</tspan></text><line x1="738.92" y1="77" x2="738.92" y2="341" stroke="#d5dde1" stroke-width="1"/><line x1="738.92" y1="341" x2="738.92" y2="346" stroke="#5b7280" stroke-width="1.4"/><text x="738.92" y="362" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="738.92" dy="0">1 000</tspan></text><line x1="412.3" y1="341" x2="738.92" y2="341" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="103.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">300 000 llamadas mínimas · cProfile, Windows</tspan></text><text x="344" y="147.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">300 000 llamadas mínimas · cProfile, Ubuntu</tspan></text><text x="344" y="183" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">300 llamadas caras · caché, misma clave,</tspan></text><text x="344" y="200" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">Windows</tspan></text><text x="344" y="227" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">300 llamadas caras · caché, misma clave,</tspan></text><text x="344" y="244" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">Ubuntu</tspan></text><text x="344" y="271" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">300 llamadas caras · caché, claves distintas,</tspan></text><text x="344" y="288" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">Windows</tspan></text><text x="344" y="315" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">300 llamadas caras · caché, claves distintas,</tspan></text><text x="344" y="332" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">Ubuntu</tspan></text><line x1="650.111" y1="99" x2="693.246" y2="99" stroke="#c0432f" stroke-width="4"/><circle cx="650.111" cy="99" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="693.246" cy="99" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="638.111" y="103.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="638.111" dy="0">43,7</tspan></text><text x="705.246" y="103.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="705.246" dy="0">199,9</tspan></text><text x="926" y="103.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">× 4,6</tspan></text><line x1="636.345" y1="143" x2="673.225" y2="143" stroke="#c0432f" stroke-width="4"/><circle cx="636.345" cy="143" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="673.225" cy="143" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="624.345" y="147.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="624.345" dy="0">26,9</tspan></text><text x="685.225" y="147.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="685.225" dy="0">98,7</tspan></text><text x="926" y="147.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">× 3,7</tspan></text><line x1="663.27" y1="187" x2="457.96" y2="187" stroke="#087f8c" stroke-width="4"/><circle cx="663.27" cy="187" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="457.96" cy="187" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="675.27" y="191.5" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="675.27" dy="0">69,49</tspan></text><text x="445.96" y="191.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="445.96" dy="0">0,05</tspan></text><text x="926" y="191.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">1 395 × menos</tspan></text><line x1="662.921" y1="231" x2="439.408" y2="231" stroke="#087f8c" stroke-width="4"/><circle cx="662.921" cy="231" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="439.408" cy="231" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="674.921" y="235.5" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="674.921" dy="0">68,64</tspan></text><text x="427.408" y="235.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="427.408" dy="0">0,026</tspan></text><text x="926" y="235.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">2 599 × menos</tspan></text><line x1="663.27" y1="275" x2="662.987" y2="275" stroke="#087f8c" stroke-width="4"/><circle cx="663.27" cy="275" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="662.987" cy="275" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="675.27" y="279.5" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="675.27" dy="0">69,49</tspan></text><text x="650.987" y="279.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="650.987" dy="0">68,8</tspan></text><text x="926" y="279.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">casi igual</tspan></text><line x1="662.921" y1="319" x2="654.454" y2="319" stroke="#087f8c" stroke-width="4"/><circle cx="662.921" cy="319" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="654.454" cy="319" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="674.921" y="323.5" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="674.921" dy="0">68,64</tspan></text><text x="642.454" y="323.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="642.454" dy="0">50,93</tspan></text><text x="926" y="323.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">−26 %</tspan></text><text x="575.61" y="385" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="575.61" dy="0">Milisegundos (ms) (escala logarítmica)</tspan></text><rect x="10" y="399" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="423.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Un perfil determinista cuenta llamadas con precisión y altera el reparto del tiempo (atribuye el 34 % a la función mínima</tspan></text><text x="470" y="440.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cuando midiendo con y sin la llamada es el 46 %). El benchmark con caché de una sola clave mide una búsqueda en</tspan></text><text x="470" y="457.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">diccionario, no el trabajo: 1 395 veces menos con la misma clave y casi igual con claves distintas en Windows.</tspan></text><text x="470" y="504.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido en Windows 11 (CPython 3.12.9) y Ubuntu bajo WSL2 (3.12.3); los tiempos de reloj cambian de equipo en equipo.</tspan></text></svg>
