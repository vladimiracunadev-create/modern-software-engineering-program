<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 431" width="940" height="431" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">5 000 registros sintéticos del modelo antiguo: traducción ingenua frente a una capa anticorrupción</title><desc id="d">Tabla con 5 000 registros sintéticos del modelo antiguo: una traducción ingenua lanza excepción con 4 402, una capa anticorrupción no lanza ninguna y deja 2 175 registros sin errores, 642 con error de nota y 2 491 con error de fecha, y 1 606 registros con estado espacio o nulo se vuelven indistinguibles.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="431" fill="#ffffff"/><rect x="10" y="12" width="634" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="327" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="327" dy="0">Resultado</tspan></text><rect x="650" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="787" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="787" dy="0">Registros</tspan></text><rect x="10" y="56" width="634" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Traducción ingenua: lanza excepción</tspan></text><rect x="650" y="56" width="274" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">4 402 (88,0 %)</tspan></text><rect x="10" y="102" width="634" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="125.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Capa anticorrupción: sin errores</tspan></text><rect x="650" y="102" width="274" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">2 175</tspan></text><rect x="10" y="148" width="634" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="171.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Capa: con error de nota</tspan></text><rect x="650" y="148" width="274" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">642</tspan></text><rect x="10" y="194" width="634" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="217.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Capa: con error de fecha</tspan></text><rect x="650" y="194" width="274" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">2 491</tspan></text><rect x="10" y="240" width="634" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="263.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Estado «desconocido» (vacío, nulo o X)</tspan></text><rect x="650" y="240" width="274" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">2 429</tspan></text><rect x="10" y="286" width="634" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="309.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Estado espacio y nulo, antes distintos, ahora iguales</tspan></text><rect x="650" y="286" width="274" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">1 606</tspan></text><rect x="10" y="336" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="360.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La capa no lanza excepciones: clasifica y envía a cuarentena lo que no puede traducir, pero colapsa dos estados que el</tspan></text><text x="470" y="377.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">modelo antiguo distinguía. Las anomalías y sus frecuencias son una construcción del autor.</tspan></text><text x="470" y="417.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
