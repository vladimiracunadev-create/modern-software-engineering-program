<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 566" width="940" height="566" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Sobrecarga de 2 × (160 req/s sobre 80 de capacidad, 20 % críticas) durante 60 s: respuestas útiles dentro de 2 s</title><desc id="d">Barras agrupadas con el porcentaje de solicitudes críticas y no críticas atendidas a tiempo por política: sin control 3,0 y 3,7 por ciento; con cola acotada a 50, 53,9 y 52,3; con prioridad a las críticas, 100 y 40,3; con prioridad y respuesta degradada, 100 y 100 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="566" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Sobrecarga de 2 × (160 req/s sobre 80 de capacidad, 20 % críticas) durante 60 s: respuestas útiles dentro de</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">2 s</tspan></text><rect x="16" y="64" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Críticas a tiempo</tspan></text><rect x="192.18" y="64" width="12" height="12" rx="2" fill="#946512"/><text x="212.18" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="212.18" dy="0">No críticas a tiempo</tspan></text><line x1="78.62" y1="374" x2="920" y2="374" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="374" x2="78.62" y2="374" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="378.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="309" x2="920" y2="309" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="309" x2="78.62" y2="309" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="313.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">25</tspan></text><line x1="78.62" y1="244" x2="920" y2="244" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="244" x2="78.62" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="248.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">50</tspan></text><line x1="78.62" y1="179" x2="920" y2="179" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="179" x2="78.62" y2="179" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="183.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">75</tspan></text><line x1="78.62" y1="114" x2="920" y2="114" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="114" x2="78.62" y2="114" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="118.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="114" x2="78.62" y2="374" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="244" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 244)">Solicitudes a tiempo (%)</text><rect x="99.6545" y="366.2" width="82.138" height="7.8" rx="3" fill="#087f8c"/><text x="140.724" y="360.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="140.724" dy="0">3,0</tspan></text><rect x="185.793" y="364.38" width="82.138" height="9.62" rx="3" fill="#946512"/><text x="226.862" y="358.38" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="226.862" dy="0">3,7</tspan></text><text x="183.793" y="395" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="183.793" dy="0">Sin control</tspan></text><rect x="310" y="233.86" width="82.138" height="140.14" rx="3" fill="#087f8c"/><text x="351.069" y="227.86" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="351.069" dy="0">53,9</tspan></text><rect x="396.138" y="238.02" width="82.138" height="135.98" rx="3" fill="#946512"/><text x="437.207" y="232.02" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="437.207" dy="0">52,3</tspan></text><text x="394.138" y="395" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="394.138" dy="0">Cola acotada a 50</tspan></text><rect x="520.345" y="114" width="82.138" height="260" rx="3" fill="#087f8c"/><text x="561.413" y="108" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="561.413" dy="0">100,0</tspan></text><rect x="606.483" y="269.22" width="82.138" height="104.78" rx="3" fill="#946512"/><text x="647.552" y="263.22" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="647.552" dy="0">40,3</tspan></text><text x="604.482" y="395" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="604.482" dy="0">Prioridad a las críticas</tspan></text><rect x="730.689" y="114" width="82.138" height="260" rx="3" fill="#087f8c"/><text x="771.758" y="108" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="771.758" dy="0">100,0</tspan></text><rect x="816.827" y="114" width="82.138" height="260" rx="3" fill="#946512"/><text x="857.896" y="108" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="857.896" dy="0">100,0</tspan></text><text x="814.827" y="395" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="814.827" dy="0">Prioridad y respuesta</tspan></text><text x="814.827" y="412" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="814.827" dy="0">degradada</tspan></text><rect x="10" y="443" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="467.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">La degradación bajo control es una decisión de producto: qué es crítico y qué respuesta barata sigue siendo útil. Las</tspan></text><text x="470" y="484.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">respuestas útiles por segundo pasan de 5,6 sin control a 82,0, 81,6 y 155,9. El 155,9 supone que la respuesta degradada</tspan></text><text x="470" y="501.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">cuesta 5 ms en lugar de 50 ms (supuesto del autor): si degradar costara lo mismo, no habría ganancia.</tspan></text><text x="470" y="548.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
