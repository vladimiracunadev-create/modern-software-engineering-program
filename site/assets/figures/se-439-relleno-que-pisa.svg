<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 371" width="940" height="371" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Relleno de 20 000 filas en lotes de 1 000 con un 2 % de filas modificadas por la aplicación entre lectura y escritura</title><desc id="d">Tabla con cuatro estrategias de relleno de 20 000 filas en lotes de 1 000 con 2 por ciento de filas modificadas por la aplicación entre la lectura y la escritura: el relleno ingenuo deja 389 filas con la columna nueva distinta del texto, el condicional por versión deja 0, el condicional con doble escritura 0 y el ingenuo con doble escritura también 389.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="371" fill="#ffffff"/><rect x="10" y="12" width="594" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="307" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="307" dy="0">Estrategia</tspan></text><rect x="610" y="12" width="314" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="767" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="767" dy="0">Filas con la columna nueva distinta</tspan></text><text x="767" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="767" dy="0">del texto</tspan></text><rect x="10" y="56" width="594" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="83.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="307" dy="0">Relleno ingenuo</tspan></text><rect x="610" y="56" width="314" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">389</tspan></text><rect x="10" y="110" width="594" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="137.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="307" dy="0">Condicional por versión (y pasada final)</tspan></text><rect x="610" y="110" width="314" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">0</tspan></text><rect x="10" y="164" width="594" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="191.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="307" dy="0">Condicional con la aplicación escribiendo en ambas columnas</tspan></text><rect x="610" y="164" width="314" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">0</tspan></text><rect x="10" y="218" width="594" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="245.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="307" dy="0">Ingenuo con la aplicación escribiendo en ambas columnas</tspan></text><rect x="610" y="218" width="314" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">389</tspan></text><rect x="10" y="276" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="300.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Los recuentos coinciden en las cuatro; el contenido, no. Escribir en ambas columnas no corrige un relleno ingenuo, que</tspan></text><text x="470" y="317.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">sobrescribe lo que la aplicación acaba de poner. La intercalación es determinista y no hay concurrencia real.</tspan></text><text x="470" y="357.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
