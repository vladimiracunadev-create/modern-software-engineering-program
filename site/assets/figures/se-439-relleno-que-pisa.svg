<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 409" width="940" height="409" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Relleno de 20 000 filas en lotes de 1 000 con un 2 % de filas modificadas por la aplicación entre lectura y escritura</title><desc id="d">Barras horizontales con las filas con la columna nueva distinta del texto tras cuatro estrategias de relleno: el relleno ingenuo deja 389, el condicional por versión 0, el condicional con la aplicación escribiendo en ambas columnas 0 y el ingenuo con la aplicación escribiendo en ambas columnas también 389.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="409" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Relleno de 20 000 filas en lotes de 1 000 con un 2 % de filas modificadas por la aplicación entre lectura y</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">escritura</tspan></text><line x1="354" y1="68" x2="354" y2="244" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="244" x2="354" y2="249" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="265" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="488.455" y1="68" x2="488.455" y2="244" stroke="#d5dde1" stroke-width="1"/><line x1="488.455" y1="244" x2="488.455" y2="249" stroke="#5b7280" stroke-width="1.4"/><text x="488.455" y="265" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="488.455" dy="0">100</tspan></text><line x1="622.91" y1="68" x2="622.91" y2="244" stroke="#d5dde1" stroke-width="1"/><line x1="622.91" y1="244" x2="622.91" y2="249" stroke="#5b7280" stroke-width="1.4"/><text x="622.91" y="265" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622.91" dy="0">200</tspan></text><line x1="757.365" y1="68" x2="757.365" y2="244" stroke="#d5dde1" stroke-width="1"/><line x1="757.365" y1="244" x2="757.365" y2="249" stroke="#5b7280" stroke-width="1.4"/><text x="757.365" y="265" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757.365" dy="0">300</tspan></text><line x1="891.82" y1="68" x2="891.82" y2="244" stroke="#d5dde1" stroke-width="1"/><line x1="891.82" y1="244" x2="891.82" y2="249" stroke="#5b7280" stroke-width="1.4"/><text x="891.82" y="265" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="891.82" dy="0">400</tspan></text><line x1="354" y1="244" x2="891.82" y2="244" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="94.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Relleno ingenuo</tspan></text><text x="344" y="138.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Condicional por versión (y pasada final)</tspan></text><text x="344" y="174" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Condicional con la aplicación escribiendo en</tspan></text><text x="344" y="191" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">ambas columnas</tspan></text><text x="344" y="218" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Ingenuo con la aplicación escribiendo en</tspan></text><text x="344" y="235" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">ambas columnas</tspan></text><rect x="354" y="74" width="523.03" height="32" rx="3" fill="#c0432f"/><text x="884.03" y="94.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="884.03" dy="0">389</tspan></text><rect x="354" y="118" width="2" height="32" rx="3" fill="#c0432f"/><text x="363" y="138.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="162" width="2" height="32" rx="3" fill="#c0432f"/><text x="363" y="182.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="206" width="523.03" height="32" rx="3" fill="#c0432f"/><text x="884.03" y="226.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="884.03" dy="0">389</tspan></text><text x="622.91" y="288" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="622.91" dy="0">Filas con la columna nueva distinta del texto</tspan></text><rect x="10" y="302" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="326.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Los recuentos coinciden en las cuatro; el contenido, no. Escribir en ambas columnas no corrige un relleno ingenuo, que</tspan></text><text x="470" y="343.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">sobrescribe lo que la aplicación acaba de poner. La intercalación es determinista y no hay concurrencia real.</tspan></text><text x="470" y="391.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
