<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 659" width="940" height="659" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Probabilidad anual de perder un objeto con réplicas independientes según el tiempo de reparación</title><desc id="d">Barras horizontales en escala logarítmica con la aproximación analítica de la pérdida anual con tasa de fallo de disco del 20 y del 2 por ciento: con dos réplicas va de 9,13e-06 con 1 hora de reparación a 1,53e-03 con 168, y con tres réplicas y 168 horas baja a 8,83e-06; con tasa del 2 por ciento, tres réplicas y 24 horas dan 1,80e-10.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="659" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Probabilidad anual de perder un objeto con réplicas independientes según el tiempo de reparación</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Aproximación con tasa anual del 20 %</tspan></text><rect x="335.44" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="355.44" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="355.44" dy="0">Aproximación con tasa anual del 2 %</tspan></text><line x1="274" y1="77" x2="274" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="461" x2="274" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">1</tspan></text><line x1="418.38" y1="77" x2="418.38" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="418.38" y1="461" x2="418.38" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="418.38" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="418.38" dy="0">100</tspan></text><line x1="562.76" y1="77" x2="562.76" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="562.76" y1="461" x2="562.76" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="562.76" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562.76" dy="0">10 000</tspan></text><line x1="707.14" y1="77" x2="707.14" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="707.14" y1="461" x2="707.14" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="707.14" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707.14" dy="0">1 000 000</tspan></text><line x1="851.52" y1="77" x2="851.52" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="851.52" y1="461" x2="851.52" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="851.52" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="851.52" dy="0">100 000 000</tspan></text><line x1="274" y1="461" x2="851.52" y2="461" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="113.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">2 réplicas, reparación de 1 h</tspan></text><text x="264" y="177.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">2 réplicas, reparación de 24 h</tspan></text><text x="264" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">2 réplicas, reparación de 168 h</tspan></text><text x="264" y="305.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">3 réplicas, reparación de 168 h</tspan></text><text x="264" y="369.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">3 réplicas, reparación de 336 h</tspan></text><text x="264" y="433.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">3 réplicas, reparación de 24 h</tspan></text><rect x="274" y="83" width="358.096" height="24.5" rx="3" fill="#c0432f"/><text x="639.096" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="639.096" dy="0">9,13e-06</tspan></text><rect x="274" y="110.5" width="213.716" height="24.5" rx="3" fill="#087f8c"/><text x="494.716" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="494.716" dy="0">9,13e-08</tspan></text><rect x="274" y="147" width="457.717" height="24.5" rx="3" fill="#c0432f"/><text x="738.717" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="738.717" dy="0">2,19e-04</tspan></text><rect x="274" y="174.5" width="313.337" height="24.5" rx="3" fill="#087f8c"/><text x="594.337" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="594.337" dy="0">2,19e-06</tspan></text><rect x="274" y="211" width="518.663" height="24.5" rx="3" fill="#c0432f"/><text x="799.663" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="799.663" dy="0">1,53e-03</tspan></text><rect x="274" y="238.5" width="374.283" height="24.5" rx="3" fill="#087f8c"/><text x="655.283" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="655.283" dy="0">1,53e-05</tspan></text><rect x="274" y="275" width="357.049" height="24.5" rx="3" fill="#c0432f"/><text x="638.049" y="291.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="638.049" dy="0">8,83e-06</tspan></text><rect x="274" y="302.5" width="140.479" height="24.5" rx="3" fill="#087f8c"/><text x="421.479" y="319.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="421.479" dy="0">8,83e-09</tspan></text><rect x="274" y="339" width="400.494" height="24.5" rx="3" fill="#c0432f"/><text x="681.494" y="355.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="681.494" dy="0">3,53e-05</tspan></text><rect x="274" y="366.5" width="183.924" height="24.5" rx="3" fill="#087f8c"/><text x="464.924" y="383.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="464.924" dy="0">3,53e-08</tspan></text><rect x="274" y="403" width="234.998" height="24.5" rx="3" fill="#c0432f"/><text x="515.998" y="419.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="515.998" dy="0">1,80e-07</tspan></text><rect x="274" y="430.5" width="18.4281" height="24.5" rx="3" fill="#087f8c"/><text x="299.428" y="447.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="299.428" dy="0">1,80e-10</tspan></text><text x="562.76" y="505" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="562.76" dy="0">Pérdidas por cada 10 000 millones de objetos al año (rótulos: probabilidad anual) (escala logarítmica)</tspan></text><rect x="10" y="519" width="920" height="92.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="543.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">La aproximación 8 760 · N · λᴺ · Rᴺ⁻¹ coincide con la simulación (por ejemplo 2,35e-04 simulada frente a 2,19e-04 con 2</tspan></text><text x="470" y="560.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">réplicas y 24 h) y enseña que la reparación pesa más que el número: 7 veces más tiempo, 7ᴺ⁻¹ más pérdida. Pero si el 0,1 %</tspan></text><text x="470" y="577.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">de los fallos afecta a las tres réplicas a la vez (mismo lote, misma sala, mismo error), la pérdida anual es 2,0e-05, cinco</tspan></text><text x="470" y="593.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">órdenes mayor que la independiente (1,8e-10).</tspan></text><text x="470" y="641.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
