<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 419" width="950" height="419" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Seis cambios de esquema y cuatro lecturas: lector viejo o nuevo, estricto o tolerante</title><desc id="d">Tabla con seis cambios de esquema y cuatro lecturas: un lector estricto falla en 11 de 12 celdas, uno tolerante en 4 de 12; cambiar el tipo falla en las cuatro y renombrar un campo pasa con un lector tolerante nuevo que lee un dato viejo pero deja la nota ausente.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="419" fill="#ffffff"/><rect x="10" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="142" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="142" dy="0">Cambio</tspan></text><rect x="280" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="442" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="442" dy="0">Viejo lee dato nuevo (estricto ·</tspan></text><text x="442" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="442" dy="0">tolerante)</tspan></text><rect x="610" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="772" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="772" dy="0">Nuevo lee dato viejo (estricto ·</tspan></text><text x="772" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="772" dy="0">tolerante)</tspan></text><rect x="10" y="56" width="264" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="78.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">Añadir campo opcional</tspan></text><rect x="280" y="56" width="324" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="78.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">falla · pasa</tspan></text><rect x="610" y="56" width="324" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="78.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">falla · pasa</tspan></text><rect x="10" y="100" width="264" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="122.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">Añadir campo obligatorio</tspan></text><rect x="280" y="100" width="324" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="122.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">falla · pasa</tspan></text><rect x="610" y="100" width="324" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="122.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">falla · falla</tspan></text><rect x="10" y="144" width="264" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="166.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">Quitar campo</tspan></text><rect x="280" y="144" width="324" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="166.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">falla · pasa</tspan></text><rect x="610" y="144" width="324" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="166.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">falla · pasa</tspan></text><rect x="10" y="188" width="264" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="210.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">Renombrar campo</tspan></text><rect x="280" y="188" width="324" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="210.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">falla · falla</tspan></text><rect x="610" y="188" width="324" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="210.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">falla · pasa</tspan></text><rect x="10" y="232" width="264" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="254.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">Cambiar el tipo</tspan></text><rect x="280" y="232" width="324" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="254.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">falla · falla</tspan></text><rect x="610" y="232" width="324" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="254.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">falla · falla</tspan></text><rect x="10" y="276" width="264" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="298.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">Ampliar valores permitidos</tspan></text><rect x="280" y="276" width="324" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="298.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">falla · pasa</tspan></text><rect x="610" y="276" width="324" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="298.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">pasa · pasa</tspan></text><rect x="10" y="324" width="930" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="475" y="348.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">El lector estricto falla en 11 de 12 celdas; el tolerante, en 4. «Pasa» solo dice que no hubo excepción: un lector tolerante</tspan></text><text x="475" y="365.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">que lee un dato viejo tras renombrar la nota la deja ausente sin avisar. El registro de tres campos es del autor.</tspan></text><text x="475" y="405.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
