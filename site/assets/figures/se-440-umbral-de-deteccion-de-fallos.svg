<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 606" width="940" height="606" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Detector de fallos por latidos de 1 s con pérdida del 0,5 % y pausas del emisor: el umbral y sus dos costos anuales</title><desc id="d">Líneas en escala logarítmica con los minutos al año por detectar tarde cuatro caídas reales y por conmutar sin motivo según el umbral: detectar tarde sube de 0,07 minutos con 1,5 segundos a 1,97 con 30, mientras que conmutar sin motivo baja de 79 491 minutos con 1,5 segundos a 43 con 10 y 0 con 30.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="606" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Detector de fallos por latidos de 1 s con pérdida del 0,5 % y pausas del emisor: el umbral y sus dos costos</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">anuales</tspan></text><circle cx="22" cy="70" r="6" fill="#946512" stroke="#946512" stroke-width="2"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Por detectar tarde (4 caídas al año)</tspan></text><rect x="335.44" y="64" width="12" height="12" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="355.44" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="355.44" dy="0">Por conmutar sin motivo (30 s cada una)</tspan></text><line x1="108.78" y1="406" x2="910" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="406" x2="108.78" y2="406" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="410.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">0,01</tspan></text><line x1="108.78" y1="363.143" x2="910" y2="363.143" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="363.143" x2="108.78" y2="363.143" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="367.643" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">0,1</tspan></text><line x1="108.78" y1="320.286" x2="910" y2="320.286" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="320.286" x2="108.78" y2="320.286" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="324.786" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">1</tspan></text><line x1="108.78" y1="277.429" x2="910" y2="277.429" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="277.429" x2="108.78" y2="277.429" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="281.929" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">10</tspan></text><line x1="108.78" y1="234.571" x2="910" y2="234.571" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="234.571" x2="108.78" y2="234.571" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="239.071" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">100</tspan></text><line x1="108.78" y1="191.714" x2="910" y2="191.714" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="191.714" x2="108.78" y2="191.714" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="196.214" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">1 000</tspan></text><line x1="108.78" y1="148.857" x2="910" y2="148.857" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="148.857" x2="108.78" y2="148.857" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="153.357" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">10 000</tspan></text><line x1="108.78" y1="106" x2="910" y2="106" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="106" x2="108.78" y2="106" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">100 000</tspan></text><line x1="108.78" y1="106" x2="108.78" y2="406" stroke="#5b7280" stroke-width="1.6"/><line x1="126.78" y1="106" x2="126.78" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="126.78" y1="406" x2="126.78" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="126.78" y="427" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="126.78" dy="0">1,5</tspan></text><line x1="200.265" y1="106" x2="200.265" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="200.265" y1="406" x2="200.265" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="200.265" y="427" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="200.265" dy="0">2</tspan></text><line x1="303.835" y1="106" x2="303.835" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="303.835" y1="406" x2="303.835" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="303.835" y="427" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="303.835" dy="0">3</tspan></text><line x1="434.319" y1="106" x2="434.319" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="434.319" y1="406" x2="434.319" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="434.319" y="427" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="434.319" dy="0">5</tspan></text><line x1="611.374" y1="106" x2="611.374" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="611.374" y1="406" x2="611.374" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="611.374" y="427" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="611.374" dy="0">10</tspan></text><line x1="892" y1="106" x2="892" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="406" x2="892" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="427" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">30</tspan></text><line x1="108.78" y1="406" x2="910" y2="406" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="256" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 256)">Minutos por año (escala logarítmica)</text><text x="509.39" y="452" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="509.39" dy="0">Umbral del detector (s) (escala logarítmica)</tspan></text><polyline points="126.78,369.782 200.265,363.143 303.835,353.266 434.319,342.695 611.374,328.885 892,307.666" fill="none" stroke="#946512" stroke-width="2.4"/><circle cx="126.78" cy="369.782" r="5.5" fill="#946512" stroke="#946512" stroke-width="2"/><text x="126.78" y="358.782" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="126.78" dy="0">0,07</tspan></text><circle cx="200.265" cy="363.143" r="5.5" fill="#946512" stroke="#946512" stroke-width="2"/><text x="200.265" y="352.143" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="200.265" dy="0">0,1</tspan></text><circle cx="303.835" cy="353.266" r="5.5" fill="#946512" stroke="#946512" stroke-width="2"/><text x="303.835" y="342.266" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="303.835" dy="0">0,17</tspan></text><circle cx="434.319" cy="342.695" r="5.5" fill="#946512" stroke="#946512" stroke-width="2"/><text x="434.319" y="331.695" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="434.319" dy="0">0,3</tspan></text><circle cx="611.374" cy="328.885" r="5.5" fill="#946512" stroke="#946512" stroke-width="2"/><text x="611.374" y="317.885" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="611.374" dy="0">0,63</tspan></text><circle cx="892" cy="307.666" r="5.5" fill="#946512" stroke="#946512" stroke-width="2"/><text x="892" y="296.666" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">1,97</tspan></text><polyline points="126.78,110.272 200.265,123.069 303.835,198.513 434.319,222.141 611.374,250.28" fill="none" stroke="#c0432f" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="121.28" y="104.772" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="126.78" y="99.2721" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="126.78" dy="0">79 491</tspan></text><rect x="194.765" y="117.569" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="200.265" y="112.069" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="200.265" dy="0">39 968</tspan></text><rect x="298.335" y="193.013" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="303.835" y="187.513" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="303.835" dy="0">694</tspan></text><rect x="428.819" y="216.641" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="434.319" y="211.141" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="434.319" dy="0">195</tspan></text><rect x="605.874" y="244.78" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="611.374" y="239.28" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="611.374" dy="0">43</tspan></text><rect x="10" y="466" width="920" height="92.56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="490.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">El umbral intercambia un tipo de pérdida por otro: 30 s cuestan 2 minutos al año en detección tardía y 0 en conmutaciones</tspan></text><text x="470" y="507.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">falsas (no se dibuja: no cabe en escala logarítmica); 2 s cuestan 0,1 minutos y casi 40 000 en falsas (unas 219</tspan></text><text x="470" y="524.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">conmutaciones falsas por día frente a 0). Las pausas del emisor (una cada 5 horas, mediana de 2 s) y la pérdida del 0,5 %</tspan></text><text x="470" y="540.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">son supuestos del autor.</tspan></text><text x="470" y="588.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
