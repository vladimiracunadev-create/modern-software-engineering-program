<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 494" width="940" height="494" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Datos que cambian de significado al cruzar una frontera: porcentaje de casos que cambian en cada medida</title><desc id="d">Barras horizontales con el porcentaje de casos que cambian al cruzar cada frontera: los identificadores de 53 bits o menos 0 por ciento, los de 54 bits 49,9, los de 63 bits 99,9, dos fuentes con el mismo nombre en NFC y NFD 51,3, los precios al multiplicar por cien 4,6 y las fechas de 2026 que se leen distinto como día-mes o mes-día 36,2.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="494" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Datos que cambian de significado al cruzar una frontera: porcentaje de casos que cambian en cada medida</tspan></text><line x1="354" y1="49" x2="354" y2="313" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="313" x2="354" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="334" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="486.44" y1="49" x2="486.44" y2="313" stroke="#d5dde1" stroke-width="1"/><line x1="486.44" y1="313" x2="486.44" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="486.44" y="334" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="486.44" dy="0">25</tspan></text><line x1="618.88" y1="49" x2="618.88" y2="313" stroke="#d5dde1" stroke-width="1"/><line x1="618.88" y1="313" x2="618.88" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="618.88" y="334" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="618.88" dy="0">50</tspan></text><line x1="751.32" y1="49" x2="751.32" y2="313" stroke="#d5dde1" stroke-width="1"/><line x1="751.32" y1="313" x2="751.32" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="751.32" y="334" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="751.32" dy="0">75</tspan></text><line x1="883.76" y1="49" x2="883.76" y2="313" stroke="#d5dde1" stroke-width="1"/><line x1="883.76" y1="313" x2="883.76" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="883.76" y="334" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="883.76" dy="0">100</tspan></text><line x1="354" y1="313" x2="883.76" y2="313" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="67" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Identificadores de 40 y 53 bits a decimal de</tspan></text><text x="344" y="84" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">64 bits</tspan></text><text x="344" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Identificadores de 54 bits</tspan></text><text x="344" y="163.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Identificadores de 63 bits</tspan></text><text x="344" y="199" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">«José» en NFC y NFD de dos fuentes (1 026 de</tspan></text><text x="344" y="216" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">2 000 pares)</tspan></text><text x="344" y="243" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Precios de 1 a 99 999 centavos con int(precio</tspan></text><text x="344" y="260" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">· 100)</tspan></text><text x="344" y="287" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Fechas de 2026 que dd/mm y mm/dd leen</tspan></text><text x="344" y="304" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">distinto (132 de 365)</tspan></text><rect x="354" y="55" width="2" height="32" rx="3" fill="#c0432f"/><text x="363" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="99" width="264.35" height="32" rx="3" fill="#c0432f"/><text x="625.35" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="625.35" dy="0">49,9</tspan></text><rect x="354" y="143" width="529.23" height="32" rx="3" fill="#c0432f"/><text x="890.23" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="890.23" dy="0">99,9</tspan></text><rect x="354" y="187" width="271.767" height="32" rx="3" fill="#c0432f"/><text x="632.767" y="207.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="632.767" dy="0">51,3</tspan></text><rect x="354" y="231" width="24.369" height="32" rx="3" fill="#c0432f"/><text x="385.369" y="251.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="385.369" dy="0">4,6</tspan></text><rect x="354" y="275" width="191.773" height="32" rx="3" fill="#c0432f"/><text x="552.773" y="295.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="552.773" dy="0">36,2</tspan></text><text x="618.88" y="357" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="618.88" dy="0">Casos que cambian (%)</tspan></text><rect x="10" y="371" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="395.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Ninguno de estos fallos lanza una excepción: el dato llega y es otro. Un contrato de interoperabilidad debe fijar la</tspan></text><text x="470" y="412.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">representación (cadena para identificadores de más de 53 bits, normalización Unicode, enteros en centavos o decimales,</tspan></text><text x="470" y="429.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">fechas ISO 8601 con zona) y probar con valores en los bordes. Con NFC las 1 026 diferencias pasan a 0.</tspan></text><text x="470" y="476.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
