<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 467" width="940" height="467" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Doce sondas de portabilidad ejecutadas con el mismo script de Python en Windows 11 y en Ubuntu bajo WSL2</title><desc id="d">Barras horizontales con el número de sondas por área en las que Windows y Ubuntu dan un resultado distinto: texto y bytes 3, nombres y rutas 3, operaciones sobre archivos 2, funciones de la plataforma 3 y procesos 1; en las doce sondas los resultados difieren.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="467" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Doce sondas de portabilidad ejecutadas con el mismo script de Python en Windows 11 y en Ubuntu bajo WSL2</tspan></text><line x1="464" y1="49" x2="464" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="464" y1="269" x2="464" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="464" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="464" dy="0">0</tspan></text><line x1="574.985" y1="49" x2="574.985" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="574.985" y1="269" x2="574.985" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="574.985" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="574.985" dy="0">1</tspan></text><line x1="685.97" y1="49" x2="685.97" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="685.97" y1="269" x2="685.97" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="685.97" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="685.97" dy="0">2</tspan></text><line x1="796.955" y1="49" x2="796.955" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="796.955" y1="269" x2="796.955" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="796.955" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="796.955" dy="0">3</tspan></text><line x1="907.94" y1="49" x2="907.94" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="907.94" y1="269" x2="907.94" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="907.94" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907.94" dy="0">4</tspan></text><line x1="464" y1="269" x2="907.94" y2="269" stroke="#5b7280" stroke-width="1.6"/><text x="454" y="67" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="454" dy="0">Texto y bytes (separador y fin de línea, codificación por</tspan></text><text x="454" y="84" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="454" dy="0">defecto, bytes de un texto con eñe)</tspan></text><text x="454" y="111" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="454" dy="0">Nombres y rutas (mayúsculas, carácter «:», rutas anidadas</tspan></text><text x="454" y="128" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="454" dy="0">largas)</tspan></text><text x="454" y="155" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="454" dy="0">Operaciones sobre archivos (renombrar sobre uno existente,</tspan></text><text x="454" y="172" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="454" dy="0">borrar uno abierto)</tspan></text><text x="454" y="199" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="454" dy="0">Funciones de la plataforma (fecha anterior a 1970, «%-d»,</tspan></text><text x="454" y="216" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="454" dy="0">os.getuid)</tspan></text><text x="454" y="251.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="454" dy="0">Procesos (método de arranque de multiprocessing)</tspan></text><rect x="464" y="55" width="332.955" height="32" rx="3" fill="#c0432f"/><text x="803.955" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="803.955" dy="0">3</tspan></text><rect x="464" y="99" width="332.955" height="32" rx="3" fill="#c0432f"/><text x="803.955" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="803.955" dy="0">3</tspan></text><rect x="464" y="143" width="221.97" height="32" rx="3" fill="#c0432f"/><text x="692.97" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="692.97" dy="0">2</tspan></text><rect x="464" y="187" width="332.955" height="32" rx="3" fill="#c0432f"/><text x="803.955" y="207.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="803.955" dy="0">3</tspan></text><rect x="464" y="231" width="110.985" height="32" rx="3" fill="#c0432f"/><text x="581.985" y="251.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="581.985" dy="0">1</tspan></text><text x="685.97" y="313" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="685.97" dy="0">Sondas con resultado distinto (de 12 en total)</tspan></text><rect x="10" y="327" width="920" height="92.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="351.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Las doce sondas difieren y ninguna es exótica. El texto «año» escrito sin encoding ocupa 5 bytes con salto de línea en</tspan></text><text x="470" y="368.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">ambos sistemas y los bytes son distintos: el tamaño no delata la diferencia. La ruta de Windows falla por el límite de 260</tspan></text><text x="470" y="385.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">caracteres con la configuración de este equipo (en el cuarto nivel, 252 caracteres, frente a 8 niveles y 428 caracteres en</tspan></text><text x="470" y="401.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Ubuntu); con rutas largas habilitadas no fallaría.</tspan></text><text x="470" y="449.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Sondas reales en Windows 11 (CPython 3.12.9) y Ubuntu bajo WSL2 (3.12.3); cada fila es una observación, no una norma.</tspan></text></svg>
