<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 374" width="940" height="374" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">100 000 filas archivadas en tres formatos y leídas de vuelta: filas que vuelven idénticas</title><desc id="d">Barras apiladas horizontales con las filas de 100 000 que vuelven idénticas tras archivarlas: con CSV ninguna vuelve idéntica, porque cambian los tipos, 10 080 códigos pierden ceros y 19 851 textos vacíos se vuelven nulos; con líneas JSON y con SQLite vuelven las 100 000.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="374" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">100 000 filas archivadas en tres formatos y leídas de vuelta: filas que vuelven idénticas</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Vuelven idénticas</tspan></text><rect x="192.18" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="212.18" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="212.18" dy="0">No vuelven idénticas</tspan></text><line x1="274" y1="77" x2="274" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="209" x2="274" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0</tspan></text><line x1="394.34" y1="77" x2="394.34" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="394.34" y1="209" x2="394.34" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="394.34" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="394.34" dy="0">20 000</tspan></text><line x1="514.68" y1="77" x2="514.68" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="514.68" y1="209" x2="514.68" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="514.68" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="514.68" dy="0">40 000</tspan></text><line x1="635.02" y1="77" x2="635.02" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="635.02" y1="209" x2="635.02" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="635.02" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="635.02" dy="0">60 000</tspan></text><line x1="755.36" y1="77" x2="755.36" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="755.36" y1="209" x2="755.36" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="755.36" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="755.36" dy="0">80 000</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="209" x2="875.7" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">100 000</tspan></text><line x1="274" y1="209" x2="875.7" y2="209" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="95" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">CSV (tipos inferidos al leer; 2,68</tspan></text><text x="264" y="112" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">MB)</tspan></text><text x="264" y="147.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Líneas JSON (3,42 MB)</tspan></text><text x="264" y="191.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">SQLite (3,31 MB)</tspan></text><rect x="274" y="84" width="0" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="274" y="84" width="601.7" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="574.85" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="574.85" dy="0">100 000</tspan></text><text x="882.7" y="103.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100 000</tspan></text><rect x="274" y="128" width="601.7" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="574.85" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="574.85" dy="0">100 000</tspan></text><rect x="875.7" y="128" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="147.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100 000</tspan></text><rect x="274" y="172" width="601.7" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="574.85" y="191.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="574.85" dy="0">100 000</tspan></text><rect x="875.7" y="172" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="191.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100 000</tspan></text><text x="574.85" y="253" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="574.85" dy="0">Filas de 100 000</tspan></text><rect x="10" y="267" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="291.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El CSV solo guarda texto: sin un esquema que declare los tipos, los pierde. Un bit cambiado en un dígito del JSON deja un</tspan></text><text x="470" y="308.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">archivo válido que el lector acepta; solo la suma SHA-256 lo delata. Los datos son sintéticos.</tspan></text><text x="470" y="356.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
