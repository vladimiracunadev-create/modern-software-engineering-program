<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 556" width="940" height="556" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mensajes de la versión 1 a la 5 leídos por lectores de la versión 1 a la 5: lectores compatibles con cada productor</title><desc id="d">Barras agrupadas con los lectores de las cinco versiones que aceptan el mensaje de cada productor, con lector estricto y con lector tolerante: la versión 1 la leen 2 con ambos, la 2 solo 1 con el estricto y 2 con el tolerante, la 3 solo 1 con ambos, la 4 la leen 2 con ambos y la 5, 1 con el estricto y 2 con el tolerante; son 7 de 25 pares con el estricto y 9 con el tolerante.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="556" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Mensajes de la versión 1 a la 5 leídos por lectores de la versión 1 a la 5: lectores compatibles con cada</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">productor</tspan></text><rect x="16" y="64" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Lector estricto (7 de 25 pares)</tspan></text><rect x="297.74" y="64" width="12" height="12" rx="2" fill="#087f8c"/><text x="317.74" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="317.74" dy="0">Lector tolerante (9 de 25 pares)</tspan></text><line x1="63.54" y1="364" x2="920" y2="364" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="364" x2="63.54" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="368.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">0</tspan></text><line x1="63.54" y1="314" x2="920" y2="314" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="314" x2="63.54" y2="314" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="318.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">1</tspan></text><line x1="63.54" y1="264" x2="920" y2="264" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="264" x2="63.54" y2="264" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="268.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">2</tspan></text><line x1="63.54" y1="214" x2="920" y2="214" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="214" x2="63.54" y2="214" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="218.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">3</tspan></text><line x1="63.54" y1="164" x2="920" y2="164" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="164" x2="63.54" y2="164" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="168.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">4</tspan></text><line x1="63.54" y1="114" x2="920" y2="114" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="114" x2="63.54" y2="114" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="118.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">5</tspan></text><line x1="63.54" y1="114" x2="63.54" y2="364" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="239" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 239)">Versiones de lector que aceptan el mensaje (de 5)</text><rect x="80.6692" y="264" width="66.5168" height="100" rx="3" fill="#c0432f"/><text x="113.928" y="258" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="113.928" dy="0">2</tspan></text><rect x="151.186" y="264" width="66.5168" height="100" rx="3" fill="#087f8c"/><text x="184.444" y="258" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="184.444" dy="0">2</tspan></text><text x="149.186" y="385" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="149.186" dy="0">v1: id, estudiante,</tspan></text><text x="149.186" y="402" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="149.186" dy="0">nota</tspan></text><rect x="251.961" y="314" width="66.5168" height="50" rx="3" fill="#c0432f"/><text x="285.22" y="308" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="285.22" dy="0">1</tspan></text><rect x="322.478" y="264" width="66.5168" height="100" rx="3" fill="#087f8c"/><text x="355.736" y="258" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="355.736" dy="0">2</tspan></text><text x="320.478" y="385" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="320.478" dy="0">v2: añade comentario</tspan></text><text x="320.478" y="402" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="320.478" dy="0">opcional</tspan></text><rect x="423.253" y="314" width="66.5168" height="50" rx="3" fill="#c0432f"/><text x="456.512" y="308" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="456.512" dy="0">1</tspan></text><rect x="493.77" y="314" width="66.5168" height="50" rx="3" fill="#087f8c"/><text x="527.028" y="308" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="527.028" dy="0">1</tspan></text><text x="491.77" y="385" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="491.77" dy="0">v3: renombra</tspan></text><text x="491.77" y="402" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="491.77" dy="0">estudiante a alumno</tspan></text><rect x="594.545" y="264" width="66.5168" height="100" rx="3" fill="#c0432f"/><text x="627.804" y="258" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="627.804" dy="0">2</tspan></text><rect x="665.062" y="264" width="66.5168" height="100" rx="3" fill="#087f8c"/><text x="698.32" y="258" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="698.32" dy="0">2</tspan></text><text x="663.062" y="385" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="663.062" dy="0">v4: la nota pasa de</tspan></text><text x="663.062" y="402" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="663.062" dy="0">número a texto</tspan></text><rect x="765.837" y="314" width="66.5168" height="50" rx="3" fill="#c0432f"/><text x="799.096" y="308" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="799.096" dy="0">1</tspan></text><rect x="836.354" y="264" width="66.5168" height="100" rx="3" fill="#087f8c"/><text x="869.612" y="258" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="869.612" dy="0">2</tspan></text><text x="834.354" y="385" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="834.354" dy="0">v5: añade el campo</tspan></text><text x="834.354" y="402" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="834.354" dy="0">estado</tspan></text><rect x="10" y="433" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="457.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">El lector tolerante gana 2 de 25 pares: los cambios aditivos (v2 y v5). Renombrar (v3) y cambiar el tipo (v4) rompen en</tspan></text><text x="470" y="474.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">ambos sentidos y exigen expandir y contraer. La matriz se construye ejecutando los lectores, no leyendo la especificación.</tspan></text><text x="470" y="491.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Es un modelo de cinco versiones, no un esquema real.</tspan></text><text x="470" y="538.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
