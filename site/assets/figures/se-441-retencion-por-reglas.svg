<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 271" width="940" height="271" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">50 000 registros sintéticos de cuatro tipos: un corte único a cinco años frente a reglas por tipo</title><desc id="d">Tabla con 50 000 registros sintéticos de cuatro tipos: un corte único a cinco años borra 5 479 registros antes de tiempo o en litigio y conserva 7 368 más de lo permitido, mientras que reglas por tipo con retención legal dan 0 y 0 por construcción del experimento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="271" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Política</tspan></text><rect x="340" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="502" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="502" dy="0">Borrados antes de tiempo o en litigio</tspan></text><rect x="670" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="797" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="797" dy="0">Conservados más de lo</tspan></text><text x="797" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="797" dy="0">permitido</tspan></text><rect x="10" y="56" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Corte único a 5 años</tspan></text><rect x="340" y="56" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">5 479</tspan></text><rect x="670" y="56" width="254" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">7 368</tspan></text><rect x="10" y="114" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="143.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Reglas por tipo con retención legal</tspan></text><rect x="340" y="114" width="324" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">0</tspan></text><rect x="670" y="114" width="254" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">0</tspan></text><rect x="10" y="176" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="200.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las reglas dan cero porque definen la verdad del experimento: no prueban que los plazos sean correctos. Los plazos son</tspan></text><text x="470" y="217.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ilustrativos del autor y no son asesoría legal.</tspan></text><text x="470" y="257.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
