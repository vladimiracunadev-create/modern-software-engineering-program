<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 439" width="940" height="439" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La misma página (440 KB) vista desde el laboratorio y desde tres segmentos de dispositivos: percentil 75 de la carga</title><desc id="d">Barras horizontales con el percentil 75 del tiempo de carga frente al límite de 2,5 segundos: el laboratorio con un escritorio rápido da 0,49, el escritorio rápido 0,49, el teléfono medio 1,69 y el teléfono lento 4,93; la población completa da 1,50 y supera el límite en el 10,2 por ciento de las cargas, mientras que el teléfono lento lo supera en el 98 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="439" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">La misma página (440 KB) vista desde el laboratorio y desde tres segmentos de dispositivos: percentil 75 de</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">la carga</tspan></text><line x1="324" y1="68" x2="324" y2="258" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="258" x2="324" y2="263" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="279" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="435.952" y1="68" x2="435.952" y2="258" stroke="#d5dde1" stroke-width="1"/><line x1="435.952" y1="258" x2="435.952" y2="263" stroke="#5b7280" stroke-width="1.4"/><text x="435.952" y="279" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="435.952" dy="0">1</tspan></text><line x1="547.904" y1="68" x2="547.904" y2="258" stroke="#d5dde1" stroke-width="1"/><line x1="547.904" y1="258" x2="547.904" y2="263" stroke="#5b7280" stroke-width="1.4"/><text x="547.904" y="279" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547.904" dy="0">2</tspan></text><line x1="659.856" y1="68" x2="659.856" y2="258" stroke="#d5dde1" stroke-width="1"/><line x1="659.856" y1="258" x2="659.856" y2="263" stroke="#5b7280" stroke-width="1.4"/><text x="659.856" y="279" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="659.856" dy="0">3</tspan></text><line x1="771.808" y1="68" x2="771.808" y2="258" stroke="#d5dde1" stroke-width="1"/><line x1="771.808" y1="258" x2="771.808" y2="263" stroke="#5b7280" stroke-width="1.4"/><text x="771.808" y="279" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="771.808" dy="0">4</tspan></text><line x1="883.76" y1="68" x2="883.76" y2="258" stroke="#d5dde1" stroke-width="1"/><line x1="883.76" y1="258" x2="883.76" y2="263" stroke="#5b7280" stroke-width="1.4"/><text x="883.76" y="279" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="883.76" dy="0">5</tspan></text><line x1="324" y1="258" x2="883.76" y2="258" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Laboratorio: solo escritorio rápido</tspan></text><text x="314" y="129.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Escritorio rápido (55 % de la población)</tspan></text><text x="314" y="167.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Teléfono medio (35 %)</tspan></text><text x="314" y="205.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Teléfono lento (10 %)</tspan></text><text x="314" y="243.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Campo: la población completa</tspan></text><rect x="324" y="74" width="54.8565" height="26" rx="3" fill="#102a43"/><text x="385.856" y="91.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="385.856" dy="0">0,49</tspan></text><rect x="324" y="112" width="54.8565" height="26" rx="3" fill="#102a43"/><text x="385.856" y="129.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="385.856" dy="0">0,49</tspan></text><rect x="324" y="150" width="189.199" height="26" rx="3" fill="#102a43"/><text x="520.199" y="167.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="520.199" dy="0">1,69</tspan></text><rect x="324" y="188" width="551.923" height="26" rx="3" fill="#102a43"/><text x="882.923" y="205.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.923" dy="0">4,93</tspan></text><rect x="324" y="226" width="167.928" height="26" rx="3" fill="#102a43"/><text x="498.928" y="243.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="498.928" dy="0">1,50</tspan></text><line x1="603.88" y1="68" x2="603.88" y2="258" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="608.88" y="81" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="608.88" dy="0">Límite 2,5 s</tspan></text><text x="603.88" y="302" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="603.88" dy="0">Tiempo de carga p75 (s)</tspan></text><rect x="10" y="316" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="340.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El p75 de la población (1,50 s) cumple y deja fuera a quienes más lo necesitan: el 10 % con teléfono lento queda en 4,93 s.</tspan></text><text x="470" y="357.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Para esa persona la página necesitaría 110 KB, o menos CPU, para llegar a 2,5 s. Los segmentos, los porcentajes y el modelo</tspan></text><text x="470" y="374.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">de tiempo son supuestos del autor; no se midió ningún navegador ni dispositivo.</tspan></text><text x="470" y="421.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
