<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 542" width="940" height="542" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reescribir frente a evolucionar según el horizonte (6 000 escenarios por fila)</title><desc id="d">Línea con la diferencia mediana de costo entre reescribir y evolucionar según el horizonte, con el porcentaje de escenarios en que reescribir gana: a 4 años +6,7 y 0 por ciento, a 6 años +6,3 y 1, a 8 años +6,0 y 4, a 10 años +5,7 y 10, a 15 años +4,5 y 25, y a 20 años +3,4 y 36.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="542" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Reescribir frente a evolucionar según el horizonte (6 000 escenarios por fila)</tspan></text><line x1="63.54" y1="359" x2="910" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="359" x2="63.54" y2="359" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="363.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">0</tspan></text><line x1="63.54" y1="284" x2="910" y2="284" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="284" x2="63.54" y2="284" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="288.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">2</tspan></text><line x1="63.54" y1="209" x2="910" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="209" x2="63.54" y2="209" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="213.5" font-size="13" text-an