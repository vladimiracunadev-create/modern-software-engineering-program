und" paint-order="stroke"><tspan x="284.155" dy="0">6,0 · 4 %</tspan></text><circle cx="385.462" cy="145.25" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="385.462" y="134.25" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="385.462" dy="0">5,7 · 10 %</tspan></text><circle cx="638.731" cy="190.25" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="638.731" y="179.25" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="638.731" dy="0">4,5 · 25 %</tspan></text><circle cx="892" cy="231.5" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="220.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">3,4 · 36 %</tspan></text><rect x="10" y="419" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="443.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La ventaja de evolucionar se acorta con el plazo, pero no se invierte en este rango: la diferencia sigue siendo positiva a</tspan></text><text x="470" y="460.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">20 años. El rótulo de cada punto añade el porcentaje de escenarios en que reescribir gana. El horizonte es una variable de</tspan></text><text x="470" y="477.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">negocio: un sistema con fecha de retiro conocida cambia la respuesta más que cualquier detalle técnico.</tspan></text><text x="470" y="524.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
