<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 431" width="940" height="431" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reescribir frente a evolucionar según el horizonte (6 000 escenarios por fila)</title><desc id="d">Tabla con el horizonte de equilibrio entre reescribir y evolucionar: a 4 años reescribir cuesta 6,7 unidades más que evolucionar de mediana y gana en 0 por ciento de los escenarios, a 10 años 5,7 y 10 por ciento, a 15 años 4,5 y 25 por ciento, y a 20 años 3,4 y 36 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="431" fill="#ffffff"/><rect x="10" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="107" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="107" dy="0">Horizonte</tspan></text><rect x="210" y="12" width="434" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="427" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="427" dy="0">Reescribir − evolucionar (mediana)</tspan></text><rect x="650" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="787" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="787" dy="0">Reescribir gana</tspan></text><rect x="10" y="56" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">4 años</tspan></text><rect x="210" y="56" width="434" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="427" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="427" dy="0">+6,7</tspan></text><rect x="650" y="56" width="274" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">0 %</tspan></text><rect x="10" y="102" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="125.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">6 años</tspan></text><rect x="210" y="102" width="434" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="427" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="427" dy="0">+6,3</tspan></text><rect x="650" y="102" width="274" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">1 %</tspan></text><rect x="10" y="148" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="171.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">8 años</tspan></text><rect x="210" y="148" width="434" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="427" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="427" dy="0">+6,0</tspan></text><rect x="650" y="148" width="274" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">4 %</tspan></text><rect x="10" y="194" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="217.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">10 años</tspan></text><rect x="210" y="194" width="434" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="427" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="427" dy="0">+5,7</tspan></text><rect x="650" y="194" width="274" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">10 %</tspan></text><rect x="10" y="240" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="263.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">15 años</tspan></text><rect x="210" y="240" width="434" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="427" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="427" dy="0">+4,5</tspan></text><rect x="650" y="240" width="274" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">25 %</tspan></text><rect x="10" y="286" width="194" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="309.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">20 años</tspan></text><rect x="210" y="286" width="434" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="427" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="427" dy="0">+3,4</tspan></text><rect x="650" y="286" width="274" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">36 %</tspan></text><rect x="10" y="336" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="360.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La ventaja de evolucionar se acorta con el plazo, pero no se invierte en este rango. El horizonte es una variable de</tspan></text><text x="470" y="377.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">negocio: un sistema con fecha de retiro conocida cambia la respuesta más que cualquier detalle técnico.</tspan></text><text x="470" y="417.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
