<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 573" width="940" height="573" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Umbral de la hipótesis de estado estable (p95 por ventana de 10 s): falsas alarmas y detección de un aumento de 10 ms</title><desc id="d">Barras agrupadas con las ejecuciones sanas que alarman y las que detectan un aumento de 10 milisegundos por umbral: el máximo de una ejecución base de 73 milisegundos alarma en 46 de 100 y detecta 100 de 100; multiplicarlo por 1,5 da 0 falsas alarmas y detecta 41; el p99,9 de 30 ejecuciones por 1,2 da 0 y detecta 92.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="573" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Umbral de la hipótesis de estado estable (p95 por ventana de 10 s): falsas alarmas y detección de un aumento</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">de 10 ms</tspan></text><rect x="16" y="64" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Ejecuciones sanas con alarma</tspan></text><rect x="275.12" y="64" width="12" height="12" rx="2" fill="#087f8c"/><text x="295.12" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="295.12" dy="0">Detecta +10 ms</tspan></text><line x1="78.62" y1="364" x2="920" y2="364" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="364" x2="78.62" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="368.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="301.5" x2="920" y2="301.5" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="301.5" x2="78.62" y2="301.5" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="306" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">25</tspan></text><line x1="78.62" y1="239" x2="920" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="239" x2="78.62" y2="239" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="243.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">50</tspan></text><line x1="78.62" y1="176.5" x2="920" y2="176.5" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="176.5" x2="78.62" y2="176.5" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="181" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">75</tspan></text><line x1="78.62" y1="114" x2="920" y2="114" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="114" x2="78.62" y2="114" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="118.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="114" x2="78.62" y2="364" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="239" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 239)">Ejecuciones de 100</text><rect x="106.666" y="249" width="110.184" height="115" rx="3" fill="#c0432f"/><text x="161.758" y="243" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="161.758" dy="0">46</tspan></text><rect x="220.85" y="114" width="110.184" height="250" rx="3" fill="#087f8c"/><text x="275.942" y="108" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="275.942" dy="0">100</tspan></text><text x="218.85" y="385" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="218.85" dy="0">Máximo de la base (5 min) = 73 ms</tspan></text><rect x="387.126" y="362" width="110.184" height="2" rx="3" fill="#c0432f"/><text x="442.218" y="356" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="442.218" dy="0">0</tspan></text><rect x="501.31" y="261.5" width="110.184" height="102.5" rx="3" fill="#087f8c"/><text x="556.402" y="255.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="556.402" dy="0">41</tspan></text><text x="499.31" y="385" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="499.31" dy="0">Ese máximo × 1,5 = 110 ms</tspan></text><rect x="667.586" y="362" width="110.184" height="2" rx="3" fill="#c0432f"/><text x="722.678" y="356" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="722.678" dy="0">0</tspan></text><rect x="781.77" y="134" width="110.184" height="230" rx="3" fill="#087f8c"/><text x="836.862" y="128" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="836.862" dy="0">92</tspan></text><text x="779.77" y="385" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="779.77" dy="0">p99,9 de 30 ejecuciones base × 1,2 =</tspan></text><text x="779.77" y="402" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="779.77" dy="0">94 ms</tspan></text><rect x="10" y="433" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="457.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Un solo experimento de base fija un umbral demasiado ajustado o demasiado holgado sin que se note. Con 30 ejecuciones base</tspan></text><text x="470" y="474.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">se conoce la forma del ruido y el umbral deja de ser una conjetura. El aumento de 10 ms sobre 50 ms de servicio (al 75 % de</tspan></text><text x="470" y="491.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">utilización) es un fallo sutil escogido por el autor. Ventanas falsas: 2,00 % con el primer umbral y 0,00 % con los otros</tspan></text><text x="470" y="507.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">dos.</tspan></text><text x="470" y="555.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
