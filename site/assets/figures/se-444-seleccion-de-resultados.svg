<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 425" width="940" height="425" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dos versiones idénticas comparadas 4 000 veces: porcentaje de informes que declaran una mejora de al menos el 5 %</title><desc id="d">Barras horizontales con el porcentaje de informes que declaran una mejora de al menos 5 por ciento entre dos versiones idénticas: 0,1 con el procedimiento fijado de antemano, 23,1 al elegir la mejor de cinco repeticiones, 59,1 al elegir la mejor de seis métricas y 96,4 al combinar ambas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="425" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dos versiones idénticas comparadas 4 000 veces: porcentaje de informes que declaran una mejora de al menos</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">el 5 %</tspan></text><line x1="354" y1="68" x2="354" y2="244" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="244" x2="354" y2="249" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="265" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="486.44" y1="68" x2="486.44" y2="244" stroke="#d5dde1" stroke-width="1"/><line x1="486.44" y1="244" x2="486.44" y2="249" stroke="#5b7280" stroke-width="1.4"/><text x="486.44" y="265" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="486.44" dy="0">25</tspan></text><line x1="618.88" y1="68" x2="618.88" y2="244" stroke="#d5dde1" stroke-width="1"/><line x1="618.88" y1="244" x2="618.88" y2="249" stroke="#5b7280" stroke-width="1.4"/><text x="618.88" y="265" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="618.88" dy="0">50</tspan></text><line x1="751.32" y1="68" x2="751.32" y2="244" stroke="#d5dde1" stroke-width="1"/><line x1="751.32" y1="244" x2="751.32" y2="249" stroke="#5b7280" stroke-width="1.4"/><text x="751.32" y="265" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="751.32" dy="0">75</tspan></text><line x1="883.76" y1="68" x2="883.76" y2="244" stroke="#d5dde1" stroke-width="1"/><line x1="883.76" y1="244" x2="883.76" y2="249" stroke="#5b7280" stroke-width="1.4"/><text x="883.76" y="265" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="883.76" dy="0">100</tspan></text><line x1="354" y1="244" x2="883.76" y2="244" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="86" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Mediana de 30 contra mediana de 30, una</tspan></text><text x="344" y="103" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">métrica, una vez</tspan></text><text x="344" y="130" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">La mejor de 5 repeticiones de B contra una</tspan></text><text x="344" y="147" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">corrida de A</tspan></text><text x="344" y="182.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">La mejor de 6 métricas, 30 contra 30</tspan></text><text x="344" y="218" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">La mejor de 6 métricas y la mejor de 5</tspan></text><text x="344" y="235" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">repeticiones de B</tspan></text><rect x="354" y="74" width="2" height="32" rx="3" fill="#c0432f"/><text x="363" y="94.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0,1</tspan></text><rect x="354" y="118" width="122.375" height="32" rx="3" fill="#c0432f"/><text x="483.375" y="138.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="483.375" dy="0">23,1</tspan></text><rect x="354" y="162" width="313.088" height="32" rx="3" fill="#c0432f"/><text x="674.088" y="182.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="674.088" dy="0">59,1</tspan></text><rect x="354" y="206" width="510.689" height="32" rx="3" fill="#c0432f"/><text x="871.689" y="226.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="871.689" dy="0">96,4</tspan></text><text x="618.88" y="288" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="618.88" dy="0">Informes que declaran una mejora (%)</tspan></text><rect x="10" y="302" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="326.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Nada del procedimiento es fraudulento paso a paso y casi todos los informes concluyen una mejora que no existe. La defensa</tspan></text><text x="470" y="343.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">es registrar antes la métrica, el número de repeticiones y el criterio, y publicar todas las corridas; el validador de la</tspan></text><text x="470" y="360.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">figura anterior no puede verificar el orden.</tspan></text><text x="470" y="407.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
