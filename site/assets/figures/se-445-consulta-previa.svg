<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 371" width="820" height="371" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuántas decisiones se revierten</title><desc id="d">Tabla con 6 000 decisiones sintéticas: sin consulta previa por escrito se revierte el 29,9 por ciento y cuesta 4,49 días de trabajo por decisión, con 2 personas 21,7 por ciento y 4,75 días, con 4 personas 13,9 por ciento y 4,09 días, y con 8 personas 5,9 por ciento y 3,89 días.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="820" height="371" fill="#ffffff"/><rect x="10" y="12" width="222" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="121" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="121" dy="0">Personas que leen antes</tspan></text><rect x="238" y="12" width="205" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="340.5" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="340.5" dy="0">Decisiones revertidas</tspan></text><rect x="449" y="12" width="355" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="626.5" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="626.5" dy="0">Días de trabajo por decisión (consulta más</tspan></text><text x="626.5" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="626.5" dy="0">reversión)</tspan></text><rect x="10" y="56" width="222" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="121" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="121" dy="0">0</tspan></text><rect x="238" y="56" width="205" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="340.5" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="340.5" dy="0">29,9 %</tspan></text><rect x="449" y="56" width="355" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="626.5" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="626.5" dy="0">4,49</tspan></text><rect x="10" y="106" width="222" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="121" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="121" dy="0">2</tspan></text><rect x="238" y="106" width="205" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="340.5" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="340.5" dy="0">21,7 %</tspan></text><rect x="449" y="106" width="355" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="626.5" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="626.5" dy="0">4,75</tspan></text><rect x="10" y="156" width="222" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="121" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="121" dy="0">4</tspan></text><rect x="238" y="156" width="205" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="340.5" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="340.5" dy="0">13,9 %</tspan></text><rect x="449" y="156" width="355" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="626.5" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="626.5" dy="0">4,09</tspan></text><rect x="10" y="206" width="222" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="121" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="121" dy="0">8</tspan></text><rect x="238" y="206" width="205" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="340.5" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="340.5" dy="0">5,9 %</tspan></text><rect x="449" y="206" width="355" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="626.5" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="626.5" dy="0">3,89</tspan></text><rect x="10" y="260" width="800" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="410" y="284.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="410" dy="0">Las reversiones bajan con cada persona que lee, pero el costo total no baja de inmediato: consultar a dos</tspan></text><text x="410" y="301.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="410" dy="0">personas cuesta más días que no consultar a nadie, porque el beneficio no compensa aún el costo fijo de</tspan></text><text x="410" y="318.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="410" dy="0">preparar y esperar. El balance mejora con cuatro y con ocho.</tspan></text><text x="410" y="357.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="410" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
