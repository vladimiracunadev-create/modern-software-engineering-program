<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 883 371" width="883" height="371" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué siembra produce adopción</title><desc id="d">Tabla con 2 000 redes sintéticas de 30 personas y cuatro siembras de una práctica: con solo un anuncio general la adopción es nula en el 100 por ciento de las redes, con dos personas al azar la mediana es 93,3 por ciento y 63,2 por ciento de las redes pasan del 80 por ciento, con dos muy conectadas 96,7 y 95,7 por ciento, y con dos poco conectadas 6,7 y 11,4 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="883" height="371" fill="#ffffff"/><rect x="10" y="12" width="216" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="118" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="118" dy="0">Siembra</tspan></text><rect x="232" y="12" width="210" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="337" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="337" dy="0">Adopción final (mediana)</tspan></text><rect x="448" y="12" width="179" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="537.5" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="537.5" dy="0">Redes con 80 % o más</tspan></text><rect x="633" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="750" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="750" dy="0">Redes que no pasan del 10 %</tspan></text><rect x="10" y="56" width="216" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="118" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="118" dy="0">Solo un anuncio general</tspan></text><rect x="232" y="56" width="210" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="337" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="337" dy="0">0,0 %</tspan></text><rect x="448" y="56" width="179" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537.5" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537.5" dy="0">0,0 %</tspan></text><rect x="633" y="56" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="750" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="750" dy="0">100,0 %</tspan></text><rect x="10" y="106" width="216" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="118" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="118" dy="0">2 personas al azar</tspan></text><rect x="232" y="106" width="210" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="337" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="337" dy="0">93,3 %</tspan></text><rect x="448" y="106" width="179" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537.5" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537.5" dy="0">63,2 %</tspan></text><rect x="633" y="106" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="750" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="750" dy="0">14,4 %</tspan></text><rect x="10" y="156" width="216" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="118" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="118" dy="0">2 personas muy conectadas</tspan></text><rect x="232" y="156" width="210" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="337" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="337" dy="0">96,7 %</tspan></text><rect x="448" y="156" width="179" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537.5" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537.5" dy="0">95,7 %</tspan></text><rect x="633" y="156" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="750" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="750" dy="0">0,2 %</tspan></text><rect x="10" y="206" width="216" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="118" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="118" dy="0">2 personas poco conectadas</tspan></text><rect x="232" y="206" width="210" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="337" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="337" dy="0">6,7 %</tspan></text><rect x="448" y="206" width="179" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537.5" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537.5" dy="0">11,4 %</tspan></text><rect x="633" y="206" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="750" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="750" dy="0">72,7 %</tspan></text><rect x="10" y="260" width="863" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="441.5" y="284.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="441.5" dy="0">Cada fila es una forma de empezar; la columna central dice cuánto del equipo termina usando la práctica y las demás</tspan></text><text x="441.5" y="301.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="441.5" dy="0">cuántas redes llegan lejos o se quedan inmóviles. La diferencia entre las dos últimas filas es la lección: son dos</tspan></text><text x="441.5" y="318.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="441.5" dy="0">personas en ambos casos, y el resultado va de casi todo a casi nada según dónde están.</tspan></text><text x="441.5" y="357.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="441.5" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
