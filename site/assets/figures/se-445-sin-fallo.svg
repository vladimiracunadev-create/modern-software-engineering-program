<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 549" width="940" height="549" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una corrida sin ningún fallo de componente: temperatura máxima y segundos con calentador y puerta abierta, sin y con limitador</title><desc id="d">Barras con el resultado de una corrida de 900 segundos en la que el controlador cumple su especificación, pero la consigna es de 300 grados: sin limitador la temperatura llega a 300,1 y hay 684 segundos con el calentador conectado y la puerta abierta; con un limitador independiente en 250 llega a 185,4 y hay 0 segundos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="549" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Una corrida sin ningún fallo de componente: temperatura máxima y segundos con calentador y puerta abierta,</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">sin y con limitador</tspan></text><rect x="16" y="64" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Temperatura máxima (C)</tspan></text><rect x="229.88" y="64" width="12" height="12" rx="2" fill="#102a43"/><text x="249.88" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="249.88" dy="0">Segundos con calentador y puerta abierta</tspan></text><line x1="78.62" y1="374" x2="920" y2="374" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="374" x2="78.62" y2="374" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="378.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="309" x2="920" y2="309" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="309" x2="78.62" y2="309" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="313.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">200</tspan></text><line x1="78.62" y1="244" x2="920" y2="244" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="244" x2="78.62" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="248.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">400</tspan></text><line x1="78.62" y1="179" x2="920" y2="179" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="179" x2="78.62" y2="179" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="183.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">600</tspan></text><line x1="78.62" y1="114" x2="920" y2="114" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="114" x2="78.62" y2="114" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="118.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">800</tspan></text><line x1="78.62" y1="114" x2="78.62" y2="374" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="244" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 244)">Grados o segundos</text><rect x="120.689" y="276.467" width="166.276" height="97.5325" rx="3" fill="#c0432f"/><text x="203.827" y="270.467" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="203.827" dy="0">300,1</tspan></text><rect x="290.965" y="151.7" width="166.276" height="222.3" rx="3" fill="#102a43"/><text x="374.103" y="145.7" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="374.103" dy="0">684,0</tspan></text><text x="288.965" y="395" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="288.965" dy="0">Sin limitador</tspan></text><rect x="541.379" y="313.745" width="166.276" height="60.255" rx="3" fill="#c0432f"/><text x="624.517" y="307.745" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="624.517" dy="0">185,4</tspan></text><rect x="711.655" y="372" width="166.276" height="2" rx="3" fill="#102a43"/><text x="794.793" y="366" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="794.793" dy="0">0,0</tspan></text><text x="709.655" y="395" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="709.655" dy="0">Con limitador independiente</tspan></text><line x1="78.62" y1="292.75" x2="920" y2="292.75" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="916" y="286.75" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="916" dy="0">límite 250 C</tspan></text><rect x="10" y="426" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="450.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Ningún componente falló: la especificación pedía calentar mientras la temperatura fuera menor que la consigna y nadie había</tspan></text><text x="470" y="467.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">escrito qué hacer con una puerta abierta o con una consigna superior al límite. Un análisis de fallos de componentes no ve</tspan></text><text x="470" y="484.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">este caso; el análisis de acciones de control no seguras lo enumera: 22 de 72 combinaciones evaluadas son peligrosas.</tspan></text><text x="470" y="531.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 47; muestra un mecanismo, no mide un producto real.</tspan></text></svg>
