<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 992 355" width="992" height="355" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuánta guardia recibe cada persona</title><desc id="d">Tabla con 3 000 años simulados de una guardia semanal con 1,5 avisos por semana fuera de horario: con 3 personas cada una está 18 semanas al año de guardia y recibe 27 avisos con 3,45 semanas de tres o más, con 4 personas 13 semanas, 19,5 avisos y 2,48 semanas, con 6 personas 9, 13,5 y 1,73, y con 8 personas 7, 10,5 y 1,33.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="992" height="355" fill="#ffffff"/><rect x="10" y="12" width="168" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="94" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="94" dy="0">Tamaño de la</tspan></text><text x="94" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="94" dy="0">rotación</tspan></text><rect x="184" y="12" width="196" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="282" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="282" dy="0">Semanas de guardia al</tspan></text><text x="282" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="282" dy="0">año</tspan></text><rect x="386" y="12" width="292" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="532" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="532" dy="0">Avisos fuera de horario por</tspan></text><text x="532" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="532" dy="0">persona y año</tspan></text><rect x="684" y="12" width="292" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="830" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="830" dy="0">Semanas con 3 o más avisos por</tspan></text><text x="830" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="830" dy="0">persona y año</tspan></text><rect x="10" y="56" width="168" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="94" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="94" dy="0">3 personas</tspan></text><rect x="184" y="56" width="196" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="282" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="282" dy="0">18</tspan></text><rect x="386" y="56" width="292" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">27,0</tspan></text><rect x="684" y="56" width="292" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="830" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">3,45</tspan></text><rect x="10" y="106" width="168" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="94" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="94" dy="0">4 personas</tspan></text><rect x="184" y="106" width="196" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="282" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="282" dy="0">13</tspan></text><rect x="386" y="106" width="292" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">19,5</tspan></text><rect x="684" y="106" width="292" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="830" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">2,48</tspan></text><rect x="10" y="156" width="168" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="94" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="94" dy="0">6 personas</tspan></text><rect x="184" y="156" width="196" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="282" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="282" dy="0">9</tspan></text><rect x="386" y="156" width="292" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">13,5</tspan></text><rect x="684" y="156" width="292" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="830" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">1,73</tspan></text><rect x="10" y="206" width="168" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="94" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="94" dy="0">8 personas</tspan></text><rect x="184" y="206" width="196" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="282" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="282" dy="0">7</tspan></text><rect x="386" y="206" width="292" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="532" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="532" dy="0">10,5</tspan></text><rect x="684" y="206" width="292" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="830" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">1,33</tspan></text><rect x="10" y="260" width="972" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="496" y="284.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="496" dy="0">El número de avisos por persona baja en proporción al tamaño de la rotación, pero las semanas malas (tres o más avisos) bajan más</tspan></text><text x="496" y="301.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="496" dy="0">despacio: aunque la media baje, siempre habrá semanas duras.</tspan></text><text x="496" y="341.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="496" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
