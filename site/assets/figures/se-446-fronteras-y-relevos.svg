<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 302" width="940" height="302" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuántos equipos cruza un cambio</title><desc id="d">Barras con 5 000 cambios sintéticos sobre cuatro dominios y tres capas: con equipos por capa el plazo estimado es de 5,9 días, un cambio cruza 2,31 equipos y el 81 por ciento requiere relevo; con equipos por dominio el plazo es de 2,6 días, cruza 1,21 y el 21,1 por ciento requiere relevo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="302" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuántos equipos cruza un cambio</tspan></text><line x1="354" y1="49" x2="354" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="137" x2="354" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="533.273" y1="49" x2="533.273" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="533.273" y1="137" x2="533.273" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="533.273" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="533.273" dy="0">2</tspan></text><line x1="712.547" y1="49" x2="712.547" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="712.547" y1="137" x2="712.547" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="712.547" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="712.547" dy="0">4</tspan></text><line x1="891.82" y1="49" x2="891.82" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="891.82" y1="137" x2="891.82" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="891.82" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="891.82" dy="0">6</tspan></text><line x1="354" y1="137" x2="891.82" y2="137" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="67" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Equipos por capa (2,31 equipos por cambio ·</tspan></text><text x="344" y="84" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">81,0 % requiere relevo)</tspan></text><text x="344" y="111" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Equipos por dominio (1,21 equipos · 21,1 %</tspan></text><text x="344" y="128" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">requiere relevo)</tspan></text><rect x="354" y="55" width="528.856" height="32" rx="3" fill="#c0432f"/><text x="889.856" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="889.856" dy="0">5,9</tspan></text><rect x="354" y="99" width="233.055" height="32" rx="3" fill="#c0432f"/><text x="594.055" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="594.055" dy="0">2,6</tspan></text><text x="622.91" y="181" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="622.91" dy="0">días de plazo estimado</tspan></text><rect x="10" y="195" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="219.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Cada barra es una forma de cortar el mismo trabajo; el plazo baja a menos de la mitad porque los relevos desaparecen, no</tspan></text><text x="470" y="236.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">porque se trabaje más rápido.</tspan></text><text x="470" y="284.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
