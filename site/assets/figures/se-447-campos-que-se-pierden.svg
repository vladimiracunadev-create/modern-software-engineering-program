<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuántos campos sobreviven a los relevos</title><desc id="d">Líneas con el porcentaje de mensajes de decisión completos tras varios relevos: el oral llega completo en 26,2 por ciento tras un relevo, 6,7 tras dos y 0,5 tras cuatro; el correo libre 49,6, 24,7 y 5,5; la plantilla con acuse 88,0, 76,7 y 58,3.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuántos campos sobreviven a los relevos</tspan></text><circle cx="22" cy="51" r="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Plantilla con acuse</tspan></text><rect x="207.26" y="45" width="12" height="12" fill="#946512" stroke="#946512" stroke-width="2"/><text x="227.26" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="227.26" dy="0">Correo libre</tspan></text><polygon points="351.74,44.1 358.34,56.4 345.14,56.4" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="365.74" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="365.74" dy="0">Oral</tspan></text><line x1="78.62" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="387" x2="78.62" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="327" x2="910" y2="327" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="327" x2="78.62" y2="327" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="331.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">20</tspan></text><line x1="78.62" y1="267" x2="910" y2="267" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="267" x2="78.62" y2="267" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="271.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">40</tspan></text><line x1="78.62" y1="207" x2="910" y2="207" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="207" x2="78.62" y2="207" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="211.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">60</tspan></text><line x1="78.62" y1="147" x2="910" y2="147" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="147" x2="78.62" y2="147" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="151.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">80</tspan></text><line x1="78.62" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="87" x2="78.62" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="87" x2="78.62" y2="387" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="87" x2="96.62" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="387" x2="96.62" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">1</tspan></text><line x1="361.747" y1="87" x2="361.747" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="361.747" y1="387" x2="361.747" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="361.747" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="361.747" dy="0">2</tspan></text><line x1="892" y1="87" x2="892" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="387" x2="892" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">4</tspan></text><line x1="78.62" y1="387" x2="910" y2="387" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 237)">Mensajes completos (%)</text><text x="494.31" y="433" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Relevos que atraviesa el mensaje</tspan></text><polyline points="96.62,123 361.747,156.9 892,212.1" fill="none" stroke="#087f8c" stroke-width="2.4"/><circle cx="96.62" cy="123" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="96.62" y="112" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">88,0</tspan></text><circle cx="361.747" cy="156.9" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="361.747" y="145.9" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="361.747" dy="0">76,7</tspan></text><circle cx="892" cy="212.1" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="201.1" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">58,3</tspan></text><polyline points="96.62,238.2 361.747,312.9 892,370.5" fill="none" stroke="#946512" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="91.12" y="232.7" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="96.62" y="227.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">49,6</tspan></text><rect x="356.247" y="307.4" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="361.747" y="301.9" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="361.747" dy="0">24,7</tspan></text><rect x="886.5" y="365" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="892" y="359.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">5,5</tspan></text><polyline points="96.62,308.4 361.747,366.9 892,385.5" fill="none" stroke="#c0432f" stroke-width="2.4"/><polygon points="96.62,302.075 102.67,313.35 90.57,313.35" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="96.62" y="332.4" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">26,2</tspan></text><polygon points="361.747,360.575 367.797,371.85 355.697,371.85" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="361.747" y="390.9" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="361.747" dy="0">6,7</tspan></text><polygon points="892,379.175 898.05,390.45 885.95,390.45" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="882" y="390" font-size="13" text-anchor="end" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="882" dy="0">0,5</tspan></text><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Tras cuatro relevos el motivo se conserva en el 17,6 % de los mensajes orales, el 40,8 % de los correos libres y el 84,6 %</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">de las plantillas con acuse. Incluso con la plantilla, solo el 58,3 % del mensaje llega completo; el oral prácticamente no</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">sobrevive. El motivo, que explica cómo adaptar la decisión, cae más rápido que el resto en los formatos libres.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
