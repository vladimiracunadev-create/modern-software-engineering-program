<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 858 321" width="858" height="321" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuántos campos sobreviven a los relevos</title><desc id="d">Tabla con 6 000 mensajes sintéticos de decisión de cinco campos tras varios relevos: oral llega completo en 26,2 por ciento tras un relevo, 6,7 tras dos y 0,5 tras cuatro y conserva el motivo en 17,6, el correo libre 49,6, 24,7 y 5,5 con motivo en 40,8, y la plantilla con acuse 88, 76,7 y 58,3 con motivo en 84,6.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="858" height="321" fill="#ffffff"/><rect x="10" y="12" width="165" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="92.5" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="92.5" dy="0">Formato</tspan></text><rect x="181" y="12" width="257" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="309.5" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="309.5" dy="0">Mensaje completo tras 1 relevo</tspan></text><rect x="444" y="12" width="84" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="486" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="486" dy="0">Tras 2</tspan></text><rect x="534" y="12" width="84" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="576" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="576" dy="0">Tras 4</tspan></text><rect x="624" y="12" width="218" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="733" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="733" dy="0">Conserva el motivo tras 4</tspan></text><rect x="10" y="56" width="165" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="92.5" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="92.5" dy="0">Oral</tspan></text><rect x="181" y="56" width="257" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="309.5" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="309.5" dy="0">26,2 %</tspan></text><rect x="444" y="56" width="84" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="486" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="486" dy="0">6,7 %</tspan></text><rect x="534" y="56" width="84" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="576" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="576" dy="0">0,5 %</tspan></text><rect x="624" y="56" width="218" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="733" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="733" dy="0">17,6 %</tspan></text><rect x="10" y="106" width="165" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="92.5" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="92.5" dy="0">Correo libre</tspan></text><rect x="181" y="106" width="257" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="309.5" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="309.5" dy="0">49,6 %</tspan></text><rect x="444" y="106" width="84" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="486" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="486" dy="0">24,7 %</tspan></text><rect x="534" y="106" width="84" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="576" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="576" dy="0">5,5 %</tspan></text><rect x="624" y="106" width="218" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="733" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="733" dy="0">40,8 %</tspan></text><rect x="10" y="156" width="165" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="92.5" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="92.5" dy="0">Plantilla con acuse</tspan></text><rect x="181" y="156" width="257" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="309.5" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="309.5" dy="0">88,0 %</tspan></text><rect x="444" y="156" width="84" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="486" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="486" dy="0">76,7 %</tspan></text><rect x="534" y="156" width="84" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="576" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="576" dy="0">58,3 %</tspan></text><rect x="624" y="156" width="218" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="733" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="733" dy="0">84,6 %</tspan></text><rect x="10" y="210" width="838" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="429" y="234.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="429" dy="0">Incluso con la plantilla, tras cuatro relevos solo el 58,3 % del mensaje llega completo; el oral prácticamente</tspan></text><text x="429" y="251.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="429" dy="0">no sobrevive. El motivo, que explica cómo adaptar la decisión, cae más rápido que el resto en los formatos</tspan></text><text x="429" y="268.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="429" dy="0">libres.</tspan></text><text x="429" y="307.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="429" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
