<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 371" width="820" height="371" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué tareas hacen crecer</title><desc id="d">Tabla con 1 000 personas simuladas durante 52 semanas con nivel inicial 3: con tareas fáciles el nivel final mediano es 3,07 y hay 0,3 semanas de fracaso, con tareas calibradas 8,87 y 6,2, con tareas muy difíciles 3,04 y 37,9, y con dificultad al azar 4,8 y 14.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="820" height="371" fill="#ffffff"/><rect x="10" y="12" width="263" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="141.5" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="141.5" dy="0">Tareas asignadas</tspan></text><rect x="279" y="12" width="235" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="396.5" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="396.5" dy="0">Nivel final (mediana)</tspan></text><rect x="520" y="12" width="284" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="662" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="662" dy="0">Semanas con fracaso al año</tspan></text><rect x="10" y="56" width="263" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="141.5" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="141.5" dy="0">Fáciles (nivel − 2)</tspan></text><rect x="279" y="56" width="235" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="396.5" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="396.5" dy="0">3,07</tspan></text><rect x="520" y="56" width="284" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">0,3</tspan></text><rect x="10" y="106" width="263" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="141.5" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="141.5" dy="0">Calibradas (nivel + 1)</tspan></text><rect x="279" y="106" width="235" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="396.5" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="396.5" dy="0">8,87</tspan></text><rect x="520" y="106" width="284" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">6,2</tspan></text><rect x="10" y="156" width="263" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="141.5" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="141.5" dy="0">Muy difíciles (nivel + 4)</tspan></text><rect x="279" y="156" width="235" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="396.5" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="396.5" dy="0">3,04</tspan></text><rect x="520" y="156" width="284" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">37,9</tspan></text><rect x="10" y="206" width="263" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="141.5" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="141.5" dy="0">Dificultad al azar</tspan></text><rect x="279" y="206" width="235" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="396.5" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="396.5" dy="0">4,80</tspan></text><rect x="520" y="206" width="284" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="662" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="662" dy="0">14,0</tspan></text><rect x="10" y="260" width="800" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="410" y="284.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="410" dy="0">Las tareas fáciles y las muy difíciles dejan casi igual el nivel final, por razones opuestas: una no enseña</tspan></text><text x="410" y="301.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="410" dy="0">y la otra fracasa casi todas las semanas. Las calibradas aceptan semanas de fracaso (6 de 52) como costo</tspan></text><text x="410" y="318.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="410" dy="0">del aprendizaje.</tspan></text><text x="410" y="357.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="410" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
