<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué ocurre cuando el equipo está lleno</title><desc id="d">Líneas con el ciclo de elementos simulados en una cola de un servidor según la carga: el ciclo medio es 2 unidades de trabajo con 50 por ciento, 3,3 con 70, 6,7 con 85 y 18,2 con 95 frente a 20 teórico, y el percentil 90 es 4,6, 7,7, 15,1 y 42; la curva se dispara al acercarse al 100 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué ocurre cuando el equipo está lleno</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Ciclo p90</tspan></text><rect x="131.86" y="45" width="12" height="12" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><text x="151.86" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="151.86" dy="0">Valor teórico 1/(1 − carga)</tspan></text><polygon points="389.44,44.1 396.04,56.4 382.84,56.4" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="403.44" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="403.44" dy="0">Ciclo medio</tspan></text><line x1="71.08" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="387" x2="71.08" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="327" x2="910" y2="327" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="327" x2="71.08" y2="327" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="331.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="267" x2="910" y2="267" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="267" x2="71.08" y2="267" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="271.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="207" x2="910" y2="207" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="207" x2="71.08" y2="207" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="211.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">30</tspan></text><line x1="71.08" y1="147" x2="910" y2="147" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="147" x2="71.08" y2="147" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="151.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">40</tspan></text><line x1="71.08" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="87" x2="71.08" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">50</tspan></text><line x1="71.08" y1="87" x2="71.08" y2="387" stroke="#5b7280" stroke-width="1.6"/><line x1="89.08" y1="87" x2="89.08" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="89.08" y1="387" x2="89.08" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="89.08" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="89.08" dy="0">50 %</tspan></text><line x1="445.933" y1="87" x2="445.933" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="445.933" y1="387" x2="445.933" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="445.933" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="445.933" dy="0">70 %</tspan></text><line x1="713.573" y1="87" x2="713.573" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="713.573" y1="387" x2="713.573" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="713.573" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="713.573" dy="0">85 %</tspan></text><line x1="892" y1="87" x2="892" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="387" x2="892" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">95 %</tspan></text><line x1="71.08" y1="387" x2="910" y2="387" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 237)">Ciclo (unidades de trabajo)</text><text x="490.54" y="433" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="490.54" dy="0">Carga del equipo (%)</tspan></text><polyline points="89.08,359.4 445.933,340.8 713.573,296.4 892,135" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="89.08" cy="359.4" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="89.08" y="348.4" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="89.08" dy="0">4,6</tspan></text><circle cx="445.933" cy="340.8" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="445.933" y="329.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="445.933" dy="0">7,7</tspan></text><circle cx="713.573" cy="296.4" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="713.573" y="285.4" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="713.573" dy="0">15,1</tspan></text><circle cx="892" cy="135" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="124" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">42,0</tspan></text><polyline points="89.08,375 445.933,367.2 713.573,346.8 892,267" fill="none" stroke="#6b7c86" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="83.58" y="369.5" width="11" height="11" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><rect x="440.433" y="361.7" width="11" height="11" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><rect x="708.073" y="341.3" width="11" height="11" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><rect x="886.5" y="261.5" width="11" height="11" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><text x="892" y="256" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">20,0</tspan></text><polyline points="89.08,375 445.933,367.2 713.573,346.8 892,277.8" fill="none" stroke="#087f8c" stroke-width="2.4"/><polygon points="89.08,368.675 95.13,379.95 83.03,379.95" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polygon points="445.933,360.875 451.983,372.15 439.883,372.15" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polygon points="713.573,340.475 719.623,351.75 707.523,351.75" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polygon points="892,271.475 898.05,282.75 885.95,282.75" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="301.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">18,2</tspan></text><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Pasar de 70 % a 95 % de carga multiplica el ciclo por más de cinco; el percentil 90 de un equipo al 95 % es de 42 veces el</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">trabajo del elemento. La simulación coincide con la fórmula teórica salvo al 95 %, donde 60 000 elementos no bastan para</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">promediar la cola.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
