<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 371" width="820" height="371" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué ocurre cuando el equipo está lleno</title><desc id="d">Tabla con 60 000 elementos simulados por escenario en una cola de un servidor: con carga del 50 por ciento el ciclo medio es 2 unidades de trabajo y el percentil 90 es 4,6, con 70 por ciento 3,3 y 7,7, con 85 por ciento 6,7 y 15,1, y con 95 por ciento 18,2 y 42, frente a un valor teórico de 20 con 95 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="820" height="371" fill="#ffffff"/><rect x="10" y="12" width="152" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="86" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="86" dy="0">Carga del equipo</tspan></text><rect x="168" y="12" width="288" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="312" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="312" dy="0">Ciclo medio (unidades de trabajo)</tspan></text><rect x="462" y="12" width="240" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="582" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="582" dy="0">Valor teórico 1/(1 − carga)</tspan></text><rect x="708" y="12" width="96" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="756" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="756" dy="0">Ciclo p90</tspan></text><rect x="10" y="56" width="152" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="86" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="86" dy="0">50 %</tspan></text><rect x="168" y="56" width="288" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="312" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="312" dy="0">2,0</tspan></text><rect x="462" y="56" width="240" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">2,0</tspan></text><rect x="708" y="56" width="96" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="756" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="756" dy="0">4,6</tspan></text><rect x="10" y="106" width="152" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="86" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="86" dy="0">70 %</tspan></text><rect x="168" y="106" width="288" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="312" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="312" dy="0">3,3</tspan></text><rect x="462" y="106" width="240" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">3,3</tspan></text><rect x="708" y="106" width="96" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="756" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="756" dy="0">7,7</tspan></text><rect x="10" y="156" width="152" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="86" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="86" dy="0">85 %</tspan></text><rect x="168" y="156" width="288" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="312" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="312" dy="0">6,7</tspan></text><rect x="462" y="156" width="240" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">6,7</tspan></text><rect x="708" y="156" width="96" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="756" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="756" dy="0">15,1</tspan></text><rect x="10" y="206" width="152" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="86" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="86" dy="0">95 %</tspan></text><rect x="168" y="206" width="288" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="312" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="312" dy="0">18,2</tspan></text><rect x="462" y="206" width="240" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">20,0</tspan></text><rect x="708" y="206" width="96" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="756" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="756" dy="0">42,0</tspan></text><rect x="10" y="260" width="800" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="410" y="284.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="410" dy="0">Pasar de 70 % a 95 % de carga multiplica el ciclo por más de cinco; el percentil 90 de un equipo al 95 % es</tspan></text><text x="410" y="301.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="410" dy="0">de 42 veces el trabajo del elemento. La simulación coincide con la fórmula teórica salvo al 95 %, donde 60</tspan></text><text x="410" y="318.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="410" dy="0">000 elementos no bastan para promediar la cola.</tspan></text><text x="410" y="357.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="410" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
