<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 346" width="940" height="346" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Doce módulos de un software de bomba de infusión: clases de seguridad con y sin segregación documentada</title><desc id="d">Barras apiladas con el número de módulos de clase A, B y C: sin segregación, 2 de clase A, 4 de B y 6 de C; con segregación documentada, 4 de A, 4 de B y 4 de C.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="346" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Doce módulos de un software de bomba de infusión: clases de seguridad con y sin segregación documentada</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Clase A</tspan></text><rect x="116.78" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="136.78" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="136.78" dy="0">Clase B</tspan></text><rect x="217.56" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="237.56" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="237.56" dy="0">Clase C</tspan></text><line x1="214" y1="77" x2="214" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="214" y1="165" x2="214" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="214" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="214" dy="0">0</tspan></text><line x1="346.34" y1="77" x2="346.34" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="346.34" y1="165" x2="346.34" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="346.34" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="346.34" dy="0">2,5</tspan></text><line x1="478.68" y1="77" x2="478.68" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="478.68" y1="165" x2="478.68" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="478.68" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="478.68" dy="0">5</tspan></text><line x1="611.02" y1="77" x2="611.02" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="611.02" y1="165" x2="611.02" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="611.02" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="611.02" dy="0">7,5</tspan></text><line x1="743.36" y1="77" x2="743.36" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="743.36" y1="165" x2="743.36" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="743.36" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="743.36" dy="0">10</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="165" x2="875.7" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">12,5</tspan></text><line x1="214" y1="165" x2="875.7" y2="165" stroke="#5b7280" stroke-width="1.6"/><text x="204" y="103.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="204" dy="0">Sin segregación</tspan></text><text x="204" y="139" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="204" dy="0">Con segregación</tspan></text><text x="204" y="156" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="204" dy="0">documentada</tspan></text><rect x="214" y="84" width="105.872" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="266.936" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="266.936" dy="0">2</tspan></text><rect x="319.872" y="84" width="211.744" height="30" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="425.744" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="425.744" dy="0">4</tspan></text><rect x="531.616" y="84" width="317.616" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="690.424" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="690.424" dy="0">6</tspan></text><text x="856.232" y="103.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="856.232" dy="0">12</tspan></text><rect x="214" y="128" width="211.744" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="319.872" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="319.872" dy="0">4</tspan></text><rect x="425.744" y="128" width="211.744" height="30" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="531.616" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="531.616" dy="0">4</tspan></text><rect x="637.488" y="128" width="211.744" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="743.36" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="743.36" dy="0">4</tspan></text><text x="856.232" y="147.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="856.232" dy="0">12</tspan></text><text x="544.85" y="209" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="544.85" dy="0">Módulos</tspan></text><rect x="10" y="223" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="247.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Sin segregación, todo lo que sirve a un módulo de clase C hereda la clase: pantalla, registro y almacén suben. Las</tspan></text><text x="470" y="264.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">actividades de verificación pasan de 90 a 76 con los pesos del autor (3, 6 y 10 por módulo de clase A, B y C). La</tspan></text><text x="470" y="281.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">segregación solo vale si está argumentada y verificada, no si se declara.</tspan></text><text x="470" y="328.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 47; muestra un mecanismo, no mide un producto real.</tspan></text></svg>
