<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 346" width="940" height="346" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué fracción del riesgo cubren los cinco primeros</title><desc id="d">Barras con 400 carteras sintéticas de 30 riesgos de los que se eligen cinco para mitigar: ordenar por valor esperado cubre el 72,2 por ciento de la pérdida esperada, una matriz de cinco por cinco cubre el 65,8 por ciento y deja fuera el mayor riesgo en el 8,5 por ciento de las carteras, y elegir al azar cubre el 16,6 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="346" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué fracción del riesgo cubren los cinco primeros</tspan></text><line x1="354" y1="49" x2="354" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="181" x2="354" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="486.44" y1="49" x2="486.44" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="486.44" y1="181" x2="486.44" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="486.44" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="486.44" dy="0">25</tspan></text><line x1="618.88" y1="49" x2="618.88" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="618.88" y1="181" x2="618.88" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="618.88" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="618.88" dy="0">50</tspan></text><line x1="751.32" y1="49" x2="751.32" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="751.32" y1="181" x2="751.32" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="751.32" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="751.32" dy="0">75</tspan></text><line x1="883.76" y1="49" x2="883.76" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="883.76" y1="181" x2="883.76" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="883.76" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="883.76" dy="0">100</tspan></text><line x1="354" y1="181" x2="883.76" y2="181" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="67" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Valor esperado (deja fuera el mayor riesgo: 0</tspan></text><text x="344" y="84" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">% por definición)</tspan></text><text x="344" y="111" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Matriz 5×5 (lo deja fuera en el 8,5 % de las</tspan></text><text x="344" y="128" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">carteras)</tspan></text><text x="344" y="163.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Azar</tspan></text><rect x="354" y="55" width="382.487" height="32" rx="3" fill="#087f8c"/><text x="743.487" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="743.487" dy="0">72,2</tspan></text><rect x="354" y="99" width="348.582" height="32" rx="3" fill="#087f8c"/><text x="709.582" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="709.582" dy="0">65,8</tspan></text><rect x="354" y="143" width="87.9402" height="32" rx="3" fill="#087f8c"/><text x="448.94" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="448.94" dy="0">16,6</tspan></text><text x="618.88" y="225" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="618.88" dy="0">% de la pérdida esperada cubierta</tspan></text><rect x="10" y="239" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="263.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La matriz es mucho mejor que el azar y algo peor que el valor esperado: pierde 6,4 puntos de cobertura. En una de cada doce</tspan></text><text x="470" y="280.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">carteras deja fuera el riesgo más caro.</tspan></text><text x="470" y="328.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
