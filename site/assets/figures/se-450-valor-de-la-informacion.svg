<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 863 321" width="863" height="321" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuánto vale saber antes de decidir</title><desc id="d">Tabla con una inversión de valor neto incierto con desviación 100 y un experimento con ruido de 40: con valor esperado a priori de menos 20 la información perfecta vale 30,6 y el experimento 27,8, con valor esperado cero 39,8 y 36,9, y con más 20 vale 30,6 y 27,7 sobre una base de 20.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="863" height="321" fill="#ffffff"/><rect x="10" y="12" width="203" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="111.5" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="111.5" dy="0">Valor esperado a priori</tspan></text><rect x="219" y="12" width="141" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="289.5" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="289.5" dy="0">Sin información</tspan></text><rect x="366" y="12" width="218" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="475" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="475" dy="0">VEIP simulado (analítico)</tspan></text><rect x="590" y="12" width="257" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="718.5" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="718.5" dy="0">VEII de un experimento ruidoso</tspan></text><rect x="10" y="56" width="203" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="111.5" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="111.5" dy="0">−20</tspan></text><rect x="219" y="56" width="141" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="289.5" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="289.5" dy="0">0,0</tspan></text><rect x="366" y="56" width="218" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="475" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="475" dy="0">30,6 (30,7)</tspan></text><rect x="590" y="56" width="257" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="718.5" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="718.5" dy="0">27,8</tspan></text><rect x="10" y="106" width="203" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="111.5" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="111.5" dy="0">0</tspan></text><rect x="219" y="106" width="141" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="289.5" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="289.5" dy="0">0,0</tspan></text><rect x="366" y="106" width="218" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="475" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="475" dy="0">39,8 (39,9)</tspan></text><rect x="590" y="106" width="257" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="718.5" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="718.5" dy="0">36,9</tspan></text><rect x="10" y="156" width="203" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="111.5" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="111.5" dy="0">+20</tspan></text><rect x="219" y="156" width="141" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="289.5" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="289.5" dy="0">20,0</tspan></text><rect x="366" y="156" width="218" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="475" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="475" dy="0">30,6 (30,7)</tspan></text><rect x="590" y="156" width="257" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="718.5" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="718.5" dy="0">27,7</tspan></text><rect x="10" y="210" width="843" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="431.5" y="234.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="431.5" dy="0">La información vale más cuando la decisión está en el límite (valor esperado cero: 39,8) y menos cuando se</tspan></text><text x="431.5" y="251.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="431.5" dy="0">inclina hacia un lado. El experimento ruidoso captura entre el 90 y el 93 % de ese valor, así que cualquier</tspan></text><text x="431.5" y="268.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="431.5" dy="0">experimento que cueste menos de 27 es rentable en el caso central, y uno que cueste 40 nunca lo es.</tspan></text><text x="431.5" y="307.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="431.5" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
