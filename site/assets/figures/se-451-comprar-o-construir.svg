<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 271" width="820" height="271" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuánto cuesta comprar o construir en cinco años</title><desc id="d">Tabla con 10 000 casos sintéticos de costo a cinco años: comprar cuesta de media 870, mediana 796 y percentil 90 de 1 235, construir de media 867, mediana 842 y percentil 90 de 1 085, y comprar cuesta más que construir en el 45,8 por ciento de los casos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="820" height="271" fill="#ffffff"/><rect x="10" y="12" width="176" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="98" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="98" dy="0">Opción</tspan></text><rect x="192" y="12" width="211" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="297.5" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="297.5" dy="0">Costo medio</tspan></text><rect x="409" y="12" width="163" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="490.5" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="490.5" dy="0">Mediana</tspan></text><rect x="578" y="12" width="226" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="691" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="691" dy="0">Percentil 90</tspan></text><rect x="10" y="56" width="176" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="98" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="98" dy="0">Comprar</tspan></text><rect x="192" y="56" width="211" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="297.5" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="297.5" dy="0">870</tspan></text><rect x="409" y="56" width="163" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="490.5" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="490.5" dy="0">796</tspan></text><rect x="578" y="56" width="226" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="691" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="691" dy="0">1 235</tspan></text><rect x="10" y="106" width="176" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="98" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="98" dy="0">Construir</tspan></text><rect x="192" y="106" width="211" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="297.5" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="297.5" dy="0">867</tspan></text><rect x="409" y="106" width="163" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="490.5" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="490.5" dy="0">842</tspan></text><rect x="578" y="106" width="226" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="691" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="691" dy="0">1 085</tspan></text><rect x="10" y="160" width="800" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="410" y="184.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="410" dy="0">Las medias son casi iguales y las medianas favorecen comprar, pero el percentil 90 de comprar es 150</tspan></text><text x="410" y="201.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="410" dy="0">unidades mayor: la cola de alzas y de migración forzada. La decisión depende de cuánta cola puede asumir el</tspan></text><text x="410" y="218.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="410" dy="0">equipo.</tspan></text><text x="410" y="257.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="410" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
