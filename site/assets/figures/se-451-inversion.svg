<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 549" width="940" height="549" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres tareas con un mutex compartido durante 400 ms simulados: plazos perdidos y ticks bloqueados de la tarea de más prioridad</title><desc id="d">Barras con los resultados de tres protocolos: sin protocolo, la tarea H pierde 2 plazos y queda bloqueada 84 ticks; con herencia de prioridad pierde 0 y queda bloqueada 25 ticks; con techo de prioridad pierde 0 y queda bloqueada 0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="549" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Tres tareas con un mutex compartido durante 400 ms simulados: plazos perdidos y ticks bloqueados de la tarea</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">de más prioridad</tspan></text><rect x="16" y="64" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Plazos perdidos de H</tspan></text><rect x="214.8" y="64" width="12" height="12" rx="2" fill="#102a43"/><text x="234.8" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="234.8" dy="0">Ticks de H bloqueada</tspan></text><line x1="78.62" y1="374" x2="920" y2="374" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="374" x2="78.62" y2="374" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="378.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="322" x2="920" y2="322" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="322" x2="78.62" y2="322" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="326.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">20</tspan></text><line x1="78.62" y1="270" x2="920" y2="270" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="270" x2="78.62" y2="270" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="274.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">40</tspan></text><line x1="78.62" y1="218" x2="920" y2="218" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="218" x2="78.62" y2="218" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="222.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">60</tspan></text><line x1="78.62" y1="166" x2="920" y2="166" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="166" x2="78.62" y2="166" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="170.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">80</tspan></text><line x1="78.62" y1="114" x2="920" y2="114" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="114" x2="78.62" y2="114" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="118.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="114" x2="78.62" y2="374" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="244" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 244)">Plazos o ticks de 1 ms</text><rect x="106.666" y="368.8" width="110.184" height="5.2" rx="3" fill="#c0432f"/><text x="161.758" y="362.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="161.758" dy="0">2</tspan></text><rect x="220.85" y="155.6" width="110.184" height="218.4" rx="3" fill="#102a43"/><text x="275.942" y="149.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="275.942" dy="0">84</tspan></text><text x="218.85" y="395" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="218.85" dy="0">Sin protocolo</tspan></text><rect x="387.126" y="372" width="110.184" height="2" rx="3" fill="#c0432f"/><text x="442.218" y="366" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="442.218" dy="0">0</tspan></text><rect x="501.31" y="309" width="110.184" height="65" rx="3" fill="#102a43"/><text x="556.402" y="303" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="556.402" dy="0">25</tspan></text><text x="499.31" y="395" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="499.31" dy="0">Herencia de prioridad</tspan></text><rect x="667.586" y="372" width="110.184" height="2" rx="3" fill="#c0432f"/><text x="722.678" y="366" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="722.678" dy="0">0</tspan></text><rect x="781.77" y="372" width="110.184" height="2" rx="3" fill="#102a43"/><text x="836.862" y="366" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="836.862" dy="0">0</tspan></text><text x="779.77" y="395" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="779.77" dy="0">Techo de prioridad</tspan></text><rect x="10" y="426" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="450.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">La tarea de prioridad media se interpone mientras la de baja prioridad tiene el mutex que H necesita: es la inversión de</tspan></text><text x="470" y="467.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">prioridad. La herencia acota el bloqueo a la sección crítica restante (25 ticks acumulados en la ventana); con techo no se</tspan></text><text x="470" y="484.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">bloquea nunca porque nadie más entra a la sección crítica a destiempo. Es un simulador de ticks, no un RTOS.</tspan></text><text x="470" y="531.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; los recuentos se repiten con la misma semilla.</tspan></text></svg>
