<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 839 421" width="839" height="421" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuánto depende el ganador de los pesos</title><desc id="d">Tabla con cinco proveedores sintéticos evaluados en seis criterios: con los pesos base el puntaje es 6,60 para A, 6,95 para B, 6,55 para C, 6,70 para D y 6,45 para E; con 20 000 combinaciones de pesos sorteadas gana A el 7,6 por ciento, B el 19,4, C el 30,9, D el 21,1 y E el 20,9, y al exigir seguridad de 6 o más D queda fuera y ganan A 18,9, B 24,2, C 36 y E 20,9.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="839" height="421" fill="#ffffff"/><rect x="10" y="12" width="94" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="57" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="57" dy="0">Proveedor</tspan></text><rect x="110" y="12" width="226" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="223" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="223" dy="0">Puntaje con los pesos base</tspan></text><rect x="342" y="12" width="210" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="447" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="447" dy="0">Gana con pesos sorteados</tspan></text><rect x="558" y="12" width="265" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="690.5" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="690.5" dy="0">Gana con la puerta de seguridad</tspan></text><rect x="10" y="56" width="94" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="57" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="57" dy="0">A</tspan></text><rect x="110" y="56" width="226" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="223" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="223" dy="0">6,60</tspan></text><rect x="342" y="56" width="210" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="447" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">7,6 %</tspan></text><rect x="558" y="56" width="265" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="690.5" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="690.5" dy="0">18,9 %</tspan></text><rect x="10" y="106" width="94" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="57" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="57" dy="0">B</tspan></text><rect x="110" y="106" width="226" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="223" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="223" dy="0">6,95</tspan></text><rect x="342" y="106" width="210" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="447" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">19,4 %</tspan></text><rect x="558" y="106" width="265" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="690.5" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="690.5" dy="0">24,2 %</tspan></text><rect x="10" y="156" width="94" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="57" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="57" dy="0">C</tspan></text><rect x="110" y="156" width="226" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="223" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="223" dy="0">6,55</tspan></text><rect x="342" y="156" width="210" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="447" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">30,9 %</tspan></text><rect x="558" y="156" width="265" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="690.5" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="690.5" dy="0">36,0 %</tspan></text><rect x="10" y="206" width="94" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="57" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="57" dy="0">D</tspan></text><rect x="110" y="206" width="226" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="223" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="223" dy="0">6,70</tspan></text><rect x="342" y="206" width="210" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="447" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">21,1 %</tspan></text><rect x="558" y="206" width="265" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="690.5" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="690.5" dy="0">no pasa la puerta</tspan></text><rect x="10" y="256" width="94" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="57" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="57" dy="0">E</tspan></text><rect x="110" y="256" width="226" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="223" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="223" dy="0">6,45</tspan></text><rect x="342" y="256" width="210" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="447" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">20,9 %</tspan></text><rect x="558" y="256" width="265" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="690.5" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="690.5" dy="0">20,9 %</tspan></text><rect x="10" y="310" width="819" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="419.5" y="334.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="419.5" dy="0">El proveedor B gana con los pesos del equipo por 0,25 puntos, pero con pesos al azar gana solo una de cada</tspan></text><text x="419.5" y="351.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="419.5" dy="0">cinco veces; C, que queda tercero con los pesos base, gana casi una de cada tres. La puerta de seguridad</tspan></text><text x="419.5" y="368.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="419.5" dy="0">cambia el reparto, no el hecho de que ninguno domina.</tspan></text><text x="419.5" y="407.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="419.5" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
