<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 567" width="940" height="567" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuánto depende el ganador de los pesos</title><desc id="d">Barras agrupadas con cinco proveedores sintéticos evaluados en seis criterios: con 20 000 combinaciones de pesos sorteadas gana A el 7,6 por ciento, B el 19,4, C el 30,9, D el 21,1 y E el 20,9; al exigir seguridad de 6 o más D queda fuera y ganan A 18,9, B 24,2, C 36 y E 20,9, aunque con los pesos base el mejor puntaje es el de B, 6,95.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="567" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuánto depende el ganador de los pesos</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Gana con pesos sorteados</tspan></text><rect x="244.96" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="264.96" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="264.96" dy="0">Gana con la puerta de seguridad</tspan></text><line x1="71.08" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="375" x2="71.08" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="305" x2="920" y2="305" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="305" x2="71.08" y2="305" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="309.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="235" x2="920" y2="235" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="235" x2="71.08" y2="235" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="239.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="165" x2="920" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="165" x2="71.08" y2="165" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="169.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">30</tspan></text><line x1="71.08" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="95" x2="71.08" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">40</tspan></text><line x1="71.08" y1="95" x2="71.08" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">% de las 20 000 combinaciones en que gana</text><rect x="88.0584" y="321.8" width="65.9136" height="53.2" rx="3" fill="#087f8c"/><text x="121.015" y="315.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="121.015" dy="0">7,6</tspan></text><rect x="157.972" y="242.7" width="65.9136" height="132.3" rx="3" fill="#946512"/><text x="190.929" y="236.7" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="190.929" dy="0">18,9</tspan></text><text x="155.972" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="155.972" dy="0">A (6,60 con los pesos</tspan></text><text x="155.972" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="155.972" dy="0">base)</tspan></text><rect x="257.842" y="239.2" width="65.9136" height="135.8" rx="3" fill="#087f8c"/><text x="290.799" y="233.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="290.799" dy="0">19,4</tspan></text><rect x="327.756" y="205.6" width="65.9136" height="169.4" rx="3" fill="#946512"/><text x="360.713" y="199.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="360.713" dy="0">24,2</tspan></text><text x="325.756" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="325.756" dy="0">B (6,95)</tspan></text><rect x="427.626" y="158.7" width="65.9136" height="216.3" rx="3" fill="#087f8c"/><text x="460.583" y="152.7" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="460.583" dy="0">30,9</tspan></text><rect x="497.54" y="123" width="65.9136" height="252" rx="3" fill="#946512"/><text x="530.497" y="117" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="530.497" dy="0">36,0</tspan></text><text x="495.54" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="495.54" dy="0">C (6,55)</tspan></text><rect x="597.41" y="227.3" width="65.9136" height="147.7" rx="3" fill="#087f8c"/><text x="630.367" y="221.3" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="630.367" dy="0">21,1</tspan></text><rect x="667.324" y="373" width="65.9136" height="2" rx="3" fill="#946512"/><text x="700.281" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="700.281" dy="0">0,0</tspan></text><text x="665.324" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="665.324" dy="0">D (6,70)</tspan></text><rect x="767.194" y="228.7" width="65.9136" height="146.3" rx="3" fill="#087f8c"/><text x="800.151" y="222.7" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="800.151" dy="0">20,9</tspan></text><rect x="837.108" y="228.7" width="65.9136" height="146.3" rx="3" fill="#946512"/><text x="870.065" y="222.7" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="870.065" dy="0">20,9</tspan></text><text x="835.108" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="835.108" dy="0">E (6,45)</tspan></text><rect x="10" y="444" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="468.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">D no pasa la puerta de seguridad. El proveedor B gana con los pesos del equipo por 0,25 puntos, pero con pesos al azar gana</tspan></text><text x="470" y="485.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">solo una de cada cinco veces; C, que queda tercero con los pesos base, gana casi una de cada tres. La puerta de seguridad</tspan></text><text x="470" y="502.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cambia el reparto, no el hecho de que ninguno domina.</tspan></text><text x="470" y="549.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
