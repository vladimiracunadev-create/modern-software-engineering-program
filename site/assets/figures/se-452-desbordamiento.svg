<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 511" width="940" height="511" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Promedio de dos enteros sin signo de 16 bits con aritmética modular: pares con resultado incorrecto según el conjunto de prueba</title><desc id="d">Barras con el porcentaje de pares con resultado incorrecto: 50,0 por ciento con 200 000 pares al azar de 16 bits, 0 con los 65 536 pares de valores pequeños de 0 a 255 y 0 con la fórmula que resta antes de dividir.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="511" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Promedio de dos enteros sin signo de 16 bits con aritmética modular: pares con resultado incorrecto según el</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">conjunto de prueba</tspan></text><line x1="71.08" y1="336" x2="920" y2="336" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="336" x2="71.08" y2="336" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="340.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="286" x2="920" y2="286" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="286" x2="71.08" y2="286" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="290.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="236" x2="920" y2="236" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="236" x2="71.08" y2="236" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="240.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="186" x2="920" y2="186" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="186" x2="71.08" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="190.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">30</tspan></text><line x1="71.08" y1="136" x2="920" y2="136" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="136" x2="71.08" y2="136" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="140.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">40</tspan></text><line x1="71.08" y1="86" x2="920" y2="86" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="86" x2="71.08" y2="86" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="90.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">50</tspan></text><line x1="71.08" y1="86" x2="71.08" y2="336" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="211" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 211)">Por ciento de pares</text><rect x="99.3773" y="86" width="226.379" height="250" rx="3" fill="#c0432f"/><text x="212.567" y="80" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="212.567" dy="0">50,0</tspan></text><text x="212.567" y="357" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="212.567" dy="0">Pares al azar de 16 bits</tspan></text><rect x="382.351" y="334" width="226.379" height="2" rx="3" fill="#c0432f"/><text x="495.54" y="328" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="495.54" dy="0">0,0</tspan></text><text x="495.54" y="357" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="495.54" dy="0">Pares pequeños (0 a 255)</tspan></text><rect x="665.324" y="334" width="226.379" height="2" rx="3" fill="#c0432f"/><text x="778.513" y="328" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="778.513" dy="0">0,0</tspan></text><text x="778.513" y="357" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="778.513" dy="0">Con la resta previa</tspan></text><rect x="10" y="388" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="412.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">La suma se desborda cuando supera 65 535 y el resultado envuelve sin avisar. Las pruebas con valores pequeños no lo ven</tspan></text><text x="470" y="429.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">jamás: el defecto exige entradas que las pruebas habituales no generan. Es la clase de defecto de las reglas sobre enteros</tspan></text><text x="470" y="446.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">de los estándares de codificación segura; aquí se emula la aritmética en Python y no se ejecuta C.</tspan></text><text x="470" y="493.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; los recuentos se repiten con la misma semilla.</tspan></text></svg>
