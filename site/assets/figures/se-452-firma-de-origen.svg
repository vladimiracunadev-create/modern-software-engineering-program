<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 798" width="940" height="798" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué detecta una verificación de firma</title><desc id="d">Barras horizontales con 2 000 mensajes de commit sintéticos: 1 709 con pie de firma correcto los aceptan las dos verificaciones; la ingenua acepta además 54 con firma de otra persona, 49 con el pie en medio del texto y 61 con correo roto, y la estricta rechaza todos esos y los 83 sin firma y los 44 con el pie mal escrito.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="798" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué detecta una verificación de firma</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Cantidad</tspan></text><rect x="124.32" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="144.32" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="144.32" dy="0">Aceptados por la ingenua</tspan></text><rect x="353.28" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="373.28" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="373.28" dy="0">Aceptados por la estricta</tspan></text><line x1="214" y1="77" x2="214" y2="617" stroke="#d5dde1" stroke-width="1"/><line x1="214" y1="617" x2="214" y2="622" stroke="#5b7280" stroke-width="1.4"/><text x="214" y="638" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="214" dy="0">0</tspan></text><line x1="379.425" y1="77" x2="379.425" y2="617" stroke="#d5dde1" stroke-width="1"/><line x1="379.425" y1="617" x2="379.425" y2="622" stroke="#5b7280" stroke-width="1.4"/><text x="379.425" y="638" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="379.425" dy="0">500</tspan></text><line x1="544.85" y1="77" x2="544.85" y2="617" stroke="#d5dde1" stroke-width="1"/><line x1="544.85" y1="617" x2="544.85" y2="622" stroke="#5b7280" stroke-width="1.4"/><text x="544.85" y="638" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="544.85" dy="0">1 000</tspan></text><line x1="710.275" y1="77" x2="710.275" y2="617" stroke="#d5dde1" stroke-width="1"/><line x1="710.275" y1="617" x2="710.275" y2="622" stroke="#5b7280" stroke-width="1.4"/><text x="710.275" y="638" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="710.275" dy="0">1 500</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="617" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="617" x2="875.7" y2="622" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="638" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">2 000</tspan></text><line x1="214" y1="617" x2="875.7" y2="617" stroke="#5b7280" stroke-width="1.6"/><text x="204" y="126.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="204" dy="0">Pie correcto</tspan></text><text x="204" y="216.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="204" dy="0">Sin firma</tspan></text><text x="204" y="306.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="204" dy="0">Firma de otra persona</tspan></text><text x="204" y="396.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="204" dy="0">Pie mal escrito</tspan></text><text x="204" y="486.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="204" dy="0">Pie en medio del texto</tspan></text><text x="204" y="576.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="204" dy="0">Correo roto</tspan></text><rect x="214" y="83" width="565.423" height="24" rx="3" fill="#6b7c86"/><text x="786.423" y="99.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="786.423" dy="0">1 709</tspan></text><rect x="214" y="110" width="565.423" height="24" rx="3" fill="#c0432f"/><text x="786.423" y="126.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="786.423" dy="0">1 709</tspan></text><rect x="214" y="137" width="565.423" height="24" rx="3" fill="#087f8c"/><text x="786.423" y="153.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="786.423" dy="0">1 709</tspan></text><rect x="214" y="173" width="27.4606" height="24" rx="3" fill="#6b7c86"/><text x="248.461" y="189.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="248.461" dy="0">83</tspan></text><rect x="214" y="200" width="2" height="24" rx="3" fill="#c0432f"/><text x="223" y="216.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="223" dy="0">0</tspan></text><rect x="214" y="227" width="2" height="24" rx="3" fill="#087f8c"/><text x="223" y="243.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="223" dy="0">0</tspan></text><rect x="214" y="263" width="17.8659" height="24" rx="3" fill="#6b7c86"/><text x="238.866" y="279.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="238.866" dy="0">54</tspan></text><rect x="214" y="290" width="17.8659" height="24" rx="3" fill="#c0432f"/><text x="238.866" y="306.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="238.866" dy="0">54</tspan></text><rect x="214" y="317" width="2" height="24" rx="3" fill="#087f8c"/><text x="223" y="333.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="223" dy="0">0</tspan></text><rect x="214" y="353" width="14.5574" height="24" rx="3" fill="#6b7c86"/><text x="235.557" y="369.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="235.557" dy="0">44</tspan></text><rect x="214" y="380" width="2" height="24" rx="3" fill="#c0432f"/><text x="223" y="396.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="223" dy="0">0</tspan></text><rect x="214" y="407" width="2" height="24" rx="3" fill="#087f8c"/><text x="223" y="423.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="223" dy="0">0</tspan></text><rect x="214" y="443" width="16.2116" height="24" rx="3" fill="#6b7c86"/><text x="237.212" y="459.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="237.212" dy="0">49</tspan></text><rect x="214" y="470" width="16.2116" height="24" rx="3" fill="#c0432f"/><text x="237.212" y="486.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="237.212" dy="0">49</tspan></text><rect x="214" y="497" width="2" height="24" rx="3" fill="#087f8c"/><text x="223" y="513.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="223" dy="0">0</tspan></text><rect x="214" y="533" width="20.1818" height="24" rx="3" fill="#6b7c86"/><text x="241.182" y="549.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="241.182" dy="0">61</tspan></text><rect x="214" y="560" width="20.1818" height="24" rx="3" fill="#c0432f"/><text x="241.182" y="576.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="241.182" dy="0">61</tspan></text><rect x="214" y="587" width="2" height="24" rx="3" fill="#087f8c"/><text x="223" y="603.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="223" dy="0">0</tspan></text><text x="544.85" y="661" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="544.85" dy="0">mensajes de commit</tspan></text><rect x="10" y="675" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="699.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Total aceptado: 1 873 con la ingenua y 1 709 con la estricta. La búsqueda ingenua da por firmados 164 commits que la</tspan></text><text x="470" y="716.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">estricta rechaza: la firma de otra persona, el pie en medio y el correo roto. Cada uno es un tipo de defecto distinto, con</tspan></text><text x="470" y="733.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">causa y corrección distintas.</tspan></text><text x="470" y="780.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
