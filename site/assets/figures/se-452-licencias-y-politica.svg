<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 571" width="820" height="571" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué bloquea una política de distribución</title><desc id="d">Tabla con 60 dependencias sintéticas clasificadas por un analizador de expresiones de licencia: 42 permitidas, 11 por revisar, 4 bloqueadas y 3 desconocidas, frente a una búsqueda ingenua de la cadena GPL que marca 15, de las cuales 11 no están bloqueadas, no deja de ver ninguna bloqueada y da por buenas 3 desconocidas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="820" height="571" fill="#ffffff"/><rect x="10" y="12" width="576" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="298" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="298" dy="0">Resultado</tspan></text><rect x="592" y="12" width="212" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="698" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="698" dy="0">Dependencias</tspan></text><rect x="10" y="56" width="576" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="298" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="298" dy="0">Permitidas</tspan></text><rect x="592" y="56" width="212" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="698" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="698" dy="0">42</tspan></text><rect x="10" y="106" width="576" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="298" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="298" dy="0">Por revisar</tspan></text><rect x="592" y="106" width="212" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="698" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="698" dy="0">11</tspan></text><rect x="10" y="156" width="576" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="298" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="298" dy="0">Bloqueadas</tspan></text><rect x="592" y="156" width="212" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="698" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="698" dy="0">4</tspan></text><rect x="10" y="206" width="576" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="298" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="298" dy="0">Desconocidas (vacío, NOASSERTION, referencia propia)</tspan></text><rect x="592" y="206" width="212" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="698" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="698" dy="0">3</tspan></text><rect x="10" y="256" width="576" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="298" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="298" dy="0">Marcadas por la búsqueda ingenua</tspan></text><rect x="592" y="256" width="212" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="698" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="698" dy="0">15</tspan></text><rect x="10" y="306" width="576" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="298" y="331.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="298" dy="0">Marcadas por la ingenua y no bloqueadas</tspan></text><rect x="592" y="306" width="212" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="698" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="698" dy="0">11</tspan></text><rect x="10" y="356" width="576" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="298" y="381.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="298" dy="0">Bloqueadas que la ingenua no ve</tspan></text><rect x="592" y="356" width="212" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="698" y="381.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="698" dy="0">0</tspan></text><rect x="10" y="406" width="576" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="298" y="431.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="298" dy="0">Desconocidas que la ingenua da por buenas</tspan></text><rect x="592" y="406" width="212" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="698" y="431.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="698" dy="0">3</tspan></text><rect x="10" y="460" width="800" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="410" y="484.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="410" dy="0">La búsqueda ingenua marca casi cuatro veces más dependencias que las bloqueadas (porque encuentra `LGPL`,</tspan></text><text x="410" y="501.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="410" dy="0">`MIT OR GPL-2.0-only` y excepciones) y, a la vez, no ve las tres desconocidas. Los dos errores son</tspan></text><text x="410" y="518.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="410" dy="0">distintos: uno frena trabajo innecesariamente y el otro deja pasar lo que no se sabe.</tspan></text><text x="410" y="557.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="410" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
