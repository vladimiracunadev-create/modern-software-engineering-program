<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 522" width="940" height="522" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Espacio de estados de n procesos independientes de cuatro pasos cada uno: crecimiento exponencial</title><desc id="d">Línea en escala logarítmica con los estados alcanzables: 16 con 2 procesos, 64 con 3, 256 con 4, 1024 con 5, 4096 con 6 y 16384 con 7.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="522" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Espacio de estados de n procesos independientes de cuatro pasos cada uno: crecimiento exponencial</tspan></text><line x1="101.24" y1="339" x2="910" y2="339" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="339" x2="101.24" y2="339" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="343.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">10</tspan></text><line x1="101.24" y1="245.667" x2="910" y2="245.667" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="245.667" x2="101.24" y2="245.667" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="250.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">100</tspan></text><line x1="101.24" y1="152.333" x2="910" y2="152.333" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="152.333" x2="101.24" y2="152.333" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="156.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">1 000</tspan></text><line x1="101.24" y1="59" x2="910" y2="59" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="59" x2="101.24" y2="59" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="63.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">10 000</tspan></text><line x1="101.24" y1="59" x2="101.24" y2="339" stroke="#5b7280" stroke-width="1.6"/><line x1="119.24" y1="59" x2="119.24" y2="339" stroke="#d5dde1" stroke-width="1"/><line x1="119.24" y1="339" x2="119.24" y2="344" stroke="#5b7280" stroke-width="1.4"/><text x="119.24" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="119.24" dy="0">2</tspan></text><line x1="273.792" y1="59" x2="273.792" y2="339" stroke="#d5dde1" stroke-width="1"/><line x1="273.792" y1="339" x2="273.792" y2="344" stroke="#5b7280" stroke-width="1.4"/><text x="273.792" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="273.792" dy="0">3</tspan></text><line x1="428.344" y1="59" x2="428.344" y2="339" stroke="#d5dde1" stroke-width="1"/><line x1="428.344" y1="339" x2="428.344" y2="344" stroke="#5b7280" stroke-width="1.4"/><text x="428.344" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="428.344" dy="0">4</tspan></text><line x1="582.896" y1="59" x2="582.896" y2="339" stroke="#d5dde1" stroke-width="1"/><line x1="582.896" y1="339" x2="582.896" y2="344" stroke="#5b7280" stroke-width="1.4"/><text x="582.896" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582.896" dy="0">5</tspan></text><line x1="737.448" y1="59" x2="737.448" y2="339" stroke="#d5dde1" stroke-width="1"/><line x1="737.448" y1="339" x2="737.448" y2="344" stroke="#5b7280" stroke-width="1.4"/><text x="737.448" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737.448" dy="0">6</tspan></text><line x1="892" y1="59" x2="892" y2="339" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="339" x2="892" y2="344" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">7</tspan></text><line x1="101.24" y1="339" x2="910" y2="339" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="199" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 199)">Estados alcanzables (escala logarítmica)</text><text x="505.62" y="385" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="505.62" dy="0">Procesos</tspan></text><polyline points="119.24,319.949 273.792,263.757 428.344,207.564 582.896,151.372 737.448,95.1797 892,38.9875" fill="none" stroke="#102a43" stroke-width="2.4"/><circle cx="119.24" cy="319.949" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="119.24" y="308.949" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="119.24" dy="0">16</tspan></text><circle cx="273.792" cy="263.757" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="273.792" y="252.757" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="273.792" dy="0">64</tspan></text><circle cx="428.344" cy="207.564" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="428.344" y="196.564" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="428.344" dy="0">256</tspan></text><circle cx="582.896" cy="151.372" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="582.896" y="140.372" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="582.896" dy="0">1 024</tspan></text><circle cx="737.448" cy="95.1797" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="737.448" y="84.1797" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="737.448" dy="0">4 096</tspan></text><circle cx="892" cy="38.9875" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="892" y="27.9875" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">16 384</tspan></text><rect x="10" y="399" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="423.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cada proceso multiplica por cuatro el espacio: es la explosión de estados. Las técnicas que la contienen (abstracción,</tspan></text><text x="470" y="440.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">reducción por orden parcial, verificación simbólica, límites en el tamaño del modelo) tienen costo propio y exigen que el</tspan></text><text x="470" y="457.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">modelo conserve lo que importa. Procesos que no interactúan son el mejor caso; el real es peor.</tspan></text><text x="470" y="504.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; los recuentos se repiten con la misma semilla.</tspan></text></svg>
