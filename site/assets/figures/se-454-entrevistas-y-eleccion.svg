span></text><text x="459.5" y="351.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="459.5" dy="0">porque el halo compartido no se promedia.</tspan></text><text x="459.5" y="391.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="459.5" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
