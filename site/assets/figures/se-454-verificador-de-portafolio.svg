<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 418" width="940" height="418" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué comprueba un verificador de portafolio</title><desc id="d">Barras horizontales apiladas con las reglas cumplidas de seis por cuatro entradas sintéticas de portafolio: con evidencia 6, a medias 2 (faltan comando, límite, decisión con alternativa y versión), de adjetivos 0 y con relleno 6 sin tener sustancia.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="418" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué comprueba un verificador de portafolio</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Reglas cumplidas</tspan></text><rect x="184.64" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="204.64" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="204.64" dy="0">Reglas que faltan</tspan></text><line x1="184" y1="77" x2="184" y2="237" stroke="#d5dde1" stroke-width="1"/><line x1="184" y1="237" x2="184" y2="242" stroke="#5b7280" stroke-width="1.4"/><text x="184" y="258" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="184" dy="0">0</tspan></text><line x1="414.567" y1="77" x2="414.567" y2="237" stroke="#d5dde1" stroke-width="1"/><line x1="414.567" y1="237" x2="414.567" y2="242" stroke="#5b7280" stroke-width="1.4"/><text x="414.567" y="258" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="414.567" dy="0">2</tspan></text><line x1="645.133" y1="77" x2="645.133" y2="237" stroke="#d5dde1" stroke-width="1"/><line x1="645.133" y1="237" x2="645.133" y2="242" stroke="#5b7280" stroke-width="1.4"/><text x="645.133" y="258" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="645.133" dy="0">4</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="237" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="237" x2="875.7" y2="242" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="258" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">6</tspan></text><line x1="184" y1="237" x2="875.7" y2="237" stroke="#5b7280" stroke-width="1.6"/><text x="174" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="174" dy="0">Con evidencia</tspan></text><text x="174" y="141.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="174" dy="0">A medias</tspan></text><text x="174" y="181.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="174" dy="0">De adjetivos</tspan></text><text x="174" y="221.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="174" dy="0">Con relleno</tspan></text><rect x="184" y="84" width="691.7" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="529.85" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="529.85" dy="0">6</tspan></text><rect x="875.7" y="84" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">6</tspan></text><rect x="184" y="124" width="230.567" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="299.283" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="299.283" dy="0">2</tspan></text><rect x="414.567" y="124" width="461.133" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="645.133" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="645.133" dy="0">4</tspan></text><text x="882.7" y="141.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">6</tspan></text><rect x="184" y="164" width="0" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="184" y="164" width="691.7" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="529.85" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="529.85" dy="0">6</tspan></text><text x="882.7" y="181.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">6</tspan></text><rect x="184" y="204" width="691.7" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="529.85" y="221.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="529.85" dy="0">6</tspan></text><rect x="875.7" y="204" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="221.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">6</tspan></text><text x="529.85" y="281" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="529.85" dy="0">reglas del verificador (de 6)</tspan></text><rect x="10" y="295" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="319.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">A la entrada a medias le faltan comando, límite, decisión y alternativa, y versión; a la de adjetivos, todo. El verificador</tspan></text><text x="470" y="336.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">separa con claridad las dos entradas extremas y distingue la que tiene la estructura incompleta. La última barra es el</tspan></text><text x="470" y="353.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">límite: una entrada con cifras, un comando y un enlace inventados cumple las seis reglas.</tspan></text><text x="470" y="400.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
