<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 371" width="820" height="371" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué comprueba un verificador de portafolio</title><desc id="d">Tabla con cuatro entradas sintéticas de portafolio revisadas por un verificador de seis reglas: la entrada con evidencia cumple 6, la entrada a medias 2 y le faltan comando, límite, decisión con alternativa y versión, la entrada de adjetivos 0 y le falta todo, y la entrada con relleno cumple 6 sin tener sustancia.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="820" height="371" fill="#ffffff"/><rect x="10" y="12" width="146" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="83" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="83" dy="0">Entrada</tspan></text><rect x="162" y="12" width="245" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="284.5" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="284.5" dy="0">Reglas cumplidas (de 6)</tspan></text><rect x="413" y="12" width="391" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="608.5" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="608.5" dy="0">Qué falta</tspan></text><rect x="10" y="56" width="146" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="83" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="83" dy="0">Con evidencia</tspan></text><rect x="162" y="56" width="245" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="284.5" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="284.5" dy="0">6</tspan></text><rect x="413" y="56" width="391" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="608.5" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="608.5" dy="0">nada</tspan></text><rect x="10" y="106" width="146" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="83" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="83" dy="0">A medias</tspan></text><rect x="162" y="106" width="245" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="284.5" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="284.5" dy="0">2</tspan></text><rect x="413" y="106" width="391" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="608.5" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="608.5" dy="0">comando, límite, decisión y alternativa, versión</tspan></text><rect x="10" y="156" width="146" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="83" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="83" dy="0">De adjetivos</tspan></text><rect x="162" y="156" width="245" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="284.5" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="284.5" dy="0">0</tspan></text><rect x="413" y="156" width="391" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="608.5" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="608.5" dy="0">todo</tspan></text><rect x="10" y="206" width="146" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="83" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="83" dy="0">Con relleno</tspan></text><rect x="162" y="206" width="245" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="284.5" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="284.5" dy="0">6</tspan></text><rect x="413" y="206" width="391" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="608.5" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="608.5" dy="0">nada, pero sin sustancia</tspan></text><rect x="10" y="260" width="800" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="410" y="284.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="410" dy="0">El verificador separa con claridad las dos entradas extremas, y distingue la que tiene la estructura</tspan></text><text x="410" y="301.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="410" dy="0">incompleta. La última fila es el límite: una entrada con cifras, un comando y un enlace inventados cumple</tspan></text><text x="410" y="318.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="410" dy="0">las seis reglas.</tspan></text><text x="410" y="357.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="410" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
