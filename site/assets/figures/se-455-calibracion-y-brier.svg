<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 305" width="820" height="305" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué dice la confianza declarada</title><desc id="d">Tabla con 500 pronósticos de cada una de tres personas: la calibrada obtiene una puntuación de Brier de 0,175 y acierta 94,4 por ciento cuando declara 95; la sobreconfiada obtiene 0,249 y acierta 74,4 por ciento cuando declara 95; la que declara siempre 95 por ciento obtiene 0,317 y acierta 65 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="820" height="305" fill="#ffffff"/><rect x="10" y="12" width="179" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="99.5" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="99.5" dy="0">Persona</tspan></text><rect x="195" y="12" width="126" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="258" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="258" dy="0">Brier</tspan></text><rect x="327" y="12" width="477" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="565.5" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="565.5" dy="0">Acierto cuando declara 55 · 65 · 75 · 85 · 95 %</tspan></text><rect x="10" y="56" width="179" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="99.5" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="99.5" dy="0">Calibrada</tspan></text><rect x="195" y="56" width="126" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="258" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="258" dy="0">0,175</tspan></text><rect x="327" y="56" width="477" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="565.5" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="565.5" dy="0">53,5 · 73,7 · 69,0 · 82,7 · 94,4 %</tspan></text><rect x="10" y="106" width="179" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="99.5" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="99.5" dy="0">Sobreconfiada</tspan></text><rect x="195" y="106" width="126" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="258" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="258" dy="0">0,249</tspan></text><rect x="327" y="106" width="477" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="565.5" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="565.5" dy="0">50,5 · 69,7 · 57,0 · 65,5 · 74,4 %</tspan></text><rect x="10" y="156" width="179" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="99.5" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="99.5" dy="0">Siempre 95 %</tspan></text><rect x="195" y="156" width="126" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="258" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="258" dy="0">0,317</tspan></text><rect x="327" y="156" width="477" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="565.5" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="565.5" dy="0">solo 95 %: 65,0 %</tspan></text><rect x="10" y="210" width="800" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="410" y="234.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="410" dy="0">La calibrada declara 95 % y acierta alrededor de 94 %; la sobreconfiada, con la misma declaración, acierta</tspan></text><text x="410" y="251.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="410" dy="0">74 %. La diferencia es invisible mientras nadie contrasta las probabilidades con los resultados.</tspan></text><text x="410" y="291.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="410" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
