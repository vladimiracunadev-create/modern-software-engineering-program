<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 371" width="820" height="371" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué cobertura logra un panel</title><desc id="d">Tabla con 5 000 revisiones sintéticas de 30 modos de fallo en tres dominios: cuatro revisoras del mismo dominio cubren el 58 por ciento de media y 31,5 el dominio peor cubierto, dos y dos de dos dominios 67,2 y 39,8, una generalista y tres de dominios distintos 71 y 58,8, y la misma composición con ejercicio previo al fallo 83,2 y 73,1.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="820" height="371" fill="#ffffff"/><rect x="10" y="12" width="388" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="204" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="204" dy="0">Composición del panel</tspan></text><rect x="404" y="12" width="169" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="488.5" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="488.5" dy="0">Cobertura media</tspan></text><rect x="579" y="12" width="225" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="691.5" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="691.5" dy="0">Dominio peor cubierto</tspan></text><rect x="10" y="56" width="388" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="204" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="204" dy="0">4 revisoras del mismo dominio</tspan></text><rect x="404" y="56" width="169" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="488.5" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="488.5" dy="0">58,0 %</tspan></text><rect x="579" y="56" width="225" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="691.5" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="691.5" dy="0">31,5 %</tspan></text><rect x="10" y="106" width="388" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="204" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="204" dy="0">2 y 2 de dos dominios</tspan></text><rect x="404" y="106" width="169" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="488.5" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="488.5" dy="0">67,2 %</tspan></text><rect x="579" y="106" width="225" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="691.5" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="691.5" dy="0">39,8 %</tspan></text><rect x="10" y="156" width="388" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="204" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="204" dy="0">Una generalista y tres de dominios distintos</tspan></text><rect x="404" y="156" width="169" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="488.5" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="488.5" dy="0">71,0 %</tspan></text><rect x="579" y="156" width="225" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="691.5" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="691.5" dy="0">58,8 %</tspan></text><rect x="10" y="206" width="388" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="204" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="204" dy="0">La anterior, con ejercicio previo al fallo</tspan></text><rect x="404" y="206" width="169" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="488.5" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="488.5" dy="0">83,2 %</tspan></text><rect x="579" y="206" width="225" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="691.5" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="691.5" dy="0">73,1 %</tspan></text><rect x="10" y="260" width="800" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="410" y="284.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="410" dy="0">La composición pesa más que el número de personas: cuatro del mismo dominio dejan un dominio con menos de</tspan></text><text x="410" y="301.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="410" dy="0">un tercio cubierto, y una composición diversa lo sube a más de la mitad. El ejercicio previo al fallo suma</tspan></text><text x="410" y="318.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="410" dy="0">otros doce puntos.</tspan></text><text x="410" y="357.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="410" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
