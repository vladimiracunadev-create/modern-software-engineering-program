<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 421" width="820" height="421" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuántas decisiones hacen falta para distinguir a quien decide mejor</title><desc id="d">Tabla con dos personas que deciden con calidad buena en el 65 y el 50 por ciento de los casos: con 5 decisiones por persona, juzgar por resultados identifica a la mejor en el 56,3 por ciento y por proceso en el 63, con 10 en 57,6 y 67,9, con 20 en 62,4 y 75,1, con 50 en 67,9 y 85, y con 100 en 73,6 y 93,4.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="820" height="421" fill="#ffffff"/><rect x="10" y="12" width="211" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="115.5" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="115.5" dy="0">Decisiones por persona</tspan></text><rect x="227" y="12" width="351" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="402.5" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="402.5" dy="0">Identifica a la mejor decisora por</tspan></text><text x="402.5" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="402.5" dy="0">resultados</tspan></text><rect x="584" y="12" width="220" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="694" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="694" dy="0">Por calidad del proceso</tspan></text><rect x="10" y="56" width="211" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="115.5" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="115.5" dy="0">5</tspan></text><rect x="227" y="56" width="351" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402.5" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402.5" dy="0">56,3 %</tspan></text><rect x="584" y="56" width="220" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="694" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="694" dy="0">63,0 %</tspan></text><rect x="10" y="106" width="211" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="115.5" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="115.5" dy="0">10</tspan></text><rect x="227" y="106" width="351" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402.5" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402.5" dy="0">57,6 %</tspan></text><rect x="584" y="106" width="220" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="694" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="694" dy="0">67,9 %</tspan></text><rect x="10" y="156" width="211" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="115.5" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="115.5" dy="0">20</tspan></text><rect x="227" y="156" width="351" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402.5" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402.5" dy="0">62,4 %</tspan></text><rect x="584" y="156" width="220" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="694" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="694" dy="0">75,1 %</tspan></text><rect x="10" y="206" width="211" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="115.5" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="115.5" dy="0">50</tspan></text><rect x="227" y="206" width="351" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402.5" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402.5" dy="0">67,9 %</tspan></text><rect x="584" y="206" width="220" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="694" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="694" dy="0">85,0 %</tspan></text><rect x="10" y="256" width="211" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="115.5" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="115.5" dy="0">100</tspan></text><rect x="227" y="256" width="351" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="402.5" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="402.5" dy="0">73,6 %</tspan></text><rect x="584" y="256" width="220" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="694" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="694" dy="0">93,4 %</tspan></text><rect x="10" y="310" width="800" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="410" y="334.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="410" dy="0">Con diez decisiones por persona, juzgar por resultados apenas supera el azar (57,6 %); incluso con cien</tspan></text><text x="410" y="351.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="410" dy="0">decisiones, el 26 % de las veces se elige a la persona equivocada. Juzgar el proceso, aun con una auditoría</tspan></text><text x="410" y="368.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="410" dy="0">imperfecta, acierta más con cualquier cantidad.</tspan></text><text x="410" y="407.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="410" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
