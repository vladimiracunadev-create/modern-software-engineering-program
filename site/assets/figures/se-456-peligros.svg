<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 298" width="940" height="298" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cinco peligros del Horno de curado: estado de su evidencia en el paquete de aseguramiento inicial</title><desc id="d">Barra apilada con los cinco peligros: 3 con un control verificado por una prueba que pasa, 1 con un control sin prueba que pase y 1 sin ningún control.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="298" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cinco peligros del Horno de curado: estado de su evidencia en el paquete de aseguramiento inicial</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Control verificado</tspan></text><rect x="199.72" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="219.72" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="219.72" dy="0">Control sin prueba que pase</tspan></text><rect x="451.3" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="471.3" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="471.3" dy="0">Sin control</tspan></text><line x1="234" y1="77" x2="234" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="234" y1="117" x2="234" y2="122" stroke="#5b7280" stroke-width="1.4"/><text x="234" y="138" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="234" dy="0">0</tspan></text><line x1="362.34" y1="77" x2="362.34" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="362.34" y1="117" x2="362.34" y2="122" stroke="#5b7280" stroke-width="1.4"/><text x="362.34" y="138" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362.34" dy="0">1</tspan></text><line x1="490.68" y1="77" x2="490.68" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="490.68" y1="117" x2="490.68" y2="122" stroke="#5b7280" stroke-width="1.4"/><text x="490.68" y="138" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="490.68" dy="0">2</tspan></text><line x1="619.02" y1="77" x2="619.02" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="619.02" y1="117" x2="619.02" y2="122" stroke="#5b7280" stroke-width="1.4"/><text x="619.02" y="138" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="619.02" dy="0">3</tspan></text><line x1="747.36" y1="77" x2="747.36" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="747.36" y1="117" x2="747.36" y2="122" stroke="#5b7280" stroke-width="1.4"/><text x="747.36" y="138" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747.36" dy="0">4</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="117" x2="875.7" y2="122" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="138" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">5</tspan></text><line x1="234" y1="117" x2="875.7" y2="117" stroke="#5b7280" stroke-width="1.6"/><text x="224" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="224" dy="0">Peligros del Horno de curado</tspan></text><rect x="234" y="84" width="385.02" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="426.51" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="426.51" dy="0">3</tspan></text><rect x="619.02" y="84" width="128.34" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="683.19" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="683.19" dy="0">1</tspan></text><rect x="747.36" y="84" width="128.34" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="811.53" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="811.53" dy="0">1</tspan></text><text x="882.7" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">5</tspan></text><text x="554.85" y="161" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="554.85" dy="0">Peligros</tspan></text><rect x="10" y="175" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="199.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La comprobación automática encuentra tres huecos: el control REQ-05 sin prueba, el peligro H5 (deriva de calibración) sin</tspan></text><text x="470" y="216.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">control y el requisito REQ-05 sin prueba. El peligro sin control no se oculta: se registra como riesgo residual que una</tspan></text><text x="470" y="233.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">persona con autoridad acepta o se cierra con un control. Los datos son los del paquete de ejemplo.</tspan></text><text x="470" y="280.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 47; muestra un mecanismo, no mide un producto real.</tspan></text></svg>
