<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 821 305" width="821" height="305" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuánto se encuentra al muestrear</title><desc id="d">Tabla con la probabilidad exacta de que una revisora encuentre al menos una afirmación sin respaldo en un dossier de 30: con 1 sin respaldo y 3, 5, 8 o 12 inspeccionadas es 10, 16,7, 26,7 y 40 por ciento, con 3 sin respaldo 28, 43,3, 62,1 y 79,9, y con 6 sin respaldo 50,1, 70,2, 87,4 y 96,9.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="821" height="305" fill="#ffffff"/><rect x="10" y="12" width="293" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="156.5" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="156.5" dy="0">Afirmaciones sin respaldo</tspan></text><rect x="309" y="12" width="117" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="367.5" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="367.5" dy="0">Revisa 3</tspan></text><rect x="432" y="12" width="117" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="490.5" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="490.5" dy="0">Revisa 5</tspan></text><rect x="555" y="12" width="117" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="613.5" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="613.5" dy="0">Revisa 8</tspan></text><rect x="678" y="12" width="127" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="741.5" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="741.5" dy="0">Revisa 12</tspan></text><rect x="10" y="56" width="293" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="156.5" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="156.5" dy="0">1 de 30</tspan></text><rect x="309" y="56" width="117" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="367.5" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="367.5" dy="0">10,0 %</tspan></text><rect x="432" y="56" width="117" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="490.5" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="490.5" dy="0">16,7 %</tspan></text><rect x="555" y="56" width="117" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="613.5" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="613.5" dy="0">26,7 %</tspan></text><rect x="678" y="56" width="127" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="741.5" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="741.5" dy="0">40,0 %</tspan></text><rect x="10" y="106" width="293" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="156.5" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="156.5" dy="0">3 de 30</tspan></text><rect x="309" y="106" width="117" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="367.5" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="367.5" dy="0">28,0 %</tspan></text><rect x="432" y="106" width="117" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="490.5" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="490.5" dy="0">43,3 %</tspan></text><rect x="555" y="106" width="117" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="613.5" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="613.5" dy="0">62,1 %</tspan></text><rect x="678" y="106" width="127" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="741.5" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="741.5" dy="0">79,9 %</tspan></text><rect x="10" y="156" width="293" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="156.5" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="156.5" dy="0">6 de 30</tspan></text><rect x="309" y="156" width="117" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="367.5" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="367.5" dy="0">50,1 %</tspan></text><rect x="432" y="156" width="117" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="490.5" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="490.5" dy="0">70,2 %</tspan></text><rect x="555" y="156" width="117" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="613.5" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="613.5" dy="0">87,4 %</tspan></text><rect x="678" y="156" width="127" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="741.5" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="741.5" dy="0">96,9 %</tspan></text><rect x="10" y="210" width="801" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="410.5" y="234.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="410.5" dy="0">Una sola afirmación sin respaldo entre treinta supera el 25 % de probabilidad de ser vista solo si se</tspan></text><text x="410.5" y="251.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="410.5" dy="0">inspeccionan ocho. Para encontrar con 80 % un problema de tres afirmaciones hay que inspeccionar doce.</tspan></text><text x="410.5" y="291.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="410.5" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
