<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" width="940" height="480" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuántos intentos necesita alguien para quedarse con una sesión según cómo se generó el identificador</title><desc id="d">Tres identificadores de sesión como tarjetas: uno secuencial se adivina en unos 99 intentos entre 10 000 sesiones activas, uno sembrado con la hora del inicio se recupera probando 3 601 semillas de 7 201, y un token de 128 bits del sistema exige del orden de 3,4 por 10 elevado a 34 intentos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="480" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuántos intentos necesita alguien para quedarse con una sesión según cómo se generó el identificador</tspan></text><rect x="14" y="47" width="14" height="14" rx="3" fill="#c0432f"/><text x="36" y="59" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">falla o sorprende</tspan></text><rect x="183.2" y="47" width="14" height="14" rx="3" fill="#087f8c"/><text x="205.2" y="59" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="205.2" dy="0">se sostiene</tspan></text><rect x="306.8" y="47" width="14" height="14" rx="3" fill="#946512"/><text x="328.8" y="59" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="328.8" dy="0">depende</tspan></text><rect x="20" y="77" width="378" height="57.28" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="100.96" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">Identificador secuencial en un espacio de 1 000</tspan></text><text x="30" y="117.6" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">000 con 10 000 sesiones</tspan></text><polyline points="402,105.64 438,105.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="442" y="77" width="478" height="57.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="452" y="109.28" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14"><tspan x="452" dy="0">99 intentos hasta acertar (se esperan 100)</tspan></text><text x="24" y="151.28" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">Se acierta una sesión ajena adivinando; el espacio efectivo es 1 de cada 100.</tspan></text><rect x="20" y="172.92" width="378" height="57.28" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="196.88" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">Semilla del generador = segundo del inicio de</tspan></text><text x="30" y="213.52" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">sesión</tspan></text><polyline points="402,201.56 438,201.56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="442" y="172.92" width="478" height="57.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="452" y="205.2" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14"><tspan x="452" dy="0">3 601 de 7 201 candidatos</tspan></text><text x="24" y="247.2" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">El token de la víctima se recupera sabiendo la hora del inicio con ±1 hora.</tspan></text><rect x="20" y="268.84" width="378" height="57.28" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="292.8" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">128 bits del generador criptográfico del sistema</tspan></text><text x="30" y="309.44" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">(secrets)</tspan></text><polyline points="402,297.48 438,297.48" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="442" y="268.84" width="478" height="57.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="452" y="301.12" font-size="13" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="452" dy="0">3,4 × 10^34 intentos esperados</tspan></text><text x="24" y="343.12" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">Adivinar no es el camino; quedan el robo del token y la fijación de sesión.</tspan></text><rect x="10" y="366.76" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="391.72" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Un token largo no es seguro si su origen es predecible: la longitud no es la entropía. La seguridad real de la tercera fila</tspan></text><text x="470" y="408.36" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">depende de que el token no se filtre, caduque y se invalide al cerrar sesión, nada de lo cual mide este experimento.</tspan></text><text x="470" y="452.04" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
