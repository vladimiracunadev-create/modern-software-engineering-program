<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 567" width="940" height="567" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una hora de un núcleo contra 10 000 contraseñas filtradas: cuántas caen según cómo se guardaron</title><desc id="d">Barras agrupadas con el porcentaje de contraseñas rotas en una hora de un núcleo: con SHA-256 de una vuelta 70,0 sin sal y 46,2 con sal por usuario, con PBKDF2 de 1 000 iteraciones 70,0 y 9,0, con 600 000 iteraciones 22,5 y 0,9 y con scrypt 36,7 y 2,4.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="567" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Una hora de un núcleo contra 10 000 contraseñas filtradas: cuántas caen según cómo se guardaron</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Rotas sin sal</tspan></text><rect x="162.02" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="182.02" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="182.02" dy="0">Rotas con sal por usuario</tspan></text><line x1="71.08" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="375" x2="71.08" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="305" x2="920" y2="305" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="305" x2="71.08" y2="305" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="309.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="235" x2="920" y2="235" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="235" x2="71.08" y2="235" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="239.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">40</tspan></text><line x1="71.08" y1="165" x2="920" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="165" x2="71.08" y2="165" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="169.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">60</tspan></text><line x1="71.08" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="95" x2="71.08" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">80</tspan></text><line x1="71.08" y1="95" x2="71.08" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">% de las 10 000 cuentas rotas en una hora</text><rect x="92.303" y="130" width="82.892" height="245" rx="3" fill="#c0432f"/><text x="133.749" y="124" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="133.749" dy="0">70,0</tspan></text><rect x="179.195" y="213.3" width="82.892" height="161.7" rx="3" fill="#087f8c"/><text x="220.641" y="207.3" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="220.641" dy="0">46,2</tspan></text><text x="177.195" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="177.195" dy="0">SHA-256 de una vuelta</tspan></text><text x="177.195" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="177.195" dy="0">(0,0025 ms)</tspan></text><rect x="304.533" y="130" width="82.892" height="245" rx="3" fill="#c0432f"/><text x="345.979" y="124" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="345.979" dy="0">70,0</tspan></text><rect x="391.425" y="343.5" width="82.892" height="31.5" rx="3" fill="#087f8c"/><text x="432.871" y="337.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="432.871" dy="0">9,0</tspan></text><text x="389.425" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="389.425" dy="0">PBKDF2, 1 000 iteraciones</tspan></text><text x="389.425" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="389.425" dy="0">(2,38 ms)</tspan></text><rect x="516.763" y="296.25" width="82.892" height="78.75" rx="3" fill="#c0432f"/><text x="558.209" y="290.25" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="558.209" dy="0">22,5</tspan></text><rect x="603.655" y="371.85" width="82.892" height="3.15" rx="3" fill="#087f8c"/><text x="645.101" y="365.85" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="645.101" dy="0">0,9</tspan></text><text x="601.655" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="601.655" dy="0">PBKDF2, 600 000 iteraciones</tspan></text><text x="601.655" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="601.655" dy="0">(633 ms)</tspan></text><rect x="728.993" y="246.55" width="82.892" height="128.45" rx="3" fill="#c0432f"/><text x="770.439" y="240.55" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="770.439" dy="0">36,7</tspan></text><rect x="815.885" y="366.6" width="82.892" height="8.4" rx="3" fill="#087f8c"/><text x="857.331" y="360.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="857.331" dy="0">2,4</tspan></text><text x="813.885" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="813.885" dy="0">scrypt N = 2^14, r = 8, p =</tspan></text><text x="813.885" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="813.885" dy="0">1 (72,4 ms)</tspan></text><rect x="10" y="444" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="468.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Con sal, el atacante paga cada candidato una vez por usuario: 10 000 veces más. El costo de la función decide qué parte del</tspan></text><text x="470" y="485.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">70 % de contraseñas «de diccionario» alcanza. La distribución de contraseñas (Zipf, exponente 0,8), el 30 % imposible de</tspan></text><text x="470" y="502.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">adivinar y el núcleo único son supuestos del autor.</tspan></text><text x="470" y="549.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Lectura de reloj de un equipo Windows 11 (CPython 3.12.9); en otro equipo los milisegundos cambian.</tspan></text></svg>
