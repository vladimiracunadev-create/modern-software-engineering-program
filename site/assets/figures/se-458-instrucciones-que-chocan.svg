<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 554" width="940" height="554" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Probabilidad de que un conjunto de instrucciones no tenga ningún par en conflicto</title><desc id="d">Líneas con la probabilidad de que un conjunto de instrucciones no tenga ningún par en conflicto según su tamaño: con 12 instrucciones es 71,8 % si cada par choca con probabilidad 0,5 por ciento y 26,4 % si choca con 2 por ciento; con 20 instrucciones baja a 38,6 % y 2,2 %.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="554" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Probabilidad de que un conjunto de instrucciones no tenga ningún par en conflicto</tspan></text><circle cx="22" cy="51" r="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">0,5 % por par</tspan></text><rect x="162.02" y="45" width="12" height="12" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="182.02" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="182.02" dy="0">2 % por par</tspan></text><line x1="78.62" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="387" x2="78.62" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="327" x2="910" y2="327" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="327" x2="78.62" y2="327" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="331.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">20</tspan></text><line x1="78.62" y1="267" x2="910" y2="267" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="267" x2="78.62" y2="267" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="271.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">40</tspan></text><line x1="78.62" y1="207" x2="910" y2="207" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="207" x2="78.62" y2="207" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="211.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">60</tspan></text><line x1="78.62" y1="147" x2="910" y2="147" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="147" x2="78.62" y2="147" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="151.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">80</tspan></text><line x1="78.62" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="87" x2="78.62" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="87" x2="78.62" y2="387" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="87" x2="96.62" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="387" x2="96.62" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">3</tspan></text><line x1="190.194" y1="87" x2="190.194" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="190.194" y1="387" x2="190.194" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="190.194" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="190.194" dy="0">5</tspan></text><line x1="330.555" y1="87" x2="330.555" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="330.555" y1="387" x2="330.555" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="330.555" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="330.555" dy="0">8</tspan></text><line x1="517.704" y1="87" x2="517.704" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="517.704" y1="387" x2="517.704" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="517.704" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517.704" dy="0">12</tspan></text><line x1="892" y1="87" x2="892" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="387" x2="892" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">20</tspan></text><line x1="78.62" y1="387" x2="910" y2="387" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 237)">Sin ningún par en conflicto (%)</text><text x="494.31" y="433" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Instrucciones en el conjunto</tspan></text><polyline points="96.62,91.5 190.194,101.7 330.555,126.3 517.704,171.6 892,271.2" fill="none" stroke="#087f8c" stroke-width="2.4"/><circle cx="96.62" cy="91.5" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="96.62" y="80.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">98,5</tspan></text><circle cx="190.194" cy="101.7" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="190.194" y="90.7" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="190.194" dy="0">95,1</tspan></text><circle cx="330.555" cy="126.3" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="330.555" y="115.3" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="330.555" dy="0">86,9</tspan></text><circle cx="517.704" cy="171.6" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="517.704" y="160.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="517.704" dy="0">71,8</tspan></text><circle cx="892" cy="271.2" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="260.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">38,6</tspan></text><polyline points="96.62,104.7 190.194,141.9 330.555,216.6 517.704,307.8 892,380.4" fill="none" stroke="#c0432f" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="91.12" y="99.2" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="96.62" y="128.7" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">94,1</tspan></text><rect x="184.694" y="136.4" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="190.194" y="165.9" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="190.194" dy="0">81,7</tspan></text><rect x="325.055" y="211.1" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="330.555" y="240.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="330.555" dy="0">56,8</tspan></text><rect x="512.204" y="302.3" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="517.704" y="331.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="517.704" dy="0">26,4</tspan></text><rect x="886.5" y="374.9" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="882" y="384.9" font-size="13" text-anchor="end" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="882" dy="0">2,2</tspan></text><rect x="10" y="447" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los pares crecen con el cuadrado de las instrucciones, así que añadir reglas «por si acaso» vuelve casi seguro algún</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">choque. La probabilidad por par es un supuesto del autor y supone pares independientes.</tspan></text><text x="470" y="536.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Cálculo exacto (1 − q)^pares; no hay simulación ni modelo real.</tspan></text></svg>
