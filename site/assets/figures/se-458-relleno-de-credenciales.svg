<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 511" width="940" height="511" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Relleno de credenciales contra 5 000 cuentas: cuántas de las 100 con contraseña reutilizada se comprometen</title><desc id="d">Barras horizontales con las cuentas comprometidas de 100 con contraseña reutilizada: 100 sin defensas, con límite por dirección IP o con bloqueo de la cuenta; 73 con segundo factor con 30 por ciento de adopción; 33 con rechazo de contraseñas filtradas; 24 con ambos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="511" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Relleno de credenciales contra 5 000 cuentas: cuántas de las 100 con contraseña reutilizada se comprometen</tspan></text><line x1="334" y1="49" x2="334" y2="313" stroke="#d5dde1" stroke-width="1"/><line x1="334" y1="313" x2="334" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="334" y="334" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="334" dy="0">0</tspan></text><line x1="445.564" y1="49" x2="445.564" y2="313" stroke="#d5dde1" stroke-width="1"/><line x1="445.564" y1="313" x2="445.564" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="445.564" y="334" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="445.564" dy="0">20</tspan></text><line x1="557.128" y1="49" x2="557.128" y2="313" stroke="#d5dde1" stroke-width="1"/><line x1="557.128" y1="313" x2="557.128" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="557.128" y="334" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557.128" dy="0">40</tspan></text><line x1="668.692" y1="49" x2="668.692" y2="313" stroke="#d5dde1" stroke-width="1"/><line x1="668.692" y1="313" x2="668.692" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="668.692" y="334" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="668.692" dy="0">60</tspan></text><line x1="780.256" y1="49" x2="780.256" y2="313" stroke="#d5dde1" stroke-width="1"/><line x1="780.256" y1="313" x2="780.256" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="780.256" y="334" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="780.256" dy="0">80</tspan></text><line x1="891.82" y1="49" x2="891.82" y2="313" stroke="#d5dde1" stroke-width="1"/><line x1="891.82" y1="313" x2="891.82" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="891.82" y="334" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="891.82" dy="0">100</tspan></text><line x1="334" y1="313" x2="891.82" y2="313" stroke="#5b7280" stroke-width="1.6"/><text x="324" y="75.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="324" dy="0">Ninguna defensa</tspan></text><text x="324" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="324" dy="0">Límite de 5 intentos por hora por IP</tspan></text><text x="324" y="163.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="324" dy="0">Bloqueo de la cuenta tras 5 fallos</tspan></text><text x="324" y="207.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="324" dy="0">Segundo factor con 30 % de adopción</tspan></text><text x="324" y="243" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="324" dy="0">Rechazo de contraseñas filtradas (cubre el</tspan></text><text x="324" y="260" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="324" dy="0">60 %)</tspan></text><text x="324" y="295.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="324" dy="0">Segundo factor y rechazo de filtradas</tspan></text><rect x="334" y="55" width="557.82" height="32" rx="3" fill="#c0432f"/><text x="898.82" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="898.82" dy="0">100</tspan></text><rect x="334" y="99" width="557.82" height="32" rx="3" fill="#c0432f"/><text x="898.82" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="898.82" dy="0">100</tspan></text><rect x="334" y="143" width="557.82" height="32" rx="3" fill="#c0432f"/><text x="898.82" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="898.82" dy="0">100</tspan></text><rect x="334" y="187" width="407.209" height="32" rx="3" fill="#c0432f"/><text x="748.209" y="207.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="748.209" dy="0">73</tspan></text><rect x="334" y="231" width="184.081" height="32" rx="3" fill="#c0432f"/><text x="525.081" y="251.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="525.081" dy="0">33</tspan></text><rect x="334" y="275" width="133.877" height="32" rx="3" fill="#c0432f"/><text x="474.877" y="295.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="474.877" dy="0">24</tspan></text><text x="612.91" y="357" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="612.91" dy="0">cuentas comprometidas de 100</tspan></text><rect x="10" y="371" width="920" height="92.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="395.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Dos controles muy citados no frenan este ataque porque el relleno reparte un intento por cuenta entre 2 000 direcciones y</tspan></text><text x="470" y="412.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">prueba las 5 000 cuentas en una hora. El bloqueo por cuenta, además, convierte al atacante en un denegador de servicio</tspan></text><text x="470" y="429.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">contra sus víctimas. Las tasas de reutilización (2 %), adopción (30 %) y cobertura del corpus (60 %) son supuestos del</tspan></text><text x="470" y="445.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">autor; ninguna defensa llega a cero.</tspan></text><text x="470" y="493.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
