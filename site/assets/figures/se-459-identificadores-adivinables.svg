<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 450" width="940" height="450" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Lectura de entregas ajenas: identificadores adivinables frente a comprobar el dueño (5 000 entregas)</title><desc id="d">Barras horizontales con las entregas ajenas leídas de 5 000: con identificadores secuenciales y sin comprobar el dueño 4 988 con 20 000 peticiones; con identificadores aleatorios y sin comprobar, adivinar lee 0 pero 150 identificadores filtrados leen 150; comprobar el dueño las reduce a 0 en ambos casos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="450" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Lectura de entregas ajenas: identificadores adivinables frente a comprobar el dueño (5 000 entregas)</tspan></text><line x1="354" y1="49" x2="354" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="269" x2="354" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="458.34" y1="49" x2="458.34" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="458.34" y1="269" x2="458.34" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="458.34" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="458.34" dy="0">1 000</tspan></text><line x1="562.68" y1="49" x2="562.68" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="562.68" y1="269" x2="562.68" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="562.68" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562.68" dy="0">2 000</tspan></text><line x1="667.02" y1="49" x2="667.02" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="667.02" y1="269" x2="667.02" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="667.02" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667.02" dy="0">3 000</tspan></text><line x1="771.36" y1="49" x2="771.36" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="771.36" y1="269" x2="771.36" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="771.36" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="771.36" dy="0">4 000</tspan></text><line x1="875.7" y1="49" x2="875.7" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="269" x2="875.7" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">5 000</tspan></text><line x1="354" y1="269" x2="875.7" y2="269" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="67" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Secuencial, sin comprobar el dueño (20 000</tspan></text><text x="344" y="84" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">peticiones)</tspan></text><text x="344" y="111" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Aleatorio (UUID), sin comprobar, adivinando</tspan></text><text x="344" y="128" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">(1 000 000)</tspan></text><text x="344" y="155" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Aleatorio, sin comprobar, con el 3 % de los</tspan></text><text x="344" y="172" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">identificadores filtrados (150)</tspan></text><text x="344" y="207.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Secuencial, comprobando el dueño (20 000)</tspan></text><text x="344" y="251.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Aleatorio, comprobando el dueño (1 000 000)</tspan></text><rect x="354" y="55" width="520.448" height="32" rx="3" fill="#c0432f"/><text x="881.448" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="881.448" dy="0">4 988</tspan></text><rect x="354" y="99" width="2" height="32" rx="3" fill="#c0432f"/><text x="363" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="143" width="15.651" height="32" rx="3" fill="#c0432f"/><text x="376.651" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="376.651" dy="0">150</tspan></text><rect x="354" y="187" width="2" height="32" rx="3" fill="#c0432f"/><text x="363" y="207.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="231" width="2" height="32" rx="3" fill="#c0432f"/><text x="363" y="251.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><text x="614.85" y="313" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="614.85" dy="0">entregas ajenas leídas de 5 000</tspan></text><rect x="10" y="327" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="351.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El identificador aleatorio reduce la facilidad de enumerar y no es un control de acceso: cuando un identificador aparece en</tspan></text><text x="470" y="368.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">un correo, un enlace o un registro, la entrega queda al alcance de cualquiera. Solo la comprobación en el servidor, en cada</tspan></text><text x="470" y="385.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">petición, cierra el defecto.</tspan></text><text x="470" y="432.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
