" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="347.6" dy="0">0</tspan></text><rect x="412.7" y="266.5" width="124.2" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="474.8" y="291.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="474.8" dy="0">0</tspan></text><rect x="539.9" y="266.5" width="124.2" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="602" y="291.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="602" dy="0">0</tspan></text><rect x="667.1" y="266.5" width="124.2" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="729.2" y="291.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="729.2" dy="0">0</tspan></text><rect x="794.3" y="266.5" width="124.2" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="856.4" y="291.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="856.4" dy="0">0</tspan></text><text x="284" y="335" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="284" dy="0">0</tspan></text><rect x="299.54" y="323" width="30.5" height="14" fill="#fbe4de"/><rect x="329.54" y="323" width="30.5" height="14" fill="#f3cdc5"/><rect x="359.54" y="323" width="30.5" height="14" fill="#eab6ac"/><rect x="389.54" y="323" width="30.5" height="14" fill="#e29f93"/><rect x="419.54" y="323" width="30.5" height="14" fill="#d9887a"/><rect x="449.54" y="323" width="30.5" height="14" fill="#d17161"/><rect x="479.54" y="323" width="30.5" height="14" fill="#c85a48"/><rect x="509.54" y="323" width="30.5" height="14" fill="#c0432f"/><text x="547.54" y="335" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="547.54" dy="0">8</tspan></text><text x="563.08" y="335" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="563.08" dy="0">más oscuro = mayor (cargas que rompen el contexto (de 8))</tspan></text><rect x="10" y="351" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="375.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Ningún codificador sirve para todos los contextos: html.escape no mira las comillas simples sin el parámetro, deja pasar un</tspan></text><text x="470" y="392.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">atributo sin comillas y no toca el esquema de una URL. quote lo anula todo porque destruye el significado. Es un modelo de</tspan></text><text x="470" y="409.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">reglas escrito por el autor, no un navegador.</tspan></text><text x="470" y="456.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
