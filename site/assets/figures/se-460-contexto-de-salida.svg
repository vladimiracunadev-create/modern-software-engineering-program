<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 474" width="940" height="474" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ocho cargas por contexto de salida: cuántas rompen el contexto según el codificador (modelo de reglas)</title><desc id="d">Mapa de calor con las cargas de 8 que rompen cada contexto de salida según el codificador: sin codificar 3 en texto HTML, 1 en atributo con comillas, 7 en atributo sin comillas, 4 en cadena JavaScript y 1 en URL; html.escape con comillas deja 4 en el atributo sin comillas y 1 en la URL; quote las anula todas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="474" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Ocho cargas por contexto de salida: cuántas rompen el contexto según el codificador (modelo de reglas)</tspan></text><text x="347.6" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="347.6" dy="0">Texto HTML</tspan></text><text x="474.8" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="474.8" dy="0">Atributo con</tspan></text><text x="474.8" y="77" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="474.8" dy="0">comillas</tspan></text><text x="602" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="602" dy="0">Atributo sin</tspan></text><text x="602" y="77" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="602" dy="0">comillas</tspan></text><text x="729.2" y="60" 