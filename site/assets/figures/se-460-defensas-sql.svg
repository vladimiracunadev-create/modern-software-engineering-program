<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 474" width="940" height="474" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Doce cargas por contexto contra SQLite real: cuántas alteran la consulta según la defensa</title><desc id="d">Mapa de calor con las cargas de 12 que alteran la consulta por defensa y contexto: concatenar deja pasar 4 en un valor de texto, 9 en un número y 4 en un identificador de ORDER BY; duplicar comillas cierra el texto y no el número; una lista de palabras deja pasar 1, 6 y 2; el parámetro enlazado cierra texto y número; solo la lista blanca resuelve el identificador.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="474" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Doce cargas por contexto contra SQLite real: cuántas alteran la consulta según la defensa</tspan></text><text x="448.333" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="448.333" dy="0">Valor entre comillas</tspan></text><text x="637" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="637" dy="0">Número sin comillas</tspan></text><text x="825.667" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="825.667" dy="0">Identificador (ORDER BY)</tspan></text><text x="344" y="98.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">Concatenar el texto</tspan></text><text x="344" y="142.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">Duplicar las comillas simples</tspan></text><text x="344" y="178" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">Rechazar palabras (union, select, drop,</tspan></text><text x="344" y="195" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">delete)</tspan></text><text x="344" y="230.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">Parámetro enlazado</tspan></text><text x="344" y="274.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">Lista blanca de columnas</tspan></text><rect x="355.5" y="73.5" width="185.667" height="41" rx="4" fill="#e7aea4" stroke="#ffffff" stroke-width="1"/><text x="448.333" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="448.333" dy="0">4</tspan></text><rect x="544.167" y="73.5" width="185.667" height="41" rx="4" fill="#cf6b5b" stroke="#ffffff" stroke-width="1"/><text x="637" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="637" dy="0">9</tspan></text><rect x="732.833" y="73.5" width="185.667" height="41" rx="4" fill="#e7aea4" stroke="#ffffff" stroke-width="1"/><text x="825.667" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="825.667" dy="0">4</tspan></text><rect x="355.5" y="117.5" width="185.667" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="448.333" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="448.333" dy="0">0</tspan></text><rect x="544.167" y="117.5" width="185.667" height="41" rx="4" fill="#cf6b5b" stroke="#ffffff" stroke-width="1"/><text x="637" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="637" dy="0">9</tspan></text><rect x="732.833" y="117.5" width="185.667" height="41" rx="4" fill="#e7aea4" stroke="#ffffff" stroke-width="1"/><text x="825.667" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="825.667" dy="0">4</tspan></text><rect x="355.5" y="161.5" width="185.667" height="41" rx="4" fill="#f6d7cf" stroke="#ffffff" stroke-width="1"/><text x="448.333" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="448.333" dy="0">1</tspan></text><rect x="544.167" y="161.5" width="185.667" height="41" rx="4" fill="#de9486" stroke="#ffffff" stroke-width="1"/><text x="637" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="637" dy="0">6</tspan></text><rect x="732.833" y="161.5" width="185.667" height="41" rx="4" fill="#f1c9c1" stroke="#ffffff" stroke-width="1"/><text x="825.667" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="825.667" dy="0">2</tspan></text><rect x="355.5" y="205.5" width="185.667" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="448.333" y="230.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="448.333" dy="0">0</tspan></text><rect x="544.167" y="205.5" width="185.667" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="637" y="230.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="637" dy="0">0</tspan></text><rect x="732.833" y="205.5" width="185.667" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="825.667" y="230.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="825.667" dy="0">0</tspan></text><rect x="355.5" y="249.5" width="185.667" height="41" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><text x="448.333" y="274.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="448.333" dy="0">—</tspan></text><rect x="544.167" y="249.5" width="185.667" height="41" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><text x="637" y="274.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="637" dy="0">—</tspan></text><rect x="732.833" y="249.5" width="185.667" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="825.667" y="274.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="825.667" dy="0">0</tspan></text><text x="354" y="318" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><rect x="369.54" y="306" width="30.5" height="14" fill="#fbe4de"/><rect x="399.54" y="306" width="30.5" height="14" fill="#f3cdc5"/><rect x="429.54" y="306" width="30.5" height="14" fill="#eab6ac"/><rect x="459.54" y="306" width="30.5" height="14" fill="#e29f93"/><rect x="489.54" y="306" width="30.5" height="14" fill="#d9887a"/><rect x="519.54" y="306" width="30.5" height="14" fill="#d17161"/><rect x="549.54" y="306" width="30.5" height="14" fill="#c85a48"/><rect x="579.54" y="306" width="30.5" height="14" fill="#c0432f"/><text x="617.54" y="318" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="617.54" dy="0">12</tspan></text><text x="640.62" y="318" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="640.62" dy="0">más oscuro = mayor (cargas que alteran (de 12))</tspan></text><rect x="10" y="334" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="358.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Duplicar comillas es la defensa correcta para un contexto y inútil en otro: el número no lleva comillas que cerrar. El</tspan></text><text x="470" y="375.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">parámetro enlazado separa dato de código, pero no puede enlazar el nombre de una columna: ORDER BY ? con «titulo DESC» no</tspan></text><text x="470" y="392.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ordena (0 cargas alteran la consulta, pero tampoco ordena). Las 36 cargas son del autor y la lista de palabras se escribió</tspan></text><text x="470" y="408.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">sin ajustarla a ellas.</tspan></text><text x="470" y="456.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">SQLite 3 del módulo estándar de CPython 3.12; cifras idénticas en Windows y Ubuntu (WSL2).</tspan></text></svg>
