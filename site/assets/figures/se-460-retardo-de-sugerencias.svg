="700" fill="#142231"><tspan x="112" dy="0">300</tspan></text><rect x="220" y="156" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="347" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="347" dy="0">133</tspan></text><rect x="480" y="156" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">60</tspan></text><rect x="720" y="156" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">45,1 %</tspan></text><rect x="10" y="206" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="112" dy="0">600</tspan></text><rect x="220" y="206" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="347" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="347" dy="0">60</tspan></text><rect x="480" y="206" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">60</tspan></text><rect x="720" y="206" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">100,0 %</tspan></text><rect x="10" y="260" width="930" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="475" y="284.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="475" dy="0">Esperar a que la escritura se detenga elimina casi todo el gasto sin perder las pausas donde la sugerencia se habría</tspan></text><text x="475" y="301.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="475" dy="0">mostrado. El ritmo de escritura y la regla «útil si hay una pausa de 0,5 s» son supuestos del autor; con otra persona</tspan></text><text x="475" y="318.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="475" dy="0">cambiarían.</tspan></text><text x="475" y="357.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Código estándar ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos.</tspan></text></svg>
