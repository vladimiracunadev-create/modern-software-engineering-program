<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 335" width="940" height="335" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Consultas para falsificar una etiqueta de autenticación de 8 bytes según cómo se compara</title><desc id="d">Barras horizontales con el orden de magnitud de las consultas para falsificar una etiqueta de 8 bytes: 2 002, unos 10 elevado a 3,3, si la comparación termina en el primer byte distinto y el atacante ve cuántos coincidieron, y 9,2 por 10 elevado a 18, unos 10 elevado a 19, sin ninguna señal.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="335" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Consultas para falsificar una etiqueta de autenticación de 8 bytes según cómo se compara</tspan></text><line x1="324" y1="49" x2="324" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="137" x2="324" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="449.835" y1="49" x2="449.835" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="449.835" y1="137" x2="449.835" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="449.835" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="449.835" dy="0">5</tspan></text><line x1="575.67" y1="49" x2="575.67" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="575.67" y1="137" x2="575.67" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="575.67" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="575.67" dy="0">10</tspan></text><line x1="701.505" y1="49" x2="701.505" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="701.505" y1="137" x2="701.505" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="701.505" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="701.505" dy="0">15</tspan></text><line x1="827.34" y1="49" x2="827.34" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="827.34" y1="137" x2="827.34" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="827.34" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827.34" dy="0">20</tspan></text><line x1="324" y1="137" x2="827.34" y2="137" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="67" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Comparación que termina en el primer byte</tspan></text><text x="314" y="84" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">distinto</tspan></text><text x="314" y="111" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Fuerza bruta sin señal (2^63 pruebas</tspan></text><text x="314" y="128" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">medias para 64 bits)</tspan></text><rect x="324" y="55" width="83.0863" height="32" rx="3" fill="#c0432f"/><text x="414.086" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="414.086" dy="0">2 002</tspan></text><rect x="324" y="99" width="477.262" height="32" rx="3" fill="#c0432f"/><text x="808.262" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="808.262" dy="0">9,2 × 10^18</tspan></text><text x="575.67" y="181" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="575.67" dy="0">orden de magnitud de las consultas (potencia de 10)</tspan></text><rect x="10" y="195" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="219.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El eje es el exponente de 10: dieciséis órdenes de magnitud separan las dos barras. Con una comparación de tiempo constante</tspan></text><text x="470" y="236.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">la señal toma un solo valor: no hay nada que medir y no hay una tercera barra que dibujar. Pasar de 9,2 × 10^18 a 2 002 es</tspan></text><text x="470" y="253.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">el valor de un oráculo de pasos. Aquí la señal es un contador perfecto; por la red real el ruido la degrada, pero un</tspan></text><text x="470" y="269.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">atacante con muchas repeticiones lo reduce. hmac.compare_digest elimina la señal en vez de confiar en el ruido.</tspan></text><text x="470" y="317.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
