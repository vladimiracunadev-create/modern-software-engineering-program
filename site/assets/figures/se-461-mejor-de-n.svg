"1.6"/><text x="107" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">5</tspan></text><rect x="210" y="156" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="317" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="317" dy="0">1,18</tspan></text><rect x="430" y="156" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">1,66 → 0,84</tspan></text><rect x="690" y="156" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">2,63 → 0,49</tspan></text><rect x="10" y="206" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">10</tspan></text><rect x="210" y="206" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="317" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="317" dy="0">1,52</tspan></text><rect x="430" y="206" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">2,19 → 1,10</tspan></text><rect x="690" y="206" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">3,42 → 0,64</tspan></text><rect x="10" y="256" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">20</tspan></text><rect x="210" y="256" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="317" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="317" dy="0">1,87</tspan></text><rect x="430" y="256" width="254" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="557" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="557" dy="0">2,63 → 1,29</tspan></text><rect x="690" y="256" width="244" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">4,17 → 0,84</tspan></text><rect x="10" y="310" width="930" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="475" y="334.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Cuantas más alternativas y más ruido, mayor es la distancia entre lo que parece ganar y lo que vale: la ganadora suele ser</tspan></text><text x="475" y="351.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">la que el ruido favoreció. Calidad normal estándar y ruido gaussiano son supuestos del autor.</tspan></text><text x="475" y="391.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Proceso sintético con semilla fija; no se llamó a ningún modelo real. Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
