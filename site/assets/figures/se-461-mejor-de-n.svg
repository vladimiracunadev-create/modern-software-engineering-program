<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 405" width="950" height="405" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Elegir la mejor de N alternativas: calidad medida de la ganadora → calidad real (en desviaciones)</title><desc id="d">Tabla con la calidad de la mejor de N alternativas: con un evaluador perfecto crece de 0,03 a 1,87; con ruido 1 la ganadora de 20 se mide en 2,63 pero vale 1,29, y con ruido 2 se mide en 4,17 pero vale 0,84.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="405" fill="#ffffff"/><rect x="10" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="107" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="107" dy="0">Alternativas (N)</tspan></text><rect x="210" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="317" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="317" dy="0">Evaluador exacto</tspan></text><rect x="430" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="557" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="557" dy="0">Ruido 1: medida → real</tspan></text><rect x="690" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="812" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="812" dy="0">Ruido 2: medida → real</tspan></text><rect x="10" y="56" width="194" height=