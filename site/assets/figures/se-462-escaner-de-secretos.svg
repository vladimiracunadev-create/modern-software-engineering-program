<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 631" width="940" height="631" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Escáner de secretos de juguete sobre 500 líneas con 60 secretos plantados y 140 señuelos</title><desc id="d">Puntos con los secretos detectados de 60 y las falsas alarmas de cuatro escáneres: patrones de proveedor 40 detectados y 24 falsas alarmas, palabra clave 38 y 51, entropía 45 y 21, y la combinación de patrones y palabra clave con entropía 60 y 24; ninguno encuentra todo sin falsas alarmas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="631" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Escáner de secretos de juguete sobre 500 líneas con 60 secretos plantados y 140 señuelos</tspan></text><circle cx="22" cy="51" r="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Solo patrones de proveedor</tspan></text><rect x="260.04" y="45" width="12" height="12" fill="#946512" stroke="#946512" stroke-width="2"/><text x="280.04" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="280.04" dy="0">Solo palabra clave (password=, secret=)</tspan></text><polygon points="608.1,44.1 614.7,56.4 601.5,56.4" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="622.1" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="622.1" dy="0">Solo entropía de las cadenas largas</tspan></text><polygon points="22,67.5 29.5,75 22,82.5 14.5,75" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="36" y="80" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Patrones, y palabra clave con entropía</tspan></text><line x1="71.08" y1="431" x2="910" y2="431" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="431" x2="71.08" y2="431" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="435.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="324.333" x2="910" y2="324.333" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="324.333" x2="71.08" y2="324.333" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="328.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="217.667" x2="910" y2="217.667" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="217.667" x2="71.08" y2="217.667" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="222.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">40</tspan></text><line x1="71.08" y1="111" x2="910" y2="111" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="111" x2="71.08" y2="111" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="115.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">60</tspan></text><line x1="71.08" y1="111" x2="71.08" y2="431" stroke="#5b7280" stroke-width="1.6"/><line x1="89.08" y1="111" x2="89.08" y2="431" stroke="#d5dde1" stroke-width="1"/><line x1="89.08" y1="431" x2="89.08" y2="436" stroke="#5b7280" stroke-width="1.4"/><text x="89.08" y="452" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="89.08" dy="0">0</tspan></text><line x1="222.9" y1="111" x2="222.9" y2="431" stroke="#d5dde1" stroke-width="1"/><line x1="222.9" y1="431" x2="222.9" y2="436" stroke="#5b7280" stroke-width="1.4"/><text x="222.9" y="452" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="222.9" dy="0">10</tspan></text><line x1="356.72" y1="111" x2="356.72" y2="431" stroke="#d5dde1" stroke-width="1"/><line x1="356.72" y1="431" x2="356.72" y2="436" stroke="#5b7280" stroke-width="1.4"/><text x="356.72" y="452" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="356.72" dy="0">20</tspan></text><line x1="490.54" y1="111" x2="490.54" y2="431" stroke="#d5dde1" stroke-width="1"/><line x1="490.54" y1="431" x2="490.54" y2="436" stroke="#5b7280" stroke-width="1.4"/><text x="490.54" y="452" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="490.54" dy="0">30</tspan></text><line x1="624.36" y1="111" x2="624.36" y2="431" stroke="#d5dde1" stroke-width="1"/><line x1="624.36" y1="431" x2="624.36" y2="436" stroke="#5b7280" stroke-width="1.4"/><text x="624.36" y="452" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="624.36" dy="0">40</tspan></text><line x1="758.18" y1="111" x2="758.18" y2="431" stroke="#d5dde1" stroke-width="1"/><line x1="758.18" y1="431" x2="758.18" y2="436" stroke="#5b7280" stroke-width="1.4"/><text x="758.18" y="452" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="758.18" dy="0">50</tspan></text><line x1="892" y1="111" x2="892" y2="431" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="431" x2="892" y2="436" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="452" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">60</tspan></text><line x1="71.08" y1="431" x2="910" y2="431" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="271" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 271)">Secretos detectados (de 60)</text><text x="490.54" y="477" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="490.54" dy="0">Falsas alarmas (de 140 señuelos)</tspan></text><circle cx="410.248" cy="217.667" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="420.248" y="222.167" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="420.248" dy="0">40 · 24</tspan></text><rect x="766.062" y="222.833" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="761.562" y="232.833" font-size="13" text-anchor="end" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="761.562" dy="0">38 · 51</tspan></text><polygon points="370.102,184.675 376.152,195.95 364.052,195.95" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="360.102" y="195.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="360.102" dy="0">45 · 21</tspan></text><polygon points="410.248,104.125 417.123,111 410.248,117.875 403.373,111" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="420.248" y="115.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="420.248" dy="0">60 · 24</tspan></text><rect x="10" y="491" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="515.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Precisión y exhaustividad: patrones 62,5 % y 66,7 %; palabra clave 42,7 % y 63,3 %; entropía 68,2 % y 75,0 %; combinación</tspan></text><text x="470" y="532.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">71,4 % y 100,0 %. La combinación llega al 100 % de exhaustividad porque se escribió conociendo los formatos plantados: es</tspan></text><text x="470" y="549.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">una frontera, no una tasa de detección. Las 24 falsas alarmas son ejemplos de documentación con forma de secreto. Todas las</tspan></text><text x="470" y="565.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cadenas se generan al ejecutar; ninguna es una credencial real.</tspan></text><text x="470" y="613.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
