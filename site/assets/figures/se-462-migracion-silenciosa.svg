<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 322" width="940" height="322" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">2 000 notas guardadas como texto en SQLite: migración ingenua frente a migración con validación</title><desc id="d">Barras apiladas con el destino de los 99 valores inválidos de 2000 notas guardadas como texto: la conversión directa convierte sin error 83 a 0,0 y 16 parcialmente, sin cuarentena; la validación pone los 99 en cuarentena y migra 1901 notas válidas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="322" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">2 000 notas guardadas como texto en SQLite: migración ingenua frente a migración con validación</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Convertidos en silencio a 0,0</tspan></text><rect x="282.66" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="302.66" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="302.66" dy="0">Convertidos parcialmente en silencio</tspan></text><rect x="602.1" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="622.1" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="622.1" dy="0">En cuarentena</tspan></text><line x1="244" y1="77" x2="244" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="244" y1="157" x2="244" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="244" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="244" dy="0">0</tspan></text><line x1="370.34" y1="77" x2="370.34" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="370.34" y1="157" x2="370.34" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="370.34" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="370.34" dy="0">20</tspan></text><line x1="496.68" y1="77" x2="496.68" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="496.68" y1="157" x2="496.68" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="496.68" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="496.68" dy="0">40</tspan></text><line x1="623.02" y1="77" x2="623.02" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="623.02" y1="157" x2="623.02" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="623.02" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="623.02" dy="0">60</tspan></text><line x1="749.36" y1="77" x2="749.36" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="749.36" y1="157" x2="749.36" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="749.36" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="749.36" dy="0">80</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="157" x2="875.7" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">100</tspan></text><line x1="244" y1="157" x2="875.7" y2="157" stroke="#5b7280" stroke-width="1.6"/><text x="234" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="234" dy="0">Conversión directa con CAST</tspan></text><text x="234" y="141.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="234" dy="0">Validación y cuarentena</tspan></text><rect x="244" y="84" width="524.311" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="506.156" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="506.156" dy="0">83</tspan></text><rect x="768.311" y="84" width="101.072" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="818.847" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="818.847" dy="0">16</tspan></text><rect x="869.383" y="84" width="0" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="876.383" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="876.383" dy="0">99</tspan></text><rect x="244" y="124" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><rect x="244" y="124" width="0" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><rect x="244" y="124" width="625.383" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="556.692" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="556.692" dy="0">99</tspan></text><text x="876.383" y="141.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="876.383" dy="0">99</tspan></text><text x="559.85" y="201" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="559.85" dy="0">Valores inválidos</tspan></text><rect x="10" y="215" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="239.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">La conversión directa no falla: transforma «NP», vacíos y «5,5,0» en ceros o números parciales y deja el recuento intacto.</tspan></text><text x="470" y="256.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Una migración generada sin esta verificación pasa cualquier revisión que cuente filas. La mezcla de valores es sintética.</tspan></text><text x="470" y="304.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código estándar ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos.</tspan></text></svg>
