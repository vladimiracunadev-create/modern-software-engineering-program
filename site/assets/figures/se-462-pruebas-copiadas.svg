ecta</tspan></text><rect x="604.5" y="311.5" width="314" height="33" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="761.5" y="332.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="761.5" dy="0">lo detecta</tspan></text><rect x="287.5" y="347.5" width="314" height="33" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="444.5" y="368.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="444.5" dy="0">no lo ve</tspan></text><rect x="604.5" y="347.5" width="314" height="33" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="761.5" y="368.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="761.5" dy="0">lo detecta</tspan></text><text x="20" y="238" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 238)">Mutante</text><text x="286" y="408" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="286" dy="0">no lo ve</tspan></text><rect x="354.32" y="396" width="30.5" height="14" fill="#dff1ee"/><rect x="384.32" y="396" width="30.5" height="14" fill="#c0e1e0"/><rect x="414.32" y="396" width="30.5" height="14" fill="#a2d0d2"/><rect x="444.32" y="396" width="30.5" height="14" fill="#83c0c4"/><rect x="474.32" y="396" width="30.5" height="14" fill="#64b0b6"/><rect x="504.32" y="396" width="30.5" height="14" fill="#45a0a8"/><rect x="534.32" y="396" width="30.5" height="14" fill="#278f9a"/><rect x="564.32" y="396" width="30.5" height="14" fill="#087f8c"/><text x="602.32" y="408" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="602.32" dy="0">lo detecta</tspan></text><text x="685.72" y="408" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="685.72" dy="0">más oscuro = mayor (detección)</tspan></text><rect x="10" y="424" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="448.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Una prueba que copia la salida acepta por construcción el comportamiento actual, defectuoso o no; los casos que apuntan a</tspan></text><text x="470" y="465.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">fronteras y a diferencias entre operaciones sí lo cuestionan. Los mutantes y los casos están escritos sabiendo qué se</tspan></text><text x="470" y="482.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">busca, así que 8 de 8 es una cota optimista.</tspan></text><text x="470" y="529.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código estándar ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos.</tspan></text></svg>
