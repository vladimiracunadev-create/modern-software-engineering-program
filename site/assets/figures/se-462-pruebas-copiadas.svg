<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 547" width="940" height="547" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ocho mutantes de la función de nota final: lo que detecta cada estilo de prueba</title><desc id="d">Mapa de calor con qué estilo de prueba detecta cada uno de ocho mutantes de la nota final: copiar la salida actual en entradas típicas detecta 4 de 8 y derivar casos de la especificación con fronteras detecta 8 de 8.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="547" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Ocho mutantes de la función de nota final: lo que detecta cada estilo de prueba</tspan></text><text x="603" y="59" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="603" dy="0">¿Lo detecta el estilo de prueba?</tspan></text><text x="444.5" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="444.5" dy="0">Copiar la salida actual</tspan></text><text x="761.5" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="761.5" dy="0">Derivar de la especificación</tspan></text><text x="276" y="116.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="276" dy="0">Peso del 40 % cambiado</tspan></text><text x="276" y="152.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="276" dy="0">Umbral mayor</tspan></text><text x="276" y="188.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="276" dy="0">Sin redondeo</tspan></text><text x="276" y="224.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="276" dy="0">Redondeo a cero</tspan></text><text x="276" y="260.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="276" dy="0">Examen ignorado</tspan></text><text x="276" y="296.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="276" dy="0">Promedio con el máximo</tspan></text><text x="276" y="332.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="276" dy="0">Estado invertido</tspan></text><text x="276" y="368.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="276" dy="0">Peso del 60 % cambiado</tspan></text><rect x="287.5" y="95.5" width="314" height="33" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="444.5" y="116.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="444.5" dy="0">no lo ve</tspan></text><rect x="604.5" y="95.5" width="314" height="33" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="761.5" y="116.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="761.5" dy="0">lo detecta</tspan></text><rect x="287.5" y="131.5" width="314" height="33" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="444.5" y="152.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="444.5" dy="0">lo detecta</tspan></text><rect x="604.5" y="131.5" width="314" height="33" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="761.5" y="152.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="761.5" dy="0">lo detecta</tspan></text><rect x="287.5" y="167.5" width="314" height="33" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="444.5" y="188.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="444.5" dy="0">no lo ve</