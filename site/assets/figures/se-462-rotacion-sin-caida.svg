<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 362" width="940" height="362" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Rotar una clave entre 20 instancias (100 solicitudes por segundo, 600 s, 10 semillas)</title><desc id="d">Barras horizontales con el porcentaje de solicitudes fallidas de 60 000 según la estrategia: aceptar solo la clave nueva desde el inicio falla el 28,77 por ciento, doble validez con cierre fijo a los 360 segundos falla el 1,59 y cerrar cuando ninguna instancia usa la vieja no falla ninguna y mantiene la vieja 538 segundos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="362" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Rotar una clave entre 20 instancias (100 solicitudes por segundo, 600 s, 10 semillas)</tspan></text><line x1="364" y1="49" x2="364" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="364" y1="181" x2="364" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="364" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="364" dy="0">0</tspan></text><line x1="534.567" y1="49" x2="534.567" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="534.567" y1="181" x2="534.567" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="534.567" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="534.567" dy="0">10</tspan></text><line x1="705.133" y1="49" x2="705.133" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="705.133" y1="181" x2="705.133" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="705.133" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705.133" dy="0">20</tspan></text><line x1="875.7" y1="49" x2="875.7" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="181" x2="875.7" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">30</tspan></text><line x1="364" y1="181" x2="875.7" y2="181" stroke="#5b7280" stroke-width="1.6"/><text x="354" y="67" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="354" dy="0">Corte: el verificador solo acepta la nueva</tspan></text><text x="354" y="84" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="354" dy="0">desde el segundo 0 (0 s con la vieja)</tspan></text><text x="354" y="111" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="354" dy="0">Doble validez con cierre fijo a los 360 s (360</tspan></text><text x="354" y="128" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="354" dy="0">s)</tspan></text><text x="354" y="155" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="354" dy="0">Doble validez; se cierra cuando ninguna</tspan></text><text x="354" y="172" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="354" dy="0">instancia usa la vieja (538 s)</tspan></text><rect x="364" y="55" width="490.72" height="32" rx="3" fill="#c0432f"/><text x="861.72" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="861.72" dy="0">28,77</tspan></text><rect x="364" y="99" width="27.1201" height="32" rx="3" fill="#c0432f"/><text x="398.12" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="398.12" dy="0">1,59</tspan></text><rect x="364" y="143" width="2" height="32" rx="3" fill="#c0432f"/><text x="373" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="373" dy="0">0,00</tspan></text><text x="619.85" y="225" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="619.85" dy="0">% de solicitudes fallidas de 60 000</tspan></text><rect x="10" y="239" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="263.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Fallidas: 17 262, 956 y 0. Rotar sin caída cuesta una ventana en que dos secretos valen (los segundos entre paréntesis). En</tspan></text><text x="470" y="280.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">8 de las 10 semillas una instancia no recarga: el cierre fijo la deja fuera y el cierre condicionado la espera, es decir,</tspan></text><text x="470" y="297.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">una rotación incompleta es visible en vez de silenciosa. Los tiempos de recarga (0 a 300 s) son un supuesto del autor.</tspan></text><text x="470" y="344.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
