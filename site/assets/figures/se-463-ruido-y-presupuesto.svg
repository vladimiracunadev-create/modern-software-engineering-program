<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 542" width="940" height="542" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mismo conteo (312 estudiantes) consultado Q veces con ruido de Laplace nuevo, ε = 0,5 por consulta</title><desc id="d">Línea en doble escala logarítmica con el error medio del promedio de Q consultas repetidas con epsilon 0,5: 2,034 estudiantes con una consulta, 0,209 con 100 y 0,022 con 10 000, a costa de un presupuesto acumulado de privacidad que pasa de 0,5 a 5 000.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="542" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Mismo conteo (312 estudiantes) consultado Q veces con ruido de Laplace nuevo, ε = 0,5 por consulta</tspan></text><line x1="86.16" y1="359" x2="910" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="359" x2="86.16" y2="359" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="363.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">0,01</tspan></text><line x1="86.16" y1="259" x2="910" y2="259" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="259" x2="86.16" y2="259" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="263.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">0,1</tspan></text><line x1="86.16" y1="159" x2="910" y2="159" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="159" x2="86.16" y2="159" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="163.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">1</tspan></text><line x1="86.16" y1="59" x2="910" y2="59" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="59" x2="86.16" y2="59" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="63.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">10</tspan></text><line x1="86.16" y1="59" x2="86.16" y2="359" stroke="#5b7280" stroke-width="1.6"/><line x1="104.16" y1="59" x2="104.16" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="104.16" y1="359" x2="104.16" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="104.16" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="104.16" dy="0">1 (ε 0,5)</tspan></text><line x1="301.12" y1="59" x2="301.12" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="301.12" y1="359" x2="301.12" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="301.12" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="301.12" dy="0">10 (ε 5)</tspan></text><line x1="498.08" y1="59" x2="498.08" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="498.08" y1="359" x2="498.08" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="498.08" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="498.08" dy="0">100 (ε 50)</tspan></text><line x1="695.04" y1="59" x2="695.04" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="695.04" y1="359" x2="695.04" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="695.04" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="695.04" dy="0">1 000 (ε 500)</tspan></text><line x1="892" y1="59" x2="892" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="359" x2="892" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">10 000 (ε 5 000)</tspan></text><line x1="86.16" y1="359" x2="910" y2="359" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="209" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 209)">Error medio (estudiantes) (escala logarítmica)</text><text x="498.08" y="405" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="498.08" dy="0">Consultas repetidas (Q) y ε acumulado (escala logarítmica)</tspan></text><polyline points="104.16,128.165 301.12,171.321 498.08,226.985 695.04,270.919 892,324.758" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="104.16" cy="128.165" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="104.16" y="117.165" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="104.16" dy="0">2,034</tspan></text><circle cx="301.12" cy="171.321" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="301.12" y="160.321" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="301.12" dy="0">0,753</tspan></text><circle cx="498.08" cy="226.985" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="498.08" y="215.985" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="498.08" dy="0">0,209</tspan></text><circle cx="695.04" cy="270.919" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="695.04" y="259.919" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="695.04" dy="0">0,076</tspan></text><circle cx="892" cy="324.758" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="313.758" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">0,022</tspan></text><rect x="10" y="419" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="443.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Una sola respuesta con ruido protege y mil respuestas promediadas devuelven el valor verdadero: el ruido por consulta no es</tspan></text><text x="470" y="460.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">la garantía, el presupuesto total sí. Con una consulta el error medio vale 9,93 con ε = 0,1, 2,00 con 0,5, 0,99 con 1 y</tspan></text><text x="470" y="477.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">0,20 con 5.</tspan></text><text x="470" y="524.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
