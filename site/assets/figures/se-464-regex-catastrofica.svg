35,54</tspan></text><polyline points="111.7,379.694 267.76,356.897 423.82,354.339 579.88,353.862 735.94,352.051 892,351.621" fill="none" stroke="#087f8c" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="106.2" y="374.194" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="121.7" y="384.194" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="121.7" dy="0">0,0014</tspan></text><rect x="262.26" y="351.397" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="267.76" y="380.897" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="267.76" dy="0">0,0040</tspan></text><rect x="418.32" y="348.839" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="423.82" y="378.339" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="423.82" dy="0">0,0045</tspan></text><rect x="574.38" y="348.362" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="579.88" y="377.862" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="579.88" dy="0">0,0046</tspan></text><rect x="730.44" y="346.551" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="735.94" y="376.051" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="735.94" dy="0">0,0050</tspan></text><rect x="886.5" y="346.121" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="375.621" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">0,0051</tspan></text><rect x="10" y="447" width="920" height="92.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Dos caracteres más multiplican el tiempo por cuatro (factores entre filas: 4,5; 3,5; 4,3; 3,8; 4,1): extrapolado, 30</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">caracteres ocupan un hilo cerca de un minuto y 40, unas 17 horas. El defecto está en la expresión, no en el dato; recortar</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">la longitud a 20 es una mitigación que se rompe si el límite cambia. Lectura de reloj: en otro equipo cambian los</tspan></text><text x="470" y="521.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">milisegundos y se conserva el crecimiento.</tspan></text><text x="470" y="569.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Lectura de reloj de un equipo Windows 11 (CPython 3.12.9); en otro equipo los milisegundos cambian.</tspan></text></svg>
