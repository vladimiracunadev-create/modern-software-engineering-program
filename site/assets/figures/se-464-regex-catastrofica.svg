<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 587" width="940" height="587" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tiempo de re.match con a repetida n veces y un «!» al final: ^(a+)+$ frente a ^a+$</title><desc id="d">Líneas con escala logarítmica vertical con el tiempo de re.match con n letras a y un signo de exclamación: el patrón con cuantificadores anidados pasa de 0,88 milisegundos con 14 caracteres a 935,54 con 24, multiplicándose por unas 4 cada 2 caracteres, mientras el patrón lineal se mantiene en milésimas de milisegundo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="587" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Tiempo de re.match con a repetida n veces y un «!» al final: ^(a+)+$ frente a ^a+$</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">^(a+)+$</tspan></text><rect x="116.78" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="136.78" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="136.78" dy="0">^a+$</tspan></text><line x1="93.7" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="387" x2="93.7" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">0,001</tspan></text><line x1="93.7" y1="337" x2="910" y2="337" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="337" x2="93.7" y2="337" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="341.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">0,01</tspan></text><line x1="93.7" y1="287" x2="910" y2="287" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="287" x2="93.7" y2="287" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="291.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">0,1</tspan></text><line x1="93.7" y1="237" x2="910" y2="237" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="237" x2="93.7" y2="237" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1</tspan></text><line x1="93.7" y1="187" x2="910" y2="187" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="187" x2="93.7" y2="187" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="191.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">10</tspan></text><line x1="93.7" y1="137" x2="910" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="137" x2="93.7" y2="137" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="141.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">100</tspan></text><line x1="93.7" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="87" x2="93.7" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1 000</tspan></text><line x1="93.7" y1="87" x2="93.7" y2="387" stroke="#5b7280" stroke-width="1.6"/><line x1="111.7" y1="87" x2="111.7" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="111.7" y1="387" x2="111.7" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="111.7" y="408" font-s