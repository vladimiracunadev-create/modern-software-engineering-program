<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 219" width="940" height="219" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">300 consultas con documentos de versiones anteriores mezclados en el contexto</title><desc id="d">Barras con el porcentaje de consultas en que el primer documento recuperado es el vigente: 33,7 % sin filtrar por versión y 100,0 % filtrando.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="219" fill="#ffffff"/><text x="270" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="270" dy="0">Sin filtrar versiones</tspan></text><rect x="280" y="16" width="269.6" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="557.6" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="557.6" dy="0">33,7 %</tspan></text><text x="270" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="270" dy="0">Filtrando la versión vigente</tspan></text><rect x="280" y="60" width="800" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="1088" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="1088" dy="0">100,0 %</tspan></text><rect x="10" y="108" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="132.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los documentos antiguos comparten el vocabulario del vigente y compiten con él por la puntuación; los metadatos de versión</tspan></text><text x="470" y="149.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">resuelven lo que el texto no puede. El 100 % es por construcción, pues se supone la etiqueta de versión correcta, y en la</tspan></text><text x="470" y="166.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">práctica a menudo falta o está mal.</tspan></text><text x="470" y="205.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Proceso sintético con semilla fija; no se llamó a ningún modelo real. Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
