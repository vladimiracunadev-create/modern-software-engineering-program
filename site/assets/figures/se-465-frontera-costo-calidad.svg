<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 455" width="970" height="455" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Seis configuraciones sintéticas: éxito, costo por intento, latencia y costo por solución aceptada</title><desc id="d">Tabla con seis configuraciones de un asistente con su tasa de éxito, costo por intento, latencia, costo por solución aceptada incluyendo una revisión humana de 0,40 y si están dominadas: solo «pequeño + reintento» está dominada; el costo por solución aceptada es mínimo con «mediano + contexto» y casi igual con «grande».</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="455" fill="#ffffff"/><rect x="10" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="137" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="137" dy="0">Configuración</tspan></text><rect x="270" y="12" width="94" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="317" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="317" dy="0">Éxito</tspan></text><rect x="370" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="447" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="447" dy="0">Costo por intento</tspan></text><rect x="530" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="597" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tsp