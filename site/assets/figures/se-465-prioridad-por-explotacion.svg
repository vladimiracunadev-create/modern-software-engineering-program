<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 567" width="940" height="567" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">3 000 vulnerabilidades sintéticas (83 explotadas): cuántas se parchean y cuántas explotadas se cubren</title><desc id="d">Barras agrupadas en escala logarítmica con los parches aplicados y las explotadas cubiertas de 83: CVSS 7 o más exige 1076 parches y cubre 40, CVSS 9 o más 236 y cubre 14, parchear solo las explotadas conocidas 83 y cubre 83, y la unión con CVSS 9 o más 305 y cubre 83.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="567" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">3 000 vulnerabilidades sintéticas (83 explotadas): cuántas se parchean y cuántas explotadas se cubren</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Parches a aplicar</tspan></text><rect x="192.18" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="212.18" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="212.18" dy="0">Explotadas cubiertas (de 83)</tspan></text><line x1="101.24" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="375" x2="101.24" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">10</tspan></text><line x1="101.24" y1="281.667" x2="920" y2="281.667" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="281.667" x2="101.24" y2="281.667" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="286.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">100</tspan></text><line x1="101.24" y1="188.333" x2="920" y2="188.333" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="188.333" x2="101.24" y2="188.333" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="192.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">1 000</tspan></text><line x1="101.24" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="95" x2="101.24" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">10 000</tspan></text><line x1="101.24" y1="95" x2="101.24" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">parches o explotadas cubiertas (escala logarítmica)</text><rect x="121.709" y="185.364" width="79.876" height="189.636" rx="3" fill="#946512"/><text x="161.647" y="179.364" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="161.647" dy="0">1 076</tspan></text><rect x="205.585" y="318.808" width="79.876" height="56.1923" rx="3" fill="#087f8c"/><text x="245.523" y="312.808" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="245.523" dy="0">40</tspan></text><text x="203.585" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="203.585" dy="0">CVSS de 7 o más</tspan></text><rect x="326.399" y="246.862" width="79.876" height="128.138" rx="3" fill="#946512"/><text x="366.337" y="240.862" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="366.337" dy="0">236</tspan></text><rect x="410.275" y="361.361" width="79.876" height="13.6386" rx="3" fill="#087f8c"/><text x="450.213" y="355.361" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="450.213" dy="0">14</tspan></text><text x="408.275" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="408.275" dy="0">CVSS de 9 o más</tspan></text><rect x="531.089" y="289.219" width="79.876" height="85.7806" rx="3" fill="#946512"/><text x="571.027" y="283.219" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="571.027" dy="0">83</tspan></text><rect x="614.965" y="289.219" width="79.876" height="85.7806" rx="3" fill="#087f8c"/><text x="654.903" y="283.219" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="654.903" dy="0">83</tspan></text><text x="612.965" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612.965" dy="0">Lista de explotación</tspan></text><text x="612.965" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612.965" dy="0">conocida</tspan></text><rect x="735.779" y="236.465" width="79.876" height="138.535" rx="3" fill="#946512"/><text x="775.717" y="230.465" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="775.717" dy="0">305</tspan></text><rect x="819.655" y="289.219" width="79.876" height="85.7806" rx="3" fill="#087f8c"/><text x="859.593" y="283.219" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="859.593" dy="0">83</tspan></text><text x="817.655" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817.655" dy="0">Explotadas más CVSS de 9 o</tspan></text><text x="817.655" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817.655" dy="0">más</tspan></text><rect x="10" y="444" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="468.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Es un ejemplo de mecanismo: la gravedad describe el daño posible y la explotación observada describe la probabilidad. Aquí</tspan></text><text x="470" y="485.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">la correlación entre ambas es débil por supuesto del autor (2 % frente a 3,5 %); en el mundo real hay que medirla con</tspan></text><text x="470" y="502.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">listas como KEV y EPSS. La lista conocida solo cubre lo ya explotado.</tspan></text><text x="470" y="549.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
