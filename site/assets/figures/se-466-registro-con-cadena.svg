<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 578" width="940" height="578" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Registro de 1 000 eventos con huellas encadenadas: 100 ataques de cada tipo</title><desc id="d">Barras horizontales con los ataques detectados de 100 por tipo: una cadena de huellas detecta 100 de 100 modificaciones, borrados intermedios y reordenamientos, pero 0 de 100 truncamientos de los últimos eventos y 0 de 100 reescrituras que recalculan las huellas; con la huella final publicada fuera del sistema detecta 100 de 100 de todos los tipos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="578" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Registro de 1 000 eventos con huellas encadenadas: 100 ataques de cada tipo</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Solo la cadena</tspan></text><rect x="169.56" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="189.56" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="189.56" dy="0">Cadena y huella publicada fuera</tspan></text><line x1="354" y1="77" x2="354" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="397" x2="354" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="488.455" y1="77" x2="488.455" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="488.455" y1="397" x2="488.455" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="488.455" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="488.455" dy="0">25</tspan></text><line x1="622.91" y1="77" x2="622.91" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="622.91" y1="397" x2="622.91" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="622.91" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622.91" dy="0">50</tspan></text><line x1="757.365" y1="77" x2="757.365" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="757.365" y1="397" x2="757.365" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="757.365" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757.365" dy="0">75</tspan></text><line x1="891.82" y1="77" x2="891.82" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="891.82" y1="397" x2="891.82" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="891.82" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="891.82" dy="0">100</tspan></text><line x1="354" y1="397" x2="891.82" y2="397" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="113.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Modificar un evento</tspan></text><text x="344" y="177.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Borrar un evento intermedio</tspan></text><text x="344" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Reordenar dos eventos</tspan></text><text x="344" y="305.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Truncar los últimos 10 eventos</tspan></text><text x="344" y="361" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Reescribir desde un evento recalculando las</tspan></text><text x="344" y="378" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">huellas</tspan></text><rect x="354" y="83" width="537.82" height="24.5" rx="3" fill="#c0432f"/><text x="898.82" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="898.82" dy="0">100</tspan></text><rect x="354" y="110.5" width="537.82" height="24.5" rx="3" fill="#087f8c"/><text x="898.82" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="898.82" dy="0">100</tspan></text><rect x="354" y="147" width="537.82" height="24.5" rx="3" fill="#c0432f"/><text x="898.82" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="898.82" dy="0">100</tspan></text><rect x="354" y="174.5" width="537.82" height="24.5" rx="3" fill="#087f8c"/><text x="898.82" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="898.82" dy="0">100</tspan></text><rect x="354" y="211" width="537.82" height="24.5" rx="3" fill="#c0432f"/><text x="898.82" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="898.82" dy="0">100</tspan></text><rect x="354" y="238.5" width="537.82" height="24.5" rx="3" fill="#087f8c"/><text x="898.82" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="898.82" dy="0">100</tspan></text><rect x="354" y="275" width="2" height="24.5" rx="3" fill="#c0432f"/><text x="363" y="291.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="302.5" width="537.82" height="24.5" rx="3" fill="#087f8c"/><text x="898.82" y="319.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="898.82" dy="0">100</tspan></text><rect x="354" y="339" width="2" height="24.5" rx="3" fill="#c0432f"/><text x="363" y="355.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="366.5" width="537.82" height="24.5" rx="3" fill="#087f8c"/><text x="898.82" y="383.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="898.82" dy="0">100</tspan></text><text x="622.91" y="441" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="622.91" dy="0">ataques detectados de 100</tspan></text><rect x="10" y="455" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="479.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">La cadena detecta lo que rompe un eslabón y no lo que lo reconstruye bien: quien puede escribir puede recalcular. Hace</tspan></text><text x="470" y="496.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">falta un ancla fuera del alcance del atacante (un tercero, un sellado de tiempo, un registro de transparencia). El ancla</tspan></text><text x="470" y="513.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">debe publicarse antes del ataque; un ancla posterior no detecta nada.</tspan></text><text x="470" y="560.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
