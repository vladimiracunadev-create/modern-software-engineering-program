<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 362" width="940" height="362" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mutaciones de la ficha de un sistema de IA de alto riesgo que detecta un verificador automático</title><desc id="d">Barras con el porcentaje de mutaciones detectadas de 200 aplicadas: 100 % de los 61 campos de evidencia borrados, 100 % de los 68 casos de alto riesgo declarados como riesgo mínimo con su redacción literal y 0 % de los 71 casos declarados como riesgo mínimo redactados con otras palabras.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="362" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Mutaciones de la ficha de un sistema de IA de alto riesgo que detecta un verificador automático</tspan></text><line x1="324" y1="49" x2="324" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="181" x2="324" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="465.955" y1="49" x2="465.955" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="465.955" y1="181" x2="465.955" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="465.955" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="465.955" dy="0">25</tspan></text><line x1="607.91" y1="49" x2="607.91" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="607.91" y1="181" x2="607.91" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="607.91" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607.91" dy="0">50</tspan></text><line x1="749.865" y1="49" x2="749.865" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="749.865" y1="181" x2="749.865" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="749.865" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="749.865" dy="0">75</tspan></text><line x1="891.82" y1="49" x2="891.82" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="891.82" y1="181" x2="891.82" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="891.82" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="891.82" dy="0">100</tspan></text><line x1="324" y1="181" x2="891.82" y2="181" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="75.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Se borra un campo de evidencia (61 casos)</tspan></text><text x="314" y="111" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Alto riesgo declarado «mínimo», redacción</tspan></text><text x="314" y="128" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">literal (68)</tspan></text><text x="314" y="155" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Alto riesgo declarado «mínimo», otras</tspan></text><text x="314" y="172" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">palabras (71)</tspan></text><rect x="324" y="55" width="567.82" height="32" rx="3" fill="#087f8c"/><text x="898.82" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="898.82" dy="0">100</tspan></text><rect x="324" y="99" width="567.82" height="32" rx="3" fill="#087f8c"/><text x="898.82" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="898.82" dy="0">100</tspan></text><rect x="324" y="143" width="2" height="32" rx="3" fill="#087f8c"/><text x="333" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">0</tspan></text><text x="607.91" y="225" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="607.91" dy="0">% de las mutaciones detectadas</tspan></text><rect x="10" y="239" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="263.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Un verificador por presencia y palabras clave es exacto con lo que mira y ciego a lo demás: no ve si el campo dice algo</tspan></text><text x="470" y="280.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">útil y no reconoce el mismo caso de uso con otra redacción. Sirve como control de que la ficha no falta, no como</tspan></text><text x="470" y="297.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">clasificación de riesgo. La clasificación la decide una persona competente con el texto del reglamento.</tspan></text><text x="470" y="344.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija (scripts/experiments_part38_ext.py), 200 mutaciones; no es asesoría legal ni una evaluación de conformidad.</tspan></text></svg>
