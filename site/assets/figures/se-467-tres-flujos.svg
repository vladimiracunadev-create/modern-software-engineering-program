<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 464" width="940" height="464" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">200 tareas sintéticas en tres flujos: horas por tarea y defectos que escapan a la revisión</title><desc id="d">Intervalos horizontales con la mediana de horas por tarea y su intervalo bootstrap al 95 por ciento en tres flujos: manual 2,35 horas, asistido 1,71 y automatizado 1,33; los defectos que escapan a la revisión suben de 10 a 18 y 20.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="464" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">200 tareas sintéticas en tres flujos: horas por tarea y defectos que escapan a la revisión</tspan></text><rect x="16" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">IC 95 % inferior</tspan></text><polygon points="190.64,44.1 197.24,56.4 184.04,56.4" fill="#946512" stroke="#946512" stroke-width="2"/><text x="204.64" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="204.64" dy="0">mediana</tspan></text><polygon points="291.42,43.5 298.92,51 291.42,58.5 283.92,51" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="305.42" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="305.42" dy="0">IC 95 % superior</tspan></text><line x1="174" y1="77" x2="174" y2="299" stroke="#d5dde1" stroke-width="1"/><line x1="174" y1="299" x2="174" y2="304" stroke="#5b7280" stroke-width="1.4"/><text x="174" y="320" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="174" dy="0">0</tspan></text><line x1="412.667" y1="77" x2="412.667" y2="299" stroke="#d5dde1" stroke-width="1"/><line x1="412.667" y1="299" x2="412.667" y2="304" stroke="#5b7280" stroke-width="1.4"/><text x="412.667" y="320" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412.667" dy="0">1</tspan></text><line x1="651.333" y1="77" x2="651.333" y2="299" stroke="#d5dde1" stroke-width="1"/><line x1="651.333" y1="299" x2="651.333" y2="304" stroke="#5b7280" stroke-width="1.4"/><text x="651.333" y="320" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="651.333" dy="0">2</tspan></text><line x1="890" y1="77" x2="890" y2="299" stroke="#d5dde1" stroke-width="1"/><line x1="890" y1="299" x2="890" y2="304" stroke="#5b7280" stroke-width="1.4"/><text x="890" y="320" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="890" dy="0">3</tspan></text><line x1="174" y1="299" x2="890" y2="299" stroke="#5b7280" stroke-width="1.6"/><text x="144" y="118.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="144" dy="0">Manual</tspan></text><text x="144" y="192.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="144" dy="0">Asistido</tspan></text><text x="144" y="266.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="144" dy="0">Automatizado</tspan></text><line x1="701.453" y1="114" x2="792.147" y2="114" stroke="#8a9aa3" stroke-width="5"/><rect x="694.453" y="107" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="701.453" y="98" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="701.453" dy="0">2,21</tspan></text><polygon points="734.867,105.95 742.567,120.3 727.167,120.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="734.867" y="143" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="734.867" dy="0">2,35</tspan></text><polygon points="792.147,105.25 800.897,114 792.147,122.75 783.397,114" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="792.147" y="98" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="792.147" dy="0">2,59</tspan></text><line x1="551.093" y1="188" x2="639.4" y2="188" stroke="#8a9aa3" stroke-width="5"/><rect x="544.093" y="181" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="551.093" y="172" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="551.093" dy="0">1,58</tspan></text><polygon points="582.12,179.95 589.82,194.3 574.42,194.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="582.12" y="217" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="582.12" dy="0">1,71</tspan></text><polygon points="639.4,179.25 648.15,188 639.4,196.75 630.65,188" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="639.4" y="172" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="639.4" dy="0">1,95</tspan></text><line x1="443.693" y1="262" x2="529.613" y2="262" stroke="#8a9aa3" stroke-width="5"/><rect x="436.693" y="255" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="443.693" y="246" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="443.693" dy="0">1,13</tspan></text><polygon points="491.427,253.95 499.127,268.3 483.727,268.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="491.427" y="291" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="491.427" dy="0">1,33</tspan></text><polygon points="529.613,253.25 538.363,262 529.613,270.75 520.863,262" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="529.613" y="246" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="529.613" dy="0">1,49</tspan></text><text x="532" y="343" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="532" dy="0">Horas por tarea</tspan></text><rect x="10" y="357" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="381.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cada paso ahorra tiempo y deja escapar más defectos: no hay un flujo «mejor» sin decidir cuánto vale cada defecto. Todos</tspan></text><text x="470" y="398.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">los tiempos relativos y tasas de defecto son supuestos del autor; no se midió a ninguna persona ni herramienta.</tspan></text><text x="470" y="446.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Proceso sintético con semilla fija; no se llamó a ningún modelo real. Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
