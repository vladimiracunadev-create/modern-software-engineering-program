<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 597" width="940" height="597" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mutaciones del paquete detectadas por operador (de 15 cada una) según el validador</title><desc id="d">Mapa de calor con las mutaciones detectadas de 15 por operador según tres validadores: quitar la evidencia lo detectan los tres; existencia, fecha, alcance, justificación, dueño y duplicados el de estructura y el semántico; huellas repetidas, pruebas sin aserciones y archivos vacíos solo el semántico; la evidencia única sin relación con el requisito, ninguno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="597" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Mutaciones del paquete detectadas por operador (de 15 cada una) según el validador</tspan></text><text x="473.333" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="473.333" dy="0">Presencia</tspan></text><text x="652" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="652" dy="0">Estructura</tspan></text><text x="830.667" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="830.667" dy="0">Con heurísticas</tspan></text><text x="374" y="96.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="374" dy="0">Quitar la evidencia</tspan></text><text x="374" y="136.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="374" dy="0">Evidencia o prueba que no existe</tspan></text><text x="374" y="176.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="374" dy="0">Evidencia de 120 días; alcance de otra versión</tspan></text><text x="374" y="216.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="374" dy="0">No aplica sin justificación; excepción sin dueño</tspan></text><text x="374" y="256.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="374" dy="0">Identificador duplicado</tspan></text><text x="374" y="296.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="374" dy="0">Misma evidencia en 10 requisitos o copia de otro</tspan></text><text x="374" y="328" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="374" dy="0">Prueba sin aserciones; prueba fallida marcada</tspan></text><text x="374" y="345" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="374" dy="0">como cumple</tspan></text><text x="374" y="376.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="374" dy="0">Archivo de evidencia vacío</tspan></text><text x="374" y="408" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="374" dy="0">Evidencia única que dice «aprobado» sin ejecutar</tspan></text><text x="374" y="425" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="374" dy="0">nada</tspan></text><rect x="385.5" y="73.5" width="175.667" height="37" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="473.333" y="96.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="473.333" dy="0">15</tspan></text><rect x="564.167" y="73.5" width="175.667" height="37" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="652" y="96.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="652" dy="0">15</tspan></text><rect x="742.833" y="73.5" width="175.667" height="37" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="830.667" y="96.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="830.667" dy="0">15</tspan></text><rect x="385.5" y="113.5" width="175.667" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="473.333" y="136.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="473.333" dy="0">0</tspan></text><rect x="564.167" y="113.5" width="175.667" height="37" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="652" y="136.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="652" dy="0">15</tspan></text><rect x="742.833" y="113.5" width="175.667" height="37" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="830.667" y="136.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="830.667" dy="0">15</tspan></text><rect x="385.5" y="153.5" width="175.667" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="473.333" y="176.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="473.333" dy="0">0</tspan></text><rect x="564.167" y="153.5" width="175.667" height="37" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="652" y="176.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="652" dy="0">15</tspan></text><rect x="742.833" y="153.5" width="175.667" height="37" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="830.667" y="176.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="830.667" dy="0">15</tspan></text><rect x="385.5" y="193.5" width="175.667" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="473.333" y="216.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="473.333" dy="0">0</tspan></text><rect x="564.167" y="193.5" width="175.667" height="37" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="652" y="216.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="652" dy="0">15</tspan></text><rect x="742.833" y="193.5" width="175.667" height="37" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="830.667" y="216.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="830.667" dy="0">15</tspan></text><rect x="385.5" y="233.5" width="175.667" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="473.333" y="256.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="473.333" dy="0">0</tspan></text><rect x="564.167" y="233.5" width="175.667" height="37" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="652" y="256.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="652" dy="0">15</tspan></text><rect x="742.833" y="233.5" width="175.667" height="37" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="830.667" y="256.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="830.667" dy="0">15</tspan></text><rect x="385.5" y="273.5" width="175.667" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="473.333" y="296.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="473.333" dy="0">0</tspan></text><rect x="564.167" y="273.5" width="175.667" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="652" y="296.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="652" dy="0">0</tspan></text><rect x="742.833" y="273.5" width="175.667" height="37" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="830.667" y="296.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="830.667" dy="0">15</tspan></text><rect x="385.5" y="313.5" width="175.667" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="473.333" y="336.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="473.333" dy="0">0</tspan></text><rect x="564.167" y="313.5" width="175.667" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="652" y="336.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="652" dy="0">0</tspan></text><rect x="742.833" y="313.5" width="175.667" height="37" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="830.667" y="336.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="830.667" dy="0">15</tspan></text><rect x="385.5" y="353.5" width="175.667" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="473.333" y="376.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="473.333" dy="0">0</tspan></text><rect x="564.167" y="353.5" width="175.667" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="652" y="376.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="652" dy="0">0</tspan></text><rect x="742.833" y="353.5" width="175.667" height="37" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="830.667" y="376.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="830.667" dy="0">15</tspan></text><rect x="385.5" y="393.5" width="175.667" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="473.333" y="416.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="473.333" dy="0">0</tspan></text><rect x="564.167" y="393.5" width="175.667" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="652" y="416.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="652" dy="0">0</tspan></text><rect x="742.833" y="393.5" width="175.667" height="37" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="830.667" y="416.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="830.667" dy="0">0</tspan></text><text x="384" y="458" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="384" dy="0">0</tspan></text><rect x="399.54" y="446" width="30.5" height="14" fill="#dff1ee"/><rect x="429.54" y="446" width="30.5" height="14" fill="#c0e1e0"/><rect x="459.54" y="446" width="30.5" height="14" fill="#a2d0d2"/><rect x="489.54" y="446" width="30.5" height="14" fill="#83c0c4"/><rect x="519.54" y="446" width="30.5" height="14" fill="#64b0b6"/><rect x="549.54" y="446" width="30.5" height="14" fill="#45a0a8"/><rect x="579.54" y="446" width="30.5" height="14" fill="#278f9a"/><rect x="609.54" y="446" width="30.5" height="14" fill="#087f8c"/><text x="647.54" y="458" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="647.54" dy="0">15</tspan></text><text x="670.62" y="458" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="670.62" dy="0">más oscuro = mayor (detectadas de 15)</tspan></text><rect x="10" y="474" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="498.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cada capa añade reglas que alguien tuvo que imaginar; el mapa se llena en escalera de izquierda a derecha. La última fila</tspan></text><text x="470" y="515.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">no cae en ninguna regla porque su forma es la de una evidencia correcta. Las agrupaciones suman 14 operadores; en las filas</tspan></text><text x="470" y="532.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">con dos, cada valor es la detección de cada uno de ellos.</tspan></text><text x="470" y="579.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
