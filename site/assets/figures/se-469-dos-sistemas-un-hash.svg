<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 388" width="940" height="388" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El mismo árbol construido en Windows y en Ubuntu: la cabecera de zip delata el sistema que lo escribió</title><desc id="d">Diagrama del mismo árbol construido en Windows y en Ubuntu: con marcas de tiempo, orden y permisos normalizados pero sin fijar create_system el zip da bb3ff54418db0198 en Windows y 2d20872cfbd34c32 en Ubuntu; fijando create_system a 3 los dos dan 2d20872cfbd34c32; en un tar.gz cambia el hash según la marca de tiempo del encabezado gzip.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="388" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">El mismo árbol construido en Windows y en Ubuntu: la cabecera de zip delata el sistema que lo escribió</tspan></text><rect x="14" y="114.64" width="250" height="86.56" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="139" y="136.6" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="139" dy="0">El mismo árbol, normalizado</tspan></text><text x="139" y="153.24" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="139" dy="0">construido en Windows 11</tspan></text><text x="139" y="169.88" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="139" dy="0">(3.12.9) y en Ubuntu WSL2</tspan></text><text x="139" y="186.52" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="139" dy="0">(3.12.3)</tspan></text><rect x="334" y="49" width="592" height="69.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="630" y="70.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="630" dy="0">Sin fijar create_system: hashes distintos</tspan></text><text x="630" y="87.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="630" dy="0">Windows bb3ff54418db0198 · Ubuntu 2d20872cfbd34c32; el campo vale 0 en un</tspan></text><text x="630" y="104.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="630" dy="0">sistema y 3 en el otro</tspan></text><polyline points="264,157.92 299,157.92 299,83.96 334,83.96" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><rect x="334" y="130.92" width="592" height="54" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="630" y="153.24" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="630" dy="0">Con create_system fijado a 3: hashes idénticos</tspan></text><text x="630" y="169.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">2d20872cfbd34c32 en los dos sistemas</tspan></text><polyline points="264,157.92 299,157.92 299,157.92 334,157.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="334" y="196.92" width="592" height="69.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="630" y="218.88" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="630" dy="0">tar.gz con la marca de tiempo del encabezado gzip en 0 o en 1</tspan></text><text x="630" y="235.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="630" dy="0">el hash cambia con el valor (dea717b49614 con uno de ellos, igual en ambos</tspan></text><text x="630" y="252.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="630" dy="0">sistemas)</tspan></text><polyline points="264,157.92 299,157.92 299,231.88 334,231.88" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="280.84" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="305.8" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El campo que difería no estaba en ninguna lista de fuentes habituales; apareció al repetir el build en un segundo sistema.</tspan></text><text x="470" y="322.44" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Un build reproducible se demuestra reconstruyendo en condiciones distintas, no leyendo una lista de causas conocidas.</tspan></text><text x="470" y="370.12" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido en Windows 11 (CPython 3.12.9) y Ubuntu bajo WSL2 (3.12.3); lo que difiere entre sistemas se indica en la figura.</tspan></text></svg>
