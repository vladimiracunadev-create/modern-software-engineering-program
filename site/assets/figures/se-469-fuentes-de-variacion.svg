<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 629" width="940" height="629" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Veinte builds del mismo árbol en entornos distintos: hashes distintos según la fuente de variación que se deja sin normalizar</title><desc id="d">Barras horizontales con los hashes distintos que producen 20 builds del mismo árbol de 42 archivos según la fuente de variación sin normalizar: las marcas de tiempo, el orden, la ruta absoluta y la fecha incrustada dan 20; el orden de un diccionario 13, el usuario 5, los permisos 3 y los saltos de línea 2; con todo normalizado hay un solo hash.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="629" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Veinte builds del mismo árbol en entornos distintos: hashes distintos según la fuente de variación que se</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">deja sin normalizar</tspan></text><line x1="294" y1="68" x2="294" y2="448" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="448" x2="294" y2="453" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="469" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">0</tspan></text><line x1="445.47" y1="68" x2="445.47" y2="448" stroke="#d5dde1" stroke-width="1"/><line x1="445.47" y1="448" x2="445.47" y2="453" stroke="#5b7280" stroke-width="1.4"/><text x="445.47" y="469" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="445.47" dy="0">5</tspan></text><line x1="596.94" y1="68" x2="596.94" y2="448" stroke="#d5dde1" stroke-width="1"/><line x1="596.94" y1="448" x2="596.94" y2="453" stroke="#5b7280" stroke-width="1.4"/><text x="596.94" y="469" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="596.94" dy="0">10</tspan></text><line x1="748.41" y1="68" x2="748.41" y2="448" stroke="#d5dde1" stroke-width="1"/><line x1="748.41" y1="448" x2="748.41" y2="453" stroke="#5b7280" stroke-width="1.4"/><text x="748.41" y="469" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="748.41" dy="0">15</tspan></text><line x1="899.88" y1="68" x2="899.88" y2="448" stroke="#d5dde1" stroke-width="1"/><line x1="899.88" y1="448" x2="899.88" y2="453" stroke="#5b7280" stroke-width="1.4"/><text x="899.88" y="469" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="899.88" dy="0">20</tspan></text><line x1="294" y1="448" x2="899.88" y2="448" stroke="#5b7280" stroke-width="1.6"/><text x="284" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Marca de tiempo de cada archivo</tspan></text><text x="284" y="129.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Orden de los archivos</tspan></text><text x="284" y="167.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Ruta absoluta del build</tspan></text><text x="284" y="205.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Fecha del build incrustada</tspan></text><text x="284" y="243.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Orden de un diccionario o conjunto</tspan></text><text x="284" y="281.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Nombre de usuario o de equipo</tspan></text><text x="284" y="319.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Permisos del sistema de archivos</tspan></text><text x="284" y="357.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Saltos de línea CRLF frente a LF</tspan></text><text x="284" y="395.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Todas a la vez</tspan></text><text x="284" y="433.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Ninguna (todo normalizado)</tspan></text><rect x="294" y="74" width="605.88" height="26" rx="3" fill="#c0432f"/><text x="906.88" y="91.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="906.88" dy="0">20</tspan></text><rect x="294" y="112" width="605.88" height="26" rx="3" fill="#c0432f"/><text x="906.88" y="129.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="906.88" dy="0">20</tspan></text><rect x="294" y="150" width="605.88" height="26" rx="3" fill="#c0432f"/><text x="906.88" y="167.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="906.88" dy="0">20</tspan></text><rect x="294" y="188" width="605.88" height="26" rx="3" fill="#c0432f"/><text x="906.88" y="205.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="906.88" dy="0">20</tspan></text><rect x="294" y="226" width="393.822" height="26" rx="3" fill="#c0432f"/><text x="694.822" y="243.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="694.822" dy="0">13</tspan></text><rect x="294" y="264" width="151.47" height="26" rx="3" fill="#c0432f"/><text x="452.47" y="281.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="452.47" dy="0">5</tspan></text><rect x="294" y="302" width="90.882" height="26" rx="3" fill="#c0432f"/><text x="391.882" y="319.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="391.882" dy="0">3</tspan></text><rect x="294" y="340" width="60.588" height="26" rx="3" fill="#c0432f"/><text x="361.588" y="357.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="361.588" dy="0">2</tspan></text><rect x="294" y="378" width="605.88" height="26" rx="3" fill="#c0432f"/><text x="906.88" y="395.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="906.88" dy="0">20</tspan></text><rect x="294" y="416" width="30.294" height="26" rx="3" fill="#c0432f"/><text x="331.294" y="433.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="331.294" dy="0">1</tspan></text><text x="596.94" y="492" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="596.94" dy="0">Hashes distintos en 20 builds</tspan></text><rect x="10" y="506" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="530.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cada barra cuenta cuántos de 20 resultados distintos produce cada fuente por sí sola: con 2 o 3 entornos posibles basta ver</tspan></text><text x="470" y="547.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">pocas variantes, con 20 entornos cada uno produce su propio hash. Una fuente que casi nunca cambia (CRLF) no es inofensiva:</tspan></text><text x="470" y="564.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">aparece en la primera máquina que la cambia.</tspan></text><text x="470" y="611.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
