<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 659" width="880" height="659" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Hallazgos de un analizador de texto sobre constitución, plan y tareas con incoherencias inyectadas</title><desc id="d">Tabla con los 18 hallazgos de un analizador de texto sobre tres artefactos de un servicio de avisos: tres requisitos sin tarea, un identificador de tarea duplicado, una tarea con requisito inexistente, una tarea sin requisito, dos decisiones del plan que violan la constitución, una que cita un requisito inexistente, un conflicto numérico entre 24 y 48 horas, tres dependencias hacia tareas posteriores, un ciclo, una pareja de tareas paralelas sobre el mismo archivo y tres tareas de código antes de su prueba.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="880" height="659" fill="#ffffff"/><rect x="10" y="12" width="694" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="357" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="357" dy="0">Tipo de hallazgo</tspan></text><rect x="710" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="787" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="787" dy="0">Cuántos</tspan></text><rect x="10" y="56" width="694" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="357" y="77.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="357" dy="0">Requisito sin tarea</tspan></text><rect x="710" y="56" width="154" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="77.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">3</tspan></text><rect x="10" y="98" width="694" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="357" y="119.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="357" dy="0">Identificador de tarea duplicado</tspan></text><rect x="710" y="98" width="154" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="119.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">1</tspan></text><rect x="10" y="140" width="694" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="357" y="161.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="357" dy="0">Tarea con requisito inexistente</tspan></text><rect x="710" y="140" width="154" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">1</tspan></text><rect x="10" y="182" width="694" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="357" y="203.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="357" dy="0">Tarea sin requisito</tspan></text><rect x="710" y="182" width="154" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="203.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">1</tspan></text><rect x="10" y="224" width="694" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="357" y="245.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="357" dy="0">Plan que viola la constitución</tspan></text><rect x="710" y="224" width="154" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">2</tspan></text><rect x="10" y="266" width="694" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="357" y="287.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="357" dy="0">Plan que cita un requisito inexistente</tspan></text><rect x="710" y="266" width="154" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="287.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">1</tspan></text><rect x="10" y="308" width="694" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="357" y="329.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="357" dy="0">Conflicto numérico entre decisiones (24 frente a 48 horas)</tspan></text><rect x="710" y="308" width="154" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="329.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">1</tspan></text><rect x="10" y="350" width="694" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="357" y="371.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="357" dy="0">Dependencia de una tarea posterior</tspan></text><rect x="710" y="350" width="154" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="371.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">3</tspan></text><rect x="10" y="392" width="694" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="357" y="413.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="357" dy="0">Ciclo de dependencias</tspan></text><rect x="710" y="392" width="154" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="413.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">1</tspan></text><rect x="10" y="434" width="694" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="357" y="455.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="357" dy="0">Tareas en paralelo sobre el mismo archivo</tspan></text><rect x="710" y="434" width="154" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="455.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">1</tspan></text><rect x="10" y="476" width="694" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="357" y="497.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="357" dy="0">Código planificado antes de su prueba</tspan></text><rect x="710" y="476" width="154" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="497.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">3</tspan></text><rect x="10" y="518" width="694" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="357" y="539.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="357" dy="0">Total</tspan></text><rect x="710" y="518" width="154" height="36" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="539.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">18</tspan></text><rect x="10" y="564" width="860" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="440" y="588.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="440" dy="0">El analizador emite 18 hallazgos; 17 son incoherencias reales y uno es discutible. No ve dos problemas inyectados</tspan></text><text x="440" y="605.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="440" dy="0">que exigen entender el significado: un canal distinto entre requisito y plan y un requisito sin mecanismo.</tspan></text><text x="440" y="645.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="440" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
