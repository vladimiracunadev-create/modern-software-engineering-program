<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 547" width="940" height="547" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres conjuntos de criterios ejecutables frente a diez variantes defectuosas de la regla de avisos</title><desc id="d">Barras agrupadas con los casos y las variantes defectuosas detectadas de diez por tres conjuntos de criterios: tres casos del camino feliz detectan 3, nueve casos con bordes detectan 6 y diecisiete casos completos detectan las 10.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="547" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Tres conjuntos de criterios ejecutables frente a diez variantes defectuosas de la regla de avisos</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Casos</tspan></text><rect x="101.7" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="121.7" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="121.7" dy="0">Variantes detectadas (de 10)</tspan></text><line x1="71.08" y1="355" x2="920" y2="355" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="355" x2="71.08" y2="355" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="359.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="290" x2="920" y2="290" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="290" x2="71.08" y2="290" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="294.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">5</tspan></text><line x1="71.08" y1="225" x2="920" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="225" x2="71.08" y2="225" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="229.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="160" x2="920" y2="160" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="160" x2="71.08" y2="160" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="164.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">15</tspan></text><line x1="71.08" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="95" x2="71.08" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="95" x2="71.08" y2="355" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="225" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 225)">Casos o variantes</text><rect x="99.3773" y="316" width="111.189" height="39" rx="3" fill="#6b7c86"/><text x="154.972" y="310" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="154.972" dy="0">3</tspan></text><rect x="214.567" y="316" width="111.189" height="39" rx="3" fill="#087f8c"/><text x="270.161" y="310" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="270.161" dy="0">3</tspan></text><text x="212.567" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="212.567" dy="0">Camino feliz</tspan></text><rect x="382.351" y="238" width="111.189" height="117" rx="3" fill="#6b7c86"/><text x="437.945" y="232" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="437.945" dy="0">9</tspan></text><rect x="497.54" y="277" width="111.189" height="78" rx="3" fill="#087f8c"/><text x="553.135" y="271" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="553.135" dy="0">6</tspan></text><text x="495.54" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="495.54" dy="0">Camino feliz y bordes</tspan></text><rect x="665.324" y="134" width="111.189" height="221" rx="3" fill="#6b7c86"/><text x="720.919" y="128" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="720.919" dy="0">17</tspan></text><rect x="780.513" y="225" width="111.189" height="130" rx="3" fill="#087f8c"/><text x="836.108" y="219" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="836.108" dy="0">10</tspan></text><text x="778.513" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="778.513" dy="0">Criterios completos</tspan></text><line x1="71.08" y1="225" x2="920" y2="225" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="916" y="219" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="916" dy="0">10 variantes</tspan></text><rect x="10" y="407" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="431.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Quedan vivas con el camino feliz: ignora entregada, ignora silencio, repite, envía todos, avisa tras vencer, elige el más</tspan></text><text x="470" y="448.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">lejano y solo bloquea el idéntico; con bordes: ignora entregada, ignora silencio, envía todos y elige el más lejano. Esas</tspan></text><text x="470" y="465.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">variantes dependen de combinaciones de estado que un caso de borde de un solo valor no ejercita. Las diez variantes y los</tspan></text><text x="470" y="481.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">17 casos son del autor: el 10 de 10 es consecuencia de haberlos escrito sabiéndolo.</tspan></text><text x="470" y="529.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
