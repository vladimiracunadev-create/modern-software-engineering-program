<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 483" width="940" height="483" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Días hasta aplicar el parche de una vulnerabilidad según cómo se incorpora la dependencia (5 000 casos por fila)</title><desc id="d">Intervalos horizontales con los días hasta aplicar el parche de una vulnerabilidad: una dependencia gestionada con bloqueo tiene mediana de 2,7 días y percentil 95 de 5,0; una copia vendorizada sin dueño 15,8 y 63,1; una copia con dueño y revisión periódica 7,0 y 22,9.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="483" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Días hasta aplicar el parche de una vulnerabilidad según cómo se incorpora la dependencia (5 000 casos por</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">fila)</tspan></text><rect x="16" y="64" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">mediana</tspan></text><polygon points="122.78,63.1 129.38,75.4 116.18,75.4" fill="#946512" stroke="#946512" stroke-width="2"/><text x="136.78" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="136.78" dy="0">percentil 95</tspan></text><line x1="294" y1="96" x2="294" y2="318" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="318" x2="294" y2="323" stroke="#5b7280" stroke-widt