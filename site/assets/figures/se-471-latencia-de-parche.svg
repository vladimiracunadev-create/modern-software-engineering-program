"331.25" y2="133" stroke="#8a9aa3" stroke-width="5"/><rect x="307.115" y="126" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="314.115" y="117" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="314.115" dy="0">2,7</tspan></text><polygon points="331.25,124.95 338.95,139.3 323.55,139.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="331.25" y="162" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="331.25" dy="0">5,0</tspan></text><line x1="411.71" y1="207" x2="764.095" y2="207" stroke="#8a9aa3" stroke-width="5"/><rect x="404.71" y="200" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="411.71" y="191" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="411.71" dy="0">15,8</tspan></text><polygon points="764.095,198.95 771.795,213.3 756.395,213.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="764.095" y="236" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="764.095" dy="0">63,1</tspan></text><line x1="346.15" y1="281" x2="464.605" y2="281" stroke="#8a9aa3" stroke-width="5"/><rect x="339.15" y="274" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="346.15" y="265" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="346.15" dy="0">7,0</tspan></text><polygon points="464.605,272.95 472.305,287.3 456.905,287.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="464.605" y="310" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="464.605" dy="0">22,9</tspan></text><text x="592" y="362" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="592" dy="0">Días hasta aplicar el parche</tspan></text><rect x="10" y="376" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="400.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los tiempos son un modelo exponencial con medias fijadas por el autor, no una medición de equipos reales. Lo que muestra es</tspan></text><text x="470" y="417.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">la forma: vendorizar mueve la responsabilidad del parche a quien copió y alarga la cola cuando nadie la ejerce.</tspan></text><text x="470" y="465.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
