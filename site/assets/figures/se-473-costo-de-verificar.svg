<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 597" width="940" height="597" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Costo de hashear 64 MiB y de verificar una firma, medido en dos sistemas (una lectura, cambia entre ejecuciones)</title><desc id="d">Barras horizontales con el tiempo de hashear 64 MiB y de verificar una firma en Windows y en Ubuntu: SHA-256 168,5 y 153,3 ms; SHA-512 151,0 y 102,1; BLAKE2b 261,3 y 106,9; SHA3-256 245,7 y 184,7; verificar una firma Ed25519 con un proceso openssl 33,1 y 5,7 ms; son lecturas únicas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="597" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Costo de hashear 64 MiB y de verificar una firma, medido en dos sistemas (una lectura, cambia entre</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">ejecuciones)</tspan></text><rect x="16" y="64" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Windows 11</tspan></text><rect x="139.4" y="64" width="12" height="12" rx="2" fill="#087f8c"/><text x="159.4" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="159.4" dy="0">Ubuntu WSL2</tspan></text><line x1="294" y1="96" x2="294" y2="416" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="416" x2="294" y2="421" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="437" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">0</tspan></text><line x1="487.9" y1="96" x2="487.9" y2="416" stroke="#d5dde1" stroke-width="1"/><line x1="487.9" y1="416" x2="487.9" y2="421" stroke="#5b7280" stroke-width="1.4"/><text x="487.9" y="437" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487.9" dy="0">100</tspan></text><line x1="681.8" y1="96" x2="681.8" y2="416" stroke="#d5dde1" stroke-width="1"/><line x1="681.8" y1="416" x2="681.8" y2="421" stroke="#5b7280" stroke-width="1.4"/><text x="681.8" y="437" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="681.8" dy="0">200</tspan></text><line x1="875.7" y1="96" x2="875.7" y2="416" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="416" x2="875.7" y2="421" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="437" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">300</tspan></text><line x1="294" y1="416" x2="875.7" y2="416" stroke="#5b7280" stroke-width="1.6"/><text x="284" y="132.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">SHA-256</tspan></text><text x="284" y="196.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">SHA-512</tspan></text><text x="284" y="260.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">BLAKE2b</tspan></text><text x="284" y="324.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">SHA3-256</tspan></text><text x="284" y="380" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Verificar una firma Ed25519 con un</tspan></text><text x="284" y="397" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">proceso openssl</tspan></text><rect x="294" y="102" width="326.721" height="24.5" rx="3" fill="#c0432f"/><text x="627.721" y="118.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="627.721" dy="0">168,5</tspan></text><rect x="294" y="129.5" width="297.249" height="24.5" rx="3" fill="#087f8c"/><text x="598.249" y="146.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="598.249" dy="0">153,3</tspan></text><rect x="294" y="166" width="292.789" height="24.5" rx="3" fill="#c0432f"/><text x="593.789" y="182.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="593.789" dy="0">151,0</tspan></text><rect x="294" y="193.5" width="197.972" height="24.5" rx="3" fill="#087f8c"/><text x="498.972" y="210.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="498.972" dy="0">102,1</tspan></text><rect x="294" y="230" width="506.661" height="24.5" rx="3" fill="#c0432f"/><text x="807.661" y="246.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="807.661" dy="0">261,3</tspan></text><rect x="294" y="257.5" width="207.279" height="24.5" rx="3" fill="#087f8c"/><text x="508.279" y="274.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="508.279" dy="0">106,9</tspan></text><rect x="294" y="294" width="476.412" height="24.5" rx="3" fill="#c0432f"/><text x="777.412" y="310.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="777.412" dy="0">245,7</tspan></text><rect x="294" y="321.5" width="358.133" height="24.5" rx="3" fill="#087f8c"/><text x="659.133" y="338.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="659.133" dy="0">184,7</tspan></text><rect x="294" y="358" width="64.1809" height="24.5" rx="3" fill="#c0432f"/><text x="365.181" y="374.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="365.181" dy="0">33,1</tspan></text><rect x="294" y="385.5" width="11.0523" height="24.5" rx="3" fill="#087f8c"/><text x="312.052" y="402.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="312.052" dy="0">5,7</tspan></text><text x="584.85" y="460" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="584.85" dy="0">Tiempo (ms)</tspan></text><rect x="10" y="474" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="498.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El costo es de milisegundos frente a minutos de build: la verificación no se omite por rendimiento. Las cifras son una</tspan></text><text x="470" y="515.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">lectura de un equipo con un solo intento y cambian en cada ejecución; el 33 frente a 5,7 ms mide sobre todo el arranque del</tspan></text><text x="470" y="532.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">proceso openssl en cada sistema.</tspan></text><text x="470" y="579.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Mediciones de reloj: una lectura por barra, no reproducibles al milisegundo.</tspan></text></svg>
