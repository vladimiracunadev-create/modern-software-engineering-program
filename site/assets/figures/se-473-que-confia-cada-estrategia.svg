<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 649" width="940" height="649" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué da por bueno cada estrategia de verificación y qué no cubre</title><desc id="d">Diagrama de seis estrategias de verificación con lo que cada una da por bueno y lo que no cubre: el checksum en la misma página detecta corrupción pero no manipulación; la firma con clave de la misma página deja pasar la firma y la clave del atacante; la firma con clave fijada no cubre rollback ni confusión entre productos; el manifiesto con secuencia y la revocación no cierran el hueco entre el robo de la clave y su revocación.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="649" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué da por bueno cada estrategia de verificación y qué no cubre</tspan></text><rect x="14" y="253.76" width="250" height="70" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="139" y="284.08" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="139" dy="0">Estrategias de verificación</tspan></text><text x="139" y="300.72" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="139" dy="0">de menos a más exigentes</tspan></text><rect x="334" y="49" width="592" height="69.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="630" y="70.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="630" dy="0">1. Checksum en la misma página</tspan></text><text x="630" y="87.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="630" dy="0">confía en que la página no se alteró · no cubre manipulación: detecta</tspan></text><text x="630" y="104.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="630" dy="0">corrupción</tspan></text><polyline points="264,288.76 299,288.76 299,83.96 334,83.96" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><rect x="334" y="130.92" width="592" height="69.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="630" y="152.88" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="630" dy="0">2. Checksum por otro canal</tspan></text><text x="630" y="169.52" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="630" dy="0">confía en que el segundo canal sea independiente y anterior · no distingue un</tspan></text><text x="630" y="186.16" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="630" dy="0">release malicioso legítimo</tspan></text><polyline points="264,288.76 299,288.76 299,165.88 334,165.88" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><rect x="334" y="212.84" width="592" height="69.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="630" y="234.8" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="630" dy="0">3. Firma con clave de la misma página</tspan></text><text x="630" y="251.44" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="630" dy="0">confía en que el atacante no controle la página · firma y clave del atacante</tspan></text><text x="630" y="268.08" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="630" dy="0">pasan</tspan></text><polyline points="264,288.76 299,288.76 299,247.8 334,247.8" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="334" y="294.76" width="592" height="69.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="630" y="316.72" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="630" dy="0">4. Firma con clave fijada</tspan></text><text x="630" y="333.36" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="630" dy="0">confía en que la clave fijada sea la correcta · no cubre rollback ni confusión</tspan></text><text x="630" y="350" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="630" dy="0">entre productos</tspan></text><polyline points="264,288.76 299,288.76 299,329.72 334,329.72" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="334" y="376.68" width="592" height="69.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="630" y="398.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="630" dy="0">5. Manifiesto firmado con secuencia</tspan></text><text x="630" y="415.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">confía en que el verificador recuerde la última secuencia · no cubre clave</tspan></text><text x="630" y="431.92" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">robada ni CI comprometido</tspan></text><polyline points="264,288.76 299,288.76 299,411.64 334,411.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="334" y="458.6" width="592" height="69.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="630" y="480.56" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="630" dy="0">6. Con revocación</tspan></text><text x="630" y="497.2" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">confía en que la lista de revocación llegue a tiempo · no cubre el hueco entre</tspan></text><text x="630" y="513.84" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">el robo y la revocación</tspan></text><polyline points="264,288.76 299,288.76 299,493.56 334,493.56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="542.52" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="567.48" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cada estrategia añade una confianza y cierra un ataque: se trata de mover la confianza a un lugar más pequeño y más fácil</tspan></text><text x="470" y="584.12" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de proteger, no de eliminarla. La clave fijada es una raíz de confianza que hay que distribuir, rotar y proteger.</tspan></text><text x="470" y="631.8" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Análisis del autor a partir de la matriz medida.</tspan></text></svg>
