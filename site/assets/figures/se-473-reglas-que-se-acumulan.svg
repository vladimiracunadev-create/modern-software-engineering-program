<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 321" width="940" height="321" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reglas «permitir siempre» tras 24 semanas con 6 solicitudes semanales (500 equipos por fila)</title><desc id="d">Tabla con la acumulación de reglas de permitir siempre durante 24 semanas en 500 equipos con 6 solicitudes por semana: sin revisión la mediana es de 57 reglas, 20 amplias, y todos los equipos tienen alguna amplia; con revisión cada 12 semanas 38 reglas y 4 amplias, 98 por ciento de equipos; con revisión cada 4 semanas 13 reglas y 1 amplia, 75 por ciento de equipos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="321" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Política de revisión</tspan></text><rect x="340" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="422" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="422" dy="0">Reglas (mediana)</tspan></text><rect x="510" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="617" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="617" dy="0">Reglas amplias (mediana)</tspan></text><rect x="730" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="827" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="827" dy="0">Equipos con alguna</tspan></text><text x="827" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="827" dy="0">regla amplia</tspan></text><rect x="10" y="56" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Nunca se revisan</tspan></text><rect x="340" y="56" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">57</tspan></text><rect x="510" y="56" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="617" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">20</tspan></text><rect x="730" y="56" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">100 %</tspan></text><rect x="10" y="106" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Se revisan cada 12 semanas</tspan></text><rect x="340" y="106" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">38</tspan></text><rect x="510" y="106" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="617" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">4</tspan></text><rect x="730" y="106" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">98 %</tspan></text><rect x="10" y="156" width="324" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Se revisan cada 4 semanas</tspan></text><rect x="340" y="156" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="422" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422" dy="0">13</tspan></text><rect x="510" y="156" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="617" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">1</tspan></text><rect x="730" y="156" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">75 %</tspan></text><rect x="10" y="210" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="234.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Sin revisión se acumulan 57 reglas y todos los equipos tienen alguna amplia; revisar cada cuatro semanas mantiene el</tspan></text><text x="470" y="251.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">conjunto acotado sin eliminar el problema. El 40 % de aprobaciones permanentes y el 35 % de reglas amplias son supuestos</tspan></text><text x="470" y="268.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">del autor.</tspan></text><text x="470" y="307.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
