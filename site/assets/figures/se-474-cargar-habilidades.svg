<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 401" width="890" height="401" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuarenta habilidades y cien peticiones: selección según el estilo de descripción y costo de contexto de tres formas de cargar</title><desc id="d">Tabla con 40 habilidades y 100 peticiones: con descripciones con frases de activación la selección activa la correcta en 45 de 60 y una incorrecta en 15 sin dejar ninguna sin activar; con descripciones genéricas activa la correcta en 29, una incorrecta en 15 y no activa 16; cargar los 40 cuerpos cuesta unos 30496 tokens, las 40 descripciones 778 y las descripciones más un cuerpo 1541.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="890" height="401" fill="#ffffff"/><rect x="10" y="12" width="634" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="327" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="327" dy="0">Qué se mide</tspan></text><rect x="650" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="762" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="762" dy="0">Resultado</tspan></text><rect x="10" y="56" width="634" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="79.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Frases de activación: correcta · incorrecta · sin activar</tspan></text><rect x="650" y="56" width="224" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="79.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">45 · 15 · 0</tspan></text><rect x="10" y="102" width="634" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="125.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Descripción genérica: correcta · incorrecta · sin activar</tspan></text><rect x="650" y="102" width="224" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">29 · 15 · 16</tspan></text><rect x="10" y="148" width="634" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="171.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Cargar los 40 cuerpos al arrancar</tspan></text><rect x="650" y="148" width="224" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="171.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">30 496 tokens</tspan></text><rect x="10" y="194" width="634" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="217.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Cargar solo las 40 descripciones</tspan></text><rect x="650" y="194" width="224" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="217.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">778 tokens</tspan></text><rect x="10" y="240" width="634" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="263.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Descripciones y un cuerpo cargado (media)</tspan></text><rect x="650" y="240" width="224" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="263.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">1 541 tokens</tspan></text><rect x="10" y="290" width="870" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="445" y="314.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="445" dy="0">Una buena descripción previene la falta de activación; el solape entre habilidades, que da las 15 activaciones</tspan></text><text x="445" y="331.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="445" dy="0">incorrectas, es un defecto del conjunto. El selector es una coincidencia de palabras clave y los textos son</tspan></text><text x="445" y="348.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="445" dy="0">sintéticos.</tspan></text><text x="445" y="387.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="445" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
