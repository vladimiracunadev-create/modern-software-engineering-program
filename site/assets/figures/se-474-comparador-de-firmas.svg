<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 667" width="940" height="667" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un comparador de firmas públicas con ast frente a doce de los catorce tipos de cambio de la API de entregas</title><desc id="d">Mapa de calor con el nivel de versión correcto y el que ve un comparador de firmas públicas para doce cambios de una API: acierta 8, sobrestima uno (hacer opcional un parámetro obligatorio, que es menor y el comparador ve mayor) y subestima tres que rompen a los clientes sin cambiar la firma, que ve como parche.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="667" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un comparador de firmas públicas con ast frente a doce de los catorce tipos de cambio de la API de entregas</tspan></text><text x="648" y="59" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="648" dy="0">Nivel de versión</tspan></text><text x="512" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="512" dy="0">Nivel correcto</tspan></text><text x="784" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="784" dy="0">Lo que ve el comparador</tspan></text><text x="366" y="115.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="366" dy="0">Añadir una función pública</tspan></text><text x="366" y="149.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="366" dy="0">Quitar una función pública</tspan></text><text x="366" y="183.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="366" dy="0">Renombrar un parámetro obligatorio</tspan></text><text x="366" y="217.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="366" dy="0">Añadir un parámetro obligatorio</tspan></text><text x="366" y="251.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="366" dy="0">Añadir un parámetro opcional al final</tspan></text><text x="366" y="285.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="366" dy="0">Cambiar el valor por defecto de un parámetro</tspan></text><text x="366" y="319.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="366" dy="0">Hacer opcional un parámetro obligatorio</tspan></text><text x="366" y="353.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="366" dy="0">Quitar un método de una clase</tspan></text><text x="366" y="379" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="366" dy="0">Cambiar la escala de la nota sin tocar la</tspan></text><text x="366" y="396" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="366" dy="0">firma</tspan></text><text x="366" y="421.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="366" dy="0">Cambiar el orden por defecto del listado</tspan></text><text x="366" y="447" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="366" dy="0">Lanzar una excepción nueva ante entrada</tspan></text><text x="366" y="464" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="366" dy="0">inválida</tspan></text><text x="366" y="489.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="366" dy="0">Corregir un error sin cambiar la firma</tspan></text><rect x="377.5" y="95.5" width="269" height="31" rx="4" fill="#de9486" stroke="#ffffff" stroke-width="1"/><text x="512" y="115.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="512" dy="0">menor</tspan></text><rect x="649.5" y="95.5" width="269" height="31" rx="4" fill="#de9486" stroke="#ffffff" stroke-width="1"/><text x="784" y="115.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="784" dy="0">menor</tspan></text><rect x="377.5" y="129.5" width="269" height="31" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="512" y="149.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="512" dy="0">mayor</tspan></text><rect x="649.5" y="129.5" width="269" height="31" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="784" y="149.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="784" dy="0">mayor</tspan></text><rect x="377.5" y="163.5" width="269" height="31" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="512" y="183.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="512" dy="0">mayor</tspan></text><rect x="649.5" y="163.5" width="269" height="31" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="784" y="183.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="784" dy="0">mayor</tspan></text><rect x="377.5" y="197.5" width="269" height="31" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="512" y="217.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="512" dy="0">mayor</tspan></text><rect x="649.5" y="197.5" width="269" height="31" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="784" y="217.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="784" dy="0">mayor</tspan></text><rect x="377.5" y="231.5" width="269" height="31" rx="4" fill="#de9486" stroke="#ffffff" stroke-width="1"/><text x="512" y="251.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="512" dy="0">menor</tspan></text><rect x="649.5" y="231.5" width="269" height="31" rx="4" fill="#de9486" stroke="#ffffff" stroke-width="1"/><text x="784" y="251.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="784" dy="0">menor</tspan></text><rect x="377.5" y="265.5" width="269" height="31" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="512" y="285.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="512" dy="0">mayor</tspan></text><rect x="649.5" y="265.5" width="269" height="31" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="784" y="285.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="784" dy="0">mayor</tspan></text><rect x="377.5" y="299.5" width="269" height="31" rx="4" fill="#de9486" stroke="#ffffff" stroke-width="1"/><text x="512" y="319.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="512" dy="0">menor</tspan></text><rect x="649.5" y="299.5" width="269" height="31" rx="4" fill="#c0432f" stroke="#102a43" stroke-width="3"/><text x="784" y="319.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="784" dy="0">mayor</tspan></text><rect x="377.5" y="333.5" width="269" height="31" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="512" y="353.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="512" dy="0">mayor</tspan></text><rect x="649.5" y="333.5" width="269" height="31" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="784" y="353.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="784" dy="0">mayor</tspan></text><rect x="377.5" y="367.5" width="269" height="31" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="512" y="387.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="512" dy="0">mayor</tspan></text><rect x="649.5" y="367.5" width="269" height="31" rx="4" fill="#fbe4de" stroke="#102a43" stroke-width="3"/><text x="784" y="387.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="784" dy="0">parche</tspan></text><rect x="377.5" y="401.5" width="269" height="31" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="512" y="421.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="512" dy="0">mayor</tspan></text><rect x="649.5" y="401.5" width="269" height="31" rx="4" fill="#fbe4de" stroke="#102a43" stroke-width="3"/><text x="784" y="421.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="784" dy="0">parche</tspan></text><rect x="377.5" y="435.5" width="269" height="31" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="512" y="455.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="512" dy="0">mayor</tspan></text><rect x="649.5" y="435.5" width="269" height="31" rx="4" fill="#fbe4de" stroke="#102a43" stroke-width="3"/><text x="784" y="455.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="784" dy="0">parche</tspan></text><rect x="377.5" y="469.5" width="269" height="31" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="512" y="489.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="512" dy="0">parche</tspan></text><rect x="649.5" y="469.5" width="269" height="31" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="784" y="489.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="784" dy="0">parche</tspan></text><text x="20" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 298)">Cambio de la API</text><text x="376" y="528" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="376" dy="0">parche</tspan></text><rect x="429.24" y="516" width="30.5" height="14" fill="#fbe4de"/><rect x="459.24" y="516" width="30.5" height="14" fill="#f3cdc5"/><rect x="489.24" y="516" width="30.5" height="14" fill="#eab6ac"/><rect x="519.24" y="516" width="30.5" height="14" fill="#e29f93"/><rect x="549.24" y="516" width="30.5" height="14" fill="#d9887a"/><rect x="579.24" y="516" width="30.5" height="14" fill="#d17161"/><rect x="609.24" y="516" width="30.5" height="14" fill="#c85a48"/><rect x="639.24" y="516" width="30.5" height="14" fill="#c0432f"/><text x="677.24" y="528" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="677.24" dy="0">mayor</tspan></text><text x="722.94" y="528" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="722.94" dy="0">más oscuro = mayor (nivel)</tspan></text><rect x="10" y="544" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="568.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Acierta 10 de 14 (se omiten dos filas de acierto por espacio: añadir un método a una clase y cambiar un interno privado).</tspan></text><text x="470" y="585.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Los tres errores graves son los cambios de comportamiento: la firma es idéntica y el significado cambió, y ninguna</tspan></text><text x="470" y="602.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">herramienta que lea solo firmas puede verlos.</tspan></text><text x="470" y="649.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido en Windows 11 (CPython 3.12.9) y Ubuntu bajo WSL2 (3.12.3); lo que difiere entre sistemas se indica en la figura.</tspan></text></svg>
