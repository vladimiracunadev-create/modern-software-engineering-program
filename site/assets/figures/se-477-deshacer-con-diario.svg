<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 405" width="890" height="405" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Sesenta acciones de un generador con semilla sobre 40 archivos y su deshacer con un diario por acción</title><desc id="d">Tabla con 60 acciones de un generador con semilla sobre 40 archivos en un directorio temporal: tras ejecutarlas el directorio cambió; al deshacer en orden inverso con un diario por acción el estado coincide con el inicial; el diario ocupa 2216 bytes, el 85 por ciento del espacio de trabajo; las 5 acciones de enviar correo no se pueden deshacer con el diario.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="890" height="405" fill="#ffffff"/><rect x="10" y="12" width="464" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="242" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="242" dy="0">Medida</tspan></text><rect x="480" y="12" width="394" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="677" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="677" dy="0">Resultado</tspan></text><rect x="10" y="56" width="464" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Acciones ejecutadas</tspan></text><rect x="480" y="56" width="394" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="677" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="677" dy="0">60 (55 sobre archivos y 5 correos simulados)</tspan></text><rect x="10" y="106" width="464" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">El directorio cambió tras las 60 acciones</tspan></text><rect x="480" y="106" width="394" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="677" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="677" dy="0">sí</tspan></text><rect x="10" y="156" width="464" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Estado tras deshacer idéntico al inicial</tspan></text><rect x="480" y="156" width="394" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="677" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="677" dy="0">sí</tspan></text><rect x="10" y="206" width="464" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Tamaño del diario</tspan></text><rect x="480" y="206" width="394" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="677" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="677" dy="0">2 216 bytes (85 % del espacio)</tspan></text><rect x="10" y="256" width="464" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Acciones que el diario no puede deshacer</tspan></text><rect x="480" y="256" width="394" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="677" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="677" dy="0">5 de 60 (los correos)</tspan></text><rect x="10" y="310" width="870" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="445" y="334.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="445" dy="0">El diario restaura el estado de los archivos y no lo que sale del sistema. Son archivos pequeños, sin enlaces</tspan></text><text x="445" y="351.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="445" dy="0">simbólicos, permisos especiales ni caídas a mitad de acción.</tspan></text><text x="445" y="391.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="445" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
