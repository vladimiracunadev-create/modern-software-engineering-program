/><text x="942" y="191.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="942" dy="0">0 de 160</tspan></text><rect x="10" y="218" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="245.36" font-size="12" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">+ patrón amplio (paráfrasis)</tspan></text><rect x="340" y="218" width="84" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="382" y="245.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="382" dy="0">8 de 8</tspan></text><rect x="430" y="218" width="124" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="492" y="245.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">8 de 8</tspan></text><rect x="560" y="218" width="104" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="612" y="245.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612" dy="0">8 de 8</tspan></text><rect x="670" y="218" width="104" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="245.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">8 de 8</tspan></text><rect x="780" y="218" width="94" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="245.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">8 de 8</tspan></text><rect x="880" y="218" width="124" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="942" y="245.36" font-size="12" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="942" dy="0">19 de 160</tspan></text><rect x="10" y="276" width="1000" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="510" y="300.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="510" dy="0">Cada forma que se cierra añade ingeniería o falsas alarmas: el patrón amplio marca 19 de 160 inocuos. El 100 % es consecuencia de un</tspan></text><text x="510" y="317.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="510" dy="0">conjunto de pruebas escrito conociendo las cinco formas; no se midió ningún modelo.</tspan></text><text x="510" y="357.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="510" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
