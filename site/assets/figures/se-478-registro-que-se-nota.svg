<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 405" width="950" height="405" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cinco manipulaciones de un registro de auditoría de 500 eventos: fracción detectada por esquema (200 ensayos cada una)</title><desc id="d">Tabla con cinco manipulaciones de un registro de auditoría de 500 eventos en 200 ensayos cada una: un registro simple detecta 0 por ciento en todas; una cadena de huellas detecta 100 por ciento de editar, borrar e intercambiar eventos y 0 por ciento de cortar los últimos 20 o reescribir y recalcular; con la huella final guardada aparte se detectan las cinco al 100 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="405" fill="#ffffff"/><rect x="10" y="12" width="434" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="227" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="227" dy="0">Manipulación</tspan></text><rect x="450" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="522" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="522" dy="0">Registro simple</tspan></text><rect x="600" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="682" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="682" dy="0">Cadena de huellas</tspan></text><rect x="770" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="852" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="852" dy="0">Cadena y huella</tspan></text><text x="852" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="852" dy="0">final aparte</tspan></text><rect x="10" y="56" width="434" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">Editar un evento</tspan></text><rect x="450" y="56" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="522" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="522" dy="0">0 %</tspan></text><rect x="600" y="56" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">100 %</tspan></text><rect x="770" y="56" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">100 %</tspan></text><rect x="10" y="106" width="434" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">Borrar un evento</tspan></text><rect x="450" y="106" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="522" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="522" dy="0">0 %</tspan></text><rect x="600" y="106" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">100 %</tspan></text><rect x="770" y="106" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">100 %</tspan></text><rect x="10" y="156" width="434" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">Intercambiar dos eventos</tspan></text><rect x="450" y="156" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="522" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="522" dy="0">0 %</tspan></text><rect x="600" y="156" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">100 %</tspan></text><rect x="770" y="156" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">100 %</tspan></text><rect x="10" y="206" width="434" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">Cortar los últimos 20 eventos</tspan></text><rect x="450" y="206" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="522" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="522" dy="0">0 %</tspan></text><rect x="600" y="206" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">0 %</tspan></text><rect x="770" y="206" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">100 %</tspan></text><rect x="10" y="256" width="434" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">Reescribir desde un punto y recalcular la cadena</tspan></text><rect x="450" y="256" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="522" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="522" dy="0">0 %</tspan></text><rect x="600" y="256" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">0 %</tspan></text><rect x="770" y="256" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">100 %</tspan></text><rect x="10" y="310" width="930" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="475" y="334.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">La integridad de un registro es una propiedad de quién controla la referencia: quien puede reescribir la cadena entera</tspan></text><text x="475" y="351.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">produce una cadena válida. Un atacante que controle también la referencia no sería detectado.</tspan></text><text x="475" y="391.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
